ed to its displayed verse.\n const watch=new MutationObserver(()=>{\n   const h=opened.querySelector('h3');if(!h)return;\n   const ref=h.textContent.trim();if(!/^\\d{1,3}:\\d{1,3}$/.test(ref)||opened.querySelector('.ri-go-to-verse'))return;\n   const btn=document.createElement('button');btn.type='button';btn.className='ri-go-to-verse';btn.dataset.ref=ref;btn.textContent='Dža ko ajeti →';\n   h.insertAdjacentElement('afterend',btn);\n });\n watch.observe(opened,{childList:true});\n back.addEventListener('click',()=>{\n   const saved=origin;if(!saved)return;\n   back.classList.remove('ri-shown');origin=null;\n   if(location.hash!=='#'+saved.mode)location.hash=saved.mode;\n   if(!selectVerse(saved.mode,saved.sura,saved.ayah))return;\n   afterRender(()=>{\n     const parent=get(saved.mode==='romane'?'romaneBody':'readerBody');\n     if(parent)parent.scrollTop=saved.scroll;\n     window.scrollTo({top:saved.windowScroll,behavior:'instant'});\n     if(saved.key&&saved.part){\n       const mark=[...get(saved.mode==='romane'?'romaneVerses':'readerVerses').querySelectorAll('.ri-footnote')]\n         .find(el=>el.closest('article.verse')?.id===saved.mode+'-'+saved.key.replace(':','-')&&el.textContent.trim()===String(saved.part));\n       if(mark){mark.click();afterRender(()=>{\n         const tile=[...modal.querySelectorAll('.ri-ref-tile')].find(el=>el.dataset.ref===saved.selected);\n         if(tile)tile.click();\n         const panel=modal.querySelector('.ri-fatiha-panel');if(panel)panel.scrollTop=saved.panelScroll;\n       });}\n     }\n   });\n });\n})();\n\u003c/script>\n\n\u003cscript id=\"ri-original-route-bridge\">window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='ri-original-route'||typeof e.data.route!=='string')return;const page=document.getElementById(e.data.route);if(page&&page.classList.contains('page'))location.hash=e.data.route;});\u003c/script>\u003c/body>\u003c/html>", "root": "../../", "portal": true, "extra": false}</script>
