postojanje i njima upravljao, te da je neke vrste Svojih stvorenja stvorio prije stvaranja vremena i vremenskih razdoblja, prije stvaranja Sunca i Mjeseca, koje pokreće njihovim putanjama i pomoću kojih su se upoznavali vremenski odsječci i sati, određivali datumi i razlikovali noć i dan, govorimo sada o tome: šta je to stvoreno prije toga i šta je od toga bilo prvo?","ar_ranges":[],"ar_html":"فَإِذَا كَانَ مَعْلُومًا أَنَّ خَالِقَ الأَشْيَاءِ وَبَارِئَهَا كَانَ وَلا شَيْءَ غَيْرَهُ، وَأَنَّهُ أَحْدَثَ الأَشْيَاءَ فَدَبَّرَهَا، وَأَنَّهُ قَدْ خَلَقَ صُنُوفًا مِنْ خَلْقِهِ قَبْلَ خَلْقِ الأَزْمِنَةِ وَالأَوْقَاتِ، وَقَبْلَ خَلْقِ الشَّمْسِ وَالْقَمَرِ اللَّذَيْنِ يُجْرِيهِمَا فِي أَفْلاكِهِمَا، وَبِهِمَا عُرِفَتِ الأَوْقَاتِ وَالسَّاعَاتِ، وَأُرِّخَتِ التَّأْرِيخَاتِ، وَفُصِلَ بين الليل والنهار، فلنقل: فيم ذَلِكَ الْخَلْقُ الَّذِي خُلِقَ قَبْلَ ذَلِكَ؟ وَمَا كان اوله؟","bs_ranges":[],"bs_html":"Budući da je poznato da je Stvoritelj i Tvorac svega postojao kada nije bilo ničega osim Njega, da je On stvari doveo u postojanje i njima upravljao, te da je neke vrste Svojih stvorenja stvorio prije stvaranja vremena i vremenskih razdoblja, prije stvaranja Sunca i Mjeseca, koje pokreće njihovim putanjama i pomoću kojih su se upoznavali vremenski odsječci i sati, određivali datumi i razlikovali noć i dan, govorimo sada o tome: šta je to stvoreno prije toga i šta je od toga bilo prvo?"}],"notes":[]},{"n":32,"ar":"القول في ابتداء الخلق ما كان أوله\n\nصح الخبر عن رسول الله ص بِمَا حَدَّثَنِي بِهِ يُونُسُ بْنُ عَبْدِ الأَعْلَى، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: حَدَّثَنِي مُعَاوِيَةُ بْنُ صَالِحٍ- وحدثني عُبَيْدُ بْنُ آدَمَ بْنِ أَبِي إِيَاسٍ الْعَسْقَلانِيُّ، قَالَ: حَدَّثَنَا أَبِي، قَالَ:\nحَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ مُعَاوِيَةَ بْنِ صَالِحٍ- عَنْ أَيُّوبَ بْنِ زِيَادٍ، قَالَ:\n\nحَدَّثَنِي عُبَادَةُ بْنُ الْوَلِيدِ بْنِ عُبَادَةَ بْنِ الصَّامِتِ، قَالَ: أَخْبَرَنِي أَبِي، قَالَ:\n\nقَالَ أَبِي عُبَادَةُ بْنُ الصَّامِتِ: [يَا بُنَيَّ سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ:\n\nإِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ الْقَلَمُ فَقَالَ لَهُ: اكْتُبْ، فَجَرَى فِي تِلْكَ السَّاعَةِ بِمَا هُوَ كَائِنٌ] .\n\nحَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدِ بْنِ حَبِيبٍ، قَالَ: حَدَّثَنَا عَلِيُّ بْنُ الْحَسَنِ بْنِ شَقِيقٍ، قَالَ: أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ، قَالَ: أَخْبَرَنَا رَبَاحُ بْنُ زَيْدٍ، عَنْ عُمَرَ بْنِ حَبِيبٍ، عَنِ الْقَاسِمِ بْنِ أَبِي بَزَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ [ابْنِ عَبَّاسٍ أَنَّهُ كَانَ يُحَدِّثُ أَنَّ رَسُولَ اللَّهِ ص قَالَ: إِنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ الْقَلَمَ، وَأَمَرَهُ أَنْ يَكْتُبَ كُلَّ شَيْءٍ] .\n\nحَدَّثَنِي مُوسَى بْنُ سَهْلٍ الرَّمْلِيُّ، حَدَّثَنَا نُعَيْمُ بْنُ حَمَّادٍ، حَدَّثَنَا ابْنُ الْمُبَارَكِ، أَخْبَرَنَا رَبَاحُ بْنُ زَيْدٍ، عَنْ عُمَرَ بْنِ حَبِيبٍ، عَنِ الْقَاسِمِ بْنِ أَبِي بَزَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، عن رسول الله ص بِنَحْوِهِ.\n\nحَدَّثَنِي مُحَمَّدُ بْنُ مُعَاوِيَةَ الأَنْمَاطِيُّ، حَدَّثَنَا عَبَّادُ بْنُ الْعَوَّامِ، حَدَّثَنَا عَبْدُ الْوَاحِدِ بْنُ سُلَيْمٍ، قَالَ: سَمِعْتُ عَطَاءً، قَالَ: سَأَلْتُ الْوَلِيدَ بْنَ عُبَادَةَ بْنِ الصَّامِتِ: كَيْفَ كَانَتْ وَصِيَّةُ أَبِيكَ حِينَ حَضَرَهُ الْمَوْتُ؟ قَالَ: دَعَانِي فَقَالَ:","bs":"\u003cp data-paragraph=\"32.1\">Rasprava o početku stvaranja: šta je prvo stvoreno?\u003c/p>\u003cp data-paragraph=\"32.2\">Vjerodostojno je prenesena vijest od Allahovog Poslanika, sallallahu alejhi ve sellem, u onome što mi je pričao Junus ibn Abdula‘la: rekao je: obavijestio nas je Ibn Vehb: rekao je: pričao mi je Muavija ibn Salih — a pričao mi je i Ubejd ibn Adem ibn Ebu Ijas el-Askalani: rekao je: pričao nam je moj otac: rekao je: pričao nam je Lejs ibn Sa‘d, od Muavije ibn Saliha — od Ejjuba ibn Zijada, koji je rekao: pričao mi je Ubada ibn el-Velid ibn Ubada ibn es-Samit: rekao je: obavijestio me moj otac: moj otac Ubada ibn es-Samit rekao je: „Sine moj, čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže: ‘Prvo što je Allah stvorio bilo je pero. Rekao mu je: Piši! I ono je u tom času ispisalo ono što će biti.’“\u003c/p>\u003cp data-paragraph=\"32.3\">Pričao mi je Ahmed ibn Muhammed ibn Habib: rekao je: pričao nam je Ali ibn el-Hasen ibn Šekik: rekao je: obavijestio nas je Abdullah ibn el-Mubarek: rekao je: obavijestio nas je Rebah ibn Zejd, od Omera ibn Habiba, od Kasima ibn Ebu Bezze, od Seida ibn Džubejra, od Ibn Abbasa, koji je kazivao da je Allahov Poslanik, sallallahu alejhi ve sellem, rekao: „Prvo što je Allah stvorio bilo je pero i naredio mu je da zapiše sve.“\u003c/p>\u003cp data-paragraph=\"32.4\">Pričao mi je Musa ibn Sehl er-Remli: pričao nam je Nuajm ibn Hammad: pričao nam je Ibn el-Mubarek: obavijestio nas je Rebah ibn Zejd, od Omera ibn Habiba, od Kasima ibn Ebu Bezze, od Seida ibn Džubejra, od Ibn Abbasa, od Allahovog Poslanika, sallallahu alejhi ve sellem, nešto slično tome.\u003c/p>\u003cp data-paragraph=\"32.5\">Pričao mi je Muhammed ibn Muavija el-Enmati: pričao nam je Abbad ibn el-Avvam: pričao nam je Abdulvahid ibn Sulejm, koji je rekao: čuo sam Ataa kako kaže: „Upitao sam Velida ibn Ubadu ibn es-Samita: ‘Kakva je bila oporuka tvoga oca kada mu se približila smrt?’ Odgovorio je: ‘Pozvao me i rekao:\u003c/p>","paragraphs":[{"id":"32.1","ar":"القول في ابتداء الخلق ما كان أوله","bs":"Rasprava o početku stvaranja: šta je prvo stvoreno?","ar_ranges":[],"ar_html":"القول في ابتداء الخلق ما كان أوله","bs_ranges":[],"bs_html":"Rasprava o početku stvaranja: šta je prvo stvoreno?"},{"id":"32.2","ar":"صح الخبر عن رسول الله ص بِمَا حَدَّثَنِي بِهِ يُونُسُ بْنُ عَبْدِ الأَعْلَى، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: حَدَّثَنِي مُعَاوِيَةُ بْنُ صَالِحٍ- وحدثني عُبَيْدُ بْنُ آدَمَ بْنِ أَبِي إِيَاسٍ الْعَسْقَلانِيُّ، قَالَ: حَدَّثَنَا أَبِي، قَالَ:\nحَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ مُعَاوِيَةَ بْنِ صَالِحٍ- عَنْ أَيُّوبَ بْنِ زِيَادٍ، قَالَ:\n\nحَدَّثَنِي عُبَادَةُ بْنُ الْوَلِيدِ بْنِ عُبَادَةَ بْنِ الصَّامِتِ، قَالَ: أَخْبَرَنِي أَبِي، قَالَ:\n\nقَالَ أَبِي عُبَادَةُ بْنُ الصَّامِتِ: [يَا بُنَيَّ سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ:\n\nإِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ الْقَلَمُ فَقَالَ لَهُ: اكْتُبْ، فَجَرَى فِي تِلْكَ السَّاعَةِ بِمَا هُوَ كَائِنٌ] .","bs":"Vjerodostojno je prenesena vijest od Allahovog Poslanika, sallallahu alejhi ve sellem, u onome što mi je pričao Junus ibn Abdula‘la: rekao je: obavijestio nas je Ibn Vehb: rekao je: pričao mi je Muavija ibn Salih — a pričao mi je i Ubejd ibn Adem ibn Ebu Ijas el-Askalani: rekao je: pričao nam je moj otac: rekao je: pričao nam je Lejs ibn Sa‘d, od Muavije ibn Saliha — od Ejjuba ibn Zijada, koji je rekao: pričao mi je Ubada ibn el-Velid ibn Ubada ibn es-Samit: rekao je: obavijestio me moj otac: moj otac Ubada ibn es-Samit rekao je: „Sine moj, čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže: ‘Prvo što je Allah stvorio bilo je pero. Rekao mu je: Piši! I ono je u tom času ispisalo ono što će biti.’“","ar_ranges":[[30,493]],"ar_html":"صح الخبر عن رسول الله ص بِمَا \u003cspan class=\"isnad\">حَدَّثَنِي بِهِ يُونُسُ بْنُ عَبْدِ الأَعْلَى، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: حَدَّثَنِي مُعَاوِيَةُ بْنُ صَالِحٍ- وحدثني عُبَيْدُ بْنُ آدَمَ بْنِ أَبِي إِيَاسٍ الْعَسْقَلانِيُّ، قَالَ: حَدَّثَنَا أَبِي، قَالَ:\nحَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ مُعَاوِيَةَ بْنِ صَالِحٍ- عَنْ أَيُّوبَ بْنِ زِيَادٍ، قَالَ:\n\nحَدَّثَنِي عُبَادَةُ بْنُ الْوَلِيدِ بْنِ عُبَادَةَ بْنِ الصَّامِتِ، قَالَ: أَخْبَرَنِي أَبِي، قَالَ:\n\nقَالَ أَبِي عُبَادَةُ بْنُ الصَّامِتِ: \u003c/span>[يَا بُنَيَّ سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ:\n\nإِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ الْقَلَمُ فَقَالَ لَهُ: اكْتُبْ، فَجَرَى فِي تِلْكَ السَّاعَةِ بِمَا هُوَ كَائِنٌ] .","bs_ranges":[[99,498]],"bs_html":"Vjerodostojno je prenesena vijest od Allahovog Poslanika, sallallahu alejhi ve sellem, u onome što \u003cspan class=\"isnad\">mi je pričao Junus ibn Abdula‘la: rekao je: obavijestio nas je Ibn Vehb: rekao je: pričao mi je Muavija ibn Salih — a pričao mi je i Ubejd ibn Adem ibn Ebu Ijas el-Askalani: rekao je: pričao nam je moj otac: rekao je: pričao nam je Lejs ib stio nas je Abdullah ibn el-Mubarek: rekao je: obavijestio nas je Rebah ibn Zejd, od Omera ibn Habiba, od Kasima ibn Ebu Bezze, od Seida ibn Džubejra, od Ibn Abbasa, koji je kazivao \u003c/span>da je Allahov Poslanik, sallallahu alejhi ve sellem, rekao: „Prvo što je Allah stvorio bilo je pero i naredio mu je da zapiše sve.“"},{"id":"32.4","ar":"حَدَّثَنِي مُوسَى بْنُ سَهْلٍ الرَّمْلِيُّ، حَدَّثَنَا نُعَيْمُ بْنُ حَمَّادٍ، حَدَّثَنَا ابْنُ الْمُبَارَكِ، أَخْبَرَنَا رَبَاحُ بْنُ زَيْدٍ، عَنْ عُمَرَ بْنِ حَبِيبٍ، عَنِ الْقَاسِمِ بْنِ أَبِي بَزَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، عن رسول الله ص بِنَحْوِهِ.","bs":"Pričao mi je Musa ibn Sehl er-Remli: pričao nam je Nuajm ibn Hammad: pričao nam je Ibn el-Mubarek: obavijestio nas je Rebah ibn Zejd, od Omera ibn Habiba, od Kasima ibn Ebu Bezze, od Seida ibn Džubejra, od Ibn Abbasa, od Allahovog Poslanika, sallallahu alejhi ve sellem, nešto slično tome.","ar_ranges":[[0,280]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بْنُ سَهْلٍ الرَّمْلِيُّ، حَدَّثَنَا نُعَيْمُ بْنُ حَمَّادٍ، حَدَّثَنَا ابْنُ الْمُبَارَكِ، أَخْبَرَنَا رَبَاحُ بْنُ زَيْدٍ، عَنْ عُمَرَ بْنِ حَبِيبٍ، عَنِ الْقَاسِمِ بْنِ أَبِي بَزَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، عن رسول الله ص بِنَحْوِهِ.\u003c/span>","bs_ranges":[[0,271]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musa ibn Sehl er-Remli: pričao nam je Nuajm ibn Hammad: pričao nam je Ibn el-Mubarek: obavijestio nas je Rebah ibn Zejd, od Omera ibn Habiba, od Kasima ibn Ebu Bezze, od Seida ibn Džubejra, od Ibn Abbasa, od Allahovog Poslanika, sallallahu alejhi ve sellem, \u003c/span>nešto slično tome."},{"id":"32.5","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ مُعَاوِيَةَ الأَنْمَاطِيُّ، حَدَّثَنَا عَبَّادُ بْنُ الْعَوَّامِ، حَدَّثَنَا عَبْدُ الْوَاحِدِ بْنُ سُلَيْمٍ، قَالَ: سَمِعْتُ عَطَاءً، قَالَ: سَأَلْتُ الْوَلِيدَ بْنَ عُبَادَةَ بْنِ الصَّامِتِ: كَيْفَ كَانَتْ وَصِيَّةُ أَبِيكَ حِينَ حَضَرَهُ الْمَوْتُ؟ قَالَ: دَعَانِي فَقَالَ:","bs":"Pričao mi je Muhammed ibn Muavija el-Enmati: pričao nam je Abbad ibn el-Avvam: pričao nam je Abdulvahid ibn Sulejm, koji je rekao: čuo sam Ataa kako kaže: „Upitao sam Velida ibn Ubadu ibn es-Samita: ‘Kakva je bila oporuka tvoga oca kada mu se približila smrt?’ Odgovorio je: ‘Pozvao me i rekao:","ar_ranges":[[0,168]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ مُعَاوِيَةَ الأَنْمَاطِيُّ، حَدَّثَنَا عَبَّادُ بْنُ الْعَوَّامِ، حَدَّثَنَا عَبْدُ الْوَاحِدِ بْنُ سُلَيْمٍ، قَالَ: سَمِعْتُ عَطَاءً، قَالَ: \u003c/span>سَأَلْتُ الْوَلِيدَ بْنَ عُبَادَةَ بْنِ الصَّامِتِ: كَيْفَ كَانَتْ وَصِيَّةُ أَبِيكَ حِينَ حَضَرَهُ الْمَوْتُ؟ قَالَ: دَعَانِي فَقَالَ:","bs_ranges":[[0,155]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Muavija el-Enmati: pričao nam je Abbad ibn el-Avvam: pričao nam je Abdulvahid ibn Sulejm, koji je rekao: čuo sam Ataa kako kaže: \u003c/span>„Upitao sam Velida ibn Ubadu ibn es-Samita: ‘Kakva je bila oporuka tvoga oca kada mu se približila smrt?’ Odgovorio je: ‘Pozvao me i rekao:"}],"notes":[]},{"n":33,"ar":"أَيْ بُنَيَّ، اتَّقِ اللَّهَ وَاعْلَمْ أَنَّكَ لَنْ تَتَّقِيَ اللَّهَ، وَلَنْ تَبْلُغَ الْعِلْمَ حَتَّى تُؤْمِنَ بِاللَّهِ وَحْدَهُ، وَالْقَدَرِ خَيْرِهِ وَشَرِّهِ، [إِنِّي سَمِعْتُ رسول الله ص يَقُولُ: إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ عَزَّ وَجَلَّ خَلَقَ الْقَلَمَ، فَقَالَ لَهُ: اكْتُبْ، قَالَ: يَا رَبِّ وَمَا أَكْتُبُ؟ قَالَ:\n\nاكْتُبِ الْقَدَرَ، قَالَ: فَجَرَى الْقَلَمُ فِي تِلْكَ السَّاعَةِ بِمَا كَانَ وَبِمَا هُوَ كَائِنٌ إِلَى الأَبَدِ] .\n\nوقد اختلف اهل السلف قبلنا في ذلك، فنذكر أقوالهم، ثم نتبع البيان عن ذلك إن شاء الله تعالى.\n\nفقال بعضهم في ذلك بنحو الذي روى عن رسول الله ص فيه.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنِي وَاصِلُ بْنُ عَبْدِ الأَعْلَى الأَسَدِيُّ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ مِنْ شَيْءٍ الْقَلَمُ فَقَالَ لَهُ: اكْتُبْ، فَقَالَ: وَمَا أَكْتُبُ يَا رَبِّ؟ قَالَ: اكْتُبِ الْقَدَرَ، قَالَ: فَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ مِنْ ذَلِكَ إِلَى قِيَامِ السَّاعَةِ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ فَفَتَقَ مِنْهُ السَّمَوَاتِ.\n\nحَدَّثَنَا وَاصِلُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا وَكِيعٌ، عَنِ الأعمش، عن أبي ظبيان، عن ابن عباس نَحْوَهُ.\n\nحَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، عَنْ شُعْبَةَ، عَنْ سُلَيْمَانَ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ مِنْ شَيْءٍ الْقَلَمُ، فَجَرَى بِمَا هُوَ كَائِنٌ.\n\nحَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، أَخْبَرَنَا إِسْحَاقُ، عَنْ شَرِيكٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ- أَوْ مُجَاهِدٌ-، عَنِ ابْنِ عباس بنحوه","bs":"\u003cp data-paragraph=\"33.1\">O sine moj, boj se Allaha i znaj da se nećeš bojati Allaha i da nećeš dosegnuti znanje dok ne budeš vjerovao samo u Allaha i u određenje, njegovo dobro i njegovo zlo. Čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže: Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero. Rekao mu je: Piši! Ono je reklo: Gospodaru moj, a šta da pišem? Rekao je: Zapiši određenje! I pero je u tom času ispisalo ono što je bilo i ono što će biti dovijeka.’“\u003c/p>\u003cp data-paragraph=\"33.2\">Naši prethodnici nisu bili saglasni o tome. Navest ćemo njihova mišljenja, a zatim, ako Uzvišeni Allah htjedne, izložiti objašnjenje o tome.\u003c/p>\u003cp data-paragraph=\"33.3\">Neki su o tome rekli nešto slično onome što je preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem.\u003c/p>\u003cp data-paragraph=\"33.4\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"33.5\">Pričao mi je Vasil ibn Abdula‘la el-Esedi: rekao je: pričao nam je Muhammed ibn Fudajl, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: „Prvo što je Allah stvorio bilo je pero. Rekao mu je: ‘Piši!’ Ono je reklo: ‘A šta da pišem, Gospodaru moj?’ Rekao je: ‘Zapiši određenje!’ I pero je ispisalo ono što će biti od tada do nastupanja Časa. Zatim je podigao vodenu paru i iz nje razdvojio nebesa.“\u003c/p>\u003cp data-paragraph=\"33.6\">Pričao nam je Vasil ibn Abdula‘la: rekao je: pričao nam je Veki‘, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, nešto slično tome.\u003c/p>\u003cp data-paragraph=\"33.7\">Pričao nam je Muhammed ibn el-Musenna: rekao je: pričao nam je Ibn Ebu Adijj, od Šu‘be, od Sulejmana, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: „Prvo što je Allah stvorio bilo je pero i ono je ispisalo ono što će biti.“\u003c/p>\u003cp data-paragraph=\"33.8\">Pričao nam je Temim ibn el-Muntesir: obavijestio nas je Ishak, od Šerika, od A‘meša, od Ebu Zabjana — ili Mudžahida — od Ibn Abbasa, nešto slično tome.\u003c/p>","paragraphs":[{"id":"33.1","ar":"أَيْ بُنَيَّ، اتَّقِ اللَّهَ وَاعْلَمْ أَنَّكَ لَنْ تَتَّقِيَ اللَّهَ، وَلَنْ تَبْلُغَ الْعِلْمَ حَتَّى تُؤْمِنَ بِاللَّهِ وَحْدَهُ، وَالْقَدَرِ خَيْرِهِ وَشَرِّهِ، [إِنِّي سَمِعْتُ رسول الله ص يَقُولُ: إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ عَزَّ وَجَلَّ خَلَقَ الْقَلَمَ، فَقَالَ لَهُ: اكْتُبْ، قَالَ: يَا رَبِّ وَمَا أَكْتُبُ؟ قَالَ:\n\nاكْتُبِ الْقَدَرَ، قَالَ: فَجَرَى الْقَلَمُ فِي تِلْكَ السَّاعَةِ بِمَا كَانَ وَبِمَا هُوَ كَائِنٌ إِلَى الأَبَدِ] .","bs":"O sine moj, boj se Allaha i znaj da se nećeš bojati Allaha i da nećeš dosegnuti znanje dok ne budeš vjerovao samo u Allaha i u određenje, njegovo dobro i njegovo zlo. Čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže: Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero. Rekao mu je: Piši! Ono je reklo: Gospodaru moj, a šta da pišem? Rekao je: Zapiši određenje! I pero je u tom času ispisalo ono što je bilo i ono što će biti dovijeka.’“","ar_ranges":[[173,203]],"ar_html":"أَيْ بُنَيَّ، اتَّقِ اللَّهَ وَاعْلَمْ أَنَّكَ لَنْ تَتَّقِيَ اللَّهَ، وَلَنْ تَبْلُغَ الْعِلْمَ حَتَّى تُؤْمِنَ بِاللَّهِ وَحْدَهُ، وَالْقَدَرِ خَيْرِهِ وَشَرِّهِ، [إِنِّي \u003cspan class=\"isnad\">سَمِعْتُ رسول الله ص يَقُولُ: \u003c/span>إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ عَزَّ وَجَلَّ خَلَقَ الْقَلَمَ، فَقَالَ لَهُ: اكْتُبْ، قَالَ: يَا رَبِّ وَمَا أَكْتُبُ؟ قَالَ:\n\nاكْتُبِ الْقَدَرَ، قَالَ:
