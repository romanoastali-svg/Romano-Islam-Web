<!doctype html><html lang="bs"><head><meta charset="utf-8"><title>Taberi · tom 1 · 28–52</title></head><body><script id="partData" type="application/json">{"id":"01-002","start":28,"end":52,"pages":[{"n":28,"html":"\u003csection class=\"page\" data-page=\"28\" id=\"stranica-28\">\u003ch2>Stranica 28\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 28\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"28.1\" id=\"ar-odlomak-28-1\">القول في الدلالة على أن الله عز وجل القديم الأول قبل شيء وأنه هو المحدث كل شيء بقدرته تعالى ذكره فمن الدلالة على ذلك أنه لا شيء في العالم مشاهد إلا جسم أو قائم بجسم، وأنه لا جسم إلا مفترق أو مجتمع، وأنه لا مفترق منه إلا وهو موهوم فيه الائتلاف إلى غيره من أشكاله، ولا مجتمع منه إلا وهو موهوم فيه الافتراق، وأنه متى عدم أحدهما عدم الآخر معه، وأنه إذا اجتمع الجزءان منه بعد الافتراق، فمعلوم أن اجتماعهما حادث فيهما بعد أن لم يكن، وأن الافتراق إذا حدث فيهما بعد الاجتماع، فمعلوم أن الافتراق فيهما حادث بعد أن لم يكن.\u003c/p>\u003cp data-pair=\"28.2\" id=\"ar-odlomak-28-2\">وإذا كان الأمر فيما في العالم من شيء كذلك، وكان حكم ما لم يشاهد وما هو من جنس ما شاهدنا في معنى جسم أو قائم بجسم، وكان ما لم يخل من الحدث لا شك أنه محدث بتأليف مؤلف له إن كان مجتمعا، وتفريق مفرق له إن كان مفترقا وكان معلوما بذلك أن جامع ذلك إن كان مجتمعا، ومفرقه إن كان مفترقا من لا يشبهه، ومن لا يجوز عليه الاجتماع والافتراق، وهو الواحد القادر الجامع بين المختلفات، الذي لا يشبهه شيء، وهو على كل شيء قدير- فبين بما وصفنا أن بارئ الأشياء ومحدثها كان قبل كل شيء، وأن الليل والنهار والزمان والساعات محدثات، وأن محدثها الذي يدبرها ويصرفها قبلها، إذ كان من المحال أن يكون شيء يحدث شيئا إلا ومحدثه قبله، وأن في قوله تعالى ذكره:\u003c/p>\u003cp data-pair=\"28.3\" id=\"ar-odlomak-28-3\">«أَفَلا يَنْظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ وَإِلَى السَّماءِ كَيْفَ رُفِعَتْ وَإِلَى الْجِبالِ كَيْفَ نُصِبَتْ وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ» ، لابلغ الحجج،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 28\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"28.1\" id=\"odlomak-28-1\">Rasprava o dokazivanju da je Allah, Silan je i Uzvišen, Bespočetni, Prvi prije svake stvari i da On Svojom moći dovodi svaku stvar u postojanje, uzvišen je Njegov spomen. Među dokazima toga jeste da na svijetu nema ničega što se opaža a da nije tijelo ili nešto što postoji pri tijelu; da nema tijela a da nije razdvojeno ili sastavljeno; da nema razdvojenoga njegova dijela za koji nije zamislivo spajanje s drugim, njemu sličnim dijelovima; da nema sastavljenoga za koje nije zamislivo razdvajanje; da, kada jedno od toga dvoga izostane, s njim izostane i drugo; da je, kada se njegova dva dijela sastave nakon razdvojenosti, poznato da je njihova sastavljenost u njima nastala nakon što nije postojala; i da je, kada u njima nastane razdvojenost nakon sastavljenosti, poznato da je razdvojenost u njima nastala nakon što nije postojala.\u003c/p>\u003cp data-pair=\"28.2\" id=\"odlomak-28-2\">Ako je takvo stanje stvari koje su na svijetu i ako za ono što nije opaženo, a pripada istoj vrsti kao ono što smo opazili, važi da je tijelo ili nešto što postoji pri tijelu; i ako je ono što nije lišeno nastajanja bez sumnje samo nastalo, sastavljanjem onoga koji ga sastavlja ako je sastavljeno i razdvajanjem onoga koji ga razdvaja ako je razdvojeno; i ako se time zna da je onaj koji ga sastavlja, ako je sastavljeno, i onaj koji ga razdvaja, ako je razdvojeno, neko ko mu nije sličan i na koga se ne mogu primijeniti sastavljanje i razdvajanje — a On je Jedini, Moćni, koji spaja ono što se razlikuje, kojem ništa nije slično i koji je nad svakom stvari moćan — onda je iz onoga što smo opisali jasno da je Stvoritelj stvari i Onaj koji ih dovodi u postojanje bio prije svake stvari; da su noć i dan, vrijeme i sati nastali; i da je Onaj koji ih je doveo u postojanje, koji njima upravlja i raspolaže, bio prije njih. Jer je nemoguće da nešto dovodi nešto u postojanje, a da onaj koji ga dovodi u postojanje nije prije njega. I da u Njegovim riječima, uzvišen je Njegov spomen:\u003c/p>\u003cp data-pair=\"28.3\" id=\"odlomak-28-3\">\u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 88:17–20⟧\u003c/span> „Zar ne gledaju kamile, kako su stvorene, i nebo, kako je podignuto, i planine, kako su postavljene, i Zemlju, kako je prostrta?“ — postoji najrječitiji dokaz,\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":29,"html":"\u003csection class=\"page\" data-page=\"29\" id=\"stranica-29\">\u003ch2>Stranica 29\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 29\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"29.1\" id=\"ar-odlomak-29-1\">وأدل الدلائل- لمن فكر بعقل، واعتبر بفهم- على قدم بارئها، وحدوث كل ما جانسها، وأن لها خالقا لا يشبهها.\u003c/p>\u003cp data-pair=\"29.2\" id=\"ar-odlomak-29-2\">وذلك أن كل ما ذكر ربنا تبارك وتعالى في هذه الآية من الجبال والأرض والإبل فإن ابن آدم يعالجه ويدبره بتحويل وتصريف وحفر ونحت وهدم، غير ممتنع عليه شيء من ذلك ثم إن ابن آدم مع ذلك غير قادر على إيجاد شيء من ذلك من غير أصل، فمعلوم أن العاجز عن إيجاد ذلك لم يحدث نفسه، وأن الذي هو غير ممتنع ممن أراد تصريفه وتقليبه لم يوجده من هو مثله، ولا هو أوجد نفسه، وأن الذي أنشأه وأوجد عينه هو الذي لا يعجزه شيء أراده، ولا يمتنع عليه إحداث شيء شاء إحداثه، وهُوَ اللَّهُ الْواحِدُ الْقَهَّارُ.\u003c/p>\u003cp data-pair=\"29.3\" id=\"ar-odlomak-29-3\">فإن قال قائل: فما تنكر أن تكون الأشياء التي ذكرت من فعل قديمين؟\u003c/p>\u003cp data-pair=\"29.4\" id=\"ar-odlomak-29-4\">قيل: أنكرنا ذلك لوجودنا اتصال التدبير وتمام الخلق، فقلنا: لو كان المدبر اثنين، لم يخلوا من اتفاق أو اختلاف، فإن كانا متفقين فمعناهما واحد، وإنما جعل الواحد اثنين من قال بالاثنين وإن كانا مختلفين كان محالا وجود الخلق على التمام والتدبير على الاتصال، لأن المختلفين، فعل كل واحد منهما خلاف فعل صاحبه، بأن أحدهما إذا أحيا أمات الآخر، وإذا أوجد أحدهما أفنى الآخر، فكان محالا وجود شيء من الخلق على ما وجد عليه من التمام والاتصال.\u003c/p>\u003cp data-pair=\"29.5\" id=\"ar-odlomak-29-5\">وفي قول الله عز وجل ذكره: «لَوْ كانَ فِيهِما آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتا فَسُبْحانَ اللَّهِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ» ، وقوله عز وجل: «مَا اتَّخَذَ اللَّهُ مِنْ وَلَدٍ وَما كانَ مَعَهُ مِنْ إِلهٍ إِذاً لَذَهَبَ كُلُّ إِلهٍ بِما خَلَقَ وَلَعَلا بَعْضُهُمْ عَلى بَعْضٍ سُبْحانَ اللَّهِ عَمَّا يَصِفُونَ عالِمِ الْغَيْبِ وَالشَّهادَةِ فَتَعالى عَمَّا يُشْرِكُونَ»\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 29\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"29.1\" id=\"odlomak-29-1\">i najjasniji pokazatelj — za onoga ko razmišlja razumom i pouku uzima razumijevanjem — bespočetnosti njihova Stvoritelja, nastanka svega što je njihove vrste i toga da imaju Stvoritelja koji im nije sličan.\u003c/p>\u003cp data-pair=\"29.2\" id=\"odlomak-29-2\">Jer sve što je naš Gospodar, Blagoslovljeni i Uzvišeni, spomenuo u ovom ajetu od planina, Zemlje i kamila Ademov sin obrađuje i njime upravlja preobražavanjem, raspoređivanjem, kopanjem, klesanjem i rušenjem; ništa mu se od toga ne može oduprijeti. Uprkos tome, Ademov sin nije sposoban išta od toga dovesti u postojanje bez prethodne osnove. Poznato je, dakle, da onaj ko je nemoćan to dovesti u postojanje nije sam sebe doveo u postojanje; i da ono što se ne može oduprijeti onome ko želi njime raspolagati i preokretati ga nije doveo u postojanje neko njemu sličan, niti je ono samo sebe dovelo u postojanje. Onaj koji ga je načinio i samu njegovu bit doveo u postojanje jeste Onaj kojem ništa što želi nije nemoguće i kojem se ne može oduprijeti nastanak bilo čega što želi dovesti u postojanje. A On je Allah, Jedini, Svepotčinitelj.\u003c/p>\u003cp data-pair=\"29.3\" id=\"odlomak-29-3\">Ako neko kaže: Šta vas navodi da poričete mogućnost da su stvari koje ste spomenuli djelo dvojice bespočetnih?\u003c/p>\u003cp data-pair=\"29.4\" id=\"odlomak-29-4\">Odgovara se: To poričemo zbog toga što nalazimo povezanost upravljanja i potpunost stvaranja. Zato smo rekli: Da su upravitelja dvojica, nužno bi se ili slagali ili razilazili. Ako se slažu, njihovo je značenje jedno, i samo je onaj ko govori o dvojici jedno nazvao dvama. Ako se razilaze, nemoguće je da stvorenja postoje u potpunosti i upravljanje u povezanosti, jer kod dvojice koji se razilaze djelovanje svakoga protivi se djelovanju njegova druga: kada jedan oživljava, drugi usmrćuje; i kada jedan dovodi u postojanje, drugi uništava. Stoga bi bilo nemoguće da išta od stvorenja postoji u potpunosti i povezanosti u kojima postoji.\u003c/p>\u003cp data-pair=\"29.5\" id=\"odlomak-29-5\">A u riječima Allaha, Silan je i Uzvišen Njegov spomen: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 21:22⟧\u003c/span> „Da u njima ima bogova osim Allaha, njih dvoje bi se poremetili. Pa neka je slavljen Allah, Gospodar Prijestolja, iznad onoga što opisuju.“ I u Njegovim riječima, Silan je i Uzvišen: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 23:91–92⟧\u003c/span> „Allah nije uzeo nikakvo dijete i uz Njega nije bilo nikakva boga. Tada bi svaki bog otišao s onim što je stvorio i jedni bi se nad drugima uzdigli. Slavljen neka je Allah, iznad onoga što opisuju, Poznavalac nevidljivoga i vidljivoga, uzvišen je iznad onoga što Mu pridružuju“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":30,"html":"\u003csection class=\"page\" data-page=\"30\" id=\"stranica-30\">\u003ch2>Stranica 30\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 30\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"30.1\" id=\"ar-odlomak-30-1\">أبلغ حجة، وأوجز بيان، وأدل دليل على بطول ما قاله المبطلون من أهل الشرك بالله، وذلك أن السموات والأرض لو كان فيهما إله غير الله، لم يخل أمرهما مما وصفت من اتفاق واختلاف وفي القول باتفاقهما فساد القول بالتثنية، وإقرار بالتوحيد، وإحالة في الكلام بأن قائله سمى الواحد اثنين وفي القول باختلافهما، القول بفساد السموات والأرض، كما قال ربنا جل وعز: «لَوْ كانَ فِيهِما آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتا» لأن أحدهما كان إذا أحدث شيئا وخلقه كان من شأن الآخر إعدامه وإبطاله، وذلك أن كل مختلفين فأفعالهما مختلفة، كالنار التي تسخن، والثلج الذي يبرد ما أسخنته النار وأخرى، أن ذلك لو كان كما قاله المشركون بالله لم يخل كل واحد من الاثنين اللذين أثبتوهما قديمين من أن يكونا قويين او عاجزين، فان كانا عاجزين فالعاجز مقهور وغير كائن إلها وإن كانا قويين فإن كل واحد منهما بعجزه عن صاحبه عاجز، والعاجز لا يكون إلها وإن كان كل واحد منهما قويا على صاحبه عاجز، والعاجز لا يكون إلها وإن كان كل واحد منهما قويا على صاحبه، فهو بقوة صاحبه عليه عاجز، تعالى ذكره عما يشرك المشركون! فتبين إذا أن القديم بارئ الأشياء وصانعها هو الواحد الذي كان قبل كل شيء، وهو الكائن بعد كل شيء، والأول قبل كل شيء، والآخر بعد كل شيء، وأنه كان ولا وقت ولا زمان، ولا ليل ولا نهار، ولا ظلمة ولا نور إلا نور وجهه الكريم ولا سماء ولا أرض، ولا شمس ولا قمر ولا نجوم، وأن كل شيء سواه محدث مدبر مصنوع، انفرد بخلق جميعه بغير شريك ولا معين ولا ظهير، سبحانه من قادر قاهر! وقد \u003cspan class=\"isnad\">حَدَّثَنِي عَلِيُّ بْنُ سَهْلٍ الرَّمْلِيُّ، قَالَ: حَدَّثَنَا زَيْدُ بْنُ أَبِي الزَّرْقَاءِ، عَنْ جَعْفَرٍ، عَنْ يَزِيدَ بْنِ الأَصَمِّ، عَنْ أَبِي هريرة، [\u003c/span>ان النبي ص قال:\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 30\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"30.1\" id=\"odlomak-30-1\">nalazi se najrječitiji dokaz, najsažetije objašnjenje i najjasniji pokazatelj nevaljanosti onoga što tvrde zagovornici neistine među onima koji Allahu pridružuju sudruge. Jer kada bi na nebesima i Zemlji postojao bog osim Allaha, njihovo stanje nužno bi bilo onakvo kakvo sam opisao: slaganje ili razilaženje. Tvrdnja da se slažu ruši tvrdnju o dvojstvu, priznaje jednoću i sadrži proturječje u govoru, jer je onaj koji to tvrdi jedno nazvao dvama. A tvrdnja da se razilaze znači tvrdnju o poremećaju nebesa i Zemlje, kao što je naš Gospodar, Veličanstveni i Silni, rekao: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 21:22, dio⟧\u003c/span> „Da u njima ima bogova osim Allaha, njih dvoje bi se poremetili.“ Jer kada bi jedan od njih nešto doveo u postojanje i stvorio, drugome bi pripadalo da to učini nepostojećim i poništi. Kod svake dvojice koji se razilaze i njihova se djelovanja razlikuju, poput vatre koja zagrijava i snijega koji hladi ono što je vatra zagrijala. I još: kada bi bilo onako kako govore oni koji Allahu pridružuju sudruge, svaki od dvojice za koje tvrde da su bespočetni nužno bi bio ili moćan ili nemoćan. Ako su nemoćni, nemoćni je potčinjen i nije bog. Ako su moćni, svaki je od njih, zbog svoje nemoći prema drugome, nemoćan, a nemoćni ne može biti bog. I ako je svaki od njih moćan prema drugome, nemoćan je, a nemoćni ne može biti bog. I ako je svaki od njih moćan prema drugome, on je usljed moći svoga druga nad njim nemoćan. Uzvišen je Njegov spomen iznad onoga što mnogobošci pridružuju! Time je, dakle, jasno da je Bespočetni, Stvoritelj i Tvorac stvari, Jedini koji je bio prije svake stvari i koji će biti nakon svake stvari; Prvi prije svake stvari i Posljednji nakon svake stvari. On je bio, a nije bilo ni vremenskog trenutka ni vremena, ni noći ni dana, ni tame ni svjetla osim svjetla Njegova plemenitog lica, ni neba ni Zemlje, ni Sunca ni Mjeseca ni zvijezda. Sve osim Njega nastalo je, pod upravom je i načinjeno. On je sam stvorio sve to bez sudruga, pomagača ili potpore. Slavljen neka je, Moćni, Svepotčinitelj! \u003cspan class=\"isnad\">Pričao mi je Ali ibn Sehl er-Remli, rekao je: Pričao nam je Zejd ibn Ebi ez-Zerka, od Džafera, od Jezida ibn el-Esamma, od Ebu Hurejre, \u003c/span>[da je Vjerovjesnik, neka mu Allah podari blagoslov i mir, rekao:\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":31,"html":"\u003csection class=\"page\" data-page=\"31\" id=\"stranica-31\">\u003ch2>Stranica 31\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 31\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"31.1\" id=\"ar-odlomak-31-1\">إِنَّكُمْ تَسْأَلُونَ بَعْدِي عَنْ كُلِّ شَيْءٍ، حَتَّى يَقُولُ الْقَائِلُ: هَذَا اللَّهُ خَلَقَ كُلَّ شَيْءٍ فمن ذا خلقه!] .\u003c/p>\u003cp data-pair=\"31.2\" id=\"ar-odlomak-31-2\">\u003cspan class=\"isnad\">حدثنى على، حَدَّثَنَا زَيْدٌ، عَنْ جَعْفَرٍ، قَالَ: قَالَ يَزِيدُ بْنُ الأَصَمِّ:\nحَدَّثَنِي نَجَبَةُ بْنُ صَبِيغٍ، قَالَ: \u003c/span>كُنْتُ عِنْدَ أَبِي هُرَيْرَةَ فَسَأَلُوهُ عَنْ هَذَا فَكَبَّرَ وَقَالَ:\n\nمَا حَدَّثَنِي خَلِيلِي بِشَيْءٍ إِلا قَدْ رَأَيْتُهُ- أَوْ أَنَا أَنْتَظِرُهُ قَالَ جَعْفَرٌ: فَبَلَغَنِي أَنَّهُ قَالَ: إِذَا سَأَلَكُمُ النَّاسُ عَنْ هذا فقولوا: الله خالق كل شيء، والله كَانَ قَبْلَ كُلِّ شَيْءٍ، وَاللَّهُ كَائِنٌ بَعْدَ كُلِّ شَيْءٍ.\u003c/p>\u003cp data-pair=\"31.3\" id=\"ar-odlomak-31-3\">فَإِذَا كَانَ مَعْلُومًا أَنَّ خَالِقَ الأَشْيَاءِ وَبَارِئَهَا كَانَ وَلا شَيْءَ غَيْرَهُ، وَأَنَّهُ أَحْدَثَ الأَشْيَاءَ فَدَبَّرَهَا، وَأَنَّهُ قَدْ خَلَقَ صُنُوفًا مِنْ خَلْقِهِ قَبْلَ خَلْقِ الأَزْمِنَةِ وَالأَوْقَاتِ، وَقَبْلَ خَلْقِ الشَّمْسِ وَالْقَمَرِ اللَّذَيْنِ يُجْرِيهِمَا فِي أَفْلاكِهِمَا، وَبِهِمَا عُرِفَتِ الأَوْقَاتِ وَالسَّاعَاتِ، وَأُرِّخَتِ التَّأْرِيخَاتِ، وَفُصِلَ بين الليل والنهار، فلنقل: فيم ذَلِكَ الْخَلْقُ الَّذِي خُلِقَ قَبْلَ ذَلِكَ؟ وَمَا كان اوله؟\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 31\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"31.1\" id=\"odlomak-31-1\">„Vi ćete poslije mene pitati o svemu, sve dok neko ne kaže: ‘Ovaj Allah stvorio je sve, pa ko je onda Njega stvorio?’“\u003c/p>\u003cp data-pair=\"31.2\" id=\"odlomak-31-2\">\u003cspan class=\"isnad\">Pričao mi je Ali: pričao nam je Zejd, od Džafera, koji je rekao: Jezid ibn el-Esamm rekao je: pričao mi je Nedžeba ibn Sabig: \u003c/span>„Bio sam kod Ebu Hurejre pa su ga o tome pitali. On je izgovorio tekbir i rekao: ‘Nema ničega o čemu mi je pričao moj prisni prijatelj a da to već nisam vidio — ili da to ne očekujem.’“ Džafer je rekao: „Do mene je doprlo da je rekao: ‘Kada vas ljudi o tome pitaju, recite: Allah je Stvoritelj svega; Allah je bio prije svega i Allah ostaje poslije svega.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: ime نَجَبَةُ بْنُ صَبِيغٍ preneseno je prema zapisu ovog izvora; njegovo čitanje nije ovdje nezavisno potvrđeno.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"31.3\" id=\"odlomak-31-3\">Budući da je poznato da je Stvoritelj i Tvorac svega postojao kada nije bilo ničega osim Njega, da je On stvari doveo u postojanje i njima upravljao, te da je neke vrste Svojih stvorenja stvorio prije stvaranja vremena i vremenskih razdoblja, prije stvaranja Sunca i Mjeseca, koje pokreće njihovim putanjama i pomoću kojih su se upoznavali vremenski odsječci i sati, određivali datumi i razlikovali noć i dan, govorimo sada o tome: šta je to stvoreno prije toga i šta je od toga bilo prvo?\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":32,"html":"\u003csection class=\"page\" data-page=\"32\" id=\"stranica-32\">\u003ch2>Stranica 32\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 32\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"32.1\" id=\"ar-odlomak-32-1\">القول في ابتداء الخلق ما كان أوله\u003c/p>\u003cp data-pair=\"32.2\" id=\"ar-odlomak-32-2\">صح الخبر عن رسول الله ص بِمَا \u003cspan class=\"isnad\">حَدَّثَنِي بِهِ يُونُسُ بْنُ عَبْدِ الأَعْلَى، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: حَدَّثَنِي مُعَاوِيَةُ بْنُ صَالِحٍ- وحدثني عُبَيْدُ بْنُ آدَمَ بْنِ أَبِي إِيَاسٍ الْعَسْقَلانِيُّ، قَالَ: حَدَّثَنَا أَبِي، قَالَ:\nحَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ مُعَاوِيَةَ بْنِ صَالِحٍ- عَنْ أَيُّوبَ بْنِ زِيَادٍ، قَالَ:\n\nحَدَّثَنِي عُبَادَةُ بْنُ الْوَلِيدِ بْنِ عُبَادَةَ بْنِ الصَّامِتِ، قَالَ: أَخْبَرَنِي أَبِي، قَالَ:\n\nقَالَ أَبِي عُبَادَةُ بْنُ الصَّامِتِ: \u003c/span>[يَا بُنَيَّ سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ:\n\nإِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ الْقَلَمُ فَقَالَ لَهُ: اكْتُبْ، فَجَرَى فِي تِلْكَ السَّاعَةِ بِمَا هُوَ كَائِنٌ] .\u003c/p>\u003cp data-pair=\"32.3\" id=\"ar-odlomak-32-3\">\u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدِ بْنِ حَبِيبٍ، قَالَ: حَدَّثَنَا عَلِيُّ بْنُ الْحَسَنِ بْنِ شَقِيقٍ، قَالَ: أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ، قَالَ: أَخْبَرَنَا رَبَاحُ بْنُ زَيْدٍ، عَنْ عُمَرَ بْنِ حَبِيبٍ، عَنِ الْقَاسِمِ بْنِ أَبِي بَزَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ [ابْنِ عَبَّاسٍ أَنَّهُ كَانَ يُحَدِّثُ \u003c/span>أَنَّ رَسُولَ اللَّهِ ص قَالَ: إِنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ الْقَلَمَ، وَأَمَرَهُ أَنْ يَكْتُبَ كُلَّ شَيْءٍ] .\u003c/p>\u003cp data-pair=\"32.4\" id=\"ar-odlomak-32-4\">\u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بْنُ سَهْلٍ الرَّمْلِيُّ، حَدَّثَنَا نُعَيْمُ بْنُ حَمَّادٍ، حَدَّثَنَا ابْنُ الْمُبَارَكِ، أَخْبَرَنَا رَبَاحُ بْنُ زَيْدٍ، عَنْ عُمَرَ بْنِ حَبِيبٍ، عَنِ الْقَاسِمِ بْنِ أَبِي بَزَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، عن رسول الله ص بِنَحْوِهِ.\u003c/span>\u003c/p>\u003cp data-pair=\"32.5\" id=\"ar-odlomak-32-5\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ مُعَاوِيَةَ الأَنْمَاطِيُّ، حَدَّثَنَا عَبَّادُ بْنُ الْعَوَّامِ، حَدَّثَنَا عَبْدُ الْوَاحِدِ بْنُ سُلَيْمٍ، قَالَ: سَمِعْتُ عَطَاءً، قَالَ: \u003c/span>سَأَلْتُ الْوَلِيدَ بْنَ عُبَادَةَ بْنِ الصَّامِتِ: كَيْفَ كَانَتْ وَصِيَّةُ أَبِيكَ حِينَ حَضَرَهُ الْمَوْتُ؟ قَالَ: دَعَانِي فَقَالَ:\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 32\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"32.1\" id=\"odlomak-32-1\">Rasprava o početku stvaranja: šta je prvo stvoreno?\u003c/p>\u003cp data-pair=\"32.2\" id=\"odlomak-32-2\">Vjerodostojno je prenesena vijest od Allahovog Poslanika, sallallahu alejhi ve sellem, u onome što \u003cspan class=\"isnad\">mi je pričao Junus ibn Abdula‘la: rekao je: obavijestio nas je Ibn Vehb: rekao je: pričao mi je Muavija ibn Salih — a pričao mi je i Ubejd ibn Adem ibn Ebu Ijas el-Askalani: rekao je: pričao nam je moj otac: rekao je: pričao nam je Lejs ibn Sa‘d, od Muavije ibn Saliha — od Ejjuba ibn Zijada, koji je rekao: pričao mi je Ubada ibn el-Velid ibn Ubada ibn es-Samit: rekao je: obavijestio me moj otac: \u003c/span>moj otac Ubada ibn es-Samit rekao je: „Sine moj, čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže: ‘Prvo što je Allah stvorio bilo je pero. Rekao mu je: Piši! I ono je u tom času ispisalo ono što će biti.’“\u003c/p>\u003cp data-pair=\"32.3\" id=\"odlomak-32-3\">\u003cspan class=\"isnad\">Pričao mi je Ahmed ibn Muhammed ibn Habib: rekao je: pričao nam je Ali ibn el-Hasen ibn Šekik: rekao je: obavijestio nas je Abdullah ibn el-Mubarek: rekao je: obavijestio nas je Rebah ibn Zejd, od Omera ibn Habiba, od Kasima ibn Ebu Bezze, od Seida ibn Džubejra, od Ibn Abbasa, koji je kazivao \u003c/span>da je Allahov Poslanik, sallallahu alejhi ve sellem, rekao: „Prvo što je Allah stvorio bilo je pero i naredio mu je da zapiše sve.“\u003c/p>\u003cp data-pair=\"32.4\" id=\"odlomak-32-4\">\u003cspan class=\"isnad\">Pričao mi je Musa ibn Sehl er-Remli: pričao nam je Nuajm ibn Hammad: pričao nam je Ibn el-Mubarek: obavijestio nas je Rebah ibn Zejd, od Omera ibn Habiba, od Kasima ibn Ebu Bezze, od Seida ibn Džubejra, od Ibn Abbasa, od Allahovog Poslanika, sallallahu alejhi ve sellem, \u003c/span>nešto slično tome.\u003c/p>\u003cp data-pair=\"32.5\" id=\"odlomak-32-5\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Muavija el-Enmati: pričao nam je Abbad ibn el-Avvam: pričao nam je Abdulvahid ibn Sulejm, koji je rekao: čuo sam Ataa kako kaže: \u003c/span>„Upitao sam Velida ibn Ubadu ibn es-Samita: ‘Kakva je bila oporuka tvoga oca kada mu se približila smrt?’ Odgovorio je: ‘Pozvao me i rekao:\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":33,"html":"\u003csection class=\"page\" data-page=\"33\" id=\"stranica-33\">\u003ch2>Stranica 33\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 33\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"33.1\" id=\"ar-odlomak-33-1\">أَيْ بُنَيَّ، اتَّقِ اللَّهَ وَاعْلَمْ أَنَّكَ لَنْ تَتَّقِيَ اللَّهَ، وَلَنْ تَبْلُغَ الْعِلْمَ حَتَّى تُؤْمِنَ بِاللَّهِ وَحْدَهُ، وَالْقَدَرِ خَيْرِهِ وَشَرِّهِ، [إِنِّي \u003cspan class=\"isnad\">سَمِعْتُ رسول الله ص يَقُولُ: \u003c/span>إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ عَزَّ وَجَلَّ خَلَقَ الْقَلَمَ، فَقَالَ لَهُ: اكْتُبْ، قَالَ: يَا رَبِّ وَمَا أَكْتُبُ؟ قَالَ:\n\nاكْتُبِ الْقَدَرَ، قَالَ: فَجَرَى الْقَلَمُ فِي تِلْكَ السَّاعَةِ بِمَا كَانَ وَبِمَا هُوَ كَائِنٌ إِلَى الأَبَدِ] .\u003c/p>\u003cp data-pair=\"33.2\" id=\"ar-odlomak-33-2\">وقد اختلف اهل السلف قبلنا في ذلك، فنذكر أقوالهم، ثم نتبع البيان عن ذلك إن شاء الله تعالى.\u003c/p>\u003cp data-pair=\"33.3\" id=\"ar-odlomak-33-3\">فقال بعضهم في ذلك بنحو الذي روى عن رسول الله ص فيه.\u003c/p>\u003cp data-pair=\"33.4\" id=\"ar-odlomak-33-4\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"33.5\" id=\"ar-odlomak-33-5\">\u003cspan class=\"isnad\">حَدَّثَنِي وَاصِلُ بْنُ عَبْدِ الأَعْلَى الأَسَدِيُّ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>أَوَّلُ مَا خَلَقَ اللَّهُ مِنْ شَيْءٍ الْقَلَمُ فَقَالَ لَهُ: اكْتُبْ، فَقَالَ: وَمَا أَكْتُبُ يَا رَبِّ؟ قَالَ: اكْتُبِ الْقَدَرَ، قَالَ: فَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ مِنْ ذَلِكَ إِلَى قِيَامِ السَّاعَةِ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ فَفَتَقَ مِنْهُ السَّمَوَاتِ.\u003c/p>\u003cp data-pair=\"33.6\" id=\"ar-odlomak-33-6\">\u003cspan class=\"isnad\">حَدَّثَنَا وَاصِلُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا وَكِيعٌ، عَنِ الأعمش، عن أبي ظبيان، عن ابن عباس \u003c/span>نَحْوَهُ.\u003c/p>\u003cp data-pair=\"33.7\" id=\"ar-odlomak-33-7\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، عَنْ شُعْبَةَ، عَنْ سُلَيْمَانَ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>أَوَّلُ مَا خَلَقَ اللَّهُ مِنْ شَيْءٍ الْقَلَمُ، فَجَرَى بِمَا هُوَ كَائِنٌ.\u003c/p>\u003cp data-pair=\"33.8\" id=\"ar-odlomak-33-8\">\u003cspan class=\"isnad\">حَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، أَخْبَرَنَا إِسْحَاقُ، عَنْ شَرِيكٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ- أَوْ مُجَاهِدٌ-، عَنِ ابْنِ عباس بنحوه\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 33\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"33.1\" id=\"odlomak-33-1\">O sine moj, boj se Allaha i znaj da se nećeš bojati Allaha i da nećeš dosegnuti znanje dok ne budeš vjerovao samo u Allaha i u određenje, njegovo dobro i njegovo zlo. \u003cspan class=\"isnad\">Čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže: \u003c/span>Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero. Rekao mu je: Piši! Ono je reklo: Gospodaru moj, a šta da pišem? Rekao je: Zapiši određenje! I pero je u tom času ispisalo ono što je bilo i ono što će biti dovijeka.’“\u003c/p>\u003cp data-pair=\"33.2\" id=\"odlomak-33-2\">Naši prethodnici nisu bili saglasni o tome. Navest ćemo njihova mišljenja, a zatim, ako Uzvišeni Allah htjedne, izložiti objašnjenje o tome.\u003c/p>\u003cp data-pair=\"33.3\" id=\"odlomak-33-3\">Neki su o tome rekli nešto slično onome što je preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem.\u003c/p>\u003cp data-pair=\"33.4\" id=\"odlomak-33-4\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"33.5\" id=\"odlomak-33-5\">\u003cspan class=\"isnad\">Pričao mi je Vasil ibn Abdula‘la el-Esedi: rekao je: pričao nam je Muhammed ibn Fudajl, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: \u003c/span>„Prvo što je Allah stvorio bilo je pero. Rekao mu je: ‘Piši!’ Ono je reklo: ‘A šta da pišem, Gospodaru moj?’ Rekao je: ‘Zapiši određenje!’ I pero je ispisalo ono što će biti od tada do nastupanja Časa. Zatim je podigao vodenu paru i iz nje razdvojio nebesa.“\u003c/p>\u003cp data-pair=\"33.6\" id=\"odlomak-33-6\">\u003cspan class=\"isnad\">Pričao nam je Vasil ibn Abdula‘la: rekao je: pričao nam je Veki‘, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, \u003c/span>nešto slično tome.\u003c/p>\u003cp data-pair=\"33.7\" id=\"odlomak-33-7\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn el-Musenna: rekao je: pričao nam je Ibn Ebu Adijj, od Šu‘be, od Sulejmana, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: \u003c/span>„Prvo što je Allah stvorio bilo je pero i ono je ispisalo ono što će biti.“\u003c/p>\u003cp data-pair=\"33.8\" id=\"odlomak-33-8\">\u003cspan class=\"isnad\">Pričao nam je Temim ibn el-Muntesir: obavijestio nas je Ishak, od Šerika, od A‘meša, od Ebu Zabjana — ili Mudžahida — od Ibn Abbasa, \u003c/span>nešto slično tome.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":34,"html":"\u003csection class=\"page\" data-page=\"34\" id=\"stranica-34\">\u003ch2>Stranica 34\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 34\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"34.1\" id=\"ar-odlomak-34-1\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، حَدَّثَنَا ابْنُ ثَوْرٍ، قَالَ: حَدَّثَنَا مَعْمَرٌ، حَدَّثَنَا الأَعْمَشُ أَنَّ ابن عباس قال: \u003c/span>إن أول شيء خلق الْقَلَمُ.\u003c/p>\u003cp data-pair=\"34.2\" id=\"ar-odlomak-34-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، حَدَّثَنَا جَرِيرٌ، عَنْ عطاء، عن ابى الضحا مُسْلِمِ بْنِ صُبَيْحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ أَوَّلَ شَيْءٍ خَلَقَ رَبِّي عَزَّ وَجَلَّ القلم، فقال له: اكتب، فكتب ما هو كَائِنٌ إِلَى أَنْ تَقُومَ السَّاعَةُ.\u003c/p>\u003cp data-pair=\"34.3\" id=\"ar-odlomak-34-3\">وَقَالَ آخَرُونَ: بَلْ أَوَّلُ شَيْءٍ خَلَقَ اللَّهُ عَزَّ وَجَلَّ مِنْ خَلْقِهِ النُّورُ وَالظُّلْمَةُ.\u003c/p>\u003cp data-pair=\"34.4\" id=\"ar-odlomak-34-4\">ذِكْرُ مَنْ قَالَ ذلك:\u003c/p>\u003cp data-pair=\"34.5\" id=\"ar-odlomak-34-5\">\u003cspan class=\"isnad\">حدثنا ابن حميد، قال: حدثنا سلمة بْنُ الْفَضْلِ، قَالَ: قَالَ ابْنُ إِسْحَاقَ:\n\u003c/span>كَانَ أَوَّلَ مَا خَلَقَ اللَّهُ عَزَّ وَجَلَّ النُّورُ وَالظُّلْمَةُ، ثُمَّ مَيَّزَ بَيْنَهُمَا، فَجَعَلَ الظُّلْمَةَ لَيْلا أَسْوَدَ مُظْلِمًا، وَجَعَلَ النُّورَ نَهَارًا مُضِيئًا مُبْصِرًا.\u003c/p>\u003cp data-pair=\"34.6\" id=\"ar-odlomak-34-6\">قال أبو جعفر: وأولى القولين في ذلك عِنْدِي بِالصَّوَابِ قَوْلُ ابْنِ عَبَّاسٍ، لِلْخَبَرِ الَّذِي ذكرت عن [رسول الله ص قبل، أَنَّهُ قَالَ:\n\nأَوَّلُ شَيْءٍ خَلَقَ اللَّهُ الْقَلَمَ] .\u003c/p>\u003cp data-pair=\"34.7\" id=\"ar-odlomak-34-7\">فَإِنْ قَالَ لَنَا قَائِلٌ: فَإِنَّكَ قُلْتَ: أَوْلَى الْقَوْلَيْنِ- اللَّذَيْنِ أَحَدُهُمَا أَنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ مِنْ خَلْقِهِ الْقَلَمَ، وَالآخَرُ أَنَّهُ النُّورُ وَالظُّلْمَةُ- قَوْلُ مَنْ قَالَ: إِنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ مِنْ خَلْقِهِ الْقَلَمَ، فَمَا وَجْهُ الرِّوَايَةِ عَنِ ابْنِ عَبَّاسٍ الَّتِي حَدَّثَكُمُوهَا ابْنُ بَشَّارٍ قَالَ: \u003cspan class=\"isnad\">حَدَّثَنَا عَبْدُ الرَّحْمَنِ، حَدَّثَنَا سُفْيَانُ، عَنْ أَبِي هَاشِمٍ، عَنْ مُجَاهِدٍ، قَالَ: \u003c/span>قُلْتُ لابْنِ عَبَّاسٍ: إِنَّ نَاسًا يُكَذِّبُونَ بِالْقَدَرِ، فَقَالَ: إِنَّهُمْ يُكَذِّبُونَ بِكِتَابِ اللَّهِ، لآخُذَنَّ بِشَعْرِ أَحَدِهِمْ فَلأَنْفُضَنَّ بِهِ، إِنَّ اللَّهَ تَعَالَى ذَكَرَهُ كَانَ عَلَى عَرْشِهِ قَبْلَ أَنْ يَخْلُقَ شَيْئًا، فَكَانَ أَوَّلُ مَا خَلَقَ اللَّهُ الْقَلَمَ، فَجَرَى بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 34\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"34.1\" id=\"odlomak-34-1\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Abdula‘la: pričao nam je Ibn Sevr, koji je rekao: pričao nam je Ma‘mer: pričao nam je A‘meš \u003c/span>da je Ibn Abbas rekao: „Prvo što je stvoreno bilo je pero.“\u003c/p>\u003cp data-pair=\"34.2\" id=\"odlomak-34-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: pričao nam je Džerir, od Ataa, od Ebu Duhaa Muslima ibn Subejha, od Ibn Abbasa, koji je rekao: \u003c/span>„Prvo što je moj Gospodar, Silan i Uzvišen, stvorio bilo je pero. Rekao mu je: ‘Piši!’ I ono je zapisalo ono što će biti do nastupanja Časa.“\u003c/p>\u003cp data-pair=\"34.3\" id=\"odlomak-34-3\">Drugi su rekli: „Naprotiv, prvo što je Allah, Silan i Uzvišen, stvorio od Svojih stvorenja bili su svjetlost i tama.“\u003c/p>\u003cp data-pair=\"34.4\" id=\"odlomak-34-4\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"34.5\" id=\"odlomak-34-5\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Selema ibn el-Fadl, koji je rekao: Ibn Ishak rekao je: \u003c/span>„Prvo što je Allah, Silan i Uzvišen, stvorio bili su svjetlost i tama. Zatim ih je razdvojio, pa je tamu učinio crnom, mračnom noći, a svjetlost sjajnim danom u kojem se vidi.“\u003c/p>\u003cp data-pair=\"34.6\" id=\"odlomak-34-6\">Ebu Džafer kaže: Smatram da je od ova dva mišljenja ispravnije mišljenje Ibn Abbasa, zbog predaje koju sam ranije naveo od Allahovog Poslanika, sallallahu alejhi ve sellem, da je rekao: „Prvo što je Allah stvorio bilo je pero.“\u003c/p>\u003cp data-pair=\"34.7\" id=\"odlomak-34-7\">Ako nam neko kaže: „Rekao si da je od dva mišljenja — jednog da je prvo Allahovo stvorenje bilo pero, a drugog da su to bili svjetlost i tama — ispravnije mišljenje onoga koji kaže da je prvo Allahovo stvorenje bilo pero. Kakvo je onda značenje predaje od Ibn Abbasa koju vam je pričao Ibn Beššar: \u003cspan class=\"isnad\">pričao nam je Abdurrahman: pričao nam je Sufjan, od Ebu Hašima, od Mudžahida, koji je rekao: \u003c/span>‘Rekao sam Ibn Abbasu: Neki ljudi poriču određenje. Odgovorio je: Oni poriču Allahovu Knjigu! Uhvatit ću jednoga od njih za kosu i dobro ga protresti! Allah, Uzvišen je spomen Njegov, bio je na Svome Aršu prije nego što je išta stvorio. Prvo što je Allah stvorio bilo je pero i ono je ispisalo ono što će biti do Kijametskog dana,\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":35,"html":"\u003csection class=\"page\" data-page=\"35\" id=\"stranica-35\">\u003ch2>Stranica 35\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 35\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"35.1\" id=\"ar-odlomak-35-1\">وَإِنَّمَا يَجْرِي النَّاسُ عَلَى أَمْرٍ قَدْ فُرِغَ مِنْهُ؟.\u003c/p>\u003cp data-pair=\"35.2\" id=\"ar-odlomak-35-2\">وعن ابن إسحاق، التي حدثكموها ابن حميد، قال: \u003cspan class=\"isnad\">حدثنا سلمة، عن ابن إسحاق، قال: \u003c/span>يقول الله عز وجل: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ وَكانَ عَرْشُهُ عَلَى الْماءِ» ، فكان كما وصف نفسه عز وجل، إذ ليس إلا الماء عليه العرش، وعلى العرش ذو الجلال والإكرام، فكان أول ما خلق الله النور والظلمة؟\u003c/p>\u003cp data-pair=\"35.3\" id=\"ar-odlomak-35-3\">قيل: أما قول ابن عباس: إن الله تبارك وتعالى كان عرشه على الماء قبل أن يخلق شيئا، فكان أول ما خلق الله القلم- إن كان صحيحا عنه أنه قاله- فهو خبر منه أن الله خلق القلم بعد خلقه عرشه، وقد روى عن أبي هاشم هذا الخبر شعبة، ولم يقل فيه ما قال سفيان، من أن الله عز وجل كان على عرشه، فكان أول ما خلق القلم، بل روى ذلك كالذي رواه سائر من ذكرنا من الرواة عن ابن عباس أنه قال: أول ما خلق الله عز وجل القلم.\u003c/p>\u003cp data-pair=\"35.4\" id=\"ar-odlomak-35-4\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"35.5\" id=\"ar-odlomak-35-5\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنِي عَبْدُ الصَّمَدِ، قَالَ: حَدَّثَنَا شُعْبَةُ، قَالَ: حَدَّثَنَا أَبُو هَاشِمٍ، سَمِعَ مُجَاهِدًا قَالَ: سَمِعْتُ عَبْدَ اللَّهِ- لا يَدْرِي ابْنَ عُمَرَ أَوِ ابْنَ عَبَّاسٍ- قَالَ: \u003c/span>إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ الْقَلَمُ فَقَالَ لَهُ: اجْرِ، فَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ، وَإِنَّمَا يَعْمَلُ النَّاسُ الْيَوْمَ فِيمَا قَدْ فُرِغَ مِنْهُ.\u003c/p>\u003cp data-pair=\"35.6\" id=\"ar-odlomak-35-6\">وَكَذَلِكَ قَوْلُ ابْنِ إِسْحَاقَ الَّذِي ذَكَرْنَاهُ عَنْهُ مَعْنَاهُ أَنَّ اللَّهَ خَلَقَ النُّورَ وَالظُّلْمَةَ بَعْدَ خَلْقِهِ عَرْشَهُ، وَالْمَاءَ الَّذِي عَلَيْهِ عَرْشُهُ وَقَوْلُ رَسُولِ اللَّهِ ص الَّذِي رَوَيْنَاهُ عَنْهُ أَوْلَى قَوْلٍ فِي ذَلِكَ بِالصَّوَابِ، لأَنَّهُ كَانَ أَعْلَمَ قَائِلٍ فِي ذَلِكَ قولا بحقيقته وصحته، [وقد روينا عنه ع أَنَّهُ قَالَ: أَوَّلُ شَيْءٍ خَلَقَهُ اللَّهُ عَزَّ وَجَلَّ الْقَلَمُ] مِنْ غَيْرِ اسْتِثْنَاءٍ مِنْهُ شَيْئًا مِنَ الأَشْيَاءِ أَنَهُّ تَقَدَّمَ خَلْقَ اللَّهِ إِيَّاهُ خلق القلم، بل عم [بقوله ص: ان أول شيء خلقه الله القلم،] كل\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 35\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"35.1\" id=\"odlomak-35-1\">a ljudi se samo kreću u okviru onoga što je već dovršeno?’\u003c/p>\u003cp data-pair=\"35.2\" id=\"odlomak-35-2\">A kakvo je značenje predaje od Ibn Ishaka koju vam je pričao Ibn Humejd: rekao je: \u003cspan class=\"isnad\">pričao nam je Selema, od Ibn Ishaka, koji je rekao: \u003c/span>‘Allah, Silan i Uzvišen, kaže: On je Taj koji je nebesa i Zemlju stvorio u šest dana, a Njegov Arš bio je na vodi. Bio je onako kako je, Silan i Uzvišen, Sebe opisao: nije bilo ničega osim vode nad kojom je bio Arš, a na Aršu Onaj kojem pripadaju veličanstvo i plemenitost; prvo što je Allah stvorio bili su svjetlost i tama?’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta. Preostale riječi pripadaju navedenoj predaji.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"35.3\" id=\"odlomak-35-3\">Odgovara se: Što se tiče Ibn Abbasovih riječi da je Arš Allaha, Blagoslovljenog i Uzvišenog, bio na vodi prije nego što je išta stvorio i da je prvo što je Allah stvorio bilo pero — ako je vjerodostojno da je to rekao — time on izvještava da je Allah stvorio pero nakon što je stvorio Svoj Arš. Ovu predaju od Ebu Hašima prenio je i Šu‘ba, ali u njoj nije naveo ono što je naveo Sufjan: da je Allah, Silan i Uzvišen, bio na Svome Aršu, a da je prvo što je stvorio bilo pero. Naprotiv, prenio ju je onako kako su je prenijeli ostali prenosioci koje smo spomenuli od Ibn Abbasa, da je rekao: „Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero.“\u003c/p>\u003cp data-pair=\"35.4\" id=\"odlomak-35-4\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"35.5\" id=\"odlomak-35-5\">\u003cspan class=\"isnad\">Pričao nam je Ibn el-Musenna: rekao je: pričao mi je Abdussamed: rekao je: pričao nam je Šu‘ba: rekao je: pričao nam je Ebu Hašim, koji je čuo Mudžahida kako kaže: čuo sam Abdullaha — ne zna da li Ibn Omera ili Ibn Abbasa — kako kaže: \u003c/span>„Prvo što je Allah stvorio bilo je pero. Rekao mu je: ‘Teci!’ I pero je ispisalo ono što će biti. Ljudi danas postupaju samo u okviru onoga što je već dovršeno.“\u003c/p>\u003cp data-pair=\"35.6\" id=\"odlomak-35-6\">Isto tako, riječi Ibn Ishaka koje smo od njega naveli znače da je Allah stvorio svjetlost i tamu nakon što je stvorio Svoj Arš i vodu na kojoj je Njegov Arš. Riječi Allahovog Poslanika, sallallahu alejhi ve sellem, koje smo od njega prenijeli, najpreče je smatrati ispravnim u ovom pitanju, jer je od svih koji su o tome govorili on najbolje poznavao njegovu stvarnost i tačnost. Od njega, alejhis-selam, prenijeli smo da je rekao: „Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero“, ne izdvajajući ništa od stvari čije bi stvaranje prethodilo Allahovom stvaranju pera. Naprotiv, svojim riječima, sallallahu alejhi ve sellem: „Prvo što je Allah stvorio bilo je pero“, obuhvatio je svaku\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":36,"html":"\u003csection class=\"page\" data-page=\"36\" id=\"stranica-36\">\u003ch2>Stranica 36\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 36\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"36.1\" id=\"ar-odlomak-36-1\">شَيْءٍ، وَأَنَّ الْقَلَمَ مَخْلُوقٌ قَبْلَهُ مِنْ غَيْرِ اسْتِثْنَائِهِ مِنْ ذَلِكَ عَرْشًا وَلا مَاءً وَلا شَيْئًا غَيْرَ ذَلِكَ.\u003c/p>\u003cp data-pair=\"36.2\" id=\"ar-odlomak-36-2\">فالرواية التي رويناها عن ابى ظبيان وابى الضحا، عن ابن عباس، أولى بالصحة عن ابن عباس من خبر مجاهد عنه الذي رواه عنه أبو هاشم، إذ كان أبو هاشم قد اختلف في رواية ذلك عنه شعبة وسفيان، على ما قد ذكرت من اختلافهما فيها.\u003c/p>\u003cp data-pair=\"36.3\" id=\"ar-odlomak-36-3\">وأما ابن إسحاق فإنه لم يسند قوله الذي قاله في ذلك إلى أحد، وذلك من الأمور التي لا يدرك علمها إلا بخبر من الله عز وجل، أو خبر من رسول الله ص، وقد ذكرت الرواية فيه عن رسول الله ص\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 36\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"36.1\" id=\"odlomak-36-1\">stvar i kazao da je pero stvoreno prije nje, ne izdvajajući od toga ni Arš, ni vodu, niti bilo šta drugo.\u003c/p>\u003cp data-pair=\"36.2\" id=\"odlomak-36-2\">Zato je predaja koju smo prenijeli od Ebu Zabjana i Ebu Duhaa, od Ibn Abbasa, preča da bude vjerodostojna od Ibn Abbasa nego Mudžahidova predaja od njega koju prenosi Ebu Hašim, jer su Šu‘ba i Sufjan različito prenijeli ovu predaju od Ebu Hašima, kako sam već naveo opisujući njihovo razilaženje u njoj.\u003c/p>\u003cp data-pair=\"36.3\" id=\"odlomak-36-3\">Što se tiče Ibn Ishaka, on svoje mišljenje o tome nije lancem prenosilaca pripisao nikome. To pripada stvarima čije se poznavanje može steći jedino izvješćem od Allaha, Silnog i Uzvišenog, ili izvješćem od Allahovog Poslanika, sallallahu alejhi ve sellem. Već sam naveo predaju o tome od Allahovog Poslanika, sallallahu alejhi ve sellem.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":37,"html":"\u003csection class=\"page\" data-page=\"37\" id=\"stranica-37\">\u003ch2>Stranica 37\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 37\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"37.1\" id=\"ar-odlomak-37-1\">القول في الذي ثنى خلق القلم\u003c/p>\u003cp data-pair=\"37.2\" id=\"ar-odlomak-37-2\">ثم إن الله جل جلاله خلق بعد القلم- وبعد أن أمره فكتب ما هو كائن إلى قيام الساعة- سحابا رقيقا، وهو الغمام الذي ذكره جل وعز ذكره في محكم كتابه فقال: «هَلْ يَنْظُرُونَ إِلَّا أَنْ يَأْتِيَهُمُ اللَّهُ فِي ظُلَلٍ مِنَ الْغَمامِ» ، وذلك قبل أن يخلق عرشه، وبذلك ورد الخبر عن رسول الله ص.\u003c/p>\u003cp data-pair=\"37.3\" id=\"ar-odlomak-37-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ وَمُحَمَّدُ بْنُ هَارُونَ الْقَطَّانُ، قَالا: حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، عَنْ حَمَّادِ بْنِ سَلَمَةَ، عَنْ يَعْلَى بْنِ عَطَاءٍ، [عَنْ وَكِيعِ بْنِ حُدُسٍ، عَنْ عَمِّهِ أَبِي رَزِينٍ، قَالَ: \u003c/span>قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ كَانَ رَبُّنَا قَبْلَ أَنْ يَخْلُقَ خَلْقَهُ؟ قَالَ:\nكَانَ في عماء، ما تحته هواء، وما فوقه هَوَاءٌ، ثُمَّ خَلَقَ عَرْشَهُ عَلَى الْمَاءِ]\u003c/p>\u003cp data-pair=\"37.4\" id=\"ar-odlomak-37-4\">\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا الْحَجَّاجُ، قَالَ: حَدَّثَنَا حَمَّادٌ، عَنْ يَعْلَى بْنِ عَطَاءٍ، عَنْ وَكِيعِ بْنِ حُدُسٍ، عَنْ عَمِّهِ أَبِي رَزِينٍ العقيلي، قال:\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 37\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"37.1\" id=\"odlomak-37-1\">Rasprava o onome što je stvoreno poslije pera\u003c/p>\u003cp data-pair=\"37.2\" id=\"odlomak-37-2\">Zatim je Allah, Uzvišeno je Njegovo veličanstvo, nakon pera — i nakon što mu je naredio pa je ono zapisalo ono što će biti do nastupanja Časa — stvorio tanak oblak. To je oblak koji On, Silan i Uzvišen je spomen Njegov, spominje u Svojoj jasnoj Knjizi riječima: „Čekaju li oni išta drugo osim da im Allah dođe u sjenama oblaka?“ To je bilo prije nego što je stvorio Svoj Arš. O tome je došla predaja od Allahovog Poslanika, sallallahu alejhi ve sellem. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:210, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"37.3\" id=\"odlomak-37-3\">\u003cspan class=\"isnad\">Pričali su nam Ibn Veki‘ i Muhammed ibn Harun el-Kattan; obojica su rekli: pričao nam je Jezid ibn Harun, od Hammada ibn Seleme, od Ja‘le ibn Ataa, od Veki‘a ibn Hudusa, od njegovog amidže Ebu Rezina, koji je rekao: \u003c/span>„Upitao sam: ‘Allahov Poslaniče, gdje je bio naš Gospodar prije nego što je stvorio Svoja stvorenja?’ Odgovorio je: ‘Bio je u oblaku; ispod njega nije bilo zraka, niti je iznad njega bilo zraka. Zatim je stvorio Svoj Arš na vodi.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izraz عماء ovdje je preveden kao „oblak“. U izrazu ما تحته هواء وما فوقه هواء riječ ما može se razumjeti kao negacija („nije bilo“) ili odnosna riječ („ono što je“). Ovdje je navedeno prvo čitanje; naredna predaja na stranici 38 izričito govori o zraku iznad i ispod. Razlika između dviju verzija nije uklonjena.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"37.4\" id=\"odlomak-37-4\">\u003cspan class=\"isnad\">Pričao mi je Musenna ibn Ibrahim: rekao je: pričao nam je Hadždžadž: rekao je: pričao nam je Hammad, od Ja‘le ibn Ataa, od Veki‘a ibn Hudusa, od njegovog amidže Ebu Rezina el-Ukajlija, koji je rekao:\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":38,"html":"\u003csection class=\"page\" data-page=\"38\" id=\"stranica-38\">\u003ch2>Stranica 38\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 38\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"38.1\" id=\"ar-odlomak-38-1\">[قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ كَانَ رَبُّنَا عَزَّ وَجَلَّ قَبْلَ أَنْ يَخْلُقَ السَّمَوَاتِ وَالأَرْضَ؟\n\nقَالَ: فِي عَمَاءٍ، فَوْقَهُ هَوَاءٌ، وَتَحْتَهُ هَوَاءٌ، ثُمَّ خَلَقَ عَرْشَهُ عَلَى الْمَاءِ] .\u003c/p>\u003cp data-pair=\"38.2\" id=\"ar-odlomak-38-2\">\u003cspan class=\"isnad\">حَدَّثَنَا خَلادُ بْنُ أَسْلَمَ، حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ: حَدَّثَنَا الْمَسْعُودِيُّ، أَخْبَرَنَا جَامِعُ بْنُ شَدَّادٍ، عَنْ صَفْوَانَ بْنِ مُحْرِزٍ، [عَنِ ابْنِ حُصَيْنٍ- وَكَانَ من اصحاب رسول الله ص- قال: \u003c/span>اتى قوم رسول الله ص فَدَخَلُوا عَلَيْهِ، فَجَعَلَ يُبَشِّرُهُمْ وَيَقُولُونَ: أَعْطِنَا، حَتَّى ساء ذلك رسول الله ص، ثُمَّ خَرَجُوا مِنْ عِنْدِهِ وَجَاءَ قَوْمٌ آخَرُونَ، فَدَخَلُوا عَلَيْهِ فَقَالُوا: جِئْنَا نُسَلِّمُ عَلَى رَسُولِ الله ص، وَنَتَفَقَّهُ فِي الدِّينِ، وَنَسْأَلُهُ عَنْ بَدْءِ هَذَا الأَمْرِ، قَالَ: فَاقْبَلُوا الْبُشْرَى إِذْ لَمْ يَقْبَلْهَا أُولَئِكَ الَّذِينَ خَرَجُوا، قَالُوا: قَبِلْنَا، فَقَالَ رَسُولُ الله ص: كان الله لا شَيْءَ غَيْرُهُ، وَكَانَ عَرْشُهُ عَلَى الْمَاءِ وَكَتَبَ فِي الذِّكْرِ قَبْلَ كُلِّ شَيْءٍ، ثُمَّ خَلَقَ سَبْعَ سَمَوَاتٍ] ثُمَّ أَتَانِي آتٍ فَقَالَ: تِلْكَ نَاقَتُكَ قَدْ ذَهَبَتْ، فَخَرَجْتُ يَنْقَطِعُ دُونَهَا السَّرَابُ، وَلَوَدِدْتُ أَنِّي تَرَكْتُهَا.\u003c/p>\u003cp data-pair=\"38.3\" id=\"ar-odlomak-38-3\">\u003cspan class=\"isnad\">حَدَّثَنِي أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ عَنْ جَامِعِ ابن شَدَّادٍ، عَنْ صَفْوَانَ بْنِ مُحْرِزٍ، عَنْ عِمْرَانَ بن الحصين، قال: [قال رسول الله ص: \u003c/span>اقْبَلُوا الْبُشْرَى يَا بَنِي تَمِيمٍ، فَقَالُوا: قَدْ بَشَّرْتَنَا فَأَعْطِنَا فَقَالَ:\nاقْبَلُوا الْبُشْرَى يَا أَهْلَ الْيَمَنِ، فَقَالُوا: قَدْ قَبِلْنَا، فَأَخْبِرْنَا عَنْ هَذَا الأمر كيف كان؟ فقال رسول الله ص: كَانَ اللَّهُ عَزَّ وَجَلَّ عَلَى الْعَرْشِ، وَكَانَ قَبْلَ كُلِّ شَيْءٍ، وَكَتَبَ فِي اللَّوْحِ كُلَّ شَيْءٍ يَكُونُ] قَالَ: فَأَتَانِي آتٍ فَقَالَ:\n\nيَا عِمْرَانُ، هَذِهِ نَاقَتُكَ قَدْ حَلَّتْ عِقَالَهَا، فَقُمْتُ، فَإِذَا السَّرَابُ يَنْقَطِعُ بَيْنِي وَبَيْنَهَا، فَلا أَدْرِي مَا كَانَ بَعْدَ ذَلِكَ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 38\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"38.1\" id=\"odlomak-38-1\">„Upitao sam: ‘Allahov Poslaniče, gdje je bio naš Gospodar, Silan i Uzvišen, prije nego što je stvorio nebesa i Zemlju?’ Odgovorio je: ‘U oblaku; iznad njega bio je zrak, a ispod njega bio je zrak. Zatim je stvorio Svoj Arš na vodi.’“\u003c/p>\u003cp data-pair=\"38.2\" id=\"odlomak-38-2\">\u003cspan class=\"isnad\">Pričao nam je Hallad ibn Eslem: pričao nam je Nadr ibn Šumejl: rekao je: pričao nam je Mesudi: obavijestio nas je Džami‘ ibn Šeddad, od Safvana ibn Muhriza, od Ibn Husajna — a bio je jedan od ashaba Allahovog Poslanika, sallallahu alejhi ve sellem — koji je rekao: \u003c/span>„Neki ljudi došli su Allahovom Poslaniku, sallallahu alejhi ve sellem, i ušli kod njega. On ih je obradovao radosnim vijestima, a oni su govorili: ‘Daj nam!’, sve dok to nije oneraspoložilo Allahovog Poslanika, sallallahu alejhi ve sellem. Zatim su izašli od njega, a došli su drugi ljudi i ušli kod njega. Rekli su: ‘Došli smo da poselamimo Allahovog Poslanika, sallallahu alejhi ve sellem, da se podučimo vjeri i da ga pitamo o početku svega ovoga.’ Rekao je: ‘Prihvatite radosnu vijest, jer je nisu prihvatili oni koji su izašli.’ Odgovorili su: ‘Prihvatili smo.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Bio je Allah i nije bilo ničega osim Njega; Njegov Arš bio je na vodi. Prije svega zapisao je u Zapis, a zatim je stvorio sedam nebesa.’ Potom mi je došao neko i rekao: ‘Eno, tvoja deva je otišla!’ Izašao sam, a prije nego što bih do nje stigao pružala se fatamorgana. Volio bih da sam je ostavio.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u ovom lancu stoji samo „Ibn Husajn“; puno ime nije dopunjavano. Izraz ينقطع دونها السراب opisuje fatamorganu na putu do deve; prostorna slika nije sasvim jasna.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"38.3\" id=\"odlomak-38-3\">\u003cspan class=\"isnad\">Pričao mi je Ebu Kurejb: pričao nam je Ebu Muavija, od A‘meša, od Džami‘a ibn Šeddada, od Safvana ibn Muhriza, od Imrana ibn el-Husajna, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Prihvatite radosnu vijest, o Benu Temim!’ Odgovorili su: ‘Već si nas obradovao, pa nam daj!’ Zatim je rekao: ‘Prihvatite radosnu vijest, stanovnici Jemena!’ Odgovorili su: ‘Prihvatili smo, pa nas obavijesti kako je ovo započelo.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Allah, Silan i Uzvišen, bio je na Aršu i bio je prije svega. U Ploču je zapisao sve što će biti.’ Tada mi je došao neko i rekao: ‘Imrane, ova tvoja deva oslobodila se svoje spone!’ Ustao sam, a između mene i nje pružala se fatamorgana, pa ne znam šta je bilo poslije toga.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":39,"html":"\u003csection class=\"page\" data-page=\"39\" id=\"stranica-39\">\u003ch2>Stranica 39\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 39\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"39.1\" id=\"ar-odlomak-39-1\">ثُمَّ اخْتُلِفَ فِي الَّذِي خَلَقَ تَعَالَى ذِكْرُهُ بَعْدَ الْعَمَاءِ، فَقَالَ بَعْضُهُمْ: خَلَقَ بَعْدَ ذَلِكَ عَرْشَهُ.\u003c/p>\u003cp data-pair=\"39.2\" id=\"ar-odlomak-39-2\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"39.3\" id=\"ar-odlomak-39-3\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا أَبُو سَلَمَةَ، قَالَ: حَدَّثَنَا حيان ابن عُبَيْدِ اللَّهِ، عَنِ الضَّحَّاكِ بْنِ مُزَاحِمٍ، قَالَ، قَالَ ابْنُ عَبَّاسٍ: \u003c/span>إِنَّ اللَّهَ عَزَّ وَجَلَّ خَلَقَ الْعَرْشَ أَوَّلَ مَا خَلَقَ، فَاسْتَوَى عَلَيْهِ.\u003c/p>\u003cp data-pair=\"39.4\" id=\"ar-odlomak-39-4\">وَقَالَ آخَرُونَ: خَلَقَ اللَّهُ عَزَّ وَجَلَّ الْمَاءَ قَبْلَ الْعَرْشِ، ثُمَّ خَلَقَ عَرْشَهُ فَوَضَعَهُ عَلَى الْمَاءِ.\u003c/p>\u003cp data-pair=\"39.5\" id=\"ar-odlomak-39-5\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"39.6\" id=\"ar-odlomak-39-6\">\u003cspan class=\"isnad\">حَدَّثَنَا مُوسَى بن هارون الهمداني، قال: حدثنا عمرو بن حَمَّادٍ، قَالَ: حَدَّثَنَا أَسْبَاطُ بْنُ نَصْرٍ، عَنِ السدي في خبر ذكره، عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب رسول الله ص- قَالُوا: \u003c/span>إِنَّ اللَّهَ عَزَّ وَجَلَّ كَانَ عَرْشُهُ عَلَى الْمَاءِ، وَلَمْ يَخْلُقْ شَيْئًا غَيْرَ مَا خَلَقَ قَبْلَ الْمَاءِ.\u003c/p>\u003cp data-pair=\"39.7\" id=\"ar-odlomak-39-7\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ سَهْلِ بن عسكر، قال: حدثنا إسماعيل بن عبد الكريم، قال: حدثني عبد الصمد بن معقل، قال: سمعت وهب بن منبه يقول: \u003c/span>إن العرش كان قبل ان يخلق السَّمَوَاتِ وَالأَرْضَ عَلَى الْمَاءِ، فَلَمَّا أَرَادَ أَنْ يَخْلُقَ السَّمَوَاتِ وَالأَرْضَ قَبَضَ مِنْ صَفَاةِ الْمَاءِ قَبْضَةً، ثُمَّ فَتَحَ الْقَبْضَةَ فَارْتَفَعَتْ دُخَانًا، ثُمَّ قَضَاهُنَّ سَبْعَ سَمَوَاتٍ فِي يَوْمَيْنِ، وَدَحَا الأَرْضَ فِي يَوْمَيْنِ، وَفَرَغَ مِنَ الْخَلْقِ الْيَوْمَ السَّابِعَ.\u003c/p>\u003cp data-pair=\"39.8\" id=\"ar-odlomak-39-8\">وَقَدْ قِيلَ: إِنَّ الَّذِي خَلَقَ رَبُّنَا عَزَّ وَجَلَّ بَعْدَ الْقَلَمِ الْكُرْسِيَّ، ثُمَّ خَلَقَ بَعْدَ الْكُرْسِيِّ الْعَرْشَ، ثُمَّ بَعْدَ ذَلِكَ خَلَقَ الْهَوَاءَ وَالظُّلُمَاتِ، ثُمَّ خَلَقَ الْمَاءَ، فَوَضَعَ عَرْشَهُ عَلَيْهِ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 39\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"39.1\" id=\"odlomak-39-1\">Zatim su se razišli o tome šta je On, Uzvišen je spomen Njegov, stvorio poslije oblaka. Neki su rekli: „Nakon toga stvorio je Svoj Arš.“\u003c/p>\u003cp data-pair=\"39.2\" id=\"odlomak-39-2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"39.3\" id=\"odlomak-39-3\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sinan: pričao nam je Ebu Selema: rekao je: pričao nam je Hajjan ibn Ubejdullah, od Dahhaka ibn Muzahima, koji je rekao: Ibn Abbas rekao je: \u003c/span>„Allah, Silan i Uzvišen, najprije je stvorio Arš, pa se nad njim uzvisio.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: استوى عليه ovdje je prevedeno „nad njim se uzvisio“; ovo je tekst predaje, a ne dodano objašnjenje načina ili kakvoće.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"39.4\" id=\"odlomak-39-4\">Drugi su rekli: „Allah, Silan i Uzvišen, stvorio je vodu prije Arša, zatim je stvorio Svoj Arš i postavio ga na vodu.“\u003c/p>\u003cp data-pair=\"39.5\" id=\"odlomak-39-5\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"39.6\" id=\"odlomak-39-6\">\u003cspan class=\"isnad\">Pričao nam je Musa ibn Harun el-Hemdani: rekao je: pričao nam je Amr ibn Hammad: rekao je: pričao nam je Esbat ibn Nasr, od Suddija, u izvješću koje je naveo, od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, koji su rekli: \u003c/span>„Arš Allaha, Silnog i Uzvišenog, bio je na vodi, a On nije stvorio ništa drugo osim onoga što je stvorio prije vode.“\u003c/p>\u003cp data-pair=\"39.7\" id=\"odlomak-39-7\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sehl ibn Asker: rekao je: pričao nam je Ismail ibn Abdulkerim: rekao je: pričao mi je Abdussamed ibn Ma‘kil, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: \u003c/span>„Arš je, prije stvaranja nebesa i Zemlje, bio na vodi. Kada je htio stvoriti nebesa i Zemlju, zahvatio je pregršt s površine vode, zatim je otvorio šaku pa se to podiglo kao dim. Potom je od njih u dva dana sačinio sedam nebesa, u dva dana rasprostro Zemlju i dovršio stvaranje sedmog dana.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izraz صفاة الماء preveden je „površina vode“; tačno čitanje i značenje riječi صفاة u ovom spoju zahtijevaju provjeru štampanog izdanja.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"39.8\" id=\"odlomak-39-8\">Rečeno je i da je ono što je naš Gospodar, Silan i Uzvišen, stvorio nakon pera bio Kursijj. Zatim je, nakon Kursijja, stvorio Arš, potom zrak i tmine, zatim vodu, pa je na nju postavio Svoj Arš.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":40,"html":"\u003csection class=\"page\" data-page=\"40\" id=\"stranica-40\">\u003ch2>Stranica 40\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 40\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"40.1\" id=\"ar-odlomak-40-1\">قال أبو جعفر: وأولى القولين في ذلك عندي بالصواب قول من قال: إن الله تبارك وتعالى خلق الماء قبل العرش، لصحة الخبر الذي ذكرت قبل عن أبي رزين العقيلي عن [رسول الله ص أنه قال حين سئل:\nأين كان ربنا عز وجل قبل أن يخلق خلقه؟ قال: كان في عماء، ما تحته هواء، وما فوقه هواء، ثم خلق عرشه على الماء،] فاخبر ص أن الله خلق عرشه على الماء ومحال إذ كان خلقه على الماء أن يكون خلقه عليه، والذي خلقه عليه غير موجود، إما قبله أو معه، فإذا كان ذلك كذلك، فالعرش لا يخلو من أحد أمرين، إما أن يكون خلق بعد خلق الله الماء، وإما أن يكون خلق هو والماء معا فأما أن يكون خلقه قبل خلق الماء، فذلك غير جائز صحته على ما روى عن ابى رزين، عن النبي ص.\u003c/p>\u003cp data-pair=\"40.2\" id=\"ar-odlomak-40-2\">وقد قيل: إن الماء كان على متن الريح حين خلق عرشه عليه، فإن كان ذلك كذلك، فقد كان الماء والريح خلقا قبل العرش.\u003c/p>\u003cp data-pair=\"40.3\" id=\"ar-odlomak-40-3\">ذكر من قال: كان الماء على متن الريح:\u003c/p>\u003cp data-pair=\"40.4\" id=\"ar-odlomak-40-4\">\u003cspan class=\"isnad\">حَدَّثَنِي ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنِ المنهال بن عمرو، عن سعيد بن جبير، قَالَ: \u003c/span>سُئِلَ ابْنُ عَبَّاسٍ عَنْ قَوْلِهِ عَزَّ وجل:\n\n«وَكانَ عَرْشُهُ عَلَى الْماءِ» : عَلَى أَيِّ شَيْءٍ كَانَ الْمَاءُ؟ قَالَ: عَلَى مَتْنِ الرِّيحِ.\u003c/p>\u003cp data-pair=\"40.5\" id=\"ar-odlomak-40-5\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، حَدَّثَنَا مُحَمَّدُ بْنُ ثَوْرٍ، عَنْ مَعْمَرٍ، عَنِ الأَعْمَشِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: \u003c/span>سُئِلَ ابْنُ عَبَّاسٍ عَنْ قَوْلِهِ عَزَّ وَجَلَّ:\n\n«وَكَانَ عرشه على الماء» : عَلَى أَيِّ شَيْءٍ كَانَ الْمَاءُ؟ قَالَ: عَلَى متن الريح\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 40\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"40.1\" id=\"odlomak-40-1\">Ebu Džafer kaže: Od dva mišljenja smatram ispravnijim ono prema kojem je Allah, Blagoslovljen i Uzvišen, stvorio vodu prije Arša, zbog vjerodostojnosti predaje koju sam ranije naveo od Ebu Rezina el-Ukajlija, od Allahovog Poslanika, sallallahu alejhi ve sellem. Kada je upitan: „Gdje je bio naš Gospodar, Silan i Uzvišen, prije nego što je stvorio Svoja stvorenja?“, odgovorio je: „Bio je u oblaku; ispod njega nije bilo zraka, niti je iznad njega bilo zraka. Zatim je stvorio Svoj Arš na vodi.“ Time je on, sallallahu alejhi ve sellem, izvijestio da je Allah stvorio Svoj Arš na vodi. Ako ga je stvorio na vodi, nemoguće je da ga je stvorio na njoj a da ono na čemu ga je stvorio nije postojalo, bilo prije njega, bilo istovremeno s njim. Ako je tako, postoje samo dvije mogućnosti: ili je Arš stvoren nakon što je Allah stvorio vodu ili su Arš i voda stvoreni zajedno. Da ga je stvorio prije stvaranja vode ne može biti ispravno prema onome što je preneseno od Ebu Rezina, od Vjerovjesnika, sallallahu alejhi ve sellem. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: ista jezička nejasnoća u izrazu ما تحته هواء وما فوقه هواء označena je na stranici 37; ovdje je dosljedno zadržano isto čitanje.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"40.2\" id=\"odlomak-40-2\">Rečeno je da je voda bila na leđima vjetra kada je na njoj stvorio Svoj Arš. Ako je bilo tako, onda su voda i vjetar bili stvoreni prije Arša.\u003c/p>\u003cp data-pair=\"40.3\" id=\"odlomak-40-3\">Spomen onih koji su rekli da je voda bila na leđima vjetra:\u003c/p>\u003cp data-pair=\"40.4\" id=\"odlomak-40-4\">\u003cspan class=\"isnad\">Pričao mi je Ibn Veki‘: rekao je: pričao nam je moj otac, od Sufjana, od A‘meša, od Minhala ibn Amra, od Seida ibn Džubejra, koji je rekao: \u003c/span>„Ibn Abbas upitan je, povodom riječi Njega, Silnog i Uzvišenog: ‘A Njegov Arš bio je na vodi’: ‘Na čemu je bila voda?’ Odgovorio je: ‘Na leđima vjetra.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"40.5\" id=\"odlomak-40-5\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Abdula‘la: pričao nam je Muhammed ibn Sevr, od Ma‘mera, od A‘meša, od Seida ibn Džubejra, koji je rekao: \u003c/span>„Ibn Abbas upitan je, povodom riječi Njega, Silnog i Uzvišenog: ‘A Njegov Arš bio je na vodi’: ‘Na čemu je bila voda?’ Odgovorio je: ‘Na leđima vjetra.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":41,"html":"\u003csection class=\"page\" data-page=\"41\" id=\"stranica-41\">\u003ch2>Stranica 41\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 41\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"41.1\" id=\"ar-odlomak-41-1\">\u003cspan class=\"isnad\">حدثنا القاسم بن الحسن، حَدَّثَنَا الْحُسَيْنُ بْنُ دَاوُدَ، حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ \u003c/span>مِثْلَهُ.\u003c/p>\u003cp data-pair=\"41.2\" id=\"ar-odlomak-41-2\">قَالَ: وَالسَّمَوَاتُ وَالأَرْضُ وَكُلُّ مَا فِيهِنَّ مِنْ شَيْءٍ يُحِيطُ بِهَا الْبِحَارُ، وَيُحِيطُ بِذَلِكَ كُلِّهِ الْهَيْكَلُ، وَيُحِيطُ بِالْهَيْكَلِ- فِيمَا قِيلَ- الْكُرْسِيُّ.\u003c/p>\u003cp data-pair=\"41.3\" id=\"ar-odlomak-41-3\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"41.4\" id=\"ar-odlomak-41-4\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ سهل بن عسكر، حَدَّثَنَا إسماعيل بن عبد الكريم، قال: حدثني عبد الصمد أنه سمع وهبا يقول- وذكر من عظمته- فقال: \u003c/span>إن السموات والأرض والبحار لفي الهيكل، وإن الهيكل لفي الكرسي، وإن قدميه عز وجل لعلى الكرسي، وهو يحمل الكرسي، وقد عاد الكرسي كالنعل في قدميه.\u003c/p>\u003cp data-pair=\"41.5\" id=\"ar-odlomak-41-5\">وسئل وهب: ما الهيكل؟ قال: شيء من أطراف السموات محدق بالأرضين والبحار كأطناب الفسطاط.\u003c/p>\u003cp data-pair=\"41.6\" id=\"ar-odlomak-41-6\">وسئل وهب عن الأرضين: كيف هي؟ قال: هي سبع أرضين ممهدة جزائر، بين كل أرضين بحر، والبحر محيط بذلك كله، والهيكل من وراء البحر وقد قيل: إنه كان بين خلقه القلم وخلقه سائر خلقه ألف عام.\u003c/p>\u003cp data-pair=\"41.7\" id=\"ar-odlomak-41-7\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"41.8\" id=\"ar-odlomak-41-8\">\u003cspan class=\"isnad\">حَدَّثَنَا القاسم بن الحسن، قال: حَدَّثَنَا الحسين بن داود، قال: حَدَّثَنَا مبشر الحلبي، عن أرطاة بن المنذر، قال: سمعت ضمرة يقول: \u003c/span>إن الله خلق القلم، فكتب به ما هو خالق وما هو كائن من خلقه، ثم إن ذلك الكتاب سبح الله ومجده ألف عام قبل أن يخلق شيئا من الخلق، فلما أراد جل جلاله خلق السموات والأرض خلق- فيما ذكر- أياما ستة، فسمى كل يوم منهن باسم غير الذي سمى به الآخر\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 41\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"41.1\" id=\"odlomak-41-1\">\u003cspan class=\"isnad\">Pričao nam je Kasim ibn el-Hasen: pričao nam je Husejn ibn Davud: pričao mi je Hadždžadž, od Ibn Džurejdža, od Seida ibn Džubejra, od Ibn Abbasa, \u003c/span>isto to.\u003c/p>\u003cp data-pair=\"41.2\" id=\"odlomak-41-2\">Rekao je: „Nebesa, Zemlju i sve što je u njima okružuju mora. Sve to okružuje hejkel, a hejkel, prema onome što je rečeno, okružuje Kursijj.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: الهيكل je preneseno kao „hejkel“, naziv za strukturu koju naredna predaja opisuje; nije poistovjećeno s Aršom ili Kursijjem.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"41.3\" id=\"odlomak-41-3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"41.4\" id=\"odlomak-41-4\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sehl ibn Asker: pričao nam je Ismail ibn Abdulkerim: rekao je: pričao mi je Abdussamed da je čuo Vehba kako govori — \u003c/span>pa je spomenuo Njegovu veličinu i rekao: „Nebesa, Zemlja i mora nalaze se u hejkelu, hejkel se nalazi u Kursijju, a Njegova stopala, Silan je i Uzvišen, na Kursijju su. On nosi Kursijj i Kursijj je postao poput sandale na Njegovim stopalima.“\u003c/p>\u003cp data-pair=\"41.5\" id=\"odlomak-41-5\">Vehb je upitan: „Šta je hejkel?“ Odgovorio je: „Nešto od krajeva nebesa što okružuje zemlje i mora poput užadi šatora.“\u003c/p>\u003cp data-pair=\"41.6\" id=\"odlomak-41-6\">Vehb je upitan o zemljama: „Kakve su?“ Odgovorio je: „To je sedam zemalja, rasprostrtih kao otoci. Između svake dvije zemlje nalazi se more; more sve to okružuje, a hejkel je iza mora.“ Rečeno je da je između Njegovog stvaranja pera i stvaranja ostalih stvorenja bilo hiljadu godina.\u003c/p>\u003cp data-pair=\"41.7\" id=\"odlomak-41-7\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"41.8\" id=\"odlomak-41-8\">\u003cspan class=\"isnad\">Pričao nam je Kasim ibn el-Hasen: rekao je: pričao nam je Husejn ibn Davud: rekao je: pričao nam je Mubeššir el-Halebi, od Ertaa ibn el-Munzira, koji je rekao: čuo sam Damru kako govori: \u003c/span>„Allah je stvorio pero, pa je njime zapisao ono što će stvoriti i ono što će biti od Njegovih stvorenja. Zatim je taj zapis hiljadu godina slavio i veličao Allaha, prije nego što je stvorio išta od stvorenja. Kada je, Uzvišeno je Njegovo veličanstvo, htio stvoriti nebesa i Zemlju, stvorio je — prema onome što je navedeno — šest dana, pa je svakome dao ime različito od imena drugoga.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":42,"html":"\u003csection class=\"page\" data-page=\"42\" id=\"stranica-42\">\u003ch2>Stranica 42\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 42\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"42.1\" id=\"ar-odlomak-42-1\">وقيل: إن اسم أحد تلك الأيام الستة أبجد، واسم الآخر منهن هوز، واسم الثالث منهن حطي، واسم الرابع منهن كلمن، واسم الخامس منهن سعفص، واسم السادس منهن قرشت.\u003c/p>\u003cp data-pair=\"42.2\" id=\"ar-odlomak-42-2\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"42.3\" id=\"ar-odlomak-42-3\">\u003cspan class=\"isnad\">حَدَّثَنِي الحضرمي، قال: حَدَّثَنَا مصرف بن عمرو اليامى، حدثنا حفص ابن غياث، عن العلاء بن المسيب، عن رجل من كنده، قال: سمعت الضحاك ابن مزاحم يقول: \u003c/span>خلق الله السموات والأرض في ستة أيام، ليس منها يوم إلا له اسم: أبجد، هوز، حطي، كلمن، سعفص، قرشت \u003cspan class=\"isnad\">وقد حدث به عن حفص غير مصرف وقال: عنه، عن العلاء بن المسيب، قال: حَدَّثَنِي شيخ من كندة قال: \u003c/span>لقيت الضحاك بن مزاحم \u003cspan class=\"isnad\">فحدثني قال: سمعت زيد بن أرقم قال: \u003c/span>إن الله تعالى خلق السموات والأرض في ستة أيام، لكل يوم منها اسم: أبجد، هوز، حطي، كلمن، سعفص، قرشت.\u003c/p>\u003cp data-pair=\"42.4\" id=\"ar-odlomak-42-4\">وقال آخرون: بل خلق الله واحدا فسماه الأحد، وخلق ثانيا فسماه الاثنين، وخلق ثالثا فسماه الثلاثاء، ورابعا فسماه الأربعاء، وخامسا فسماه الخميس.\u003c/p>\u003cp data-pair=\"42.5\" id=\"ar-odlomak-42-5\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"42.6\" id=\"ar-odlomak-42-6\">\u003cspan class=\"isnad\">حَدَّثَنَا تَمِيمُ بن المنتصر، قال: أخبرنا إسحاق، عن شريك، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ خَلَقَ يَوْمًا وَاحِدًا فَسَمَّاهُ الأَحَدَ، ثُمَّ خَلَقَ ثَانِيًا فَسَمَّاهُ الاثْنَيْنَ، ثُمَّ خَلَقَ ثَالِثًا فَسَمَّاهُ الثُّلاثَاءَ، ثُمَّ خَلَقَ رَابِعًا فَسَمَّاهُ الأَرْبِعَاءَ، ثُمَّ خَلَقَ خَامِسًا فَسَمَّاهُ الْخَمِيسَ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 42\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"42.1\" id=\"odlomak-42-1\">Rečeno je da je ime jednoga od tih šest dana Ebdžed, drugoga Hevvez, trećega Hutti, četvrtoga Kelemen, petoga Sa‘fas, a šestoga Karešet. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: to su nazivi slovnih nizova أبجد، هوز، حطي، كلمن، سعفص، قرشت; sam arapski zapis ovdje nema potpune oznake za izgovor.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"42.2\" id=\"odlomak-42-2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"42.3\" id=\"odlomak-42-3\">\u003cspan class=\"isnad\">Pričao mi je Hadremi: rekao je: pričao nam je Musarrif ibn Amr el-Jami: pričao nam je Hafs ibn Gijas, od Alaa ibn el-Musejjeba, od jednog čovjeka iz Kinde, koji je rekao: čuo sam Dahhaka ibn Muzahima kako govori: \u003c/span>„Allah je stvorio nebesa i Zemlju u šest dana. Nema nijednog od njih a da nema ime: Ebdžed, Hevvez, Hutti, Kelemen, Sa‘fas, Karešet.“ \u003cspan class=\"isnad\">To je od Hafsa prenio i neko drugi, osim Musarrifa, pa je naveo: od njega, od Alaa ibn el-Musejjeba, koji je rekao: pričao mi je jedan starac iz Kinde: \u003c/span>„Sreo sam Dahhaka ibn Muzahima pa \u003cspan class=\"isnad\">mi je pričao: čuo sam Zejda ibn Erkama kako kaže: \u003c/span>‘Uzvišeni Allah stvorio je nebesa i Zemlju u šest dana. Svaki od njih ima ime: Ebdžed, Hevvez, Hutti, Kelemen, Sa‘fas, Karešet.’“\u003c/p>\u003cp data-pair=\"42.4\" id=\"odlomak-42-4\">Drugi su rekli: „Naprotiv, Allah je stvorio jedan dan i nazvao ga el-ehad; stvorio je drugi i nazvao ga el-isnejn; stvorio je treći i nazvao ga es-sulasa; četvrti je nazvao el-erbi‘a, a peti el-hamis.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: nazivi znače nedjelja, ponedjeljak, utorak, srijeda i četvrtak; arapski oblici sačuvani su jer se raspravlja o njihovim imenima.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"42.5\" id=\"odlomak-42-5\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"42.6\" id=\"odlomak-42-6\">\u003cspan class=\"isnad\">Pričao nam je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: \u003c/span>„Allah je stvorio jedan dan i nazvao ga el-ehad. Zatim je stvorio drugi i nazvao ga el-isnejn; zatim je stvorio treći i nazvao ga es-sulasa; zatim je stvorio četvrti i nazvao ga el-erbi‘a; zatim je stvorio peti i nazvao ga el-hamis.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":43,"html":"\u003csection class=\"page\" data-page=\"43\" id=\"stranica-43\">\u003ch2>Stranica 43\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 43\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"43.1\" id=\"ar-odlomak-43-1\">وَهَذَانِ الْقَوْلانِ غَيْرُ مُخْتَلِفَيْنِ، إِذْ كَانَ جَائِزًا ان تكون أَسْمَاءُ ذَلِكَ بِلِسَانِ الْعَرَبِ عَلَى مَا قَالَهُ عَطَاءٌ، وَبِلِسَانِ آخَرِينَ، عَلَى مَا قَالَهُ الضَّحَّاكُ بْنُ مُزَاحِمٍ.\u003c/p>\u003cp data-pair=\"43.2\" id=\"ar-odlomak-43-2\">وَقَدْ قِيلَ إِنَّ الأَيَّامَ سَبْعَةٌ لا سِتَّةٌ ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"43.3\" id=\"ar-odlomak-43-3\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ سهل بن عسكر، حَدَّثَنَا إسماعيل بن عبد الكريم، حَدَّثَنِي عبد الصمد بن معقل، قال: سمعت وهب بن منبه: \u003c/span>يقول: الأيام سبعة.\u003c/p>\u003cp data-pair=\"43.4\" id=\"ar-odlomak-43-4\">وكلا القولين- اللذين روينا أحدهما عن الضحاك وعطاء، من أن الله خلق الأيام الستة، والآخر منهما عن وهب بن منبه من أن الأيام سبعة- صحيح مؤتلف غير مختلف، وذلك أن معنى قول عطاء والضحاك في ذلك كان أن الأيام التي خلق الله فيهن الخلق من حين ابتدائه في خلق السماء والأرض وما فيهن إلى أن فرغ من جميعه ستة أيام، كما قال جل ثناؤه: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» ، وأن معنى قول وهب بن منبه في ذلك كان أن عدد الأيام التي هي أيام الجمعة سبعة أيام لا ستة.\u003c/p>\u003cp data-pair=\"43.5\" id=\"ar-odlomak-43-5\">واختلف السلف في اليوم الذي ابتدأ الله عز وجل فيه في خلق السموات والأرض، فقال بعضهم: ابتدأ في ذلك يوم الأحد.\u003c/p>\u003cp data-pair=\"43.6\" id=\"ar-odlomak-43-6\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"43.7\" id=\"ar-odlomak-43-7\">\u003cspan class=\"isnad\">حَدَّثَنَا إِسْحَاقُ بْنُ شَاهِينَ، حَدَّثَنَا خَالِدُ بْنُ عَبْدِ اللَّهِ، عَنِ الشَّيْبَانِيِّ، عَنْ عَوْنِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، عَنْ أَخِيهِ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، قَالَ: قَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: \u003c/span>إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى ابْتَدَأَ الْخَلْقَ، فَخَلَقَ الأَرْضَ يَوْمَ الأَحَدِ وَيَوْمَ الاثْنَيْنِ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 43\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"43.1\" id=\"odlomak-43-1\">Ova dva mišljenja nisu proturječna, jer je moguće da su nazivi tih dana na arapskom onakvi kakve je naveo Ata, a na jeziku drugih onakvi kakve je naveo Dahhak ibn Muzahim.\u003c/p>\u003cp data-pair=\"43.2\" id=\"odlomak-43-2\">Rečeno je i da dana ima sedam, a ne šest. Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"43.3\" id=\"odlomak-43-3\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sehl ibn Asker: pričao nam je Ismail ibn Abdulkerim: pričao mi je Abdussamed ibn Ma‘kil, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: \u003c/span>„Dana ima sedam.“\u003c/p>\u003cp data-pair=\"43.4\" id=\"odlomak-43-4\">Oba mišljenja koja smo prenijeli — jedno od Dahhaka i Ataa, da je Allah stvorio šest dana, a drugo od Vehba ibn Munebbiha, da dana ima sedam — ispravna su i međusobno usklađena, a ne proturječna. Ata i Dahhak time su mislili da je bilo šest dana u kojima je Allah stvarao stvorenja, od početka stvaranja neba, Zemlje i onoga što je u njima do dovršetka svega toga, kako je rekao Onaj čija je hvala uzvišena: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Vehb ibn Munebbih time je mislio da je broj dana koji čine sedmicu sedam, a ne šest. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"43.5\" id=\"odlomak-43-5\">Prethodnici su se razišli o danu u kojem je Allah, Silan i Uzvišen, počeo stvarati nebesa i Zemlju. Neki su rekli: „To je počeo u nedjelju.“\u003c/p>\u003cp data-pair=\"43.6\" id=\"odlomak-43-6\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"43.7\" id=\"odlomak-43-7\">\u003cspan class=\"isnad\">Pričao nam je Ishak ibn Šahin: pričao nam je Halid ibn Abdullah, od Šejbanija, od Avna ibn Abdullaha ibn Utbe, od njegovog brata Ubejdullaha ibn Abdullaha ibn Utbe, koji je rekao: Abdullah ibn Selam rekao je: \u003c/span>„Allah, Blagoslovljen i Uzvišen, započeo je stvaranje, pa je Zemlju stvorio u nedjelju i ponedjeljak.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":44,"html":"\u003csection class=\"page\" data-page=\"44\" id=\"stranica-44\">\u003ch2>Stranica 44\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 44\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"44.1\" id=\"ar-odlomak-44-1\">\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى بْنُ إِبْرَاهِيمَ، حَدَّثَنِي عَبْدُ اللَّهِ بْنُ صَالِحٍ، حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ \u003c/span>أَنَّهُ قَالَ: إِنَّ اللَّهَ عَزَّ وَجَلَّ بَدَأَ الْخَلْقَ يَوْمَ الأَحَدِ، فَخَلَقَ الأَرَضِينَ فِي الأَحَدِ وَالاثْنَيْنِ.\u003c/p>\u003cp data-pair=\"44.2\" id=\"ar-odlomak-44-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قَالَ: حَدَّثَنَا جرير، عن الأعمش، عن أبي صالح، عن كعب، قال: \u003c/span>بدأ الله خلق السموات والأرض يوم الأحد والاثنين.\u003c/p>\u003cp data-pair=\"44.3\" id=\"ar-odlomak-44-3\">\u003cspan class=\"isnad\">حَدَّثَنِي محمد بن أبي منصور الآملي، حَدَّثَنَا علي بن الهيثم، عن المسيب بن شريك، عن أبي روق، عن الضحاك \u003c/span>في قوله تعالى: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» قال: من أيام الآخرة، كل يوم مقداره الف سنه، ابتدأ الخلق يوم الأجد.\u003c/p>\u003cp data-pair=\"44.4\" id=\"ar-odlomak-44-4\">\u003cspan class=\"isnad\">حَدَّثَنِي المثنى، حَدَّثَنَا الحجاج، حَدَّثَنَا أبو عوانة، عن أبي بشر، عن مجاهد، قال: \u003c/span>بدأ الخلق يوم الأحد وقال آخرون: اليوم الذي ابتدأ الله فيه في ذلك يوم السبت.\u003c/p>\u003cp data-pair=\"44.5\" id=\"ar-odlomak-44-5\">ذكر من قال ذلك:\u003c/p>\u003cp data-pair=\"44.6\" id=\"ar-odlomak-44-6\">\u003cspan class=\"isnad\">حدثنا ابن حميد، قَالَ: حَدَّثَنَا سَلَمَةُ بْنُ الْفَضْلِ، قَالَ: حَدَّثَنِي محمد ابن أَبِي إِسْحَاقَ، قَالَ: \u003c/span>يَقُولُ أَهْلُ التَّوْرَاةِ: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ الأَحَدِ:\n\nوَقَالَ أَهْلُ: الإِنْجِيلِ: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ الاثْنَيْنِ وَنَقُولُ نَحْنُ الْمُسْلِمُونَ فِيمَا انْتَهَى إِلَيْنَا مِنْ رَسُولِ اللَّهِ ص: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ السَّبْتِ.\u003c/p>\u003cp data-pair=\"44.7\" id=\"ar-odlomak-44-7\">وَقَدْ رُوِيَ عن رسول الله ص الَّذِي قَالَ كُلُّ فَرِيقٍ مِنْ هَذَيْنِ الْفَرِيقَيْنِ اللَّذَيْنِ قَالَ أَحَدُهُمَا: ابْتَدَأَ اللَّهُ الْخَلْقَ فِي يَوْمِ الأَحَدِ، وَقَالَ الآخَرُ مِنْهُمَا:\n\nابْتَدَأَ فِي يَوْمِ السَّبْتِ، وَقَدْ مَضَى ذِكْرُنَا الْخَبَرَيْنِ، غَيْرَ أَنَّا نُعِيدُ مِنْ ذَلِكَ فِي هَذَا\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 44\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"44.1\" id=\"odlomak-44-1\">\u003cspan class=\"isnad\">Pričao mi je Musenna ibn Ibrahim: pričao mi je Abdullah ibn Salih: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, da je rekao: \u003c/span>„Allah, Silan i Uzvišen, započeo je stvaranje u nedjelju, pa je zemlje stvorio u nedjelju i ponedjeljak.“\u003c/p>\u003cp data-pair=\"44.2\" id=\"odlomak-44-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Džerir, od A‘meša, od Ebu Saliha, od Ka‘ba, koji je rekao: \u003c/span>„Allah je započeo stvaranje nebesa i Zemlje u nedjelju i ponedjeljak.“\u003c/p>\u003cp data-pair=\"44.3\" id=\"odlomak-44-3\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Ebu Mensur el-Amuli: pričao nam je Ali ibn el-Hejsem, od Musejjeba ibn Šerika, od Ebu Revka, od Dahhaka, \u003c/span>o riječima Uzvišenog: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Rekao je: „Od dana budućeg svijeta; svaki dan traje hiljadu godina. Stvaranje je započeo u nedjelju.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta. Napomena prevodioca: u zadnjoj riječi izvora piše الأجد, što izgleda kao greška umjesto الأحد („nedjelja“); čitanje je ovdje naznačeno, a arapski zapis ostavljen neizmijenjen.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"44.4\" id=\"odlomak-44-4\">\u003cspan class=\"isnad\">Pričao mi je Musenna: pričao nam je Hadždžadž: pričao nam je Ebu Avana, od Ebu Bišra, od Mudžahida, koji je rekao: \u003c/span>„Stvaranje je započeo u nedjelju.“ Drugi su rekli: „Dan u kojem je Allah to započeo bio je subota.“\u003c/p>\u003cp data-pair=\"44.5\" id=\"odlomak-44-5\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"44.6\" id=\"odlomak-44-6\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Selema ibn el-Fadl: rekao je: pričao mi je Muhammed ibn Ebu Ishak, koji je rekao: \u003c/span>„Sljedbenici Tevrata govore: ‘Allah je započeo stvaranje u nedjelju.’ Sljedbenici Indžila govore: ‘Allah je započeo stvaranje u ponedjeljak.’ A mi muslimani, prema onome što je do nas došlo od Allahovog Poslanika, sallallahu alejhi ve sellem, govorimo: ‘Allah je započeo stvaranje u subotu.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor ovdje navodi „Muhammed ibn Ebu Ishak“; ime nije samovoljno promijenjeno u drugačiji oblik.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"44.7\" id=\"odlomak-44-7\">Od Allahovog Poslanika, sallallahu alejhi ve sellem, preneseno je ono što tvrdi svaka od ove dvije skupine: jedna kaže da je Allah započeo stvaranje u nedjelju, a druga da je započeo u subotu. Već smo spomenuli obje predaje, ali ćemo na ovom\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":45,"html":"\u003csection class=\"page\" data-page=\"45\" id=\"stranica-45\">\u003ch2>Stranica 45\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 45\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"45.1\" id=\"ar-odlomak-45-1\">الْمَوْضِعِ بَعْضَ مَا فِيهِ مِنَ الدَّلالَةِ عَلَى صِحَّةِ قَوْلِ كُلِّ فَرِيقٍ مِنْهُم
