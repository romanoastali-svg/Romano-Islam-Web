je: „To je sedam zemalja, rasprostrtih kao otoci. Između svake dvije zemlje nalazi se more; more sve to okružuje, a hejkel je iza mora.“ Rečeno je da je između Njegovog stvaranja pera i stvaranja ostalih stvorenja bilo hiljadu godina."},{"id":"41.7","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"41.8","ar":"حَدَّثَنَا القاسم بن الحسن، قال: حَدَّثَنَا الحسين بن داود، قال: حَدَّثَنَا مبشر الحلبي، عن أرطاة بن المنذر، قال: سمعت ضمرة يقول: إن الله خلق القلم، فكتب به ما هو خالق وما هو كائن من خلقه، ثم إن ذلك الكتاب سبح الله ومجده ألف عام قبل أن يخلق شيئا من الخلق، فلما أراد جل جلاله خلق السموات والأرض خلق- فيما ذكر- أياما ستة، فسمى كل يوم منهن باسم غير الذي سمى به الآخر","bs":"Pričao nam je Kasim ibn el-Hasen: rekao je: pričao nam je Husejn ibn Davud: rekao je: pričao nam je Mubeššir el-Halebi, od Ertaa ibn el-Munzira, koji je rekao: čuo sam Damru kako govori: „Allah je stvorio pero, pa je njime zapisao ono što će stvoriti i ono što će biti od Njegovih stvorenja. Zatim je taj zapis hiljadu godina slavio i veličao Allaha, prije nego što je stvorio išta od stvorenja. Kada je, Uzvišeno je Njegovo veličanstvo, htio stvoriti nebesa i Zemlju, stvorio je — prema onome što je navedeno — šest dana, pa je svakome dao ime različito od imena drugoga.“","ar_ranges":[[0,130]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا القاسم بن الحسن، قال: حَدَّثَنَا الحسين بن داود، قال: حَدَّثَنَا مبشر الحلبي، عن أرطاة بن المنذر، قال: سمعت ضمرة يقول: \u003c/span>إن الله خلق القلم، فكتب به ما هو خالق وما هو كائن من خلقه، ثم إن ذلك الكتاب سبح الله ومجده ألف عام قبل أن يخلق شيئا من الخلق، فلما أراد جل جلاله خلق السموات والأرض خلق- فيما ذكر- أياما ستة، فسمى كل يوم منهن باسم غير الذي سمى به الآخر","bs_ranges":[[0,187]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Kasim ibn el-Hasen: rekao je: pričao nam je Husejn ibn Davud: rekao je: pričao nam je Mubeššir el-Halebi, od Ertaa ibn el-Munzira, koji je rekao: čuo sam Damru kako govori: \u003c/span>„Allah je stvorio pero, pa je njime zapisao ono što će stvoriti i ono što će biti od Njegovih stvorenja. Zatim je taj zapis hiljadu godina slavio i veličao Allaha, prije nego što je stvorio išta od stvorenja. Kada je, Uzvišeno je Njegovo veličanstvo, htio stvoriti nebesa i Zemlju, stvorio je — prema onome što je navedeno — šest dana, pa je svakome dao ime različito od imena drugoga.“"}],"notes":[]},{"n":42,"ar":"وقيل: إن اسم أحد تلك الأيام الستة أبجد، واسم الآخر منهن هوز، واسم الثالث منهن حطي، واسم الرابع منهن كلمن، واسم الخامس منهن سعفص، واسم السادس منهن قرشت.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنِي الحضرمي، قال: حَدَّثَنَا مصرف بن عمرو اليامى، حدثنا حفص ابن غياث، عن العلاء بن المسيب، عن رجل من كنده، قال: سمعت الضحاك ابن مزاحم يقول: خلق الله السموات والأرض في ستة أيام، ليس منها يوم إلا له اسم: أبجد، هوز، حطي، كلمن، سعفص، قرشت وقد حدث به عن حفص غير مصرف وقال: عنه، عن العلاء بن المسيب، قال: حَدَّثَنِي شيخ من كندة قال: لقيت الضحاك بن مزاحم فحدثني قال: سمعت زيد بن أرقم قال: إن الله تعالى خلق السموات والأرض في ستة أيام، لكل يوم منها اسم: أبجد، هوز، حطي، كلمن، سعفص، قرشت.\n\nوقال آخرون: بل خلق الله واحدا فسماه الأحد، وخلق ثانيا فسماه الاثنين، وخلق ثالثا فسماه الثلاثاء، ورابعا فسماه الأربعاء، وخامسا فسماه الخميس.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنَا تَمِيمُ بن المنتصر، قال: أخبرنا إسحاق، عن شريك، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّهَ خَلَقَ يَوْمًا وَاحِدًا فَسَمَّاهُ الأَحَدَ، ثُمَّ خَلَقَ ثَانِيًا فَسَمَّاهُ الاثْنَيْنَ، ثُمَّ خَلَقَ ثَالِثًا فَسَمَّاهُ الثُّلاثَاءَ، ثُمَّ خَلَقَ رَابِعًا فَسَمَّاهُ الأَرْبِعَاءَ، ثُمَّ خَلَقَ خَامِسًا فَسَمَّاهُ الْخَمِيسَ","bs":"\u003cp data-paragraph=\"42.1\">Rečeno je da je ime jednoga od tih šest dana Ebdžed, drugoga Hevvez, trećega Hutti, četvrtoga Kelemen, petoga Sa‘fas, a šestoga Karešet. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: to su nazivi slovnih nizova أبجد، هوز، حطي، كلمن، سعفص، قرشت; sam arapski zapis ovdje nema potpune oznake za izgovor.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"42.2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"42.3\">Pričao mi je Hadremi: rekao je: pričao nam je Musarrif ibn Amr el-Jami: pričao nam je Hafs ibn Gijas, od Alaa ibn el-Musejjeba, od jednog čovjeka iz Kinde, koji je rekao: čuo sam Dahhaka ibn Muzahima kako govori: „Allah je stvorio nebesa i Zemlju u šest dana. Nema nijednog od njih a da nema ime: Ebdžed, Hevvez, Hutti, Kelemen, Sa‘fas, Karešet.“ To je od Hafsa prenio i neko drugi, osim Musarrifa, pa je naveo: od njega, od Alaa ibn el-Musejjeba, koji je rekao: pričao mi je jedan starac iz Kinde: „Sreo sam Dahhaka ibn Muzahima pa mi je pričao: čuo sam Zejda ibn Erkama kako kaže: ‘Uzvišeni Allah stvorio je nebesa i Zemlju u šest dana. Svaki od njih ima ime: Ebdžed, Hevvez, Hutti, Kelemen, Sa‘fas, Karešet.’“\u003c/p>\u003cp data-paragraph=\"42.4\">Drugi su rekli: „Naprotiv, Allah je stvorio jedan dan i nazvao ga el-ehad; stvorio je drugi i nazvao ga el-isnejn; stvorio je treći i nazvao ga es-sulasa; četvrti je nazvao el-erbi‘a, a peti el-hamis.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: nazivi znače nedjelja, ponedjeljak, utorak, srijeda i četvrtak; arapski oblici sačuvani su jer se raspravlja o njihovim imenima.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"42.5\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"42.6\">Pričao nam je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Allah je stvorio jedan dan i nazvao ga el-ehad. Zatim je stvorio drugi i nazvao ga el-isnejn; zatim je stvorio treći i nazvao ga es-sulasa; zatim je stvorio četvrti i nazvao ga el-erbi‘a; zatim je stvorio peti i nazvao ga el-hamis.“\u003c/p>","paragraphs":[{"id":"42.1","ar":"وقيل: إن اسم أحد تلك الأيام الستة أبجد، واسم الآخر منهن هوز، واسم الثالث منهن حطي، واسم الرابع منهن كلمن، واسم الخامس منهن سعفص، واسم السادس منهن قرشت.","bs":"Rečeno je da je ime jednoga od tih šest dana Ebdžed, drugoga Hevvez, trećega Hutti, četvrtoga Kelemen, petoga Sa‘fas, a šestoga Karešet. ⟦Napomena prevodioca: to su nazivi slovnih nizova أبجد، هوز، حطي، كلمن، سعفص، قرشت; sam arapski zapis ovdje nema potpune oznake za izgovor.⟧","ar_ranges":[],"ar_html":"وقيل: إن اسم أحد تلك الأيام الستة أبجد، واسم الآخر منهن هوز، واسم الثالث منهن حطي، واسم الرابع منهن كلمن، واسم الخامس منهن سعفص، واسم السادس منهن قرشت.","bs_ranges":[],"bs_html":"Rečeno je da je ime jednoga od tih šest dana Ebdžed, drugoga Hevvez, trećega Hutti, četvrtoga Kelemen, petoga Sa‘fas, a šestoga Karešet. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: to su nazivi slovnih nizova أبجد، هوز، حطي، كلمن، سعفص، قرشت; sam arapski zapis ovdje nema potpune oznake za izgovor.⟧\u003c/span>"},{"id":"42.2","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"42.3","ar":"حَدَّثَنِي الحضرمي، قال: حَدَّثَنَا مصرف بن عمرو اليامى، حدثنا حفص ابن غياث، عن العلاء بن المسيب، عن رجل من كنده، قال: سمعت الضحاك ابن مزاحم يقول: خلق الله السموات والأرض في ستة أيام، ليس منها يوم إلا له اسم: أبجد، هوز، حطي، كلمن، سعفص، قرشت وقد حدث به عن حفص غير مصرف وقال: عنه، عن العلاء بن المسيب، قال: حَدَّثَنِي شيخ من كندة قال: لقيت الضحاك بن مزاحم فحدثني قال: سمعت زيد بن أرقم قال: إن الله تعالى خلق السموات والأرض في ستة أيام، لكل يوم منها اسم: أبجد، هوز، حطي، كلمن، سعفص، قرشت.","bs":"Pričao mi je Hadremi: rekao je: pričao nam je Musarrif ibn Amr el-Jami: pričao nam je Hafs ibn Gijas, od Alaa ibn el-Musejjeba, od jednog čovjeka iz Kinde, koji je rekao: čuo sam Dahhaka ibn Muzahima kako govori: „Allah je stvorio nebesa i Zemlju u šest dana. Nema nijednog od njih a da nema ime: Ebdžed, Hevvez, Hutti, Kelemen, Sa‘fas, Karešet.“ To je od Hafsa prenio i neko drugi, osim Musarrifa, pa je naveo: od njega, od Alaa ibn el-Musejjeba, koji je rekao: pričao mi je jedan starac iz Kinde: „Sreo sam Dahhaka ibn Muzahima pa mi je pričao: čuo sam Zejda ibn Erkama kako kaže: ‘Uzvišeni Allah stvorio je nebesa i Zemlju u šest dana. Svaki od njih ima ime: Ebdžed, Hevvez, Hutti, Kelemen, Sa‘fas, Karešet.’“","ar_ranges":[[0,147],[242,334],[355,389]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي الحضرمي، قال: حَدَّثَنَا مصرف بن عمرو اليامى، حدثنا حفص ابن غياث، عن العلاء بن المسيب، عن رجل من كنده، قال: سمعت الضحاك ابن مزاحم يقول: \u003c/span>خلق الله السموات والأرض في ستة أيام، ليس منها يوم إلا له اسم: أبجد، هوز، حطي، كلمن، سعفص، قرشت \u003cspan class=\"isnad\">وقد حدث به عن حفص غير مصرف وقال: عنه، عن العلاء بن المسيب، قال: حَدَّثَنِي شيخ من كندة قال: \u003c/span>لقيت الضحاك بن مزاحم \u003cspan class=\"isnad\">فحدثني قال: سمعت زيد بن أرقم قال: \u003c/span>إن الله تعالى خلق السموات والأرض في ستة أيام، لكل يوم منها اسم: أبجد، هوز، حطي، كلمن، سعفص، قرشت.","bs_ranges":[[0,213],[347,499],[533,583]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Hadremi: rekao je: pričao nam je Musarrif ibn Amr el-Jami: pričao nam je Hafs ibn Gijas, od Alaa ibn el-Musejjeba, od jednog čovjeka iz Kinde, koji je rekao: čuo sam Dahhaka ibn Muzahima kako govori: \u003c/span>„Allah je stvorio nebesa i Zemlju u šest dana. Nema nijednog od njih a da nema ime: Ebdžed, Hevvez, Hutti, Kelemen, Sa‘fas, Karešet.“ \u003cspan class=\"isnad\">To je od Hafsa prenio i neko drugi, osim Musarrifa, pa je naveo: od njega, od Alaa ibn el-Musejjeba, koji je rekao: pričao mi je jedan starac iz Kinde: \u003c/span>„Sreo sam Dahhaka ibn Muzahima pa \u003cspan class=\"isnad\">mi je pričao: čuo sam Zejda ibn Erkama kako kaže: \u003c/span>‘Uzvišeni Allah stvorio je nebesa i Zemlju u šest dana. Svaki od njih ima ime: Ebdžed, Hevvez, Hutti, Kelemen, Sa‘fas, Karešet.’“"},{"id":"42.4","ar":"وقال آخرون: بل خلق الله واحدا فسماه الأحد، وخلق ثانيا فسماه الاثنين، وخلق ثالثا فسماه الثلاثاء، ورابعا فسماه الأربعاء، وخامسا فسماه الخميس.","bs":"Drugi su rekli: „Naprotiv, Allah je stvorio jedan dan i nazvao ga el-ehad; stvorio je drugi i nazvao ga el-isnejn; stvorio je treći i nazvao ga es-sulasa; četvrti je nazvao el-erbi‘a, a peti el-hamis.“ ⟦Napomena prevodioca: nazivi znače nedjelja, ponedjeljak, utorak, srijeda i četvrtak; arapski oblici sačuvani su jer se raspravlja o njihovim imenima.⟧","ar_ranges":[],"ar_html":"وقال آخرون: بل خلق الله واحدا فسماه الأحد، وخلق ثانيا فسماه الاثنين، وخلق ثالثا فسماه الثلاثاء، ورابعا فسماه الأربعاء، وخامسا فسماه الخميس.","bs_ranges":[],"bs_html":"Drugi su rekli: „Naprotiv, Allah je stvorio jedan dan i nazvao ga el-ehad; stvorio je drugi i nazvao ga el-isnejn; stvorio je treći i nazvao ga es-sulasa; četvrti je nazvao el-erbi‘a, a peti el-hamis.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: nazivi znače nedjelja, ponedjeljak, utorak, srijeda i četvrtak; arapski oblici sačuvani su jer se raspravlja o njihovim imenima.⟧\u003c/span>"},{"id":"42.5","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"42.6","ar":"حَدَّثَنَا تَمِيمُ بن المنتصر، قال: أخبرنا إسحاق، عن شريك، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّهَ خَلَقَ يَوْمًا وَاحِدًا فَسَمَّاهُ الأَحَدَ، ثُمَّ خَلَقَ ثَانِيًا فَسَمَّاهُ الاثْنَيْنَ، ثُمَّ خَلَقَ ثَالِثًا فَسَمَّاهُ الثُّلاثَاءَ، ثُمَّ خَلَقَ رَابِعًا فَسَمَّاهُ الأَرْبِعَاءَ، ثُمَّ خَلَقَ خَامِسًا فَسَمَّاهُ الْخَمِيسَ","bs":"Pričao nam je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Allah je stvorio jedan dan i nazvao ga el-ehad. Zatim je stvorio drugi i nazvao ga el-isnejn; zatim je stvorio treći i nazvao ga es-sulasa; zatim je stvorio četvrti i nazvao ga el-erbi‘a; zatim je stvorio peti i nazvao ga el-hamis.“","ar_ranges":[[0,146]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا تَمِيمُ بن المنتصر، قال: أخبرنا إسحاق، عن شريك، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ خَلَقَ يَوْمًا وَاحِدًا فَسَمَّاهُ الأَحَدَ، ثُمَّ خَلَقَ ثَانِيًا فَسَمَّاهُ الاثْنَيْنَ، ثُمَّ خَلَقَ ثَالِثًا فَسَمَّاهُ الثُّلاثَاءَ، ثُمَّ خَلَقَ رَابِعًا فَسَمَّاهُ الأَرْبِعَاءَ، ثُمَّ خَلَقَ خَامِسًا فَسَمَّاهُ الْخَمِيسَ","bs_ranges":[[0,160]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: \u003c/span>„Allah je stvorio jedan dan i nazvao ga el-ehad. Zatim je stvorio drugi i nazvao ga el-isnejn; zatim je stvorio treći i nazvao ga es-sulasa; zatim je stvorio četvrti i nazvao ga el-erbi‘a; zatim je stvorio peti i nazvao ga el-hamis.“"}],"notes":[]},{"n":43,"ar":"وَهَذَانِ الْقَوْلانِ غَيْرُ مُخْتَلِفَيْنِ، إِذْ كَانَ جَائِزًا ان تكون أَسْمَاءُ ذَلِكَ بِلِسَانِ الْعَرَبِ عَلَى مَا قَالَهُ عَطَاءٌ، وَبِلِسَانِ آخَرِينَ، عَلَى مَا قَالَهُ الضَّحَّاكُ بْنُ مُزَاحِمٍ.\n\nوَقَدْ قِيلَ إِنَّ الأَيَّامَ سَبْعَةٌ لا سِتَّةٌ ذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنِي مُحَمَّدُ بْنُ سهل بن عسكر، حَدَّثَنَا إسماعيل بن عبد الكريم، حَدَّثَنِي عبد الصمد بن معقل، قال: سمعت وهب بن منبه: يقول: الأيام سبعة.\n\nوكلا القولين- اللذين روينا أحدهما عن الضحاك وعطاء، من أن الله خلق الأيام الستة، والآخر منهما عن وهب بن منبه من أن الأيام سبعة- صحيح مؤتلف غير مختلف، وذلك أن معنى قول عطاء والضحاك في ذلك كان أن الأيام التي خلق الله فيهن الخلق من حين ابتدائه في خلق السماء والأرض وما فيهن إلى أن فرغ من جميعه ستة أيام، كما قال جل ثناؤه: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» ، وأن معنى قول وهب بن منبه في ذلك كان أن عدد الأيام التي هي أيام الجمعة سبعة أيام لا ستة.\n\nواختلف السلف في اليوم الذي ابتدأ الله عز وجل فيه في خلق السموات والأرض، فقال بعضهم: ابتدأ في ذلك يوم الأحد.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنَا إِسْحَاقُ بْنُ شَاهِينَ، حَدَّثَنَا خَالِدُ بْنُ عَبْدِ اللَّهِ، عَنِ الشَّيْبَانِيِّ، عَنْ عَوْنِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، عَنْ أَخِيهِ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، قَالَ: قَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى ابْتَدَأَ الْخَلْقَ، فَخَلَقَ الأَرْضَ يَوْمَ الأَحَدِ وَيَوْمَ الاثْنَيْنِ","bs":"\u003cp data-paragraph=\"43.1\">Ova dva mišljenja nisu proturječna, jer je moguće da su nazivi tih dana na arapskom onakvi kakve je naveo Ata, a na jeziku drugih onakvi kakve je naveo Dahhak ibn Muzahim.\u003c/p>\u003cp data-paragraph=\"43.2\">Rečeno je i da dana ima sedam, a ne šest. Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"43.3\">Pričao mi je Muhammed ibn Sehl ibn Asker: pričao nam je Ismail ibn Abdulkerim: pričao mi je Abdussamed ibn Ma‘kil, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: „Dana ima sedam.“\u003c/p>\u003cp data-paragraph=\"43.4\">Oba mišljenja koja smo prenijeli — jedno od Dahhaka i Ataa, da je Allah stvorio šest dana, a drugo od Vehba ibn Munebbiha, da dana ima sedam — ispravna su i međusobno usklađena, a ne proturječna. Ata i Dahhak time su mislili da je bilo šest dana u kojima je Allah stvarao stvorenja, od početka stvaranja neba, Zemlje i onoga što je u njima do dovršetka svega toga, kako je rekao Onaj čija je hvala uzvišena: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Vehb ibn Munebbih time je mislio da je broj dana koji čine sedmicu sedam, a ne šest. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"43.5\">Prethodnici su se razišli o danu u kojem je Allah, Silan i Uzvišen, počeo stvarati nebesa i Zemlju. Neki su rekli: „To je počeo u nedjelju.“\u003c/p>\u003cp data-paragraph=\"43.6\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"43.7\">Pričao nam je Ishak ibn Šahin: pričao nam je Halid ibn Abdullah, od Šejbanija, od Avna ibn Abdullaha ibn Utbe, od njegovog brata Ubejdullaha ibn Abdullaha ibn Utbe, koji je rekao: Abdullah ibn Selam rekao je: „Allah, Blagoslovljen i Uzvišen, započeo je stvaranje, pa je Zemlju stvorio u nedjelju i ponedjeljak.“\u003c/p>","paragraphs":[{"id":"43.1","ar":"وَهَذَانِ الْقَوْلانِ غَيْرُ مُخْتَلِفَيْنِ، إِذْ كَانَ جَائِزًا ان تكون أَسْمَاءُ ذَلِكَ بِلِسَانِ الْعَرَبِ عَلَى مَا قَالَهُ عَطَاءٌ، وَبِلِسَانِ آخَرِينَ، عَلَى مَا قَالَهُ الضَّحَّاكُ بْنُ مُزَاحِمٍ.","bs":"Ova dva mišljenja nisu proturječna, jer je moguće da su nazivi tih dana na arapskom onakvi kakve je naveo Ata, a na jeziku drugih onakvi kakve je naveo Dahhak ibn Muzahim.","ar_ranges":[],"ar_html":"وَهَذَانِ الْقَوْلانِ غَيْرُ مُخْتَلِفَيْنِ، إِذْ كَانَ جَائِزًا ان تكون أَسْمَاءُ ذَلِكَ بِلِسَانِ الْعَرَبِ عَلَى مَا قَالَهُ عَطَاءٌ، وَبِلِسَانِ آخَرِينَ، عَلَى مَا قَالَهُ الضَّحَّاكُ بْنُ مُزَاحِمٍ.","bs_ranges":[],"bs_html":"Ova dva mišljenja nisu proturječna, jer je moguće da su nazivi tih dana na arapskom onakvi kakve je naveo Ata, a na jeziku drugih onakvi kakve je naveo Dahhak ibn Muzahim."},{"id":"43.2","ar":"وَقَدْ قِيلَ إِنَّ الأَيَّامَ سَبْعَةٌ لا سِتَّةٌ ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Rečeno je i da dana ima sedam, a ne šest. Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"وَقَدْ قِيلَ إِنَّ الأَيَّامَ سَبْعَةٌ لا سِتَّةٌ ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Rečeno je i da dana ima sedam, a ne šest. Spomen onih koji su to rekli:"},{"id":"43.3","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ سهل بن عسكر، حَدَّثَنَا إسماعيل بن عبد الكريم، حَدَّثَنِي عبد الصمد بن معقل، قال: سمعت وهب بن منبه: يقول: الأيام سبعة.","bs":"Pričao mi je Muhammed ibn Sehl ibn Asker: pričao nam je Ismail ibn Abdulkerim: pričao mi je Abdussamed ibn Ma‘kil, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: „Dana ima sedam.“","ar_ranges":[[0,126]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ سهل بن عسكر، حَدَّثَنَا إسماعيل بن عبد الكريم، حَدَّثَنِي عبد الصمد بن معقل، قال: سمعت وهب بن منبه: \u003c/span>يقول: الأيام سبعة.","bs_ranges":[[0,171]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sehl ibn Asker: pričao nam je Ismail ibn Abdulkerim: pričao mi je Abdussamed ibn Ma‘kil, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: \u003c/span>„Dana ima sedam.“"},{"id":"43.4","ar":"وكلا القولين- اللذين روينا أحدهما عن الضحاك وعطاء، من أن الله خلق الأيام الستة، والآخر منهما عن وهب بن منبه من أن الأيام سبعة- صحيح مؤتلف غير مختلف، وذلك أن معنى قول عطاء والضحاك في ذلك كان أن الأيام التي خلق الله فيهن الخلق من حين ابتدائه في خلق السماء والأرض وما فيهن إلى أن فرغ من جميعه ستة أيام، كما قال جل ثناؤه: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» ، وأن معنى قول وهب بن منبه في ذلك كان أن عدد الأيام التي هي أيام الجمعة سبعة أيام لا ستة.","bs":"Oba mišljenja koja smo prenijeli — jedno od Dahhaka i Ataa, da je Allah stvorio šest dana, a drugo od Vehba ibn Munebbiha, da dana ima sedam — ispravna su i međusobno usklađena, a ne proturječna. Ata i Dahhak time su mislili da je bilo šest dana u kojima je Allah stvarao stvorenja, od početka stvaranja neba, Zemlje i onoga što je u njima do dovršetka svega toga, kako je rekao Onaj čija je hvala uzvišena: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Vehb ibn Munebbih time je mislio da je broj dana koji čine sedmicu sedam, a ne šest. ⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧","ar_ranges":[],"ar_html":"وكلا القولين- اللذين روينا أحدهما عن الضحاك وعطاء، من أن الله خلق الأيام الستة، والآخر منهما عن وهب بن منبه من أن الأيام سبعة- صحيح مؤتلف غير مختلف، وذلك أن معنى قول عطاء والضحاك في ذلك كان أن الأيام التي خلق الله فيهن الخلق من حين ابتدائه في خلق السماء والأرض وما فيهن إلى أن فرغ من جميعه ستة أيام، كما قال جل ثناؤه: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» ، وأن معنى قول وهب بن منبه في ذلك كان أن عدد الأيام التي هي أيام الجمعة سبعة أيام لا ستة.","bs_ranges":[],"bs_html":"Oba mišljenja koja smo prenijeli — jedno od Dahhaka i Ataa, da je Allah stvorio šest dana, a drugo od Vehba ibn Munebbiha, da dana ima sedam — ispravna su i međusobno usklađena, a ne proturječna. Ata i Dahhak time su mislili da je bilo šest dana u kojima je Allah stvarao stvorenja, od početka stvaranja neba, Zemlje i onoga što je u njima do dovršetka svega toga, kako je rekao Onaj čija je hvala uzvišena: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Vehb ibn Munebbih time je mislio da je broj dana koji čine sedmicu sedam, a ne šest. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>"},{"id":"43.5","ar":"واختلف السلف في اليوم الذي ابتدأ الله عز وجل فيه في خلق السموات والأرض، فقال بعضهم: ابتدأ في ذلك يوم الأحد.","bs":"Prethodnici su se razišli o danu u kojem je Allah, Silan i Uzvišen, počeo stvarati nebesa i Zemlju. Neki su rekli: „To je počeo u nedjelju.“","ar_ranges":[],"ar_html":"واختلف السلف في اليوم الذي ابتدأ الله عز وجل فيه في خلق السموات والأرض، فقال بعضهم: ابتدأ في ذلك يوم الأحد.","bs_ranges":[],"bs_html":"Prethodnici su se razišli o danu u kojem je Allah, Silan i Uzvišen, počeo stvarati nebesa i Zemlju. Neki su rekli: „To je počeo u nedjelju.“"},{"id":"43.6","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"43.7","ar":"حَدَّثَنَا إِسْحَاقُ بْنُ شَاهِينَ، حَدَّثَنَا خَالِدُ بْنُ عَبْدِ اللَّهِ، عَنِ الشَّيْبَانِيِّ، عَنْ عَوْنِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، عَنْ أَخِيهِ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، قَالَ: قَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى ابْتَدَأَ الْخَلْقَ، فَخَلَقَ الأَرْضَ يَوْمَ الأَحَدِ وَيَوْمَ الاثْنَيْنِ","bs":"Pričao nam je Ishak ibn Šahin: pričao nam je Halid ibn Abdullah, od Šejbanija, od Avna ibn Abdullaha ibn Utbe, od njegovog brata Ubejdullaha ibn Abdullaha ibn Utbe, koji je rekao: Abdullah ibn Selam rekao je: „Allah, Blagoslovljen i Uzvišen, započeo je stvaranje, pa je Zemlju stvorio u nedjelju i ponedjeljak.“","ar_ranges":[[0,251]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا إِسْحَاقُ بْنُ شَاهِينَ، حَدَّثَنَا خَالِدُ بْنُ عَبْدِ اللَّهِ، عَنِ الشَّيْبَانِيِّ، عَنْ عَوْنِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، عَنْ أَخِيهِ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، قَالَ: قَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: \u003c/span>إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى ابْتَدَأَ الْخَلْقَ، فَخَلَقَ الأَرْضَ يَوْمَ الأَحَدِ وَيَوْمَ الاثْنَيْنِ","bs_ranges":[[0,209]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ishak ibn Šahin: pričao nam je Halid ibn Abdullah, od Šejbanija, od Avna ibn Abdullaha ibn Utbe, od njegovog brata Ubejdullaha ibn Abdullaha ibn Utbe, koji je rekao: Abdullah ibn Selam rekao je: \u003c/span>„Allah, Blagoslovljen i Uzvišen, započeo je stvaranje, pa je Zemlju stvorio u nedjelju i ponedjeljak.“"}],"notes":[]},{"n":44,"ar":"حَدَّثَنِي الْمُثَنَّى بْنُ إِبْرَاهِيمَ، حَدَّثَنِي عَبْدُ اللَّهِ بْنُ صَالِحٍ، حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ أَنَّهُ قَالَ: إِنَّ اللَّهَ عَزَّ وَجَلَّ بَدَأَ الْخَلْقَ يَوْمَ الأَحَدِ، فَخَلَقَ الأَرَضِينَ فِي الأَحَدِ وَالاثْنَيْنِ.\n\nحَدَّثَنَا ابن حميد، قَالَ: حَدَّثَنَا جرير، عن الأعمش، عن أبي صالح، عن كعب، قال: بدأ الله خلق السموات والأرض يوم الأحد والاثنين.\n\nحَدَّثَنِي محمد بن أبي منصور الآملي، حَدَّثَنَا علي بن الهيثم، عن المسيب بن شريك، عن أبي روق، عن الضحاك في قوله تعالى: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» قال: من أيام الآخرة، كل يوم مقداره الف سنه، ابتدأ الخلق يوم الأجد.\n\nحَدَّثَنِي المثنى، حَدَّثَنَا الحجاج، حَدَّثَنَا أبو عوانة، عن أبي بشر، عن مجاهد، قال: بدأ الخلق يوم الأحد وقال آخرون: اليوم الذي ابتدأ الله فيه في ذلك يوم السبت.\n\nذكر من قال ذلك:\n\nحدثنا ابن حميد، قَالَ: حَدَّثَنَا سَلَمَةُ بْنُ الْفَضْلِ، قَالَ: حَدَّثَنِي محمد ابن أَبِي إِسْحَاقَ، قَالَ: يَقُولُ أَهْلُ التَّوْرَاةِ: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ الأَحَدِ:\n\nوَقَالَ أَهْلُ: الإِنْجِيلِ: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ الاثْنَيْنِ وَنَقُولُ نَحْنُ الْمُسْلِمُونَ فِيمَا انْتَهَى إِلَيْنَا مِنْ رَسُولِ اللَّهِ ص: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ السَّبْتِ.\n\nوَقَدْ رُوِيَ عن رسول الله ص الَّذِي قَالَ كُلُّ فَرِيقٍ مِنْ هَذَيْنِ الْفَرِيقَيْنِ اللَّذَيْنِ قَالَ أَحَدُهُمَا: ابْتَدَأَ اللَّهُ الْخَلْقَ فِي يَوْمِ الأَحَدِ، وَقَالَ الآخَرُ مِنْهُمَا:\n\nابْتَدَأَ فِي يَوْمِ السَّبْتِ، وَقَدْ مَضَى ذِكْرُنَا الْخَبَرَيْنِ، غَيْرَ أَنَّا نُعِيدُ مِنْ ذَلِكَ فِي هَذَا","bs":"\u003cp data-paragraph=\"44.1\">Pričao mi je Musenna ibn Ibrahim: pričao mi je Abdullah ibn Salih: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, da je rekao: „Allah, Silan i Uzvišen, započeo je stvaranje u nedjelju, pa je zemlje stvorio u nedjelju i ponedjeljak.“\u003c/p>\u003cp data-paragraph=\"44.2\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Džerir, od A‘meša, od Ebu Saliha, od Ka‘ba, koji je rekao: „Allah je započeo stvaranje nebesa i Zemlje u nedjelju i ponedjeljak.“\u003c/p>\u003cp data-paragraph=\"44.3\">Pričao mi je Muhammed ibn Ebu Mensur el-Amuli: pričao nam je Ali ibn el-Hejsem, od Musejjeba ibn Šerika, od Ebu Revka, od Dahhaka, o riječima Uzvišenog: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Rekao je: „Od dana budućeg svijeta; svaki dan traje hiljadu godina. Stvaranje je započeo u nedjelju.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta. Napomena prevodioca: u zadnjoj riječi izvora piše الأجد, što izgleda kao greška umjesto الأحد („nedjelja“); čitanje je ovdje naznačeno, a arapski zapis ostavljen neizmijenjen.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"44.4\">Pričao mi je Musenna: pričao nam je Hadždžadž: pričao nam je Ebu Avana, od Ebu Bišra, od Mudžahida, koji je rekao: „Stvaranje je započeo u nedjelju.“ Drugi su rekli: „Dan u kojem je Allah to započeo bio je subota.“\u003c/p>\u003cp data-paragraph=\"44.5\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"44.6\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Selema ibn el-Fadl: rekao je: pričao mi je Muhammed ibn Ebu Ishak, koji je rekao: „Sljedbenici Tevrata govore: ‘Allah je započeo stvaranje u nedjelju.’ Sljedbenici Indžila govore: ‘Allah je započeo stvaranje u ponedjeljak.’ A mi muslimani, prema onome što je do nas došlo od Allahovog Poslanika, sallallahu alejhi ve sellem, govorimo: ‘Allah je započeo stvaranje u subotu.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor ovdje navodi „Muhammed ibn Ebu Ishak“; ime nije samovoljno promijenjeno u drugačiji oblik.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"44.7\">Od Allahovog Poslanika, sallallahu alejhi ve sellem, preneseno je ono što tvrdi svaka od ove dvije skupine: jedna kaže da je Allah započeo stvaranje u nedjelju, a druga da je započeo u subotu. Već smo spomenuli obje predaje, ali ćemo na ovom\u003c/p>","paragraphs":[{"id":"44.1","ar":"حَدَّثَنِي الْمُثَنَّى بْنُ إِبْرَاهِيمَ، حَدَّثَنِي عَبْدُ اللَّهِ بْنُ صَالِحٍ، حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ أَنَّهُ قَالَ: إِنَّ اللَّهَ عَزَّ وَجَلَّ بَدَأَ الْخَلْقَ يَوْمَ الأَحَدِ، فَخَلَقَ الأَرَضِينَ فِي الأَحَدِ وَالاثْنَيْنِ.","bs":"Pričao mi je Musenna ibn Ibrahim: pričao mi je Abdullah ibn Salih: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, da je rekao: „Allah, Silan i Uzvišen, započeo je stvaranje u nedjelju, pa je zemlje stvorio u nedjelju i ponedjeljak.“","ar_ranges":[[0,174]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى بْنُ إِبْرَاهِيمَ، حَدَّثَنِي عَبْدُ اللَّهِ بْنُ صَالِحٍ، حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ \u003c/span>أَنَّهُ قَالَ: إِنَّ اللَّهَ عَزَّ وَجَلَّ بَدَأَ الْخَلْقَ يَوْمَ الأَحَدِ، فَخَلَقَ الأَرَضِينَ فِي الأَحَدِ وَالاثْنَيْنِ.","bs_ranges":[[0,154]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musenna ibn Ibrahim: pričao mi je Abdullah ibn Salih: pričao mi je Ebu Ma‘š الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» قال: من أيام الآخرة، كل يوم مقداره الف سنه، ابتدأ الخلق يوم الأجد.","bs_ranges":[[0,131]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Ebu Mensur el-Amuli: pričao nam je Ali ibn el-Hejsem, od Musejjeba ibn Šerika, od Ebu Revka, od Dahhaka, \u003c/span>o riječima Uzvišenog: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Rekao je: „Od dana budućeg svijeta; svaki dan traje hiljadu godina. Stvaranje je započeo u nedjelju.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta. Napomena prevodioca: u zadnjoj riječi izvora piše الأجد, što izgleda kao greška umjesto الأحد („nedjelja“); čitanje je ovdje naznačeno, a arapski zapis ostavljen neizmijenjen.⟧\u003c/span>"},{"id":"44.4","ar":"حَدَّثَنِي المثنى، حَدَّثَنَا الحجاج، حَدَّثَنَا أبو عوانة، عن أبي بشر، عن مجاهد، قال: بدأ الخلق يوم الأحد وقال آخرون: اليوم الذي ابتدأ الله فيه في ذلك يوم السبت.","bs":"Pričao mi je Musenna: pričao nam je Hadždžadž: pričao nam je Ebu Avana, od Ebu Bišra, od Mudžahida, koji je rekao: „Stvaranje je započeo u nedjelju.“ Drugi su rekli: „Dan u kojem je Allah to započeo bio je subota.“","ar_ranges":[[0,87]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي المثنى، حَدَّثَنَا الحجاج، حَدَّثَنَا أبو عوانة، عن أبي بشر، عن مجاهد، قال: \u003c/span>بدأ الخلق يوم الأحد وقال آخرون: اليوم الذي ابتدأ الله فيه في ذلك يوم السبت.","bs_ranges":[[0,115]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musenna: pričao nam je Hadždžadž: pričao nam je Ebu Avana, od Ebu Bišra, od Mudžahida, koji je rekao: \u003c/span>„Stvaranje je započeo u nedjelju.“ Drugi su rekli: „Dan u kojem je Allah to započeo bio je subota.“"},{"id":"44.5","ar":"ذكر من قال ذلك:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذكر من قال ذلك:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"44.6","ar":"حدثنا ابن حميد، قَالَ: حَدَّثَنَا سَلَمَةُ بْنُ الْفَضْلِ، قَالَ: حَدَّثَنِي محمد ابن أَبِي إِسْحَاقَ، قَالَ: يَقُولُ أَهْلُ التَّوْرَاةِ: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ الأَحَدِ:\n\nوَقَالَ أَهْلُ: الإِنْجِيلِ: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ الاثْنَيْنِ وَنَقُولُ نَحْنُ الْمُسْلِمُونَ فِيمَا انْتَهَى إِلَيْنَا مِنْ رَسُولِ اللَّهِ ص: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ السَّبْتِ.","bs":"Pričao nam je Ibn Humejd: rekao je: pričao nam je Selema ibn el-Fadl: rekao je: pričao mi je Muhammed ibn Ebu Ishak, koji je rekao: „Sljedbenici Tevrata govore: ‘Allah je započeo stvaranje u nedjelju.’ Sljedbenici Indžila govore: ‘Allah je započeo stvaranje u ponedjeljak.’ A mi muslimani, prema onome što je do nas došlo od Allahovog Poslanika, sallallahu alejhi ve sellem, govorimo: ‘Allah je započeo stvaranje u subotu.’“ ⟦Napomena prevodioca: izvor ovdje navodi „Muhammed ibn Ebu Ishak“; ime nije samovoljno promijenjeno u drugačiji oblik.⟧","ar_ranges":[[0,110]],"ar_html":"\u003cspan class=\"isnad\">حدثنا ابن حميد، قَالَ: حَدَّثَنَا سَلَمَةُ بْنُ الْفَضْلِ، قَالَ: حَدَّثَنِي محمد ابن أَبِي إِسْحَاقَ، قَالَ: \u003c/span>يَقُولُ أَهْلُ التَّوْرَاةِ: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ الأَحَدِ:\n\nوَقَالَ أَهْلُ: الإِنْجِيلِ: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ الاثْنَيْنِ وَنَقُولُ نَحْنُ الْمُسْلِمُونَ فِيمَا انْتَهَى إِلَيْنَا مِنْ رَسُولِ اللَّهِ ص: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ السَّبْتِ.","bs_ranges":[[0,132]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Selema ibn el-Fadl: rekao je: pričao mi je Muhammed ibn Ebu Ishak, koji je rekao: \u003c/span>„Sljedbenici Tevrata govore: ‘Allah je započeo stvaranje u nedjelju.’ Sljedbenici Indžila govore: ‘Allah je započeo stvaranje u ponedjeljak.’ A mi muslimani, prema onome što je do nas došlo od Allahovog Poslanika, sallallahu alejhi ve sellem, govorimo: ‘Allah je započeo stvaranje u subotu.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor ovdje navodi „Muhammed ibn Ebu Ishak“; ime nije samovoljno promijenjeno u drugačiji oblik.⟧\u003c/span>"},{"id":"44.7","ar":"وَقَدْ رُوِيَ عن رسول الله ص الَّذِي قَالَ كُلُّ فَرِيقٍ مِنْ هَذَيْنِ الْفَرِيقَيْنِ اللَّذَيْنِ قَالَ أَحَدُهُمَا: ابْتَدَأَ اللَّهُ الْخَلْقَ فِي يَوْمِ الأَحَدِ، وَقَالَ الآخَرُ مِنْهُمَا:\n\nابْتَدَأَ فِي يَوْمِ السَّبْتِ، وَقَدْ مَضَى ذِكْرُنَا الْخَبَرَيْنِ، غَيْرَ أَنَّا نُعِيدُ مِنْ ذَلِكَ فِي هَذَا","bs":"Od Allahovog Poslanika, sallallahu alejhi ve sellem, preneseno je ono što tvrdi svaka od ove dvije skupine: jedna kaže da je Allah započeo stvaranje u nedjelju, a druga da je započeo u subotu. Već smo spomenuli obje predaje, ali ćemo na ovom","ar_ranges":[],"ar_html":"وَقَدْ رُوِيَ عن رسول الله ص الَّذِي قَالَ كُلُّ فَرِيقٍ مِنْ هَذَيْنِ الْفَرِيقَيْنِ اللَّذَيْنِ قَالَ أَحَدُهُمَا: ابْتَدَأَ اللَّهُ الْخَلْقَ فِي يَوْمِ الأَحَدِ، وَقَالَ الآخَرُ مِنْهُمَا:\n\nابْتَدَأَ فِي يَوْمِ السَّبْتِ، وَقَدْ مَضَى ذِكْرُنَا الْخَبَرَيْنِ، غَيْرَ أَنَّا نُعِيدُ مِنْ ذَلِكَ فِي هَذَا","bs_ranges":[],"bs_html":"Od Allahovog Poslanika, sallallahu alejhi ve sellem, preneseno je ono što tvrdi svaka od ove dvije skupine: jedna kaže da je Allah započeo stvaranje u nedjelju, a druga da je započeo u subotu. Već smo spomenuli obje predaje, ali ćemo na ovom"}],"notes":[]},{"n":45,"ar":"الْمَوْضِعِ بَعْضَ مَا فِيهِ مِنَ الدَّلالَةِ عَلَى صِحَّةِ قَوْلِ كُلِّ فَرِيقٍ مِنْهُمَا.\n\nفأما الخبر عنه بتحقيق ما قال القائلون: كان ابتداء الخلق يوم الأحد، فما حَدَّثَنَا بِهِ هَنَّادُ بن السري، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عَنِ ابْنِ عَبَّاسٍ- قَالَ هَنَّادٌ: وَقَرَأْتُ سَائِرَ الحديث- ان اليهود أتت النبي ص فَسَأَلَتْهُ عَنْ خَلْقِ السَّمَوَاتِ وَالأَرْضِ فَقَالَ: خَلَقَ اللَّهُ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ.\n\nوأما الخبر عنه بتحقيق ما قاله القائلون من أن ابتداء الخلق كان يوم السبت، فما حَدَّثَنِي القاسم بن بشر بن معروف والحسين بن علي الصدائي، قالا:\n\nحدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مَوْلَى أُمِّ سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [أخذ رسول الله ص بِيَدِي، فَقَالَ: خَلَقَ اللَّهُ التُّرْبَةَ يَوْمَ السَّبْتِ، وَخَلَقَ الْجِبَالَ يَوْمَ الأَحَدِ] .\n\nوأولى القولين في ذلك عندي بالصواب قول من قال: اليوم الذي ابتدأ الله تعالى ذكره فيه خلق السموات والأرض يوم الأحد، لإجماع السلف من أهل العلم على ذلك.\n\nفأما ما قال ابن إسحاق في ذلك، فإنه إنما استدل- بزعمه- على أن ذلك كذلك، لأن الله عز ذكره فرغ من خلق جميع خلقه يوم الجمعة، وذلك اليوم السابع، وفيه استوى على العرش، وجعل ذلك اليوم عيدا للمسلمين، ودليله على ما زعم أنه استدل به على صحه قوله فيما حكينا عنه من ذلك هو الدليل على خطئه فيه، وذلك ان الله تبارك وتعالى أخبر عباده في غير موضع من محكم تنزيله، أنه خلق السموات والأرض وما بينهما في ستة أيام، فقال: «اللَّهُ الَّذِي خَلَقَ","bs":"\u003cp data-paragraph=\"45.1\">mjestu ponoviti nešto od onoga u njima što ukazuje na ispravnost tvrdnje svake od tih dviju skupina.\u003c/p>\u003cp data-paragraph=\"45.2\">Što se tiče predaje od njega koja potvrđuje riječi onih koji kažu da je početak stvaranja bio u nedjelju, to je ono što nam je pričao Hennad ibn es-Serijj: rekao je: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa — Hennad je rekao: „Ostatak hadisa sam pročitao“ — da su Jevreji došli Vjerovjesniku, sallallahu alejhi ve sellem, pa ga pitali o stvaranju nebesa i Zemlje. On je rekao: „Allah je stvorio Zemlju u nedjelju i ponedjeljak.“\u003c/p>\u003cp data-paragraph=\"45.3\">Što se tiče predaje od njega koja potvrđuje riječi onih koji kažu da je početak stvaranja bio u subotu, to je ono što su mi pričali Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, uzeo me za ruku i rekao: ‘Allah je stvorio tlo u subotu, a planine je stvorio u nedjelju.’“\u003c/p>\u003cp data-paragraph=\"45.4\">Od ova dva mišljenja smatram ispravnijim ono prema kojem je dan u kojem je Allah, Uzvišen je spomen Njegov, počeo stvarati nebesa i Zemlju bio nedjelja, zbog saglasnosti učenih prethodnika o tome.\u003c/p>\u003cp data-paragraph=\"45.5\">Što se tiče onoga što je Ibn Ishak o tome rekao, on je, prema vlastitoj tvrdnji, zaključio da je tako zato što je Allah, Silan je spomen Njegov, dovršio stvaranje svih Svojih stvorenja u petak, koji je sedmi dan, da se toga dana uzvisio nad Aršom i da je taj dan učinio praznikom muslimana. Dokaz za koji tvrdi da njime potvrđuje ispravnost onoga što smo od njega naveli zapravo je dokaz njegove greške u tome. Allah, Blagoslovljen i Uzvišen, na više mjesta u Svojoj jasnoj Objavi obavijestio je Svoje robove da je stvorio nebesa, Zemlju i ono što je između njih u šest dana. Rekao je: „Allah je Taj koji je stvorio\u003c/p>","paragraphs":[{"id":"45.1","ar":"الْمَوْضِعِ بَعْضَ مَا فِيهِ مِنَ الدَّلالَةِ عَلَى صِحَّةِ قَوْلِ كُلِّ فَرِيقٍ مِنْهُمَا.","bs":"mjestu ponoviti nešto od onoga u njima što ukazuje na ispravnost tvrdnje svake od tih dviju skupina.","ar_ranges":[],"ar_html":"الْمَوْضِعِ بَعْضَ مَا فِيهِ مِنَ الدَّلالَةِ عَلَى صِحَّةِ قَوْلِ كُلِّ فَرِيقٍ مِنْهُمَا.","bs_ranges":[],"bs_html":"mjestu ponoviti nešto od onoga u njima što ukazuje na ispravnost tvrdnje svake od tih dviju skupina."},{"id":"45.2","ar":"فأما الخبر عنه بتحقيق ما قال القائلون: كان ابتداء الخلق يوم الأحد، فما حَدَّثَنَا بِهِ هَنَّادُ بن السري، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عَنِ ابْنِ عَبَّاسٍ- قَالَ هَنَّادٌ: وَقَرَأْتُ سَائِرَ الحديث- ان اليهود أتت النبي ص فَسَأَلَتْهُ عَنْ خَلْقِ السَّمَوَاتِ وَالأَرْضِ فَقَالَ: خَلَقَ اللَّهُ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ.","bs":"Što se tiče predaje od njega koja potvrđuje riječi onih koji kažu da je početak stvaranja bio u nedjelju, to je ono što nam je pričao Hennad ibn es-Serijj: rekao je: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa — Hennad je rekao: „Ostatak hadisa sam pročitao“ — da su Jevreji došli Vjerovjesniku, sallallahu alejhi ve sellem, pa ga pitali o stvaranju nebesa i Zemlje. On je rekao: „Allah je stvorio Zemlju u nedjelju i ponedjeljak.“","ar_ranges":[[71,247]],"ar_html":"فأما الخبر عنه بتحقيق ما قال القائلون: كان ابتداء الخلق يوم الأحد، فما \u003cspan class=\"isnad\">حَدَّثَنَا بِهِ هَنَّادُ بن السري، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عَنِ ابْنِ عَبَّاسٍ- قَالَ هَنَّادٌ: وَقَرَأْتُ سَائِرَ الحديث- \u003c/span>ان اليهود أتت النبي ص فَسَأَلَتْهُ عَنْ خَلْقِ السَّمَوَاتِ وَالأَرْضِ فَقَالَ: خَلَقَ اللَّهُ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ.","bs_ranges":[[120,301]],"bs_html":"Što se tiče predaje od njega koja potvrđuje riječi onih koji kažu da je početak stvaranja bio u nedjelju, to je ono što \u003cspan class=\"isnad\">nam je pričao Hennad ibn es-Serijj: rekao je: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa — Hennad je rekao: „Ostatak hadisa sam pročitao“ — \u003c/span>da su Jevreji došli Vjerovjesniku, sallallahu alejhi ve sellem, pa ga pitali o stvaranju nebesa i Zemlje. On je rekao: „Allah je stvorio Zemlju u nedjelju i ponedjeljak.“"},{"id":"45.3","ar":"وأما الخبر عنه بتحقيق ما قاله القائلون من أن ابتداء الخلق كان يوم السبت، فما حَدَّثَنِي القاسم بن بشر بن معروف والحسين بن علي الصدائي، قالا:\n\nحدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مَوْلَى أُمِّ سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [أخذ رسول الله ص بِيَدِي، فَقَالَ: خَلَقَ اللَّهُ التُّرْبَةَ يَوْمَ السَّبْتِ، وَخَلَقَ الْجِبَالَ يَوْمَ الأَحَدِ] .","bs":"Što se tiče predaje od njega koja potvrđuje riječi onih koji kažu da je početak stvaranja bio u subotu, to je ono što su mi pričali Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, uzeo me za ruku i rekao: ‘Allah je stvorio tlo u subotu, a planine je stvorio u nedjelju.’“","ar_ranges":[[77,283]],"ar_html":"وأما الخبر عنه بتحقيق ما قاله القائلون من أن ابتداء الخلق كان يوم السبت، فما \u003cspan class=\"isnad\">حَدَّثَنِي القاسم بن بشر بن معروف والحسين بن علي الصدائي، قالا:\n\nحدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مَوْلَى أُمِّ سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: \u003c/span>[أخذ رسول الله ص بِيَدِي، فَقَالَ: خَلَقَ اللَّهُ التُّرْبَةَ يَوْمَ السَّبْتِ، وَخَلَقَ الْجِبَالَ يَوْمَ الأَحَدِ] .","bs_ranges":[[203,388]],"bs_html":"Što se tiče predaje od njega koja potvrđuje riječi onih koji kažu da je početak stvaranja bio u subotu, to je ono što su mi pričali Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: \u003cspan class=\"isnad\">pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, uzeo me za ruku i rekao: ‘Allah je stvorio tlo u subotu, a planine je stvorio u nedjelju.’“"},{"id":"45.4","ar":"وأولى القولين في ذلك عندي بالصواب قول من قال: اليوم الذي ابتدأ الله تعالى ذكره فيه خلق السموات والأرض يوم الأحد، لإجماع السلف من أهل العلم على ذلك.","bs":"Od ova dva mišljenja smatram ispravnijim ono prema kojem je dan u kojem je Allah, Uzvišen je spomen Njegov, počeo stvarati nebesa i Zemlju bio nedjelja, zbog saglasnosti učenih prethodnika o tome.","ar_ranges":[],"ar_html":"وأولى القولين في ذلك عندي بالصواب قول من قال: اليوم الذي ابتدأ الله تعالى ذكره فيه خلق السموات والأرض يوم الأحد، لإجماع السلف من أهل العلم على ذلك.","bs_ranges":[],"bs_html":"Od ova dva mišljenja smatram ispravnijim ono prema kojem je dan u kojem je Allah, Uzvišen je spomen Njegov, počeo stvarati nebesa i Zemlju bio nedjelja, zbog saglasnosti učenih prethodnika o tome."},{"id":"45.5","ar":"فأما ما قال ابن إسحاق في ذلك، فإنه إنما استدل- بزعمه- على أن ذلك كذلك، لأن الله عز ذكره فرغ من خلق جميع خلقه يوم الجمعة، وذلك اليوم السابع، وفيه استوى على العرش، وجعل ذلك اليوم عيدا للمسلمين، ودليله على ما زعم أنه استدل به على صحه قوله فيما حكينا عنه من ذلك هو الدليل على خطئه فيه، وذلك ان الله تبارك وتعالى أخبر عباده في غير موضع من محكم تنزيله، أنه خلق السموات والأرض وما بينهما في ستة أيام، فقال: «اللَّهُ الَّذِي خَلَقَ","bs":"Što se tiče onoga što je Ibn Ishak o tome rekao, on je, prema vlastitoj tvrdnji, zaključio da je tako zato što je Allah, Silan je spomen Njegov, dovršio stvaranje svih Svojih stvorenja u petak, koji je sedmi dan, da se toga dana uzvisio nad Aršom i da je taj dan učinio praznikom muslimana. Dokaz za koji tvrdi da njime potvrđuje ispravnost onoga što smo od njega naveli zapravo je dokaz njegove greške u tome. Allah, Blagoslovljen i Uzvišen, na više mjesta u Svojoj jasnoj Objavi obavijestio je Svoje robove da je stvorio nebesa, Zemlju i ono što je između njih u šest dana. Rekao je: „Allah je Taj koji je stvorio","ar_ranges":[],"ar_html":"فأما ما قال ابن إسحاق في ذلك، فإنه إنما استدل- بزعمه- على أن ذلك كذلك، لأن الله عز ذكره فرغ من خلق جميع خلقه يوم الجمعة، وذلك اليوم السابع، وفيه استوى على العرش، وجعل ذلك اليوم عيدا للمسلمين، ودليله على ما زعم أنه استدل به على صحه قوله فيما حكينا عنه من ذلك هو الدليل على خطئه فيه، وذلك ان الله تبارك وتعالى أخبر عباده في غير موضع من محكم تنزيله، أنه خلق السموات والأرض وما بينهما في ستة أيام، فقال: «اللَّهُ الَّذِي خَلَقَ","bs_ranges":[],"bs_html":"Što se tiče onoga što je Ibn Ishak o tome rekao, on je, prema vlastitoj tvrdnji, zaključio da je tako zato što je Allah, Silan je spomen Njegov, dovršio stvaranje svih Svojih stvorenja u petak, koji je sedmi dan, da se toga dana uzvisio nad Aršom i da je taj dan učinio praznikom muslimana. Dokaz za koji tvrdi da njime potvrđuje ispravnost onoga što smo od njega naveli zapravo je dokaz njegove greške u tome. Allah, Blagoslovljen i Uzvišen, na više mjesta u Svojoj jasnoj Objavi obavijestio je Svoje robove da je stvorio nebesa, Zemlju i ono što je između njih u šest dana. Rekao je: „Allah je Taj koji je stvorio"}],"notes":[]},{"n":46,"ar":"السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوى عَلَى الْعَرْشِ مَا لَكُمْ مِنْ دُونِهِ مِنْ وَلِيٍّ وَلا شَفِيعٍ أَفَلا تَتَذَكَّرُونَ»\n\nوقال تعالى ذكره:\n«قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ ثُمَّ اسْتَوى إِلَى السَّماءِ وَهِيَ دُخانٌ فَقالَ لَها وَلِلْأَرْضِ ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ فَقَضاهُنَّ سَبْعَ سَماواتٍ فِي يَوْمَيْنِ وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها وَزَيَّنَّا السَّماءَ الدُّنْيا بِمَصابِيحَ وَحِفْظاً ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ» .\n\nولا خلاف بين جميع أهل العلم أن اليومين اللذين ذكرهما الله تبارك وتعالى في قوله: «فَقَضاهُنَّ سَبْعَ سَماواتٍ فِي يَوْمَيْنِ» داخلان في الأيام الستة اللاتي ذكرهن قبل ذلك، فمعلوم إذ كان الله عز وجل إنما خلق السموات والأرضين وما فيهن في ستة أيام، وكانت الأخبار مع ذلك متظاهرة عن رسول الله ص بان آخر ما خلق الله من خلقه آدم، وأن خلقه إياه كان في يوم الجمعة- إن يوم الجمعة الذي فرغ فيه من خلق خلقه داخل في الأيام الستة التي أخبر الله تعالى ذكره أنه خلق خلقه فيهن، لأن ذلك لو لم يكن داخلا في الأيام الستة كان إنما خلق خلقه في سبعة أيام، لا في ستة، وذلك خلاف ما جاء به التنزيل، فتبين إذا- إذ كان الأمر كالذي وصفنا في ذلك- أن أول الأيام التي ابتدأ الله فيها خلق السموات والارض وما فيهن من خلقه يوم الأحد، إذ كان الآخر يوم الجمعة، وذلك ستة أيام، كما قال ربنا جل جلاله.\n\nفأما الأخبار الواردة عن رسول الله ص وعن أصحابه بأن الفراغ من الخلق كان يوم الجمعة، فسنذكرها في مواضعها إن شاء الله تعالى","bs":"\u003cp data-paragraph=\"46.1\">nebesa, Zemlju i ono što je između njih u šest dana, zatim se uzvisio nad Aršom. Vi mimo Njega nemate ni zaštitnika ni zagovornika. Zar se nećete poučiti?“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: Es-Sedžda, 32:4.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"46.2\">I rekao je On, Uzvišen je spomen Njegov: „Reci: Zar vi doista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova! Na njoj je, povrh nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu opskrbu u četiri dana, jednako za one koji pitaju. Zatim se usmjerio prema nebu, a ono je bilo dim, pa je njemu i Zemlji rekao: ‘Dođite, milom ili silom!’ Rekli su: ‘Dolazimo poslušno.’ Potom je od njih u dva dana sačinio sedam nebesa i svakome nebu objavio njegovu odredbu. A najbliže nebo ukrasili smo svjetiljkama i kao zaštitu. To je određenje Silnoga, Sveznajućeg.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Fussilet, 41:9–12.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"46.3\">Svi učeni saglasni su da su dva dana koja Allah, Blagoslovljen i Uzvišen, spominje u riječima: „Potom je od njih u dva dana sačinio sedam nebesa“ uključena u šest dana koje je ranije spomenuo. Poznato je, dakle, budući da je Allah, Silan i Uzvišen, stvorio nebesa, zemlje i ono što je u njima samo u šest dana, te da uz to brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, jedna drugu potvrđuju da je posljednje Allahovo stvorenje bio Adem i da ga je stvorio u petak, da je petak u kojem je dovršio stvaranje Svojih stvorenja uključen u šest dana u kojima je, prema onome što je Allah, Uzvišen je spomen Njegov, objavio, stvorio Svoja stvorenja. Da taj dan nije uključen u šest dana, onda bi Svoja stvorenja stvorio u sedam, a ne u šest dana, što je suprotno onome što je doneseno Objavom. Prema tome, budući da je stvar onakva kakvom smo je opisali, jasno je da je prvi dan u kojem je Allah počeo stvarati nebesa, Zemlju i Svoja stvorenja u njima bio nedjelja, jer je posljednji bio petak. To je šest dana, kako je rekao naš Gospodar, Uzvišeno je Njegovo veličanstvo. \u003cspan class=\"translator-note\">⟦Ponovljeni kur’anski navod u ovom odlomku prijevod je dijela ajeta Fussilet, 41:12.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"46.4\">Što se tiče predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, i njegovih ashaba da je dovršetak stvaranja bio u petak, navest ćemo ih na njihovim mjestima, ako Uzvišeni Allah htjedne.\u003c/p>","paragraphs":[{"id":"46.1","ar":"السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوى عَلَى الْعَرْشِ مَا لَكُمْ مِنْ دُونِهِ مِنْ وَلِيٍّ وَلا شَفِيعٍ أَفَلا تَتَذَكَّرُونَ»","bs":"nebesa, Zemlju i ono što je između njih u šest dana, zatim se uzvisio nad Aršom. Vi mimo Njega nemate ni zaštitnika ni zagovornika. Zar se nećete poučiti?“ ⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: Es-Sedžda, 32:4.⟧","ar_ranges":[],"ar_html":"السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوى عَلَى الْعَرْشِ مَا لَكُمْ مِنْ دُونِهِ مِنْ وَلِيٍّ وَلا شَفِيعٍ أَفَلا تَتَذَكَّرُونَ»","bs_ranges":[],"bs_html":"nebesa, Zemlju i ono što je između njih u šest dana, zatim se uzvisio nad Aršom. Vi mimo Njega nemate ni zaštitnika ni zagovornika. Zar se nećete poučiti?“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: Es-Sedžda, 32:4.⟧\u003c/span>"},{"id":"46.2","ar":"وقال تعالى ذكره:\n«قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ ثُمَّ اسْتَوى إِلَى السَّماءِ وَهِيَ دُخانٌ فَقالَ لَها وَلِلْأَرْضِ ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ فَقَضاهُنَّ سَبْعَ سَماواتٍ فِي يَوْمَيْنِ وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها وَزَيَّنَّا السَّماءَ الدُّنْيا بِمَصابِيحَ وَحِفْظاً ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ» .","bs":"I rekao je On, Uzvišen je spomen Njegov: „Reci: Zar vi doista ne vjerujete u Onoga koji الفراغ من الخلق كان يوم الجمعة، فسنذكرها في مواضعها إن شاء الله تعالى","bs":"Što se tiče predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, i njegovih ashaba da je dovršetak stvaranja bio u petak, navest ćemo ih na njihovim mjestima, ako Uzvišeni Allah htjedne.","ar_ranges":[],"ar_html":"فأما الأخبار الواردة عن رسول الله ص وعن أصحابه بأن الفراغ من الخلق كان يوم الجمعة، فسنذكرها في مواضعها إن شاء الله تعالى","bs_ranges":[],"bs_html":"Što se tiče predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, i njegovih ashaba da je dovršetak stvaranja bio u petak, navest ćemo ih na njihovim mjestima, ako Uzvišeni Allah htjedne."}],"notes":[]},{"n":47,"ar":"القول فيما خلق الله في كل يوم من الأيام السته التي ذكر الله في كتابه أنه خلق فيهن السموات والأرض وما بينهما\n\nاختلف السلف من أهل العلم في ذلك:\n\nفقال بعضهم ما حَدَّثَنِي به المثنى بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا عَبْدُ اللَّهِ بْنُ صَالِحٍ، حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، أَنَّهُ قَالَ: إِنَّ اللَّهَ بَدَأَ الْخَلْقَ يَوْمَ الأَحَدِ، فَخَلَقَ الأَرَضِينَ فِي الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الأَقْوَاتَ وَالرَّوَاسِي فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ، وَخَلَقَ السَّمَوَاتِ فِي الْخَمِيسِ وَالْجُمُعَةِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ، فَخَلَقَ فِيهَا آدَمَ عَلَى عَجَلٍ، فَتِلْكَ السَّاعَةُ الَّتِي تَقُومُ فِيهَا السَّاعَةُ.\n\nحَدَّثَنِي مُوسَى بْنُ هَارُونَ، حَدَّثَنَا عَمْرُو بن حماد، حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من أصحاب النبي ص قَالُوا: جَعَلَ- يَعْنُونَ رَبَّنَا تَبَارَكَ وَتَعَالَى- سَبْعَ أَرَضِينَ فِي يَوْمَيْنِ: الأَحَدِ وَالاثْنَيْنِ، وَجَعَلَ فِيهَا رَوَاسِيَ أَنْ تَمِيدَ بِكُمْ، وَخَلَقَ الْجِبَالَ فِيهَا وأقوات أهلها، وشجرها وما ينبغي لها في يَوْمَيْنِ: فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ، ثُمَّ اسْتَوَى إِلَى السَّمَاءِ وَهِيَ دُخَانٌ فَجَعَلَهَا سَمَاءً وَاحِدَةً، ثُمَّ فَتَقَهَا فَجَعَلَهَا سَبْعَ سَمَوَاتٍ فِي يَوْمَيْنِ: الْخَمِيسِ وَالْجُمُعَةِ.\n\nحَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، قَالَ: أَخْبَرَنَا إسحاق، عن شريك، عن غالب ابن غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: خَلَقَ اللَّهُ الأَرْضَ فِي يَوْمَيْنِ الأَحَدِ وَالاثْنَيْنِ.\n\nففي قول هؤلاء خلقت الأرض قبل السماء، لأنها خلقت عندهم في الأحد والاثنين","bs":"\u003cp data-paragraph=\"47.1\">Rasprava o onome što je Allah stvorio svakoga od šest dana za koje je u Svojoj Knjizi naveo da je u njima stvorio nebesa, Zemlju i ono što je između njih\u003c/p>\u003cp data-paragraph=\"47.2\">Učeni prethodnici razišli su se o tome.\u003c/p>\u003cp data-paragraph=\"47.3\">Neki su rekli ono što mi je pričao Musenna ibn Ibrahim: rekao je: pričao nam je Abdullah ibn Salih: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, da je rekao: „Allah je započeo stvaranje u nedjelju. Zemlje je stvorio u nedjelju i ponedjeljak, opskrbu i čvrste planine u utorak i srijedu, a nebesa u četvrtak i petak. Dovršio je u posljednjem satu petka, pa je tada u žurbi stvorio Adema. To je sat u kojem će nastupiti Čas.“\u003c/p>\u003cp data-paragraph=\"47.4\">Pričao mi je Musa ibn Harun: pričao nam je Amr ibn Hammad: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji su rekli: „Učinio je — misleći na našeg Gospodara, Blagoslovljenog i Uzvišenog — sedam zemalja u dva dana: u nedjelju i ponedjeljak. Na njima je postavio čvrste planine da se ne ljuljaju s vama. Planine na njima, opskrbu njihovih stanovnika, njihovo drveće i ono što im treba stvorio je u dva dana: u utorak i srijedu. Zatim se usmjerio prema nebu, a ono je bilo dim, pa ga je učinio jednim nebom. Zatim ga je razdvojio i učinio ga sedmerim nebesima u dva dana: u četvrtak i petak.“\u003c/p>\u003cp data-paragraph=\"47.5\">Pričao nam je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Allah je stvorio Zemlju u dva dana: u nedjelju i ponedjeljak.“\u003c/p>\u003cp data-paragraph=\"47.6\">Prema riječima ovih ljudi, Zemlja je stvorena prije neba, jer je prema njima stvorena u nedjelju i ponedjeljak.\u003c/p>","paragraphs":[{"id":"47.1","ar":"القول فيما خلق الله في كل يوم من الأيام السته التي ذكر الله في كتابه أنه خلق فيهن السموات والأرض وما بينهما","bs":"Rasprava o onome što je Allah stvorio svakoga od šest dana za koje je u Svojoj Knjizi naveo da je u njima stvorio nebesa, Zemlju i ono što je između njih","ar_ranges":[],"ar_html":"القول فيما خلق الله في كل يوم من الأيام السته التي ذكر الله في كتابه أنه خلق فيهن السموات والأرض وما بينهما","bs_ranges":[],"bs_html":"Rasprava o onome što je Allah stvorio svakoga od šest dana za koje je u Svojoj Knjizi naveo da je u njima stvorio nebesa, Zemlju i ono što je između njih"},{"id":"47.2","ar":"اختلف السلف من أهل العلم في ذلك:","bs":"Učeni prethodnici razišli su se o tome.","ar_ranges":[],"ar_html":"اختلف السلف من أهل العلم في ذلك:","bs_ranges":[],"bs_html":"Učeni prethodnici razišli su se o tome."},{"id":"47.3","ar":"فقال بعضهم ما حَدَّثَنِي به المثنى بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا عَبْدُ اللَّهِ بْنُ صَالِحٍ، حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، أَنَّهُ قَالَ: إِنَّ اللَّهَ بَدَأَ الْخَلْقَ يَوْمَ الأَحَدِ، فَخَلَقَ الأَرَضِينَ فِي الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الأَقْوَاتَ وَالرَّوَاسِي فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ، وَخَلَقَ السَّمَوَاتِ فِي الْخَمِيسِ وَالْجُمُعَةِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ، فَخَلَقَ فِيهَا آدَمَ عَلَى عَجَلٍ، فَتِلْكَ السَّاعَةُ الَّتِي تَقُومُ فِيهَا السَّاعَةُ.","bs":"Neki su rekli ono što mi je pričao Musenna ibn Ibrahim: rekao je: pričao nam je Abdullah ibn Salih: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, da je rekao: „Allah je započeo stvaranje u nedjelju. Zemlje je stvorio u nedjelju i ponedjeljak, opskrbu i čvrste planine u utorak i srijedu, a nebesa u četvrtak i petak. Dovršio je u posljednjem satu petka, pa je tada u žurbi stvorio Adema. To je sat u kojem će nastupiti Čas.“","ar_ranges":[[14,194]],"ar_html":"فقال بعضهم ما \u003cspan class=\"isnad\">حَدَّثَنِي به المثنى بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا عَبْدُ اللَّهِ بْنُ صَالِحٍ، حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، \u003c/span>أَنَّهُ قَالَ: إِنَّ اللَّهَ بَدَأَ الْخَلْقَ يَوْمَ الأَحَدِ، فَخَلَقَ الأَرَضِينَ فِي الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الأَقْوَاتَ وَالرَّوَاسِي فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ، وَخَلَقَ السَّمَوَاتِ فِي الْخَمِيسِ وَالْجُمُعَةِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ، فَخَلَقَ فِيهَا آدَمَ عَلَى عَجَلٍ، فَتِلْكَ السَّاعَةُ الَّتِي تَقُومُ فِيهَا السَّاعَةُ.","bs_ranges":[[22,187]],"bs_html":"Neki su rekli ono što \u003cspan class=\"isnad\">mi je pričao Musenna ibn Ibrahim: rekao je: pričao nam je Abdullah ibn Salih: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, da je rekao: \u003c/span>„Allah je započeo stvaranje u nedjelju. Zemlje je stvorio u nedjelju i ponedjeljak, opskrbu i čvrste planine u utorak i srijedu, a nebesa u četvrtak i petak. Dovršio je u posljednjem satu petka, pa je tada u žurbi stvorio Adema. To je sat u kojem će nastupiti Čas.“"},{"id":"47.4","ar":"حَدَّثَنِي مُوسَى بْنُ هَارُونَ، حَدَّثَنَا عَمْرُو بن حماد، حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من أصحاب النبي ص قَالُوا: جَعَلَ- يَعْنُونَ رَبَّنَا تَبَارَكَ وَتَعَالَى- سَبْعَ أَرَضِينَ فِي يَوْمَيْنِ: الأَحَدِ وَالاثْنَيْنِ، وَجَعَلَ فِيهَا رَوَاسِيَ أَنْ تَمِيدَ بِكُمْ، وَخَلَقَ الْجِبَالَ فِيهَا وأقوات أهلها، وشجرها وما ينبغي لها في يَوْمَيْنِ: فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ، ثُمَّ اسْتَوَى إِلَى السَّمَاءِ وَهِيَ دُخَانٌ فَجَعَلَهَا سَمَاءً وَاحِدَةً، ثُمَّ فَتَقَهَا فَجَعَلَهَا سَبْعَ سَمَوَاتٍ فِي يَوْمَيْنِ: الْخَمِيسِ وَالْجُمُعَةِ.","bs":"Pričao mi je Musa ibn Harun: pričao nam je Amr ibn Hammad: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji su rekli: „Učinio je — misleći na našeg Gospodara, Blagoslovljenog i Uzvišenog — sedam zemalja u dva dana: u nedjelju i ponedjeljak. Na njima je postavio čvrste planine da se ne ljuljaju s vama. Planine na njima, opskrbu njihovih stanovnika, njihovo drveće i ono što im treba stvorio je u dva dana: u utorak i srijedu. Zatim se usmjerio prema nebu, a ono je bilo dim, pa ga je učinio jednim nebom. Zatim ga je razdvojio i učinio ga sedmerim nebesima u dva dana: u četvrtak i petak.“","ar_ranges":[[0,200]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بْنُ هَارُونَ، حَدَّثَنَا عَمْرُو بن حماد، حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من أصحاب النبي ص قَالُوا: \u003c/span>جَعَلَ- يَعْنُونَ رَبَّنَا تَبَارَكَ وَتَعَالَى- سَبْعَ أَرَضِينَ فِي يَوْمَيْنِ: الأَحَدِ وَالاثْنَيْنِ، وَجَعَلَ فِيهَا رَوَاسِيَ أَنْ تَمِيدَ بِكُمْ، وَخَلَقَ الْجِبَالَ فِيهَا وأقوات أهلها، وشجرها وما ينبغي لها في يَوْمَيْنِ: فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ، ثُمَّ اسْتَوَى إِلَى السَّمَاءِ وَهِيَ دُخَانٌ فَجَعَلَهَا سَمَاءً وَاحِدَةً، ثُمَّ فَتَقَهَا فَجَعَلَهَا سَبْعَ سَمَوَاتٍ فِي يَوْمَيْنِ: الْخَمِيسِ وَالْجُمُعَةِ.","bs_ranges":[[0,282]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musa ibn Harun: pričao nam je Amr ibn Hammad: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji su rekli: \u003c/span>„Učinio je — misleći na našeg Gospodara, Blagoslovljenog i Uzvišenog — sedam zemalja u dva dana: u nedjelju i ponedjeljak. Na njima je postavio čvrste planine da se ne ljuljaju s vama. Planine na njima, opskrbu njihovih stanovnika, njihovo drveće i ono što im treba stvorio je u dva dana: u utorak i srijedu. Zatim se usmjerio prema nebu, a ono je bilo dim, pa ga je učinio jednim nebom. Zatim ga je razdvojio i učinio ga sedmerim nebesima u dva dana: u četvrtak i petak.“"},{"id":"47.5","ar":"حَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، قَالَ: أَخْبَرَنَا إسحاق، عن شريك، عن غالب ابن غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: خَلَقَ اللَّهُ الأَرْضَ فِي يَوْمَيْنِ الأَحَدِ وَالاثْنَيْنِ.","bs":"Pričao nam je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Allah je stvorio Zemlju u dva dana: u nedjelju i ponedjeljak.“","ar_ranges":[[0,155]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، قَالَ: أَخْبَرَنَا إسحاق، عن شريك، عن غالب ابن غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>خَلَقَ اللَّهُ الأَرْضَ فِي يَوْمَيْنِ الأَحَدِ وَالاثْنَيْنِ.","bs_ranges":[[0,160]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: \u003c/span>„Allah je stvorio Zemlju u dva dana: u nedjelju i ponedjeljak.“"},{"id":"47.6","ar":"ففي قول هؤلاء خلقت الأرض قبل السماء، لأنها خلقت عندهم في الأحد والاثنين","bs":"Prema riječima ovih ljudi, Zemlja je stvorena prije neba, jer je prema njima stvorena u nedjelju i ponedjeljak.","ar_ranges":[],"ar_html":"ففي قول هؤلاء خلقت الأرض قبل السماء، لأنها خلقت عندهم في الأحد والاثنين","bs_ranges":[],"bs_html":"Prema riječima ovih ljudi, Zemlja je stvorena prije neba, jer je prema njima stvorena u nedjelju i ponedjeljak."}],"notes":[]},{"n":48,"ar":"وقال آخرون: خلق الله عز وجل الأرض قبل السماء بأقواتها من غير أن يدحوها، ثم استوى إلى السماء فسواهن سبع سموات، ثم دحا الأرض بعد ذلك.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنِي عَلِيُّ بْنُ دَاوُدَ، قَالَ: حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي مُعَاوِيَةُ، عَنْ عَلِيِّ بْنِ أَبِي طَلْحَةَ، عَنِ ابْنِ عَبَّاسٍ: قَوْلُهُ عَزَّ وَجَلَّ حَيْثُ ذَكَرَ خَلَقَ الأَرْضَ قَبْلَ السَّمَاءِ، ثُمَّ ذَكَرَ السَّمَاءَ قَبْلَ الأَرْضِ، وَذَلِكَ أَنَّ اللَّهَ خَلَقَ الأَرْضَ بِأَقْوَاتِهَا مِنْ غَيْرِ أَنْ يَدْحُوَهَا قَبْلَ السَّمَاءِ، ثُمَّ اسْتَوَى إلى السماء فسواهن سبع سموات، ثم دحا الأَرْضَ بَعْدَ ذَلِكَ، فَذَلِكَ قَوْلُهُ تَعَالَى: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» .\n\nحَدَّثَنِي مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ:\nحَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» ، يَعْنِي أَنَّهَ خَلَقَ السَّمَوَاتِ وَالأَرْضَ، فَلَمَّا فَرَغَ مِنَ السَّمَاءِ قَبْلَ أَنْ يَخْلُقَ أَقْوَاتَ الأَرْضِ بَثَّ أَقْوَاتَ الأَرْضِ فِيهَا بَعْدَ خَلْقِ السَّمَاءِ، وارسى الجبال- يعنى بذلك دحوها- وَلَمْ تَكُنْ تَصْلُحْ أَقْوَاتُ الأَرْضِ وَنَبَاتُهَا إِلا بِاللَّيْلِ وَالنَّهَارِ، فَذَلِكَ قَوْلُهُ عَزَّ وَجَلَّ: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» ، أَلَمْ تَسْمَعْ أَنَّهُ قَالَ: «أَخْرَجَ مِنْها ماءَها وَمَرْعاها» ؟\n\nقال أبو جعفر: والصواب من القول في ذلك عندنا ما قاله الذين قالوا:\nإن الله خلق الأرض يوم الأحد، وخلق السماء يوم الخميس، وخلق النجوم والشمس والقمر يوم الجمعة لصحة الخبر الذي ذكرنا قبل عن ابن عباس، عن رسول الله ص بذلك وغير مستحيل ما روينا في ذلك عن ابن عباس من القول، وهو أن يكون الله تعالى ذكره خلق الأرض ولم يدحها، ثم خلق السموات فسواهن، ثم دحا الأرض بعد ذلك، فأخرج منها ماءها","bs":"\u003cp data-paragraph=\"48.1\">Drugi su rekli: „Allah, Silan i Uzvišen, stvorio je Zemlju s njenom opskrbom prije neba, ali je nije rasprostro. Zatim se usmjerio prema nebu i od njih sačinio sedam nebesa, a potom je rasprostro Zemlju.“\u003c/p>\u003cp data-paragraph=\"48.2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"48.3\">Pričao mi je Ali ibn Davud: rekao je: pričao nam je Ebu Salih: rekao je: pričao mi je Muavija, od Alija ibn Ebu Talhe, od Ibn Abbasa, o riječima Njega, Silnog i Uzvišenog, gdje je spomenuo stvaranje Zemlje prije neba, a zatim spomenuo nebo prije Zemlje: „To je zato što je Allah stvorio Zemlju s njenom opskrbom prije neba, ali je nije rasprostro. Zatim se usmjerio prema nebu i od njih sačinio sedam nebesa, a nakon toga je rasprostro Zemlju. To su Njegove, Uzvišeni je On, riječi: ‘A Zemlju je nakon toga rasprostro.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Naziat, 79:30.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"48.4\">Pričao mi je Muhammed ibn Sa‘d: rekao je: pričao mi je moj otac: rekao je: pričao mi je moj amidža: rekao je: pričao mi je moj otac, od svoga oca, od Ibn Abbasa, o riječima: „A Zemlju je nakon toga rasprostro; iz nje je izveo njenu vodu i njene pašnjake, a planine učvrstio“: „To znači da je stvorio nebesa i Zemlju. Kada je dovršio nebo, prije nego što je stvorio opskrbu Zemlje, rasuo je njenu opskrbu po njoj nakon stvaranja neba i učvrstio planine — time se misli na njeno rasprostiranje. Opskrba Zemlje i njeno bilje nisu mogli uspijevati bez noći i dana. To su riječi Njega, Silnog i Uzvišenog: ‘A Zemlju je nakon toga rasprostro.’ Zar nisi čuo da je rekao: ‘Iz nje je izveo njenu vodu i njene pašnjake’?“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda, redom: En-Naziat, 79:30–32; 79:30; 79:31.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"48.5\">Ebu Džafer kaže: Ispravno je, prema našem mišljenju, ono što su rekli oni koji kažu da je Allah stvorio Zemlju u nedjelju, nebo u četvrtak, a zvijezde, Sunce i Mjesec u petak, zbog vjerodostojnosti predaje koju smo ranije o tome naveli od Ibn Abbasa, od Allahovog Poslanika, sallallahu alejhi ve sellem. Nije nemoguće ni ono što smo o tome prenijeli od Ibn Abbasa: da je Allah, Uzvišen je spomen Njegov, stvorio Zemlju, a nije je rasprostro, zatim je stvorio nebesa i uredio ih, a nakon toga je rasprostro Zemlju i iz nje izveo njenu vodu\u003c/p>","paragraphs":[{"id":"48.1","ar":"وقال آخرون: خلق الله عز وجل الأرض قبل السماء بأقواتها من غير أن يدحوها، ثم استوى إلى السماء فسواهن سبع سموات، ثم دحا الأرض بعد ذلك.","bs":"Drugi su rekli: „Allah, Silan i Uzvišen, stvorio je Zemlju s njenom opskrbom prije neba, ali je nije rasprostro. Zatim se usmjerio prema nebu i od njih sačinio sedam nebesa, a potom je rasprostro Zemlju.“","ar_ranges":[],"ar_html":"وقال آخرون: خلق الله عز وجل الأرض قبل السماء بأقواتها من غير أن يدحوها، ثم استوى إلى السماء فسواهن سبع سموات، ثم دحا الأرض بعد ذلك.","bs_ranges":[],"bs_html":"Drugi su rekli: „Allah, Silan i Uzvišen, stvorio je Zemlju s njenom opskrbom prije neba, ali je nije rasprostro. Zatim se usmjerio prema nebu i od njih sačinio sedam nebesa, a potom je rasprostro Zemlju.“"},{"id":"48.2","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"48.3","ar":"حَدَّثَنِي عَلِيُّ بْنُ دَاوُدَ، قَالَ: حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي مُعَاوِيَةُ، عَنْ عَلِيِّ بْنِ أَبِي طَلْحَةَ، عَنِ ابْنِ عَبَّاسٍ: قَوْلُهُ عَزَّ وَجَلَّ حَيْثُ ذَكَرَ خَلَقَ الأَرْضَ قَبْلَ السَّمَاءِ، ثُمَّ ذَكَرَ السَّمَاءَ قَبْلَ الأَرْضِ، وَذَلِكَ أَنَّ اللَّهَ خَلَقَ الأَرْضَ بِأَقْوَاتِهَا مِنْ غَيْرِ أَنْ يَدْحُوَهَا قَبْلَ السَّمَاءِ، ثُمَّ اسْتَوَى إلى السماء فسواهن سبع سموات، ثم دحا الأَرْضَ بَعْدَ ذَلِكَ، فَذَلِكَ قَوْلُهُ تَعَالَى: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» .","bs":"Pričao mi je Ali ibn Davud: rekao je: pričao nam je Ebu Salih: rekao je: pričao mi je Muavija, od Alija ibn Ebu Talhe, od Ibn Abbasa, o riječima Njega, Silnog i Uzvišenog, gdje je spomenuo stvaranje Zemlje prije neba, a zatim spomenuo nebo prije Zemlje: „To je zato što je Allah stvorio Zemlju s njenom opskrbom prije neba, ali je nije rasprostro. Zatim se usmjerio prema nebu i od njih sačinio sedam nebesa, a nakon toga je rasprostro Zemlju. To su Njegove, Uzvišeni je On, riječi: ‘A Zemlju je n رَجَ مِنْها ماءَها وَمَرْعاها» ؟","bs":"Pričao mi je Muhammed ibn Sa‘d: rekao je: pričao mi je moj otac: rekao je: pričao mi je moj amidža: rekao je: pričao mi je moj otac, od svoga oca, od Ibn Abbasa, o riječima: „A Zemlju je nakon toga rasprostro; iz nje je izveo njenu vodu i njene pašnjake, a planine učvrstio“: „To znači da je stvorio nebesa i Zemlju. Kada je dovršio nebo, prije nego što je stvorio opskrbu Zemlje, rasuo je njenu opskrbu po njoj nakon stvaranja neba i učvrstio planine — time se misli na njeno rasprostiranje. Opskrba Zemlje i njeno bilje nisu mogli uspijevati bez noći i dana. To su riječi Njega, Silnog i Uzvišenog: ‘A Zemlju je nakon toga rasprostro.’ Zar nisi čuo da je rekao: ‘Iz nje je izveo njenu vodu i njene pašnjake’?“ ⟦Prijevodi kur’anskih navoda, redom: En-Naziat, 79:30–32; 79:30; 79:31.⟧","ar_ranges":[[0,145]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ:\nحَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ: \u003c/span>«وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» ، يَعْنِي أَنَّهَ خَلَقَ السَّمَوَاتِ وَالأَرْضَ، فَلَمَّا فَرَغَ مِنَ السَّمَاءِ قَبْلَ أَنْ يَخْلُقَ أَقْوَاتَ الأَرْضِ بَثَّ أَقْوَاتَ الأَرْضِ فِيهَا بَعْدَ خَلْقِ السَّمَاءِ، وارسى الجبال- يعنى بذلك دحوها- وَلَمْ تَكُنْ تَصْلُحْ أَقْوَاتُ الأَرْضِ وَنَبَاتُهَا إِلا بِاللَّيْلِ وَالنَّهَارِ، فَذَلِكَ قَوْلُهُ عَزَّ وَجَلَّ: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» ، أَلَمْ تَسْمَعْ أَنَّهُ قَالَ: «أَخْرَجَ مِنْها ماءَها وَمَرْعاها» ؟","bs_ranges":[[0,162]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sa‘d: rekao je: pričao mi je moj otac: rekao je: pričao mi je moj amidža: rekao je: pričao mi je moj otac, od svoga oca, od Ibn Abbasa, \u003c/span>o riječima: „A Zemlju je nakon toga rasprostro; iz nje je izveo njenu vodu i njene pašnjake, a planine učvrstio“: „To znači da je stvorio nebesa i Zemlju. Kada je dovršio nebo, prije nego što je st
