n class=\"isnad\">Pričao nam je Temim ibn el-Muntesir: obavijestio nas je Ishak, od Šerika, od A‘meša, od Ebu Zabjana — ili Mudžahida — od Ibn Abbasa, \u003c/span>nešto slično tome."}],"notes":[]},{"n":34,"ar":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، حَدَّثَنَا ابْنُ ثَوْرٍ، قَالَ: حَدَّثَنَا مَعْمَرٌ، حَدَّثَنَا الأَعْمَشُ أَنَّ ابن عباس قال: إن أول شيء خلق الْقَلَمُ.\n\nحَدَّثَنَا ابْنُ حُمَيْدٍ، حَدَّثَنَا جَرِيرٌ، عَنْ عطاء، عن ابى الضحا مُسْلِمِ بْنِ صُبَيْحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ أَوَّلَ شَيْءٍ خَلَقَ رَبِّي عَزَّ وَجَلَّ القلم، فقال له: اكتب، فكتب ما هو كَائِنٌ إِلَى أَنْ تَقُومَ السَّاعَةُ.\n\nوَقَالَ آخَرُونَ: بَلْ أَوَّلُ شَيْءٍ خَلَقَ اللَّهُ عَزَّ وَجَلَّ مِنْ خَلْقِهِ النُّورُ وَالظُّلْمَةُ.\n\nذِكْرُ مَنْ قَالَ ذلك:\n\nحدثنا ابن حميد، قال: حدثنا سلمة بْنُ الْفَضْلِ، قَالَ: قَالَ ابْنُ إِسْحَاقَ:\nكَانَ أَوَّلَ مَا خَلَقَ اللَّهُ عَزَّ وَجَلَّ النُّورُ وَالظُّلْمَةُ، ثُمَّ مَيَّزَ بَيْنَهُمَا، فَجَعَلَ الظُّلْمَةَ لَيْلا أَسْوَدَ مُظْلِمًا، وَجَعَلَ النُّورَ نَهَارًا مُضِيئًا مُبْصِرًا.\n\nقال أبو جعفر: وأولى القولين في ذلك عِنْدِي بِالصَّوَابِ قَوْلُ ابْنِ عَبَّاسٍ، لِلْخَبَرِ الَّذِي ذكرت عن [رسول الله ص قبل، أَنَّهُ قَالَ:\n\nأَوَّلُ شَيْءٍ خَلَقَ اللَّهُ الْقَلَمَ] .\n\nفَإِنْ قَالَ لَنَا قَائِلٌ: فَإِنَّكَ قُلْتَ: أَوْلَى الْقَوْلَيْنِ- اللَّذَيْنِ أَحَدُهُمَا أَنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ مِنْ خَلْقِهِ الْقَلَمَ، وَالآخَرُ أَنَّهُ النُّورُ وَالظُّلْمَةُ- قَوْلُ مَنْ قَالَ: إِنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ مِنْ خَلْقِهِ الْقَلَمَ، فَمَا وَجْهُ الرِّوَايَةِ عَنِ ابْنِ عَبَّاسٍ الَّتِي حَدَّثَكُمُوهَا ابْنُ بَشَّارٍ قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ، حَدَّثَنَا سُفْيَانُ، عَنْ أَبِي هَاشِمٍ، عَنْ مُجَاهِدٍ، قَالَ: قُلْتُ لابْنِ عَبَّاسٍ: إِنَّ نَاسًا يُكَذِّبُونَ بِالْقَدَرِ، فَقَالَ: إِنَّهُمْ يُكَذِّبُونَ بِكِتَابِ اللَّهِ، لآخُذَنَّ بِشَعْرِ أَحَدِهِمْ فَلأَنْفُضَنَّ بِهِ، إِنَّ اللَّهَ تَعَالَى ذَكَرَهُ كَانَ عَلَى عَرْشِهِ قَبْلَ أَنْ يَخْلُقَ شَيْئًا، فَكَانَ أَوَّلُ مَا خَلَقَ اللَّهُ الْقَلَمَ، فَجَرَى بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ،","bs":"\u003cp data-paragraph=\"34.1\">Pričao nam je Muhammed ibn Abdula‘la: pričao nam je Ibn Sevr, koji je rekao: pričao nam je Ma‘mer: pričao nam je A‘meš da je Ibn Abbas rekao: „Prvo što je stvoreno bilo je pero.“\u003c/p>\u003cp data-paragraph=\"34.2\">Pričao nam je Ibn Humejd: pričao nam je Džerir, od Ataa, od Ebu Duhaa Muslima ibn Subejha, od Ibn Abbasa, koji je rekao: „Prvo što je moj Gospodar, Silan i Uzvišen, stvorio bilo je pero. Rekao mu je: ‘Piši!’ I ono je zapisalo ono što će biti do nastupanja Časa.“\u003c/p>\u003cp data-paragraph=\"34.3\">Drugi su rekli: „Naprotiv, prvo što je Allah, Silan i Uzvišen, stvorio od Svojih stvorenja bili su svjetlost i tama.“\u003c/p>\u003cp data-paragraph=\"34.4\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"34.5\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Selema ibn el-Fadl, koji je rekao: Ibn Ishak rekao je: „Prvo što je Allah, Silan i Uzvišen, stvorio bili su svjetlost i tama. Zatim ih je razdvojio, pa je tamu učinio crnom, mračnom noći, a svjetlost sjajnim danom u kojem se vidi.“\u003c/p>\u003cp data-paragraph=\"34.6\">Ebu Džafer kaže: Smatram da je od ova dva mišljenja ispravnije mišljenje Ibn Abbasa, zbog predaje koju sam ranije naveo od Allahovog Poslanika, sallallahu alejhi ve sellem, da je rekao: „Prvo što je Allah stvorio bilo je pero.“\u003c/p>\u003cp data-paragraph=\"34.7\">Ako nam neko kaže: „Rekao si da je od dva mišljenja — jednog da je prvo Allahovo stvorenje bilo pero, a drugog da su to bili svjetlost i tama — ispravnije mišljenje onoga koji kaže da je prvo Allahovo stvorenje bilo pero. Kakvo je onda značenje predaje od Ibn Abbasa koju vam je pričao Ibn Beššar: pričao nam je Abdurrahman: pričao nam je Sufjan, od Ebu Hašima, od Mudžahida, koji je rekao: ‘Rekao sam Ibn Abbasu: Neki ljudi poriču određenje. Odgovorio je: Oni poriču Allahovu Knjigu! Uhvatit ću jednoga od njih za kosu i dobro ga protresti! Allah, Uzvišen je spomen Njegov, bio je na Svome Aršu prije nego što je išta stvorio. Prvo što je Allah stvorio bilo je pero i ono je ispisalo ono što će biti do Kijametskog dana,\u003c/p>","paragraphs":[{"id":"34.1","ar":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، حَدَّثَنَا ابْنُ ثَوْرٍ، قَالَ: حَدَّثَنَا مَعْمَرٌ، حَدَّثَنَا الأَعْمَشُ أَنَّ ابن عباس قال: إن أول شيء خلق الْقَلَمُ.","bs":"Pričao nam je Muhammed ibn Abdula‘la: pričao nam je Ibn Sevr, koji je rekao: pričao nam je Ma‘mer: pričao nam je A‘meš da je Ibn Abbas rekao: „Prvo što je stvoreno bilo je pero.“","ar_ranges":[[0,139]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، حَدَّثَنَا ابْنُ ثَوْرٍ، قَالَ: حَدَّثَنَا مَعْمَرٌ، حَدَّثَنَا الأَعْمَشُ أَنَّ ابن عباس قال: \u003c/span>إن أول شيء خلق الْقَلَمُ.","bs_ranges":[[0,119]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Abdula‘la: pričao nam je Ibn Sevr, koji je rekao: pričao nam je Ma‘mer: pričao nam je A‘meš \u003c/span>da je Ibn Abbas rekao: „Prvo što je stvoreno bilo je pero.“"},{"id":"34.2","ar":"حَدَّثَنَا ابْنُ حُمَيْدٍ، حَدَّثَنَا جَرِيرٌ، عَنْ عطاء، عن ابى الضحا مُسْلِمِ بْنِ صُبَيْحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ أَوَّلَ شَيْءٍ خَلَقَ رَبِّي عَزَّ وَجَلَّ القلم، فقال له: اكتب، فكتب ما هو كَائِنٌ إِلَى أَنْ تَقُومَ السَّاعَةُ.","bs":"Pričao nam je Ibn Humejd: pričao nam je Džerir, od Ataa, od Ebu Duhaa Muslima ibn Subejha, od Ibn Abbasa, koji je rekao: „Prvo što je moj Gospodar, Silan i Uzvišen, stvorio bilo je pero. Rekao mu je: ‘Piši!’ I ono je zapisalo ono što će biti do nastupanja Časa.“","ar_ranges":[[0,123]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، حَدَّثَنَا جَرِيرٌ، عَنْ عطاء، عن ابى الضحا مُسْلِمِ بْنِ صُبَيْحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ أَوَّلَ شَيْءٍ خَلَقَ رَبِّي عَزَّ وَجَلَّ القلم، فقال له: اكتب، فكتب ما هو كَائِنٌ إِلَى أَنْ تَقُومَ السَّاعَةُ.","bs_ranges":[[0,121]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: pričao nam je Džerir, od Ataa, od Ebu Duhaa Muslima ibn Subejha, od Ibn Abbasa, koji je rekao: \u003c/span>„Prvo što je moj Gospodar, Silan i Uzvišen, stvorio bilo je pero. Rekao mu je: ‘Piši!’ I ono je zapisalo ono što će biti do nastupanja Časa.“"},{"id":"34.3","ar":"وَقَالَ آخَرُونَ: بَلْ أَوَّلُ شَيْءٍ خَلَقَ اللَّهُ عَزَّ وَجَلَّ مِنْ خَلْقِهِ النُّورُ وَالظُّلْمَةُ.","bs":"Drugi su rekli: „Naprotiv, prvo što je Allah, Silan i Uzvišen, stvorio od Svojih stvorenja bili su svjetlost i tama.“","ar_ranges":[],"ar_html":"وَقَالَ آخَرُونَ: بَلْ أَوَّلُ شَيْءٍ خَلَقَ اللَّهُ عَزَّ وَجَلَّ مِنْ خَلْقِهِ النُّورُ وَالظُّلْمَةُ.","bs_ranges":[],"bs_html":"Drugi su rekli: „Naprotiv, prvo što je Allah, Silan i Uzvišen, stvorio od Svojih stvorenja bili su svjetlost i tama.“"},{"id":"34.4","ar":"ذِكْرُ مَنْ قَالَ ذلك:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذلك:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"34.5","ar":"حدثنا ابن حميد، قال: حدثنا سلمة بْنُ الْفَضْلِ، قَالَ: قَالَ ابْنُ إِسْحَاقَ:\nكَانَ أَوَّلَ مَا خَلَقَ اللَّهُ عَزَّ وَجَلَّ النُّورُ وَالظُّلْمَةُ، ثُمَّ مَيَّزَ بَيْنَهُمَا، فَجَعَلَ الظُّلْمَةَ لَيْلا أَسْوَدَ مُظْلِمًا، وَجَعَلَ النُّورَ نَهَارًا مُضِيئًا مُبْصِرًا.","bs":"Pričao nam je Ibn Humejd: rekao je: pričao nam je Selema ibn el-Fadl, koji je rekao: Ibn Ishak rekao je: „Prvo što je Allah, Silan i Uzvišen, stvorio bili su svjetlost i tama. Zatim ih je razdvojio, pa je tamu učinio crnom, mračnom noći, a svjetlost sjajnim danom u kojem se vidi.“","ar_ranges":[[0,78]],"ar_html":"\u003cspan class=\"isnad\">حدثنا ابن حميد، قال: حدثنا سلمة بْنُ الْفَضْلِ، قَالَ: قَالَ ابْنُ إِسْحَاقَ:\n\u003c/span>كَانَ أَوَّلَ مَا خَلَقَ اللَّهُ عَزَّ وَجَلَّ النُّورُ وَالظُّلْمَةُ، ثُمَّ مَيَّزَ بَيْنَهُمَا، فَجَعَلَ الظُّلْمَةَ لَيْلا أَسْوَدَ مُظْلِمًا، وَجَعَلَ النُّورَ نَهَارًا مُضِيئًا مُبْصِرًا.","bs_ranges":[[0,105]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Selema ibn el-Fadl, koji je rekao: Ibn Ishak rekao je: \u003c/span>„Prvo što je Allah, Silan i Uzvišen, stvorio bili su svjetlost i tama. Zatim ih je razdvojio, pa je tamu učinio crnom, mračnom noći, a svjetlost sjajnim danom u kojem se vidi.“"},{"id":"34.6","ar":"قال أبو جعفر: وأولى القولين في ذلك عِنْدِي بِالصَّوَابِ قَوْلُ ابْنِ عَبَّاسٍ، لِلْخَبَرِ الَّذِي ذكرت عن [رسول الله ص قبل، أَنَّهُ قَالَ:\n\nأَوَّلُ شَيْءٍ خَلَقَ اللَّهُ الْقَلَمَ] .","bs":"Ebu Džafer kaže: Smatram da je od ova dva mišljenja ispravnije mišljenje Ibn Abbasa, zbog predaje koju sam ranije naveo od Allahovog Poslanika, sallallahu alejhi ve sellem, da je rekao: „Prvo što je Allah stvorio bilo je pero.“","ar_ranges":[],"ar_html":"قال أبو جعفر: وأولى القولين في ذلك عِنْدِي بِالصَّوَابِ قَوْلُ ابْنِ عَبَّاسٍ، لِلْخَبَرِ الَّذِي ذكرت عن [رسول الله ص قبل، أَنَّهُ قَالَ:\n\nأَوَّلُ شَيْءٍ خَلَقَ اللَّهُ الْقَلَمَ] .","bs_ranges":[],"bs_html":"Ebu Džafer kaže: Smatram da je od ova dva mišljenja ispravnije mišljenje Ibn Abbasa, zbog predaje koju sam ranije naveo od Allahovog Poslanika, sallallahu alejhi ve sellem, da je rekao: „Prvo što je Allah stvorio bilo je pero.“"},{"id":"34.7","ar":"فَإِنْ قَالَ لَنَا قَائِلٌ: فَإِنَّكَ قُلْتَ: أَوْلَى الْقَوْلَيْنِ- اللَّذَيْنِ أَحَدُهُمَا أَنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ مِنْ خَلْقِهِ الْقَلَمَ، وَالآخَرُ أَنَّهُ النُّورُ وَالظُّلْمَةُ- قَوْلُ مَنْ قَالَ: إِنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ مِنْ خَلْقِهِ الْقَلَمَ، فَمَا وَجْهُ الرِّوَايَةِ عَنِ ابْنِ عَبَّاسٍ الَّتِي حَدَّثَكُمُوهَا ابْنُ بَشَّارٍ قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ، حَدَّثَنَا سُفْيَانُ، عَنْ أَبِي هَاشِمٍ، عَنْ مُجَاهِدٍ، قَالَ: قُلْتُ لابْنِ عَبَّاسٍ: إِنَّ نَاسًا يُكَذِّبُونَ بِالْقَدَرِ، فَقَالَ: إِنَّهُمْ يُكَذِّبُونَ بِكِتَابِ اللَّهِ، لآخُذَنَّ بِشَعْرِ أَحَدِهِمْ فَلأَنْفُضَنَّ بِهِ، إِنَّ اللَّهَ تَعَالَى ذَكَرَهُ كَانَ عَلَى عَرْشِهِ قَبْلَ أَنْ يَخْلُقَ شَيْئًا، فَكَانَ أَوَّلُ مَا خَلَقَ اللَّهُ الْقَلَمَ، فَجَرَى بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ،","bs":"Ako nam neko kaže: „Rekao si da je od dva mišljenja — jednog da je prvo Allahovo stvorenje bilo pero, a drugog da su to bili svjetlost i tama — ispravnije mišljenje onoga koji kaže da je prvo Allahovo stvorenje bilo pero. Kakvo je onda značenje predaje od Ibn Abbasa koju vam je pričao Ibn Beššar: pričao nam je Abdurrahman: pričao nam je Sufjan, od Ebu Hašima, od Mudžahida, koji je rekao: ‘Rekao sam Ibn Abbasu: Neki ljudi poriču određenje. Odgovorio je: Oni poriču Allahovu Knjigu! Uhvatit ću jednoga od njih za kosu i dobro ga protresti! Allah, Uzvišen je spomen Njegov, bio je na Svome Aršu prije nego što je išta stvorio. Prvo što je Allah stvorio bilo je pero i ono je ispisalo ono što će biti do Kijametskog dana,","ar_ranges":[[368,464]],"ar_html":"فَإِنْ قَالَ لَنَا قَائِلٌ: فَإِنَّكَ قُلْتَ: أَوْلَى الْقَوْلَيْنِ- اللَّذَيْنِ أَحَدُهُمَا أَنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ مِنْ خَلْقِهِ الْقَلَمَ، وَالآخَرُ أَنَّهُ النُّورُ وَالظُّلْمَةُ- قَوْلُ مَنْ قَالَ: إِنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ مِنْ خَلْقِهِ الْقَلَمَ، فَمَا وَجْهُ الرِّوَايَةِ عَنِ ابْنِ عَبَّاسٍ الَّتِي حَدَّثَكُمُوهَا ابْنُ بَشَّارٍ قَالَ: \u003cspan class=\"isnad\">حَدَّثَنَا عَبْدُ الرَّحْمَنِ، حَدَّثَنَا سُفْيَانُ، عَنْ أَبِي هَاشِمٍ، عَنْ مُجَاهِدٍ، قَالَ: \u003c/span>قُلْتُ لابْنِ عَبَّاسٍ: إِنَّ نَاسًا يُكَذِّبُونَ بِالْقَدَرِ، فَقَالَ: إِنَّهُمْ يُكَذِّبُونَ بِكِتَابِ اللَّهِ، لآخُذَنَّ بِشَعْرِ أَحَدِهِمْ فَلأَنْفُضَنَّ بِهِ، إِنَّ اللَّهَ تَعَالَى ذَكَرَهُ كَانَ عَلَى عَرْشِهِ قَبْلَ أَنْ يَخْلُقَ شَيْئًا، فَكَانَ أَوَّلُ مَا خَلَقَ اللَّهُ الْقَلَمَ، فَجَرَى بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ،","bs_ranges":[[298,391]],"bs_html":"Ako nam neko kaže: „Rekao si da je od dva mišljenja — jednog da je prvo Allahovo stvorenje bilo pero, a drugog da su to bili svjetlost i tama — ispravnije mišljenje onoga koji kaže da je prvo Allahovo stvorenje bilo pero. Kakvo je onda značenje predaje od Ibn Abbasa koju vam je pričao Ibn Beššar: \u003cspan class=\"isnad\">pričao nam je Abdurrahman: pričao nam je Sufjan, od Ebu Hašima, od Mudžahida, koji je rekao: \u003c/span>‘Rekao sam Ibn Abbasu: Neki ljudi poriču određenje. Odgovorio je: Oni poriču Allahovu Knjigu! Uhvatit ću jednoga od njih za kosu i dobro ga protresti! Allah, Uzvišen je spomen Njegov, bio je na Svome Aršu prije nego što je išta stvorio. Prvo što je Allah stvorio bilo je pero i ono je ispisalo ono što će biti do Kijametskog dana,"}],"notes":[]},{"n":35,"ar":"وَإِنَّمَا يَجْرِي النَّاسُ عَلَى أَمْرٍ قَدْ فُرِغَ مِنْهُ؟.\n\nوعن ابن إسحاق، التي حدثكموها ابن حميد، قال: حدثنا سلمة، عن ابن إسحاق، قال: يقول الله عز وجل: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ وَكانَ عَرْشُهُ عَلَى الْماءِ» ، فكان كما وصف نفسه عز وجل، إذ ليس إلا الماء عليه العرش، وعلى العرش ذو الجلال والإكرام، فكان أول ما خلق الله النور والظلمة؟\n\nقيل: أما قول ابن عباس: إن الله تبارك وتعالى كان عرشه على الماء قبل أن يخلق شيئا، فكان أول ما خلق الله القلم- إن كان صحيحا عنه أنه قاله- فهو خبر منه أن الله خلق القلم بعد خلقه عرشه، وقد روى عن أبي هاشم هذا الخبر شعبة، ولم يقل فيه ما قال سفيان، من أن الله عز وجل كان على عرشه، فكان أول ما خلق القلم، بل روى ذلك كالذي رواه سائر من ذكرنا من الرواة عن ابن عباس أنه قال: أول ما خلق الله عز وجل القلم.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنِي عَبْدُ الصَّمَدِ، قَالَ: حَدَّثَنَا شُعْبَةُ، قَالَ: حَدَّثَنَا أَبُو هَاشِمٍ، سَمِعَ مُجَاهِدًا قَالَ: سَمِعْتُ عَبْدَ اللَّهِ- لا يَدْرِي ابْنَ عُمَرَ أَوِ ابْنَ عَبَّاسٍ- قَالَ: إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ الْقَلَمُ فَقَالَ لَهُ: اجْرِ، فَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ، وَإِنَّمَا يَعْمَلُ النَّاسُ الْيَوْمَ فِيمَا قَدْ فُرِغَ مِنْهُ.\n\nوَكَذَلِكَ قَوْلُ ابْنِ إِسْحَاقَ الَّذِي ذَكَرْنَاهُ عَنْهُ مَعْنَاهُ أَنَّ اللَّهَ خَلَقَ النُّورَ وَالظُّلْمَةَ بَعْدَ خَلْقِهِ عَرْشَهُ، وَالْمَاءَ الَّذِي عَلَيْهِ عَرْشُهُ وَقَوْلُ رَسُولِ اللَّهِ ص الَّذِي رَوَيْنَاهُ عَنْهُ أَوْلَى قَوْلٍ فِي ذَلِكَ بِالصَّوَابِ، لأَنَّهُ كَانَ أَعْلَمَ قَائِلٍ فِي ذَلِكَ قولا بحقيقته وصحته، [وقد روينا عنه ع أَنَّهُ قَالَ: أَوَّلُ شَيْءٍ خَلَقَهُ اللَّهُ عَزَّ وَجَلَّ الْقَلَمُ] مِنْ غَيْرِ اسْتِثْنَاءٍ مِنْهُ شَيْئًا مِنَ الأَشْيَاءِ أَنَهُّ تَقَدَّمَ خَلْقَ اللَّهِ إِيَّاهُ خلق القلم، بل عم [بقوله ص: ان أول شيء خلقه الله القلم،] كل","bs":"\u003cp data-paragraph=\"35.1\">a ljudi se samo kreću u okviru onoga što je već dovršeno?’\u003c/p>\u003cp data-paragraph=\"35.2\">A kakvo je značenje predaje od Ibn Ishaka koju vam je pričao Ibn Humejd: rekao je: pričao nam je Selema, od Ibn Ishaka, koji je rekao: ‘Allah, Silan i Uzvišen, kaže: On je Taj koji je nebesa i Zemlju stvorio u šest dana, a Njegov Arš bio je na vodi. Bio je onako kako je, Silan i Uzvišen, Sebe opisao: nije bilo ničega osim vode nad kojom je bio Arš, a na Aršu Onaj kojem pripadaju veličanstvo i plemenitost; prvo što je Allah stvorio bili su svjetlost i tama?’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta. Preostale riječi pripadaju navedenoj predaji.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"35.3\">Odgovara se: Što se tiče Ibn Abbasovih riječi da je Arš Allaha, Blagoslovljenog i Uzvišenog, bio na vodi prije nego što je išta stvorio i da je prvo što je Allah stvorio bilo pero — ako je vjerodostojno da je to rekao — time on izvještava da je Allah stvorio pero nakon što je stvorio Svoj Arš. Ovu predaju od Ebu Hašima prenio je i Šu‘ba, ali u njoj nije naveo ono što je naveo Sufjan: da je Allah, Silan i Uzvišen, bio na Svome Aršu, a da je prvo što je stvorio bilo pero. Naprotiv, prenio ju je onako kako su je prenijeli ostali prenosioci koje smo spomenuli od Ibn Abbasa, da je rekao: „Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero.“\u003c/p>\u003cp data-paragraph=\"35.4\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"35.5\">Pričao nam je Ibn el-Musenna: rekao je: pričao mi je Abdussamed: rekao je: pričao nam je Šu‘ba: rekao je: pričao nam je Ebu Hašim, koji je čuo Mudžahida kako kaže: čuo sam Abdullaha — ne zna da li Ibn Omera ili Ibn Abbasa — kako kaže: „Prvo što je Allah stvorio bilo je pero. Rekao mu je: ‘Teci!’ I pero je ispisalo ono što će biti. Ljudi danas postupaju samo u okviru onoga što je već dovršeno.“\u003c/p>\u003cp data-paragraph=\"35.6\">Isto tako, riječi Ibn Ishaka koje smo od njega naveli znače da je Allah stvorio svjetlost i tamu nakon što je stvorio Svoj Arš i vodu na kojoj je Njegov Arš. Riječi Allahovog Poslanika, sallallahu alejhi ve sellem, koje smo od njega prenijeli, najpreče je smatrati ispravnim u ovom pitanju, jer je od svih koji su o tome govorili on najbolje poznavao njegovu stvarnost i tačnost. Od njega, alejhis-selam, prenijeli smo da je rekao: „Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero“, ne izdvajajući ništa od stvari čije bi stvaranje prethodilo Allahovom stvaranju pera. Naprotiv, svojim riječima, sallallahu alejhi ve sellem: „Prvo što je Allah stvorio bilo je pero“, obuhvatio je svaku\u003c/p>","paragraphs":[{"id":"35.1","ar":"وَإِنَّمَا يَجْرِي النَّاسُ عَلَى أَمْرٍ قَدْ فُرِغَ مِنْهُ؟.","bs":"a ljudi se samo kreću u okviru onoga što je već dovršeno?’","ar_ranges":[],"ar_html":"وَإِنَّمَا يَجْرِي النَّاسُ عَلَى أَمْرٍ قَدْ فُرِغَ مِنْهُ؟.","bs_ranges":[],"bs_html":"a ljudi se samo kreću u okviru onoga što je već dovršeno?’"},{"id":"35.2","ar":"وعن ابن إسحاق، التي حدثكموها ابن حميد، قال: حدثنا سلمة، عن ابن إسحاق، قال: يقول الله عز وجل: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ وَكانَ عَرْشُهُ عَلَى الْماءِ» ، فكان كما وصف نفسه عز وجل، إذ ليس إلا الماء عليه العرش، وعلى العرش ذو الجلال والإكرام، فكان أول ما خلق الله النور والظلمة؟","bs":"A kakvo je značenje predaje od Ibn Ishaka koju vam je pričao Ibn Humejd: rekao je: pričao nam je Selema, od Ibn Ishaka, koji je rekao: ‘Allah, Silan i Uzvišen, kaže: On je Taj koji je nebesa i Zemlju stvorio u šest dana, a Njegov Arš bio je na vodi. Bio je onako kako je, Silan i Uzvišen, Sebe opisao: nije bilo ničega osim vode nad kojom je bio Arš, a na Aršu Onaj kojem pripadaju veličanstvo i plemenitost; prvo što je Allah stvorio bili su svjetlost i tama?’“ ⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta. Preostale riječi pripadaju navedenoj predaji.⟧","ar_ranges":[[44,75]],"ar_html":"وعن ابن إسحاق، التي حدثكموها ابن حميد، قال: \u003cspan class=\"isnad\">حدثنا سلمة، عن ابن إسحاق، قال: \u003c/span>يقول الله عز وجل: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ وَكانَ عَرْشُهُ عَلَى الْماءِ» ، فكان كما وصف نفسه عز وجل، إذ ليس إلا الماء عليه العرش، وعلى العرش ذو الجلال والإكرام، فكان أول ما خلق الله النور والظلمة؟","bs_ranges":[[83,135]],"bs_html":"A kakvo je značenje predaje od Ibn Ishaka koju vam je pričao Ibn Humejd: rekao je: \u003cspan class=\"isnad\">pričao nam je Selema, od Ibn Ishaka, koji je rekao: \u003c/span>‘Allah, Silan i Uzvišen, kaže: On je Taj koji je nebesa i Zemlju stvorio u šest dana, a Njegov Arš bio je na vodi. Bio je onako kako je, Silan i Uzvišen, Sebe opisao: nije bilo ničega osim vode nad kojom je bio Arš, a na Aršu Onaj kojem pripadaju veličanstvo i plemenitost; prvo što je Allah stvorio bili su svjetlost i tama?’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta. Preostale riječi pripadaju navedenoj predaji.⟧\u003c/span>"},{"id":"35.3","ar":"قيل: أما قول ابن عباس: إن الله تبارك وتعالى كان عرشه على الماء قبل أن يخلق شيئا، فكان أول ما خلق الله القلم- إن كان صحيحا عنه أنه قاله- فهو خبر منه أن الله خلق القلم بعد خلقه عرشه، وقد روى عن أبي هاشم هذا الخبر شعبة، ولم يقل فيه ما قال سفيان، من أن الله عز وجل كان على عرشه، فكان أول ما خلق القلم، بل روى ذلك كالذي رواه سائر من ذكرنا من الرواة عن ابن عباس أنه قال: أول ما خلق الله عز وجل القلم.","bs":"Odgovara se: Što se tiče Ibn Abbasovih riječi da je Arš Allaha, Blagoslovljenog i Uzvišenog, bio na vodi prije nego što je išta stvorio i da je prvo što je Allah stvorio bilo pero — ako je vjerodostojno da je to rekao — time on izvještava da je Allah stvorio pero nakon što je stvorio Svoj Arš. Ovu predaju od Ebu Hašima prenio je i Šu‘ba, ali u njoj nije naveo ono što je naveo Sufjan: da je Allah, Silan i Uzvišen, bio na Svome Aršu, a da je prvo što je stvorio bilo pero. Naprotiv, prenio ju je onako kako su je prenijeli ostali prenosioci koje smo spomenuli od Ibn Abbasa, da je rekao: „Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero.“","ar_ranges":[],"ar_html":"قيل: أما قول ابن عباس: إن الله تبارك وتعالى كان عرشه على الماء قبل أن يخلق شيئا، فكان أول ما خلق الله القلم- إن كان صحيحا عنه أنه قاله- فهو خبر منه أن الله خلق القلم بعد خلقه عرشه، وقد روى عن أبي هاشم هذا الخبر شعبة، ولم يقل فيه ما قال سفيان، من أن الله عز وجل كان على عرشه، فكان أول ما خلق القلم، بل روى ذلك كالذي رواه سائر من ذكرنا من الرواة عن ابن عباس أنه قال: أول ما خلق الله عز وجل القلم.","bs_ranges":[],"bs_html":"Odgovara se: Što se tiče Ibn Abbasovih riječi da je Arš Allaha, Blagoslovljenog i Uzvišenog, bio na vodi prije nego što je išta stvorio i da je prvo što je Allah stvorio bilo pero — ako je vjerodostojno da je to rekao — time on izvještava da je Allah stvorio pero nakon što je stvorio Svoj Arš. Ovu predaju od Ebu Hašima prenio je i Šu‘ba, ali u njoj nije naveo ono što je naveo Sufjan: da je Allah, Silan i Uzvišen, bio na Svome Aršu, a da je prvo što je stvorio bilo pero. Naprotiv, prenio ju je onako kako su je prenijeli ostali prenosioci koje smo spomenuli od Ibn Abbasa, da je rekao: „Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero.“"},{"id":"35.4","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"35.5","ar":"حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنِي عَبْدُ الصَّمَدِ، قَالَ: حَدَّثَنَا شُعْبَةُ، قَالَ: حَدَّثَنَا أَبُو هَاشِمٍ، سَمِعَ مُجَاهِدًا قَالَ: سَمِعْتُ عَبْدَ اللَّهِ- لا يَدْرِي ابْنَ عُمَرَ أَوِ ابْنَ عَبَّاسٍ- قَالَ: إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ الْقَلَمُ فَقَالَ لَهُ: اجْرِ، فَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ، وَإِنَّمَا يَعْمَلُ النَّاسُ الْيَوْمَ فِيمَا قَدْ فُرِغَ مِنْهُ.","bs":"Pričao nam je Ibn el-Musenna: rekao je: pričao mi je Abdussamed: rekao je: pričao nam je Šu‘ba: rekao je: pričao nam je Ebu Hašim, koji je čuo Mudžahida kako kaže: čuo sam Abdullaha — ne zna da li Ibn Omera ili Ibn Abbasa — kako kaže: „Prvo što je Allah stvorio bilo je pero. Rekao mu je: ‘Teci!’ I pero je ispisalo ono što će biti. Ljudi danas postupaju samo u okviru onoga što je već dovršeno.“","ar_ranges":[[0,229]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنِي عَبْدُ الصَّمَدِ، قَالَ: حَدَّثَنَا شُعْبَةُ، قَالَ: حَدَّثَنَا أَبُو هَاشِمٍ، سَمِعَ مُجَاهِدًا قَالَ: سَمِعْتُ عَبْدَ اللَّهِ- لا يَدْرِي ابْنَ عُمَرَ أَوِ ابْنَ عَبَّاسٍ- قَالَ: \u003c/span>إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ الْقَلَمُ فَقَالَ لَهُ: اجْرِ، فَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ، وَإِنَّمَا يَعْمَلُ النَّاسُ الْيَوْمَ فِيمَا قَدْ فُرِغَ مِنْهُ.","bs_ranges":[[0,235]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn el-Musenna: rekao je: pričao mi je Abdussamed: rekao je: pričao nam je Šu‘ba: rekao je: pričao nam je Ebu Hašim, koji je čuo Mudžahida kako kaže: čuo sam Abdullaha — ne zna da li Ibn Omera ili Ibn Abbasa — kako kaže: \u003c/span>„Prvo što je Allah stvorio bilo je pero. Rekao mu je: ‘Teci!’ I pero je ispisalo ono što će biti. Ljudi danas postupaju samo u okviru onoga što je već dovršeno.“"},{"id":"35.6","ar":"وَكَذَلِكَ قَوْلُ ابْنِ إِسْحَاقَ الَّذِي ذَكَرْنَاهُ عَنْهُ مَعْنَاهُ أَنَّ اللَّهَ خَلَقَ النُّورَ وَالظُّلْمَةَ بَعْدَ خَلْقِهِ عَرْشَهُ، وَالْمَاءَ الَّذِي عَلَيْهِ عَرْشُهُ وَقَوْلُ رَسُولِ اللَّهِ ص الَّذِي رَوَيْنَاهُ عَنْهُ أَوْلَى قَوْلٍ فِي ذَلِكَ بِالصَّوَابِ، لأَنَّهُ كَانَ أَعْلَمَ قَائِلٍ فِي ذَلِكَ قولا بحقيقته وصحته، [وقد روينا عنه ع أَنَّهُ قَالَ: أَوَّلُ شَيْءٍ خَلَقَهُ اللَّهُ عَزَّ وَجَلَّ الْقَلَمُ] مِنْ غَيْرِ اسْتِثْنَاءٍ مِنْهُ شَيْئًا مِنَ الأَشْيَاءِ أَنَهُّ تَقَدَّمَ خَلْقَ اللَّهِ إِيَّاهُ خلق القلم، بل عم [بقوله ص: ان أول شيء خلقه الله القلم،] كل","bs":"Isto tako, riječi Ibn Ishaka koje smo od njega naveli znače da je Allah stvorio svjetlost i tamu nakon što je stvorio Svoj Arš i vodu na kojoj je Njegov Arš. Riječi Allahovog Poslanika, sallallahu alejhi ve sellem, koje smo od njega prenijeli, najpreče je smatrati ispravnim u ovom pitanju, jer je od svih koji su o tome govorili on najbolje poznavao njegovu stvarnost i tačnost. Od njega, alejhis-selam, prenijeli smo da je rekao: „Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero“, ne izdvajajući ništa od stvari čije bi stvaranje prethodilo Allahovom stvaranju pera. Naprotiv, svojim riječima, sallallahu alejhi ve sellem: „Prvo što je Allah stvorio bilo je pero“, obuhvatio je svaku","ar_ranges":[],"ar_html":"وَكَذَلِكَ قَوْلُ ابْنِ إِسْحَاقَ الَّذِي ذَكَرْنَاهُ عَنْهُ مَعْنَاهُ أَنَّ اللَّهَ خَلَقَ النُّورَ وَالظُّلْمَةَ بَعْدَ خَلْقِهِ عَرْشَهُ، وَالْمَاءَ الَّذِي عَلَيْهِ عَرْشُهُ وَقَوْلُ رَسُولِ اللَّهِ ص الَّذِي رَوَيْنَاهُ عَنْهُ أَوْلَى قَوْلٍ فِي ذَلِكَ بِالصَّوَابِ، لأَنَّهُ كَانَ أَعْلَمَ قَائِلٍ فِي ذَلِكَ قولا بحقيقته وصحته، [وقد روينا عنه ع أَنَّهُ قَالَ: أَوَّلُ شَيْءٍ خَلَقَهُ اللَّهُ عَزَّ وَجَلَّ الْقَلَمُ] مِنْ غَيْرِ اسْتِثْنَاءٍ مِنْهُ شَيْئًا مِنَ الأَشْيَاءِ أَنَهُّ تَقَدَّمَ خَلْقَ اللَّهِ إِيَّاهُ خلق القلم، بل عم [بقوله ص: ان أول شيء خلقه الله القلم،] كل","bs_ranges":[],"bs_html":"Isto tako, riječi Ibn Ishaka koje smo od njega naveli znače da je Allah stvorio svjetlost i tamu nakon što je stvorio Svoj Arš i vodu na kojoj je Njegov Arš. Riječi Allahovog Poslanika, sallallahu alejhi ve sellem, koje smo od njega prenijeli, najpreče je smatrati ispravnim u ovom pitanju, jer je od svih koji su o tome govorili on najbolje poznavao njegovu stvarnost i tačnost. Od njega, alejhis-selam, prenijeli smo da je rekao: „Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero“, ne izdvajajući ništa od stvari čije bi stvaranje prethodilo Allahovom stvaranju pera. Naprotiv, svojim riječima, sallallahu alejhi ve sellem: „Prvo što je Allah stvorio bilo je pero“, obuhvatio je svaku"}],"notes":[]},{"n":36,"ar":"شَيْءٍ، وَأَنَّ الْقَلَمَ مَخْلُوقٌ قَبْلَهُ مِنْ غَيْرِ اسْتِثْنَائِهِ مِنْ ذَلِكَ عَرْشًا وَلا مَاءً وَلا شَيْئًا غَيْرَ ذَلِكَ.\n\nفالرواية التي رويناها عن ابى ظبيان وابى الضحا، عن ابن عباس، أولى بالصحة عن ابن عباس من خبر مجاهد عنه الذي رواه عنه أبو هاشم، إذ كان أبو هاشم قد اختلف في رواية ذلك عنه شعبة وسفيان، على ما قد ذكرت من اختلافهما فيها.\n\nوأما ابن إسحاق فإنه لم يسند قوله الذي قاله في ذلك إلى أحد، وذلك من الأمور التي لا يدرك علمها إلا بخبر من الله عز وجل، أو خبر من رسول الله ص، وقد ذكرت الرواية فيه عن رسول الله ص","bs":"\u003cp data-paragraph=\"36.1\">stvar i kazao da je pero stvoreno prije nje, ne izdvajajući od toga ni Arš, ni vodu, niti bilo šta drugo.\u003c/p>\u003cp data-paragraph=\"36.2\">Zato je predaja koju smo prenijeli od Ebu Zabjana i Ebu Duhaa, od Ibn Abbasa, preča da bude vjerodostojna od Ibn Abbasa nego Mudžahidova predaja od njega koju prenosi Ebu Hašim, jer su Šu‘ba i Sufjan različito prenijeli ovu predaju od Ebu Hašima, kako sam već naveo opisujući njihovo razilaženje u njoj.\u003c/p>\u003cp data-paragraph=\"36.3\">Što se tiče Ibn Ishaka, on svoje mišljenje o tome nije lancem prenosilaca pripisao nikome. To pripada stvarima čije se poznavanje može steći jedino izvješćem od Allaha, Silnog i Uzvišenog, ili izvješćem od Allahovog Poslanika, sallallahu alejhi ve sellem. Već sam naveo predaju o tome od Allahovog Poslanika, sallallahu alejhi ve sellem.\u003c/p>","paragraphs":[{"id":"36.1","ar":"شَيْءٍ، وَأَنَّ الْقَلَمَ مَخْلُوقٌ قَبْلَهُ مِنْ غَيْرِ اسْتِثْنَائِهِ مِنْ ذَلِكَ عَرْشًا وَلا مَاءً وَلا شَيْئًا غَيْرَ ذَلِكَ.","bs":"stvar i kazao da je pero stvoreno prije nje, ne izdvajajući od toga ni Arš, ni vodu, niti bilo šta drugo.","ar_ranges":[],"ar_html":"شَيْءٍ، وَأَنَّ الْقَلَمَ مَخْلُوقٌ قَبْلَهُ مِنْ غَيْرِ اسْتِثْنَائِهِ مِنْ ذَلِكَ عَرْشًا وَلا مَاءً وَلا شَيْئًا غَيْرَ ذَلِكَ.","bs_ranges":[],"bs_html":"stvar i kazao da je pero stvoreno prije nje, ne izdvajajući od toga ni Arš, ni vodu, niti bilo šta drugo."},{"id":"36.2","ar":"فالرواية التي رويناها عن ابى ظبيان وابى الضحا، عن ابن عباس، أولى بالصحة عن ابن عباس من خبر مجاهد عنه الذي رواه عنه أبو هاشم، إذ كان أبو هاشم قد اختلف في رواية ذلك عنه شعبة وسفيان، على ما قد ذكرت من اختلافهما فيها.","bs":"Zato je predaja koju smo prenijeli od Ebu Zabjana i Ebu Duhaa, od Ibn Abbasa, preča da bude vjerodostojna od Ibn Abbasa nego Mudžahidova predaja od njega koju prenosi Ebu Hašim, jer su Šu‘ba i Sufjan različito prenijeli ovu predaju od Ebu Hašima, kako sam već naveo opisujući njihovo razilaženje u njoj.","ar_ranges":[],"ar_html":"فالرواية التي رويناها عن ابى ظبيان وابى الضحا، عن ابن عباس، أولى بالصحة عن ابن عباس من خبر مجاهد عنه الذي رواه عنه أبو هاشم، إذ كان أبو هاشم قد اختلف في رواية ذلك عنه شعبة وسفيان، على ما قد ذكرت من اختلافهما فيها.","bs_ranges":[],"bs_html":"Zato je predaja koju smo prenijeli od Ebu Zabjana i Ebu Duhaa, od Ibn Abbasa, preča da bude vjerodostojna od Ibn Abbasa nego Mudžahidova predaja od njega koju prenosi Ebu Hašim, jer su Šu‘ba i Sufjan različito prenijeli ovu predaju od Ebu Hašima, kako sam već naveo opisujući njihovo razilaženje u njoj."},{"id":"36.3","ar":"وأما ابن إسحاق فإنه لم يسند قوله الذي قاله في ذلك إلى أحد، وذلك من الأمور التي لا يدرك علمها إلا بخبر من الله عز وجل، أو خبر من رسول الله ص، وقد ذكرت الرواية فيه عن رسول الله ص","bs":"Što se tiče Ibn Ishaka, on svoje mišljenje o tome nije lancem prenosilaca pripisao nikome. To pripada stvarima čije se poznavanje može steći jedino izvješćem od Allaha, Silnog i Uzvišenog, ili izvješćem od Allahovog Poslanika, sallallahu alejhi ve sellem. Već sam naveo predaju o tome od Allahovog Poslanika, sallallahu alejhi ve sellem.","ar_ranges":[],"ar_html":"وأما ابن إسحاق فإنه لم يسند قوله الذي قاله في ذلك إلى أحد، وذلك من الأمور التي لا يدرك علمها إلا بخبر من الله عز وجل، أو خبر من رسول الله ص، وقد ذكرت الرواية فيه عن رسول الله ص","bs_ranges":[],"bs_html":"Što se tiče Ibn Ishaka, on svoje mišljenje o tome nije lancem prenosilaca pripisao nikome. To pripada stvarima čije se poznavanje može steći jedino izvješćem od Allaha, Silnog i Uzvišenog, ili izvješćem od Allahovog Poslanika, sallallahu alejhi ve sellem. Već sam naveo predaju o tome od Allahovog Poslanika, sallallahu alejhi ve sellem."}],"notes":[]},{"n":37,"ar":"القول في الذي ثنى خلق القلم\n\nثم إن الله جل جلاله خلق بعد القلم- وبعد أن أمره فكتب ما هو كائن إلى قيام الساعة- سحابا رقيقا، وهو الغمام الذي ذكره جل وعز ذكره في محكم كتابه فقال: «هَلْ يَنْظُرُونَ إِلَّا أَنْ يَأْتِيَهُمُ اللَّهُ فِي ظُلَلٍ مِنَ الْغَمامِ» ، وذلك قبل أن يخلق عرشه، وبذلك ورد الخبر عن رسول الله ص.\n\nحَدَّثَنَا ابْنُ وَكِيعٍ وَمُحَمَّدُ بْنُ هَارُونَ الْقَطَّانُ، قَالا: حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، عَنْ حَمَّادِ بْنِ سَلَمَةَ، عَنْ يَعْلَى بْنِ عَطَاءٍ، [عَنْ وَكِيعِ بْنِ حُدُسٍ، عَنْ عَمِّهِ أَبِي رَزِينٍ، قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ كَانَ رَبُّنَا قَبْلَ أَنْ يَخْلُقَ خَلْقَهُ؟ قَالَ:\nكَانَ في عماء، ما تحته هواء، وما فوقه هَوَاءٌ، ثُمَّ خَلَقَ عَرْشَهُ عَلَى الْمَاءِ]\n\nحَدَّثَنِي الْمُثَنَّى بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا الْحَجَّاجُ، قَالَ: حَدَّثَنَا حَمَّادٌ، عَنْ يَعْلَى بْنِ عَطَاءٍ، عَنْ وَكِيعِ بْنِ حُدُسٍ، عَنْ عَمِّهِ أَبِي رَزِينٍ العقيلي، قال:","bs":"\u003cp data-paragraph=\"37.1\">Rasprava o onome što je stvoreno poslije pera\u003c/p>\u003cp data-paragraph=\"37.2\">Zatim je Allah, Uzvišeno je Njegovo veličanstvo, nakon pera — i nakon što mu je naredio pa je ono zapisalo ono što će biti do nastupanja Časa — stvorio tanak oblak. To je oblak koji On, Silan i Uzvišen je spomen Njegov, spominje u Svojoj jasnoj Knjizi riječima: „Čekaju li oni išta drugo osim da im Allah dođe u sjenama oblaka?“ To je bilo prije nego što je stvorio Svoj Arš. O tome je došla predaja od Allahovog Poslanika, sallallahu alejhi ve sellem. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:210, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"37.3\">Pričali su nam Ibn Veki‘ i Muhammed ibn Harun el-Kattan; obojica su rekli: pričao nam je Jezid ibn Harun, od Hammada ibn Seleme, od Ja‘le ibn Ataa, od Veki‘a ibn Hudusa, od njegovog amidže Ebu Rezina, koji je rekao: „Upitao sam: ‘Allahov Poslaniče, gdje je bio naš Gospodar prije nego što je stvorio Svoja stvorenja?’ Odgovorio je: ‘Bio je u oblaku; ispod njega nije bilo zraka, niti je iznad njega bilo zraka. Zatim je stvorio Svoj Arš na vodi.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izraz عماء ovdje je preveden kao „oblak“. U izrazu ما تحته هواء وما فوقه هواء riječ ما može se razumjeti kao negacija („nije bilo“) ili odnosna riječ („ono što je“). Ovdje je navedeno prvo čitanje; naredna predaja na stranici 38 izričito govori o zraku iznad i ispod. Razlika između dviju verzija nije uklonjena.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"37.4\">Pričao mi je Musenna ibn Ibrahim: rekao je: pričao nam je Hadždžadž: rekao je: pričao nam je Hammad, od Ja‘le ibn Ataa, od Veki‘a ibn Hudusa, od njegovog amidže Ebu Rezina el-Ukajlija, koji je rekao:\u003c/p>","paragraphs":[{"id":"37.1","ar":"القول في الذي ثنى خلق القلم","bs":"Rasprava o onome što je stvoreno poslije pera","ar_ranges":[],"ar_html":"القول في الذي ثنى خلق القلم","bs_ranges":[],"bs_html":"Rasprava o onome što je stvoreno poslije pera"},{"id":"37.2","ar":"ثم إن الله جل جلاله خلق بعد القلم- وبعد أن أمره فكتب ما هو كائن إلى قيام الساعة- سحابا رقيقا، وهو الغمام الذي ذكره جل وعز ذكره في محكم كتابه فقال: «هَلْ يَنْظُرُونَ إِلَّا أَنْ يَأْتِيَهُمُ اللَّهُ فِي ظُلَلٍ مِنَ الْغَمامِ» ، وذلك قبل أن يخلق عرشه، وبذلك ورد الخبر عن رسول الله ص.","bs":"Zatim je Allah, Uzvišeno je Njegovo veličanstvo, nakon pera — i nakon što mu je naredio pa je ono zapisalo ono što će biti do nastupanja Časa — stvorio tanak oblak. To je oblak koji On, Silan i Uzvišen je spomen Njegov, spominje u Svojoj jasnoj Knjizi riječima: „Čekaju li oni išta drugo osim da im Allah dođe u sjenama oblaka?“ To je bilo prije nego što je stvorio Svoj Arš. O tome je došla predaja od Allahovog Poslanika, sallallahu alejhi ve sellem. ⟦Prijevod kur’anskog navoda: El-Bekara, 2:210, dio ajeta.⟧","ar_ranges":[],"ar_html":"ثم إن الله جل جلاله خلق بعد القلم- وبعد أن أمره فكتب ما هو كائن إلى قيام الساعة- سحابا رقيقا، وهو الغمام الذي ذكره جل وعز ذكره في محكم كتابه فقال: «هَلْ يَنْظُرُونَ إِلَّا أَنْ يَأْتِيَهُمُ اللَّهُ فِي ظُلَلٍ مِنَ الْغَمامِ» ، وذلك قبل أن يخلق عرشه، وبذلك ورد الخبر عن رسول الله ص.","bs_ranges":[],"bs_html":"Zatim je Allah, Uzvišeno je Njegovo veličanstvo, nakon pera — i nakon što mu je naredio pa je ono zapisalo ono što će biti do nastupanja Časa — stvorio tanak oblak. To je oblak koji On, Silan i Uzvišen je spomen Njegov, spominje u Svojoj jasnoj Knjizi riječima: „Čekaju li oni išta drugo osim da im Allah dođe u sjenama oblaka?“ To je bilo prije nego što je stvorio Svoj Arš. O tome je došla predaja od Allahovog Poslanika, sallallahu alejhi ve sellem. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:210, dio ajeta.⟧\u003c/span>"},{"id":"37.3","ar":"حَدَّثَنَا ابْنُ وَكِيعٍ وَمُحَمَّدُ بْنُ هَارُونَ الْقَطَّانُ، قَالا: حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، عَنْ حَمَّادِ بْنِ سَلَمَةَ، عَنْ يَعْلَى بْنِ عَطَاءٍ، [عَنْ وَكِيعِ بْنِ حُدُسٍ، عَنْ عَمِّهِ أَبِي رَزِينٍ، قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ كَانَ رَبُّنَا قَبْلَ أَنْ يَخْلُقَ خَلْقَهُ؟ قَالَ:\nكَانَ في عماء، ما تحته هواء، وما فوقه هَوَاءٌ، ثُمَّ خَلَقَ عَرْشَهُ عَلَى الْمَاءِ]","bs":"Pričali su nam Ibn Veki‘ i Muhammed ibn Harun el-Kattan; obojica su rekli: pričao nam je Jezid ibn Harun, od Hammada ibn Seleme, od Ja‘le ibn Ataa, od Veki‘a ibn Hudusa, od njegovog amidže Ebu Rezina, koji je rekao: „Upitao sam: ‘Allahov Poslaniče, gdje je bio naš Gospodar prije nego što je stvorio Svoja stvorenja?’ Odgovorio je: ‘Bio je u oblaku; ispod njega nije bilo zraka, niti je iznad njega bilo zraka. Zatim je stvorio Svoj Arš na vodi.’“ ⟦Napomena prevodioca: izraz عماء ovdje je preveden kao „oblak“. U izrazu ما تحته هواء وما فوقه هواء riječ ما može se razumjeti kao negacija („nije bilo“) ili odnosna riječ („ono što je“). Ovdje je navedeno prvo čitanje; naredna predaja na stranici 38 izričito govori o zraku iznad i ispod. Razlika između dviju verzija nije uklonjena.⟧","ar_ranges":[[0,223]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ وَمُحَمَّدُ بْنُ هَارُونَ الْقَطَّانُ، قَالا: حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، عَنْ حَمَّادِ بْنِ سَلَمَةَ، عَنْ يَعْلَى بْنِ عَطَاءٍ، [عَنْ وَكِيعِ بْنِ حُدُسٍ، عَنْ عَمِّهِ أَبِي رَزِينٍ، قَالَ: \u003c/span>قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ كَانَ رَبُّنَا قَبْلَ أَنْ يَخْلُقَ خَلْقَهُ؟ قَالَ:\nكَانَ في عماء، ما تحته هواء، وما فوقه هَوَاءٌ، ثُمَّ خَلَقَ عَرْشَهُ عَلَى الْمَاءِ]","bs_ranges":[[0,216]],"bs_html":"\u003cspan class=\"isnad\">Pričali su nam Ibn Veki‘ i Muhammed ibn Harun el-Kattan; obojica su rekli: pričao nam je Jezid ibn Harun, od Hammada ibn Seleme, od Ja‘le ibn Ataa, od Veki‘a ibn Hudusa, od njegovog amidže Ebu Rezina, koji je rekao: \u003c/span>„Upitao sam: ‘Allahov Poslaniče, gdje je bio naš Gospodar prije nego što je stvorio Svoja stvorenja?’ Odgovorio je: ‘Bio je u oblaku; ispod njega nije bilo zraka, niti je iznad njega bilo zraka. Zatim je stvorio Svoj Arš na vodi.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izraz عماء ovdje je preveden kao „oblak“. U izrazu ما تحته هواء وما فوقه هواء riječ ما može se razumjeti kao negacija („nije bilo“) ili odnosna riječ („ono što je“). Ovdje je navedeno prvo čitanje; naredna predaja na stranici 38 izričito govori o zraku iznad i ispod. Razlika između dviju verzija nije uklonjena.⟧\u003c/span>"},{"id":"37.4","ar":"حَدَّثَنِي الْمُثَنَّى بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا الْحَجَّاجُ، قَالَ: حَدَّثَنَا حَمَّادٌ، عَنْ يَعْلَى بْنِ عَطَاءٍ، عَنْ وَكِيعِ بْنِ حُدُسٍ، عَنْ عَمِّهِ أَبِي رَزِينٍ العقيلي، قال:","bs":"Pričao mi je Musenna ibn Ibrahim: rekao je: pričao nam je Hadždžadž: rekao je: pričao nam je Hammad, od Ja‘le ibn Ataa, od Veki‘a ibn Hudusa, od njegovog amidže Ebu Rezina el-Ukajlija, koji je rekao:","ar_ranges":[[0,194]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا الْحَجَّاجُ، قَالَ: حَدَّثَنَا حَمَّادٌ، عَنْ يَعْلَى بْنِ عَطَاءٍ، عَنْ وَكِيعِ بْنِ حُدُسٍ، عَنْ عَمِّهِ أَبِي رَزِينٍ العقيلي، قال:\u003c/span>","bs_ranges":[[0,199]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musenna ibn Ibrahim: rekao je: pričao nam je Hadždžadž: rekao je: pričao nam je Hammad, od Ja‘le ibn Ataa, od Veki‘a ibn Hudusa, od njegovog amidže Ebu Rezina el-Ukajlija, koji je rekao:\u003c/span>"}],"notes":[]},{"n":38,"ar":"[قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ كَانَ رَبُّنَا عَزَّ وَجَلَّ قَبْلَ أَنْ يَخْلُقَ السَّمَوَاتِ وَالأَرْضَ؟\n\nقَالَ: فِي عَمَاءٍ، فَوْقَهُ هَوَاءٌ، وَتَحْتَهُ هَوَاءٌ، ثُمَّ خَلَقَ عَرْشَهُ عَلَى الْمَاءِ] .\n\nحَدَّثَنَا خَلادُ بْنُ أَسْلَمَ، حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ: حَدَّثَنَا الْمَسْعُودِيُّ، أَخْبَرَنَا جَامِعُ بْنُ شَدَّادٍ، عَنْ صَفْوَانَ بْنِ مُحْرِزٍ، [عَنِ ابْنِ حُصَيْنٍ- وَكَانَ من اصحاب رسول الله ص- قال: اتى قوم رسول الله ص فَدَخَلُوا عَلَيْهِ، فَجَعَلَ يُبَشِّرُهُمْ وَيَقُولُونَ: أَعْطِنَا، حَتَّى ساء ذلك رسول الله ص، ثُمَّ خَرَجُوا مِنْ عِنْدِهِ وَجَاءَ قَوْمٌ آخَرُونَ، فَدَخَلُوا عَلَيْهِ فَقَالُوا: جِئْنَا نُسَلِّمُ عَلَى رَسُولِ الله ص، وَنَتَفَقَّهُ فِي الدِّينِ، وَنَسْأَلُهُ عَنْ بَدْءِ هَذَا الأَمْرِ، قَالَ: فَاقْبَلُوا الْبُشْرَى إِذْ لَمْ يَقْبَلْهَا أُولَئِكَ الَّذِينَ خَرَجُوا، قَالُوا: قَبِلْنَا، فَقَالَ رَسُولُ الله ص: كان الله لا شَيْءَ غَيْرُهُ، وَكَانَ عَرْشُهُ عَلَى الْمَاءِ وَكَتَبَ فِي الذِّكْرِ قَبْلَ كُلِّ شَيْءٍ، ثُمَّ خَلَقَ سَبْعَ سَمَوَاتٍ] ثُمَّ أَتَانِي آتٍ فَقَالَ: تِلْكَ نَاقَتُكَ قَدْ ذَهَبَتْ، فَخَرَجْتُ يَنْقَطِعُ دُونَهَا السَّرَابُ، وَلَوَدِدْتُ أَنِّي تَرَكْتُهَا.\n\nحَدَّثَنِي أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ عَنْ جَامِعِ ابن شَدَّادٍ، عَنْ صَفْوَانَ بْنِ مُحْرِزٍ، عَنْ عِمْرَانَ بن الحصين، قال: [قال رسول الله ص: اقْبَلُوا الْبُشْرَى يَا بَنِي تَمِيمٍ، فَقَالُوا: قَدْ بَشَّرْتَنَا فَأَعْطِنَا فَقَالَ:\nاقْبَلُوا الْبُشْرَى يَا أَهْلَ الْيَمَنِ، فَقَالُوا: قَدْ قَبِلْنَا، فَأَخْبِرْنَا عَنْ هَذَا الأمر كيف كان؟ فقال رسول الله ص: كَانَ اللَّهُ عَزَّ وَجَلَّ عَلَى الْعَرْشِ، وَكَانَ قَبْلَ كُلِّ شَيْءٍ، وَكَتَبَ فِي اللَّوْحِ كُلَّ شَيْءٍ يَكُونُ] قَالَ: فَأَتَانِي آتٍ فَقَالَ:\n\nيَا عِمْرَانُ، هَذِهِ نَاقَتُكَ قَدْ حَلَّتْ عِقَالَهَا، فَقُمْتُ، فَإِذَا السَّرَابُ يَنْقَطِعُ بَيْنِي وَبَيْنَهَا، فَلا أَدْرِي مَا كَانَ بَعْدَ ذَلِكَ","bs":"\u003cp data-paragraph=\"38.1\">„Upitao sam: ‘Allahov Poslaniče, gdje je bio naš Gospodar, Silan i Uzvišen, prije nego što je stvorio nebesa i Zemlju?’ Odgovorio je: ‘U oblaku; iznad njega bio je zrak, a ispod njega bio je zrak. Zatim je stvorio Svoj Arš na vodi.’“\u003c/p>\u003cp data-paragraph=\"38.2\">Pričao nam je Hallad ibn Eslem: pričao nam je Nadr ibn Šumejl: rekao je: pričao nam je Mesudi: obavijestio nas je Džami‘ ibn Šeddad, od Safvana ibn Muhriza, od Ibn Husajna — a bio je jedan od ashaba Allahovog Poslanika, sallallahu alejhi ve sellem — koji je rekao: „Neki ljudi došli su Allahovom Poslaniku, sallallahu alejhi ve sellem, i ušli kod njega. On ih je obradovao radosnim vijestima, a oni su govorili: ‘Daj nam!’, sve dok to nije oneraspoložilo Allahovog Poslanika, sallallahu alejhi ve sellem. Zatim su izašli od njega, a došli su drugi ljudi i ušli kod njega. Rekli su: ‘Došli smo da poselamimo Allahovog Poslanika, sallallahu alejhi ve sellem, da se podučimo vjeri i da ga pitamo o početku svega ovoga.’ Rekao je: ‘Prihvatite radosnu vijest, jer je nisu prihvatili oni koji su izašli.’ Odgovorili su: ‘Prihvatili smo.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Bio je Allah i nije bilo ničega osim Njega; Njegov Arš bio je na vodi. Prije svega zapisao je u Zapis, a zatim je stvorio sedam nebesa.’ Potom mi je došao neko i rekao: ‘Eno, tvoja deva je otišla!’ Izašao sam, a prije nego što bih do nje stigao pružala se fatamorgana. Volio bih da sam je ostavio.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u ovom lancu stoji samo „Ibn Husajn“; puno ime nije dopunjavano. Izraz ينقطع دونها السراب opisuje fatamorganu na putu do deve; prostorna slika nije sasvim jasna.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"38.3\">Pričao mi je Ebu Kurejb: pričao nam je Ebu Muavija, od A‘meša, od Džami‘a ibn Šeddada, od Safvana ibn Muhriza, od Imrana ibn el-Husajna, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Prihvatite radosnu vijest, o Benu Temim!’ Odgovorili su: ‘Već si nas obradovao, pa nam daj!’ Zatim je rekao: ‘Prihvatite radosnu vijest, stanovnici Jemena!’ Odgovorili su: ‘Prihvatili smo, pa nas obavijesti kako je ovo započelo.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Allah, Silan i Uzvišen, bio je na Aršu i bio je prije svega. U Ploču je zapisao sve što će biti.’ Tada mi je došao neko i rekao: ‘Imrane, ova tvoja deva oslobodila se svoje spone!’ Ustao sam, a između mene i nje pružala se fatamorgana, pa ne znam šta je bilo poslije toga.“\u003c/p>","paragraphs":[{"id":"38.1","ar":"[قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ كَانَ رَبُّنَا عَزَّ وَجَلَّ قَبْلَ أَنْ يَخْلُقَ السَّمَوَاتِ وَالأَرْضَ؟\n\nقَالَ: فِي عَمَاءٍ، فَوْقَهُ هَوَاءٌ، وَتَحْتَهُ هَوَاءٌ، ثُمَّ خَلَقَ عَرْشَهُ عَلَى الْمَاءِ] .","bs":"„Upitao sam: ‘Allahov Poslaniče, gdje je bio naš Gospodar, Silan i Uzvišen, prije nego što je stvorio nebesa i Zemlju?’ Odgovorio je: ‘U oblaku; iznad njega bio je zrak, a ispod njega bio je zrak. Zatim je stvorio Svoj Arš na vodi.’“","ar_ranges":[],"ar_html":"[قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ كَانَ رَبُّنَا عَزَّ وَجَلَّ قَبْلَ أَنْ يَخْلُقَ السَّمَوَاتِ وَالأَرْضَ؟\n\nقَالَ: فِي عَمَاءٍ، فَوْقَهُ هَوَاءٌ، وَتَحْتَهُ هَوَاءٌ، ثُمَّ خَلَقَ عَرْشَهُ عَلَى الْمَاءِ] .","bs_ranges":[],"bs_html":"„Upitao sam: ‘Allahov Poslaniče, gdje je bio naš Gospodar, Silan i Uzvišen, prije nego što je stvorio nebesa i Zemlju?’ Odgovorio je: ‘U oblaku; iznad njega bio je zrak, a ispod njega bio je zrak. Zatim je stvorio Svoj Arš na vodi.’“"},{"id":"38.2","ar":"حَدَّثَنَا خَلادُ بْنُ أَسْلَمَ، حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ: حَدَّثَنَا الْمَسْعُودِيُّ، أَخْبَرَنَا جَامِعُ بْنُ شَدَّادٍ، عَنْ صَفْوَانَ بْنِ مُحْرِزٍ، [عَنِ ابْنِ حُصَيْنٍ- وَكَانَ من اصحاب رسول الله ص- قال: اتى قوم رسول الله ص فَدَخَلُوا عَلَيْهِ، فَجَعَلَ يُبَشِّرُهُمْ وَيَقُولُونَ: أَعْطِنَا، حَتَّى ساء ذلك رسول الله ص، ثُمَّ خَرَجُوا مِنْ عِنْدِهِ وَجَاءَ قَوْمٌ آخَرُونَ، فَدَخَلُوا عَلَيْهِ فَقَالُوا: جِئْنَا نُسَلِّمُ عَلَى رَسُولِ الله ص، وَنَتَفَقَّهُ فِي الدِّينِ، وَنَسْأَلُهُ عَنْ بَدْءِ هَذَا الأَمْرِ، قَالَ: فَاقْبَلُوا الْبُشْرَى إِذْ لَمْ يَقْبَلْهَا أُولَئِكَ الَّذِينَ خَرَجُوا، قَالُوا: قَبِلْنَا، فَقَالَ رَسُولُ الله ص: كان الله لا شَيْءَ غَيْرُهُ، وَكَانَ عَرْشُهُ عَلَى الْمَاءِ وَكَتَبَ فِي الذِّكْرِ قَبْلَ كُلِّ شَيْءٍ، ثُمَّ خَلَقَ سَبْعَ سَمَوَاتٍ] ثُمَّ أَتَانِي آتٍ فَقَالَ: تِلْكَ نَاقَتُكَ قَدْ ذَهَبَتْ، فَخَرَجْتُ يَنْقَطِعُ دُونَهَا السَّرَابُ، وَلَوَدِدْتُ أَنِّي تَرَكْتُهَا.","bs":"Pričao nam je Hallad ibn Eslem: pričao nam je Nadr ibn Šumejl: rekao je: pričao nam je Mesudi: obavijestio nas je Džami‘ ibn Šeddad, od Safvana ibn Muhriza, od Ibn Husajna — a bio je jedan od ashaba Allahovog Poslanika, sallallahu alejhi ve sellem — koji je rekao: „Neki ljudi došli su Allahovom Poslaniku, sallallahu alejhi ve sellem, i ušli kod njega. On ih je obradovao radosnim vijestima, a oni su govorili: ‘Daj nam!’, sve dok to nije oneraspoložilo Allahovog Poslanika, sallallahu alejhi ve sellem. Zatim su izašli od njega, a došli su drugi ljudi i ušli kod njega. Rekli su: ‘Došli smo da poselamimo Allahovog Poslanika, sallallahu alejhi ve sellem, da se podučimo vjeri i da ga pitamo o početku svega ovoga.’ Rekao je: ‘Prihvatite radosnu vijest, jer je nisu prihvatili oni koji su izašli.’ Odgovorili su: ‘Prihvatili smo.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Bio je Allah i nije bilo ničega osim Njega; Njegov Arš bio je na vodi. Prije svega zapisao je u Zapis, a zatim je stvorio sedam nebesa.’ Potom mi je došao neko i rekao: ‘Eno, tvoja deva je otišla!’ Izašao sam, a prije nego što bih do nje stigao pružala se fatamorgana. Volio bih da sam je ostavio.“ ⟦Napomena prevodioca: u ovom lancu stoji samo „Ibn Husajn“; puno ime nije dopunjavano. Izraz ينقطع دونها السراب opisuje fatamorganu na putu do deve; prostorna slika nije sasvim jasna.⟧","ar_ranges":[[0,226]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا خَلادُ بْنُ أَسْلَمَ، حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ: حَدَّثَنَا الْمَسْعُودِيُّ، أَخْبَرَنَا جَامِعُ بْنُ شَدَّادٍ، عَنْ صَفْوَانَ بْنِ مُحْرِزٍ، [عَنِ ابْنِ حُصَيْنٍ- وَكَانَ من اصحاب رسول الله ص- قال: \u003c/span>اتى قوم رسول الله ص فَدَخَلُوا عَلَيْهِ، فَجَعَلَ يُبَشِّرُهُمْ وَيَقُولُونَ: أَعْطِنَا، حَتَّى ساء ذلك رسول الله ص، ثُمَّ خَرَجُوا مِنْ عِنْدِهِ وَجَاءَ قَوْمٌ آخَرُونَ، فَدَخَلُوا عَلَيْهِ فَقَالُوا: جِئْنَا نُسَلِّمُ عَلَى رَسُولِ الله ص، وَنَتَفَقَّهُ فِي الدِّينِ، وَنَسْأَلُهُ عَنْ بَدْءِ هَذَا الأَمْرِ، قَالَ: فَاقْبَلُوا الْبُشْرَى إِذْ لَمْ يَقْبَلْهَا أُولَئِكَ الَّذِينَ خَرَجُوا، قَالُوا: قَبِلْنَا، فَقَالَ رَسُولُ الله ص: كان الله لا شَيْءَ غَيْرُهُ، وَكَانَ عَرْشُهُ عَلَى الْمَاءِ وَكَتَبَ فِي الذِّكْرِ قَبْلَ كُلِّ شَيْءٍ، ثُمَّ خَلَقَ سَبْعَ سَمَوَاتٍ] ثُمَّ أَتَانِي آتٍ فَقَالَ: تِلْكَ نَاقَتُكَ قَدْ ذَهَبَتْ، فَخَرَجْتُ يَنْقَطِعُ دُونَهَا السَّرَابُ، وَلَوَدِدْتُ أَنِّي تَرَكْتُهَا.","bs_ranges":[[0,265]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Hallad ibn Eslem: pričao nam je Nadr ibn Šumejl: rekao je: pričao nam je Mesudi: obavijestio nas je Džami‘ ibn Šeddad, od Safvana ibn Muhriza, od Ibn Husajna — a bio je jedan od ashaba Allahovog Poslanika, sallallahu alejhi ve sellem — koji je rekao: \u003c/span>„Neki ljudi došli su Allahovom Poslaniku, sallallahu alejhi ve sellem, i ušli kod njega. On ih je obradovao radosnim vijestima, a oni su govorili: ‘Daj nam!’, sve dok to nije oneraspoložilo Allahovog Poslanika, sallallahu alejhi ve sellem. Zatim su izašli od njega, a došli su drugi ljudi i ušli kod njega. Rekli su: ‘Došli smo da poselamimo Allahovog Poslanika, sallallahu alejhi ve sellem, da se podučimo vjeri i da ga pitamo o početku svega ovoga.’ Rekao je: ‘Prihvatite radosnu vijest, jer je nisu prihvatili oni koji su izašli.’ Odgovorili su: ‘Prihvatili smo.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Bio je Allah i nije bilo ničega osim Njega; Njegov Arš bio je na vodi. Prije svega zapisao je u Zapis, a zatim je stvorio sedam nebesa.’ Potom mi je došao neko i rekao: ‘Eno, tvoja deva je otišla!’ Izašao sam, a prije nego što bih do nje stigao pružala se fatamorgana. Volio bih da sam je ostavio.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u ovom lancu stoji samo „Ibn Husajn“; puno ime nije dopunjavano. Izraz ينقطع دونها السراب opisuje fatamorganu na putu do deve; prostorna slika nije sasvim jasna.⟧\u003c/span>"},{"id":"38.3","ar":"حَدَّثَنِي أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ عَنْ جَامِعِ ابن شَدَّادٍ، عَنْ صَفْوَانَ بْنِ مُحْرِزٍ، عَنْ عِمْرَانَ بن الحصين، قال: [قال رسول الله ص: اقْبَلُوا الْبُشْرَى يَا بَنِي تَمِيمٍ، فَقَالُوا: قَدْ بَشَّرْتَنَا فَأَعْطِنَا فَقَالَ:\nاقْبَلُوا الْبُشْرَى يَا أَهْلَ الْيَمَنِ، فَقَالُوا: قَدْ قَبِلْنَا، فَأَخْبِرْنَا عَنْ هَذَا الأمر كيف كان؟ فقال رسول الله ص: كَانَ اللَّهُ عَزَّ وَجَلَّ عَلَى الْعَرْشِ، وَكَانَ قَبْلَ كُلِّ شَيْءٍ، وَكَتَبَ فِي اللَّوْحِ كُلَّ شَيْءٍ يَكُونُ] قَالَ: فَأَتَانِي آتٍ فَقَالَ:\n\nيَا عِمْرَانُ، هَذِهِ نَاقَتُكَ قَدْ حَلَّتْ عِقَالَهَا، فَقُمْتُ، فَإِذَا السَّرَابُ يَنْقَطِعُ بَيْنِي وَبَيْنَهَا، فَلا أَدْرِي مَا كَانَ بَعْدَ ذَلِكَ","bs":"Pričao mi je Ebu Kurejb: pričao nam je Ebu Muavija, od A‘meša, od Džami‘a ibn Šeddada, od Safvana ibn Muhriza, od Imrana ibn el-Husajna, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Prihvatite radosnu vijest, o Benu Temim!’ Odgovorili su: ‘Već si nas obradovao, pa nam daj!’ Zatim je rekao: ‘Prihvatite radosnu vijest, stanovnici Jemena!’ Odgovorili su: ‘Prihvatili smo, pa nas obavijesti kako je ovo započelo.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Allah, Silan i Uzvišen, bio je na Aršu i bio je prije svega. U Ploču je zapisao sve što će biti.’ Tada mi je došao neko i rekao: ‘Imrane, ova tvoja deva oslobodila se svoje spone!’ Ustao sam, a između mene i nje pružala se fatamorgana, pa ne znam šta je bilo poslije toga.“","ar_ranges":[[0,179]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ عَنْ جَامِعِ ابن شَدَّادٍ، عَنْ صَفْوَانَ بْنِ مُحْرِزٍ، عَنْ عِمْرَانَ بن الحصين، قال: [قال رسول الله ص: \u003c/span>اقْبَلُوا الْبُشْرَى يَا بَنِي تَمِيمٍ، فَقَالُوا: قَدْ بَشَّرْتَنَا فَأَعْطِنَا فَقَالَ:\nاقْبَلُوا الْبُشْرَى يَا أَهْلَ الْيَمَنِ، فَقَالُوا: قَدْ قَبِلْنَا، فَأَخْبِرْنَا عَنْ هَذَا الأمر كيف كان؟ فقال رسول الله ص: كَانَ اللَّهُ عَزَّ وَجَلَّ عَلَى الْعَرْشِ، وَكَانَ قَبْلَ كُلِّ شَيْءٍ، وَكَتَبَ فِي اللَّوْحِ كُلَّ شَيْءٍ يَكُونُ] قَالَ: فَأَتَانِي آتٍ فَقَالَ:\n\nيَا عِمْرَانُ، هَذِهِ نَاقَتُكَ قَدْ حَلَّتْ عِقَالَهَا، فَقُمْتُ، فَإِذَا السَّرَابُ يَنْقَطِعُ بَيْنِي وَبَيْنَهَا، فَلا أَدْرِي مَا كَانَ بَعْدَ ذَلِكَ","bs_ranges":[[0,152]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ebu Kurejb: pričao nam je Ebu Muavija, od A‘meša, od Džami‘a ibn Šeddada, od Safvana ibn Muhriza, od Imrana ibn el-Husajna, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Prihvatite radosnu vijest, o Benu Temim!’ Odgovorili su: ‘Već si nas obradovao, pa nam daj!’ Zatim je rekao: ‘Prihvatite radosnu vijest, stanovnici Jemena!’ Odgovorili su: ‘Prihvatili smo, pa nas obavijesti kako je ovo započelo.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Allah, Silan i Uzvišen, bio je na Aršu i bio je prije svega. U Ploču je zapisao sve što će biti.’ Tada mi je došao neko i rekao: ‘Imrane, ova tvoja deva oslobodila se svoje spone!’ Ustao sam, a između mene i nje pružala se fatamorgana, pa ne znam šta je bilo poslije toga.“"}],"notes":[]},{"n":39,"ar":"ثُمَّ اخْتُلِفَ فِي الَّذِي خَلَقَ تَعَالَى ذِكْرُهُ بَعْدَ الْعَمَاءِ، فَقَالَ بَعْضُهُمْ: خَلَقَ بَعْدَ ذَلِكَ عَرْشَهُ.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنِي مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا أَبُو سَلَمَةَ، قَالَ: حَدَّثَنَا حيان ابن عُبَيْدِ اللَّهِ، عَنِ الضَّحَّاكِ بْنِ مُزَاحِمٍ، قَالَ، قَالَ ابْنُ عَبَّاسٍ: إِنَّ اللَّهَ عَزَّ وَجَلَّ خَلَقَ الْعَرْشَ أَوَّلَ مَا خَلَقَ، فَاسْتَوَى عَلَيْهِ.\n\nوَقَالَ آخَرُونَ: خَلَقَ اللَّهُ عَزَّ وَجَلَّ الْمَاءَ قَبْلَ الْعَرْشِ، ثُمَّ خَلَقَ عَرْشَهُ فَوَضَعَهُ عَلَى الْمَاءِ.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنَا مُوسَى بن هارون الهمداني، قال: حدثنا عمرو بن حَمَّادٍ، قَالَ: حَدَّثَنَا أَسْبَاطُ بْنُ نَصْرٍ، عَنِ السدي في خبر ذكره، عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب رسول الله ص- قَالُوا: إِنَّ اللَّهَ عَزَّ وَجَلَّ كَانَ عَرْشُهُ عَلَى الْمَاءِ، وَلَمْ يَخْلُقْ شَيْئًا غَيْرَ مَا خَلَقَ قَبْلَ الْمَاءِ.\n\nحَدَّثَنِي مُحَمَّدُ بْنُ سَهْلِ بن عسكر، قال: حدثنا إسماعيل بن عبد الكريم، قال: حدثني عبد الصمد بن معقل، قال: سمعت وهب بن منبه يقول: إن العرش كان قبل ان يخلق السَّمَوَاتِ وَالأَرْضَ عَلَى الْمَاءِ، فَلَمَّا أَرَادَ أَنْ يَخْلُقَ السَّمَوَاتِ وَالأَرْضَ قَبَضَ مِنْ صَفَاةِ الْمَاءِ قَبْضَةً، ثُمَّ فَتَحَ الْقَبْضَةَ فَارْتَفَعَتْ دُخَانًا، ثُمَّ قَضَاهُنَّ سَبْعَ سَمَوَاتٍ فِي يَوْمَيْنِ، وَدَحَا الأَرْضَ فِي يَوْمَيْنِ، وَفَرَغَ مِنَ الْخَلْقِ الْيَوْمَ السَّابِعَ.\n\nوَقَدْ قِيلَ: إِنَّ الَّذِي خَلَقَ رَبُّنَا عَزَّ وَجَلَّ بَعْدَ الْقَلَمِ الْكُرْسِيَّ، ثُمَّ خَلَقَ بَعْدَ الْكُرْسِيِّ الْعَرْشَ، ثُمَّ بَعْدَ ذَلِكَ خَلَقَ الْهَوَاءَ وَالظُّلُمَاتِ، ثُمَّ خَلَقَ الْمَاءَ، فَوَضَعَ عَرْشَهُ عَلَيْهِ","bs":"\u003cp data-paragraph=\"39.1\">Zatim su se razišli o tome šta je On, Uzvišen je spomen Njegov, stvorio poslije oblaka. Neki su rekli: „Nakon toga stvorio je Svoj Arš.“\u003c/p>\u003cp data-paragraph=\"39.2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"39.3\">Pričao mi je Muhammed ibn Sinan: pričao nam je Ebu Selema: rekao je: pričao nam je Hajjan ibn Ubejdullah, od Dahhaka ibn Muzahima, koji je rekao: Ibn Abbas rekao je: „Allah, Silan i Uzvišen, najprije je stvorio Arš, pa se nad njim uzvisio.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: استوى عليه ovdje je prevedeno „nad njim se uzvisio“; ovo je tekst predaje, a ne dodano objašnjenje načina ili kakvoće.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"39.4\">Drugi su rekli: „Allah, Silan i Uzvišen, stvorio je vodu prije Arša, zatim je stvorio Svoj Arš i postavio ga na vodu.“\u003c/p>\u003cp data-paragraph=\"39.5\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"39.6\">Pričao nam je Musa ibn Harun el-Hemdani: rekao je: pričao nam je Amr ibn Hammad: rekao je: pričao nam je Esbat ibn Nasr, od Suddija, u izvješću koje je naveo, od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, koji su rekli: „Arš Allaha, Silnog i Uzvišenog, bio je na vodi, a On nije stvorio ništa drugo osim onoga što je stvorio prije vode.“\u003c/p>\u003cp data-paragraph=\"39.7\">Pričao mi je Muhammed ibn Sehl ibn Asker: rekao je: pričao nam je Ismail ibn Abdulkerim: rekao je: pričao mi je Abdussamed ibn Ma‘kil, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: „Arš je, prije stvaranja nebesa i Zemlje, bio na vodi. Kada je htio stvoriti nebesa i Zemlju, zahvatio je pregršt s površine vode, zatim je otvorio šaku pa se to podiglo kao dim. Potom je od njih u dva dana sačinio sedam nebesa, u dva dana rasprostro Zemlju i dovršio stvaranje sedmog dana.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izraz صفاة الماء preveden je „površina vode“; tačno čitanje i značenje riječi صفاة u ovom spoju zahtijevaju provjeru štampanog izdanja.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"39.8\">Rečeno je i da je ono što je naš Gospodar, Silan i Uzvišen, stvorio nakon pera bio Kursijj. Zatim je, nakon Kursijja, stvorio Arš, potom zrak i tmine, zatim vodu, pa je na nju postavio Svoj Arš.\u003c/p>","paragraphs":[{"id":"39.1","ar":"ثُمَّ اخْتُلِفَ فِي الَّذِي خَلَقَ تَعَالَى ذِكْرُهُ بَعْدَ الْعَمَاءِ، فَقَالَ بَعْضُهُمْ: خَلَقَ بَعْدَ ذَلِكَ عَرْشَهُ.","bs":"Zatim su se razišli o tome šta je On, Uzvišen je spomen Njegov, stvorio poslije oblaka. Neki su rekli: „Nakon toga stvorio je Svoj Arš.“","ar_ranges":[],"ar_html":"ثُمَّ اخْتُلِفَ فِي الَّذِي خَلَقَ تَعَالَى ذِكْرُهُ بَعْدَ الْعَمَاءِ، فَقَالَ بَعْضُهُمْ: خَلَقَ بَعْدَ ذَلِكَ عَرْشَهُ.","bs_ranges":[],"bs_html":"Zatim su se razišli o tome šta je On, Uzvišen je spomen Njegov, stvorio poslije oblaka. Neki su rekli: „Nakon toga stvorio je Svoj Arš.“"},{"id":"39.2","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"39.3","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا أَبُو سَلَمَةَ، قَالَ: حَدَّثَنَا حيان ابن عُبَيْدِ اللَّهِ، عَنِ الضَّحَّاكِ بْنِ مُزَاحِمٍ، قَالَ، قَالَ ابْنُ عَبَّاسٍ: إِنَّ اللَّهَ عَزَّ وَجَلَّ خَلَقَ الْعَرْشَ أَوَّلَ مَا خَلَقَ، فَاسْتَوَى عَلَيْهِ.","bs":"Pričao mi je Muhammed ibn Sinan: pričao nam je Ebu Selema: rekao je: pričao nam je Hajjan ibn Ubejdullah, od Dahhaka ibn Muzahima, koji je rekao: Ibn Abbas rekao je: „Allah, Silan i Uzvišen, najprije je stvorio Arš, pa se nad njim uzvisio.“ ⟦Napomena prevodioca: استوى عليه ovdje je prevedeno „nad njim se uzvisio“; ovo je tekst predaje, a ne dodano objašnjenje načina ili kakvoće.⟧","ar_ranges":[[0,169]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا أَبُو سَلَمَةَ، قَالَ: حَدَّثَنَا حيان ابن عُبَيْدِ اللَّهِ، عَنِ الضَّحَّاكِ بْنِ مُزَاحِمٍ، قَالَ، قَالَ ابْنُ عَبَّاسٍ: \u003c/span>إِنَّ اللَّهَ عَزَّ وَجَلَّ خَلَقَ الْعَرْشَ أَوَّلَ مَا خَلَقَ، فَاسْتَوَى عَلَيْهِ.","bs_ranges":[[0,166]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sinan: pričao nam je Ebu Selema: rekao je: pričao nam je Hajjan ibn Ubejdullah, od Dahhaka ibn Muzahima, koji je rekao: Ibn Abbas rekao je: \u003c/span>„Allah, Silan i Uzvišen, najprije je stvorio Arš, pa se nad njim uzvisio.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: استوى عليه ovdje je prevedeno „nad njim se uzvisio“; ovo je tekst predaje, a ne dodano objašnjenje načina ili kakvoće.⟧\u003c/span>"},{"id":"39.4","ar":"وَقَالَ آخَرُونَ: خَلَقَ اللَّهُ عَزَّ وَجَلَّ الْمَاءَ قَبْلَ الْعَرْشِ، ثُمَّ خَلَقَ عَرْشَهُ فَوَضَعَهُ عَلَى الْمَاءِ.","bs":"Drugi su rekli: „Allah, Silan i Uzvišen, stvorio je vodu prije Arša, zatim je stvorio Svoj Arš i postavio ga na vodu.“","ar_ranges":[],"ar_html":"وَقَالَ آخَرُونَ: خَلَقَ اللَّهُ عَزَّ وَجَلَّ الْمَاءَ قَبْلَ الْعَرْشِ، ثُمَّ خَلَقَ عَرْشَهُ فَوَضَعَهُ عَلَى الْمَاءِ.","bs_ranges":[],"bs_html":"Drugi su rekli: „Allah, Silan i Uzvišen, stvorio je vodu prije Arša, zatim je stvorio Svoj Arš i postavio ga na vodu.“"},{"id":"39.5","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"39.6","ar":"حَدَّثَنَا مُوسَى بن هارون الهمداني، قال: حدثنا عمرو بن حَمَّادٍ، قَالَ: حَدَّثَنَا أَسْبَاطُ بْنُ نَصْرٍ، عَنِ السدي في خبر ذكره، عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب رسول الله ص- قَالُوا: إِنَّ اللَّهَ عَزَّ وَجَلَّ كَانَ عَرْشُهُ عَلَى الْمَاءِ، وَلَمْ يَخْلُقْ شَيْئًا غَيْرَ مَا خَلَقَ قَبْلَ الْمَاءِ.","bs":"Pričao nam je Musa ibn Harun el-Hemdani: rekao je: pričao nam je Amr ibn Hammad: rekao je: pričao nam je Esbat ibn Nasr, od Suddija, u izvješću koje je naveo, od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, koji su rekli: „Arš Allaha, Silnog i Uzvišenog, bio je na vodi, a On nije stvorio ništa drugo osim onoga što je stvorio prije vode.“","ar_ranges":[[0,248]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُوسَى بن هارون الهمداني، قال: حدثنا عمرو بن حَمَّادٍ، قَالَ: حَدَّثَنَا أَسْبَاطُ بْنُ نَصْرٍ، عَنِ السدي في خبر ذكره، عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب رسول الله ص- قَالُوا: \u003c/span>إِنَّ اللَّهَ عَزَّ وَجَلَّ كَانَ عَرْشُهُ عَلَى الْمَاءِ، وَلَمْ يَخْلُقْ شَيْئًا غَيْرَ مَا خَلَقَ قَبْلَ الْمَاءِ.","bs_ranges":[[0,340]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Musa ibn Harun el-Hemdani: rekao je: pričao nam je Amr ibn Hammad: rekao je: pričao nam je Esbat ibn Nasr, od Suddija, u izvješću koje je naveo, od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, koji su rekli: \u003c/span>„Arš Allaha, Silnog i Uzvišenog, bio je na vodi, a On nije stvorio ništa drugo osim onoga što je stvorio prije vode.“"},{"id":"39.7","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ سَهْلِ بن عسكر، قال: حدثنا إسماعيل بن عبد الكريم، قال: حدثني عبد الصمد بن معقل، قال: سمعت وهب بن منبه يقول: إن العرش كان قبل ان يخلق السَّمَوَاتِ وَالأَرْضَ عَلَى الْمَاءِ، فَلَمَّا أَرَادَ أَنْ يَخْلُقَ السَّمَوَاتِ وَالأَرْضَ قَبَضَ مِنْ صَفَاةِ الْمَاءِ قَبْضَةً، ثُمَّ فَتَحَ الْقَبْضَةَ فَارْتَفَعَتْ دُخَانًا، ثُمَّ قَضَاهُنَّ سَبْعَ سَمَوَاتٍ فِي يَوْمَيْنِ، وَدَحَا الأَرْضَ فِي يَوْمَيْنِ، وَفَرَغَ مِنَ الْخَلْقِ الْيَوْمَ السَّابِعَ.","bs":"Pričao mi je Muhammed ibn Sehl ibn Asker: rekao je: pričao nam je Ismail ibn Abdulkerim: rekao je: pričao mi je Abdussamed ibn Ma‘kil, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: „Arš je, prije stvaranja nebesa i Zemlje, bio na vodi. Kada je htio stvoriti nebesa i Zemlju, zahvatio je pregršt s površine vode, zatim je otvorio šaku pa se to podiglo kao dim. Potom je od njih u dva dana sačinio sedam nebesa, u dva dana rasprostro Zemlju i dovršio stvaranje sedmog dana.“ ⟦Napomena prevodioca: izraz صفاة الماء preveden je „površina vode“; tačno čitanje i značenje riječi صفاة u ovom spoju zahtijevaju provjeru štampanog izdanja.⟧","ar_ranges":[[0,134]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ سَهْلِ بن عسكر، قال: حدثنا إسماعيل بن عبد الكريم، قال: حدثني عبد الصمد بن معقل، قال: سمعت وهب بن منبه يقول: \u003c/span>إن العرش كان قبل ان يخلق السَّمَوَاتِ وَالأَرْضَ عَلَى الْمَاءِ، فَلَمَّا أَرَادَ أَنْ يَخْلُقَ السَّمَوَاتِ وَالأَرْضَ قَبَضَ مِنْ صَفَاةِ الْمَاءِ قَبْضَةً، ثُمَّ فَتَحَ الْقَبْضَةَ فَارْتَفَعَتْ دُخَانًا، ثُمَّ قَضَاهُنَّ سَبْعَ سَمَوَاتٍ فِي يَوْمَيْنِ، وَدَحَا الأَرْضَ فِي يَوْمَيْنِ، وَفَرَغَ مِنَ الْخَلْقِ الْيَوْمَ السَّابِعَ.","bs_ranges":[[0,191]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sehl ibn Asker: rekao je: pričao nam je Ismail ibn Abdulkerim: rekao je: pričao mi je Abdussamed ibn Ma‘kil, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: \u003c/span>„Arš je, prije stvaranja nebesa i Zemlje, bio na vodi. Kada je htio stvoriti nebesa i Zemlju, zahvatio je pregršt s površine vode, zatim je otvorio šaku pa se to podiglo kao dim. Potom je od njih u dva dana sačinio sedam nebesa, u dva dana rasprostro Zemlju i dovršio stvaranje sedmog dana.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izraz صفاة الماء preveden je „površina vode“; tačno čitanje i značenje riječi صفاة u ovom spoju zahtijevaju provjeru štampanog izdanja.⟧\u003c/span>"},{"id":"39.8","ar":"وَقَدْ قِيلَ: إِنَّ الَّذِي خَلَقَ رَبُّنَا عَزَّ وَجَلَّ بَعْدَ الْقَلَمِ الْكُرْسِيَّ، ثُمَّ خَلَقَ بَعْدَ الْكُرْسِيِّ الْعَرْشَ، ثُمَّ بَعْدَ ذَلِكَ خَلَقَ الْهَوَاءَ وَالظُّلُمَاتِ، ثُمَّ خَلَقَ الْمَاءَ، فَوَضَعَ عَرْشَهُ عَلَيْهِ","bs":"Rečeno je i da je ono što je naš Gospodar, Silan i Uzvišen, stvorio nakon pera bio Kursijj. Zatim je, nakon Kursijja, stvorio Arš, potom zrak i tmine, zatim vodu, pa je na nju postavio Svoj Arš.","ar_ranges":[],"ar_html":"وَقَدْ قِيلَ: إِنَّ الَّذِي خَلَقَ رَبُّنَا عَزَّ وَجَلَّ بَعْدَ الْقَلَمِ الْكُرْسِيَّ، ثُمَّ خَلَقَ بَعْدَ الْكُرْسِيِّ الْعَرْشَ، ثُمَّ بَعْدَ ذَلِكَ خَلَقَ الْهَوَاءَ وَالظُّلُمَاتِ، ثُمَّ خَلَقَ الْمَاءَ، فَوَضَعَ عَرْشَهُ عَلَيْهِ","bs_ranges":[],"bs_html":"Rečeno je i da je ono što je naš Gospodar, Silan i Uzvišen, stvorio nakon pera bio Kursijj. Zatim je, nakon Kursijja, stvorio Arš, potom zrak i tmine, zatim vodu, pa je na nju postavio Svoj Arš."}],"notes":[]},{"n":40,"ar":"قال أبو جعفر: وأولى القولين في ذلك عندي بالصواب قول من قال: إن الله تبارك وتعالى خلق الماء قبل العرش، لصحة الخبر الذي ذكرت قبل عن أبي رزين العقيلي عن [رسول الله ص أنه قال حين سئل:\nأين كان ربنا عز وجل قبل أن يخلق خلقه؟ قال: كان في عماء، ما تحته هواء، وما فوقه هواء، ثم خلق عرشه على الماء،] فاخبر ص أن الله خلق عرشه على الماء ومحال إذ كان خلقه على الماء أن يكون خلقه عليه، والذي خلقه عليه غير موجود، إما قبله أو معه، فإذا كان ذلك كذلك، فالعرش لا يخلو من أحد أمرين، إما أن يكون خلق بعد خلق الله الماء، وإما أن يكون خلق هو والماء معا فأما أن يكون خلقه قبل خلق الماء، فذلك غير جائز صحته على ما روى عن ابى رزين، عن النبي ص.\n\nوقد قيل: إن الماء كان على متن الريح حين خلق عرشه عليه، فإن كان ذلك كذلك، فقد كان الماء والريح خلقا قبل العرش.\n\nذكر من قال: كان الماء على متن الريح:\n\nحَدَّثَنِي ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنِ المنهال بن عمرو، عن سعيد بن جبير، قَالَ: سُئِلَ ابْنُ عَبَّاسٍ عَنْ قَوْلِهِ عَزَّ وجل:\n\n«وَكانَ عَرْشُهُ عَلَى الْماءِ» : عَلَى أَيِّ شَيْءٍ كَانَ الْمَاءُ؟ قَالَ: عَلَى مَتْنِ الرِّيحِ.\n\nحَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، حَدَّثَنَا مُحَمَّدُ بْنُ ثَوْرٍ، عَنْ مَعْمَرٍ، عَنِ الأَعْمَشِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: سُئِلَ ابْنُ عَبَّاسٍ عَنْ قَوْلِهِ عَزَّ وَجَلَّ:\n\n«وَكَانَ عرشه على الماء» : عَلَى أَيِّ شَيْءٍ كَانَ الْمَاءُ؟ قَالَ: عَلَى متن الريح","bs":"\u003cp data-paragraph=\"40.1\">Ebu Džafer kaže: Od dva mišljenja smatram ispravnijim ono prema kojem je Allah, Blagoslovljen i Uzvišen, stvorio vodu prije Arša, zbog vjerodostojnosti predaje koju sam ranije naveo od Ebu Rezina el-Ukajlija, od Allahovog Poslanika, sallallahu alejhi ve sellem. Kada je upitan: „Gdje je bio naš Gospodar, Silan i Uzvišen, prije nego što je stvorio Svoja stvorenja?“, odgovorio je: „Bio je u oblaku; ispod njega nije bilo zraka, niti je iznad njega bilo zraka. Zatim je stvorio Svoj Arš na vodi.“ Time je on, sallallahu alejhi ve sellem, izvijestio da je Allah stvorio Svoj Arš na vodi. Ako ga je stvorio na vodi, nemoguće je da ga je stvorio na njoj a da ono na čemu ga je stvorio nije postojalo, bilo prije njega, bilo istovremeno s njim. Ako je tako, postoje samo dvije mogućnosti: ili je Arš stvoren nakon što je Allah stvorio vodu ili su Arš i voda stvoreni zajedno. Da ga je stvorio prije stvaranja vode ne može biti ispravno prema onome što je preneseno od Ebu Rezina, od Vjerovjesnika, sallallahu alejhi ve sellem. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: ista jezička nejasnoća u izrazu ما تحته هواء وما فوقه هواء označena je na stranici 37; ovdje je dosljedno zadržano isto čitanje.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"40.2\">Rečeno je da je voda bila na leđima vjetra kada je na njoj stvorio Svoj Arš. Ako je bilo tako, onda su voda i vjetar bili stvoreni prije Arša.\u003c/p>\u003cp data-paragraph=\"40.3\">Spomen onih koji su rekli da je voda bila na leđima vjetra:\u003c/p>\u003cp data-paragraph=\"40.4\">Pričao mi je Ibn Veki‘: rekao je: pričao nam je moj otac, od Sufjana, od A‘meša, od Minhala ibn Amra, od Seida ibn Džubejra, koji je rekao: „Ibn Abbas upitan je, povodom riječi Njega, Silnog i Uzvišenog: ‘A Njegov Arš bio je na vodi’: ‘Na čemu je bila voda?’ Odgovorio je: ‘Na leđima vjetra.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"40.5\">Pričao nam je Muhammed ibn Abdula‘la: pričao nam je Muhammed ibn Sevr, od Ma‘mera, od A‘meša, od Seida ibn Džubejra, koji je rekao: „Ibn Abbas upitan je, povodom riječi Njega, Silnog i Uzvišenog: ‘A Njegov Arš bio je na vodi’: ‘Na čemu je bila voda?’ Odgovorio je: ‘Na leđima vjetra.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"40.1","ar":"قال أبو جعفر: وأولى القولين في ذلك عندي بالصواب قول من قال: إن الله تبارك وتعالى خلق الماء قبل العرش، لصحة الخبر الذي ذكرت قبل عن أبي رزين العقيلي عن [رسول الله ص أنه قال حين سئل:\nأين كان ربنا عز وجل قبل أن يخلق خلقه؟ قال: كان في عماء، ما تحته هواء، وما فوقه هواء، ثم خلق عرشه على الماء،] فاخبر ص أن الله خلق عرشه على الماء ومحال إذ كان خلقه على الماء أن يكون خلقه عليه، والذي خلقه عليه غير موجود، إما قبله أو معه، فإذا كان ذلك كذلك، فالعرش لا يخلو من أحد أمرين، إما أن يكون خلق بعد خلق الله الماء، وإما أن يكون خلق هو والماء معا فأما أن يكون خلقه قبل خلق الماء، فذلك غير جائز صحته على ما روى عن ابى رزين، عن النبي ص.","bs":"Ebu Džafer kaže: Od dva mišljenja smatram ispravnijim ono prema kojem je Allah, Blagoslovljen i Uzvišen, stvorio vodu prije Arša, zbog vjerodostojnosti predaje koju sam ranije naveo od Ebu Rezina el-Ukajlija, od Allahovog Poslanika, sallallahu alejhi ve sellem. Kada je upitan: „Gdje je bio naš Gospodar, Silan i Uzvišen, prije nego što je stvorio Svoja stvorenja?“, odgovorio je: „Bio je u oblaku; ispod njega nije bilo zraka, niti je iznad njega bilo zraka. Zatim je stvorio Svoj Arš na vodi.“ Time je on, sallallahu alejhi ve sellem, izvijestio da je Allah stvorio Svoj Arš na vodi. Ako ga je stvorio na vodi, nemoguće je da ga je stvorio na njoj a da ono na čemu ga je stvorio nije postojalo, bilo prije njega, bilo istovremeno s njim. Ako je tako, postoje samo dvije mogućnosti: ili je Arš stvoren nakon što je Allah stvorio vodu ili su Arš i voda stvoreni zajedno. Da ga je stvorio prije stvaranja vode ne može biti ispravno prema onome što je preneseno od Ebu Rezina, od Vjerovjesnika, sallallahu alejhi ve sellem. ⟦Napomena prevodioca: ista jezička nejasnoća u izrazu ما تحته هواء وما فوقه هواء označena je na stranici 37; ovdje je dosljedno zadržano isto čitanje.⟧","ar_ranges":[],"ar_html":"قال أبو جعفر: وأولى القولين في ذلك عندي بالصواب قول من قال: إن الله تبارك وتعالى خلق الماء قبل العرش، لصحة الخبر الذي ذ etar bili stvoreni prije Arša.","ar_ranges":[],"ar_html":"وقد قيل: إن الماء كان على متن الريح حين خلق عرشه عليه، فإن كان ذلك كذلك، فقد كان الماء والريح خلقا قبل العرش.","bs_ranges":[],"bs_html":"Rečeno je da je voda bila na leđima vjetra kada je na njoj stvorio Svoj Arš. Ako je bilo tako, onda su voda i vjetar bili stvoreni prije Arša."},{"id":"40.3","ar":"ذكر من قال: كان الماء على متن الريح:","bs":"Spomen onih koji su rekli da je voda bila na leđima vjetra:","ar_ranges":[],"ar_html":"ذكر من قال: كان الماء على متن الريح:","bs_ranges":[],"bs_html":"Spomen onih koji su rekli da je voda bila na leđima vjetra:"},{"id":"40.4","ar":"حَدَّثَنِي ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنِ المنهال بن عمرو، عن سعيد بن جبير، قَالَ: سُئِلَ ابْنُ عَبَّاسٍ عَنْ قَوْلِهِ عَزَّ وجل:\n\n«وَكانَ عَرْشُهُ عَلَى الْماءِ» : عَلَى أَيِّ شَيْءٍ كَانَ الْمَاءُ؟ قَالَ: عَلَى مَتْنِ الرِّيحِ.","bs":"Pričao mi je Ibn Veki‘: rekao je: pričao nam je moj otac, od Sufjana, od A‘meša, od Minhala ibn Amra, od Seida ibn Džubejra, koji je rekao: „Ibn Abbas upitan je, povodom riječi Njega, Silnog i Uzvišenog: ‘A Njegov Arš bio je na vodi’: ‘Na čemu je bila voda?’ Odgovorio je: ‘Na leđima vjetra.’“ ⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧","ar_ranges":[[0,130]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنِ المنهال بن عمرو، عن سعيد بن جبير، قَالَ: \u003c/span>سُئِلَ ابْنُ عَبَّاسٍ عَنْ قَوْلِهِ عَزَّ وجل:\n\n«وَكانَ عَرْشُهُ عَلَى الْماءِ» : عَلَى أَيِّ شَيْءٍ كَانَ الْمَاءُ؟ قَالَ: عَلَى مَتْنِ الرِّيحِ.","bs_ranges":[[0,140]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ibn Veki‘: rekao je: pričao nam je moj otac, od Sufjana, od A‘meša, od Minhala ibn Amra, od Seida ibn Džubejra, koji je rekao: \u003c/span>„Ibn Abbas upitan je, povodom riječi Njega, Silnog i Uzvišenog: ‘A Njegov Arš bio je na vodi’: ‘Na čemu je bila voda?’ Odgovorio je: ‘Na leđima vjetra.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>"},{"id":"40.5","ar":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، حَدَّثَنَا مُحَمَّدُ بْنُ ثَوْرٍ، عَنْ مَعْمَرٍ، عَنِ الأَعْمَشِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: سُئِلَ ابْنُ عَبَّاسٍ عَنْ قَوْلِهِ عَزَّ وَجَلَّ:\n\n«وَكَانَ عرشه على الماء» : عَلَى أَيِّ شَيْءٍ كَانَ الْمَاءُ؟ قَالَ: عَلَى متن الريح","bs":"Pričao nam je Muhammed ibn Abdula‘la: pričao nam je Muhammed ibn Sevr, od Ma‘mera, od A‘meša, od Seida ibn Džubejra, koji je rekao: „Ibn Abbas upitan je, povodom riječi Njega, Silnog i Uzvišenog: ‘A Njegov Arš bio je na vodi’: ‘Na čemu je bila voda?’ Odgovorio je: ‘Na leđima vjetra.’“ ⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧","ar_ranges":[[0,145]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، حَدَّثَنَا مُحَمَّدُ بْنُ ثَوْرٍ، عَنْ مَعْمَرٍ، عَنِ الأَعْمَشِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: \u003c/span>سُئِلَ ابْنُ عَبَّاسٍ عَنْ قَوْلِهِ عَزَّ وَجَلَّ:\n\n«وَكَانَ عرشه على الماء» : عَلَى أَيِّ شَيْءٍ كَانَ الْمَاءُ؟ قَالَ: عَلَى متن الريح","bs_ranges":[[0,132]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Abdula‘la: pričao nam je Muhammed ibn Sevr, od Ma‘mera, od A‘meša, od Seida ibn Džubejra, koji je rekao: \u003c/span>„Ibn Abbas upitan je, povodom riječi Njega, Silnog i Uzvišenog: ‘A Njegov Arš bio je na vodi’: ‘Na čemu je bila voda?’ Odgovorio je: ‘Na leđima vjetra.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>"}],"notes":[]},{"n":41,"ar":"حدثنا القاسم بن الحسن، حَدَّثَنَا الْحُسَيْنُ بْنُ دَاوُدَ، حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ مِثْلَهُ.\n\nقَالَ: وَالسَّمَوَاتُ وَالأَرْضُ وَكُلُّ مَا فِيهِنَّ مِنْ شَيْءٍ يُحِيطُ بِهَا الْبِحَارُ، وَيُحِيطُ بِذَلِكَ كُلِّهِ الْهَيْكَلُ، وَيُحِيطُ بِالْهَيْكَلِ- فِيمَا قِيلَ- الْكُرْسِيُّ.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنِي مُحَمَّدُ بْنُ سهل بن عسكر، حَدَّثَنَا إسماعيل بن عبد الكريم، قال: حدثني عبد الصمد أنه سمع وهبا يقول- وذكر من عظمته- فقال: إن السموات والأرض والبحار لفي الهيكل، وإن الهيكل لفي الكرسي، وإن قدميه عز وجل لعلى الكرسي، وهو يحمل الكرسي، وقد عاد الكرسي كالنعل في قدميه.\n\nوسئل وهب: ما الهيكل؟ قال: شيء من أطراف السموات محدق بالأرضين والبحار كأطناب الفسطاط.\n\nوسئل وهب عن الأرضين: كيف هي؟ قال: هي سبع أرضين ممهدة جزائر، بين كل أرضين بحر، والبحر محيط بذلك كله، والهيكل من وراء البحر وقد قيل: إنه كان بين خلقه القلم وخلقه سائر خلقه ألف عام.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنَا القاسم بن الحسن، قال: حَدَّثَنَا الحسين بن داود، قال: حَدَّثَنَا مبشر الحلبي، عن أرطاة بن المنذر، قال: سمعت ضمرة يقول: إن الله خلق القلم، فكتب به ما هو خالق وما هو كائن من خلقه، ثم إن ذلك الكتاب سبح الله ومجده ألف عام قبل أن يخلق شيئا من الخلق، فلما أراد جل جلاله خلق السموات والأرض خلق- فيما ذكر- أياما ستة، فسمى كل يوم منهن باسم غير الذي سمى به الآخر","bs":"\u003cp data-paragraph=\"41.1\">Pričao nam je Kasim ibn el-Hasen: pričao nam je Husejn ibn Davud: pričao mi je Hadždžadž, od Ibn Džurejdža, od Seida ibn Džubejra, od Ibn Abbasa, isto to.\u003c/p>\u003cp data-paragraph=\"41.2\">Rekao je: „Nebesa, Zemlju i sve što je u njima okružuju mora. Sve to okružuje hejkel, a hejkel, prema onome što je rečeno, okružuje Kursijj.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: الهيكل je preneseno kao „hejkel“, naziv za strukturu koju naredna predaja opisuje; nije poistovjećeno s Aršom ili Kursijjem.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"41.3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"41.4\">Pričao mi je Muhammed ibn Sehl ibn Asker: pričao nam je Ismail ibn Abdulkerim: rekao je: pričao mi je Abdussamed da je čuo Vehba kako govori — pa je spomenuo Njegovu veličinu i rekao: „Nebesa, Zemlja i mora nalaze se u hejkelu, hejkel se nalazi u Kursijju, a Njegova stopala, Silan je i Uzvišen, na Kursijju su. On nosi Kursijj i Kursijj je postao poput sandale na Njegovim stopalima.“\u003c/p>\u003cp data-paragraph=\"41.5\">Vehb je upitan: „Šta je hejkel?“ Odgovorio je: „Nešto od krajeva nebesa što okružuje zemlje i mora poput užadi šatora.“\u003c/p>\u003cp data-paragraph=\"41.6\">Vehb je upitan o zemljama: „Kakve su?“ Odgovorio je: „To je sedam zemalja, rasprostrtih kao otoci. Između svake dvije zemlje nalazi se more; more sve to okružuje, a hejkel je iza mora.“ Rečeno je da je između Njegovog stvaranja pera i stvaranja ostalih stvorenja bilo hiljadu godina.\u003c/p>\u003cp data-paragraph=\"41.7\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"41.8\">Pričao nam je Kasim ibn el-Hasen: rekao je: pričao nam je Husejn ibn Davud: rekao je: pričao nam je Mubeššir el-Halebi, od Ertaa ibn el-Munzira, koji je rekao: čuo sam Damru kako govori: „Allah je stvorio pero, pa je njime zapisao ono što će stvoriti i ono što će biti od Njegovih stvorenja. Zatim je taj zapis hiljadu godina slavio i veličao Allaha, prije nego što je stvorio išta od stvorenja. Kada je, Uzvišeno je Njegovo veličanstvo, htio stvoriti nebesa i Zemlju, stvorio je — prema onome što je navedeno — šest dana, pa je svakome dao ime različito od imena drugoga.“\u003c/p>","paragraphs":[{"id":"41.1","ar":"حدثنا القاسم بن الحسن، حَدَّثَنَا الْحُسَيْنُ بْنُ دَاوُدَ، حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ مِثْلَهُ.","bs":"Pričao nam je Kasim ibn el-Hasen: pričao nam je Husejn ibn Davud: pričao mi je Hadždžadž, od Ibn Džurejdža, od Seida ibn Džubejra, od Ibn Abbasa, isto to.","ar_ranges":[[0,150]],"ar_html":"\u003cspan class=\"isnad\">حدثنا القاسم بن الحسن، حَدَّثَنَا الْحُسَيْنُ بْنُ دَاوُدَ، حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ \u003c/span>مِثْلَهُ.","bs_ranges":[[0,146]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Kasim ibn el-Hasen: pričao nam je Husejn ibn Davud: pričao mi je Hadždžadž, od Ibn Džurejdža, od Seida ibn Džubejra, od Ibn Abbasa, \u003c/span>isto to."},{"id":"41.2","ar":"قَالَ: وَالسَّمَوَاتُ وَالأَرْضُ وَكُلُّ مَا فِيهِنَّ مِنْ شَيْءٍ يُحِيطُ بِهَا الْبِحَارُ، وَيُحِيطُ بِذَلِكَ كُلِّهِ الْهَيْكَلُ، وَيُحِيطُ بِالْهَيْكَلِ- فِيمَا قِيلَ- الْكُرْسِيُّ.","bs":"Rekao je: „Nebesa, Zemlju i sve što je u njima okružuju mora. Sve to okružuje hejkel, a hejkel, prema onome što je rečeno, okružuje Kursijj.“ ⟦Napomena prevodioca: الهيكل je preneseno kao „hejkel“, naziv za strukturu koju naredna predaja opisuje; nije poistovjećeno s Aršom ili Kursijjem.⟧","ar_ranges":[],"ar_html":"قَالَ: وَالسَّمَوَاتُ وَالأَرْضُ وَكُلُّ مَا فِيهِنَّ مِنْ شَيْءٍ يُحِيطُ بِهَا الْبِحَارُ، وَيُحِيطُ بِذَلِكَ كُلِّهِ الْهَيْكَلُ، وَيُحِيطُ بِالْهَيْكَلِ- فِيمَا قِيلَ- الْكُرْسِيُّ.","bs_ranges":[],"bs_html":"Rekao je: „Nebesa, Zemlju i sve što je u njima okružuju mora. Sve to okružuje hejkel, a hejkel, prema onome što je rečeno, okružuje Kursijj.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: الهيكل je preneseno kao „hejkel“, naziv za strukturu koju naredna predaja opisuje; nije poistovjećeno s Aršom ili Kursijjem.⟧\u003c/span>"},{"id":"41.3","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"41.4","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ سهل بن عسكر، حَدَّثَنَا إسماعيل بن عبد الكريم، قال: حدثني عبد الصمد أنه سمع وهبا يقول- وذكر من عظمته- فقال: إن السموات والأرض والبحار لفي الهيكل، وإن الهيكل لفي الكرسي، وإن قدميه عز وجل لعلى الكرسي، وهو يحمل الكرسي، وقد عاد الكرسي كالنعل في قدميه.","bs":"Pričao mi je Muhammed ibn Sehl ibn Asker: pričao nam je Ismail ibn Abdulkerim: rekao je: pričao mi je Abdussamed da je čuo Vehba kako govori — pa je spomenuo Njegovu veličinu i rekao: „Nebesa, Zemlja i mora nalaze se u hejkelu, hejkel se nalazi u Kursijju, a Njegova stopala, Silan je i Uzvišen, na Kursijju su. On nosi Kursijj i Kursijj je postao poput sandale na Njegovim stopalima.“","ar_ranges":[[0,134]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي
