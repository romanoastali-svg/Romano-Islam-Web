ان يخلق السَّمَوَاتِ وَالأَرْضَ عَلَى الْمَاءِ، فَلَمَّا أَرَادَ أَنْ يَخْلُقَ السَّمَوَاتِ وَالأَرْضَ قَبَضَ مِنْ صَفَاةِ الْمَاءِ قَبْضَةً، ثُمَّ فَتَحَ الْقَبْضَةَ فَارْتَفَعَتْ دُخَانًا، ثُمَّ قَضَاهُنَّ سَبْعَ سَمَوَاتٍ فِي يَوْمَيْنِ، وَدَحَا الأَرْضَ فِي يَوْمَيْنِ، وَفَرَغَ مِنَ الْخَلْقِ الْيَوْمَ السَّابِعَ.","bs_tekst":"Pričao mi je Muhammed ibn Sehl ibn Asker: rekao je: pričao nam je Ismail ibn Abdulkerim: rekao je: pričao mi je Abdussamed ibn Ma‘kil, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: „Arš je, prije stvaranja nebesa i Zemlje, bio na vodi. Kada je htio stvoriti nebesa i Zemlju, zahvatio je pregršt s površine vode, zatim je otvorio šaku pa se to podiglo kao dim. Potom je od njih u dva dana sačinio sedam nebesa, u dva dana rasprostro Zemlju i dovršio stvaranje sedmog dana.“ ⟦Napomena prevodioca: izraz صفاة الماء preveden je „površina vode“; tačno čitanje i značenje riječi صفاة u ovom spoju zahtijevaju provjeru štampanog izdanja.⟧"},{"stranica":39,"ar_tekst":"وَقَدْ قِيلَ: إِنَّ الَّذِي خَلَقَ رَبُّنَا عَزَّ وَجَلَّ بَعْدَ الْقَلَمِ الْكُرْسِيَّ، ثُمَّ خَلَقَ بَعْدَ الْكُرْسِيِّ الْعَرْشَ، ثُمَّ بَعْدَ ذَلِكَ خَلَقَ الْهَوَاءَ وَالظُّلُمَاتِ، ثُمَّ خَلَقَ الْمَاءَ، فَوَضَعَ عَرْشَهُ عَلَيْهِ","bs_tekst":"Rečeno je i da je ono što je naš Gospodar, Silan i Uzvišen, stvorio nakon pera bio Kursijj. Zatim je, nakon Kursijja, stvorio Arš, potom zrak i tmine, zatim vodu, pa je na nju postavio Svoj Arš."},{"stranica":40,"ar_tekst":"قال أبو جعفر: وأولى القولين في ذلك عندي بالصواب قول من قال: إن الله تبارك وتعالى خلق الماء قبل العرش، لصحة الخبر الذي ذكرت قبل عن أبي رزين العقيلي عن [رسول الله ص أنه قال حين سئل:\nأين كان ربنا عز وجل قبل أن يخلق خلقه؟ قال: كان في عماء، ما تحته هواء، وما فوقه هواء، ثم خلق عرشه على الماء،] فاخبر ص أن الله خلق عرشه على الماء ومحال إذ كان خلقه على الماء أن يكون خلقه عليه، والذي خلقه عليه غير موجود، إما قبله أو معه، فإذا كان ذلك كذلك، فالعرش لا يخلو من أحد أمرين، إما أن يكون خلق بعد خلق الله الماء، وإما أن يكون خلق هو والماء معا فأما أن يكون خلقه قبل خلق الماء، فذلك غير جائز صحته على ما روى عن ابى رزين، عن النبي ص.","bs_tekst":"Ebu Džafer kaže: Od dva mišljenja smatram ispravnijim ono prema kojem je Allah, Blagoslovljen i Uzvišen, stvorio vodu prije Arša, zbog vjerodostojnosti predaje koju sam ranije naveo od Ebu Rezina el-Ukajlija, od Allahovog Poslanika, sallallahu alejhi ve sellem. Kada je upitan: „Gdje je bio naš Gospodar, Silan i Uzvišen, prije nego što je stvorio Svoja stvorenja?“, odgovorio je: „Bio je u oblaku; ispod njega nije bilo zraka, niti je iznad njega bilo zraka. Zatim je stvorio Svoj Arš na vodi.“ Time je on, sallallahu alejhi ve sellem, izvijestio da je Allah stvorio Svoj Arš na vodi. Ako ga je stvorio na vodi, nemoguće je da ga je stvorio na njoj a da ono na čemu ga je stvorio nije postojalo, bilo prije njega, bilo istovremeno s njim. Ako je tako, postoje samo dvije mogućnosti: ili je Arš stvoren nakon što je Allah stvorio vodu ili su Arš i voda stvoreni zajedno. Da ga je stvorio prije stvaranja vode ne može biti ispravno prema onome što je preneseno od Ebu Rezina, od Vjerovjesnika, sallallahu alejhi ve sellem. ⟦Napomena prevodioca: ista jezička nejasnoća u izrazu ما تحته هواء وما فوقه هواء označena je na stranici 37; ovdje je dosljedno zadržano isto čitanje.⟧"},{"stranica":40,"ar_tekst":"وقد قيل: إن الماء كان على متن الريح حين خلق عرشه عليه، فإن كان ذلك كذلك، فقد كان الماء والريح خلقا قبل العرش.","bs_tekst":"Rečeno je da je voda bila na leđima vjetra kada je na njoj stvorio Svoj Arš. Ako je bilo tako, onda su voda i vjetar bili stvoreni prije Arša."},{"stranica":40,"ar_tekst":"ذكر من قال: كان الماء على متن الريح:","bs_tekst":"Spomen onih koji su rekli da je voda bila na leđima vjetra:"},{"stranica":40,"ar_tekst":"حَدَّثَنِي ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنِ المنهال بن عمرو، عن سعيد بن جبير، قَالَ: سُئِلَ ابْنُ عَبَّاسٍ عَنْ قَوْلِهِ عَزَّ وجل:\n\n«وَكانَ عَرْشُهُ عَلَى الْماءِ» : عَلَى أَيِّ شَيْءٍ كَانَ الْمَاءُ؟ قَالَ: عَلَى مَتْنِ الرِّيحِ.","bs_tekst":"Pričao mi je Ibn Veki‘: rekao je: pričao nam je moj otac, od Sufjana, od A‘meša, od Minhala ibn Amra, od Seida ibn Džubejra, koji je rekao: „Ibn Abbas upitan je, povodom riječi Njega, Silnog i Uzvišenog: ‘A Njegov Arš bio je na vodi’: ‘Na čemu je bila voda?’ Odgovorio je: ‘Na leđima vjetra.’“ ⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧"},{"stranica":40,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، حَدَّثَنَا مُحَمَّدُ بْنُ ثَوْرٍ، عَنْ مَعْمَرٍ، عَنِ الأَعْمَشِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: سُئِلَ ابْنُ عَبَّاسٍ عَنْ قَوْلِهِ عَزَّ وَجَلَّ:\n\n«وَكَانَ عرشه على الماء» : عَلَى أَيِّ شَيْءٍ كَانَ الْمَاءُ؟ قَالَ: عَلَى متن الريح","bs_tekst":"Pričao nam je Muhammed ibn Abdula‘la: pričao nam je Muhammed ibn Sevr, od Ma‘mera, od A‘meša, od Seida ibn Džubejra, koji je rekao: „Ibn Abbas upitan je, povodom riječi Njega, Silnog i Uzvišenog: ‘A Njegov Arš bio je na vodi’: ‘Na čemu je bila voda?’ Odgovorio je: ‘Na leđima vjetra.’“ ⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧"},{"stranica":41,"ar_tekst":"حدثنا القاسم بن الحسن، حَدَّثَنَا الْحُسَيْنُ بْنُ دَاوُدَ، حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ مِثْلَهُ.","bs_tekst":"Pričao nam je Kasim ibn el-Hasen: pričao nam je Husejn ibn Davud: pričao mi je Hadždžadž, od Ibn Džurejdža, od Seida ibn Džubejra, od Ibn Abbasa, isto to."},{"stranica":41,"ar_tekst":"قَالَ: وَالسَّمَوَاتُ وَالأَرْضُ وَكُلُّ مَا فِيهِنَّ مِنْ شَيْءٍ يُحِيطُ بِهَا الْبِحَارُ، وَيُحِيطُ بِذَلِكَ كُلِّهِ الْهَيْكَلُ، وَيُحِيطُ بِالْهَيْكَلِ- فِيمَا قِيلَ- الْكُرْسِيُّ.","bs_tekst":"Rekao je: „Nebesa, Zemlju i sve što je u njima okružuju mora. Sve to okružuje hejkel, a hejkel, prema onome što je rečeno, okružuje Kursijj.“ ⟦Napomena prevodioca: الهيكل je preneseno kao „hejkel“, naziv za strukturu koju naredna predaja opisuje; nije poistovjećeno s Aršom ili Kursijjem.⟧"},{"stranica":41,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":41,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ سهل بن عسكر، حَدَّثَنَا إسماعيل بن عبد الكريم، قال: حدثني عبد الصمد أنه سمع وهبا يقول- وذكر من عظمته- فقال: إن السموات والأرض والبحار لفي الهيكل، وإن الهيكل لفي الكرسي، وإن قدميه عز وجل لعلى الكرسي، وهو يحمل الكرسي، وقد عاد الكرسي كالنعل في قدميه.","bs_tekst":"Pričao mi je Muhammed ibn Sehl ibn Asker: pričao nam je Ismail ibn Abdulkerim: rekao je: pričao mi je Abdussamed da je čuo Vehba kako govori — pa je spomenuo Njegovu veličinu i rekao: „Nebesa, Zemlja i mora nalaze se u hejkelu, hejkel se nalazi u Kursijju, a Njegova stopala, Silan je i Uzvišen, na Kursijju su. On nosi Kursijj i Kursijj je postao poput sandale na Njegovim stopalima.“"},{"stranica":41,"ar_tekst":"وسئل وهب: ما الهيكل؟ قال: شيء من أطراف السموات محدق بالأرضين والبحار كأطناب الفسطاط.","bs_tekst":"Vehb je upitan: „Šta je hejkel?“ Odgovorio je: „Nešto od krajeva nebesa što okružuje zemlje i mora poput užadi šatora.“"},{"stranica":41,"ar_tekst":"وسئل وهب عن الأرضين: كيف هي؟ قال: هي سبع أرضين ممهدة جزائر، بين كل أرضين بحر، والبحر محيط بذلك كله، والهيكل من وراء البحر وقد قيل: إنه كان بين خلقه القلم وخلقه سائر خلقه ألف عام.","bs_tekst":"Vehb je upitan o zemljama: „Kakve su?“ Odgovorio je: „To je sedam zemalja, rasprostrtih kao otoci. Između svake dvije zemlje nalazi se more; more sve to okružuje, a hejkel je iza mora.“ Rečeno je da je između Njegovog stvaranja pera i stvaranja ostalih stvorenja bilo hiljadu godina."},{"stranica":41,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":41,"ar_tekst":"حَدَّثَنَا القاسم بن الحسن، قال: حَدَّثَنَا الحسين بن داود، قال: حَدَّثَنَا مبشر الحلبي، عن أرطاة بن المنذر، قال: سمعت ضمرة يقول: إن الله خلق القلم، فكتب به ما هو خالق وما هو كائن من خلقه، ثم إن ذلك الكتاب سبح الله ومجده ألف عام قبل أن يخلق شيئا من الخلق، فلما أراد جل جلاله خلق السموات والأرض خلق- فيما ذكر- أياما ستة، فسمى كل يوم منهن باسم غير الذي سمى به الآخر","bs_tekst":"Pričao nam je Kasim ibn el-Hasen: rekao je: pričao nam je Husejn ibn Davud: rekao je: pričao nam je Mubeššir el-Halebi, od Ertaa ibn el-Munzira, koji je rekao: čuo sam Damru kako govori: „Allah je stvorio pero, pa je njime zapisao ono što će stvoriti i ono što će biti od Njegovih stvorenja. Zatim je taj zapis hiljadu godina slavio i veličao Allaha, prije nego što je stvorio išta od stvorenja. Kada je, Uzvišeno je Njegovo veličanstvo, htio stvoriti nebesa i Zemlju, stvorio je — prema onome što je navedeno — šest dana, pa je svakome dao ime različito od imena drugoga.“"},{"stranica":42,"ar_tekst":"وقيل: إن اسم أحد تلك الأيام الستة أبجد، واسم الآخر منهن هوز، واسم الثالث منهن حطي، واسم الرابع منهن كلمن، واسم الخامس منهن سعفص، واسم السادس منهن قرشت.","bs_tekst":"Rečeno je da je ime jednoga od tih šest dana Ebdžed, drugoga Hevvez, trećega Hutti, četvrtoga Kelemen, petoga Sa‘fas, a šestoga Karešet. ⟦Napomena prevodioca: to su nazivi slovnih nizova أبجد، هوز، حطي، كلمن، سعفص، قرشت; sam arapski zapis ovdje nema potpune oznake za izgovor.⟧"},{"stranica":42,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":42,"ar_tekst":"حَدَّثَنِي الحضرمي، قال: حَدَّثَنَا مصرف بن عمرو اليامى، حدثنا حفص ابن غياث، عن العلاء بن المسيب، عن رجل من كنده، قال: سمعت الضحاك ابن مزاحم يقول: خلق الله السموات والأرض في ستة أيام، ليس منها يوم إلا له اسم: أبجد، هوز، حطي، كلمن، سعفص، قرشت وقد حدث به عن حفص غير مصرف وقال: عنه، عن العلاء بن المسيب، قال: حَدَّثَنِي شيخ من كندة قال: لقيت الضحاك بن مزاحم فحدثني قال: سمعت زيد بن أرقم قال: إن الله تعالى خلق السموات والأرض في ستة أيام، لكل يوم منها اسم: أبجد، هوز، حطي، كلمن، سعفص، قرشت.","bs_tekst":"Pričao mi je Hadremi: rekao je: pričao nam je Musarrif ibn Amr el-Jami: pričao nam je Hafs ibn Gijas, od Alaa ibn el-Musejjeba, od jednog čovjeka iz Kinde, koji je rekao: čuo sam Dahhaka ibn Muzahima kako govori: „Allah je stvorio nebesa i Zemlju u šest dana. Nema nijednog od njih a da nema ime: Ebdžed, Hevvez, Hutti, Kelemen, Sa‘fas, Karešet.“ To je od Hafsa prenio i neko drugi, osim Musarrifa, pa je naveo: od njega, od Alaa ibn el-Musejjeba, koji je rekao: pričao mi je jedan starac iz Kinde: „Sreo sam Dahhaka ibn Muzahima pa mi je pričao: čuo sam Zejda ibn Erkama kako kaže: ‘Uzvišeni Allah stvorio je nebesa i Zemlju u šest dana. Svaki od njih ima ime: Ebdžed, Hevvez, Hutti, Kelemen, Sa‘fas, Karešet.’“"},{"stranica":42,"ar_tekst":"وقال آخرون: بل خلق الله واحدا فسماه الأحد، وخلق ثانيا فسماه الاثنين، وخلق ثالثا فسماه الثلاثاء، ورابعا فسماه الأربعاء، وخامسا فسماه الخميس.","bs_tekst":"Drugi su rekli: „Naprotiv, Allah je stvorio jedan dan i nazvao ga el-ehad; stvorio je drugi i nazvao ga el-isnejn; stvorio je treći i nazvao ga es-sulasa; četvrti je nazvao el-erbi‘a, a peti el-hamis.“ ⟦Napomena prevodioca: nazivi znače nedjelja, ponedjeljak, utorak, srijeda i četvrtak; arapski oblici sačuvani su jer se raspravlja o njihovim imenima.⟧"},{"stranica":42,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":42,"ar_tekst":"حَدَّثَنَا تَمِيمُ بن المنتصر، قال: أخبرنا إسحاق، عن شريك، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّهَ خَلَقَ يَوْمًا وَاحِدًا فَسَمَّاهُ الأَحَدَ، ثُمَّ خَلَقَ ثَانِيًا فَسَمَّاهُ الاثْنَيْنَ، ثُمَّ خَلَقَ ثَالِثًا فَسَمَّاهُ الثُّلاثَاءَ، ثُمَّ خَلَقَ رَابِعًا فَسَمَّاهُ الأَرْبِعَاءَ، ثُمَّ خَلَقَ خَامِسًا فَسَمَّاهُ الْخَمِيسَ","bs_tekst":"Pričao nam je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Allah je stvorio jedan dan i nazvao ga el-ehad. Zatim je stvorio drugi i nazvao ga el-isnejn; zatim je stvorio treći i nazvao ga es-sulasa; zatim je stvorio četvrti i nazvao ga el-erbi‘a; zatim je stvorio peti i nazvao ga el-hamis.“"},{"stranica":43,"ar_tekst":"وَهَذَانِ الْقَوْلانِ غَيْرُ مُخْتَلِفَيْنِ، إِذْ كَانَ جَائِزًا ان تكون أَسْمَاءُ ذَلِكَ بِلِسَانِ الْعَرَبِ عَلَى مَا قَالَهُ عَطَاءٌ، وَبِلِسَانِ آخَرِينَ، عَلَى مَا قَالَهُ الضَّحَّاكُ بْنُ مُزَاحِمٍ.","bs_tekst":"Ova dva mišljenja nisu proturječna, jer je moguće da su nazivi tih dana na arapskom onakvi kakve je naveo Ata, a na jeziku drugih onakvi kakve je naveo Dahhak ibn Muzahim."},{"stranica":43,"ar_tekst":"وَقَدْ قِيلَ إِنَّ الأَيَّامَ سَبْعَةٌ لا سِتَّةٌ ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Rečeno je i da dana ima sedam, a ne šest. Spomen onih koji su to rekli:"},{"stranica":43,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ سهل بن عسكر، حَدَّثَنَا إسماعيل بن عبد الكريم، حَدَّثَنِي عبد الصمد بن معقل، قال: سمعت وهب بن منبه: يقول: الأيام سبعة.","bs_tekst":"Pričao mi je Muhammed ibn Sehl ibn Asker: pričao nam je Ismail ibn Abdulkerim: pričao mi je Abdussamed ibn Ma‘kil, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: „Dana ima sedam.“"},{"stranica":43,"ar_tekst":"وكلا القولين- اللذين روينا أحدهما عن الضحاك وعطاء، من أن الله خلق الأيام الستة، والآخر منهما عن وهب بن منبه من أن الأيام سبعة- صحيح مؤتلف غير مختلف، وذلك أن معنى قول عطاء والضحاك في ذلك كان أن الأيام التي خلق الله فيهن الخلق من حين ابتدائه في خلق السماء والأرض وما فيهن إلى أن فرغ من جميعه ستة أيام، كما قال جل ثناؤه: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» ، وأن معنى قول وهب بن منبه في ذلك كان أن عدد الأيام التي هي أيام الجمعة سبعة أيام لا ستة.","bs_tekst":"Oba mišljenja koja smo prenijeli — jedno od Dahhaka i Ataa, da je Allah stvorio šest dana, a drugo od Vehba ibn Munebbiha, da dana ima sedam — ispravna su i međusobno usklađena, a ne proturječna. Ata i Dahhak time su mislili da je bilo šest dana u kojima je Allah stvarao stvorenja, od početka stvaranja neba, Zemlje i onoga što je u njima do dovršetka svega toga, kako je rekao Onaj čija je hvala uzvišena: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Vehb ibn Munebbih time je mislio da je broj dana koji čine sedmicu sedam, a ne šest. ⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧"},{"stranica":43,"ar_tekst":"واختلف السلف في اليوم الذي ابتدأ الله عز وجل فيه في خلق السموات والأرض، فقال بعضهم: ابتدأ في ذلك يوم الأحد.","bs_tekst":"Prethodnici su se razišli o danu u kojem je Allah, Silan i Uzvišen, počeo stvarati nebesa i Zemlju. Neki su rekli: „To je počeo u nedjelju.“"},{"stranica":43,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":43,"ar_tekst":"حَدَّثَنَا إِسْحَاقُ بْنُ شَاهِينَ، حَدَّثَنَا خَالِدُ بْنُ عَبْدِ اللَّهِ، عَنِ الشَّيْبَانِيِّ، عَنْ عَوْنِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، عَنْ أَخِيهِ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، قَالَ: قَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى ابْتَدَأَ الْخَلْقَ، فَخَلَقَ الأَرْضَ يَوْمَ الأَحَدِ وَيَوْمَ الاثْنَيْنِ","bs_tekst":"Pričao nam je Ishak ibn Šahin: pričao nam je Halid ibn Abdullah, od Šejbanija, od Avna ibn Abdullaha ibn Utbe, od njegovog brata Ubejdullaha ibn Abdullaha ibn Utbe, koji je rekao: Abdullah ibn Selam rekao je: „Allah, Blagoslovljen i Uzvišen, započeo je stvaranje, pa je Zemlju stvorio u nedjelju i ponedjeljak.“"},{"stranica":44,"ar_tekst":"حَدَّثَنِي الْمُثَنَّى بْنُ إِبْرَاهِيمَ، حَدَّثَنِي عَبْدُ اللَّهِ بْنُ صَالِحٍ، حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ أَنَّهُ قَالَ: إِنَّ اللَّهَ عَزَّ وَجَلَّ بَدَأَ الْخَلْقَ يَوْمَ الأَحَدِ، فَخَلَقَ الأَرَضِينَ فِي الأَحَدِ وَالاثْنَيْنِ.","bs_tekst":"Pričao mi je Musenna ibn Ibrahim: pričao mi je Abdullah ibn Salih: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, da je rekao: „Allah, Silan i Uzvišen, započeo je stvaranje u nedjelju, pa je zemlje stvorio u nedjelju i ponedjeljak.“"},{"stranica":44,"ar_tekst":"حَدَّثَنَا ابن حميد، قَالَ: حَدَّثَنَا جرير، عن الأعمش، عن أبي صالح، عن كعب، قال: بدأ الله خلق السموات والأرض يوم الأحد والاثنين.","bs_tekst":"Pričao nam je Ibn Humejd: rekao je: pričao nam je Džerir, od A‘meša, od Ebu Saliha, od Ka‘ba, koji je rekao: „Allah je započeo stvaranje nebesa i Zemlje u nedjelju i ponedjeljak.“"},{"stranica":44,"ar_tekst":"حَدَّثَنِي محمد بن أبي منصور الآملي، حَدَّثَنَا علي بن الهيثم، عن المسيب بن شريك، عن أبي روق، عن الضحاك في قوله تعالى: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» قال: من أيام الآخرة، كل يوم مقداره الف سنه، ابتدأ الخلق يوم الأجد.","bs_tekst":"Pričao mi je Muhammed ibn Ebu Mensur el-Amuli: pričao nam je Ali ibn el-Hejsem, od Musejjeba ibn Šerika, od Ebu Revka, od Dahhaka, o riječima Uzvišenog: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Rekao je: „Od dana budućeg svijeta; svaki dan traje hiljadu godina. Stvaranje je započeo u nedjelju.“ ⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta. Napomena prevodioca: u zadnjoj riječi izvora piše الأجد, što izgleda kao greška umjesto الأحد („nedjelja“); čitanje je ovdje naznačeno, a arapski zapis ostavljen neizmijenjen.⟧"},{"stranica":44,"ar_tekst":"حَدَّثَنِي المثنى، حَدَّثَنَا الحجاج، حَدَّثَنَا أبو عوانة، عن أبي بشر، عن مجاهد، قال: بدأ الخلق يوم الأحد وقال آخرون: اليوم الذي ابتدأ الله فيه في ذلك يوم السبت.","bs_tekst":"Pričao mi je Musenna: pričao nam je Hadždžadž: pričao nam je Ebu Avana, od Ebu Bišra, od Mudžahida, koji je rekao: „Stvaranje je započeo u nedjelju.“ Drugi su rekli: „Dan u kojem je Allah to započeo bio je subota.“"},{"stranica":44,"ar_tekst":"ذكر من قال ذلك:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":44,"ar_tekst":"حدثنا ابن حميد، قَالَ: حَدَّثَنَا سَلَمَةُ بْنُ الْفَضْلِ، قَالَ: حَدَّثَنِي محمد ابن أَبِي إِسْحَاقَ، قَالَ: يَقُولُ أَهْلُ التَّوْرَاةِ: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ الأَحَدِ:\n\nوَقَالَ أَهْلُ: الإِنْجِيلِ: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ الاثْنَيْنِ وَنَقُولُ نَحْنُ الْمُسْلِمُونَ فِيمَا انْتَهَى إِلَيْنَا مِنْ رَسُولِ اللَّهِ ص: ابْتَدَأَ اللَّهُ الْخَلْقَ يَوْمَ السَّبْتِ.","bs_tekst":"Pričao nam je Ibn Humejd: rekao je: pričao nam je Selema ibn el-Fadl: rekao je: pričao mi je Muhammed ibn Ebu Ishak, koji je rekao: „Sljedbenici Tevrata govore: ‘Allah je započeo stvaranje u nedjelju.’ Sljedbenici Indžila govore: ‘Allah je započeo stvaranje u ponedjeljak.’ A mi muslimani, prema onome što je do nas došlo od Allahovog Poslanika, sallallahu alejhi ve sellem, govorimo: ‘Allah je započeo stvaranje u subotu.’“ ⟦Napomena prevodioca: izvor ovdje navodi „Muhammed ibn Ebu Ishak“; ime nije samovoljno promijenjeno u drugačiji oblik.⟧"},{"stranica":44,"ar_tekst":"وَقَدْ رُوِيَ عن رسول الله ص الَّذِي قَالَ كُلُّ فَرِيقٍ مِنْ هَذَيْنِ الْفَرِيقَيْنِ اللَّذَيْنِ قَالَ أَحَدُهُمَا: ابْتَدَأَ اللَّهُ الْخَلْقَ فِي يَوْمِ الأَحَدِ، وَقَالَ الآخَرُ مِنْهُمَا:\n\nابْتَدَأَ فِي يَوْمِ السَّبْتِ، وَقَدْ مَضَى ذِكْرُنَا الْخَبَرَيْنِ، غَيْرَ أَنَّا نُعِيدُ مِنْ ذَلِكَ فِي هَذَا","bs_tekst":"Od Allahovog Poslanika, sallallahu alejhi ve sellem, preneseno je ono što tvrdi svaka od ove dvije skupine: jedna kaže da je Allah započeo stvaranje u nedjelju, a druga da je započeo u subotu. Već smo spomenuli obje predaje, ali ćemo na ovom"},{"stranica":45,"ar_tekst":"الْمَوْضِعِ بَعْضَ مَا فِيهِ مِنَ الدَّلالَةِ عَلَى صِحَّةِ قَوْلِ كُلِّ فَرِيقٍ مِنْهُمَا.","bs_tekst":"mjestu ponoviti nešto od onoga u njima što ukazuje na ispravnost tvrdnje svake od tih dviju skupina."},{"stranica":45,"ar_tekst":"فأما الخبر عنه بتحقيق ما قال القائلون: كان ابتداء الخلق يوم الأحد، فما حَدَّثَنَا بِهِ هَنَّادُ بن السري، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عَنِ ابْنِ عَبَّاسٍ- قَالَ هَنَّادٌ: وَقَرَأْتُ سَائِرَ الحديث- ان اليهود أتت النبي ص فَسَأَلَتْهُ عَنْ خَلْقِ السَّمَوَاتِ وَالأَرْضِ فَقَالَ: خَلَقَ اللَّهُ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ.","bs_tekst":"Što se tiče predaje od njega koja potvrđuje riječi onih koji kažu da je početak stvaranja bio u nedjelju, to je ono što nam je pričao Hennad ibn es-Serijj: rekao je: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa — Hennad je rekao: „Ostatak hadisa sam pročitao“ — da su Jevreji došli Vjerovjesniku, sallallahu alejhi ve sellem, pa ga pitali o stvaranju nebesa i Zemlje. On je rekao: „Allah je stvorio Zemlju u nedjelju i ponedjeljak.“"},{"stranica":45,"ar_tekst":"وأما الخبر عنه بتحقيق ما قاله القائلون من أن ابتداء الخلق كان يوم السبت، فما حَدَّثَنِي القاسم بن بشر بن معروف والحسين بن علي الصدائي، قالا:\n\nحدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مَوْلَى أُمِّ سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [أخذ رسول الله ص بِيَدِي، فَقَالَ: خَلَقَ اللَّهُ التُّرْبَةَ يَوْمَ السَّبْتِ، وَخَلَقَ الْجِبَالَ يَوْمَ الأَحَدِ] .","bs_tekst":"Što se tiče predaje od njega koja potvrđuje riječi onih koji kažu da je početak stvaranja bio u subotu, to je ono što su mi pričali Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, uzeo me za ruku i rekao: ‘Allah je stvorio tlo u subotu, a planine je stvorio u nedjelju.’“"},{"stranica":45,"ar_tekst":"وأولى القولين في ذلك عندي بالصواب قول من قال: اليوم الذي ابتدأ الله تعالى ذكره فيه خلق السموات والأرض يوم الأحد، لإجماع السلف من أهل العلم على ذلك.","bs_tekst":"Od ova dva mišljenja smatram ispravnijim ono prema kojem je dan u kojem je Allah, Uzvišen je spomen Njegov, počeo stvarati nebesa i Zemlju bio nedjelja, zbog saglasnosti učenih prethodnika o tome."},{"stranica":45,"ar_tekst":"فأما ما قال ابن إسحاق في ذلك، فإنه إنما استدل- بزعمه- على أن ذلك كذلك، لأن الله عز ذكره فرغ من خلق جميع خلقه يوم الجمعة، وذلك اليوم السابع، وفيه استوى على العرش، وجعل ذلك اليوم عيدا للمسلمين، ودليله على ما زعم أنه استدل به على صحه قوله فيما حكينا عنه من ذلك هو الدليل على خطئه فيه، وذلك ان الله تبارك وتعالى أخبر عباده في غير موضع من محكم تنزيله، أنه خلق السموات والأرض وما بينهما في ستة أيام، فقال: «اللَّهُ الَّذِي خَلَقَ","bs_tekst":"Što se tiče onoga što je Ibn Ishak o tome rekao, on je, prema vlastitoj tvrdnji, zaključio da je tako zato što je Allah, Silan je spomen Njegov, dovršio stvaranje svih Svojih stvorenja u petak, koji je sedmi dan, da se toga dana uzvisio nad Aršom i da je taj dan učinio praznikom muslimana. Dokaz za koji tvrdi da njime potvrđuje ispravnost onoga što smo od njega naveli zapravo je dokaz njegove greške u tome. Allah, Blagoslovljen i Uzvišen, na više mjesta u Svojoj jasnoj Objavi obavijestio je Svoje robove da je stvorio nebesa, Zemlju i ono što je između njih u šest dana. Rekao je: „Allah je Taj koji je stvorio"},{"stranica":46,"ar_tekst":"السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوى عَلَى الْعَرْشِ مَا لَكُمْ مِنْ دُونِهِ مِنْ وَلِيٍّ وَلا شَفِيعٍ أَفَلا تَتَذَكَّرُونَ»","bs_tekst":"nebesa, Zemlju i ono što je između njih u šest dana, zatim se uzvisio nad Aršom. Vi mimo Njega nemate ni zaštitnika ni zagovornika. Zar se nećete poučiti?“ ⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: Es-Sedžda, 32:4.⟧"},{"stranica":46,"ar_tekst":"وقال تعالى ذكره:\n«قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ ثُمَّ اسْتَوى إِلَى السَّماءِ وَهِيَ دُخانٌ فَقالَ لَها وَلِلْأَرْضِ ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ فَقَضاهُنَّ سَبْعَ سَماواتٍ فِي يَوْمَيْنِ وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها وَزَيَّنَّا السَّماءَ الدُّنْيا بِمَصابِيحَ وَحِفْظاً ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ» .","bs_tekst":"I rekao je On, Uzvišen je spomen Njegov: „Reci: Zar vi doista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova! Na njoj je, povrh nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu opskrbu u četiri dana, jednako za one koji pitaju. Zatim se usmjerio prema nebu, a ono je bilo dim, pa je njemu i Zemlji rekao: ‘Dođite, milom ili silom!’ Rekli su: ‘Dolazimo poslušno.’ Potom je od njih u dva dana sačinio sedam nebesa i svakome nebu objavio njegovu odredbu. A najbliže nebo ukrasili smo svjetiljkama i kao zaštitu. To je određenje Silnoga, Sveznajućeg.“ ⟦Prijevod kur’anskog navoda: Fussilet, 41:9–12.⟧"},{"stranica":46,"ar_tekst":"ولا خلاف بين جميع أهل العلم أن اليومين اللذين ذكرهما الله تبارك وتعالى في قوله: «فَقَضاهُنَّ سَبْعَ سَماواتٍ فِي يَوْمَيْنِ» داخلان في الأيام الستة اللاتي ذكرهن قبل ذلك، فمعلوم إذ كان الله عز وجل إنما خلق السموات والأرضين وما فيهن في ستة أيام، وكانت الأخبار مع ذلك متظاهرة عن رسول الله ص بان آخر ما خلق الله من خلقه آدم، وأن خلقه إياه كان في يوم الجمعة- إن يوم الجمعة الذي فرغ فيه من خلق خلقه داخل في الأيام الستة التي أخبر الله تعالى ذكره أنه خلق خلقه فيهن، لأن ذلك لو لم يكن داخلا في الأيام الستة كان إنما خلق خلقه في سبعة أيام، لا في ستة، وذلك خلاف ما جاء به التنزيل، فتبين إذا- إذ كان الأمر كالذي وصفنا في ذلك- أن أول الأيام التي ابتدأ الله فيها خلق السموات والارض وما فيهن من خلقه يوم الأحد، إذ كان الآخر يوم الجمعة، وذلك ستة أيام، كما قال ربنا جل جلاله.","bs_tekst":"Svi učeni saglasni su da su dva dana koja Allah, Blagoslovljen i Uzvišen, spominje u riječima: „Potom je od njih u dva dana sačinio sedam nebesa“ uključena u šest dana koje je ranije spomenuo. Poznato je, dakle, budući da je Allah, Silan i Uzvišen, stvorio nebesa, zemlje i ono što je u njima samo u šest dana, te da uz to brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, jedna drugu potvrđuju da je posljednje Allahovo stvorenje bio Adem i da ga je stvorio u petak, da je petak u kojem je dovršio stvaranje Svojih stvorenja uključen u šest dana u kojima je, prema onome što je Allah, Uzvišen je spomen Njegov, objavio, stvorio Svoja stvorenja. Da taj dan nije uključen u šest dana, onda bi Svoja stvorenja stvorio u sedam, a ne u šest dana, što je suprotno onome što je doneseno Objavom. Prema tome, budući da je stvar onakva kakvom smo je opisali, jasno je da je prvi dan u kojem je Allah počeo stvarati nebesa, Zemlju i Svoja stvorenja u njima bio nedjelja, jer je posljednji bio petak. To je šest dana, kako je rekao naš Gospodar, Uzvišeno je Njegovo veličanstvo. ⟦Ponovljeni kur’anski navod u ovom odlomku prijevod je dijela ajeta Fussilet, 41:12.⟧"},{"stranica":46,"ar_tekst":"فأما الأخبار الواردة عن رسول الله ص وعن أصحابه بأن الفراغ من الخلق كان يوم الجمعة، فسنذكرها في مواضعها إن شاء الله تعالى","bs_tekst":"Što se tiče predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, i njegovih ashaba da je dovršetak stvaranja bio u petak, navest ćemo ih na njihovim mjestima, ako Uzvišeni Allah htjedne."},{"stranica":47,"ar_tekst":"القول فيما خلق الله في كل يوم من الأيام السته التي ذكر الله في كتابه أنه خلق فيهن السموات والأرض وما بينهما","bs_tekst":"Rasprava o onome što je Allah stvorio svakoga od šest dana za koje je u Svojoj Knjizi naveo da je u njima stvorio nebesa, Zemlju i ono što je između njih"},{"stranica":47,"ar_tekst":"اختلف السلف من أهل العلم في ذلك:","bs_tekst":"Učeni prethodnici razišli su se o tome."},{"stranica":47,"ar_tekst":"فقال بعضهم ما حَدَّثَنِي به المثنى بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا عَبْدُ اللَّهِ بْنُ صَالِحٍ، حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، أَنَّهُ قَالَ: إِنَّ اللَّهَ بَدَأَ الْخَلْقَ يَوْمَ الأَحَدِ، فَخَلَقَ الأَرَضِينَ فِي الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الأَقْوَاتَ وَالرَّوَاسِي فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ، وَخَلَقَ السَّمَوَاتِ فِي الْخَمِيسِ وَالْجُمُعَةِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ، فَخَلَقَ فِيهَا آدَمَ عَلَى عَجَلٍ، فَتِلْكَ السَّاعَةُ الَّتِي تَقُومُ فِيهَا السَّاعَةُ.","bs_tekst":"Neki su rekli ono što mi je pričao Musenna ibn Ibrahim: rekao je: pričao nam je Abdullah ibn Salih: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, da je rekao: „Allah je započeo stvaranje u nedjelju. Zemlje je stvorio u nedjelju i ponedjeljak, opskrbu i čvrste planine u utorak i srijedu, a nebesa u četvrtak i petak. Dovršio je u posljednjem satu petka, pa je tada u žurbi stvorio Adema. To je sat u kojem će nastupiti Čas.“"},{"stranica":47,"ar_tekst":"حَدَّثَنِي مُوسَى بْنُ هَارُونَ، حَدَّثَنَا عَمْرُو بن حماد، حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من أصحاب النبي ص قَالُوا: جَعَلَ- يَعْنُونَ رَبَّنَا تَبَارَكَ وَتَعَالَى- سَبْعَ أَرَضِينَ فِي يَوْمَيْنِ: الأَحَدِ وَالاثْنَيْنِ، وَجَعَلَ فِيهَا رَوَاسِيَ أَنْ تَمِيدَ بِكُمْ، وَخَلَقَ الْجِبَالَ فِيهَا وأقوات أهلها، وشجرها وما ينبغي لها في يَوْمَيْنِ: فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ، ثُمَّ اسْتَوَى إِلَى السَّمَاءِ وَهِيَ دُخَانٌ فَجَعَلَهَا سَمَاءً وَاحِدَةً، ثُمَّ فَتَقَهَا فَجَعَلَهَا سَبْعَ سَمَوَاتٍ فِي يَوْمَيْنِ: الْخَمِيسِ وَالْجُمُعَةِ.","bs_tekst":"Pričao mi je Musa ibn Harun: pričao nam je Amr ibn Hammad: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji su rekli: „Učinio je — misleći na našeg Gospodara, Blagoslovljenog i Uzvišenog — sedam zemalja u dva dana: u nedjelju i ponedjeljak. Na njima je postavio čvrste planine da se ne ljuljaju s vama. Planine na njima, opskrbu njihovih stanovnika, njihovo drveće i ono što im treba stvorio je u dva dana: u utorak i srijedu. Zatim se usmjerio prema nebu, a ono je bilo dim, pa ga je učinio jednim nebom. Zatim ga je razdvojio i učinio ga sedmerim nebesima u dva dana: u četvrtak i petak.“"},{"stranica":47,"ar_tekst":"حَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، قَالَ: أَخْبَرَنَا إسحاق، عن شريك، عن غالب ابن غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: خَلَقَ اللَّهُ الأَرْضَ فِي يَوْمَيْنِ الأَحَدِ وَالاثْنَيْنِ.","bs_tekst":"Pričao nam je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Allah je stvorio Zemlju u dva dana: u nedjelju i ponedjeljak.“"},{"stranica":47,"ar_tekst":"ففي قول هؤلاء خلقت الأرض قبل السماء، لأنها خلقت عندهم في الأحد والاثنين","bs_tekst":"Prema riječima ovih ljudi, Zemlja je stvorena prije neba, jer je prema njima stvorena u nedjelju i ponedjeljak."},{"stranica":48,"ar_tekst":"وقال آخرون: خلق الله عز وجل الأرض قبل السماء بأقواتها من غير أن يدحوها، ثم استوى إلى السماء فسواهن سبع سموات، ثم دحا الأرض بعد ذلك.","bs_tekst":"Drugi su rekli: „Allah, Silan i Uzvišen, stvorio je Zemlju s njenom opskrbom prije neba, ali je nije rasprostro. Zatim se usmjerio prema nebu i od njih sačinio sedam nebesa, a potom je rasprostro Zemlju.“"},{"stranica":48,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":48,"ar_tekst":"حَدَّثَنِي عَلِيُّ بْنُ دَاوُدَ، قَالَ: حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي مُعَاوِيَةُ، عَنْ عَلِيِّ بْنِ أَبِي طَلْحَةَ، عَنِ ابْنِ عَبَّاسٍ: قَوْلُهُ عَزَّ وَجَلَّ حَيْثُ ذَكَرَ خَلَقَ الأَرْضَ قَبْلَ السَّمَاءِ، ثُمَّ ذَكَرَ السَّمَاءَ قَبْلَ الأَرْضِ، وَذَلِكَ أَنَّ اللَّهَ خَلَقَ الأَرْضَ بِأَقْوَاتِهَا مِنْ غَيْرِ أَنْ يَدْحُوَهَا قَبْلَ السَّمَاءِ، ثُمَّ اسْتَوَى إلى السماء فسواهن سبع سموات، ثم دحا الأَرْضَ بَعْدَ ذَلِكَ، فَذَلِكَ قَوْلُهُ تَعَالَى: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» .","bs_tekst":"Pričao mi je Ali ibn Davud: rekao je: pričao nam je Ebu Salih: rekao je: pričao mi je Muavija, od Alija ibn Ebu Talhe, od Ibn Abbasa, o riječima Njega, Silnog i Uzvišenog, gdje je spomenuo stvaranje Zemlje prije neba, a zatim spomenuo nebo prije Zemlje: „To je zato što je Allah stvorio Zemlju s njenom opskrbom prije neba, ali je nije rasprostro. Zatim se usmjerio prema nebu i od njih sačinio sedam nebesa, a nakon toga je rasprostro Zemlju. To su Njegove, Uzvišeni je On, riječi: ‘A Zemlju je nakon toga rasprostro.’“ ⟦Prijevod kur’anskog navoda: En-Naziat, 79:30.⟧"},{"stranica":48,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ:\nحَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» ، يَعْنِي أَنَّهَ خَلَقَ السَّمَوَاتِ وَالأَرْضَ، فَلَمَّا فَرَغَ مِنَ السَّمَاءِ قَبْلَ أَنْ يَخْلُقَ أَقْوَاتَ الأَرْضِ بَثَّ أَقْوَاتَ الأَرْضِ فِيهَا بَعْدَ خَلْقِ السَّمَاءِ، وارسى الجبال- يعنى بذلك دحوها- وَلَمْ تَكُنْ تَصْلُحْ أَقْوَاتُ الأَرْضِ وَنَبَاتُهَا إِلا بِاللَّيْلِ وَالنَّهَارِ، فَذَلِكَ قَوْلُهُ عَزَّ وَجَلَّ: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» ، أَلَمْ تَسْمَعْ أَنَّهُ قَالَ: «أَخْرَجَ مِنْها ماءَها وَمَرْعاها» ؟","bs_tekst":"Pričao mi je Muhammed ibn Sa‘d: rekao je: pričao mi je moj otac: rekao je: pričao mi je moj amidža: rekao je: pričao mi je moj otac, od svoga oca, od Ibn Abbasa, o riječima: „A Zemlju je nakon toga rasprostro; iz nje je izveo njenu vodu i njene pašnjake, a planine učvrstio“: „To znači da je stvorio nebesa i Zemlju. Kada je dovršio nebo, prije nego što je stvorio opskrbu Zemlje, rasuo je njenu opskrbu po njoj nakon stvaranja neba i učvrstio planine — time se misli na njeno rasprostiranje. Opskrba Zemlje i njeno bilje nisu mogli uspijevati bez noći i dana. To su riječi Njega, Silnog i Uzvišenog: ‘A Zemlju je nakon toga rasprostro.’ Zar nisi čuo da je rekao: ‘Iz nje je izveo njenu vodu i njene pašnjake’?“ ⟦Prijevodi kur’anskih navoda, redom: En-Naziat, 79:30–32; 79:30; 79:31.⟧"},{"stranica":48,"ar_tekst":"قال أبو جعفر: والصواب من القول في ذلك عندنا ما قاله الذين قالوا:\nإن الله خلق الأرض يوم الأحد، وخلق السماء يوم الخميس، وخلق النجوم والشمس والقمر يوم الجمعة لصحة الخبر الذي ذكرنا قبل عن ابن عباس، عن رسول الله ص بذلك وغير مستحيل ما روينا في ذلك عن ابن عباس من القول، وهو أن يكون الله تعالى ذكره خلق الأرض ولم يدحها، ثم خلق السموات فسواهن، ثم دحا الأرض بعد ذلك، فأخرج منها ماءها","bs_tekst":"Ebu Džafer kaže: Ispravno je, prema našem mišljenju, ono što su rekli oni koji kažu da je Allah stvorio Zemlju u nedjelju, nebo u četvrtak, a zvijezde, Sunce i Mjesec u petak, zbog vjerodostojnosti predaje koju smo ranije o tome naveli od Ibn Abbasa, od Allahovog Poslanika, sallallahu alejhi ve sellem. Nije nemoguće ni ono što smo o tome prenijeli od Ibn Abbasa: da je Allah, Uzvišen je spomen Njegov, stvorio Zemlju, a nije je rasprostro, zatim je stvorio nebesa i uredio ih, a nakon toga je rasprostro Zemlju i iz nje izveo njenu vodu"},{"stranica":49,"ar_tekst":"ومرعاها، والجبال أرساها، بل ذلك عندي هو الصواب من القول في ذلك، وذلك أن معنى الدحو غير معنى الخلق، وقد قال الله عز وجل: «أَأَنْتُمْ أَشَدُّ خَلْقاً أَمِ السَّماءُ بَناها رَفَعَ سَمْكَها فَسَوَّاها وَأَغْطَشَ لَيْلَها وَأَخْرَجَ ضُحاها.\n\nوَالْأَرْضَ بَعْدَ ذلِكَ دَحاها أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» .","bs_tekst":"i njene pašnjake, a planine učvrstio. Naprotiv, po mome mišljenju, to je ispravno mišljenje o tome, jer značenje rasprostiranja nije isto što i značenje stvaranja. Allah, Silan i Uzvišen, rekao je: „Jeste li vi teži za stvaranje ili nebo? On ga je izgradio; podigao je njegov svod i uredio ga; njegovu noć učinio je tamnom i izveo njegovo jutarnje svjetlo. A Zemlju je nakon toga rasprostro; iz nje je izveo njenu vodu i njene pašnjake, a planine učvrstio.“ ⟦Prijevod kur’anskog navoda: En-Naziat, 79:27–32.⟧"},{"stranica":49,"ar_tekst":"فإن قال قائل: فإنك قد علمت أن جماعة من أهل التأويل قد وجهت قول الله: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» إلى معنى مع ذلك دحاها، فما برهانك على صحة ما قلت، من أن ذلك بمعنى بعد التي هي خلاف قبل؟","bs_tekst":"Ako neko kaže: „Znaš da je jedna skupina tumača Allahove riječi: ‘A Zemlju je nakon toga rasprostro’ protumačila u značenju: ‘Uz to ju je rasprostro.’ Koji je tvoj dokaz za ispravnost onoga što si rekao: da to znači ‘poslije’, kao suprotnost riječi ‘prije’?“ ⟦Prvi navod prijevod je ajeta En-Naziat, 79:30; druga formulacija predstavlja navedeno tumačenje.⟧"},{"stranica":49,"ar_tekst":"قيل: المعروف من معنى بعد في كلام العرب هو الذي قلنا من أنها بخلاف معنى قبل لا بمعنى مع، وإنما توجه معاني الكلام إلى الأغلب عليه من معانيه المعروفة في أهله، لا إلى غير ذلك.","bs_tekst":"Odgovara se: Poznato značenje riječi „poslije“ u govoru Arapa jeste ono koje smo naveli: suprotnost značenju riječi „prije“, a ne značenje riječi „uz“. Značenje govora usmjerava se prema njegovom preovlađujućem značenju poznatom među onima koji tim jezikom govore, a ne prema nečemu drugom."},{"stranica":49,"ar_tekst":"وقد قيل: إن الله خلق البيت العتيق على الماء على أربعة أركان، قبل أن يخلق الدنيا بألفي عام، ثم دحيت الأرض من تحته.","bs_tekst":"Rečeno je da je Allah stvorio Drevni Hram na vodi, na četiri ugla, dvije hiljade godina prije nego što je stvorio ovaj svijet, a zatim je Zemlja rasprostrta ispod njega."},{"stranica":49,"ar_tekst":"ذكر من قال ذلك:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":49,"ar_tekst":"حدثنا ابن حميد، قَالَ: حَدَّثَنَا يَعْقُوبُ الْقُمِّيُّ، عَنْ جَعْفَرٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: وَضَعَ الْبَيْتَ على الماء على أربعة أركان، قبل أن يخلق الدنيا بألفي عام، ثم دحيت الأرض مِنْ تَحْتِ الْبَيْتِ.","bs_tekst":"Pričao nam je Ibn Humejd: rekao je: pričao nam je Jakub el-Kummi, od Džafera, od Ikrime, od Ibn Abbasa, koji je rekao: „Postavio je Hram na vodu, na četiri ugla, dvije hiljade godina prije nego što je stvorio ovaj svijet. Zatim je Zemlja rasprostrta ispod Hrama.“"},{"stranica":49,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا مِهْرَانُ، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ بُكَيْرِ بْنِ الأَخْنَسِ، عَنْ مُجَاهِدٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ: خَلَقَ اللَّهُ الْبَيْتَ قَبْلَ الأَرْضِ بِأَلْفَيْ سَنَةٍ، وَمِنْهُ دُحِيَتِ الأَرْضُ.","bs_tekst":"Pričao nam je Ibn Humejd: rekao je: pričao nam je Mihran, od Sufjana, od A‘meša, od Bukejra ibn el-Ahnesa, od Mudžahida, od Abdullaha ibn Omera, koji je rekao: „Allah je stvorio Hram dvije hiljade godina prije Zemlje i od njega je Zemlja rasprostrta.“"},{"stranica":49,"ar_tekst":"وَإِذَا كَانَ الأَمْرُ كَذَلِكَ كَانَ خَلْقُ الأَرْضِ قَبْلَ خَلْقِ السَّمَوَاتِ، وَدَحْوِ","bs_tekst":"Ako je tako, stvaranje Zemlje prethodilo je stvaranju nebesa, a rasprostiranje"},{"stranica":50,"ar_tekst":"الأَرْضِ وَهُوَ بَسْطُهَا بِأَقْوَاتِهَا وَمَرَاعِيهَا وَنَبَاتِهَا، بَعْدَ خَلْقِ السَّمَوَاتِ، كَمَا ذَكَرْنَا عَنِ ابْنِ عَبَّاسٍ.","bs_tekst":"Zemlje — to jest njeno pružanje s njenom opskrbom, pašnjacima i biljem — uslijedilo je nakon stvaranja nebesa, kako smo naveli od Ibn Abbasa."},{"stranica":50,"ar_tekst":"وَقَدْ حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنِي مِهْرَانُ، عن ابن سِنَانٍ، عَنْ أَبِي بَكْرٍ، [قَالَ: جَاءَ الْيَهُودُ الى النبي ص فَقَالُوا:\nيَا مُحَمَّدُ، أَخْبِرْنَا: مَا خَلَقَ اللَّهُ مِنَ الْخَلْقِ فِي هَذِهِ الأَيَّامِ السِّتَّةِ؟ فَقَالَ: خَلَقَ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ، وَخَلَقَ الْمَدَائِنَ وَالأَقْوَاتَ وَالأَنْهَارَ وَعُمْرَانَهَا وَخَرَابَهَا يَوْمَ الأَرْبِعَاءِ، وَخَلَقَ السَّمَوَاتِ وَالْمَلائِكَةَ يَوْمَ الْخَمِيسِ، إِلَى ثَلاثِ سَاعَاتٍ بَقِينَ مِنْ يَوْمِ الْجُمُعَةِ، وَخَلَقَ فِي أَوَّلِ الثَّلاثِ سَاعَاتٍ الآجَالَ، وَفِي الثَّانِيَةِ الآفَةَ، وَفِي الثَّالِثَةِ آدَمَ قَالُوا: صدقت ان اتممت، فعرف النبي ص مَا يُرِيدُونَ، فَغَضِبَ، فَأَنْزَلَ اللَّهُ تَعَالَى: «وَما مَسَّنا مِنْ لُغُوبٍ فَاصْبِرْ عَلى مَا يَقُولُونَ] » .","bs_tekst":"Pričao nam je Ibn Humejd: rekao je: pričao mi je Mihran, od Ibn Sinana, od Ebu Bekra, koji je rekao: „Jevreji su došli Vjerovjesniku, sallallahu alejhi ve sellem, i rekli: ‘Muhammede, obavijesti nas: koja je stvorenja Allah stvorio u ovih šest dana?’ Odgovorio je: ‘Zemlju je stvorio u nedjelju i ponedjeljak, planine je stvorio u utorak, a gradove, opskrbu, rijeke, njihovu nastanjenost i njihovu opustjelost stvorio je u srijedu. Nebesa i meleke stvarao je od četvrtka do preostala tri sata petka. U prvom od ta tri sata stvorio je rokove života, u drugom nedaću, a u trećem Adema.’ Rekli su: ‘Istinu si rekao, ako dovršiš.’ Vjerovjesnik, sallallahu alejhi ve sellem, prepoznao je šta žele, pa se rasrdio. Tada je Uzvišeni Allah objavio: ‘I nije Nas dotakao nikakav umor. Zato strpljivo podnosi ono što govore.’“ ⟦Prijevod kur’anskog navoda: Kaf, 50:38–39, navedeni dijelovi dvaju ajeta.⟧"},{"stranica":50,"ar_tekst":"فإن قال قائل: فإن كان الأمر كما وصفت من أن الله تعالى خلق الأرض قبل السماء، فما معنى قول ابن عباس الذى حدثكموه واصل ابن عَبْدِ الأَعْلَى الأَسَدِيُّ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى مِنْ شَيْءٍ الْقَلَمُ، فَقَالَ لَهُ: اكْتُبْ، فَقَالَ: وَمَا أَكْتُبُ يَا رَبِّ؟ قَالَ: اكْتُبِ الْقَدَرَ، قَالَ:\nفَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ مِنْ ذَلِكَ إِلَى قِيَامِ السَّاعَةِ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ فَفَتَقَ مِنْهُ السَّمَوَاتِ، ثُمَّ خَلَقَ النُّونَ، فَدُحِيَتِ الأَرْضُ عَلَى ظَهْرِهِ، فَاضْطَرَبَ النُّونُ، فَمَادَتِ الأَرْضُ فَأُثْبِتَتْ بِالْجِبَالِ، فَإِنَّهَا لَتَفْخَرُ عَلَى الارض","bs_tekst":"Ako neko kaže: „Ako je stvar onakva kakvom si je opisao — da je Uzvišeni Allah stvorio Zemlju prije neba — šta onda znače riječi Ibn Abbasa koje vam je pričao Vasil ibn Abdula‘la el-Esedi: pričao nam je Muhammed ibn Fudajl, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: ‘Prvo što je Uzvišeni Allah stvorio bilo je pero. Rekao mu je: Piši! Ono je reklo: A šta da pišem, Gospodaru moj? Rekao je: Zapiši određenje! I pero je ispisalo ono što će biti od tada do nastupanja Časa. Zatim je podigao vodenu paru i iz nje razdvojio nebesa. Potom je stvorio nuna, pa je Zemlja rasprostrta na njegovim leđima. Nun se pokrenuo i uzdrmao, pa se Zemlja zaljuljala i bila je učvršćena planinama. One se doista ponose nad Zemljom.’“ ⟦Napomena prevodioca: نون je ovdje preneseno kao „nun“. Predaja na stranici 52 poistovjećuje ga s velikom ribom; to je objašnjenje u predaji, a ne dopuna kur’anskog teksta.⟧"},{"stranica":51,"ar_tekst":"حَدَّثَنِي وَاصِلٌ، قَالَ: حَدَّثَنَا وَكِيعٌ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ نَحْوَهُ.","bs_tekst":"Pričao mi je Vasil: rekao je: pričao nam je Veki‘, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, nešto slično tome."},{"stranica":51,"ar_tekst":"حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، عَنْ شُعْبَةَ، عَنْ سُلَيْمَانَ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى الْقَلَمَ فَجَرَى بِمَا هُوَ كَائِنٌ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ، فَخُلِقَتْ مِنْهُ السَّمَوَاتُ، ثُمَّ خَلَقَ النُّونَ، فَبُسِطَتِ الأَرْضُ عَلَى ظهر النون، فتحرك النون، فمادت الارض فاثبت بالجبال، فان الْجِبَالَ لَتَفْخَرُ عَلَى الأَرْضِ قَالَ: وَقَرَأَ: «ن وَالْقَلَمِ وَما يَسْطُرُونَ» .","bs_tekst":"Pričao nam je Ibn el-Musenna: rekao je: pričao nam je Ibn Ebu Adijj, od Šu‘be, od Sulejmana, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: „Prvo što je Uzvišeni Allah stvorio bilo je pero, pa je ono ispisalo ono što će biti. Zatim je podigao vodenu paru i od nje su stvorena nebesa. Potom je stvorio nuna, pa je Zemlja rasprostrta na nunovim leđima. Nun se pokrenuo, pa se Zemlja zaljuljala i bila je učvršćena planinama. Planine se doista ponose nad Zemljom.“ Rekao je i proučio: „Nun. Tako Mi pera i onoga što pišu.“ ⟦Prijevod kur’anskog navoda: El-Kalem, 68:1.⟧"},{"stranica":51,"ar_tekst":"حدثني تميم بن المنتصر، قال: أخبرنا إسحاق، عَنْ شَرِيكٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ- او مُجَاهِدٍ- عَنِ ابْنِ عَبَّاسٍ بِنَحْوِهِ، إِلا أَنَّهُ قَالَ: فَفُتِقَتْ مِنْهُ السَّمَوَاتُ.","bs_tekst":"Pričao mi je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od A‘meša, od Ebu Zabjana — ili Mudžahida — od Ibn Abbasa, nešto slično tome, osim što je rekao: „Pa su iz nje razdvojena nebesa.“"},{"stranica":51,"ar_tekst":"حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا يَحْيَى، قَالَ: حَدَّثَنَا سُفْيَانُ، قَالَ: حَدَّثَنِي سُلَيْمَانُ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى الْقَلَمُ فَقَالَ: اكْتُبْ، فَقَالَ: مَا أَكْتُبُ؟ قَالَ: اكْتُبِ الْقَدَرَ، قَالَ: فَجَرَى بِمَا هُوَ كَائِنٌ مِنْ ذَلِكَ الْيَوْمِ إِلَى قِيَامِ السَّاعَةِ ثُمَّ خَلَقَ النُّونَ، وَرَفَعَ بُخَارَ الْمَاءِ فَفُتِقَتْ مِنْهُ السَّمَاءُ، وَبُسِطَتِ الأَرْضُ عَلَى ظَهْرِ النُّونِ، فَاضْطَرَبَ النُّونُ، فَمَادَتِ الأَرْضُ فَأُثْبِتَتْ بِالْجِبَالِ، قَالَ: فَإِنَّهَا لَتَفْخَرُ عَلَى الأَرْضِ.","bs_tekst":"Pričao nam je Ibn Beššar: rekao je: pričao nam je Jahja: rekao je: pričao nam je Sufjan: rekao je: pričao mi je Sulejman, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: „Prvo što je Uzvišeni Allah stvorio bilo je pero. Rekao je: ‘Piši!’ Ono je reklo: ‘Šta da pišem?’ Rekao je: ‘Zapiši određenje!’ I ono je ispisalo ono što će biti od toga dana do nastupanja Časa. Zatim je stvorio nuna i podigao vodenu paru, pa je iz nje razdvojeno nebo, a Zemlja je rasprostrta na nunovim leđima. Nun se uzdrmao, pa se Zemlja zaljuljala i bila je učvršćena planinama.“ Rekao je: „One se doista ponose nad Zemljom.“"},{"stranica":51,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ، حَدَّثَنَا جَرِيرٌ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ أَبِي الضُّحَى مُسْلِمِ بْنِ صُبَيْحٍ، عَنِ ابْنِ عَبَّاسٍ قَالَ: أَوَّلُ شَيْءٍ خَلَقَ","bs_tekst":"Pričao nam je Ibn Humejd: pričao nam je Džerir, od Ataa ibn es-Saiba, od Ebu Duhaa Muslima ibn Subejha, od Ibn Abbasa, koji je rekao: „Prvo što je"},{"stranica":52,"ar_tekst":"اللَّهُ تَعَالَى الْقَلَمُ، فَقَالَ لَهُ: اكْتُبْ، فَكَتَبَ مَا هُوَ كَائِنٌ إِلَى أَنْ تَقُومَ السَّاعَةُ، ثُمَّ خَلَقَ النُّونَ فَوْقَ الْمَاءِ، ثُمَّ كَبَسَ الأَرْضَ عَلَيْهِ.","bs_tekst":"Uzvišeni Allah stvorio bilo je pero. Rekao mu je: ‘Piši!’ I ono je zapisalo ono što će biti do nastupanja Časa. Zatim je stvorio nuna iznad vode, a potom je na njega naslagao Zemlju.“"},{"stranica":52,"ar_tekst":"قيل: ذلك صحيح على ما روي عنه وعن غيره من معنى ذلك مشروحا مفسرا غير مخالف شيئا مما رويناه عنه في ذلك.","bs_tekst":"Odgovara se: To je ispravno prema onome što je preneseno od njega i od drugih kao razrađeno i objašnjeno značenje toga, koje nije u suprotnosti ni s čim što smo od njega o tome prenijeli."},{"stranica":52,"ar_tekst":"فإن قال: وما الذي روي عنه وعن غيره من شرح ذلك الدال على صحة كل ما رويت لنا في هذا المعنى عنه؟","bs_tekst":"Ako kaže: „Šta je od njega i drugih preneseno kao objašnjenje koje potvrđuje ispravnost svega što si nam od njega prenio o ovom značenju?“"},{"stranica":52,"ar_tekst":"قيل له: حَدَّثَنِي مُوسَى بْنُ هَارُونَ الْهَمْدَانِيُّ وَغَيْرُهُ، قَالُوا: حَدَّثَنَا عَمْرُو بْنُ حَمَّادٍ، حَدَّثَنَا أَسْبَاطُ بْنُ نَصْرٍ، عَنِ السُّدِّيِّ، عَنْ أَبِي مَالِكٍ، وَعَنْ أَبِي صالح، عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب رسول الله ص «هُوَ الَّذِي خَلَقَ لَكُمْ مَا فِي الْأَرْضِ جَمِيعاً ثُمَّ اسْتَوى إِلَى السَّماءِ فَسَوَّاهُنَّ سَبْعَ سَماواتٍ» قَالَ: إِنَّ اللَّهَ تَعَالَى كَانَ عَرْشُهُ عَلَى الْمَاءِ وَلَمْ يَخْلُقْ شَيْئًا غَيْرَ مَا خَلَقَ قَبْلَ الْمَاءِ، فَلَمَّا أَرَادَ أَنْ يَخْلُقَ الْخَلْقَ أَخْرَجَ مِنَ الْمَاءِ دُخَانًا فَارْتَفَعَ فَوْقَ الْمَاءِ، فَسَمَا عَلَيْهِ، فَسَمَّاهُ سَمَاءً، ثُمَّ أَيْبَسَ الْمَاءَ، فَجَعَلَهُ أَرْضًا وَاحِدَةً، ثُمَّ فَتَقَهَا فَجَعَلَهَا سَبْعَ أَرَضِينَ فِي يَوْمَيْنِ، فِي الأَحَدِ وَالاثْنَيْنِ، فَخَلَقَ الأَرْضَ عَلَى حُوتٍ- وَالْحُوتُ هُوَ النُّونُ الَّذِي ذَكَرَ اللَّهُ عَزَّ وَجَلَّ فِي الْقُرْآنِ: «ن وَالْقَلَمِ» - وَالْحُوتُ فِي الْمَاءِ، وَالْمَاءُ عَلَى ظَهْرِ صَفَاةٍ، وَالصَّفَاةُ عَلَى ظَهْرِ مَلَكٍ، وَالْمَلَكُ عَلَى صَخْرَةٍ، والصخرة على الرِّيحِ- وَهِيَ الصَّخْرَةُ الَّتِي ذَكَرَ لُقْمَانُ- لَيْسَتْ فِي السَّمَاءِ وَلا فِي الأَرْضِ، فَتَحَرَّكَ الْحُوتُ فَاضْطَرَبَ، فَتَزَلْزَلَتِ الأَرْضُ، فَأَرْسَى عَلَيْهَا الْجِبَالُ فَقَرَّتْ، فالجبال","bs_tekst":"Odgovara mu se: Pričali su mi Musa ibn Harun el-Hemdani i drugi; rekli su: pričao nam je Amr ibn Hammad: pričao nam je Esbat ibn Nasr, od Suddija, od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, o riječima: „On je Taj koji je za vas stvorio sve što je na Zemlji, zatim se usmjerio prema nebu i od njih sačinio sedam nebesa.“ Rekao je: „Arš Uzvišenog Allaha bio je na vodi, a On nije stvorio ništa drugo osim onoga što je stvorio prije vode. Kada je htio stvarati stvorenja, iz vode je izveo dim, pa se on podigao iznad vode i uzvisio nad njom. Nazvao ga je nebom. Zatim je vodu osušio i učinio je jednom zemljom, potom ju je razdvojio i učinio je sedmerim zemljama u dva dana, u nedjelju i ponedjeljak. Zemlju je stvorio na velikoj ribi — a riba je nun koji Allah, Silan i Uzvišen, spominje u Kur’anu: ‘Nun. Tako Mi pera’ — riba je u vodi, voda je na glatkom kamenu, glatki kamen je na leđima meleka, melek je na stijeni, a stijena na vjetru. To je stijena koju je spomenuo Lukman; nije ni na nebu ni na Zemlji. Riba se pokrenula i uzdrmala, pa se Zemlja zatresla. Zato je na njoj učvrstio planine i ona se smirila. Planine se ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:29, navedeni dio; El-Kalem, 68:1, navedeni dio. Poistovjećivanje nuna s ribom pripada navedenoj predaji.⟧"}]</script><script>if(parent!==window){parent.postMessage({type:'ri-taberi-part',payload:JSON.parse(document.getElementById('partData').textContent),database:JSON.parse(document.getElementById('databaseData').textContent)},'*');}</script></body></html>
