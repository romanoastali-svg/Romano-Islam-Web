Sunce i Mjesec u petak, zbog vjerodostojnosti predaje koju smo ranije o tome naveli od Ibn Abbasa, od Allahovog Poslanika, sallallahu alejhi ve sellem. Nije nemoguće ni ono što smo o tome prenijeli od Ibn Abbasa: da je Allah, Uzvišen je spomen Njegov, stvorio Zemlju, a nije je rasprostro, zatim je stvorio nebesa i uredio ih, a nakon toga je rasprostro Zemlju i iz nje izveo njenu vodu"}],"notes":[]},{"n":49,"ar":"ومرعاها، والجبال أرساها، بل ذلك عندي هو الصواب من القول في ذلك، وذلك أن معنى الدحو غير معنى الخلق، وقد قال الله عز وجل: «أَأَنْتُمْ أَشَدُّ خَلْقاً أَمِ السَّماءُ بَناها رَفَعَ سَمْكَها فَسَوَّاها وَأَغْطَشَ لَيْلَها وَأَخْرَجَ ضُحاها.\n\nوَالْأَرْضَ بَعْدَ ذلِكَ دَحاها أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» .\n\nفإن قال قائل: فإنك قد علمت أن جماعة من أهل التأويل قد وجهت قول الله: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» إلى معنى مع ذلك دحاها، فما برهانك على صحة ما قلت، من أن ذلك بمعنى بعد التي هي خلاف قبل؟\n\nقيل: المعروف من معنى بعد في كلام العرب هو الذي قلنا من أنها بخلاف معنى قبل لا بمعنى مع، وإنما توجه معاني الكلام إلى الأغلب عليه من معانيه المعروفة في أهله، لا إلى غير ذلك.\n\nوقد قيل: إن الله خلق البيت العتيق على الماء على أربعة أركان، قبل أن يخلق الدنيا بألفي عام، ثم دحيت الأرض من تحته.\n\nذكر من قال ذلك:\n\nحدثنا ابن حميد، قَالَ: حَدَّثَنَا يَعْقُوبُ الْقُمِّيُّ، عَنْ جَعْفَرٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: وَضَعَ الْبَيْتَ على الماء على أربعة أركان، قبل أن يخلق الدنيا بألفي عام، ثم دحيت الأرض مِنْ تَحْتِ الْبَيْتِ.\n\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا مِهْرَانُ، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ بُكَيْرِ بْنِ الأَخْنَسِ، عَنْ مُجَاهِدٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ: خَلَقَ اللَّهُ الْبَيْتَ قَبْلَ الأَرْضِ بِأَلْفَيْ سَنَةٍ، وَمِنْهُ دُحِيَتِ الأَرْضُ.\n\nوَإِذَا كَانَ الأَمْرُ كَذَلِكَ كَانَ خَلْقُ الأَرْضِ قَبْلَ خَلْقِ السَّمَوَاتِ، وَدَحْوِ","bs":"\u003cp data-paragraph=\"49.1\">i njene pašnjake, a planine učvrstio. Naprotiv, po mome mišljenju, to je ispravno mišljenje o tome, jer značenje rasprostiranja nije isto što i značenje stvaranja. Allah, Silan i Uzvišen, rekao je: „Jeste li vi teži za stvaranje ili nebo? On ga je izgradio; podigao je njegov svod i uredio ga; njegovu noć učinio je tamnom i izveo njegovo jutarnje svjetlo. A Zemlju je nakon toga rasprostro; iz nje je izveo njenu vodu i njene pašnjake, a planine učvrstio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Naziat, 79:27–32.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"49.2\">Ako neko kaže: „Znaš da je jedna skupina tumača Allahove riječi: ‘A Zemlju je nakon toga rasprostro’ protumačila u značenju: ‘Uz to ju je rasprostro.’ Koji je tvoj dokaz za ispravnost onoga što si rekao: da to znači ‘poslije’, kao suprotnost riječi ‘prije’?“ \u003cspan class=\"translator-note\">⟦Prvi navod prijevod je ajeta En-Naziat, 79:30; druga formulacija predstavlja navedeno tumačenje.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"49.3\">Odgovara se: Poznato značenje riječi „poslije“ u govoru Arapa jeste ono koje smo naveli: suprotnost značenju riječi „prije“, a ne značenje riječi „uz“. Značenje govora usmjerava se prema njegovom preovlađujućem značenju poznatom među onima koji tim jezikom govore, a ne prema nečemu drugom.\u003c/p>\u003cp data-paragraph=\"49.4\">Rečeno je da je Allah stvorio Drevni Hram na vodi, na četiri ugla, dvije hiljade godina prije nego što je stvorio ovaj svijet, a zatim je Zemlja rasprostrta ispod njega.\u003c/p>\u003cp data-paragraph=\"49.5\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"49.6\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Jakub el-Kummi, od Džafera, od Ikrime, od Ibn Abbasa, koji je rekao: „Postavio je Hram na vodu, na četiri ugla, dvije hiljade godina prije nego što je stvorio ovaj svijet. Zatim je Zemlja rasprostrta ispod Hrama.“\u003c/p>\u003cp data-paragraph=\"49.7\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Mihran, od Sufjana, od A‘meša, od Bukejra ibn el-Ahnesa, od Mudžahida, od Abdullaha ibn Omera, koji je rekao: „Allah je stvorio Hram dvije hiljade godina prije Zemlje i od njega je Zemlja rasprostrta.“\u003c/p>\u003cp data-paragraph=\"49.8\">Ako je tako, stvaranje Zemlje prethodilo je stvaranju nebesa, a rasprostiranje\u003c/p>","paragraphs":[{"id":"49.1","ar":"ومرعاها، والجبال أرساها، بل ذلك عندي هو الصواب من القول في ذلك، وذلك أن معنى الدحو غير معنى الخلق، وقد قال الله عز وجل: «أَأَنْتُمْ أَشَدُّ خَلْقاً أَمِ السَّماءُ بَناها رَفَعَ سَمْكَها فَسَوَّاها وَأَغْطَشَ لَيْلَها وَأَخْرَجَ ضُحاها.\n\nوَالْأَرْضَ بَعْدَ ذلِكَ دَحاها أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» .","bs":"i njene pašnjake, a planine učvrstio. Naprotiv, po mome mišljenju, to je ispravno mišljenje o tome, jer značenje rasprostiranja nije isto što i značenje stvaranja. Allah, Silan i Uzvišen, rekao je: „Jeste li vi teži za stvaranje ili nebo? On ga je izgradio; podigao je njegov svod i uredio ga; njegovu noć učinio je tamnom i izveo njegovo jutarnje svjetlo. A Zemlju je nakon toga rasprostro; iz nje je izveo njenu vodu i njene pašnjake, a planine učvrstio.“ ⟦Prijevod kur’anskog navoda: En-Naziat, 79:27–32.⟧","ar_ranges":[],"ar_html":"ومرعاها، والجبال أرساها، بل ذلك عندي هو الصواب من القول في ذلك، وذلك أن معنى الدحو غير معنى الخلق، وقد قال الله عز وجل: «أَأَنْتُمْ أَشَدُّ خَلْقاً أَمِ السَّماءُ بَناها رَفَعَ سَمْكَها فَسَوَّاها وَأَغْطَشَ لَيْلَها وَأَخْرَجَ ضُحاها.\n\nوَالْأَرْضَ بَعْدَ ذلِكَ دَحاها أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» .","bs_ranges":[],"bs_html":"i njene pašnjake, a planine učvrstio. Naprotiv, po mome mišljenju, to je ispravno mišljenje o tome, jer značenje rasprostiranja nije isto što i značenje stvaranja. Allah, Silan i Uzvišen, rekao je: „Jeste li vi teži za stvaranje ili nebo? On ga je izgradio; podigao je njegov svod i uredio ga; njegovu noć učinio je tamnom i izveo njegovo jutarnje svjetlo. A Zemlju je nakon toga rasprostro; iz nje je izveo njenu vodu i njene pašnjake, a planine učvrstio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Naziat, 79:27–32.⟧\u003c/span>"},{"id":"49.2","ar":"فإن قال قائل: فإنك قد علمت أن جماعة من أهل التأويل قد وجهت قول الله: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» إلى معنى مع ذلك دحاها، فما برهانك على صحة ما قلت، من أن ذلك بمعنى بعد التي هي خلاف قبل؟","bs":"Ako neko kaže: „Znaš da je jedna skupina tumača Allahove riječi: ‘A Zemlju je nakon toga rasprostro’ protumačila u značenju: ‘Uz to ju je rasprostro.’ Koji je tvoj dokaz za ispravnost onoga što si rekao: da to znači ‘poslije’, kao suprotnost riječi ‘prije’?“ ⟦Prvi navod prijevod je ajeta En-Naziat, 79:30; druga formulacija predstavlja navedeno tumačenje.⟧","ar_ranges":[],"ar_html":"فإن قال قائل: فإنك قد علمت أن جماعة من أهل التأويل قد وجهت قول الله: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» إلى معنى مع ذلك دحاها، فما برهانك على صحة ما قلت، من أن ذلك بمعنى بعد التي هي خلاف قبل؟","bs_ranges":[],"bs_html":"Ako neko kaže: „Znaš da je jedna skupina tumača Allahove riječi: ‘A Zemlju je nakon toga rasprostro’ protumačila u značenju: ‘Uz to ju je rasprostro.’ Koji je tvoj dokaz za ispravnost onoga što si rekao: da to znači ‘poslije’, kao suprotnost riječi ‘prije’?“ \u003cspan class=\"translator-note\">⟦Prvi navod prijevod je ajeta En-Naziat, 79:30; druga formulacija predstavlja navedeno tumačenje.⟧\u003c/span>"},{"id":"49.3","ar":"قيل: المعروف من معنى بعد في كلام العرب هو الذي قلنا من أنها بخلاف معنى قبل لا بمعنى مع، وإنما توجه معاني الكلام إلى الأغلب عليه من معانيه المعروفة في أهله، لا إلى غير ذلك.","bs":"Odgovara se: Poznato značenje riječi „poslije“ u govoru Arapa jeste ono koje smo naveli: suprotnost značenju riječi „prije“, a ne značenje riječi „uz“. Značenje govora usmjerava se prema njegovom preovlađujućem značenju poznatom među onima koji tim jezikom govore, a ne prema nečemu drugom.","ar_ranges":[],"ar_html":"قيل: المعروف من معنى بعد في كلام العرب هو الذي قلنا من أنها بخلاف معنى قبل لا بمعنى مع، وإنما توجه معاني الكلام إلى الأغلب عليه من معانيه المعروفة في أهله، لا إلى غير ذلك.","bs_ranges":[],"bs_html":"Odgovara se: Poznato značenje riječi „poslije“ u govoru Arapa jeste ono koje smo naveli: suprotnost značenju riječi „prije“, a ne značenje riječi „uz“. Značenje govora usmjerava se prema njegovom preovlađujućem značenju poznatom među onima koji tim jezikom govore, a ne prema nečemu drugom."},{"id":"49.4","ar":"وقد قيل: إن الله خلق البيت العتيق على الماء على أربعة أركان، قبل أن يخلق الدنيا بألفي عام، ثم دحيت الأرض من تحته.","bs":"Rečeno je da je Allah stvorio Drevni Hram na vodi, na četiri ugla, dvije hiljade godina prije nego što je stvorio ovaj svijet, a zatim je Zemlja rasprostrta ispod njega.","ar_ranges":[],"ar_html":"وقد قيل: إن الله خلق البيت العتيق على الماء على أربعة أركان، قبل أن يخلق الدنيا بألفي عام، ثم دحيت الأرض من تحته.","bs_ranges":[],"bs_html":"Rečeno je da je Allah stvorio Drevni Hram na vodi, na četiri ugla, dvije hiljade godina prije nego što je stvorio ovaj svijet, a zatim je Zemlja rasprostrta ispod njega."},{"id":"49.5","ar":"ذكر من قال ذلك:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذكر من قال ذلك:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"49.6","ar":"حدثنا ابن حميد، قَالَ: حَدَّثَنَا يَعْقُوبُ الْقُمِّيُّ، عَنْ جَعْفَرٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: وَضَعَ الْبَيْتَ على الماء على أربعة أركان، قبل أن يخلق الدنيا بألفي عام، ثم دحيت الأرض مِنْ تَحْتِ الْبَيْتِ.","bs":"Pričao nam je Ibn Humejd: rekao je: pričao nam je Jakub el-Kummi, od Džafera, od Ikrime, od Ibn Abbasa, koji je rekao: „Postavio je Hram na vodu, na četiri ugla, dvije hiljade godina prije nego što je stvorio ovaj svijet. Zatim je Zemlja rasprostrta ispod Hrama.“","ar_ranges":[[0,116]],"ar_html":"\u003cspan class=\"isnad\">حدثنا ابن حميد، قَالَ: حَدَّثَنَا يَعْقُوبُ الْقُمِّيُّ، عَنْ جَعْفَرٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>وَضَعَ الْبَيْتَ على الماء على أربعة أركان، قبل أن يخلق الدنيا بألفي عام، ثم دحيت الأرض مِنْ تَحْتِ الْبَيْتِ.","bs_ranges":[[0,119]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Jakub el-Kummi, od Džafera, od Ikrime, od Ibn Abbasa, koji je rekao: \u003c/span>„Postavio je Hram na vodu, na četiri ugla, dvije hiljade godina prije nego što je stvorio ovaj svijet. Zatim je Zemlja rasprostrta ispod Hrama.“"},{"id":"49.7","ar":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا مِهْرَانُ، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ بُكَيْرِ بْنِ الأَخْنَسِ، عَنْ مُجَاهِدٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ: خَلَقَ اللَّهُ الْبَيْتَ قَبْلَ الأَرْضِ بِأَلْفَيْ سَنَةٍ، وَمِنْهُ دُحِيَتِ الأَرْضُ.","bs":"Pričao nam je Ibn Humejd: rekao je: pričao nam je Mihran, od Sufjana, od A‘meša, od Bukejra ibn el-Ahnesa, od Mudžahida, od Abdullaha ibn Omera, koji je rekao: „Allah je stvorio Hram dvije hiljade godina prije Zemlje i od njega je Zemlja rasprostrta.“","ar_ranges":[[0,176]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا مِهْرَانُ، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ بُكَيْرِ بْنِ الأَخْنَسِ، عَنْ مُجَاهِدٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ: \u003c/span>خَلَقَ اللَّهُ الْبَيْتَ قَبْلَ الأَرْضِ بِأَلْفَيْ سَنَةٍ، وَمِنْهُ دُحِيَتِ الأَرْضُ.","bs_ranges":[[0,160]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Mihran, od Sufjana, od A‘meša, od Bukejra ibn el-Ahnesa, od Mudžahida, od Abdullaha ibn Omera, koji je rekao: \u003c/span>„Allah je stvorio Hram dvije hiljade godina prije Zemlje i od njega je Zemlja rasprostrta.“"},{"id":"49.8","ar":"وَإِذَا كَانَ الأَمْرُ كَذَلِكَ كَانَ خَلْقُ الأَرْضِ قَبْلَ خَلْقِ السَّمَوَاتِ، وَدَحْوِ","bs":"Ako je tako, stvaranje Zemlje prethodilo je stvaranju nebesa, a rasprostiranje","ar_ranges":[],"ar_html":"وَإِذَا كَانَ الأَمْرُ كَذَلِكَ كَانَ خَلْقُ الأَرْضِ قَبْلَ خَلْقِ السَّمَوَاتِ، وَدَحْوِ","bs_ranges":[],"bs_html":"Ako je tako, stvaranje Zemlje prethodilo je stvaranju nebesa, a rasprostiranje"}],"notes":[]},{"n":50,"ar":"الأَرْضِ وَهُوَ بَسْطُهَا بِأَقْوَاتِهَا وَمَرَاعِيهَا وَنَبَاتِهَا، بَعْدَ خَلْقِ السَّمَوَاتِ، كَمَا ذَكَرْنَا عَنِ ابْنِ عَبَّاسٍ.\n\nوَقَدْ حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنِي مِهْرَانُ، عن ابن سِنَانٍ، عَنْ أَبِي بَكْرٍ، [قَالَ: جَاءَ الْيَهُودُ الى النبي ص فَقَالُوا:\nيَا مُحَمَّدُ، أَخْبِرْنَا: مَا خَلَقَ اللَّهُ مِنَ الْخَلْقِ فِي هَذِهِ الأَيَّامِ السِّتَّةِ؟ فَقَالَ: خَلَقَ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ، وَخَلَقَ الْمَدَائِنَ وَالأَقْوَاتَ وَالأَنْهَارَ وَعُمْرَانَهَا وَخَرَابَهَا يَوْمَ الأَرْبِعَاءِ، وَخَلَقَ السَّمَوَاتِ وَالْمَلائِكَةَ يَوْمَ الْخَمِيسِ، إِلَى ثَلاثِ سَاعَاتٍ بَقِينَ مِنْ يَوْمِ الْجُمُعَةِ، وَخَلَقَ فِي أَوَّلِ الثَّلاثِ سَاعَاتٍ الآجَالَ، وَفِي الثَّانِيَةِ الآفَةَ، وَفِي الثَّالِثَةِ آدَمَ قَالُوا: صدقت ان اتممت، فعرف النبي ص مَا يُرِيدُونَ، فَغَضِبَ، فَأَنْزَلَ اللَّهُ تَعَالَى: «وَما مَسَّنا مِنْ لُغُوبٍ فَاصْبِرْ عَلى مَا يَقُولُونَ] » .\n\nفإن قال قائل: فإن كان الأمر كما وصفت من أن الله تعالى خلق الأرض قبل السماء، فما معنى قول ابن عباس الذى حدثكموه واصل ابن عَبْدِ الأَعْلَى الأَسَدِيُّ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى مِنْ شَيْءٍ الْقَلَمُ، فَقَالَ لَهُ: اكْتُبْ، فَقَالَ: وَمَا أَكْتُبُ يَا رَبِّ؟ قَالَ: اكْتُبِ الْقَدَرَ، قَالَ:\nفَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ مِنْ ذَلِكَ إِلَى قِيَامِ السَّاعَةِ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ فَفَتَقَ مِنْهُ السَّمَوَاتِ، ثُمَّ خَلَقَ النُّونَ، فَدُحِيَتِ الأَرْضُ عَلَى ظَهْرِهِ، فَاضْطَرَبَ النُّونُ، فَمَادَتِ الأَرْضُ فَأُثْبِتَتْ بِالْجِبَالِ، فَإِنَّهَا لَتَفْخَرُ عَلَى الارض","bs":"\u003cp data-paragraph=\"50.1\">Zemlje — to jest njeno pružanje s njenom opskrbom, pašnjacima i biljem — uslijedilo je nakon stvaranja nebesa, kako smo naveli od Ibn Abbasa.\u003c/p>\u003cp data-paragraph=\"50.2\">Pričao nam je Ibn Humejd: rekao je: pričao mi je Mihran, od Ibn Sinana, od Ebu Bekra, koji je rekao: „Jevreji su došli Vjerovjesniku, sallallahu alejhi ve sellem, i rekli: ‘Muhammede, obavijesti nas: koja je stvorenja Allah stvorio u ovih šest dana?’ Odgovorio je: ‘Zemlju je stvorio u nedjelju i ponedjeljak, planine je stvorio u utorak, a gradove, opskrbu, rijeke, njihovu nastanjenost i njihovu opustjelost stvorio je u srijedu. Nebesa i meleke stvarao je od četvrtka do preostala tri sata petka. U prvom od ta tri sata stvorio je rokove života, u drugom nedaću, a u trećem Adema.’ Rekli su: ‘Istinu si rekao, ako dovršiš.’ Vjerovjesnik, sallallahu alejhi ve sellem, prepoznao je šta žele, pa se rasrdio. Tada je Uzvišeni Allah objavio: ‘I nije Nas dotakao nikakav umor. Zato strpljivo podnosi ono što govore.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Kaf, 50:38–39, navedeni dijelovi dvaju ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"50.3\">Ako neko kaže: „Ako je stvar onakva kakvom si je opisao — da je Uzvišeni Allah stvorio Zemlju prije neba — šta onda znače riječi Ibn Abbasa koje vam je pričao Vasil ibn Abdula‘la el-Esedi: pričao nam je Muhammed ibn Fudajl, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: ‘Prvo što je Uzvišeni Allah stvorio bilo je pero. Rekao mu je: Piši! Ono je reklo: A šta da pišem, Gospodaru moj? Rekao je: Zapiši određenje! I pero je ispisalo ono što će biti od tada do nastupanja Časa. Zatim je podigao vodenu paru i iz nje razdvojio nebesa. Potom je stvorio nuna, pa je Zemlja rasprostrta na njegovim leđima. Nun se pokrenuo i uzdrmao, pa se Zemlja zaljuljala i bila je učvršćena planinama. One se doista ponose nad Zemljom.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: نون je ovdje preneseno kao „nun“. Predaja na stranici 52 poistovjećuje ga s velikom ribom; to je objašnjenje u predaji, a ne dopuna kur’anskog teksta.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"50.1","ar":"الأَرْضِ وَهُوَ بَسْطُهَا بِأَقْوَاتِهَا وَمَرَاعِيهَا وَنَبَاتِهَا، بَعْدَ خَلْقِ السَّمَوَاتِ، كَمَا ذَكَرْنَا عَنِ ابْنِ عَبَّاسٍ.","bs":"Zemlje — to jest njeno pružanje s njenom opskrbom, pašnjacima i biljem — uslijedilo je nakon stvaranja nebesa, kako smo naveli od Ibn Abbasa.","ar_ranges":[],"ar_html":"الأَرْضِ وَهُوَ بَسْطُهَا بِأَقْوَاتِهَا وَمَرَاعِيهَا وَنَبَاتِهَا، بَعْدَ خَلْقِ السَّمَوَاتِ، كَمَا ذَكَرْنَا عَنِ ابْنِ عَبَّاسٍ.","bs_ranges":[],"bs_html":"Zemlje — to jest njeno pružanje s njenom opskrbom, pašnjacima i biljem — uslijedilo je nakon stvaranja nebesa, kako smo naveli od Ibn Abbasa."},{"id":"50.2","ar":"وَقَدْ حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنِي مِهْرَانُ، عن ابن سِنَانٍ، عَنْ أَبِي بَكْرٍ، [قَالَ: جَاءَ الْيَهُودُ الى النبي ص فَقَالُوا:\nيَا مُحَمَّدُ، أَخْبِرْنَا: مَا خَلَقَ اللَّهُ مِنَ الْخَلْقِ فِي هَذِهِ الأَيَّامِ السِّتَّةِ؟ فَقَالَ: خَلَقَ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ، وَخَلَقَ الْمَدَائِنَ وَالأَقْوَاتَ وَالأَنْهَارَ وَعُمْرَانَهَا وَخَرَابَهَا يَوْمَ الأَرْبِعَاءِ، وَخَلَقَ السَّمَوَاتِ وَالْمَلائِكَةَ يَوْمَ الْخَمِيسِ، إِلَى ثَلاثِ سَاعَاتٍ بَقِينَ مِنْ يَوْمِ الْجُمُعَةِ، وَخَلَقَ فِي أَوَّلِ الثَّلاثِ سَاعَاتٍ الآجَالَ، وَفِي الثَّانِيَةِ الآفَةَ، وَفِي الثَّالِثَةِ آدَمَ قَالُوا: صدقت ان اتممت، فعرف النبي ص مَا يُرِيدُونَ، فَغَضِبَ، فَأَنْزَلَ اللَّهُ تَعَالَى: «وَما مَسَّنا مِنْ لُغُوبٍ فَاصْبِرْ عَلى مَا يَقُولُونَ] » .","bs":"Pričao nam je Ibn Humejd: rekao je: pričao mi je Mihran, od Ibn Sinana, od Ebu Bekra, koji je rekao: „Jevreji su došli Vjerovjesniku, sallallahu alejhi ve sellem, i rekli: ‘Muhammede, obavijesti nas: koja je stvorenja Allah stvorio u ovih šest dana?’ Odgovorio je: ‘Zemlju je stvorio u nedjelju i ponedjeljak, planine je stvorio u utorak, a gradove, opskrbu, rijeke, njihovu nastanjenost i njihovu opustjelost stvorio je u srijedu. Nebesa i meleke stvarao je od četvrtka do preostala tri sata petka. U prvom od ta tri sata stvorio je rokove života, u drugom nedaću, a u trećem Adema.’ Rekli su: ‘Istinu si rekao, ako dovršiš.’ Vjerovjesnik, sallallahu alejhi ve sellem, prepoznao je šta žele, pa se rasrdio. Tada je Uzvišeni Allah objavio: ‘I nije Nas dotakao nikakav umor. Zato strpljivo podnosi ono što govore.’“ ⟦Prijevod kur’anskog navoda: Kaf, 50:38–39, navedeni dijelovi dvaju ajeta.⟧","ar_ranges":[[7,106]],"ar_html":"وَقَدْ \u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنِي مِهْرَانُ، عن ابن سِنَانٍ، عَنْ أَبِي بَكْرٍ، [قَالَ: \u003c/span>جَاءَ الْيَهُودُ الى النبي ص فَقَالُوا:\nيَا مُحَمَّدُ، أَخْبِرْنَا: مَا خَلَقَ اللَّهُ مِنَ الْخَلْقِ فِي هَذِهِ الأَيَّامِ السِّتَّةِ؟ فَقَالَ: خَلَقَ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ، وَخَلَقَ الْمَدَائِنَ وَالأَقْوَاتَ وَالأَنْهَارَ وَعُمْرَانَهَا وَخَرَابَهَا يَوْمَ الأَرْبِعَاءِ، وَخَلَقَ السَّمَوَاتِ وَالْمَلائِكَةَ يَوْمَ الْخَمِيسِ، إِلَى ثَلاثِ سَاعَاتٍ بَقِينَ مِنْ يَوْمِ الْجُمُعَةِ، وَخَلَقَ فِي أَوَّلِ الثَّلاثِ سَاعَاتٍ الآجَالَ، وَفِي الثَّانِيَةِ الآفَةَ، وَفِي الثَّالِثَةِ آدَمَ قَالُوا: صدقت ان اتممت، فعرف النبي ص مَا يُرِيدُونَ، فَغَضِبَ، فَأَنْزَلَ اللَّهُ تَعَالَى: «وَما مَسَّنا مِنْ لُغُوبٍ فَاصْبِرْ عَلى مَا يَقُولُونَ] » .","bs_ranges":[[0,101]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: rekao je: pričao mi je Mihran, od Ibn Sinana, od Ebu Bekra, koji je rekao: \u003c/span>„Jevreji su došli Vjerovjesniku, sallallahu alejhi ve sellem, i rekli: ‘Muhammede, obavijesti nas: koja je stvorenja Allah stvorio u ovih šest dana?’ Odgovorio je: ‘Zemlju je stvorio u nedjelju i ponedjeljak, planine je stvorio u utorak, a gradove, opskrbu, rijeke, njihovu nastanjenost i njihovu opustjelost stvorio je u srijedu. Nebesa i meleke stvarao je od četvrtka do preostala tri sata petka. U prvom od ta tri sata stvorio je rokove života, u drugom nedaću, a u trećem Adema.’ Rekli su: ‘Istinu si rekao, ako dovršiš.’ Vjerovjesnik, sallallahu alejhi ve sellem, prepoznao je šta žele, pa se rasrdio. Tada je Uzvišeni Allah objavio: ‘I nije Nas dotakao nikakav umor. Zato strpljivo podnosi ono što govore.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Kaf, 50:38–39, navedeni dijelovi dvaju ajeta.⟧\u003c/span>"},{"id":"50.3","ar":"فإن قال قائل: فإن كان الأمر كما وصفت من أن الله تعالى خلق الأرض قبل السماء، فما معنى قول ابن عباس الذى حدثكموه واصل ابن عَبْدِ الأَعْلَى الأَسَدِيُّ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى مِنْ شَيْءٍ الْقَلَمُ، فَقَالَ لَهُ: اكْتُبْ، فَقَالَ: وَمَا أَكْتُبُ يَا رَبِّ؟ قَالَ: اكْتُبِ الْقَدَرَ، قَالَ:\nفَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ مِنْ ذَلِكَ إِلَى قِيَامِ السَّاعَةِ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ فَفَتَقَ مِنْهُ السَّمَوَاتِ، ثُمَّ خَلَقَ النُّونَ، فَدُحِيَتِ الأَرْضُ عَلَى ظَهْرِهِ، فَاضْطَرَبَ النُّونُ، فَمَادَتِ الأَرْضُ فَأُثْبِتَتْ بِالْجِبَالِ، فَإِنَّهَا لَتَفْخَرُ عَلَى الارض","bs":"Ako neko kaže: „Ako je stvar onakva kakvom si je opisao — da je Uzvišeni Allah stvorio Zemlju prije neba — šta onda znače riječi Ibn Abbasa koje vam je pričao Vasil ibn Abdula‘la el-Esedi: pričao nam je Muhammed ibn Fudajl, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: ‘Prvo što je Uzvišeni Allah stvorio bilo je pero. Rekao mu je: Piši! Ono je reklo: A šta da pišem, Gospodaru moj? Rekao je: Zapiši određenje! I pero je ispisalo ono što će biti od tada do nastupanja Časa. Zatim je podigao vodenu paru i iz nje razdvojio nebesa. Potom je stvorio nuna, pa je Zemlja rasprostrta na njegovim leđima. Nun se pokrenuo i uzdrmao, pa se Zemlja zaljuljala i bila je učvršćena planinama. One se doista ponose nad Zemljom.’“ ⟦Napomena prevodioca: نون je ovdje preneseno kao „nun“. Predaja na stranici 52 poistovjećuje ga s velikom ribom; to je objašnjenje u predaji, a ne dopuna kur’anskog teksta.⟧","ar_ranges":[[157,259]],"ar_html":"فإن قال قائل: فإن كان الأمر كما وصفت من أن الله تعالى خلق الأرض قبل السماء، فما معنى قول ابن عباس الذى حدثكموه واصل ابن عَبْدِ الأَعْلَى الأَسَدِيُّ، قَالَ: \u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى مِنْ شَيْءٍ الْقَلَمُ، فَقَالَ لَهُ: اكْتُبْ، فَقَالَ: وَمَا أَكْتُبُ يَا رَبِّ؟ قَالَ: اكْتُبِ الْقَدَرَ، قَالَ:\nفَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ مِنْ ذَلِكَ إِلَى قِيَامِ السَّاعَةِ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ فَفَتَقَ مِنْهُ السَّمَوَاتِ، ثُمَّ خَلَقَ النُّونَ، فَدُحِيَتِ الأَرْضُ عَلَى ظَهْرِهِ، فَاضْطَرَبَ النُّونُ، فَمَادَتِ الأَرْضُ فَأُثْبِتَتْ بِالْجِبَالِ، فَإِنَّهَا لَتَفْخَرُ عَلَى الارض","bs_ranges":[[189,281]],"bs_html":"Ako neko kaže: „Ako je stvar onakva kakvom si je opisao — da je Uzvišeni Allah stvorio Zemlju prije neba — šta onda znače riječi Ibn Abbasa koje vam je pričao Vasil ibn Abdula‘la el-Esedi: \u003cspan class=\"isnad\">pričao nam je Muhammed ibn Fudajl, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: \u003c/span>‘Prvo što je Uzvišeni Allah stvorio bilo je pero. Rekao mu je: Piši! Ono je reklo: A šta da pišem, Gospodaru moj? Rekao je: Zapiši određenje! I pero je ispisalo ono što će biti od tada do nastupanja Časa. Zatim je podigao vodenu paru i iz nje razdvojio nebesa. Potom je stvorio nuna, pa je Zemlja rasprostrta na njegovim leđima. Nun se pokrenuo i uzdrmao, pa se Zemlja zaljuljala i bila je učvršćena planinama. One se doista ponose nad Zemljom.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: نون je ovdje preneseno kao „nun“. Predaja na stranici 52 poistovjećuje ga s velikom ribom; to je objašnjenje u predaji, a ne dopuna kur’anskog teksta.⟧\u003c/span>"}],"notes":[]},{"n":51,"ar":"حَدَّثَنِي وَاصِلٌ، قَالَ: حَدَّثَنَا وَكِيعٌ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ نَحْوَهُ.\n\nحَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، عَنْ شُعْبَةَ، عَنْ سُلَيْمَانَ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى الْقَلَمَ فَجَرَى بِمَا هُوَ كَائِنٌ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ، فَخُلِقَتْ مِنْهُ السَّمَوَاتُ، ثُمَّ خَلَقَ النُّونَ، فَبُسِطَتِ الأَرْضُ عَلَى ظهر النون، فتحرك النون، فمادت الارض فاثبت بالجبال، فان الْجِبَالَ لَتَفْخَرُ عَلَى الأَرْضِ قَالَ: وَقَرَأَ: «ن وَالْقَلَمِ وَما يَسْطُرُونَ» .\n\nحدثني تميم بن المنتصر، قال: أخبرنا إسحاق، عَنْ شَرِيكٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ- او مُجَاهِدٍ- عَنِ ابْنِ عَبَّاسٍ بِنَحْوِهِ، إِلا أَنَّهُ قَالَ: فَفُتِقَتْ مِنْهُ السَّمَوَاتُ.\n\nحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا يَحْيَى، قَالَ: حَدَّثَنَا سُفْيَانُ، قَالَ: حَدَّثَنِي سُلَيْمَانُ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى الْقَلَمُ فَقَالَ: اكْتُبْ، فَقَالَ: مَا أَكْتُبُ؟ قَالَ: اكْتُبِ الْقَدَرَ، قَالَ: فَجَرَى بِمَا هُوَ كَائِنٌ مِنْ ذَلِكَ الْيَوْمِ إِلَى قِيَامِ السَّاعَةِ ثُمَّ خَلَقَ النُّونَ، وَرَفَعَ بُخَارَ الْمَاءِ فَفُتِقَتْ مِنْهُ السَّمَاءُ، وَبُسِطَتِ الأَرْضُ عَلَى ظَهْرِ النُّونِ، فَاضْطَرَبَ النُّونُ، فَمَادَتِ الأَرْضُ فَأُثْبِتَتْ بِالْجِبَالِ، قَالَ: فَإِنَّهَا لَتَفْخَرُ عَلَى الأَرْضِ.\n\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ، حَدَّثَنَا جَرِيرٌ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ أَبِي الضُّحَى مُسْلِمِ بْنِ صُبَيْحٍ، عَنِ ابْنِ عَبَّاسٍ قَالَ: أَوَّلُ شَيْءٍ خَلَقَ","bs":"\u003cp data-paragraph=\"51.1\">Pričao mi je Vasil: rekao je: pričao nam je Veki‘, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, nešto slično tome.\u003c/p>\u003cp data-paragraph=\"51.2\">Pričao nam je Ibn el-Musenna: rekao je: pričao nam je Ibn Ebu Adijj, od Šu‘be, od Sulejmana, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: „Prvo što je Uzvišeni Allah stvorio bilo je pero, pa je ono ispisalo ono što će biti. Zatim je podigao vodenu paru i od nje su stvorena nebesa. Potom je stvorio nuna, pa je Zemlja rasprostrta na nunovim leđima. Nun se pokrenuo, pa se Zemlja zaljuljala i bila je učvršćena planinama. Planine se doista ponose nad Zemljom.“ Rekao je i proučio: „Nun. Tako Mi pera i onoga što pišu.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kalem, 68:1.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"51.3\">Pričao mi je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od A‘meša, od Ebu Zabjana — ili Mudžahida — od Ibn Abbasa, nešto slično tome, osim što je rekao: „Pa su iz nje razdvojena nebesa.“\u003c/p>\u003cp data-paragraph=\"51.4\">Pričao nam je Ibn Beššar: rekao je: pričao nam je Jahja: rekao je: pričao nam je Sufjan: rekao je: pričao mi je Sulejman, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: „Prvo što je Uzvišeni Allah stvorio bilo je pero. Rekao je: ‘Piši!’ Ono je reklo: ‘Šta da pišem?’ Rekao je: ‘Zapiši određenje!’ I ono je ispisalo ono što će biti od toga dana do nastupanja Časa. Zatim je stvorio nuna i podigao vodenu paru, pa je iz nje razdvojeno nebo, a Zemlja je rasprostrta na nunovim leđima. Nun se uzdrmao, pa se Zemlja zaljuljala i bila je učvršćena planinama.“ Rekao je: „One se doista ponose nad Zemljom.“\u003c/p>\u003cp data-paragraph=\"51.5\">Pričao nam je Ibn Humejd: pričao nam je Džerir, od Ataa ibn es-Saiba, od Ebu Duhaa Muslima ibn Subejha, od Ibn Abbasa, koji je rekao: „Prvo što je\u003c/p>","paragraphs":[{"id":"51.1","ar":"حَدَّثَنِي وَاصِلٌ، قَالَ: حَدَّثَنَا وَكِيعٌ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ نَحْوَهُ.","bs":"Pričao mi je Vasil: rekao je: pričao nam je Veki‘, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, nešto slično tome.","ar_ranges":[[0,106]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي وَاصِلٌ، قَالَ: حَدَّثَنَا وَكِيعٌ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ \u003c/span>نَحْوَهُ.","bs_ranges":[[0,93]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Vasil: rekao je: pričao nam je Veki‘, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, \u003c/span>nešto slično tome."},{"id":"51.2","ar":"حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، عَنْ شُعْبَةَ، عَنْ سُلَيْمَانَ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى الْقَلَمَ فَجَرَى بِمَا هُوَ كَائِنٌ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ، فَخُلِقَتْ مِنْهُ السَّمَوَاتُ، ثُمَّ خَلَقَ النُّونَ، فَبُسِطَتِ الأَرْضُ عَلَى ظهر النون، فتحرك النون، فمادت الارض فاثبت بالجبال، فان الْجِب ٍ قَالَ: \u003c/span>أَوَّلُ شَيْءٍ خَلَقَ","bs_ranges":[[0,134]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: pričao nam je Džerir, od Ataa ibn es-Saiba, od Ebu Duhaa Muslima ibn Subejha, od Ibn Abbasa, koji je rekao: \u003c/span>„Prvo što je"}],"notes":[]},{"n":52,"ar":"اللَّهُ تَعَالَى الْقَلَمُ، فَقَالَ لَهُ: اكْتُبْ، فَكَتَبَ مَا هُوَ كَائِنٌ إِلَى أَنْ تَقُومَ السَّاعَةُ، ثُمَّ خَلَقَ النُّونَ فَوْقَ الْمَاءِ، ثُمَّ كَبَسَ الأَرْضَ عَلَيْهِ.\n\nقيل: ذلك صحيح على ما روي عنه وعن غيره من معنى ذلك مشروحا مفسرا غير مخالف شيئا مما رويناه عنه في ذلك.\n\nفإن قال: وما الذي روي عنه وعن غيره من شرح ذلك الدال على صحة كل ما رويت لنا في هذا المعنى عنه؟\n\nقيل له: حَدَّثَنِي مُوسَى بْنُ هَارُونَ الْهَمْدَانِيُّ وَغَيْرُهُ، قَالُوا: حَدَّثَنَا عَمْرُو بْنُ حَمَّادٍ، حَدَّثَنَا أَسْبَاطُ بْنُ نَصْرٍ، عَنِ السُّدِّيِّ، عَنْ أَبِي مَالِكٍ، وَعَنْ أَبِي صالح، عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب رسول الله ص «هُوَ الَّذِي خَلَقَ لَكُمْ مَا فِي الْأَرْضِ جَمِيعاً ثُمَّ اسْتَوى إِلَى السَّماءِ فَسَوَّاهُنَّ سَبْعَ سَماواتٍ» قَالَ: إِنَّ اللَّهَ تَعَالَى كَانَ عَرْشُهُ عَلَى الْمَاءِ وَلَمْ يَخْلُقْ شَيْئًا غَيْرَ مَا خَلَقَ قَبْلَ الْمَاءِ، فَلَمَّا أَرَادَ أَنْ يَخْلُقَ الْخَلْقَ أَخْرَجَ مِنَ الْمَاءِ دُخَانًا فَارْتَفَعَ فَوْقَ الْمَاءِ، فَسَمَا عَلَيْهِ، فَسَمَّاهُ سَمَاءً، ثُمَّ أَيْبَسَ الْمَاءَ، فَجَعَلَهُ أَرْضًا وَاحِدَةً، ثُمَّ فَتَقَهَا فَجَعَلَهَا سَبْعَ أَرَضِينَ فِي يَوْمَيْنِ، فِي الأَحَدِ وَالاثْنَيْنِ، فَخَلَقَ الأَرْضَ عَلَى حُوتٍ- وَالْحُوتُ هُوَ النُّونُ الَّذِي ذَكَرَ اللَّهُ عَزَّ وَجَلَّ فِي الْقُرْآنِ: «ن وَالْقَلَمِ» - وَالْحُوتُ فِي الْمَاءِ، وَالْمَاءُ عَلَى ظَهْرِ صَفَاةٍ، وَالصَّفَاةُ عَلَى ظَهْرِ مَلَكٍ، وَالْمَلَكُ عَلَى صَخْرَةٍ، والصخرة على الرِّيحِ- وَهِيَ الصَّخْرَةُ الَّتِي ذَكَرَ لُقْمَانُ- لَيْسَتْ فِي السَّمَاءِ وَلا فِي الأَرْضِ، فَتَحَرَّكَ الْحُوتُ فَاضْطَرَبَ، فَتَزَلْزَلَتِ الأَرْضُ، فَأَرْسَى عَلَيْهَا الْجِبَالُ فَقَرَّتْ، فالجبال","bs":"\u003cp data-paragraph=\"52.1\">Uzvišeni Allah stvorio bilo je pero. Rekao mu je: ‘Piši!’ I ono je zapisalo ono što će biti do nastupanja Časa. Zatim je stvorio nuna iznad vode, a potom je na njega naslagao Zemlju.“\u003c/p>\u003cp data-paragraph=\"52.2\">Odgovara se: To je ispravno prema onome što je preneseno od njega i od drugih kao razrađeno i objašnjeno značenje toga, koje nije u suprotnosti ni s čim što smo od njega o tome prenijeli.\u003c/p>\u003cp data-paragraph=\"52.3\">Ako kaže: „Šta je od njega i drugih preneseno kao objašnjenje koje potvrđuje ispravnost svega što si nam od njega prenio o ovom značenju?“\u003c/p>\u003cp data-paragraph=\"52.4\">Odgovara mu se: Pričali su mi Musa ibn Harun el-Hemdani i drugi; rekli su: pričao nam je Amr ibn Hammad: pričao nam je Esbat ibn Nasr, od Suddija, od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, o riječima: „On je Taj koji je za vas stvorio sve što je na Zemlji, zatim se usmjerio prema nebu i od njih sačinio sedam nebesa.“ Rekao je: „Arš Uzvišenog Allaha bio je na vodi, a On nije stvorio ništa drugo osim onoga što je stvorio prije vode. Kada je htio stvarati stvorenja, iz vode je izveo dim, pa se on podigao iznad vode i uzvisio nad njom. Nazvao ga je nebom. Zatim je vodu osušio i učinio je jednom zemljom, potom ju je razdvojio i učinio je sedmerim zemljama u dva dana, u nedjelju i ponedjeljak. Zemlju je stvorio na velikoj ribi — a riba je nun koji Allah, Silan i Uzvišen, spominje u Kur’anu: ‘Nun. Tako Mi pera’ — riba je u vodi, voda je na glatkom kamenu, glatki kamen je na leđima meleka, melek je na stijeni, a stijena na vjetru. To je stijena koju je spomenuo Lukman; nije ni na nebu ni na Zemlji. Riba se pokrenula i uzdrmala, pa se Zemlja zatresla. Zato je na njoj učvrstio planine i ona se smirila. Planine se \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:29, navedeni dio; El-Kalem, 68:1, navedeni dio. Poistovjećivanje nuna s ribom pripada navedenoj predaji.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"52.1","ar":"اللَّهُ تَعَالَى الْقَلَمُ، فَقَالَ لَهُ: اكْتُبْ، فَكَتَبَ مَا هُوَ كَائِنٌ إِلَى أَنْ تَقُومَ السَّاعَةُ، ثُمَّ خَلَقَ النُّونَ فَوْقَ الْمَاءِ، ثُمَّ كَبَسَ الأَرْضَ عَلَيْهِ.","bs":"Uzvišeni Allah stvorio bilo je pero. Rekao mu je: ‘Piši!’ I ono je zapisalo ono što će biti do nastupanja Časa. Zatim je stvorio nuna iznad vode, a potom je na njega naslagao Zemlju.“","ar_ranges":[],"ar_html":"اللَّهُ تَعَالَى الْقَلَمُ، فَقَالَ لَهُ: اكْتُبْ، فَكَتَبَ مَا هُوَ كَائِنٌ إِلَى أَنْ تَقُومَ السَّاعَةُ، ثُمَّ خَلَقَ النُّونَ فَوْقَ الْمَاءِ، ثُمَّ كَبَسَ الأَرْضَ عَلَيْهِ.","bs_ranges":[],"bs_html":"Uzvišeni Allah stvorio bilo je pero. Rekao mu je: ‘Piši!’ I ono je zapisalo ono što će biti do nastupanja Časa. Zatim je stvorio nuna iznad vode, a potom je na njega naslagao Zemlju.“"},{"id":"52.2","ar":"قيل: ذلك صحيح على ما روي عنه وعن غيره من معنى ذلك مشروحا مفسرا غير مخالف شيئا مما رويناه عنه في ذلك.","bs":"Odgovara se: To je ispravno prema onome što je preneseno od njega i od drugih kao razrađeno i objašnjeno značenje toga, koje nije u suprotnosti ni s čim što smo od njega o tome prenijeli.","ar_ranges":[],"ar_html":"قيل: ذلك صحيح على ما روي عنه وعن غيره من معنى ذلك مشروحا مفسرا غير مخالف شيئا مما رويناه عنه في ذلك.","bs_ranges":[],"bs_html":"Odgovara se: To je ispravno prema onome što je preneseno od njega i od drugih kao razrađeno i objašnjeno značenje toga, koje nije u suprotnosti ni s čim što smo od njega o tome prenijeli."},{"id":"52.3","ar":"فإن قال: وما الذي روي عنه وعن غيره من شرح ذلك الدال على صحة كل ما رويت لنا في هذا المعنى عنه؟","bs":"Ako kaže: „Šta je od njega i drugih preneseno kao objašnjenje koje potvrđuje ispravnost svega što si nam od njega prenio o ovom značenju?“","ar_ranges":[],"ar_html":"فإن قال: وما الذي روي عنه وعن غيره من شرح ذلك الدال على صحة كل ما رويت لنا في هذا المعنى عنه؟","bs_ranges":[],"bs_html":"Ako kaže: „Šta je od njega i drugih preneseno kao objašnjenje koje potvrđuje ispravnost svega što si nam od njega prenio o ovom značenju?“"},{"id":"52.4","ar":"قيل له: حَدَّثَنِي مُوسَى بْنُ هَارُونَ الْهَمْدَانِيُّ وَغَيْرُهُ، قَالُوا: حَدَّثَنَا عَمْرُو بْنُ حَمَّادٍ، حَدَّثَنَا أَسْبَاطُ بْنُ نَصْرٍ، عَنِ السُّدِّيِّ، عَنْ أَبِي مَالِكٍ، وَعَنْ أَبِي صالح، عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب رسول الله ص «هُوَ الَّذِي خَلَقَ لَكُمْ مَا فِي الْأَرْضِ جَمِيعاً ثُمَّ اسْتَوى إِلَى السَّماءِ فَسَوَّاهُنَّ سَبْعَ سَماواتٍ» قَالَ: إِنَّ اللَّهَ تَعَالَى كَانَ عَرْشُهُ عَلَى الْمَاءِ وَلَمْ يَخْلُقْ شَيْئًا غَيْرَ مَا خَلَقَ قَبْلَ الْمَاءِ، فَلَمَّا أَرَادَ أَنْ يَخْلُقَ الْخَلْقَ أَخْرَجَ مِنَ الْمَاءِ دُخَانًا فَارْتَفَعَ فَوْقَ الْمَاءِ، فَسَمَا عَلَيْهِ، فَسَمَّاهُ سَمَاءً، ثُمَّ أَيْبَسَ الْمَاءَ، فَجَعَلَهُ أَرْضًا وَاحِدَةً، ثُمَّ فَتَقَهَا فَجَعَلَهَا سَبْعَ أَرَضِينَ فِي يَوْمَيْنِ، فِي الأَحَدِ وَالاثْنَيْنِ، فَخَلَقَ الأَرْضَ عَلَى حُوتٍ- وَالْحُوتُ هُوَ النُّونُ الَّذِي ذَكَرَ اللَّهُ عَزَّ وَجَلَّ فِي الْقُرْآنِ: «ن وَالْقَلَمِ» - وَالْحُوتُ فِي الْمَاءِ، وَالْمَاءُ عَلَى ظَهْرِ صَفَاةٍ، وَالصَّفَاةُ عَلَى ظَهْرِ مَلَكٍ، وَالْمَلَكُ عَلَى صَخْرَةٍ، والصخرة على الرِّيحِ- وَهِيَ الصَّخْرَةُ الَّتِي ذَكَرَ لُقْمَانُ- لَيْسَتْ فِي السَّمَاءِ وَلا فِي الأَرْضِ، فَتَحَرَّكَ الْحُوتُ فَاضْطَرَبَ، فَتَزَلْزَلَتِ الأَرْضُ، فَأَرْسَى عَلَيْهَا الْجِبَالُ فَقَرَّتْ، فالجبال","bs":"Odgovara mu se: Pričali su mi Musa ibn Harun el-Hemdani i drugi; rekli su: pričao nam je Amr ibn Hammad: pričao nam je Esbat ibn Nasr, od Suddija, od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, o riječima: „On je Taj koji je za vas stvorio sve što je na Zemlji, zatim se usmjerio prema nebu i od njih sačinio sedam nebesa.“ Rekao je: „Arš Uzvišenog Allaha bio je na vodi, a On nije stvorio ništa drugo osim onoga što je stvorio prije vode. Kada je htio stvarati stvorenja, iz vode je izveo dim, pa se on podigao iznad vode i uzvisio nad njom. Nazvao ga je nebom. Zatim je vodu osušio i učinio je jednom zemljom, potom ju je razdvojio i učinio je sedmerim zemljama u dva dana, u nedjelju i ponedjeljak. Zemlju je stvorio na velikoj ribi — a riba je nun koji Allah, Silan i Uzvišen, spominje u Kur’anu: ‘Nun. Tako Mi pera’ — riba je u vodi, voda je na glatkom kamenu, glatki kamen je na leđima meleka, melek je na stijeni, a stijena na vjetru. To je stijena koju je spomenuo Lukman; nije ni na nebu ni na Zemlji. Riba se pokrenula i uzdrmala, pa se Zemlja zatresla. Zato je na njoj učvrstio planine i ona se smirila. Planine se ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:29, navedeni dio; El-Kalem, 68:1, navedeni dio. Poistovjećivanje nuna s ribom pripada navedenoj predaji.⟧","ar_ranges":[[8,406]],"ar_html":"قيل له: \u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بْنُ هَارُونَ الْهَمْدَانِيُّ وَغَيْرُهُ، قَالُوا: حَدَّثَنَا عَمْرُو بْنُ حَمَّادٍ، حَدَّثَنَا أَسْبَاطُ بْنُ نَصْرٍ، عَنِ السُّدِّيِّ، عَنْ أَبِي مَالِكٍ، وَعَنْ أَبِي صالح، عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب رسول الله ص «هُوَ الَّذِي خَلَقَ لَكُمْ مَا فِي الْأَرْضِ جَمِيعاً ثُمَّ اسْتَوى إِلَى السَّماءِ فَسَوَّاهُنَّ سَبْعَ سَماواتٍ» قَالَ: \u003c/span>إِنَّ اللَّهَ تَعَالَى كَانَ عَرْشُهُ عَلَى الْمَاءِ وَلَمْ يَخْلُقْ شَيْئًا غَيْرَ مَا خَلَقَ قَبْلَ الْمَاءِ، فَلَمَّا أَرَادَ أَنْ يَخْلُقَ الْخَلْقَ أَخْرَجَ مِنَ الْمَاءِ دُخَانًا فَارْتَفَعَ فَوْقَ الْمَاءِ، فَسَمَا عَلَيْهِ، فَسَمَّاهُ سَمَاءً، ثُمَّ أَيْبَسَ الْمَاءَ، فَجَعَلَهُ أَرْضًا وَاحِدَةً، ثُمَّ فَتَقَهَا فَجَعَلَهَا سَبْعَ أَرَضِينَ فِي يَوْمَيْنِ، فِي الأَحَدِ وَالاثْنَيْنِ، فَخَلَقَ الأَرْضَ عَلَى حُوتٍ- وَالْحُوتُ هُوَ النُّونُ الَّذِي ذَكَرَ اللَّهُ عَزَّ وَجَلَّ فِي الْقُرْآنِ: «ن وَالْقَلَمِ» - وَالْحُوتُ فِي الْمَاءِ، وَالْمَاءُ عَلَى ظَهْرِ صَفَاةٍ، وَالصَّفَاةُ عَلَى ظَهْرِ مَلَكٍ، وَالْمَلَكُ عَلَى صَخْرَةٍ، والصخرة على الرِّيحِ- وَهِيَ الصَّخْرَةُ الَّتِي ذَكَرَ لُقْمَانُ- لَيْسَتْ فِي السَّمَاءِ وَلا فِي الأَرْضِ، فَتَحَرَّكَ الْحُوتُ فَاضْطَرَبَ، فَتَزَلْزَلَتِ الأَرْضُ، فَأَرْسَى عَلَيْهَا الْجِبَالُ فَقَرَّتْ، فالجبال","bs_ranges":[[16,313]],"bs_html":"Odgovara mu se: \u003cspan class=\"isnad\">Pričali su mi Musa ibn Harun el-Hemdani i drugi; rekli su: pričao nam je Amr ibn Hammad: pričao nam je Esbat ibn Nasr, od Suddija, od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, \u003c/span>o riječima: „On je Taj koji je za vas stvorio sve što je na Zemlji, zatim se usmjerio prema nebu i od njih sačinio sedam nebesa.“ Rekao je: „Arš Uzvišenog Allaha bio je na vodi, a On nije stvorio ništa drugo osim onoga što je stvorio prije vode. Kada je htio stvarati stvorenja, iz vode je izveo dim, pa se on podigao iznad vode i uzvisio nad njom. Nazvao ga je nebom. Zatim je vodu osušio i učinio je jednom zemljom, potom ju je razdvojio i učinio je sedmerim zemljama u dva dana, u nedjelju i ponedjeljak. Zemlju je stvorio na velikoj ribi — a riba je nun koji Allah, Silan i Uzvišen, spominje u Kur’anu: ‘Nun. Tako Mi pera’ — riba je u vodi, voda je na glatkom kamenu, glatki kamen je na leđima meleka, melek je na stijeni, a stijena na vjetru. To je stijena koju je spomenuo Lukman; nije ni na nebu ni na Zemlji. Riba se pokrenula i uzdrmala, pa se Zemlja zatresla. Zato je na njoj učvrstio planine i ona se smirila. Planine se \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:29, navedeni dio; El-Kalem, 68:1, navedeni dio. Poistovjećivanje nuna s ribom pripada navedenoj predaji.⟧\u003c/span>"}],"notes":[]}]}</script><script id="databaseData" type="application/json">[{"stranica":28,"ar_tekst":"القول في الدلالة على أن الله عز وجل القديم الأول قبل شيء وأنه هو المحدث كل شيء بقدرته تعالى ذكره فمن الدلالة على ذلك أنه لا شيء في العالم مشاهد إلا جسم أو قائم بجسم، وأنه لا جسم إلا مفترق أو مجتمع، وأنه لا مفترق منه إلا وهو موهوم فيه الائتلاف إلى غيره من أشكاله، ولا مجتمع منه إلا وهو موهوم فيه الافتراق، وأنه متى عدم أحدهما عدم الآخر معه، وأنه إذا اجتمع الجزءان منه بعد الافتراق، فمعلوم أن اجتماعهما حادث فيهما بعد أن لم يكن، وأن الافتراق إذا حدث فيهما بعد الاجتماع، فمعلوم أن الافتراق فيهما حادث بعد أن لم يكن.","bs_tekst":"Rasprava o dokazivanju da je Allah, Silan je i Uzvišen, Bespočetni, Prvi prije svake stvari i da On Svojom moći dovodi svaku stvar u postojanje, uzvišen je Njegov spomen. Među dokazima toga jeste da na svijetu nema ničega što se opaža a da nije tijelo ili nešto što postoji pri tijelu; da nema tijela a da nije razdvojeno ili sastavljeno; da nema razdvojenoga njegova dijela za koji nije zamislivo spajanje s drugim, njemu sličnim dijelovima; da nema sastavljenoga za koje nije zamislivo razdvajanje; da, kada jedno od toga dvoga izostane, s njim izostane i drugo; da je, kada se njegova dva dijela sastave nakon razdvojenosti, poznato da je njihova sastavljenost u njima nastala nakon što nije postojala; i da je, kada u njima nastane razdvojenost nakon sastavljenosti, poznato da je razdvojenost u njima nastala nakon što nije postojala."},{"stranica":28,"ar_tekst":"وإذا كان الأمر فيما في العالم من شيء كذلك، وكان حكم ما لم يشاهد وما هو من جنس ما شاهدنا في معنى جسم أو قائم بجسم، وكان ما لم يخل من الحدث لا شك أنه محدث بتأليف مؤلف له إن كان مجتمعا، وتفريق مفرق له إن كان مفترقا وكان معلوما بذلك أن جامع ذلك إن كان مجتمعا، ومفرقه إن كان مفترقا من لا يشبهه، ومن لا يجوز عليه الاجتماع والافتراق، وهو الواحد القادر الجامع بين المختلفات، الذي لا يشبهه شيء، وهو على كل شيء قدير- فبين بما وصفنا أن بارئ الأشياء ومحدثها كان قبل كل شيء، وأن الليل والنهار والزمان والساعات محدثات، وأن محدثها الذي يدبرها ويصرفها قبلها، إذ كان من المحال أن يكون شيء يحدث شيئا إلا ومحدثه قبله، وأن في قوله تعالى ذكره:","bs_tekst":"Ako je takvo stanje stvari koje su na svijetu i ako za ono što nije opaženo, a pripada istoj vrsti kao ono što smo opazili, važi da je tijelo ili nešto što postoji pri tijelu; i ako je ono što nije lišeno nastajanja bez sumnje samo nastalo, sastavljanjem onoga koji ga sastavlja ako je sastavljeno i razdvajanjem onoga koji ga razdvaja ako je razdvojeno; i ako se time zna da je onaj koji ga sastavlja, ako je sastavljeno, i onaj koji ga razdvaja, ako je razdvojeno, neko ko mu nije sličan i na koga se ne mogu primijeniti sastavljanje i razdvajanje — a On je Jedini, Moćni, koji spaja ono što se razlikuje, kojem ništa nije slično i koji je nad svakom stvari moćan — onda je iz onoga što smo opisali jasno da je Stvoritelj stvari i Onaj koji ih dovodi u postojanje bio prije svake stvari; da su noć i dan, vrijeme i sati nastali; i da je Onaj koji ih je doveo u postojanje, koji njima upravlja i raspolaže, bio prije njih. Jer je nemoguće da nešto dovodi nešto u postojanje, a da onaj koji ga dovodi u postojanje nije prije njega. I da u Njegovim riječima, uzvišen je Njegov spomen:"},{"stranica":28,"ar_tekst":"«أَفَلا يَنْظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ وَإِلَى السَّماءِ كَيْفَ رُفِعَتْ وَإِلَى الْجِبالِ كَيْفَ نُصِبَتْ وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ» ، لابلغ الحجج،","bs_tekst":"⟦Kur’anski navod, prijevod, 88:17–20⟧ „Zar ne gledaju kamile, kako su stvorene, i nebo, kako je podignuto, i planine, kako su postavljene, i Zemlju, kako je prostrta?“ — postoji najrječitiji dokaz,"},{"stranica":29,"ar_tekst":"وأدل الدلائل- لمن فكر بعقل، واعتبر بفهم- على قدم بارئها، وحدوث كل ما جانسها، وأن لها خالقا لا يشبهها.","bs_tekst":"i najjasniji pokazatelj — za onoga ko razmišlja razumom i pouku uzima razumijevanjem — bespočetnosti njihova Stvoritelja, nastanka svega što je njihove vrste i toga da imaju Stvoritelja koji im nije sličan."},{"stranica":29,"ar_tekst":"وذلك أن كل ما ذكر ربنا تبارك وتعالى في هذه الآية من الجبال والأرض والإبل فإن ابن آدم يعالجه ويدبره بتحويل وتصريف وحفر ونحت وهدم، غير ممتنع عليه شيء من ذلك ثم إن ابن آدم مع ذلك غير قادر على إيجاد شيء من ذلك من غير أصل، فمعلوم أن العاجز عن إيجاد ذلك لم يحدث نفسه، وأن الذي هو غير ممتنع ممن أراد تصريفه وتقليبه لم يوجده من هو مثله، ولا هو أوجد نفسه، وأن الذي أنشأه وأوجد عينه هو الذي لا يعجزه شيء أراده، ولا يمتنع عليه إحداث شيء شاء إحداثه، وهُوَ اللَّهُ الْواحِدُ الْقَهَّارُ.","bs_tekst":"Jer sve što je naš Gospodar, Blagoslovljeni i Uzvišeni, spomenuo u ovom ajetu od planina, Zemlje i kamila Ademov sin obrađuje i njime upravlja preobražavanjem, raspoređivanjem, kopanjem, klesanjem i rušenjem; ništa mu se od toga ne može oduprijeti. Uprkos tome, Ademov sin nije sposoban išta od toga dovesti u postojanje bez prethodne osnove. Poznato je, dakle, da onaj ko je nemoćan to dovesti u postojanje nije sam sebe doveo u postojanje; i da ono što se ne može oduprijeti onome ko želi njime raspolagati i preokretati ga nije doveo u postojanje neko njemu sličan, niti je ono samo sebe dovelo u postojanje. Onaj koji ga je načinio i samu njegovu bit doveo u postojanje jeste Onaj kojem ništa što želi nije nemoguće i kojem se ne može oduprijeti nastanak bilo čega što želi dovesti u postojanje. A On je Allah, Jedini, Svepotčinitelj."},{"stranica":29,"ar_tekst":"فإن قال قائل: فما تنكر أن تكون الأشياء التي ذكرت من فعل قديمين؟","bs_tekst":"Ako neko kaže: Šta vas navodi da poričete mogućnost da su stvari koje ste spomenuli djelo dvojice bespočetnih?"},{"stranica":29,"ar_tekst":"قيل: أنكرنا ذلك لوجودنا اتصال التدبير وتمام الخلق، فقلنا: لو كان المدبر اثنين، لم يخلوا من اتفاق أو اختلاف، فإن كانا متفقين فمعناهما واحد، وإنما جعل الواحد اثنين من قال بالاثنين وإن كانا مختلفين كان محالا وجود الخلق على التمام والتدبير على الاتصال، لأن المختلفين، فعل كل واحد منهما خلاف فعل صاحبه، بأن أحدهما إذا أحيا أمات الآخر، وإذا أوجد أحدهما أفنى الآخر، فكان محالا وجود شيء من الخلق على ما وجد عليه من التمام والاتصال.","bs_tekst":"Odgovara se: To poričemo zbog toga što nalazimo povezanost upravljanja i potpunost stvaranja. Zato smo rekli: Da su upravitelja dvojica, nužno bi se ili slagali ili razilazili. Ako se slažu, njihovo je značenje jedno, i samo je onaj ko govori o dvojici jedno nazvao dvama. Ako se razilaze, nemoguće je da stvorenja postoje u potpunosti i upravljanje u povezanosti, jer kod dvojice koji se razilaze djelovanje svakoga protivi se djelovanju njegova druga: kada jedan oživljava, drugi usmrćuje; i kada jedan dovodi u postojanje, drugi uništava. Stoga bi bilo nemoguće da išta od stvorenja postoji u potpunosti i povezanosti u kojima postoji."},{"stranica":29,"ar_tekst":"وفي قول الله عز وجل ذكره: «لَوْ كانَ فِيهِما آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتا فَسُبْحانَ اللَّهِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ» ، وقوله عز وجل: «مَا اتَّخَذَ اللَّهُ مِنْ وَلَدٍ وَما كانَ مَعَهُ مِنْ إِلهٍ إِذاً لَذَهَبَ كُلُّ إِلهٍ بِما خَلَقَ وَلَعَلا بَعْضُهُمْ عَلى بَعْضٍ سُبْحانَ اللَّهِ عَمَّا يَصِفُونَ عالِمِ الْغَيْبِ وَالشَّهادَةِ فَتَعالى عَمَّا يُشْرِكُونَ»","bs_tekst":"A u riječima Allaha, Silan je i Uzvišen Njegov spomen: ⟦Kur’anski navod, prijevod, 21:22⟧ „Da u njima ima bogova osim Allaha, njih dvoje bi se poremetili. Pa neka je slavljen Allah, Gospodar Prijestolja, iznad onoga što opisuju.“ I u Njegovim riječima, Silan je i Uzvišen: ⟦Kur’anski navod, prijevod, 23:91–92⟧ „Allah nije uzeo nikakvo dijete i uz Njega nije bilo nikakva boga. Tada bi svaki bog otišao s onim što je stvorio i jedni bi se nad drugima uzdigli. Slavljen neka je Allah, iznad onoga što opisuju, Poznavalac nevidljivoga i vidljivoga, uzvišen je iznad onoga što Mu pridružuju“"},{"stranica":30,"ar_tekst":"أبلغ حجة، وأوجز بيان، وأدل دليل على بطول ما قاله المبطلون من أهل الشرك بالله، وذلك أن السموات والأرض لو كان فيهما إله غير الله، لم يخل أمرهما مما وصفت من اتفاق واختلاف وفي القول باتفاقهما فساد القول بالتثنية، وإقرار بالتوحيد، وإحالة في الكلام بأن قائله سمى الواحد اثنين وفي القول باختلافهما، القول بفساد السموات والأرض، كما قال ربنا جل وعز: «لَوْ كانَ فِيهِما آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتا» لأن أحدهما كان إذا أحدث شيئا وخلقه كان من شأن الآخر إعدامه وإبطاله، وذلك أن كل مختلفين فأفعالهما مختلفة، كالنار التي تسخن، والثلج الذي يبرد ما أسخنته النار وأخرى، أن ذلك لو كان كما قاله المشركون بالله لم يخل كل واحد من الاثنين اللذين أثبتوهما قديمين من أن يكونا قويين او عاجزين، فان كانا عاجزين فالعاجز مقهور وغير كائن إلها وإن كانا قويين فإن كل واحد منهما بعجزه عن صاحبه عاجز، والعاجز لا يكون إلها وإن كان كل واحد منهما قويا على صاحبه عاجز، والعاجز لا يكون إلها وإن كان كل واحد منهما قويا على صاحبه، فهو بقوة صاحبه عليه عاجز، تعالى ذكره عما يشرك المشركون! فتبين إذا أن القديم بارئ الأشياء وصانعها هو الواحد الذي كان قبل كل شيء، وهو الكائن بعد كل شيء، والأول قبل كل شيء، والآخر بعد كل شيء، وأنه كان ولا وقت ولا زمان، ولا ليل ولا نهار، ولا ظلمة ولا نور إلا نور وجهه الكريم ولا سماء ولا أرض، ولا شمس ولا قمر ولا نجوم، وأن كل شيء سواه محدث مدبر مصنوع، انفرد بخلق جميعه بغير شريك ولا معين ولا ظهير، سبحانه من قادر قاهر! وقد حَدَّثَنِي عَلِيُّ بْنُ سَهْلٍ الرَّمْلِيُّ، قَالَ: حَدَّثَنَا زَيْدُ بْنُ أَبِي الزَّرْقَاءِ، عَنْ جَعْفَرٍ، عَنْ يَزِيدَ بْنِ الأَصَمِّ، عَنْ أَبِي هريرة، [ان النبي ص قال:","bs_tekst":"nalazi se najrječitiji dokaz, najsažetije objašnjenje i najjasniji pokazatelj nevaljanosti onoga što tvrde zagovornici neistine među onima koji Allahu pridružuju sudruge. Jer kada bi na nebesima i Zemlji postojao bog osim Allaha, njihovo stanje nužno bi bilo onakvo kakvo sam opisao: slaganje ili razilaženje. Tvrdnja da se slažu ruši tvrdnju o dvojstvu, priznaje jednoću i sadrži proturječje u govoru, jer je onaj koji to tvrdi jedno nazvao dvama. A tvrdnja da se razilaze znači tvrdnju o poremećaju nebesa i Zemlje, kao što je naš Gospodar, Veličanstveni i Silni, rekao: ⟦Kur’anski navod, prijevod, 21:22, dio⟧ „Da u njima ima bogova osim Allaha, njih dvoje bi se poremetili.“ Jer kada bi jedan od njih nešto doveo u postojanje i stvorio, drugome bi pripadalo da to učini nepostojećim i poništi. Kod svake dvojice koji se razilaze i njihova se djelovanja razlikuju, poput vatre koja zagrijava i snijega koji hladi ono što je vatra zagrijala. I još: kada bi bilo onako kako govore oni koji Allahu pridružuju sudruge, svaki od dvojice za koje tvrde da su bespočetni nužno bi bio ili moćan ili nemoćan. Ako su nemoćni, nemoćni je potčinjen i nije bog. Ako su moćni, svaki je od njih, zbog svoje nemoći prema drugome, nemoćan, a nemoćni ne može biti bog. I ako je svaki od njih moćan prema drugome, nemoćan je, a nemoćni ne može biti bog. I ako je svaki od njih moćan prema drugome, on je usljed moći svoga druga nad njim nemoćan. Uzvišen je Njegov spomen iznad onoga što mnogobošci pridružuju! Time je, dakle, jasno da je Bespočetni, Stvoritelj i Tvorac stvari, Jedini koji je bio prije svake stvari i koji će biti nakon svake stvari; Prvi prije svake stvari i Posljednji nakon svake stvari. On je bio, a nije bilo ni vremenskog trenutka ni vremena, ni noći ni dana, ni tame ni svjetla osim svjetla Njegova plemenitog lica, ni neba ni Zemlje, ni Sunca ni Mjeseca ni zvijezda. Sve osim Njega nastalo je, pod upravom je i načinjeno. On je sam stvorio sve to bez sudruga, pomagača ili potpore. Slavljen neka je, Moćni, Svepotčinitelj! Pričao mi je Ali ibn Sehl er-Remli, rekao je: Pričao nam je Zejd ibn Ebi ez-Zerka, od Džafera, od Jezida ibn el-Esamma, od Ebu Hurejre, [da je Vjerovjesnik, neka mu Allah podari blagoslov i mir, rekao:"},{"stranica":31,"ar_tekst":"إِنَّكُمْ تَسْأَلُونَ بَعْدِي عَنْ كُلِّ شَيْءٍ، حَتَّى يَقُولُ الْقَائِلُ: هَذَا اللَّهُ خَلَقَ كُلَّ شَيْءٍ فمن ذا خلقه!] .","bs_tekst":"„Vi ćete poslije mene pitati o svemu, sve dok neko ne kaže: ‘Ovaj Allah stvorio je sve, pa ko je onda Njega stvorio?’“"},{"stranica":31,"ar_tekst":"حدثنى على، حَدَّثَنَا زَيْدٌ، عَنْ جَعْفَرٍ، قَالَ: قَالَ يَزِيدُ بْنُ الأَصَمِّ:\nحَدَّثَنِي نَجَبَةُ بْنُ صَبِيغٍ، قَالَ: كُنْتُ عِنْدَ أَبِي هُرَيْرَةَ فَسَأَلُوهُ عَنْ هَذَا فَكَبَّرَ وَقَالَ:\n\nمَا حَدَّثَنِي خَلِيلِي بِشَيْءٍ إِلا قَدْ رَأَيْتُهُ- أَوْ أَنَا أَنْتَظِرُهُ قَالَ جَعْفَرٌ: فَبَلَغَنِي أَنَّهُ قَالَ: إِذَا سَأَلَكُمُ النَّاسُ عَنْ هذا فقولوا: الله خالق كل شيء، والله كَانَ قَبْلَ كُلِّ شَيْءٍ، وَاللَّهُ كَائِنٌ بَعْدَ كُلِّ شَيْءٍ.","bs_tekst":"Pričao mi je Ali: pričao nam je Zejd, od Džafera, koji je rekao: Jezid ibn el-Esamm rekao je: pričao mi je Nedžeba ibn Sabig: „Bio sam kod Ebu Hurejre pa su ga o tome pitali. On je izgovorio tekbir i rekao: ‘Nema ničega o čemu mi je pričao moj prisni prijatelj a da to već nisam vidio — ili da to ne očekujem.’“ Džafer je rekao: „Do mene je doprlo da je rekao: ‘Kada vas ljudi o tome pitaju, recite: Allah je Stvoritelj svega; Allah je bio prije svega i Allah ostaje poslije svega.’“ ⟦Napomena prevodioca: ime نَجَبَةُ بْنُ صَبِيغٍ preneseno je prema zapisu ovog izvora; njegovo čitanje nije ovdje nezavisno potvrđeno.⟧"},{"stranica":31,"ar_tekst":"فَإِذَا كَانَ مَعْلُومًا أَنَّ خَالِقَ الأَشْيَاءِ وَبَارِئَهَا كَانَ وَلا شَيْءَ غَيْرَهُ، وَأَنَّهُ أَحْدَثَ الأَشْيَاءَ فَدَبَّرَهَا، وَأَنَّهُ قَدْ خَلَقَ صُنُوفًا مِنْ خَلْقِهِ قَبْلَ خَلْقِ الأَزْمِنَةِ وَالأَوْقَاتِ، وَقَبْلَ خَلْقِ الشَّمْسِ وَالْقَمَرِ اللَّذَيْنِ يُجْرِيهِمَا فِي أَفْلاكِهِمَا، وَبِهِمَا عُرِفَتِ الأَوْقَاتِ وَالسَّاعَاتِ، وَأُرِّخَتِ التَّأْرِيخَاتِ، وَفُصِلَ بين الليل والنهار، فلنقل: فيم ذَلِكَ الْخَلْقُ الَّذِي خُلِقَ قَبْلَ ذَلِكَ؟ وَمَا كان اوله؟","bs_tekst":"Budući da je poznato da je Stvoritelj i Tvorac svega postojao kada nije bilo ničega osim Njega, da je On stvari doveo u postojanje i njima upravljao, te da je neke vrste Svojih stvorenja stvorio prije stvaranja vremena i vremenskih razdoblja, prije stvaranja Sunca i Mjeseca, koje pokreće njihovim putanjama i pomoću kojih su se upoznavali vremenski odsječci i sati, određivali datumi i razlikovali noć i dan, govorimo sada o tome: šta je to stvoreno prije toga i šta je od toga bilo prvo?"},{"stranica":32,"ar_tekst":"القول في ابتداء الخلق ما كان أوله","bs_tekst":"Rasprava o početku stvaranja: šta je prvo stvoreno?"},{"stranica":32,"ar_tekst":"صح الخبر عن رسول الله ص بِمَا حَدَّثَنِي بِهِ يُونُسُ بْنُ عَبْدِ الأَعْلَى، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: حَدَّثَنِي مُعَاوِيَةُ بْنُ صَالِحٍ- وحدثني عُبَيْدُ بْنُ آدَمَ بْنِ أَبِي إِيَاسٍ الْعَسْقَلانِيُّ، قَالَ: حَدَّثَنَا أَبِي، قَالَ:\nحَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ مُعَاوِيَةَ بْنِ صَالِحٍ- عَنْ أَيُّوبَ بْنِ زِيَادٍ، قَالَ:\n\nحَدَّثَنِي عُبَادَةُ بْنُ الْوَلِيدِ بْنِ عُبَادَةَ بْنِ الصَّامِتِ، قَالَ: أَخْبَرَنِي أَبِي، قَالَ:\n\nقَالَ أَبِي عُبَادَةُ بْنُ الصَّامِتِ: [يَا بُنَيَّ سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ:\n\nإِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ الْقَلَمُ فَقَالَ لَهُ: اكْتُبْ، فَجَرَى فِي تِلْكَ السَّاعَةِ بِمَا هُوَ كَائِنٌ] .","bs_tekst":"Vjerodostojno je prenesena vijest od Allahovog Poslanika, sallallahu alejhi ve sellem, u onome što mi je pričao Junus ibn Abdula‘la: rekao je: obavijestio nas je Ibn Vehb: rekao je: pričao mi je Muavija ibn Salih — a pričao mi je i Ubejd ibn Adem ibn Ebu Ijas el-Askalani: rekao je: pričao nam je moj otac: rekao je: pričao nam je Lejs ibn Sa‘d, od Muavije ibn Saliha — od Ejjuba ibn Zijada, koji je rekao: pričao mi je Ubada ibn el-Velid ibn Ubada ibn es-Samit: rekao je: obavijestio me moj otac: moj otac Ubada ibn es-Samit rekao je: „Sine moj, čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže: ‘Prvo što je Allah stvorio bilo je pero. Rekao mu je: Piši! I ono je u tom času ispisalo ono što će biti.’“"},{"stranica":32,"ar_tekst":"حَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدِ بْنِ حَبِيبٍ، قَالَ: حَدَّثَنَا عَلِيُّ بْنُ الْحَسَنِ بْنِ شَقِيقٍ، قَالَ: أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ، قَالَ: أَخْبَرَنَا رَبَاحُ بْنُ زَيْدٍ، عَنْ عُمَرَ بْنِ حَبِيبٍ، عَنِ الْقَاسِمِ بْنِ أَبِي بَزَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ [ابْنِ عَبَّاسٍ أَنَّهُ كَانَ يُحَدِّثُ أَنَّ رَسُولَ اللَّهِ ص قَالَ: إِنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ الْقَلَمَ، وَأَمَرَهُ أَنْ يَكْتُبَ كُلَّ شَيْءٍ] .","bs_tekst":"Pričao mi je Ahmed ibn Muhammed ibn Habib: rekao je: pričao nam je Ali ibn el-Hasen ibn Šekik: rekao je: obavijestio nas je Abdullah ibn el-Mubarek: rekao je: obavijestio nas je Rebah ibn Zejd, od Omera ibn Habiba, od Kasima ibn Ebu Bezze, od Seida ibn Džubejra, od Ibn Abbasa, koji je kazivao da je Allahov Poslanik, sallallahu alejhi ve sellem, rekao: „Prvo što je Allah stvorio bilo je pero i naredio mu je da zapiše sve.“"},{"stranica":32,"ar_tekst":"حَدَّثَنِي مُوسَى بْنُ سَهْلٍ الرَّمْلِيُّ، حَدَّثَنَا نُعَيْمُ بْنُ حَمَّادٍ، حَدَّثَنَا ابْنُ الْمُبَارَكِ، أَخْبَرَنَا رَبَاحُ بْنُ زَيْدٍ، عَنْ عُمَرَ بْنِ حَبِيبٍ، عَنِ الْقَاسِمِ بْنِ أَبِي بَزَّةَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، عن رسول الله ص بِنَحْوِهِ.","bs_tekst":"Pričao mi je Musa ibn Sehl er-Remli: pričao nam je Nuajm ibn Hammad: pričao nam je Ibn el-Mubarek: obavijestio nas je Rebah ibn Zejd, od Omera ibn Habiba, od Kasima ibn Ebu Bezze, od Seida ibn Džubejra, od Ibn Abbasa, od Allahovog Poslanika, sallallahu alejhi ve sellem, nešto slično tome."},{"stranica":32,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ مُعَاوِيَةَ الأَنْمَاطِيُّ، حَدَّثَنَا عَبَّادُ بْنُ الْعَوَّامِ، حَدَّثَنَا عَبْدُ الْوَاحِدِ بْنُ سُلَيْمٍ، قَالَ: سَمِعْتُ عَطَاءً، قَالَ: سَأَلْتُ الْوَلِيدَ بْنَ عُبَادَةَ بْنِ الصَّامِتِ: كَيْفَ كَانَتْ وَصِيَّةُ أَبِيكَ حِينَ حَضَرَهُ الْمَوْتُ؟ قَالَ: دَعَانِي فَقَالَ:","bs_tekst":"Pričao mi je Muhammed ibn Muavija el-Enmati: pričao nam je Abbad ibn el-Avvam: pričao nam je Abdulvahid ibn Sulejm, koji je rekao: čuo sam Ataa kako kaže: „Upitao sam Velida ibn Ubadu ibn es-Samita: ‘Kakva je bila oporuka tvoga oca kada mu se približila smrt?’ Odgovorio je: ‘Pozvao me i rekao:"},{"stranica":33,"ar_tekst":"أَيْ بُنَيَّ، اتَّقِ اللَّهَ وَاعْلَمْ أَنَّكَ لَنْ تَتَّقِيَ اللَّهَ، وَلَنْ تَبْلُغَ الْعِلْمَ حَتَّى تُؤْمِنَ بِاللَّهِ وَحْدَهُ، وَالْقَدَرِ خَيْرِهِ وَشَرِّهِ، [إِنِّي سَمِعْتُ رسول الله ص يَقُولُ: إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ عَزَّ وَجَلَّ خَلَقَ الْقَلَمَ، فَقَالَ لَهُ: اكْتُبْ، قَالَ: يَا رَبِّ وَمَا أَكْتُبُ؟ قَالَ:\n\nاكْتُبِ الْقَدَرَ، قَالَ: فَجَرَى الْقَلَمُ فِي تِلْكَ السَّاعَةِ بِمَا كَانَ وَبِمَا هُوَ كَائِنٌ إِلَى الأَبَدِ] .","bs_tekst":"O sine moj, boj se Allaha i znaj da se nećeš bojati Allaha i da nećeš dosegnuti znanje dok ne budeš vjerovao samo u Allaha i u određenje, njegovo dobro i njegovo zlo. Čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže: Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero. Rekao mu je: Piši! Ono je reklo: Gospodaru moj, a šta da pišem? Rekao je: Zapiši određenje! I pero je u tom času ispisalo ono što je bilo i ono što će biti dovijeka.’“"},{"stranica":33,"ar_tekst":"وقد اختلف اهل السلف قبلنا في ذلك، فنذكر أقوالهم، ثم نتبع البيان عن ذلك إن شاء الله تعالى.","bs_tekst":"Naši prethodnici nisu bili saglasni o tome. Navest ćemo njihova mišljenja, a zatim, ako Uzvišeni Allah htjedne, izložiti objašnjenje o tome."},{"stranica":33,"ar_tekst":"فقال بعضهم في ذلك بنحو الذي روى عن رسول الله ص فيه.","bs_tekst":"Neki su o tome rekli nešto slično onome što je preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem."},{"stranica":33,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":33,"ar_tekst":"حَدَّثَنِي وَاصِلُ بْنُ عَبْدِ الأَعْلَى الأَسَدِيُّ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ مِنْ شَيْءٍ الْقَلَمُ فَقَالَ لَهُ: اكْتُبْ، فَقَالَ: وَمَا أَكْتُبُ يَا رَبِّ؟ قَالَ: اكْتُبِ الْقَدَرَ، قَالَ: فَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ مِنْ ذَلِكَ إِلَى قِيَامِ السَّاعَةِ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ فَفَتَقَ مِنْهُ السَّمَوَاتِ.","bs_tekst":"Pričao mi je Vasil ibn Abdula‘la el-Esedi: rekao je: pričao nam je Muhammed ibn Fudajl, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: „Prvo što je Allah stvorio bilo je pero. Rekao mu je: ‘Piši!’ Ono je reklo: ‘A šta da pišem, Gospodaru moj?’ Rekao je: ‘Zapiši određenje!’ I pero je ispisalo ono što će biti od tada do nastupanja Časa. Zatim je podigao vodenu paru i iz nje razdvojio nebesa.“"},{"stranica":33,"ar_tekst":"حَدَّثَنَا وَاصِلُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا وَكِيعٌ، عَنِ الأعمش، عن أبي ظبيان، عن ابن عباس نَحْوَهُ.","bs_tekst":"Pričao nam je Vasil ibn Abdula‘la: rekao je: pričao nam je Veki‘, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, nešto slično tome."},{"stranica":33,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، عَنْ شُعْبَةَ، عَنْ سُلَيْمَانَ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أَوَّلُ مَا خَلَقَ اللَّهُ مِنْ شَيْءٍ الْقَلَمُ، فَجَرَى بِمَا هُوَ كَائِنٌ.","bs_tekst":"Pričao nam je Muhammed ibn el-Musenna: rekao je: pričao nam je Ibn Ebu Adijj, od Šu‘be, od Sulejmana, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: „Prvo što je Allah stvorio bilo je pero i ono je ispisalo ono što će biti.“"},{"stranica":33,"ar_tekst":"حَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، أَخْبَرَنَا إِسْحَاقُ، عَنْ شَرِيكٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ- أَوْ مُجَاهِدٌ-، عَنِ ابْنِ عباس بنحوه","bs_tekst":"Pričao nam je Temim ibn el-Muntesir: obavijestio nas je Ishak, od Šerika, od A‘meša, od Ebu Zabjana — ili Mudžahida — od Ibn Abbasa, nešto slično tome."},{"stranica":34,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، حَدَّثَنَا ابْنُ ثَوْرٍ، قَالَ: حَدَّثَنَا مَعْمَرٌ، حَدَّثَنَا الأَعْمَشُ أَنَّ ابن عباس قال: إن أول شيء خلق الْقَلَمُ.","bs_tekst":"Pričao nam je Muhammed ibn Abdula‘la: pričao nam je Ibn Sevr, koji je rekao: pričao nam je Ma‘mer: pričao nam je A‘meš da je Ibn Abbas rekao: „Prvo što je stvoreno bilo je pero.“"},{"stranica":34,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، حَدَّثَنَا جَرِيرٌ، عَنْ عطاء، عن ابى الضحا مُسْلِمِ بْنِ صُبَيْحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ أَوَّلَ شَيْءٍ خَلَقَ رَبِّي عَزَّ وَجَلَّ القلم، فقال له: اكتب، فكتب ما هو كَائِنٌ إِلَى أَنْ تَقُومَ السَّاعَةُ.","bs_tekst":"Pričao nam je Ibn Humejd: pričao nam je Džerir, od Ataa, od Ebu Duhaa Muslima ibn Subejha, od Ibn Abbasa, koji je rekao: „Prvo što je moj Gospodar, Silan i Uzvišen, stvorio bilo je pero. Rekao mu je: ‘Piši!’ I ono je zapisalo ono što će biti do nastupanja Časa.“"},{"stranica":34,"ar_tekst":"وَقَالَ آخَرُونَ: بَلْ أَوَّلُ شَيْءٍ خَلَقَ اللَّهُ عَزَّ وَجَلَّ مِنْ خَلْقِهِ النُّورُ وَالظُّلْمَةُ.","bs_tekst":"Drugi su rekli: „Naprotiv, prvo što je Allah, Silan i Uzvišen, stvorio od Svojih stvorenja bili su svjetlost i tama.“"},{"stranica":34,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذلك:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":34,"ar_tekst":"حدثنا ابن حميد، قال: حدثنا سلمة بْنُ الْفَضْلِ، قَالَ: قَالَ ابْنُ إِسْحَاقَ:\nكَانَ أَوَّلَ مَا خَلَقَ اللَّهُ عَزَّ وَجَلَّ النُّورُ وَالظُّلْمَةُ، ثُمَّ مَيَّزَ بَيْنَهُمَا، فَجَعَلَ الظُّلْمَةَ لَيْلا أَسْوَدَ مُظْلِمًا، وَجَعَلَ النُّورَ نَهَارًا مُضِيئًا مُبْصِرًا.","bs_tekst":"Pričao nam je Ibn Humejd: rekao je: pričao nam je Selema ibn el-Fadl, koji je rekao: Ibn Ishak rekao je: „Prvo što je Allah, Silan i Uzvišen, stvorio bili su svjetlost i tama. Zatim ih je razdvojio, pa je tamu učinio crnom, mračnom noći, a svjetlost sjajnim danom u kojem se vidi.“"},{"stranica":34,"ar_tekst":"قال أبو جعفر: وأولى القولين في ذلك عِنْدِي بِالصَّوَابِ قَوْلُ ابْنِ عَبَّاسٍ، لِلْخَبَرِ الَّذِي ذكرت عن [رسول الله ص قبل، أَنَّهُ قَالَ:\n\nأَوَّلُ شَيْءٍ خَلَقَ اللَّهُ الْقَلَمَ] .","bs_tekst":"Ebu Džafer kaže: Smatram da je od ova dva mišljenja ispravnije mišljenje Ibn Abbasa, zbog predaje koju sam ranije naveo od Allahovog Poslanika, sallallahu alejhi ve sellem, da je rekao: „Prvo što je Allah stvorio bilo je pero.“"},{"stranica":34,"ar_tekst":"فَإِنْ قَالَ لَنَا قَائِلٌ: فَإِنَّكَ قُلْتَ: أَوْلَى الْقَوْلَيْنِ- اللَّذَيْنِ أَحَدُهُمَا أَنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ مِنْ خَلْقِهِ الْقَلَمَ، وَالآخَرُ أَنَّهُ النُّورُ وَالظُّلْمَةُ- قَوْلُ مَنْ قَالَ: إِنَّ أَوَّلَ شَيْءٍ خَلَقَ اللَّهُ مِنْ خَلْقِهِ الْقَلَمَ، فَمَا وَجْهُ الرِّوَايَةِ عَنِ ابْنِ عَبَّاسٍ الَّتِي حَدَّثَكُمُوهَا ابْنُ بَشَّارٍ قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ، حَدَّثَنَا سُفْيَانُ، عَنْ أَبِي هَاشِمٍ، عَنْ مُجَاهِدٍ، قَالَ: قُلْتُ لابْنِ عَبَّاسٍ: إِنَّ نَاسًا يُكَذِّبُونَ بِالْقَدَرِ، فَقَالَ: إِنَّهُمْ يُكَذِّبُونَ بِكِتَابِ اللَّهِ، لآخُذَنَّ بِشَعْرِ أَحَدِهِمْ فَلأَنْفُضَنَّ بِهِ، إِنَّ اللَّهَ تَعَالَى ذَكَرَهُ كَانَ عَلَى عَرْشِهِ قَبْلَ أَنْ يَخْلُقَ شَيْئًا، فَكَانَ أَوَّلُ مَا خَلَقَ اللَّهُ الْقَلَمَ، فَجَرَى بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ،","bs_tekst":"Ako nam neko kaže: „Rekao si da je od dva mišljenja — jednog da je prvo Allahovo stvorenje bilo pero, a drugog da su to bili svjetlost i tama — ispravnije mišljenje onoga koji kaže da je prvo Allahovo stvorenje bilo pero. Kakvo je onda značenje predaje od Ibn Abbasa koju vam je pričao Ibn Beššar: pričao nam je Abdurrahman: pričao nam je Sufjan, od Ebu Hašima, od Mudžahida, koji je rekao: ‘Rekao sam Ibn Abbasu: Neki ljudi poriču određenje. Odgovorio je: Oni poriču Allahovu Knjigu! Uhvatit ću jednoga od njih za kosu i dobro ga protresti! Allah, Uzvišen je spomen Njegov, bio je na Svome Aršu prije nego što je išta stvorio. Prvo što je Allah stvorio bilo je pero i ono je ispisalo ono što će biti do Kijametskog dana,"},{"stranica":35,"ar_tekst":"وَإِنَّمَا يَجْرِي النَّاسُ عَلَى أَمْرٍ قَدْ فُرِغَ مِنْهُ؟.","bs_tekst":"a ljudi se samo kreću u okviru onoga što je već dovršeno?’"},{"stranica":35,"ar_tekst":"وعن ابن إسحاق، التي حدثكموها ابن حميد، قال: حدثنا سلمة، عن ابن إسحاق، قال: يقول الله عز وجل: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ وَكانَ عَرْشُهُ عَلَى الْماءِ» ، فكان كما وصف نفسه عز وجل، إذ ليس إلا الماء عليه العرش، وعلى العرش ذو الجلال والإكرام، فكان أول ما خلق الله النور والظلمة؟","bs_tekst":"A kakvo je značenje predaje od Ibn Ishaka koju vam je pričao Ibn Humejd: rekao je: pričao nam je Selema, od Ibn Ishaka, koji je rekao: ‘Allah, Silan i Uzvišen, kaže: On je Taj koji je nebesa i Zemlju stvorio u šest dana, a Njegov Arš bio je na vodi. Bio je onako kako je, Silan i Uzvišen, Sebe opisao: nije bilo ničega osim vode nad kojom je bio Arš, a na Aršu Onaj kojem pripadaju veličanstvo i plemenitost; prvo što je Allah stvorio bili su svjetlost i tama?’“ ⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta. Preostale riječi pripadaju navedenoj predaji.⟧"},{"stranica":35,"ar_tekst":"قيل: أما قول ابن عباس: إن الله تبارك وتعالى كان عرشه على الماء قبل أن يخلق شيئا، فكان أول ما خلق الله القلم- إن كان صحيحا عنه أنه قاله- فهو خبر منه أن الله خلق القلم بعد خلقه عرشه، وقد روى عن أبي هاشم هذا الخبر شعبة، ولم يقل فيه ما قال سفيان، من أن الله عز وجل كان على عرشه، فكان أول ما خلق القلم، بل روى ذلك كالذي رواه سائر من ذكرنا من الرواة عن ابن عباس أنه قال: أول ما خلق الله عز وجل القلم.","bs_tekst":"Odgovara se: Što se tiče Ibn Abbasovih riječi da je Arš Allaha, Blagoslovljenog i Uzvišenog, bio na vodi prije nego što je išta stvorio i da je prvo što je Allah stvorio bilo pero — ako je vjerodostojno da je to rekao — time on izvještava da je Allah stvorio pero nakon što je stvorio Svoj Arš. Ovu predaju od Ebu Hašima prenio je i Šu‘ba, ali u njoj nije naveo ono što je naveo Sufjan: da je Allah, Silan i Uzvišen, bio na Svome Aršu, a da je prvo što je stvorio bilo pero. Naprotiv, prenio ju je onako kako su je prenijeli ostali prenosioci koje smo spomenuli od Ibn Abbasa, da je rekao: „Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero.“"},{"stranica":35,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":35,"ar_tekst":"حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنِي عَبْدُ الصَّمَدِ، قَالَ: حَدَّثَنَا شُعْبَةُ، قَالَ: حَدَّثَنَا أَبُو هَاشِمٍ، سَمِعَ مُجَاهِدًا قَالَ: سَمِعْتُ عَبْدَ اللَّهِ- لا يَدْرِي ابْنَ عُمَرَ أَوِ ابْنَ عَبَّاسٍ- قَالَ: إِنَّ أَوَّلَ مَا خَلَقَ اللَّهُ الْقَلَمُ فَقَالَ لَهُ: اجْرِ، فَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ، وَإِنَّمَا يَعْمَلُ النَّاسُ الْيَوْمَ فِيمَا قَدْ فُرِغَ مِنْهُ.","bs_tekst":"Pričao nam je Ibn el-Musenna: rekao je: pričao mi je Abdussamed: rekao je: pričao nam je Šu‘ba: rekao je: pričao nam je Ebu Hašim, koji je čuo Mudžahida kako kaže: čuo sam Abdullaha — ne zna da li Ibn Omera ili Ibn Abbasa — kako kaže: „Prvo što je Allah stvorio bilo je pero. Rekao mu je: ‘Teci!’ I pero je ispisalo ono što će biti. Ljudi danas postupaju samo u okviru onoga što je već dovršeno.“"},{"stranica":35,"ar_tekst":"وَكَذَلِكَ قَوْلُ ابْنِ إِسْحَاقَ الَّذِي ذَكَرْنَاهُ عَنْهُ مَعْنَاهُ أَنَّ اللَّهَ خَلَقَ النُّورَ وَالظُّلْمَةَ بَعْدَ خَلْقِهِ عَرْشَهُ، وَالْمَاءَ الَّذِي عَلَيْهِ عَرْشُهُ وَقَوْلُ رَسُولِ اللَّهِ ص الَّذِي رَوَيْنَاهُ عَنْهُ أَوْلَى قَوْلٍ فِي ذَلِكَ بِالصَّوَابِ، لأَنَّهُ كَانَ أَعْلَمَ قَائِلٍ فِي ذَلِكَ قولا بحقيقته وصحته، [وقد روينا عنه ع أَنَّهُ قَالَ: أَوَّلُ شَيْءٍ خَلَقَهُ اللَّهُ عَزَّ وَجَلَّ الْقَلَمُ] مِنْ غَيْرِ اسْتِثْنَاءٍ مِنْهُ شَيْئًا مِنَ الأَشْيَاءِ أَنَهُّ تَقَدَّمَ خَلْقَ اللَّهِ إِيَّاهُ خلق القلم، بل عم [بقوله ص: ان أول شيء خلقه الله القلم،] كل","bs_tekst":"Isto tako, riječi Ibn Ishaka koje smo od njega naveli znače da je Allah stvorio svjetlost i tamu nakon što je stvorio Svoj Arš i vodu na kojoj je Njegov Arš. Riječi Allahovog Poslanika, sallallahu alejhi ve sellem, koje smo od njega prenijeli, najpreče je smatrati ispravnim u ovom pitanju, jer je od svih koji su o tome govorili on najbolje poznavao njegovu stvarnost i tačnost. Od njega, alejhis-selam, prenijeli smo da je rekao: „Prvo što je Allah, Silan i Uzvišen, stvorio bilo je pero“, ne izdvajajući ništa od stvari čije bi stvaranje prethodilo Allahovom stvaranju pera. Naprotiv, svojim riječima, sallallahu alejhi ve sellem: „Prvo što je Allah stvorio bilo je pero“, obuhvatio je svaku"},{"stranica":36,"ar_tekst":"شَيْءٍ، وَأَنَّ الْقَلَمَ مَخْلُوقٌ قَبْلَهُ مِنْ غَيْرِ اسْتِثْنَائِهِ مِنْ ذَلِكَ عَرْشًا وَلا مَاءً وَلا شَيْئًا غَيْرَ ذَلِكَ.","bs_tekst":"stvar i kazao da je pero stvoreno prije nje, ne izdvajajući od toga ni Arš, ni vodu, niti bilo šta drugo."},{"stranica":36,"ar_tekst":"فالرواية التي رويناها عن ابى ظبيان وابى الضحا، عن ابن عباس، أولى بالصحة عن ابن عباس من خبر مجاهد عنه الذي رواه عنه أبو هاشم، إذ كان أبو هاشم قد اختلف في رواية ذلك عنه شعبة وسفيان، على ما قد ذكرت من اختلافهما فيها.","bs_tekst":"Zato je predaja koju smo prenijeli od Ebu Zabjana i Ebu Duhaa, od Ibn Abbasa, preča da bude vjerodostojna od Ibn Abbasa nego Mudžahidova predaja od njega koju prenosi Ebu Hašim, jer su Šu‘ba i Sufjan različito prenijeli ovu predaju od Ebu Hašima, kako sam već naveo opisujući njihovo razilaženje u njoj."},{"stranica":36,"ar_tekst":"وأما ابن إسحاق فإنه لم يسند قوله الذي قاله في ذلك إلى أحد، وذلك من الأمور التي لا يدرك علمها إلا بخبر من الله عز وجل، أو خبر من رسول الله ص، وقد ذكرت الرواية فيه عن رسول الله ص","bs_tekst":"Što se tiče Ibn Ishaka, on svoje mišljenje o tome nije lancem prenosilaca pripisao nikome. To pripada stvarima čije se poznavanje može steći jedino izvješćem od Allaha, Silnog i Uzvišenog, ili izvješćem od Allahovog Poslanika, sallallahu alejhi ve sellem. Već sam naveo predaju o tome od Allahovog Poslanika, sallallahu alejhi ve sellem."},{"stranica":37,"ar_tekst":"القول في الذي ثنى خلق القلم","bs_tekst":"Rasprava o onome što je stvoreno poslije pera"},{"stranica":37,"ar_tekst":"ثم إن الله جل جلاله خلق بعد القلم- وبعد أن أمره فكتب ما هو كائن إلى قيام الساعة- سحابا رقيقا، وهو الغمام الذي ذكره جل وعز ذكره في محكم كتابه فقال: «هَلْ يَنْظُرُونَ إِلَّا أَنْ يَأْتِيَهُمُ اللَّهُ فِي ظُلَلٍ مِنَ الْغَمامِ» ، وذلك قبل أن يخلق عرشه، وبذلك ورد الخبر عن رسول الله ص.","bs_tekst":"Zatim je Allah, Uzvišeno je Njegovo veličanstvo, nakon pera — i nakon što mu je naredio pa je ono zapisalo ono što će biti do nastupanja Časa — stvorio tanak oblak. To je oblak koji On, Silan i Uzvišen je spomen Njegov, spominje u Svojoj jasnoj Knjizi riječima: „Čekaju li oni išta drugo osim da im Allah dođe u sjenama oblaka?“ To je bilo prije nego što je stvorio Svoj Arš. O tome je došla predaja od Allahovog Poslanika, sallallahu alejhi ve sellem. ⟦Prijevod kur’anskog navoda: El-Bekara, 2:210, dio ajeta.⟧"},{"stranica":37,"ar_tekst":"حَدَّثَنَا ابْنُ وَكِيعٍ وَمُحَمَّدُ بْنُ هَارُونَ الْقَطَّانُ، قَالا: حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، عَنْ حَمَّادِ بْنِ سَلَمَةَ، عَنْ يَعْلَى بْنِ عَطَاءٍ، [عَنْ وَكِيعِ بْنِ حُدُسٍ، عَنْ عَمِّهِ أَبِي رَزِينٍ، قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ كَانَ رَبُّنَا قَبْلَ أَنْ يَخْلُقَ خَلْقَهُ؟ قَالَ:\nكَانَ في عماء، ما تحته هواء، وما فوقه هَوَاءٌ، ثُمَّ خَلَقَ عَرْشَهُ عَلَى الْمَاءِ]","bs_tekst":"Pričali su nam Ibn Veki‘ i Muhammed ibn Harun el-Kattan; obojica su rekli: pričao nam je Jezid ibn Harun, od Hammada ibn Seleme, od Ja‘le ibn Ataa, od Veki‘a ibn Hudusa, od njegovog amidže Ebu Rezina, koji je rekao: „Upitao sam: ‘Allahov Poslaniče, gdje je bio naš Gospodar prije nego što je stvorio Svoja stvorenja?’ Odgovorio je: ‘Bio je u oblaku; ispod njega nije bilo zraka, niti je iznad njega bilo zraka. Zatim je stvorio Svoj Arš na vodi.’“ ⟦Napomena prevodioca: izraz عماء ovdje je preveden kao „oblak“. U izrazu ما تحته هواء وما فوقه هواء riječ ما može se razumjeti kao negacija („nije bilo“) ili odnosna riječ („ono što je“). Ovdje je navedeno prvo čitanje; naredna predaja na stranici 38 izričito govori o zraku iznad i ispod. Razlika između dviju verzija nije uklonjena.⟧"},{"stranica":37,"ar_tekst":"حَدَّثَنِي الْمُثَنَّى بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا الْحَجَّاجُ، قَالَ: حَدَّثَنَا حَمَّادٌ، عَنْ يَعْلَى بْنِ عَطَاءٍ، عَنْ وَكِيعِ بْنِ حُدُسٍ، عَنْ عَمِّهِ أَبِي رَزِينٍ العقيلي، قال:","bs_tekst":"Pričao mi je Musenna ibn Ibrahim: rekao je: pričao nam je Hadždžadž: rekao je: pričao nam je Hammad, od Ja‘le ibn Ataa, od Veki‘a ibn Hudusa, od njegovog amidže Ebu Rezina el-Ukajlija, koji je rekao:"},{"stranica":38,"ar_tekst":"[قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ كَانَ رَبُّنَا عَزَّ وَجَلَّ قَبْلَ أَنْ يَخْلُقَ السَّمَوَاتِ وَالأَرْضَ؟\n\nقَالَ: فِي عَمَاءٍ، فَوْقَهُ هَوَاءٌ، وَتَحْتَهُ هَوَاءٌ، ثُمَّ خَلَقَ عَرْشَهُ عَلَى الْمَاءِ] .","bs_tekst":"„Upitao sam: ‘Allahov Poslaniče, gdje je bio naš Gospodar, Silan i Uzvišen, prije nego što je stvorio nebesa i Zemlju?’ Odgovorio je: ‘U oblaku; iznad njega bio je zrak, a ispod njega bio je zrak. Zatim je stvorio Svoj Arš na vodi.’“"},{"stranica":38,"ar_tekst":"حَدَّثَنَا خَلادُ بْنُ أَسْلَمَ، حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ: حَدَّثَنَا الْمَسْعُودِيُّ، أَخْبَرَنَا جَامِعُ بْنُ شَدَّادٍ، عَنْ صَفْوَانَ بْنِ مُحْرِزٍ، [عَنِ ابْنِ حُصَيْنٍ- وَكَانَ من اصحاب رسول الله ص- قال: اتى قوم رسول الله ص فَدَخَلُوا عَلَيْهِ، فَجَعَلَ يُبَشِّرُهُمْ وَيَقُولُونَ: أَعْطِنَا، حَتَّى ساء ذلك رسول الله ص، ثُمَّ خَرَجُوا مِنْ عِنْدِهِ وَجَاءَ قَوْمٌ آخَرُونَ، فَدَخَلُوا عَلَيْهِ فَقَالُوا: جِئْنَا نُسَلِّمُ عَلَى رَسُولِ الله ص، وَنَتَفَقَّهُ فِي الدِّينِ، وَنَسْأَلُهُ عَنْ بَدْءِ هَذَا الأَمْرِ، قَالَ: فَاقْبَلُوا الْبُشْرَى إِذْ لَمْ يَقْبَلْهَا أُولَئِكَ الَّذِينَ خَرَجُوا، قَالُوا: قَبِلْنَا، فَقَالَ رَسُولُ الله ص: كان الله لا شَيْءَ غَيْرُهُ، وَكَانَ عَرْشُهُ عَلَى الْمَاءِ وَكَتَبَ فِي الذِّكْرِ قَبْلَ كُلِّ شَيْءٍ، ثُمَّ خَلَقَ سَبْعَ سَمَوَاتٍ] ثُمَّ أَتَانِي آتٍ فَقَالَ: تِلْكَ نَاقَتُكَ قَدْ ذَهَبَتْ، فَخَرَجْتُ يَنْقَطِعُ دُونَهَا السَّرَابُ، وَلَوَدِدْتُ أَنِّي تَرَكْتُهَا.","bs_tekst":"Pričao nam je Hallad ibn Eslem: pričao nam je Nadr ibn Šumejl: rekao je: pričao nam je Mesudi: obavijestio nas je Džami‘ ibn Šeddad, od Safvana ibn Muhriza, od Ibn Husajna — a bio je jedan od ashaba Allahovog Poslanika, sallallahu alejhi ve sellem — koji je rekao: „Neki ljudi došli su Allahovom Poslaniku, sallallahu alejhi ve sellem, i ušli kod njega. On ih je obradovao radosnim vijestima, a oni su govorili: ‘Daj nam!’, sve dok to nije oneraspoložilo Allahovog Poslanika, sallallahu alejhi ve sellem. Zatim su izašli od njega, a došli su drugi ljudi i ušli kod njega. Rekli su: ‘Došli smo da poselamimo Allahovog Poslanika, sallallahu alejhi ve sellem, da se podučimo vjeri i da ga pitamo o početku svega ovoga.’ Rekao je: ‘Prihvatite radosnu vijest, jer je nisu prihvatili oni koji su izašli.’ Odgovorili su: ‘Prihvatili smo.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Bio je Allah i nije bilo ničega osim Njega; Njegov Arš bio je na vodi. Prije svega zapisao je u Zapis, a zatim je stvorio sedam nebesa.’ Potom mi je došao neko i rekao: ‘Eno, tvoja deva je otišla!’ Izašao sam, a prije nego što bih do nje stigao pružala se fatamorgana. Volio bih da sam je ostavio.“ ⟦Napomena prevodioca: u ovom lancu stoji samo „Ibn Husajn“; puno ime nije dopunjavano. Izraz ينقطع دونها السراب opisuje fatamorganu na putu do deve; prostorna slika nije sasvim jasna.⟧"},{"stranica":38,"ar_tekst":"حَدَّثَنِي أَبُو كُرَيْبٍ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ عَنْ جَامِعِ ابن شَدَّادٍ، عَنْ صَفْوَانَ بْنِ مُحْرِزٍ، عَنْ عِمْرَانَ بن الحصين، قال: [قال رسول الله ص: اقْبَلُوا الْبُشْرَى يَا بَنِي تَمِيمٍ، فَقَالُوا: قَدْ بَشَّرْتَنَا فَأَعْطِنَا فَقَالَ:\nاقْبَلُوا الْبُشْرَى يَا أَهْلَ الْيَمَنِ، فَقَالُوا: قَدْ قَبِلْنَا، فَأَخْبِرْنَا عَنْ هَذَا الأمر كيف كان؟ فقال رسول الله ص: كَانَ اللَّهُ عَزَّ وَجَلَّ عَلَى الْعَرْشِ، وَكَانَ قَبْلَ كُلِّ شَيْءٍ، وَكَتَبَ فِي اللَّوْحِ كُلَّ شَيْءٍ يَكُونُ] قَالَ: فَأَتَانِي آتٍ فَقَالَ:\n\nيَا عِمْرَانُ، هَذِهِ نَاقَتُكَ قَدْ حَلَّتْ عِقَالَهَا، فَقُمْتُ، فَإِذَا السَّرَابُ يَنْقَطِعُ بَيْنِي وَبَيْنَهَا، فَلا أَدْرِي مَا كَانَ بَعْدَ ذَلِكَ","bs_tekst":"Pričao mi je Ebu Kurejb: pričao nam je Ebu Muavija, od A‘meša, od Džami‘a ibn Šeddada, od Safvana ibn Muhriza, od Imrana ibn el-Husajna, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Prihvatite radosnu vijest, o Benu Temim!’ Odgovorili su: ‘Već si nas obradovao, pa nam daj!’ Zatim je rekao: ‘Prihvatite radosnu vijest, stanovnici Jemena!’ Odgovorili su: ‘Prihvatili smo, pa nas obavijesti kako je ovo započelo.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Allah, Silan i Uzvišen, bio je na Aršu i bio je prije svega. U Ploču je zapisao sve što će biti.’ Tada mi je došao neko i rekao: ‘Imrane, ova tvoja deva oslobodila se svoje spone!’ Ustao sam, a između mene i nje pružala se fatamorgana, pa ne znam šta je bilo poslije toga.“"},{"stranica":39,"ar_tekst":"ثُمَّ اخْتُلِفَ فِي الَّذِي خَلَقَ تَعَالَى ذِكْرُهُ بَعْدَ الْعَمَاءِ، فَقَالَ بَعْضُهُمْ: خَلَقَ بَعْدَ ذَلِكَ عَرْشَهُ.","bs_tekst":"Zatim su se razišli o tome šta je On, Uzvišen je spomen Njegov, stvorio poslije oblaka. Neki su rekli: „Nakon toga stvorio je Svoj Arš.“"},{"stranica":39,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":39,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ سِنَانٍ، حَدَّثَنَا أَبُو سَلَمَةَ، قَالَ: حَدَّثَنَا حيان ابن عُبَيْدِ اللَّهِ، عَنِ الضَّحَّاكِ بْنِ مُزَاحِمٍ، قَالَ، قَالَ ابْنُ عَبَّاسٍ: إِنَّ اللَّهَ عَزَّ وَجَلَّ خَلَقَ الْعَرْشَ أَوَّلَ مَا خَلَقَ، فَاسْتَوَى عَلَيْهِ.","bs_tekst":"Pričao mi je Muhammed ibn Sinan: pričao nam je Ebu Selema: rekao je: pričao nam je Hajjan ibn Ubejdullah, od Dahhaka ibn Muzahima, koji je rekao: Ibn Abbas rekao je: „Allah, Silan i Uzvišen, najprije je stvorio Arš, pa se nad njim uzvisio.“ ⟦Napomena prevodioca: استوى عليه ovdje je prevedeno „nad njim se uzvisio“; ovo je tekst predaje, a ne dodano objašnjenje načina ili kakvoće.⟧"},{"stranica":39,"ar_tekst":"وَقَالَ آخَرُونَ: خَلَقَ اللَّهُ عَزَّ وَجَلَّ الْمَاءَ قَبْلَ الْعَرْشِ، ثُمَّ خَلَقَ عَرْشَهُ فَوَضَعَهُ عَلَى الْمَاءِ.","bs_tekst":"Drugi su rekli: „Allah, Silan i Uzvišen, stvorio je vodu prije Arša, zatim je stvorio Svoj Arš i postavio ga na vodu.“"},{"stranica":39,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":39,"ar_tekst":"حَدَّثَنَا مُوسَى بن هارون الهمداني، قال: حدثنا عمرو بن حَمَّادٍ، قَالَ: حَدَّثَنَا أَسْبَاطُ بْنُ نَصْرٍ، عَنِ السدي في خبر ذكره، عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب رسول الله ص- قَالُوا: إِنَّ اللَّهَ عَزَّ وَجَلَّ كَانَ عَرْشُهُ عَلَى الْمَاءِ، وَلَمْ يَخْلُقْ شَيْئًا غَيْرَ مَا خَلَقَ قَبْلَ الْمَاءِ.","bs_tekst":"Pričao nam je Musa ibn Harun el-Hemdani: rekao je: pričao nam je Amr ibn Hammad: rekao je: pričao nam je Esbat ibn Nasr, od Suddija, u izvješću koje je naveo, od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, koji su rekli: „Arš Allaha, Silnog i Uzvišenog, bio je na vodi, a On nije stvorio ništa drugo osim onoga što je stvorio prije vode.“"},{"stranica":39,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ سَهْلِ بن عسكر، قال: حدثنا إسماعيل بن عبد الكريم، قال: حدثني عبد الصمد بن معقل، قال: سمعت وهب بن منبه يقول: إن العرش كان قبل
