َا.\u003c/p>\u003cp data-pair=\"45.2\" id=\"ar-odlomak-45-2\">فأما الخبر عنه بتحقيق ما قال القائلون: كان ابتداء الخلق يوم الأحد، فما \u003cspan class=\"isnad\">حَدَّثَنَا بِهِ هَنَّادُ بن السري، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عَنِ ابْنِ عَبَّاسٍ- قَالَ هَنَّادٌ: وَقَرَأْتُ سَائِرَ الحديث- \u003c/span>ان اليهود أتت النبي ص فَسَأَلَتْهُ عَنْ خَلْقِ السَّمَوَاتِ وَالأَرْضِ فَقَالَ: خَلَقَ اللَّهُ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ.\u003c/p>\u003cp data-pair=\"45.3\" id=\"ar-odlomak-45-3\">وأما الخبر عنه بتحقيق ما قاله القائلون من أن ابتداء الخلق كان يوم السبت، فما \u003cspan class=\"isnad\">حَدَّثَنِي القاسم بن بشر بن معروف والحسين بن علي الصدائي، قالا:\n\nحدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مَوْلَى أُمِّ سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: \u003c/span>[أخذ رسول الله ص بِيَدِي، فَقَالَ: خَلَقَ اللَّهُ التُّرْبَةَ يَوْمَ السَّبْتِ، وَخَلَقَ الْجِبَالَ يَوْمَ الأَحَدِ] .\u003c/p>\u003cp data-pair=\"45.4\" id=\"ar-odlomak-45-4\">وأولى القولين في ذلك عندي بالصواب قول من قال: اليوم الذي ابتدأ الله تعالى ذكره فيه خلق السموات والأرض يوم الأحد، لإجماع السلف من أهل العلم على ذلك.\u003c/p>\u003cp data-pair=\"45.5\" id=\"ar-odlomak-45-5\">فأما ما قال ابن إسحاق في ذلك، فإنه إنما استدل- بزعمه- على أن ذلك كذلك، لأن الله عز ذكره فرغ من خلق جميع خلقه يوم الجمعة، وذلك اليوم السابع، وفيه استوى على العرش، وجعل ذلك اليوم عيدا للمسلمين، ودليله على ما زعم أنه استدل به على صحه قوله فيما حكينا عنه من ذلك هو الدليل على خطئه فيه، وذلك ان الله تبارك وتعالى أخبر عباده في غير موضع من محكم تنزيله، أنه خلق السموات والأرض وما بينهما في ستة أيام، فقال: «اللَّهُ الَّذِي خَلَقَ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 45\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"45.1\" id=\"odlomak-45-1\">mjestu ponoviti nešto od onoga u njima što ukazuje na ispravnost tvrdnje svake od tih dviju skupina.\u003c/p>\u003cp data-pair=\"45.2\" id=\"odlomak-45-2\">Što se tiče predaje od njega koja potvrđuje riječi onih koji kažu da je početak stvaranja bio u nedjelju, to je ono što \u003cspan class=\"isnad\">nam je pričao Hennad ibn es-Serijj: rekao je: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa — Hennad je rekao: „Ostatak hadisa sam pročitao“ — \u003c/span>da su Jevreji došli Vjerovjesniku, sallallahu alejhi ve sellem, pa ga pitali o stvaranju nebesa i Zemlje. On je rekao: „Allah je stvorio Zemlju u nedjelju i ponedjeljak.“\u003c/p>\u003cp data-pair=\"45.3\" id=\"odlomak-45-3\">Što se tiče predaje od njega koja potvrđuje riječi onih koji kažu da je početak stvaranja bio u subotu, to je ono što su mi pričali Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: \u003cspan class=\"isnad\">pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, uzeo me za ruku i rekao: ‘Allah je stvorio tlo u subotu, a planine je stvorio u nedjelju.’“\u003c/p>\u003cp data-pair=\"45.4\" id=\"odlomak-45-4\">Od ova dva mišljenja smatram ispravnijim ono prema kojem je dan u kojem je Allah, Uzvišen je spomen Njegov, počeo stvarati nebesa i Zemlju bio nedjelja, zbog saglasnosti učenih prethodnika o tome.\u003c/p>\u003cp data-pair=\"45.5\" id=\"odlomak-45-5\">Što se tiče onoga što je Ibn Ishak o tome rekao, on je, prema vlastitoj tvrdnji, zaključio da je tako zato što je Allah, Silan je spomen Njegov, dovršio stvaranje svih Svojih stvorenja u petak, koji je sedmi dan, da se toga dana uzvisio nad Aršom i da je taj dan učinio praznikom muslimana. Dokaz za koji tvrdi da njime potvrđuje ispravnost onoga što smo od njega naveli zapravo je dokaz njegove greške u tome. Allah, Blagoslovljen i Uzvišen, na više mjesta u Svojoj jasnoj Objavi obavijestio je Svoje robove da je stvorio nebesa, Zemlju i ono što je između njih u šest dana. Rekao je: „Allah je Taj koji je stvorio\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":46,"html":"\u003csection class=\"page\" data-page=\"46\" id=\"stranica-46\">\u003ch2>Stranica 46\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 46\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"46.1\" id=\"ar-odlomak-46-1\">السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوى عَلَى الْعَرْشِ مَا لَكُمْ مِنْ دُونِهِ مِنْ وَلِيٍّ وَلا شَفِيعٍ أَفَلا تَتَذَكَّرُونَ»\u003c/p>\u003cp data-pair=\"46.2\" id=\"ar-odlomak-46-2\">وقال تعالى ذكره:\n«قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ ثُمَّ اسْتَوى إِلَى السَّماءِ وَهِيَ دُخانٌ فَقالَ لَها وَلِلْأَرْضِ ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ فَقَضاهُنَّ سَبْعَ سَماواتٍ فِي يَوْمَيْنِ وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها وَزَيَّنَّا السَّماءَ الدُّنْيا بِمَصابِيحَ وَحِفْظاً ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ» .\u003c/p>\u003cp data-pair=\"46.3\" id=\"ar-odlomak-46-3\">ولا خلاف بين جميع أهل العلم أن اليومين اللذين ذكرهما الله تبارك وتعالى في قوله: «فَقَضاهُنَّ سَبْعَ سَماواتٍ فِي يَوْمَيْنِ» داخلان في الأيام الستة اللاتي ذكرهن قبل ذلك، فمعلوم إذ كان الله عز وجل إنما خلق السموات والأرضين وما فيهن في ستة أيام، وكانت الأخبار مع ذلك متظاهرة عن رسول الله ص بان آخر ما خلق الله من خلقه آدم، وأن خلقه إياه كان في يوم الجمعة- إن يوم الجمعة الذي فرغ فيه من خلق خلقه داخل في الأيام الستة التي أخبر الله تعالى ذكره أنه خلق خلقه فيهن، لأن ذلك لو لم يكن داخلا في الأيام الستة كان إنما خلق خلقه في سبعة أيام، لا في ستة، وذلك خلاف ما جاء به التنزيل، فتبين إذا- إذ كان الأمر كالذي وصفنا في ذلك- أن أول الأيام التي ابتدأ الله فيها خلق السموات والارض وما فيهن من خلقه يوم الأحد، إذ كان الآخر يوم الجمعة، وذلك ستة أيام، كما قال ربنا جل جلاله.\u003c/p>\u003cp data-pair=\"46.4\" id=\"ar-odlomak-46-4\">فأما الأخبار الواردة عن رسول الله ص وعن أصحابه بأن الفراغ من الخلق كان يوم الجمعة، فسنذكرها في مواضعها إن شاء الله تعالى\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 46\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"46.1\" id=\"odlomak-46-1\">nebesa, Zemlju i ono što je između njih u šest dana, zatim se uzvisio nad Aršom. Vi mimo Njega nemate ni zaštitnika ni zagovornika. Zar se nećete poučiti?“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: Es-Sedžda, 32:4.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"46.2\" id=\"odlomak-46-2\">I rekao je On, Uzvišen je spomen Njegov: „Reci: Zar vi doista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova! Na njoj je, povrh nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu opskrbu u četiri dana, jednako za one koji pitaju. Zatim se usmjerio prema nebu, a ono je bilo dim, pa je njemu i Zemlji rekao: ‘Dođite, milom ili silom!’ Rekli su: ‘Dolazimo poslušno.’ Potom je od njih u dva dana sačinio sedam nebesa i svakome nebu objavio njegovu odredbu. A najbliže nebo ukrasili smo svjetiljkama i kao zaštitu. To je određenje Silnoga, Sveznajućeg.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Fussilet, 41:9–12.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"46.3\" id=\"odlomak-46-3\">Svi učeni saglasni su da su dva dana koja Allah, Blagoslovljen i Uzvišen, spominje u riječima: „Potom je od njih u dva dana sačinio sedam nebesa“ uključena u šest dana koje je ranije spomenuo. Poznato je, dakle, budući da je Allah, Silan i Uzvišen, stvorio nebesa, zemlje i ono što je u njima samo u šest dana, te da uz to brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, jedna drugu potvrđuju da je posljednje Allahovo stvorenje bio Adem i da ga je stvorio u petak, da je petak u kojem je dovršio stvaranje Svojih stvorenja uključen u šest dana u kojima je, prema onome što je Allah, Uzvišen je spomen Njegov, objavio, stvorio Svoja stvorenja. Da taj dan nije uključen u šest dana, onda bi Svoja stvorenja stvorio u sedam, a ne u šest dana, što je suprotno onome što je doneseno Objavom. Prema tome, budući da je stvar onakva kakvom smo je opisali, jasno je da je prvi dan u kojem je Allah počeo stvarati nebesa, Zemlju i Svoja stvorenja u njima bio nedjelja, jer je posljednji bio petak. To je šest dana, kako je rekao naš Gospodar, Uzvišeno je Njegovo veličanstvo. \u003cspan class=\"translator-note\">⟦Ponovljeni kur’anski navod u ovom odlomku prijevod je dijela ajeta Fussilet, 41:12.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"46.4\" id=\"odlomak-46-4\">Što se tiče predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, i njegovih ashaba da je dovršetak stvaranja bio u petak, navest ćemo ih na njihovim mjestima, ako Uzvišeni Allah htjedne.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":47,"html":"\u003csection class=\"page\" data-page=\"47\" id=\"stranica-47\">\u003ch2>Stranica 47\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 47\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"47.1\" id=\"ar-odlomak-47-1\">القول فيما خلق الله في كل يوم من الأيام السته التي ذكر الله في كتابه أنه خلق فيهن السموات والأرض وما بينهما\u003c/p>\u003cp data-pair=\"47.2\" id=\"ar-odlomak-47-2\">اختلف السلف من أهل العلم في ذلك:\u003c/p>\u003cp data-pair=\"47.3\" id=\"ar-odlomak-47-3\">فقال بعضهم ما \u003cspan class=\"isnad\">حَدَّثَنِي به المثنى بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا عَبْدُ اللَّهِ بْنُ صَالِحٍ، حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، \u003c/span>أَنَّهُ قَالَ: إِنَّ اللَّهَ بَدَأَ الْخَلْقَ يَوْمَ الأَحَدِ، فَخَلَقَ الأَرَضِينَ فِي الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الأَقْوَاتَ وَالرَّوَاسِي فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ، وَخَلَقَ السَّمَوَاتِ فِي الْخَمِيسِ وَالْجُمُعَةِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ، فَخَلَقَ فِيهَا آدَمَ عَلَى عَجَلٍ، فَتِلْكَ السَّاعَةُ الَّتِي تَقُومُ فِيهَا السَّاعَةُ.\u003c/p>\u003cp data-pair=\"47.4\" id=\"ar-odlomak-47-4\">\u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بْنُ هَارُونَ، حَدَّثَنَا عَمْرُو بن حماد، حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من أصحاب النبي ص قَالُوا: \u003c/span>جَعَلَ- يَعْنُونَ رَبَّنَا تَبَارَكَ وَتَعَالَى- سَبْعَ أَرَضِينَ فِي يَوْمَيْنِ: الأَحَدِ وَالاثْنَيْنِ، وَجَعَلَ فِيهَا رَوَاسِيَ أَنْ تَمِيدَ بِكُمْ، وَخَلَقَ الْجِبَالَ فِيهَا وأقوات أهلها، وشجرها وما ينبغي لها في يَوْمَيْنِ: فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ، ثُمَّ اسْتَوَى إِلَى السَّمَاءِ وَهِيَ دُخَانٌ فَجَعَلَهَا سَمَاءً وَاحِدَةً، ثُمَّ فَتَقَهَا فَجَعَلَهَا سَبْعَ سَمَوَاتٍ فِي يَوْمَيْنِ: الْخَمِيسِ وَالْجُمُعَةِ.\u003c/p>\u003cp data-pair=\"47.5\" id=\"ar-odlomak-47-5\">\u003cspan class=\"isnad\">حَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، قَالَ: أَخْبَرَنَا إسحاق، عن شريك، عن غالب ابن غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>خَلَقَ اللَّهُ الأَرْضَ فِي يَوْمَيْنِ الأَحَدِ وَالاثْنَيْنِ.\u003c/p>\u003cp data-pair=\"47.6\" id=\"ar-odlomak-47-6\">ففي قول هؤلاء خلقت الأرض قبل السماء، لأنها خلقت عندهم في الأحد والاثنين\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 47\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"47.1\" id=\"odlomak-47-1\">Rasprava o onome što je Allah stvorio svakoga od šest dana za koje je u Svojoj Knjizi naveo da je u njima stvorio nebesa, Zemlju i ono što je između njih\u003c/p>\u003cp data-pair=\"47.2\" id=\"odlomak-47-2\">Učeni prethodnici razišli su se o tome.\u003c/p>\u003cp data-pair=\"47.3\" id=\"odlomak-47-3\">Neki su rekli ono što \u003cspan class=\"isnad\">mi je pričao Musenna ibn Ibrahim: rekao je: pričao nam je Abdullah ibn Salih: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, da je rekao: \u003c/span>„Allah je započeo stvaranje u nedjelju. Zemlje je stvorio u nedjelju i ponedjeljak, opskrbu i čvrste planine u utorak i srijedu, a nebesa u četvrtak i petak. Dovršio je u posljednjem satu petka, pa je tada u žurbi stvorio Adema. To je sat u kojem će nastupiti Čas.“\u003c/p>\u003cp data-pair=\"47.4\" id=\"odlomak-47-4\">\u003cspan class=\"isnad\">Pričao mi je Musa ibn Harun: pričao nam je Amr ibn Hammad: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji su rekli: \u003c/span>„Učinio je — misleći na našeg Gospodara, Blagoslovljenog i Uzvišenog — sedam zemalja u dva dana: u nedjelju i ponedjeljak. Na njima je postavio čvrste planine da se ne ljuljaju s vama. Planine na njima, opskrbu njihovih stanovnika, njihovo drveće i ono što im treba stvorio je u dva dana: u utorak i srijedu. Zatim se usmjerio prema nebu, a ono je bilo dim, pa ga je učinio jednim nebom. Zatim ga je razdvojio i učinio ga sedmerim nebesima u dva dana: u četvrtak i petak.“\u003c/p>\u003cp data-pair=\"47.5\" id=\"odlomak-47-5\">\u003cspan class=\"isnad\">Pričao nam je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: \u003c/span>„Allah je stvorio Zemlju u dva dana: u nedjelju i ponedjeljak.“\u003c/p>\u003cp data-pair=\"47.6\" id=\"odlomak-47-6\">Prema riječima ovih ljudi, Zemlja je stvorena prije neba, jer je prema njima stvorena u nedjelju i ponedjeljak.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":48,"html":"\u003csection class=\"page\" data-page=\"48\" id=\"stranica-48\">\u003ch2>Stranica 48\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 48\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"48.1\" id=\"ar-odlomak-48-1\">وقال آخرون: خلق الله عز وجل الأرض قبل السماء بأقواتها من غير أن يدحوها، ثم استوى إلى السماء فسواهن سبع سموات، ثم دحا الأرض بعد ذلك.\u003c/p>\u003cp data-pair=\"48.2\" id=\"ar-odlomak-48-2\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"48.3\" id=\"ar-odlomak-48-3\">\u003cspan class=\"isnad\">حَدَّثَنِي عَلِيُّ بْنُ دَاوُدَ، قَالَ: حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي مُعَاوِيَةُ، عَنْ عَلِيِّ بْنِ أَبِي طَلْحَةَ، عَنِ ابْنِ عَبَّاسٍ: \u003c/span>قَوْلُهُ عَزَّ وَجَلَّ حَيْثُ ذَكَرَ خَلَقَ الأَرْضَ قَبْلَ السَّمَاءِ، ثُمَّ ذَكَرَ السَّمَاءَ قَبْلَ الأَرْضِ، وَذَلِكَ أَنَّ اللَّهَ خَلَقَ الأَرْضَ بِأَقْوَاتِهَا مِنْ غَيْرِ أَنْ يَدْحُوَهَا قَبْلَ السَّمَاءِ، ثُمَّ اسْتَوَى إلى السماء فسواهن سبع سموات، ثم دحا الأَرْضَ بَعْدَ ذَلِكَ، فَذَلِكَ قَوْلُهُ تَعَالَى: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» .\u003c/p>\u003cp data-pair=\"48.4\" id=\"ar-odlomak-48-4\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ:\nحَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ: \u003c/span>«وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» ، يَعْنِي أَنَّهَ خَلَقَ السَّمَوَاتِ وَالأَرْضَ، فَلَمَّا فَرَغَ مِنَ السَّمَاءِ قَبْلَ أَنْ يَخْلُقَ أَقْوَاتَ الأَرْضِ بَثَّ أَقْوَاتَ الأَرْضِ فِيهَا بَعْدَ خَلْقِ السَّمَاءِ، وارسى الجبال- يعنى بذلك دحوها- وَلَمْ تَكُنْ تَصْلُحْ أَقْوَاتُ الأَرْضِ وَنَبَاتُهَا إِلا بِاللَّيْلِ وَالنَّهَارِ، فَذَلِكَ قَوْلُهُ عَزَّ وَجَلَّ: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» ، أَلَمْ تَسْمَعْ أَنَّهُ قَالَ: «أَخْرَجَ مِنْها ماءَها وَمَرْعاها» ؟\u003c/p>\u003cp data-pair=\"48.5\" id=\"ar-odlomak-48-5\">قال أبو جعفر: والصواب من القول في ذلك عندنا ما قاله الذين قالوا:\nإن الله خلق الأرض يوم الأحد، وخلق السماء يوم الخميس، وخلق النجوم والشمس والقمر يوم الجمعة لصحة الخبر الذي ذكرنا قبل عن ابن عباس، عن رسول الله ص بذلك وغير مستحيل ما روينا في ذلك عن ابن عباس من القول، وهو أن يكون الله تعالى ذكره خلق الأرض ولم يدحها، ثم خلق السموات فسواهن، ثم دحا الأرض بعد ذلك، فأخرج منها ماءها\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 48\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"48.1\" id=\"odlomak-48-1\">Drugi su rekli: „Allah, Silan i Uzvišen, stvorio je Zemlju s njenom opskrbom prije neba, ali je nije rasprostro. Zatim se usmjerio prema nebu i od njih sačinio sedam nebesa, a potom je rasprostro Zemlju.“\u003c/p>\u003cp data-pair=\"48.2\" id=\"odlomak-48-2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"48.3\" id=\"odlomak-48-3\">\u003cspan class=\"isnad\">Pričao mi je Ali ibn Davud: rekao je: pričao nam je Ebu Salih: rekao je: pričao mi je Muavija, od Alija ibn Ebu Talhe, od Ibn Abbasa, \u003c/span>o riječima Njega, Silnog i Uzvišenog, gdje je spomenuo stvaranje Zemlje prije neba, a zatim spomenuo nebo prije Zemlje: „To je zato što je Allah stvorio Zemlju s njenom opskrbom prije neba, ali je nije rasprostro. Zatim se usmjerio prema nebu i od njih sačinio sedam nebesa, a nakon toga je rasprostro Zemlju. To su Njegove, Uzvišeni je On, riječi: ‘A Zemlju je nakon toga rasprostro.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Naziat, 79:30.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"48.4\" id=\"odlomak-48-4\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sa‘d: rekao je: pričao mi je moj otac: rekao je: pričao mi je moj amidža: rekao je: pričao mi je moj otac, od svoga oca, od Ibn Abbasa, \u003c/span>o riječima: „A Zemlju je nakon toga rasprostro; iz nje je izveo njenu vodu i njene pašnjake, a planine učvrstio“: „To znači da je stvorio nebesa i Zemlju. Kada je dovršio nebo, prije nego što je stvorio opskrbu Zemlje, rasuo je njenu opskrbu po njoj nakon stvaranja neba i učvrstio planine — time se misli na njeno rasprostiranje. Opskrba Zemlje i njeno bilje nisu mogli uspijevati bez noći i dana. To su riječi Njega, Silnog i Uzvišenog: ‘A Zemlju je nakon toga rasprostro.’ Zar nisi čuo da je rekao: ‘Iz nje je izveo njenu vodu i njene pašnjake’?“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda, redom: En-Naziat, 79:30–32; 79:30; 79:31.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"48.5\" id=\"odlomak-48-5\">Ebu Džafer kaže: Ispravno je, prema našem mišljenju, ono što su rekli oni koji kažu da je Allah stvorio Zemlju u nedjelju, nebo u četvrtak, a zvijezde, Sunce i Mjesec u petak, zbog vjerodostojnosti predaje koju smo ranije o tome naveli od Ibn Abbasa, od Allahovog Poslanika, sallallahu alejhi ve sellem. Nije nemoguće ni ono što smo o tome prenijeli od Ibn Abbasa: da je Allah, Uzvišen je spomen Njegov, stvorio Zemlju, a nije je rasprostro, zatim je stvorio nebesa i uredio ih, a nakon toga je rasprostro Zemlju i iz nje izveo njenu vodu\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":49,"html":"\u003csection class=\"page\" data-page=\"49\" id=\"stranica-49\">\u003ch2>Stranica 49\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 49\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"49.1\" id=\"ar-odlomak-49-1\">ومرعاها، والجبال أرساها، بل ذلك عندي هو الصواب من القول في ذلك، وذلك أن معنى الدحو غير معنى الخلق، وقد قال الله عز وجل: «أَأَنْتُمْ أَشَدُّ خَلْقاً أَمِ السَّماءُ بَناها رَفَعَ سَمْكَها فَسَوَّاها وَأَغْطَشَ لَيْلَها وَأَخْرَجَ ضُحاها.\n\nوَالْأَرْضَ بَعْدَ ذلِكَ دَحاها أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» .\u003c/p>\u003cp data-pair=\"49.2\" id=\"ar-odlomak-49-2\">فإن قال قائل: فإنك قد علمت أن جماعة من أهل التأويل قد وجهت قول الله: «وَالْأَرْضَ بَعْدَ ذلِكَ دَحاها» إلى معنى مع ذلك دحاها، فما برهانك على صحة ما قلت، من أن ذلك بمعنى بعد التي هي خلاف قبل؟\u003c/p>\u003cp data-pair=\"49.3\" id=\"ar-odlomak-49-3\">قيل: المعروف من معنى بعد في كلام العرب هو الذي قلنا من أنها بخلاف معنى قبل لا بمعنى مع، وإنما توجه معاني الكلام إلى الأغلب عليه من معانيه المعروفة في أهله، لا إلى غير ذلك.\u003c/p>\u003cp data-pair=\"49.4\" id=\"ar-odlomak-49-4\">وقد قيل: إن الله خلق البيت العتيق على الماء على أربعة أركان، قبل أن يخلق الدنيا بألفي عام، ثم دحيت الأرض من تحته.\u003c/p>\u003cp data-pair=\"49.5\" id=\"ar-odlomak-49-5\">ذكر من قال ذلك:\u003c/p>\u003cp data-pair=\"49.6\" id=\"ar-odlomak-49-6\">\u003cspan class=\"isnad\">حدثنا ابن حميد، قَالَ: حَدَّثَنَا يَعْقُوبُ الْقُمِّيُّ، عَنْ جَعْفَرٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>وَضَعَ الْبَيْتَ على الماء على أربعة أركان، قبل أن يخلق الدنيا بألفي عام، ثم دحيت الأرض مِنْ تَحْتِ الْبَيْتِ.\u003c/p>\u003cp data-pair=\"49.7\" id=\"ar-odlomak-49-7\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا مِهْرَانُ، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ بُكَيْرِ بْنِ الأَخْنَسِ، عَنْ مُجَاهِدٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ: \u003c/span>خَلَقَ اللَّهُ الْبَيْتَ قَبْلَ الأَرْضِ بِأَلْفَيْ سَنَةٍ، وَمِنْهُ دُحِيَتِ الأَرْضُ.\u003c/p>\u003cp data-pair=\"49.8\" id=\"ar-odlomak-49-8\">وَإِذَا كَانَ الأَمْرُ كَذَلِكَ كَانَ خَلْقُ الأَرْضِ قَبْلَ خَلْقِ السَّمَوَاتِ، وَدَحْوِ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 49\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"49.1\" id=\"odlomak-49-1\">i njene pašnjake, a planine učvrstio. Naprotiv, po mome mišljenju, to je ispravno mišljenje o tome, jer značenje rasprostiranja nije isto što i značenje stvaranja. Allah, Silan i Uzvišen, rekao je: „Jeste li vi teži za stvaranje ili nebo? On ga je izgradio; podigao je njegov svod i uredio ga; njegovu noć učinio je tamnom i izveo njegovo jutarnje svjetlo. A Zemlju je nakon toga rasprostro; iz nje je izveo njenu vodu i njene pašnjake, a planine učvrstio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Naziat, 79:27–32.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"49.2\" id=\"odlomak-49-2\">Ako neko kaže: „Znaš da je jedna skupina tumača Allahove riječi: ‘A Zemlju je nakon toga rasprostro’ protumačila u značenju: ‘Uz to ju je rasprostro.’ Koji je tvoj dokaz za ispravnost onoga što si rekao: da to znači ‘poslije’, kao suprotnost riječi ‘prije’?“ \u003cspan class=\"translator-note\">⟦Prvi navod prijevod je ajeta En-Naziat, 79:30; druga formulacija predstavlja navedeno tumačenje.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"49.3\" id=\"odlomak-49-3\">Odgovara se: Poznato značenje riječi „poslije“ u govoru Arapa jeste ono koje smo naveli: suprotnost značenju riječi „prije“, a ne značenje riječi „uz“. Značenje govora usmjerava se prema njegovom preovlađujućem značenju poznatom među onima koji tim jezikom govore, a ne prema nečemu drugom.\u003c/p>\u003cp data-pair=\"49.4\" id=\"odlomak-49-4\">Rečeno je da je Allah stvorio Drevni Hram na vodi, na četiri ugla, dvije hiljade godina prije nego što je stvorio ovaj svijet, a zatim je Zemlja rasprostrta ispod njega.\u003c/p>\u003cp data-pair=\"49.5\" id=\"odlomak-49-5\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"49.6\" id=\"odlomak-49-6\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Jakub el-Kummi, od Džafera, od Ikrime, od Ibn Abbasa, koji je rekao: \u003c/span>„Postavio je Hram na vodu, na četiri ugla, dvije hiljade godina prije nego što je stvorio ovaj svijet. Zatim je Zemlja rasprostrta ispod Hrama.“\u003c/p>\u003cp data-pair=\"49.7\" id=\"odlomak-49-7\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: rekao je: pričao nam je Mihran, od Sufjana, od A‘meša, od Bukejra ibn el-Ahnesa, od Mudžahida, od Abdullaha ibn Omera, koji je rekao: \u003c/span>„Allah je stvorio Hram dvije hiljade godina prije Zemlje i od njega je Zemlja rasprostrta.“\u003c/p>\u003cp data-pair=\"49.8\" id=\"odlomak-49-8\">Ako je tako, stvaranje Zemlje prethodilo je stvaranju nebesa, a rasprostiranje\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":50,"html":"\u003csection class=\"page\" data-page=\"50\" id=\"stranica-50\">\u003ch2>Stranica 50\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 50\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"50.1\" id=\"ar-odlomak-50-1\">الأَرْضِ وَهُوَ بَسْطُهَا بِأَقْوَاتِهَا وَمَرَاعِيهَا وَنَبَاتِهَا، بَعْدَ خَلْقِ السَّمَوَاتِ، كَمَا ذَكَرْنَا عَنِ ابْنِ عَبَّاسٍ.\u003c/p>\u003cp data-pair=\"50.2\" id=\"ar-odlomak-50-2\">وَقَدْ \u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنِي مِهْرَانُ، عن ابن سِنَانٍ، عَنْ أَبِي بَكْرٍ، [قَالَ: \u003c/span>جَاءَ الْيَهُودُ الى النبي ص فَقَالُوا:\nيَا مُحَمَّدُ، أَخْبِرْنَا: مَا خَلَقَ اللَّهُ مِنَ الْخَلْقِ فِي هَذِهِ الأَيَّامِ السِّتَّةِ؟ فَقَالَ: خَلَقَ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ، وَخَلَقَ الْمَدَائِنَ وَالأَقْوَاتَ وَالأَنْهَارَ وَعُمْرَانَهَا وَخَرَابَهَا يَوْمَ الأَرْبِعَاءِ، وَخَلَقَ السَّمَوَاتِ وَالْمَلائِكَةَ يَوْمَ الْخَمِيسِ، إِلَى ثَلاثِ سَاعَاتٍ بَقِينَ مِنْ يَوْمِ الْجُمُعَةِ، وَخَلَقَ فِي أَوَّلِ الثَّلاثِ سَاعَاتٍ الآجَالَ، وَفِي الثَّانِيَةِ الآفَةَ، وَفِي الثَّالِثَةِ آدَمَ قَالُوا: صدقت ان اتممت، فعرف النبي ص مَا يُرِيدُونَ، فَغَضِبَ، فَأَنْزَلَ اللَّهُ تَعَالَى: «وَما مَسَّنا مِنْ لُغُوبٍ فَاصْبِرْ عَلى مَا يَقُولُونَ] » .\u003c/p>\u003cp data-pair=\"50.3\" id=\"ar-odlomak-50-3\">فإن قال قائل: فإن كان الأمر كما وصفت من أن الله تعالى خلق الأرض قبل السماء، فما معنى قول ابن عباس الذى حدثكموه واصل ابن عَبْدِ الأَعْلَى الأَسَدِيُّ، قَالَ: \u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ فُضَيْلٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى مِنْ شَيْءٍ الْقَلَمُ، فَقَالَ لَهُ: اكْتُبْ، فَقَالَ: وَمَا أَكْتُبُ يَا رَبِّ؟ قَالَ: اكْتُبِ الْقَدَرَ، قَالَ:\nفَجَرَى الْقَلَمُ بِمَا هُوَ كَائِنٌ مِنْ ذَلِكَ إِلَى قِيَامِ السَّاعَةِ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ فَفَتَقَ مِنْهُ السَّمَوَاتِ، ثُمَّ خَلَقَ النُّونَ، فَدُحِيَتِ الأَرْضُ عَلَى ظَهْرِهِ، فَاضْطَرَبَ النُّونُ، فَمَادَتِ الأَرْضُ فَأُثْبِتَتْ بِالْجِبَالِ، فَإِنَّهَا لَتَفْخَرُ عَلَى الارض\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 50\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"50.1\" id=\"odlomak-50-1\">Zemlje — to jest njeno pružanje s njenom opskrbom, pašnjacima i biljem — uslijedilo je nakon stvaranja nebesa, kako smo naveli od Ibn Abbasa.\u003c/p>\u003cp data-pair=\"50.2\" id=\"odlomak-50-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: rekao je: pričao mi je Mihran, od Ibn Sinana, od Ebu Bekra, koji je rekao: \u003c/span>„Jevreji su došli Vjerovjesniku, sallallahu alejhi ve sellem, i rekli: ‘Muhammede, obavijesti nas: koja je stvorenja Allah stvorio u ovih šest dana?’ Odgovorio je: ‘Zemlju je stvorio u nedjelju i ponedjeljak, planine je stvorio u utorak, a gradove, opskrbu, rijeke, njihovu nastanjenost i njihovu opustjelost stvorio je u srijedu. Nebesa i meleke stvarao je od četvrtka do preostala tri sata petka. U prvom od ta tri sata stvorio je rokove života, u drugom nedaću, a u trećem Adema.’ Rekli su: ‘Istinu si rekao, ako dovršiš.’ Vjerovjesnik, sallallahu alejhi ve sellem, prepoznao je šta žele, pa se rasrdio. Tada je Uzvišeni Allah objavio: ‘I nije Nas dotakao nikakav umor. Zato strpljivo podnosi ono što govore.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Kaf, 50:38–39, navedeni dijelovi dvaju ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"50.3\" id=\"odlomak-50-3\">Ako neko kaže: „Ako je stvar onakva kakvom si je opisao — da je Uzvišeni Allah stvorio Zemlju prije neba — šta onda znače riječi Ibn Abbasa koje vam je pričao Vasil ibn Abdula‘la el-Esedi: \u003cspan class=\"isnad\">pričao nam je Muhammed ibn Fudajl, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: \u003c/span>‘Prvo što je Uzvišeni Allah stvorio bilo je pero. Rekao mu je: Piši! Ono je reklo: A šta da pišem, Gospodaru moj? Rekao je: Zapiši određenje! I pero je ispisalo ono što će biti od tada do nastupanja Časa. Zatim je podigao vodenu paru i iz nje razdvojio nebesa. Potom je stvorio nuna, pa je Zemlja rasprostrta na njegovim leđima. Nun se pokrenuo i uzdrmao, pa se Zemlja zaljuljala i bila je učvršćena planinama. One se doista ponose nad Zemljom.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: نون je ovdje preneseno kao „nun“. Predaja na stranici 52 poistovjećuje ga s velikom ribom; to je objašnjenje u predaji, a ne dopuna kur’anskog teksta.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":51,"html":"\u003csection class=\"page\" data-page=\"51\" id=\"stranica-51\">\u003ch2>Stranica 51\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 51\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"51.1\" id=\"ar-odlomak-51-1\">\u003cspan class=\"isnad\">حَدَّثَنِي وَاصِلٌ، قَالَ: حَدَّثَنَا وَكِيعٌ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ \u003c/span>نَحْوَهُ.\u003c/p>\u003cp data-pair=\"51.2\" id=\"ar-odlomak-51-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ، عَنْ شُعْبَةَ، عَنْ سُلَيْمَانَ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى الْقَلَمَ فَجَرَى بِمَا هُوَ كَائِنٌ، ثُمَّ رَفَعَ بُخَارَ الْمَاءِ، فَخُلِقَتْ مِنْهُ السَّمَوَاتُ، ثُمَّ خَلَقَ النُّونَ، فَبُسِطَتِ الأَرْضُ عَلَى ظهر النون، فتحرك النون، فمادت الارض فاثبت بالجبال، فان الْجِبَالَ لَتَفْخَرُ عَلَى الأَرْضِ قَالَ: وَقَرَأَ: «ن وَالْقَلَمِ وَما يَسْطُرُونَ» .\u003c/p>\u003cp data-pair=\"51.3\" id=\"ar-odlomak-51-3\">\u003cspan class=\"isnad\">حدثني تميم بن المنتصر، قال: أخبرنا إسحاق، عَنْ شَرِيكٍ، عَنِ الأَعْمَشِ، عَنْ أَبِي ظَبْيَانَ- او مُجَاهِدٍ- عَنِ ابْنِ عَبَّاسٍ بِنَحْوِهِ، إِلا \u003c/span>أَنَّهُ قَالَ: فَفُتِقَتْ مِنْهُ السَّمَوَاتُ.\u003c/p>\u003cp data-pair=\"51.4\" id=\"ar-odlomak-51-4\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا يَحْيَى، قَالَ: حَدَّثَنَا سُفْيَانُ، قَالَ: حَدَّثَنِي سُلَيْمَانُ، عَنْ أَبِي ظَبْيَانَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>أَوَّلُ مَا خَلَقَ اللَّهُ تَعَالَى الْقَلَمُ فَقَالَ: اكْتُبْ، فَقَالَ: مَا أَكْتُبُ؟ قَالَ: اكْتُبِ الْقَدَرَ، قَالَ: فَجَرَى بِمَا هُوَ كَائِنٌ مِنْ ذَلِكَ الْيَوْمِ إِلَى قِيَامِ السَّاعَةِ ثُمَّ خَلَقَ النُّونَ، وَرَفَعَ بُخَارَ الْمَاءِ فَفُتِقَتْ مِنْهُ السَّمَاءُ، وَبُسِطَتِ الأَرْضُ عَلَى ظَهْرِ النُّونِ، فَاضْطَرَبَ النُّونُ، فَمَادَتِ الأَرْضُ فَأُثْبِتَتْ بِالْجِبَالِ، قَالَ: فَإِنَّهَا لَتَفْخَرُ عَلَى الأَرْضِ.\u003c/p>\u003cp data-pair=\"51.5\" id=\"ar-odlomak-51-5\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ، حَدَّثَنَا جَرِيرٌ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ أَبِي الضُّحَى مُسْلِمِ بْنِ صُبَيْحٍ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>أَوَّلُ شَيْءٍ خَلَقَ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 51\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"51.1\" id=\"odlomak-51-1\">\u003cspan class=\"isnad\">Pričao mi je Vasil: rekao je: pričao nam je Veki‘, od A‘meša, od Ebu Zabjana, od Ibn Abbasa, \u003c/span>nešto slično tome.\u003c/p>\u003cp data-pair=\"51.2\" id=\"odlomak-51-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn el-Musenna: rekao je: pričao nam je Ibn Ebu Adijj, od Šu‘be, od Sulejmana, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: \u003c/span>„Prvo što je Uzvišeni Allah stvorio bilo je pero, pa je ono ispisalo ono što će biti. Zatim je podigao vodenu paru i od nje su stvorena nebesa. Potom je stvorio nuna, pa je Zemlja rasprostrta na nunovim leđima. Nun se pokrenuo, pa se Zemlja zaljuljala i bila je učvršćena planinama. Planine se doista ponose nad Zemljom.“ Rekao je i proučio: „Nun. Tako Mi pera i onoga što pišu.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kalem, 68:1.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"51.3\" id=\"odlomak-51-3\">\u003cspan class=\"isnad\">Pričao mi je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od A‘meša, od Ebu Zabjana — ili Mudžahida — od Ibn Abbasa, \u003c/span>nešto slično tome, osim što je rekao: „Pa su iz nje razdvojena nebesa.“\u003c/p>\u003cp data-pair=\"51.4\" id=\"odlomak-51-4\">\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar: rekao je: pričao nam je Jahja: rekao je: pričao nam je Sufjan: rekao je: pričao mi je Sulejman, od Ebu Zabjana, od Ibn Abbasa, koji je rekao: \u003c/span>„Prvo što je Uzvišeni Allah stvorio bilo je pero. Rekao je: ‘Piši!’ Ono je reklo: ‘Šta da pišem?’ Rekao je: ‘Zapiši određenje!’ I ono je ispisalo ono što će biti od toga dana do nastupanja Časa. Zatim je stvorio nuna i podigao vodenu paru, pa je iz nje razdvojeno nebo, a Zemlja je rasprostrta na nunovim leđima. Nun se uzdrmao, pa se Zemlja zaljuljala i bila je učvršćena planinama.“ Rekao je: „One se doista ponose nad Zemljom.“\u003c/p>\u003cp data-pair=\"51.5\" id=\"odlomak-51-5\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd: pričao nam je Džerir, od Ataa ibn es-Saiba, od Ebu Duhaa Muslima ibn Subejha, od Ibn Abbasa, koji je rekao: \u003c/span>„Prvo što je\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":52,"html":"\u003csection class=\"page\" data-page=\"52\" id=\"stranica-52\">\u003ch2>Stranica 52\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 52\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"52.1\" id=\"ar-odlomak-52-1\">اللَّهُ تَعَالَى الْقَلَمُ، فَقَالَ لَهُ: اكْتُبْ، فَكَتَبَ مَا هُوَ كَائِنٌ إِلَى أَنْ تَقُومَ السَّاعَةُ، ثُمَّ خَلَقَ النُّونَ فَوْقَ الْمَاءِ، ثُمَّ كَبَسَ الأَرْضَ عَلَيْهِ.\u003c/p>\u003cp data-pair=\"52.2\" id=\"ar-odlomak-52-2\">قيل: ذلك صحيح على ما روي عنه وعن غيره من معنى ذلك مشروحا مفسرا غير مخالف شيئا مما رويناه عنه في ذلك.\u003c/p>\u003cp data-pair=\"52.3\" id=\"ar-odlomak-52-3\">فإن قال: وما الذي روي عنه وعن غيره من شرح ذلك الدال على صحة كل ما رويت لنا في هذا المعنى عنه؟\u003c/p>\u003cp data-pair=\"52.4\" id=\"ar-odlomak-52-4\">قيل له: \u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بْنُ هَارُونَ الْهَمْدَانِيُّ وَغَيْرُهُ، قَالُوا: حَدَّثَنَا عَمْرُو بْنُ حَمَّادٍ، حَدَّثَنَا أَسْبَاطُ بْنُ نَصْرٍ، عَنِ السُّدِّيِّ، عَنْ أَبِي مَالِكٍ، وَعَنْ أَبِي صالح، عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب رسول الله ص «هُوَ الَّذِي خَلَقَ لَكُمْ مَا فِي الْأَرْضِ جَمِيعاً ثُمَّ اسْتَوى إِلَى السَّماءِ فَسَوَّاهُنَّ سَبْعَ سَماواتٍ» قَالَ: \u003c/span>إِنَّ اللَّهَ تَعَالَى كَانَ عَرْشُهُ عَلَى الْمَاءِ وَلَمْ يَخْلُقْ شَيْئًا غَيْرَ مَا خَلَقَ قَبْلَ الْمَاءِ، فَلَمَّا أَرَادَ أَنْ يَخْلُقَ الْخَلْقَ أَخْرَجَ مِنَ الْمَاءِ دُخَانًا فَارْتَفَعَ فَوْقَ الْمَاءِ، فَسَمَا عَلَيْهِ، فَسَمَّاهُ سَمَاءً، ثُمَّ أَيْبَسَ الْمَاءَ، فَجَعَلَهُ أَرْضًا وَاحِدَةً، ثُمَّ فَتَقَهَا فَجَعَلَهَا سَبْعَ أَرَضِينَ فِي يَوْمَيْنِ، فِي الأَحَدِ وَالاثْنَيْنِ، فَخَلَقَ الأَرْضَ عَلَى حُوتٍ- وَالْحُوتُ هُوَ النُّونُ الَّذِي ذَكَرَ اللَّهُ عَزَّ وَجَلَّ فِي الْقُرْآنِ: «ن وَالْقَلَمِ» - وَالْحُوتُ فِي الْمَاءِ، وَالْمَاءُ عَلَى ظَهْرِ صَفَاةٍ، وَالصَّفَاةُ عَلَى ظَهْرِ مَلَكٍ، وَالْمَلَكُ عَلَى صَخْرَةٍ، والصخرة على الرِّيحِ- وَهِيَ الصَّخْرَةُ الَّتِي ذَكَرَ لُقْمَانُ- لَيْسَتْ فِي السَّمَاءِ وَلا فِي الأَرْضِ، فَتَحَرَّكَ الْحُوتُ فَاضْطَرَبَ، فَتَزَلْزَلَتِ الأَرْضُ، فَأَرْسَى عَلَيْهَا الْجِبَالُ فَقَرَّتْ، فالجبال\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 52\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"52.1\" id=\"odlomak-52-1\">Uzvišeni Allah stvorio bilo je pero. Rekao mu je: ‘Piši!’ I ono je zapisalo ono što će biti do nastupanja Časa. Zatim je stvorio nuna iznad vode, a potom je na njega naslagao Zemlju.“\u003c/p>\u003cp data-pair=\"52.2\" id=\"odlomak-52-2\">Odgovara se: To je ispravno prema onome što je preneseno od njega i od drugih kao razrađeno i objašnjeno značenje toga, koje nije u suprotnosti ni s čim što smo od njega o tome prenijeli.\u003c/p>\u003cp data-pair=\"52.3\" id=\"odlomak-52-3\">Ako kaže: „Šta je od njega i drugih preneseno kao objašnjenje koje potvrđuje ispravnost svega što si nam od njega prenio o ovom značenju?“\u003c/p>\u003cp data-pair=\"52.4\" id=\"odlomak-52-4\">Odgovara mu se: \u003cspan class=\"isnad\">Pričali su mi Musa ibn Harun el-Hemdani i drugi; rekli su: pričao nam je Amr ibn Hammad: pričao nam je Esbat ibn Nasr, od Suddija, od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, \u003c/span>o riječima: „On je Taj koji je za vas stvorio sve što je na Zemlji, zatim se usmjerio prema nebu i od njih sačinio sedam nebesa.“ Rekao je: „Arš Uzvišenog Allaha bio je na vodi, a On nije stvorio ništa drugo osim onoga što je stvorio prije vode. Kada je htio stvarati stvorenja, iz vode je izveo dim, pa se on podigao iznad vode i uzvisio nad njom. Nazvao ga je nebom. Zatim je vodu osušio i učinio je jednom zemljom, potom ju je razdvojio i učinio je sedmerim zemljama u dva dana, u nedjelju i ponedjeljak. Zemlju je stvorio na velikoj ribi — a riba je nun koji Allah, Silan i Uzvišen, spominje u Kur’anu: ‘Nun. Tako Mi pera’ — riba je u vodi, voda je na glatkom kamenu, glatki kamen je na leđima meleka, melek je na stijeni, a stijena na vjetru. To je stijena koju je spomenuo Lukman; nije ni na nebu ni na Zemlji. Riba se pokrenula i uzdrmala, pa se Zemlja zatresla. Zato je na njoj učvrstio planine i ona se smirila. Planine se \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:29, navedeni dio; El-Kalem, 68:1, navedeni dio. Poistovjećivanje nuna s ribom pripada navedenoj predaji.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"}],"book":[{"n":28,"ar":"القول في الدلالة على أن الله عز وجل القديم الأول قبل شيء وأنه هو المحدث كل شيء بقدرته تعالى ذكره فمن الدلالة على ذلك أنه لا شيء في العالم مشاهد إلا جسم أو قائم بجسم، وأنه لا جسم إلا مفترق أو مجتمع، وأنه لا مفترق منه إلا وهو موهوم فيه الائتلاف إلى غيره من أشكاله، ولا مجتمع منه إلا وهو موهوم فيه الافتراق، وأنه متى عدم أحدهما عدم الآخر معه، وأنه إذا اجتمع الجزءان منه بعد الافتراق، فمعلوم أن اجتماعهما حادث فيهما بعد أن لم يكن، وأن الافتراق إذا حدث فيهما بعد الاجتماع، فمعلوم أن الافتراق فيهما حادث بعد أن لم يكن.\n\nوإذا كان الأمر فيما في العالم من شيء كذلك، وكان حكم ما لم يشاهد وما هو من جنس ما شاهدنا في معنى جسم أو قائم بجسم، وكان ما لم يخل من الحدث لا شك أنه محدث بتأليف مؤلف له إن كان مجتمعا، وتفريق مفرق له إن كان مفترقا وكان معلوما بذلك أن جامع ذلك إن كان مجتمعا، ومفرقه إن كان مفترقا من لا يشبهه، ومن لا يجوز عليه الاجتماع والافتراق، وهو الواحد القادر الجامع بين المختلفات، الذي لا يشبهه شيء، وهو على كل شيء قدير- فبين بما وصفنا أن بارئ الأشياء ومحدثها كان قبل كل شيء، وأن الليل والنهار والزمان والساعات محدثات، وأن محدثها الذي يدبرها ويصرفها قبلها، إذ كان من المحال أن يكون شيء يحدث شيئا إلا ومحدثه قبله، وأن في قوله تعالى ذكره:\n\n«أَفَلا يَنْظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ وَإِلَى السَّماءِ كَيْفَ رُفِعَتْ وَإِلَى الْجِبالِ كَيْفَ نُصِبَتْ وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ» ، لابلغ الحجج،","bs":"\u003cp data-paragraph=\"28.1\">Rasprava o dokazivanju da je Allah, Silan je i Uzvišen, Bespočetni, Prvi prije svake stvari i da On Svojom moći dovodi svaku stvar u postojanje, uzvišen je Njegov spomen. Među dokazima toga jeste da na svijetu nema ničega što se opaža a da nije tijelo ili nešto što postoji pri tijelu; da nema tijela a da nije razdvojeno ili sastavljeno; da nema razdvojenoga njegova dijela za koji nije zamislivo spajanje s drugim, njemu sličnim dijelovima; da nema sastavljenoga za koje nije zamislivo razdvajanje; da, kada jedno od toga dvoga izostane, s njim izostane i drugo; da je, kada se njegova dva dijela sastave nakon razdvojenosti, poznato da je njihova sastavljenost u njima nastala nakon što nije postojala; i da je, kada u njima nastane razdvojenost nakon sastavljenosti, poznato da je razdvojenost u njima nastala nakon što nije postojala.\u003c/p>\u003cp data-paragraph=\"28.2\">Ako je takvo stanje stvari koje su na svijetu i ako za ono što nije opaženo, a pripada istoj vrsti kao ono što smo opazili, važi da je tijelo ili nešto što postoji pri tijelu; i ako je ono što nije lišeno nastajanja bez sumnje samo nastalo, sastavljanjem onoga koji ga sastavlja ako je sastavljeno i razdvajanjem onoga koji ga razdvaja ako je razdvojeno; i ako se time zna da je onaj koji ga sastavlja, ako je sastavljeno, i onaj koji ga razdvaja, ako je razdvojeno, neko ko mu nije sličan i na koga se ne mogu primijeniti sastavljanje i razdvajanje — a On je Jedini, Moćni, koji spaja ono što se razlikuje, kojem ništa nije slično i koji je nad svakom stvari moćan — onda je iz onoga što smo opisali jasno da je Stvoritelj stvari i Onaj koji ih dovodi u postojanje bio prije svake stvari; da su noć i dan, vrijeme i sati nastali; i da je Onaj koji ih je doveo u postojanje, koji njima upravlja i raspolaže, bio prije njih. Jer je nemoguće da nešto dovodi nešto u postojanje, a da onaj koji ga dovodi u postojanje nije prije njega. I da u Njegovim riječima, uzvišen je Njegov spomen:\u003c/p>\u003cp data-paragraph=\"28.3\">⟦Kur’anski navod, prijevod, 88:17–20⟧ „Zar ne gledaju kamile, kako su stvorene, i nebo, kako je podignuto, i planine, kako su postavljene, i Zemlju, kako je prostrta?“ — postoji najrječitiji dokaz,\u003c/p>","paragraphs":[{"id":"28.1","ar":"القول في الدلالة على أن الله عز وجل القديم الأول قبل شيء وأنه هو المحدث كل شيء بقدرته تعالى ذكره فمن الدلالة على ذلك أنه لا شيء في العالم مشاهد إلا جسم أو قائم بجسم، وأنه لا جسم إلا مفترق أو مجتمع، وأنه لا مفترق منه إلا وهو موهوم فيه الائتلاف إلى غيره من أشكاله، ولا مجتمع منه إلا وهو موهوم فيه الافتراق، وأنه متى عدم أحدهما عدم الآخر معه، وأنه إذا اجتمع الجزءان منه بعد الافتراق، فمعلوم أن اجتماعهما حادث فيهما بعد أن لم يكن، وأن الافتراق إذا حدث فيهما بعد الاجتماع، فمعلوم أن الافتراق فيهما حادث بعد أن لم يكن.","bs":"Rasprava o dokazivanju da je Allah, Silan je i Uzvišen, Bespočetni, Prvi prije svake stvari i da On Svojom moći dovodi svaku stvar u postojanje, uzvišen je Njegov spomen. Među dokazima toga jeste da na svijetu nema ničega što se opaža a da nije tijelo ili nešto što postoji pri tijelu; da nema tijela a da nije razdvojeno ili sastavljeno; da nema razdvojenoga njegova dijela za koji nije zamislivo spajanje s drugim, njemu sličnim dijelovima; da nema sastavljenoga za koje nije zamislivo razdvajanje; da, kada jedno od toga dvoga izostane, s njim izostane i drugo; da je, kada se njegova dva dijela sastave nakon razdvojenosti, poznato da je njihova sastavljenost u njima nastala nakon što nije postojala; i da je, kada u njima nastane razdvojenost nakon sastavljenosti, poznato da je razdvojenost u njima nastala nakon što nije postojala.","ar_ranges":[],"ar_html":"القول في الدلالة على أن الله عز وجل القديم الأول قبل شيء وأنه هو المحدث كل شيء بقدرته تعالى ذكره فمن الدلالة على ذلك أنه لا شيء في العالم مشاهد إلا جسم أو قائم بجسم، وأنه لا جسم إلا مفترق أو مجتمع، وأنه لا مفترق منه إلا وهو موهوم فيه الائتلاف إلى غيره من أشكاله، ولا مجتمع منه إلا وهو موهوم فيه الافتراق، وأنه متى عدم أحدهما عدم الآخر معه، وأنه إذا اجتمع الجزءان منه بعد الافتراق، فمعلوم أن اجتماعهما حادث فيهما بعد أن لم يكن، وأن الافتراق إذا حدث فيهما بعد الاجتماع، فمعلوم أن الافتراق فيهما حادث بعد أن لم يكن.","bs_ranges":[],"bs_html":"Rasprava o dokazivanju da je Allah, Silan je i Uzvišen, Bespočetni, Prvi prije svake stvari i da On Svojom moći dovodi svaku stvar u postojanje, uzvišen je Njegov spomen. Među dokazima toga jeste da na svijetu nema ničega što se opaža a da nije tijelo ili nešto što postoji pri tijelu; da nema tijela a da nije razdvojeno ili sastavljeno; da nema razdvojenoga njegova dijela za koji nije zamislivo spajanje s drugim, njemu sličnim dijelovima; da nema sastavljenoga za koje nije zamislivo razdvajanje; da, kada jedno od toga dvoga izostane, s njim izostane i drugo; da je, kada se njegova dva dijela sastave nakon razdvojenosti, poznato da je njihova sastavljenost u njima nastala nakon što nije postojala; i da je, kada u njima nastane razdvojenost nakon sastavljenosti, poznato da je razdvojenost u njima nastala nakon što nije postojala."},{"id":"28.2","ar":"وإذا كان الأمر فيما في العالم من شيء كذلك، وكان حكم ما لم يشاهد وما هو من جنس ما شاهدنا في معنى جسم أو قائم بجسم، وكان ما لم يخل من الحدث لا شك أنه محدث بتأليف مؤلف له إن كان مجتمعا، وتفريق مفرق له إن كان مفترقا وكان معلوما بذلك أن جامع ذلك إن كان مجتمعا، ومفرقه إن كان مفترقا من لا يشبهه، ومن لا يجوز عليه الاجتماع والافتراق، وهو الواحد القادر الجامع بين المختلفات، الذي لا يشبهه شيء، وهو على كل شيء قدير- فبين بما وصفنا أن بارئ الأشياء ومحدثها كان قبل كل شيء، وأن الليل والنهار والزمان والساعات محدثات، وأن محدثها الذي يدبرها ويصرفها قبلها، إذ كان من المحال أن يكون شيء يحدث شيئا إلا ومحدثه قبله، وأن في قوله تعالى ذكره:","bs":"Ako je takvo stanje stvari koje su na svijetu i ako za ono što nije opaženo, a pripada istoj vrsti kao ono što smo opazili, važi da je tijelo ili nešto što postoji pri tijelu; i ako je ono što nije lišeno nastajanja bez sumnje samo nastalo, sastavljanjem onoga koji ga sastavlja ako je sastavljeno i razdvajanjem onoga koji ga razdvaja ako je razdvojeno; i ako se time zna da je onaj koji ga sastavlja, ako je sastavljeno, i onaj koji ga razdvaja, ako je razdvojeno, neko ko mu nije sličan i na koga se ne mogu primijeniti sastavljanje i razdvajanje — a On je Jedini, Moćni, koji spaja ono što se razlikuje, kojem ništa nije slično i koji je nad svakom stvari moćan — onda je iz onoga što smo opisali jasno da je Stvoritelj stvari i Onaj koji ih dovodi u postojanje bio prije svake stvari; da su noć i dan, vrijeme i sati nastali; i da je Onaj koji ih je doveo u postojanje, koji njima upravlja i raspolaže, bio prije njih. Jer je nemoguće da nešto dovodi nešto u postojanje, a da onaj koji ga dovodi u postojanje nije prije njega. I da u Njegovim riječima, uzvišen je Njegov spomen:","ar_ranges":[],"ar_html":"وإذا كان الأمر فيما في العالم من شيء كذلك، وكان حكم ما لم يشاهد وما هو من جنس ما شاهدنا في معنى جسم أو قائم بجسم، وكان ما لم يخل من الحدث لا شك أنه محدث بتأليف مؤلف له إن كان مجتمعا، وتفريق مفرق له إن كان مفترقا وكان معلوما بذلك أن جامع ذلك إن كان مجتمعا، ومفرقه إن كان مفترقا من لا يشبهه، ومن لا يجوز عليه الاجتماع والافتراق، وهو الواحد القادر الجامع بين المختلفات، الذي لا يشبهه شيء، وهو على كل شيء قدير- فبين بما وصفنا أن بارئ الأشياء ومحدثها كان قبل كل شيء، وأن الليل والنهار والزمان والساعات محدثات، وأن محدثها الذي يدبرها ويصرفها قبلها، إذ كان من المحال أن يكون شيء يحدث شيئا إلا ومحدثه قبله، وأن في قوله تعالى ذكره:","bs_ranges":[],"bs_html":"Ako je takvo stanje stvari koje su na svijetu i ako za ono što nije opaženo, a pripada istoj vrsti kao ono što smo opazili, važi da je tijelo ili nešto što postoji pri tijelu; i ako je ono što nije lišeno nastajanja bez sumnje samo nastalo, sastavljanjem onoga koji ga sastavlja ako je sastavljeno i razdvajanjem onoga koji ga razdvaja ako je razdvojeno; i ako se time zna da je onaj koji ga sastavlja, ako je sastavljeno, i onaj koji ga razdvaja, ako je razdvojeno, neko ko mu nije sličan i na koga se ne mogu primijeniti sastavljanje i razdvajanje — a On je Jedini, Moćni, koji spaja ono što se razlikuje, kojem ništa nije slično i koji je nad svakom stvari moćan — onda je iz onoga što smo opisali jasno da je Stvoritelj stvari i Onaj koji ih dovodi u postojanje bio prije svake stvari; da su noć i dan, vrijeme i sati nastali; i da je Onaj koji ih je doveo u postojanje, koji njima upravlja i raspolaže, bio prije njih. Jer je nemoguće da nešto dovodi nešto u postojanje, a da onaj koji ga dovodi u postojanje nije prije njega. I da u Njegovim riječima, uzvišen je Njegov spomen:"},{"id":"28.3","ar":"«أَفَلا يَنْظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ وَإِلَى السَّماءِ كَيْفَ رُفِعَتْ وَإِلَى الْجِبالِ كَيْفَ نُصِبَتْ وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ» ، لابلغ الحجج،","bs":"⟦Kur’anski navod, prijevod, 88:17–20⟧ „Zar ne gledaju kamile, kako su stvorene, i nebo, kako je podignuto, i planine, kako su postavljene, i Zemlju, kako je prostrta?“ — postoji najrječitiji dokaz,","ar_ranges":[],"ar_html":"«أَفَلا يَنْظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ وَإِلَى السَّماءِ كَيْفَ رُفِعَتْ وَإِلَى الْجِبالِ كَيْفَ نُصِبَتْ وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ» ، لابلغ الحجج،","bs_ranges":[],"bs_html":"\u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 88:17–20⟧\u003c/span> „Zar ne gledaju kamile, kako su stvorene, i nebo, kako je podignuto, i planine, kako su postavljene, i Zemlju, kako je prostrta?“ — postoji najrječitiji dokaz,"}],"notes":[]},{"n":29,"ar":"وأدل الدلائل- لمن فكر بعقل، واعتبر بفهم- على قدم بارئها، وحدوث كل ما جانسها، وأن لها خالقا لا يشبهها.\n\nوذلك أن كل ما ذكر ربنا تبارك وتعالى في هذه الآية من الجبال والأرض والإبل فإن ابن آدم يعالجه ويدبره بتحويل وتصريف وحفر ونحت وهدم، غير ممتنع عليه شيء من ذلك ثم إن ابن آدم مع ذلك غير قادر على إيجاد شيء من ذلك من غير أصل، فمعلوم أن العاجز عن إيجاد ذلك لم يحدث نفسه، وأن الذي هو غير ممتنع ممن أراد تصريفه وتقليبه لم يوجده من هو مثله، ولا هو أوجد نفسه، وأن الذي أنشأه وأوجد عينه هو الذي لا يعجزه شيء أراده، ولا يمتنع عليه إحداث شيء شاء إحداثه، وهُوَ اللَّهُ الْواحِدُ الْقَهَّارُ.\n\nفإن قال قائل: فما تنكر أن تكون الأشياء التي ذكرت من فعل قديمين؟\n\nقيل: أنكرنا ذلك لوجودنا اتصال التدبير وتمام الخلق، فقلنا: لو كان المدبر اثنين، لم يخلوا من اتفاق أو اختلاف، فإن كانا متفقين فمعناهما واحد، وإنما جعل الواحد اثنين من قال بالاثنين وإن كانا مختلفين كان محالا وجود الخلق على التمام والتدبير على الاتصال، لأن المختلفين، فعل كل واحد منهما خلاف فعل صاحبه، بأن أحدهما إذا أحيا أمات الآخر، وإذا أوجد أحدهما أفنى الآخر، فكان محالا وجود شيء من الخلق على ما وجد عليه من التمام والاتصال.\n\nوفي قول الله عز وجل ذكره: «لَوْ كانَ فِيهِما آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتا فَسُبْحانَ اللَّهِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ» ، وقوله عز وجل: «مَا اتَّخَذَ اللَّهُ مِنْ وَلَدٍ وَما كانَ مَعَهُ مِنْ إِلهٍ إِذاً لَذَهَبَ كُلُّ إِلهٍ بِما خَلَقَ وَلَعَلا بَعْضُهُمْ عَلى بَعْضٍ سُبْحانَ اللَّهِ عَمَّا يَصِفُونَ عالِمِ الْغَيْبِ وَالشَّهادَةِ فَتَعالى عَمَّا يُشْرِكُونَ»","bs":"\u003cp data-paragraph=\"29.1\">i najjasniji pokazatelj — za onoga ko razmišlja razumom i pouku uzima razumijevanjem — bespočetnosti njihova Stvoritelja, nastanka svega što je njihove vrste i toga da imaju Stvoritelja koji im nije sličan.\u003c/p>\u003cp data-paragraph=\"29.2\">Jer sve što je naš Gospodar, Blagoslovljeni i Uzvišeni, spomenuo u ovom ajetu od planina, Zemlje i kamila Ademov sin obrađuje i njime upravlja preobražavanjem, raspoređivanjem, kopanjem, klesanjem i rušenjem; ništa mu se od toga ne može oduprijeti. Uprkos tome, Ademov sin nije sposoban išta od toga dovesti u postojanje bez prethodne osnove. Poznato je, dakle, da onaj ko je nemoćan to dovesti u postojanje nije sam sebe doveo u postojanje; i da ono što se ne može oduprijeti onome ko želi njime raspolagati i preokretati ga nije doveo u postojanje neko njemu sličan, niti je ono samo sebe dovelo u postojanje. Onaj koji ga je načinio i samu njegovu bit doveo u postojanje jeste Onaj kojem ništa što želi nije nemoguće i kojem se ne može oduprijeti nastanak bilo čega što želi dovesti u postojanje. A On je Allah, Jedini, Svepotčinitelj.\u003c/p>\u003cp data-paragraph=\"29.3\">Ako neko kaže: Šta vas navodi da poričete mogućnost da su stvari koje ste spomenuli djelo dvojice bespočetnih?\u003c/p>\u003cp data-paragraph=\"29.4\">Odgovara se: To poričemo zbog toga što nalazimo povezanost upravljanja i potpunost stvaranja. Zato smo rekli: Da su upravitelja dvojica, nužno bi se ili slagali ili razilazili. Ako se slažu, njihovo je značenje jedno, i samo je onaj ko govori o dvojici jedno nazvao dvama. Ako se razilaze, nemoguće je da stvorenja postoje u potpunosti i upravljanje u povezanosti, jer kod dvojice koji se razilaze djelovanje svakoga protivi se djelovanju njegova druga: kada jedan oživljava, drugi usmrćuje; i kada jedan dovodi u postojanje, drugi uništava. Stoga bi bilo nemoguće da išta od stvorenja postoji u potpunosti i povezanosti u kojima postoji.\u003c/p>\u003cp data-paragraph=\"29.5\">A u riječima Allaha, Silan je i Uzvišen Njegov spomen: ⟦Kur’anski navod, prijevod, 21:22⟧ „Da u njima ima bogova osim Allaha, njih dvoje bi se poremetili. Pa neka je slavljen Allah, Gospodar Prijestolja, iznad onoga što opisuju.“ I u Njegovim riječima, Silan je i Uzvišen: ⟦Kur’anski navod, prijevod, 23:91–92⟧ „Allah nije uzeo nikakvo dijete i uz Njega nije bilo nikakva boga. Tada bi svaki bog otišao s onim što je stvorio i jedni bi se nad drugima uzdigli. Slavljen neka je Allah, iznad onoga što opisuju, Poznavalac nevidljivoga i vidljivoga, uzvišen je iznad onoga što Mu pridružuju“\u003c/p>","paragraphs":[{"id":"29.1","ar":"وأدل الدلائل- لمن فكر بعقل، واعتبر بفهم- على قدم بارئها، وحدوث كل ما جانسها، وأن لها خالقا لا يشبهها.","bs":"i najjasniji pokazatelj — za onoga ko razmišlja razumom i pouku uzima razumijevanjem — bespočetnosti njihova Stvoritelja, nastanka svega što je njihove vrste i toga da imaju Stvoritelja koji im nije sličan.","ar_ranges":[],"ar_html":"وأدل الدلائل- لمن فكر بعقل، واعتبر بفهم- على قدم بارئها، وحدوث كل ما جانسها، وأن لها خالقا لا يشبهها.","bs_ranges":[],"bs_html":"i najjasniji pokazatelj — za onoga ko razmišlja razumom i pouku uzima razumijevanjem — bespočetnosti njihova Stvoritelja, nastanka svega što je njihove vrste i toga da imaju Stvoritelja koji im nije sličan."},{"id":"29.2","ar":"وذلك أن كل ما ذكر ربنا تبارك وتعالى في هذه الآية من الجبال والأرض والإبل فإن ابن آدم يعالجه ويدبره بتحويل وتصريف وحفر ونحت وهدم، غير ممتنع عليه شيء من ذلك ثم إن ابن آدم مع ذلك غير قادر على إيجاد شيء من ذلك من غير أصل، فمعلوم أن العاجز عن إيجاد ذلك لم يحدث نفسه، وأن الذي هو غير ممتنع ممن أراد تصريفه وتقليبه لم يوجده من هو مثله، ولا هو أوجد نفسه، وأن الذي أنشأه وأوجد عينه هو الذي لا يعجزه شيء أراده، ولا يمتنع عليه إحداث شيء شاء إحداثه، وهُوَ اللَّهُ الْواحِدُ الْقَهَّارُ.","bs":"Jer sve što je naš Gospodar, Blagoslovljeni i Uzvišeni, spomenuo u ovom ajetu od planina, Zemlje i kamila Ademov sin obrađuje i njime upravlja preobražavanjem, raspoređivanjem, kopanjem, klesanjem i rušenjem; ništa mu se od toga ne može oduprijeti. Uprkos tome, Ademov sin nije sposoban išta od toga dovesti u postojanje bez prethodne osnove. Poznato je, dakle, da onaj ko je nemoćan to dovesti u postojanje nije sam sebe doveo u postojanje; i da ono što se ne može oduprijeti onome ko želi njime raspolagati i preokretati ga nije doveo u postojanje neko njemu sličan, niti je ono samo sebe dovelo u postojanje. Onaj koji ga je načinio i samu njegovu bit doveo u postojanje jeste Onaj kojem ništa što želi nije nemoguće i kojem se ne može oduprijeti nastanak bilo čega što želi dovesti u postojanje. A On je Allah, Jedini, Svepotčinitelj.","ar_ranges":[],"ar_html":"وذلك أن كل ما ذكر ربنا تبارك وتعالى في هذه الآية من الجبال والأرض والإبل فإن ابن آدم يعالجه ويدبره بتحويل وتصريف وحفر ونحت وهدم، غير ممتنع عليه شيء من ذلك ثم إن ابن آدم مع ذلك غير قادر على إيجاد شيء من ذلك من غير أصل، فمعلوم أن العاجز عن إيجاد ذلك لم يحدث نفسه، وأن الذي هو غير ممتنع ممن أراد تصريفه وتقليبه لم يوجده من هو مثله، ولا هو أوجد نفسه، وأن الذي أنشأه وأوجد عينه هو الذي لا يعجزه شيء أراده، ولا يمتنع عليه إحداث شيء شاء إحداثه، وهُوَ اللَّهُ الْواحِدُ الْقَهَّارُ.","bs_ranges":[],"bs_html":"Jer sve što je naš Gospodar, Blagoslovljeni i Uzvišeni, spomenuo u ovom ajetu od planina, Zemlje i kamila Ademov sin obrađuje i njime upravlja preobražavanjem, raspoređivanjem, kopanjem, klesanjem i rušenjem; ništa mu se od toga ne može oduprijeti. Uprkos tome, Ademov sin nije sposoban išta od toga dovesti u postojanje bez prethodne osnove. Poznato je, dakle, da onaj ko je nemoćan to dovesti u postojanje nije sam sebe doveo u postojanje; i da ono što se ne može oduprijeti onome ko želi njime raspolagati i preokretati ga nije doveo u postojanje neko njemu sličan, niti je ono samo sebe dovelo u postojanje. Onaj koji ga je načinio i samu njegovu bit doveo u postojanje jeste Onaj kojem ništa što želi nije nemoguće i kojem se ne može oduprijeti nastanak bilo čega što želi dovesti u postojanje. A On je Allah, Jedini, Svepotčinitelj."},{"id":"29.3","ar":"فإن قال قائل: فما تنكر أن تكون الأشياء التي ذكرت من فعل قديمين؟","bs":"Ako neko kaže: Šta vas navodi da poričete mogućnost da su stvari koje ste spomenuli djelo dvojice bespočetnih?","ar_ranges":[],"ar_html":"فإن قال قائل: فما تنكر أن تكون الأشياء التي ذكرت من فعل قديمين؟","bs_ranges":[],"bs_html":"Ako neko kaže: Šta vas navodi da poričete mogućnost da su stvari koje ste spomenuli djelo dvojice bespočetnih?"},{"id":"29.4","ar":"قيل: أنكرنا ذلك لوجودنا اتصال التدبير وتمام الخلق، فقلنا: لو كان المدبر اثنين، لم يخلوا من اتفاق أو اختلاف، فإن كانا متفقين فمعناهما واحد، وإنما جعل الواحد اثنين من قال بالاثنين وإن كانا مختلفين كان محالا وجود الخلق على التمام والتدبير على الاتصال، لأن المختلفين، فعل كل واحد منهما خلاف فعل صاحبه، بأن أحدهما إذا أحيا أمات الآخر، وإذا أوجد أحدهما أفنى الآخر، فكان محالا وجود شيء من الخلق على ما وجد عليه من التمام والاتصال.","bs":"Odgovara se: To poričemo zbog toga što nalazimo povezanost upravljanja i potpunost stvaranja. Zato smo rekli: Da su upravitelja dvojica, nužno bi se ili slagali ili razilazili. Ako se slažu, njihovo je značenje jedno, i samo je onaj ko govori o dvojici jedno nazvao dvama. Ako se razilaze, nemoguće je da stvorenja postoje u potpunosti i upravljanje u povezanosti, jer kod dvojice koji se razilaze djelovanje svakoga protivi se djelovanju njegova druga: kada jedan oživljava, drugi usmrćuje; i kada jedan dovodi u postojanje, drugi uništava. Stoga bi bilo nemoguće da išta od stvorenja postoji u potpunosti i povezanosti u kojima postoji.","ar_ranges":[],"ar_html":"قيل: أنكرنا ذلك لوجودنا اتصال التدبير وتمام الخلق، فقلنا: لو كان المدبر اثنين، لم يخلوا من اتفاق أو اختلاف، فإن كانا متفقين فمعناهما واحد، وإنما جعل الواحد اثنين من قال بالاثنين وإن كانا مختلفين كان محالا وجود الخلق على التمام والتدبير على الاتصال، لأن المختلفين، فعل كل واحد منهما خلاف فعل صاحبه، بأن أحدهما إذا أحيا أمات الآخر، وإذا أوجد أحدهما أفنى الآخر، فكان محالا وجود شيء من الخلق على ما وجد عليه من التمام والاتصال.","bs_ranges":[],"bs_html":"Odgovara se: To poričemo zbog toga što nalazimo povezanost upravljanja i potpunost stvaranja. Zato smo rekli: Da su upravitelja dvojica, nužno bi se ili slagali ili razilazili. Ako se slažu, njihovo je značenje jedno, i samo je onaj ko govori o dvojici jedno nazvao dvama. Ako se razilaze, nemoguće je da stvorenja postoje u potpunosti i upravljanje u povezanosti, jer kod dvojice koji se razilaze djelovanje svakoga protivi se djelovanju njegova druga: kada jedan oživljava, drugi usmrćuje; i kada jedan dovodi u postojanje, drugi uništava. Stoga bi bilo nemoguće da išta od stvorenja postoji u potpunosti i povezanosti u kojima postoji."},{"id":"29.5","ar":"وفي قول الله عز وجل ذكره: «لَوْ كانَ فِيهِما آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتا فَسُبْحانَ اللَّهِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ» ، وقوله عز وجل: «مَا اتَّخَذَ اللَّهُ مِنْ وَلَدٍ وَما كانَ مَعَهُ مِنْ إِلهٍ إِذاً لَذَهَبَ كُلُّ إِلهٍ بِما خَلَقَ وَلَعَلا بَعْضُهُمْ عَلى بَعْضٍ سُبْحانَ اللَّهِ عَمَّا يَصِفُونَ عالِمِ الْغَيْبِ وَالشَّهادَةِ فَتَعالى عَمَّا يُشْرِكُونَ»","bs":"A u riječima Allaha, Silan je i Uzvišen Njegov spomen: ⟦Kur’anski navod, prijevod, 21:22⟧ „Da u njima ima bogova osim Allaha, njih dvoje bi se poremetili. Pa neka je slavljen Allah, Gospodar Prijestolja, iznad onoga što opisuju.“ I u Njegovim riječima, Silan je i Uzvišen: ⟦Kur’anski navod, prijevod, 23:91–92⟧ „Allah nije uzeo nikakvo dijete i uz Njega nije bilo nikakva boga. Tada bi svaki bog otišao s onim što je stvorio i jedni bi se nad drugima uzdigli. Slavljen neka je Allah, iznad onoga što opisuju, Poznavalac nevidljivoga i vidljivoga, uzvišen je iznad onoga što Mu pridružuju“","ar_ranges":[],"ar_html":"وفي قول الله عز وجل ذكره: «لَوْ كانَ فِيهِما آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتا فَسُبْحانَ اللَّهِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ» ، وقوله عز وجل: «مَا اتَّخَذَ اللَّهُ مِنْ وَلَدٍ وَما كانَ مَعَهُ مِنْ إِلهٍ إِذاً لَذَهَبَ كُلُّ إِلهٍ بِما خَلَقَ وَلَعَلا بَعْضُهُمْ عَلى بَعْضٍ سُبْحانَ اللَّهِ عَمَّا يَصِفُونَ عالِمِ الْغَيْبِ وَالشَّهادَةِ فَتَعالى عَمَّا يُشْرِكُونَ»","bs_ranges":[],"bs_html":"A u riječima Allaha, Silan je i Uzvišen Njegov spomen: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 21:22⟧\u003c/span> „Da u njima ima bogova osim Allaha, njih dvoje bi se poremetili. Pa neka je slavljen Allah, Gospodar Prijestolja, iznad onoga što opisuju.“ I u Njegovim riječima, Silan je i Uzvišen: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 23:91–92⟧\u003c/span> „Allah nije uzeo nikakvo dijete i uz Njega nije bilo nikakva boga. Tada bi svaki bog otišao s onim što je stvorio i jedni bi se nad drugima uzdigli. Slavljen neka je Allah, iznad onoga što opisuju, Poznavalac nevidljivoga i vidljivoga, uzvišen je iznad onoga što Mu pridružuju“"}],"notes":[]},{"n":30,"ar":"أبلغ حجة، وأوجز بيان، وأدل دليل على بطول ما قاله المبطلون من أهل الشرك بالله، وذلك أن السموات والأرض لو كان فيهما إله غير الله، لم يخل أمرهما مما وصفت من اتفاق واختلاف وفي القول باتفاقهما فساد القول بالتثنية، وإقرار بالتوحيد، وإحالة في الكلام بأن قائله سمى الواحد اثنين وفي القول باختلافهما، القول بفساد السموات والأرض، كما قال ربنا جل وعز: «لَوْ كانَ فِيهِما آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتا» لأن أحدهما كان إذا أحدث شيئا وخلقه كان من شأن الآخر إعدامه وإبطاله، وذلك أن كل مختلفين فأفعالهما مختلفة، كالنار التي تسخن، والثلج الذي يبرد ما أسخنته النار وأخرى، أن ذلك لو كان كما قاله المشركون بالله لم يخل كل واحد من الاثنين اللذين أثبتوهما قديمين من أن يكونا قويين او عاجزين، فان كانا عاجزين فالعاجز مقهور وغير كائن إلها وإن كانا قويين فإن كل واحد منهما بعجزه عن صاحبه عاجز، والعاجز لا يكون إلها وإن كان كل واحد منهما قويا على صاحبه عاجز، والعاجز لا يكون إلها وإن كان كل واحد منهما قويا على صاحبه، فهو بقوة صاحبه عليه عاجز، تعالى ذكره عما يشرك المشركون! فتبين إذا أن القديم بارئ الأشياء وصانعها هو الواحد الذي كان قبل كل شيء، وهو الكائن بعد كل شيء، والأول قبل كل شيء، والآخر بعد كل شيء، وأنه كان ولا وقت ولا زمان، ولا ليل ولا نهار، ولا ظلمة ولا نور إلا نور وجهه الكريم ولا سماء ولا أرض، ولا شمس ولا قمر ولا نجوم، وأن كل شيء سواه محدث مدبر مصنوع، انفرد بخلق جميعه بغير شريك ولا معين ولا ظهير، سبحانه من قادر قاهر! وقد حَدَّثَنِي عَلِيُّ بْنُ سَهْلٍ الرَّمْلِيُّ، قَالَ: حَدَّثَنَا زَيْدُ بْنُ أَبِي الزَّرْقَاءِ، عَنْ جَعْفَرٍ، عَنْ يَزِيدَ بْنِ الأَصَمِّ، عَنْ أَبِي هريرة، [ان النبي ص قال:","bs":"\u003cp data-paragraph=\"30.1\">nalazi se najrječitiji dokaz, najsažetije objašnjenje i najjasniji pokazatelj nevaljanosti onoga što tvrde zagovornici neistine među onima koji Allahu pridružuju sudruge. Jer kada bi na nebesima i Zemlji postojao bog osim Allaha, njihovo stanje nužno bi bilo onakvo kakvo sam opisao: slaganje ili razilaženje. Tvrdnja da se slažu ruši tvrdnju o dvojstvu, priznaje jednoću i sadrži proturječje u govoru, jer je onaj koji to tvrdi jedno nazvao dvama. A tvrdnja da se razilaze znači tvrdnju o poremećaju nebesa i Zemlje, kao što je naš Gospodar, Veličanstveni i Silni, rekao: ⟦Kur’anski navod, prijevod, 21:22, dio⟧ „Da u njima ima bogova osim Allaha, njih dvoje bi se poremetili.“ Jer kada bi jedan od njih nešto doveo u postojanje i stvorio, drugome bi pripadalo da to učini nepostojećim i poništi. Kod svake dvojice koji se razilaze i njihova se djelovanja razlikuju, poput vatre koja zagrijava i snijega koji hladi ono što je vatra zagrijala. I još: kada bi bilo onako kako govore oni koji Allahu pridružuju sudruge, svaki od dvojice za koje tvrde da su bespočetni nužno bi bio ili moćan ili nemoćan. Ako su nemoćni, nemoćni je potčinjen i nije bog. Ako su moćni, svaki je od njih, zbog svoje nemoći prema drugome, nemoćan, a nemoćni ne može biti bog. I ako je svaki od njih moćan prema drugome, nemoćan je, a nemoćni ne može biti bog. I ako je svaki od njih moćan prema drugome, on je usljed moći svoga druga nad njim nemoćan. Uzvišen je Njegov spomen iznad onoga što mnogobošci pridružuju! Time je, dakle, jasno da je Bespočetni, Stvoritelj i Tvorac stvari, Jedini koji je bio prije svake stvari i koji će biti nakon svake stvari; Prvi prije svake stvari i Posljednji nakon svake stvari. On je bio, a nije bilo ni vremenskog trenutka ni vremena, ni noći ni dana, ni tame ni svjetla osim svjetla Njegova plemenitog lica, ni neba ni Zemlje, ni Sunca ni Mjeseca ni zvijezda. Sve osim Njega nastalo je, pod upravom je i načinjeno. On je sam stvorio sve to bez sudruga, pomagača ili potpore. Slavljen neka je, Moćni, Svepotčinitelj! Pričao mi je Ali ibn Sehl er-Remli, rekao je: Pričao nam je Zejd ibn Ebi ez-Zerka, od Džafera, od Jezida ibn el-Esamma, od Ebu Hurejre, [da je Vjerovjesnik, neka mu Allah podari blagoslov i mir, rekao:\u003c/p>\u003cp class=\"small\" style=\"color:#53675c\">⟦Napomena prevodioca: u argumentu o dvojici moćnih dostupni arapski prijepis ponavlja slične rečenice i na jednom mjestu ima nespretan spoj „قويا على صاحبه عاجز“. Ponavljanje i taj spoj ovdje su preneseni, bez izostavljanja ili dopunjavanja. Predaja na kraju stranice nastavlja se na stranici 31.⟧\u003c/p>","paragraphs":[{"id":"30.1","ar":"أبلغ حجة، وأوجز بيان، وأدل دليل على بطول ما قاله المبطلون من أهل الشرك بالله، وذلك أن السموات والأرض لو كان فيهما إله غير الله، لم يخل أمرهما مما وصفت من اتفاق واختلاف وفي القول باتفاقهما فساد القول بالتثنية، وإقرار بالتوحيد، وإحالة في الكلام بأن قائله سمى الواحد اثنين وفي القول باختلافهما، القول بفساد السموات والأرض، كما قال ربنا جل وعز: «لَوْ كانَ فِيهِما آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتا» لأن أحدهما كان إذا أحدث شيئا وخلقه كان من شأن الآخر إعدامه وإبطاله، وذلك أن كل مختلفين فأفعالهما مختلفة، كالنار التي تسخن، والثلج الذي يبرد ما أسخنته النار وأخرى، أن ذلك لو كان كما قاله المشركون بالله لم يخل كل واحد من الاثنين اللذين أثبتوهما قديمين من أن يكونا قويين او عاجزين، فان كانا عاجزين فالعاجز مقهور وغير كائن إلها وإن كانا قويين فإن كل واحد منهما بعجزه عن صاحبه عاجز، والعاجز لا يكون إلها وإن كان كل واحد منهما قويا على صاحبه عاجز، والعاجز لا يكون إلها وإن كان كل واحد منهما قويا على صاحبه، فهو بقوة صاحبه عليه عاجز، تعالى ذكره عما يشرك المشركون! فتبين إذا أن القديم بارئ الأشياء وصانعها هو الواحد الذي كان قبل كل شيء، وهو الكائن بعد كل شيء، والأول قبل كل شيء، والآخر بعد كل شيء، وأنه كان ولا وقت ولا زمان، ولا ليل ولا نهار، ولا ظلمة ولا نور إلا نور وجهه الكريم ولا سماء ولا أرض، ولا شمس ولا قمر ولا نجوم، وأن كل شيء سواه محدث مدبر مصنوع، انفرد بخلق جميعه بغير شريك ولا معين ولا ظهير، سبحانه من قادر قاهر! وقد حَدَّثَنِي عَلِيُّ بْنُ سَهْلٍ الرَّمْلِيُّ، قَالَ: حَدَّثَنَا زَيْدُ بْنُ أَبِي الزَّرْقَاءِ، عَنْ جَعْفَرٍ، عَنْ يَزِيدَ بْنِ الأَصَمِّ، عَنْ أَبِي هريرة، [ان النبي ص قال:","bs":"nalazi se najrječitiji dokaz, najsažetije objašnjenje i najjasniji pokazatelj nevaljanosti onoga što tvrde zagovornici neistine među onima koji Allahu pridružuju sudruge. Jer kada bi na nebesima i Zemlji postojao bog osim Allaha, njihovo stanje nužno bi bilo onakvo kakvo sam opisao: slaganje ili razilaženje. Tvrdnja da se slažu ruši tvrdnju o dvojstvu, priznaje jednoću i sadrži proturječje u govoru, jer je onaj koji to tvrdi jedno nazvao dvama. A tvrdnja da se razilaze znači tvrdnju o poremećaju nebesa i Zemlje, kao što je naš Gospodar, Veličanstveni i Silni, rekao: ⟦Kur’anski navod, prijevod, 21:22, dio⟧ „Da u njima ima bogova osim Allaha, njih dvoje bi se poremetili.“ Jer kada bi jedan od njih nešto doveo u postojanje i stvorio, drugome bi pripadalo da to učini nepostojećim i poništi. Kod svake dvojice koji se razilaze i njihova se djelovanja razlikuju, poput vatre koja zagrijava i snijega koji hladi ono što je vatra zagrijala. I još: kada bi bilo onako kako govore oni koji Allahu pridružuju sudruge, svaki od dvojice za koje tvrde da su bespočetni nužno bi bio ili moćan ili nemoćan. Ako su nemoćni, nemoćni je potčinjen i nije bog. Ako su moćni, svaki je od njih, zbog svoje nemoći prema drugome, nemoćan, a nemoćni ne može biti bog. I ako je svaki od njih moćan prema drugome, nemoćan je, a nemoćni ne može biti bog. I ako je svaki od njih moćan prema drugome, on je usljed moći svoga druga nad njim nemoćan. Uzvišen je Njegov spomen iznad onoga što mnogobošci pridružuju! Time je, dakle, jasno da je Bespočetni, Stvoritelj i Tvorac stvari, Jedini koji je bio prije svake stvari i koji će biti nakon svake stvari; Prvi prije svake stvari i Posljednji nakon svake stvari. On je bio, a nije bilo ni vremenskog trenutka ni vremena, ni noći ni dana, ni tame ni svjetla osim svjetla Njegova plemenitog lica, ni neba ni Zemlje, ni Sunca ni Mjeseca ni zvijezda. Sve osim Njega nastalo je, pod upravom je i načinjeno. On je sam stvorio sve to bez sudruga, pomagača ili potpore. Slavljen neka je, Moćni, Svepotčinitelj! Pričao mi je Ali ibn Sehl er-Remli, rekao je: Pričao nam je Zejd ibn Ebi ez-Zerka, od Džafera, od Jezida ibn el-Esamma, od Ebu Hurejre, [da je Vjerovjesnik, neka mu Allah podari blagoslov i mir, rekao:","ar_ranges":[[1315,1473]],"ar_html":"أبلغ حجة، وأوجز بيان، وأدل دليل على بطول ما قاله المبطلون من أهل الشرك بالله، وذلك أن السموات والأرض لو كان فيهما إله غير الله، لم يخل أمرهما مما وصفت من اتفاق واختلاف وفي القول باتفاقهما فساد القول بالتثنية، وإقرار بالتوحيد، وإحالة في الكلام بأن قائله سمى الواحد اثنين وفي القول باختلافهما، القول بفساد السموات والأرض، كما قال ربنا جل وعز: «لَوْ كانَ فِيهِما آلِهَةٌ إِلَّا اللَّهُ لَفَ ، قَالَ: قَالَ يَزِيدُ بْنُ الأَصَمِّ:\nحَدَّثَنِي نَجَبَةُ بْنُ صَبِيغٍ، قَالَ: كُنْتُ عِنْدَ أَبِي هُرَيْرَةَ فَسَأَلُوهُ عَنْ هَذَا فَكَبَّرَ وَقَالَ:\n\nمَا حَدَّثَنِي خَلِيلِي بِشَيْءٍ إِلا قَدْ رَأَيْتُهُ- أَوْ أَنَا أَنْتَظِرُهُ قَالَ جَعْفَرٌ: فَبَلَغَنِي أَنَّهُ قَالَ: إِذَا سَأَلَكُمُ النَّاسُ عَنْ هذا فقولوا: الله خالق كل شيء، والله كَانَ قَبْلَ كُلِّ شَيْءٍ، وَاللَّهُ كَائِنٌ بَعْدَ كُلِّ شَيْءٍ.\n\nفَإِذَا كَانَ مَعْلُومًا أَنَّ خَالِقَ الأَشْيَاءِ وَبَارِئَهَا كَانَ وَلا شَيْءَ غَيْرَهُ، وَأَنَّهُ أَحْدَثَ الأَشْيَاءَ فَدَبَّرَهَا، وَأَنَّهُ قَدْ خَلَقَ صُنُوفًا مِنْ خَلْقِهِ قَبْلَ خَلْقِ الأَزْمِنَةِ وَالأَوْقَاتِ، وَقَبْلَ خَلْقِ الشَّمْسِ وَالْقَمَرِ اللَّذَيْنِ يُجْرِيهِمَا فِي أَفْلاكِهِمَا، وَبِهِمَا عُرِفَتِ الأَوْقَاتِ وَالسَّاعَاتِ، وَأُرِّخَتِ التَّأْرِيخَاتِ، وَفُصِلَ بين الليل والنهار، فلنقل: فيم ذَلِكَ الْخَلْقُ الَّذِي خُلِقَ قَبْلَ ذَلِكَ؟ وَمَا كان اوله؟","bs":"\u003cp class=\"small\" style=\"color:#53675c\">Početak stranice nastavlja predaju sa stranice 30.\u003c/p>\u003cp data-paragraph=\"31.1\">„Vi ćete poslije mene pitati o svemu, sve dok neko ne kaže: ‘Ovaj Allah stvorio je sve, pa ko je onda Njega stvorio?’“\u003c/p>\u003cp data-paragraph=\"31.2\">Pričao mi je Ali: pričao nam je Zejd, od Džafera, koji je rekao: Jezid ibn el-Esamm rekao je: pričao mi je Nedžeba ibn Sabig: „Bio sam kod Ebu Hurejre pa su ga o tome pitali. On je izgovorio tekbir i rekao: ‘Nema ničega o čemu mi je pričao moj prisni prijatelj a da to već nisam vidio — ili da to ne očekujem.’“ Džafer je rekao: „Do mene je doprlo da je rekao: ‘Kada vas ljudi o tome pitaju, recite: Allah je Stvoritelj svega; Allah je bio prije svega i Allah ostaje poslije svega.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: ime نَجَبَةُ بْنُ صَبِيغٍ preneseno je prema zapisu ovog izvora; njegovo čitanje nije ovdje nezavisno potvrđeno.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"31.3\">Budući da je poznato da je Stvoritelj i Tvorac svega postojao kada nije bilo ničega osim Njega, da je On stvari doveo u postojanje i njima upravljao, te da je neke vrste Svojih stvorenja stvorio prije stvaranja vremena i vremenskih razdoblja, prije stvaranja Sunca i Mjeseca, koje pokreće njihovim putanjama i pomoću kojih su se upoznavali vremenski odsječci i sati, određivali datumi i razlikovali noć i dan, govorimo sada o tome: šta je to stvoreno prije toga i šta je od toga bilo prvo?\u003c/p>","paragraphs":[{"id":"31.1","ar":"إِنَّكُمْ تَسْأَلُونَ بَعْدِي عَنْ كُلِّ شَيْءٍ، حَتَّى يَقُولُ الْقَائِلُ: هَذَا اللَّهُ خَلَقَ كُلَّ شَيْءٍ فمن ذا خلقه!] .","bs":"„Vi ćete poslije mene pitati o svemu, sve dok neko ne kaže: ‘Ovaj Allah stvorio je sve, pa ko je onda Njega stvorio?’“","ar_ranges":[],"ar_html":"إِنَّكُمْ تَسْأَلُونَ بَعْدِي عَنْ كُلِّ شَيْءٍ، حَتَّى يَقُولُ الْقَائِلُ: هَذَا اللَّهُ خَلَقَ كُلَّ شَيْءٍ فمن ذا خلقه!] .","bs_ranges":[],"bs_html":"„Vi ćete poslije mene pitati o svemu, sve dok neko ne kaže: ‘Ovaj Allah stvorio je sve, pa ko je onda Njega stvorio?’“"},{"id":"31.2","ar":"حدثنى على، حَدَّثَنَا زَيْدٌ، عَنْ جَعْفَرٍ، قَالَ: قَالَ يَزِيدُ بْنُ الأَصَمِّ:\nحَدَّثَنِي نَجَبَةُ بْنُ صَبِيغٍ، قَالَ: كُنْتُ عِنْدَ أَبِي هُرَيْرَةَ فَسَأَلُوهُ عَنْ هَذَا فَكَبَّرَ وَقَالَ:\n\nمَا حَدَّثَنِي خَلِيلِي بِشَيْءٍ إِلا قَدْ رَأَيْتُهُ- أَوْ أَنَا أَنْتَظِرُهُ قَالَ جَعْفَرٌ: فَبَلَغَنِي أَنَّهُ قَالَ: إِذَا سَأَلَكُمُ النَّاسُ عَنْ هذا فقولوا: الله خالق كل شيء، والله كَانَ قَبْلَ كُلِّ شَيْءٍ، وَاللَّهُ كَائِنٌ بَعْدَ كُلِّ شَيْءٍ.","bs":"Pričao mi je Ali: pričao nam je Zejd, od Džafera, koji je rekao: Jezid ibn el-Esamm rekao je: pričao mi je Nedžeba ibn Sabig: „Bio sam kod Ebu Hurejre pa su ga o tome pitali. On je izgovorio tekbir i rekao: ‘Nema ničega o čemu mi je pričao moj prisni prijatelj a da to već nisam vidio — ili da to ne očekujem.’“ Džafer je rekao: „Do mene je doprlo da je rekao: ‘Kada vas ljudi o tome pitaju, recite: Allah je Stvoritelj svega; Allah je bio prije svega i Allah ostaje poslije svega.’“ ⟦Napomena prevodioca: ime نَجَبَةُ بْ
