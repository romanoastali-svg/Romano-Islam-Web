stranica":98,"ar_tekst":"حَدَّثَنَا الْقَاسِمُ بْنُ الْحَسَنِ، قَالَ: حدثنا الحسين بن داود، قَالَ: حَدَّثَنَا حَجَّاجٌ، عَنْ جَرِيرِ بْنِ حَازِمٍ ومبارك، عن الحسن وأبي بكر، عن الحسن وَقَتَادَةَ، قَالا: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، هَذِهِ الخيل، وهذه البغال، والإبل، والجن، والوحش، وجعل يسمي كل شيء برسمه.","bs_tekst":"Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao nam je Hadždžadž, od Džerira ibn Hazima i Mubareka, od Hasena i Ebu Bekra, od Hasena i Katade; obojica su rekli: „Poučio ga je imenu svega: ovo su konji, ovo su mazge, deve, džini i divlje životinje. Svaku je stvar počeo imenovati njenim nazivom.“ ⟦Napomena prevodioca: niz عن جرير بن حازم ومبارك، عن الحسن وأبي بكر، عن الحسن وقتادة prenesen je navedenim redom, uključujući ponovljeno ime Hasen. Veze između grana ovog lanca nisu prešutno preuređene.⟧"},{"stranica":98,"ar_tekst":"وقال آخرون: بل إنما علم اسما خاصا من الأسماء، قالوا: والذي علمه أسماء الملائكة.","bs_tekst":"Drugi su rekli: „Naprotiv, poučen je samo određenim imenima.“ Rekli su: „Ono čemu je poučen jesu imena meleka.“"},{"stranica":98,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذلك:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":99,"ar_tekst":"حَدَّثَنِي عَبْدَةُ الْمَرْوَزِيُّ، قَالَ: حَدَّثَنَا عَمَّارُ بْنُ الحسن، قال: حدثنا عبد الله بن أبي جَعْفَرٍ، عَنْ أَبِيهِ، عَنِ الرَّبِيعِ، قَوْلُهُ تعالى: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: أَسْمَاءُ الْمَلائِكَةِ.","bs_tekst":"Pričao mi je Abde el-Mervezi, koji je rekao: pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, o riječima Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Imenima meleka.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧"},{"stranica":99,"ar_tekst":"وَقَالَ آخَرُونَ مِثْلَ قَوْلِ هَؤُلاءِ فِي أَنَّ الَّذِي عُلِّمَ آدَمَ مِنَ الأَسْمَاءِ اسْمًا خَاصًّا مِنَ الأَشْيَاءِ، غَيْرَ أَنَّهُمْ قَالُوا: الَّذِي عُلِّمَ مِنْ ذَلِكَ أَسْمَاءَ ذُرِّيَّتِهِ.","bs_tekst":"Drugi su rekli isto što i ovi, da je Adem od imena poučen imenima samo određenih stvari, ali su kazali: „Poučen je imenima svojih potomaka.“"},{"stranica":99,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":99,"ar_tekst":"حَدَّثَنِي يُونُسُ، قَالَ: حَدَّثَنَا ابْنُ وَهْبٍ، قَالَ: قَالَ ابْنُ زَيْدٍ فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: أَسْمَاءَ ذُرِّيَّتِهِ،","bs_tekst":"Pričao mi je Junus, koji je rekao: pričao nam je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima“: „Imenima njegovih potomaka.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧"},{"stranica":99,"ar_tekst":"فَلَمَّا «عَلَّمَ اللَّهُ آدَمَ الْأَسْماءَ كُلَّها» عَرَضَ اللَّهُ عَزَّ وَجَلَّ أَهْلَ الأَسْمَاءِ عَلَى الْمَلائِكَةِ، فَقَالَ لَهُمْ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» ، وإنما قال ذلك عز وجل للملائكة- فيما ذكر- لقولهم إذ قال لهم: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» : «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ» فعرض- بعد ان خلق آدم ع ونفخ فيه الروح، وعلمه أسماء كل شيء- مما خلق من الخلق- عليهم، فقال لهم:\n«أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» أني إن جعلت منكم خليفتي في الأرض أطعتموني وسبحتموني وقدستموني ولم تعصوني، وإن جعلته من غيركم أفسد فيها وسفك، فإنكم إن لم تعلموا ما أسماؤهم وأنتم مشاهدوهم ومعاينوهم، فأنتم بألا تعلموا ما يكون من أمركم- إن جعلت خليفتي في الأرض منكم، أو من غيركم إن جعلته من غيركم، فهم عن أبصاركم غُيَّبٌ لا ترونهم ولا تعاينونهم، ولم تخبروا بما هو كائن منكم ومنهم- أحرى","bs_tekst":"Kada je Allah poučio Adema svim imenima, Allah, Silan i Uzvišen, pokazao je melekima nosioce tih imena i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite.“ Prema onome što je navedeno, On, Silan i Uzvišen, rekao je to melekima zbog njihovih riječi kada im je rekao: „Ja ću na Zemlji postaviti namjesnika“, a oni odgovorili: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo?“ Nakon što je stvorio Adema, alejhis-selam, udahnuo u njega duh i poučio ga imenu svega od stvorenja koja je stvorio, pokazao ih je melekima i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite“ — u tvrdnji da biste, kada bih nekoga od vas učinio Svojim namjesnikom na Zemlji, bili Meni pokorni, slavili Me, iskazivali Mi svetost i ne biste Mi bili nepokorni, a da bi, ako ga učinim od drugih, na njoj činio nered i prolijevao krv. Ako ne znate njihova imena dok ih gledate i vidite vlastitim očima, onda još manje možete znati kakvo bi bilo vaše stanje kada bih Svoga namjesnika na Zemlji učinio od vas, ili stanje drugih kada bih ga učinio od drugih, dok su oni skriveni od vaših očiju, ne vidite ih niti ih posmatrate, a niste obaviješteni o tome šta će biti od vas i od njih. ⟦Prijevodi izričitih kur’anskih navoda: El-Bekara, 2:30–31. Navod u izvoru علم الله آدم الأسماء كلها prenosi formulaciju predaje. Objašnjenje poslije posljednjeg „ako istinu govorite“ pripada autorovom izlaganju.⟧"},{"stranica":100,"ar_tekst":"وهذا قول روي عن جماعة من السلف.","bs_tekst":"Ovo mišljenje preneseno je od jedne skupine prethodnika."},{"stranica":100,"ar_tekst":"ذكر بعض من روي ذلك عنه:","bs_tekst":"Spomen nekih od kojih je to preneseno:"},{"stranica":100,"ar_tekst":"حَدَّثَنِي مُوسَى بْنُ هَارُونَ، قَالَ: حَدَّثَنِي عَمْرُو بْنُ حماد، قال:\nحدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن عبد الله بن مسعود- وعن ناس من اصحاب النبي ص: «إِنْ كُنْتُمْ صادِقِينَ» أَنَّ بَنِي آدَمَ يُفْسِدُونَ فِي الأَرْضِ وَيَسْفِكُونَ الدِّمَاءَ.","bs_tekst":"Pričao mi je Musa ibn Harun, koji je rekao: pričao mi je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, o riječima: „Ako istinu govorite“ — da će Ademovi potomci činiti nered na Zemlji i prolijevati krv. ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧"},{"stranica":100,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ:\n\n«إِنْ كُنْتُمْ صادِقِينَ» ، إِنْ كُنْتُمْ تَعْلَمُونَ لَمْ أَجْعَلْ فِي الأَرْضِ خَلِيفَةً.","bs_tekst":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, o riječima: „Ako istinu govorite“ — ako znate zašto ću na Zemlji postaviti namjesnika. ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Napomena prevodioca: لم أجعل ovdje je prema kontekstu pročitano kao لِمَ أجعل, „zašto ću postaviti“; izvor nema oznake koje bi ovo čitanje izričito razriješile.⟧"},{"stranica":100,"ar_tekst":"وَقَدْ قِيلَ: إِنَّ اللَّهَ جَلَّ جَلالَهُ قَالَ ذَلِكَ لِلْمَلائِكَةِ لأَنَّهُ جَلَّ جَلالَهُ لَمَّا ابْتَدَأَ فِي خَلْقِ آدَمَ قَالُوا فِيمَا بَيْنَهُمْ: لِيَخْلُقُ رَبُّنَا مَا شَاءَ أَنْ يَخْلُقَ، فَلَنْ يخلق خلقا إلا كنا أعلم منه، وأكرم عليه منه، فلما خلق آدم ع وَعَلَّمَهُ أَسْمَاءَ كُلَّ شَيْءٍ عَرَضَ الأَشْيَاءَ الَّتِي علم آدم أسمائها عليهم، فقال لهم: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» فِي قِيلِكُمْ: إِنَّ اللَّهَ لَمْ يَخْلُقْ خَلْقًا إِلا كُنْتُمْ أَعْلَمَ مِنْهُ، وَأَكْرَمَ عَلَيْهِ مِنْهُ.","bs_tekst":"Rečeno je da je Allah, Uzvišeno je Njegovo veličanstvo, to rekao melekima zato što su oni, kada je On, Uzvišeno je Njegovo veličanstvo, započeo stvarati Adema, međusobno rekli: „Neka naš Gospodar stvori šta god želi stvoriti; neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji od njega.“ Kada je stvorio Adema, alejhis-selam, i poučio ga imenu svega, pokazao je melekima stvari čijim je imenima poučio Adema i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite“ — u svojoj tvrdnji da Allah nije stvorio nijedno stvorenje a da ste vi učeniji od njega i kod Njega ugledniji od njega. ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧"},{"stranica":100,"ar_tekst":"ذكر من قال ذلك:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":100,"ar_tekst":"حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ:\n\nحَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ: قوله: «وَإِذْ قالَ رَبُّكَ لِلْمَلائِكَةِ إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً، فاستشار الملائكة في خلق آدم ع ف قالُوا:\n\n«أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وقد علمت الملائكة من علم الله أنه لا شيء أكره إلى الله عز وجل من سفك الدماء والفساد في الأرض،","bs_tekst":"Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, o riječima: „I kada je tvoj Gospodar rekao melekima: Ja ću na Zemlji postaviti namjesnika.“ Posavjetovao se s melekima o stvaranju Adema, alejhis-selam, pa su rekli: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?“ Meleki su iz Allahovog znanja već znali da Allahu, Silnom i Uzvišenom, ništa nije mrže od prolijevanja krvi i činjenja nereda na Zemlji, ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dijelovi. Riječi o savjetovanju s melekima pripadaju ovoj predaji, a nisu dio kur’anskog ajeta.⟧"},{"stranica":101,"ar_tekst":"«وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» ، فَكان في علم الله عز وجل انه سيكون من تلك الخليقة أنبياء ورسل وقوم صالحون وساكنو الجنة.","bs_tekst":"„a mi Tebe s hvalom slavimo i svetost Ti iskazujemo. Rekao je: Ja znam ono što vi ne znate.“ U Allahovom, Silan je i Uzvišen, znanju bilo je da će od tih stvorenja biti vjerovjesnika, poslanika, dobrih ljudi i stanovnika Dženneta. ⟦Prijevod kur’anskog navoda: El-Bekara, 2:30, navedeni dio.⟧"},{"stranica":101,"ar_tekst":"قال: وذكر لنا أن ابْنِ عَبَّاسٍ كان يقول: إن الله تعالى لما أخذ في خلق آدم قالت الملائكة: ما الله تعالى بخالق خلقا أكرم عليه منا، ولا أعلم منا، فابتلوا بخلق آدم ع- وكل خلق مبتلى، كما ابتليت السموات والأرض بالطاعة- فقال الله تعالى: «ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ» .","bs_tekst":"Rekao je: „Navedeno nam je da je Ibn Abbas govorio: ‘Kada je Uzvišeni Allah počeo stvarati Adema, meleki su rekli: Allah neće stvoriti nijedno stvorenje koje bi Mu bilo uglednije od nas ili učenije od nas. Zato su iskušani stvaranjem Adema, alejhis-selam. Svako je stvorenje iskušano, kao što su nebesa i Zemlja iskušani pokornošću.’ Uzvišeni Allah rekao je: ‘Dođite, milom ili silom!’ Odgovorili su: ‘Dolazimo poslušno.’“ ⟦Prijevod kur’anskog navoda: Fussilet, 41:11, navedeni dio.⟧"},{"stranica":101,"ar_tekst":"حَدَّثَنَا القاسم، قال: حَدَّثَنَا الحسين بن داود، قال: حَدَّثَنِي حجاج، عن جرير بن حازم، ومبارك عن الحسن وأبي بكر عن الحسن وقتادة قالا: قال الله عز وجل للملائكة: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» قال لهم: إني فاعل، فعرضوا برأيهم، فعلمهم علما وطوى منهم علما علمه لا يعلمونه، فقالوا بالعلم الذي علمهم: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» - وقد كانت الملائكة علمت من علم الله تعالى أنه لا ذنب عند الله تعالى أعظم من سفك الدِّمَاءَ- «وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» ، فلما أخذ تعالى في خلق آدم ع همست الملائكة فيما بينهم، فقالوا: ليخلق ربنا عز وجل ما شاء أن يخلق، فلن يخلق خلقا إلا كنا أعلم منه، وأكرم عليه منه، فلما خلقه ونفخ فيه من روحه أمرهم أن يسجدوا له لما قالوا، ففضله عليهم، فعلموا أنهم ليسوا بخير منه، فقالوا:\nإن لم نكن خيرا منه، فنحن أعلم منه، لأنا كنا قبله، وخلقت الأمم قبله،","bs_tekst":"Pričao nam je Kasim, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Džerira ibn Hazima i Mubareka, od Hasena i Ebu Bekra, od Hasena i Katade; obojica su rekli: „Allah, Silan i Uzvišen, rekao je melekima: ‘Ja ću na Zemlji postaviti namjesnika.’ Rekao im je: ‘Ja ću to učiniti.’ Oni su iznijeli svoje mišljenje. Poučio ih je jednom znanju, a od njih sakrio znanje koje je On znao, a oni nisu. Na osnovu znanja kojim ih je poučio rekli su: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ Meleki su iz znanja Uzvišenog Allaha već znali da kod Uzvišenog Allaha nema većeg grijeha od prolijevanja krvi. ‘A mi Tebe s hvalom slavimo i svetost Ti iskazujemo. Rekao je: Ja znam ono što vi ne znate.’ Kada je Uzvišeni počeo stvarati Adema, alejhis-selam, meleki su međusobno šaputali i rekli: ‘Neka naš Gospodar, Silan i Uzvišen, stvori šta god želi stvoriti; neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji od njega.’ Kada ga je stvorio i u njega udahnuo od Svoga Duha, naredio im je da mu učine sedždu zbog onoga što su rekli, te ga uzdigao nad njima. Tada su spoznali da nisu bolji od njega. Rekli su: ‘Ako nismo bolji od njega, onda smo učeniji od njega, jer smo bili prije njega, a i narodi su stvoreni prije njega.’ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dijelovi. Niz prenosilaca prenesen je istim redom kao na stranici 98, s istom nejasnoćom njegovih grana.⟧"},{"stranica":102,"ar_tekst":"فلما أعجبوا بعلمهم ابتلوا، «فعلم آدَمَ الْأَسْماءَ كُلَّها ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ فَقالَ: أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ، إِنْ كُنْتُمْ صادِقِينَ» أني لم أخلق خلقا إلا كنتم أعلم منه، فأخبروني بأسماء هؤلاء إن كنتم صادقين قالا: ففزع القوم إلى التوبة، وإليها يفزع كل مؤمن، فقالوا: «سُبْحانَكَ لا عِلْمَ لَنا إِلَّا مَا عَلَّمْتَنا إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ قالَ يَا آدَمُ أَنْبِئْهُمْ بِأَسْمائِهِمْ فَلَمَّا أَنْبَأَهُمْ بِأَسْمائِهِمْ قالَ أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّماواتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» لقولهم: ليخلق ربنا ما شاء، فلن يخلق خلقا أكرم عليه منا، ولا أعلم منا، قال: علمه اسم كل شيء:\nهذه الخيل، وهذه البغال، والإبل، والجن، والوحش، وجعل يسمي كل شيء باسمه، وعرضت عليه أمة أمة، قال: «أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّماواتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، قال:\n\nاما ما أبدوا فقولهم: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وأما ما كتموا فقولهم بعضهم لبعض: نحن خير منه وأعلم.","bs_tekst":"Kada su se zadivili svojim znanjem, bili su iskušani. Pa je poučio Adema svim imenima, zatim ih pokazao melekima i rekao: ‘Obavijestite Me o imenima ovih, ako istinu govorite’ — da nisam stvorio nijedno stvorenje a da vi ne budete učeniji od njega. ‘Obavijestite Me o imenima ovih, ako istinu govorite.’“ Obojica su rekli: „Tada su pribjegli pokajanju, a njemu pribjegava svaki vjernik, pa su rekli: ‘Slavljen neka si! Mi nemamo znanja osim onoga čemu si nas Ti poučio. Ti si, doista, Sveznajući, Mudri. Rekao je: Ademe, obavijesti ih o njihovim imenima! Kada ih je obavijestio o njihovim imenima, rekao je: Zar vam nisam rekao da Ja znam nevidljivo nebesa i Zemlje i znam ono što pokazujete i ono što ste krili?’“ Zbog njihovih riječi: „Neka naš Gospodar stvori šta god želi; neće stvoriti nijedno stvorenje koje bi Mu bilo uglednije od nas niti učenije od nas.“ Rekao je: „Poučio ga je imenu svega: ovo su konji, ovo su mazge, deve, džini i divlje životinje. Počeo je imenovati svaku stvar njenim imenom, a pokazivane su mu vrste jedna po jedna.“ Rekao je: „Zar vam nisam rekao da Ja znam nevidljivo nebesa i Zemlje i znam ono što pokazujete i ono što ste krili?“ Rekao je: „Ono što su pokazali njihove su riječi: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ A ono što su krili njihove su međusobne riječi: ‘Mi smo bolji od njega i učeniji.’“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30–33, navedeni dijelovi. Početak izvornog navoda فعلم آدم prenesen je kao „Pa je poučio Adema“; u mushafu u 2:31 stoji وعلم آدم („I poučio je Adema“). Formulacija „Obavijestite Me…“ koja se ponavlja izvan navodnika izvora prenosi tekst predaje, a nije dopuna ajeta.⟧"},{"stranica":102,"ar_tekst":"حَدَّثَنَا عَمَّارُ بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أَنَسٍ: «ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ فَقالَ أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» إِلَى قَوْلِهِ: «إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ\n» ، قَالَ: وَذَلِكَ حِينَ قَالُوا: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» إِلَى قَوْلِهِ «وَنُقَدِّسُ لَكَ» قَالَ: فَلَمَّا عَرَفُوا أَنَّهُ جَاعِلٌ فِي الأَرْضِ خَلِيفَةً قَالُوا بَيْنَهُمْ: لَنْ يَخْلُقَ اللَّهُ تعالى خَلْقًا إِلا كُنَّا نَحْنُ أَعْلَمُ مِنْهُ وَأَكْرَمُ عَلَيْهِ، فَأَرَادَ اللَّهُ تعالى أَنْ يُخْبِرَهُمْ أَنَّهُ قَدْ فَضَّلَ عَلَيْهِمْ آدَمَ، وَعَلَّمَهُ الأَسْمَاءَ كُلَّهَا، وَقَالَ","bs_tekst":"Pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, o riječima: „Zatim ih je pokazao melekima i rekao: Obavijestite Me o imenima ovih, ako istinu govorite“ — do Njegovih riječi: „Ti si, doista, Sveznajući, Mudri.“ Rekao je: „To je bilo kada su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati’ — do Njegovih riječi: ‘I svetost Ti iskazujemo.’“ Rekao je: „Kada su saznali da će On postaviti namjesnika na Zemlji, među sobom su rekli: ‘Allah neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji.’ Uzvišeni Allah htio ih je obavijestiti da je Adema odlikovao nad njima i poučio ga svim imenima. Rekao je ⟦Prijevodi navedenih dijelova: El-Bekara, 2:31–32 i 2:30. Prijelazi „do Njegovih riječi“ sačuvani su iz izvora.⟧"}]</script><script>if(parent!==window){parent.postMessage({type:'ri-taberi-part',payload:JSON.parse(document.getElementById('partData').textContent),database:JSON.parse(document.getElementById('databaseData').textContent)},'*');}</script></body></html>
