<!doctype html><html lang="bs"><head><meta charset="utf-8"><title>Taberi · tom 1 · 78–102</title></head><body><script id="partData" type="application/json">{"id":"01-004","start":78,"end":102,"pages":[{"n":78,"html":"\u003csection class=\"page\" data-page=\"78\" id=\"stranica-78\">\u003ch2>Stranica 78\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 78\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"78.1\" id=\"ar-odlomak-78-1\">قال أبو جعفر: والصواب من القول في ذلك عندنا أن يقال: إن الله تعالى ذكره خلق شمس النهار وقمر الليل آيتين، فجعل آية النهار التي هي الشمس مبصرة يبصر بها، ومحا آية الليل التي هي القمر بالسواد الذي فيه.\u003c/p>\u003cp data-pair=\"78.2\" id=\"ar-odlomak-78-2\">وجائز أن يكون الله تعالى ذكره خلقهما شمسين من نور عرشه، ثم محا نور القمر بالليل على نحو ما قاله من ذكرنا قوله، فكان ذلك سبب اختلاف حالتيهما.\u003c/p>\u003cp data-pair=\"78.3\" id=\"ar-odlomak-78-3\">وجائز أن يكون إضاءة الشمس للكسوة التي تكساها من ضوء العرش، ونور القمر من الكسوة التي يكساها من نور الكرسي.\u003c/p>\u003cp data-pair=\"78.4\" id=\"ar-odlomak-78-4\">ولو صح سند أحد الخبرين اللذين ذكرتهما لقلنا به، ولكن في أسانيدهما نظرا، فلم نستجز قطع القول بتصحيح ما فيهما من الخبر عن سبب اختلاف حال الشمس والقمر، غير أنا بيقين نعلم أن الله عز وجل خالف بين صفتيهما في الإضاءة لما كان أعلم به من صلاح خلقه باختلاف أمريهما، فخالف بينهما، فجعل أحدهما مضيئا مبصرا به، والآخر ممحو الضوء.\u003c/p>\u003cp data-pair=\"78.5\" id=\"ar-odlomak-78-5\">وإنما ذكرنا قدر ما ذكرنا من أمر الشمس والقمر في كتابنا هذا، وإن كنا قد أعرضنا عن ذكر كثير من أمرهما وأخبارهما، مع إعراضنا عن ذكر بدء خلق الله السموات والأرض وصفة ذلك، وسائر ما تركنا ذكره من جميع خلق الله في هذا الكتاب، لأن قصدنا في كتابنا هذا ذكر ما قدمنا الخبر عنه أنا ذاكروه فيه من ذكر الأزمنة وتاريخ الملوك والأنبياء والرسل، على ما قد شرطنا في أول هذا الكتاب، وكانت التأريخات والأزمنة إنما توقت بالليالي والأيام التي إنما هي مقادير ساعات جري الشمس والقمر في أفلاكهما على ما قد ذكرنا في الأخبار التي رويناها عن رسول الله ص، وكان ما كان قبل\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 78\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"78.1\" id=\"odlomak-78-1\">Ebu Džafer kaže: Ispravno je, prema našem mišljenju, reći da je Allah, Uzvišen je spomen Njegov, stvorio dnevno Sunce i noćni Mjesec kao dva znaka. Znak dana, a to je Sunce, učinio je takvim da se pomoću njega vidi, a znak noći, a to je Mjesec, izbrisao je crnilom koje je na njemu.\u003c/p>\u003cp data-pair=\"78.2\" id=\"odlomak-78-2\">Moguće je da ih je Allah, Uzvišen je spomen Njegov, stvorio kao dva sunca od svjetlosti Svoga Arša, zatim izbrisao Mjesečevu svjetlost noću na način kako su to rekli oni čije smo mišljenje spomenuli, pa je to bilo uzrokom njihove različitosti.\u003c/p>\u003cp data-pair=\"78.3\" id=\"odlomak-78-3\">Moguće je i da Sunčev sjaj potječe od odore kojom se odijeva, od sjaja Arša, a Mjesečeva svjetlost od odore kojom se odijeva, od svjetlosti Kursijja.\u003c/p>\u003cp data-pair=\"78.4\" id=\"odlomak-78-4\">Kada bi lanac prenosilaca jedne od dviju predaja koje sam spomenuo bio vjerodostojan, prihvatili bismo je. Međutim, njihovi lanci prenosilaca zahtijevaju razmatranje, pa nismo smatrali dopuštenim odlučno potvrditi ono što u njima stoji o uzroku različitosti Sunca i Mjeseca. Ipak, pouzdano znamo da je Allah, Silan i Uzvišen, učinio njihova svojstva različitim u pogledu svjetlosti zbog dobrobiti za Svoja stvorenja, koju je najbolje znao, a koja proizlazi iz njihove različitosti. Razlikovao ih je: jedno je učinio sjajnim, da se pomoću njega vidi, a drugome izbrisao sjaj.\u003c/p>\u003cp data-pair=\"78.5\" id=\"odlomak-78-5\">U ovoj smo knjizi spomenuli onoliko o Suncu i Mjesecu koliko smo spomenuli, premda smo izostavili mnogo o njihovom stanju i predajama o njima, kao što smo izostavili govor o početku Allahovog stvaranja nebesa i Zemlje i opisu toga, te ostalo što smo u ovoj knjizi ostavili nespomenutim od svih Allahovih stvorenja. Razlog je što je naš cilj u ovoj knjizi spomenuti ono za šta smo unaprijed kazali da ćemo u njoj govoriti: vremena i historiju kraljeva, vjerovjesnika i poslanika, prema onome što smo postavili na početku ove knjige. Datumi i vremenska razdoblja određuju se noćima i danima, koji su mjere sati kretanja Sunca i Mjeseca njihovim putanjama, kako smo naveli u predajama koje smo prenijeli od Allahovog Poslanika, sallallahu alejhi ve sellem. A ono što je od Njegovih stvorenja bilo prije\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":79,"html":"\u003csection class=\"page\" data-page=\"79\" id=\"stranica-79\">\u003ch2>Stranica 79\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 79\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"79.1\" id=\"ar-odlomak-79-1\">خلق الله عز ذكره إياهما من خلقه في غير أوقات ولا ساعات ولا ليل ولا نهار.\u003c/p>\u003cp data-pair=\"79.2\" id=\"ar-odlomak-79-2\">وإذ كنا قد بينا مقدار مدة ما بين أول ابتداء الله عز وجل في إنشاء ما أراد إنشاءه من خلقه إلى حين فراغه من إنشاء جميعهم من سني الدنيا ومدة أزمانها بالشواهد التي استشهدنا بها من الآثار والأخبار، وأتينا على القول في مدة ما بعد أن فرغ من خلق جميعه إلى فناء الجميع بالأدلة التي دللنا بها على صحة ذلك من الاخبار الوارده عن رسول الله ص وعن الصحابة وغيرهم من علماء الأمة، وكان الغرض في كتابنا هذا ذكر ما قد بينا أنا ذاكروه من تاريخ الملوك الجبابرة العاصية ربها عز وجل والمطيعة ربها منهم، وأزمان الرسل والأنبياء، وكنا قد أتينا على ذكر ما به تصح التأريخات وتعرف به الأوقات والساعات، وذلك الشمس والقمر اللذان بأحدهما تدرك معرفه ساعات الليل وأوقاته، وبالآخر تدرك علم ساعات النهار وأوقاته فلنقل الآن في أول من أعطاه الله ملكا، وأنعم عليه فكفر نعمته، وجحد ربوبيته، وعتا على ربه واستكبر، فسلبه الله نعمته، وأخزاه وأذله ثم نتبعه ذكر من استن في ذلك سنته، واقتفى فيه أثره، فأحل الله به نقمته وجعله من شيعته، وألحقه به في الخزي والذل ونذكر من كان بإزائه أو بعده من الملوك المطيعة ربها المحمودة آثارها، أو من الرسل والأنبياء إن شاء الله عز وجل.\u003c/p>\u003cp data-pair=\"79.3\" id=\"ar-odlomak-79-3\">فأولهم وإمامهم في ذلك ورئيسهم وقائدهم فيه إبليس لعنه الله.\u003c/p>\u003cp data-pair=\"79.4\" id=\"ar-odlomak-79-4\">وكان الله عز وجل قد احسن خلقه وشرفه وكرمه وملكه على سماء الدنيا والأرض فيما ذكر، وجعله مع ذلك من خزان الجنة، فاستكبر على ربه\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 79\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"79.1\" id=\"odlomak-79-1\">nego što je Allah, Silan je spomen Njegov, stvorio njih dvoje, bilo je bez vremenskih odsječaka i sati, bez noći i dana.\u003c/p>\u003cp data-pair=\"79.2\" id=\"odlomak-79-2\">Objasnili smo, pomoću svjedočanstava iz predaja i izvješća koja smo naveli, koliko je, u godinama ovoga svijeta i trajanju njegovih razdoblja, trajalo vrijeme od prvog početka kada je Allah, Silan i Uzvišen, stvarao ono što je htio stvoriti od Svojih stvorenja do dovršetka stvaranja svih njih. Izložili smo i govor o trajanju razdoblja nakon što je dovršio stvaranje svih njih do nestanka svih njih, uz dokaze kojima smo potvrđivali ispravnost toga iz predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, od ashaba i drugih učenih ljudi ummeta. Cilj naše knjige jeste ono što smo već objasnili da ćemo spomenuti: historija silničkih kraljeva nepokornih svome Gospodaru, Silnom i Uzvišenom, i onih među njima koji su Mu bili pokorni, te vremena poslanika i vjerovjesnika. Već smo spomenuli ono pomoću čega se datumi ispravno određuju i poznaju vremenski odsječci i sati, a to su Sunce i Mjesec: pomoću jednog poznaju se sati i vremena noći, a pomoću drugog sati i vremena dana. Sada ćemo govoriti o prvome kome je Allah dao vlast i darovao blagodat, pa je on porekao Njegovu blagodat, zanijekao Njegovo gospodstvo, osilio se protiv svoga Gospodara i uzoholio. Allah mu je oduzeo blagodat, osramotio ga i ponizio. Zatim ćemo navesti onoga koji je krenuo njegovim putem i slijedio njegov trag u tome, pa je Allah na njega spustio Svoju kaznu, učinio ga njegovim sljedbenikom i pridružio mu ga u sramoti i poniženju. Spomenut ćemo i kraljeve pokorne svome Gospodaru, čiji su tragovi hvalevrijedni, ili poslanike i vjerovjesnike koji su bili u isto vrijeme s njim ili poslije njega, ako Allah, Silan i Uzvišen, htjedne.\u003c/p>\u003cp data-pair=\"79.3\" id=\"odlomak-79-3\">Prvi među njima, njihov predvodnik, poglavar i vođa u tome bio je Iblis, Allah ga prokleo.\u003c/p>\u003cp data-pair=\"79.4\" id=\"odlomak-79-4\">Allah, Silan i Uzvišen, bio mu je dao lijep lik, počastio ga, uzvisio i dao mu vlast nad najbližim nebom i Zemljom, prema onome što je navedeno. Uz to ga je učinio jednim od čuvara Dženneta. Ali on se uzoholio protiv svoga Gospodara\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":80,"html":"\u003csection class=\"page\" data-page=\"80\" id=\"stranica-80\">\u003ch2>Stranica 80\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 80\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"80.1\" id=\"ar-odlomak-80-1\">وادعى الربوبية، ودعا من كان تحت يده فيما ذكر إلى عبادته، فمسخه الله تعالى شيطانا رجيما، وشوه خلقه، وسلبه ما كان حوله، ولعنه وطرده عن سمواته في العاجل، ثم جعل مسكنه ومسكن اتباعه وشيعته في الآخرة نار جهنم، نعوذ بالله من غضبه، ومن عمل يقرب من غضبه، ومن الحور بعد الكور.\u003c/p>\u003cp data-pair=\"80.2\" id=\"ar-odlomak-80-2\">ونبدأ بذكر جمل من الأخبار الواردة عن السلف بما كان الله عز وجل أعطاه من الكرامة قبل استكباره عليه، وادعائه ما لم يكن له ادعاؤه، ثم نتبع ذلك ما كان من الأحداث في أيام سلطانه وملكه إلى حين زوال ذلك عنه، والسبب الذي به زال عنه ما كان فيه من نعمة الله عليه، وجميل آلائه، وغير ذلك من أموره، إن شاء الله مختصرا\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 80\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"80.1\" id=\"odlomak-80-1\">i prisvojio sebi gospodstvo. Prema onome što je navedeno, pozvao je one koji su bili pod njegovom vlašću da ga obožavaju. Uzvišeni Allah pretvorio ga je u prokletog šejtana, unakazio mu lik, oduzeo mu ono što je bilo oko njega, prokleo ga i odmah ga protjerao sa Svojih nebesa. Zatim je njegovo prebivalište i prebivalište njegovih pratilaca i sljedbenika na budućem svijetu učinio džehennemskom vatrom. Utječemo se Allahu od Njegove srdžbe, od djela koja približavaju Njegovoj srdžbi i od nazadovanja nakon učvršćenosti. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor u izrazu وسلبه ما كان حوله ima حوله, ovdje doslovno preneseno „oko njega“. Mjesto zahtijeva provjeru štampanog izdanja; nije prešutno zamijenjeno riječju s drugačijim slovom ili značenjem.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"80.2\" id=\"odlomak-80-2\">Počet ćemo navođenjem skupina predaja koje su došle od prethodnika o počastima koje mu je Allah, Silan i Uzvišen, dao prije nego što se uzoholio protiv Njega i prisvojio sebi ono na šta nije imao pravo. Zatim ćemo navesti događaje iz vremena njegove vlasti i vladavine, sve do vremena kada je to izgubio, i razlog zbog kojeg su od njega nestale Allahove blagodati i divna dobročinstva koja mu je darovao, te ostalo o njemu, ako Allah htjedne, ukratko.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":81,"html":"\u003csection class=\"page\" data-page=\"81\" id=\"stranica-81\">\u003ch2>Stranica 81\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 81\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"81.1\" id=\"ar-odlomak-81-1\">ذكر الأخبار الواردة بأن إبليس كان له ملك السماء الدنيا والأرض وما بين ذلك\u003c/p>\u003cp data-pair=\"81.2\" id=\"ar-odlomak-81-2\">\u003cspan class=\"isnad\">حدثنا القاسم بن الحسن، قال: حدثنا الحسين بْنُ دَاوُدَ، قَالَ: حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: قَالَ ابْنُ عَبَّاسٍ: \u003c/span>كَانَ إِبْلِيسُ مِنْ أَشْرَافِ الْمَلائِكَةِ وَأَكْرَمِهِمْ قَبِيلَةً، وَكَانَ خَازِنًا عَلَى الْجِنَانِ، وَكَانَ لَهُ سُلْطَانُ سَمَاءِ الدُّنْيَا، وَكَانَ لَهُ سُلْطَانُ الأَرْضِ.\u003c/p>\u003cp data-pair=\"81.3\" id=\"ar-odlomak-81-3\">\u003cspan class=\"isnad\">حَدَّثَنَا الْقَاسِمُ، قَالَ: حدثنا الحسين، قال: حدثني حجاج، عن ابن جريج، عن صالح مولى التوءمه وَشَرِيكِ بْنِ أَبِي نَمِرٍ- أَحَدُهُمَا أَوْ كِلاهُمَا- عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ مِنَ الْمَلائِكَةِ قَبِيلَةً مِنَ الْجِنِّ وَكَانَ إِبْلِيسُ مِنْهَا، وَكَانَ يَسُوسُ مَا بَيْنَ السَّمَاءِ وَالأَرْضِ.\u003c/p>\u003cp data-pair=\"81.4\" id=\"ar-odlomak-81-4\">\u003cspan class=\"isnad\">حَدَّثَنَا مُوسَى بن هارون الهمداني، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك، وعن أبي صالح عن ابن عباس، وعن مرة الهمداني عن ابن مسعود، وعن ناس من أصحاب النبي ص جعل ابليس على سَمَاءِ الدُّنْيَا، وَكَانَ مِنْ قَبِيلَةٍ مِنَ الْمَلائِكَةِ يُقَالُ لَهُمُ الْجِنُّ، وَإِنَّمَا سُمُّوا الْجِنَّ لأَنَّهُمْ خُزَّانُ الْجَنَّةِ، وَكَانَ إِبْلِيسُ مَعَ مُلْكِهِ خَازِنًا.\u003c/span>\u003c/p>\u003cp data-pair=\"81.5\" id=\"ar-odlomak-81-5\">\u003cspan class=\"isnad\">حَدَّثَنِي عَبْدَانُ الْمَرْوَزِيُّ، حَدَّثَنِي الْحُسَيْنُ بْنُ الْفَرَجِ، قَالَ: سَمِعْتُ أَبَا مُعَاذٍ الْفَضْلَ بْنَ خَالِدٍ قَالَ: أَخْبَرَنَا عُبَيْدُ اللَّهِ بْنُ سُلَيْمَانَ، قَالَ: سمعت الضحاك ابن مُزَاحِمٍ يَقُولُ \u003c/span>فِي قَوْلِهِ عَزَّ وَجَلَّ: «فَسَجَدُوا إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ» ، قَالَ: كَانَ ابْنِ عَبَّاسٍ يَقُولُ: إِنَّ إِبْلِيسَ كان من اشرف الملائكة واكرمهم\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 81\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"81.1\" id=\"odlomak-81-1\">Spomen predaja prema kojima je Iblis imao vlast nad najbližim nebom, Zemljom i onim što je između njih\u003c/p>\u003cp data-pair=\"81.2\" id=\"odlomak-81-2\">\u003cspan class=\"isnad\">Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, koji je rekao: Ibn Abbas je rekao: \u003c/span>„Iblis je bio jedan od uglednih meleka, iz njihovog najplemenitijeg plemena. Bio je čuvar džennetskih vrtova i imao je vlast nad najbližim nebom i vlast nad Zemljom.“\u003c/p>\u003cp data-pair=\"81.3\" id=\"odlomak-81-3\">\u003cspan class=\"isnad\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, od Saliha, oslobođenika Tev’eme, i Šerika ibn Ebu Nemira — jednoga od njih ili obojice — od Ibn Abbasa, koji je rekao: \u003c/span>„Među melekima postoji pleme džina, a Iblis je bio iz njega. Upravljao je onim što je između neba i Zemlje.“\u003c/p>\u003cp data-pair=\"81.4\" id=\"odlomak-81-4\">\u003cspan class=\"isnad\">Pričao nam je Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa, te od Murre el-Hemdanija, od Ibn Mesuda, i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: \u003c/span>„Postavio je Iblisa nad najbližim nebom. Bio je iz plemena meleka koje se naziva džinima. Nazvani su džinima zato što su čuvari Dženneta. Iblis je, pored svoje vlasti, bio i čuvar.“\u003c/p>\u003cp data-pair=\"81.5\" id=\"odlomak-81-5\">\u003cspan class=\"isnad\">Pričao mi je Abdan el-Mervezi: pričao mi je Husejn ibn el-Feredž, koji je rekao: čuo sam Ebu Muaza el-Fadla ibn Halida kako kaže: obavijestio nas je Ubejdullah ibn Sulejman, koji je rekao: čuo sam Dahhaka ibn Muzahima kako, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „Pa su učinili sedždu, osim Iblisa; bio je od džina“, kaže: „Ibn Abbas govorio je: ‘Iblis je bio jedan od uglednih meleka, iz njihovog najplemenitijeg \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":82,"html":"\u003csection class=\"page\" data-page=\"82\" id=\"stranica-82\">\u003ch2>Stranica 82\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 82\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"82.1\" id=\"ar-odlomak-82-1\">قَبِيلَةً، وَكَانَ خَازِنًا عَلَى الْجِنَانِ، وَكَانَ لَهُ سُلْطَانُ سَمَاءِ الدُّنْيَا، وَكَانَ لَهُ سُلْطَانُ الأَرْضِ.\u003c/p>\u003cp data-pair=\"82.2\" id=\"ar-odlomak-82-2\">\u003cspan class=\"isnad\">حدثنا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا الْمُبَارَكُ بْنُ مُجَاهِدٍ أَبُو الأَزْهَرِ، عَنْ شَرِيكِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي نَمِرٍ، عَنْ صَالِحٍ مَوْلَى التَّوْءَمَةِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ مِنَ الْمَلائِكَةِ قَبِيلا يُقَالُ لَهُمُ الْجِنُّ، فَكَانَ إِبْلِيسُ مِنْهُمْ، وَكَانَ يَسُوسُ مَا بَيْنَ السَّمَاءِ وَالأَرْضِ فَعَصَى، فَمَسَخَهُ اللَّهُ شَيْطَانًا رجيما\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 82\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"82.1\" id=\"odlomak-82-1\">plemena. Bio je čuvar džennetskih vrtova i imao je vlast nad najbližim nebom i vlast nad Zemljom.’“\u003c/p>\u003cp data-pair=\"82.2\" id=\"odlomak-82-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Mubarek ibn Mudžahid, Ebu Ezher, od Šerika ibn Abdullaha ibn Ebu Nemira, od Saliha, oslobođenika Tev’eme, od Ibn Abbasa, koji je rekao: \u003c/span>„Među melekima postoji pleme koje se naziva džinima, a Iblis je bio od njih. Upravljao je onim što je između neba i Zemlje, pa je bio nepokoran i Allah ga je pretvorio u prokletog šejtana.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":83,"html":"\u003csection class=\"page\" data-page=\"83\" id=\"stranica-83\">\u003ch2>Stranica 83\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 83\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"83.1\" id=\"ar-odlomak-83-1\">ذكر الخبر عن غمط عدو الله نعمة ربه واستكباره عليه وادعائه الربوبية\u003c/p>\u003cp data-pair=\"83.2\" id=\"ar-odlomak-83-2\">\u003cspan class=\"isnad\">حَدَّثَنَا القاسم، قال: حدثنا الحسين، قال: حدثني حجاج، عن ابن جريج: \u003c/span>«وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ» قال: قال، ابن جريج:\nمن يقل من الملائكة إني إله من دونه، فلم يقله إلا إبليس، دعا إلى عباده نفسه، فنزلت هذه الآية في إبليس.\u003c/p>\u003cp data-pair=\"83.3\" id=\"ar-odlomak-83-3\">\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ، قال: حدثنا سعيد، عن قتادة: \u003c/span>«وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ فَذلِكَ نَجْزِيهِ جَهَنَّمَ كَذلِكَ نَجْزِي الظَّالِمِينَ» ، وإنما كانت هذه الآية خاصة لعدو الله إبليس لما قال ما قال، لعنه الله وجعله رجيما، فقال: «فَذلِكَ نَجْزِيهِ جَهَنَّمَ كَذلِكَ نَجْزِي الظَّالِمِينَ» .\u003c/p>\u003cp data-pair=\"83.4\" id=\"ar-odlomak-83-4\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا محمد بن ثور، عن معمر، عن قتادة: \u003c/span>«وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ فَذلِكَ نَجْزِيهِ جَهَنَّمَ» ، قال: هي خاصة لإبليس\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 83\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"83.1\" id=\"odlomak-83-1\">Spomen predaje o tome kako je Allahov neprijatelj omalovažio blagodat svoga Gospodara, uzoholio se protiv Njega i prisvojio sebi gospodstvo\u003c/p>\u003cp data-pair=\"83.2\" id=\"odlomak-83-2\">\u003cspan class=\"isnad\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, \u003c/span>o riječima: „A ko od njih kaže: Ja sam bog mimo Njega.“ Rekao je: Ibn Džurejdž rekao je: „Ko od meleka kaže: ‘Ja sam bog mimo Njega.’ To nije rekao niko osim Iblisa. Pozvao je da obožavaju njega samoga, pa je ovaj ajet objavljen o Iblisu.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:29, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"83.3\" id=\"odlomak-83-3\">\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid, koji je rekao: pričao nam je Seid, od Katade, \u003c/span>o riječima: „A ko od njih kaže: Ja sam bog mimo Njega — takvome ćemo Džehennemom uzvratiti. Tako uzvraćamo nepravednicima.“ „Ovaj se ajet posebno odnosio na Allahovog neprijatelja Iblisa. Kada je rekao ono što je rekao, Allah ga je prokleo i učinio prokletim, pa je rekao: ‘Takvome ćemo Džehennemom uzvratiti. Tako uzvraćamo nepravednicima.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Enbija, 21:29. Drugi navod ponavlja završni dio istog ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"83.4\" id=\"odlomak-83-4\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Abdula‘la, koji je rekao: pričao nam je Muhammed ibn Sevr, od Ma‘mera, od Katade, \u003c/span>o riječima: „A ko od njih kaže: Ja sam bog mimo Njega — takvome ćemo Džehennemom uzvratiti.“ Rekao je: „Ovo se posebno odnosi na Iblisa.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:29, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":84,"html":"\u003csection class=\"page\" data-page=\"84\" id=\"stranica-84\">\u003ch2>Stranica 84\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 84\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"84.1\" id=\"ar-odlomak-84-1\">القول في الأحداث التي كانت في أيام ملك ابليس وسلطانه والسبب الذي به هلك وادعى الربوبية\u003c/p>\u003cp data-pair=\"84.2\" id=\"ar-odlomak-84-2\">فمن الأحداث التي كانت في ملك عدو الله- إذ كان لله مطيعا- ما ذكر لنا عن ابْنِ عَبَّاسٍ في الخبر الذي حَدَّثَنَاهُ أَبُو كُرَيْبٍ، قَالَ:\n\u003cspan class=\"isnad\">حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>كَانَ إِبْلِيسُ مِنْ حَيٍّ مِنْ أَحْيَاءِ الْمَلائِكَةِ يُقَالُ لَهُمُ: الْجِنُّ خُلِقُوا مِنْ نَارِ السَّمُومِ مِنْ بَيْنَ الْمَلائِكَةِ، قَالَ: وَكَانَ اسْمُهُ الْحَارِثَ، قَالَ: وَكَانَ خَازِنًا مِنْ خُزَّانِ الْجَنَّةِ، قَالَ: وَخُلِقَتِ الْمَلائِكَةُ كُلُّهُمْ مِنْ نُورٍ غَيْرَ هَذَا الْحَيِّ، قَالَ: وَخُلِقَتِ الْجِنُّ الَّذِينَ ذُكِرُوا في القرآن من مارج من نار، وَهُوَ لِسَانُ النَّارِ الَّذِي يَكُونُ فِي طَرْفِهَا إِذَا أُلْهِبَتْ، قَالَ: وَخُلِقَ الإِنْسَانُ مِنْ طِينٍ، فَأَوَّلُ مَنْ سَكَنَ الأَرْضَ الْجِنُّ فَأَفْسَدُوا فِيهَا وَسَفَكُوا الدِّمَاءَ، وَقَتَلَ بَعْضُهُمْ بَعْضًا، قَالَ: فَبَعَثَ اللَّهُ إِلَيْهِمْ إِبْلِيسَ فِي جُنْدٍ مِنَ الْمَلائِكَةِ وهم هَذَا الْحَيُّ الَّذِينَ يُقَالُ لَهُمُ الْجِنُّ، فَقَتَلَهُمْ ابليس ومن معه حي أَلْحَقَهُمْ بِجَزَائِرِ الْبُحُورِ وَأَطْرَافِ الْجِبَالِ، فَلَمَّا فَعَلَ إِبْلِيسُ ذَلِكَ اغْتَرَّ فِي نَفْسِهِ، وَقَالَ: قَدْ صَنَعْتُ شَيْئًا لَمْ يَصْنَعْهُ أَحَدٌ، قَالَ: فَاطَّلَعَ الله على ذلك من قبله، وَلَمْ تَطَّلِعْ عَلَيْهِ الْمَلائِكَةُ الَّذِينَ كَانُوا مَعَهُ.\u003c/p>\u003cp data-pair=\"84.3\" id=\"ar-odlomak-84-3\">\u003cspan class=\"isnad\">حدثني المثنى، قال: حدثنا إسحاق بن الحجاج، قال: حدثنا عبد الله بن أبي جعفر عَنْ أَبِيهِ، عَنِ الرَّبِيعِ بْنِ أَنَسٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ خَلَقَ الْمَلائِكَةَ يَوْمَ الأَرْبِعَاءِ، وَخَلَقَ الْجِنَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ يَوْمَ الْجُمُعَةِ، قَالَ:\n\nفَكَفَرَ قَوْمٌ مِنَ الْجِنِّ، فَكَانَتِ الْمَلائِكَةُ تهبط اليهم في الارض فتقتلهم فَكَانَتِ الدِّمَاءُ وَكَانَ الْفَسَادُ فِي الأَرْضِ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 84\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"84.1\" id=\"odlomak-84-1\">Rasprava o događajima iz vremena Iblisove vlasti i vladavine te o razlogu njegove propasti i prisvajanja gospodstva\u003c/p>\u003cp data-pair=\"84.2\" id=\"odlomak-84-2\">Među događajima iz vremena vlasti Allahovog neprijatelja — dok je još bio pokoran Allahu — jeste ono što nam je navedeno od Ibn Abbasa u predaji koju \u003cspan class=\"isnad\">nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: \u003c/span>„Iblis je bio iz jedne od skupina meleka koje se nazivaju džinima. Među melekima su oni bili stvoreni od vatre žarkoga vjetra.“ Rekao je: „Ime mu je bilo Haris.“ Rekao je: „Bio je jedan od čuvara Dženneta.“ Rekao je: „Svi meleki, osim te skupine, stvoreni su od svjetlosti.“ Rekao je: „Džini spomenuti u Kur’anu stvoreni su od plamena vatre, a to je vatreni jezik na njenom vrhu kada se razgori.“ Rekao je: „Čovjek je stvoren od gline. Prvi koji su nastanili Zemlju bili su džini, pa su na njoj činili nered, prolijevali krv i ubijali jedni druge.“ Rekao je: „Allah im je poslao Iblisa s vojskom meleka, a to je ta skupina koja se naziva džinima. Iblis i oni koji su bili s njim ubijali su ih sve dok ih nisu potisnuli na morske otoke i rubove planina. Kada je Iblis to učinio, zanio se sobom i rekao: ‘Učinio sam nešto što niko drugi nije učinio.’“ Rekao je: „Allah je znao za to kod njega, a meleki koji su bili s njim nisu to znali.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor ima nejasan spoj حي ألحقهم. „Sve dok ih nisu potisnuli“ prenosi kontekstualno čitanje, vjerovatno حتى ألحقهم; potrebno je provjeriti štampano izdanje.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"84.3\" id=\"odlomak-84-3\">\u003cspan class=\"isnad\">Pričao mi je Musenna, koji je rekao: pričao nam je Ishak ibn el-Hadždžadž, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, koji je rekao: \u003c/span>„Allah je stvorio meleke u srijedu, džine u četvrtak, a Adema u petak.“ Rekao je: „Jedna skupina džina postala je nevjernička, pa su im meleki silazili na Zemlju i ubijali ih. Tako je na Zemlji bilo krvi i nereda.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":85,"html":"\u003csection class=\"page\" data-page=\"85\" id=\"stranica-85\">\u003ch2>Stranica 85\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 85\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"85.1\" id=\"ar-odlomak-85-1\">ذكر السبب الذي به هلك عدو الله وسولت له نفسه من أجله الاستكبار على ربه عز وجل\u003c/p>\u003cp data-pair=\"85.2\" id=\"ar-odlomak-85-2\">اختلف السلف من الصحابة والتابعين في ذلك، وقد ذكرنا أحد الأقوال التي رويت في ذلك عن ابْنِ عَبَّاسٍ، وذلك ما ذكر الضحاك عنه، أنه لما قتل الجن الذين عصوا الله، وأفسدوا في الأرض وشردهم، أعجبته نفسه ورأى في نفسه أن له بذلك من الفضيلة ما ليس لغيره.\u003c/p>\u003cp data-pair=\"85.3\" id=\"ar-odlomak-85-3\">والقول الثاني من الأقوال المروية في ذلك عن ابْنِ عَبَّاسٍ، أنه كان ملك سماء الدنيا وسائسها، وسائس ما بينها وبين الأرض، وخازن الجنة، مع اجتهاده في العبادة، فأعجب بنفسه، ورأى أن له بذلك الفضل، فاستكبر على ربه عز وجل.\u003c/p>\u003cp data-pair=\"85.4\" id=\"ar-odlomak-85-4\">ذكر الرواية عنه بذلك:\u003c/p>\u003cp data-pair=\"85.5\" id=\"ar-odlomak-85-5\">\u003cspan class=\"isnad\">حَدَّثَنَا مُوسَى بْنُ هَارُونَ الْهَمْدَانِيُّ، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب النبي ص، قال: \u003c/span>لَمَّا فَرَغَ اللَّهُ عَزَّ وَجَلَّ مِنْ خَلْقِ مَا أَحَبَّ اسْتَوَى عَلَى الْعَرْشِ، فَجَعَلَ إِبْلِيسَ عَلَى مُلْكِ سَمَاءِ الدُّنْيَا وَكَانَ مِنْ قَبِيلَةٍ مِنَ الْمَلائِكَةِ يُقَالُ لَهُمُ الْجِنُّ، وَإِنَّمَا سُمُّوا الْجِنَّ لأَنَّهُمْ خُزَّانُ الْجَنَّةِ، وَكَانَ إِبْلِيسُ مَعَ مُلْكِهِ خَازِنًا، فَوَقَعَ فِي صَدْرِهِ كِبْرٌ، وَقَالَ: مَا أَعْطَانِي اللَّهُ هَذَا إِلا لِمَزِيَّةٍ، هَكَذَا \u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بْنُ هَارُونَ\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 85\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"85.1\" id=\"odlomak-85-1\">Spomen razloga zbog kojeg je Allahov neprijatelj propao i zbog kojeg ga je njegova duša navela da se uzoholi protiv svoga Gospodara, Silnog i Uzvišenog\u003c/p>\u003cp data-pair=\"85.2\" id=\"odlomak-85-2\">Prethodnici među ashabima i tabi‘inima razišli su se o tome. Već smo spomenuli jedno od mišljenja prenesenih od Ibn Abbasa: ono što je Dahhak naveo od njega, da se Iblis, kada je ubijao džine koji su bili nepokorni Allahu i činili nered na Zemlji te ih rastjerao, zadivio sam sobom i smatrao da time ima odliku koju drugi nemaju.\u003c/p>\u003cp data-pair=\"85.3\" id=\"odlomak-85-3\">Drugo mišljenje preneseno od Ibn Abbasa jeste da je Iblis bio vladar i upravitelj najbližeg neba, upravitelj onoga što je između njega i Zemlje i čuvar Dženneta, uz svoju revnost u ibadetu. Zato se zadivio sam sobom, smatrao da mu time pripada prednost i uzoholio se protiv svoga Gospodara, Silnog i Uzvišenog.\u003c/p>\u003cp data-pair=\"85.4\" id=\"odlomak-85-4\">Spomen predaje od njega o tome:\u003c/p>\u003cp data-pair=\"85.5\" id=\"odlomak-85-5\">\u003cspan class=\"isnad\">Pričao nam je Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao: \u003c/span>„Kada je Allah, Silan i Uzvišen, dovršio stvaranje onoga što je htio, uzvisio se nad Aršom. Iblisu je dao vlast nad najbližim nebom. Bio je iz plemena meleka koje se naziva džinima, a nazvani su džinima zato što su čuvari Dženneta. Iblis je, uz svoju vlast, bio i čuvar. U njegovim se prsima pojavila oholost, pa je rekao: ‘Allah mi ovo nije dao ni zbog čega drugog osim zbog moje posebne odlike.’“ Tako \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun\u003c/span>.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":86,"html":"\u003csection class=\"page\" data-page=\"86\" id=\"stranica-86\">\u003ch2>Stranica 86\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 86\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"86.1\" id=\"ar-odlomak-86-1\">\u003cspan class=\"isnad\">وحدثني بِهِ أَحْمَدُ بْنُ أَبِي خَيْثَمَةَ، عَنْ عَمْرِو بْنِ حَمَّادٍ، قَالَ:\n\u003c/span>لِمَزِيَّةٍ لِي عَلَى الْمَلائِكَةِ فَلَمَّا وَقَعَ ذَلِكَ الْكِبْرُ فِي نَفْسِهِ اطَّلَعَ اللَّهُ عَزَّ وَجَلَّ عَلَى ذَلِكَ مِنْهُ، فَقَالَ اللَّهُ لِلْمَلائِكَةِ: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» .\u003c/p>\u003cp data-pair=\"86.2\" id=\"ar-odlomak-86-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ بْنُ الْفَضْلِ، عَنِ ابْنِ إِسْحَاقَ، عَنْ خَلادِ بْنِ عَطَاءٍ، عَنْ طَاوُسٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>كَانَ إِبْلِيسُ قَبْلَ أَنْ يَرْكَبَ الْمَعْصِيَةَ مِنَ الْمَلائِكَةِ اسْمُهُ عَزَازِيلُ، وَكَانَ مِنْ سُكَّانِ الأَرْضِ، وَكَانَ مِنْ أَشَدِّ الْمَلائِكَةِ اجْتِهَادًا، وَأَكْثَرِهِمْ عِلْمًا، فَذَلِكَ الَّذِي دَعَاهُ إِلَى الْكِبْرِ، وَكَانَ مِنْ حَيٍّ يُسَمُّونَ جِنًّا.\u003c/p>\u003cp data-pair=\"86.3\" id=\"ar-odlomak-86-3\">\u003cspan class=\"isnad\">وَحَدَّثَنَا بِهِ ابْنُ حُمَيْدٍ مَرَّةً أُخْرَى، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنِ ابْنِ إِسْحَاقَ، عَنْ خَلادِ بْنِ عَطَاءٍ، عَنْ طَاوُسٍ- أَوْ مُجَاهِدٍ أَبِي الْحَجَّاجِ- عَنِ ابْنِ عَبَّاسٍ وَغَيْرِهِ بِنَحْوِهِ، إِلا \u003c/span>أَنَّهُ قَالَ: كَانَ مَلَكًا مِنَ الْمَلائِكَةِ اسْمُهُ عَزَازِيلُ، وَكَانَ مِنْ سُكَّانِ الأَرْضِ وَعُمَّارِهَا، وَكَانَ سُكَّانُ الأَرْضِ فِيهِمْ يُسَمُّونَ الْجِنَّ مِنْ بَيْنِ الْمَلائِكَةِ.\u003c/p>\u003cp data-pair=\"86.4\" id=\"ar-odlomak-86-4\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ الْمُثَنَّى، قال: حدثنا شيبان، قال: حدثنا سلام ابن مِسْكِينٍ، عَنْ قَتَادَةَ، عَنْ سَعِيدِ بْنِ الْمُسَيِّبِ، قَالَ: \u003c/span>كَانَ إِبْلِيسُ رَئِيسَ مَلائِكَةِ سَمَاءِ الدُّنْيَا.\u003c/p>\u003cp data-pair=\"86.5\" id=\"ar-odlomak-86-5\">والقول الثالث من الأقوال المروية عنه أنه كان يقول: السبب في ذلك أنه كان من بقايا خلق خلقهم الله عز وجل، فأمرهم بأمر فأبوا طاعته.\u003c/p>\u003cp data-pair=\"86.6\" id=\"ar-odlomak-86-6\">ذكر الرواية عنه بذلك:\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 86\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"86.1\" id=\"odlomak-86-1\">O tome \u003cspan class=\"isnad\">mi je pričao i Ahmed ibn Ebu Hajsema, od Amra ibn Hammada. Rekao je: \u003c/span>„Zbog moje posebne odlike nad melekima. Kada se ta oholost pojavila u njegovoj duši, Allah, Silan i Uzvišen, znao je za to kod njega. Allah je rekao melekima: ‘Ja ću na Zemlji postaviti namjesnika.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:30, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"86.2\" id=\"odlomak-86-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema ibn el-Fadl, od Ibn Ishaka, od Hallada ibn Ataa, od Tavusa, od Ibn Abbasa, koji je rekao: \u003c/span>„Prije nego što je počinio grijeh, Iblis je bio od meleka i ime mu je bilo Azazil. Bio je jedan od stanovnika Zemlje, jedan od najrevnijih meleka i među onima s najviše znanja. To ga je navelo na oholost. Bio je iz skupine koja se naziva džinima.“\u003c/p>\u003cp data-pair=\"86.3\" id=\"odlomak-86-3\">Ibn Humejd \u003cspan class=\"isnad\">pričao nam je to i drugi put, rekavši: pričao nam je Selema, od Ibn Ishaka, od Hallada ibn Ataa, od Tavusa — ili Mudžahida Ebu Hadždžadža — od Ibn Abbasa i drugih, \u003c/span>nešto slično tome, osim što je rekao: „Bio je jedan od meleka, po imenu Azazil. Bio je jedan od stanovnika i nastanjivača Zemlje, a oni među melekima koji su nastanjivali Zemlju nazivali su se džinima.“\u003c/p>\u003cp data-pair=\"86.4\" id=\"odlomak-86-4\">\u003cspan class=\"isnad\">Pričao nam je Ibn el-Musenna, koji je rekao: pričao nam je Šejban, koji je rekao: pričao nam je Sellam ibn Miskin, od Katade, od Seida ibn el-Musejjeba, koji je rekao: \u003c/span>„Iblis je bio poglavar meleka najbližeg neba.“\u003c/p>\u003cp data-pair=\"86.5\" id=\"odlomak-86-5\">Treće mišljenje preneseno od njega jeste da je govorio: „Razlog tome bio je što je Iblis bio jedan od preostalih pripadnika stvorenja koja je Allah, Silan i Uzvišen, stvorio, pa im je nešto naredio, a oni su odbili poslušati Ga.“\u003c/p>\u003cp data-pair=\"86.6\" id=\"odlomak-86-6\">Spomen predaje od njega o tome:\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":87,"html":"\u003csection class=\"page\" data-page=\"87\" id=\"stranica-87\">\u003ch2>Stranica 87\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 87\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"87.1\" id=\"ar-odlomak-87-1\">\u003cspan class=\"isnad\">حدثني محمد بن سنان القزاز، قال: حدثنا أَبُو عَاصِمٍ، عَنْ شَبِيبٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ خَلَقَ خَلْقًا فَقَالَ: اسْجُدُوا لآدَمَ، فَقَالُوا: لا نَفْعَلُ، قَالَ: فَبَعَثَ اللَّهُ عَلَيْهِمْ نَارًا تَحْرِقُهُمْ، ثُمَّ خَلَقَ خَلْقًا آخَرَ فَقَالَ: إِنِّي خَالِقُ بَشَرًا مِنْ طِينٍ فَاسْجُدُوا لآدَمَ، فَأَبَوْا، فَبَعَثَ اللَّهُ عَلَيْهِمْ نَارًا فَأَحْرَقَتْهُمْ، قَالَ: ثُمَّ خَلَقَ هَؤُلاءِ فَقَالَ: الا تسجدوا لادم! قالوا: نعم، قال: وَكَانَ إِبْلِيسُ مِنْ أُولَئِكَ الَّذِينَ أَبَوْا أَنْ يَسْجُدُوا لآدَمَ.\u003c/p>\u003cp data-pair=\"87.2\" id=\"ar-odlomak-87-2\">وَقَالَ آخَرُونَ: بَلِ السَّبَبُ فِي ذَلِكَ أَنَّهُ كَانَ مِنْ بَقَايَا الْجِنِّ الَّذِينَ كَانُوا فِي الأَرْضِ، فَسَفَكُوا فِيهَا الدِّمَاءَ، وَأَفْسَدُوا فِيهَا، وَعَصَوْا رَبَّهُمْ، فَقَاتَلَتْهُمُ الْمَلائِكَةُ.\u003c/p>\u003cp data-pair=\"87.3\" id=\"ar-odlomak-87-3\">ذِكْرُ مَنْ قال ذلك:\u003c/p>\u003cp data-pair=\"87.4\" id=\"ar-odlomak-87-4\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا أبو سعيد اليحمدي إسماعيل بن إبراهيم، قال: حَدَّثَنِي سوار بن الجعد اليحمدي، عن شهر بن حوشب، قوله: \u003c/span>«كانَ مِنَ الْجِنِّ» ، قال:\nكان إبليس من الجن الذين طردتهم الملائكة، فأسره بعض الملائكة فذهب به إلى السماء.\u003c/p>\u003cp data-pair=\"87.5\" id=\"ar-odlomak-87-5\">\u003cspan class=\"isnad\">حَدَّثَنِي علي بن الحسن، قال: حَدَّثَنِي أبو نصر أحمد بن محمد الخلال، قال: حَدَّثَنِي سنيد بن داود، قال: حَدَّثَنَا هشيم، قال: أخبرنا عبد الرحمن بن يحيى، عن موسى بن نمير وعثمان بن سعيد بن كامل، عن سعد ابن مسعود، قال: \u003c/span>كانت الملائكة تقاتل الجن فسبي إبليس، وكان صغيرا، وكان مع الملائكة يتعبد معهم، فلما أمروا أن يسجدوا لآدم سجدوا وأبى إبليس، فلذلك قال الله عز وجل: «إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ»\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 87\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"87.1\" id=\"odlomak-87-1\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sinan el-Kazzaz, koji je rekao: pričao nam je Ebu Asim, od Šebiba, od Ikrime, od Ibn Abbasa, koji je rekao: \u003c/span>„Allah je stvorio stvorenja i rekao im: ‘Učinite sedždu Ademu!’ Odgovorila su: ‘Nećemo to učiniti.’“ Rekao je: „Allah je na njih poslao vatru koja ih je spaljivala. Zatim je stvorio druga stvorenja i rekao: ‘Ja stvaram čovjeka od gline, pa učinite sedždu Ademu!’ Odbila su, pa je Allah na njih poslao vatru i ona ih je spalila.“ Rekao je: „Zatim je stvorio ove i rekao: ‘Zar nećete učiniti sedždu Ademu?’ Odgovorili su: ‘Hoćemo.’“ Rekao je: „Iblis je bio od onih koji su odbili učiniti sedždu Ademu.“\u003c/p>\u003cp data-pair=\"87.2\" id=\"odlomak-87-2\">Drugi su rekli: „Naprotiv, razlog tome bio je što je on bio jedan od preostalih džina koji su živjeli na Zemlji, na njoj prolijevali krv i činili nered te bili nepokorni svome Gospodaru, pa su se meleki borili protiv njih.“\u003c/p>\u003cp data-pair=\"87.3\" id=\"odlomak-87-3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"87.4\" id=\"odlomak-87-4\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jahja ibn Vadih, koji je rekao: pričao nam je Ebu Seid el-Jahmedi, Ismail ibn Ibrahim, koji je rekao: pričao mi je Sevvar ibn el-Dža‘d el-Jahmedi, od Šehra ibn Havšeba, \u003c/span>o riječima: „Bio je od džina.“ Rekao je: „Iblis je bio od džina koje su meleki protjerali. Jedan od meleka zarobio ga je i odveo na nebo.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"87.5\" id=\"odlomak-87-5\">\u003cspan class=\"isnad\">Pričao mi je Ali ibn el-Hasen, koji je rekao: pričao mi je Ebu Nasr Ahmed ibn Muhammed el-Hallal, koji je rekao: pričao mi je Sunejd ibn Davud, koji je rekao: pričao nam je Hušejm, koji je rekao: obavijestio nas je Abdurrahman ibn Jahja, od Muse ibn Numejra i Osmana ibn Seida ibn Kamila, od Sa‘da ibn Mesuda, koji je rekao: \u003c/span>„Meleki su se borili protiv džina, pa je Iblis odveden u ropstvo dok je bio mali. Boravio je s melekima i s njima činio ibadet. Kada im je naređeno da učine sedždu Ademu, oni su je učinili, a Iblis je odbio. Zato Allah, Silan i Uzvišen, kaže: ‘Osim Iblisa; bio je od džina.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":88,"html":"\u003csection class=\"page\" data-page=\"88\" id=\"stranica-88\">\u003ch2>Stranica 88\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 88\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"88.1\" id=\"ar-odlomak-88-1\">قال ابو جعفر: وأولى الأقوال في ذلك عندي بالصواب أن يقال كما قال الله عز وجل: «وَإِذْ قُلْنا لِلْمَلائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِ» ، وجائز أن يكون فسوقه عن أمر ربه كان من أجل أنه كان من الجن، وجائز أن يكون من أجل إعجابه بنفسه لشدة اجتهاده كان في عبادة ربه، وكثرة علمه، وما كان أوتي من ملك السماء الدنيا والأرض وخزن الجنان وجائز أن يكون كان لغير ذلك من الأمور، ولا يدرك علم ذلك إلا بخبر تقوم به الحجة، ولا خبر في ذلك عندنا كذلك، والاختلاف في أمره على ما حكينا ورويناه.\u003c/p>\u003cp data-pair=\"88.2\" id=\"ar-odlomak-88-2\">وقد قيل: إن سبب هلاكه كان من أجل أن الأرض كان فيها قبل آدم الجن، فبعث الله إبليس قاضيا يقضي بينهم، فلم يزل يقضي بينهم بالحق ألف سنة حتى سمي حكما، وسماه الله به، وأوحى إليه اسمه، فعند ذلك دخله الكبر، فتعظم وتكبر، وألقى بين الذين كان الله بعثه إليهم حكما البأس والعداوة والبغضاء، فاقتتلوا عند ذلك في الأرض ألفي سنة فيما زعموا، حتى إن خيولهم تخوض في دمائهم، قالوا: وذلك قول الله تبارك وتعالى: «أَفَعَيِينا بِالْخَلْقِ الْأَوَّلِ بَلْ هُمْ فِي لَبْسٍ مِنْ خَلْقٍ جَدِيدٍ» ، وقول الملائكة: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ! فبعث الله تعالى عند ذلك نارا فأحرقتهم قالوا:\nفلما رأى إبليس ما نزل بقومه من العذاب عرج إلى السماء، فأقام عند الملائكة يعبد الله في السماء مجتهدا لم يعبده شيء من خلقه مثل عبادته، فلم يزل مجتهدا في العبادة حتى خلق الله آدم، فكان من امره ومعصيته ربه ما كان\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 88\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"88.1\" id=\"odlomak-88-1\">Ebu Džafer kaže: Smatram da je među mišljenjima o tome najispravnije reći onako kako je rekao Allah, Silan i Uzvišen: „I kada smo rekli melekima: Učinite sedždu Ademu!, oni su je učinili, osim Iblisa; bio je od džina pa je izišao iz pokornosti naredbi svoga Gospodara.“ Moguće je da je iz pokornosti naredbi svoga Gospodara izišao zato što je bio od džina. Moguće je i da je to bilo zbog samodopadnosti izazvane njegovom velikom revnošću u ibadetu Gospodaru, obilnim znanjem i onim što mu je dato od vlasti nad najbližim nebom i Zemljom i čuvanja džennetskih vrtova. Moguće je i da je bilo zbog nečega drugog. To se ne može znati osim na osnovu predaje kojom se uspostavlja dokaz, a mi o tome nemamo takvu predaju. Razilaženje o njegovom slučaju jeste onakvo kakvo smo izložili i prenijeli. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"88.2\" id=\"odlomak-88-2\">Rečeno je da je razlog njegove propasti bio to što su prije Adema na Zemlji živjeli džini, pa je Allah poslao Iblisa kao sudiju da im sudi. Neprestano im je hiljadu godina pravedno sudio, sve dok nije nazvan Hakemom. Allah ga je tako nazvao i objavio mu njegovo ime. Tada je u njega ušla oholost, pa se uzvisivao i uzoholio, a među one kojima ga je Allah poslao kao sudiju ubacio je sukob, neprijateljstvo i mržnju. Zatim su se, prema onome što tvrde, dvije hiljade godina međusobno borili na Zemlji, toliko da su im konji gazili kroz njihovu krv. Rekli su: „To su riječi Allaha, Blagoslovljenog i Uzvišenog: ‘Zar Nas je prvo stvaranje iscrpilo? Naprotiv, oni su u nedoumici o novom stvaranju’, i riječi meleka: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’“ Uzvišeni Allah tada je na njih poslao vatru pa ih je spalila. Rekli su: „Kada je Iblis vidio kakva je kazna zadesila njegov narod, uzdigao se na nebo. Boravio je među melekima na nebu i revno obožavao Allaha; nijedno Njegovo stvorenje nije Mu činilo ibadet poput njega. Neprestano je bio revan u ibadetu sve dok Allah nije stvorio Adema. Potom se u njegovom slučaju i njegovoj nepokornosti Gospodaru dogodilo ono što se dogodilo.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Kaf, 50:15; El-Bekara, 2:30, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":89,"html":"\u003csection class=\"page\" data-page=\"89\" id=\"stranica-89\">\u003ch2>Stranica 89\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 89\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"89.1\" id=\"ar-odlomak-89-1\">[القول في خلق آدم ع]\u003c/p>\u003cp data-pair=\"89.2\" id=\"ar-odlomak-89-2\">وكان مما حدث في أيام سلطانه وملكه خلق الله تعالى ذكره أبانا آدم أبا البشر، وذلك لما أراد جل جلاله أن يطلع ملائكته على ما قد علم من انطواء إبليس على الكبر ولم يعلمه الملائكة، وأراد إظهار أمره لهم حين دنا أمره للبوار، وملكه وسلطانه للزوال، فقال عز ذكره لما أراد ذلك للملائكة: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» ، فأجابوه بأن قالوا له: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ! فروي عن ابْنِ عَبَّاسٍ أن الملائكة قالت ذلك كذلك للذين قد كانوا عهدوا من أمر الجن الذين كانوا سكان الأرض قبل ذلك، فقالوا لربهم جل ثناؤه لما قال لهم: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» أتجعل فيها من يكون فيها مثل الجن الذين كانوا فيها، فكانوا يسفكون فيها الدماء ويفسدون فيها ويعصونك، وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لك، فقال الرب تعالى ذكره لهم: «إِنِّي أَعْلَمُ ما لا تَعْلَمُونَ» ، يقول: اعلم ما لا تعلمون من انطواء إبليس على التكبر، وعزمه على خلافه أمري، وتسويل نفسه له الباطل واغتراره، وأنا مبد ذلك لكم منه لتروا ذلك منه عيانا.\u003c/p>\u003cp data-pair=\"89.3\" id=\"ar-odlomak-89-3\">وقيل أقوال كثيرة في ذلك، قد حكينا منها جملا في كتابنا المسمى:\n\nجامع البيان عن تأويل آي القرآن، فكرهنا إطالة الكتاب بذكر ذلك في هذا الموضع.\u003c/p>\u003cp data-pair=\"89.4\" id=\"ar-odlomak-89-4\">فلما أراد الله عز وجل أن يخلق آدم ع أمر بتربته أن تؤخذ من الأرض، كما \u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 89\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"89.1\" id=\"odlomak-89-1\">Rasprava o stvaranju Adema, alejhis-selam\u003c/p>\u003cp data-pair=\"89.2\" id=\"odlomak-89-2\">Među događajima iz vremena njegove vlasti i vladavine bilo je to što je Allah, Uzvišen je spomen Njegov, stvorio našeg oca Adema, oca čovječanstva. To se dogodilo kada je On, Uzvišeno je Njegovo veličanstvo, htio Svojim melekima pokazati ono što je znao o oholosti koju je Iblis skrivao u sebi, a meleki za nju nisu znali. Htio im je otkriti njegov slučaj kada mu se približila propast, a njegovoj vlasti i vladavini nestanak. Kada je to htio, On, Silan je spomen Njegov, rekao je melekima: „Ja ću na Zemlji postaviti namjesnika.“ Odgovorili su Mu: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?“ Od Ibn Abbasa preneseno je da su meleki to rekli zbog onoga što su već znali o džinima koji su prije toga nastanjivali Zemlju. Kada im je njihov Gospodar, Uzvišena je Njegova hvala, rekao: „Ja ću na Zemlji postaviti namjesnika“, odgovorili su: „Zar ćeš na njoj postaviti nekoga poput džina koji su na njoj bili, prolijevali krv, činili nered i bili Ti nepokorni, dok mi Tebe s hvalom slavimo i svetost Ti iskazujemo?“ Njihov Gospodar, Uzvišen je spomen Njegov, rekao im je: „Ja znam ono što vi ne znate.“ To znači: „Znam ono što vi ne znate o Iblisovoj skrivenoj oholosti, njegovoj namjeri da se suprotstavi Mojoj naredbi, o tome kako mu duša uljepšava neistinu i kako se zavarava. To ću vam kod njega otkriti kako biste vlastitim očima vidjeli.“ \u003cspan class=\"translator-note\">⟦Prijevodi izričito navedenih kur’anskih riječi: El-Bekara, 2:30. Prošireni odgovori i objašnjenje iza „To znači“ pripadaju navedenom tumačenju.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"89.3\" id=\"odlomak-89-3\">O tome je izneseno mnogo mišljenja. Neka od njih izložili smo u svojoj knjizi pod naslovom „Džamiul-bejan an te’vili ajil-Kur’an“, pa nismo željeli oduljiti ovu knjigu njihovim navođenjem na ovome mjestu.\u003c/p>\u003cp data-pair=\"89.4\" id=\"odlomak-89-4\">Kada je Allah, Silan i Uzvišen, htio stvoriti Adema, alejhis-selam, naredio je da se zemlja za njega uzme sa Zemlje, kako \u003cspan class=\"isnad\">nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":90,"html":"\u003csection class=\"page\" data-page=\"90\" id=\"stranica-90\">\u003ch2>Stranica 90\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 90\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"90.1\" id=\"ar-odlomak-90-1\">\u003cspan class=\"isnad\">بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>ثُمَّ أَمَرَ- يَعْنِي الرَّبَّ تَبَارَكَ وَتَعَالَى بِتُرْبَةِ آدَمَ فَرُفِعَتْ، فخلق الله آدم من طين لا رب- وَاللازِبُ اللَّزِجُ الطَّيِّبُ- مِنْ حَمَإٍ مَسْنُونٍ، مُنْتِنٍ، قَالَ:\nوَإِنَّمَا كَانَ حَمَأً مَسْنُونًا بَعْدَ التُّرَابِ، قَالَ: فَخَلَقَ مِنْهُ آدَمَ بِيَدِهِ.\u003c/p>\u003cp data-pair=\"90.2\" id=\"ar-odlomak-90-2\">\u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بن هارون، قال: حدثنا عمرو بن حماد، قال:\nحدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابن مسعود- وعن ناس من أصحاب النبي ص، قَالَ: \u003c/span>قَالَتِ الْمَلائِكَةُ: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» يعنى من شان ابليس، فبعث الله جبرئيل ع إِلَى الأَرْضِ لِيَأْتِيَهُ بِطِينٍ مِنْهَا، فَقَالَتِ الأَرْضُ: إِنِّي أَعُوذُ بِاللَّهِ مِنْكَ أَنْ تُنْقِصَ مِنِّي شيئا وتشينى، فَرَجَعَ وَلَمْ يَأْخُذْ، وَقَالَ: يَا رَبِّ إِنَّهَا عَاذَتْ بِكَ فَأَعَذْتُهَا، فَبَعَثَ مِيكَائِيلَ فَعَاذَتْ مِنْهُ فاعاذها فرجع، فقال كما قال جبرئيل، فبعث ملك الموت فَعَاذَتْ مِنْهُ، فَأَعَاذَهَا فَرَجَعَ، فَقَالَ كَمَا قَالَ جبرئيل، فَبَعَثَ مَلَكُ الْمَوْتِ فَعَاذَتْ مِنْهُ، فَقَالَ: وَأَنَا أَعُوذُ بِاللَّهِ أَنْ أَرْجِعَ، وَلَمْ أُنَفِّذْ أَمْرَهُ، فاخذ مِنْ وَجْهِ الأَرْضِ، وَخَلَطَ فَلَمْ يَأْخُذْ مِنْ مَكَانٍ وَاحِدٍ، وَأَخَذَ مِنْ تُرْبَةٍ حَمْرَاءَ وَبَيْضَاءَ وَسَوْدَاءَ، فَلِذَلِكَ خَرَجَ بَنُو آدَمَ مُخْتَلِفِينَ، فَصَعِدَ بِهِ فَبَلَّ التُّرَابَ حَتَّى عَادَ طِينًا لازِبًا- وَاللازِبُ هُوَ الَّذِي يَلْتَزِقُ بَعْضُهُ بِبَعْضٍ- ثُمَّ تُرِكَ حَتَّى تَغَيَّرَ وَأَنْتَنَ، وَذَلِكَ حِينَ يَقُولُ: «مِنْ حَمَإٍ مَسْنُونٍ*» ، قَالَ: مُنْتِنٌ.\u003c/p>\u003cp data-pair=\"90.3\" id=\"ar-odlomak-90-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَعْقُوبُ الْقُمِّيُّ، عَنْ جَعْفَرِ بْنِ أَبِي الْمُغِيرَةِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>بَعَثَ رَبُّ الْعِزَّةِ عز وَجَلَّ إِبْلِيسَ، فَأَخَذَ مِنْ أَدِيمِ الأَرْضِ، مِنْ عَذْبِهَا وَمَلْحِهَا، فَخَلَقَ مِنْهُ آدَمَ،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 90\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"90.1\" id=\"odlomak-90-1\">\u003cspan class=\"isnad\">Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: \u003c/span>„Zatim je naredio — misli se na Gospodara, Blagoslovljenog i Uzvišenog — da se donese zemlja za Adema, pa je podignuta. Allah je stvorio Adema od ljepljive gline — lazib je ljepljiv i dobar — od promijenjenog crnog blata neugodnog mirisa.“ Rekao je: „Crno, promijenjeno blato nastalo je poslije zemlje.“ Rekao je: „Od njega je Svojom rukom stvorio Adema.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u prvom izrazu izvor ima طين لا رب, a odmah potom objašnjava riječ اللازب. „Ljepljiva glina“ ovdje slijedi to objašnjenje; prvo mjesto očigledno zahtijeva provjeru zapisa.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"90.2\" id=\"odlomak-90-2\">\u003cspan class=\"isnad\">Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: \u003c/span>„Meleki su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo? Rekao je: Ja znam ono što vi ne znate’ — misleći na Iblisov slučaj. Allah je poslao Džibrila, alejhis-selam, na Zemlju da Mu donese gline s nje. Zemlja je rekla: ‘Utječem se Allahu od tebe, da nešto od mene ne oduzmeš i ne naružiš me.’ Vratio se ne uzevši ništa i rekao: ‘Gospodaru moj, zatražila je zaštitu kod Tebe, pa sam joj je pružio.’ Zatim je poslao Mikaila, a ona je od njega zatražila zaštitu. On joj je pružio zaštitu i vratio se, pa rekao isto što je rekao Džibril. Zatim je poslao meleka smrti. Ona je od njega zatražila zaštitu, pa joj je pružio zaštitu i vratio se, rekavši isto što je rekao Džibril. Zatim je poslao meleka smrti. Ona je od njega zatražila zaštitu, a on je rekao: ‘I ja se utječem Allahu od toga da se vratim a da nisam izvršio Njegovu naredbu.’ Uzeo je s površine Zemlje i pomiješao; nije uzeo samo s jednoga mjesta. Uzeo je crvene, bijele i crne zemlje, pa su zato Ademovi potomci različiti. Uzdižući se, ponio je to, pa je nakvasio zemlju dok nije postala ljepljiva glina — lazib je ono čiji se dijelovi lijepe jedni za druge. Zatim je ostavljena dok se nije promijenila i dobila neugodan miris. To je ono kada kaže: ‘Od promijenjenog crnog blata.’“ Rekao je: „Neugodnog mirisa.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dio; izraz من حمإ مسنون nalazi se u El-Hidžr, 15:26, 28 i 33. Napomena prevodioca: slanje meleka smrti u izvoru se pojavljuje dvaput, s različitim ishodima. Oba mjesta sačuvana su, bez uklanjanja ponavljanja.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"90.3\" id=\"odlomak-90-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jakub el-Kummi, od Džafera ibn Ebu Mugire, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: \u003c/span>„Gospodar moći, Silan i Uzvišen, poslao je Iblisa. On je uzeo s površine Zemlje, od njene slatke i slane zemlje, pa je od toga stvorio Adema,\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":91,"html":"\u003csection class=\"page\" data-page=\"91\" id=\"stranica-91\">\u003ch2>Stranica 91\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 91\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"91.1\" id=\"ar-odlomak-91-1\">وَمِنْ ثَمَّ سُمِّيَ آدَمَ، لأَنَّهُ خُلِقَ مِنْ أَدِيمِ الأَرْضِ، وَمِنْ ثَمَّ قَالَ إِبْلِيسُ:\n\n«أَأَسْجُدُ لِمَنْ خَلَقْتَ طِيناً» ، أَيْ هَذِهِ الطِّينَةُ أَنَا جِئْتُ بِهَا.\u003c/p>\u003cp data-pair=\"91.2\" id=\"ar-odlomak-91-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا أَبُو دَاوُدَ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي حُصَيْنٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: \u003c/span>إِنَّمَا سُمِّيَ آدَمَ لأَنَّهُ خُلِقَ مِنْ أَدِيمِ الأَرْضِ\u003c/p>\u003cp data-pair=\"91.3\" id=\"ar-odlomak-91-3\">\u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ إسحاق الأهوازي، قال: حدثنا أبو أحمد، قال:\n\nحدثنا مسعر، عن أبي حصين، عن سعيد بْنِ جُبَيْرٍ، قَالَ: \u003c/span>خُلِقَ آدَمُ مِنْ أَدِيمِ الأَرْضِ فَسُمِّيَ آدَمَ.\u003c/p>\u003cp data-pair=\"91.4\" id=\"ar-odlomak-91-4\">\u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ إِسْحَاقَ، قَالَ: حَدَّثَنَا أَبُو أَحْمَدَ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ ثَابِتٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، [عَنْ عَلِيٍّ رَضِيَ اللَّهُ عَنْهُ، قَالَ:\n\n\u003c/span>إِنَّ آدَمَ خُلِقَ مِنْ أَدِيمِ الأَرْضِ، فِيهِ الطَّيِّبُ وَالصَّالِحُ وَالرَّدِيءُ، فَكُلُّ ذَلِكَ أَنْتَ رَاءٍ فِي وَلَدِهِ الصَّالِحِ وَالرَّدِيءِ] .\u003c/p>\u003cp data-pair=\"91.5\" id=\"ar-odlomak-91-5\">\u003cspan class=\"isnad\">حَدَّثَنِي يَعْقُوبُ بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ عَوْفٍ- وَحَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ وَعُمَرُ بْنُ شَبَّةَ، قَالا: حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، قَالَ:\nحَدَّثَنَا عَوْفٌ وَحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ وَمُحَمَّدُ بْنُ جَعْفَرٍ وَعَبْدُ الْوَهَّابِ الثَّقَفِيُّ، قَالُوا: حَدَّثَنَا عَوْفٌ وحدثني مُحَمَّدُ بْنُ عُمَارَةَ الأَسَدِيُّ، قَالَ: حَدَّثَنَا إِسْمَاعِيلُ بْنُ أَبَانٍ، قَالَ: حَدَّثَنَا عَنْبَسَةُ، عَنْ عَوْفٍ الأَعْرَابِيِّ- عَنْ قَسَامَةَ بْنِ زُهَيْرٍ، عَنْ أَبِي مُوسَى الأَشْعَرِيِّ، قَالَ: [قَالَ رسول الله ص: \u003c/span>إِنَّ اللَّهَ خَلَقَ آدَمَ مِنْ قَبْضَةٍ قَبَضَهَا مِنْ جَمِيعِ الأَرْضِ، فَجَاءَ بَنُو آدَمَ عَلَى قَدْرِ الأَرْضِ، جَاءَ مِنْهُمُ الأَحْمَرُ، وَالأَسْوَدُ، وَالأَبْيَضُ، وَبَيْنَ ذَلِكَ وَالسَّهْلُ، وَالْحَزْنُ، وَالْخَبِيثُ، وَالطَّيِّبُ، ثُمَّ بُلَّتْ طِينَتُهُ حَتَّى صَارَتْ طِينًا لازِبًا، ثُمَّ تُرِكَتْ حَتَّى صَارَتْ حَمَأً مَسْنُونًا، ثُمَّ تُرِكَتْ حَتَّى صَارَتْ صَلْصَالا\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 91\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"91.1\" id=\"odlomak-91-1\">i zato je nazvan Adem, jer je stvoren od edima — površine Zemlje. Zato je Iblis rekao: ‘Zar da učinim sedždu onome koga si stvorio od gline?’ — to jest: ‘Ja sam donio ovu glinu.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:61, navedeni dio. „Edim“ prenosi riječ أديم na kojoj se zasniva navedeno objašnjenje imena.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"91.2\" id=\"odlomak-91-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn el-Musenna, koji je rekao: pričao nam je Ebu Davud, koji je rekao: pričao nam je Šu‘ba, od Ebu Husajna, od Seida ibn Džubejra, koji je rekao: \u003c/span>„Nazvan je Adem zato što je stvoren od površine Zemlje.“\u003c/p>\u003cp data-pair=\"91.3\" id=\"odlomak-91-3\">\u003cspan class=\"isnad\">Pričao mi je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričao nam je Mis‘ar, od Ebu Husajna, od Seida ibn Džubejra, koji je rekao: \u003c/span>„Adem je stvoren od površine Zemlje, pa je nazvan Adem.“\u003c/p>\u003cp data-pair=\"91.4\" id=\"odlomak-91-4\">\u003cspan class=\"isnad\">Pričao mi je Ahmed ibn Ishak, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričao nam je Amr ibn Sabit, od svoga oca, od svoga djeda, od Alija, radijallahu anhu, koji je rekao: \u003c/span>„Adem je stvoren od površine Zemlje. U njoj ima dobroga, valjanoga i lošega. Sve to vidiš i među njegovim potomcima: valjane i loše.“\u003c/p>\u003cp data-pair=\"91.5\" id=\"odlomak-91-5\">\u003cspan class=\"isnad\">Pričao mi je Jakub ibn Ibrahim, koji je rekao: pričao nam je Ibn Ulejja, od Avfa — a pričali su nam i Muhammed ibn Beššar i Omer ibn Šebbe; obojica su rekli: pričao nam je Jahja ibn Seid, koji je rekao: pričao nam je Avf. Pričao nam je i Ibn Beššar, koji je rekao: pričali su nam Ibn Ebu Adijj, Muhammed ibn Džafer i Abdulvehhab es-Sekafi; rekli su: pričao nam je Avf. Pričao mi je i Muhammed ibn Umara el-Esedi, koji je rekao: pričao nam je Ismail ibn Eban, koji je rekao: pričao nam je Anbesa, od Avfa el-A‘rabija — od Kasame ibn Zuhejra, od Ebu Muse el-Eš‘arija, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Allah je stvorio Adema od pregršti koju je zahvatio sa cijele Zemlje. Ademovi potomci došli su prema svojstvima Zemlje: među njima ima crvenih, crnih, bijelih i onih između toga; blagih i grubih, loših i dobrih. Zatim je njegova glina nakvašena dok nije postala ljepljiva glina. Zatim je ostavljena dok nije postala promijenjeno crno blato, pa je potom ostavljena dok nije postala suha glina,\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":92,"html":"\u003csection class=\"page\" data-page=\"92\" id=\"stranica-92\">\u003ch2>Stranica 92\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 92\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"92.1\" id=\"ar-odlomak-92-1\">كَمَا قَالَ اللَّهُ تَعَالَى: «وَلَقَدْ خَلَقْنَا الْإِنْسانَ مِنْ صَلْصالٍ مِنْ حَمَإٍ مَسْنُونٍ] » .\u003c/p>\u003cp data-pair=\"92.2\" id=\"ar-odlomak-92-2\">\u003cspan class=\"isnad\">وَحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ وَعَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، قَالا: حَدَّثَنَا سُفْيَانُ، عَنِ الأَعْمَشِ، عَنْ مُسْلِمٍ الْبُطَيْنِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: \u003c/span>خُلِقَ آدَمُ مِنْ ثَلاثَةٍ: مِنْ صَلْصَالٍ، وَمِنْ حَمَإٍ، وَمِنْ طِينٍ لازِبٍ فَأَمَّا اللازِبُ فَالْجَيِّدُ، وَأَمَّا الْحَمَأُ فَالْحَمِئَةُ، وَأَمَّا الصَّلْصَالُ فَالتُّرَابُ الْمُدَقَّقُ، ويعنى تعالى ذكره بقوله: «مِنْ صَلْصالٍ*» ، مِنْ طِينٍ يَابِسٍ لَهُ صَلْصَلَةٌ، وَالصَّلْصَلَةُ: الصَّوْتُ.\u003c/p>\u003cp data-pair=\"92.3\" id=\"ar-odlomak-92-3\">وَذَكَرَ أَنَّ اللَّهَ تعالى ذَكَرَهُ لَمَّا خَمَّرَ طِينَةَ آدَمَ تَرَكَهَا أَرْبَعِينَ لَيْلَةً، وَقِيلَ أَرْبَعِينَ عَامًا جَسَدًا مُلْقًى.\u003c/p>\u003cp data-pair=\"92.4\" id=\"ar-odlomak-92-4\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"92.5\" id=\"ar-odlomak-92-5\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\u003c/span>أَمَرَ اللَّهُ تَبَارَكَ وَتَعَالَى بِتُرْبَةِ آدَمَ فَرُفِعَتْ، فَخُلِقَ آدَمُ مِنْ طِينٍ لازِبٍ مِنْ حَمَإٍ مَسْنُونٍ قَالَ: وَإِنَّمَا كَانَ حَمَأً مَسْنُونًا بَعْدَ التُّرَابِ، قَالَ: فَخَلَقَ مِنْهُ آدَمَ بِيَدِهِ، قَالَ: فَمَكَثَ أَرْبَعِينَ لَيْلَةً جَسَدًا مُلْقًى، فَكَانَ إِبْلِيسُ يَأْتِيهِ فَيَضْرِبُهُ بِرِجْلِهِ، فَيُصَلْصِلُ فَيُصَوِّتُ، قَالَ: فَهُوَ قَوْلُ اللَّهِ تَبَارَكَ وَتَعَالَى: «مِنْ صَلْصالٍ كَالْفَخَّارِ» ، يَقُولُ: كَالشَّيْءِ الْمُنْفَرِجِ الَّذِي لَيْسَ بِمُصْمَتٍ، قَالَ: ثُمَّ يَدْخُلُ فِي فِيهِ وَيَخْرُجُ مِنْ دُبُرِهِ، وَيَدْخُلُ فِي دُبُرِهِ وَيَخْرُجُ مِنْ فِيهِ، ثُمَّ يَقُولُ:\nلَسْتَ شَيْئًا لِلصَّلْصَلَةِ، وَلِشَيْءٍ مَا خُلِقْتَ، وَلَئِنْ سُلِّطْتُ عَلَيْكَ لأُهْلِكَنَّكَ، وَلَئِنْ سُلِّطْتَ عَلَيَّ لاعصينك\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 92\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"92.1\" id=\"odlomak-92-1\">kako je Uzvišeni Allah rekao: I zaista smo čovjeka stvorili od suhe gline, od promijenjenog crnog blata.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Hidžr, 15:26.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"92.2\" id=\"odlomak-92-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar, koji je rekao: pričali su nam Jahja ibn Seid i Abdurrahman ibn Mehdi; obojica su rekli: pričao nam je Sufjan, od A‘meša, od Muslima el-Butajna, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: \u003c/span>„Adem je stvoren od troje: od salsala, od hamea i od ljepljive gline. Lazib je dobar; hame je mulj; a salsal je usitnjena zemlja.“ On, Uzvišen je spomen Njegov, riječima „od salsala“ misli na suhu glinu koja zveči, a salsala je zvuk. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: sačuvani su nazivi صلصال („salsal“), حمإ („hame“) i لازب („lazib“) jer ih tekst pojedinačno objašnjava. Izraz من صلصال pojavljuje se u El-Hidžr, 15:26, 28 i 33, te Er-Rahman, 55:14.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"92.3\" id=\"odlomak-92-3\">Navedeno je da je Allah, Uzvišen je spomen Njegov, kada je umijesio Ademovu glinu, ostavio je četrdeset noći; rečeno je i četrdeset godina, kao položeno tijelo.\u003c/p>\u003cp data-pair=\"92.4\" id=\"odlomak-92-4\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"92.5\" id=\"odlomak-92-5\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: \u003c/span>„Allah, Blagoslovljen i Uzvišen, naredio je da se donese zemlja za Adema, pa je podignuta. Adem je stvoren od ljepljive gline, od promijenjenog crnog blata.“ Rekao je: „Crno, promijenjeno blato nastalo je poslije zemlje.“ Rekao je: „Od njega je Svojom rukom stvorio Adema.“ Rekao je: „Četrdeset noći ostao je kao položeno tijelo. Iblis mu je dolazio, udarao ga nogom, a ono bi zazvečalo i pustilo zvuk.“ Rekao je: „To su riječi Allaha, Blagoslovljenog i Uzvišenog: ‘Od suhe gline poput grnčarije’ — znači poput nečega šupljeg, što nije puno.“ Rekao je: „Potom bi ulazio na njegova usta i izlazio kroz njegov stražnji otvor, te ulazio kroz njegov stražnji otvor i izlazio na usta. Zatim bi rekao: ‘Nisi ništa, jer zvečiš. Za neku si svrhu stvoren. Ako mi bude data vlast nad tobom, sigurno ću te uništiti; a ako tebi bude data vlast nada mnom, sigurno ću ti biti nepokoran.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Er-Rahman, 55:14, navedeni dio. Napomena prevodioca: rečenica لست شيئا للصلصلة je jezički neobična; „jer zvečiš“ ovdje je kontekstualno čitanje završnog izraza.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":93,"html":"\u003csection class=\"page\" data-page=\"93\" id=\"stranica-93\">\u003ch2>Stranica 93\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 93\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"93.1\" id=\"ar-odlomak-93-1\">\u003cspan class=\"isnad\">حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب رسول الله ص، قَالَ اللَّهُ لِلْمَلائِكَةِ: \u003c/span>«إِنِّي خالِقٌ بَشَراً مِنْ طِينٍ.\nفَإِذا سَوَّيْتُهُ وَنَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ ساجِدِينَ» ، فَخَلَقَهُ اللَّهُ عَزَّ وَجَلَّ بِيَدَيْهِ لِكَيْلا يَتَكَبَّرُ ابليس عنه ليقول حين يتكبر: تتكبر عَمَّا عَمِلْتُ بِيَدِي وَلَمْ أَتَكَبَّرْ أَنَا عَنْهُ! فَخَلَقَهُ بَشَرًا، فَكَانَ جَسَدًا مِنْ طِينٍ أَرْبَعِينَ سَنَةً مِنْ مِقْدَارِ يَوْمِ الْجُمُعَةِ، فَمَرَّتْ بِهِ الْمَلائِكَةُ فَفَزِعُوا مِنْهُ لَمَّا رَأَوْهُ، وَكَانَ أَشَدَّهُمْ فَزَعًا إِبْلِيسَ، فَكَانَ يَمُرُّ بِهِ فَيَضْرِبُهُ فَيُصَوِّتُ الْجَسَدُ كَمَا يُصَوِّتُ الْفَخَّارُ تَكُونُ لَهُ صَلْصَلَةٌ، فذلك حين يقول: «مِنْ صَلْصالٍ كَالْفَخَّارِ» ، وَيَقُولُ: لأَمْرٍ مَا خُلِقْتَ وَدَخَلَ مِنْ فِيهِ وَخَرَجَ مِنْ دُبُرِهِ، فَقَالَ لِلْمَلائِكَةِ: لا تَرْهَبُوا مِنْ هَذَا، فَإِنَّ رَبَّكُمْ صَمَدٌ وَهَذَا أَجْوَفُ، لَئِنْ سُلِّطْتُ عَلَيْهِ لأُهْلِكَنَّهُ.\u003c/p>\u003cp data-pair=\"93.2\" id=\"ar-odlomak-93-2\">\u003cspan class=\"isnad\">وَحَدَّثَنَا عَنِ الْحَسَنِ بن بلال، قال: حدثنا حماد بن سلمة، عَنْ سُلَيْمَانَ التَّيْمِيِّ، عَنْ أَبِي عُثْمَانَ النَّهْدِيِّ، عَنْ سَلْمَانَ الْفَارِسِيِّ، قَالَ: \u003c/span>خَمَّرَ اللَّهُ تَعَالَى طينه آدم ع أَرْبَعِينَ يَوْمًا، ثُمَّ جَمَعَهُ بِيَدَيْهِ، فَخَرَجَ طِيبُهُ بِيَمِينِهِ، وَخَبِيثُهُ بِشِمَالِهِ، ثُمَّ مَسَحَ يَدَيْهِ إِحْدَاهُمَا عَلَى الأُخْرَى، فَخَلَطَ بَعْضُهُ بِبَعْضٍ، فَمِنْ ثَمَّ يَخْرُجُ الطَّيِّبُ مِنَ الْخَبِيثِ، وَالْخَبِيثُ مِنَ الطَّيِّبِ.\u003c/p>\u003cp data-pair=\"93.3\" id=\"ar-odlomak-93-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابْنِ إِسْحَاقَ، قَالَ:\n\n\u003c/span>يُقَالُ- وَاللَّهُ أَعْلَمُ: خَلَقَ اللَّهُ آدَمَ، ثُمَّ وَضَعَهُ يَنْظُرُ إِلَيْهِ أَرْبَعِينَ يَوْمًا قَبْلَ أَنْ يَنْفُخَ فِيهِ الرُّوحَ، حَتَّى عَادَ صَلْصَالا كَالْفَخَّارِ، وَلَمْ تَمَسَّهُ نَارٌ، قَالَ: فلما\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 93\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"93.1\" id=\"odlomak-93-1\">\u003cspan class=\"isnad\">Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem: \u003c/span>„Allah je rekao melekima: ‘Ja stvaram čovjeka od gline. Pa kada ga uredim i u njega udahnem od Svoga Duha, padnite mu na sedždu.’ Allah, Silan i Uzvišen, stvorio ga je Svojim dvjema rukama kako se Iblis ne bi oholio prema njemu i da bi mu, kada se uzoholi, rekao: ‘Oholiš se prema onome što sam Ja načinio Svojom rukom, a Ja se prema njemu nisam uzoholio!’ Stvorio ga je kao čovjeka, pa je četrdeset godina od trajanja dana petka bio tijelo od gline. Meleki su prolazili pored njega i prestrašili se kada su ga vidjeli. Najviše ga se prestrašio Iblis. Prolazio bi pored njega i udarao ga, a tijelo bi davalo zvuk poput grnčarije, imalo bi svoj zveket. To je ono kada kaže: ‘Od suhe gline poput grnčarije.’ Govorio bi: ‘Za neku si svrhu stvoren.’ Ušao je na njegova usta i izašao kroz njegov stražnji otvor, pa je melekima rekao: ‘Ne bojte se ovoga! Vaš je Gospodar Samed, a ovo je šuplje. Ako mi bude data vlast nad njim, sigurno ću ga uništiti.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Sad, 38:71–72, navedeni dio; Er-Rahman, 55:14, navedeni dio. Naziv صمد („Samed“) sačuvan je bez dodavanja tumačenja.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"93.2\" id=\"odlomak-93-2\">\u003cspan class=\"isnad\">Preneseno nam je od Hasena ibn Bilala, koji je rekao: pričao nam je Hammad ibn Selema, od Sulejmana et-Tejmija, od Ebu Osmana en-Nehdija, od Selmana el-Farisija, koji je rekao: \u003c/span>„Uzvišeni Allah mijesio je glinu Adema, alejhis-selam, četrdeset dana, zatim ju je sakupio Svojim dvjema rukama. Njeno dobro izašlo je u Njegovoj desnoj, a njeno loše u Njegovoj lijevoj ruci. Potom je protrljao jednu ruku o drugu i pomiješao jedno s drugim. Zato dobro izlazi iz lošega, a loše iz dobroga.“\u003c/p>\u003cp data-pair=\"93.3\" id=\"odlomak-93-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: \u003c/span>„Govori se — a Allah najbolje zna — da je Allah stvorio Adema, zatim ga položio i gledao ga četrdeset dana prije nego što je u njega udahnuo duh, dok nije postao suha glina poput grnčarije, a vatra ga nije dotakla.“ Rekao je: „Kada je\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":94,"html":"\u003csection class=\"page\" data-page=\"94\" id=\"stranica-94\">\u003ch2>Stranica 94\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 94\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"94.1\" id=\"ar-odlomak-94-1\">مَضَى لَهُ مِنَ الْمُدَّةِ مَا مَضَى وَهُوَ طِينٌ صَلْصَالٌ كَالْفَخَّارِ، وَأَرَادَ عَزَّ وَجَلَّ أَنْ يَنْفُخَ فِيهِ الرُّوحَ، تَقَدَّمَ إِلَى الْمَلائِكَةِ فَقَالَ لَهُمْ: إِذَا نَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ سَاجِدِينَ.\u003c/p>\u003cp data-pair=\"94.2\" id=\"ar-odlomak-94-2\">فَلَمَّا نَفَخَ فِيهِ الرُّوحَ أَتَتْهُ الرُّوحُ مِنْ قِبَلِ رَأْسِهِ، فِيمَا ذُكِرَ عَنِ السَّلَفِ قَبْلِنَا أَنَّهُمْ قَالُوهُ.\u003c/p>\u003cp data-pair=\"94.3\" id=\"ar-odlomak-94-3\">ذِكْرُ مَنْ قَالَ ذلك:\u003c/p>\u003cp data-pair=\"94.4\" id=\"ar-odlomak-94-4\">\u003cspan class=\"isnad\">حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابن مسعود- وعن ناس من اصحاب النبي ص: \u003c/span>فَلَمَّا بَلَغَ الْحِينَ الَّذِي أَرَادَ اللَّهُ عَزَّ وَجَلَّ أَنْ يَنْفُخَ فِيهِ الرُّوحَ قَالَ لِلْمَلائِكَةِ: إِذَا نَفَخْتُ فِيهِ مِنْ رُوحِي فَاسْجُدُوا لَهُ، فَلَمَّا نَفَخَ فِيهِ الرُّوحَ فَدَخَلَ الرُّوحُ، فِي رَأْسِهِ عَطَسَ، فَقَالَتِ الْمَلائِكَةُ: قُلِ الْحَمْدُ لِلَّهِ، فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ اللَّهُ عَزَّ وَجَلَّ لَهُ: رَحِمَكَ رَبُّكَ فَلَمَّا دَخَلَ الرُّوحُ فِي عَيْنَيْهِ نَظَرَ إِلَى ثِمَارِ الْجَنَّةِ، فَلَمَّا دَخَلَ فِي جَوْفِهِ اشْتَهَى الطَّعَامَ، فَوَثَبَ قَبْلَ أَنْ تَبْلُغَ الرُّوحُ رِجْلَيْهِ عَجْلانَ إِلَى ثِمَارِ الْجَنَّةِ، فَذَلِكَ حِينَ يَقُولُ: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، «فَسَجَدَ الْمَلائِكَةُ كُلُّهُمْ أَجْمَعُونَ إِلَّا إِبْلِيسَ أَبى أَنْ يَكُونَ مَعَ السَّاجِدِينَ» ، «أَبى وَاسْتَكْبَرَ وَكانَ مِنَ الْكافِرِينَ» ، فقال الله له: «ما مَنَعَكَ أَلَّا تَسْجُدَ إِذْ أَمَرْتُكَ» لِمَا خَلَقْتُ بِيَدِي، قَالَ:\nأَنَا خَيْرٌ مِنْهُ، لَمْ أَكُنْ لأَسْجُدَ لِبَشَرٍ خَلَقْتَهُ مِنْ طِينٍ، قَالَ اللَّهُ لَهُ:\n\n«فَاهْبِطْ مِنْها فَما يَكُونُ لَكَ» - يَعْنِي مَا يَنْبَغِي لَكَ- «أَنْ تَتَكَبَّرَ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 94\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"94.1\" id=\"odlomak-94-1\">proteklo onoliko vremena koliko je proteklo dok je bio glina, suha poput grnčarije, i kada je On, Silan i Uzvišen, htio u njega udahnuti duh, unaprijed je rekao melekima: ‘Kada u njega udahnem od Svoga Duha, padnite mu na sedždu.’“\u003c/p>\u003cp data-pair=\"94.2\" id=\"odlomak-94-2\">Kada je u njega udahnuo duh, duh mu je došao od strane glave, prema onome što je navedeno da su rekli prethodnici prije nas.\u003c/p>\u003cp data-pair=\"94.3\" id=\"odlomak-94-3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"94.4\" id=\"odlomak-94-4\">\u003cspan class=\"isnad\">Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: \u003c/span>„Kada je došlo vrijeme u kojem je Allah, Silan i Uzvišen, htio u njega udahnuti duh, rekao je melekima: ‘Kada u njega udahnem od Svoga Duha, učinite mu sedždu.’ Kada je u njega udahnuo duh i duh ušao u njegovu glavu, kihnuo je. Meleki su rekli: ‘Reci: Hvala Allahu!’ Rekao je: ‘Hvala Allahu!’ Allah, Silan i Uzvišen, rekao mu je: ‘Smilovao ti se tvoj Gospodar.’ Kada je duh ušao u njegove oči, pogledao je džennetske plodove; kada je ušao u njegovu nutrinu, poželio je hranu. Skočio je, žureći prema džennetskim plodovima prije nego što je duh stigao do njegovih nogu. To je ono kada kaže: ‘Čovjek je stvoren od žurbe.’ ‘Pa su svi meleki zajedno učinili sedždu, osim Iblisa; odbio je biti među onima koji su je učinili.’ ‘Odbio je, uzoholio se i bio od nevjernika.’ Allah mu je rekao: ‘Šta te spriječilo da učiniš sedždu kada sam ti naredio’ — onome što sam stvorio Svojim dvjema rukama? Odgovorio je: ‘Ja sam bolji od njega. Neću učiniti sedždu čovjeku kojeg si stvorio od gline.’ Allah mu je rekao: ‘Siđi iz njega! Nije ti dopušteno’ — to jest: ne dolikuje ti — ‘da se uzoholiš \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Enbija, 21:37, navedeni dio; El-Hidžr, 15:30–31; El-Bekara, 2:34, navedeni dio; El-A‘raf, 7:12, navedeni dio, uz izraz iz Sad, 38:75; El-A‘raf, 7:13, početak ajeta. Nalozi o sedždi na početku ove stranice prenose formulacije predaje, a nisu zasebni doslovni navodi punog ajeta.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":95,"html":"\u003csection class=\"page\" data-page=\"95\" id=\"stranica-95\">\u003ch2>Stranica 95\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 95\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"95.1\" id=\"ar-odlomak-95-1\">فِيها فَاخْرُجْ إِنَّكَ مِنَ الصَّاغِرِينَ» ، وَالصّغَارُ الذُّلُّ.\u003c/p>\u003cp data-pair=\"95.2\" id=\"ar-odlomak-95-2\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>فَلَمَّا نَفَخَ اللَّهُ عَزَّ وَجَلَّ فِيهِ- يَعْنِي فِي آدَمَ- مِنْ رُوحِهِ أَتَتِ النَّفْخَةُ مِنْ قِبَلِ رَأْسِهِ، فَجَعَلَ لا يَجْرِي شَيْءٌ مِنْهَا فِي جَسَدِهِ إِلا صَارَ لَحْمًا وَدَمًا، فَلَمَّا انْتَهَتِ النَّفْخَةُ إِلَى سُرَّتِهِ نَظَرَ إِلَى جَسَدِهِ فَأَعْجَبَهُ مَا رَأَى مِنْ حُسْنِهِ، فَذَهَبَ لِيَنْهَضَ فَلَمْ يَقْدِرْ، فَهُوَ قَوْلُ الله عز وجل «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: ضَجِرًا لا صَبْرَ لَهُ عَلَى سَرَّاءٍ وَلا ضَرَّاءٍ، قَالَ: فَلَمَّا تَمَّتِ النَّفْخَةُ فِي جَسَدِهِ عَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، بِإِلْهَامِ اللَّهِ، فَقَالَ: يَرْحَمُكَ اللَّهُ يَا آدَمُ، ثُمَّ قَالَ لِلْمَلائِكَةِ الَّذِينَ كَانُوا مَعَ إِبْلِيسَ خَاصَّةً دُونَ الْمَلائِكَةِ الَّذِينَ فِي السَّمَوَاتُ: اسْجُدُوا لآدَمَ، فَسَجَدُوا كُلُّهُمْ أَجْمَعُونَ إِلا إِبْلِيسَ أَبَى وَاسْتَكْبَرَ، لِمَا كَانَ حَدَّثَ بِهِ نَفْسَهُ مِنْ كبره واغتراره، فقال: لا اسجد، وَأَنَا خَيْرٌ مِنْهُ وَأَكْبَرُ سِنًّا، وَأَقْوَى خَلْقًا، «خَلَقْتَنِي مِنْ نارٍ وَخَلَقْتَهُ مِنْ طِينٍ*» ، يَقُولُ: إِنَّ النَّارَ أَقْوَى مِنَ الطِّينِ، قَالَ: فَلَمَّا أَبَى إِبْلِيسُ أَنْ يَسْجُدَ أَبْلَسَهُ اللَّهُ تعالى، أيأسه مِنَ الْخَيْرِ كُلِّهِ، وَجَعَلَهُ شَيْطَانًا رَجِيمًا عُقُوبَةً لِمَعْصِيَتِهِ.\u003c/p>\u003cp data-pair=\"95.3\" id=\"ar-odlomak-95-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ، حَدَّثَنَا سَلَمَةُ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، قَالَ:\n\n\u003c/span>فَيُقَالُ- وَاللَّهُ أَعْلَمُ-: إِنَّهُ لَمَّا انْتَهَى الرُّوحُ إِلَى رَأْسِهِ عَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، قَالَ: فَقَالَ لَهُ رَبُّهُ: يَرْحَمُكَ رَبُّكَ، وَوَقَعَتِ الْمَلائِكَةُ حِينَ اسْتَوَى سُجُودًا لَهُ، حِفْظًا لِعَهْدِ اللَّهِ الَّذِي عَهِدَ إِلَيْهِمْ، وَطَاعَةً لأَمْرِهِ الَّذِي أَمَرَهُمْ بِهِ، وَقَامَ عدو الله ابليس من بينهم، فلم يسجد متكبرا متعظما بغيا وحسدا، فقال:\n«يَا إِبْلِيسُ مَا مَنَعَكَ أَنْ تَسْجُدَ لِما خَلَقْتُ بِيَدَيَّ» إِلَى قَوْلِهِ: «لَأَمْلَأَنَ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 95\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"95.1\" id=\"odlomak-95-1\">u njemu. Zato izađi! Ti si od poniženih.’ A sagar znači poniženje.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:13, nastavak. „Sagar“ prenosi الصغار, riječ koju autor objašnjava.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"95.2\" id=\"odlomak-95-2\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: \u003c/span>„Kada je Allah, Silan i Uzvišen, u njega — misli se na Adema — udahnuo od Svoga Duha, dah je došao od njegove glave. Kuda god bi po njegovom tijelu prošao, to bi postalo meso i krv. Kada je dah stigao do njegovog pupka, pogledao je svoje tijelo i zadivio se ljepoti k
