a Svojom rukom, udahnuo u njega od Svoga Duha i naredio skupini meleka pa su mu učinili sedždu. On je sjeo, kihnuo i rekao: ‘Hvala Allahu!’ Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar. Otiđi onoj skupini meleka i reci im: Es-selamu alejkum!’ Došao im je i rekao: ‘Es-selamu alejkum!’ Odgovorili su mu: ‘Ve alejkes-selamu ve rahmetullah!’ Zatim se vratio svome Gospodaru, Silnom i Uzvišenom, koji mu je rekao: ‘Ovo je tvoj pozdrav i pozdrav tvojih potomaka među njima.’ Kada je Iblis pokazao oholost i nepokornost svome Gospodaru koje je skrivao u sebi, a meleki su svome Gospodaru, Silnom i Uzvišenom, kada im je rekao: ‘Ja ću na Zemlji postaviti namjesnika’, već bili rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo?’, a njihov im Gospodar odgovorio: ‘Ja znam ono što vi ne znate’, otkrilo im se ono što im je bilo skriveno. Saznali su da među njima ima neko ko je nepokoran Allahu, Silnom i Uzvišenom, i protivi se Njegovoj naredbi.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda unutar predaje: El-Bekara, 2:30, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"96.3\">Zatim je Allah, Silan i Uzvišen, poučio Adema svim imenima. Učeni prethodnici prije nas razišli su se o imenima kojima je Adem poučen: je li poučen samo određenim imenima ili imenima općenito?\u003c/p>\u003cp data-paragraph=\"96.4\">Neki su rekli: „Poučen je imenu svega.“\u003c/p>","paragraphs":[{"id":"96.1","ar":"جَهَنَّمَ مِنْكَ وَمِمَّنْ تَبِعَكَ مِنْهُمْ أَجْمَعِينَ» ، قَالَ: فَلَمَّا فَرَغَ اللَّهُ تعالى مِنْ إِبْلِيسَ وَمُعَاتَبَتِهِ وَأَبَى إِلا الْمَعْصِيَةَ أَوْقَعَ اللَّهُ تعالى عَلَيْهِ اللَّعْنَةَ، وَأَخْرَجَهُ مِنَ الْجَنَّةِ.","bs":"Džehennem tobom i svima od njih koji te budu slijedili.’“ Rekao je: „Kada je Uzvišeni Allah završio s Iblisom i ukoravanjem njega, a on je ostao pri nepokornosti, Uzvišeni Allah spustio je na njega prokletstvo i izveo ga iz Dženneta.“ ⟦Prijevod završetka kur’anskog navoda s prethodne stranice: Sad, 38:85.⟧","ar_ranges":[],"ar_html":"جَهَنَّمَ مِنْكَ وَمِمَّنْ تَبِعَكَ مِنْهُمْ أَجْمَعِينَ» ، قَالَ: فَلَمَّا فَرَغَ اللَّهُ تعالى مِنْ إِبْلِيسَ وَمُعَاتَبَتِهِ وَأَبَى إِلا الْمَعْصِيَةَ أَوْقَعَ اللَّهُ تعالى عَلَيْهِ اللَّعْنَةَ، وَأَخْرَجَهُ مِنَ الْجَنَّةِ.","bs_ranges":[],"bs_html":"Džehennem tobom i svima od njih koji te budu slijedili.’“ Rekao je: „Kada je Uzvišeni Allah završio s Iblisom i ukoravanjem njega, a on je ostao pri nepokornosti, Uzvišeni Allah spustio je na njega prokletstvo i izveo ga iz Dženneta.“ \u003cspan class=\"translator-note\">⟦Prijevod završetka kur’anskog navoda s prethodne stranice: Sad, 38:85.⟧\u003c/span>"},{"id":"96.2","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ خَلَفٍ، قَالَ: حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، قَالَ:\nحَدَّثَنَا أَبُو خَالِدٍ سُلَيْمَانُ بْنُ حَيَّانَ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ، ع قَالَ أَبُو خَالِدٍ: وحدثني الأَعْمَشُ عَنْ أَبِي صالح، عن ابى هريرة، عن النبي ص قَالَ أَبُو خَالِدٍ:\nوحدثني دَاوُدُ بْنُ أَبِي هِنْدٍ عَنِ الشَّعْبِيِّ، عَنْ أَبِي هُرَيْرَةَ عَنِ النبي ص قَالَ أَبُو خَالِدٍ: وحدثني ابْنُ أَبِي ذُبَابٍ الدَّوْسِيُّ، قَالَ: حَدَّثَنِي سَعِيدٌ الْمَقْبُرِيُّ، وَيَزِيدُ بْنُ هرمز عن ابى هريرة، [عن النبي ص أَنَّهُ قَالَ: خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ بِيَدِهِ، وَنَفَخَ فِيهِ مِنْ رُوحِهِ، وَأَمَرَ الْمَلأَ مِنَ الْمَلائِكَةِ فَسَجَدُوا لَهُ، فَجَلَسَ فَعَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ لَهُ رَبُّهُ: يَرْحَمُكَ رَبُّكَ، ايت أُولَئِكَ الْمَلأَ مِنَ الْمَلائِكَةِ فَقُلْ لَهُمُ: السَّلامُ عَلَيْكُمْ فَأَتَاهُمْ فَقَالَ: السَّلامُ عَلَيْكُمْ، فَقَالُوا لَهُ: وَعَلَيْكَ السَّلامُ وَرَحْمَةُ اللَّهِ، ثُمَّ رَجَعَ إِلَى رَبِّهِ عَزَّ وَجَلَّ فَقَالَ لَهُ: هَذِهِ تَحِيَّتُكَ وَتَحِيَّةُ ذُرِّيَّتِكَ بَيْنَهُمْ فَلَمَّا أَظْهَرَ إِبْلِيسُ مِنْ نَفْسِهِ مَا كَانَ لَهُ مَخْفِيًّا فِيهَا مِنَ الْكِبْرِ وَالْمَعْصِيَةِ لِرَبِّهِ، وَكَانَتِ الْمَلائِكَةُ قَدْ قَالَتْ لِرَبِّهَا عَزَّ وَجَلَّ حِينَ قَالَ لَهُمْ: إِنِّي جاعل في الأرض خليفة: أَتَجْعَلُ فِيهَا مَنْ يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ فَقَالَ لَهُمْ رَبُّهُمْ:\nإِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ، تَبَيَّنَ لَهُمْ مَا كَانَ عَنْهُمْ مُسْتَتِرًا، وَعَلِمُوا أَنَّ فِيهِمْ مَنْ مِنْهُ الْمَعْصِيَةُ لِلَّهِ عَزَّ وَجَلَّ وَالْخِلافُ لأَمْرِهِ] .","bs":"Pričao mi je Muhammed ibn Halef, koji je rekao: pričao nam je Adem ibn Ebu Ijas, koji je rekao: pričao nam je Ebu Halid Sulejman ibn Hajjan, koji je rekao: pričao mi je Muhammed ibn Amr, od Ebu Seleme, od Ebu Hurejre, od Vjerovjesnika, alejhis-selam. Ebu Halid je rekao: a pričao mi je i A‘meš, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Davud ibn Ebu Hind, od Ša‘bija, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Ibn Ebu Zubab ed-Devsi, koji je rekao: pričali su mi Seid el-Makburi i Jezid ibn Hurmuz, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Allah, Silan i Uzvišen, stvorio je Adema Svojom rukom, udahnuo u njega od Svoga Duha i naredio skupini meleka pa su mu učinili sedždu. On je sjeo, kihnuo i rekao: ‘Hvala Allahu!’ Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar. Otiđi onoj skupini meleka i reci im: Es-selamu alejkum!’ Došao im je i rekao: ‘Es-selamu alejkum!’ Odgovorili su mu: ‘Ve alejkes-selamu ve rahmetullah!’ Zatim se vratio svome Gospodaru, Silnom i Uzvišenom, koji mu je rekao: ‘Ovo je tvoj pozdrav i pozdrav tvojih potomaka među njima.’ Kada je Iblis pokazao oholost i nepokornost svome Gospodaru koje je skrivao u sebi, a meleki su svome Gospodaru, Silnom i Uzvišenom, kada im je rekao: ‘Ja ću na Zemlji postaviti namjesnika’, već bili rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo?’, a njihov im Gospodar odgovorio: ‘Ja znam ono što vi ne znate’, otkrilo im se ono što im je bilo skriveno. Saznali su da među njima ima neko ko je nepokoran Allahu, Silnom i Uzvišenom, i protivi se Njegovoj naredbi.“ ⟦Prijevodi kur’anskih navoda unutar predaje: El-Bekara, 2:30, navedeni dijelovi.⟧","ar_ranges":[[0,581]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ خَلَفٍ، قَالَ: حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، قَالَ:\nحَدَّثَنَا أَبُو خَالِدٍ سُلَيْمَانُ بْنُ حَيَّانَ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ، ع قَالَ أَبُو خَالِدٍ: وحدثني الأَعْمَشُ عَنْ أَبِي صالح، عن ابى هريرة، عن النبي ص قَالَ أَبُو خَالِدٍ:\nوحدثني دَاوُدُ بْنُ أَبِي هِنْدٍ عَنِ الشَّعْبِيِّ، عَنْ أَبِي هُرَيْرَةَ عَنِ النبي ص قَالَ أَبُو خَالِدٍ: وحدثني ابْنُ أَبِي ذُبَابٍ الدَّوْسِيُّ، قَالَ: حَدَّثَنِي سَعِيدٌ الْمَقْبُرِيُّ، وَيَزِيدُ بْنُ هرمز عن ابى هريرة، [عن النبي ص \u003c/span>أَنَّهُ قَالَ: خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ بِيَدِهِ، وَنَفَخَ فِيهِ مِنْ رُوحِهِ، وَأَمَرَ الْمَلأَ مِنَ الْمَلائِكَةِ فَسَجَدُوا لَهُ، فَجَلَسَ فَعَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ لَهُ رَبُّهُ: يَرْحَمُكَ رَبُّكَ، ايت أُولَئِكَ الْمَلأَ مِنَ الْمَلائِكَةِ فَقُلْ لَهُمُ: السَّلامُ عَلَيْكُمْ فَأَتَاهُمْ فَقَالَ: السَّلامُ عَلَيْكُمْ، فَقَالُوا لَهُ: وَعَلَيْكَ السَّلامُ وَرَحْمَةُ اللَّهِ، ثُمَّ رَجَعَ إِلَى رَبِّهِ عَزَّ وَجَلَّ فَقَالَ لَهُ: هَذِهِ تَحِيَّتُكَ وَتَحِيَّةُ ذُرِّيَّتِكَ بَيْنَهُمْ فَلَمَّا أَظْهَرَ إِبْلِيسُ مِنْ نَفْسِهِ مَا كَانَ لَهُ مَخْفِيًّا فِيهَا مِنَ الْكِبْرِ وَالْمَعْصِيَةِ لِرَبِّهِ، وَكَانَتِ الْمَلائِكَةُ قَدْ قَالَتْ لِرَبِّهَا عَزَّ وَجَلَّ حِينَ قَالَ لَهُمْ: إِنِّي جاعل في الأرض خليفة: أَتَجْعَلُ فِيهَا مَنْ يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ فَقَالَ لَهُمْ رَبُّهُمْ:\nإِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ، تَبَيَّنَ لَهُمْ مَا كَانَ عَنْهُمْ مُسْتَتِرًا، وَعَلِمُوا أَنَّ فِيهِمْ مَنْ مِنْهُ الْمَعْصِيَةُ لِلَّهِ عَزَّ وَجَلَّ وَالْخِلافُ لأَمْرِهِ] .","bs_ranges":[[0,271],[273,393],[395,525],[527,707]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Halef, koji je rekao: pričao nam je Adem ibn Ebu Ijas, koji je rekao: pričao nam je Ebu Halid Sulejman ibn Hajjan, koji je rekao: pričao mi je Muhammed ibn Amr, od Ebu Seleme, od Ebu Hurejre, od Vjerovjesnika, alejhis-selam. Ebu Halid je rekao: \u003c/span>a \u003cspan class=\"isnad\">pričao mi je i A‘meš, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: \u003c/span>a \u003cspan class=\"isnad\">pričao mi je i Davud ibn Ebu Hind, od Ša‘bija, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: \u003c/span>a \u003cspan class=\"isnad\">pričao mi je i Ibn Ebu Zubab ed-Devsi, koji je rekao: pričali su mi Seid el-Makburi i Jezid ibn Hurmuz, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: \u003c/span>„Allah, Silan i Uzvišen, stvorio je Adema Svojom rukom, udahnuo u njega od Svoga Duha i naredio skupini meleka pa su mu učinili sedždu. On je sjeo, kihnuo i rekao: ‘Hvala Allahu!’ Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar. Otiđi onoj skupini meleka i reci im: Es-selamu alejkum!’ Došao im je i rekao: ‘Es-selamu alejkum!’ Odgovorili su mu: ‘Ve alejkes-selamu ve rahmetullah!’ Zatim se vratio svome Gospodaru, Silnom i Uzvišenom, koji mu je rekao: ‘Ovo je tvoj pozdrav i pozdrav tvojih potomaka među njima.’ Kada je Iblis pokazao oholost i nepokornost svome Gospodaru koje je skrivao u sebi, a meleki su svome Gospodaru, Silnom i Uzvišenom, kada im je rekao: ‘Ja ću na Zemlji postaviti namjesnika’, već bili rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo?’, a njihov im Gospodar odgovorio: ‘Ja znam ono što vi ne znate’, otkrilo im se ono što im je bilo skriveno. Saznali su da među njima ima neko ko je nepokoran Allahu, Silnom i Uzvišenom, i protivi se Njegovoj naredbi.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda unutar predaje: El-Bekara, 2:30, navedeni dijelovi.⟧\u003c/span>"},{"id":"96.3","ar":"ثُمَّ عَلَّمَ اللَّهُ عَزَّ وَجَلَّ آدَمَ الأَسْمَاءَ كُلَّهَا وَاخْتَلَفَ السَّلَفُ مِنْ أَهْلِ الْعِلْمِ قَبْلَنَا فِي الأَسْمَاءِ الَّتِي عُلِّمَهَا آدَمُ: أَخَاصًّا مِنَ الأَسْمَاءِ علم، اما عَامًّا؟","bs":"Zatim je Allah, Silan i Uzvišen, poučio Adema svim imenima. Učeni prethodnici prije nas razišli su se o imenima kojima je Adem poučen: je li poučen samo određenim imenima ili imenima općenito?","ar_ranges":[],"ar_html":"ثُمَّ عَلَّمَ اللَّهُ عَزَّ وَجَلَّ آدَمَ الأَسْمَاءَ كُلَّهَا وَاخْتَلَفَ السَّلَفُ مِنْ أَهْلِ الْعِلْمِ قَبْلَنَا فِي الأَسْمَاءِ الَّتِي عُلِّمَهَا آدَمُ: أَخَاصًّا مِنَ الأَسْمَاءِ علم، اما عَامًّا؟","bs_ranges":[],"bs_html":"Zatim je Allah, Silan i Uzvišen, poučio Adema svim imenima. Učeni prethodnici prije nas razišli su se o imenima kojima je Adem poučen: je li poučen samo određenim imenima ili imenima općenito?"},{"id":"96.4","ar":"فَقَالَ بَعْضُهُمْ: عُلِّمَ اسْمَ كُلِّ شَيْءٍ","bs":"Neki su rekli: „Poučen je imenu svega.“","ar_ranges":[],"ar_html":"فَقَالَ بَعْضُهُمْ: عُلِّمَ اسْمَ كُلِّ شَيْءٍ","bs_ranges":[],"bs_html":"Neki su rekli: „Poučen je imenu svega.“"}],"notes":[]},{"n":97,"ar":"ذكر من قال ذلك:\n\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بشر ابن عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: «عَلَّمَ اللَّهُ تَعَالَى آدَمَ الْأَسْماءَ كُلَّها» ، وَهِيَ هَذِهِ الأَسْمَاءُ الَّتِي يَتَعَارَفُ بِهَا النَّاسُ:\nإِنْسَانٌ، وَدَابَّةٌ، وَأَرْضٌ، وَسَهْلٌ، وَبَحْرٌ، وَجَبَلٌ، وَحِمَارٌ، وَأَشْبَاهُ ذَلِكَ مِنَ الأُمَمِ وَغَيْرِهَا.\n\nحَدَّثَنِي أَحْمَدُ بْنُ إِسْحَاقَ الأَهْوَازِيُّ، قَالَ: حَدَّثَنَا أَبُو أَحْمَدَ، حَدَّثَنَا شَرِيكٌ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنِ الْحَسَنِ بْنِ سَعْدٍ، عَنِ ابْنِ عَبَّاسٍ، فِي قَوْلِهِ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، حَتَّى الْفَسْوَةِ وَالْفُسَيَّةِ.\nحَدَّثَنِي عَلِيُّ بْنُ الْحَسَنِ، حَدَّثَنَا مُسْلِمٌ الْجَرْمِيُّ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ مُصْعَبٍ، عَنْ قَيْسِ بْنِ الرَّبِيعِ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنْ سَعِيدِ بْنِ مَعْبَدٍ، عَنِ ابْنِ عَبَّاسٍ فِي قَوْلِ اللَّهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ:\n\nعَلَّمَهُ اسْمَ كُلِّ شَيْءٍ حَتَّى الْهَنَةِ وَالْهُنَيَّةِ، وَالْفَسْوَةِ وَالضَّرْطَةِ.\nحَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى ابن ميمون، عن ابن أبي نجيح، عن مجاهد، فِي قَوْلِ اللَّهِ عَزَّ وَجَلَّ:\n\n«وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ: مَا خَلَقَ اللَّهُ تعالى كُلَّهُ.\n\nحَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنِ سفيان، عَنْ خَصِيفٍ، عَنْ مُجَاهِدٍ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ","bs":"\u003cp data-paragraph=\"97.1\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"97.2\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Uzvišeni Allah poučio je Adema svim imenima. To su imena kojima se ljudi međusobno sporazumijevaju: čovjek, životinja, zemlja, ravnica, more, planina, magarac i njima slični nazivi vrsta i drugih stvari.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor kaže علّم الله تعالى آدم الأسماء كلها, kao formulaciju predaje; odgovarajući kur’anski izraz u El-Bekara, 2:31, glasi وعلم آدم الأسماء كلها.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"97.3\">Pričao mi je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed: pričao nam je Šerik, od Asima ibn Kulejba, od Hasena ibn Sa‘da, od Ibn Abbasa, o Njegovim riječima: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega, čak i tihog ispuštanja vjetra i sasvim malog ispuštanja vjetra.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Izvor ima الفسوة والفسية, pri čemu je drugi oblik umanjenica.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"97.4\">Pričao mi je Ali ibn el-Hasen: pričao nam je Muslim el-Džermi, koji je rekao: pričao nam je Muhammed ibn Mus‘ab, od Kajsa ibn er-Rebia, od Asima ibn Kulejba, od Seida ibn Ma‘beda, od Ibn Abbasa, o riječima Allaha, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega, čak i ‘one stvari’ i ‘male one stvari’, tihog i glasnog ispuštanja vjetra.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Izrazi الهنة والهنية preneseni su kao neodređeni nazivi i umanjenica, bez nametanja određenog predmeta na koji bi se odnosili.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"97.5\">Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa ibn Mejmun, od Ibn Ebu Nedžiha, od Mudžahida, o riječima Allaha, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Svemu što je Uzvišeni Allah stvorio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"97.6\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je moj otac, od Sufjana, od Husajfa, od Mudžahida, o riječima: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"97.1","ar":"ذكر من قال ذلك:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذكر من قال ذلك:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"97.2","ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بشر ابن عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: «عَلَّمَ اللَّهُ تَعَالَى آدَمَ الْأَسْماءَ كُلَّها» ، وَهِيَ هَذِهِ الأَسْمَاءُ الَّتِي يَتَعَارَفُ بِهَا النَّاسُ:\nإِنْسَانٌ، وَدَابَّةٌ، وَأَرْضٌ، وَسَهْلٌ، وَبَحْرٌ، وَجَبَلٌ، وَحِمَارٌ، وَأَشْبَاهُ ذَلِكَ مِنَ الأُمَمِ وَغَيْرِهَا.","bs":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Uzvišeni Allah poučio je Adema svim imenima. To su imena kojima se ljudi međusobno sporazumijevaju: čovjek, životinja, zemlja, ravnica, more, planina, magarac i njima slični nazivi vrsta i drugih stvari.“ ⟦Napomena prevodioca: izvor kaže علّم الله تعالى آدم الأسماء كلها, kao formulaciju predaje; odgovarajući kur’anski izraz u El-Bekara, 2:31, glasi وعلم آدم الأسماء كلها.⟧","ar_ranges":[[0,171]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بشر ابن عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>«عَلَّمَ اللَّهُ تَعَالَى آدَمَ الْأَسْماءَ كُلَّها» ، وَهِيَ هَذِهِ الأَسْمَاءُ الَّتِي يَتَعَارَفُ بِهَا النَّاسُ:\nإِنْسَانٌ، وَدَابَّةٌ، وَأَرْضٌ، وَسَهْلٌ، وَبَحْرٌ، وَجَبَلٌ، وَحِمَارٌ، وَأَشْبَاهُ ذَلِكَ مِنَ الأُمَمِ وَغَيْرِهَا.","bs_ranges":[[0,172]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: \u003c/span>„Uzvišeni Allah poučio je Adema svim imenima. To su imena kojima se ljudi međusobno sporazumijevaju: čovjek, životinja, zemlja, ravnica, more, planina, magarac i njima slični nazivi vrsta i drugih stvari.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor kaže علّم الله تعالى آدم الأسماء كلها, kao formulaciju predaje; odgovarajući kur’anski izraz u El-Bekara, 2:31, glasi وعلم آدم الأسماء كلها.⟧\u003c/span>"},{"id":"97.3","ar":"حَدَّثَنِي أَحْمَدُ بْنُ إِسْحَاقَ الأَهْوَازِيُّ، قَالَ: حَدَّثَنَا أَبُو أَحْمَدَ، حَدَّثَنَا شَرِيكٌ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنِ الْحَسَنِ بْنِ سَعْدٍ، عَنِ ابْنِ عَبَّاسٍ، فِي قَوْلِهِ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، حَتَّى الْفَسْوَةِ وَالْفُسَيَّةِ.","bs":"Pričao mi je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed: pričao nam je Šerik, od Asima ibn Kulejba, od Hasena ibn Sa‘da, od Ibn Abbasa, o Njegovim riječima: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega, čak i tihog ispuštanja vjetra i sasvim malog ispuštanja vjetra.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Izvor ima الفسوة والفسية, pri čemu je drugi oblik umanjenica.⟧","ar_ranges":[[0,182]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ إِسْحَاقَ الأَهْوَازِيُّ، قَالَ: حَدَّثَنَا أَبُو أَحْمَدَ، حَدَّثَنَا شَرِيكٌ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنِ الْحَسَنِ بْنِ سَعْدٍ، عَنِ ابْنِ عَبَّاسٍ، \u003c/span>فِي قَوْلِهِ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، حَتَّى الْفَسْوَةِ وَالْفُسَيَّةِ.","bs_ranges":[[0,180]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed: pričao nam je Šerik, od Asima ibn Kulejba, od Hasena ibn Sa‘da, od Ibn Abbasa, o Njegovim riječima: \u003c/span>„I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega, čak i tihog ispuštanja vjetra i sasvim malog ispuštanja vjetra.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Izvor ima الفسوة والفسية, pri čemu je drugi oblik umanjenica.⟧\u003c/span>"},{"id":"97.4","ar":"حَدَّثَنِي عَلِيُّ بْنُ الْحَسَنِ، حَدَّثَنَا مُسْلِمٌ الْجَرْمِيُّ، قَالَ:\nحَدَّثَنَا مُحَمَّدُ بْنُ مُصْعَبٍ، عَنْ قَيْسِ بْنِ الرَّبِيعِ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنْ سَعِيدِ بْنِ مَعْبَدٍ، عَنِ ابْنِ عَبَّاسٍ فِي قَوْلِ اللَّهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ:\n\nعَلَّمَهُ اسْمَ كُلِّ شَيْءٍ حَتَّى الْهَنَةِ وَالْهُنَيَّةِ، وَالْفَسْوَةِ وَالضَّرْطَةِ.\n","bs":"Pričao mi je Ali ibn el-Hasen: pričao nam je Muslim el-Džermi, koji je rekao: pričao nam je Muhammed ibn Mus‘ab, od Kajsa ibn er-Rebia, od Asima ibn Kulejba, od Seida ibn Ma‘beda, od Ibn Abbasa, o riječima Allaha, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega, čak i ‘one stvari’ i ‘male one stvari’, tihog i glasnog ispuštanja vjetra.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Izrazi الهنة والهنية preneseni su kao neodređeni nazivi i umanjenica, bez nametanja određenog predmeta na koji bi se odnosili.⟧","ar_ranges":[[0,217]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي عَلِيُّ بْنُ الْحَسَنِ، حَدَّثَنَا مُسْلِمٌ الْجَرْمِيُّ، قَالَ:\nحَدَّثَنَا مُحَمَّدُ بْنُ مُصْعَبٍ، عَنْ قَيْسِ بْنِ الرَّبِيعِ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنْ سَعِيدِ بْنِ مَعْبَدٍ، عَنِ ابْنِ عَبَّاسٍ \u003c/span>فِي قَوْلِ اللَّهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ:\n\nعَلَّمَهُ اسْمَ كُلِّ شَيْءٍ حَتَّى الْهَنَةِ وَالْهُنَيَّةِ، وَالْفَسْوَةِ وَالضَّرْطَةِ.\n","bs_ranges":[[0,195]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ali ibn el-Hasen: pričao nam je Muslim el-Džermi, koji je rekao: pričao nam je Muhammed ibn Mus‘ab, od Kajsa ibn er-Rebia, od Asima ibn Kulejba, od Seida ibn Ma‘beda, od Ibn Abbasa, \u003c/span>o riječima Allaha, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega, čak i ‘one stvari’ i ‘male one stvari’, tihog i glasnog ispuštanja vjetra.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Izrazi الهنة والهنية preneseni su kao neodređeni nazivi i umanjenica, bez nametanja određenog predmeta na koji bi se odnosili.⟧\u003c/span>"},{"id":"97.5","ar":"حَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى ابن ميمون، عن ابن أبي نجيح، عن مجاهد، فِي قَوْلِ اللَّهِ عَزَّ وَجَلَّ:\n\n«وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ: مَا خَلَقَ اللَّهُ تعالى كُلَّهُ.","bs":"Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa ibn Mejmun, od Ibn Ebu Nedžiha, od Mudžahida, o riječima Allaha, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Svemu što je Uzvišeni Allah stvorio.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧","ar_ranges":[[0,110]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى ابن ميمون، عن ابن أبي نجيح، عن مجاهد، \u003c/span>فِي قَوْلِ اللَّهِ عَزَّ وَجَلَّ:\n\n«وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ: مَا خَلَقَ اللَّهُ تعالى كُلَّهُ.","bs_ranges":[[0,150]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa ibn Mejmun, od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>o riječima Allaha, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Svemu što je Uzvišeni Allah stvorio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>"},{"id":"97.6","ar":"حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنِ سفيان، عَنْ خَصِيفٍ، عَنْ مُجَاهِدٍ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ","bs":"Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je moj otac, od Sufjana, od Husajfa, od Mudžahida, o riječima: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧","ar_ranges":[[0,93]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنِ سفيان، عَنْ خَصِيفٍ، عَنْ مُجَاهِدٍ: \u003c/span>«وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ","bs_ranges":[[0,102]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je moj otac, od Sufjana, od Husajfa, od Mudžahida, \u003c/span>o riječima: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>"}],"notes":[]},{"n":98,"ar":"حَدَّثَنَا سُفْيَانُ، قَالَ: حَدَّثَنَا أَبِي، عَنْ شَرِيكٍ، عَنْ سَالِمٍ الأَفْطَسِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، حَتَّى الْبَعِيرِ، وَالْبَقَرَةِ، وَالشَّاةِ.\nحَدَّثَنَا الْحَسَنُ بْنُ يَحْيَى، قَالَ: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن قَتَادَةَ، فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ: هَذَا جَبَلٌ، وَهَذَا بَحْرٌ، وَهَذَا كَذَا، وَهَذَا كَذَا، لِكُلِّ شَيْءٍ، ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ، فَقَالَ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» .\nحَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، عَنْ سَعِيدٍ، عَنْ قَتَادَةَ، قَوْلُهُ عَزَّ وجل: و «عَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» حَتَّى بَلَغَ «إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ» ، قَالَ: يَا آدَمُ أَنْبِئْهُمْ بِأَسْمَائِهِمْ، فَأَنْبَأَ كُلَّ صِنْفٍ مِنَ الْخَلْقِ بِاسْمِهِ، وَأَلْجَأَهُ إِلَى جِنْسِهِ.\nحَدَّثَنَا الْقَاسِمُ بْنُ الْحَسَنِ، قَالَ: حدثنا الحسين بن داود، قَالَ: حَدَّثَنَا حَجَّاجٌ، عَنْ جَرِيرِ بْنِ حَازِمٍ ومبارك، عن الحسن وأبي بكر، عن الحسن وَقَتَادَةَ، قَالا: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، هَذِهِ الخيل، وهذه البغال، والإبل، والجن، والوحش، وجعل يسمي كل شيء برسمه.\n\nوقال آخرون: بل إنما علم اسما خاصا من الأسماء، قالوا: والذي علمه أسماء الملائكة.\n\nذِكْرُ مَنْ قَالَ ذلك:","bs":"\u003cp data-paragraph=\"98.1\">Pričao nam je Sufjan, koji je rekao: pričao nam je moj otac, od Šerika, od Salima el-Eftasa, od Seida ibn Džubejra, koji je rekao: „Poučio ga je imenu svega, čak i deve, krave i ovce.“\u003c/p>\u003cp data-paragraph=\"98.2\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega: ovo je planina, ovo je more, ovo je to i to, a ovo je to i to — za svaku stvar. Zatim ih je pokazao melekima i rekao: ‘Obavijestite Me o imenima ovih, ako istinu govorite.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:31, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"98.3\">Pričao nam je Bišr ibn Muaz: pričao nam je Jezid ibn Zurej‘, od Seida, od Katade, o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima“ — dok nije stigao do: „Ti si, doista, Sveznajući, Mudri.“ Rekao je: „Ademe, obavijesti ih o njihovim imenima.“ Pa je svaku vrstu stvorenja naveo njenim imenom i svrstao je u njen rod. \u003cspan class=\"translator-note\">⟦Prijevodi navedenih početnih i završnih kur’anskih riječi: El-Bekara, 2:31–32. Izraz „dok nije stigao do“ dio je izvora. Naredna rečenica „Ademe, obavijesti ih…“ prenosi formulaciju predaje prema El-Bekara, 2:33.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"98.4\">Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao nam je Hadždžadž, od Džerira ibn Hazima i Mubareka, od Hasena i Ebu Bekra, od Hasena i Katade; obojica su rekli: „Poučio ga je imenu svega: ovo su konji, ovo su mazge, deve, džini i divlje životinje. Svaku je stvar počeo imenovati njenim nazivom.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: niz عن جرير بن حازم ومبارك، عن الحسن وأبي بكر، عن الحسن وقتادة prenesen je navedenim redom, uključujući ponovljeno ime Hasen. Veze između grana ovog lanca nisu prešutno preuređene.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"98.5\">Drugi su rekli: „Naprotiv, poučen je samo određenim imenima.“ Rekli su: „Ono čemu je poučen jesu imena meleka.“\u003c/p>\u003cp data-paragraph=\"98.6\">Spomen onih koji su to rekli:\u003c/p>","paragraphs":[{"id":"98.1","ar":"حَدَّثَنَا سُفْيَانُ، قَالَ: حَدَّثَنَا أَبِي، عَنْ شَرِيكٍ، عَنْ سَالِمٍ الأَفْطَسِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، حَتَّى الْبَعِيرِ، وَالْبَقَرَةِ، وَالشَّاةِ.","bs":"Pričao nam je Sufjan, koji je rekao: pričao nam je moj otac, od Šerika, od Salima el-Eftasa, od Seida ibn Džubejra, koji je rekao: „Poučio ga je imenu svega, čak i deve, krave i ovce.“","ar_ranges":[[0,121]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا سُفْيَانُ، قَالَ: حَدَّثَنَا أَبِي، عَنْ شَرِيكٍ، عَنْ سَالِمٍ الأَفْطَسِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: \u003c/span>عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، حَتَّى الْبَعِيرِ، وَالْبَقَرَةِ، وَالشَّاةِ.","bs_ranges":[[0,131]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Sufjan, koji je rekao: pričao nam je moj otac, od Šerika, od Salima el-Eftasa, od Seida ibn Džubejra, koji je rekao: \u003c/span>„Poučio ga je imenu svega, čak i deve, krave i ovce.“"},{"id":"98.2","ar":"حَدَّثَنَا الْحَسَنُ بْنُ يَحْيَى، قَالَ: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن قَتَادَةَ، فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ: هَذَا جَبَلٌ، وَهَذَا بَحْرٌ، وَهَذَا كَذَا، وَهَذَا كَذَا، لِكُلِّ شَيْءٍ، ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ، فَقَالَ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» .","bs":"Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega: ovo je planina, ovo je more, ovo je to i to, a ovo je to i to — za svaku stvar. Zatim ih je pokazao melekima i rekao: ‘Obavijestite Me o imenima ovih, ako istinu govorite.’“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:31, navedeni dijelovi.⟧","ar_ranges":[[0,93]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا الْحَسَنُ بْنُ يَحْيَى، قَالَ: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن قَتَادَةَ، \u003c/span>فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ: هَذَا جَبَلٌ، وَهَذَا بَحْرٌ، وَهَذَا كَذَا، وَهَذَا كَذَا، لِكُلِّ شَيْءٍ، ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ، فَقَالَ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» .","bs_ranges":[[0,131]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega: ovo je planina, ovo je more, ovo je to i to, a ovo je to i to — za svaku stvar. Zatim ih je pokazao melekima i rekao: ‘Obavijestite Me o imenima ovih, ako istinu govorite.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:31, navedeni dijelovi.⟧\u003c/span>"},{"id":"98.3","ar":"حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، عَنْ سَعِيدٍ، عَنْ قَتَادَةَ، قَوْلُهُ عَزَّ وجل: و «عَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» حَتَّى بَلَغَ «إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ» ، قَالَ: يَا آدَمُ أَنْبِئْهُمْ بِأَسْمَائِهِمْ، فَأَنْبَأَ كُلَّ صِنْفٍ مِنَ الْخَلْقِ بِاسْمِهِ، وَأَلْجَأَهُ إِلَى جِنْسِهِ.","bs":"Pričao nam je Bišr ibn Muaz: pričao nam je Jezid ibn Zurej‘, od Seida, od Katade, o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima“ — dok nije stigao do: „Ti si, doista, Sveznajući, Mudri.“ Rekao je: „Ademe, obavijesti ih o njihovim imenima.“ Pa je svaku vrstu stvorenja naveo njenim imenom i svrstao je u njen rod. ⟦Prijevodi navedenih početnih i završnih kur’anskih riječi: El-Bekara, 2:31–32. Izraz „dok nije stigao do“ dio je izvora. Naredna rečenica „Ademe, obavijesti ih…“ prenosi formulaciju predaje prema El-Bekara, 2:33.⟧","ar_ranges":[[0,116]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، عَنْ سَعِيدٍ، عَنْ قَتَادَةَ، قَوْلُهُ عَزَّ وجل: \u003c/span>و «عَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» حَتَّى بَلَغَ «إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ» ، قَالَ: يَا آدَمُ أَنْبِئْهُمْ بِأَسْمَائِهِمْ، فَأَنْبَأَ كُلَّ صِنْفٍ مِنَ الْخَلْقِ بِاسْمِهِ، وَأَلْجَأَهُ إِلَى جِنْسِهِ.","bs_ranges":[[0,82]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz: pričao nam je Jezid ibn Zurej‘, od Seida, od Katade, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima“ — dok nije stigao do: „Ti si, doista, Sveznajući, Mudri.“ Rekao je: „Ademe, obavijesti ih o njihovim imenima.“ Pa je svaku vrstu stvorenja naveo njenim imenom i svrstao je u njen rod. \u003cspan class=\"translator-note\">⟦Prijevodi navedenih početnih i završnih kur’anskih riječi: El-Bekara, 2:31–32. Izraz „dok nije stigao do“ dio je izvora. Naredna rečenica „Ademe, obavijesti ih…“ prenosi formulaciju predaje prema El-Bekara, 2:33.⟧\u003c/span>"},{"id":"98.4","ar":"حَدَّثَنَا الْقَاسِمُ بْنُ الْحَسَنِ، قَالَ: حدثنا الحسين بن داود، قَالَ: حَدَّثَنَا حَجَّاجٌ، عَنْ جَرِيرِ بْنِ حَازِمٍ ومبارك، عن الحسن وأبي بكر، عن الحسن وَقَتَادَةَ، قَالا: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، هَذِهِ الخيل، وهذه البغال، والإبل، والجن، والوحش، وجعل يسمي كل شيء برسمه.","bs":"Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao nam je Hadždžadž, od Džerira ibn Hazima i Mubareka, od Hasena i Ebu Bekra, od Hasena i Katade; obojica su rekli: „Poučio ga je imenu svega: ovo su konji, ovo su mazge, deve, džini i divlje životinje. Svaku je stvar počeo imenovati njenim nazivom.“ ⟦Napomena prevodioca: niz عن جرير بن حازم ومبارك، عن الحسن وأبي بكر، عن الحسن وقتادة prenesen je navedenim redom, uključujući ponovljeno ime Hasen. Veze između grana ovog lanca nisu prešutno preuređene.⟧","ar_ranges":[[0,177]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا الْقَاسِمُ بْنُ الْحَسَنِ، قَالَ: حدثنا الحسين بن داود، قَالَ: حَدَّثَنَا حَجَّاجٌ، عَنْ جَرِيرِ بْنِ حَازِمٍ ومبارك، عن الحسن وأبي بكر، عن الحسن وَقَتَادَةَ، قَالا: \u003c/span>عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، هَذِهِ الخيل، وهذه البغال، والإبل، والجن، والوحش، وجعل يسمي كل شيء برسمه.","bs_ranges":[[0,216]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao nam je Hadždžadž, od Džerira ibn Hazima i Mubareka, od Hasena i Ebu Bekra, od Hasena i Katade; obojica su rekli: \u003c/span>„Poučio ga je imenu svega: ovo su konji, ovo su mazge, deve, džini i divlje životinje. Svaku je stvar počeo imenovati njenim nazivom.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: niz عن جرير بن حازم ومبارك، عن الحسن وأبي بكر، عن الحسن وقتادة prenesen je navedenim redom, uključujući ponovljeno ime Hasen. Veze između grana ovog lanca nisu prešutno preuređene.⟧\u003c/span>"},{"id":"98.5","ar":"وقال آخرون: بل إنما علم اسما خاصا من الأسماء، قالوا: والذي علمه أسماء الملائكة.","bs":"Drugi su rekli: „Naprotiv, poučen je samo određenim imenima.“ Rekli su: „Ono čemu je poučen jesu imena meleka.“","ar_ranges":[],"ar_html":"وقال آخرون: بل إنما علم اسما خاصا من الأسماء، قالوا: والذي علمه أسماء الملائكة.","bs_ranges":[],"bs_html":"Drugi su rekli: „Naprotiv, poučen je samo određenim imenima.“ Rekli su: „Ono čemu je poučen jesu imena meleka.“"},{"id":"98.6","ar":"ذِكْرُ مَنْ قَالَ ذلك:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذلك:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"}],"notes":[]},{"n":99,"ar":"حَدَّثَنِي عَبْدَةُ الْمَرْوَزِيُّ، قَالَ: حَدَّثَنَا عَمَّارُ بْنُ الحسن، قال: حدثنا عبد الله بن أبي جَعْفَرٍ، عَنْ أَبِيهِ، عَنِ الرَّبِيعِ، قَوْلُهُ تعالى: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: أَسْمَاءُ الْمَلائِكَةِ.\nوَقَالَ آخَرُونَ مِثْلَ قَوْلِ هَؤُلاءِ فِي أَنَّ الَّذِي عُلِّمَ آدَمَ مِنَ الأَسْمَاءِ اسْمًا خَاصًّا مِنَ الأَشْيَاءِ، غَيْرَ أَنَّهُمْ قَالُوا: الَّذِي عُلِّمَ مِنْ ذَلِكَ أَسْمَاءَ ذُرِّيَّتِهِ.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\nحَدَّثَنِي يُونُسُ، قَالَ: حَدَّثَنَا ابْنُ وَهْبٍ، قَالَ: قَالَ ابْنُ زَيْدٍ فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: أَسْمَاءَ ذُرِّيَّتِهِ، فَلَمَّا «عَلَّمَ اللَّهُ آدَمَ الْأَسْماءَ كُلَّها» عَرَضَ اللَّهُ عَزَّ وَجَلَّ أَهْلَ الأَسْمَاءِ عَلَى الْمَلائِكَةِ، فَقَالَ لَهُمْ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» ، وإنما قال ذلك عز وجل للملائكة- فيما ذكر- لقولهم إذ قال لهم: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» : «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ» فعرض- بعد ان خلق آدم ع ونفخ فيه الروح، وعلمه أسماء كل شيء- مما خلق من الخلق- عليهم، فقال لهم:\n«أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» أني إن جعلت منكم خليفتي في الأرض أطعتموني وسبحتموني وقدستموني ولم تعصوني، وإن جعلته من غيركم أفسد فيها وسفك، فإنكم إن لم تعلموا ما أسماؤهم وأنتم مشاهدوهم ومعاينوهم، فأنتم بألا تعلموا ما يكون من أمركم- إن جعلت خليفتي في الأرض منكم، أو من غيركم إن جعلته من غيركم، فهم عن أبصاركم غُيَّبٌ لا ترونهم ولا تعاينونهم، ولم تخبروا بما هو كائن منكم ومنهم- أحرى","bs":"\u003cp data-paragraph=\"99.1\">Pričao mi je Abde el-Mervezi, koji je rekao: pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, o riječima Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Imenima meleka.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"99.2\">Drugi su rekli isto što i ovi, da je Adem od imena poučen imenima samo određenih stvari, ali su kazali: „Poučen je imenima svojih potomaka.“\u003c/p>\u003cp data-paragraph=\"99.3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"99.4\">Pričao mi je Junus, koji je rekao: pričao nam je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima“: „Imenima njegovih potomaka.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"99.5\">Kada je Allah poučio Adema svim imenima, Allah, Silan i Uzvišen, pokazao je melekima nosioce tih imena i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite.“ Prema onome što je navedeno, On, Silan i Uzvišen, rekao je to melekima zbog njihovih riječi kada im je rekao: „Ja ću na Zemlji postaviti namjesnika“, a oni odgovorili: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo?“ Nakon što je stvorio Adema, alejhis-selam, udahnuo u njega duh i poučio ga imenu svega od stvorenja koja je stvorio, pokazao ih je melekima i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite“ — u tvrdnji da biste, kada bih nekoga od vas učinio Svojim namjesnikom na Zemlji, bili Meni pokorni, slavili Me, iskazivali Mi svetost i ne biste Mi bili nepokorni, a da bi, ako ga učinim od drugih, na njoj činio nered i prolijevao krv. Ako ne znate njihova imena dok ih gledate i vidite vlastitim očima, onda još manje možete znati kakvo bi bilo vaše stanje kada bih Svoga namjesnika na Zemlji učinio od vas, ili stanje drugih kada bih ga učinio od drugih, dok su oni skriveni od vaših očiju, ne vidite ih niti ih posmatrate, a niste obaviješteni o tome šta će biti od vas i od njih. \u003cspan class=\"translator-note\">⟦Prijevodi izričitih kur’anskih navoda: El-Bekara, 2:30–31. Navod u izvoru علم الله آدم الأسماء كلها prenosi formulaciju predaje. Objašnjenje poslije posljednjeg „ako istinu govorite“ pripada autorovom izlaganju.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"99.1","ar":"حَدَّثَنِي عَبْدَةُ الْمَرْوَزِيُّ، قَالَ: حَدَّثَنَا عَمَّارُ بْنُ الحسن، قال: حدثنا عبد الله بن أبي جَعْفَرٍ، عَنْ أَبِيهِ، عَنِ الرَّبِيعِ، قَوْلُهُ تعالى: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: أَسْمَاءُ الْمَلائِكَةِ.","bs":"Pričao mi je Abde el-Mervezi, koji je rekao: pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, o riječima Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Imenima meleka.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧","ar_ranges":[[0,159]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي عَبْدَةُ الْمَرْوَزِيُّ، قَالَ: حَدَّثَنَا عَمَّارُ بْنُ الحسن، قال: حدثنا عبد الله بن أبي جَعْفَرٍ، عَنْ أَبِيهِ، عَنِ الرَّبِيعِ، قَوْلُهُ تعالى: \u003c/span>«وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: أَسْمَاءُ الْمَلائِكَةِ.","bs_ranges":[[0,157]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Abde el-Mervezi, koji je rekao: pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, \u003c/span>o riječima Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Imenima meleka.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>"},{"id":"99.2","ar":"وَقَالَ آخَرُونَ مِثْلَ قَوْلِ هَؤُلاءِ فِي أَنَّ الَّذِي عُلِّمَ آدَمَ مِنَ الأَسْمَاءِ اسْمًا خَاصًّا مِنَ الأَشْيَاءِ، غَيْرَ أَنَّهُمْ قَالُوا: الَّذِي عُلِّمَ مِنْ ذَلِكَ أَسْمَاءَ ذُرِّيَّتِهِ.","bs":"Drugi su rekli isto što i ovi, da je Adem od imena poučen imenima samo određenih stvari, ali su kazali: „Poučen je imenima svojih potomaka.“","ar_ranges":[],"ar_html":"وَقَالَ آخَرُونَ مِثْلَ قَوْلِ هَؤُلاءِ فِي أَنَّ الَّذِي عُلِّمَ آدَمَ مِنَ الأَسْمَاءِ اسْمًا خَاصًّا مِنَ الأَشْيَاءِ، غَيْرَ أَنَّهُمْ قَالُوا: الَّذِي عُلِّمَ مِنْ ذَلِكَ أَسْمَاءَ ذُرِّيَّتِهِ.","bs_ranges":[],"bs_html":"Drugi su rekli isto što i ovi, da je Adem od imena poučen imenima samo određenih stvari, ali su kazali: „Poučen je imenima svojih potomaka.“"},{"id":"99.3","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"99.4","ar":"حَدَّثَنِي يُونُسُ، قَالَ: حَدَّثَنَا ابْنُ وَهْبٍ، قَالَ: قَالَ ابْنُ زَيْدٍ فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: أَسْمَاءَ ذُرِّيَّتِهِ،","bs":"Pričao mi je Junus, koji je rekao: pričao nam je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima“: „Imenima njegovih potomaka.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧","ar_ranges":[[0,78]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي يُونُسُ، قَالَ: حَدَّثَنَا ابْنُ وَهْبٍ، قَالَ: قَالَ ابْنُ زَيْدٍ \u003c/span>فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: أَسْمَاءَ ذُرِّيَّتِهِ،","bs_ranges":[[0,93]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Junus, koji je rekao: pričao nam je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima“: „Imenima njegovih potomaka.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>"},{"id":"99.5","ar":"فَلَمَّا «عَلَّمَ اللَّهُ آدَمَ الْأَسْماءَ كُلَّها» عَرَضَ اللَّهُ عَزَّ وَجَلَّ أَهْلَ الأَسْمَاءِ عَلَى الْمَلائِكَةِ، فَقَالَ لَهُمْ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» ، وإنما قال ذلك عز وجل للملائكة- فيما ذكر- لقولهم إذ قال لهم: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» : «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ» فعرض- بعد ان خلق آدم ع ونفخ فيه الروح، وعلمه أسماء كل شيء- مما خلق من الخلق- عليهم، فقال لهم:\n«أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» أني إن جعلت منكم خليفتي في الأرض أطعتموني وسبحتموني وقدستموني ولم تعصوني، وإن جعلته من غيركم أفسد فيها وسفك، فإنكم إن لم تعلموا ما أسماؤهم وأنتم مشاهدوهم ومعاينوهم، فأنتم بألا تعلموا ما يكون من أمركم- إن جعلت خليفتي في الأرض منكم، أو من غيركم إن جعلته من غيركم، فهم عن أبصاركم غُيَّبٌ لا ترونهم ولا تعاينونهم، ولم تخبروا بما هو كائن منكم ومنهم- أحرى","bs":"Kada je Allah poučio Adema svim imenima, Allah, Silan i Uzvišen, pokazao je melekima nosioce tih imena i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite.“ Prema onome što je navedeno, On, Silan i Uzvišen, rekao je to melekima zbog njihovih riječi kada im je rekao: „Ja ću na Zemlji postaviti namjesnika“, a oni odgovorili: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo?“ Nakon što je stvorio Adema, alejhis-selam, udahnuo u njega duh i poučio ga imenu svega od stvorenja koja je stvorio, pokazao ih je melekima i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite“ — u tvrdnji da biste, kada bih nekoga od vas učinio Svojim namjesnikom na Zemlji, bili Meni pokorni, slavili Me, iskazivali Mi svetost i ne biste Mi bili nepokorni, a da bi, ako ga učinim od drugih, na njoj činio nered i prolijevao krv. Ako ne znate njihova imena dok ih gledate i vidite vlastitim očima, onda još manje možete znati kakvo bi bilo vaše stanje kada bih Svoga namjesnika na Zemlji učinio od vas, ili stanje drugih kada bih ga učinio od drugih, dok su oni skriveni od vaših očiju, ne vidite ih niti ih posmatrate, a niste obaviješteni o tome šta će biti od vas i od njih. ⟦Prijevodi izričitih kur’anskih navoda: El-Bekara, 2:30–31. Navod u izvoru علم الله آدم الأسماء كلها prenosi formulaciju predaje. Objašnjenje poslije posljednjeg „ako istinu govorite“ pripada autorovom izlaganju.⟧","ar_ranges":[],"ar_html":"فَلَمَّا «عَلَّمَ اللَّهُ آدَمَ الْأَسْماءَ كُلَّها» عَرَضَ اللَّهُ عَزَّ وَجَلَّ أَهْلَ الأَسْمَاءِ عَلَى الْمَلائِكَةِ، فَقَالَ لَهُمْ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» ، وإنما قال ذلك عز وجل للملائكة- فيما ذكر- لقولهم إذ قال لهم: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» : «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ» فعرض- بعد ان خلق آدم ع ونفخ فيه الروح، وعلمه أسماء كل شيء- مما خلق من الخلق- عليهم، فقال لهم:\n«أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» أني إن جعلت منكم خليفتي في الأرض أطعتموني وسبحتموني وقدستموني ولم تعصوني، وإن جعلته من غيركم أفسد فيها وسفك، فإنكم إن لم تعلموا ما أسماؤهم وأنتم مشاهدوهم ومعاينوهم، فأنتم بألا تعلموا ما يكون من أمركم- إن جعلت خليفتي في الأرض منكم، أو من غيركم إن جعلته من غيركم، فهم عن أبصاركم غُيَّبٌ لا ترونهم ولا تعاينونهم، ولم تخبروا بما هو كائن منكم ومنهم- أحرى","bs_ranges":[],"bs_html":"Kada je Allah poučio Adema svim imenima, Allah, Silan i Uzvišen, pokazao je melekima nosioce tih imena i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite.“ Prema onome što je navedeno, On, Silan i Uzvišen, rekao je to melekima zbog njihovih riječi kada im je rekao: „Ja ću na Zemlji postaviti namjesnika“, a oni odgovorili: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo?“ Nakon što je stvorio Adema, alejhis-selam, udahnuo u njega duh i poučio ga imenu svega od stvorenja koja je stvorio, pokazao ih je melekima i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite“ — u tvrdnji da biste, kada bih nekoga od vas učinio Svojim namjesnikom na Zemlji, bili Meni pokorni, slavili Me, iskazivali Mi svetost i ne biste Mi bili nepokorni, a da bi, ako ga učinim od drugih, na njoj činio nered i prolijevao krv. Ako ne znate njihova imena dok ih gledate i vidite vlastitim očima, onda još manje možete znati kakvo bi bilo vaše stanje kada bih Svoga namjesnika na Zemlji učinio od vas, ili stanje drugih kada bih ga učinio od drugih, dok su oni skriveni od vaših očiju, ne vidite ih niti ih posmatrate, a niste obaviješteni o tome šta će biti od vas i od njih. \u003cspan class=\"translator-note\">⟦Prijevodi izričitih kur’anskih navoda: El-Bekara, 2:30–31. Navod u izvoru علم الله آدم الأسماء كلها prenosi formulaciju predaje. Objašnjenje poslije posljednjeg „ako istinu govorite“ pripada autorovom izlaganju.⟧\u003c/span>"}],"notes":[]},{"n":100,"ar":"وهذا قول روي عن جماعة من السلف.\n\nذكر بعض من روي ذلك عنه:\n\nحَدَّثَنِي مُوسَى بْنُ هَارُونَ، قَالَ: حَدَّثَنِي عَمْرُو بْنُ حماد، قال:\nحدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن عبد الله بن مسعود- وعن ناس من اصحاب النبي ص: «إِنْ كُنْتُمْ صادِقِينَ» أَنَّ بَنِي آدَمَ يُفْسِدُونَ فِي الأَرْضِ وَيَسْفِكُونَ الدِّمَاءَ.\n\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ:\n\n«إِنْ كُنْتُمْ صادِقِينَ» ، إِنْ كُنْتُمْ تَعْلَمُونَ لَمْ أَجْعَلْ فِي الأَرْضِ خَلِيفَةً.\nوَقَدْ قِيلَ: إِنَّ اللَّهَ جَلَّ جَلالَهُ قَالَ ذَلِكَ لِلْمَلائِكَةِ لأَنَّهُ جَلَّ جَلالَهُ لَمَّا ابْتَدَأَ فِي خَلْقِ آدَمَ قَالُوا فِيمَا بَيْنَهُمْ: لِيَخْلُقُ رَبُّنَا مَا شَاءَ أَنْ يَخْلُقَ، فَلَنْ يخلق خلقا إلا كنا أعلم منه، وأكرم عليه منه، فلما خلق آدم ع وَعَلَّمَهُ أَسْمَاءَ كُلَّ شَيْءٍ عَرَضَ الأَشْيَاءَ الَّتِي علم آدم أسمائها عليهم، فقال لهم: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» فِي قِيلِكُمْ: إِنَّ اللَّهَ لَمْ يَخْلُقْ خَلْقًا إِلا كُنْتُمْ أَعْلَمَ مِنْهُ، وَأَكْرَمَ عَلَيْهِ مِنْهُ.\nذكر من قال ذلك:\n\nحَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ:\n\nحَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ: قوله: «وَإِذْ قالَ رَبُّكَ لِلْمَلائِكَةِ إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً، فاستشار الملائكة في خلق آدم ع ف قالُوا:\n\n«أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وقد علمت الملائكة من علم الله أنه لا شيء أكره إلى الله عز وجل من سفك الدماء والفساد في الأرض،","bs":"\u003cp data-paragraph=\"100.1\">Ovo mišljenje preneseno je od jedne skupine prethodnika.\u003c/p>\u003cp data-paragraph=\"100.2\">Spomen nekih od kojih je to preneseno:\u003c/p>\u003cp data-paragraph=\"100.3\">Pričao mi je Musa ibn Harun, koji je rekao: pričao mi je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, o riječima: „Ako istinu govorite“ — da će Ademovi potomci činiti nered na Zemlji i prolijevati krv. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"100.4\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, o riječima: „Ako istinu govorite“ — ako znate zašto ću na Zemlji postaviti namjesnika. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Napomena prevodioca: لم أجعل ovdje je prema kontekstu pročitano kao لِمَ أجعل, „zašto ću postaviti“; izvor nema oznake koje bi ovo čitanje izričito razriješile.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"100.5\">Rečeno je da je Allah, Uzvišeno je Njegovo veličanstvo, to rekao melekima zato što su oni, kada je On, Uzvišeno je Njegovo veličanstvo, započeo stvarati Adema, međusobno rekli: „Neka naš Gospodar stvori šta god želi stvoriti; neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji od njega.“ Kada je stvorio Adema, alejhis-selam, i poučio ga imenu svega, pokazao je melekima stvari čijim je imenima poučio Adema i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite“ — u svojoj tvrdnji da Allah nije stvorio nijedno stvorenje a da ste vi učeniji od njega i kod Njega ugledniji od njega. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"100.6\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"100.7\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, o riječima: „I kada je tvoj Gospodar rekao melekima: Ja ću na Zemlji postaviti namjesnika.“ Posavjetovao se s melekima o stvaranju Adema, alejhis-selam, pa su rekli: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?“ Meleki su iz Allahovog znanja već znali da Allahu, Silnom i Uzvišenom, ništa nije mrže od prolijevanja krvi i činjenja nereda na Zemlji, \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dijelovi. Riječi o savjetovanju s melekima pripadaju ovoj predaji, a nisu dio kur’anskog ajeta.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"100.1","ar":"وهذا قول روي عن جماعة من السلف.","bs":"Ovo mišljenje preneseno je od jedne skupine prethodnika.","ar_ranges":[],"ar_html":"وهذا قول روي عن جماعة من السلف.","bs_ranges":[],"bs_html":"Ovo mišljenje preneseno je od jedne skupine prethodnika."},{"id":"100.2","ar":"ذكر بعض من روي ذلك عنه:","bs":"Spomen nekih od kojih je to preneseno:","ar_ranges":[],"ar_html":"ذكر بعض من روي ذلك عنه:","bs_ranges":[],"bs_html":"Spomen nekih od kojih je to preneseno:"},{"id":"100.3","ar":"حَدَّثَنِي مُوسَى بْنُ هَارُونَ، قَالَ: حَدَّثَنِي عَمْرُو بْنُ حماد، قال:\nحدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن عبد الله بن مسعود- وعن ناس من اصحاب النبي ص: «إِنْ كُنْتُمْ صادِقِينَ» أَنَّ بَنِي آدَمَ يُفْسِدُونَ فِي الأَرْضِ وَيَسْفِكُونَ الدِّمَاءَ.","bs":"Pričao mi je Musa ibn Harun, koji je rekao: pričao mi je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, o riječima: „Ako istinu govorite“ — da će Ademovi potomci činiti nered na Zemlji i prolijevati krv. ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧","ar_ranges":[[0,216]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بْنُ هَارُونَ، قَالَ: حَدَّثَنِي عَمْرُو بْنُ حماد، قال:\nحدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن عبد الله بن مسعود- وعن ناس من اصحاب النبي ص: \u003c/span>«إِنْ كُنْتُمْ صادِقِينَ» أَنَّ بَنِي آدَمَ يُفْسِدُونَ فِي الأَرْضِ وَيَسْفِكُونَ الدِّمَاءَ.","bs_ranges":[[0,309]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musa ibn Harun, koji je rekao: pričao mi je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, \u003c/span>o riječima: „Ako istinu govorite“ — da će Ademovi potomci činiti nered na Zemlji i prolijevati krv. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>"},{"id":"100.4","ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ:\n\n«إِنْ كُنْتُمْ صادِقِينَ» ، إِنْ كُنْتُمْ تَعْلَمُونَ لَمْ أَجْعَلْ فِي الأَرْضِ خَلِيفَةً.","bs":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, o riječima: „Ako istinu govorite“ — ako znate zašto ću na Zemlji postaviti namjesnika. ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Napomena prevodioca: لم أجعل ovdje je prema kontekstu pročitano kao لِمَ أجعل, „zašto ću postaviti“; izvor nema oznake koje bi ovo čitanje izričito razriješile.⟧","ar_ranges":[[0,169]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ:\n\n\u003c/span>«إِنْ كُنْتُمْ صادِقِينَ» ، إِنْ كُنْتُمْ تَعْلَمُونَ لَمْ أَجْعَلْ فِي الأَرْضِ خَلِيفَةً.","bs_ranges":[[0,157]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, \u003c/span>o riječima: „Ako istinu govorite“ — ako znate zašto ću na Zemlji postaviti namjesnika. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Napomena prevodioca: لم أجعل ovdje je prema kontekstu pročitano kao لِمَ أجعل, „zašto ću postaviti“; izvor nema oznake koje bi ovo čitanje izričito razriješile.⟧\u003c/span>"},{"id":"100.5","ar":"وَقَدْ قِيلَ: إِنَّ اللَّهَ جَلَّ جَلالَهُ قَالَ ذَلِكَ لِلْمَلائِكَةِ لأَنَّهُ جَلَّ جَلالَهُ لَمَّا ابْتَدَأَ فِي خَلْقِ آدَمَ قَالُوا فِيمَا بَيْنَهُمْ: لِيَخْلُقُ رَبُّنَا مَا شَاءَ أَنْ يَخْلُقَ، فَلَنْ يخلق خلقا إلا كنا أعلم منه، وأكرم عليه منه، فلما خلق آدم ع وَعَلَّمَهُ أَسْمَاءَ كُلَّ شَيْءٍ عَرَضَ الأَشْيَاءَ الَّتِي علم آدم أسمائها عليهم، فقال لهم: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» فِي قِيلِكُمْ: إِنَّ اللَّهَ لَمْ يَخْلُقْ خَلْقًا إِلا كُنْتُمْ أَعْلَمَ مِنْهُ، وَأَكْرَمَ عَلَيْهِ مِنْهُ.","bs":"Rečeno je da je Allah, Uzvišeno je Njegovo veličanstvo, to rekao melekima zato što su oni, kada je On, Uzvišeno je Njegovo veličanstvo, započeo stvarati Adema, međusobno rekli: „Neka naš Gospodar stvori šta god želi stvoriti; neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji od njega.“ Kada je stvorio Adema, alejhis-selam, i poučio ga imenu svega, pokazao je melekima stvari čijim je imenima poučio Adema i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite“ — u svojoj tvrdnji da Allah nije stvorio nijedno stvorenje a da ste vi učeniji od njega i kod Njega ugledniji od njega. ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧","ar_ranges":[],"ar_html":"وَقَدْ قِيلَ: إِنَّ اللَّهَ جَلَّ جَلالَهُ قَالَ ذَلِكَ لِلْمَلائِكَةِ لأَنَّهُ جَلَّ جَلالَهُ لَمَّا ابْتَدَأَ فِي خَلْقِ آدَمَ قَالُوا فِيمَا بَيْنَهُمْ: لِيَخْلُقُ رَبُّنَا مَا شَاءَ أَنْ يَخْلُقَ، فَلَنْ يخلق خلقا إلا كنا أعلم منه، وأكرم عليه منه، فلما خلق آدم ع وَعَلَّمَهُ أَسْمَاءَ كُلَّ شَيْءٍ عَرَضَ الأَشْيَاءَ الَّتِي علم آدم أسمائها عليهم، فقال لهم: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» فِي قِيلِكُمْ: إِنَّ اللَّهَ لَمْ يَخْلُقْ خَلْقًا إِلا كُنْتُمْ أَعْلَمَ مِنْهُ، وَأَكْرَمَ عَلَيْهِ مِنْهُ.","bs_ranges":[],"bs_html":"Rečeno je da je Allah, Uzvišeno je Njegovo veličanstvo, to rekao melekima zato što su oni, kada je On, Uzvišeno je Njegovo veličanstvo, započeo stvarati Adema, međusobno rekli: „Neka naš Gospodar stvori šta god želi stvoriti; neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji od njega.“ Kada je stvorio Adema, alejhis-selam, i poučio ga imenu svega, pokazao je melekima stvari čijim je imenima poučio Adema i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite“ — u svojoj tvrdnji da Allah nije stvorio nijedno stvorenje a da ste vi učeniji od njega i kod Njega ugledniji od njega. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>"},{"id":"100.6","ar":"ذكر من قال ذلك:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذكر من قال ذلك:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"100.7","ar":"حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ:\n\nحَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ: قوله: «وَإِذْ قالَ رَبُّكَ لِلْمَلائِكَةِ إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً، فاستشار الملائكة في خلق آدم ع ف قالُوا:\n\n«أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وقد علمت الملائكة من علم الله أنه لا شيء أكره إلى الله عز وجل من سفك الدماء والفساد في الأرض،","bs":"Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, o riječima: „I kada je tvoj Gospodar rekao melekima: Ja ću na Zemlji postaviti namjesnika.“ Posavjetovao se s melekima o stvaranju Adema, alejhis-selam, pa su rekli: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?“ Meleki su iz Allahovog znanja već znali da Allahu, Silnom i Uzvišenom, ništa nije mrže od prolijevanja krvi i činjenja nereda na Zemlji, ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dijelovi. Riječi o savjetovanju s melekima pripadaju ovoj predaji, a nisu dio kur’anskog ajeta.⟧","ar_ranges":[[0,117]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ:\n\nحَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ: \u003c/span>قوله: «وَإِذْ قالَ رَبُّكَ لِلْمَلائِكَةِ إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً، فاستشار الملائكة في خلق آدم ع ف قالُوا:\n\n«أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وقد علمت الملائكة من علم الله أنه لا شيء أكره إلى الله عز وجل من سفك الدماء والفساد في الأرض،","bs_ranges":[[0,122]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, \u003c/span>o riječima: „I kada je tvoj Gospodar rekao melekima: Ja ću na Zemlji postaviti namjesnika.“ Posavjetovao se s melekima o stvaranju Adema, alejhis-selam, pa su rekli: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?“ Meleki su iz Allahovog znanja već znali da Allahu, Silnom i Uzvišenom, ništa nije mrže od prolijevanja krvi i činjenja nereda na Zemlji, \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dijelovi. Riječi o savjetovanju s melekima pripadaju ovoj predaji, a nisu dio kur’anskog ajeta.⟧\u003c/span>"}],"notes":[]},{"n":101,"ar":"«وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» ، فَكان في علم الله عز وجل انه سيكون من تلك الخليقة أنبياء ورسل وقوم صالحون وساكنو الجنة.\nقال: وذكر لنا أن ابْنِ عَبَّاسٍ كان يقول: إن الله تعالى لما أخذ في خلق آدم قالت الملائكة: ما الله تعالى بخالق خلقا أكرم عليه منا، ولا أعلم منا، فابتلوا بخلق آدم ع- وكل خلق مبتلى، كما ابتليت السموات والأرض بالطاعة- فقال الله تعالى: «ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ» .\nحَدَّثَنَا القاسم، قال: حَدَّثَنَا الحسين بن داود، قال: حَدَّثَنِي حجاج، عن جرير بن حازم، ومبارك عن الحسن وأبي بكر عن الحسن وقتادة قالا: قال الله عز وجل للملائكة: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» قال لهم: إني فاعل، فعرضوا برأيهم، فعلمهم علما وطوى منهم علما علمه لا يعلمونه، فقالوا بالعلم الذي علمهم: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» - وقد كانت الملائكة علمت من علم الله تعالى أنه لا ذنب عند الله تعالى أعظم من سفك الدِّمَاءَ- «وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» ، فلما أخذ تعالى في خلق آدم ع همست الملائكة فيما بينهم، فقالوا: ليخلق ربنا عز وجل ما شاء أن يخلق، فلن يخلق خلقا إلا كنا أعلم منه، وأكرم عليه منه، فلما خلقه ونفخ فيه من روحه أمرهم أن يسجدوا له لما قالوا، ففضله عليهم، فعلموا أنهم ليسوا بخير منه، فقالوا:\nإن لم نكن خيرا منه، فنحن أعلم منه، لأنا كنا قبله، وخلقت الأمم قبله،","bs":"\u003cp data-paragraph=\"101.1\">„a mi Tebe s hvalom slavimo i svetost Ti iskazujemo. Rekao je: Ja znam ono što vi ne znate.“ U Allahovom, Silan je i Uzvišen, znanju bilo je da će od tih stvorenja biti vjerovjesnika, poslanika, dobrih ljudi i stanovnika Dženneta. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:30, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"101.2\">Rekao je: „Navedeno nam je da je Ibn Abbas govorio: ‘Kada je Uzvišeni Allah počeo stvarati Adema, meleki su rekli: Allah neće stvoriti nijedno stvorenje koje bi Mu bilo uglednije od nas ili učenije od nas. Zato su iskušani stvaranjem Adema, alejhis-selam. Svako je stvorenje iskušano, kao što su nebesa i Zemlja iskušani pokornošću.’ Uzvišeni Allah rekao je: ‘Dođite, milom ili silom!’ Odgovorili su: ‘Dolazimo poslušno.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Fussilet, 41:11, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"101.3\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Džerira ibn Hazima i Mubareka, od Hasena i Ebu Bekra, od Hasena i Katade; obojica su rekli: „Allah, Silan i Uzvišen, rekao je melekima: ‘Ja ću na Zemlji postaviti namjesnika.’ Rekao im je: ‘Ja ću to učiniti.’ Oni su iznijeli svoje mišljenje. Poučio ih je jednom znanju, a od njih sakrio znanje koje je On znao, a oni nisu. Na osnovu znanja kojim ih je poučio rekli su: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ Meleki su iz znanja Uzvišenog Allaha već znali da kod Uzvišenog Allaha nema većeg grijeha od prolijevanja krvi. ‘A mi Tebe s hvalom slavimo i svetost Ti iskazujemo. Rekao je: Ja znam ono što vi ne znate.’ Kada je Uzvišeni počeo stvarati Adema, alejhis-selam, meleki su međusobno šaputali i rekli: ‘Neka naš Gospodar, Silan i Uzvišen, stvori šta god želi stvoriti; neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji od njega.’ Kada ga je stvorio i u njega udahnuo od Svoga Duha, naredio im je da mu učine sedždu zbog onoga što su rekli, te ga uzdigao nad njima. Tada su spoznali da nisu bolji od njega. Rekli su: ‘Ako nismo bolji od njega, onda smo učeniji od njega, jer smo bili prije njega, a i narodi su stvoreni prije njega.’ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dijelovi. Niz prenosilaca prenesen je istim redom kao na stranici 98, s istom nejasnoćom njegovih grana.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"101.1","ar":"«وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» ، فَكان في علم الله عز وجل انه سيكون من تلك الخليقة أنبياء ورسل وقوم صالحون وساكنو الجنة.","bs":"„a mi Tebe s hvalom slavimo i svetost Ti iskazujemo. Rekao je: Ja znam ono što vi ne znate.“ U Allahovom, Silan je i Uzvišen, znanju bilo je da će od tih stvorenja biti vjerovjesnika, poslanika, dobrih ljudi i stanovnika Dženneta. ⟦Prijevod kur’anskog navoda: El-Bekara, 2:30, navedeni dio.⟧","ar_ranges":[],"ar_html":"«وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» ، فَكان في علم الله عز وجل انه سيكون من تلك الخليقة أنبياء ورسل وقوم صالحون وساكنو الجنة.","bs_ranges":[],"bs_html":"„a mi Tebe s hvalom slavimo i svetost Ti iskazujemo. Rekao je: Ja znam ono što vi ne znate.“ U Allahovom, Silan je i Uzvišen, znanju bilo je da će od tih stvorenja biti vjerovjesnika, poslanika, dobrih ljudi i stanovnika Dženneta. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:30, navedeni dio.⟧\u003c/span>"},{"id":"101.2","ar":"قال: وذكر لنا أن ابْنِ عَبَّاسٍ كان يقول: إن الله تعالى لما أخذ في خلق آدم قالت الملائكة: ما الله تعالى بخالق خلقا أكرم عليه منا، ولا أعلم منا، فابتلوا بخلق آدم ع- وكل خلق مبتلى، كما ابتليت السموات والأرض بالطاعة- فقال الله تعالى: «ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ» .","bs":"Rekao je: „Navedeno nam je da je Ibn Abbas govorio: ‘Kada je Uzvišeni Allah počeo stvarati Adema, meleki su rekli: Allah neće stvoriti nijedno stvorenje koje bi Mu bilo uglednije od nas ili učenije od nas. Zato su iskušani stvaranjem Adema, alejhis-selam. Svako je stvorenje iskušano, kao što su nebesa i Zemlja iskušani pokornošću.’ Uzvišeni Allah rekao je: ‘Dođite, milom ili silom!’ Odgovorili su: ‘Dolazimo poslušno.’“ ⟦Prijevod kur’anskog navoda: Fussilet, 41:11, navedeni dio.⟧","ar_ranges":[],"ar_html":"قال: وذكر لنا أن ابْنِ عَبَّاسٍ كان يقول: إن الله تعالى لما أخذ في خلق آدم قالت الملائكة: ما الله تعالى بخالق خلقا أكرم عليه منا، ولا أعلم منا، فابتلوا بخلق آدم ع- وكل خلق مبتلى، كما ابتليت السموات والأرض بالطاعة- فقال الله تعالى: «ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ» .","bs_ranges":[],"bs_html":"Rekao je: „Navedeno nam je da je Ibn Abbas govorio: ‘Kada je Uzvišeni Allah počeo stvarati Adema, meleki su rekli: Allah neće stvoriti nijedno stvorenje koje bi Mu bilo uglednije od nas ili učenije od nas. Zato su iskušani stvaranjem Adema, alejhis-selam. Svako je stvorenje iskušano, kao što su nebesa i Zemlja iskušani pokornošću.’ Uzvišeni Allah rekao je: ‘Dođite, milom ili silom!’ Odgovorili su: ‘Dolazimo poslušno.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Fussilet, 41:11, navedeni dio.⟧\u003c/span>"},{"id":"101.3","ar":"حَدَّثَنَا القاسم، قال: حَدَّثَنَا الحسين بن داود، قال: حَدَّثَنِي حجاج، عن جرير بن حازم، ومبارك عن الحسن وأبي بكر عن الحسن وقتادة قالا: قال الله عز وجل للملائكة: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» قال لهم: إني فاعل، فعرضوا برأيهم، فعلمهم علما وطوى منهم علما علمه لا يعلمونه، فقالوا بالعلم الذي علمهم: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» - وقد كانت الملائكة علمت من علم الله تعالى أنه لا ذنب عند الله تعالى أعظم من سفك الدِّمَاءَ- «وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» ، فلما أخذ تعالى في خلق آدم ع همست الملائكة فيما بينهم، فقالوا: ليخلق ربنا عز وجل ما شاء أن يخلق، فلن يخلق خلقا إلا كنا أعلم منه، وأكرم عليه منه، فلما خلقه ونفخ فيه من روحه أمرهم أن يسجدوا له لما قالوا، ففضله عليهم، فعلموا أنهم ليسوا بخير منه، فقالوا:\nإن لم نكن خيرا منه، فنحن أعلم منه، لأنا كنا قبله، وخلقت الأمم قبله،","bs":"Pričao nam je Kasim, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Džerira ibn Hazima i Mubareka, od Hasena i Ebu Bekra, od Hasena i Katade; obojica su rekli: „Allah, Silan i Uzvišen, rekao je melekima: ‘Ja ću na Zemlji postaviti namjesnika.’ Rekao im je: ‘Ja ću to učiniti.’ Oni su iznijeli svoje mišljenje. Poučio ih je jednom znanju, a od njih sakrio znanje koje je On znao, a oni nisu. Na osnovu znanja kojim ih je poučio rekli su: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ Meleki su iz znanja Uzvišenog Allaha već znali da kod Uzvišenog Allaha nema većeg grijeha od prolijevanja krvi. ‘A mi Tebe s hvalom slavimo i svetost Ti iskazujemo. Rekao je: Ja znam ono što vi ne znate.’ Kada je Uzvišeni počeo stvarati Adema, alejhis-selam, meleki su međusobno šaputali i rekli: ‘Neka naš Gospodar, Silan i Uzvišen, stvori šta god želi stvoriti; neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji od njega.’ Kada ga je stvorio i u njega udahnuo od Svoga Duha, naredio im je da mu učine sedždu zbog onoga što su rekli, te ga uzdigao nad njima. Tada su spoznali da nisu bolji od njega. Rekli su: ‘Ako nismo bolji od njega, onda smo učeniji od njega, jer smo bili prije njega, a i narodi su stvoreni prije njega.’ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dijelovi. Niz prenosilaca prenesen je istim redom kao na stranici 98, s istom nejasnoćom njegovih grana.⟧","ar_ranges":[[0,163]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا القاسم، قال: حَدَّثَنَا الحسين بن داود، قال: حَدَّثَنِي حجاج، عن جرير بن حازم، ومبارك عن الحسن وأبي بكر عن الحسن وقتادة قالا: قال الله عز وجل للملائكة: \u003c/span>«إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» قال لهم: إني فاعل، فعرضوا برأيهم، فعلمهم علما وطوى منهم علما علمه لا يعلمونه، فقالوا بالعلم الذي علمهم: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» - وقد كانت الملائكة علمت من علم الله تعالى أنه لا ذنب عند الله تعالى أعظم من سفك الدِّمَاءَ- «وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» ، فلما أخذ تعالى في خلق آدم ع همست الملائكة فيما بينهم، فقالوا: ليخلق ربنا عز وجل ما شاء أن يخلق، فلن يخلق خلقا إلا كنا أعلم منه، وأكرم عليه منه، فلما خلقه ونفخ فيه من روحه أمرهم أن يسجدوا له لما قالوا، ففضله عليهم، فعلموا أنهم ليسوا بخير منه، فقالوا:\nإن لم نكن خيرا منه، فنحن أعلم منه، لأنا كنا قبله، وخلقت الأمم قبله،","bs_ranges":[[0,202]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Džerira ibn Hazima i Mubareka, od Hasena i Ebu Bekra, od Hasena i Katade; obojica su rekli: \u003c/span>„Allah, Silan i Uzvišen, rekao je melekima: ‘Ja ću na Zemlji postaviti namjesnika.’ Rekao im je: ‘Ja ću to učiniti.’ Oni su iznijeli svoje mišljenje. Poučio ih je jednom znanju, a od njih sakrio znanje koje je On znao, a oni nisu. Na osnovu znanja kojim ih je poučio rekli su: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ Meleki su iz znanja Uzvišenog Allaha već znali da kod Uzvišenog Allaha nema većeg grijeha od prolijevanja krvi. ‘A mi Tebe s hvalom slavimo i svetost Ti iskazujemo. Rekao je: Ja znam ono što vi ne znate.’ Kada je Uzvišeni počeo stvarati Adema, alejhis-selam, meleki su međusobno šaputali i rekli: ‘Neka naš Gospodar, Silan i Uzvišen, stvori šta god želi stvoriti; neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji od njega.’ Kada ga je stvorio i u njega udahnuo od Svoga Duha, naredio im je da mu učine sedždu zbog onoga što su rekli, te ga uzdigao nad njima. Tada su spoznali da nisu bolji od njega. Rekli su: ‘Ako nismo bolji od njega, onda smo učeniji od njega, jer smo bili prije njega, a i narodi su stvoreni prije njega.’ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dijelovi. Niz prenosilaca prenesen je istim redom kao na stranici 98, s istom nejasnoćom njegovih grana.⟧\u003c/span>"}],"notes":[]},{"n":102,"ar":"فلما أعجبوا بعلمهم ابتلوا، «فعلم آدَمَ الْأَسْماءَ كُلَّها ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ فَقالَ: أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ، إِنْ كُنْتُمْ صادِقِينَ» أني لم أخلق خلقا إلا كنتم أعلم منه، فأخبروني بأسماء هؤلاء إن كنتم صادقين قالا: ففزع القوم إلى التوبة، وإليها يفزع كل مؤمن، فقالوا: «سُبْحانَكَ لا عِلْمَ لَنا إِلَّا مَا عَلَّمْتَنا إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ قالَ يَا آدَمُ أَنْبِئْهُمْ بِأَسْمائِهِمْ فَلَمَّا أَنْبَأَهُمْ بِأَسْمائِهِمْ قالَ أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّماواتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» لقولهم: ليخلق ربنا ما شاء، فلن يخلق خلقا أكرم عليه منا، ولا أعلم منا، قال: علمه اسم كل شيء:\nهذه الخيل، وهذه البغال، والإبل، والجن، والوحش، وجعل يسمي كل شيء باسمه، وعرضت عليه أمة أمة، قال: «أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّماواتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، قال:\n\nاما ما أبدوا فقولهم: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وأما ما كتموا فقولهم بعضهم لبعض: نحن خير منه وأعلم.\nحَدَّثَنَا عَمَّارُ بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أَنَسٍ: «ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ فَقالَ أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» إِلَى قَوْلِهِ: «إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ\n» ، قَالَ: وَذَلِكَ حِينَ قَالُوا: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» إِلَى قَوْلِهِ «وَنُقَدِّسُ لَكَ» قَالَ: فَلَمَّا عَرَفُوا أَنَّهُ جَاعِلٌ فِي الأَرْضِ خَلِيفَةً قَالُوا بَيْنَهُمْ: لَنْ يَخْلُقَ اللَّهُ تعالى خَلْقًا إِلا كُنَّا نَحْنُ أَعْلَمُ مِنْهُ وَأَكْرَمُ عَلَيْهِ، فَأَرَادَ اللَّهُ تعالى أَنْ يُخْبِرَهُمْ أَنَّهُ قَدْ فَضَّلَ عَلَيْهِمْ آدَمَ، وَعَلَّمَهُ الأَسْمَاءَ كُلَّهَا، وَقَالَ","bs":"\u003cp data-paragraph=\"102.1\">Kada su se zadivili svojim znanjem, bili su iskušani. Pa je poučio Adema svim imenima, zatim ih pokazao melekima i rekao: ‘Obavijestite Me o imenima ovih, ako istinu govorite’ — da nisam stvorio nijedno stvorenje a da vi ne budete učeniji od njega. ‘Obavijestite Me o imenima ovih, ako istinu govorite.’“ Obojica su rekli: „Tada su pribjegli pokajanju, a njemu pribjegava svaki vjernik, pa su rekli: ‘Slavljen neka si! Mi nemamo znanja osim onoga čemu si nas Ti poučio. Ti si, doista, Sveznajući, Mudri. Rekao je: Ademe, obavijesti ih o njihovim imenima! Kada ih je obavijestio o njihovim imenima, rekao je: Zar vam nisam rekao da Ja znam nevidljivo nebesa i Zemlje i znam ono što pokazujete i ono što ste krili?’“ Zbog njihovih riječi: „Neka naš Gospodar stvori šta god želi; neće stvoriti nijedno stvorenje koje bi Mu bilo uglednije od nas niti učenije od nas.“ Rekao je: „Poučio ga je imenu svega: ovo su konji, ovo su mazge, deve, džini i divlje životinje. Počeo je imenovati svaku stvar njenim imenom, a pokazivane su mu vrste jedna po jedna.“ Rekao je: „Zar vam nisam rekao da Ja znam nevidljivo nebesa i Zemlje i znam ono što pokazujete i ono što ste krili?“ Rekao je: „Ono što su pokazali njihove su riječi: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ A ono što su krili njihove su međusobne riječi: ‘Mi smo bolji od njega i učeniji.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30–33, navedeni dijelovi. Početak izvornog navoda فعلم آدم prenesen je kao „Pa je poučio Adema“; u mushafu u 2:31 stoji وعلم آدم („I poučio je Adema“). Formulacija „Obavijestite Me…“ koja se ponavlja izvan navodnika izvora prenosi tekst predaje, a nije dopuna ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"102.2\">Pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, o riječima: „Zatim ih je pokazao melekima i rekao: Obavijestite Me o imenima ovih, ako istinu govorite“ — do Njegovih riječi: „Ti si, doista, Sveznajući, Mudri.“ Rekao je: „To je bilo kada su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati’ — do Njegovih riječi: ‘I svetost Ti iskazujemo.’“ Rekao je: „Kada su saznali da će On postaviti namjesnika na Zemlji, među sobom su rekli: ‘Allah neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji.’ Uzvišeni Allah htio ih je obavijestiti da je Adema odlikovao nad njima i poučio ga svim imenima. Rekao je \u003cspan class=\"translator-note\">⟦Prijevodi navedenih dijelova: El-Bekara, 2:31–32 i 2:30. Prijelazi „do Njegovih riječi“ sačuvani su iz izvora.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"102.1","ar":"فلما أعجبوا بعلمهم ابتلوا، «فعلم آدَمَ الْأَسْماءَ كُلَّها ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ فَقالَ: أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ، إِنْ كُنْتُمْ صادِقِينَ» أني لم أخلق خلقا إلا كنتم أعلم منه، فأخبروني بأسماء هؤلاء إن كنتم صادقين قالا: ففزع القوم إلى التوبة، وإليها يفزع كل مؤمن، فقالوا: «سُبْحانَكَ لا عِلْمَ لَنا إِلَّا مَا عَلَّمْتَنا إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ قالَ يَا آدَمُ أَنْبِئْهُمْ بِأَسْمائِهِمْ فَلَمَّا أَنْبَأَهُمْ بِأَسْمائِهِمْ قالَ أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّماواتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» لقولهم: ليخلق ربنا ما شاء، فلن يخلق خلقا أكرم عليه منا، ولا أعلم منا، قال: علمه اسم كل شيء:\nهذه الخيل، وهذه البغال، والإبل، والجن، والوحش، وجعل يسمي كل شيء باسمه، وعرضت عليه أمة أمة، قال: «أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّماواتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، قال:\n\nاما ما أبدوا فقولهم: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وأما ما كتموا فقولهم بعضهم لبعض: نحن خير منه وأعلم.","bs":"Kada su se zadivili svojim znanjem, bili su iskušani. Pa je poučio Adema svim imenima, zatim ih pokazao melekima i rekao: ‘Obavijestite Me o imenima ovih, ako istinu govorite’ — da nisam stvorio nijedno stvorenje a da vi ne budete učeniji od njega. ‘Obavijestite Me o imenima ovih, ako istinu govorite.’“ Obojica su rekli: „Tada su pribjegli pokajanju, a njemu pribjegava svaki vjernik, pa su rekli: ‘Slavljen neka si! Mi nemamo znanja osim onoga čemu si nas Ti poučio. Ti si, doista, Sveznajući, Mudri. Rekao je: Ademe, obavijesti ih o njihovim imenima! Kada ih je obavijestio o njihovim imenima, rekao je: Zar vam nisam rekao da Ja znam nevidljivo nebesa i Zemlje i znam ono što pokazujete i ono što ste krili?’“ Zbog njihovih riječi: „Neka naš Gospodar stvori šta god želi; neće stvoriti nijedno stvorenje koje bi Mu bilo uglednije od nas niti učenije od nas.“ Rekao je: „Poučio ga je imenu svega: ovo su konji, ovo su mazge, deve, džini i divlje životinje. Počeo je imenovati svaku stvar njenim imenom, a pokazivane su mu vrste jedna po jedna.“ Rekao je: „Zar vam nisam rekao da Ja znam nevidljivo nebesa i Zemlje i znam ono što pokazujete i ono što ste krili?“ Rekao je: „Ono što su pokazali njihove su riječi: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ A ono što su krili njihove su međusobne riječi: ‘Mi smo bolji od njega i učeniji.’“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30–33, navedeni dijelovi. Početak izvornog navoda فعلم آدم prenesen je kao „Pa je poučio Adema“; u mushafu u 2:31 stoji وعلم آدم („I poučio je Adema“). Formulacija „Obavijestite Me…“ koja se ponavlja izvan navodnika izvora prenosi tekst predaje, a nije dopuna ajeta.⟧","ar_ranges":[],"ar_html":"فلما أعجبوا بعلمهم
