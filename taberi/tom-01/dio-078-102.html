عاؤه، ثم نتبع ذلك ما كان من الأحداث في أيام سلطانه وملكه إلى حين زوال ذلك عنه، والسبب الذي به زال عنه ما كان فيه من نعمة الله عليه، وجميل آلائه، وغير ذلك من أموره، إن شاء الله مختصرا","bs_ranges":[],"bs_html":"Počet ćemo navođenjem skupina predaja koje su došle od prethodnika o počastima koje mu je Allah, Silan i Uzvišen, dao prije nego što se uzoholio protiv Njega i prisvojio sebi ono na šta nije imao pravo. Zatim ćemo navesti događaje iz vremena njegove vlasti i vladavine, sve do vremena kada je to izgubio, i razlog zbog kojeg su od njega nestale Allahove blagodati i divna dobročinstva koja mu je darovao, te ostalo o njemu, ako Allah htjedne, ukratko."}],"notes":[]},{"n":81,"ar":"ذكر الأخبار الواردة بأن إبليس كان له ملك السماء الدنيا والأرض وما بين ذلك\nحدثنا القاسم بن الحسن، قال: حدثنا الحسين بْنُ دَاوُدَ، قَالَ: حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: قَالَ ابْنُ عَبَّاسٍ: كَانَ إِبْلِيسُ مِنْ أَشْرَافِ الْمَلائِكَةِ وَأَكْرَمِهِمْ قَبِيلَةً، وَكَانَ خَازِنًا عَلَى الْجِنَانِ، وَكَانَ لَهُ سُلْطَانُ سَمَاءِ الدُّنْيَا، وَكَانَ لَهُ سُلْطَانُ الأَرْضِ.\nحَدَّثَنَا الْقَاسِمُ، قَالَ: حدثنا الحسين، قال: حدثني حجاج، عن ابن جريج، عن صالح مولى التوءمه وَشَرِيكِ بْنِ أَبِي نَمِرٍ- أَحَدُهُمَا أَوْ كِلاهُمَا- عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ مِنَ الْمَلائِكَةِ قَبِيلَةً مِنَ الْجِنِّ وَكَانَ إِبْلِيسُ مِنْهَا، وَكَانَ يَسُوسُ مَا بَيْنَ السَّمَاءِ وَالأَرْضِ.\nحَدَّثَنَا مُوسَى بن هارون الهمداني، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك، وعن أبي صالح عن ابن عباس، وعن مرة الهمداني عن ابن مسعود، وعن ناس من أصحاب النبي ص جعل ابليس على سَمَاءِ الدُّنْيَا، وَكَانَ مِنْ قَبِيلَةٍ مِنَ الْمَلائِكَةِ يُقَالُ لَهُمُ الْجِنُّ، وَإِنَّمَا سُمُّوا الْجِنَّ لأَنَّهُمْ خُزَّانُ الْجَنَّةِ، وَكَانَ إِبْلِيسُ مَعَ مُلْكِهِ خَازِنًا.\nحَدَّثَنِي عَبْدَانُ الْمَرْوَزِيُّ، حَدَّثَنِي الْحُسَيْنُ بْنُ الْفَرَجِ، قَالَ: سَمِعْتُ أَبَا مُعَاذٍ الْفَضْلَ بْنَ خَالِدٍ قَالَ: أَخْبَرَنَا عُبَيْدُ اللَّهِ بْنُ سُلَيْمَانَ، قَالَ: سمعت الضحاك ابن مُزَاحِمٍ يَقُولُ فِي قَوْلِهِ عَزَّ وَجَلَّ: «فَسَجَدُوا إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ» ، قَالَ: كَانَ ابْنِ عَبَّاسٍ يَقُولُ: إِنَّ إِبْلِيسَ كان من اشرف الملائكة واكرمهم","bs":"\u003cp data-paragraph=\"81.1\">Spomen predaja prema kojima je Iblis imao vlast nad najbližim nebom, Zemljom i onim što je između njih\u003c/p>\u003cp data-paragraph=\"81.2\">Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, koji je rekao: Ibn Abbas je rekao: „Iblis je bio jedan od uglednih meleka, iz njihovog najplemenitijeg plemena. Bio je čuvar džennetskih vrtova i imao je vlast nad najbližim nebom i vlast nad Zemljom.“\u003c/p>\u003cp data-paragraph=\"81.3\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, od Saliha, oslobođenika Tev’eme, i Šerika ibn Ebu Nemira — jednoga od njih ili obojice — od Ibn Abbasa, koji je rekao: „Među melekima postoji pleme džina, a Iblis je bio iz njega. Upravljao je onim što je između neba i Zemlje.“\u003c/p>\u003cp data-paragraph=\"81.4\">Pričao nam je Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa, te od Murre el-Hemdanija, od Ibn Mesuda, i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: „Postavio je Iblisa nad najbližim nebom. Bio je iz plemena meleka koje se naziva džinima. Nazvani su džinima zato što su čuvari Dženneta. Iblis je, pored svoje vlasti, bio i čuvar.“\u003c/p>\u003cp data-paragraph=\"81.5\">Pričao mi je Abdan el-Mervezi: pričao mi je Husejn ibn el-Feredž, koji je rekao: čuo sam Ebu Muaza el-Fadla ibn Halida kako kaže: obavijestio nas je Ubejdullah ibn Sulejman, koji je rekao: čuo sam Dahhaka ibn Muzahima kako, o riječima Njega, Silnog i Uzvišenog: „Pa su učinili sedždu, osim Iblisa; bio je od džina“, kaže: „Ibn Abbas govorio je: ‘Iblis je bio jedan od uglednih meleka, iz njihovog najplemenitijeg \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"81.1","ar":"ذكر الأخبار الواردة بأن إبليس كان له ملك السماء الدنيا والأرض وما بين ذلك","bs":"Spomen predaja prema kojima je Iblis imao vlast nad najbližim nebom, Zemljom i onim što je između njih","ar_ranges":[],"ar_html":"ذكر الأخبار الواردة بأن إبليس كان له ملك السماء الدنيا والأرض وما بين ذلك","bs_ranges":[],"bs_html":"Spomen predaja prema kojima je Iblis imao vlast nad najbližim nebom, Zemljom i onim što je između njih"},{"id":"81.2","ar":"حدثنا القاسم بن الحسن، قال: حدثنا الحسين بْنُ دَاوُدَ، قَالَ: حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: قَالَ ابْنُ عَبَّاسٍ: كَانَ إِبْلِيسُ مِنْ أَشْرَافِ الْمَلائِكَةِ وَأَكْرَمِهِمْ قَبِيلَةً، وَكَانَ خَازِنًا عَلَى الْجِنَانِ، وَكَانَ لَهُ سُلْطَانُ سَمَاءِ الدُّنْيَا، وَكَانَ لَهُ سُلْطَانُ الأَرْضِ.","bs":"Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, koji je rekao: Ibn Abbas je rekao: „Iblis je bio jedan od uglednih meleka, iz njihovog najplemenitijeg plemena. Bio je čuvar džennetskih vrtova i imao je vlast nad najbližim nebom i vlast nad Zemljom.“","ar_ranges":[[0,133]],"ar_html":"\u003cspan class=\"isnad\">حدثنا القاسم بن الحسن، قال: حدثنا الحسين بْنُ دَاوُدَ، قَالَ: حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: قَالَ ابْنُ عَبَّاسٍ: \u003c/span>كَانَ إِبْلِيسُ مِنْ أَشْرَافِ الْمَلائِكَةِ وَأَكْرَمِهِمْ قَبِيلَةً، وَكَانَ خَازِنًا عَلَى الْجِنَانِ، وَكَانَ لَهُ سُلْطَانُ سَمَاءِ الدُّنْيَا، وَكَانَ لَهُ سُلْطَانُ الأَرْضِ.","bs_ranges":[[0,173]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, koji je rekao: Ibn Abbas je rekao: \u003c/span>„Iblis je bio jedan od uglednih meleka, iz njihovog najplemenitijeg plemena. Bio je čuvar džennetskih vrtova i imao je vlast nad najbližim nebom i vlast nad Zemljom.“"},{"id":"81.3","ar":"حَدَّثَنَا الْقَاسِمُ، قَالَ: حدثنا الحسين، قال: حدثني حجاج، عن ابن جريج، عن صالح مولى التوءمه وَشَرِيكِ بْنِ أَبِي نَمِرٍ- أَحَدُهُمَا أَوْ كِلاهُمَا- عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ مِنَ الْمَلائِكَةِ قَبِيلَةً مِنَ الْجِنِّ وَكَانَ إِبْلِيسُ مِنْهَا، وَكَانَ يَسُوسُ مَا بَيْنَ السَّمَاءِ وَالأَرْضِ.","bs":"Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, od Saliha, oslobođenika Tev’eme, i Šerika ibn Ebu Nemira — jednoga od njih ili obojice — od Ibn Abbasa, koji je rekao: „Među melekima postoji pleme džina, a Iblis je bio iz njega. Upravljao je onim što je između neba i Zemlje.“","ar_ranges":[[0,180]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا الْقَاسِمُ، قَالَ: حدثنا الحسين، قال: حدثني حجاج، عن ابن جريج، عن صالح مولى التوءمه وَشَرِيكِ بْنِ أَبِي نَمِرٍ- أَحَدُهُمَا أَوْ كِلاهُمَا- عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ مِنَ الْمَلائِكَةِ قَبِيلَةً مِنَ الْجِنِّ وَكَانَ إِبْلِيسُ مِنْهَا، وَكَانَ يَسُوسُ مَا بَيْنَ السَّمَاءِ وَالأَرْضِ.","bs_ranges":[[0,234]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, od Saliha, oslobođenika Tev’eme, i Šerika ibn Ebu Nemira — jednoga od njih ili obojice — od Ibn Abbasa, koji je rekao: \u003c/span>„Među melekima postoji pleme džina, a Iblis je bio iz njega. Upravljao je onim što je između neba i Zemlje.“"},{"id":"81.4","ar":"حَدَّثَنَا مُوسَى بن هارون الهمداني، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك، وعن أبي صالح عن ابن عباس، وعن مرة الهمداني عن ابن مسعود، وعن ناس من أصحاب النبي ص جعل ابليس على سَمَاءِ الدُّنْيَا، وَكَانَ مِنْ قَبِيلَةٍ مِنَ الْمَلائِكَةِ يُقَالُ لَهُمُ الْجِنُّ، وَإِنَّمَا سُمُّوا الْجِنَّ لأَنَّهُمْ خُزَّانُ الْجَنَّةِ، وَكَانَ إِبْلِيسُ مَعَ مُلْكِهِ خَازِنًا.","bs":"Pričao nam je Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa, te od Murre el-Hemdanija, od Ibn Mesuda, i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: „Postavio je Iblisa nad najbližim nebom. Bio je iz plemena meleka koje se naziva džinima. Nazvani su džinima zato što su čuvari Dženneta. Iblis je, pored svoje vlasti, bio i čuvar.“","ar_ranges":[[0,399]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُوسَى بن هارون الهمداني، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك، وعن أبي صالح عن ابن عباس، وعن مرة الهمداني عن ابن مسعود، وعن ناس من أصحاب النبي ص جعل ابليس على سَمَاءِ الدُّنْيَا، وَكَانَ مِنْ قَبِيلَةٍ مِنَ الْمَلائِكَةِ يُقَالُ لَهُمُ الْجِنُّ، وَإِنَّمَا سُمُّوا الْجِنَّ لأَنَّهُمْ خُزَّانُ الْجَنَّةِ، وَكَانَ إِبْلِيسُ مَعَ مُلْكِهِ خَازِنًا.\u003c/span>","bs_ranges":[[0,308]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa, te od Murre el-Hemdanija, od Ibn Mesuda, i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: \u003c/span>„Postavio je Iblisa nad najbližim nebom. Bio je iz plemena meleka koje se naziva džinima. Nazvani su džinima zato što su čuvari Dženneta. Iblis je, pored svoje vlasti, bio i čuvar.“"},{"id":"81.5","ar":"حَدَّثَنِي عَبْدَانُ الْمَرْوَزِيُّ، حَدَّثَنِي الْحُسَيْنُ بْنُ الْفَرَجِ، قَالَ: سَمِعْتُ أَبَا مُعَاذٍ الْفَضْلَ بْنَ خَالِدٍ قَالَ: أَخْبَرَنَا عُبَيْدُ اللَّهِ بْنُ سُلَيْمَانَ، قَالَ: سمعت الضحاك ابن مُزَاحِمٍ يَقُولُ فِي قَوْلِهِ عَزَّ وَجَلَّ: «فَسَجَدُوا إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ» ، قَالَ: كَانَ ابْنِ عَبَّاسٍ يَقُولُ: إِنَّ إِبْلِيسَ كان من اشرف الملائكة واكرمهم","bs":"Pričao mi je Abdan el-Mervezi: pričao mi je Husejn ibn el-Feredž, koji je rekao: čuo sam Ebu Muaza el-Fadla ibn Halida kako kaže: obavijestio nas je Ubejdullah ibn Sulejman, koji je rekao: čuo sam Dahhaka ibn Muzahima kako, o riječima Njega, Silnog i Uzvišenog: „Pa su učinili sedždu, osim Iblisa; bio je od džina“, kaže: „Ibn Abbas govorio je: ‘Iblis je bio jedan od uglednih meleka, iz njihovog najplemenitijeg ⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧","ar_ranges":[[0,224]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي عَبْدَانُ الْمَرْوَزِيُّ، حَدَّثَنِي الْحُسَيْنُ بْنُ الْفَرَجِ، قَالَ: سَمِعْتُ أَبَا مُعَاذٍ الْفَضْلَ بْنَ خَالِدٍ قَالَ: أَخْبَرَنَا عُبَيْدُ اللَّهِ بْنُ سُلَيْمَانَ، قَالَ: سمعت الضحاك ابن مُزَاحِمٍ يَقُولُ \u003c/span>فِي قَوْلِهِ عَزَّ وَجَلَّ: «فَسَجَدُوا إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ» ، قَالَ: كَانَ ابْنِ عَبَّاسٍ يَقُولُ: إِنَّ إِبْلِيسَ كان من اشرف الملائكة واكرمهم","bs_ranges":[[0,224]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Abdan el-Mervezi: pričao mi je Husejn ibn el-Feredž, koji je rekao: čuo sam Ebu Muaza el-Fadla ibn Halida kako kaže: obavijestio nas je Ubejdullah ibn Sulejman, koji je rekao: čuo sam Dahhaka ibn Muzahima kako, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „Pa su učinili sedždu, osim Iblisa; bio je od džina“, kaže: „Ibn Abbas govorio je: ‘Iblis je bio jedan od uglednih meleka, iz njihovog najplemenitijeg \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧\u003c/span>"}],"notes":[]},{"n":82,"ar":"قَبِيلَةً، وَكَانَ خَازِنًا عَلَى الْجِنَانِ، وَكَانَ لَهُ سُلْطَانُ سَمَاءِ الدُّنْيَا، وَكَانَ لَهُ سُلْطَانُ الأَرْضِ.\nحدثنا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا الْمُبَارَكُ بْنُ مُجَاهِدٍ أَبُو الأَزْهَرِ، عَنْ شَرِيكِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي نَمِرٍ، عَنْ صَالِحٍ مَوْلَى التَّوْءَمَةِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ مِنَ الْمَلائِكَةِ قَبِيلا يُقَالُ لَهُمُ الْجِنُّ، فَكَانَ إِبْلِيسُ مِنْهُمْ، وَكَانَ يَسُوسُ مَا بَيْنَ السَّمَاءِ وَالأَرْضِ فَعَصَى، فَمَسَخَهُ اللَّهُ شَيْطَانًا رجيما","bs":"\u003cp data-paragraph=\"82.1\">plemena. Bio je čuvar džennetskih vrtova i imao je vlast nad najbližim nebom i vlast nad Zemljom.’“\u003c/p>\u003cp data-paragraph=\"82.2\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Mubarek ibn Mudžahid, Ebu Ezher, od Šerika ibn Abdullaha ibn Ebu Nemira, od Saliha, oslobođenika Tev’eme, od Ibn Abbasa, koji je rekao: „Među melekima postoji pleme koje se naziva džinima, a Iblis je bio od njih. Upravljao je onim što je između neba i Zemlje, pa je bio nepokoran i Allah ga je pretvorio u prokletog šejtana.“\u003c/p>","paragraphs":[{"id":"82.1","ar":"قَبِيلَةً، وَكَانَ خَازِنًا عَلَى الْجِنَانِ، وَكَانَ لَهُ سُلْطَانُ سَمَاءِ الدُّنْيَا، وَكَانَ لَهُ سُلْطَانُ الأَرْضِ.","bs":"plemena. Bio je čuvar džennetskih vrtova i imao je vlast nad najbližim nebom i vlast nad Zemljom.’“","ar_ranges":[],"ar_html":"قَبِيلَةً، وَكَانَ خَازِنًا عَلَى الْجِنَانِ، وَكَانَ لَهُ سُلْطَانُ سَمَاءِ الدُّنْيَا، وَكَانَ لَهُ سُلْطَانُ الأَرْضِ.","bs_ranges":[],"bs_html":"plemena. Bio je čuvar džennetskih vrtova i imao je vlast nad najbližim nebom i vlast nad Zemljom.’“"},{"id":"82.2","ar":"حدثنا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا الْمُبَارَكُ بْنُ مُجَاهِدٍ أَبُو الأَزْهَرِ، عَنْ شَرِيكِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي نَمِرٍ، عَنْ صَالِحٍ مَوْلَى التَّوْءَمَةِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ مِنَ الْمَلائِكَةِ قَبِيلا يُقَالُ لَهُمُ الْجِنُّ، فَكَانَ إِبْلِيسُ مِنْهُمْ، وَكَانَ يَسُوسُ مَا بَيْنَ السَّمَاءِ وَالأَرْضِ فَعَصَى، فَمَسَخَهُ اللَّهُ شَيْطَانًا رجيما","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Mubarek ibn Mudžahid, Ebu Ezher, od Šerika ibn Abdullaha ibn Ebu Nemira, od Saliha, oslobođenika Tev’eme, od Ibn Abbasa, koji je rekao: „Među melekima postoji pleme koje se naziva džinima, a Iblis je bio od njih. Upravljao je onim što je između neba i Zemlje, pa je bio nepokoran i Allah ga je pretvorio u prokletog šejtana.“","ar_ranges":[[0,211]],"ar_html":"\u003cspan class=\"isnad\">حدثنا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا الْمُبَارَكُ بْنُ مُجَاهِدٍ أَبُو الأَزْهَرِ، عَنْ شَرِيكِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي نَمِرٍ، عَنْ صَالِحٍ مَوْلَى التَّوْءَمَةِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ مِنَ الْمَلائِكَةِ قَبِيلا يُقَالُ لَهُمُ الْجِنُّ، فَكَانَ إِبْلِيسُ مِنْهُمْ، وَكَانَ يَسُوسُ مَا بَيْنَ السَّمَاءِ وَالأَرْضِ فَعَصَى، فَمَسَخَهُ اللَّهُ شَيْطَانًا رجيما","bs_ranges":[[0,228]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Mubarek ibn Mudžahid, Ebu Ezher, od Šerika ibn Abdullaha ibn Ebu Nemira, od Saliha, oslobođenika Tev’eme, od Ibn Abbasa, koji je rekao: \u003c/span>„Među melekima postoji pleme koje se naziva džinima, a Iblis je bio od njih. Upravljao je onim što je između neba i Zemlje, pa je bio nepokoran i Allah ga je pretvorio u prokletog šejtana.“"}],"notes":[]},{"n":83,"ar":"ذكر الخبر عن غمط عدو الله نعمة ربه واستكباره عليه وادعائه الربوبية\n\nحَدَّثَنَا القاسم، قال: حدثنا الحسين، قال: حدثني حجاج، عن ابن جريج: «وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ» قال: قال، ابن جريج:\nمن يقل من الملائكة إني إله من دونه، فلم يقله إلا إبليس، دعا إلى عباده نفسه، فنزلت هذه الآية في إبليس.\n\nحَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ، قال: حدثنا سعيد، عن قتادة: «وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ فَذلِكَ نَجْزِيهِ جَهَنَّمَ كَذلِكَ نَجْزِي الظَّالِمِينَ» ، وإنما كانت هذه الآية خاصة لعدو الله إبليس لما قال ما قال، لعنه الله وجعله رجيما، فقال: «فَذلِكَ نَجْزِيهِ جَهَنَّمَ كَذلِكَ نَجْزِي الظَّالِمِينَ» .\nحَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا محمد بن ثور، عن معمر، عن قتادة: «وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ فَذلِكَ نَجْزِيهِ جَهَنَّمَ» ، قال: هي خاصة لإبليس","bs":"\u003cp data-paragraph=\"83.1\">Spomen predaje o tome kako je Allahov neprijatelj omalovažio blagodat svoga Gospodara, uzoholio se protiv Njega i prisvojio sebi gospodstvo\u003c/p>\u003cp data-paragraph=\"83.2\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, o riječima: „A ko od njih kaže: Ja sam bog mimo Njega.“ Rekao je: Ibn Džurejdž rekao je: „Ko od meleka kaže: ‘Ja sam bog mimo Njega.’ To nije rekao niko osim Iblisa. Pozvao je da obožavaju njega samoga, pa je ovaj ajet objavljen o Iblisu.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:29, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"83.3\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid, koji je rekao: pričao nam je Seid, od Katade, o riječima: „A ko od njih kaže: Ja sam bog mimo Njega — takvome ćemo Džehennemom uzvratiti. Tako uzvraćamo nepravednicima.“ „Ovaj se ajet posebno odnosio na Allahovog neprijatelja Iblisa. Kada je rekao ono što je rekao, Allah ga je prokleo i učinio prokletim, pa je rekao: ‘Takvome ćemo Džehennemom uzvratiti. Tako uzvraćamo nepravednicima.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Enbija, 21:29. Drugi navod ponavlja završni dio istog ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"83.4\">Pričao nam je Muhammed ibn Abdula‘la, koji je rekao: pričao nam je Muhammed ibn Sevr, od Ma‘mera, od Katade, o riječima: „A ko od njih kaže: Ja sam bog mimo Njega — takvome ćemo Džehennemom uzvratiti.“ Rekao je: „Ovo se posebno odnosi na Iblisa.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:29, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"83.1","ar":"ذكر الخبر عن غمط عدو الله نعمة ربه واستكباره عليه وادعائه الربوبية","bs":"Spomen predaje o tome kako je Allahov neprijatelj omalovažio blagodat svoga Gospodara, uzoholio se protiv Njega i prisvojio sebi gospodstvo","ar_ranges":[],"ar_html":"ذكر الخبر عن غمط عدو الله نعمة ربه واستكباره عليه وادعائه الربوبية","bs_ranges":[],"bs_html":"Spomen predaje o tome kako je Allahov neprijatelj omalovažio blagodat svoga Gospodara, uzoholio se protiv Njega i prisvojio sebi gospodstvo"},{"id":"83.2","ar":"حَدَّثَنَا القاسم، قال: حدثنا الحسين، قال: حدثني حجاج، عن ابن جريج: «وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ» قال: قال، ابن جريج:\nمن يقل من الملائكة إني إله من دونه، فلم يقله إلا إبليس، دعا إلى عباده نفسه، فنزلت هذه الآية في إبليس.","bs":"Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, o riječima: „A ko od njih kaže: Ja sam bog mimo Njega.“ Rekao je: Ibn Džurejdž rekao je: „Ko od meleka kaže: ‘Ja sam bog mimo Njega.’ To nije rekao niko osim Iblisa. Pozvao je da obožavaju njega samoga, pa je ovaj ajet objavljen o Iblisu.“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:29, navedeni dio.⟧","ar_ranges":[[0,68]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا القاسم، قال: حدثنا الحسين، قال: حدثني حجاج، عن ابن جريج: \u003c/span>«وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ» قال: قال، ابن جريج:\nمن يقل من الملائكة إني إله من دونه، فلم يقله إلا إبليس، دعا إلى عباده نفسه، فنزلت هذه الآية في إبليس.","bs_ranges":[[0,115]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, \u003c/span>o riječima: „A ko od njih kaže: Ja sam bog mimo Njega.“ Rekao je: Ibn Džurejdž rekao je: „Ko od meleka kaže: ‘Ja sam bog mimo Njega.’ To nije rekao niko osim Iblisa. Pozvao je da obožavaju njega samoga, pa je ovaj ajet objavljen o Iblisu.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:29, navedeni dio.⟧\u003c/span>"},{"id":"83.3","ar":"حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ، قال: حدثنا سعيد، عن قتادة: «وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ فَذلِكَ نَجْزِيهِ جَهَنَّمَ كَذلِكَ نَجْزِي الظَّالِمِينَ» ، وإنما كانت هذه الآية خاصة لعدو الله إبليس لما قال ما قال، لعنه الله وجعله رجيما، فقال: «فَذلِكَ نَجْزِيهِ جَهَنَّمَ كَذلِكَ نَجْزِي الظَّالِمِينَ» .","bs":"Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid, koji je rekao: pričao nam je Seid, od Katade, o riječima: „A ko od njih kaže: Ja sam bog mimo Njega — takvome ćemo Džehennemom uzvratiti. Tako uzvraćamo nepravednicima.“ „Ovaj se ajet posebno odnosio na Allahovog neprijatelja Iblisa. Kada je rekao ono što je rekao, Allah ga je prokleo i učinio prokletim, pa je rekao: ‘Takvome ćemo Džehennemom uzvratiti. Tako uzvraćamo nepravednicima.’“ ⟦Prijevodi kur’anskih navoda: El-Enbija, 21:29. Drugi navod ponavlja završni dio istog ajeta.⟧","ar_ranges":[[0,86]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ، قال: حدثنا سعيد، عن قتادة: \u003c/span>«وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ فَذلِكَ نَجْزِيهِ جَهَنَّمَ كَذلِكَ نَجْزِي الظَّالِمِينَ» ، وإنما كانت هذه الآية خاصة لعدو الله إبليس لما قال ما قال، لعنه الله وجعله رجيما، فقال: «فَذلِكَ نَجْزِيهِ جَهَنَّمَ كَذلِكَ نَجْزِي الظَّالِمِينَ» .","bs_ranges":[[0,111]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid, koji je rekao: pričao nam je Seid, od Katade, \u003c/span>o riječima: „A ko od njih kaže: Ja sam bog mimo Njega — takvome ćemo Džehennemom uzvratiti. Tako uzvraćamo nepravednicima.“ „Ovaj se ajet posebno odnosio na Allahovog neprijatelja Iblisa. Kada je rekao ono što je rekao, Allah ga je prokleo i učinio prokletim, pa je rekao: ‘Takvome ćemo Džehennemom uzvratiti. Tako uzvraćamo nepravednicima.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Enbija, 21:29. Drugi navod ponavlja završni dio istog ajeta.⟧\u003c/span>"},{"id":"83.4","ar":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا محمد بن ثور، عن معمر، عن قتادة: «وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ فَذلِكَ نَجْزِيهِ جَهَنَّمَ» ، قال: هي خاصة لإبليس","bs":"Pričao nam je Muhammed ibn Abdula‘la, koji je rekao: pričao nam je Muhammed ibn Sevr, od Ma‘mera, od Katade, o riječima: „A ko od njih kaže: Ja sam bog mimo Njega — takvome ćemo Džehennemom uzvratiti.“ Rekao je: „Ovo se posebno odnosi na Iblisa.“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:29, navedeni dio.⟧","ar_ranges":[[0,94]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا محمد بن ثور، عن معمر، عن قتادة: \u003c/span>«وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ فَذلِكَ نَجْزِيهِ جَهَنَّمَ» ، قال: هي خاصة لإبليس","bs_ranges":[[0,109]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Abdula‘la, koji je rekao: pričao nam je Muhammed ibn Sevr, od Ma‘mera, od Katade, \u003c/span>o riječima: „A ko od njih kaže: Ja sam bog mimo Njega — takvome ćemo Džehennemom uzvratiti.“ Rekao je: „Ovo se posebno odnosi na Iblisa.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:29, navedeni dio.⟧\u003c/span>"}],"notes":[]},{"n":84,"ar":"القول في الأحداث التي كانت في أيام ملك ابليس وسلطانه والسبب الذي به هلك وادعى الربوبية\nفمن الأحداث التي كانت في ملك عدو الله- إذ كان لله مطيعا- ما ذكر لنا عن ابْنِ عَبَّاسٍ في الخبر الذي حَدَّثَنَاهُ أَبُو كُرَيْبٍ، قَالَ:\nحَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: كَانَ إِبْلِيسُ مِنْ حَيٍّ مِنْ أَحْيَاءِ الْمَلائِكَةِ يُقَالُ لَهُمُ: الْجِنُّ خُلِقُوا مِنْ نَارِ السَّمُومِ مِنْ بَيْنَ الْمَلائِكَةِ، قَالَ: وَكَانَ اسْمُهُ الْحَارِثَ، قَالَ: وَكَانَ خَازِنًا مِنْ خُزَّانِ الْجَنَّةِ، قَالَ: وَخُلِقَتِ الْمَلائِكَةُ كُلُّهُمْ مِنْ نُورٍ غَيْرَ هَذَا الْحَيِّ، قَالَ: وَخُلِقَتِ الْجِنُّ الَّذِينَ ذُكِرُوا في القرآن من مارج من نار، وَهُوَ لِسَانُ النَّارِ الَّذِي يَكُونُ فِي طَرْفِهَا إِذَا أُلْهِبَتْ، قَالَ: وَخُلِقَ الإِنْسَانُ مِنْ طِينٍ، فَأَوَّلُ مَنْ سَكَنَ الأَرْضَ الْجِنُّ فَأَفْسَدُوا فِيهَا وَسَفَكُوا الدِّمَاءَ، وَقَتَلَ بَعْضُهُمْ بَعْضًا، قَالَ: فَبَعَثَ اللَّهُ إِلَيْهِمْ إِبْلِيسَ فِي جُنْدٍ مِنَ الْمَلائِكَةِ وهم هَذَا الْحَيُّ الَّذِينَ يُقَالُ لَهُمُ الْجِنُّ، فَقَتَلَهُمْ ابليس ومن معه حي أَلْحَقَهُمْ بِجَزَائِرِ الْبُحُورِ وَأَطْرَافِ الْجِبَالِ، فَلَمَّا فَعَلَ إِبْلِيسُ ذَلِكَ اغْتَرَّ فِي نَفْسِهِ، وَقَالَ: قَدْ صَنَعْتُ شَيْئًا لَمْ يَصْنَعْهُ أَحَدٌ، قَالَ: فَاطَّلَعَ الله على ذلك من قبله، وَلَمْ تَطَّلِعْ عَلَيْهِ الْمَلائِكَةُ الَّذِينَ كَانُوا مَعَهُ.\nحدثني المثنى، قال: حدثنا إسحاق بن الحجاج، قال: حدثنا عبد الله بن أبي جعفر عَنْ أَبِيهِ، عَنِ الرَّبِيعِ بْنِ أَنَسٍ، قَالَ: إِنَّ اللَّهَ خَلَقَ الْمَلائِكَةَ يَوْمَ الأَرْبِعَاءِ، وَخَلَقَ الْجِنَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ يَوْمَ الْجُمُعَةِ، قَالَ:\n\nفَكَفَرَ قَوْمٌ مِنَ الْجِنِّ، فَكَانَتِ الْمَلائِكَةُ تهبط اليهم في الارض فتقتلهم فَكَانَتِ الدِّمَاءُ وَكَانَ الْفَسَادُ فِي الأَرْضِ","bs":"\u003cp data-paragraph=\"84.1\">Rasprava o događajima iz vremena Iblisove vlasti i vladavine te o razlogu njegove propasti i prisvajanja gospodstva\u003c/p>\u003cp data-paragraph=\"84.2\">Među događajima iz vremena vlasti Allahovog neprijatelja — dok je još bio pokoran Allahu — jeste ono što nam je navedeno od Ibn Abbasa u predaji koju nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Iblis je bio iz jedne od skupina meleka koje se nazivaju džinima. Među melekima su oni bili stvoreni od vatre žarkoga vjetra.“ Rekao je: „Ime mu je bilo Haris.“ Rekao je: „Bio je jedan od čuvara Dženneta.“ Rekao je: „Svi meleki, osim te skupine, stvoreni su od svjetlosti.“ Rekao je: „Džini spomenuti u Kur’anu stvoreni su od plamena vatre, a to je vatreni jezik na njenom vrhu kada se razgori.“ Rekao je: „Čovjek je stvoren od gline. Prvi koji su nastanili Zemlju bili su džini, pa su na njoj činili nered, prolijevali krv i ubijali jedni druge.“ Rekao je: „Allah im je poslao Iblisa s vojskom meleka, a to je ta skupina koja se naziva džinima. Iblis i oni koji su bili s njim ubijali su ih sve dok ih nisu potisnuli na morske otoke i rubove planina. Kada je Iblis to učinio, zanio se sobom i rekao: ‘Učinio sam nešto što niko drugi nije učinio.’“ Rekao je: „Allah je znao za to kod njega, a meleki koji su bili s njim nisu to znali.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor ima nejasan spoj حي ألحقهم. „Sve dok ih nisu potisnuli“ prenosi kontekstualno čitanje, vjerovatno حتى ألحقهم; potrebno je provjeriti štampano izdanje.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"84.3\">Pričao mi je Musenna, koji je rekao: pričao nam je Ishak ibn el-Hadždžadž, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, koji je rekao: „Allah je stvorio meleke u srijedu, džine u četvrtak, a Adema u petak.“ Rekao je: „Jedna skupina džina postala je nevjernička, pa su im meleki silazili na Zemlju i ubijali ih. Tako je na Zemlji bilo krvi i nereda.“\u003c/p>","paragraphs":[{"id":"84.1","ar":"القول في الأحداث التي كانت في أيام ملك ابليس وسلطانه والسبب الذي به هلك وادعى الربوبية","bs":"Rasprava o događajima iz vremena Iblisove vlasti i vladavine te o razlogu njegove propasti i prisvajanja gospodstva","ar_ranges":[],"ar_html":"القول في الأحداث التي كانت في أيام ملك ابليس وسلطانه والسبب الذي به هلك وادعى الربوبية","bs_ranges":[],"bs_html":"Rasprava o događajima iz vremena Iblisove vlasti i vladavine te o razlogu njegove propasti i prisvajanja gospodstva"},{"id":"84.2","ar":"فمن الأحداث التي كانت في ملك عدو الله- إذ كان لله مطيعا- ما ذكر لنا عن ابْنِ عَبَّاسٍ في الخبر الذي حَدَّثَنَاهُ أَبُو كُرَيْبٍ، قَالَ:\nحَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: كَانَ إِبْلِيسُ مِنْ حَيٍّ مِنْ أَحْيَاءِ الْمَلائِكَةِ يُقَالُ لَهُمُ: الْجِنُّ خُلِقُوا مِنْ نَارِ السَّمُومِ مِنْ بَيْنَ الْمَلائِكَةِ، قَالَ: وَكَانَ اسْمُهُ الْحَارِثَ، قَالَ: وَكَانَ خَازِنًا مِنْ خُزَّانِ الْجَنَّةِ، قَالَ: وَخُلِقَتِ الْمَلائِكَةُ كُلُّهُمْ مِنْ نُورٍ غَيْرَ هَذَا الْحَيِّ، قَالَ: وَخُلِقَتِ الْجِنُّ الَّذِينَ ذُكِرُوا في القرآن من مارج من نار، وَهُوَ لِسَانُ النَّارِ الَّذِي يَكُونُ فِي طَرْفِهَا إِذَا أُلْهِبَتْ، قَالَ: وَخُلِقَ الإِنْسَانُ مِنْ طِينٍ، فَأَوَّلُ مَنْ سَكَنَ الأَرْضَ الْجِنُّ فَأَفْسَدُوا فِيهَا وَسَفَكُوا الدِّمَاءَ، وَقَتَلَ بَعْضُهُمْ بَعْضًا، قَالَ: فَبَعَثَ اللَّهُ إِلَيْهِمْ إِبْلِيسَ فِي جُنْدٍ مِنَ الْمَلائِكَةِ وهم هَذَا الْحَيُّ الَّذِينَ يُقَالُ لَهُمُ الْجِنُّ، فَقَتَلَهُمْ ابليس ومن معه حي أَلْحَقَهُمْ بِجَزَائِرِ الْبُحُورِ وَأَطْرَافِ الْجِبَالِ، فَلَمَّا فَعَلَ إِبْلِيسُ ذَلِكَ اغْتَرَّ فِي نَفْسِهِ، وَقَالَ: قَدْ صَنَعْتُ شَيْئًا لَمْ يَصْنَعْهُ أَحَدٌ، قَالَ: فَاطَّلَعَ الله على ذلك من قبله، وَلَمْ تَطَّلِعْ عَلَيْهِ الْمَلائِكَةُ الَّذِينَ كَانُوا مَعَهُ.","bs":"Među događajima iz vremena vlasti Allahovog neprijatelja — dok je još bio pokoran Allahu — jeste ono što nam je navedeno od Ibn Abbasa u predaji koju nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Iblis je bio iz jedne od skupina meleka koje se nazivaju džinima. Među melekima su oni bili stvoreni od vatre žarkoga vjetra.“ Rekao je: „Ime mu je bilo Haris.“ Rekao je: „Bio je jedan od čuvara Dženneta.“ Rekao je: „Svi meleki, osim te skupine, stvoreni su od svjetlosti.“ Rekao je: „Džini spomenuti u Kur’anu stvoreni su od plamena vatre, a to je vatreni jezik na njenom vrhu kada se razgori.“ Rekao je: „Čovjek je stvoren od gline. Prvi koji su nastanili Zemlju bili su džini, pa su na njoj činili nered, prolijevali krv i ubijali jedni druge.“ Rekao je: „Allah im je poslao Iblisa s vojskom meleka, a to je ta skupina koja se naziva džinima. Iblis i oni koji su bili s njim ubijali su ih sve dok ih nisu potisnuli na morske otoke i rubove planina. Kada je Iblis to učinio, zanio se sobom i rekao: ‘Učinio sam nešto što niko drugi nije učinio.’“ Rekao je: „Allah je znao za to kod njega, a meleki koji su bili s njim nisu to znali.“ ⟦Napomena prevodioca: izvor ima nejasan spoj حي ألحقهم. „Sve dok ih nisu potisnuli“ prenosi kontekstualno čitanje, vjerovatno حتى ألحقهم; potrebno je provjeriti štampano izdanje.⟧","ar_ranges":[[136,277]],"ar_html":"فمن الأحداث التي كانت في ملك عدو الله- إذ كان لله مطيعا- ما ذكر لنا عن ابْنِ عَبَّاسٍ في الخبر الذي حَدَّثَنَاهُ أَبُو كُرَيْبٍ، قَالَ:\n\u003cspan class=\"isnad\">حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>كَانَ إِبْلِيسُ مِنْ حَيٍّ مِنْ أَحْيَاءِ الْمَلائِكَةِ يُقَالُ لَهُمُ: الْجِنُّ خُلِقُوا مِنْ نَارِ السَّمُومِ مِنْ بَيْنَ الْمَلائِكَةِ، قَالَ: وَكَانَ اسْمُهُ الْحَارِثَ، قَالَ: وَكَانَ خَازِنًا مِنْ خُزَّانِ الْجَنَّةِ، قَالَ: وَخُلِقَتِ الْمَلائِكَةُ كُلُّهُمْ مِنْ نُورٍ غَيْرَ هَذَا الْحَيِّ، قَالَ: وَخُلِقَتِ الْجِنُّ الَّذِينَ ذُكِرُوا في القرآن من مارج من نار، وَهُوَ لِسَانُ النَّارِ الَّذِي يَكُونُ فِي طَرْفِهَا إِذَا أُلْهِبَتْ، قَالَ: وَخُلِقَ الإِنْسَانُ مِنْ طِينٍ، فَأَوَّلُ مَنْ سَكَنَ الأَرْضَ الْجِنُّ فَأَفْسَدُوا فِيهَا وَسَفَكُوا الدِّمَاءَ، وَقَتَلَ بَعْضُهُمْ بَعْضًا، قَالَ: فَبَعَثَ اللَّهُ إِلَيْهِمْ إِبْلِيسَ فِي جُنْدٍ مِنَ الْمَلائِكَةِ وهم هَذَا الْحَيُّ الَّذِينَ يُقَالُ لَهُمُ الْجِنُّ، فَقَتَلَهُمْ ابليس ومن معه حي أَلْحَقَهُمْ بِجَزَائِرِ الْبُحُورِ وَأَطْرَافِ الْجِبَالِ، فَلَمَّا فَعَلَ إِبْلِيسُ ذَلِكَ اغْتَرَّ فِي نَفْسِهِ، وَقَالَ: قَدْ صَنَعْتُ شَيْئًا لَمْ يَصْنَعْهُ أَحَدٌ، قَالَ: فَاطَّلَعَ الله على ذلك من قبله، وَلَمْ تَطَّلِعْ عَلَيْهِ الْمَلائِكَةُ الَّذِينَ كَانُوا مَعَهُ.","bs_ranges":[[150,322]],"bs_html":"Među događajima iz vremena vlasti Allahovog neprijatelja — dok je još bio pokoran Allahu — jeste ono što nam je navedeno od Ibn Abbasa u predaji koju \u003cspan class=\"isnad\">nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: \u003c/span>„Iblis je bio iz jedne od skupina meleka koje se nazivaju džinima. Među melekima su oni bili stvoreni od vatre žarkoga vjetra.“ Rekao je: „Ime mu je bilo Haris.“ Rekao je: „Bio je jedan od čuvara Dženneta.“ Rekao je: „Svi meleki, osim te skupine, stvoreni su od svjetlosti.“ Rekao je: „Džini spomenuti u Kur’anu stvoreni su od plamena vatre, a to je vatreni jezik na njenom vrhu kada se razgori.“ Rekao je: „Čovjek je stvoren od gline. Prvi koji su nastanili Zemlju bili su džini, pa su na njoj činili nered, prolijevali krv i ubijali jedni druge.“ Rekao je: „Allah im je poslao Iblisa s vojskom meleka, a to je ta skupina koja se naziva džinima. Iblis i oni koji su bili s njim ubijali su ih sve dok ih nisu potisnuli na morske otoke i rubove planina. Kada je Iblis to učinio, zanio se sobom i rekao: ‘Učinio sam nešto što niko drugi nije učinio.’“ Rekao je: „Allah je znao za to kod njega, a meleki koji su bili s njim nisu to znali.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor ima nejasan spoj حي ألحقهم. „Sve dok ih nisu potisnuli“ prenosi kontekstualno čitanje, vjerovatno حتى ألحقهم; potrebno je provjeriti štampano izdanje.⟧\u003c/span>"},{"id":"84.3","ar":"حدثني المثنى، قال: حدثنا إسحاق بن الحجاج، قال: حدثنا عبد الله بن أبي جعفر عَنْ أَبِيهِ، عَنِ الرَّبِيعِ بْنِ أَنَسٍ، قَالَ: إِنَّ اللَّهَ خَلَقَ الْمَلائِكَةَ يَوْمَ الأَرْبِعَاءِ، وَخَلَقَ الْجِنَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ يَوْمَ الْجُمُعَةِ، قَالَ:\n\nفَكَفَرَ قَوْمٌ مِنَ الْجِنِّ، فَكَانَتِ الْمَلائِكَةُ تهبط اليهم في الارض فتقتلهم فَكَانَتِ الدِّمَاءُ وَكَانَ الْفَسَادُ فِي الأَرْضِ","bs":"Pričao mi je Musenna, koji je rekao: pričao nam je Ishak ibn el-Hadždžadž, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, koji je rekao: „Allah je stvorio meleke u srijedu, džine u četvrtak, a Adema u petak.“ Rekao je: „Jedna skupina džina postala je nevjernička, pa su im meleki silazili na Zemlju i ubijali ih. Tako je na Zemlji bilo krvi i nereda.“","ar_ranges":[[0,124]],"ar_html":"\u003cspan class=\"isnad\">حدثني المثنى، قال: حدثنا إسحاق بن الحجاج، قال: حدثنا عبد الله بن أبي جعفر عَنْ أَبِيهِ، عَنِ الرَّبِيعِ بْنِ أَنَسٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ خَلَقَ الْمَلائِكَةَ يَوْمَ الأَرْبِعَاءِ، وَخَلَقَ الْجِنَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ يَوْمَ الْجُمُعَةِ، قَالَ:\n\nفَكَفَرَ قَوْمٌ مِنَ الْجِنِّ، فَكَانَتِ الْمَلائِكَةُ تهبط اليهم في الارض فتقتلهم فَكَانَتِ الدِّمَاءُ وَكَانَ الْفَسَادُ فِي الأَرْضِ","bs_ranges":[[0,178]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musenna, koji je rekao: pričao nam je Ishak ibn el-Hadždžadž, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, koji je rekao: \u003c/span>„Allah je stvorio meleke u srijedu, džine u četvrtak, a Adema u petak.“ Rekao je: „Jedna skupina džina postala je nevjernička, pa su im meleki silazili na Zemlju i ubijali ih. Tako je na Zemlji bilo krvi i nereda.“"}],"notes":[]},{"n":85,"ar":"ذكر السبب الذي به هلك عدو الله وسولت له نفسه من أجله الاستكبار على ربه عز وجل\nاختلف السلف من الصحابة والتابعين في ذلك، وقد ذكرنا أحد الأقوال التي رويت في ذلك عن ابْنِ عَبَّاسٍ، وذلك ما ذكر الضحاك عنه، أنه لما قتل الجن الذين عصوا الله، وأفسدوا في الأرض وشردهم، أعجبته نفسه ورأى في نفسه أن له بذلك من الفضيلة ما ليس لغيره.\n\nوالقول الثاني من الأقوال المروية في ذلك عن ابْنِ عَبَّاسٍ، أنه كان ملك سماء الدنيا وسائسها، وسائس ما بينها وبين الأرض، وخازن الجنة، مع اجتهاده في العبادة، فأعجب بنفسه، ورأى أن له بذلك الفضل، فاستكبر على ربه عز وجل.\n\nذكر الرواية عنه بذلك:\nحَدَّثَنَا مُوسَى بْنُ هَارُونَ الْهَمْدَانِيُّ، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب النبي ص، قال: لَمَّا فَرَغَ اللَّهُ عَزَّ وَجَلَّ مِنْ خَلْقِ مَا أَحَبَّ اسْتَوَى عَلَى الْعَرْشِ، فَجَعَلَ إِبْلِيسَ عَلَى مُلْكِ سَمَاءِ الدُّنْيَا وَكَانَ مِنْ قَبِيلَةٍ مِنَ الْمَلائِكَةِ يُقَالُ لَهُمُ الْجِنُّ، وَإِنَّمَا سُمُّوا الْجِنَّ لأَنَّهُمْ خُزَّانُ الْجَنَّةِ، وَكَانَ إِبْلِيسُ مَعَ مُلْكِهِ خَازِنًا، فَوَقَعَ فِي صَدْرِهِ كِبْرٌ، وَقَالَ: مَا أَعْطَانِي اللَّهُ هَذَا إِلا لِمَزِيَّةٍ، هَكَذَا حَدَّثَنِي مُوسَى بْنُ هَارُونَ","bs":"\u003cp data-paragraph=\"85.1\">Spomen razloga zbog kojeg je Allahov neprijatelj propao i zbog kojeg ga je njegova duša navela da se uzoholi protiv svoga Gospodara, Silnog i Uzvišenog\u003c/p>\u003cp data-paragraph=\"85.2\">Prethodnici među ashabima i tabi‘inima razišli su se o tome. Već smo spomenuli jedno od mišljenja prenesenih od Ibn Abbasa: ono što je Dahhak naveo od njega, da se Iblis, kada je ubijao džine koji su bili nepokorni Allahu i činili nered na Zemlji te ih rastjerao, zadivio sam sobom i smatrao da time ima odliku koju drugi nemaju.\u003c/p>\u003cp data-paragraph=\"85.3\">Drugo mišljenje preneseno od Ibn Abbasa jeste da je Iblis bio vladar i upravitelj najbližeg neba, upravitelj onoga što je između njega i Zemlje i čuvar Dženneta, uz svoju revnost u ibadetu. Zato se zadivio sam sobom, smatrao da mu time pripada prednost i uzoholio se protiv svoga Gospodara, Silnog i Uzvišenog.\u003c/p>\u003cp data-paragraph=\"85.4\">Spomen predaje od njega o tome:\u003c/p>\u003cp data-paragraph=\"85.5\">Pričao nam je Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao: „Kada je Allah, Silan i Uzvišen, dovršio stvaranje onoga što je htio, uzvisio se nad Aršom. Iblisu je dao vlast nad najbližim nebom. Bio je iz plemena meleka koje se naziva džinima, a nazvani su džinima zato što su čuvari Dženneta. Iblis je, uz svoju vlast, bio i čuvar. U njegovim se prsima pojavila oholost, pa je rekao: ‘Allah mi ovo nije dao ni zbog čega drugog osim zbog moje posebne odlike.’“ Tako mi je pričao Musa ibn Harun.\u003c/p>","paragraphs":[{"id":"85.1","ar":"ذكر السبب الذي به هلك عدو الله وسولت له نفسه من أجله الاستكبار على ربه عز وجل","bs":"Spomen razloga zbog kojeg je Allahov neprijatelj propao i zbog kojeg ga je njegova duša navela da se uzoholi protiv svoga Gospodara, Silnog i Uzvišenog","ar_ranges":[],"ar_html":"ذكر السبب الذي به هلك عدو الله وسولت له نفسه من أجله الاستكبار على ربه عز وجل","bs_ranges":[],"bs_html":"Spomen razloga zbog kojeg je Allahov neprijatelj propao i zbog kojeg ga je njegova duša navela da se uzoholi protiv svoga Gospodara, Silnog i Uzvišenog"},{"id":"85.2","ar":"اختلف السلف من الصحابة والتابعين في ذلك، وقد ذكرنا أحد الأقوال التي رويت في ذلك عن ابْنِ عَبَّاسٍ، وذلك ما ذكر الضحاك عنه، أنه لما قتل الجن الذين عصوا الله، وأفسدوا في الأرض وشردهم، أعجبته نفسه ورأى في نفسه أن له بذلك من الفضيلة ما ليس لغيره.","bs":"Prethodnici među ashabima i tabi‘inima razišli su se o tome. Već smo spomenuli jedno od mišljenja prenesenih od Ibn Abbasa: ono što je Dahhak naveo od njega, da se Iblis, kada je ubijao džine koji su bili nepokorni Allahu i činili nered na Zemlji te ih rastjerao, zadivio sam sobom i smatrao da time ima odliku koju drugi nemaju.","ar_ranges":[],"ar_html":"اختلف السلف من الصحابة والتابعين في ذلك، وقد ذكرنا أحد الأقوال التي رويت في ذلك عن ابْنِ عَبَّاسٍ، وذلك ما ذكر الضحاك عنه، أنه لما قتل الجن الذين عصوا الله، وأفسدوا في الأرض وشردهم، أعجبته نفسه ورأى في نفسه أن له بذلك من الفضيلة ما ليس لغيره.","bs_ranges":[],"bs_html":"Prethodnici među ashabima i tabi‘inima razišli su se o tome. Već smo spomenuli jedno od mišljenja prenesenih od Ibn Abbasa: ono što je Dahhak naveo od njega, da se Iblis, kada je ubijao džine koji su bili nepokorni Allahu i činili nered na Zemlji te ih rastjerao, zadivio sam sobom i smatrao da time ima odliku koju drugi nemaju."},{"id":"85.3","ar":"والقول الثاني من الأقوال المروية في ذلك عن ابْنِ عَبَّاسٍ، أنه كان ملك سماء الدنيا وسائسها، وسائس ما بينها وبين الأرض، وخازن الجنة، مع اجتهاده في العبادة، فأعجب بنفسه، ورأى أن له بذلك الفضل، فاستكبر على ربه عز وجل.","bs":"Drugo mišljenje preneseno od Ibn Abbasa jeste da je Iblis bio vladar i upravitelj najbližeg neba, upravitelj onoga što je između njega i Zemlje i čuvar Dženneta, uz svoju revnost u ibadetu. Zato se zadivio sam sobom, smatrao da mu time pripada prednost i uzoholio se protiv svoga Gospodara, Silnog i Uzvišenog.","ar_ranges":[],"ar_html":"والقول الثاني من الأقوال المروية في ذلك عن ابْنِ عَبَّاسٍ، أنه كان ملك سماء الدنيا وسائسها، وسائس ما بينها وبين الأرض، وخازن الجنة، مع اجتهاده في العبادة، فأعجب بنفسه، ورأى أن له بذلك الفضل، فاستكبر على ربه عز وجل.","bs_ranges":[],"bs_html":"Drugo mišljenje preneseno od Ibn Abbasa jeste da je Iblis bio vladar i upravitelj najbližeg neba, upravitelj onoga što je između njega i Zemlje i čuvar Dženneta, uz svoju revnost u ibadetu. Zato se zadivio sam sobom, smatrao da mu time pripada prednost i uzoholio se protiv svoga Gospodara, Silnog i Uzvišenog."},{"id":"85.4","ar":"ذكر الرواية عنه بذلك:","bs":"Spomen predaje od njega o tome:","ar_ranges":[],"ar_html":"ذكر الرواية عنه بذلك:","bs_ranges":[],"bs_html":"Spomen predaje od njega o tome:"},{"id":"85.5","ar":"حَدَّثَنَا مُوسَى بْنُ هَارُونَ الْهَمْدَانِيُّ، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب النبي ص، قال: لَمَّا فَرَغَ اللَّهُ عَزَّ وَجَلَّ مِنْ خَلْقِ مَا أَحَبَّ اسْتَوَى عَلَى الْعَرْشِ، فَجَعَلَ إِبْلِيسَ عَلَى مُلْكِ سَمَاءِ الدُّنْيَا وَكَانَ مِنْ قَبِيلَةٍ مِنَ الْمَلائِكَةِ يُقَالُ لَهُمُ الْجِنُّ، وَإِنَّمَا سُمُّوا الْجِنَّ لأَنَّهُمْ خُزَّانُ الْجَنَّةِ، وَكَانَ إِبْلِيسُ مَعَ مُلْكِهِ خَازِنًا، فَوَقَعَ فِي صَدْرِهِ كِبْرٌ، وَقَالَ: مَا أَعْطَانِي اللَّهُ هَذَا إِلا لِمَزِيَّةٍ، هَكَذَا حَدَّثَنِي مُوسَى بْنُ هَارُونَ","bs":"Pričao nam je Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao: „Kada je Allah, Silan i Uzvišen, dovršio stvaranje onoga što je htio, uzvisio se nad Aršom. Iblisu je dao vlast nad najbližim nebom. Bio je iz plemena meleka koje se naziva džinima, a nazvani su džinima zato što su čuvari Dženneta. Iblis je, uz svoju vlast, bio i čuvar. U njegovim se prsima pojavila oholost, pa je rekao: ‘Allah mi ovo nije dao ni zbog čega drugog osim zbog moje posebne odlike.’“ Tako mi je pričao Musa ibn Harun.","ar_ranges":[[0,215],[615,646]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُوسَى بْنُ هَارُونَ الْهَمْدَانِيُّ، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب النبي ص، قال: \u003c/span>لَمَّا فَرَغَ اللَّهُ عَزَّ وَجَلَّ مِنْ خَلْقِ مَا أَحَبَّ اسْتَوَى عَلَى الْعَرْشِ، فَجَعَلَ إِبْلِيسَ عَلَى مُلْكِ سَمَاءِ الدُّنْيَا وَكَانَ مِنْ قَبِيلَةٍ مِنَ الْمَلائِكَةِ يُقَالُ لَهُمُ الْجِنُّ، وَإِنَّمَا سُمُّوا الْجِنَّ لأَنَّهُمْ خُزَّانُ الْجَنَّةِ، وَكَانَ إِبْلِيسُ مَعَ مُلْكِهِ خَازِنًا، فَوَقَعَ فِي صَدْرِهِ كِبْرٌ، وَقَالَ: مَا أَعْطَانِي اللَّهُ هَذَا إِلا لِمَزِيَّةٍ، هَكَذَا \u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بْنُ هَارُونَ\u003c/span>","bs_ranges":[[0,324],[728,755]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao: \u003c/span>„Kada je Allah, Silan i Uzvišen, dovršio stvaranje onoga što je htio, uzvisio se nad Aršom. Iblisu je dao vlast nad najbližim nebom. Bio je iz plemena meleka koje se naziva džinima, a nazvani su džinima zato što su čuvari Dženneta. Iblis je, uz svoju vlast, bio i čuvar. U njegovim se prsima pojavila oholost, pa je rekao: ‘Allah mi ovo nije dao ni zbog čega drugog osim zbog moje posebne odlike.’“ Tako \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun\u003c/span>."}],"notes":[]},{"n":86,"ar":"وحدثني بِهِ أَحْمَدُ بْنُ أَبِي خَيْثَمَةَ، عَنْ عَمْرِو بْنِ حَمَّادٍ، قَالَ:\nلِمَزِيَّةٍ لِي عَلَى الْمَلائِكَةِ فَلَمَّا وَقَعَ ذَلِكَ الْكِبْرُ فِي نَفْسِهِ اطَّلَعَ اللَّهُ عَزَّ وَجَلَّ عَلَى ذَلِكَ مِنْهُ، فَقَالَ اللَّهُ لِلْمَلائِكَةِ: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» .\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ بْنُ الْفَضْلِ، عَنِ ابْنِ إِسْحَاقَ، عَنْ خَلادِ بْنِ عَطَاءٍ، عَنْ طَاوُسٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: كَانَ إِبْلِيسُ قَبْلَ أَنْ يَرْكَبَ الْمَعْصِيَةَ مِنَ الْمَلائِكَةِ اسْمُهُ عَزَازِيلُ، وَكَانَ مِنْ سُكَّانِ الأَرْضِ، وَكَانَ مِنْ أَشَدِّ الْمَلائِكَةِ اجْتِهَادًا، وَأَكْثَرِهِمْ عِلْمًا، فَذَلِكَ الَّذِي دَعَاهُ إِلَى الْكِبْرِ، وَكَانَ مِنْ حَيٍّ يُسَمُّونَ جِنًّا.\nوَحَدَّثَنَا بِهِ ابْنُ حُمَيْدٍ مَرَّةً أُخْرَى، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنِ ابْنِ إِسْحَاقَ، عَنْ خَلادِ بْنِ عَطَاءٍ، عَنْ طَاوُسٍ- أَوْ مُجَاهِدٍ أَبِي الْحَجَّاجِ- عَنِ ابْنِ عَبَّاسٍ وَغَيْرِهِ بِنَحْوِهِ، إِلا أَنَّهُ قَالَ: كَانَ مَلَكًا مِنَ الْمَلائِكَةِ اسْمُهُ عَزَازِيلُ، وَكَانَ مِنْ سُكَّانِ الأَرْضِ وَعُمَّارِهَا، وَكَانَ سُكَّانُ الأَرْضِ فِيهِمْ يُسَمُّونَ الْجِنَّ مِنْ بَيْنِ الْمَلائِكَةِ.\nحَدَّثَنَا ابْنُ الْمُثَنَّى، قال: حدثنا شيبان، قال: حدثنا سلام ابن مِسْكِينٍ، عَنْ قَتَادَةَ، عَنْ سَعِيدِ بْنِ الْمُسَيِّبِ، قَالَ: كَانَ إِبْلِيسُ رَئِيسَ مَلائِكَةِ سَمَاءِ الدُّنْيَا.\n\nوالقول الثالث من الأقوال المروية عنه أنه كان يقول: السبب في ذلك أنه كان من بقايا خلق خلقهم الله عز وجل، فأمرهم بأمر فأبوا طاعته.\n\nذكر الرواية عنه بذلك:","bs":"\u003cp data-paragraph=\"86.1\">O tome mi je pričao i Ahmed ibn Ebu Hajsema, od Amra ibn Hammada. Rekao je: „Zbog moje posebne odlike nad melekima. Kada se ta oholost pojavila u njegovoj duši, Allah, Silan i Uzvišen, znao je za to kod njega. Allah je rekao melekima: ‘Ja ću na Zemlji postaviti namjesnika.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:30, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"86.2\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema ibn el-Fadl, od Ibn Ishaka, od Hallada ibn Ataa, od Tavusa, od Ibn Abbasa, koji je rekao: „Prije nego što je počinio grijeh, Iblis je bio od meleka i ime mu je bilo Azazil. Bio je jedan od stanovnika Zemlje, jedan od najrevnijih meleka i među onima s najviše znanja. To ga je navelo na oholost. Bio je iz skupine koja se naziva džinima.“\u003c/p>\u003cp data-paragraph=\"86.3\">Ibn Humejd pričao nam je to i drugi put, rekavši: pričao nam je Selema, od Ibn Ishaka, od Hallada ibn Ataa, od Tavusa — ili Mudžahida Ebu Hadždžadža — od Ibn Abbasa i drugih, nešto slično tome, osim što je rekao: „Bio je jedan od meleka, po imenu Azazil. Bio je jedan od stanovnika i nastanjivača Zemlje, a oni među melekima koji su nastanjivali Zemlju nazivali su se džinima.“\u003c/p>\u003cp data-paragraph=\"86.4\">Pričao nam je Ibn el-Musenna, koji je rekao: pričao nam je Šejban, koji je rekao: pričao nam je Sellam ibn Miskin, od Katade, od Seida ibn el-Musejjeba, koji je rekao: „Iblis je bio poglavar meleka najbližeg neba.“\u003c/p>\u003cp data-paragraph=\"86.5\">Treće mišljenje preneseno od njega jeste da je govorio: „Razlog tome bio je što je Iblis bio jedan od preostalih pripadnika stvorenja koja je Allah, Silan i Uzvišen, stvorio, pa im je nešto naredio, a oni su odbili poslušati Ga.“\u003c/p>\u003cp data-paragraph=\"86.6\">Spomen predaje od njega o tome:\u003c/p>","paragraphs":[{"id":"86.1","ar":"وحدثني بِهِ أَحْمَدُ بْنُ أَبِي خَيْثَمَةَ، عَنْ عَمْرِو بْنِ حَمَّادٍ، قَالَ:\nلِمَزِيَّةٍ لِي عَلَى الْمَلائِكَةِ فَلَمَّا وَقَعَ ذَلِكَ الْكِبْرُ فِي نَفْسِهِ اطَّلَعَ اللَّهُ عَزَّ وَجَلَّ عَلَى ذَلِكَ مِنْهُ، فَقَالَ اللَّهُ لِلْمَلائِكَةِ: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» .","bs":"O tome mi je pričao i Ahmed ibn Ebu Hajsema, od Amra ibn Hammada. Rekao je: „Zbog moje posebne odlike nad melekima. Kada se ta oholost pojavila u njegovoj duši, Allah, Silan i Uzvišen, znao je za to kod njega. Allah je rekao melekima: ‘Ja ću na Zemlji postaviti namjesnika.’“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:30, navedeni dio.⟧","ar_ranges":[[0,79]],"ar_html":"\u003cspan class=\"isnad\">وحدثني بِهِ أَحْمَدُ بْنُ أَبِي خَيْثَمَةَ، عَنْ عَمْرِو بْنِ حَمَّادٍ، قَالَ:\n\u003c/span>لِمَزِيَّةٍ لِي عَلَى الْمَلائِكَةِ فَلَمَّا وَقَعَ ذَلِكَ الْكِبْرُ فِي نَفْسِهِ اطَّلَعَ اللَّهُ عَزَّ وَجَلَّ عَلَى ذَلِكَ مِنْهُ، فَقَالَ اللَّهُ لِلْمَلائِكَةِ: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» .","bs_ranges":[[7,76]],"bs_html":"O tome \u003cspan class=\"isnad\">mi je pričao i Ahmed ibn Ebu Hajsema, od Amra ibn Hammada. Rekao je: \u003c/span>„Zbog moje posebne odlike nad melekima. Kada se ta oholost pojavila u njegovoj duši, Allah, Silan i Uzvišen, znao je za to kod njega. Allah je rekao melekima: ‘Ja ću na Zemlji postaviti namjesnika.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:30, navedeni dio.⟧\u003c/span>"},{"id":"86.2","ar":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ بْنُ الْفَضْلِ، عَنِ ابْنِ إِسْحَاقَ، عَنْ خَلادِ بْنِ عَطَاءٍ، عَنْ طَاوُسٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: كَانَ إِبْلِيسُ قَبْلَ أَنْ يَرْكَبَ الْمَعْصِيَةَ مِنَ الْمَلائِكَةِ اسْمُهُ عَزَازِيلُ، وَكَانَ مِنْ سُكَّانِ الأَرْضِ، وَكَانَ مِنْ أَشَدِّ الْمَلائِكَةِ اجْتِهَادًا، وَأَكْثَرِهِمْ عِلْمًا، فَذَلِكَ الَّذِي دَعَاهُ إِلَى الْكِبْرِ، وَكَانَ مِنْ حَيٍّ يُسَمُّونَ جِنًّا.","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema ibn el-Fadl, od Ibn Ishaka, od Hallada ibn Ataa, od Tavusa, od Ibn Abbasa, koji je rekao: „Prije nego što je počinio grijeh, Iblis je bio od meleka i ime mu je bilo Azazil. Bio je jedan od stanovnika Zemlje, jedan od najrevnijih meleka i među onima s najviše znanja. To ga je navelo na oholost. Bio je iz skupine koja se naziva džinima.“","ar_ranges":[[0,160]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ بْنُ الْفَضْلِ، عَنِ ابْنِ إِسْحَاقَ، عَنْ خَلادِ بْنِ عَطَاءٍ، عَنْ طَاوُسٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>كَانَ إِبْلِيسُ قَبْلَ أَنْ يَرْكَبَ الْمَعْصِيَةَ مِنَ الْمَلائِكَةِ اسْمُهُ عَزَازِيلُ، وَكَانَ مِنْ سُكَّانِ الأَرْضِ، وَكَانَ مِنْ أَشَدِّ الْمَلائِكَةِ اجْتِهَادًا، وَأَكْثَرِهِمْ عِلْمًا، فَذَلِكَ الَّذِي دَعَاهُ إِلَى الْكِبْرِ، وَكَانَ مِنْ حَيٍّ يُسَمُّونَ جِنًّا.","bs_ranges":[[0,152]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema ibn el-Fadl, od Ibn Ishaka, od Hallada ibn Ataa, od Tavusa, od Ibn Abbasa, koji je rekao: \u003c/span>„Prije nego što je počinio grijeh, Iblis je bio od meleka i ime mu je bilo Azazil. Bio je jedan od stanovnika Zemlje, jedan od najrevnijih meleka i među onima s najviše znanja. To ga je navelo na oholost. Bio je iz skupine koja se naziva džinima.“"},{"id":"86.3","ar":"وَحَدَّثَنَا بِهِ ابْنُ حُمَيْدٍ مَرَّةً أُخْرَى، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنِ ابْنِ إِسْحَاقَ، عَنْ خَلادِ بْنِ عَطَاءٍ، عَنْ طَاوُسٍ- أَوْ مُجَاهِدٍ أَبِي الْحَجَّاجِ- عَنِ ابْنِ عَبَّاسٍ وَغَيْرِهِ بِنَحْوِهِ، إِلا أَنَّهُ قَالَ: كَانَ مَلَكًا مِنَ الْمَلائِكَةِ اسْمُهُ عَزَازِيلُ، وَكَانَ مِنْ سُكَّانِ الأَرْضِ وَعُمَّارِهَا، وَكَانَ سُكَّانُ الأَرْضِ فِيهِمْ يُسَمُّونَ الْجِنَّ مِنْ بَيْنِ الْمَلائِكَةِ.","bs":"Ibn Humejd pričao nam je to i drugi put, rekavši: pričao nam je Selema, od Ibn Ishaka, od Hallada ibn Ataa, od Tavusa — ili Mudžahida Ebu Hadždžadža — od Ibn Abbasa i drugih, nešto slično tome, osim što je rekao: „Bio je jedan od meleka, po imenu Azazil. Bio je jedan od stanovnika i nastanjivača Zemlje, a oni među melekima koji su nastanjivali Zemlju nazivali su se džinima.“","ar_ranges":[[0,222]],"ar_html":"\u003cspan class=\"isnad\">وَحَدَّثَنَا بِهِ ابْنُ حُمَيْدٍ مَرَّةً أُخْرَى، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنِ ابْنِ إِسْحَاقَ، عَنْ خَلادِ بْنِ عَطَاءٍ، عَنْ طَاوُسٍ- أَوْ مُجَاهِدٍ أَبِي الْحَجَّاجِ- عَنِ ابْنِ عَبَّاسٍ وَغَيْرِهِ بِنَحْوِهِ، إِلا \u003c/span>أَنَّهُ قَالَ: كَانَ مَلَكًا مِنَ الْمَلائِكَةِ اسْمُهُ عَزَازِيلُ، وَكَانَ مِنْ سُكَّانِ الأَرْضِ وَعُمَّارِهَا، وَكَانَ سُكَّانُ الأَرْضِ فِيهِمْ يُسَمُّونَ الْجِنَّ مِنْ بَيْنِ الْمَلائِكَةِ.","bs_ranges":[[11,175]],"bs_html":"Ibn Humejd \u003cspan class=\"isnad\">pričao nam je to i drugi put, rekavši: pričao nam je Selema, od Ibn Ishaka, od Hallada ibn Ataa, od Tavusa — ili Mudžahida Ebu Hadždžadža — od Ibn Abbasa i drugih, \u003c/span>nešto slično tome, osim što je rekao: „Bio je jedan od meleka, po imenu Azazil. Bio je jedan od stanovnika i nastanjivača Zemlje, a oni među melekima koji su nastanjivali Zemlju nazivali su se džinima.“"},{"id":"86.4","ar":"حَدَّثَنَا ابْنُ الْمُثَنَّى، قال: حدثنا شيبان، قال: حدثنا سلام ابن مِسْكِينٍ، عَنْ قَتَادَةَ، عَنْ سَعِيدِ بْنِ الْمُسَيِّبِ، قَالَ: كَانَ إِبْلِيسُ رَئِيسَ مَلائِكَةِ سَمَاءِ الدُّنْيَا.","bs":"Pričao nam je Ibn el-Musenna, koji je rekao: pričao nam je Šejban, koji je rekao: pričao nam je Sellam ibn Miskin, od Katade, od Seida ibn el-Musejjeba, koji je rekao: „Iblis je bio poglavar meleka najbližeg neba.“","ar_ranges":[[0,134]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ الْمُثَنَّى، قال: حدثنا شيبان، قال: حدثنا سلام ابن مِسْكِينٍ، عَنْ قَتَادَةَ، عَنْ سَعِيدِ بْنِ الْمُسَيِّبِ، قَالَ: \u003c/span>كَانَ إِبْلِيسُ رَئِيسَ مَلائِكَةِ سَمَاءِ الدُّنْيَا.","bs_ranges":[[0,168]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn el-Musenna, koji je rekao: pričao nam je Šejban, koji je rekao: pričao nam je Sellam ibn Miskin, od Katade, od Seida ibn el-Musejjeba, koji je rekao: \u003c/span>„Iblis je bio poglavar meleka najbližeg neba.“"},{"id":"86.5","ar":"والقول الثالث من الأقوال المروية عنه أنه كان يقول: السبب في ذلك أنه كان من بقايا خلق خلقهم الله عز وجل، فأمرهم بأمر فأبوا طاعته.","bs":"Treće mišljenje preneseno od njega jeste da je govorio: „Razlog tome bio je što je Iblis bio jedan od preostalih pripadnika stvorenja koja je Allah, Silan i Uzvišen, stvorio, pa im je nešto naredio, a oni su odbili poslušati Ga.“","ar_ranges":[],"ar_html":"والقول الثالث من الأقوال المروية عنه أنه كان يقول: السبب في ذلك أنه كان من بقايا خلق خلقهم الله عز وجل، فأمرهم بأمر فأبوا طاعته.","bs_ranges":[],"bs_html":"Treće mišljenje preneseno od njega jeste da je govorio: „Razlog tome bio je što je Iblis bio jedan od preostalih pripadnika stvorenja koja je Allah, Silan i Uzvišen, stvorio, pa im je nešto naredio, a oni su odbili poslušati Ga.“"},{"id":"86.6","ar":"ذكر الرواية عنه بذلك:","bs":"Spomen predaje od njega o tome:","ar_ranges":[],"ar_html":"ذكر الرواية عنه بذلك:","bs_ranges":[],"bs_html":"Spomen predaje od njega o tome:"}],"notes":[]},{"n":87,"ar":"حدثني محمد بن سنان القزاز، قال: حدثنا أَبُو عَاصِمٍ، عَنْ شَبِيبٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّهَ خَلَقَ خَلْقًا فَقَالَ: اسْجُدُوا لآدَمَ، فَقَالُوا: لا نَفْعَلُ، قَالَ: فَبَعَثَ اللَّهُ عَلَيْهِمْ نَارًا تَحْرِقُهُمْ، ثُمَّ خَلَقَ خَلْقًا آخَرَ فَقَالَ: إِنِّي خَالِقُ بَشَرًا مِنْ طِينٍ فَاسْجُدُوا لآدَمَ، فَأَبَوْا، فَبَعَثَ اللَّهُ عَلَيْهِمْ نَارًا فَأَحْرَقَتْهُمْ، قَالَ: ثُمَّ خَلَقَ هَؤُلاءِ فَقَالَ: الا تسجدوا لادم! قالوا: نعم، قال: وَكَانَ إِبْلِيسُ مِنْ أُولَئِكَ الَّذِينَ أَبَوْا أَنْ يَسْجُدُوا لآدَمَ.\nوَقَالَ آخَرُونَ: بَلِ السَّبَبُ فِي ذَلِكَ أَنَّهُ كَانَ مِنْ بَقَايَا الْجِنِّ الَّذِينَ كَانُوا فِي الأَرْضِ، فَسَفَكُوا فِيهَا الدِّمَاءَ، وَأَفْسَدُوا فِيهَا، وَعَصَوْا رَبَّهُمْ، فَقَاتَلَتْهُمُ الْمَلائِكَةُ.\n\nذِكْرُ مَنْ قال ذلك:\n\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا أبو سعيد اليحمدي إسماعيل بن إبراهيم، قال: حَدَّثَنِي سوار بن الجعد اليحمدي، عن شهر بن حوشب، قوله: «كانَ مِنَ الْجِنِّ» ، قال:\nكان إبليس من الجن الذين طردتهم الملائكة، فأسره بعض الملائكة فذهب به إلى السماء.\n\nحَدَّثَنِي علي بن الحسن، قال: حَدَّثَنِي أبو نصر أحمد بن محمد الخلال، قال: حَدَّثَنِي سنيد بن داود، قال: حَدَّثَنَا هشيم، قال: أخبرنا عبد الرحمن بن يحيى، عن موسى بن نمير وعثمان بن سعيد بن كامل، عن سعد ابن مسعود، قال: كانت الملائكة تقاتل الجن فسبي إبليس، وكان صغيرا، وكان مع الملائكة يتعبد معهم، فلما أمروا أن يسجدوا لآدم سجدوا وأبى إبليس، فلذلك قال الله عز وجل: «إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ»","bs":"\u003cp data-paragraph=\"87.1\">Pričao mi je Muhammed ibn Sinan el-Kazzaz, koji je rekao: pričao nam je Ebu Asim, od Šebiba, od Ikrime, od Ibn Abbasa, koji je rekao: „Allah je stvorio stvorenja i rekao im: ‘Učinite sedždu Ademu!’ Odgovorila su: ‘Nećemo to učiniti.’“ Rekao je: „Allah je na njih poslao vatru koja ih je spaljivala. Zatim je stvorio druga stvorenja i rekao: ‘Ja stvaram čovjeka od gline, pa učinite sedždu Ademu!’ Odbila su, pa je Allah na njih poslao vatru i ona ih je spalila.“ Rekao je: „Zatim je stvorio ove i rekao: ‘Zar nećete učiniti sedždu Ademu?’ Odgovorili su: ‘Hoćemo.’“ Rekao je: „Iblis je bio od onih koji su odbili učiniti sedždu Ademu.“\u003c/p>\u003cp data-paragraph=\"87.2\">Drugi su rekli: „Naprotiv, razlog tome bio je što je on bio jedan od preostalih džina koji su živjeli na Zemlji, na njoj prolijevali krv i činili nered te bili nepokorni svome Gospodaru, pa su se meleki borili protiv njih.“\u003c/p>\u003cp data-paragraph=\"87.3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"87.4\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jahja ibn Vadih, koji je rekao: pričao nam je Ebu Seid el-Jahmedi, Ismail ibn Ibrahim, koji je rekao: pričao mi je Sevvar ibn el-Dža‘d el-Jahmedi, od Šehra ibn Havšeba, o riječima: „Bio je od džina.“ Rekao je: „Iblis je bio od džina koje su meleki protjerali. Jedan od meleka zarobio ga je i odveo na nebo.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"87.5\">Pričao mi je Ali ibn el-Hasen, koji je rekao: pričao mi je Ebu Nasr Ahmed ibn Muhammed el-Hallal, koji je rekao: pričao mi je Sunejd ibn Davud, koji je rekao: pričao nam je Hušejm, koji je rekao: obavijestio nas je Abdurrahman ibn Jahja, od Muse ibn Numejra i Osmana ibn Seida ibn Kamila, od Sa‘da ibn Mesuda, koji je rekao: „Meleki su se borili protiv džina, pa je Iblis odveden u ropstvo dok je bio mali. Boravio je s melekima i s njima činio ibadet. Kada im je naređeno da učine sedždu Ademu, oni su je učinili, a Iblis je odbio. Zato Allah, Silan i Uzvišen, kaže: ‘Osim Iblisa; bio je od džina.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"87.1","ar":"حدثني محمد بن سنان القزاز، قال: حدثنا أَبُو عَاصِمٍ، عَنْ شَبِيبٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّهَ خَلَقَ خَلْقًا فَقَالَ: اسْجُدُوا لآدَمَ، فَقَالُوا: لا نَفْعَلُ، قَالَ: فَبَعَثَ اللَّهُ عَلَيْهِمْ نَارًا تَحْرِقُهُمْ، ثُمَّ خَلَقَ خَلْقًا آخَرَ فَقَالَ: إِنِّي خَالِقُ بَشَرًا مِنْ طِينٍ فَاسْجُدُوا لآدَمَ، فَأَبَوْا، فَبَعَثَ اللَّهُ عَلَيْهِمْ نَارًا فَأَحْرَقَتْهُمْ، قَالَ: ثُمَّ خَلَقَ هَؤُلاءِ فَقَالَ: الا تسجدوا لادم! قالوا: نعم، قال: وَكَانَ إِبْلِيسُ مِنْ أُولَئِكَ الَّذِينَ أَبَوْا أَنْ يَسْجُدُوا لآدَمَ.","bs":"Pričao mi je Muhammed ibn Sinan el-Kazzaz, koji je rekao: pričao nam je Ebu Asim, od Šebiba, od Ikrime, od Ibn Abbasa, koji je rekao: „Allah je stvorio stvorenja i rekao im: ‘Učinite sedždu Ademu!’ Odgovorila su: ‘Nećemo to učiniti.’“ Rekao je: „Allah je na njih poslao vatru koja ih je spaljivala. Zatim je stvorio druga stvorenja i rekao: ‘Ja stvaram čovjeka od gline, pa učinite sedždu Ademu!’ Odbila su, pa je Allah na njih poslao vatru i ona ih je spalila.“ Rekao je: „Zatim je stvorio ove i rekao: ‘Zar nećete učiniti sedždu Ademu?’ Odgovorili su: ‘Hoćemo.’“ Rekao je: „Iblis je bio od onih koji su odbili učiniti sedždu Ademu.“","ar_ranges":[[0,112]],"ar_html":"\u003cspan class=\"isnad\">حدثني محمد بن سنان القزاز، قال: حدثنا أَبُو عَاصِمٍ، عَنْ شَبِيبٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ خَلَقَ خَلْقًا فَقَالَ: اسْجُدُوا لآدَمَ، فَقَالُوا: لا نَفْعَلُ، قَالَ: فَبَعَثَ اللَّهُ عَلَيْهِمْ نَارًا تَحْرِقُهُمْ، ثُمَّ خَلَقَ خَلْقًا آخَرَ فَقَالَ: إِنِّي خَالِقُ بَشَرًا مِنْ طِينٍ فَاسْجُدُوا لآدَمَ، فَأَبَوْا، فَبَعَثَ اللَّهُ عَلَيْهِمْ نَارًا فَأَحْرَقَتْهُمْ، قَالَ: ثُمَّ خَلَقَ هَؤُلاءِ فَقَالَ: الا تسجدوا لادم! قالوا: نعم، قال: وَكَانَ إِبْلِيسُ مِنْ أُولَئِكَ الَّذِينَ أَبَوْا أَنْ يَسْجُدُوا لآدَمَ.","bs_ranges":[[0,134]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sinan el-Kazzaz, koji je rekao: pričao nam je Ebu Asim, od Šebiba, od Ikrime, od Ibn Abbasa, koji je rekao: \u003c/span>„Allah je stvorio stvorenja i rekao im: ‘Učinite sedždu Ademu!’ Odgovorila su: ‘Nećemo to učiniti.’“ Rekao je: „Allah je na njih poslao vatru koja ih je spaljivala. Zatim je stvorio druga stvorenja i rekao: ‘Ja stvaram čovjeka od gline, pa učinite sedždu Ademu!’ Odbila su, pa je Allah na njih poslao vatru i ona ih je spalila.“ Rekao je: „Zatim je stvorio ove i rekao: ‘Zar nećete učiniti sedždu Ademu?’ Odgovorili su: ‘Hoćemo.’“ Rekao je: „Iblis je bio od onih koji su odbili učiniti sedždu Ademu.“"},{"id":"87.2","ar":"وَقَالَ آخَرُونَ: بَلِ السَّبَبُ فِي ذَلِكَ أَنَّهُ كَانَ مِنْ بَقَايَا الْجِنِّ الَّذِينَ كَانُوا فِي الأَرْضِ، فَسَفَكُوا فِيهَا الدِّمَاءَ، وَأَفْسَدُوا فِيهَا، وَعَصَوْا رَبَّهُمْ، فَقَاتَلَتْهُمُ الْمَلائِكَةُ.","bs":"Drugi su rekli: „Naprotiv, razlog tome bio je što je on bio jedan od preostalih džina koji su živjeli na Zemlji, na njoj prolijevali krv i činili nered te bili nepokorni svome Gospodaru, pa su se meleki borili protiv njih.“","ar_ranges":[],"ar_html":"وَقَالَ آخَرُونَ: بَلِ السَّبَبُ فِي ذَلِكَ أَنَّهُ كَانَ مِنْ بَقَايَا الْجِنِّ الَّذِينَ كَانُوا فِي الأَرْضِ، فَسَفَكُوا فِيهَا الدِّمَاءَ، وَأَفْسَدُوا فِيهَا، وَعَصَوْا رَبَّهُمْ، فَقَاتَلَتْهُمُ الْمَلائِكَةُ.","bs_ranges":[],"bs_html":"Drugi su rekli: „Naprotiv, razlog tome bio je što je on bio jedan od preostalih džina koji su živjeli na Zemlji, na njoj prolijevali krv i činili nered te bili nepokorni svome Gospodaru, pa su se meleki borili protiv njih.“"},{"id":"87.3","ar":"ذِكْرُ مَنْ قال ذلك:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قال ذلك:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"87.4","ar":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا أبو سعيد اليحمدي إسماعيل بن إبراهيم، قال: حَدَّثَنِي سوار بن الجعد اليحمدي، عن شهر بن حوشب، قوله: «كانَ مِنَ الْجِنِّ» ، قال:\nكان إبليس من الجن الذين طردتهم الملائكة، فأسره بعض الملائكة فذهب به إلى السماء.","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jahja ibn Vadih, koji je rekao: pričao nam je Ebu Seid el-Jahmedi, Ismail ibn Ibrahim, koji je rekao: pričao mi je Sevvar ibn el-Dža‘d el-Jahmedi, od Šehra ibn Havšeba, o riječima: „Bio je od džina.“ Rekao je: „Iblis je bio od džina koje su meleki protjerali. Jedan od meleka zarobio ga je i odveo na nebo.“ ⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧","ar_ranges":[[0,183]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا أبو سعيد اليحمدي إسماعيل بن إبراهيم، قال: حَدَّثَنِي سوار بن الجعد اليحمدي، عن شهر بن حوشب، قوله: \u003c/span>«كانَ مِنَ الْجِنِّ» ، قال:\nكان إبليس من الجن الذين طردتهم الملائكة، فأسره بعض الملائكة فذهب به إلى السماء.","bs_ranges":[[0,224]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jahja ibn Vadih, koji je rekao: pričao nam je Ebu Seid el-Jahmedi, Ismail ibn Ibrahim, koji je rekao: pričao mi je Sevvar ibn el-Dža‘d el-Jahmedi, od Šehra ibn Havšeba, \u003c/span>o riječima: „Bio je od džina.“ Rekao je: „Iblis je bio od džina koje su meleki protjerali. Jedan od meleka zarobio ga je i odveo na nebo.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧\u003c/span>"},{"id":"87.5","ar":"حَدَّثَنِي علي بن الحسن، قال: حَدَّثَنِي أبو نصر أحمد بن محمد الخلال، قال: حَدَّثَنِي سنيد بن داود، قال: حَدَّثَنَا هشيم، قال: أخبرنا عبد الرحمن بن يحيى، عن موسى بن نمير وعثمان بن سعيد بن كامل، عن سعد ابن مسعود، قال: كانت الملائكة تقاتل الجن فسبي إبليس، وكان صغيرا، وكان مع الملائكة يتعبد معهم، فلما أمروا أن يسجدوا لآدم سجدوا وأبى إبليس، فلذلك قال الله عز وجل: «إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ»","bs":"Pričao mi je Ali ibn el-Hasen, koji je rekao: pričao mi je Ebu Nasr Ahmed ibn Muhammed el-Hallal, koji je rekao: pričao mi je Sunejd ibn Davud, koji je rekao: pričao nam je Hušejm, koji je rekao: obavijestio nas je Abdurrahman ibn Jahja, od Muse ibn Numejra i Osmana ibn Seida ibn Kamila, od Sa‘da ibn Mesuda, koji je rekao: „Meleki su se borili protiv džina, pa je Iblis odveden u ropstvo dok je bio mali. Boravio je s melekima i s njima činio ibadet. Kada im je naređeno da učine sedždu Ademu, oni su je učinili, a Iblis je odbio. Zato Allah, Silan i Uzvišen, kaže: ‘Osim Iblisa; bio je od džina.’“ ⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧","ar_ranges":[[0,217]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي علي بن الحسن، قال: حَدَّثَنِي أبو نصر أحمد بن محمد الخلال، قال: حَدَّثَنِي سنيد بن داود، قال: حَدَّثَنَا هشيم، قال: أخبرنا عبد الرحمن بن يحيى، عن موسى بن نمير وعثمان بن سعيد بن كامل، عن سعد ابن مسعود، قال: \u003c/span>كانت الملائكة تقاتل الجن فسبي إبليس، وكان صغيرا، وكان مع الملائكة يتعبد معهم، فلما أمروا أن يسجدوا لآدم سجدوا وأبى إبليس، فلذلك قال الله عز وجل: «إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ»","bs_ranges":[[0,325]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ali ibn el-Hasen, koji je rekao: pričao mi je Ebu Nasr Ahmed ibn Muhammed el-Hallal, koji je rekao: pričao mi je Sunejd ibn Davud, koji je rekao: pričao nam je Hušejm, koji je rekao: obavijestio nas je Abdurrahman ibn Jahja, od Muse ibn Numejra i Osmana ibn Seida ibn Kamila, od Sa‘da ibn Mesuda, koji je rekao: \u003c/span>„Meleki su se borili protiv džina, pa je Iblis odveden u ropstvo dok je bio mali. Boravio je s melekima i s njima činio ibadet. Kada im je naređeno da učine sedždu Ademu, oni su je učinili, a Iblis je odbio. Zato Allah, Silan i Uzvišen, kaže: ‘Osim Iblisa; bio je od džina.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧\u003c/span>"}],"notes":[]},{"n":88,"ar":"قال ابو جعفر: وأولى الأقوال في ذلك عندي بالصواب أن يقال كما قال الله عز وجل: «وَإِذْ قُلْنا لِلْمَلائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِ» ، وجائز أن يكون فسوقه عن أمر ربه كان من أجل أنه كان من الجن، وجائز أن يكون من أجل إعجابه بنفسه لشدة اجتهاده كان في عبادة ربه، وكثرة علمه، وما كان أوتي من ملك السماء الدنيا والأرض وخزن الجنان وجائز أن يكون كان لغير ذلك من الأمور، ولا يدرك علم ذلك إلا بخبر تقوم به الحجة، ولا خبر في ذلك عندنا كذلك، والاختلاف في أمره على ما حكينا ورويناه.\nوقد قيل: إن سبب هلاكه كان من أجل أن الأرض كان فيها قبل آدم الجن، فبعث الله إبليس قاضيا يقضي بينهم، فلم يزل يقضي بينهم بالحق ألف سنة حتى سمي حكما، وسماه الله به، وأوحى إليه اسمه، فعند ذلك دخله الكبر، فتعظم وتكبر، وألقى بين الذين كان الله بعثه إليهم حكما البأس والعداوة والبغضاء، فاقتتلوا عند ذلك في الأرض ألفي سنة فيما زعموا، حتى إن خيولهم تخوض في دمائهم، قالوا: وذلك قول الله تبارك وتعالى: «أَفَعَيِينا بِالْخَلْقِ الْأَوَّلِ بَلْ هُمْ فِي لَبْسٍ مِنْ خَلْقٍ جَدِيدٍ» ، وقول الملائكة: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ! فبعث الله تعالى عند ذلك نارا فأحرقتهم قالوا:\nفلما رأى إبليس ما نزل بقومه من العذاب عرج إلى السماء، فأقام عند الملائكة يعبد الله في السماء مجتهدا لم يعبده شيء من خلقه مثل عبادته، فلم يزل مجتهدا في العبادة حتى خلق الله آدم، فكان من امره ومعصيته ربه ما كان","bs":"\u003cp data-paragraph=\"88.1\">Ebu Džafer kaže: Smatram da je među mišljenjima o tome najispravnije reći onako kako je rekao Allah, Silan i Uzvišen: „I kada smo rekli melekima: Učinite sedždu Ademu!, oni su je učinili, osim Iblisa; bio je od džina pa je izišao iz pokornosti naredbi svoga Gospodara.“ Moguće je da je iz pokornosti naredbi svoga Gospodara izišao zato što je bio od džina. Moguće je i da je to bilo zbog samodopadnosti izazvane njegovom velikom revnošću u ibadetu Gospodaru, obilnim znanjem i onim što mu je dato od vlasti nad najbližim nebom i Zemljom i čuvanja džennetskih vrtova. Moguće je i da je bilo zbog nečega drugog. To se ne može znati osim na osnovu predaje kojom se uspostavlja dokaz, a mi o tome nemamo takvu predaju. Razilaženje o njegovom slučaju jeste onakvo kakvo smo izložili i prenijeli. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"88.2\">Rečeno je da je razlog njegove propasti bio to što su prije Adema na Zemlji živjeli džini, pa je Allah poslao Iblisa kao sudiju da im sudi. Neprestano im je hiljadu godina pravedno sudio, sve dok nije nazvan Hakemom. Allah ga je tako nazvao i objavio mu njegovo ime. Tada je u njega ušla oholost, pa se uzvisivao i uzoholio, a među one kojima ga je Allah poslao kao sudiju ubacio je sukob, neprijateljstvo i mržnju. Zatim su se, prema onome što tvrde, dvije hiljade godina međusobno borili na Zemlji, toliko da su im konji gazili kroz njihovu krv. Rekli su: „To su riječi Allaha, Blagoslovljenog i Uzvišenog: ‘Zar Nas je prvo stvaranje iscrpilo? Naprotiv, oni su u nedoumici o novom stvaranju’, i riječi meleka: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’“ Uzvišeni Allah tada je na njih poslao vatru pa ih je spalila. Rekli su: „Kada je Iblis vidio kakva je kazna zadesila njegov narod, uzdigao se na nebo. Boravio je među melekima na nebu i revno obožavao Allaha; nijedno Njegovo stvorenje nije Mu činilo ibadet poput njega. Neprestano je bio revan u ibadetu sve dok Allah nije stvorio Adema. Potom se u njegovom slučaju i njegovoj nepokornosti Gospodaru dogodilo ono što se dogodilo.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Kaf, 50:15; El-Bekara, 2:30, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"88.1","ar":"قال ابو جعفر: وأولى الأقوال في ذلك عندي بالصواب أن يقال كما قال الله عز وجل: «وَإِذْ قُلْنا لِلْمَلائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِ» ، وجائز أن يكون فسوقه عن أمر ربه كان من أجل أنه كان من الجن، وجائز أن يكون من أجل إعجابه بنفسه لشدة اجتهاده كان في عبادة ربه، وكثرة علمه، وما كان أوتي من ملك السماء الدنيا والأرض وخزن الجنان وجائز أن يكون كان لغير ذلك من الأمور، ولا يدرك علم ذلك إلا بخبر تقوم به الحجة، ولا خبر في ذلك عندنا كذلك، والاختلاف في أمره على ما حكينا ورويناه.","bs":"Ebu Džafer kaže: Smatram da je među mišljenjima o tome najispravnije reći onako kako je rekao Allah, Silan i Uzvišen: „I kada smo rekli melekima: Učinite sedždu Ademu!, oni su je učinili, osim Iblisa; bio je od džina pa je izišao iz pokornosti naredbi svoga Gospodara.“ Moguće je da je iz pokornosti naredbi svoga Gospodara izišao zato što je bio od džina. Moguće je i da je to bilo zbog samodopadnosti izazvane njegovom velikom revnošću u ibadetu Gospodaru, obilnim znanjem i onim što mu je dato od vlasti nad najbližim nebom i Zemljom i čuvanja džennetskih vrtova. Moguće je i da je bilo zbog nečega drugog. To se ne može znati osim na osnovu predaje kojom se uspostavlja dokaz, a mi o tome nemamo takvu predaju. Razilaženje o njegovom slučaju jeste onakvo kakvo smo izložili i prenijeli. ⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧","ar_ranges":[],"ar_html":"قال ابو جعفر: وأولى الأقوال في ذلك عندي بالصواب أن يقال كما قال الله عز وجل: «وَإِذْ قُلْنا لِلْمَلائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِ» ، وجائز أن يكون فسوقه عن أمر ربه كان من أجل أنه كان من الجن، وجائز أن يكون من أجل إعجابه بنفسه لشدة اجتهاده كان في عبادة ربه، وكثرة علمه، وما كان أوتي من ملك السماء الدنيا والأرض وخزن الجنان وجائز أن يكون كان لغير ذلك من الأمور، ولا يدرك علم ذلك إلا بخبر تقوم به الحجة، ولا خبر في ذلك عندنا كذلك، والاختلاف في أمره على ما حكينا ورويناه.","bs_ranges":[],"bs_html":"Ebu Džafer kaže: Smatram da je među mišljenjima o tome najispravnije reći onako kako je rekao Allah, Silan i Uzvišen: „I kada smo rekli melekima: Učinite sedždu Ademu!, oni su je učinili, osim Iblisa; bio je od džina pa je izišao iz pokornosti naredbi svoga Gospodara.“ Moguće je da je stvo i mržnju. Zatim su se, prema onome što tvrde, dvije hiljade godina međusobno borili na Zemlji, toliko da su im konji gazili kroz njihovu krv. Rekli su: „To su riječi Allaha, Blagoslovljenog i Uzvišenog: ‘Zar Nas je prvo stvaranje iscrpilo? Naprotiv, oni su u nedoumici o novom stvaranju’, i riječi meleka: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’“ Uzvišeni Allah tada je na njih poslao vatru pa ih je spalila. Rekli su: „Kada je Iblis vidio kakva je kazna zadesila njegov narod, uzdigao se na nebo. Boravio je među melekima na nebu i revno obožavao Allaha; nijedno Njegovo stvorenje nije Mu činilo ibadet poput njega. Neprestano je bio revan u ibadetu sve dok Allah nije stvorio Adema. Potom se u njegovom slučaju i njegovoj nepokornosti Gospodaru dogodilo ono što se dogodilo.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Kaf, 50:15; El-Bekara, 2:30, navedeni dio.⟧\u003c/span>"}],"notes":[]},{"n":89,"ar":"[القول في خلق آدم ع]\nوكان مما حدث في أيام سلطانه وملكه خلق الله تعالى ذكره أبانا آدم أبا البشر، وذلك لما أراد جل جلاله أن يطلع ملائكته على ما قد علم من انطواء إبليس على الكبر ولم يعلمه الملائكة، وأراد إظهار أمره لهم حين دنا أمره للبوار، وملكه وسلطانه للزوال، فقال عز ذكره لما أراد ذلك للملائكة: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» ، فأجابوه بأن قالوا له: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ! فروي عن ابْنِ عَبَّاسٍ أن الملائكة قالت ذلك كذلك للذين قد كانوا عهدوا من أمر الجن الذين كانوا سكان الأرض قبل ذلك، فقالوا لربهم جل ثناؤه لما قال لهم: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» أتجعل فيها من يكون فيها مثل الجن الذين كانوا فيها، فكانوا يسفكون فيها الدماء ويفسدون فيها ويعصونك، وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لك، فقال الرب تعالى ذكره لهم: «إِنِّي أَعْلَمُ ما لا تَعْلَمُونَ» ، يقول: اعلم ما لا تعلمون من انطواء إبليس على التكبر، وعزمه على خلافه أمري، وتسويل نفسه له الباطل واغتراره، وأنا مبد ذلك لكم منه لتروا ذلك منه عيانا.\nوقيل أقوال كثيرة في ذلك، قد حكينا منها جملا في كتابنا المسمى:\n\nجامع البيان عن تأويل آي القرآن، فكرهنا إطالة الكتاب بذكر ذلك في هذا الموضع.\n\nفلما أراد الله عز وجل أن يخلق آدم ع أمر بتربته أن تؤخذ من الأرض، كما حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا","bs":"\u003cp data-paragraph=\"89.1\">Rasprava o stvaranju Adema, alejhis-selam\u003c/p>\u003cp data-paragraph=\"89.2\">Među događajima iz vremena njegove vlasti i vladavine bilo je to što je Allah, Uzvišen je spomen Njegov, stvorio našeg oca Adema, oca čovječanstva. To se dogodilo kada je On, Uzvišeno je Njegovo veličanstvo, htio Svojim melekima pokazati ono što je znao o oholosti koju je Iblis skrivao u sebi, a meleki za nju nisu znali. Htio im je otkriti njegov slučaj kada mu se približila propast, a njegovoj vlasti i vladavini nestanak. Kada je to htio, On, Silan je spomen Njegov, rekao je melekima: „Ja ću na Zemlji postaviti namjesnika.“ Odgovorili su Mu: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?“ Od Ibn Abbasa preneseno je da su meleki to rekli zbog onoga što su već znali o džinima koji su prije toga nastanjivali Zemlju. Kada im je njihov Gospodar, Uzvišena je Njegova hvala, rekao: „Ja ću na Zemlji postaviti namjesnika“, odgovorili su: „Zar ćeš na njoj postaviti nekoga poput džina koji su na njoj bili, prolijevali krv, činili nered i bili Ti nepokorni, dok mi Tebe s hvalom slavimo i svetost Ti iskazujemo?“ Njihov Gospodar, Uzvišen je spomen Njegov, rekao im je: „Ja znam ono što vi ne znate.“ To znači: „Znam ono što vi ne znate o Iblisovoj skrivenoj oholosti, njegovoj namjeri da se suprotstavi Mojoj naredbi, o tome kako mu duša uljepšava neistinu i kako se zavarava. To ću vam kod njega otkriti kako biste vlastitim očima vidjeli.“ \u003cspan class=\"translator-note\">⟦Prijevodi izričito navedenih kur’anskih riječi: El-Bekara, 2:30. Prošireni odgovori i objašnjenje iza „To znači“ pripadaju navedenom tumačenju.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"89.3\">O tome je izneseno mnogo mišljenja. Neka od njih izložili smo u svojoj knjizi pod naslovom „Džamiul-bejan an te’vili ajil-Kur’an“, pa nismo željeli oduljiti ovu knjigu njihovim navođenjem na ovome mjestu.\u003c/p>\u003cp data-paragraph=\"89.4\">Kada je Allah, Silan i Uzvišen, htio stvoriti Adema, alejhis-selam, naredio je da se zemlja za njega uzme sa Zemlje, kako nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je\u003c/p>","paragraphs":[{"id":"89.1","ar":"[القول في خلق آدم ع]","bs":"Rasprava o stvaranju Adema, alejhis-selam","ar_ranges":[],"ar_html":"[القول في خلق آدم ع]","bs_ranges":[],"bs_html":"Rasprava o stvaranju Adema, alejhis-selam"},{"id":"89.2","ar":"وكان مما حدث في أيام سلطانه وملكه خلق الله تعالى ذكره أبانا آدم أبا البشر، وذلك لما أراد جل جلاله أن يطلع ملائكته على ما قد علم من انطواء إبليس على الكبر ولم يعلمه الملائكة، وأراد إظهار أمره لهم حين دنا أمره للبوار، وملكه وسلطانه للزوال، فقال عز ذكره لما أراد ذلك للملائكة: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» ، فأجابوه بأن قالوا له: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ! فروي عن ابْنِ عَبَّاسٍ أن الملائكة قالت ذلك كذلك للذين قد كانوا عهدوا من أمر الجن الذين كانوا سكان الأرض قبل ذلك، فقالوا لربهم جل ثناؤه لما قال لهم: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» أتجعل فيها من يكون فيها مثل الجن الذين كانوا فيها، فكانوا يسفكون فيها الدماء ويفسدون فيها ويعصونك، وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لك، فقال الرب تعالى ذكره لهم: «إِنِّي أَعْلَمُ ما لا تَعْلَمُونَ» ، يقول: اعلم ما لا تعلمون من انطواء إبليس على التكبر، وعزمه على خلافه أمري، وتسويل نفسه له الباطل واغتراره، وأنا مبد ذلك لكم منه لتروا ذلك منه عيانا.","bs":"Među događajima iz vremena njegove vlasti i vladavine bilo je to što je Allah, Uzvišen je spomen Njegov, stvorio našeg oca Adema, oca čovječanstva. To se dogodilo kada je On, Uzvišeno je Njegovo veličanstvo, htio Svojim melekima pokazati ono što je znao o oholosti koju je Iblis skrivao u sebi, a meleki za nju nisu znali. Htio im je otkriti njegov sluč اعلم ما لا تعلمون من انطواء إبليس على التكبر، وعزمه على خلافه أمري، وتسويل نفسه له الباطل واغتراره، وأنا مبد ذلك لكم منه لتروا ذلك منه عيانا.","bs_ranges":[],"bs_html":"Među događajima iz vremena njegove vlasti i vladavine bilo je to što je Allah, Uzvišen je spomen Njegov, stvorio našeg oca Adema, oca čovječanstva. To se dogodilo kada je On, Uzvišeno je Njegovo veličanstvo, htio Svojim melekima pokazati ono što je znao o oholosti koju je Iblis skrivao u sebi, a meleki za nju nisu znali. Htio im je otkriti njegov slučaj kada mu se približila propast, a njegovoj vlasti i vladavini nestanak. Kada je to htio, On, Silan je spomen Njegov, rekao je melekima: „Ja ću na Zemlji postaviti namjesnika.“ Odgovorili su Mu: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?“ Od Ibn Abbasa preneseno je da su meleki to rekli zbog onoga što su već znali o džinima koji su prije toga nastanjivali Zemlju. Kada im je njihov Gospodar, Uzvišena je Njegova hvala, rekao: „Ja ću na Zemlji postaviti namjesnika“, odgovorili su: „Zar ćeš na njoj postaviti nekoga poput džina koji su na njoj bili, prolijevali krv, činili nered i bili Ti nepokorni, dok mi Tebe s hvalom slavimo i svetost Ti iskazujemo?“ Njihov Gospodar, Uzvišen je spomen Njegov, rekao im je: „Ja znam ono što vi ne znate.“ To znači: „Znam ono što vi ne znate o Iblisovoj skrivenoj oholosti, njegovoj namjeri da se suprotstavi Mojoj naredbi, o tome kako mu duša uljepšava neistinu i kako se zavarava. To ću vam kod njega otkriti kako biste vlastitim očima vidjeli.“ \u003cspan class=\"translator-note\">⟦Prijevodi izričito navedenih kur’anskih riječi: El-Bekara, 2:30. Prošireni odgovori i objašnjenje iza „To znači“ pripadaju navedenom tumačenju.⟧\u003c/span>"},{"id":"89.3","ar":"وقيل أقوال كثيرة في ذلك، قد حكينا منها جملا في كتابنا المسمى:\n\nجامع البيان عن تأويل آي القرآن، فكرهنا إطالة الكتاب بذكر ذلك في هذا الموضع.","bs":"O tome je izneseno mnogo mišljenja. Neka od njih izložili smo u svojoj knjizi pod naslovom
