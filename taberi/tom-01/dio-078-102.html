ن مسعود- وعن ناس من أصحاب النبي ص، قَالَ: قَالَتِ الْمَلائِكَةُ: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» يعنى من شان ابليس، فبعث الله جبرئيل ع إِلَى الأَرْضِ لِيَأْتِيَهُ بِطِينٍ مِنْهَا، فَقَالَتِ الأَرْضُ: إِنِّي أَعُوذُ بِاللَّهِ مِنْكَ أَنْ تُنْقِصَ مِنِّي شيئا وتشينى، فَرَجَعَ وَلَمْ يَأْخُذْ، وَقَالَ: يَا رَبِّ إِنَّهَا عَاذَتْ بِكَ فَأَعَذْتُهَا، فَبَعَثَ مِيكَائِيلَ فَعَاذَتْ مِنْهُ فاعاذها فرجع، فقال كما قال جبرئيل، فبعث ملك الموت فَعَاذَتْ مِنْهُ، فَأَعَاذَهَا فَرَجَعَ، فَقَالَ كَمَا قَالَ جبرئيل، فَبَعَثَ مَلَكُ الْمَوْتِ فَعَاذَتْ مِنْهُ، فَقَالَ: وَأَنَا أَعُوذُ بِاللَّهِ أَنْ أَرْجِعَ، وَلَمْ أُنَفِّذْ أَمْرَهُ، فاخذ مِنْ وَجْهِ الأَرْضِ، وَخَلَطَ فَلَمْ يَأْخُذْ مِنْ مَكَانٍ وَاحِدٍ، وَأَخَذَ مِنْ تُرْبَةٍ حَمْرَاءَ وَبَيْضَاءَ وَسَوْدَاءَ، فَلِذَلِكَ خَرَجَ بَنُو آدَمَ مُخْتَلِفِينَ، فَصَعِدَ بِهِ فَبَلَّ التُّرَابَ حَتَّى عَادَ طِينًا لازِبًا- وَاللازِبُ هُوَ الَّذِي يَلْتَزِقُ بَعْضُهُ بِبَعْضٍ- ثُمَّ تُرِكَ حَتَّى تَغَيَّرَ وَأَنْتَنَ، وَذَلِكَ حِينَ يَقُولُ: «مِنْ حَمَإٍ مَسْنُونٍ*» ، قَالَ: مُنْتِنٌ.\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَعْقُوبُ الْقُمِّيُّ، عَنْ جَعْفَرِ بْنِ أَبِي الْمُغِيرَةِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: بَعَثَ رَبُّ الْعِزَّةِ عز وَجَلَّ إِبْلِيسَ، فَأَخَذَ مِنْ أَدِيمِ الأَرْضِ، مِنْ عَذْبِهَا وَمَلْحِهَا، فَخَلَقَ مِنْهُ آدَمَ،","bs":"\u003cp data-paragraph=\"90.1\">Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Zatim je naredio — misli se na Gospodara, Blagoslovljenog i Uzvišenog — da se donese zemlja za Adema, pa je podignuta. Allah je stvorio Adema od ljepljive gline — lazib je ljepljiv i dobar — od promijenjenog crnog blata neugodnog mirisa.“ Rekao je: „Crno, promijenjeno blato nastalo je poslije zemlje.“ Rekao je: „Od njega je Svojom rukom stvorio Adema.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u prvom izrazu izvor ima طين لا رب, a odmah potom objašnjava riječ اللازب. „Ljepljiva glina“ ovdje slijedi to objašnjenje; prvo mjesto očigledno zahtijeva provjeru zapisa.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"90.2\">Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: „Meleki su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo? Rekao je: Ja znam ono što vi ne znate’ — misleći na Iblisov slučaj. Allah je poslao Džibrila, alejhis-selam, na Zemlju da Mu donese gline s nje. Zemlja je rekla: ‘Utječem se Allahu od tebe, da nešto od mene ne oduzmeš i ne naružiš me.’ Vratio se ne uzevši ništa i rekao: ‘Gospodaru moj, zatražila je zaštitu kod Tebe, pa sam joj je pružio.’ Zatim je poslao Mikaila, a ona je od njega zatražila zaštitu. On joj je pružio zaštitu i vratio se, pa rekao isto što je rekao Džibril. Zatim je poslao meleka smrti. Ona je od njega zatražila zaštitu, pa joj je pružio zaštitu i vratio se, rekavši isto što je rekao Džibril. Zatim je poslao meleka smrti. Ona je od njega zatražila zaštitu, a on je rekao: ‘I ja se utječem Allahu od toga da se vratim a da nisam izvršio Njegovu naredbu.’ Uzeo je s površine Zemlje i pomiješao; nije uzeo samo s jednoga mjesta. Uzeo je crvene, bijele i crne zemlje, pa su zato Ademovi potomci različiti. Uzdižući se, ponio je to, pa je nakvasio zemlju dok nije postala ljepljiva glina — lazib je ono čiji se dijelovi lijepe jedni za druge. Zatim je ostavljena dok se nije promijenila i dobila neugodan miris. To je ono kada kaže: ‘Od promijenjenog crnog blata.’“ Rekao je: „Neugodnog mirisa.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dio; izraz من حمإ مسنون nalazi se u El-Hidžr, 15:26, 28 i 33. Napomena prevodioca: slanje meleka smrti u izvoru se pojavljuje dvaput, s različitim ishodima. Oba mjesta sačuvana su, bez uklanjanja ponavljanja.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"90.3\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jakub el-Kummi, od Džafera ibn Ebu Mugire, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Gospodar moći, Silan i Uzvišen, poslao je Iblisa. On je uzeo s površine Zemlje, od njene slatke i slane zemlje, pa je od toga stvorio Adema,\u003c/p>","paragraphs":[{"id":"90.1","ar":"بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: ثُمَّ أَمَرَ- يَعْنِي الرَّبَّ تَبَارَكَ وَتَعَالَى بِتُرْبَةِ آدَمَ فَرُفِعَتْ، فخلق الله آدم من طين لا رب- وَاللازِبُ اللَّزِجُ الطَّيِّبُ- مِنْ حَمَإٍ مَسْنُونٍ، مُنْتِنٍ، قَالَ:\nوَإِنَّمَا كَانَ حَمَأً مَسْنُونًا بَعْدَ التُّرَابِ، قَالَ: فَخَلَقَ مِنْهُ آدَمَ بِيَدِهِ.","bs":"Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Zatim je naredio — misli se na Gospodara, Blagoslovljenog i Uzvišenog — da se donese zemlja za Adema, pa je podignuta. Allah je stvorio Adema od ljepljive gline — lazib je ljepljiv i dobar — od promijenjenog crnog blata neugodnog mirisa.“ Rekao je: „Crno, promijenjeno blato nastalo je poslije zemlje.“ Rekao je: „Od njega je Svojom rukom stvorio Adema.“ ⟦Napomena prevodioca: u prvom izrazu izvor ima طين لا رب, a odmah potom objašnjava riječ اللازب. „Ljepljiva glina“ ovdje slijedi to objašnjenje; prvo mjesto očigledno zahtijeva provjeru zapisa.⟧","ar_ranges":[[0,88]],"ar_html":"\u003cspan class=\"isnad\">بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>ثُمَّ أَمَرَ- يَعْنِي الرَّبَّ تَبَارَكَ وَتَعَالَى بِتُرْبَةِ آدَمَ فَرُفِعَتْ، فخلق الله آدم من طين لا رب- وَاللازِبُ اللَّزِجُ الطَّيِّبُ- مِنْ حَمَإٍ مَسْنُونٍ، مُنْتِنٍ، قَالَ:\nوَإِنَّمَا كَانَ حَمَأً مَسْنُونًا بَعْدَ التُّرَابِ، قَالَ: فَخَلَقَ مِنْهُ آدَمَ بِيَدِهِ.","bs_ranges":[[0,72]],"bs_html":"\u003cspan class=\"isnad\">Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: \u003c/span>„Zatim je naredio — misli se na Gospodara, Blagoslovljenog i Uzvišenog — da se donese zemlja za Adema, pa je podignuta. Allah je stvorio Adema od ljepljive gline — lazib je ljepljiv i dobar — od promijenjenog crnog blata neugodnog mirisa.“ Rekao je: „Crno, promijenjeno blato nastalo je poslije zemlje.“ Rekao je: „Od njega je Svojom rukom stvorio Adema.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u prvom izrazu izvor ima طين لا رب, a odmah potom objašnjava riječ اللازب. „Ljepljiva glina“ ovdje slijedi to objašnjenje; prvo mjesto očigledno zahtijeva provjeru zapisa.⟧\u003c/span>"},{"id":"90.2","ar":"حَدَّثَنِي مُوسَى بن هارون، قال: حدثنا عمرو بن حماد، قال:\nحدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابن مسعود- وعن ناس من أصحاب النبي ص، قَالَ: قَالَتِ الْمَلائِكَةُ: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» يعنى من شان ابليس، فبعث الله جبرئيل ع إِلَى الأَرْضِ لِيَأْتِيَهُ بِطِينٍ مِنْهَا، فَقَالَتِ الأَرْضُ: إِنِّي أَعُوذُ بِاللَّهِ مِنْكَ أَنْ تُنْقِصَ مِنِّي شيئا وتشينى، فَرَجَعَ وَلَمْ يَأْخُذْ، وَقَالَ: يَا رَبِّ إِنَّهَا عَاذَتْ بِكَ فَأَعَذْتُهَا، فَبَعَثَ مِيكَائِيلَ فَعَاذَتْ مِنْهُ فاعاذها فرجع، فقال كما قال جبرئيل، فبعث ملك الموت فَعَاذَتْ مِنْهُ، فَأَعَاذَهَا فَرَجَعَ، فَقَالَ كَمَا قَالَ جبرئيل، فَبَعَثَ مَلَكُ الْمَوْتِ فَعَاذَتْ مِنْهُ، فَقَالَ: وَأَنَا أَعُوذُ بِاللَّهِ أَنْ أَرْجِعَ، وَلَمْ أُنَفِّذْ أَمْرَهُ، فاخذ مِنْ وَجْهِ الأَرْضِ، وَخَلَطَ فَلَمْ يَأْخُذْ مِنْ مَكَانٍ وَاحِدٍ، وَأَخَذَ مِنْ تُرْبَةٍ حَمْرَاءَ وَبَيْضَاءَ وَسَوْدَاءَ، فَلِذَلِكَ خَرَجَ بَنُو آدَمَ مُخْتَلِفِينَ، فَصَعِدَ بِهِ فَبَلَّ التُّرَابَ حَتَّى عَادَ طِينًا لازِبًا- وَاللازِبُ هُوَ الَّذِي يَلْتَزِقُ بَعْضُهُ بِبَعْضٍ- ثُمَّ تُرِكَ حَتَّى تَغَيَّرَ وَأَنْتَنَ، وَذَلِكَ حِينَ يَقُولُ: «مِنْ حَمَإٍ مَسْنُونٍ*» ، قَالَ: مُنْتِنٌ.","bs":"Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: „Meleki su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo? Rekao je: Ja znam ono što vi ne znate’ — misleći na Iblisov slučaj. Allah je poslao Džibrila, alejhis-selam, na Zemlju da Mu donese gline s nje. Zemlja je rekla: ‘Utječem se Allahu od tebe, da nešto od mene ne oduzmeš i ne naružiš me.’ Vratio se ne uzevši ništa i rekao: ‘Gospodaru moj, zatražila je zaštitu kod Tebe, pa sam joj je pružio.’ Zatim je poslao Mikaila, a ona je od njega zatražila zaštitu. On joj je pružio zaštitu i vratio se, pa rekao isto što je rekao Džibril. Zatim je poslao meleka smrti. Ona je od njega zatražila zaštitu, pa joj je pružio zaštitu i vratio se, rekavši isto što je rekao Džibril. Zatim je poslao meleka smrti. Ona je od njega zatražila zaštitu, a on je rekao: ‘I ja se utječem Allahu od toga da se vratim a da nisam izvršio Njegovu naredbu.’ Uzeo je s površine Zemlje i pomiješao; nije uzeo samo s jednoga mjesta. Uzeo je crvene, bijele i crne zemlje, pa su zato Ademovi potomci različiti. Uzdižući se, ponio je to, pa je nakvasio zemlju dok nije postala ljepljiva glina — lazib je ono čiji se dijelovi lijepe jedni za druge. Zatim je ostavljena dok se nije promijenila i dobila neugodan miris. To je ono kada kaže: ‘Od promijenjenog crnog blata.’“ Rekao je: „Neugodnog mirisa.“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dio; izraz من حمإ مسنون nalazi se u El-Hidžr, 15:26, 28 i 33. Napomena prevodioca: slanje meleka smrti u izvoru se pojavljuje dvaput, s različitim ishodima. Oba mjesta sačuvana su, bez uklanjanja ponavljanja.⟧","ar_ranges":[[0,198]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بن هارون، قال: حدثنا عمرو بن حماد، قال:\nحدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابن مسعود- وعن ناس من أصحاب النبي ص، قَالَ: \u003c/span>قَالَتِ الْمَلائِكَةُ: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» يعنى من شان ابليس، فبعث الله جبرئيل ع إِلَى الأَرْضِ لِيَأْتِيَهُ بِطِينٍ مِنْهَا، فَقَالَتِ الأَرْضُ: إِنِّي أَعُوذُ بِاللَّهِ مِنْكَ أَنْ تُنْقِصَ مِنِّي شيئا وتشينى، فَرَجَعَ وَلَمْ يَأْخُذْ، وَقَالَ: يَا رَبِّ إِنَّهَا عَاذَتْ بِكَ فَأَعَذْتُهَا، فَبَعَثَ مِيكَائِيلَ فَعَاذَتْ مِنْهُ فاعاذها فرجع، فقال كما قال جبرئيل، فبعث ملك الموت فَعَاذَتْ مِنْهُ، فَأَعَاذَهَا فَرَجَعَ، فَقَالَ كَمَا قَالَ جبرئيل، فَبَعَثَ مَلَكُ الْمَوْتِ فَعَاذَتْ مِنْهُ، فَقَالَ: وَأَنَا أَعُوذُ بِاللَّهِ أَنْ أَرْجِعَ، وَلَمْ أُنَفِّذْ أَمْرَهُ، فاخذ مِنْ وَجْهِ الأَرْضِ، وَخَلَطَ فَلَمْ يَأْخُذْ مِنْ مَكَانٍ وَاحِدٍ، وَأَخَذَ مِنْ تُرْبَةٍ حَمْرَاءَ وَبَيْضَاءَ وَسَوْدَاءَ، فَلِذَلِكَ خَرَجَ بَنُو آدَمَ مُخْتَلِفِينَ، فَصَعِدَ بِهِ فَبَلَّ التُّرَابَ حَتَّى عَادَ طِينًا لازِبًا- وَاللازِبُ هُوَ الَّذِي يَلْتَزِقُ بَعْضُهُ بِبَعْضٍ- ثُمَّ تُرِكَ حَتَّى تَغَيَّرَ وَأَنْتَنَ، وَذَلِكَ حِينَ يَقُولُ: «مِنْ حَمَإٍ مَسْنُونٍ*» ، قَالَ: مُنْتِنٌ.","bs_ranges":[[0,300]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: \u003c/span>„Meleki su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo? Rekao je: Ja znam ono što vi ne znate’ — misleći na Iblisov slučaj. Allah je poslao Džibrila, alejhis-selam, na Zemlju da Mu donese gline s nje. Zemlja je rekla: ‘Utječem se Allahu od tebe, da nešto od mene ne oduzmeš i ne naružiš me.’ Vratio se ne uzevši ništa i rekao: ‘Gospodaru moj, zatražila je zaštitu kod Tebe, pa sam joj je pružio.’ Zatim je poslao Mikaila, a ona je od njega zatražila zaštitu. On joj je pružio zaštitu i vratio se, pa rekao isto što je rekao Džibril. Zatim je poslao meleka smrti. Ona je od njega zatražila zaštitu, pa joj je pružio zaštitu i vratio se, rekavši isto što je rekao Džibril. Zatim je poslao meleka smrti. Ona je od njega zatražila zaštitu, a on je rekao: ‘I ja se utječem Allahu od toga da se vratim a da nisam izvršio Njegovu naredbu.’ Uzeo je s površine Zemlje i pomiješao; nije uzeo samo s jednoga mjesta. Uzeo je crvene, bijele i crne zemlje, pa su zato Ademovi potomci različiti. Uzdižući se, ponio je to, pa je nakvasio zemlju dok nije postala ljepljiva glina — lazib je ono čiji se dijelovi lijepe jedni za druge. Zatim je ostavljena dok se nije promijenila i dobila neugodan miris. To je ono kada kaže: ‘Od promijenjenog crnog blata.’“ Rekao je: „Neugodnog mirisa.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dio; izraz من حمإ مسنون nalazi se u El-Hidžr, 15:26, 28 i 33. Napomena prevodioca: slanje meleka smrti u izvoru se pojavljuje dvaput, s različitim ishodima. Oba mjesta sačuvana su, bez uklanjanja ponavljanja.⟧\u003c/span>"},{"id":"90.3","ar":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَعْقُوبُ الْقُمِّيُّ، عَنْ جَعْفَرِ بْنِ أَبِي الْمُغِيرَةِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: بَعَثَ رَبُّ الْعِزَّةِ عز وَجَلَّ إِبْلِيسَ، فَأَخَذَ مِنْ أَدِيمِ الأَرْضِ، مِنْ عَذْبِهَا وَمَلْحِهَا، فَخَلَقَ مِنْهُ آدَمَ،","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jakub el-Kummi, od Džafera ibn Ebu Mugire, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Gospodar moći, Silan i Uzvišen, poslao je Iblisa. On je uzeo s površine Zemlje, od njene slatke i slane zemlje, pa je od toga stvorio Adema,","ar_ranges":[[0,163]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَعْقُوبُ الْقُمِّيُّ، عَنْ جَعْفَرِ بْنِ أَبِي الْمُغِيرَةِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>بَعَثَ رَبُّ الْعِزَّةِ عز وَجَلَّ إِبْلِيسَ، فَأَخَذَ مِنْ أَدِيمِ الأَرْضِ، مِنْ عَذْبِهَا وَمَلْحِهَا، فَخَلَقَ مِنْهُ آدَمَ،","bs_ranges":[[0,151]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jakub el-Kummi, od Džafera ibn Ebu Mugire, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: \u003c/span>„Gospodar moći, Silan i Uzvišen, poslao je Iblisa. On je uzeo s površine Zemlje, od njene slatke i slane zemlje, pa je od toga stvorio Adema,"}],"notes":[]},{"n":91,"ar":"وَمِنْ ثَمَّ سُمِّيَ آدَمَ، لأَنَّهُ خُلِقَ مِنْ أَدِيمِ الأَرْضِ، وَمِنْ ثَمَّ قَالَ إِبْلِيسُ:\n\n«أَأَسْجُدُ لِمَنْ خَلَقْتَ طِيناً» ، أَيْ هَذِهِ الطِّينَةُ أَنَا جِئْتُ بِهَا.\nحَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا أَبُو دَاوُدَ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي حُصَيْنٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: إِنَّمَا سُمِّيَ آدَمَ لأَنَّهُ خُلِقَ مِنْ أَدِيمِ الأَرْضِ حَدَّثَنِي أَحْمَدُ بْنُ إسحاق الأهوازي، قال: حدثنا أبو أحمد، قال:\n\nحدثنا مسعر، عن أبي حصين، عن سعيد بْنِ جُبَيْرٍ، قَالَ: خُلِقَ آدَمُ مِنْ أَدِيمِ الأَرْضِ فَسُمِّيَ آدَمَ.\nحَدَّثَنِي أَحْمَدُ بْنُ إِسْحَاقَ، قَالَ: حَدَّثَنَا أَبُو أَحْمَدَ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ ثَابِتٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، [عَنْ عَلِيٍّ رَضِيَ اللَّهُ عَنْهُ، قَالَ:\n\nإِنَّ آدَمَ خُلِقَ مِنْ أَدِيمِ الأَرْضِ، فِيهِ الطَّيِّبُ وَالصَّالِحُ وَالرَّدِيءُ، فَكُلُّ ذَلِكَ أَنْتَ رَاءٍ فِي وَلَدِهِ الصَّالِحِ وَالرَّدِيءِ] .\nحَدَّثَنِي يَعْقُوبُ بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ عَوْفٍ- وَحَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ وَعُمَرُ بْنُ شَبَّةَ، قَالا: حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، قَالَ:\nحَدَّثَنَا عَوْفٌ وَحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ وَمُحَمَّدُ بْنُ جَعْفَرٍ وَعَبْدُ الْوَهَّابِ الثَّقَفِيُّ، قَالُوا: حَدَّثَنَا عَوْفٌ وحدثني مُحَمَّدُ بْنُ عُمَارَةَ الأَسَدِيُّ، قَالَ: حَدَّثَنَا إِسْمَاعِيلُ بْنُ أَبَانٍ، قَالَ: حَدَّثَنَا عَنْبَسَةُ، عَنْ عَوْفٍ الأَعْرَابِيِّ- عَنْ قَسَامَةَ بْنِ زُهَيْرٍ، عَنْ أَبِي مُوسَى الأَشْعَرِيِّ، قَالَ: [قَالَ رسول الله ص: إِنَّ اللَّهَ خَلَقَ آدَمَ مِنْ قَبْضَةٍ قَبَضَهَا مِنْ جَمِيعِ الأَرْضِ، فَجَاءَ بَنُو آدَمَ عَلَى قَدْرِ الأَرْضِ، جَاءَ مِنْهُمُ الأَحْمَرُ، وَالأَسْوَدُ، وَالأَبْيَضُ، وَبَيْنَ ذَلِكَ وَالسَّهْلُ، وَالْحَزْنُ، وَالْخَبِيثُ، وَالطَّيِّبُ، ثُمَّ بُلَّتْ طِينَتُهُ حَتَّى صَارَتْ طِينًا لازِبًا، ثُمَّ تُرِكَتْ حَتَّى صَارَتْ حَمَأً مَسْنُونًا، ثُمَّ تُرِكَتْ حَتَّى صَارَتْ صَلْصَالا","bs":"\u003cp data-paragraph=\"91.1\">i zato je nazvan Adem, jer je stvoren od edima — površine Zemlje. Zato je Iblis rekao: ‘Zar da učinim sedždu onome koga si stvorio od gline?’ — to jest: ‘Ja sam donio ovu glinu.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:61, navedeni dio. „Edim“ prenosi riječ أديم na kojoj se zasniva navedeno objašnjenje imena.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"91.2\">Pričao nam je Ibn el-Musenna, koji je rekao: pričao nam je Ebu Davud, koji je rekao: pričao nam je Šu‘ba, od Ebu Husajna, od Seida ibn Džubejra, koji je rekao: „Nazvan je Adem zato što je stvoren od površine Zemlje.“\u003c/p>\u003cp data-paragraph=\"91.3\">Pričao mi je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričao nam je Mis‘ar, od Ebu Husajna, od Seida ibn Džubejra, koji je rekao: „Adem je stvoren od površine Zemlje, pa je nazvan Adem.“\u003c/p>\u003cp data-paragraph=\"91.4\">Pričao mi je Ahmed ibn Ishak, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričao nam je Amr ibn Sabit, od svoga oca, od svoga djeda, od Alija, radijallahu anhu, koji je rekao: „Adem je stvoren od površine Zemlje. U njoj ima dobroga, valjanoga i lošega. Sve to vidiš i među njegovim potomcima: valjane i loše.“\u003c/p>\u003cp data-paragraph=\"91.5\">Pričao mi je Jakub ibn Ibrahim, koji je rekao: pričao nam je Ibn Ulejja, od Avfa — a pričali su nam i Muhammed ibn Beššar i Omer ibn Šebbe; obojica su rekli: pričao nam je Jahja ibn Seid, koji je rekao: pričao nam je Avf. Pričao nam je i Ibn Beššar, koji je rekao: pričali su nam Ibn Ebu Adijj, Muhammed ibn Džafer i Abdulvehhab es-Sekafi; rekli su: pričao nam je Avf. Pričao mi je i Muhammed ibn Umara el-Esedi, koji je rekao: pričao nam je Ismail ibn Eban, koji je rekao: pričao nam je Anbesa, od Avfa el-A‘rabija — od Kasame ibn Zuhejra, od Ebu Muse el-Eš‘arija, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Allah je stvorio Adema od pregršti koju je zahvatio sa cijele Zemlje. Ademovi potomci došli su prema svojstvima Zemlje: među njima ima crvenih, crnih, bijelih i onih između toga; blagih i grubih, loših i dobrih. Zatim je njegova glina nakvašena dok nije postala ljepljiva glina. Zatim je ostavljena dok nije postala promijenjeno crno blato, pa je potom ostavljena dok nije postala suha glina,\u003c/p>","paragraphs":[{"id":"91.1","ar":"وَمِنْ ثَمَّ سُمِّيَ آدَمَ، لأَنَّهُ خُلِقَ مِنْ أَدِيمِ الأَرْضِ، وَمِنْ ثَمَّ قَالَ إِبْلِيسُ:\n\n«أَأَسْجُدُ لِمَنْ خَلَقْتَ طِيناً» ، أَيْ هَذِهِ الطِّينَةُ أَنَا جِئْتُ بِهَا.","bs":"i zato je nazvan Adem, jer je stvoren od edima — površine Zemlje. Zato je Iblis rekao: ‘Zar da učinim sedždu onome koga si stvorio od gline?’ — to jest: ‘Ja sam donio ovu glinu.’“ ⟦Prijevod kur’anskog navoda: El-Isra, 17:61, navedeni dio. „Edim“ prenosi riječ أديم na kojoj se zasniva navedeno objašnjenje imena.⟧","ar_ranges":[],"ar_html":"وَمِنْ ثَمَّ سُمِّيَ آدَمَ، لأَنَّهُ خُلِقَ مِنْ أَدِيمِ الأَرْضِ، وَمِنْ ثَمَّ قَالَ إِبْلِيسُ:\n\n«أَأَسْجُدُ لِمَنْ خَلَقْتَ طِيناً» ، أَيْ هَذِهِ الطِّينَةُ أَنَا جِئْتُ بِهَا.","bs_ranges":[],"bs_html":"i zato je nazvan Adem, jer je stvoren od edima — površine Zemlje. Zato je Iblis rekao: ‘Zar da učinim sedždu onome koga si stvorio od gline?’ — to jest: ‘Ja sam donio ovu glinu.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:61, navedeni dio. „Edim“ prenosi riječ أديم na kojoj se zasniva navedeno objašnjenje imena.⟧\u003c/span>"},{"id":"91.2","ar":"حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا أَبُو دَاوُدَ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي حُصَيْنٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: إِنَّمَا سُمِّيَ آدَمَ لأَنَّهُ خُلِقَ مِنْ أَدِيمِ الأَرْضِ","bs":"Pričao nam je Ibn el-Musenna, koji je rekao: pričao nam je Ebu Davud, koji je rekao: pričao nam je Šu‘ba, od Ebu Husajna, od Seida ibn Džubejra, koji je rekao: „Nazvan je Adem zato što je stvoren od površine Zemlje.“","ar_ranges":[[0,147]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا أَبُو دَاوُدَ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي حُصَيْنٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: \u003c/span>إِنَّمَا سُمِّيَ آدَمَ لأَنَّهُ خُلِقَ مِنْ أَدِيمِ الأَرْضِ","bs_ranges":[[0,160]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn el-Musenna, koji je rekao: pričao nam je Ebu Davud, koji je rekao: pričao nam je Šu‘ba, od Ebu Husajna, od Seida ibn Džubejra, koji je rekao: \u003c/span>„Nazvan je Adem zato što je stvoren od površine Zemlje.“"},{"id":"91.3","ar":"حَدَّثَنِي أَحْمَدُ بْنُ إسحاق الأهوازي، قال: حدثنا أبو أحمد، قال:\n\nحدثنا مسعر، عن أبي حصين، عن سعيد بْنِ جُبَيْرٍ، قَالَ: خُلِقَ آدَمُ مِنْ أَدِيمِ الأَرْضِ فَسُمِّيَ آدَمَ.","bs":"Pričao mi je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričao nam je Mis‘ar, od Ebu Husajna, od Seida ibn Džubejra, koji je rekao: „Adem je stvoren od površine Zemlje, pa je nazvan Adem.“","ar_ranges":[[0,123]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ إسحاق الأهوازي، قال: حدثنا أبو أحمد، قال:\n\nحدثنا مسعر، عن أبي حصين، عن سعيد بْنِ جُبَيْرٍ، قَالَ: \u003c/span>خُلِقَ آدَمُ مِنْ أَدِيمِ الأَرْضِ فَسُمِّيَ آدَمَ.","bs_ranges":[[0,171]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričao nam je Mis‘ar, od Ebu Husajna, od Seida ibn Džubejra, koji je rekao: \u003c/span>„Adem je stvoren od površine Zemlje, pa je nazvan Adem.“"},{"id":"91.4","ar":"حَدَّثَنِي أَحْمَدُ بْنُ إِسْحَاقَ، قَالَ: حَدَّثَنَا أَبُو أَحْمَدَ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ ثَابِتٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، [عَنْ عَلِيٍّ رَضِيَ اللَّهُ عَنْهُ، قَالَ:\n\nإِنَّ آدَمَ خُلِقَ مِنْ أَدِيمِ الأَرْضِ، فِيهِ الطَّيِّبُ وَالصَّالِحُ وَالرَّدِيءُ، فَكُلُّ ذَلِكَ أَنْتَ رَاءٍ فِي وَلَدِهِ الصَّالِحِ وَالرَّدِيءِ] .","bs":"Pričao mi je Ahmed ibn Ishak, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričao nam je Amr ibn Sabit, od svoga oca, od svoga djeda, od Alija, radijallahu anhu, koji je rekao: „Adem je stvoren od površine Zemlje. U njoj ima dobroga, valjanoga i lošega. Sve to vidiš i među njegovim potomcima: valjane i loše.“","ar_ranges":[[0,183]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ إِسْحَاقَ، قَالَ: حَدَّثَنَا أَبُو أَحْمَدَ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ ثَابِتٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، [عَنْ عَلِيٍّ رَضِيَ اللَّهُ عَنْهُ، قَالَ:\n\n\u003c/span>إِنَّ آدَمَ خُلِقَ مِنْ أَدِيمِ الأَرْضِ، فِيهِ الطَّيِّبُ وَالصَّالِحُ وَالرَّدِيءُ، فَكُلُّ ذَلِكَ أَنْتَ رَاءٍ فِي وَلَدِهِ الصَّالِحِ وَالرَّدِيءِ] .","bs_ranges":[[0,187]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ahmed ibn Ishak, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričao nam je Amr ibn Sabit, od svoga oca, od svoga djeda, od Alija, radijallahu anhu, koji je rekao: \u003c/span>„Adem je stvoren od površine Zemlje. U njoj ima dobroga, valjanoga i lošega. Sve to vidiš i među njegovim potomcima: valjane i loše.“"},{"id":"91.5","ar":"حَدَّثَنِي يَعْقُوبُ بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ عَوْفٍ- وَحَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ وَعُمَرُ بْنُ شَبَّةَ، قَالا: حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، قَالَ:\nحَدَّثَنَا عَوْفٌ وَحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ وَمُحَمَّدُ بْنُ جَعْفَرٍ وَعَبْدُ الْوَهَّابِ الثَّقَفِيُّ، قَالُوا: حَدَّثَنَا عَوْفٌ وحدثني مُحَمَّدُ بْنُ عُمَارَةَ الأَسَدِيُّ، قَالَ: حَدَّثَنَا إِسْمَاعِيلُ بْنُ أَبَانٍ، قَالَ: حَدَّثَنَا عَنْبَسَةُ، عَنْ عَوْفٍ الأَعْرَابِيِّ- عَنْ قَسَامَةَ بْنِ زُهَيْرٍ، عَنْ أَبِي مُوسَى الأَشْعَرِيِّ، قَالَ: [قَالَ رسول الله ص: إِنَّ اللَّهَ خَلَقَ آدَمَ مِنْ قَبْضَةٍ قَبَضَهَا مِنْ جَمِيعِ الأَرْضِ، فَجَاءَ بَنُو آدَمَ عَلَى قَدْرِ الأَرْضِ، جَاءَ مِنْهُمُ الأَحْمَرُ، وَالأَسْوَدُ، وَالأَبْيَضُ، وَبَيْنَ ذَلِكَ وَالسَّهْلُ، وَالْحَزْنُ، وَالْخَبِيثُ، وَالطَّيِّبُ، ثُمَّ بُلَّتْ طِينَتُهُ حَتَّى صَارَتْ طِينًا لازِبًا، ثُمَّ تُرِكَتْ حَتَّى صَارَتْ حَمَأً مَسْنُونًا، ثُمَّ تُرِكَتْ حَتَّى صَارَتْ صَلْصَالا","bs":"Pričao mi je Jakub ibn Ibrahim, koji je rekao: pričao nam je Ibn Ulejja, od Avfa — a pričali su nam i Muhammed ibn Beššar i Omer ibn Šebbe; obojica su rekli: pričao nam je Jahja ibn Seid, koji je rekao: pričao nam je Avf. Pričao nam je i Ibn Beššar, koji je rekao: pričali su nam Ibn Ebu Adijj, Muhammed ibn Džafer i Abdulvehhab es-Sekafi; rekli su: pričao nam je Avf. Pričao mi je i Muhammed ibn Umara el-Esedi, koji je rekao: pričao nam je Ismail ibn Eban, koji je rekao: pričao nam je Anbesa, od Avfa el-A‘rabija — od Kasame ibn Zuhejra, od Ebu Muse el-Eš‘arija, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Allah je stvorio Adema od pregršti koju je zahvatio sa cijele Zemlje. Ademovi potomci došli su prema svojstvima Zemlje: među njima ima crvenih, crnih, bijelih i onih između toga; blagih i grubih, loših i dobrih. Zatim je njegova glina nakvašena dok nije postala ljepljiva glina. Zatim je ostavljena dok nije postala promijenjeno crno blato, pa je potom ostavljena dok nije postala suha glina,","ar_ranges":[[0,606]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي يَعْقُوبُ بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ عَوْفٍ- وَحَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ وَعُمَرُ بْنُ شَبَّةَ، قَالا: حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، قَالَ:\nحَدَّثَنَا عَوْفٌ وَحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ وَمُحَمَّدُ بْنُ جَعْفَرٍ وَعَبْدُ الْوَهَّابِ الثَّقَفِيُّ، قَالُوا: حَدَّثَنَا عَوْفٌ وحدثني مُحَمَّدُ بْنُ عُمَارَةَ الأَسَدِيُّ، قَالَ: حَدَّثَنَا إِسْمَاعِيلُ بْنُ أَبَانٍ، قَالَ: حَدَّثَنَا عَنْبَسَةُ، عَنْ عَوْفٍ الأَعْرَابِيِّ- عَنْ قَسَامَةَ بْنِ زُهَيْرٍ، عَنْ أَبِي مُوسَى الأَشْعَرِيِّ، قَالَ: [قَالَ رسول الله ص: \u003c/span>إِنَّ اللَّهَ خَلَقَ آدَمَ مِنْ قَبْضَةٍ قَبَضَهَا مِنْ جَمِيعِ الأَرْضِ، فَجَاءَ بَنُو آدَمَ عَلَى قَدْرِ الأَرْضِ، جَاءَ مِنْهُمُ الأَحْمَرُ، وَالأَسْوَدُ، وَالأَبْيَضُ، وَبَيْنَ ذَلِكَ وَالسَّهْلُ، وَالْحَزْنُ، وَالْخَبِيثُ، وَالطَّيِّبُ، ثُمَّ بُلَّتْ طِينَتُهُ حَتَّى صَارَتْ طِينًا لازِبًا، ثُمَّ تُرِكَتْ حَتَّى صَارَتْ حَمَأً مَسْنُونًا، ثُمَّ تُرِكَتْ حَتَّى صَارَتْ صَلْصَالا","bs_ranges":[[0,581]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Jakub ibn Ibrahim, koji je rekao: pričao nam je Ibn Ulejja, od Avfa — a pričali su nam i Muhammed ibn Beššar i Omer ibn Šebbe; obojica su rekli: pričao nam je Jahja ibn Seid, koji je rekao: pričao nam je Avf. Pričao nam je i Ibn Beššar, koji je rekao: pričali su nam Ibn Ebu Adijj, Muhammed ibn Džafer i Abdulvehhab es-Sekafi; rekli su: pričao nam je Avf. Pričao mi je i Muhammed ibn Umara el-Esedi, koji je rekao: pričao nam je Ismail ibn Eban, koji je rekao: pričao nam je Anbesa, od Avfa el-A‘rabija — od Kasame ibn Zuhejra, od Ebu Muse el-Eš‘arija, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Allah je stvorio Adema od pregršti koju je zahvatio sa cijele Zemlje. Ademovi potomci došli su prema svojstvima Zemlje: među njima ima crvenih, crnih, bijelih i onih između toga; blagih i grubih, loših i dobrih. Zatim je njegova glina nakvašena dok nije postala ljepljiva glina. Zatim je ostavljena dok nije postala promijenjeno crno blato, pa je potom ostavljena dok nije postala suha glina,"}],"notes":[]},{"n":92,"ar":"كَمَا قَالَ اللَّهُ تَعَالَى: «وَلَقَدْ خَلَقْنَا الْإِنْسانَ مِنْ صَلْصالٍ مِنْ حَمَإٍ مَسْنُونٍ] » .\nوَحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ وَعَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، قَالا: حَدَّثَنَا سُفْيَانُ، عَنِ الأَعْمَشِ، عَنْ مُسْلِمٍ الْبُطَيْنِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: خُلِقَ آدَمُ مِنْ ثَلاثَةٍ: مِنْ صَلْصَالٍ، وَمِنْ حَمَإٍ، وَمِنْ طِينٍ لازِبٍ فَأَمَّا اللازِبُ فَالْجَيِّدُ، وَأَمَّا الْحَمَأُ فَالْحَمِئَةُ، وَأَمَّا الصَّلْصَالُ فَالتُّرَابُ الْمُدَقَّقُ، ويعنى تعالى ذكره بقوله: «مِنْ صَلْصالٍ*» ، مِنْ طِينٍ يَابِسٍ لَهُ صَلْصَلَةٌ، وَالصَّلْصَلَةُ: الصَّوْتُ.\nوَذَكَرَ أَنَّ اللَّهَ تعالى ذَكَرَهُ لَمَّا خَمَّرَ طِينَةَ آدَمَ تَرَكَهَا أَرْبَعِينَ لَيْلَةً، وَقِيلَ أَرْبَعِينَ عَامًا جَسَدًا مُلْقًى.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\nأَمَرَ اللَّهُ تَبَارَكَ وَتَعَالَى بِتُرْبَةِ آدَمَ فَرُفِعَتْ، فَخُلِقَ آدَمُ مِنْ طِينٍ لازِبٍ مِنْ حَمَإٍ مَسْنُونٍ قَالَ: وَإِنَّمَا كَانَ حَمَأً مَسْنُونًا بَعْدَ التُّرَابِ، قَالَ: فَخَلَقَ مِنْهُ آدَمَ بِيَدِهِ، قَالَ: فَمَكَثَ أَرْبَعِينَ لَيْلَةً جَسَدًا مُلْقًى، فَكَانَ إِبْلِيسُ يَأْتِيهِ فَيَضْرِبُهُ بِرِجْلِهِ، فَيُصَلْصِلُ فَيُصَوِّتُ، قَالَ: فَهُوَ قَوْلُ اللَّهِ تَبَارَكَ وَتَعَالَى: «مِنْ صَلْصالٍ كَالْفَخَّارِ» ، يَقُولُ: كَالشَّيْءِ الْمُنْفَرِجِ الَّذِي لَيْسَ بِمُصْمَتٍ، قَالَ: ثُمَّ يَدْخُلُ فِي فِيهِ وَيَخْرُجُ مِنْ دُبُرِهِ، وَيَدْخُلُ فِي دُبُرِهِ وَيَخْرُجُ مِنْ فِيهِ، ثُمَّ يَقُولُ:\nلَسْتَ شَيْئًا لِلصَّلْصَلَةِ، وَلِشَيْءٍ مَا خُلِقْتَ، وَلَئِنْ سُلِّطْتُ عَلَيْكَ لأُهْلِكَنَّكَ، وَلَئِنْ سُلِّطْتَ عَلَيَّ لاعصينك","bs":"\u003cp data-paragraph=\"92.1\">kako je Uzvišeni Allah rekao: I zaista smo čovjeka stvorili od suhe gline, od promijenjenog crnog blata.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Hidžr, 15:26.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"92.2\">Pričao nam je Ibn Beššar, koji je rekao: pričali su nam Jahja ibn Seid i Abdurrahman ibn Mehdi; obojica su rekli: pričao nam je Sufjan, od A‘meša, od Muslima el-Butajna, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Adem je stvoren od troje: od salsala, od hamea i od ljepljive gline. Lazib je dobar; hame je mulj; a salsal je usitnjena zemlja.“ On, Uzvišen je spomen Njegov, riječima „od salsala“ misli na suhu glinu koja zveči, a salsala je zvuk. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: sačuvani su nazivi صلصال („salsal“), حمإ („hame“) i لازب („lazib“) jer ih tekst pojedinačno objašnjava. Izraz من صلصال pojavljuje se u El-Hidžr, 15:26, 28 i 33, te Er-Rahman, 55:14.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"92.3\">Navedeno je da je Allah, Uzvišen je spomen Njegov, kada je umijesio Ademovu glinu, ostavio je četrdeset noći; rečeno je i četrdeset godina, kao položeno tijelo.\u003c/p>\u003cp data-paragraph=\"92.4\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"92.5\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Allah, Blagoslovljen i Uzvišen, naredio je da se donese zemlja za Adema, pa je podignuta. Adem je stvoren od ljepljive gline, od promijenjenog crnog blata.“ Rekao je: „Crno, promijenjeno blato nastalo je poslije zemlje.“ Rekao je: „Od njega je Svojom rukom stvorio Adema.“ Rekao je: „Četrdeset noći ostao je kao položeno tijelo. Iblis mu je dolazio, udarao ga nogom, a ono bi zazvečalo i pustilo zvuk.“ Rekao je: „To su riječi Allaha, Blagoslovljenog i Uzvišenog: ‘Od suhe gline poput grnčarije’ — znači poput nečega šupljeg, što nije puno.“ Rekao je: „Potom bi ulazio na njegova usta i izlazio kroz njegov stražnji otvor, te ulazio kroz njegov stražnji otvor i izlazio na usta. Zatim bi rekao: ‘Nisi ništa, jer zvečiš. Za neku si svrhu stvoren. Ako mi bude data vlast nad tobom, sigurno ću te uništiti; a ako tebi bude data vlast nada mnom, sigurno ću ti biti nepokoran.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Er-Rahman, 55:14, navedeni dio. Napomena prevodioca: rečenica لست شيئا للصلصلة je jezički neobična; „jer zvečiš“ ovdje je kontekstualno čitanje završnog izraza.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"92.1","ar":"كَمَا قَالَ اللَّهُ تَعَالَى: «وَلَقَدْ خَلَقْنَا الْإِنْسانَ مِنْ صَلْصالٍ مِنْ حَمَإٍ مَسْنُونٍ] » .","bs":"kako je Uzvišeni Allah rekao: I zaista smo čovjeka stvorili od suhe gline, od promijenjenog crnog blata.’“ ⟦Prijevod kur’anskog navoda: El-Hidžr, 15:26.⟧","ar_ranges":[],"ar_html":"كَمَا قَالَ اللَّهُ تَعَالَى: «وَلَقَدْ خَلَقْنَا الْإِنْسانَ مِنْ صَلْصالٍ مِنْ حَمَإٍ مَسْنُونٍ] » .","bs_ranges":[],"bs_html":"kako je Uzvišeni Allah rekao: I zaista smo čovjeka stvorili od suhe gline, od promijenjenog crnog blata.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Hidžr, 15:26.⟧\u003c/span>"},{"id":"92.2","ar":"وَحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ وَعَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، قَالا: حَدَّثَنَا سُفْيَانُ، عَنِ الأَعْمَشِ، عَنْ مُسْلِمٍ الْبُطَيْنِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: خُلِقَ آدَمُ مِنْ ثَلاثَةٍ: مِنْ صَلْصَالٍ، وَمِنْ حَمَإٍ، وَمِنْ طِينٍ لازِبٍ فَأَمَّا اللازِبُ فَالْجَيِّدُ، وَأَمَّا الْحَمَأُ فَالْحَمِئَةُ، وَأَمَّا الصَّلْصَالُ فَالتُّرَابُ الْمُدَقَّقُ، ويعنى تعالى ذكره بقوله: «مِنْ صَلْصالٍ*» ، مِنْ طِينٍ يَابِسٍ لَهُ صَلْصَلَةٌ، وَالصَّلْصَلَةُ: الصَّوْتُ.","bs":"Pričao nam je Ibn Beššar, koji je rekao: pričali su nam Jahja ibn Seid i Abdurrahman ibn Mehdi; obojica su rekli: pričao nam je Sufjan, od A‘meša, od Muslima el-Butajna, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Adem je stvoren od troje: od salsala, od hamea i od ljepljive gline. Lazib je dobar; hame je mulj; a salsal je usitnjena zemlja.“ On, Uzvišen je spomen Njegov, riječima „od salsala“ misli na suhu glinu koja zveči, a salsala je zvuk. ⟦Napomena prevodioca: sačuvani su nazivi صلصال لَةً، وَقِيلَ أَرْبَعِينَ عَامًا جَسَدًا مُلْقًى.","bs_ranges":[],"bs_html":"Navedeno je da je Allah, Uzvišen je spomen Njegov, kada je umijesio Ademovu glinu, ostavio je četrdeset noći; rečeno je i četrdeset godina, kao položeno tijelo."},{"id":"92.4","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"92.5","ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\nأَمَرَ اللَّهُ تَبَارَكَ وَتَعَالَى بِتُرْبَةِ آدَمَ فَرُفِعَتْ، فَخُلِقَ آدَمُ مِنْ طِينٍ لازِبٍ مِنْ حَمَإٍ مَسْنُونٍ قَالَ: وَإِنَّمَا كَانَ حَمَأً مَسْنُونًا بَعْدَ التُّرَابِ، قَالَ: فَخَلَقَ مِنْهُ آدَمَ بِيَدِهِ، قَالَ: فَمَكَثَ أَرْبَعِينَ لَيْلَةً جَسَدًا مُلْقًى، فَكَانَ إِبْلِيسُ يَأْتِيهِ فَيَضْرِبُهُ بِرِجْلِهِ، فَيُصَلْصِلُ فَيُصَوِّتُ، قَالَ: فَهُوَ قَوْلُ اللَّهِ تَبَارَكَ وَتَعَالَى: «مِنْ صَلْصالٍ كَالْفَخَّارِ» ، يَقُولُ: كَالشَّيْءِ الْمُنْفَرِجِ الَّذِي لَيْسَ بِمُصْمَتٍ، قَالَ: ثُمَّ يَدْخُلُ فِي فِيهِ وَيَخْرُجُ مِنْ دُبُرِهِ، وَيَدْخُلُ فِي دُبُرِهِ وَيَخْرُجُ مِنْ فِيهِ، ثُمَّ يَقُولُ:\nلَسْتَ شَيْئًا لِلصَّلْصَلَةِ، وَلِشَيْءٍ مَا خُلِقْتَ، وَلَئِنْ سُلِّطْتُ عَلَيْكَ لأُهْلِكَنَّكَ، وَلَئِنْ سُلِّطْتَ عَلَيَّ لاعصينك","bs":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Allah, Blagoslovljen i Uzvišen, naredio je da se donese zemlja za Adema, pa je podignuta. Adem je stvoren od ljepljive gline, od promijenjenog crnog blata.“ Rekao je: „Crno, promijenjeno blato nastalo je poslije zemlje.“ Rekao je: „Od njega je Svojom rukom stvorio Adema.“ Rekao je: „Četrdeset noći ostao je kao položeno tijelo. Iblis mu je dolazio, udarao ga nogom, a ono bi zazvečalo i pustilo zvuk.“ Rekao je: „To su riječi Allaha, Blagoslovljenog i Uzvišenog: ‘Od suhe gline poput grnčarije’ — znači poput nečega šupljeg, što nije puno.“ Rekao je: „Potom bi ulazio na njegova usta i izlazio kroz njegov stražnji otvor, te ulazio kroz njegov stražnji otvor i izlazio na usta. Zatim bi rekao: ‘Nisi ništa, jer zvečiš. Za neku si svrhu stvoren. Ako mi bude data vlast nad tobom, sigurno ću te uništiti; a ako tebi bude data vlast nada mnom, sigurno ću ti biti nepokoran.’“ ⟦Prijevod kur’anskog navoda: Er-Rahman, 55:14, navedeni dio. Napomena prevodioca: rečenica لست شيئا للصلصلة je jezički neobična; „jer zvečiš“ ovdje je kontekstualno čitanje završnog izraza.⟧","ar_ranges":[[0,175]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\u003c/span>أَمَرَ اللَّهُ تَبَارَكَ وَتَعَالَى بِتُرْبَةِ آدَمَ فَرُفِعَتْ، فَخُلِقَ آدَمُ مِنْ طِينٍ لازِبٍ مِنْ حَمَإٍ مَسْنُونٍ قَالَ: وَإِنَّمَا كَانَ حَمَأً مَسْنُونًا بَعْدَ التُّرَابِ، قَالَ: فَخَلَقَ مِنْهُ آدَمَ بِيَدِهِ، قَالَ: فَمَكَثَ أَرْبَعِينَ لَيْلَةً جَسَدًا مُلْقًى، فَكَانَ إِبْلِيسُ يَأْتِيهِ فَيَضْرِبُهُ بِرِجْلِهِ، فَيُصَلْصِلُ فَيُصَوِّتُ، قَالَ: فَهُوَ قَوْلُ اللَّهِ تَبَارَكَ وَتَعَالَى: «مِنْ صَلْصالٍ كَالْفَخَّارِ» ، يَقُولُ: كَالشَّيْءِ الْمُنْفَرِجِ الَّذِي لَيْسَ بِمُصْمَتٍ، قَالَ: ثُمَّ يَدْخُلُ فِي فِيهِ وَيَخْرُجُ مِنْ دُبُرِهِ، وَيَدْخُلُ فِي دُبُرِهِ وَيَخْرُجُ مِنْ فِيهِ، ثُمَّ يَقُولُ:\nلَسْتَ شَيْئًا لِلصَّلْصَلَةِ، وَلِشَيْءٍ مَا خُلِقْتَ، وَلَئِنْ سُلِّطْتُ عَلَيْكَ لأُهْلِكَنَّكَ، وَلَئِنْ سُلِّطْتَ عَلَيَّ لاعصينك","bs_ranges":[[0,172]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: \u003c/span>„Allah, Blagoslovljen i Uzvišen, naredio je da se donese zemlja za Adema, pa je podignuta. Adem je stvoren od ljepljive gline, od promijenjenog crnog blata.“ Rekao je: „Crno, promijenjeno blato nastalo je poslije zemlje.“ Rekao je: „Od njega je Svojom rukom stvorio Adema.“ Rekao je: „Četrdeset noći ostao je kao položeno tijelo. Iblis mu je dolazio, udarao ga nogom, a ono bi zazvečalo i pustilo zvuk.“ Rekao je: „To su riječi Allaha, Blagoslovljenog i Uzvišenog: ‘Od suhe gline poput grnčarije’ — znači poput nečega šupljeg, što nije puno.“ Rekao je: „Potom bi ulazio na njegova usta i izlazio kroz njegov stražnji otvor, te ulazio kroz njegov stražnji otvor i izlazio na usta. Zatim bi rekao: ‘Nisi ništa, jer zvečiš. Za neku si svrhu stvoren. Ako mi bude data vlast nad tobom, sigurno ću te uništiti; a ako tebi bude data vlast nada mnom, sigurno ću ti biti nepokoran.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Er-Rahman, 55:14, navedeni dio. Napomena prevodioca: rečenica لست شيئا للصلصلة je jezički neobična; „jer zvečiš“ ovdje je kontekstualno čitanje završnog izraza.⟧\u003c/span>"}],"notes":[]},{"n":93,"ar":"حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب رسول الله ص، قَالَ اللَّهُ لِلْمَلائِكَةِ: «إِنِّي خالِقٌ بَشَراً مِنْ طِينٍ.\nفَإِذا سَوَّيْتُهُ وَنَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ ساجِدِينَ» ، فَخَلَقَهُ اللَّهُ عَزَّ وَجَلَّ بِيَدَيْهِ لِكَيْلا يَتَكَبَّرُ ابليس عنه ليقول حين يتكبر: تتكبر عَمَّا عَمِلْتُ بِيَدِي وَلَمْ أَتَكَبَّرْ أَنَا عَنْهُ! فَخَلَقَهُ بَشَرًا، فَكَانَ جَسَدًا مِنْ طِينٍ أَرْبَعِينَ سَنَةً مِنْ مِقْدَارِ يَوْمِ الْجُمُعَةِ، فَمَرَّتْ بِهِ الْمَلائِكَةُ فَفَزِعُوا مِنْهُ لَمَّا رَأَوْهُ، وَكَانَ أَشَدَّهُمْ فَزَعًا إِبْلِيسَ، فَكَانَ يَمُرُّ بِهِ فَيَضْرِبُهُ فَيُصَوِّتُ الْجَسَدُ كَمَا يُصَوِّتُ الْفَخَّارُ تَكُونُ لَهُ صَلْصَلَةٌ، فذلك حين يقول: «مِنْ صَلْصالٍ كَالْفَخَّارِ» ، وَيَقُولُ: لأَمْرٍ مَا خُلِقْتَ وَدَخَلَ مِنْ فِيهِ وَخَرَجَ مِنْ دُبُرِهِ، فَقَالَ لِلْمَلائِكَةِ: لا تَرْهَبُوا مِنْ هَذَا، فَإِنَّ رَبَّكُمْ صَمَدٌ وَهَذَا أَجْوَفُ، لَئِنْ سُلِّطْتُ عَلَيْهِ لأُهْلِكَنَّهُ.\nوَحَدَّثَنَا عَنِ الْحَسَنِ بن بلال، قال: حدثنا حماد بن سلمة، عَنْ سُلَيْمَانَ التَّيْمِيِّ، عَنْ أَبِي عُثْمَانَ النَّهْدِيِّ، عَنْ سَلْمَانَ الْفَارِسِيِّ، قَالَ: خَمَّرَ اللَّهُ تَعَالَى طينه آدم ع أَرْبَعِينَ يَوْمًا، ثُمَّ جَمَعَهُ بِيَدَيْهِ، فَخَرَجَ طِيبُهُ بِيَمِينِهِ، وَخَبِيثُهُ بِشِمَالِهِ، ثُمَّ مَسَحَ يَدَيْهِ إِحْدَاهُمَا عَلَى الأُخْرَى، فَخَلَطَ بَعْضُهُ بِبَعْضٍ، فَمِنْ ثَمَّ يَخْرُجُ الطَّيِّبُ مِنَ الْخَبِيثِ، وَالْخَبِيثُ مِنَ الطَّيِّبِ.\nحَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابْنِ إِسْحَاقَ، قَالَ:\n\nيُقَالُ- وَاللَّهُ أَعْلَمُ: خَلَقَ اللَّهُ آدَمَ، ثُمَّ وَضَعَهُ يَنْظُرُ إِلَيْهِ أَرْبَعِينَ يَوْمًا قَبْلَ أَنْ يَنْفُخَ فِيهِ الرُّوحَ، حَتَّى عَادَ صَلْصَالا كَالْفَخَّارِ، وَلَمْ تَمَسَّهُ نَارٌ، قَالَ: فلما","bs":"\u003cp data-paragraph=\"93.1\">Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem: „Allah je rekao melekima: ‘Ja stvaram čovjeka od gline. Pa kada ga uredim i u njega udahnem od Svoga Duha, padnite mu na sedždu.’ Allah, Silan i Uzvišen, stvorio ga je Svojim dvjema rukama kako se Iblis ne bi oholio prema njemu i da bi mu, kada se uzoholi, rekao: ‘Oholiš se prema onome što sam Ja načinio Svojom rukom, a Ja se prema njemu nisam uzoholio!’ Stvorio ga je kao čovjeka, pa je četrdeset godina od trajanja dana petka bio tijelo od gline. Meleki su prolazili pored njega i prestrašili se kada su ga vidjeli. Najviše ga se prestrašio Iblis. Prolazio bi pored njega i udarao ga, a tijelo bi davalo zvuk poput grnčarije, imalo bi svoj zveket. To je ono kada kaže: ‘Od suhe gline poput grnčarije.’ Govorio bi: ‘Za neku si svrhu stvoren.’ Ušao je na njegova usta i izašao kroz njegov stražnji otvor, pa je melekima rekao: ‘Ne bojte se ovoga! Vaš je Gospodar Samed, a ovo je šuplje. Ako mi bude data vlast nad njim, sigurno ću ga uništiti.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Sad, 38:71–72, navedeni dio; Er-Rahman, 55:14, navedeni dio. Naziv صمد („Samed“) sačuvan je bez dodavanja tumačenja.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"93.2\">Preneseno nam je od Hasena ibn Bilala, koji je rekao: pričao nam je Hammad ibn Selema, od Sulejmana et-Tejmija, od Ebu Osmana en-Nehdija, od Selmana el-Farisija, koji je rekao: „Uzvišeni Allah mijesio je glinu Adema, alejhis-selam, četrdeset dana, zatim ju je sakupio Svojim dvjema rukama. Njeno dobro izašlo je u Njegovoj desnoj, a njeno loše u Njegovoj lijevoj ruci. Potom je protrljao jednu ruku o drugu i pomiješao jedno s drugim. Zato dobro izlazi iz lošega, a loše iz dobroga.“\u003c/p>\u003cp data-paragraph=\"93.3\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Govori se — a Allah najbolje zna — da je Allah stvorio Adema, zatim ga položio i gledao ga četrdeset dana prije nego što je u njega udahnuo duh, dok nije postao suha glina poput grnčarije, a vatra ga nije dotakla.“ Rekao je: „Kada je\u003c/p>","paragraphs":[{"id":"93.1","ar":"حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب رسول الله ص، قَالَ اللَّهُ لِلْمَلائِكَةِ: «إِنِّي خالِقٌ بَشَراً مِنْ طِينٍ.\nفَإِذا سَوَّيْتُهُ وَنَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ ساجِدِينَ» ، فَخَلَقَهُ اللَّهُ عَزَّ وَجَلَّ بِيَدَيْهِ لِكَيْلا يَتَكَبَّرُ ابليس عنه ليقول حين يتكبر: تتكبر عَمَّا عَمِلْتُ بِيَدِي وَلَمْ أَتَكَبَّرْ أَنَا عَنْهُ! فَخَلَقَهُ بَشَرًا، فَكَانَ جَسَدًا مِنْ طِينٍ أَرْبَعِينَ سَنَةً مِنْ مِقْدَارِ يَوْمِ الْجُمُعَةِ، فَمَرَّتْ بِهِ الْمَلائِكَةُ فَفَزِعُوا مِنْهُ لَمَّا رَأَوْهُ، وَكَانَ أَشَدَّهُمْ فَزَعًا إِبْلِيسَ، فَكَانَ يَمُرُّ بِهِ فَيَضْرِبُهُ فَيُصَوِّتُ الْجَسَدُ كَمَا يُصَوِّتُ الْفَخَّارُ تَكُونُ لَهُ صَلْصَلَةٌ، فذلك حين يقول: «مِنْ صَلْصالٍ كَالْفَخَّارِ» ، وَيَقُولُ: لأَمْرٍ مَا خُلِقْتَ وَدَخَلَ مِنْ فِيهِ وَخَرَجَ مِنْ دُبُرِهِ، فَقَالَ لِلْمَلائِكَةِ: لا تَرْهَبُوا مِنْ هَذَا، فَإِنَّ رَبَّكُمْ صَمَدٌ وَهَذَا أَجْوَفُ، لَئِنْ سُلِّطْتُ عَلَيْهِ لأُهْلِكَنَّهُ.","bs":"Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem: „Allah je rekao melekima: ‘Ja stvaram čovjeka od gline. Pa kada ga uredim i u njega udahnem od Svoga Duha, padnite mu na sedždu.’ Allah, Silan i Uzvišen, stvorio ga je Svojim dvjema rukama kako se Iblis ne bi oholio prema njemu i da bi mu, kada se uzoholi, rekao: ‘Oholiš se prema onome što sam Ja načinio Svojom rukom, a Ja se prema njemu nisam uzoholio!’ Stvorio ga je kao čovjeka, pa je četrdeset godina od trajanja dana petka bio tijelo od gline. Meleki su prolazili pored njega i prestrašili se kada su ga vidjeli. Najviše ga se prestrašio Iblis. Prolazio bi pored njega i udarao ga, a tijelo bi davalo zvuk poput grnčarije, imalo bi svoj zveket. To je ono kada kaže: ‘Od suhe gline poput grnčarije.’ Govorio bi: ‘Za neku si svrhu stvoren.’ Ušao je na njegova usta i izašao kroz njegov stražnji otvor, pa je melekima rekao: ‘Ne bojte se ovoga! Vaš je Gospodar Samed, a ovo je šuplje. Ako mi bude data vlast nad njim, sigurno ću ga uništiti.’“ ⟦Prijevodi kur’anskih navoda: Sad, 38:71–72, navedeni dio; Er-Rahman, 55:14, navedeni dio. Naziv صمد („Samed“) sačuvan je bez dodavanja tumačenja.⟧","ar_ranges":[[0,217]],"ar_html":"\u003cspan class=\"isnad\">حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب رسول الله ص، قَالَ اللَّهُ لِلْمَلائِكَةِ: \u003c/span>«إِنِّي خالِقٌ بَشَراً مِنْ طِينٍ.\nفَإِذا سَوَّيْتُهُ وَنَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ ساجِدِينَ» ، فَخَلَقَهُ اللَّهُ عَزَّ وَجَلَّ بِيَدَيْهِ لِكَيْلا يَتَكَبَّرُ ابليس عنه ليقول حين يتكبر: تتكبر عَمَّا عَمِلْتُ بِيَدِي وَلَمْ أَتَكَبَّرْ أَنَا عَنْهُ! فَخَلَقَهُ بَشَرًا، فَكَانَ جَسَدًا مِنْ طِينٍ أَرْبَعِينَ سَنَةً مِنْ مِقْدَارِ يَوْمِ الْجُمُعَةِ، فَمَرَّتْ بِهِ الْمَلائِكَةُ فَفَزِعُوا مِنْهُ لَمَّا رَأَوْهُ، وَكَانَ أَشَدَّهُمْ فَزَعًا إِبْلِيسَ، فَكَانَ يَمُرُّ بِهِ فَيَضْرِبُهُ فَيُصَوِّتُ الْجَسَدُ كَمَا يُصَوِّتُ الْفَخَّارُ تَكُونُ لَهُ صَلْصَلَةٌ، فذلك حين يقول: «مِنْ صَلْصالٍ كَالْفَخَّارِ» ، وَيَقُولُ: لأَمْرٍ مَا خُلِقْتَ وَدَخَلَ مِنْ فِيهِ وَخَرَجَ مِنْ دُبُرِهِ، فَقَالَ لِلْمَلائِكَةِ: لا تَرْهَبُوا مِنْ هَذَا، فَإِنَّ رَبَّكُمْ صَمَدٌ وَهَذَا أَجْوَفُ، لَئِنْ سُلِّطْتُ عَلَيْهِ لأُهْلِكَنَّهُ.","bs_ranges":[[0,306]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem: \u003c/span>„Allah je rekao melekima: ‘Ja stvaram čovjeka od gline. Pa kada ga uredim i u njega udahnem od Svoga Duha, padnite mu na sedždu.’ Allah, Silan i Uzvišen, stvorio ga je Svojim dvjema rukama kako se Iblis ne bi oholio prema njemu i da bi mu, kada se uzoholi, rekao: ‘Oholiš se prema onome što sam Ja načinio Svojom rukom, a Ja se prema njemu nisam uzoholio!’ Stvorio ga je kao čovjeka, pa je četrdeset godina od trajanja dana petka bio tijelo od gline. Meleki su prolazili pored njega i prestrašili se kada su ga vidjeli. Najviše ga se prestrašio Iblis. Prolazio bi pored njega i udarao ga, a tijelo bi davalo zvuk poput grnčarije, imalo bi svoj zveket. To je ono kada kaže: ‘Od suhe gline poput grnčarije.’ Govorio bi: ‘Za neku si svrhu stvoren.’ Ušao je na njegova usta i izašao kroz njegov stražnji otvor, pa je melekima rekao: ‘Ne bojte se ovoga! Vaš je Gospodar Samed, a ovo je šuplje. Ako mi bude data vlast nad njim, sigurno ću ga uništiti.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Sad, 38:71–72, navedeni dio; Er-Rahman, 55:14, navedeni dio. Naziv صمد („Samed“) sačuvan je bez dodavanja tumačenja.⟧\u003c/span>"},{"id":"93.2","ar":"وَحَدَّثَنَا عَنِ الْحَسَنِ بن بلال، قال: حدثنا حماد بن سلمة، عَنْ سُلَيْمَانَ التَّيْمِيِّ، عَنْ أَبِي عُثْمَانَ النَّهْدِيِّ، عَنْ سَلْمَانَ الْفَارِسِيِّ، قَالَ: خَمَّرَ اللَّهُ تَعَالَى طينه آدم ع أَرْبَعِينَ يَوْمًا، ثُمَّ جَمَعَهُ بِيَدَيْهِ، فَخَرَجَ طِيبُهُ بِيَمِينِهِ، وَخَبِيثُهُ بِشِمَالِهِ، ثُمَّ مَسَحَ يَدَيْهِ إِحْدَاهُمَا عَلَى الأُخْرَى، فَخَلَطَ بَعْضُهُ بِبَعْضٍ، فَمِنْ ثَمَّ يَخْرُجُ الطَّيِّبُ مِنَ الْخَبِيثِ، وَالْخَبِيثُ مِنَ الطَّيِّبِ.","bs":"Preneseno nam je od Hasena ibn Bilala, koji je rekao: pričao nam je Hammad ibn Selema, od Sulejmana et-Tejmija, od Ebu Osmana en-Nehdija, od Selmana el-Farisija, koji je rekao: „Uzvišeni Allah mijesio je glinu Adema, alejhis-selam, četrdeset dana, zatim ju je sakupio Svojim dvjema rukama. Njeno dobro izašlo je u Njegovoj desnoj, a njeno loše u Njegovoj lijevoj ruci. Potom je protrljao jednu ruku o drugu i pomiješao jedno s drugim. Zato dobro izlazi iz lošega, a loše iz dobroga.“","ar_ranges":[[0,165]],"ar_html":"\u003cspan class=\"isnad\">وَحَدَّثَنَا عَنِ الْحَسَنِ بن بلال، قال: حدثنا حماد بن سلمة، عَنْ سُلَيْمَانَ التَّيْمِيِّ، عَنْ أَبِي عُثْمَانَ النَّهْدِيِّ، عَنْ سَلْمَانَ الْفَارِسِيِّ، قَالَ: \u003c/span>خَمَّرَ اللَّهُ تَعَالَى طينه آدم ع أَرْبَعِينَ يَوْمًا، ثُمَّ جَمَعَهُ بِيَدَيْهِ، فَخَرَجَ طِيبُهُ بِيَمِينِهِ، وَخَبِيثُهُ بِشِمَالِهِ، ثُمَّ مَسَحَ يَدَيْهِ إِحْدَاهُمَا عَلَى الأُخْرَى، فَخَلَطَ بَعْضُهُ بِبَعْضٍ، فَمِنْ ثَمَّ يَخْرُجُ الطَّيِّبُ مِنَ الْخَبِيثِ، وَالْخَبِيثُ مِنَ الطَّيِّبِ.","bs_ranges":[[0,177]],"bs_html":"\u003cspan class=\"isnad\">Preneseno nam je od Hasena ibn Bilala, koji je rekao: pričao nam je Hammad ibn Selema, od Sulejmana et-Tejmija, od Ebu Osmana en-Nehdija, od Selmana el-Farisija, koji je rekao: \u003c/span>„Uzvišeni Allah mijesio je glinu Adema, alejhis-selam, četrdeset dana, zatim ju je sakupio Svojim dvjema rukama. Njeno dobro izašlo je u Njegovoj desnoj, a njeno loše u Njegovoj lijevoj ruci. Potom je protrljao jednu ruku o drugu i pomiješao jedno s drugim. Zato dobro izlazi iz lošega, a loše iz dobroga.“"},{"id":"93.3","ar":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابْنِ إِسْحَاقَ، قَالَ:\n\nيُقَالُ- وَاللَّهُ أَعْلَمُ: خَلَقَ اللَّهُ آدَمَ، ثُمَّ وَضَعَهُ يَنْظُرُ إِلَيْهِ أَرْبَعِينَ يَوْمًا قَبْلَ أَنْ يَنْفُخَ فِيهِ الرُّوحَ، حَتَّى عَادَ صَلْصَالا كَالْفَخَّارِ، وَلَمْ تَمَسَّهُ نَارٌ، قَالَ: فلما","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Govori se — a Allah najbolje zna — da je Allah stvorio Adema, zatim ga položio i gledao ga četrdeset dana prije nego što je u njega udahnuo duh, dok nije postao suha glina poput grnčarije, a vatra ga nije dotakla.“ Rekao je: „Kada je","ar_ranges":[[0,71]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابْنِ إِسْحَاقَ، قَالَ:\n\n\u003c/span>يُقَالُ- وَاللَّهُ أَعْلَمُ: خَلَقَ اللَّهُ آدَمَ، ثُمَّ وَضَعَهُ يَنْظُرُ إِلَيْهِ أَرْبَعِينَ يَوْمًا قَبْلَ أَنْ يَنْفُخَ فِيهِ الرُّوحَ، حَتَّى عَادَ صَلْصَالا كَالْفَخَّارِ، وَلَمْ تَمَسَّهُ نَارٌ، قَالَ: فلما","bs_ranges":[[0,93]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: \u003c/span>„Govori se — a Allah najbolje zna — da je Allah stvorio Adema, zatim ga položio i gledao ga četrdeset dana prije nego što je u njega udahnuo duh, dok nije postao suha glina poput grnčarije, a vatra ga nije dotakla.“ Rekao je: „Kada je"}],"notes":[]},{"n":94,"ar":"مَضَى لَهُ مِنَ الْمُدَّةِ مَا مَضَى وَهُوَ طِينٌ صَلْصَالٌ كَالْفَخَّارِ، وَأَرَادَ عَزَّ وَجَلَّ أَنْ يَنْفُخَ فِيهِ الرُّوحَ، تَقَدَّمَ إِلَى الْمَلائِكَةِ فَقَالَ لَهُمْ: إِذَا نَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ سَاجِدِينَ.\nفَلَمَّا نَفَخَ فِيهِ الرُّوحَ أَتَتْهُ الرُّوحُ مِنْ قِبَلِ رَأْسِهِ، فِيمَا ذُكِرَ عَنِ السَّلَفِ قَبْلِنَا أَنَّهُمْ قَالُوهُ.\n\nذِكْرُ مَنْ قَالَ ذلك:\nحدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابن مسعود- وعن ناس من اصحاب النبي ص: فَلَمَّا بَلَغَ الْحِينَ الَّذِي أَرَادَ اللَّهُ عَزَّ وَجَلَّ أَنْ يَنْفُخَ فِيهِ الرُّوحَ قَالَ لِلْمَلائِكَةِ: إِذَا نَفَخْتُ فِيهِ مِنْ رُوحِي فَاسْجُدُوا لَهُ، فَلَمَّا نَفَخَ فِيهِ الرُّوحَ فَدَخَلَ الرُّوحُ، فِي رَأْسِهِ عَطَسَ، فَقَالَتِ الْمَلائِكَةُ: قُلِ الْحَمْدُ لِلَّهِ، فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ اللَّهُ عَزَّ وَجَلَّ لَهُ: رَحِمَكَ رَبُّكَ فَلَمَّا دَخَلَ الرُّوحُ فِي عَيْنَيْهِ نَظَرَ إِلَى ثِمَارِ الْجَنَّةِ، فَلَمَّا دَخَلَ فِي جَوْفِهِ اشْتَهَى الطَّعَامَ، فَوَثَبَ قَبْلَ أَنْ تَبْلُغَ الرُّوحُ رِجْلَيْهِ عَجْلانَ إِلَى ثِمَارِ الْجَنَّةِ، فَذَلِكَ حِينَ يَقُولُ: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، «فَسَجَدَ الْمَلائِكَةُ كُلُّهُمْ أَجْمَعُونَ إِلَّا إِبْلِيسَ أَبى أَنْ يَكُونَ مَعَ السَّاجِدِينَ» ، «أَبى وَاسْتَكْبَرَ وَكانَ مِنَ الْكافِرِينَ» ، فقال الله له: «ما مَنَعَكَ أَلَّا تَسْجُدَ إِذْ أَمَرْتُكَ» لِمَا خَلَقْتُ بِيَدِي، قَالَ:\nأَنَا خَيْرٌ مِنْهُ، لَمْ أَكُنْ لأَسْجُدَ لِبَشَرٍ خَلَقْتَهُ مِنْ طِينٍ، قَالَ اللَّهُ لَهُ:\n\n«فَاهْبِطْ مِنْها فَما يَكُونُ لَكَ» - يَعْنِي مَا يَنْبَغِي لَكَ- «أَنْ تَتَكَبَّرَ","bs":"\u003cp data-paragraph=\"94.1\">proteklo onoliko vremena koliko je proteklo dok je bio glina, suha poput grnčarije, i kada je On, Silan i Uzvišen, htio u njega udahnuti duh, unaprijed je rekao melekima: ‘Kada u njega udahnem od Svoga Duha, padnite mu na sedždu.’“\u003c/p>\u003cp data-paragraph=\"94.2\">Kada je u njega udahnuo duh, duh mu je došao od strane glave, prema onome što je navedeno da su rekli prethodnici prije nas.\u003c/p>\u003cp data-paragraph=\"94.3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"94.4\">Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: „Kada je došlo vrijeme u kojem je Allah, Silan i Uzvišen, htio u njega udahnuti duh, rekao je melekima: ‘Kada u njega udahnem od Svoga Duha, učinite mu sedždu.’ Kada je u njega udahnuo duh i duh ušao u njegovu glavu, kihnuo je. Meleki su rekli: ‘Reci: Hvala Allahu!’ Rekao je: ‘Hvala Allahu!’ Allah, Silan i Uzvišen, rekao mu je: ‘Smilovao ti se tvoj Gospodar.’ Kada je duh ušao u njegove oči, pogledao je džennetske plodove; kada je ušao u njegovu nutrinu, poželio je hranu. Skočio je, žureći prema džennetskim plodovima prije nego što je duh stigao do njegovih nogu. To je ono kada kaže: ‘Čovjek je stvoren od žurbe.’ ‘Pa su svi meleki zajedno učinili sedždu, osim Iblisa; odbio je biti među onima koji su je učinili.’ ‘Odbio je, uzoholio se i bio od nevjernika.’ Allah mu je rekao: ‘Šta te spriječilo da učiniš sedždu kada sam ti naredio’ — onome što sam stvorio Svojim dvjema rukama? Odgovorio je: ‘Ja sam bolji od njega. Neću učiniti sedždu čovjeku kojeg si stvorio od gline.’ Allah mu je rekao: ‘Siđi iz njega! Nije ti dopušteno’ — to jest: ne dolikuje ti — ‘da se uzoholiš \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Enbija, 21:37, navedeni dio; El-Hidžr, 15:30–31; El-Bekara, 2:34, navedeni dio; El-A‘raf, 7:12, navedeni dio, uz izraz iz Sad, 38:75; El-A‘raf, 7:13, početak ajeta. Nalozi o sedždi na početku ove stranice prenose formulacije predaje, a nisu zasebni doslovni navodi punog ajeta.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"94.1","ar":"مَضَى لَهُ مِنَ الْمُدَّةِ مَا مَضَى وَهُوَ طِينٌ صَلْصَالٌ كَالْفَخَّارِ، وَأَرَادَ عَزَّ وَجَلَّ أَنْ يَنْفُخَ فِيهِ الرُّوحَ، تَقَدَّمَ إِلَى الْمَلائِكَةِ فَقَالَ لَهُمْ: إِذَا نَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ سَاجِدِينَ.","bs":"proteklo onoliko vremena koliko je proteklo dok je bio glina, suha poput grnčarije, i kada je On, Silan i Uzvišen, htio u njega udahnuti duh, unaprijed je rekao melekima: ‘Kada u njega udahnem od Svoga Duha, padnite mu na sedždu.’“","ar_ranges":[],"ar_html":"مَضَى لَهُ مِنَ الْمُدَّةِ مَا مَضَى وَهُوَ طِينٌ صَلْصَالٌ كَالْفَخَّارِ، وَأَرَادَ عَزَّ وَجَلَّ أَنْ يَنْفُخَ فِيهِ الرُّوحَ، تَقَدَّمَ إِلَى الْمَلائِكَةِ فَقَالَ لَهُمْ: إِذَا نَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ سَاجِدِينَ.","bs_ranges":[],"bs_html":"proteklo onoliko vremena koliko je proteklo dok je bio glina, suha poput grnčarije, i kada je On, Silan i Uzvišen, htio u njega udahnuti duh, unaprijed je rekao melekima: ‘Kada u njega udahnem od Svoga Duha, padnite mu na sedždu.’“"},{"id":"94.2","ar":"فَلَمَّا نَفَخَ فِيهِ الرُّوحَ أَتَتْهُ الرُّوحُ مِنْ قِبَلِ رَأْسِهِ، فِيمَا ذُكِرَ عَنِ السَّلَفِ قَبْلِنَا أَنَّهُمْ قَالُوهُ.","bs":"Kada je u njega udahnuo duh, duh mu je došao od strane glave, prema onome što je navedeno da su rekli prethodnici prije nas.","ar_ranges":[],"ar_html":"فَلَمَّا نَفَخَ فِيهِ الرُّوحَ أَتَتْهُ الرُّوحُ مِنْ قِبَلِ رَأْسِهِ، فِيمَا ذُكِرَ عَنِ السَّلَفِ قَبْلِنَا أَنَّهُمْ قَالُوهُ.","bs_ranges":[],"bs_html":"Kada je u njega udahnuo duh, duh mu je došao od strane glave, prema onome što je navedeno da su rekli prethodnici prije nas."},{"id":"94.3","ar":"ذِكْرُ مَنْ قَالَ ذلك:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذلك:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"94.4","ar":"حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابن مسعود- وعن ناس من اصحاب النبي ص: فَلَمَّا بَلَغَ الْحِينَ الَّذِي أَرَادَ اللَّهُ عَزَّ وَجَلَّ أَنْ يَنْفُخَ فِيهِ الرُّوحَ قَالَ لِلْمَلائِكَةِ: إِذَا نَفَخْتُ فِيهِ مِنْ رُوحِي فَاسْجُدُوا لَهُ، فَلَمَّا نَفَخَ فِيهِ kada sam ti naredio’ — onome što sam stvorio Svojim dvjema rukama? Odgovorio je: ‘Ja sam bolji od njega. Neću učiniti sedždu čovjeku kojeg si stvorio od gline.’ Allah mu je rekao: ‘Siđi iz njega! Nije ti dopušteno’ — to jest: ne dolikuje ti — ‘da se uzoholiš ⟦Prijevodi kur’anskih navoda: El-Enbija, 21:37, navedeni dio; El-Hidžr, 15:30–31; El-Bekara, 2:34, navedeni dio; El-A‘raf, 7:12, navedeni dio, uz izraz iz Sad, 38:75; El-A‘raf, 7:13, početak ajeta. Nalozi o sedždi na početku ove stranice prenose formulacije predaje, a nisu zasebni doslovni navodi punog ajeta.⟧","ar_ranges":[[0,184]],"ar_html":"\u003cspan class=\"isnad\">حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابن مسعود- وعن ناس من اصحاب النبي ص: \u003c/span>فَلَمَّا بَلَغَ الْحِينَ الَّذِي أَرَادَ اللَّهُ عَزَّ وَجَلَّ أَنْ يَنْفُخَ فِيهِ الرُّوحَ قَالَ لِلْمَلائِكَةِ: إِذَا نَفَخْتُ فِيهِ مِنْ رُوحِي فَاسْجُدُوا لَهُ، فَلَمَّا نَفَخَ فِيهِ الرُّوحَ فَدَخَلَ الرُّوحُ، فِي رَأْسِهِ عَطَسَ، فَقَالَتِ الْمَلائِكَةُ: قُلِ الْحَمْدُ لِلَّهِ، فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ اللَّهُ عَزَّ وَجَلَّ لَهُ: رَحِمَكَ رَبُّكَ فَلَمَّا دَخَلَ الرُّوحُ فِي عَيْنَيْهِ نَظَرَ إِلَى ثِمَارِ الْجَنَّةِ، فَلَمَّا دَخَلَ فِي جَوْفِهِ اشْتَهَى الطَّعَامَ، فَوَثَبَ قَبْلَ أَنْ تَبْلُغَ الرُّوحُ رِجْلَيْهِ عَجْلانَ إِلَى ثِمَارِ الْجَنَّةِ، فَذَلِكَ حِينَ يَقُولُ: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، «فَسَجَدَ الْمَلائِكَةُ كُلُّهُمْ أَجْمَعُونَ إِلَّا إِبْلِيسَ أَبى أَنْ يَكُونَ مَعَ السَّاجِدِينَ» ، «أَبى وَاسْتَكْبَرَ وَكانَ مِنَ الْكافِرِينَ» ، فقال الله له: «ما مَنَعَكَ أَلَّا تَسْجُدَ إِذْ أَمَرْتُكَ» لِمَا خَلَقْتُ بِيَدِي، قَالَ:\nأَنَا خَيْرٌ مِنْهُ، لَمْ أَكُنْ لأَسْجُدَ لِبَشَرٍ خَلَقْتَهُ مِنْ طِينٍ، قَالَ اللَّهُ لَهُ:\n\n«فَاهْبِطْ مِنْها فَما يَكُونُ لَكَ» - يَعْنِي مَا يَنْبَغِي لَكَ- «أَنْ تَتَكَبَّرَ","bs_ranges":[[0,300]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: \u003c/span>„Kada je došlo vrijeme u kojem je Allah, Silan i Uzvišen, htio u njega udahnuti duh, rekao je melekima: ‘Kada u njega udahnem od Svoga Duha, učinite mu sedždu.’ Kada je u njega udahnuo duh i duh ušao u njegovu glavu, kihnuo je. Meleki su rekli: ‘Reci: Hvala Allahu!’ Rekao je: ‘Hvala Allahu!’ Allah, Silan i Uzvišen, rekao mu je: ‘Smilovao ti se tvoj Gospodar.’ Kada je duh ušao u njegove oči, pogledao je džennetske plodove; kada je ušao u njegovu nutrinu, poželio je hranu. Skočio je, žureći prema džennetskim plodovima prije nego što je duh stigao do njegovih nogu. To je ono kada kaže: ‘Čovjek je stvoren od žurbe.’ ‘Pa su svi meleki zajedno učinili sedždu, osim Iblisa; odbio je biti među onima koji su je učinili.’ ‘Odbio je, uzoholio se i bio od nevjernika.’ Allah mu je rekao: ‘Šta te spriječilo da učiniš sedždu kada sam ti naredio’ — onome što sam stvorio Svojim dvjema rukama? Odgovorio je: ‘Ja sam bolji od njega. Neću učiniti sedždu čovjeku kojeg si stvorio od gline.’ Allah mu je rekao: ‘Siđi iz njega! Nije ti dopušteno’ — to jest: ne dolikuje ti — ‘da se uzoholiš \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Enbija, 21:37, navedeni dio; El-Hidžr, 15:30–31; El-Bekara, 2:34, navedeni dio; El-A‘raf, 7:12, navedeni dio, uz izraz iz Sad, 38:75; El-A‘raf, 7:13, početak ajeta. Nalozi o sedždi na početku ove stranice prenose formulacije predaje, a nisu zasebni doslovni navodi punog ajeta.⟧\u003c/span>"}],"notes":[]},{"n":95,"ar":"فِيها فَاخْرُجْ إِنَّكَ مِنَ الصَّاغِرِينَ» ، وَالصّغَارُ الذُّلُّ.\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: فَلَمَّا نَفَخَ اللَّهُ عَزَّ وَجَلَّ فِيهِ- يَعْنِي فِي آدَمَ- مِنْ رُوحِهِ أَتَتِ النَّفْخَةُ مِنْ قِبَلِ رَأْسِهِ، فَجَعَلَ لا يَجْرِي شَيْءٌ مِنْهَا فِي جَسَدِهِ إِلا صَارَ لَحْمًا وَدَمًا، فَلَمَّا انْتَهَتِ النَّفْخَةُ إِلَى سُرَّتِهِ نَظَرَ إِلَى جَسَدِهِ فَأَعْجَبَهُ مَا رَأَى مِنْ حُسْنِهِ، فَذَهَبَ لِيَنْهَضَ فَلَمْ يَقْدِرْ، فَهُوَ قَوْلُ الله عز وجل «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: ضَجِرًا لا صَبْرَ لَهُ عَلَى سَرَّاءٍ وَلا ضَرَّاءٍ، قَالَ: فَلَمَّا تَمَّتِ النَّفْخَةُ فِي جَسَدِهِ عَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، بِإِلْهَامِ اللَّهِ، فَقَالَ: يَرْحَمُكَ اللَّهُ يَا آدَمُ، ثُمَّ قَالَ لِلْمَلائِكَةِ الَّذِينَ كَانُوا مَعَ إِبْلِيسَ خَاصَّةً دُونَ الْمَلائِكَةِ الَّذِينَ فِي السَّمَوَاتُ: اسْجُدُوا لآدَمَ، فَسَجَدُوا كُلُّهُمْ أَجْمَعُونَ إِلا إِبْلِيسَ أَبَى وَاسْتَكْبَرَ، لِمَا كَانَ حَدَّثَ بِهِ نَفْسَهُ مِنْ كبره واغتراره، فقال: لا اسجد، وَأَنَا خَيْرٌ مِنْهُ وَأَكْبَرُ سِنًّا، وَأَقْوَى خَلْقًا، «خَلَقْتَنِي مِنْ نارٍ وَخَلَقْتَهُ مِنْ طِينٍ*» ، يَقُولُ: إِنَّ النَّارَ أَقْوَى مِنَ الطِّينِ، قَالَ: فَلَمَّا أَبَى إِبْلِيسُ أَنْ يَسْجُدَ أَبْلَسَهُ اللَّهُ تعالى، أيأسه مِنَ الْخَيْرِ كُلِّهِ، وَجَعَلَهُ شَيْطَانًا رَجِيمًا عُقُوبَةً لِمَعْصِيَتِهِ.\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ، حَدَّثَنَا سَلَمَةُ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، قَالَ:\n\nفَيُقَالُ- وَاللَّهُ أَعْلَمُ-: إِنَّهُ لَمَّا انْتَهَى الرُّوحُ إِلَى رَأْسِهِ عَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، قَالَ: فَقَالَ لَهُ رَبُّهُ: يَرْحَمُكَ رَبُّكَ، وَوَقَعَتِ الْمَلائِكَةُ حِينَ اسْتَوَى سُجُودًا لَهُ، حِفْظًا لِعَهْدِ اللَّهِ الَّذِي عَهِدَ إِلَيْهِمْ، وَطَاعَةً لأَمْرِهِ الَّذِي أَمَرَهُمْ بِهِ، وَقَامَ عدو الله ابليس من بينهم، فلم يسجد متكبرا متعظما بغيا وحسدا، فقال:\n«يَا إِبْلِيسُ مَا مَنَعَكَ أَنْ تَسْجُدَ لِما خَلَقْتُ بِيَدَيَّ» إِلَى قَوْلِهِ: «لَأَمْلَأَنَ","bs":"\u003cp data-paragraph=\"95.1\">u njemu. Zato izađi! Ti si od poniženih.’ A sagar znači poniženje.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:13, nastavak. „Sagar“ prenosi الصغار, riječ koju autor objašnjava.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"95.2\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Kada je Allah, Silan i Uzvišen, u njega — misli se na Adema — udahnuo od Svoga Duha, dah je došao od njegove glave. Kuda god bi po njegovom tijelu prošao, to bi postalo meso i krv. Kada je dah stigao do njegovog pupka, pogledao je svoje tijelo i zadivio se ljepoti koju je vidio. Pokušao je ustati, ali nije mogao. To su riječi Allaha, Silnog i Uzvišenog: ‘Čovjek je stvoren od žurbe.’“ Rekao je: „Nemiran je; nema strpljenja ni u blagostanju ni u nevolji.“ Rekao je: „Kada je dah ispunio cijelo njegovo tijelo, kihnuo je i, Allahovim nadahnućem, rekao: ‘Hvala Allahu, Gospodaru svjetova.’ Rekao je: ‘Allah ti se smilovao, Ademe!’ Zatim je samo melekima koji su bili s Iblisom, a ne melekima na nebesima, rekao: ‘Učinite sedždu Ademu!’ Svi su zajedno učinili sedždu osim Iblisa, koji je odbio i uzoholio se zbog oholosti i samodopadnosti o kojima je razmišljao u sebi. Rekao je: ‘Neću učiniti sedždu! Ja sam bolji od njega, stariji i snažnijeg stvaranja. Mene si stvorio od vatre, a njega si stvorio od gline.’ Kaže: ‘Vatra je snažnija od gline.’“ Rekao je: „Kada je Iblis odbio učiniti sedždu, Uzvišeni Allah bacio ga je u očaj, lišio ga nade u svako dobro i učinio ga prokletim šejtanom kao kaznu za njegovu nepokornost.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Enbija, 21:37, navedeni dio; „Mene si stvorio od vatre, a njega si stvorio od gline“ nalazi se u El-A‘raf, 7:12, i Sad, 38:76.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"95.3\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, koji je rekao: „Govori se — a Allah najbolje zna — da je, kada je duh stigao u njegovu glavu, kihnuo i rekao: ‘Hvala Allahu!’“ Rekao je: „Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar.’ Kada je poprimio potpun oblik, meleki su mu pali na sedždu, čuvajući Allahov zavjet koji im je dao i pokoravajući se naredbi koju im je naredio. Allahov neprijatelj Iblis stajao je među njima i nije učinio sedždu, uzoholivši se i uzvisujući se iz nasilnosti i zavisti. Rekao je: ‘Iblise, šta te spriječilo da učiniš sedždu onome što sam stvorio Svojim dvjema rukama?’ — do Njegovih riječi: ‘Sigurno ću napuniti \u003cspan class=\"translator-note\">⟦Prijevod početka navoda: Sad, 38:75; završni navod nastavlja se na sljedećoj stranici i pripada Sad, 38:85. Izraz „do Njegovih riječi“ nalazi se u samom izvoru; međutekst nije izostavljen tokom ovog prijevoda.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"95.1","ar":"فِيها فَاخْرُجْ إِنَّكَ مِنَ الصَّاغِرِينَ» ، وَالصّغَارُ الذُّلُّ.","bs":"u njemu. Zato izađi! Ti si od poniženih.’ A sagar znači poniženje.“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:13, nastavak. „Sagar“ prenosi الصغار, riječ koju autor objašnjava.⟧","ar_ranges":[],"ar_html":"فِيها فَاخْرُجْ إِنَّكَ مِنَ الصَّاغِرِينَ» ، وَالصّغَارُ الذُّلُّ.","bs_ranges":[],"bs_html":"u njemu. Zato izađi! Ti si od poniženih.’ A sagar znači poniženje.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:13, nastavak. „Sagar“ prenosi الصغار, riječ koju autor objašnjava.⟧\u003c/span>"},{"id":"95.2","ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: فَلَمَّا نَفَخَ اللَّهُ عَزَّ وَجَلَّ فِيهِ- يَعْنِي فِي آدَمَ- مِنْ رُوحِهِ أَتَتِ النَّفْخَةُ مِنْ قِبَلِ رَأْسِهِ، فَجَعَلَ لا يَجْرِي شَيْءٌ مِنْهَا فِي جَسَدِهِ إِلا صَارَ لَحْمًا وَدَمًا، فَلَمَّا انْتَهَتِ النَّفْخَةُ إِلَى سُرَّتِهِ نَظَرَ إِلَى جَسَدِهِ فَأَعْجَبَهُ مَا رَأَى مِنْ حُسْنِهِ، فَذَهَبَ لِيَنْهَضَ فَلَمْ يَقْدِرْ، فَهُوَ قَوْلُ الله عز وجل «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: ضَجِرًا لا صَبْرَ لَهُ عَلَى سَرَّاءٍ وَلا ضَرَّاءٍ، قَالَ: فَلَمَّا تَمَّتِ النَّفْخَةُ فِي جَسَدِهِ عَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، بِإِلْهَامِ اللَّهِ، فَقَالَ: يَرْحَمُكَ اللَّهُ يَا آدَمُ، ثُمَّ قَالَ لِلْمَلائِكَةِ الَّذِينَ كَانُوا مَعَ إِبْلِيسَ خَاصَّةً دُونَ الْمَلائِكَةِ الَّذِينَ فِي السَّمَوَاتُ: اسْجُدُوا لآدَمَ، فَسَجَدُوا كُلُّهُمْ أَجْمَعُونَ إِلا إِبْلِيسَ أَبَى وَاسْتَكْبَرَ، لِمَا كَانَ حَدَّثَ بِهِ نَفْسَهُ مِنْ كبره واغتراره، فقال: لا اسجد، وَأَنَا خَيْرٌ مِنْهُ وَأَكْبَرُ سِنًّا، وَأَقْوَى خَلْقًا، «خَلَقْتَنِي مِنْ نارٍ وَخَلَقْتَهُ مِنْ طِينٍ*» ، يَقُولُ: إِنَّ النَّارَ أَقْوَى مِنَ الطِّينِ، قَالَ: فَلَمَّا أَبَى إِبْلِيسُ أَنْ يَسْجُدَ أَبْلَسَهُ اللَّهُ تعالى، أيأسه مِنَ الْخَيْرِ كُلِّهِ، وَجَعَلَهُ شَيْطَانًا رَجِيمًا عُقُوبَةً لِمَعْصِيَتِهِ.","bs":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Kada je Allah, Silan i Uzvišen, u njega — misli se na Adema — udahnuo od Svoga Duha, dah je došao od njegove glave. Kuda god bi po njegovom tijelu prošao, to bi postalo meso i krv. Kada je dah stigao do njegovog pupka, pogledao je svoje tijelo i zadivio se ljepoti koju je vidio. Pokušao je ustati, ali nije mogao. To su riječi Allaha, Silnog i Uzvišenog: ‘Čovjek je stvoren od žurbe.’“ Rekao je: „Nemiran je; nema strpljenja ni u blagostanju ni u nevolji.“ Rekao je: „Kada je dah ispunio cijelo njegovo tijelo, kihnuo je i, Allahovim nadahnućem, rekao: ‘Hvala Allahu, Gospodaru svjetova.’ Rekao je: ‘Allah ti se smilovao, Ademe!’ Zatim je samo melekima koji su bili s Iblisom, a ne melekima na nebesima, rekao: ‘Učinite sedždu Ademu!’ Svi su zajedno učinili sedždu osim Iblisa, koji je odbio i uzoholio se zbog oholosti i samodopadnosti o kojima je razmišljao u sebi. Rekao je: ‘Neću učiniti sedždu! Ja sam bolji od njega, stariji i snažnijeg stvaranja. Mene si stvorio od vatre, a njega si stvorio od gline.’ Kaže: ‘Vatra je snažnija od gline.’“ Rekao je: „Kada je Iblis odbio učiniti sedždu, Uzvišeni Allah bacio ga je u očaj, lišio ga nade u svako dobro i učinio ga prokletim šejtanom kao kaznu za njegovu nepokornost.“ ⟦Prijevodi kur’anskih navoda: El-Enbija, 21:37, navedeni dio; „Mene si stvorio od vatre, a njega si stvorio od gline“ nalazi se u El-A‘raf, 7:12, i Sad, 38:76.⟧","ar_ranges":[[0,175]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>فَلَمَّا نَفَخَ اللَّهُ عَزَّ وَجَلَّ فِيهِ- يَعْنِي فِي آدَمَ- مِنْ رُوحِهِ أَتَتِ النَّفْخَةُ مِنْ قِبَلِ رَأْسِهِ، فَجَعَلَ لا يَجْرِي شَيْءٌ مِنْهَا فِي جَسَدِهِ إِلا صَارَ لَحْمًا وَدَمًا، فَلَمَّا انْتَهَتِ النَّفْخَةُ إِلَى سُرَّتِهِ نَظَرَ إِلَى جَسَدِهِ فَأَعْجَبَهُ مَا رَأَى مِنْ حُسْنِهِ، فَذَهَبَ لِيَنْهَضَ فَلَمْ يَقْدِرْ، فَهُوَ قَوْلُ الله عز وجل «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: ضَجِرًا لا صَبْرَ لَهُ عَلَى سَرَّاءٍ وَلا ضَرَّاءٍ، قَالَ: فَلَمَّا تَمَّتِ النَّفْخَةُ فِي جَسَدِهِ عَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، بِإِلْهَامِ اللَّهِ، فَقَالَ: يَرْحَمُكَ اللَّهُ يَا آدَمُ، ثُمَّ قَالَ لِلْمَلائِكَةِ الَّذِينَ كَانُوا مَعَ إِبْلِيسَ خَاصَّةً دُونَ الْمَلائِكَةِ الَّذِينَ فِي السَّمَوَاتُ: اسْجُدُوا لآدَمَ، فَسَجَدُوا كُلُّهُمْ أَجْمَعُونَ إِلا إِبْلِيسَ أَبَى وَاسْتَكْبَرَ، لِمَا كَانَ حَدَّثَ بِهِ نَفْسَهُ مِنْ كبره واغتراره، فقال: لا اسجد، وَأَنَا خَيْرٌ مِنْهُ وَأَكْبَرُ سِنًّا، وَأَقْوَى خَلْقًا، «خَلَقْتَنِي مِنْ نارٍ وَخَلَقْتَهُ مِنْ طِينٍ*» ، يَقُولُ: إِنَّ النَّارَ أَقْوَى مِنَ الطِّينِ، قَالَ: فَلَمَّا أَبَى إِبْلِيسُ أَنْ يَسْجُدَ أَبْلَسَهُ اللَّهُ تعالى، أيأسه مِنَ الْخَيْرِ كُلِّهِ، وَجَعَلَهُ شَيْطَانًا رَجِيمًا عُقُوبَةً لِمَعْصِيَتِهِ.","bs_ranges":[[0,172]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: \u003c/span>„Kada je Allah, Silan i Uzvišen, u njega — misli se na Adema — udahnuo od Svoga Duha, dah je došao od njegove glave. Kuda god bi po njegovom tijelu prošao, to bi postalo meso i krv. Kada je dah stigao do njegovog pupka, pogledao je svoje tijelo i zadivio se ljepoti koju je vidio. Pokušao je ustati, ali nije mogao. To su riječi Allaha, Silnog i Uzvišenog: ‘Čovjek je stvoren od žurbe.’“ Rekao je: „Nemiran je; nema strpljenja ni u blagostanju ni u nevolji.“ Rekao je: „Kada je dah ispunio cijelo njegovo tijelo, kihnuo je i, Allahovim nadahnućem, rekao: ‘Hvala Allahu, Gospodaru svjetova.’ Rekao je: ‘Allah ti se smilovao, Ademe!’ Zatim je samo melekima koji su bili s Iblisom, a ne melekima na nebesima, rekao: ‘Učinite sedždu Ademu!’ Svi su zajedno učinili sedždu osim Iblisa, koji je odbio i uzoholio se zbog oholosti i samodopadnosti o kojima je razmišljao u sebi. Rekao je: ‘Neću učiniti sedždu! Ja sam bolji od njega, stariji i snažnijeg stvaranja. Mene si stvorio od vatre, a njega si stvorio od gline.’ Kaže: ‘Vatra je snažnija od gline.’“ Rekao je: „Kada je Iblis odbio učiniti sedždu, Uzvišeni Allah bacio ga je u očaj, lišio ga nade u svako dobro i učinio ga prokletim šejtanom kao kaznu za njegovu nepokornost.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Enbija, 21:37, navedeni dio; „Mene si stvorio od vatre, a njega si stvorio od gline“ nalazi se u El-A‘raf, 7:12, i Sad, 38:76.⟧\u003c/span>"},{"id":"95.3","ar":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ، حَدَّثَنَا سَلَمَةُ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، قَالَ:\n\nفَيُقَالُ- وَاللَّهُ أَعْلَمُ-: إِنَّهُ لَمَّا انْتَهَى الرُّوحُ إِلَى رَأْسِهِ عَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، قَالَ: فَقَالَ لَهُ رَبُّهُ: يَرْحَمُكَ رَبُّكَ، وَوَقَعَتِ الْمَلائِكَةُ حِينَ اسْتَوَى سُجُودًا لَهُ، حِفْظًا لِعَهْدِ اللَّهِ الَّذِي عَهِدَ إِلَيْهِمْ، وَطَاعَةً لأَمْرِهِ الَّذِي أَمَرَهُمْ بِهِ، وَقَامَ عدو الله ابليس من بينهم، فلم يسجد متكبرا متعظما بغيا وحسدا، فقال:\n«يَا إِبْلِيسُ مَا مَنَعَكَ أَنْ تَسْجُدَ لِما خَلَقْتُ بِيَدَيَّ» إِلَى قَوْلِهِ: «لَأَمْلَأَنَ","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, koji je rekao: „Govori se — a Allah najbolje zna — da je, kada je duh stigao u njegovu glavu, kihnuo i rekao: ‘Hvala Allahu!’“ Rekao je: „Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar.’ Kada je poprimio potpun oblik, meleki su mu pali na sedždu, čuvajući Allahov zavjet koji im je dao i pokoravajući se naredbi koju im je naredio. Allahov neprijatelj Iblis stajao je među njima i nije učinio sedždu, uzoholivši se i uzvisujući se iz nasilnosti i zavisti. Rekao je: ‘Iblise, šta te spriječilo da učiniš sedždu onome što sam stvorio Svojim dvjema rukama?’ — do Njegovih riječi: ‘Sigurno ću napuniti ⟦Prijevod početka navoda: Sad, 38:75; završni navod nastavlja se na sljedećoj stranici i pripada Sad, 38:85. Izraz „do Njegovih riječi“ nalazi se u samom izvoru; međutekst nije izostavljen tokom ovog prijevoda.⟧","ar_ranges":[[0,94]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ، حَدَّثَنَا سَلَمَةُ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، قَالَ:\n\n\u003c/span>فَيُقَالُ- وَاللَّهُ أَعْلَمُ-: إِنَّهُ لَمَّا انْتَهَى الرُّوحُ إِلَى رَأْسِهِ عَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، قَالَ: فَقَالَ لَهُ رَبُّهُ: يَرْحَمُكَ رَبُّكَ، وَوَقَعَتِ الْمَلائِكَةُ حِينَ اسْتَوَى سُجُودًا لَهُ، حِفْظًا لِعَهْدِ اللَّهِ الَّذِي عَهِدَ إِلَيْهِمْ، وَطَاعَةً لأَمْرِهِ الَّذِي أَمَرَهُمْ بِهِ، وَقَامَ عدو الله ابليس من بينهم، فلم يسجد متكبرا متعظما بغيا وحسدا، فقال:\n«يَا إِبْلِيسُ مَا مَنَعَكَ أَنْ تَسْجُدَ لِما خَلَقْتُ بِيَدَيَّ» إِلَى قَوْلِهِ: «لَأَمْلَأَنَ","bs_ranges":[[0,103]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, koji je rekao: \u003c/span>„Govori se — a Allah najbolje zna — da je, kada je duh stigao u njegovu glavu, kihnuo i rekao: ‘Hvala Allahu!’“ Rekao je: „Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar.’ Kada je poprimio potpun oblik, meleki su mu pali na sedždu, čuvajući Allahov zavjet koji im je dao i pokoravajući se naredbi koju im je naredio. Allahov neprijatelj Iblis stajao je među njima i nije učinio sedždu, uzoholivši se i uzvisujući se iz nasilnosti i zavisti. Rekao je: ‘Iblise, šta te spriječilo da učiniš sedždu onome što sam stvorio Svojim dvjema rukama?’ — do Njegovih riječi: ‘Sigurno ću napuniti \u003cspan class=\"translator-note\">⟦Prijevod početka navoda: Sad, 38:75; završni navod nastavlja se na sljedećoj stranici i pripada Sad, 38:85. Izraz „do Njegovih riječi“ nalazi se u samom izvoru; međutekst nije izostavljen tokom ovog prijevoda.⟧\u003c/span>"}],"notes":[]},{"n":96,"ar":"جَهَنَّمَ مِنْكَ وَمِمَّنْ تَبِعَكَ مِنْهُمْ أَجْمَعِينَ» ، قَالَ: فَلَمَّا فَرَغَ اللَّهُ تعالى مِنْ إِبْلِيسَ وَمُعَاتَبَتِهِ وَأَبَى إِلا الْمَعْصِيَةَ أَوْقَعَ اللَّهُ تعالى عَلَيْهِ اللَّعْنَةَ، وَأَخْرَجَهُ مِنَ الْجَنَّةِ.\n\nحَدَّثَنِي مُحَمَّدُ بْنُ خَلَفٍ، قَالَ: حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، قَالَ:\nحَدَّثَنَا أَبُو خَالِدٍ سُلَيْمَانُ بْنُ حَيَّانَ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ، ع قَالَ أَبُو خَالِدٍ: وحدثني الأَعْمَشُ عَنْ أَبِي صالح، عن ابى هريرة، عن النبي ص قَالَ أَبُو خَالِدٍ:\nوحدثني دَاوُدُ بْنُ أَبِي هِنْدٍ عَنِ الشَّعْبِيِّ، عَنْ أَبِي هُرَيْرَةَ عَنِ النبي ص قَالَ أَبُو خَالِدٍ: وحدثني ابْنُ أَبِي ذُبَابٍ الدَّوْسِيُّ، قَالَ: حَدَّثَنِي سَعِيدٌ الْمَقْبُرِيُّ، وَيَزِيدُ بْنُ هرمز عن ابى هريرة، [عن النبي ص أَنَّهُ قَالَ: خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ بِيَدِهِ، وَنَفَخَ فِيهِ مِنْ رُوحِهِ، وَأَمَرَ الْمَلأَ مِنَ الْمَلائِكَةِ فَسَجَدُوا لَهُ، فَجَلَسَ فَعَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ لَهُ رَبُّهُ: يَرْحَمُكَ رَبُّكَ، ايت أُولَئِكَ الْمَلأَ مِنَ الْمَلائِكَةِ فَقُلْ لَهُمُ: السَّلامُ عَلَيْكُمْ فَأَتَاهُمْ فَقَالَ: السَّلامُ عَلَيْكُمْ، فَقَالُوا لَهُ: وَعَلَيْكَ السَّلامُ وَرَحْمَةُ اللَّهِ، ثُمَّ رَجَعَ إِلَى رَبِّهِ عَزَّ وَجَلَّ فَقَالَ لَهُ: هَذِهِ تَحِيَّتُكَ وَتَحِيَّةُ ذُرِّيَّتِكَ بَيْنَهُمْ فَلَمَّا أَظْهَرَ إِبْلِيسُ مِنْ نَفْسِهِ مَا كَانَ لَهُ مَخْفِيًّا فِيهَا مِنَ الْكِبْرِ وَالْمَعْصِيَةِ لِرَبِّهِ، وَكَانَتِ الْمَلائِكَةُ قَدْ قَالَتْ لِرَبِّهَا عَزَّ وَجَلَّ حِينَ قَالَ لَهُمْ: إِنِّي جاعل في الأرض خليفة: أَتَجْعَلُ فِيهَا مَنْ يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ فَقَالَ لَهُمْ رَبُّهُمْ:\nإِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ، تَبَيَّنَ لَهُمْ مَا كَانَ عَنْهُمْ مُسْتَتِرًا، وَعَلِمُوا أَنَّ فِيهِمْ مَنْ مِنْهُ الْمَعْصِيَةُ لِلَّهِ عَزَّ وَجَلَّ وَالْخِلافُ لأَمْرِهِ] .\n\nثُمَّ عَلَّمَ اللَّهُ عَزَّ وَجَلَّ آدَمَ الأَسْمَاءَ كُلَّهَا وَاخْتَلَفَ السَّلَفُ مِنْ أَهْلِ الْعِلْمِ قَبْلَنَا فِي الأَسْمَاءِ الَّتِي عُلِّمَهَا آدَمُ: أَخَاصًّا مِنَ الأَسْمَاءِ علم، اما عَامًّا؟\n\nفَقَالَ بَعْضُهُمْ: عُلِّمَ اسْمَ كُلِّ شَيْءٍ","bs":"\u003cp data-paragraph=\"96.1\">Džehennem tobom i svima od njih koji te budu slijedili.’“ Rekao je: „Kada je Uzvišeni Allah završio s Iblisom i ukoravanjem njega, a on je ostao pri nepokornosti, Uzvišeni Allah spustio je na njega prokletstvo i izveo ga iz Dženneta.“ \u003cspan class=\"translator-note\">⟦Prijevod završetka kur’anskog navoda s prethodne stranice: Sad, 38:85.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"96.2\">Pričao mi je Muhammed ibn Halef, koji je rekao: pričao nam je Adem ibn Ebu Ijas, koji je rekao: pričao nam je Ebu Halid Sulejman ibn Hajjan, koji je rekao: pričao mi je Muhammed ibn Amr, od Ebu Seleme, od Ebu Hurejre, od Vjerovjesnika, alejhis-selam. Ebu Halid je rekao: a pričao mi je i A‘meš, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Davud ibn Ebu Hind, od Ša‘bija, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Ibn Ebu Zubab ed-Devsi, koji je rekao: pričali su mi Seid el-Makburi i Jezid ibn Hurmuz, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Allah, Silan i Uzvišen, stvorio je Adem
