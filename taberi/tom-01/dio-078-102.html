oju je vidio. Pokušao je ustati, ali nije mogao. To su riječi Allaha, Silnog i Uzvišenog: ‘Čovjek je stvoren od žurbe.’“ Rekao je: „Nemiran je; nema strpljenja ni u blagostanju ni u nevolji.“ Rekao je: „Kada je dah ispunio cijelo njegovo tijelo, kihnuo je i, Allahovim nadahnućem, rekao: ‘Hvala Allahu, Gospodaru svjetova.’ Rekao je: ‘Allah ti se smilovao, Ademe!’ Zatim je samo melekima koji su bili s Iblisom, a ne melekima na nebesima, rekao: ‘Učinite sedždu Ademu!’ Svi su zajedno učinili sedždu osim Iblisa, koji je odbio i uzoholio se zbog oholosti i samodopadnosti o kojima je razmišljao u sebi. Rekao je: ‘Neću učiniti sedždu! Ja sam bolji od njega, stariji i snažnijeg stvaranja. Mene si stvorio od vatre, a njega si stvorio od gline.’ Kaže: ‘Vatra je snažnija od gline.’“ Rekao je: „Kada je Iblis odbio učiniti sedždu, Uzvišeni Allah bacio ga je u očaj, lišio ga nade u svako dobro i učinio ga prokletim šejtanom kao kaznu za njegovu nepokornost.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Enbija, 21:37, navedeni dio; „Mene si stvorio od vatre, a njega si stvorio od gline“ nalazi se u El-A‘raf, 7:12, i Sad, 38:76.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"95.3\" id=\"odlomak-95-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, koji je rekao: \u003c/span>„Govori se — a Allah najbolje zna — da je, kada je duh stigao u njegovu glavu, kihnuo i rekao: ‘Hvala Allahu!’“ Rekao je: „Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar.’ Kada je poprimio potpun oblik, meleki su mu pali na sedždu, čuvajući Allahov zavjet koji im je dao i pokoravajući se naredbi koju im je naredio. Allahov neprijatelj Iblis stajao je među njima i nije učinio sedždu, uzoholivši se i uzvisujući se iz nasilnosti i zavisti. Rekao je: ‘Iblise, šta te spriječilo da učiniš sedždu onome što sam stvorio Svojim dvjema rukama?’ — do Njegovih riječi: ‘Sigurno ću napuniti \u003cspan class=\"translator-note\">⟦Prijevod početka navoda: Sad, 38:75; završni navod nastavlja se na sljedećoj stranici i pripada Sad, 38:85. Izraz „do Njegovih riječi“ nalazi se u samom izvoru; međutekst nije izostavljen tokom ovog prijevoda.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":96,"html":"\u003csection class=\"page\" data-page=\"96\" id=\"stranica-96\">\u003ch2>Stranica 96\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 96\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"96.1\" id=\"ar-odlomak-96-1\">جَهَنَّمَ مِنْكَ وَمِمَّنْ تَبِعَكَ مِنْهُمْ أَجْمَعِينَ» ، قَالَ: فَلَمَّا فَرَغَ اللَّهُ تعالى مِنْ إِبْلِيسَ وَمُعَاتَبَتِهِ وَأَبَى إِلا الْمَعْصِيَةَ أَوْقَعَ اللَّهُ تعالى عَلَيْهِ اللَّعْنَةَ، وَأَخْرَجَهُ مِنَ الْجَنَّةِ.\u003c/p>\u003cp data-pair=\"96.2\" id=\"ar-odlomak-96-2\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ خَلَفٍ، قَالَ: حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، قَالَ:\nحَدَّثَنَا أَبُو خَالِدٍ سُلَيْمَانُ بْنُ حَيَّانَ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ، ع قَالَ أَبُو خَالِدٍ: وحدثني الأَعْمَشُ عَنْ أَبِي صالح، عن ابى هريرة، عن النبي ص قَالَ أَبُو خَالِدٍ:\nوحدثني دَاوُدُ بْنُ أَبِي هِنْدٍ عَنِ الشَّعْبِيِّ، عَنْ أَبِي هُرَيْرَةَ عَنِ النبي ص قَالَ أَبُو خَالِدٍ: وحدثني ابْنُ أَبِي ذُبَابٍ الدَّوْسِيُّ، قَالَ: حَدَّثَنِي سَعِيدٌ الْمَقْبُرِيُّ، وَيَزِيدُ بْنُ هرمز عن ابى هريرة، [عن النبي ص \u003c/span>أَنَّهُ قَالَ: خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ بِيَدِهِ، وَنَفَخَ فِيهِ مِنْ رُوحِهِ، وَأَمَرَ الْمَلأَ مِنَ الْمَلائِكَةِ فَسَجَدُوا لَهُ، فَجَلَسَ فَعَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ لَهُ رَبُّهُ: يَرْحَمُكَ رَبُّكَ، ايت أُولَئِكَ الْمَلأَ مِنَ الْمَلائِكَةِ فَقُلْ لَهُمُ: السَّلامُ عَلَيْكُمْ فَأَتَاهُمْ فَقَالَ: السَّلامُ عَلَيْكُمْ، فَقَالُوا لَهُ: وَعَلَيْكَ السَّلامُ وَرَحْمَةُ اللَّهِ، ثُمَّ رَجَعَ إِلَى رَبِّهِ عَزَّ وَجَلَّ فَقَالَ لَهُ: هَذِهِ تَحِيَّتُكَ وَتَحِيَّةُ ذُرِّيَّتِكَ بَيْنَهُمْ فَلَمَّا أَظْهَرَ إِبْلِيسُ مِنْ نَفْسِهِ مَا كَانَ لَهُ مَخْفِيًّا فِيهَا مِنَ الْكِبْرِ وَالْمَعْصِيَةِ لِرَبِّهِ، وَكَانَتِ الْمَلائِكَةُ قَدْ قَالَتْ لِرَبِّهَا عَزَّ وَجَلَّ حِينَ قَالَ لَهُمْ: إِنِّي جاعل في الأرض خليفة: أَتَجْعَلُ فِيهَا مَنْ يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ فَقَالَ لَهُمْ رَبُّهُمْ:\nإِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ، تَبَيَّنَ لَهُمْ مَا كَانَ عَنْهُمْ مُسْتَتِرًا، وَعَلِمُوا أَنَّ فِيهِمْ مَنْ مِنْهُ الْمَعْصِيَةُ لِلَّهِ عَزَّ وَجَلَّ وَالْخِلافُ لأَمْرِهِ] .\u003c/p>\u003cp data-pair=\"96.3\" id=\"ar-odlomak-96-3\">ثُمَّ عَلَّمَ اللَّهُ عَزَّ وَجَلَّ آدَمَ الأَسْمَاءَ كُلَّهَا وَاخْتَلَفَ السَّلَفُ مِنْ أَهْلِ الْعِلْمِ قَبْلَنَا فِي الأَسْمَاءِ الَّتِي عُلِّمَهَا آدَمُ: أَخَاصًّا مِنَ الأَسْمَاءِ علم، اما عَامًّا؟\u003c/p>\u003cp data-pair=\"96.4\" id=\"ar-odlomak-96-4\">فَقَالَ بَعْضُهُمْ: عُلِّمَ اسْمَ كُلِّ شَيْءٍ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 96\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"96.1\" id=\"odlomak-96-1\">Džehennem tobom i svima od njih koji te budu slijedili.’“ Rekao je: „Kada je Uzvišeni Allah završio s Iblisom i ukoravanjem njega, a on je ostao pri nepokornosti, Uzvišeni Allah spustio je na njega prokletstvo i izveo ga iz Dženneta.“ \u003cspan class=\"translator-note\">⟦Prijevod završetka kur’anskog navoda s prethodne stranice: Sad, 38:85.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"96.2\" id=\"odlomak-96-2\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Halef, koji je rekao: pričao nam je Adem ibn Ebu Ijas, koji je rekao: pričao nam je Ebu Halid Sulejman ibn Hajjan, koji je rekao: pričao mi je Muhammed ibn Amr, od Ebu Seleme, od Ebu Hurejre, od Vjerovjesnika, alejhis-selam. Ebu Halid je rekao: \u003c/span>a \u003cspan class=\"isnad\">pričao mi je i A‘meš, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: \u003c/span>a \u003cspan class=\"isnad\">pričao mi je i Davud ibn Ebu Hind, od Ša‘bija, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: \u003c/span>a \u003cspan class=\"isnad\">pričao mi je i Ibn Ebu Zubab ed-Devsi, koji je rekao: pričali su mi Seid el-Makburi i Jezid ibn Hurmuz, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: \u003c/span>„Allah, Silan i Uzvišen, stvorio je Adema Svojom rukom, udahnuo u njega od Svoga Duha i naredio skupini meleka pa su mu učinili sedždu. On je sjeo, kihnuo i rekao: ‘Hvala Allahu!’ Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar. Otiđi onoj skupini meleka i reci im: Es-selamu alejkum!’ Došao im je i rekao: ‘Es-selamu alejkum!’ Odgovorili su mu: ‘Ve alejkes-selamu ve rahmetullah!’ Zatim se vratio svome Gospodaru, Silnom i Uzvišenom, koji mu je rekao: ‘Ovo je tvoj pozdrav i pozdrav tvojih potomaka među njima.’ Kada je Iblis pokazao oholost i nepokornost svome Gospodaru koje je skrivao u sebi, a meleki su svome Gospodaru, Silnom i Uzvišenom, kada im je rekao: ‘Ja ću na Zemlji postaviti namjesnika’, već bili rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo?’, a njihov im Gospodar odgovorio: ‘Ja znam ono što vi ne znate’, otkrilo im se ono što im je bilo skriveno. Saznali su da među njima ima neko ko je nepokoran Allahu, Silnom i Uzvišenom, i protivi se Njegovoj naredbi.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda unutar predaje: El-Bekara, 2:30, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"96.3\" id=\"odlomak-96-3\">Zatim je Allah, Silan i Uzvišen, poučio Adema svim imenima. Učeni prethodnici prije nas razišli su se o imenima kojima je Adem poučen: je li poučen samo određenim imenima ili imenima općenito?\u003c/p>\u003cp data-pair=\"96.4\" id=\"odlomak-96-4\">Neki su rekli: „Poučen je imenu svega.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":97,"html":"\u003csection class=\"page\" data-page=\"97\" id=\"stranica-97\">\u003ch2>Stranica 97\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 97\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"97.1\" id=\"ar-odlomak-97-1\">ذكر من قال ذلك:\u003c/p>\u003cp data-pair=\"97.2\" id=\"ar-odlomak-97-2\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بشر ابن عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>«عَلَّمَ اللَّهُ تَعَالَى آدَمَ الْأَسْماءَ كُلَّها» ، وَهِيَ هَذِهِ الأَسْمَاءُ الَّتِي يَتَعَارَفُ بِهَا النَّاسُ:\nإِنْسَانٌ، وَدَابَّةٌ، وَأَرْضٌ، وَسَهْلٌ، وَبَحْرٌ، وَجَبَلٌ، وَحِمَارٌ، وَأَشْبَاهُ ذَلِكَ مِنَ الأُمَمِ وَغَيْرِهَا.\u003c/p>\u003cp data-pair=\"97.3\" id=\"ar-odlomak-97-3\">\u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ إِسْحَاقَ الأَهْوَازِيُّ، قَالَ: حَدَّثَنَا أَبُو أَحْمَدَ، حَدَّثَنَا شَرِيكٌ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنِ الْحَسَنِ بْنِ سَعْدٍ، عَنِ ابْنِ عَبَّاسٍ، \u003c/span>فِي قَوْلِهِ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، حَتَّى الْفَسْوَةِ وَالْفُسَيَّةِ.\u003c/p>\u003cp data-pair=\"97.4\" id=\"ar-odlomak-97-4\">\u003cspan class=\"isnad\">حَدَّثَنِي عَلِيُّ بْنُ الْحَسَنِ، حَدَّثَنَا مُسْلِمٌ الْجَرْمِيُّ، قَالَ:\nحَدَّثَنَا مُحَمَّدُ بْنُ مُصْعَبٍ، عَنْ قَيْسِ بْنِ الرَّبِيعِ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنْ سَعِيدِ بْنِ مَعْبَدٍ، عَنِ ابْنِ عَبَّاسٍ \u003c/span>فِي قَوْلِ اللَّهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ:\n\nعَلَّمَهُ اسْمَ كُلِّ شَيْءٍ حَتَّى الْهَنَةِ وَالْهُنَيَّةِ، وَالْفَسْوَةِ وَالضَّرْطَةِ.\n\u003c/p>\u003cp data-pair=\"97.5\" id=\"ar-odlomak-97-5\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى ابن ميمون، عن ابن أبي نجيح، عن مجاهد، \u003c/span>فِي قَوْلِ اللَّهِ عَزَّ وَجَلَّ:\n\n«وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ: مَا خَلَقَ اللَّهُ تعالى كُلَّهُ.\u003c/p>\u003cp data-pair=\"97.6\" id=\"ar-odlomak-97-6\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنِ سفيان، عَنْ خَصِيفٍ، عَنْ مُجَاهِدٍ: \u003c/span>«وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 97\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"97.1\" id=\"odlomak-97-1\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"97.2\" id=\"odlomak-97-2\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: \u003c/span>„Uzvišeni Allah poučio je Adema svim imenima. To su imena kojima se ljudi međusobno sporazumijevaju: čovjek, životinja, zemlja, ravnica, more, planina, magarac i njima slični nazivi vrsta i drugih stvari.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor kaže علّم الله تعالى آدم الأسماء كلها, kao formulaciju predaje; odgovarajući kur’anski izraz u El-Bekara, 2:31, glasi وعلم آدم الأسماء كلها.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"97.3\" id=\"odlomak-97-3\">\u003cspan class=\"isnad\">Pričao mi je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed: pričao nam je Šerik, od Asima ibn Kulejba, od Hasena ibn Sa‘da, od Ibn Abbasa, o Njegovim riječima: \u003c/span>„I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega, čak i tihog ispuštanja vjetra i sasvim malog ispuštanja vjetra.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Izvor ima الفسوة والفسية, pri čemu je drugi oblik umanjenica.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"97.4\" id=\"odlomak-97-4\">\u003cspan class=\"isnad\">Pričao mi je Ali ibn el-Hasen: pričao nam je Muslim el-Džermi, koji je rekao: pričao nam je Muhammed ibn Mus‘ab, od Kajsa ibn er-Rebia, od Asima ibn Kulejba, od Seida ibn Ma‘beda, od Ibn Abbasa, \u003c/span>o riječima Allaha, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega, čak i ‘one stvari’ i ‘male one stvari’, tihog i glasnog ispuštanja vjetra.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Izrazi الهنة والهنية preneseni su kao neodređeni nazivi i umanjenica, bez nametanja određenog predmeta na koji bi se odnosili.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"97.5\" id=\"odlomak-97-5\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa ibn Mejmun, od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>o riječima Allaha, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Svemu što je Uzvišeni Allah stvorio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"97.6\" id=\"odlomak-97-6\">\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je moj otac, od Sufjana, od Husajfa, od Mudžahida, \u003c/span>o riječima: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":98,"html":"\u003csection class=\"page\" data-page=\"98\" id=\"stranica-98\">\u003ch2>Stranica 98\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 98\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"98.1\" id=\"ar-odlomak-98-1\">\u003cspan class=\"isnad\">حَدَّثَنَا سُفْيَانُ، قَالَ: حَدَّثَنَا أَبِي، عَنْ شَرِيكٍ، عَنْ سَالِمٍ الأَفْطَسِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: \u003c/span>عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، حَتَّى الْبَعِيرِ، وَالْبَقَرَةِ، وَالشَّاةِ.\u003c/p>\u003cp data-pair=\"98.2\" id=\"ar-odlomak-98-2\">\u003cspan class=\"isnad\">حَدَّثَنَا الْحَسَنُ بْنُ يَحْيَى، قَالَ: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن قَتَادَةَ، \u003c/span>فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ: هَذَا جَبَلٌ، وَهَذَا بَحْرٌ، وَهَذَا كَذَا، وَهَذَا كَذَا، لِكُلِّ شَيْءٍ، ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ، فَقَالَ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» .\u003c/p>\u003cp data-pair=\"98.3\" id=\"ar-odlomak-98-3\">\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، عَنْ سَعِيدٍ، عَنْ قَتَادَةَ، قَوْلُهُ عَزَّ وجل: \u003c/span>و «عَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» حَتَّى بَلَغَ «إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ» ، قَالَ: يَا آدَمُ أَنْبِئْهُمْ بِأَسْمَائِهِمْ، فَأَنْبَأَ كُلَّ صِنْفٍ مِنَ الْخَلْقِ بِاسْمِهِ، وَأَلْجَأَهُ إِلَى جِنْسِهِ.\u003c/p>\u003cp data-pair=\"98.4\" id=\"ar-odlomak-98-4\">\u003cspan class=\"isnad\">حَدَّثَنَا الْقَاسِمُ بْنُ الْحَسَنِ، قَالَ: حدثنا الحسين بن داود، قَالَ: حَدَّثَنَا حَجَّاجٌ، عَنْ جَرِيرِ بْنِ حَازِمٍ ومبارك، عن الحسن وأبي بكر، عن الحسن وَقَتَادَةَ، قَالا: \u003c/span>عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، هَذِهِ الخيل، وهذه البغال، والإبل، والجن، والوحش، وجعل يسمي كل شيء برسمه.\u003c/p>\u003cp data-pair=\"98.5\" id=\"ar-odlomak-98-5\">وقال آخرون: بل إنما علم اسما خاصا من الأسماء، قالوا: والذي علمه أسماء الملائكة.\u003c/p>\u003cp data-pair=\"98.6\" id=\"ar-odlomak-98-6\">ذِكْرُ مَنْ قَالَ ذلك:\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 98\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"98.1\" id=\"odlomak-98-1\">\u003cspan class=\"isnad\">Pričao nam je Sufjan, koji je rekao: pričao nam je moj otac, od Šerika, od Salima el-Eftasa, od Seida ibn Džubejra, koji je rekao: \u003c/span>„Poučio ga je imenu svega, čak i deve, krave i ovce.“\u003c/p>\u003cp data-pair=\"98.2\" id=\"odlomak-98-2\">\u003cspan class=\"isnad\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega: ovo je planina, ovo je more, ovo je to i to, a ovo je to i to — za svaku stvar. Zatim ih je pokazao melekima i rekao: ‘Obavijestite Me o imenima ovih, ako istinu govorite.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:31, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"98.3\" id=\"odlomak-98-3\">\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz: pričao nam je Jezid ibn Zurej‘, od Seida, od Katade, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima“ — dok nije stigao do: „Ti si, doista, Sveznajući, Mudri.“ Rekao je: „Ademe, obavijesti ih o njihovim imenima.“ Pa je svaku vrstu stvorenja naveo njenim imenom i svrstao je u njen rod. \u003cspan class=\"translator-note\">⟦Prijevodi navedenih početnih i završnih kur’anskih riječi: El-Bekara, 2:31–32. Izraz „dok nije stigao do“ dio je izvora. Naredna rečenica „Ademe, obavijesti ih…“ prenosi formulaciju predaje prema El-Bekara, 2:33.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"98.4\" id=\"odlomak-98-4\">\u003cspan class=\"isnad\">Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao nam je Hadždžadž, od Džerira ibn Hazima i Mubareka, od Hasena i Ebu Bekra, od Hasena i Katade; obojica su rekli: \u003c/span>„Poučio ga je imenu svega: ovo su konji, ovo su mazge, deve, džini i divlje životinje. Svaku je stvar počeo imenovati njenim nazivom.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: niz عن جرير بن حازم ومبارك، عن الحسن وأبي بكر، عن الحسن وقتادة prenesen je navedenim redom, uključujući ponovljeno ime Hasen. Veze između grana ovog lanca nisu prešutno preuređene.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"98.5\" id=\"odlomak-98-5\">Drugi su rekli: „Naprotiv, poučen je samo određenim imenima.“ Rekli su: „Ono čemu je poučen jesu imena meleka.“\u003c/p>\u003cp data-pair=\"98.6\" id=\"odlomak-98-6\">Spomen onih koji su to rekli:\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":99,"html":"\u003csection class=\"page\" data-page=\"99\" id=\"stranica-99\">\u003ch2>Stranica 99\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 99\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"99.1\" id=\"ar-odlomak-99-1\">\u003cspan class=\"isnad\">حَدَّثَنِي عَبْدَةُ الْمَرْوَزِيُّ، قَالَ: حَدَّثَنَا عَمَّارُ بْنُ الحسن، قال: حدثنا عبد الله بن أبي جَعْفَرٍ، عَنْ أَبِيهِ، عَنِ الرَّبِيعِ، قَوْلُهُ تعالى: \u003c/span>«وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: أَسْمَاءُ الْمَلائِكَةِ.\u003c/p>\u003cp data-pair=\"99.2\" id=\"ar-odlomak-99-2\">وَقَالَ آخَرُونَ مِثْلَ قَوْلِ هَؤُلاءِ فِي أَنَّ الَّذِي عُلِّمَ آدَمَ مِنَ الأَسْمَاءِ اسْمًا خَاصًّا مِنَ الأَشْيَاءِ، غَيْرَ أَنَّهُمْ قَالُوا: الَّذِي عُلِّمَ مِنْ ذَلِكَ أَسْمَاءَ ذُرِّيَّتِهِ.\u003c/p>\u003cp data-pair=\"99.3\" id=\"ar-odlomak-99-3\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"99.4\" id=\"ar-odlomak-99-4\">\u003cspan class=\"isnad\">حَدَّثَنِي يُونُسُ، قَالَ: حَدَّثَنَا ابْنُ وَهْبٍ، قَالَ: قَالَ ابْنُ زَيْدٍ \u003c/span>فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: أَسْمَاءَ ذُرِّيَّتِهِ،\u003c/p>\u003cp data-pair=\"99.5\" id=\"ar-odlomak-99-5\">فَلَمَّا «عَلَّمَ اللَّهُ آدَمَ الْأَسْماءَ كُلَّها» عَرَضَ اللَّهُ عَزَّ وَجَلَّ أَهْلَ الأَسْمَاءِ عَلَى الْمَلائِكَةِ، فَقَالَ لَهُمْ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» ، وإنما قال ذلك عز وجل للملائكة- فيما ذكر- لقولهم إذ قال لهم: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» : «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ» فعرض- بعد ان خلق آدم ع ونفخ فيه الروح، وعلمه أسماء كل شيء- مما خلق من الخلق- عليهم، فقال لهم:\n«أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» أني إن جعلت منكم خليفتي في الأرض أطعتموني وسبحتموني وقدستموني ولم تعصوني، وإن جعلته من غيركم أفسد فيها وسفك، فإنكم إن لم تعلموا ما أسماؤهم وأنتم مشاهدوهم ومعاينوهم، فأنتم بألا تعلموا ما يكون من أمركم- إن جعلت خليفتي في الأرض منكم، أو من غيركم إن جعلته من غيركم، فهم عن أبصاركم غُيَّبٌ لا ترونهم ولا تعاينونهم، ولم تخبروا بما هو كائن منكم ومنهم- أحرى\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 99\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"99.1\" id=\"odlomak-99-1\">\u003cspan class=\"isnad\">Pričao mi je Abde el-Mervezi, koji je rekao: pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, \u003c/span>o riječima Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Imenima meleka.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"99.2\" id=\"odlomak-99-2\">Drugi su rekli isto što i ovi, da je Adem od imena poučen imenima samo određenih stvari, ali su kazali: „Poučen je imenima svojih potomaka.“\u003c/p>\u003cp data-pair=\"99.3\" id=\"odlomak-99-3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"99.4\" id=\"odlomak-99-4\">\u003cspan class=\"isnad\">Pričao mi je Junus, koji je rekao: pričao nam je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima“: „Imenima njegovih potomaka.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"99.5\" id=\"odlomak-99-5\">Kada je Allah poučio Adema svim imenima, Allah, Silan i Uzvišen, pokazao je melekima nosioce tih imena i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite.“ Prema onome što je navedeno, On, Silan i Uzvišen, rekao je to melekima zbog njihovih riječi kada im je rekao: „Ja ću na Zemlji postaviti namjesnika“, a oni odgovorili: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo?“ Nakon što je stvorio Adema, alejhis-selam, udahnuo u njega duh i poučio ga imenu svega od stvorenja koja je stvorio, pokazao ih je melekima i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite“ — u tvrdnji da biste, kada bih nekoga od vas učinio Svojim namjesnikom na Zemlji, bili Meni pokorni, slavili Me, iskazivali Mi svetost i ne biste Mi bili nepokorni, a da bi, ako ga učinim od drugih, na njoj činio nered i prolijevao krv. Ako ne znate njihova imena dok ih gledate i vidite vlastitim očima, onda još manje možete znati kakvo bi bilo vaše stanje kada bih Svoga namjesnika na Zemlji učinio od vas, ili stanje drugih kada bih ga učinio od drugih, dok su oni skriveni od vaših očiju, ne vidite ih niti ih posmatrate, a niste obaviješteni o tome šta će biti od vas i od njih. \u003cspan class=\"translator-note\">⟦Prijevodi izričitih kur’anskih navoda: El-Bekara, 2:30–31. Navod u izvoru علم الله آدم الأسماء كلها prenosi formulaciju predaje. Objašnjenje poslije posljednjeg „ako istinu govorite“ pripada autorovom izlaganju.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":100,"html":"\u003csection class=\"page\" data-page=\"100\" id=\"stranica-100\">\u003ch2>Stranica 100\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 100\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"100.1\" id=\"ar-odlomak-100-1\">وهذا قول روي عن جماعة من السلف.\u003c/p>\u003cp data-pair=\"100.2\" id=\"ar-odlomak-100-2\">ذكر بعض من روي ذلك عنه:\u003c/p>\u003cp data-pair=\"100.3\" id=\"ar-odlomak-100-3\">\u003cspan class=\"isnad\">حَدَّثَنِي مُوسَى بْنُ هَارُونَ، قَالَ: حَدَّثَنِي عَمْرُو بْنُ حماد، قال:\nحدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن عبد الله بن مسعود- وعن ناس من اصحاب النبي ص: \u003c/span>«إِنْ كُنْتُمْ صادِقِينَ» أَنَّ بَنِي آدَمَ يُفْسِدُونَ فِي الأَرْضِ وَيَسْفِكُونَ الدِّمَاءَ.\u003c/p>\u003cp data-pair=\"100.4\" id=\"ar-odlomak-100-4\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ:\n\n\u003c/span>«إِنْ كُنْتُمْ صادِقِينَ» ، إِنْ كُنْتُمْ تَعْلَمُونَ لَمْ أَجْعَلْ فِي الأَرْضِ خَلِيفَةً.\u003c/p>\u003cp data-pair=\"100.5\" id=\"ar-odlomak-100-5\">وَقَدْ قِيلَ: إِنَّ اللَّهَ جَلَّ جَلالَهُ قَالَ ذَلِكَ لِلْمَلائِكَةِ لأَنَّهُ جَلَّ جَلالَهُ لَمَّا ابْتَدَأَ فِي خَلْقِ آدَمَ قَالُوا فِيمَا بَيْنَهُمْ: لِيَخْلُقُ رَبُّنَا مَا شَاءَ أَنْ يَخْلُقَ، فَلَنْ يخلق خلقا إلا كنا أعلم منه، وأكرم عليه منه، فلما خلق آدم ع وَعَلَّمَهُ أَسْمَاءَ كُلَّ شَيْءٍ عَرَضَ الأَشْيَاءَ الَّتِي علم آدم أسمائها عليهم، فقال لهم: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» فِي قِيلِكُمْ: إِنَّ اللَّهَ لَمْ يَخْلُقْ خَلْقًا إِلا كُنْتُمْ أَعْلَمَ مِنْهُ، وَأَكْرَمَ عَلَيْهِ مِنْهُ.\u003c/p>\u003cp data-pair=\"100.6\" id=\"ar-odlomak-100-6\">ذكر من قال ذلك:\u003c/p>\u003cp data-pair=\"100.7\" id=\"ar-odlomak-100-7\">\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ:\n\nحَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ: \u003c/span>قوله: «وَإِذْ قالَ رَبُّكَ لِلْمَلائِكَةِ إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً، فاستشار الملائكة في خلق آدم ع ف قالُوا:\n\n«أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وقد علمت الملائكة من علم الله أنه لا شيء أكره إلى الله عز وجل من سفك الدماء والفساد في الأرض،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 100\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"100.1\" id=\"odlomak-100-1\">Ovo mišljenje preneseno je od jedne skupine prethodnika.\u003c/p>\u003cp data-pair=\"100.2\" id=\"odlomak-100-2\">Spomen nekih od kojih je to preneseno:\u003c/p>\u003cp data-pair=\"100.3\" id=\"odlomak-100-3\">\u003cspan class=\"isnad\">Pričao mi je Musa ibn Harun, koji je rekao: pričao mi je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, \u003c/span>o riječima: „Ako istinu govorite“ — da će Ademovi potomci činiti nered na Zemlji i prolijevati krv. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"100.4\" id=\"odlomak-100-4\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, \u003c/span>o riječima: „Ako istinu govorite“ — ako znate zašto ću na Zemlji postaviti namjesnika. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Napomena prevodioca: لم أجعل ovdje je prema kontekstu pročitano kao لِمَ أجعل, „zašto ću postaviti“; izvor nema oznake koje bi ovo čitanje izričito razriješile.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"100.5\" id=\"odlomak-100-5\">Rečeno je da je Allah, Uzvišeno je Njegovo veličanstvo, to rekao melekima zato što su oni, kada je On, Uzvišeno je Njegovo veličanstvo, započeo stvarati Adema, međusobno rekli: „Neka naš Gospodar stvori šta god želi stvoriti; neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji od njega.“ Kada je stvorio Adema, alejhis-selam, i poučio ga imenu svega, pokazao je melekima stvari čijim je imenima poučio Adema i rekao im: „Obavijestite Me o imenima ovih, ako istinu govorite“ — u svojoj tvrdnji da Allah nije stvorio nijedno stvorenje a da ste vi učeniji od njega i kod Njega ugledniji od njega. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"100.6\" id=\"odlomak-100-6\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"100.7\" id=\"odlomak-100-7\">\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, \u003c/span>o riječima: „I kada je tvoj Gospodar rekao melekima: Ja ću na Zemlji postaviti namjesnika.“ Posavjetovao se s melekima o stvaranju Adema, alejhis-selam, pa su rekli: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?“ Meleki su iz Allahovog znanja već znali da Allahu, Silnom i Uzvišenom, ništa nije mrže od prolijevanja krvi i činjenja nereda na Zemlji, \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dijelovi. Riječi o savjetovanju s melekima pripadaju ovoj predaji, a nisu dio kur’anskog ajeta.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":101,"html":"\u003csection class=\"page\" data-page=\"101\" id=\"stranica-101\">\u003ch2>Stranica 101\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 101\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"101.1\" id=\"ar-odlomak-101-1\">«وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» ، فَكان في علم الله عز وجل انه سيكون من تلك الخليقة أنبياء ورسل وقوم صالحون وساكنو الجنة.\u003c/p>\u003cp data-pair=\"101.2\" id=\"ar-odlomak-101-2\">قال: وذكر لنا أن ابْنِ عَبَّاسٍ كان يقول: إن الله تعالى لما أخذ في خلق آدم قالت الملائكة: ما الله تعالى بخالق خلقا أكرم عليه منا، ولا أعلم منا، فابتلوا بخلق آدم ع- وكل خلق مبتلى، كما ابتليت السموات والأرض بالطاعة- فقال الله تعالى: «ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ» .\u003c/p>\u003cp data-pair=\"101.3\" id=\"ar-odlomak-101-3\">\u003cspan class=\"isnad\">حَدَّثَنَا القاسم، قال: حَدَّثَنَا الحسين بن داود، قال: حَدَّثَنِي حجاج، عن جرير بن حازم، ومبارك عن الحسن وأبي بكر عن الحسن وقتادة قالا: قال الله عز وجل للملائكة: \u003c/span>«إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» قال لهم: إني فاعل، فعرضوا برأيهم، فعلمهم علما وطوى منهم علما علمه لا يعلمونه، فقالوا بالعلم الذي علمهم: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» - وقد كانت الملائكة علمت من علم الله تعالى أنه لا ذنب عند الله تعالى أعظم من سفك الدِّمَاءَ- «وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» ، فلما أخذ تعالى في خلق آدم ع همست الملائكة فيما بينهم، فقالوا: ليخلق ربنا عز وجل ما شاء أن يخلق، فلن يخلق خلقا إلا كنا أعلم منه، وأكرم عليه منه، فلما خلقه ونفخ فيه من روحه أمرهم أن يسجدوا له لما قالوا، ففضله عليهم، فعلموا أنهم ليسوا بخير منه، فقالوا:\nإن لم نكن خيرا منه، فنحن أعلم منه، لأنا كنا قبله، وخلقت الأمم قبله،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 101\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"101.1\" id=\"odlomak-101-1\">„a mi Tebe s hvalom slavimo i svetost Ti iskazujemo. Rekao je: Ja znam ono što vi ne znate.“ U Allahovom, Silan je i Uzvišen, znanju bilo je da će od tih stvorenja biti vjerovjesnika, poslanika, dobrih ljudi i stanovnika Dženneta. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:30, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"101.2\" id=\"odlomak-101-2\">Rekao je: „Navedeno nam je da je Ibn Abbas govorio: ‘Kada je Uzvišeni Allah počeo stvarati Adema, meleki su rekli: Allah neće stvoriti nijedno stvorenje koje bi Mu bilo uglednije od nas ili učenije od nas. Zato su iskušani stvaranjem Adema, alejhis-selam. Svako je stvorenje iskušano, kao što su nebesa i Zemlja iskušani pokornošću.’ Uzvišeni Allah rekao je: ‘Dođite, milom ili silom!’ Odgovorili su: ‘Dolazimo poslušno.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Fussilet, 41:11, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"101.3\" id=\"odlomak-101-3\">\u003cspan class=\"isnad\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Džerira ibn Hazima i Mubareka, od Hasena i Ebu Bekra, od Hasena i Katade; obojica su rekli: \u003c/span>„Allah, Silan i Uzvišen, rekao je melekima: ‘Ja ću na Zemlji postaviti namjesnika.’ Rekao im je: ‘Ja ću to učiniti.’ Oni su iznijeli svoje mišljenje. Poučio ih je jednom znanju, a od njih sakrio znanje koje je On znao, a oni nisu. Na osnovu znanja kojim ih je poučio rekli su: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ Meleki su iz znanja Uzvišenog Allaha već znali da kod Uzvišenog Allaha nema većeg grijeha od prolijevanja krvi. ‘A mi Tebe s hvalom slavimo i svetost Ti iskazujemo. Rekao je: Ja znam ono što vi ne znate.’ Kada je Uzvišeni počeo stvarati Adema, alejhis-selam, meleki su međusobno šaputali i rekli: ‘Neka naš Gospodar, Silan i Uzvišen, stvori šta god želi stvoriti; neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji od njega.’ Kada ga je stvorio i u njega udahnuo od Svoga Duha, naredio im je da mu učine sedždu zbog onoga što su rekli, te ga uzdigao nad njima. Tada su spoznali da nisu bolji od njega. Rekli su: ‘Ako nismo bolji od njega, onda smo učeniji od njega, jer smo bili prije njega, a i narodi su stvoreni prije njega.’ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dijelovi. Niz prenosilaca prenesen je istim redom kao na stranici 98, s istom nejasnoćom njegovih grana.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":102,"html":"\u003csection class=\"page\" data-page=\"102\" id=\"stranica-102\">\u003ch2>Stranica 102\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 102\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"102.1\" id=\"ar-odlomak-102-1\">فلما أعجبوا بعلمهم ابتلوا، «فعلم آدَمَ الْأَسْماءَ كُلَّها ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ فَقالَ: أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ، إِنْ كُنْتُمْ صادِقِينَ» أني لم أخلق خلقا إلا كنتم أعلم منه، فأخبروني بأسماء هؤلاء إن كنتم صادقين قالا: ففزع القوم إلى التوبة، وإليها يفزع كل مؤمن، فقالوا: «سُبْحانَكَ لا عِلْمَ لَنا إِلَّا مَا عَلَّمْتَنا إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ قالَ يَا آدَمُ أَنْبِئْهُمْ بِأَسْمائِهِمْ فَلَمَّا أَنْبَأَهُمْ بِأَسْمائِهِمْ قالَ أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّماواتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» لقولهم: ليخلق ربنا ما شاء، فلن يخلق خلقا أكرم عليه منا، ولا أعلم منا، قال: علمه اسم كل شيء:\nهذه الخيل، وهذه البغال، والإبل، والجن، والوحش، وجعل يسمي كل شيء باسمه، وعرضت عليه أمة أمة، قال: «أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّماواتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، قال:\n\nاما ما أبدوا فقولهم: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وأما ما كتموا فقولهم بعضهم لبعض: نحن خير منه وأعلم.\u003c/p>\u003cp data-pair=\"102.2\" id=\"ar-odlomak-102-2\">\u003cspan class=\"isnad\">حَدَّثَنَا عَمَّارُ بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أَنَسٍ: \u003c/span>«ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ فَقالَ أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» إِلَى قَوْلِهِ: «إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ\n» ، قَالَ: وَذَلِكَ حِينَ قَالُوا: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» إِلَى قَوْلِهِ «وَنُقَدِّسُ لَكَ» قَالَ: فَلَمَّا عَرَفُوا أَنَّهُ جَاعِلٌ فِي الأَرْضِ خَلِيفَةً قَالُوا بَيْنَهُمْ: لَنْ يَخْلُقَ اللَّهُ تعالى خَلْقًا إِلا كُنَّا نَحْنُ أَعْلَمُ مِنْهُ وَأَكْرَمُ عَلَيْهِ، فَأَرَادَ اللَّهُ تعالى أَنْ يُخْبِرَهُمْ أَنَّهُ قَدْ فَضَّلَ عَلَيْهِمْ آدَمَ، وَعَلَّمَهُ الأَسْمَاءَ كُلَّهَا، وَقَالَ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 102\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"102.1\" id=\"odlomak-102-1\">Kada su se zadivili svojim znanjem, bili su iskušani. Pa je poučio Adema svim imenima, zatim ih pokazao melekima i rekao: ‘Obavijestite Me o imenima ovih, ako istinu govorite’ — da nisam stvorio nijedno stvorenje a da vi ne budete učeniji od njega. ‘Obavijestite Me o imenima ovih, ako istinu govorite.’“ Obojica su rekli: „Tada su pribjegli pokajanju, a njemu pribjegava svaki vjernik, pa su rekli: ‘Slavljen neka si! Mi nemamo znanja osim onoga čemu si nas Ti poučio. Ti si, doista, Sveznajući, Mudri. Rekao je: Ademe, obavijesti ih o njihovim imenima! Kada ih je obavijestio o njihovim imenima, rekao je: Zar vam nisam rekao da Ja znam nevidljivo nebesa i Zemlje i znam ono što pokazujete i ono što ste krili?’“ Zbog njihovih riječi: „Neka naš Gospodar stvori šta god želi; neće stvoriti nijedno stvorenje koje bi Mu bilo uglednije od nas niti učenije od nas.“ Rekao je: „Poučio ga je imenu svega: ovo su konji, ovo su mazge, deve, džini i divlje životinje. Počeo je imenovati svaku stvar njenim imenom, a pokazivane su mu vrste jedna po jedna.“ Rekao je: „Zar vam nisam rekao da Ja znam nevidljivo nebesa i Zemlje i znam ono što pokazujete i ono što ste krili?“ Rekao je: „Ono što su pokazali njihove su riječi: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ A ono što su krili njihove su međusobne riječi: ‘Mi smo bolji od njega i učeniji.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30–33, navedeni dijelovi. Početak izvornog navoda فعلم آدم prenesen je kao „Pa je poučio Adema“; u mushafu u 2:31 stoji وعلم آدم („I poučio je Adema“). Formulacija „Obavijestite Me…“ koja se ponavlja izvan navodnika izvora prenosi tekst predaje, a nije dopuna ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"102.2\" id=\"odlomak-102-2\">\u003cspan class=\"isnad\">Pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, \u003c/span>o riječima: „Zatim ih je pokazao melekima i rekao: Obavijestite Me o imenima ovih, ako istinu govorite“ — do Njegovih riječi: „Ti si, doista, Sveznajući, Mudri.“ Rekao je: „To je bilo kada su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati’ — do Njegovih riječi: ‘I svetost Ti iskazujemo.’“ Rekao je: „Kada su saznali da će On postaviti namjesnika na Zemlji, među sobom su rekli: ‘Allah neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji.’ Uzvišeni Allah htio ih je obavijestiti da je Adema odlikovao nad njima i poučio ga svim imenima. Rekao je \u003cspan class=\"translator-note\">⟦Prijevodi navedenih dijelova: El-Bekara, 2:31–32 i 2:30. Prijelazi „do Njegovih riječi“ sačuvani su iz izvora.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"}],"book":[{"n":78,"ar":"قال أبو جعفر: والصواب من القول في ذلك عندنا أن يقال: إن الله تعالى ذكره خلق شمس النهار وقمر الليل آيتين، فجعل آية النهار التي هي الشمس مبصرة يبصر بها، ومحا آية الليل التي هي القمر بالسواد الذي فيه.\nوجائز أن يكون الله تعالى ذكره خلقهما شمسين من نور عرشه، ثم محا نور القمر بالليل على نحو ما قاله من ذكرنا قوله، فكان ذلك سبب اختلاف حالتيهما.\n\nوجائز أن يكون إضاءة الشمس للكسوة التي تكساها من ضوء العرش، ونور القمر من الكسوة التي يكساها من نور الكرسي.\nولو صح سند أحد الخبرين اللذين ذكرتهما لقلنا به، ولكن في أسانيدهما نظرا، فلم نستجز قطع القول بتصحيح ما فيهما من الخبر عن سبب اختلاف حال الشمس والقمر، غير أنا بيقين نعلم أن الله عز وجل خالف بين صفتيهما في الإضاءة لما كان أعلم به من صلاح خلقه باختلاف أمريهما، فخالف بينهما، فجعل أحدهما مضيئا مبصرا به، والآخر ممحو الضوء.\nوإنما ذكرنا قدر ما ذكرنا من أمر الشمس والقمر في كتابنا هذا، وإن كنا قد أعرضنا عن ذكر كثير من أمرهما وأخبارهما، مع إعراضنا عن ذكر بدء خلق الله السموات والأرض وصفة ذلك، وسائر ما تركنا ذكره من جميع خلق الله في هذا الكتاب، لأن قصدنا في كتابنا هذا ذكر ما قدمنا الخبر عنه أنا ذاكروه فيه من ذكر الأزمنة وتاريخ الملوك والأنبياء والرسل، على ما قد شرطنا في أول هذا الكتاب، وكانت التأريخات والأزمنة إنما توقت بالليالي والأيام التي إنما هي مقادير ساعات جري الشمس والقمر في أفلاكهما على ما قد ذكرنا في الأخبار التي رويناها عن رسول الله ص، وكان ما كان قبل","bs":"\u003cp data-paragraph=\"78.1\">Ebu Džafer kaže: Ispravno je, prema našem mišljenju, reći da je Allah, Uzvišen je spomen Njegov, stvorio dnevno Sunce i noćni Mjesec kao dva znaka. Znak dana, a to je Sunce, učinio je takvim da se pomoću njega vidi, a znak noći, a to je Mjesec, izbrisao je crnilom koje je na njemu.\u003c/p>\u003cp data-paragraph=\"78.2\">Moguće je da ih je Allah, Uzvišen je spomen Njegov, stvorio kao dva sunca od svjetlosti Svoga Arša, zatim izbrisao Mjesečevu svjetlost noću na način kako su to rekli oni čije smo mišljenje spomenuli, pa je to bilo uzrokom njihove različitosti.\u003c/p>\u003cp data-paragraph=\"78.3\">Moguće je i da Sunčev sjaj potječe od odore kojom se odijeva, od sjaja Arša, a Mjesečeva svjetlost od odore kojom se odijeva, od svjetlosti Kursijja.\u003c/p>\u003cp data-paragraph=\"78.4\">Kada bi lanac prenosilaca jedne od dviju predaja koje sam spomenuo bio vjerodostojan, prihvatili bismo je. Međutim, njihovi lanci prenosilaca zahtijevaju razmatranje, pa nismo smatrali dopuštenim odlučno potvrditi ono što u njima stoji o uzroku različitosti Sunca i Mjeseca. Ipak, pouzdano znamo da je Allah, Silan i Uzvišen, učinio njihova svojstva različitim u pogledu svjetlosti zbog dobrobiti za Svoja stvorenja, koju je najbolje znao, a koja proizlazi iz njihove različitosti. Razlikovao ih je: jedno je učinio sjajnim, da se pomoću njega vidi, a drugome izbrisao sjaj.\u003c/p>\u003cp data-paragraph=\"78.5\">U ovoj smo knjizi spomenuli onoliko o Suncu i Mjesecu koliko smo spomenuli, premda smo izostavili mnogo o njihovom stanju i predajama o njima, kao što smo izostavili govor o početku Allahovog stvaranja nebesa i Zemlje i opisu toga, te ostalo što smo u ovoj knjizi ostavili nespomenutim od svih Allahovih stvorenja. Razlog je što je naš cilj u ovoj knjizi spomenuti ono za šta smo unaprijed kazali da ćemo u njoj govoriti: vremena i historiju kraljeva, vjerovjesnika i poslanika, prema onome što smo postavili na početku ove knjige. Datumi i vremenska razdoblja određuju se noćima i danima, koji su mjere sati kretanja Sunca i Mjeseca njihovim putanjama, kako smo naveli u predajama koje smo prenijeli od Allahovog Poslanika, sallallahu alejhi ve sellem. A ono što je od Njegovih stvorenja bilo prije\u003c/p>","paragraphs":[{"id":"78.1","ar":"قال أبو جعفر: والصواب من القول في ذلك عندنا أن يقال: إن الله تعالى ذكره خلق شمس النهار وقمر الليل آيتين، فجعل آية النهار التي هي الشمس مبصرة يبصر بها، ومحا آية الليل التي هي القمر بالسواد الذي فيه.","bs":"Ebu Džafer kaže: Ispravno je, prema našem mišljenju, reći da je Allah, Uzvišen je spomen Njegov, stvorio dnevno Sunce i noćni Mjesec kao dva znaka. Znak dana, a to je Sunce, učinio je takvim da se pomoću njega vidi, a znak noći, a to je Mjesec, izbrisao je crnilom koje je na njemu.","ar_ranges":[],"ar_html":"قال أبو جعفر: والصواب من القول في ذلك عندنا أن يقال: إن الله تعالى ذكره خلق شمس النهار وقمر الليل آيتين، فجعل آية النهار التي هي الشمس مبصرة يبصر بها، ومحا آية الليل التي هي القمر بالسواد الذي فيه.","bs_ran riti: vremena i historiju kraljeva, vjerovjesnika i poslanika, prema onome što smo postavili na početku ove knjige. Datumi i vremenska razdoblja određuju se noćima i danima, koji su mjere sati kretanja Sunca i Mjeseca njihovim putanjama, kako smo naveli u predajama koje smo prenijeli od Allahovog Poslanika, sallallahu alejhi ve sellem. A ono što je od Njegovih stvorenja bilo prije"}],"notes":[]},{"n":79,"ar":"خلق الله عز ذكره إياهما من خلقه في غير أوقات ولا ساعات ولا ليل ولا نهار.\nوإذ كنا قد بينا مقدار مدة ما بين أول ابتداء الله عز وجل في إنشاء ما أراد إنشاءه من خلقه إلى حين فراغه من إنشاء جميعهم من سني الدنيا ومدة أزمانها بالشواهد التي استشهدنا بها من الآثار والأخبار، وأتينا على القول في مدة ما بعد أن فرغ من خلق جميعه إلى فناء الجميع بالأدلة التي دللنا بها على صحة ذلك من الاخبار الوارده عن رسول الله ص وعن الصحابة وغيرهم من علماء الأمة، وكان الغرض في كتابنا هذا ذكر ما قد بينا أنا ذاكروه من تاريخ الملوك الجبابرة العاصية ربها عز وجل والمطيعة ربها منهم، وأزمان الرسل والأنبياء، وكنا قد أتينا على ذكر ما به تصح التأريخات وتعرف به الأوقات والساعات، وذلك الشمس والقمر اللذان بأحدهما تدرك معرفه ساعات الليل وأوقاته، وبالآخر تدرك علم ساعات النهار وأوقاته فلنقل الآن في أول من أعطاه الله ملكا، وأنعم عليه فكفر نعمته، وجحد ربوبيته، وعتا على ربه واستكبر، فسلبه الله نعمته، وأخزاه وأذله ثم نتبعه ذكر من استن في ذلك سنته، واقتفى فيه أثره، فأحل الله به نقمته وجعله من شيعته، وألحقه به في الخزي والذل ونذكر من كان بإزائه أو بعده من الملوك المطيعة ربها المحمودة آثارها، أو من الرسل والأنبياء إن شاء الله عز وجل.\nفأولهم وإمامهم في ذلك ورئيسهم وقائدهم فيه إبليس لعنه الله.\n\nوكان الله عز وجل قد احسن خلقه وشرفه وكرمه وملكه على سماء الدنيا والأرض فيما ذكر، وجعله مع ذلك من خزان الجنة، فاستكبر على ربه","bs":"\u003cp data-paragraph=\"79.1\">nego što je Allah, Silan je spomen Njegov, stvorio njih dvoje, bilo je bez vremenskih odsječaka i sati, bez noći i dana.\u003c/p>\u003cp data-paragraph=\"79.2\">Objasnili smo, pomoću svjedočanstava iz predaja i izvješća koja smo naveli, koliko je, u godinama ovoga svijeta i trajanju njegovih razdoblja, trajalo vrijeme od prvog početka kada je Allah, Silan i Uzvišen, stvarao ono što je htio stvoriti od Svojih stvorenja do dovršetka stvaranja svih njih. Izložili smo i govor o trajanju razdoblja nakon što je dovršio stvaranje svih njih do nestanka svih njih, uz dokaze kojima smo potvrđivali ispravnost toga iz predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, od ashaba i drugih učenih ljudi ummeta. Cilj naše knjige jeste ono što smo već objasnili da ćemo spomenuti: historija silničkih kraljeva nepokornih svome Gospodaru, Silnom i Uzvišenom, i onih među njima koji su Mu bili pokorni, te vremena poslanika i vjerovjesnika. Već smo spomenuli ono pomoću čega se datumi ispravno određuju i poznaju vremenski odsječci i sati, a to su Sunce i Mjesec: pomoću jednog poznaju se sati i vremena noći, a pomoću drugog sati i vremena dana. Sada ćemo govoriti o prvome kome je Allah dao vlast i darovao blagodat, pa je on porekao Njegovu blagodat, zanijekao Njegovo gospodstvo, osilio se protiv svoga Gospodara i uzoholio. Allah mu je oduzeo blagodat, osramotio ga i ponizio. Zatim ćemo navesti onoga koji je krenuo njegovim putem i slijedio njegov trag u tome, pa je Allah na njega spustio Svoju kaznu, učinio ga njegovim sljedbenikom i pridružio mu ga u sramoti i poniženju. Spomenut ćemo i kraljeve pokorne svome Gospodaru, čiji su tragovi hvalevrijedni, ili poslanike i vjerovjesnike koji su bili u isto vrijeme s njim ili poslije njega, ako Allah, Silan i Uzvišen, htjedne.\u003c/p>\u003cp data-paragraph=\"79.3\">Prvi među njima, njihov predvodnik, poglavar i vođa u tome bio je Iblis, Allah ga prokleo.\u003c/p>\u003cp data-paragraph=\"79.4\">Allah, Silan i Uzvišen, bio mu je dao lijep lik, počastio ga, uzvisio i dao mu vlast nad najbližim nebom i Zemljom, prema onome što je navedeno. Uz to ga je učinio jednim od čuvara Dženneta. Ali on se uzoholio protiv svoga Gospodara\u003c/p>","paragraphs":[{"id":"79.1","ar":"خلق الله عز ذكره إياهما من خلقه في غير أوقات ولا ساعات ولا ليل ولا نهار.","bs":"nego što je Allah, Silan je spomen Njegov, stvorio njih dvoje, bilo je bez vremenskih odsječaka i sati, bez noći i dana.","ar_ranges":[],"ar_html":"خلق الله عز ذكره إياهما من خلقه في غير أوقات ولا ساعات ولا ليل ولا نهار.","bs_ranges":[],"bs_html":"nego što je Allah, Silan je spomen Njegov, stvorio njih dvoje, bilo je bez vremenskih odsječaka i sati, bez noći i dana."},{"id":"79.2","ar":"وإذ كنا قد بينا مقدار مدة ما بين أول ابتداء الله عز وجل في إنشاء ما أراد إنشاءه من خلقه إلى حين فراغه من إنشاء جميعهم من سني الدنيا ومدة أزمانها بالشواهد التي استشهدنا بها من الآثار والأخبار، وأتينا على القول في مدة ما بعد أن فرغ من خلق جميعه إلى فناء الجميع بالأدلة التي دللنا بها على صحة ذلك من الاخبار الوارده عن رسول الله ص وعن الصحابة وغيرهم من علماء الأمة، وكان الغرض في كتابنا هذا ذكر ما قد بينا أنا ذاكروه من تاريخ الملوك الجبابرة العاصية ربها عز وجل والمطيعة ربها منهم، وأزمان الرسل والأنبياء، وكنا قد أتينا على ذكر ما به تصح التأريخات وتعرف به الأوقات والساعات، وذلك الشمس والقمر اللذان بأحدهما تدرك معرفه ساعات الليل وأوقاته، وبالآخر تدرك علم ساعات النهار وأوقاته فلنقل الآن في أول من أعطاه الله ملكا، وأنعم عليه فكفر نعمته، وجحد ربوبيته، وعتا على ربه واستكبر، فسلبه الله نعمته، وأخزاه وأذله ثم نتبعه ذكر من استن في ذلك سنته، واقتفى فيه أثره، فأحل الله به نقمته وجعله من شيعته، وألحقه به في الخزي والذل ونذكر من كان بإزائه أو بعده من الملوك المطيعة ربها المحمودة آثارها، أو من الرسل والأنبياء إن شاء الله عز وجل.","bs":"Objasnili smo, pomoću svjedočanstava iz predaja i izvješća koja smo naveli, koliko je, u godinama ovoga svijeta i trajanju njegovih razdoblja, trajalo vrijeme od prvog početka kada je Allah, Silan i Uzvišen, stvarao ono što je htio stvoriti od Svojih stvorenja do dovršetka stvaranja svih njih. Izložili smo i govor o trajanju razdoblja nakon što je dovršio stvaranje svih njih do nestanka svih njih, uz dokaze kojima smo potvrđivali ispravnost toga iz predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, od ashaba i dru :"فأولهم وإمامهم في ذلك ورئيسهم وقائدهم فيه إبليس لعنه الله.","bs_ranges":[],"bs_html":"Prvi među njima, njihov predvodnik, poglavar i vođa u tome bio je Iblis, Allah ga prokleo."},{"id":"79.4","ar":"وكان الله عز وجل قد احسن خلقه وشرفه وكرمه وملكه على سماء الدنيا والأرض فيما ذكر، وجعله مع ذلك من خزان الجنة، فاستكبر على ربه","bs":"Allah, Silan i Uzvišen, bio mu je dao lijep lik, počastio ga, uzvisio i dao mu vlast nad najbližim nebom i Zemljom, prema onome što je navedeno. Uz to ga je učinio jednim od čuvara Dženneta. Ali on se uzoholio protiv svoga Gospodara","ar_ranges":[],"ar_html":"وكان الله عز وجل قد احسن خلقه وشرفه وكرمه وملكه على سماء الدنيا والأرض فيما ذكر، وجعله مع ذلك من خزان الجنة، فاستكبر على ربه","bs_ranges":[],"bs_html":"Allah, Silan i Uzvišen, bio mu je dao lijep lik, počastio ga, uzvisio i dao mu vlast nad najbližim nebom i Zemljom, prema onome što je navedeno. Uz to ga je učinio jednim od čuvara Dženneta. Ali on se uzoholio protiv svoga Gospodara"}],"notes":[]},{"n":80,"ar":"وادعى الربوبية، ودعا من كان تحت يده فيما ذكر إلى عبادته، فمسخه الله تعالى شيطانا رجيما، وشوه خلقه، وسلبه ما كان حوله، ولعنه وطرده عن سمواته في العاجل، ثم جعل مسكنه ومسكن اتباعه وشيعته في الآخرة نار جهنم، نعوذ بالله من غضبه، ومن عمل يقرب من غضبه، ومن الحور بعد الكور.\nونبدأ بذكر جمل من الأخبار الواردة عن السلف بما كان الله عز وجل أعطاه من الكرامة قبل استكباره عليه، وادعائه ما لم يكن له ادعاؤه، ثم نتبع ذلك ما كان من الأحداث في أيام سلطانه وملكه إلى حين زوال ذلك عنه، والسبب الذي به زال عنه ما كان فيه من نعمة الله عليه، وجميل آلائه، وغير ذلك من أموره، إن شاء الله مختصرا","bs":"\u003cp data-paragraph=\"80.1\">i prisvojio sebi gospodstvo. Prema onome što je navedeno, pozvao je one koji su bili pod njegovom vlašću da ga obožavaju. Uzvišeni Allah pretvorio ga je u prokletog šejtana, unakazio mu lik, oduzeo mu ono što je bilo oko njega, prokleo ga i odmah ga protjerao sa Svojih nebesa. Zatim je njegovo prebivalište i prebivalište njegovih pratilaca i sljedbenika na budućem svijetu učinio džehennemskom vatrom. Utječemo se Allahu od Njegove srdžbe, od djela koja približavaju Njegovoj srdžbi i od nazadovanja nakon učvršćenosti. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor u izrazu وسلبه ما كان حوله ima حوله, ovdje doslovno preneseno „oko njega“. Mjesto zahtijeva provjeru štampanog izdanja; nije prešutno zamijenjeno riječju s drugačijim slovom ili značenjem.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"80.2\">Počet ćemo navođenjem skupina predaja koje su došle od prethodnika o počastima koje mu je Allah, Silan i Uzvišen, dao prije nego što se uzoholio protiv Njega i prisvojio sebi ono na šta nije imao pravo. Zatim ćemo navesti događaje iz vremena njegove vlasti i vladavine, sve do vremena kada je to izgubio, i razlog zbog kojeg su od njega nestale Allahove blagodati i divna dobročinstva koja mu je darovao, te ostalo o njemu, ako Allah htjedne, ukratko.\u003c/p>","paragraphs":[{"id":"80.1","ar":"وادعى الربوبية، ودعا من كان تحت يده فيما ذكر إلى عبادته، فمسخه الله تعالى شيطانا رجيما، وشوه خلقه، وسلبه ما كان حوله، ولعنه وطرده عن سمواته في العاجل، ثم جعل مسكنه ومسكن اتباعه وشيعته في الآخرة نار جهنم، نعوذ بالله من غضبه، ومن عمل يقرب من غضبه، ومن الحور بعد الكور.","bs":"i prisvojio sebi gospodstvo. Prema onome što je navedeno, pozvao je one koji su bili pod njegovom vlašću da ga obožavaju. Uzvišeni Allah pretvorio ga je u prokletog šejtana, unakazio mu lik, oduzeo mu ono što je bilo oko njega, prokleo ga i odmah ga protjerao sa Svojih nebesa. Zatim je njegovo prebivalište i prebivalište njegovih pratilaca i sljedbenika na budućem svijetu učinio džehennemskom vatrom. Utječemo se Allahu od Njegove srdžbe, od djela koja približavaju Njegovoj srdžbi i od nazadovanja nakon učvršćenosti. ⟦Napomena prevodioca: izvor u izrazu وسلبه ما كان حوله ima حوله, ovdje doslovno preneseno „oko njega“. Mjesto zahtijeva provjeru štampanog izdanja; nije prešutno zamijenjeno riječju s drugačijim slovom ili značenjem.⟧","ar_ranges":[],"ar_html":"وادعى الربوبية، و
