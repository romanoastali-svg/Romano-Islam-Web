<!doctype html>
<html lang="bs"><head><meta charset="utf-8"><title>Historia Tabaria</title>
<script>
  const target = new URL("https://app.romano-islam.de/taberi/historija.html?page=78#historija");
  const selected = new URLSearchParams(location.search).get('page') ||
    /^#stranica-(\d+)$/.exec(location.hash)?.[1];
  if (/^\d+$/.test(selected || '')) target.searchParams.set('page', selected);
  location.replace(target.href);
</script></head><body><a href="https://app.romano-islam.de/taberi/historija.html?page=78#historija">Otvori Historia Tabaria</a></body></html>
