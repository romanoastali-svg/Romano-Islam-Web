 ابتلوا، «فعلم آدَمَ الْأَسْماءَ كُلَّها ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ فَقالَ: أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ، إِنْ كُنْتُمْ صادِقِينَ» أني لم أخلق خلقا إلا كنتم أعلم منه، فأخبروني بأسماء هؤلاء إن كنتم صادقين قالا: ففزع القوم إلى التوبة، وإليها يفزع كل مؤمن، فقالوا: «سُبْحانَكَ لا عِلْمَ لَنا إِلَّا مَا عَلَّمْتَنا إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ قالَ يَا آدَمُ أَنْبِئْهُمْ بِأَسْمائِهِمْ فَلَمَّا أَنْبَأَهُمْ بِأَسْمائِهِمْ قالَ أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّماواتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» لقولهم: ليخلق ربنا ما شاء، فلن يخلق خلقا أكرم عليه منا، ولا أعلم منا، قال: علمه اسم كل شيء:\nهذه الخيل، وهذه البغال، والإبل، والجن، والوحش، وجعل يسمي كل شيء باسمه، وعرضت عليه أمة أمة، قال: «أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّماواتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، قال:\n\nاما ما أبدوا فقولهم: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وأما ما كتموا فقولهم بعضهم لبعض: نحن خير منه وأعلم.","bs_ranges":[],"bs_html":"Kada su se zadivili svojim znanjem, bili su iskušani. Pa je poučio Adema svim imenima, zatim ih pokazao melekima i rekao: ‘Obavijestite Me o imenima ovih, ako istinu govorite’ — da nisam stvorio nijedno stvorenje a da vi ne budete učeniji od njega. ‘Obavijestite Me o imenima ovih, ako istinu govorite.’“ Obojica su rekli: „Tada su pribjegli pokajanju, a njemu pribjegava svaki vjernik, pa su rekli: ‘Slavljen neka si! Mi nemamo znanja osim onoga čemu si nas Ti poučio. Ti si, doista, Sveznajući, Mudri. Rekao je: Ademe, obavijesti ih o njihovim imenima! Kada ih je obavijestio o njihovim imenima, rekao je: Zar vam nisam rekao da Ja znam nevidljivo nebesa i Zemlje i znam ono što pokazujete i ono što ste krili?’“ Zbog njihovih riječi: „Neka naš Gospodar stvori šta god želi; neće stvoriti nijedno stvorenje koje bi Mu bilo uglednije od nas niti učenije od nas.“ Rekao je: „Poučio ga je imenu svega: ovo su konji, ovo su mazge, deve, džini i divlje životinje. Počeo je imenovati svaku stvar njenim imenom, a pokazivane su mu vrste jedna po jedna.“ Rekao je: „Zar vam nisam rekao da Ja znam nevidljivo nebesa i Zemlje i znam ono što pokazujete i ono što ste krili?“ Rekao je: „Ono što su pokazali njihove su riječi: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ A ono što su krili njihove su međusobne riječi: ‘Mi smo bolji od njega i učeniji.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30–33, navedeni dijelovi. Početak izvornog navoda فعلم آدم prenesen je kao „Pa je poučio Adema“; u mushafu u 2:31 stoji وعلم آدم („I poučio je Adema“). Formulacija „Obavijestite Me…“ koja se ponavlja izvan navodnika izvora prenosi tekst predaje, a nije dopuna ajeta.⟧\u003c/span>"},{"id":"102.2","ar":"حَدَّثَنَا عَمَّارُ بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أَنَسٍ: «ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ فَقالَ أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» إِلَى قَوْلِهِ: «إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ\n» ، قَالَ: وَذَلِكَ حِينَ قَالُوا: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» إِلَى قَوْلِهِ «وَنُقَدِّسُ لَكَ» قَالَ: فَلَمَّا عَرَفُوا أَنَّهُ جَاعِلٌ فِي الأَرْضِ خَلِيفَةً قَالُوا بَيْنَهُمْ: لَنْ يَخْلُقَ اللَّهُ تعالى خَلْقًا إِلا كُنَّا نَحْنُ أَعْلَمُ مِنْهُ وَأَكْرَمُ عَلَيْهِ، فَأَرَادَ اللَّهُ تعالى أَنْ يُخْبِرَهُمْ أَنَّهُ قَدْ فَضَّلَ عَلَيْهِمْ آدَمَ، وَعَلَّمَهُ الأَسْمَاءَ كُلَّهَا، وَقَالَ","bs":"Pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, o riječima: „Zatim ih je pokazao melekima i rekao: Obavijestite Me o imenima ovih, ako istinu govorite“ — do Njegovih riječi: „Ti si, doista, Sveznajući, Mudri.“ Rekao je: „To je bilo kada su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati’ — do Njegovih riječi: ‘I svetost Ti iskazujemo.’“ Rekao je: „Kada su saznali da će On postaviti namjesnika na Zemlji, među sobom su rekli: ‘Allah neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji.’ Uzvišeni Allah htio ih je obavijestiti da je Adema odlikovao nad njima i poučio ga svim imenima. Rekao je ⟦Prijevodi navedenih dijelova: El-Bekara, 2:31–32 i 2:30. Prijelazi „do Njegovih riječi“ sačuvani su iz izvora.⟧","ar_ranges":[[0,93]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا عَمَّارُ بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أَنَسٍ: \u003c/span>«ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ فَقالَ أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» إِلَى قَوْلِهِ: «إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ\n» ، قَالَ: وَذَلِكَ حِينَ قَالُوا: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» إِلَى قَوْلِهِ «وَنُقَدِّسُ لَكَ» قَالَ: فَلَمَّا عَرَفُوا أَنَّهُ جَاعِلٌ فِي الأَرْضِ خَلِيفَةً قَالُوا بَيْنَهُمْ: لَنْ يَخْلُقَ اللَّهُ تعالى خَلْقًا إِلا كُنَّا نَحْنُ أَعْلَمُ مِنْهُ وَأَكْرَمُ عَلَيْهِ، فَأَرَادَ اللَّهُ تعالى أَنْ يُخْبِرَهُمْ أَنَّهُ قَدْ فَضَّلَ عَلَيْهِمْ آدَمَ، وَعَلَّمَهُ الأَسْمَاءَ كُلَّهَا، وَقَالَ","bs_ranges":[[0,122]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, \u003c/span>o riječima: „Zatim ih je pokazao melekima i rekao: Obavijestite Me o imenima ovih, ako istinu govorite“ — do Njegovih riječi: „Ti si, doista, Sveznajući, Mudri.“ Rekao je: „To je bilo kada su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati’ — do Njegovih riječi: ‘I svetost Ti iskazujemo.’“ Rekao je: „Kada su saznali da će On postaviti namjesnika na Zemlji, među sobom su rekli: ‘Allah neće stvoriti nijedno stvorenje a da mi ne budemo učeniji od njega i kod Njega ugledniji.’ Uzvišeni Allah htio ih je obavijestiti da je Adema odlikovao nad njima i poučio ga svim imenima. Rekao je \u003cspan class=\"translator-note\">⟦Prijevodi navedenih dijelova: El-Bekara, 2:31–32 i 2:30. Prijelazi „do Njegovih riječi“ sačuvani su iz izvora.⟧\u003c/span>"}],"notes":[]}]}</script><script id="databaseData" type="application/json">[{"stranica":78,"ar_tekst":"قال أبو جعفر: والصواب من القول في ذلك عندنا أن يقال: إن الله تعالى ذكره خلق شمس النهار وقمر الليل آيتين، فجعل آية النهار التي هي الشمس مبصرة يبصر بها، ومحا آية الليل التي هي القمر بالسواد الذي فيه.","bs_tekst":"Ebu Džafer kaže: Ispravno je, prema našem mišljenju, reći da je Allah, Uzvišen je spomen Njegov, stvorio dnevno Sunce i noćni Mjesec kao dva znaka. Znak dana, a to je Sunce, učinio je takvim da se pomoću njega vidi, a znak noći, a to je Mjesec, izbrisao je crnilom koje je na njemu."},{"stranica":78,"ar_tekst":"وجائز أن يكون الله تعالى ذكره خلقهما شمسين من نور عرشه، ثم محا نور القمر بالليل على نحو ما قاله من ذكرنا قوله، فكان ذلك سبب اختلاف حالتيهما.","bs_tekst":"Moguće je da ih je Allah, Uzvišen je spomen Njegov, stvorio kao dva sunca od svjetlosti Svoga Arša, zatim izbrisao Mjesečevu svjetlost noću na način kako su to rekli oni čije smo mišljenje spomenuli, pa je to bilo uzrokom njihove različitosti."},{"stranica":78,"ar_tekst":"وجائز أن يكون إضاءة الشمس للكسوة التي تكساها من ضوء العرش، ونور القمر من الكسوة التي يكساها من نور الكرسي.","bs_tekst":"Moguće je i da Sunčev sjaj potječe od odore kojom se odijeva, od sjaja Arša, a Mjesečeva svjetlost od odore kojom se odijeva, od svjetlosti Kursijja."},{"stranica":78,"ar_tekst":"ولو صح سند أحد الخبرين اللذين ذكرتهما لقلنا به، ولكن في أسانيدهما نظرا، فلم نستجز قطع القول بتصحيح ما فيهما من الخبر عن سبب اختلاف حال الشمس والقمر، غير أنا بيقين نعلم أن الله عز وجل خالف بين صفتيهما في الإضاءة لما كان أعلم به من صلاح خلقه باختلاف أمريهما، فخالف بينهما، فجعل أحدهما مضيئا مبصرا به، والآخر ممحو الضوء.","bs_tekst":"Kada bi lanac prenosilaca jedne od dviju predaja koje sam spomenuo bio vjerodostojan, prihvatili bismo je. Međutim, njihovi lanci prenosilaca zahtijevaju razmatranje, pa nismo smatrali dopuštenim odlučno potvrditi ono što u njima stoji o uzroku različitosti Sunca i Mjeseca. Ipak, pouzdano znamo da je Allah, Silan i Uzvišen, učinio njihova svojstva različitim u pogledu svjetlosti zbog dobrobiti za Svoja stvorenja, koju je najbolje znao, a koja proizlazi iz njihove različitosti. Razlikovao ih je: jedno je učinio sjajnim, da se pomoću njega vidi, a drugome izbrisao sjaj."},{"stranica":78,"ar_tekst":"وإنما ذكرنا قدر ما ذكرنا من أمر الشمس والقمر في كتابنا هذا، وإن كنا قد أعرضنا عن ذكر كثير من أمرهما وأخبارهما، مع إعراضنا عن ذكر بدء خلق الله السموات والأرض وصفة ذلك، وسائر ما تركنا ذكره من جميع خلق الله في هذا الكتاب، لأن قصدنا في كتابنا هذا ذكر ما قدمنا الخبر عنه أنا ذاكروه فيه من ذكر الأزمنة وتاريخ الملوك والأنبياء والرسل، على ما قد شرطنا في أول هذا الكتاب، وكانت التأريخات والأزمنة إنما توقت بالليالي والأيام التي إنما هي مقادير ساعات جري الشمس والقمر في أفلاكهما على ما قد ذكرنا في الأخبار التي رويناها عن رسول الله ص، وكان ما كان قبل","bs_tekst":"U ovoj smo knjizi spomenuli onoliko o Suncu i Mjesecu koliko smo spomenuli, premda smo izostavili mnogo o njihovom stanju i predajama o njima, kao što smo izostavili govor o početku Allahovog stvaranja nebesa i Zemlje i opisu toga, te ostalo što smo u ovoj knjizi ostavili nespomenutim od svih Allahovih stvorenja. Razlog je što je naš cilj u ovoj knjizi spomenuti ono za šta smo unaprijed kazali da ćemo u njoj govoriti: vremena i historiju kraljeva, vjerovjesnika i poslanika, prema onome što smo postavili na početku ove knjige. Datumi i vremenska razdoblja određuju se noćima i danima, koji su mjere sati kretanja Sunca i Mjeseca njihovim putanjama, kako smo naveli u predajama koje smo prenijeli od Allahovog Poslanika, sallallahu alejhi ve sellem. A ono što je od Njegovih stvorenja bilo prije"},{"stranica":79,"ar_tekst":"خلق الله عز ذكره إياهما من خلقه في غير أوقات ولا ساعات ولا ليل ولا نهار.","bs_tekst":"nego što je Allah, Silan je spomen Njegov, stvorio njih dvoje, bilo je bez vremenskih odsječaka i sati, bez noći i dana."},{"stranica":79,"ar_tekst":"وإذ كنا قد بينا مقدار مدة ما بين أول ابتداء الله عز وجل في إنشاء ما أراد إنشاءه من خلقه إلى حين فراغه من إنشاء جميعهم من سني الدنيا ومدة أزمانها بالشواهد التي استشهدنا بها من الآثار والأخبار، وأتينا على القول في مدة ما بعد أن فرغ من خلق جميعه إلى فناء الجميع بالأدلة التي دللنا بها على صحة ذلك من الاخبار الوارده عن رسول الله ص وعن الصحابة وغيرهم من علماء الأمة، وكان الغرض في كتابنا هذا ذكر ما قد بينا أنا ذاكروه من تاريخ الملوك الجبابرة العاصية ربها عز وجل والمطيعة ربها منهم، وأزمان الرسل والأنبياء، وكنا قد أتينا على ذكر ما به تصح التأريخات وتعرف به الأوقات والساعات، وذلك الشمس والقمر اللذان بأحدهما تدرك معرفه ساعات الليل وأوقاته، وبالآخر تدرك علم ساعات النهار وأوقاته فلنقل الآن في أول من أعطاه الله ملكا، وأنعم عليه فكفر نعمته، وجحد ربوبيته، وعتا على ربه واستكبر، فسلبه الله نعمته، وأخزاه وأذله ثم نتبعه ذكر من استن في ذلك سنته، واقتفى فيه أثره، فأحل الله به نقمته وجعله من شيعته، وألحقه به في الخزي والذل ونذكر من كان بإزائه أو بعده من الملوك المطيعة ربها المحمودة آثارها، أو من الرسل والأنبياء إن شاء الله عز وجل.","bs_tekst":"Objasnili smo, pomoću svjedočanstava iz predaja i izvješća koja smo naveli, koliko je, u godinama ovoga svijeta i trajanju njegovih razdoblja, trajalo vrijeme od prvog početka kada je Allah, Silan i Uzvišen, stvarao ono što je htio stvoriti od Svojih stvorenja do dovršetka stvaranja svih njih. Izložili smo i govor o trajanju razdoblja nakon što je dovršio stvaranje svih njih do nestanka svih njih, uz dokaze kojima smo potvrđivali ispravnost toga iz predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, od ashaba i drugih učenih ljudi ummeta. Cilj naše knjige jeste ono što smo već objasnili da ćemo spomenuti: historija silničkih kraljeva nepokornih svome Gospodaru, Silnom i Uzvišenom, i onih među njima koji su Mu bili pokorni, te vremena poslanika i vjerovjesnika. Već smo spomenuli ono pomoću čega se datumi ispravno određuju i poznaju vremenski odsječci i sati, a to su Sunce i Mjesec: pomoću jednog poznaju se sati i vremena noći, a pomoću drugog sati i vremena dana. Sada ćemo govoriti o prvome kome je Allah dao vlast i darovao blagodat, pa je on porekao Njegovu blagodat, zanijekao Njegovo gospodstvo, osilio se protiv svoga Gospodara i uzoholio. Allah mu je oduzeo blagodat, osramotio ga i ponizio. Zatim ćemo navesti onoga koji je krenuo njegovim putem i slijedio njegov trag u tome, pa je Allah na njega spustio Svoju kaznu, učinio ga njegovim sljedbenikom i pridružio mu ga u sramoti i poniženju. Spomenut ćemo i kraljeve pokorne svome Gospodaru, čiji su tragovi hvalevrijedni, ili poslanike i vjerovjesnike koji su bili u isto vrijeme s njim ili poslije njega, ako Allah, Silan i Uzvišen, htjedne."},{"stranica":79,"ar_tekst":"فأولهم وإمامهم في ذلك ورئيسهم وقائدهم فيه إبليس لعنه الله.","bs_tekst":"Prvi među njima, njihov predvodnik, poglavar i vođa u tome bio je Iblis, Allah ga prokleo."},{"stranica":79,"ar_tekst":"وكان الله عز وجل قد احسن خلقه وشرفه وكرمه وملكه على سماء الدنيا والأرض فيما ذكر، وجعله مع ذلك من خزان الجنة، فاستكبر على ربه","bs_tekst":"Allah, Silan i Uzvišen, bio mu je dao lijep lik, počastio ga, uzvisio i dao mu vlast nad najbližim nebom i Zemljom, prema onome što je navedeno. Uz to ga je učinio jednim od čuvara Dženneta. Ali on se uzoholio protiv svoga Gospodara"},{"stranica":80,"ar_tekst":"وادعى الربوبية، ودعا من كان تحت يده فيما ذكر إلى عبادته، فمسخه الله تعالى شيطانا رجيما، وشوه خلقه، وسلبه ما كان حوله، ولعنه وطرده عن سمواته في العاجل، ثم جعل مسكنه ومسكن اتباعه وشيعته في الآخرة نار جهنم، نعوذ بالله من غضبه، ومن عمل يقرب من غضبه، ومن الحور بعد الكور.","bs_tekst":"i prisvojio sebi gospodstvo. Prema onome što je navedeno, pozvao je one koji su bili pod njegovom vlašću da ga obožavaju. Uzvišeni Allah pretvorio ga je u prokletog šejtana, unakazio mu lik, oduzeo mu ono što je bilo oko njega, prokleo ga i odmah ga protjerao sa Svojih nebesa. Zatim je njegovo prebivalište i prebivalište njegovih pratilaca i sljedbenika na budućem svijetu učinio džehennemskom vatrom. Utječemo se Allahu od Njegove srdžbe, od djela koja približavaju Njegovoj srdžbi i od nazadovanja nakon učvršćenosti. ⟦Napomena prevodioca: izvor u izrazu وسلبه ما كان حوله ima حوله, ovdje doslovno preneseno „oko njega“. Mjesto zahtijeva provjeru štampanog izdanja; nije prešutno zamijenjeno riječju s drugačijim slovom ili značenjem.⟧"},{"stranica":80,"ar_tekst":"ونبدأ بذكر جمل من الأخبار الواردة عن السلف بما كان الله عز وجل أعطاه من الكرامة قبل استكباره عليه، وادعائه ما لم يكن له ادعاؤه، ثم نتبع ذلك ما كان من الأحداث في أيام سلطانه وملكه إلى حين زوال ذلك عنه، والسبب الذي به زال عنه ما كان فيه من نعمة الله عليه، وجميل آلائه، وغير ذلك من أموره، إن شاء الله مختصرا","bs_tekst":"Počet ćemo navođenjem skupina predaja koje su došle od prethodnika o počastima koje mu je Allah, Silan i Uzvišen, dao prije nego što se uzoholio protiv Njega i prisvojio sebi ono na šta nije imao pravo. Zatim ćemo navesti događaje iz vremena njegove vlasti i vladavine, sve do vremena kada je to izgubio, i razlog zbog kojeg su od njega nestale Allahove blagodati i divna dobročinstva koja mu je darovao, te ostalo o njemu, ako Allah htjedne, ukratko."},{"stranica":81,"ar_tekst":"ذكر الأخبار الواردة بأن إبليس كان له ملك السماء الدنيا والأرض وما بين ذلك","bs_tekst":"Spomen predaja prema kojima je Iblis imao vlast nad najbližim nebom, Zemljom i onim što je između njih"},{"stranica":81,"ar_tekst":"حدثنا القاسم بن الحسن، قال: حدثنا الحسين بْنُ دَاوُدَ، قَالَ: حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: قَالَ ابْنُ عَبَّاسٍ: كَانَ إِبْلِيسُ مِنْ أَشْرَافِ الْمَلائِكَةِ وَأَكْرَمِهِمْ قَبِيلَةً، وَكَانَ خَازِنًا عَلَى الْجِنَانِ، وَكَانَ لَهُ سُلْطَانُ سَمَاءِ الدُّنْيَا، وَكَانَ لَهُ سُلْطَانُ الأَرْضِ.","bs_tekst":"Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, koji je rekao: Ibn Abbas je rekao: „Iblis je bio jedan od uglednih meleka, iz njihovog najplemenitijeg plemena. Bio je čuvar džennetskih vrtova i imao je vlast nad najbližim nebom i vlast nad Zemljom.“"},{"stranica":81,"ar_tekst":"حَدَّثَنَا الْقَاسِمُ، قَالَ: حدثنا الحسين، قال: حدثني حجاج، عن ابن جريج، عن صالح مولى التوءمه وَشَرِيكِ بْنِ أَبِي نَمِرٍ- أَحَدُهُمَا أَوْ كِلاهُمَا- عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ مِنَ الْمَلائِكَةِ قَبِيلَةً مِنَ الْجِنِّ وَكَانَ إِبْلِيسُ مِنْهَا، وَكَانَ يَسُوسُ مَا بَيْنَ السَّمَاءِ وَالأَرْضِ.","bs_tekst":"Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, od Saliha, oslobođenika Tev’eme, i Šerika ibn Ebu Nemira — jednoga od njih ili obojice — od Ibn Abbasa, koji je rekao: „Među melekima postoji pleme džina, a Iblis je bio iz njega. Upravljao je onim što je između neba i Zemlje.“"},{"stranica":81,"ar_tekst":"حَدَّثَنَا مُوسَى بن هارون الهمداني، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك، وعن أبي صالح عن ابن عباس، وعن مرة الهمداني عن ابن مسعود، وعن ناس من أصحاب النبي ص جعل ابليس على سَمَاءِ الدُّنْيَا، وَكَانَ مِنْ قَبِيلَةٍ مِنَ الْمَلائِكَةِ يُقَالُ لَهُمُ الْجِنُّ، وَإِنَّمَا سُمُّوا الْجِنَّ لأَنَّهُمْ خُزَّانُ الْجَنَّةِ، وَكَانَ إِبْلِيسُ مَعَ مُلْكِهِ خَازِنًا.","bs_tekst":"Pričao nam je Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa, te od Murre el-Hemdanija, od Ibn Mesuda, i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: „Postavio je Iblisa nad najbližim nebom. Bio je iz plemena meleka koje se naziva džinima. Nazvani su džinima zato što su čuvari Dženneta. Iblis je, pored svoje vlasti, bio i čuvar.“"},{"stranica":81,"ar_tekst":"حَدَّثَنِي عَبْدَانُ الْمَرْوَزِيُّ، حَدَّثَنِي الْحُسَيْنُ بْنُ الْفَرَجِ، قَالَ: سَمِعْتُ أَبَا مُعَاذٍ الْفَضْلَ بْنَ خَالِدٍ قَالَ: أَخْبَرَنَا عُبَيْدُ اللَّهِ بْنُ سُلَيْمَانَ، قَالَ: سمعت الضحاك ابن مُزَاحِمٍ يَقُولُ فِي قَوْلِهِ عَزَّ وَجَلَّ: «فَسَجَدُوا إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ» ، قَالَ: كَانَ ابْنِ عَبَّاسٍ يَقُولُ: إِنَّ إِبْلِيسَ كان من اشرف الملائكة واكرمهم","bs_tekst":"Pričao mi je Abdan el-Mervezi: pričao mi je Husejn ibn el-Feredž, koji je rekao: čuo sam Ebu Muaza el-Fadla ibn Halida kako kaže: obavijestio nas je Ubejdullah ibn Sulejman, koji je rekao: čuo sam Dahhaka ibn Muzahima kako, o riječima Njega, Silnog i Uzvišenog: „Pa su učinili sedždu, osim Iblisa; bio je od džina“, kaže: „Ibn Abbas govorio je: ‘Iblis je bio jedan od uglednih meleka, iz njihovog najplemenitijeg ⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧"},{"stranica":82,"ar_tekst":"قَبِيلَةً، وَكَانَ خَازِنًا عَلَى الْجِنَانِ، وَكَانَ لَهُ سُلْطَانُ سَمَاءِ الدُّنْيَا، وَكَانَ لَهُ سُلْطَانُ الأَرْضِ.","bs_tekst":"plemena. Bio je čuvar džennetskih vrtova i imao je vlast nad najbližim nebom i vlast nad Zemljom.’“"},{"stranica":82,"ar_tekst":"حدثنا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا الْمُبَارَكُ بْنُ مُجَاهِدٍ أَبُو الأَزْهَرِ، عَنْ شَرِيكِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي نَمِرٍ، عَنْ صَالِحٍ مَوْلَى التَّوْءَمَةِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ مِنَ الْمَلائِكَةِ قَبِيلا يُقَالُ لَهُمُ الْجِنُّ، فَكَانَ إِبْلِيسُ مِنْهُمْ، وَكَانَ يَسُوسُ مَا بَيْنَ السَّمَاءِ وَالأَرْضِ فَعَصَى، فَمَسَخَهُ اللَّهُ شَيْطَانًا رجيما","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Mubarek ibn Mudžahid, Ebu Ezher, od Šerika ibn Abdullaha ibn Ebu Nemira, od Saliha, oslobođenika Tev’eme, od Ibn Abbasa, koji je rekao: „Među melekima postoji pleme koje se naziva džinima, a Iblis je bio od njih. Upravljao je onim što je između neba i Zemlje, pa je bio nepokoran i Allah ga je pretvorio u prokletog šejtana.“"},{"stranica":83,"ar_tekst":"ذكر الخبر عن غمط عدو الله نعمة ربه واستكباره عليه وادعائه الربوبية","bs_tekst":"Spomen predaje o tome kako je Allahov neprijatelj omalovažio blagodat svoga Gospodara, uzoholio se protiv Njega i prisvojio sebi gospodstvo"},{"stranica":83,"ar_tekst":"حَدَّثَنَا القاسم، قال: حدثنا الحسين، قال: حدثني حجاج، عن ابن جريج: «وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ» قال: قال، ابن جريج:\nمن يقل من الملائكة إني إله من دونه، فلم يقله إلا إبليس، دعا إلى عباده نفسه، فنزلت هذه الآية في إبليس.","bs_tekst":"Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, o riječima: „A ko od njih kaže: Ja sam bog mimo Njega.“ Rekao je: Ibn Džurejdž rekao je: „Ko od meleka kaže: ‘Ja sam bog mimo Njega.’ To nije rekao niko osim Iblisa. Pozvao je da obožavaju njega samoga, pa je ovaj ajet objavljen o Iblisu.“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:29, navedeni dio.⟧"},{"stranica":83,"ar_tekst":"حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ، قال: حدثنا سعيد، عن قتادة: «وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ فَذلِكَ نَجْزِيهِ جَهَنَّمَ كَذلِكَ نَجْزِي الظَّالِمِينَ» ، وإنما كانت هذه الآية خاصة لعدو الله إبليس لما قال ما قال، لعنه الله وجعله رجيما، فقال: «فَذلِكَ نَجْزِيهِ جَهَنَّمَ كَذلِكَ نَجْزِي الظَّالِمِينَ» .","bs_tekst":"Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid, koji je rekao: pričao nam je Seid, od Katade, o riječima: „A ko od njih kaže: Ja sam bog mimo Njega — takvome ćemo Džehennemom uzvratiti. Tako uzvraćamo nepravednicima.“ „Ovaj se ajet posebno odnosio na Allahovog neprijatelja Iblisa. Kada je rekao ono što je rekao, Allah ga je prokleo i učinio prokletim, pa je rekao: ‘Takvome ćemo Džehennemom uzvratiti. Tako uzvraćamo nepravednicima.’“ ⟦Prijevodi kur’anskih navoda: El-Enbija, 21:29. Drugi navod ponavlja završni dio istog ajeta.⟧"},{"stranica":83,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا محمد بن ثور، عن معمر، عن قتادة: «وَمَنْ يَقُلْ مِنْهُمْ إِنِّي إِلهٌ مِنْ دُونِهِ فَذلِكَ نَجْزِيهِ جَهَنَّمَ» ، قال: هي خاصة لإبليس","bs_tekst":"Pričao nam je Muhammed ibn Abdula‘la, koji je rekao: pričao nam je Muhammed ibn Sevr, od Ma‘mera, od Katade, o riječima: „A ko od njih kaže: Ja sam bog mimo Njega — takvome ćemo Džehennemom uzvratiti.“ Rekao je: „Ovo se posebno odnosi na Iblisa.“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:29, navedeni dio.⟧"},{"stranica":84,"ar_tekst":"القول في الأحداث التي كانت في أيام ملك ابليس وسلطانه والسبب الذي به هلك وادعى الربوبية","bs_tekst":"Rasprava o događajima iz vremena Iblisove vlasti i vladavine te o razlogu njegove propasti i prisvajanja gospodstva"},{"stranica":84,"ar_tekst":"فمن الأحداث التي كانت في ملك عدو الله- إذ كان لله مطيعا- ما ذكر لنا عن ابْنِ عَبَّاسٍ في الخبر الذي حَدَّثَنَاهُ أَبُو كُرَيْبٍ، قَالَ:\nحَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: كَانَ إِبْلِيسُ مِنْ حَيٍّ مِنْ أَحْيَاءِ الْمَلائِكَةِ يُقَالُ لَهُمُ: الْجِنُّ خُلِقُوا مِنْ نَارِ السَّمُومِ مِنْ بَيْنَ الْمَلائِكَةِ، قَالَ: وَكَانَ اسْمُهُ الْحَارِثَ، قَالَ: وَكَانَ خَازِنًا مِنْ خُزَّانِ الْجَنَّةِ، قَالَ: وَخُلِقَتِ الْمَلائِكَةُ كُلُّهُمْ مِنْ نُورٍ غَيْرَ هَذَا الْحَيِّ، قَالَ: وَخُلِقَتِ الْجِنُّ الَّذِينَ ذُكِرُوا في القرآن من مارج من نار، وَهُوَ لِسَانُ النَّارِ الَّذِي يَكُونُ فِي طَرْفِهَا إِذَا أُلْهِبَتْ، قَالَ: وَخُلِقَ الإِنْسَانُ مِنْ طِينٍ، فَأَوَّلُ مَنْ سَكَنَ الأَرْضَ الْجِنُّ فَأَفْسَدُوا فِيهَا وَسَفَكُوا الدِّمَاءَ، وَقَتَلَ بَعْضُهُمْ بَعْضًا، قَالَ: فَبَعَثَ اللَّهُ إِلَيْهِمْ إِبْلِيسَ فِي جُنْدٍ مِنَ الْمَلائِكَةِ وهم هَذَا الْحَيُّ الَّذِينَ يُقَالُ لَهُمُ الْجِنُّ، فَقَتَلَهُمْ ابليس ومن معه حي أَلْحَقَهُمْ بِجَزَائِرِ الْبُحُورِ وَأَطْرَافِ الْجِبَالِ، فَلَمَّا فَعَلَ إِبْلِيسُ ذَلِكَ اغْتَرَّ فِي نَفْسِهِ، وَقَالَ: قَدْ صَنَعْتُ شَيْئًا لَمْ يَصْنَعْهُ أَحَدٌ، قَالَ: فَاطَّلَعَ الله على ذلك من قبله، وَلَمْ تَطَّلِعْ عَلَيْهِ الْمَلائِكَةُ الَّذِينَ كَانُوا مَعَهُ.","bs_tekst":"Među događajima iz vremena vlasti Allahovog neprijatelja — dok je još bio pokoran Allahu — jeste ono što nam je navedeno od Ibn Abbasa u predaji koju nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Iblis je bio iz jedne od skupina meleka koje se nazivaju džinima. Među melekima su oni bili stvoreni od vatre žarkoga vjetra.“ Rekao je: „Ime mu je bilo Haris.“ Rekao je: „Bio je jedan od čuvara Dženneta.“ Rekao je: „Svi meleki, osim te skupine, stvoreni su od svjetlosti.“ Rekao je: „Džini spomenuti u Kur’anu stvoreni su od plamena vatre, a to je vatreni jezik na njenom vrhu kada se razgori.“ Rekao je: „Čovjek je stvoren od gline. Prvi koji su nastanili Zemlju bili su džini, pa su na njoj činili nered, prolijevali krv i ubijali jedni druge.“ Rekao je: „Allah im je poslao Iblisa s vojskom meleka, a to je ta skupina koja se naziva džinima. Iblis i oni koji su bili s njim ubijali su ih sve dok ih nisu potisnuli na morske otoke i rubove planina. Kada je Iblis to učinio, zanio se sobom i rekao: ‘Učinio sam nešto što niko drugi nije učinio.’“ Rekao je: „Allah je znao za to kod njega, a meleki koji su bili s njim nisu to znali.“ ⟦Napomena prevodioca: izvor ima nejasan spoj حي ألحقهم. „Sve dok ih nisu potisnuli“ prenosi kontekstualno čitanje, vjerovatno حتى ألحقهم; potrebno je provjeriti štampano izdanje.⟧"},{"stranica":84,"ar_tekst":"حدثني المثنى، قال: حدثنا إسحاق بن الحجاج، قال: حدثنا عبد الله بن أبي جعفر عَنْ أَبِيهِ، عَنِ الرَّبِيعِ بْنِ أَنَسٍ، قَالَ: إِنَّ اللَّهَ خَلَقَ الْمَلائِكَةَ يَوْمَ الأَرْبِعَاءِ، وَخَلَقَ الْجِنَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ يَوْمَ الْجُمُعَةِ، قَالَ:\n\nفَكَفَرَ قَوْمٌ مِنَ الْجِنِّ، فَكَانَتِ الْمَلائِكَةُ تهبط اليهم في الارض فتقتلهم فَكَانَتِ الدِّمَاءُ وَكَانَ الْفَسَادُ فِي الأَرْضِ","bs_tekst":"Pričao mi je Musenna, koji je rekao: pričao nam je Ishak ibn el-Hadždžadž, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, koji je rekao: „Allah je stvorio meleke u srijedu, džine u četvrtak, a Adema u petak.“ Rekao je: „Jedna skupina džina postala je nevjernička, pa su im meleki silazili na Zemlju i ubijali ih. Tako je na Zemlji bilo krvi i nereda.“"},{"stranica":85,"ar_tekst":"ذكر السبب الذي به هلك عدو الله وسولت له نفسه من أجله الاستكبار على ربه عز وجل","bs_tekst":"Spomen razloga zbog kojeg je Allahov neprijatelj propao i zbog kojeg ga je njegova duša navela da se uzoholi protiv svoga Gospodara, Silnog i Uzvišenog"},{"stranica":85,"ar_tekst":"اختلف السلف من الصحابة والتابعين في ذلك، وقد ذكرنا أحد الأقوال التي رويت في ذلك عن ابْنِ عَبَّاسٍ، وذلك ما ذكر الضحاك عنه، أنه لما قتل الجن الذين عصوا الله، وأفسدوا في الأرض وشردهم، أعجبته نفسه ورأى في نفسه أن له بذلك من الفضيلة ما ليس لغيره.","bs_tekst":"Prethodnici među ashabima i tabi‘inima razišli su se o tome. Već smo spomenuli jedno od mišljenja prenesenih od Ibn Abbasa: ono što je Dahhak naveo od njega, da se Iblis, kada je ubijao džine koji su bili nepokorni Allahu i činili nered na Zemlji te ih rastjerao, zadivio sam sobom i smatrao da time ima odliku koju drugi nemaju."},{"stranica":85,"ar_tekst":"والقول الثاني من الأقوال المروية في ذلك عن ابْنِ عَبَّاسٍ، أنه كان ملك سماء الدنيا وسائسها، وسائس ما بينها وبين الأرض، وخازن الجنة، مع اجتهاده في العبادة، فأعجب بنفسه، ورأى أن له بذلك الفضل، فاستكبر على ربه عز وجل.","bs_tekst":"Drugo mišljenje preneseno od Ibn Abbasa jeste da je Iblis bio vladar i upravitelj najbližeg neba, upravitelj onoga što je između njega i Zemlje i čuvar Dženneta, uz svoju revnost u ibadetu. Zato se zadivio sam sobom, smatrao da mu time pripada prednost i uzoholio se protiv svoga Gospodara, Silnog i Uzvišenog."},{"stranica":85,"ar_tekst":"ذكر الرواية عنه بذلك:","bs_tekst":"Spomen predaje od njega o tome:"},{"stranica":85,"ar_tekst":"حَدَّثَنَا مُوسَى بْنُ هَارُونَ الْهَمْدَانِيُّ، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب النبي ص، قال: لَمَّا فَرَغَ اللَّهُ عَزَّ وَجَلَّ مِنْ خَلْقِ مَا أَحَبَّ اسْتَوَى عَلَى الْعَرْشِ، فَجَعَلَ إِبْلِيسَ عَلَى مُلْكِ سَمَاءِ الدُّنْيَا وَكَانَ مِنْ قَبِيلَةٍ مِنَ الْمَلائِكَةِ يُقَالُ لَهُمُ الْجِنُّ، وَإِنَّمَا سُمُّوا الْجِنَّ لأَنَّهُمْ خُزَّانُ الْجَنَّةِ، وَكَانَ إِبْلِيسُ مَعَ مُلْكِهِ خَازِنًا، فَوَقَعَ فِي صَدْرِهِ كِبْرٌ، وَقَالَ: مَا أَعْطَانِي اللَّهُ هَذَا إِلا لِمَزِيَّةٍ، هَكَذَا حَدَّثَنِي مُوسَى بْنُ هَارُونَ","bs_tekst":"Pričao nam je Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao: „Kada je Allah, Silan i Uzvišen, dovršio stvaranje onoga što je htio, uzvisio se nad Aršom. Iblisu je dao vlast nad najbližim nebom. Bio je iz plemena meleka koje se naziva džinima, a nazvani su džinima zato što su čuvari Dženneta. Iblis je, uz svoju vlast, bio i čuvar. U njegovim se prsima pojavila oholost, pa je rekao: ‘Allah mi ovo nije dao ni zbog čega drugog osim zbog moje posebne odlike.’“ Tako mi je pričao Musa ibn Harun."},{"stranica":86,"ar_tekst":"وحدثني بِهِ أَحْمَدُ بْنُ أَبِي خَيْثَمَةَ، عَنْ عَمْرِو بْنِ حَمَّادٍ، قَالَ:\nلِمَزِيَّةٍ لِي عَلَى الْمَلائِكَةِ فَلَمَّا وَقَعَ ذَلِكَ الْكِبْرُ فِي نَفْسِهِ اطَّلَعَ اللَّهُ عَزَّ وَجَلَّ عَلَى ذَلِكَ مِنْهُ، فَقَالَ اللَّهُ لِلْمَلائِكَةِ: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» .","bs_tekst":"O tome mi je pričao i Ahmed ibn Ebu Hajsema, od Amra ibn Hammada. Rekao je: „Zbog moje posebne odlike nad melekima. Kada se ta oholost pojavila u njegovoj duši, Allah, Silan i Uzvišen, znao je za to kod njega. Allah je rekao melekima: ‘Ja ću na Zemlji postaviti namjesnika.’“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:30, navedeni dio.⟧"},{"stranica":86,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ بْنُ الْفَضْلِ، عَنِ ابْنِ إِسْحَاقَ، عَنْ خَلادِ بْنِ عَطَاءٍ، عَنْ طَاوُسٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: كَانَ إِبْلِيسُ قَبْلَ أَنْ يَرْكَبَ الْمَعْصِيَةَ مِنَ الْمَلائِكَةِ اسْمُهُ عَزَازِيلُ، وَكَانَ مِنْ سُكَّانِ الأَرْضِ، وَكَانَ مِنْ أَشَدِّ الْمَلائِكَةِ اجْتِهَادًا، وَأَكْثَرِهِمْ عِلْمًا، فَذَلِكَ الَّذِي دَعَاهُ إِلَى الْكِبْرِ، وَكَانَ مِنْ حَيٍّ يُسَمُّونَ جِنًّا.","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema ibn el-Fadl, od Ibn Ishaka, od Hallada ibn Ataa, od Tavusa, od Ibn Abbasa, koji je rekao: „Prije nego što je počinio grijeh, Iblis je bio od meleka i ime mu je bilo Azazil. Bio je jedan od stanovnika Zemlje, jedan od najrevnijih meleka i među onima s najviše znanja. To ga je navelo na oholost. Bio je iz skupine koja se naziva džinima.“"},{"stranica":86,"ar_tekst":"وَحَدَّثَنَا بِهِ ابْنُ حُمَيْدٍ مَرَّةً أُخْرَى، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنِ ابْنِ إِسْحَاقَ، عَنْ خَلادِ بْنِ عَطَاءٍ، عَنْ طَاوُسٍ- أَوْ مُجَاهِدٍ أَبِي الْحَجَّاجِ- عَنِ ابْنِ عَبَّاسٍ وَغَيْرِهِ بِنَحْوِهِ، إِلا أَنَّهُ قَالَ: كَانَ مَلَكًا مِنَ الْمَلائِكَةِ اسْمُهُ عَزَازِيلُ، وَكَانَ مِنْ سُكَّانِ الأَرْضِ وَعُمَّارِهَا، وَكَانَ سُكَّانُ الأَرْضِ فِيهِمْ يُسَمُّونَ الْجِنَّ مِنْ بَيْنِ الْمَلائِكَةِ.","bs_tekst":"Ibn Humejd pričao nam je to i drugi put, rekavši: pričao nam je Selema, od Ibn Ishaka, od Hallada ibn Ataa, od Tavusa — ili Mudžahida Ebu Hadždžadža — od Ibn Abbasa i drugih, nešto slično tome, osim što je rekao: „Bio je jedan od meleka, po imenu Azazil. Bio je jedan od stanovnika i nastanjivača Zemlje, a oni među melekima koji su nastanjivali Zemlju nazivali su se džinima.“"},{"stranica":86,"ar_tekst":"حَدَّثَنَا ابْنُ الْمُثَنَّى، قال: حدثنا شيبان، قال: حدثنا سلام ابن مِسْكِينٍ، عَنْ قَتَادَةَ، عَنْ سَعِيدِ بْنِ الْمُسَيِّبِ، قَالَ: كَانَ إِبْلِيسُ رَئِيسَ مَلائِكَةِ سَمَاءِ الدُّنْيَا.","bs_tekst":"Pričao nam je Ibn el-Musenna, koji je rekao: pričao nam je Šejban, koji je rekao: pričao nam je Sellam ibn Miskin, od Katade, od Seida ibn el-Musejjeba, koji je rekao: „Iblis je bio poglavar meleka najbližeg neba.“"},{"stranica":86,"ar_tekst":"والقول الثالث من الأقوال المروية عنه أنه كان يقول: السبب في ذلك أنه كان من بقايا خلق خلقهم الله عز وجل، فأمرهم بأمر فأبوا طاعته.","bs_tekst":"Treće mišljenje preneseno od njega jeste da je govorio: „Razlog tome bio je što je Iblis bio jedan od preostalih pripadnika stvorenja koja je Allah, Silan i Uzvišen, stvorio, pa im je nešto naredio, a oni su odbili poslušati Ga.“"},{"stranica":86,"ar_tekst":"ذكر الرواية عنه بذلك:","bs_tekst":"Spomen predaje od njega o tome:"},{"stranica":87,"ar_tekst":"حدثني محمد بن سنان القزاز، قال: حدثنا أَبُو عَاصِمٍ، عَنْ شَبِيبٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّهَ خَلَقَ خَلْقًا فَقَالَ: اسْجُدُوا لآدَمَ، فَقَالُوا: لا نَفْعَلُ، قَالَ: فَبَعَثَ اللَّهُ عَلَيْهِمْ نَارًا تَحْرِقُهُمْ، ثُمَّ خَلَقَ خَلْقًا آخَرَ فَقَالَ: إِنِّي خَالِقُ بَشَرًا مِنْ طِينٍ فَاسْجُدُوا لآدَمَ، فَأَبَوْا، فَبَعَثَ اللَّهُ عَلَيْهِمْ نَارًا فَأَحْرَقَتْهُمْ، قَالَ: ثُمَّ خَلَقَ هَؤُلاءِ فَقَالَ: الا تسجدوا لادم! قالوا: نعم، قال: وَكَانَ إِبْلِيسُ مِنْ أُولَئِكَ الَّذِينَ أَبَوْا أَنْ يَسْجُدُوا لآدَمَ.","bs_tekst":"Pričao mi je Muhammed ibn Sinan el-Kazzaz, koji je rekao: pričao nam je Ebu Asim, od Šebiba, od Ikrime, od Ibn Abbasa, koji je rekao: „Allah je stvorio stvorenja i rekao im: ‘Učinite sedždu Ademu!’ Odgovorila su: ‘Nećemo to učiniti.’“ Rekao je: „Allah je na njih poslao vatru koja ih je spaljivala. Zatim je stvorio druga stvorenja i rekao: ‘Ja stvaram čovjeka od gline, pa učinite sedždu Ademu!’ Odbila su, pa je Allah na njih poslao vatru i ona ih je spalila.“ Rekao je: „Zatim je stvorio ove i rekao: ‘Zar nećete učiniti sedždu Ademu?’ Odgovorili su: ‘Hoćemo.’“ Rekao je: „Iblis je bio od onih koji su odbili učiniti sedždu Ademu.“"},{"stranica":87,"ar_tekst":"وَقَالَ آخَرُونَ: بَلِ السَّبَبُ فِي ذَلِكَ أَنَّهُ كَانَ مِنْ بَقَايَا الْجِنِّ الَّذِينَ كَانُوا فِي الأَرْضِ، فَسَفَكُوا فِيهَا الدِّمَاءَ، وَأَفْسَدُوا فِيهَا، وَعَصَوْا رَبَّهُمْ، فَقَاتَلَتْهُمُ الْمَلائِكَةُ.","bs_tekst":"Drugi su rekli: „Naprotiv, razlog tome bio je što je on bio jedan od preostalih džina koji su živjeli na Zemlji, na njoj prolijevali krv i činili nered te bili nepokorni svome Gospodaru, pa su se meleki borili protiv njih.“"},{"stranica":87,"ar_tekst":"ذِكْرُ مَنْ قال ذلك:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":87,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا أبو سعيد اليحمدي إسماعيل بن إبراهيم، قال: حَدَّثَنِي سوار بن الجعد اليحمدي، عن شهر بن حوشب، قوله: «كانَ مِنَ الْجِنِّ» ، قال:\nكان إبليس من الجن الذين طردتهم الملائكة، فأسره بعض الملائكة فذهب به إلى السماء.","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jahja ibn Vadih, koji je rekao: pričao nam je Ebu Seid el-Jahmedi, Ismail ibn Ibrahim, koji je rekao: pričao mi je Sevvar ibn el-Dža‘d el-Jahmedi, od Šehra ibn Havšeba, o riječima: „Bio je od džina.“ Rekao je: „Iblis je bio od džina koje su meleki protjerali. Jedan od meleka zarobio ga je i odveo na nebo.“ ⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧"},{"stranica":87,"ar_tekst":"حَدَّثَنِي علي بن الحسن، قال: حَدَّثَنِي أبو نصر أحمد بن محمد الخلال، قال: حَدَّثَنِي سنيد بن داود، قال: حَدَّثَنَا هشيم، قال: أخبرنا عبد الرحمن بن يحيى، عن موسى بن نمير وعثمان بن سعيد بن كامل، عن سعد ابن مسعود، قال: كانت الملائكة تقاتل الجن فسبي إبليس، وكان صغيرا، وكان مع الملائكة يتعبد معهم، فلما أمروا أن يسجدوا لآدم سجدوا وأبى إبليس، فلذلك قال الله عز وجل: «إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ»","bs_tekst":"Pričao mi je Ali ibn el-Hasen, koji je rekao: pričao mi je Ebu Nasr Ahmed ibn Muhammed el-Hallal, koji je rekao: pričao mi je Sunejd ibn Davud, koji je rekao: pričao nam je Hušejm, koji je rekao: obavijestio nas je Abdurrahman ibn Jahja, od Muse ibn Numejra i Osmana ibn Seida ibn Kamila, od Sa‘da ibn Mesuda, koji je rekao: „Meleki su se borili protiv džina, pa je Iblis odveden u ropstvo dok je bio mali. Boravio je s melekima i s njima činio ibadet. Kada im je naređeno da učine sedždu Ademu, oni su je učinili, a Iblis je odbio. Zato Allah, Silan i Uzvišen, kaže: ‘Osim Iblisa; bio je od džina.’“ ⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧"},{"stranica":88,"ar_tekst":"قال ابو جعفر: وأولى الأقوال في ذلك عندي بالصواب أن يقال كما قال الله عز وجل: «وَإِذْ قُلْنا لِلْمَلائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ كانَ مِنَ الْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِ» ، وجائز أن يكون فسوقه عن أمر ربه كان من أجل أنه كان من الجن، وجائز أن يكون من أجل إعجابه بنفسه لشدة اجتهاده كان في عبادة ربه، وكثرة علمه، وما كان أوتي من ملك السماء الدنيا والأرض وخزن الجنان وجائز أن يكون كان لغير ذلك من الأمور، ولا يدرك علم ذلك إلا بخبر تقوم به الحجة، ولا خبر في ذلك عندنا كذلك، والاختلاف في أمره على ما حكينا ورويناه.","bs_tekst":"Ebu Džafer kaže: Smatram da je među mišljenjima o tome najispravnije reći onako kako je rekao Allah, Silan i Uzvišen: „I kada smo rekli melekima: Učinite sedždu Ademu!, oni su je učinili, osim Iblisa; bio je od džina pa je izišao iz pokornosti naredbi svoga Gospodara.“ Moguće je da je iz pokornosti naredbi svoga Gospodara izišao zato što je bio od džina. Moguće je i da je to bilo zbog samodopadnosti izazvane njegovom velikom revnošću u ibadetu Gospodaru, obilnim znanjem i onim što mu je dato od vlasti nad najbližim nebom i Zemljom i čuvanja džennetskih vrtova. Moguće je i da je bilo zbog nečega drugog. To se ne može znati osim na osnovu predaje kojom se uspostavlja dokaz, a mi o tome nemamo takvu predaju. Razilaženje o njegovom slučaju jeste onakvo kakvo smo izložili i prenijeli. ⟦Prijevod kur’anskog navoda: El-Kehf, 18:50, navedeni dio.⟧"},{"stranica":88,"ar_tekst":"وقد قيل: إن سبب هلاكه كان من أجل أن الأرض كان فيها قبل آدم الجن، فبعث الله إبليس قاضيا يقضي بينهم، فلم يزل يقضي بينهم بالحق ألف سنة حتى سمي حكما، وسماه الله به، وأوحى إليه اسمه، فعند ذلك دخله الكبر، فتعظم وتكبر، وألقى بين الذين كان الله بعثه إليهم حكما البأس والعداوة والبغضاء، فاقتتلوا عند ذلك في الأرض ألفي سنة فيما زعموا، حتى إن خيولهم تخوض في دمائهم، قالوا: وذلك قول الله تبارك وتعالى: «أَفَعَيِينا بِالْخَلْقِ الْأَوَّلِ بَلْ هُمْ فِي لَبْسٍ مِنْ خَلْقٍ جَدِيدٍ» ، وقول الملائكة: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ! فبعث الله تعالى عند ذلك نارا فأحرقتهم قالوا:\nفلما رأى إبليس ما نزل بقومه من العذاب عرج إلى السماء، فأقام عند الملائكة يعبد الله في السماء مجتهدا لم يعبده شيء من خلقه مثل عبادته، فلم يزل مجتهدا في العبادة حتى خلق الله آدم، فكان من امره ومعصيته ربه ما كان","bs_tekst":"Rečeno je da je razlog njegove propasti bio to što su prije Adema na Zemlji živjeli džini, pa je Allah poslao Iblisa kao sudiju da im sudi. Neprestano im je hiljadu godina pravedno sudio, sve dok nije nazvan Hakemom. Allah ga je tako nazvao i objavio mu njegovo ime. Tada je u njega ušla oholost, pa se uzvisivao i uzoholio, a među one kojima ga je Allah poslao kao sudiju ubacio je sukob, neprijateljstvo i mržnju. Zatim su se, prema onome što tvrde, dvije hiljade godina međusobno borili na Zemlji, toliko da su im konji gazili kroz njihovu krv. Rekli su: „To su riječi Allaha, Blagoslovljenog i Uzvišenog: ‘Zar Nas je prvo stvaranje iscrpilo? Naprotiv, oni su u nedoumici o novom stvaranju’, i riječi meleka: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’“ Uzvišeni Allah tada je na njih poslao vatru pa ih je spalila. Rekli su: „Kada je Iblis vidio kakva je kazna zadesila njegov narod, uzdigao se na nebo. Boravio je među melekima na nebu i revno obožavao Allaha; nijedno Njegovo stvorenje nije Mu činilo ibadet poput njega. Neprestano je bio revan u ibadetu sve dok Allah nije stvorio Adema. Potom se u njegovom slučaju i njegovoj nepokornosti Gospodaru dogodilo ono što se dogodilo.“ ⟦Prijevodi kur’anskih navoda: Kaf, 50:15; El-Bekara, 2:30, navedeni dio.⟧"},{"stranica":89,"ar_tekst":"[القول في خلق آدم ع]","bs_tekst":"Rasprava o stvaranju Adema, alejhis-selam"},{"stranica":89,"ar_tekst":"وكان مما حدث في أيام سلطانه وملكه خلق الله تعالى ذكره أبانا آدم أبا البشر، وذلك لما أراد جل جلاله أن يطلع ملائكته على ما قد علم من انطواء إبليس على الكبر ولم يعلمه الملائكة، وأراد إظهار أمره لهم حين دنا أمره للبوار، وملكه وسلطانه للزوال، فقال عز ذكره لما أراد ذلك للملائكة: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» ، فأجابوه بأن قالوا له: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ! فروي عن ابْنِ عَبَّاسٍ أن الملائكة قالت ذلك كذلك للذين قد كانوا عهدوا من أمر الجن الذين كانوا سكان الأرض قبل ذلك، فقالوا لربهم جل ثناؤه لما قال لهم: «إِنِّي جاعِلٌ فِي الْأَرْضِ خَلِيفَةً» أتجعل فيها من يكون فيها مثل الجن الذين كانوا فيها، فكانوا يسفكون فيها الدماء ويفسدون فيها ويعصونك، وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لك، فقال الرب تعالى ذكره لهم: «إِنِّي أَعْلَمُ ما لا تَعْلَمُونَ» ، يقول: اعلم ما لا تعلمون من انطواء إبليس على التكبر، وعزمه على خلافه أمري، وتسويل نفسه له الباطل واغتراره، وأنا مبد ذلك لكم منه لتروا ذلك منه عيانا.","bs_tekst":"Među događajima iz vremena njegove vlasti i vladavine bilo je to što je Allah, Uzvišen je spomen Njegov, stvorio našeg oca Adema, oca čovječanstva. To se dogodilo kada je On, Uzvišeno je Njegovo veličanstvo, htio Svojim melekima pokazati ono što je znao o oholosti koju je Iblis skrivao u sebi, a meleki za nju nisu znali. Htio im je otkriti njegov slučaj kada mu se približila propast, a njegovoj vlasti i vladavini nestanak. Kada je to htio, On, Silan je spomen Njegov, rekao je melekima: „Ja ću na Zemlji postaviti namjesnika.“ Odgovorili su Mu: „Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?“ Od Ibn Abbasa preneseno je da su meleki to rekli zbog onoga što su već znali o džinima koji su prije toga nastanjivali Zemlju. Kada im je njihov Gospodar, Uzvišena je Njegova hvala, rekao: „Ja ću na Zemlji postaviti namjesnika“, odgovorili su: „Zar ćeš na njoj postaviti nekoga poput džina koji su na njoj bili, prolijevali krv, činili nered i bili Ti nepokorni, dok mi Tebe s hvalom slavimo i svetost Ti iskazujemo?“ Njihov Gospodar, Uzvišen je spomen Njegov, rekao im je: „Ja znam ono što vi ne znate.“ To znači: „Znam ono što vi ne znate o Iblisovoj skrivenoj oholosti, njegovoj namjeri da se suprotstavi Mojoj naredbi, o tome kako mu duša uljepšava neistinu i kako se zavarava. To ću vam kod njega otkriti kako biste vlastitim očima vidjeli.“ ⟦Prijevodi izričito navedenih kur’anskih riječi: El-Bekara, 2:30. Prošireni odgovori i objašnjenje iza „To znači“ pripadaju navedenom tumačenju.⟧"},{"stranica":89,"ar_tekst":"وقيل أقوال كثيرة في ذلك، قد حكينا منها جملا في كتابنا المسمى:\n\nجامع البيان عن تأويل آي القرآن، فكرهنا إطالة الكتاب بذكر ذلك في هذا الموضع.","bs_tekst":"O tome je izneseno mnogo mišljenja. Neka od njih izložili smo u svojoj knjizi pod naslovom „Džamiul-bejan an te’vili ajil-Kur’an“, pa nismo željeli oduljiti ovu knjigu njihovim navođenjem na ovome mjestu."},{"stranica":89,"ar_tekst":"فلما أراد الله عز وجل أن يخلق آدم ع أمر بتربته أن تؤخذ من الأرض، كما حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا","bs_tekst":"Kada je Allah, Silan i Uzvišen, htio stvoriti Adema, alejhis-selam, naredio je da se zemlja za njega uzme sa Zemlje, kako nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je"},{"stranica":90,"ar_tekst":"بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: ثُمَّ أَمَرَ- يَعْنِي الرَّبَّ تَبَارَكَ وَتَعَالَى بِتُرْبَةِ آدَمَ فَرُفِعَتْ، فخلق الله آدم من طين لا رب- وَاللازِبُ اللَّزِجُ الطَّيِّبُ- مِنْ حَمَإٍ مَسْنُونٍ، مُنْتِنٍ، قَالَ:\nوَإِنَّمَا كَانَ حَمَأً مَسْنُونًا بَعْدَ التُّرَابِ، قَالَ: فَخَلَقَ مِنْهُ آدَمَ بِيَدِهِ.","bs_tekst":"Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Zatim je naredio — misli se na Gospodara, Blagoslovljenog i Uzvišenog — da se donese zemlja za Adema, pa je podignuta. Allah je stvorio Adema od ljepljive gline — lazib je ljepljiv i dobar — od promijenjenog crnog blata neugodnog mirisa.“ Rekao je: „Crno, promijenjeno blato nastalo je poslije zemlje.“ Rekao je: „Od njega je Svojom rukom stvorio Adema.“ ⟦Napomena prevodioca: u prvom izrazu izvor ima طين لا رب, a odmah potom objašnjava riječ اللازب. „Ljepljiva glina“ ovdje slijedi to objašnjenje; prvo mjesto očigledno zahtijeva provjeru zapisa.⟧"},{"stranica":90,"ar_tekst":"حَدَّثَنِي مُوسَى بن هارون، قال: حدثنا عمرو بن حماد، قال:\nحدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابن مسعود- وعن ناس من أصحاب النبي ص، قَالَ: قَالَتِ الْمَلائِكَةُ: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قالَ إِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ» يعنى من شان ابليس، فبعث الله جبرئيل ع إِلَى الأَرْضِ لِيَأْتِيَهُ بِطِينٍ مِنْهَا، فَقَالَتِ الأَرْضُ: إِنِّي أَعُوذُ بِاللَّهِ مِنْكَ أَنْ تُنْقِصَ مِنِّي شيئا وتشينى، فَرَجَعَ وَلَمْ يَأْخُذْ، وَقَالَ: يَا رَبِّ إِنَّهَا عَاذَتْ بِكَ فَأَعَذْتُهَا، فَبَعَثَ مِيكَائِيلَ فَعَاذَتْ مِنْهُ فاعاذها فرجع، فقال كما قال جبرئيل، فبعث ملك الموت فَعَاذَتْ مِنْهُ، فَأَعَاذَهَا فَرَجَعَ، فَقَالَ كَمَا قَالَ جبرئيل، فَبَعَثَ مَلَكُ الْمَوْتِ فَعَاذَتْ مِنْهُ، فَقَالَ: وَأَنَا أَعُوذُ بِاللَّهِ أَنْ أَرْجِعَ، وَلَمْ أُنَفِّذْ أَمْرَهُ، فاخذ مِنْ وَجْهِ الأَرْضِ، وَخَلَطَ فَلَمْ يَأْخُذْ مِنْ مَكَانٍ وَاحِدٍ، وَأَخَذَ مِنْ تُرْبَةٍ حَمْرَاءَ وَبَيْضَاءَ وَسَوْدَاءَ، فَلِذَلِكَ خَرَجَ بَنُو آدَمَ مُخْتَلِفِينَ، فَصَعِدَ بِهِ فَبَلَّ التُّرَابَ حَتَّى عَادَ طِينًا لازِبًا- وَاللازِبُ هُوَ الَّذِي يَلْتَزِقُ بَعْضُهُ بِبَعْضٍ- ثُمَّ تُرِكَ حَتَّى تَغَيَّرَ وَأَنْتَنَ، وَذَلِكَ حِينَ يَقُولُ: «مِنْ حَمَإٍ مَسْنُونٍ*» ، قَالَ: مُنْتِنٌ.","bs_tekst":"Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: „Meleki su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo? Rekao je: Ja znam ono što vi ne znate’ — misleći na Iblisov slučaj. Allah je poslao Džibrila, alejhis-selam, na Zemlju da Mu donese gline s nje. Zemlja je rekla: ‘Utječem se Allahu od tebe, da nešto od mene ne oduzmeš i ne naružiš me.’ Vratio se ne uzevši ništa i rekao: ‘Gospodaru moj, zatražila je zaštitu kod Tebe, pa sam joj je pružio.’ Zatim je poslao Mikaila, a ona je od njega zatražila zaštitu. On joj je pružio zaštitu i vratio se, pa rekao isto što je rekao Džibril. Zatim je poslao meleka smrti. Ona je od njega zatražila zaštitu, pa joj je pružio zaštitu i vratio se, rekavši isto što je rekao Džibril. Zatim je poslao meleka smrti. Ona je od njega zatražila zaštitu, a on je rekao: ‘I ja se utječem Allahu od toga da se vratim a da nisam izvršio Njegovu naredbu.’ Uzeo je s površine Zemlje i pomiješao; nije uzeo samo s jednoga mjesta. Uzeo je crvene, bijele i crne zemlje, pa su zato Ademovi potomci različiti. Uzdižući se, ponio je to, pa je nakvasio zemlju dok nije postala ljepljiva glina — lazib je ono čiji se dijelovi lijepe jedni za druge. Zatim je ostavljena dok se nije promijenila i dobila neugodan miris. To je ono kada kaže: ‘Od promijenjenog crnog blata.’“ Rekao je: „Neugodnog mirisa.“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:30, navedeni dio; izraz من حمإ مسنون nalazi se u El-Hidžr, 15:26, 28 i 33. Napomena prevodioca: slanje meleka smrti u izvoru se pojavljuje dvaput, s različitim ishodima. Oba mjesta sačuvana su, bez uklanjanja ponavljanja.⟧"},{"stranica":90,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَعْقُوبُ الْقُمِّيُّ، عَنْ جَعْفَرِ بْنِ أَبِي الْمُغِيرَةِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: بَعَثَ رَبُّ الْعِزَّةِ عز وَجَلَّ إِبْلِيسَ، فَأَخَذَ مِنْ أَدِيمِ الأَرْضِ، مِنْ عَذْبِهَا وَمَلْحِهَا، فَخَلَقَ مِنْهُ آدَمَ،","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jakub el-Kummi, od Džafera ibn Ebu Mugire, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Gospodar moći, Silan i Uzvišen, poslao je Iblisa. On je uzeo s površine Zemlje, od njene slatke i slane zemlje, pa je od toga stvorio Adema,"},{"stranica":91,"ar_tekst":"وَمِنْ ثَمَّ سُمِّيَ آدَمَ، لأَنَّهُ خُلِقَ مِنْ أَدِيمِ الأَرْضِ، وَمِنْ ثَمَّ قَالَ إِبْلِيسُ:\n\n«أَأَسْجُدُ لِمَنْ خَلَقْتَ طِيناً» ، أَيْ هَذِهِ الطِّينَةُ أَنَا جِئْتُ بِهَا.","bs_tekst":"i zato je nazvan Adem, jer je stvoren od edima — površine Zemlje. Zato je Iblis rekao: ‘Zar da učinim sedždu onome koga si stvorio od gline?’ — to jest: ‘Ja sam donio ovu glinu.’“ ⟦Prijevod kur’anskog navoda: El-Isra, 17:61, navedeni dio. „Edim“ prenosi riječ أديم na kojoj se zasniva navedeno objašnjenje imena.⟧"},{"stranica":91,"ar_tekst":"حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا أَبُو دَاوُدَ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي حُصَيْنٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: إِنَّمَا سُمِّيَ آدَمَ لأَنَّهُ خُلِقَ مِنْ أَدِيمِ الأَرْضِ","bs_tekst":"Pričao nam je Ibn el-Musenna, koji je rekao: pričao nam je Ebu Davud, koji je rekao: pričao nam je Šu‘ba, od Ebu Husajna, od Seida ibn Džubejra, koji je rekao: „Nazvan je Adem zato što je stvoren od površine Zemlje.“"},{"stranica":91,"ar_tekst":"حَدَّثَنِي أَحْمَدُ بْنُ إسحاق الأهوازي، قال: حدثنا أبو أحمد، قال:\n\nحدثنا مسعر، عن أبي حصين، عن سعيد بْنِ جُبَيْرٍ، قَالَ: خُلِقَ آدَمُ مِنْ أَدِيمِ الأَرْضِ فَسُمِّيَ آدَمَ.","bs_tekst":"Pričao mi je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričao nam je Mis‘ar, od Ebu Husajna, od Seida ibn Džubejra, koji je rekao: „Adem je stvoren od površine Zemlje, pa je nazvan Adem.“"},{"stranica":91,"ar_tekst":"حَدَّثَنِي أَحْمَدُ بْنُ إِسْحَاقَ، قَالَ: حَدَّثَنَا أَبُو أَحْمَدَ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ ثَابِتٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، [عَنْ عَلِيٍّ رَضِيَ اللَّهُ عَنْهُ، قَالَ:\n\nإِنَّ آدَمَ خُلِقَ مِنْ أَدِيمِ الأَرْضِ، فِيهِ الطَّيِّبُ وَالصَّالِحُ وَالرَّدِيءُ، فَكُلُّ ذَلِكَ أَنْتَ رَاءٍ فِي وَلَدِهِ الصَّالِحِ وَالرَّدِيءِ] .","bs_tekst":"Pričao mi je Ahmed ibn Ishak, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričao nam je Amr ibn Sabit, od svoga oca, od svoga djeda, od Alija, radijallahu anhu, koji je rekao: „Adem je stvoren od površine Zemlje. U njoj ima dobroga, valjanoga i lošega. Sve to vidiš i među njegovim potomcima: valjane i loše.“"},{"stranica":91,"ar_tekst":"حَدَّثَنِي يَعْقُوبُ بْنُ إِبْرَاهِيمَ، قَالَ: حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ عَوْفٍ- وَحَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ وَعُمَرُ بْنُ شَبَّةَ، قَالا: حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، قَالَ:\nحَدَّثَنَا عَوْفٌ وَحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ وَمُحَمَّدُ بْنُ جَعْفَرٍ وَعَبْدُ الْوَهَّابِ الثَّقَفِيُّ، قَالُوا: حَدَّثَنَا عَوْفٌ وحدثني مُحَمَّدُ بْنُ عُمَارَةَ الأَسَدِيُّ، قَالَ: حَدَّثَنَا إِسْمَاعِيلُ بْنُ أَبَانٍ، قَالَ: حَدَّثَنَا عَنْبَسَةُ، عَنْ عَوْفٍ الأَعْرَابِيِّ- عَنْ قَسَامَةَ بْنِ زُهَيْرٍ، عَنْ أَبِي مُوسَى الأَشْعَرِيِّ، قَالَ: [قَالَ رسول الله ص: إِنَّ اللَّهَ خَلَقَ آدَمَ مِنْ قَبْضَةٍ قَبَضَهَا مِنْ جَمِيعِ الأَرْضِ، فَجَاءَ بَنُو آدَمَ عَلَى قَدْرِ الأَرْضِ، جَاءَ مِنْهُمُ الأَحْمَرُ، وَالأَسْوَدُ، وَالأَبْيَضُ، وَبَيْنَ ذَلِكَ وَالسَّهْلُ، وَالْحَزْنُ، وَالْخَبِيثُ، وَالطَّيِّبُ، ثُمَّ بُلَّتْ طِينَتُهُ حَتَّى صَارَتْ طِينًا لازِبًا، ثُمَّ تُرِكَتْ حَتَّى صَارَتْ حَمَأً مَسْنُونًا، ثُمَّ تُرِكَتْ حَتَّى صَارَتْ صَلْصَالا","bs_tekst":"Pričao mi je Jakub ibn Ibrahim, koji je rekao: pričao nam je Ibn Ulejja, od Avfa — a pričali su nam i Muhammed ibn Beššar i Omer ibn Šebbe; obojica su rekli: pričao nam je Jahja ibn Seid, koji je rekao: pričao nam je Avf. Pričao nam je i Ibn Beššar, koji je rekao: pričali su nam Ibn Ebu Adijj, Muhammed ibn Džafer i Abdulvehhab es-Sekafi; rekli su: pričao nam je Avf. Pričao mi je i Muhammed ibn Umara el-Esedi, koji je rekao: pričao nam je Ismail ibn Eban, koji je rekao: pričao nam je Anbesa, od Avfa el-A‘rabija — od Kasame ibn Zuhejra, od Ebu Muse el-Eš‘arija, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Allah je stvorio Adema od pregršti koju je zahvatio sa cijele Zemlje. Ademovi potomci došli su prema svojstvima Zemlje: među njima ima crvenih, crnih, bijelih i onih između toga; blagih i grubih, loših i dobrih. Zatim je njegova glina nakvašena dok nije postala ljepljiva glina. Zatim je ostavljena dok nije postala promijenjeno crno blato, pa je potom ostavljena dok nije postala suha glina,"},{"stranica":92,"ar_tekst":"كَمَا قَالَ اللَّهُ تَعَالَى: «وَلَقَدْ خَلَقْنَا الْإِنْسانَ مِنْ صَلْصالٍ مِنْ حَمَإٍ مَسْنُونٍ] » .","bs_tekst":"kako je Uzvišeni Allah rekao: I zaista smo čovjeka stvorili od suhe gline, od promijenjenog crnog blata.’“ ⟦Prijevod kur’anskog navoda: El-Hidžr, 15:26.⟧"},{"stranica":92,"ar_tekst":"وَحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ وَعَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، قَالا: حَدَّثَنَا سُفْيَانُ، عَنِ الأَعْمَشِ، عَنْ مُسْلِمٍ الْبُطَيْنِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: خُلِقَ آدَمُ مِنْ ثَلاثَةٍ: مِنْ صَلْصَالٍ، وَمِنْ حَمَإٍ، وَمِنْ طِينٍ لازِبٍ فَأَمَّا اللازِبُ فَالْجَيِّدُ، وَأَمَّا الْحَمَأُ فَالْحَمِئَةُ، وَأَمَّا الصَّلْصَالُ فَالتُّرَابُ الْمُدَقَّقُ، ويعنى تعالى ذكره بقوله: «مِنْ صَلْصالٍ*» ، مِنْ طِينٍ يَابِسٍ لَهُ صَلْصَلَةٌ، وَالصَّلْصَلَةُ: الصَّوْتُ.","bs_tekst":"Pričao nam je Ibn Beššar, koji je rekao: pričali su nam Jahja ibn Seid i Abdurrahman ibn Mehdi; obojica su rekli: pričao nam je Sufjan, od A‘meša, od Muslima el-Butajna, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Adem je stvoren od troje: od salsala, od hamea i od ljepljive gline. Lazib je dobar; hame je mulj; a salsal je usitnjena zemlja.“ On, Uzvišen je spomen Njegov, riječima „od salsala“ misli na suhu glinu koja zveči, a salsala je zvuk. ⟦Napomena prevodioca: sačuvani su nazivi صلصال („salsal“), حمإ („hame“) i لازب („lazib“) jer ih tekst pojedinačno objašnjava. Izraz من صلصال pojavljuje se u El-Hidžr, 15:26, 28 i 33, te Er-Rahman, 55:14.⟧"},{"stranica":92,"ar_tekst":"وَذَكَرَ أَنَّ اللَّهَ تعالى ذَكَرَهُ لَمَّا خَمَّرَ طِينَةَ آدَمَ تَرَكَهَا أَرْبَعِينَ لَيْلَةً، وَقِيلَ أَرْبَعِينَ عَامًا جَسَدًا مُلْقًى.","bs_tekst":"Navedeno je da je Allah, Uzvišen je spomen Njegov, kada je umijesio Ademovu glinu, ostavio je četrdeset noći; rečeno je i četrdeset godina, kao položeno tijelo."},{"stranica":92,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":92,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\nأَمَرَ اللَّهُ تَبَارَكَ وَتَعَالَى بِتُرْبَةِ آدَمَ فَرُفِعَتْ، فَخُلِقَ آدَمُ مِنْ طِينٍ لازِبٍ مِنْ حَمَإٍ مَسْنُونٍ قَالَ: وَإِنَّمَا كَانَ حَمَأً مَسْنُونًا بَعْدَ التُّرَابِ، قَالَ: فَخَلَقَ مِنْهُ آدَمَ بِيَدِهِ، قَالَ: فَمَكَثَ أَرْبَعِينَ لَيْلَةً جَسَدًا مُلْقًى، فَكَانَ إِبْلِيسُ يَأْتِيهِ فَيَضْرِبُهُ بِرِجْلِهِ، فَيُصَلْصِلُ فَيُصَوِّتُ، قَالَ: فَهُوَ قَوْلُ اللَّهِ تَبَارَكَ وَتَعَالَى: «مِنْ صَلْصالٍ كَالْفَخَّارِ» ، يَقُولُ: كَالشَّيْءِ الْمُنْفَرِجِ الَّذِي لَيْسَ بِمُصْمَتٍ، قَالَ: ثُمَّ يَدْخُلُ فِي فِيهِ وَيَخْرُجُ مِنْ دُبُرِهِ، وَيَدْخُلُ فِي دُبُرِهِ وَيَخْرُجُ مِنْ فِيهِ، ثُمَّ يَقُولُ:\nلَسْتَ شَيْئًا لِلصَّلْصَلَةِ، وَلِشَيْءٍ مَا خُلِقْتَ، وَلَئِنْ سُلِّطْتُ عَلَيْكَ لأُهْلِكَنَّكَ، وَلَئِنْ سُلِّطْتَ عَلَيَّ لاعصينك","bs_tekst":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Allah, Blagoslovljen i Uzvišen, naredio je da se donese zemlja za Adema, pa je podignuta. Adem je stvoren od ljepljive gline, od promijenjenog crnog blata.“ Rekao je: „Crno, promijenjeno blato nastalo je poslije zemlje.“ Rekao je: „Od njega je Svojom rukom stvorio Adema.“ Rekao je: „Četrdeset noći ostao je kao položeno tijelo. Iblis mu je dolazio, udarao ga nogom, a ono bi zazvečalo i pustilo zvuk.“ Rekao je: „To su riječi Allaha, Blagoslovljenog i Uzvišenog: ‘Od suhe gline poput grnčarije’ — znači poput nečega šupljeg, što nije puno.“ Rekao je: „Potom bi ulazio na njegova usta i izlazio kroz njegov stražnji otvor, te ulazio kroz njegov stražnji otvor i izlazio na usta. Zatim bi rekao: ‘Nisi ništa, jer zvečiš. Za neku si svrhu stvoren. Ako mi bude data vlast nad tobom, sigurno ću te uništiti; a ako tebi bude data vlast nada mnom, sigurno ću ti biti nepokoran.’“ ⟦Prijevod kur’anskog navoda: Er-Rahman, 55:14, navedeni dio. Napomena prevodioca: rečenica لست شيئا للصلصلة je jezički neobična; „jer zvečiš“ ovdje je kontekstualno čitanje završnog izraza.⟧"},{"stranica":93,"ar_tekst":"حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب رسول الله ص، قَالَ اللَّهُ لِلْمَلائِكَةِ: «إِنِّي خالِقٌ بَشَراً مِنْ طِينٍ.\nفَإِذا سَوَّيْتُهُ وَنَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ ساجِدِينَ» ، فَخَلَقَهُ اللَّهُ عَزَّ وَجَلَّ بِيَدَيْهِ لِكَيْلا يَتَكَبَّرُ ابليس عنه ليقول حين يتكبر: تتكبر عَمَّا عَمِلْتُ بِيَدِي وَلَمْ أَتَكَبَّرْ أَنَا عَنْهُ! فَخَلَقَهُ بَشَرًا، فَكَانَ جَسَدًا مِنْ طِينٍ أَرْبَعِينَ سَنَةً مِنْ مِقْدَارِ يَوْمِ الْجُمُعَةِ، فَمَرَّتْ بِهِ الْمَلائِكَةُ فَفَزِعُوا مِنْهُ لَمَّا رَأَوْهُ، وَكَانَ أَشَدَّهُمْ فَزَعًا إِبْلِيسَ، فَكَانَ يَمُرُّ بِهِ فَيَضْرِبُهُ فَيُصَوِّتُ الْجَسَدُ كَمَا يُصَوِّتُ الْفَخَّارُ تَكُونُ لَهُ صَلْصَلَةٌ، فذلك حين يقول: «مِنْ صَلْصالٍ كَالْفَخَّارِ» ، وَيَقُولُ: لأَمْرٍ مَا خُلِقْتَ وَدَخَلَ مِنْ فِيهِ وَخَرَجَ مِنْ دُبُرِهِ، فَقَالَ لِلْمَلائِكَةِ: لا تَرْهَبُوا مِنْ هَذَا، فَإِنَّ رَبَّكُمْ صَمَدٌ وَهَذَا أَجْوَفُ، لَئِنْ سُلِّطْتُ عَلَيْهِ لأُهْلِكَنَّهُ.","bs_tekst":"Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem: „Allah je rekao melekima: ‘Ja stvaram čovjeka od gline. Pa kada ga uredim i u njega udahnem od Svoga Duha, padnite mu na sedždu.’ Allah, Silan i Uzvišen, stvorio ga je Svojim dvjema rukama kako se Iblis ne bi oholio prema njemu i da bi mu, kada se uzoholi, rekao: ‘Oholiš se prema onome što sam Ja načinio Svojom rukom, a Ja se prema njemu nisam uzoholio!’ Stvorio ga je kao čovjeka, pa je četrdeset godina od trajanja dana petka bio tijelo od gline. Meleki su prolazili pored njega i prestrašili se kada su ga vidjeli. Najviše ga se prestrašio Iblis. Prolazio bi pored njega i udarao ga, a tijelo bi davalo zvuk poput grnčarije, imalo bi svoj zveket. To je ono kada kaže: ‘Od suhe gline poput grnčarije.’ Govorio bi: ‘Za neku si svrhu stvoren.’ Ušao je na njegova usta i izašao kroz njegov stražnji otvor, pa je melekima rekao: ‘Ne bojte se ovoga! Vaš je Gospodar Samed, a ovo je šuplje. Ako mi bude data vlast nad njim, sigurno ću ga uništiti.’“ ⟦Prijevodi kur’anskih navoda: Sad, 38:71–72, navedeni dio; Er-Rahman, 55:14, navedeni dio. Naziv صمد („Samed“) sačuvan je bez dodavanja tumačenja.⟧"},{"stranica":93,"ar_tekst":"وَحَدَّثَنَا عَنِ الْحَسَنِ بن بلال، قال: حدثنا حماد بن سلمة، عَنْ سُلَيْمَانَ التَّيْمِيِّ، عَنْ أَبِي عُثْمَانَ النَّهْدِيِّ، عَنْ سَلْمَانَ الْفَارِسِيِّ، قَالَ: خَمَّرَ اللَّهُ تَعَالَى طينه آدم ع أَرْبَعِينَ يَوْمًا، ثُمَّ جَمَعَهُ بِيَدَيْهِ، فَخَرَجَ طِيبُهُ بِيَمِينِهِ، وَخَبِيثُهُ بِشِمَالِهِ، ثُمَّ مَسَحَ يَدَيْهِ إِحْدَاهُمَا عَلَى الأُخْرَى، فَخَلَطَ بَعْضُهُ بِبَعْضٍ، فَمِنْ ثَمَّ يَخْرُجُ الطَّيِّبُ مِنَ الْخَبِيثِ، وَالْخَبِيثُ مِنَ الطَّيِّبِ.","bs_tekst":"Preneseno nam je od Hasena ibn Bilala, koji je rekao: pričao nam je Hammad ibn Selema, od Sulejmana et-Tejmija, od Ebu Osmana en-Nehdija, od Selmana el-Farisija, koji je rekao: „Uzvišeni Allah mijesio je glinu Adema, alejhis-selam, četrdeset dana, zatim ju je sakupio Svojim dvjema rukama. Njeno dobro izašlo je u Njegovoj desnoj, a njeno loše u Njegovoj lijevoj ruci. Potom je protrljao jednu ruku o drugu i pomiješao jedno s drugim. Zato dobro izlazi iz lošega, a loše iz dobroga.“"},{"stranica":93,"ar_tekst":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابْنِ إِسْحَاقَ، قَالَ:\n\nيُقَالُ- وَاللَّهُ أَعْلَمُ: خَلَقَ اللَّهُ آدَمَ، ثُمَّ وَضَعَهُ يَنْظُرُ إِلَيْهِ أَرْبَعِينَ يَوْمًا قَبْلَ أَنْ يَنْفُخَ فِيهِ الرُّوحَ، حَتَّى عَادَ صَلْصَالا كَالْفَخَّارِ، وَلَمْ تَمَسَّهُ نَارٌ، قَالَ: فلما","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Govori se — a Allah najbolje zna — da je Allah stvorio Adema, zatim ga položio i gledao ga četrdeset dana prije nego što je u njega udahnuo duh, dok nije postao suha glina poput grnčarije, a vatra ga nije dotakla.“ Rekao je: „Kada je"},{"stranica":94,"ar_tekst":"مَضَى لَهُ مِنَ الْمُدَّةِ مَا مَضَى وَهُوَ طِينٌ صَلْصَالٌ كَالْفَخَّارِ، وَأَرَادَ عَزَّ وَجَلَّ أَنْ يَنْفُخَ فِيهِ الرُّوحَ، تَقَدَّمَ إِلَى الْمَلائِكَةِ فَقَالَ لَهُمْ: إِذَا نَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ سَاجِدِينَ.","bs_tekst":"proteklo onoliko vremena koliko je proteklo dok je bio glina, suha poput grnčarije, i kada je On, Silan i Uzvišen, htio u njega udahnuti duh, unaprijed je rekao melekima: ‘Kada u njega udahnem od Svoga Duha, padnite mu na sedždu.’“"},{"stranica":94,"ar_tekst":"فَلَمَّا نَفَخَ فِيهِ الرُّوحَ أَتَتْهُ الرُّوحُ مِنْ قِبَلِ رَأْسِهِ، فِيمَا ذُكِرَ عَنِ السَّلَفِ قَبْلِنَا أَنَّهُمْ قَالُوهُ.","bs_tekst":"Kada je u njega udahnuo duh, duh mu je došao od strane glave, prema onome što je navedeno da su rekli prethodnici prije nas."},{"stranica":94,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذلك:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":94,"ar_tekst":"حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابن مسعود- وعن ناس من اصحاب النبي ص: فَلَمَّا بَلَغَ الْحِينَ الَّذِي أَرَادَ اللَّهُ عَزَّ وَجَلَّ أَنْ يَنْفُخَ فِيهِ الرُّوحَ قَالَ لِلْمَلائِكَةِ: إِذَا نَفَخْتُ فِيهِ مِنْ رُوحِي فَاسْجُدُوا لَهُ، فَلَمَّا نَفَخَ فِيهِ الرُّوحَ فَدَخَلَ الرُّوحُ، فِي رَأْسِهِ عَطَسَ، فَقَالَتِ الْمَلائِكَةُ: قُلِ الْحَمْدُ لِلَّهِ، فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ اللَّهُ عَزَّ وَجَلَّ لَهُ: رَحِمَكَ رَبُّكَ فَلَمَّا دَخَلَ الرُّوحُ فِي عَيْنَيْهِ نَظَرَ إِلَى ثِمَارِ الْجَنَّةِ، فَلَمَّا دَخَلَ فِي جَوْفِهِ اشْتَهَى الطَّعَامَ، فَوَثَبَ قَبْلَ أَنْ تَبْلُغَ الرُّوحُ رِجْلَيْهِ عَجْلانَ إِلَى ثِمَارِ الْجَنَّةِ، فَذَلِكَ حِينَ يَقُولُ: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، «فَسَجَدَ الْمَلائِكَةُ كُلُّهُمْ أَجْمَعُونَ إِلَّا إِبْلِيسَ أَبى أَنْ يَكُونَ مَعَ السَّاجِدِينَ» ، «أَبى وَاسْتَكْبَرَ وَكانَ مِنَ الْكافِرِينَ» ، فقال الله له: «ما مَنَعَكَ أَلَّا تَسْجُدَ إِذْ أَمَرْتُكَ» لِمَا خَلَقْتُ بِيَدِي، قَالَ:\nأَنَا خَيْرٌ مِنْهُ، لَمْ أَكُنْ لأَسْجُدَ لِبَشَرٍ خَلَقْتَهُ مِنْ طِينٍ، قَالَ اللَّهُ لَهُ:\n\n«فَاهْبِطْ مِنْها فَما يَكُونُ لَكَ» - يَعْنِي مَا يَنْبَغِي لَكَ- «أَنْ تَتَكَبَّرَ","bs_tekst":"Pričao mi je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: „Kada je došlo vrijeme u kojem je Allah, Silan i Uzvišen, htio u njega udahnuti duh, rekao je melekima: ‘Kada u njega udahnem od Svoga Duha, učinite mu sedždu.’ Kada je u njega udahnuo duh i duh ušao u njegovu glavu, kihnuo je. Meleki su rekli: ‘Reci: Hvala Allahu!’ Rekao je: ‘Hvala Allahu!’ Allah, Silan i Uzvišen, rekao mu je: ‘Smilovao ti se tvoj Gospodar.’ Kada je duh ušao u njegove oči, pogledao je džennetske plodove; kada je ušao u njegovu nutrinu, poželio je hranu. Skočio je, žureći prema džennetskim plodovima prije nego što je duh stigao do njegovih nogu. To je ono kada kaže: ‘Čovjek je stvoren od žurbe.’ ‘Pa su svi meleki zajedno učinili sedždu, osim Iblisa; odbio je biti među onima koji su je učinili.’ ‘Odbio je, uzoholio se i bio od nevjernika.’ Allah mu je rekao: ‘Šta te spriječilo da učiniš sedždu kada sam ti naredio’ — onome što sam stvorio Svojim dvjema rukama? Odgovorio je: ‘Ja sam bolji od njega. Neću učiniti sedždu čovjeku kojeg si stvorio od gline.’ Allah mu je rekao: ‘Siđi iz njega! Nije ti dopušteno’ — to jest: ne dolikuje ti — ‘da se uzoholiš ⟦Prijevodi kur’anskih navoda: El-Enbija, 21:37, navedeni dio; El-Hidžr, 15:30–31; El-Bekara, 2:34, navedeni dio; El-A‘raf, 7:12, navedeni dio, uz izraz iz Sad, 38:75; El-A‘raf, 7:13, početak ajeta. Nalozi o sedždi na početku ove stranice prenose formulacije predaje, a nisu zasebni doslovni navodi punog ajeta.⟧"},{"stranica":95,"ar_tekst":"فِيها فَاخْرُجْ إِنَّكَ مِنَ الصَّاغِرِينَ» ، وَالصّغَارُ الذُّلُّ.","bs_tekst":"u njemu. Zato izađi! Ti si od poniženih.’ A sagar znači poniženje.“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:13, nastavak. „Sagar“ prenosi الصغار, riječ koju autor objašnjava.⟧"},{"stranica":95,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بِشْرُ بْنُ عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: فَلَمَّا نَفَخَ اللَّهُ عَزَّ وَجَلَّ فِيهِ- يَعْنِي فِي آدَمَ- مِنْ رُوحِهِ أَتَتِ النَّفْخَةُ مِنْ قِبَلِ رَأْسِهِ، فَجَعَلَ لا يَجْرِي شَيْءٌ مِنْهَا فِي جَسَدِهِ إِلا صَارَ لَحْمًا وَدَمًا، فَلَمَّا انْتَهَتِ النَّفْخَةُ إِلَى سُرَّتِهِ نَظَرَ إِلَى جَسَدِهِ فَأَعْجَبَهُ مَا رَأَى مِنْ حُسْنِهِ، فَذَهَبَ لِيَنْهَضَ فَلَمْ يَقْدِرْ، فَهُوَ قَوْلُ الله عز وجل «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: ضَجِرًا لا صَبْرَ لَهُ عَلَى سَرَّاءٍ وَلا ضَرَّاءٍ، قَالَ: فَلَمَّا تَمَّتِ النَّفْخَةُ فِي جَسَدِهِ عَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، بِإِلْهَامِ اللَّهِ، فَقَالَ: يَرْحَمُكَ اللَّهُ يَا آدَمُ، ثُمَّ قَالَ لِلْمَلائِكَةِ الَّذِينَ كَانُوا مَعَ إِبْلِيسَ خَاصَّةً دُونَ الْمَلائِكَةِ الَّذِينَ فِي السَّمَوَاتُ: اسْجُدُوا لآدَمَ، فَسَجَدُوا كُلُّهُمْ أَجْمَعُونَ إِلا إِبْلِيسَ أَبَى وَاسْتَكْبَرَ، لِمَا كَانَ حَدَّثَ بِهِ نَفْسَهُ مِنْ كبره واغتراره، فقال: لا اسجد، وَأَنَا خَيْرٌ مِنْهُ وَأَكْبَرُ سِنًّا، وَأَقْوَى خَلْقًا، «خَلَقْتَنِي مِنْ نارٍ وَخَلَقْتَهُ مِنْ طِينٍ*» ، يَقُولُ: إِنَّ النَّارَ أَقْوَى مِنَ الطِّينِ، قَالَ: فَلَمَّا أَبَى إِبْلِيسُ أَنْ يَسْجُدَ أَبْلَسَهُ اللَّهُ تعالى، أيأسه مِنَ الْخَيْرِ كُلِّهِ، وَجَعَلَهُ شَيْطَانًا رَجِيمًا عُقُوبَةً لِمَعْصِيَتِهِ.","bs_tekst":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Kada je Allah, Silan i Uzvišen, u njega — misli se na Adema — udahnuo od Svoga Duha, dah je došao od njegove glave. Kuda god bi po njegovom tijelu prošao, to bi postalo meso i krv. Kada je dah stigao do njegovog pupka, pogledao je svoje tijelo i zadivio se ljepoti koju je vidio. Pokušao je ustati, ali nije mogao. To su riječi Allaha, Silnog i Uzvišenog: ‘Čovjek je stvoren od žurbe.’“ Rekao je: „Nemiran je; nema strpljenja ni u blagostanju ni u nevolji.“ Rekao je: „Kada je dah ispunio cijelo njegovo tijelo, kihnuo je i, Allahovim nadahnućem, rekao: ‘Hvala Allahu, Gospodaru svjetova.’ Rekao je: ‘Allah ti se smilovao, Ademe!’ Zatim je samo melekima koji su bili s Iblisom, a ne melekima na nebesima, rekao: ‘Učinite sedždu Ademu!’ Svi su zajedno učinili sedždu osim Iblisa, koji je odbio i uzoholio se zbog oholosti i samodopadnosti o kojima je razmišljao u sebi. Rekao je: ‘Neću učiniti sedždu! Ja sam bolji od njega, stariji i snažnijeg stvaranja. Mene si stvorio od vatre, a njega si stvorio od gline.’ Kaže: ‘Vatra je snažnija od gline.’“ Rekao je: „Kada je Iblis odbio učiniti sedždu, Uzvišeni Allah bacio ga je u očaj, lišio ga nade u svako dobro i učinio ga prokletim šejtanom kao kaznu za njegovu nepokornost.“ ⟦Prijevodi kur’anskih navoda: El-Enbija, 21:37, navedeni dio; „Mene si stvorio od vatre, a njega si stvorio od gline“ nalazi se u El-A‘raf, 7:12, i Sad, 38:76.⟧"},{"stranica":95,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ، حَدَّثَنَا سَلَمَةُ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، قَالَ:\n\nفَيُقَالُ- وَاللَّهُ أَعْلَمُ-: إِنَّهُ لَمَّا انْتَهَى الرُّوحُ إِلَى رَأْسِهِ عَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، قَالَ: فَقَالَ لَهُ رَبُّهُ: يَرْحَمُكَ رَبُّكَ، وَوَقَعَتِ الْمَلائِكَةُ حِينَ اسْتَوَى سُجُودًا لَهُ، حِفْظًا لِعَهْدِ اللَّهِ الَّذِي عَهِدَ إِلَيْهِمْ، وَطَاعَةً لأَمْرِهِ الَّذِي أَمَرَهُمْ بِهِ، وَقَامَ عدو الله ابليس من بينهم، فلم يسجد متكبرا متعظما بغيا وحسدا، فقال:\n«يَا إِبْلِيسُ مَا مَنَعَكَ أَنْ تَسْجُدَ لِما خَلَقْتُ بِيَدَيَّ» إِلَى قَوْلِهِ: «لَأَمْلَأَنَ","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, koji je rekao: „Govori se — a Allah najbolje zna — da je, kada je duh stigao u njegovu glavu, kihnuo i rekao: ‘Hvala Allahu!’“ Rekao je: „Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar.’ Kada je poprimio potpun oblik, meleki su mu pali na sedždu, čuvajući Allahov zavjet koji im je dao i pokoravajući se naredbi koju im je naredio. Allahov neprijatelj Iblis stajao je među njima i nije učinio sedždu, uzoholivši se i uzvisujući se iz nasilnosti i zavisti. Rekao je: ‘Iblise, šta te spriječilo da učiniš sedždu onome što sam stvorio Svojim dvjema rukama?’ — do Njegovih riječi: ‘Sigurno ću napuniti ⟦Prijevod početka navoda: Sad, 38:75; završni navod nastavlja se na sljedećoj stranici i pripada Sad, 38:85. Izraz „do Njegovih riječi“ nalazi se u samom izvoru; međutekst nije izostavljen tokom ovog prijevoda.⟧"},{"stranica":96,"ar_tekst":"جَهَنَّمَ مِنْكَ وَمِمَّنْ تَبِعَكَ مِنْهُمْ أَجْمَعِينَ» ، قَالَ: فَلَمَّا فَرَغَ اللَّهُ تعالى مِنْ إِبْلِيسَ وَمُعَاتَبَتِهِ وَأَبَى إِلا الْمَعْصِيَةَ أَوْقَعَ اللَّهُ تعالى عَلَيْهِ اللَّعْنَةَ، وَأَخْرَجَهُ مِنَ الْجَنَّةِ.","bs_tekst":"Džehennem tobom i svima od njih koji te budu slijedili.’“ Rekao je: „Kada je Uzvišeni Allah završio s Iblisom i ukoravanjem njega, a on je ostao pri nepokornosti, Uzvišeni Allah spustio je na njega prokletstvo i izveo ga iz Dženneta.“ ⟦Prijevod završetka kur’anskog navoda s prethodne stranice: Sad, 38:85.⟧"},{"stranica":96,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ خَلَفٍ، قَالَ: حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، قَالَ:\nحَدَّثَنَا أَبُو خَالِدٍ سُلَيْمَانُ بْنُ حَيَّانَ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ، ع قَالَ أَبُو خَالِدٍ: وحدثني الأَعْمَشُ عَنْ أَبِي صالح، عن ابى هريرة، عن النبي ص قَالَ أَبُو خَالِدٍ:\nوحدثني دَاوُدُ بْنُ أَبِي هِنْدٍ عَنِ الشَّعْبِيِّ، عَنْ أَبِي هُرَيْرَةَ عَنِ النبي ص قَالَ أَبُو خَالِدٍ: وحدثني ابْنُ أَبِي ذُبَابٍ الدَّوْسِيُّ، قَالَ: حَدَّثَنِي سَعِيدٌ الْمَقْبُرِيُّ، وَيَزِيدُ بْنُ هرمز عن ابى هريرة، [عن النبي ص أَنَّهُ قَالَ: خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ بِيَدِهِ، وَنَفَخَ فِيهِ مِنْ رُوحِهِ، وَأَمَرَ الْمَلأَ مِنَ الْمَلائِكَةِ فَسَجَدُوا لَهُ، فَجَلَسَ فَعَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ لَهُ رَبُّهُ: يَرْحَمُكَ رَبُّكَ، ايت أُولَئِكَ الْمَلأَ مِنَ الْمَلائِكَةِ فَقُلْ لَهُمُ: السَّلامُ عَلَيْكُمْ فَأَتَاهُمْ فَقَالَ: السَّلامُ عَلَيْكُمْ، فَقَالُوا لَهُ: وَعَلَيْكَ السَّلامُ وَرَحْمَةُ اللَّهِ، ثُمَّ رَجَعَ إِلَى رَبِّهِ عَزَّ وَجَلَّ فَقَالَ لَهُ: هَذِهِ تَحِيَّتُكَ وَتَحِيَّةُ ذُرِّيَّتِكَ بَيْنَهُمْ فَلَمَّا أَظْهَرَ إِبْلِيسُ مِنْ نَفْسِهِ مَا كَانَ لَهُ مَخْفِيًّا فِيهَا مِنَ الْكِبْرِ وَالْمَعْصِيَةِ لِرَبِّهِ، وَكَانَتِ الْمَلائِكَةُ قَدْ قَالَتْ لِرَبِّهَا عَزَّ وَجَلَّ حِينَ قَالَ لَهُمْ: إِنِّي جاعل في الأرض خليفة: أَتَجْعَلُ فِيهَا مَنْ يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ فَقَالَ لَهُمْ رَبُّهُمْ:\nإِنِّي أَعْلَمُ مَا لا تَعْلَمُونَ، تَبَيَّنَ لَهُمْ مَا كَانَ عَنْهُمْ مُسْتَتِرًا، وَعَلِمُوا أَنَّ فِيهِمْ مَنْ مِنْهُ الْمَعْصِيَةُ لِلَّهِ عَزَّ وَجَلَّ وَالْخِلافُ لأَمْرِهِ] .","bs_tekst":"Pričao mi je Muhammed ibn Halef, koji je rekao: pričao nam je Adem ibn Ebu Ijas, koji je rekao: pričao nam je Ebu Halid Sulejman ibn Hajjan, koji je rekao: pričao mi je Muhammed ibn Amr, od Ebu Seleme, od Ebu Hurejre, od Vjerovjesnika, alejhis-selam. Ebu Halid je rekao: a pričao mi je i A‘meš, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Davud ibn Ebu Hind, od Ša‘bija, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Ibn Ebu Zubab ed-Devsi, koji je rekao: pričali su mi Seid el-Makburi i Jezid ibn Hurmuz, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Allah, Silan i Uzvišen, stvorio je Adema Svojom rukom, udahnuo u njega od Svoga Duha i naredio skupini meleka pa su mu učinili sedždu. On je sjeo, kihnuo i rekao: ‘Hvala Allahu!’ Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar. Otiđi onoj skupini meleka i reci im: Es-selamu alejkum!’ Došao im je i rekao: ‘Es-selamu alejkum!’ Odgovorili su mu: ‘Ve alejkes-selamu ve rahmetullah!’ Zatim se vratio svome Gospodaru, Silnom i Uzvišenom, koji mu je rekao: ‘Ovo je tvoj pozdrav i pozdrav tvojih potomaka među njima.’ Kada je Iblis pokazao oholost i nepokornost svome Gospodaru koje je skrivao u sebi, a meleki su svome Gospodaru, Silnom i Uzvišenom, kada im je rekao: ‘Ja ću na Zemlji postaviti namjesnika’, već bili rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati, a mi Tebe s hvalom slavimo i svetost Ti iskazujemo?’, a njihov im Gospodar odgovorio: ‘Ja znam ono što vi ne znate’, otkrilo im se ono što im je bilo skriveno. Saznali su da među njima ima neko ko je nepokoran Allahu, Silnom i Uzvišenom, i protivi se Njegovoj naredbi.“ ⟦Prijevodi kur’anskih navoda unutar predaje: El-Bekara, 2:30, navedeni dijelovi.⟧"},{"stranica":96,"ar_tekst":"ثُمَّ عَلَّمَ اللَّهُ عَزَّ وَجَلَّ آدَمَ الأَسْمَاءَ كُلَّهَا وَاخْتَلَفَ السَّلَفُ مِنْ أَهْلِ الْعِلْمِ قَبْلَنَا فِي الأَسْمَاءِ الَّتِي عُلِّمَهَا آدَمُ: أَخَاصًّا مِنَ الأَسْمَاءِ علم، اما عَامًّا؟","bs_tekst":"Zatim je Allah, Silan i Uzvišen, poučio Adema svim imenima. Učeni prethodnici prije nas razišli su se o imenima kojima je Adem poučen: je li poučen samo određenim imenima ili imenima općenito?"},{"stranica":96,"ar_tekst":"فَقَالَ بَعْضُهُمْ: عُلِّمَ اسْمَ كُلِّ شَيْءٍ","bs_tekst":"Neki su rekli: „Poučen je imenu svega.“"},{"stranica":97,"ar_tekst":"ذكر من قال ذلك:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":97,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا بشر ابن عُمَارَةَ، عَنْ أَبِي رَوْقٍ، عَنِ الضَّحَّاكِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: «عَلَّمَ اللَّهُ تَعَالَى آدَمَ الْأَسْماءَ كُلَّها» ، وَهِيَ هَذِهِ الأَسْمَاءُ الَّتِي يَتَعَارَفُ بِهَا النَّاسُ:\nإِنْسَانٌ، وَدَابَّةٌ، وَأَرْضٌ، وَسَهْلٌ، وَبَحْرٌ، وَجَبَلٌ، وَحِمَارٌ، وَأَشْبَاهُ ذَلِكَ مِنَ الأُمَمِ وَغَيْرِهَا.","bs_tekst":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, koji je rekao: pričao nam je Bišr ibn Umara, od Ebu Revka, od Dahhaka, od Ibn Abbasa, koji je rekao: „Uzvišeni Allah poučio je Adema svim imenima. To su imena kojima se ljudi međusobno sporazumijevaju: čovjek, životinja, zemlja, ravnica, more, planina, magarac i njima slični nazivi vrsta i drugih stvari.“ ⟦Napomena prevodioca: izvor kaže علّم الله تعالى آدم الأسماء كلها, kao formulaciju predaje; odgovarajući kur’anski izraz u El-Bekara, 2:31, glasi وعلم آدم الأسماء كلها.⟧"},{"stranica":97,"ar_tekst":"حَدَّثَنِي أَحْمَدُ بْنُ إِسْحَاقَ الأَهْوَازِيُّ، قَالَ: حَدَّثَنَا أَبُو أَحْمَدَ، حَدَّثَنَا شَرِيكٌ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنِ الْحَسَنِ بْنِ سَعْدٍ، عَنِ ابْنِ عَبَّاسٍ، فِي قَوْلِهِ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، حَتَّى الْفَسْوَةِ وَالْفُسَيَّةِ.","bs_tekst":"Pričao mi je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed: pričao nam je Šerik, od Asima ibn Kulejba, od Hasena ibn Sa‘da, od Ibn Abbasa, o Njegovim riječima: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega, čak i tihog ispuštanja vjetra i sasvim malog ispuštanja vjetra.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Izvor ima الفسوة والفسية, pri čemu je drugi oblik umanjenica.⟧"},{"stranica":97,"ar_tekst":"حَدَّثَنِي عَلِيُّ بْنُ الْحَسَنِ، حَدَّثَنَا مُسْلِمٌ الْجَرْمِيُّ، قَالَ:\nحَدَّثَنَا مُحَمَّدُ بْنُ مُصْعَبٍ، عَنْ قَيْسِ بْنِ الرَّبِيعِ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنْ سَعِيدِ بْنِ مَعْبَدٍ، عَنِ ابْنِ عَبَّاسٍ فِي قَوْلِ اللَّهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ:\n\nعَلَّمَهُ اسْمَ كُلِّ شَيْءٍ حَتَّى الْهَنَةِ وَالْهُنَيَّةِ، وَالْفَسْوَةِ وَالضَّرْطَةِ.\n","bs_tekst":"Pričao mi je Ali ibn el-Hasen: pričao nam je Muslim el-Džermi, koji je rekao: pričao nam je Muhammed ibn Mus‘ab, od Kajsa ibn er-Rebia, od Asima ibn Kulejba, od Seida ibn Ma‘beda, od Ibn Abbasa, o riječima Allaha, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega, čak i ‘one stvari’ i ‘male one stvari’, tihog i glasnog ispuštanja vjetra.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio. Izrazi الهنة والهنية preneseni su kao neodređeni nazivi i umanjenica, bez nametanja određenog predmeta na koji bi se odnosili.⟧"},{"stranica":97,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى ابن ميمون، عن ابن أبي نجيح، عن مجاهد، فِي قَوْلِ اللَّهِ عَزَّ وَجَلَّ:\n\n«وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ: مَا خَلَقَ اللَّهُ تعالى كُلَّهُ.","bs_tekst":"Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa ibn Mejmun, od Ibn Ebu Nedžiha, od Mudžahida, o riječima Allaha, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Svemu što je Uzvišeni Allah stvorio.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧"},{"stranica":97,"ar_tekst":"حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنِ سفيان، عَنْ خَصِيفٍ، عَنْ مُجَاهِدٍ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ","bs_tekst":"Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je moj otac, od Sufjana, od Husajfa, od Mudžahida, o riječima: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:31, navedeni dio.⟧"},{"stranica":98,"ar_tekst":"حَدَّثَنَا سُفْيَانُ، قَالَ: حَدَّثَنَا أَبِي، عَنْ شَرِيكٍ، عَنْ سَالِمٍ الأَفْطَسِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ، حَتَّى الْبَعِيرِ، وَالْبَقَرَةِ، وَالشَّاةِ.","bs_tekst":"Pričao nam je Sufjan, koji je rekao: pričao nam je moj otac, od Šerika, od Salima el-Eftasa, od Seida ibn Džubejra, koji je rekao: „Poučio ga je imenu svega, čak i deve, krave i ovce.“"},{"stranica":98,"ar_tekst":"حَدَّثَنَا الْحَسَنُ بْنُ يَحْيَى، قَالَ: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن قَتَادَةَ، فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَعَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» ، قَالَ: عَلَّمَهُ اسْمَ كُلِّ شَيْءٍ: هَذَا جَبَلٌ، وَهَذَا بَحْرٌ، وَهَذَا كَذَا، وَهَذَا كَذَا، لِكُلِّ شَيْءٍ، ثُمَّ عَرَضَهُمْ عَلَى الْمَلائِكَةِ، فَقَالَ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» .","bs_tekst":"Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima.“ Rekao je: „Poučio ga je imenu svega: ovo je planina, ovo je more, ovo je to i to, a ovo je to i to — za svaku stvar. Zatim ih je pokazao melekima i rekao: ‘Obavijestite Me o imenima ovih, ako istinu govorite.’“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:31, navedeni dijelovi.⟧"},{"stranica":98,"ar_tekst":"حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، عَنْ سَعِيدٍ، عَنْ قَتَادَةَ، قَوْلُهُ عَزَّ وجل: و «عَلَّمَ آدَمَ الْأَسْماءَ كُلَّها» حَتَّى بَلَغَ «إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ» ، قَالَ: يَا آدَمُ أَنْبِئْهُمْ بِأَسْمَائِهِمْ، فَأَنْبَأَ كُلَّ صِنْفٍ مِنَ الْخَلْقِ بِاسْمِهِ، وَأَلْجَأَهُ إِلَى جِنْسِهِ.","bs_tekst":"Pričao nam je Bišr ibn Muaz: pričao nam je Jezid ibn Zurej‘, od Seida, od Katade, o riječima Njega, Silnog i Uzvišenog: „I poučio je Adema svim imenima“ — dok nije stigao do: „Ti si, doista, Sveznajući, Mudri.“ Rekao je: „Ademe, obavijesti ih o njihovim imenima.“ Pa je svaku vrstu stvorenja naveo njenim imenom i svrstao je u njen rod. ⟦Prijevodi navedenih početnih i završnih kur’anskih riječi: El-Bekara, 2:31–32. Izraz „dok nije stigao do“ dio je izvora. Naredna rečenica „Ademe, obavijesti ih…“ prenosi formulaciju predaje prema El-Bekara, 2:33.⟧"},{"
