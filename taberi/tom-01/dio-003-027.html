 العون على ما أقصده وأنويه، والتوفيق لما ألتمسه وأبغيه، فإنه ولي الحول والقوة، وصلى الله على محمد نبيه وآله وسلم تسليما.","bs":"Allahu, Silan je i Uzvišen, obraćam se želeći pomoć u onome čemu težim i što namjeravam i uspjeh u onome što tražim i želim, jer On je Posjednik moći i snage. Neka Allah blagoslovi Muhammeda, Svoga vjerovjesnika, i njegovu porodicu i neka im podari potpuni mir.","ar_ranges":[],"ar_html":"وإلى الله عز وجل أنا راغب في العون على ما أقصده وأنويه، والتوفيق لما ألتمسه وأبغيه، فإنه ولي الحول والقوة، وصلى الله على محمد نبيه وآله وسلم تسليما.","bs_ranges":[],"bs_html":"Allahu, Silan je i Uzvišen, obraćam se želeći pomoć u onome čemu težim i što namjeravam i uspjeh u onome što tražim i želim, jer On je Posjednik moći i snage. Neka Allah blagoslovi Muhammeda, Svoga vjerovjesnika, i njegovu porodicu i neka im podari potpuni mir."},{"id":"7.3","ar":"وليعلم الناظر في كتابنا هذا أن اعتمادي في كل ما أحضرت ذكره فيه مما شرطت أني راسمه فيه، إنما هو على ما رويت من الأخبار التي أنا ذاكرها فيه، والآثار التي أنا مسندها إلى رواتها فيه، دون ما أدرك بحجج العقول، واستنبط","bs":"Neka onaj ko razmatra ovu našu knjigu zna da se moje oslanjanje, u svemu što sam u njoj spomenuo od onoga za šta sam postavio uslov da ću to u njoj zabilježiti, zasniva samo na vijestima koje su mi prenesene i koje u njoj navodim, i na predajama koje u njoj lancem prenosilaca pripisujem njihovim prenosiocima, a ne na onome što se spoznaje razumskim dokazima i izvodi","ar_ranges":[],"ar_html":"وليعلم الناظر في كتابنا هذا أن اعتمادي في كل ما أحضرت ذكره فيه مما شرطت أني راسمه فيه، إنما هو على ما رويت من الأخبار التي أنا ذاكرها فيه، والآثار التي أنا مسندها إلى رواتها فيه، دون ما أدرك بحجج العقول، واستنبط","bs_ranges":[],"bs_html":"Neka onaj ko razmatra ovu našu knjigu zna da se moje oslanjanje, u svemu što sam u njoj spomenuo od onoga za šta sam postavio uslov da ću to u njoj zabilježiti, zasniva samo na vijestima koje su mi prenesene i koje u njoj navodim, i na predajama koje u njoj lancem prenosilaca pripisujem njihovim prenosiocima, a ne na onome što se spoznaje razumskim dokazima i izvodi"}],"notes":[]},{"n":8,"ar":"بفكر النفوس، إلا اليسير القليل منه، إذ كان العلم بما كان من أخبار الماضين، وما هو كائن من أنباء الحادثين، غير واصل إلى من لم يشاهدهم ولم يدرك زمانهم، إلا بأخبار المخبرين، ونقل الناقلين، دون الاستخراج بالعقول، والاستنباط بفكر النفوس فما يكن في كتابي هذا من خبر ذكرناه عن بعض الماضين مما يستنكره قارئه، أو يستشنعه سامعه، من أجل أنه لم يعرف له وجها في الصحة، ولا معنى في الحقيقة، فليعلم انه لم يؤت في ذلك من قبلنا، وإنما أتى من قبل بعض ناقليه إلينا، وإنا إنما أدينا ذلك على نحو ما أدي إلينا","bs":"\u003cp data-paragraph=\"8.1\">promišljanjem duše, osim vrlo maloga dijela toga. Jer znanje o vijestima prošlih i o izvještajima o događajima koji se zbivaju ne dopire do onoga ko ih nije vidio i nije doživio njihovo vrijeme drugačije nego putem izvještaja onih koji izvještavaju i prenošenja onih koji prenose, a ne razumskim izvođenjem i zaključivanjem promišljanjem duše. Stoga, ako u ovoj mojoj knjizi bude neka vijest koju smo prenijeli o nekima od prošlih, koju njen čitalac bude smatrao neprihvatljivom ili njen slušalac odbojnom zato što za nju ne nalazi osnovu ispravnosti niti smisao u stvarnosti, neka zna da to nije došlo od nas, nego od nekoga od onih koji su nam je prenijeli, a mi smo to samo prenijeli onako kako je preneseno nama.\u003c/p>","paragraphs":[{"id":"8.1","ar":"بفكر النفوس، إلا اليسير القليل منه، إذ كان العلم بما كان من أخبار الماضين، وما هو كائن من أنباء الحادثين، غير واصل إلى من لم يشاهدهم ولم يدرك زمانهم، إلا بأخبار المخبرين، ونقل الناقلين، دون الاستخراج بالعقول، والاستنباط بفكر النفوس فما يكن في كتابي هذا من خبر ذكرناه عن بعض الماضين مما يستنكره قارئه، أو يستشنعه سامعه، من أجل أنه لم يعرف له وجها في الصحة، ولا معنى في الحقيقة، فليعلم انه لم يؤت في ذلك من قبلنا، وإنما أتى من قبل بعض ناقليه إلينا، وإنا إنما أدينا ذلك على نحو ما أدي إلينا","bs":"promišljanjem duše, osim vrlo maloga dijela toga. Jer znanje o vijestima prošlih i o izvještajima o događajima koji se zbivaju ne dopire do onoga ko ih nije vidio i nije doživio njihovo vrijeme drugačije nego putem izvještaja onih koji izvještavaju i prenošenja onih koji prenose, a ne razumskim izvođenjem i zaključivanjem promišljanjem duše. Stoga, ako u ovoj mojoj knjizi bude neka vijest koju smo prenijeli o nekima od prošlih, koju njen čitalac bude smatrao neprihvatljivom ili njen slušalac odbojnom zato što za nju ne nalazi osnovu ispravnosti niti smisao u stvarnosti, neka zna da to nije došlo od nas, nego od nekoga od onih koji su nam je prenijeli, a mi smo to samo prenijeli onako kako je preneseno nama.","ar_ranges":[],"ar_html":"بفكر النفوس، إلا اليسير القليل منه، إذ كان العلم بما كان من أخبار الماضين، وما هو كائن من أنباء الحادثين، غير واصل إلى من لم يشاهدهم ولم يدرك زمانهم، إلا بأخبار المخبرين، ونقل الناقلين، دون الاستخراج بالعقول، والاستنباط بفكر النفوس فما يكن في كتابي هذا من خبر ذكرناه عن بعض الماضين مما يستنكره قارئه، أو يستشنعه سامعه، من أجل أنه لم يعرف له وجها في الصحة، ولا معنى في الحقيقة، فليعلم انه لم يؤت في ذلك من قبلنا، وإنما أتى من قبل بعض ناقليه إلينا، وإنا إنما أدينا ذلك على نحو ما أدي إلينا","bs_ranges":[],"bs_html":"promišljanjem duše, osim vrlo maloga dijela toga. Jer znanje o vijestima prošlih i o izvještajima o događajima koji se zbivaju ne dopire do onoga ko ih nije vidio i nije doživio njihovo vrijeme drugačije nego putem izvještaja onih koji izvještavaju i prenošenja onih koji prenose, a ne razumskim izvođenjem i zaključivanjem promišljanjem duše. Stoga, ako u ovoj mojoj knjizi bude neka vijest koju smo prenijeli o nekima od prošlih, koju njen čitalac bude smatrao neprihvatljivom ili njen slušalac odbojnom zato što za nju ne nalazi osnovu ispravnosti niti smisao u stvarnosti, neka zna da to nije došlo od nas, nego od nekoga od onih koji su nam je prenijeli, a mi smo to samo prenijeli onako kako je preneseno nama."}],"notes":[]},{"n":9,"ar":"[القول في الزمان ما هو]\n\nقال ابو جعفر: فالزمان هو ساعات الليل والنهار، وقد يقال ذلك للطويل من المدة والقصير منها، والعرب تقول: أتيتك زمان الحجاج أمير، وزمن الحجاج أمير- تعني به: إذ الحجاج أمير وتقول: اتيتك زمان الصرام وزمن الصرام- تعني به وقت الصرام ويقولون أيضا: أتيتك أزمان الحجاج أمير، فيجمعون الزمان، يريدون بذلك أن يجعلوا كل وقت من أوقات إمارته زمانا من الأزمنة، كما قال الراجز:\n\nجاء الشتاء وقميصي أخلاق ... شراذم يضحك منه التواق\n\nفجعل القميص أخلاقا، يريد بذلك وصف كل قطعة منه بالإخلاق، كما يقولون: أرض سباسب، ونحو ذلك.\n\nومن قولهم للزمان: زمن قول أعشى بني قيس بن ثعلبة:\n\nوكنت امرا زمنا بالعراق ... عفيف المناخ طويل التغن\n\nيريد بقوله: زمنا زمانا، فالزمان اسم لما ذكرت من ساعات الليل والنهار على ما قد بينت ووصفت","bs":"\u003cp data-paragraph=\"9.1\">Rasprava o vremenu: šta je ono\u003c/p>\u003cp data-paragraph=\"9.2\">Ebu Džafer je rekao: Vrijeme su sati noći i dana. Taj se izraz može upotrijebiti za dugo i kratko razdoblje. Arapi kažu: „Došao sam ti u vrijeme kada je El-Hadždžadž bio zapovjednik“, upotrebljavajući i izraz „zeman“ i izraz „zemen“, a time misle: „Dok je El-Hadždžadž bio zapovjednik.“ I kažu: „Došao sam ti u vrijeme berbe“, upotrebljavajući „zeman es-siram“ i „zemen es-siram“, a time misle na vrijeme berbe. Također kažu: „Došao sam ti u vremenima kada je El-Hadždžadž bio zapovjednik“, stavljajući riječ „vrijeme“ u množinu. Time žele svaki trenutak njegova zapovjedništva učiniti jednim vremenom među vremenima, kao što je rekao pjesnik redžeza:\u003c/p>\u003cp data-paragraph=\"9.3\">„Došla je zima, a moja košulja sva pohabana —\u003cbr>u dronjcima kojima se Et-Tevvak smije.“\u003c/p>\u003cp data-paragraph=\"9.4\">Košulju je označio množinskim izrazom „ahlak“, želeći svaki njen komad opisati pohabanošću, kao što kažu „zemlja — puste ravnice“ i tome slično.\u003c/p>\u003cp data-paragraph=\"9.5\">Među primjerima njihove upotrebe riječi „zemen“ za „zeman“ jesu riječi El-A‘šaa iz plemena Benu Kajs ibn Sa‘lebe:\u003c/p>\u003cp data-paragraph=\"9.6\">„Bio sam čovjek, neko vrijeme u Iraku,\u003cbr>čestita boravišta, dugotrajnog pjevanja.“ ⟦Napomena prevodioca: završni izraz stiha „طويل التغن“ zahtijeva provjeru prema štampanom tekstu; ovdje je prenesen prema dostupnom prijepisu.⟧\u003c/p>\u003cp data-paragraph=\"9.7\">Riječju „zemen“ misli na „zeman“. Vrijeme je, dakle, naziv za ono što sam spomenuo od sati noći i dana, kako sam već objasnio i opisao.\u003c/p>","paragraphs":[{"id":"9.1","ar":"[القول في الزمان ما هو]","bs":"Rasprava o vremenu: šta je ono","ar_ranges":[],"ar_html":"[القول في الزمان ما هو]","bs_ranges":[],"bs_html":"Rasprava o vremenu: šta je ono"},{"id":"9.2","ar":"قال ابو جعفر: فالزمان هو ساعات الليل والنهار، وقد يقال ذلك للطويل من المدة والقصير منها، والعرب تقول: أتيتك زمان الحجاج أمير، وزمن الحجاج أمير- تعني به: إذ الحجاج أمير وتقول: اتيتك زمان الصرام وزمن الصرام- تعني به وقت الصرام ويقولون أيضا: أتيتك أزمان الحجاج أمير، فيجمعون الزمان، يريدون بذلك أن يجعلوا كل وقت من أوقات إمارته زمانا من الأزمنة، كما قال الراجز:","bs":"Ebu Džafer je rekao: Vrijeme su sati noći i dana. Taj se izraz može upotrijebiti za dugo i kratko razdoblje. Arapi kažu: „Došao sam ti u vrijeme kada je El-Hadždžadž bio zapovjednik“, upotrebljavajući i izraz „zeman“ i izraz „zemen“, a time misle: „Dok je El-Hadždžadž bio zapovjednik.“ I kažu: „Došao sam ti u vrijeme berbe“, upotrebljavajući „zeman es-siram“ i „zemen es-siram“, a time misle na vrijeme berbe. Također kažu: „Došao sam ti u vremenima kada je El-Hadždžadž bio zapovjednik“, stavljajući riječ „vrijeme“ u množinu. Time žele svaki trenutak njegova zapovjedništva učiniti jednim vremenom među vremenima, kao što je rekao pjesnik redžeza:","ar_ranges":[],"ar_html":"قال ابو جعفر: فالزمان هو ساعات الليل والنهار، وقد يقال ذلك للطويل من المدة والقصير منها، والعرب تقول: أتيتك زمان الحجاج أمير، وزمن الحجاج أمير- تعني به: إذ الحجاج أمير وتقول: اتيتك زمان الصرام وزمن الصرام- تعني به وقت الصرام ويقولون أيضا: أتيتك أزمان الحجاج أمير، فيجمعون الزمان، يريدون بذلك أن يجعلوا كل وقت من أوقات إمارته زمانا من الأزمنة، كما قال الراجز:","bs_ranges":[],"bs_html":"Ebu Džafer je rekao: Vrijeme su sati noći i dana. Taj se izraz može upotrijebiti za dugo i kratko razdoblje. Arapi kažu: „Došao sam ti u vrijeme kada je El-Hadždžadž bio zapovjednik“, upotrebljavajući i izraz „zeman“ i izraz „zemen“, a time misle: „Dok je El-Hadždžadž bio zapovjednik.“ I kažu: „Došao sam ti u vrijeme berbe“, upotrebljavajući „zeman es-siram“ i „zemen es-siram“, a time misle na vrijeme berbe. Također kažu: „Došao sam ti u vremenima kada je El-Hadždžadž bio zapovjednik“, stavljajući riječ „vrijeme“ u množinu. Time žele svaki trenutak njegova zapovjedništva učiniti jednim vremenom među vremenima, kao što je rekao pjesnik redžeza:"},{"id":"9.3","ar":"جاء الشتاء وقميصي أخلاق ... شراذم يضحك منه التواق","bs":"„Došla je zima, a moja košulja sva pohabana —\nu dronjcima kojima se Et-Tevvak smije.“","ar_ranges":[],"ar_html":"جاء الشتاء وقميصي أخلاق ... شراذم يضحك منه التواق","bs_ranges":[],"bs_html":"„Došla je zima, a moja košulja sva pohabana —\nu dronjcima kojima se Et-Tevvak smije.“"},{"id":"9.4","ar":"فجعل القميص أخلاقا، يريد بذلك وصف كل قطعة منه بالإخلاق، كما يقولون: أرض سباسب، ونحو ذلك.","bs":"Košulju je označio množinskim izrazom „ahlak“, želeći svaki njen komad opisati pohabanošću, kao što kažu „zemlja — puste ravnice“ i tome slično.","ar_ranges":[],"ar_html":"فجعل القميص أخلاقا، يريد بذلك وصف كل قطعة منه بالإخلاق، كما يقولون: أرض سباسب، ونحو ذلك.","bs_ranges":[],"bs_html":"Košulju je označio množinskim izrazom „ahlak“, želeći svaki njen komad opisati pohabanošću, kao što kažu „zemlja — puste ravnice“ i tome slično."},{"id":"9.5","ar":"ومن قولهم للزمان: زمن قول أعشى بني قيس بن ثعلبة:","bs":"Među primjerima njihove upotrebe riječi „zemen“ za „zeman“ jesu riječi El-A‘šaa iz plemena Benu Kajs ibn Sa‘lebe:","ar_ranges":[],"ar_html":"ومن قولهم للزمان: زمن قول أعشى بني قيس بن ثعلبة:","bs_ranges":[],"bs_html":"Među primjerima njihove upotrebe riječi „zemen“ za „zeman“ jesu riječi El-A‘šaa iz plemena Benu Kajs ibn Sa‘lebe:"},{"id":"9.6","ar":"وكنت امرا زمنا بالعراق ... عفيف المناخ طويل التغن","bs":"„Bio sam čovjek, neko vrijeme u Iraku,\nčestita boravišta, dugotrajnog pjevanja.“ ⟦Napomena prevodioca: završni izraz stiha „طويل التغن“ zahtijeva provjeru prema štampanom tekstu; ovdje je prenesen prema dostupnom prijepisu.⟧","ar_ranges":[],"ar_html":"وكنت امرا زمنا بالعراق ... عفيف المناخ طويل التغن","bs_ranges":[],"bs_html":"„Bio sam čovjek, neko vrijeme u Iraku,\nčestita boravišta, dugotrajnog pjevanja.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: završni izraz stiha „طويل التغن“ zahtijeva provjeru prema štampanom tekstu; ovdje je prenesen prema dostupnom prijepisu.⟧\u003c/span>"},{"id":"9.7","ar":"يريد بقوله: زمنا زمانا، فالزمان اسم لما ذكرت من ساعات الليل والنهار على ما قد بينت ووصفت","bs":"Riječju „zemen“ misli na „zeman“. Vrijeme je, dakle, naziv za ono što sam spomenuo od sati noći i dana, kako sam već objasnio i opisao.","ar_ranges":[],"ar_html":"يريد بقوله: زمنا زمانا، فالزمان اسم لما ذكرت من ساعات الليل والنهار على ما قد بينت ووصفت","bs_ranges":[],"bs_html":"Riječju „zemen“ misli na „zeman“. Vrijeme je, dakle, naziv za ono što sam spomenuo od sati noći i dana, kako sam već objasnio i opisao."}],"notes":[]},{"n":10,"ar":"القول في كم قدر جميع الزمان من ابتدائه إلى انتهائه وأوله إلى آخره\n\nاختلف السلف قبلنا من أهل العلم في ذلك، فقال بعضهم: قدر جميع ذلك سبعة آلاف سنة.\n\nذكر من قَالَ ذَلِكَ:\n\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ يَعْقُوبَ، عَنْ حَمَّادٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: الدنيا جمعة من جمع الآخرة، سبعة آلاف سنه، فقد مضى سته آلاف سنه ومائتا سَنَةٍ، وَلَيَأْتِيَنَّ عَلَيْهَا مِئُونَ مِنْ سِنِينَ، لَيْسَ عَلَيْهَا مُوَحِّدٌ.\n\nوَقَالَ آخَرُونَ: قَدْرُ جَمِيعِ ذَلِكَ سِتَّةُ آلافِ سَنَةٍ.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\nحَدَّثَنَا أَبُو هِشَامٍ، قَالَ: حَدَّثَنَا مُعَاوِيَةُ بْنُ هِشَامٍ، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ أَبِي صَالِحٍ، قَالَ: قَالَ كَعْبٌ: الدُّنْيَا سِتَّةُ آلافِ سَنَةٍ.\n\nحَدَّثَنَا مُحَمَّدُ بْنُ سَهْلِ بْنِ عَسْكَرٍ، قال: حدثنا اسمعيل بن عبد الكريم، قال: حدثني عبد الصمد بن معقل، أنه سمع وهبا يقول: قد خلا من الدنيا خمسه آلاف سنه وستمائه سنه، وانى لأَعْرِفُ كُلَّ زَمَانٍ مِنْهَا، مَا كَانَ فِيهِ من الملوك والأنبياء قلت لِوَهْبِ بْنِ مُنَبِّهٍ: كَمِ الدُّنْيَا؟ قَالَ: سِتَّةُ آلاف سنه","bs":"\u003cp data-paragraph=\"10.1\">Rasprava o tome koliko ukupno traje vrijeme od njegova početka do njegova završetka, od njegova prvog do njegova posljednjeg dijela\u003c/p>\u003cp data-paragraph=\"10.2\">Prethodnici među učenim ljudima prije nas razišli su se o tome. Neki su rekli: Ukupno trajanje svega toga iznosi sedam hiljada godina.\u003c/p>\u003cp data-paragraph=\"10.3\">Spomen onoga ko je to rekao:\u003c/p>\u003cp data-paragraph=\"10.4\">Pričao nam je Ibn Humejd, rekao je: Pričao nam je Jahja ibn Vadih, rekao je: Pričao nam je Jahja ibn Jakub, od Hammada, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: Ovaj svijet je jedna sedmica među sedmicama onoga svijeta, sedam hiljada godina. Već je prošlo šest hiljada i dvjesto godina, a doći će mu stotine godina tokom kojih na njemu neće biti nikoga ko priznaje Božiju jednoću.\u003c/p>\u003cp data-paragraph=\"10.5\">Drugi su rekli: Ukupno trajanje svega toga iznosi šest hiljada godina.\u003c/p>\u003cp data-paragraph=\"10.6\">Spomen onoga ko je to rekao:\u003c/p>\u003cp data-paragraph=\"10.7\">Pričao nam je Ebu Hišam, rekao je: Pričao nam je Muavija ibn Hišam, od Sufjana, od El-A‘meša, od Ebu Saliha, koji je rekao: Ka‘b je rekao: Ovaj svijet traje šest hiljada godina.\u003c/p>\u003cp data-paragraph=\"10.8\">Pričao nam je Muhammed ibn Sehl ibn Asker, rekao je: Pričao nam je Ismail ibn Abdulkerim, rekao je: Pričao mi je Abdussamed ibn Ma‘kil da je čuo Vehba kako govori: Od ovoga svijeta već je prošlo pet hiljada i šest stotina godina. Ja zaista znam svako njegovo razdoblje, koji su u njemu bili vladari i vjerovjesnici. Rekao sam Vehbu ibn Munebbihu: Koliko traje ovaj svijet? Rekao je: Šest hiljada godina.\u003c/p>","paragraphs":[{"id":"10.1","ar":"القول في كم قدر جميع الزمان من ابتدائه إلى انتهائه وأوله إلى آخره","bs":"Rasprava o tome koliko ukupno traje vrijeme od njegova početka do njegova završetka, od njegova prvog do njegova posljednjeg dijela","ar_ranges":[],"ar_html":"القول في كم قدر جميع الزمان من ابتدائه إلى انتهائه وأوله إلى آخره","bs_ranges":[],"bs_html":"Rasprava o tome koliko ukupno traje vrijeme od njegova početka do njegova završetka, od njegova prvog do njegova posljednjeg dijela"},{"id":"10.2","ar":"اختلف السلف قبلنا من أهل العلم في ذلك، فقال بعضهم: قدر جميع ذلك سبعة آلاف سنة.","bs":"Prethodnici među učenim ljudima prije nas razišli su se o tome. Neki su rekli: Ukupno trajanje svega toga iznosi sedam hiljada godina.","ar_ranges":[],"ar_html":"اختلف السلف قبلنا من أهل العلم في ذلك، فقال بعضهم: قدر جميع ذلك سبعة آلاف سنة.","bs_ranges":[],"bs_html":"Prethodnici među učenim ljudima prije nas razišli su se o tome. Neki su rekli: Ukupno trajanje svega toga iznosi sedam hiljada godina."},{"id":"10.3","ar":"ذكر من قَالَ ذَلِكَ:","bs":"Spomen onoga ko je to rekao:","ar_ranges":[],"ar_html":"ذكر من قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onoga ko je to rekao:"},{"id":"10.4","ar":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ يَعْقُوبَ، عَنْ حَمَّادٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: الدنيا جمعة من جمع الآخرة، سبعة آلاف سنه، فقد مضى سته آلاف سنه ومائتا سَنَةٍ، وَلَيَأْتِيَنَّ عَلَيْهَا مِئُونَ مِنْ سِنِينَ، لَيْسَ عَلَيْهَا مُوَحِّدٌ.","bs":"Pričao nam je Ibn Humejd, rekao je: Pričao nam je Jahja ibn Vadih, rekao je: Pričao nam je Jahja ibn Jakub, od Hammada, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: Ovaj svijet je jedna sedmica među sedmicama onoga svijeta, sedam hiljada godina. Već je prošlo šest hiljada i dvjesto godina, a doći će mu stotine godina tokom kojih na njemu neće biti nikoga ko priznaje Božiju jednoću.","ar_ranges":[[0,178]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ يَعْقُوبَ، عَنْ حَمَّادٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: \u003c/span>الدنيا جمعة من جمع الآخرة، سبعة آلاف سنه، فقد مضى سته آلاف سنه ومائتا سَنَةٍ، وَلَيَأْتِيَنَّ عَلَيْهَا مِئُونَ مِنْ سِنِينَ، لَيْسَ عَلَيْهَا مُوَحِّدٌ.","bs_ranges":[[0,173]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, rekao je: Pričao nam je Jahja ibn Vadih, rekao je: Pričao nam je Jahja ibn Jakub, od Hammada, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: \u003c/span>Ovaj svijet je jedna sedmica među sedmicama onoga svijeta, sedam hiljada godina. Već je prošlo šest hiljada i dvjesto godina, a doći će mu stotine godina tokom kojih na njemu neće biti nikoga ko priznaje Božiju jednoću."},{"id":"10.5","ar":"وَقَالَ آخَرُونَ: قَدْرُ جَمِيعِ ذَلِكَ سِتَّةُ آلافِ سَنَةٍ.","bs":"Drugi su rekli: Ukupno trajanje svega toga iznosi šest hiljada godina.","ar_ranges":[],"ar_html":"وَقَالَ آخَرُونَ: قَدْرُ جَمِيعِ ذَلِكَ سِتَّةُ آلافِ سَنَةٍ.","bs_ranges":[],"bs_html":"Drugi su rekli: Ukupno trajanje svega toga iznosi šest hiljada godina."},{"id":"10.6","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onoga ko je to rekao:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onoga ko je to rekao:"},{"id":"10.7","ar":"حَدَّثَنَا أَبُو هِشَامٍ، قَالَ: حَدَّثَنَا مُعَاوِيَةُ بْنُ هِشَامٍ، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ أَبِي صَالِحٍ، قَالَ: قَالَ كَعْبٌ: الدُّنْيَا سِتَّةُ آلافِ سَنَةٍ.","bs":"Pričao nam je Ebu Hišam, rekao je: Pričao nam je Muavija ibn Hišam, od Sufjana, od El-A‘meša, od Ebu Saliha, koji je rekao: Ka‘b je rekao: Ovaj svijet traje šest hiljada godina.","ar_ranges":[[0,144]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو هِشَامٍ، قَالَ: حَدَّثَنَا مُعَاوِيَةُ بْنُ هِشَامٍ، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ أَبِي صَالِحٍ، قَالَ: قَالَ كَعْبٌ: \u003c/span>الدُّنْيَا سِتَّةُ آلافِ سَنَةٍ.","bs_ranges":[[0,139]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Hišam, rekao je: Pričao nam je Muavija ibn Hišam, od Sufjana, od El-A‘meša, od Ebu Saliha, koji je rekao: Ka‘b je rekao: \u003c/span>Ovaj svijet traje šest hiljada godina."},{"id":"10.8","ar":"حَدَّثَنَا مُحَمَّدُ بْنُ سَهْلِ بْنِ عَسْكَرٍ، قال: حدثنا اسمعيل بن عبد الكريم، قال: حدثني عبد الصمد بن معقل، أنه سمع وهبا يقول: قد خلا من الدنيا خمسه آلاف سنه وستمائه سنه، وانى لأَعْرِفُ كُلَّ زَمَانٍ مِنْهَا، مَا كَانَ فِيهِ من الملوك والأنبياء قلت لِوَهْبِ بْنِ مُنَبِّهٍ: كَمِ الدُّنْيَا؟ قَالَ: سِتَّةُ آلاف سنه","bs":"Pričao nam je Muhammed ibn Sehl ibn Asker, rekao je: Pričao nam je Ismail ibn Abdulkerim, rekao je: Pričao mi je Abdussamed ibn Ma‘kil da je čuo Vehba kako govori: Od ovoga svijeta već je prošlo pet hiljada i šest stotina godina. Ja zaista znam svako njegovo razdoblje, koji su u njemu bili vladari i vjerovjesnici. Rekao sam Vehbu ibn Munebbihu: Koliko traje ovaj svijet? Rekao je: Šest hiljada godina.","ar_ranges":[[0,130]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ سَهْلِ بْنِ عَسْكَرٍ، قال: حدثنا اسمعيل بن عبد الكريم، قال: حدثني عبد الصمد بن معقل، أنه سمع وهبا يقول: \u003c/span>قد خلا من الدنيا خمسه آلاف سنه وستمائه سنه، وانى لأَعْرِفُ كُلَّ زَمَانٍ مِنْهَا، مَا كَانَ فِيهِ من الملوك والأنبياء قلت لِوَهْبِ بْنِ مُنَبِّهٍ: كَمِ الدُّنْيَا؟ قَالَ: سِتَّةُ آلاف سنه","bs_ranges":[[0,164]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Sehl ibn Asker, rekao je: Pričao nam je Ismail ibn Abdulkerim, rekao je: Pričao mi je Abdussamed ibn Ma‘kil da je čuo Vehba kako govori: \u003c/span>Od ovoga svijeta već je prošlo pet hiljada i šest stotina godina. Ja zaista znam svako njegovo razdoblje, koji su u njemu bili vladari i vjerovjesnici. Rekao sam Vehbu ibn Munebbihu: Koliko traje ovaj svijet? Rekao je: Šest hiljada godina."}],"notes":[]},{"n":11,"ar":"قال أبو جعفر: والصواب من القول في ذَلِكَ مَا دَلَّ عَلَى صِحَّتِهِ الْخَبَرُ الْوَارِدُ عن رسول الله ص، وَذَلِكَ مَا حَدَّثَنَا بِهِ مُحَمَّدُ بْنُ بَشَّارٍ وَعَلِيُّ بْنُ سَهْلٍ، قَالا: حَدَّثَنَا مُؤَمَّلٌ، قَالَ: حَدَّثَنَا سُفْيَانُ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنِ ابْنِ عُمَرَ، قَالَ: [سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ: أَجَلُكُمْ فِي أَجَلِ مَنْ كَانَ قَبْلَكُمْ، مِنْ صَلاةِ الْعَصْرِ إِلَى مَغْرِبِ الشَّمْسِ] .\n\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ نَافِعٍ، عَنِ ابْنِ عمر، قال: [سمعت النبي ص يَقُولُ: أَلا إِنَّمَا أَجَلُكُمْ فِي أَجَلِ مَنْ خَلا مِنَ الأُمَمِ، كَمَا بَيْنَ صَلاةِ الْعَصْرِ إِلَى مَغْرِبِ الشَّمْسِ] .\n\nحَدَّثَنَا الْحَسَنُ بْنُ عَرَفَةَ، قَالَ: حَدَّثَنِي عَمَّارُ بْنُ مُحَمَّدٍ، ابْنُ أُخْتِ سُفْيَانَ الثَّوْرِيِّ، أَبُو الْيَقْظَانِ، عَنْ لَيْثِ بْنِ أَبِي سُلَيْمٍ، عَنْ مُغِيرَةَ بْنِ حَكِيمٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ: [قَالَ رَسُولُ الله ص: مَا بَقِيَ لأُمَّتِي مِنَ الدُّنْيَا إِلا كَمِقْدَارِ الشَّمْسِ إِذَا صُلِّيَتِ الْعَصْرُ] .\n\nحَدَّثَنِي مُحَمَّدُ بْنُ عَوْفٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، قَالَ: حَدَّثَنَا شَرِيكٌ، قَالَ: سَمِعْتُ سَلَمَةَ بْنَ كُهَيْلٍ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عُمَرَ، قَالَ: [كُنَّا جُلُوسًا عند النبي ص وَالشَّمْسُ مُرْتَفِعَةٌ عَلَى قُعَيْقِعَانَ بَعْدَ الْعَصْرِ، فَقَالَ:\n\nمَا أَعْمَارُكُمْ فِي أَعْمَارِ مَنْ مَضَى إِلا كَمَا بَقِيَ مِنْ هَذَا النَّهَارِ فِيمَا مَضَى مِنْهُ] .\n\nحَدَّثَنَا ابْنُ بَشَّارٍ وَمُحَمَّدُ بْنُ الْمُثَنَّى- قال ابن بشار: حدثنى خلف ابن مُوسَى، وَقَالَ ابْنُ الْمُثَنَّى: حَدَّثَنَا خَلَفُ بْنُ مُوسَى- قَالَ: حَدَّثَنِي أَبِي، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ أَنَّ رَسُولَ اللَّهِ ص خَطَبَ أَصْحَابَهُ يَوْمًا- وَقَدْ كَادَتِ الشَّمْسُ أَنْ تَغِيبَ، وَلَمْ يَبْقَ مِنْهَا إِلا شِقٌّ يَسِيرٌ-[فقال: والذى","bs":"\u003cp data-paragraph=\"11.1\">Ebu Džafer je rekao: Ispravan stav o tome jeste onaj na čiju ispravnost ukazuje vijest prenesena od Allahova Poslanika, neka mu Allah podari blagoslov i mir. To je ono što su nam pričali Muhammed ibn Beššar i Ali ibn Sehl; rekli su: Pričao nam je Muemmel, rekao je: Pričao nam je Sufjan, od Abdullaha ibn Dinara, od Ibn Omera, koji je rekao: [Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Vaš rok u odnosu na rok onih koji su bili prije vas jeste od ikindijskog namaza do zalaska Sunca.]\u003c/p>\u003cp data-paragraph=\"11.2\">Pričao nam je Ibn Humejd, rekao je: Pričao nam je Selema, rekao je: Pričao mi je Muhammed ibn Ishak, od Nafi‘a, od Ibn Omera, koji je rekao: [Čuo sam Vjerovjesnika, neka mu Allah podari blagoslov i mir, kako govori: Znajte da je vaš rok u odnosu na rok prošlih naroda poput vremena između ikindijskog namaza i zalaska Sunca.]\u003c/p>\u003cp data-paragraph=\"11.3\">Pričao nam je El-Hasan ibn Arefa, rekao je: Pričao mi je Ammar ibn Muhammed, sin sestre Sufjana es-Sevrija, Ebu el-Jekzan, od Lejsa ibn Ebi Sulejma, od Mugire ibn Hakima, od Abdullaha ibn Omera, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Mome ummetu od ovoga svijeta ostalo je samo onoliko koliko iznosi Sunce kada se klanja ikindija.]\u003c/p>\u003cp data-paragraph=\"11.4\">Pričao mi je Muhammed ibn Avf, rekao je: Pričao nam je Ebu Nuajm, rekao je: Pričao nam je Šerik, rekao je: Čuo sam Selemu ibn Kuhejla, od Mudžahida, od Ibn Omera, koji je rekao: [Sjedili smo kod Vjerovjesnika, neka mu Allah podari blagoslov i mir, poslije ikindije, dok je Sunce bilo visoko iznad Kuajki‘ana, pa je rekao:\u003c/p>\u003cp data-paragraph=\"11.5\">Vaši životni vijekovi u odnosu na životne vijekove onih koji su prošli jesu samo poput onoga što je ostalo od ovoga dana u odnosu na ono što je od njega prošlo.]\u003c/p>\u003cp data-paragraph=\"11.6\">Pričali su nam Ibn Beššar i Muhammed ibn el-Musenna — Ibn Beššar je rekao: Pričao mi je Halef ibn Musa, a Ibn el-Musenna je rekao: Pričao nam je Halef ibn Musa — rekao je: Pričao mi je moj otac, od Katade, od Enesa ibn Malika, da je Allahov Poslanik, neka mu Allah podari blagoslov i mir, jednoga dana održao govor svojim ashabima — a Sunce je gotovo bilo zašlo i ostao je samo njegov mali dio — [pa je rekao: Tako mi Onoga u čijoj je\u003c/p>","paragraphs":[{"id":"11.1","ar":"قال أبو جعفر: والصواب من القول في ذَلِكَ مَا دَلَّ عَلَى صِحَّتِهِ الْخَبَرُ الْوَارِدُ عن رسول الله ص، وَذَلِكَ مَا حَدَّثَنَا بِهِ مُحَمَّدُ بْنُ بَشَّارٍ وَعَلِيُّ بْنُ سَهْلٍ، قَالا: حَدَّثَنَا مُؤَمَّلٌ، قَالَ: حَدَّثَنَا سُفْيَانُ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنِ ابْنِ عُمَرَ، قَالَ: [سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ: أَجَلُكُمْ فِي أَجَلِ مَنْ كَانَ قَبْلَكُمْ، مِنْ صَلاةِ الْعَصْرِ إِلَى مَغْرِبِ الشَّمْسِ] .","bs":"Ebu Džafer je rekao: Ispravan stav o tome jeste onaj na čiju ispravnost ukazuje vijest prenesena od Allahova Poslanika, neka mu Allah podari blagoslov i mir. To je ono što su nam pričali Muhammed ibn Beššar i Ali ibn Sehl; rekli su: Pričao nam je Muemmel, rekao je: Pričao nam je Sufjan, od Abdullaha ibn Dinara, od Ibn Omera, koji je rekao: [Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Vaš rok u odnosu na rok onih koji su bili prije vas jeste od ikindijskog namaza do zalaska Sunca.]","ar_ranges":[[117,336]],"ar_html":"قال أبو جعفر: والصواب من القول في ذَلِكَ مَا دَلَّ عَلَى صِحَّتِهِ الْخَبَرُ الْوَارِدُ عن رسول الله ص، وَذَلِكَ مَا \u003cspan class=\"isnad\">حَدَّثَنَا بِهِ مُحَمَّدُ بْنُ بَشَّارٍ وَعَلِيُّ بْنُ سَهْلٍ، قَالا: حَدَّثَنَا مُؤَمَّلٌ، قَالَ: حَدَّثَنَا سُفْيَانُ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنِ ابْنِ عُمَرَ، قَالَ: [سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ: \u003c/span>أَجَلُكُمْ فِي أَجَلِ مَنْ كَانَ قَبْلَكُمْ، مِنْ صَلاةِ الْعَصْرِ إِلَى مَغْرِبِ الشَّمْسِ] .","bs_ranges":[[233,342],[343,422]],"bs_html":"Ebu Džafer je rekao: Ispravan stav o tome jeste onaj na čiju ispravnost ukazuje vijest prenesena od Allahova Poslanika, neka mu Allah podari blagoslov i mir. To je ono što su nam pričali Muhammed ibn Beššar i Ali ibn Sehl; rekli su: \u003cspan class=\"isnad\">Pričao nam je Muemmel, rekao je: Pričao nam je Sufjan, od Abdullaha ibn Dinara, od Ibn Omera, koji je rekao: \u003c/span>[\u003cspan class=\"isnad\">Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: \u003c/span>Vaš rok u odnosu na rok onih koji su bili prije vas jeste od ikindijskog namaza do zalaska Sunca.]"},{"id":"11.2","ar":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ نَافِعٍ، عَنِ ابْنِ عمر، قال: [سمعت النبي ص يَقُولُ: أَلا إِنَّمَا أَجَلُكُمْ فِي أَجَلِ مَنْ خَلا مِنَ الأُمَمِ، كَمَا بَيْنَ صَلاةِ الْعَصْرِ إِلَى مَغْرِبِ الشَّمْسِ] .","bs":"Pričao nam je Ibn Humejd, rekao je: Pričao nam je Selema, rekao je: Pričao mi je Muhammed ibn Ishak, od Nafi‘a, od Ibn Omera, koji je rekao: [Čuo sam Vjerovjesnika, neka mu Allah podari blagoslov i mir, kako govori: Znajte da je vaš rok u odnosu na rok prošlih naroda poput vremena između ikindijskog namaza i zalaska Sunca.]","ar_ranges":[[0,157]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ نَافِعٍ، عَنِ ابْنِ عمر، قال: [سمعت النبي ص يَقُولُ: \u003c/span>أَلا إِنَّمَا أَجَلُكُمْ فِي أَجَلِ مَنْ خَلا مِنَ الأُمَمِ، كَمَا بَيْنَ صَلاةِ الْعَصْرِ إِلَى مَغْرِبِ الشَّمْسِ] .","bs_ranges":[[0,141],[142,216]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, rekao je: Pričao nam je Selema, rekao je: Pričao mi je Muhammed ibn Ishak, od Nafi‘a, od Ibn Omera, koji je rekao: \u003c/span>[\u003cspan class=\"isnad\">Čuo sam Vjerovjesnika, neka mu Allah podari blagoslov i mir, kako govori: \u003c/span>Znajte da je vaš rok u odnosu na rok prošlih naroda poput vremena između ikindijskog namaza i zalaska Sunca.]"},{"id":"11.3","ar":"حَدَّثَنَا الْحَسَنُ بْنُ عَرَفَةَ، قَالَ: حَدَّثَنِي عَمَّارُ بْنُ مُحَمَّدٍ، ابْنُ أُخْتِ سُفْيَانَ الثَّوْرِيِّ، أَبُو الْيَقْظَانِ، عَنْ لَيْثِ بْنِ أَبِي سُلَيْمٍ، عَنْ مُغِيرَةَ بْنِ حَكِيمٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ: [قَالَ رَسُولُ الله ص: مَا بَقِيَ لأُمَّتِي مِنَ الدُّنْيَا إِلا كَمِقْدَارِ الشَّمْسِ إِذَا صُلِّيَتِ الْعَصْرُ] .","bs":"Pričao nam je El-Hasan ibn Arefa, rekao je: Pričao mi je Ammar ibn Muhammed, sin sestre Sufjana es-Sevrija, Ebu el-Jekzan, od Lejsa ibn Ebi Sulejma, od Mugire ibn Hakima, od Abdullaha ibn Omera, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Mome ummetu od ovoga svijeta ostalo je samo onoliko koliko iznosi Sunce kada se klanja ikindija.]","ar_ranges":[[0,261]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا الْحَسَنُ بْنُ عَرَفَةَ، قَالَ: حَدَّثَنِي عَمَّارُ بْنُ مُحَمَّدٍ، ابْنُ أُخْتِ سُفْيَانَ الثَّوْرِيِّ، أَبُو الْيَقْظَانِ، عَنْ لَيْثِ بْنِ أَبِي سُلَيْمٍ، عَنْ مُغِيرَةَ بْنِ حَكِيمٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ: [قَالَ رَسُولُ الله ص: \u003c/span>مَا بَقِيَ لأُمَّتِي مِنَ الدُّنْيَا إِلا كَمِقْدَارِ الشَّمْسِ إِذَا صُلِّيَتِ الْعَصْرُ] .","bs_ranges":[[0,210]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je El-Hasan ibn Arefa, rekao je: Pričao mi je Ammar ibn Muhammed, sin sestre Sufjana es-Sevrija, Ebu el-Jekzan, od Lejsa ibn Ebi Sulejma, od Mugire ibn Hakima, od Abdullaha ibn Omera, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Mome ummetu od ovoga svijeta ostalo je samo onoliko koliko iznosi Sunce kada se klanja ikindija.]"},{"id":"11.4","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ عَوْفٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، قَالَ: حَدَّثَنَا شَرِيكٌ، قَالَ: سَمِعْتُ سَلَمَةَ بْنَ كُهَيْلٍ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عُمَرَ، قَالَ: [كُنَّا جُلُوسًا عند النبي ص وَالشَّمْسُ مُرْتَفِعَةٌ عَلَى قُعَيْقِعَانَ بَعْدَ الْعَصْرِ، فَقَالَ:","bs":"Pričao mi je Muhammed ibn Avf, rekao je: Pričao nam je Ebu Nuajm, rekao je: Pričao nam je Šerik, rekao je: Čuo sam Selemu ibn Kuhejla, od Mudžahida, od Ibn Omera, koji je rekao: [Sjedili smo kod Vjerovjesnika, neka mu Allah podari blagoslov i mir, poslije ikindije, dok je Sunce bilo visoko iznad Kuajki‘ana, pa je rekao:","ar_ranges":[[0,177]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ عَوْفٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، قَالَ: حَدَّثَنَا شَرِيكٌ، قَالَ: سَمِعْتُ سَلَمَةَ بْنَ كُهَيْلٍ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عُمَرَ، قَالَ: \u003c/span>[كُنَّا جُلُوسًا عند النبي ص وَالشَّمْسُ مُرْتَفِعَةٌ عَلَى قُعَيْقِعَانَ بَعْدَ الْعَصْرِ، فَقَالَ:","bs_ranges":[[0,178]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Avf, rekao je: Pričao nam je Ebu Nuajm, rekao je: Pričao nam je Šerik, rekao je: Čuo sam Selemu ibn Kuhejla, od Mudžahida, od Ibn Omera, koji je rekao: \u003c/span>[Sjedili smo kod Vjerovjesnika, neka mu Allah podari blagoslov i mir, poslije ikindije, dok je Sunce bilo visoko iznad Kuajki‘ana, pa je rekao:"},{"id":"11.5","ar":"مَا أَعْمَارُكُمْ فِي أَعْمَارِ مَنْ مَضَى إِلا كَمَا بَقِيَ مِنْ هَذَا النَّهَارِ فِيمَا مَضَى مِنْهُ] .","bs":"Vaši životni vijekovi u odnosu na životne vijekove onih koji su prošli jesu samo poput onoga što je ostalo od ovoga dana u odnosu na ono što je od njega prošlo.]","ar_ranges":[],"ar_html":"مَا أَعْمَارُكُمْ فِي أَعْمَارِ مَنْ مَضَى إِلا كَمَا بَقِيَ مِنْ هَذَا النَّهَارِ فِيمَا مَضَى مِنْهُ] .","bs_ranges":[],"bs_html":"Vaši životni vijekovi u odnosu na životne vijekove onih koji su prošli jesu samo poput onoga što je ostalo od ovoga dana u odnosu na ono što je od njega prošlo.]"},{"id":"11.6","ar":"حَدَّثَنَا ابْنُ بَشَّارٍ وَمُحَمَّدُ بْنُ الْمُثَنَّى- قال ابن بشار: حدثنى خلف ابن مُوسَى، وَقَالَ ابْنُ الْمُثَنَّى: حَدَّثَنَا خَلَفُ بْنُ مُوسَى- قَالَ: حَدَّثَنِي أَبِي، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ أَنَّ رَسُولَ اللَّهِ ص خَطَبَ أَصْحَابَهُ يَوْمًا- وَقَدْ كَادَتِ الشَّمْسُ أَنْ تَغِيبَ، وَلَمْ يَبْقَ مِنْهَا إِلا شِقٌّ يَسِيرٌ-[فقال: والذى","bs":"Pričali su nam Ibn Beššar i Muhammed ibn el-Musenna — Ibn Beššar je rekao: Pričao mi je Halef ibn Musa, a Ibn el-Musenna je rekao: Pričao nam je Halef ibn Musa — rekao je: Pričao mi je moj otac, od Katade, od Enesa ibn Malika, da je Allahov Poslanik, neka mu Allah podari blagoslov i mir, jednoga dana održao govor svojim ashabima — a Sunce je gotovo bilo zašlo i ostao je samo njegov mali dio — [pa je rekao: Tako mi Onoga u čijoj je","ar_ranges":[[0,216]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ وَمُحَمَّدُ بْنُ الْمُثَنَّى- قال ابن بشار: حدثنى خلف ابن مُوسَى، وَقَالَ ابْنُ الْمُثَنَّى: حَدَّثَنَا خَلَفُ بْنُ مُوسَى- قَالَ: حَدَّثَنِي أَبِي، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ \u003c/span>أَنَّ رَسُولَ اللَّهِ ص خَطَبَ أَصْحَابَهُ يَوْمًا- وَقَدْ كَادَتِ الشَّمْسُ أَنْ تَغِيبَ، وَلَمْ يَبْقَ مِنْهَا إِلا شِقٌّ يَسِيرٌ-[فقال: والذى","bs_ranges":[[0,227]],"bs_html":"\u003cspan class=\"isnad\">Pričali su nam Ibn Beššar i Muhammed ibn el-Musenna — Ibn Beššar je rekao: Pričao mi je Halef ibn Musa, a Ibn el-Musenna je rekao: Pričao nam je Halef ibn Musa — rekao je: Pričao mi je moj otac, od Katade, od Enesa ibn Malika, \u003c/span>da je Allahov Poslanik, neka mu Allah podari blagoslov i mir, jednoga dana održao govor svojim ashabima — a Sunce je gotovo bilo zašlo i ostao je samo njegov mali dio — [pa je rekao: Tako mi Onoga u čijoj je"}],"notes":[]},{"n":12,"ar":"نَفْسُ مُحَمَّدٍ بِيَدِهِ مَا بَقِيَ مِنْ دُنْيَاكُمْ فِيمَا مَضَى مِنْهَا إِلا كَمَا بَقِيَ مِنْ يَوْمِكُمْ هَذَا فِيمَا مَضَى مِنْهُ، وَمَا تَرَوْنَ مِنَ الشَّمْسِ إِلا الْيَسِيرَ] .\n\nحَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا ابْنُ عُيَيْنَةَ، عَنْ عَلِيِّ بْنِ زَيْدٍ، عَنْ أَبِي نَضْرَةَ، عَنْ أَبِي سَعِيدٍ، قال: [قال النبي ص عِنْدَ غُرُوبِ الشَّمْسِ: إِنَّمَا مَثَلُ مَا بَقِيَ مِنَ الدُّنْيَا فِيمَا مَضَى مِنْهَا كَبَقِيَّةِ يَوْمِكُمْ هَذَا فِيمَا مَضَى مِنْهُ] .\n\nحَدَّثَنَا هَنَّادُ بْنُ السَّرِيِّ وَأَبُو هِشَامٍ الرِّفَاعِيُّ، قَالا: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ أَبِي حُصَيْنٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رسول الله ص: بعثت انا وَالسَّاعَةَ كَهَاتَيْنِ- وَأَشَارَ بِالسَّبَّابَةِ وَالْوُسْطَى] .\n\nحَدَّثَنَا أَبُو كريب، حَدَّثَنَا يَحْيَى بْنُ آدَمَ، عَنْ أَبِي بَكْرٍ، عَنْ أَبِي حُصَيْنٍ، عَنْ أَبِي صَالِحٍ، عَنْ ابى هريرة، عن النبي بِنَحْوِهِ.\n\nحَدَّثَنَا هَنَّادٌ، قَالَ: حَدَّثَنَا أَبُو الأَحْوَصِ وَأَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سَمُرَةَ، قَالَ: [قَالَ رسول الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .\n\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عَثَّامُ بْنُ عَلِيٍّ، عَنِ الأَعْمَشِ، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سَمُرَةَ، [قَالَ: كَأَنِّي أَنْظُرُ إِلَى إِصْبَعَيْ رَسُولِ الله ص- وَأَشَارَ بِالْمُسَبِّحَةِ وَالَّتِي تَلِيهَا- وَهُوَ يَقُولُ:\n\nبُعِثْتُ أَنَا وَالسَّاعَةَ كَهَذِهِ مِنْ هَذِهِ] .\n\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنِي يَحْيَى بْنُ وَاضِحٍ، قَالَ: حدثنا فطر، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سمره، قال: [قال رسول الله ص: بُعِثْتُ مِنَ السَّاعَةِ كَهَاتَيْنِ]- وَجَمَعَ بَيْنَ إِصْبَعَيْهِ السبابة والوسطى","bs":"\u003cp data-paragraph=\"12.1\">ruci Muhammedova duša, od vašega svijeta u odnosu na ono što je od njega prošlo ostalo je samo kao ono što je ostalo od ovoga vašeg dana u odnosu na ono što je od njega prošlo, a od Sunca vidite samo malo.]\u003c/p>\u003cp data-paragraph=\"12.2\">Pričao nam je Ibn Veki‘, rekao je: Pričao nam je Ibn Ujejna, od Alija ibn Zejda, od Ebu Nadre, od Ebu Seida, koji je rekao: [Vjerovjesnik, neka mu Allah podari blagoslov i mir, pri zalasku Sunca rekao je: Primjer onoga što je ostalo od ovoga svijeta u odnosu na ono što je od njega prošlo jeste samo poput ostatka ovoga vašeg dana u odnosu na ono što je od njega prošlo.]\u003c/p>\u003cp data-paragraph=\"12.3\">Pričali su nam Hennad ibn es-Serijj i Ebu Hišam er-Rifa‘i; rekli su: Pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Husajna, od Ebu Saliha, od Ebu Hurejre, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva — i pokazao je kažiprstom i srednjim prstom.]\u003c/p>\u003cp data-paragraph=\"12.4\">Pričao nam je Ebu Kurejb; pričao nam je Jahja ibn Adem, od Ebu Bekra, od Ebu Husajna, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, nešto slično tome.\u003c/p>\u003cp data-paragraph=\"12.5\">Pričao nam je Hennad, rekao je: Pričali su nam Ebu el-Ahves i Ebu Muavija, od El-A‘meša, od Ebu Halida el-Valibija, od Džabira ibn Semure, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.]\u003c/p>\u003cp data-paragraph=\"12.6\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Assam ibn Ali, od El-A‘meša, od Ebu Halida el-Valibija, od Džabira ibn Semure, [koji je rekao: Kao da gledam dva prsta Allahova Poslanika, neka mu Allah podari blagoslov i mir — pokazao je kažiprstom i onim do njega — dok govori:\u003c/p>\u003cp data-paragraph=\"12.7\">Poslan sam u odnosu na Čas kao ovaj u odnosu na ovaj.]\u003c/p>\u003cp data-paragraph=\"12.8\">Pričao nam je Ibn Humejd, rekao je: Pričao mi je Jahja ibn Vadih, rekao je: Pričao nam je Fitr, od Ebu Halida el-Valibija, od Džabira ibn Semure, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Poslan sam u odnosu na Čas kao ova dva] — i sastavio je svoja dva prsta, kažiprst i srednji prst.\u003c/p>","paragraphs":[{"id":"12.1","ar":"نَفْسُ مُحَمَّدٍ بِيَدِهِ مَا بَقِيَ مِنْ دُنْيَاكُمْ فِيمَا مَضَى مِنْهَا إِلا كَمَا بَقِيَ مِنْ يَوْمِكُمْ هَذَا فِيمَا مَضَى مِنْهُ، وَمَا تَرَوْنَ مِنَ الشَّمْسِ إِلا الْيَسِيرَ] .","bs":"ruci Muhammedova duša, od vašega svijeta u odnosu na ono što je od njega prošlo ostalo je samo kao ono što je ostalo od ovoga vašeg dana u odnosu na ono što je od njega prošlo, a od Sunca vidite samo malo.]","ar_ranges":[],"ar_html":"نَفْسُ مُحَمَّدٍ بِيَدِهِ مَا بَقِيَ مِنْ دُنْيَاكُمْ فِيمَا مَضَى مِنْهَا إِلا كَمَا بَقِيَ مِنْ يَوْمِكُمْ هَذَا فِيمَا مَضَى مِنْهُ، وَمَا تَرَوْنَ مِنَ الشَّمْسِ إِلا الْيَسِيرَ] .","bs_ranges":[],"bs_html":"ruci Muhammedova duša, od vašega svijeta u odnosu na ono što je od njega prošlo ostalo je samo kao ono što je ostalo od ovoga vašeg dana u odnosu na ono što je od njega prošlo, a od Sunca vidite samo malo.]"},{"id":"12.2","ar":"حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا ابْنُ عُيَيْنَةَ، عَنْ عَلِيِّ بْنِ زَيْدٍ، عَنْ أَبِي نَضْرَةَ، عَنْ أَبِي سَعِيدٍ، قال: [قال النبي ص عِنْدَ غُرُوبِ الشَّمْسِ: إِنَّمَا مَثَلُ مَا بَقِيَ مِنَ الدُّنْيَا فِيمَا مَضَى مِنْهَا كَبَقِيَّةِ يَوْمِكُمْ هَذَا فِيمَا مَضَى مِنْهُ] .","bs":"Pričao nam je Ibn Veki‘, rekao je: Pričao nam je Ibn Ujejna, od Alija ibn Zejda, od Ebu Nadre, od Ebu Seida, koji je rekao: [Vjerovjesnik, neka mu Allah podari blagoslov i mir, pri zalasku Sunca rekao je: Primjer onoga što je ostalo od ovoga svijeta u odnosu na ono što je od njega prošlo jeste samo poput ostatka ovoga vašeg dana u odnosu na ono što je od njega prošlo.]","ar_ranges":[[0,173]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا ابْنُ عُيَيْنَةَ، عَنْ عَلِيِّ بْنِ زَيْدٍ، عَنْ أَبِي نَضْرَةَ، عَنْ أَبِي سَعِيدٍ، قال: [قال النبي ص عِنْدَ غُرُوبِ الشَّمْسِ: \u003c/span>إِنَّمَا مَثَلُ مَا بَقِيَ مِنَ الدُّنْيَا فِيمَا مَضَى مِنْهَا كَبَقِيَّةِ يَوْمِكُمْ هَذَا فِيمَا مَضَى مِنْهُ] .","bs_ranges":[[0,124]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, rekao je: Pričao nam je Ibn Ujejna, od Alija ibn Zejda, od Ebu Nadre, od Ebu Seida, koji je rekao: \u003c/span>[Vjerovjesnik, neka mu Allah podari blagoslov i mir, pri zalasku Sunca rekao je: Primjer onoga što je ostalo od ovoga svijeta u odnosu na ono što je od njega prošlo jeste samo poput ostatka ovoga vašeg dana u odnosu na ono što je od njega prošlo.]"},{"id":"12.3","ar":"حَدَّثَنَا هَنَّادُ بْنُ السَّرِيِّ وَأَبُو هِشَامٍ الرِّفَاعِيُّ، قَالا: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ أَبِي حُصَيْنٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رسول الله ص: بعثت انا وَالسَّاعَةَ كَهَاتَيْنِ- وَأَشَارَ بِالسَّبَّابَةِ وَالْوُسْطَى] .","bs":"Pričali su nam Hennad ibn es-Serijj i Ebu Hišam er-Rifa‘i; rekli su: Pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Husajna, od Ebu Saliha, od Ebu Hurejre, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva — i pokazao je kažiprstom i srednjim prstom.]","ar_ranges":[[0,204]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا هَنَّادُ بْنُ السَّرِيِّ وَأَبُو هِشَامٍ الرِّفَاعِيُّ، قَالا: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ أَبِي حُصَيْنٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رسول الله ص: \u003c/span>بعثت انا وَالسَّاعَةَ كَهَاتَيْنِ- وَأَشَارَ بِالسَّبَّابَةِ وَالْوُسْطَى] .","bs_ranges":[[0,165]],"bs_html":"\u003cspan class=\"isnad\">Pričali su nam Hennad ibn es-Serijj i Ebu Hišam er-Rifa‘i; rekli su: Pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Husajna, od Ebu Saliha, od Ebu Hurejre, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva — i pokazao je kažiprstom i srednjim prstom.]"},{"id":"12.4","ar":"حَدَّثَنَا أَبُو كريب، حَدَّثَنَا يَحْيَى بْنُ آدَمَ، عَنْ أَبِي بَكْرٍ، عَنْ أَبِي حُصَيْنٍ، عَنْ أَبِي صَالِحٍ، عَنْ ابى هريرة، عن النبي بِنَحْوِهِ.","bs":"Pričao nam je Ebu Kurejb; pričao nam je Jahja ibn Adem, od Ebu Bekra, od Ebu Husajna, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, nešto slično tome.","ar_ranges":[[0,150]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كريب، حَدَّثَنَا يَحْيَى بْنُ آدَمَ، عَنْ أَبِي بَكْرٍ، عَنْ أَبِي حُصَيْنٍ، عَنْ أَبِي صَالِحٍ، عَنْ ابى هريرة، عن النبي بِنَحْوِهِ.\u003c/span>","bs_ranges":[[0,135]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb; pričao nam je Jahja ibn Adem, od Ebu Bekra, od Ebu Husajna, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, \u003c/span>nešto slično tome."},{"id":"12.5","ar":"حَدَّثَنَا هَنَّادٌ، قَالَ: حَدَّثَنَا أَبُو الأَحْوَصِ وَأَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سَمُرَةَ، قَالَ: [قَالَ رسول الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .","bs":"Pričao nam je Hennad, rekao je: Pričali su nam Ebu el-Ahves i Ebu Muavija, od El-A‘meša, od Ebu Halida el-Valibija, od Džabira ibn Semure, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.]","ar_ranges":[[0,183]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا هَنَّادٌ، قَالَ: حَدَّثَنَا أَبُو الأَحْوَصِ وَأَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سَمُرَةَ، قَالَ: [قَالَ رسول الله ص: \u003c/span>بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .","bs_ranges":[[0,154]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Hennad, rekao je: Pričali su nam Ebu el-Ahves i Ebu Muavija, od El-A‘meša, od Ebu Halida el-Valibija, od Džabira ibn Semure, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.]"},{"id":"12.6","ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عَثَّامُ بْنُ عَلِيٍّ، عَنِ الأَعْمَشِ، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سَمُرَةَ، [قَالَ: كَأَنِّي أَنْظُرُ إِلَى إِصْبَعَيْ رَسُولِ الله ص- وَأَشَارَ بِالْمُسَبِّحَةِ وَالَّتِي تَلِيهَا- وَهُوَ يَقُولُ:","bs":"Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Assam ibn Ali, od El-A‘meša, od Ebu Halida el-Valibija, od Džabira ibn Semure, [koji je rekao: Kao da gledam dva prsta Allahova Poslanika, neka mu Allah podari blagoslov i mir — pokazao je kažiprstom i onim do njega — dok govori:","ar_ranges":[[0,155]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عَثَّامُ بْنُ عَلِيٍّ، عَنِ الأَعْمَشِ، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سَمُرَةَ، [قَالَ: \u003c/span>كَأَنِّي أَنْظُرُ إِلَى إِصْبَعَيْ رَسُولِ الله ص- وَأَشَارَ بِالْمُسَبِّحَةِ وَالَّتِي تَلِيهَا- وَهُوَ يَقُولُ:","bs_ranges":[[0,129]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Assam ibn Ali, od El-A‘meša, od Ebu Halida el-Valibija, od Džabira ibn Semure, \u003c/span>[koji je rekao: Kao da gledam dva prsta Allahova Poslanika, neka mu Allah podari blagoslov i mir — pokazao je kažiprstom i onim do njega — dok govori:"},{"id":"12.7","ar":"بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَذِهِ مِنْ هَذِهِ] .","bs":"Poslan sam u odnosu na Čas kao ovaj u odnosu na ovaj.]","ar_ranges":[],"ar_html":"بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَذِهِ مِنْ هَذِهِ] .","bs_ranges":[],"bs_html":"Poslan sam u odnosu na Čas kao ovaj u odnosu na ovaj.]"},{"id":"12.8","ar":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنِي يَحْيَى بْنُ وَاضِحٍ، قَالَ: حدثنا فطر، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سمره، قال: [قال رسول الله ص: بُعِثْتُ مِنَ السَّاعَةِ كَهَاتَيْنِ]- وَجَمَعَ بَيْنَ إِصْبَعَيْهِ السبابة والوسطى","bs":"Pričao nam je Ibn Humejd, rekao je: Pričao mi je Jahja ibn Vadih, rekao je: Pričao nam je Fitr, od Ebu Halida el-Valibija, od Džabira ibn Semure, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Poslan sam u odnosu na Čas kao ova dva] — i sastavio je svoja dva prsta, kažiprst i srednji prst.","ar_ranges":[[0,166]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنِي يَحْيَى بْنُ وَاضِحٍ، قَالَ: حدثنا فطر، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سمره، قال: [قال رسول الله ص: \u003c/span>بُعِثْتُ مِنَ السَّاعَةِ كَهَاتَيْنِ]- وَجَمَعَ بَيْنَ إِصْبَعَيْهِ السبابة والوسطى","bs_ranges":[[0,161]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, rekao je: Pričao mi je Jahja ibn Vadih, rekao je: Pričao nam je Fitr, od Ebu Halida el-Valibija, od Džabira ibn Semure, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Poslan sam u odnosu na Čas kao ova dva] — i sastavio je svoja dva prsta, kažiprst i srednji prst."}],"notes":[]},{"n":13,"ar":"حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ: حَدَّثَنَا شُعْبَةُ، قَالَ: سَمِعْتُ قَتَادَةَ يُحَدِّثُ، قَالَ: حَدَّثَنَا أَنَسُ بْنُ مَالِكٍ، قَالَ: [قال رسول الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] قَالَ شُعْبَةُ:\n\nسَمِعْتُ قَتَادَةَ يَقُولُ فِي قَصَصِهِ: كَفَضْلِ إِحْدَاهُمَا عَلَى الأُخْرَى، قَالَ: لا أَدْرِي أَذَكَرَهُ عَنْ أَنَسٍ أَوْ قَالَهُ قَتَادَةُ.\n\nحَدَّثَنَا خَلادُ بْنُ أَسْلَمَ، قَالَ: حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ:\n\nحَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، قَالَ: حَدَّثَنَا أَنَسُ بْنُ مالك، قال: [قال رسول الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .\n\nحَدَّثَنَا مُجَاهِدُ بْنُ مُوسَى، قَالَ: حَدَّثَنَا يَزِيدُ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، عَنِ النبي ص مِثْلَهُ، وَزَادَ فِي حَدِيثِهِ:\n\nوَأَشَارَ بِالْوُسْطَى وَالسَّبَّابَةِ.\n\nحَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا أَيُّوبُ بْنُ سُوَيْدٍ، عَنِ الأوزاعي، قال: حدثنا اسمعيل بْنُ عُبَيْدِ اللَّهِ، قَالَ: قَدِمَ أَنَسُ بْنُ مَالِكٍ عَلَى الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ، فَقَالَ له الوليد: ماذا سمعت رسول الله ص يَذْكُرُ بِهِ السَّاعَةَ؟ قَالَ: [سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ:\n\nأَنْتُمْ وَالسَّاعَةَ كَهَاتَيْنِ،] وَأَشَارَ بِإِصْبَعَيْهِ.\n\nحَدَّثَنِي الْعَبَّاسُ بْنُ الْوَلِيدِ، قَالَ: أَخْبَرَنِي أَبِي، قَالَ: حدثنا الأوزاعي، قال: حدثنى اسمعيل بْنُ عُبَيْدِ اللَّهِ، قَالَ: قَدِمَ أَنَسُ بْنُ مَالِكٍ عَلَى الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ، فَقَالَ لَهُ الْوَلِيدُ: مَاذَا سَمِعْتَ مِنْ رَسُولِ اللَّهِ ص يَذْكُرُ بِهِ السَّاعَةَ؟ [قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ص يقول: أنتم والساعة كتين] .\n\nحَدَّثَنِي ابْنُ عَبْدِ الرَّحِيمِ الْبَرْقِيُّ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ أَبِي سَلَمَةَ،","bs":"\u003cp data-paragraph=\"13.1\">Pričao nam je Ibn el-Musenna, rekao je: Pričao nam je Muhammed ibn Džafer, rekao je: Pričao nam je Šu‘ba, rekao je: Čuo sam Katadu kako pripovijeda; rekao je: Pričao nam je Enes ibn Malik, rekao je: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.] Šu‘ba je rekao:\u003c/p>\u003cp data-paragraph=\"13.2\">Čuo sam Katadu kako u svojim kazivanjima govori: Poput razlike za koju je jedan od njih duži od drugoga. Rekao je: Ne znam je li to spomenuo prenoseći od Enesa ili je to rekao Katada.\u003c/p>\u003cp data-paragraph=\"13.3\">Pričao nam je Hallad ibn Eslem, rekao je: Pričao nam je En-Nadr ibn Šumejl, rekao je:\u003c/p>\u003cp data-paragraph=\"13.4\">Pričao nam je Šu‘ba, od Katade, koji je rekao: Pričao nam je Enes ibn Malik, rekao je: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.]\u003c/p>\u003cp data-paragraph=\"13.5\">Pričao nam je Mudžahid ibn Musa, rekao je: Pričao nam je Jezid, rekao je: Pričao nam je Šu‘ba, od Katade, od Enesa ibn Malika, od Vjerovjesnika, neka mu Allah podari blagoslov i mir, isto to, a u svojoj je predaji dodao:\u003c/p>\u003cp data-paragraph=\"13.6\">I pokazao je srednjim prstom i kažiprstom.\u003c/p>\u003cp data-paragraph=\"13.7\">Pričao nam je Muhammed ibn Abdullah ibn Abdulhakem, rekao je: Pričao nam je Ejjub ibn Suvejd, od El-Evza‘ija, koji je rekao: Pričao nam je Ismail ibn Ubejdullah, rekao je: Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa mu je El-Velid rekao: Šta si čuo od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da govori o Času? Rekao je: [Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori:\u003c/p>\u003cp data-paragraph=\"13.8\">Vi i Čas ste kao ova dva,] i pokazao je sa svoja dva prsta.\u003c/p>\u003cp data-paragraph=\"13.9\">Pričao mi je El-Abbas ibn el-Velid, rekao je: Obavijestio me je moj otac, rekao je: Pričao nam je El-Evza‘i, rekao je: Pričao mi je Ismail ibn Ubejdullah, rekao je: Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa mu je El-Velid rekao: Šta si čuo od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da govori o Času? [Rekao je: Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Vi i Čas ste „كتين“.] ⟦Napomena prevodioca: na ovom mjestu prijepis ima nejasan zapis „كتين“; nije prešutno zamijenjen riječju iz paralelne predaje.⟧\u003c/p>\u003cp data-paragraph=\"13.10\">Pričao mi je Ibn Abdurrahim el-Berki, rekao je: Pričao nam je Amr ibn Ebi Selema,\u003c/p>","paragraphs":[{"id":"13.1","ar":"حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ: حَدَّثَنَا شُعْبَةُ، قَالَ: سَمِعْتُ قَتَادَةَ يُحَدِّثُ، قَالَ: حَدَّثَنَا أَنَسُ بْنُ مَالِكٍ، قَالَ: [قال رسول الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] قَالَ شُعْبَةُ:","bs":"Pričao nam je Ibn el-Musenna, rekao je: Pričao nam je Muhammed ibn Džafer, rekao je: Pričao nam je Šu‘ba, rekao je: Čuo sam Katadu kako pripovijeda; rekao je: Pričao nam je Enes ibn Malik, rekao je: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.] Šu‘ba je rekao:","ar_ranges":[[0,202]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ: حَدَّثَنَا شُعْبَةُ، قَالَ: سَمِعْتُ قَتَادَةَ يُحَدِّثُ، قَالَ: حَدَّثَنَا أَنَسُ بْنُ مَالِكٍ، قَالَ: [قال رسول الله ص: \u003c/span>بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] قَالَ شُعْبَةُ:","bs_ranges":[[0,199]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn el-Musenna, rekao je: Pričao nam je Muhammed ibn Džafer, rekao je: Pričao nam je Šu‘ba, rekao je: Čuo sam Katadu kako pripovijeda; rekao je: Pričao nam je Enes ibn Malik, rekao je: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.] Šu‘ba je rekao:"},{"id":"13.2","ar":"سَمِعْتُ قَتَادَةَ يَقُولُ فِي قَصَصِهِ: كَفَضْلِ إِحْدَاهُمَا عَلَى الأُخْرَى، قَالَ: لا أَدْرِي أَذَكَرَهُ عَنْ أَنَسٍ أَوْ قَالَهُ قَتَادَةُ.","bs":"Čuo sam Katadu kako u svojim kazivanjima govori: Poput razlike za koju je jedan od njih duži od drugoga. Rekao je: Ne znam je li to spomenuo prenoseći od Enesa ili je to rekao Katada.","ar_ranges":[[0,41]],"ar_html":"\u003cspan class=\"isnad\">سَمِعْتُ قَتَادَةَ يَقُولُ فِي قَصَصِهِ: \u003c/span>كَفَضْلِ إِحْدَاهُمَا عَلَى الأُخْرَى، قَالَ: لا أَدْرِي أَذَكَرَهُ عَنْ أَنَسٍ أَوْ قَالَهُ قَتَادَةُ.","bs_ranges":[[0,49]],"bs_html":"\u003cspan class=\"isnad\">Čuo sam Katadu kako u svojim kazivanjima govori: \u0
