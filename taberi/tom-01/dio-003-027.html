لِيدُ: مَاذَا سَمِعْتَ مِنْ رَسُولِ اللَّهِ ص يَذْكُرُ بِهِ السَّاعَةَ؟ [قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ص يقول: أنتم والساعة كتين] .","bs_ranges":[[0,165]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je El-Abbas ibn el-Velid, rekao je: Obavijestio me je moj otac, rekao je: Pričao nam je El-Evza‘i, rekao je: Pričao mi je Ismail ibn Ubejdullah, rekao je: \u003c/span>Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa mu je El-Velid rekao: Šta si čuo od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da govori o Času? [Rekao je: Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Vi i Čas ste „كتين“.] \u003cspan class=\"translator-note\">⟦Napomena prevodioca: na ovom mjestu prijepis ima nejasan zapis „كتين“; nije prešutno zamijenjen riječju iz paralelne predaje.⟧\u003c/span>"},{"id":"13.10","ar":"حَدَّثَنِي ابْنُ عَبْدِ الرَّحِيمِ الْبَرْقِيُّ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ أَبِي سَلَمَةَ،","bs":"Pričao mi je Ibn Abdurrahim el-Berki, rekao je: Pričao nam je Amr ibn Ebi Selema,","ar_ranges":[[0,95]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي ابْنُ عَبْدِ الرَّحِيمِ الْبَرْقِيُّ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ أَبِي سَلَمَةَ،\u003c/span>","bs_ranges":[[0,81]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ibn Abdurrahim el-Berki, rekao je: Pričao nam je Amr ibn Ebi Selema,\u003c/span>"}],"notes":[]},{"n":14,"ar":"عن الأوزاعي، قال: حدثنى اسمعيل بْنُ عُبَيْدِ اللَّهِ، قَالَ: قَدِمَ أَنَسُ بْنُ مَالِكٍ عَلَى الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ، فَذَكَرَ مِثْلَهُ حَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا الْمُعْتَمِرُ بْنُ سُلَيْمَانَ، عَنْ أَبِيهِ، قَالَ: حَدَّثَنِي مَعْبَدٌ، حَدَّثَ أَنَسٌ، [عَنْ رَسُولِ اللَّهِ ص أَنَّهُ قَالَ: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَقَالَ بِإِصْبَعَيْهِ: هَكَذَا.\n\nحَدَّثَنَا ابْنُ الْمُثَنَّى قَالَ: حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي التَّيَّاحِ، عَنْ أَنَسٍ، قَالَ: [قَالَ رَسُولُ الله ص:\n\nبُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ:] السَّبَّابَةِ وَالْوُسْطَى قَالَ أَبُو مُوسَى: وَأَشَارَ وَهْبٌ بِالسَّبَّابَةِ وَالْوُسْطَى حَدَّثَنِي عَبْدُ اللَّهِ بْنُ أَبِي زِيَادٍ، قَالَ: حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، قَالَ:\n\nحَدَّثَنَا شُعْبَةُ، عَنْ أَبِي التَّيَّاحِ وَقَتَادَةَ، عَنْ أَنَسٍ، قَالَ: [قَالَ رسول الله ص: بعثت انا وَالسَّاعَةَ كَهَاتَيْنِ،] وَقَرَنَ بَيْنَ إِصْبَعَيْهِ.\n\nحَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ بَزِيعٍ، قَالَ: حَدَّثَنَا الفضيل بن سليمان، حَدَّثَنَا أَبُو حَازِمٍ، قَالَ: حَدَّثَنَا سَهْلُ بْنُ سعد، قال: [رايت رسول الله ص قَالَ بِإِصْبَعَيْهِ هَكَذَا، الْوُسْطَى وَالَّتِي تَلِي الإِبْهَامَ: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .\n\nحَدَّثَنَا مُحَمَّدُ بْنُ يَزِيدَ الأَدَمِيُّ، قَالَ: حَدَّثَنَا أَبُو ضَمْرَةَ، عَنْ أَبِي حَازِمٍ، عَنْ [سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ ان رسول الله ص قَالَ: بُعِثْتُ وَالسَّاعَةَ كَهَاتَيْنِ- وَضَمَّ بَيْنَ إِصْبَعَيْهِ الْوُسْطَى، وَالَّتِي تَلِي الإِبْهَامَ- وَقَالَ: مَا مَثَلِي وَمَثَلُ السَّاعَةِ إِلا كَفَرَسَيْ رِهَانٍ، ثُمَّ قَالَ: مَا مَثَلِي وَمَثَلُ السَّاعَةِ إِلا كَمَثَلِ رَجُلٍ بَعَثَهُ قَوْمٌ طَلِيعَةً، فَلَمَّا خَشِيَ أَنْ يُسْبَقُ أَلاحَ بِثَوْبِهِ: أُتِيتُمْ، أُتِيتُمْ، أَنَا ذَاكَ أَنَا ذَاكَ] .\n\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا خَالِدٌ، عَنْ مُحَمَّدِ بْنِ جَعْفَرٍ، عَنْ أَبِي حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رَسُولُ الله ص:\n\nبُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَجَمَعَ بَيْنَ إِصْبَعَيْهِ","bs":"\u003cp data-paragraph=\"14.1\">od El-Evza‘ija, koji je rekao: Pričao mi je Ismail ibn Ubejdullah, rekao je: Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa je spomenuo isto to. Pričao mi je Muhammed ibn Abdula‘la, rekao je: Pričao nam je El-Mu‘temir ibn Sulejman, od njegova oca, koji je rekao: Pričao mi je Ma‘bed; Enes je pripovijedao [od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je rekao: Ja i Čas poslani smo kao ova dva,] i sa svoja dva prsta pokazao je: Ovako.\u003c/p>\u003cp data-paragraph=\"14.2\">Pričao nam je Ibn el-Musenna, rekao je: Pričao nam je Vehb ibn Džerir, rekao je: Pričao nam je Šu‘ba, od Ebu et-Tejjaha, od Enesa, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je:\u003c/p>\u003cp data-paragraph=\"14.3\">Ja i Čas poslani smo kao ova dva:] kažiprst i srednji prst. Ebu Musa je rekao: Vehb je pokazao kažiprstom i srednjim prstom. Pričao mi je Abdullah ibn Ebi Zijad, rekao je: Pričao nam je Vehb ibn Džerir, rekao je:\u003c/p>\u003cp data-paragraph=\"14.4\">Pričao nam je Šu‘ba, od Ebu et-Tejjaha i Katade, od Enesa, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva,] i primakao je svoja dva prsta jedan drugome.\u003c/p>\u003cp data-paragraph=\"14.5\">Pričao mi je Muhammed ibn Abdullah ibn Bezi‘, rekao je: Pričao nam je El-Fudajl ibn Sulejman; pričao nam je Ebu Hazim, rekao je: Pričao nam je Sehl ibn Sa‘d, rekao je: [Vidio sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako sa svoja dva prsta, srednjim i onim do palca, pokazuje ovako: Ja i Čas poslani smo kao ova dva.]\u003c/p>\u003cp data-paragraph=\"14.6\">Pričao nam je Muhammed ibn Jezid el-Ademi, rekao je: Pričao nam je Ebu Damra, od Ebu Hazima, od [Sehla ibn Sa‘da es-Sa‘idija, da je Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao: Poslan sam i Čas kao ova dva — i primakao je svoja dva prsta, srednji i onaj do palca — i rekao: Moj primjer i primjer Časa jesu samo poput dva trkaća konja. Zatim je rekao: Moj primjer i primjer Časa jesu samo kao primjer čovjeka kojeg je njegov narod poslao kao izvidnika, pa je, kada se pobojao da će biti preteknut, zamahao svojom odjećom: Napadnuti ste! Napadnuti ste! Ja sam taj! Ja sam taj!]\u003c/p>\u003cp data-paragraph=\"14.7\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Halid, od Muhammeda ibn Džafera, od Ebu Hazima, od Sehla ibn Sa‘da, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je:\u003c/p>\u003cp data-paragraph=\"14.8\">Ja i Čas poslani smo kao ova dva,] i sastavio je svoja dva prsta.\u003c/p>","paragraphs":[{"id":"14.1","ar":"عن الأوزاعي، قال: حدثنى اسمعيل بْنُ عُبَيْدِ اللَّهِ، قَالَ: قَدِمَ أَنَسُ بْنُ مَالِكٍ عَلَى الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ، فَذَكَرَ مِثْلَهُ حَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا الْمُعْتَمِرُ بْنُ سُلَيْمَانَ، عَنْ أَبِيهِ، قَالَ: حَدَّثَنِي مَعْبَدٌ، حَدَّثَ أَنَسٌ، [عَنْ رَسُولِ اللَّهِ ص أَنَّهُ قَالَ: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَقَالَ بِإِصْبَعَيْهِ: هَكَذَا.","bs":"od El-Evza‘ija, koji je rekao: Pričao mi je Ismail ibn Ubejdullah, rekao je: Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa je spomenuo isto to. Pričao mi je Muhammed ibn Abdula‘la, rekao je: Pričao nam je El-Mu‘temir ibn Sulejman, od njegova oca, koji je rekao: Pričao mi je Ma‘bed; Enes je pripovijedao [od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je rekao: Ja i Čas poslani smo kao ova dva,] i sa svoja dva prsta pokazao je: Ovako.","ar_ranges":[[0,61],[146,322]],"ar_html":"\u003cspan class=\"isnad\">عن الأوزاعي، قال: حدثنى اسمعيل بْنُ عُبَيْدِ اللَّهِ، قَالَ: \u003c/span>قَدِمَ أَنَسُ بْنُ مَالِكٍ عَلَى الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ، فَذَكَرَ مِثْلَهُ \u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا الْمُعْتَمِرُ بْنُ سُلَيْمَانَ، عَنْ أَبِيهِ، قَالَ: حَدَّثَنِي مَعْبَدٌ، حَدَّثَ أَنَسٌ، [عَنْ رَسُولِ اللَّهِ ص \u003c/span>أَنَّهُ قَالَ: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَقَالَ بِإِصْبَعَيْهِ: هَكَذَا.","bs_ranges":[[0,77],[152,312]],"bs_html":"\u003cspan class=\"isnad\">od El-Evza‘ija, koji je rekao: Pričao mi je Ismail ibn Ubejdullah, rekao je: \u003c/span>Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa je spomenuo isto to. \u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Abdula‘la, rekao je: Pričao nam je El-Mu‘temir ibn Sulejman, od njegova oca, koji je rekao: Pričao mi je Ma‘bed; Enes je pripovijedao \u003c/span>[od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je rekao: Ja i Čas poslani smo kao ova dva,] i sa svoja dva prsta pokazao je: Ovako."},{"id":"14.2","ar":"حَدَّثَنَا ابْنُ الْمُثَنَّى قَالَ: حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي التَّيَّاحِ، عَنْ أَنَسٍ، قَالَ: [قَالَ رَسُولُ الله ص:","bs":"Pričao nam je Ibn el-Musenna, rekao je: Pričao nam je Vehb ibn Džerir, rekao je: Pričao nam je Šu‘ba, od Ebu et-Tejjaha, od Enesa, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je:","ar_ranges":[[0,162]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ الْمُثَنَّى قَالَ: حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي التَّيَّاحِ، عَنْ أَنَسٍ، قَالَ: [قَالَ رَسُولُ الله ص:\u003c/span>","bs_ranges":[[0,146]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn el-Musenna, rekao je: Pričao nam je Vehb ibn Džerir, rekao je: Pričao nam je Šu‘ba, od Ebu et-Tejjaha, od Enesa, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je:"},{"id":"14.3","ar":"بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ:] السَّبَّابَةِ وَالْوُسْطَى قَالَ أَبُو مُوسَى: وَأَشَارَ وَهْبٌ بِالسَّبَّابَةِ وَالْوُسْطَى حَدَّثَنِي عَبْدُ اللَّهِ بْنُ أَبِي زِيَادٍ، قَالَ: حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، قَالَ:","bs":"Ja i Čas poslani smo kao ova dva:] kažiprst i srednji prst. Ebu Musa je rekao: Vehb je pokazao kažiprstom i srednjim prstom. Pričao mi je Abdullah ibn Ebi Zijad, rekao je: Pričao nam je Vehb ibn Džerir, rekao je:","ar_ranges":[[135,226]],"ar_html":"بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ:] السَّبَّابَةِ وَالْوُسْطَى قَالَ أَبُو مُوسَى: وَأَشَارَ وَهْبٌ بِالسَّبَّابَةِ وَالْوُسْطَى \u003cspan class=\"isnad\">حَدَّثَنِي عَبْدُ اللَّهِ بْنُ أَبِي زِيَادٍ، قَالَ: حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، قَالَ:\u003c/span>","bs_ranges":[[125,212]],"bs_html":"Ja i Čas poslani smo kao ova dva:] kažiprst i srednji prst. Ebu Musa je rekao: Vehb je pokazao kažiprstom i srednjim prstom. \u003cspan class=\"isnad\">Pričao mi je Abdullah ibn Ebi Zijad, rekao je: Pričao nam je Vehb ibn Džerir, rekao je:\u003c/span>"},{"id":"14.4","ar":"حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي التَّيَّاحِ وَقَتَادَةَ، عَنْ أَنَسٍ، قَالَ: [قَالَ رسول الله ص: بعثت انا وَالسَّاعَةَ كَهَاتَيْنِ،] وَقَرَنَ بَيْنَ إِصْبَعَيْهِ.","bs":"Pričao nam je Šu‘ba, od Ebu et-Tejjaha i Katade, od Enesa, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva,] i primakao je svoja dva prsta jedan drugome.","ar_ranges":[[0,97]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي التَّيَّاحِ وَقَتَادَةَ، عَنْ أَنَسٍ، قَالَ: [قَالَ رسول الله ص: \u003c/span>بعثت انا وَالسَّاعَةَ كَهَاتَيْنِ،] وَقَرَنَ بَيْنَ إِصْبَعَيْهِ.","bs_ranges":[[0,74]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Šu‘ba, od Ebu et-Tejjaha i Katade, od Enesa, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva,] i primakao je svoja dva prsta jedan drugome."},{"id":"14.5","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ بَزِيعٍ، قَالَ: حَدَّثَنَا الفضيل بن سليمان، حَدَّثَنَا أَبُو حَازِمٍ، قَالَ: حَدَّثَنَا سَهْلُ بْنُ سعد، قال: [رايت رسول الله ص قَالَ بِإِصْبَعَيْهِ هَكَذَا، الْوُسْطَى وَالَّتِي تَلِي الإِبْهَامَ: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .","bs":"Pričao mi je Muhammed ibn Abdullah ibn Bezi‘, rekao je: Pričao nam je El-Fudajl ibn Sulejman; pričao nam je Ebu Hazim, rekao je: Pričao nam je Sehl ibn Sa‘d, rekao je: [Vidio sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako sa svoja dva prsta, srednjim i onim do palca, pokazuje ovako: Ja i Čas poslani smo kao ova dva.]","ar_ranges":[[0,157]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ بَزِيعٍ، قَالَ: حَدَّثَنَا الفضيل بن سليمان، حَدَّثَنَا أَبُو حَازِمٍ، قَالَ: حَدَّثَنَا سَهْلُ بْنُ سعد، قال: \u003c/span>[رايت رسول الله ص قَالَ بِإِصْبَعَيْهِ هَكَذَا، الْوُسْطَى وَالَّتِي تَلِي الإِبْهَامَ: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .","bs_ranges":[[0,168]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Abdullah ibn Bezi‘, rekao je: Pričao nam je El-Fudajl ibn Sulejman; pričao nam je Ebu Hazim, rekao je: Pričao nam je Sehl ibn Sa‘d, rekao je: \u003c/span>[Vidio sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako sa svoja dva prsta, srednjim i onim do palca, pokazuje ovako: Ja i Čas poslani smo kao ova dva.]"},{"id":"14.6","ar":"حَدَّثَنَا مُحَمَّدُ بْنُ يَزِيدَ الأَدَمِيُّ، قَالَ: حَدَّثَنَا أَبُو ضَمْرَةَ، عَنْ أَبِي حَازِمٍ، عَنْ [سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ ان رسول الله ص قَالَ: بُعِثْتُ وَالسَّاعَةَ كَهَاتَيْنِ- وَضَمَّ بَيْنَ إِصْبَعَيْهِ الْوُسْطَى، وَالَّتِي تَلِي الإِبْهَامَ- وَقَالَ: مَا مَثَلِي وَمَثَلُ السَّاعَةِ إِلا كَفَرَسَيْ رِهَانٍ، ثُمَّ قَالَ: مَا مَثَلِي وَمَثَلُ السَّاعَةِ إِلا كَمَثَلِ رَجُلٍ بَعَثَهُ قَوْمٌ طَلِيعَةً، فَلَمَّا خَشِيَ أَنْ يُسْبَقُ أَلاحَ بِثَوْبِهِ: أُتِيتُمْ، أُتِيتُمْ، أَنَا ذَاكَ أَنَا ذَاكَ] .","bs":"Pričao nam je Muhammed ibn Jezid el-Ademi, rekao je: Pričao nam je Ebu Damra, od Ebu Hazima, od [Sehla ibn Sa‘da es-Sa‘idija, da je Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao: Poslan sam i Čas kao ova dva — i primakao je svoja dva prsta, srednji i onaj do palca — i rekao: Moj primjer i primjer Časa jesu samo poput dva trkaća konja. Zatim je rekao: Moj primjer i primjer Časa jesu samo kao primjer čovjeka kojeg je njegov narod poslao kao izvidnika, pa je, kada se pobojao da će biti preteknut, zamahao svojom odjećom: Napadnuti ste! Napadnuti ste! Ja sam taj! Ja sam taj!]","ar_ranges":[[0,140]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ يَزِيدَ الأَدَمِيُّ، قَالَ: حَدَّثَنَا أَبُو ضَمْرَةَ، عَنْ أَبِي حَازِمٍ، عَنْ [سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ \u003c/span>ان رسول الله ص قَالَ: بُعِثْتُ وَالسَّاعَةَ كَهَاتَيْنِ- وَضَمَّ بَيْنَ إِصْبَعَيْهِ الْوُسْطَى، وَالَّتِي تَلِي الإِبْهَامَ- وَقَالَ: مَا مَثَلِي وَمَثَلُ السَّاعَةِ إِلا كَفَرَسَيْ رِهَانٍ، ثُمَّ قَالَ: مَا مَثَلِي وَمَثَلُ السَّاعَةِ إِلا كَمَثَلِ رَجُلٍ بَعَثَهُ قَوْمٌ طَلِيعَةً، فَلَمَّا خَشِيَ أَنْ يُسْبَقُ أَلاحَ بِثَوْبِهِ: أُتِيتُمْ، أُتِيتُمْ، أَنَا ذَاكَ أَنَا ذَاكَ] .","bs_ranges":[[0,96]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Jezid el-Ademi, rekao je: Pričao nam je Ebu Damra, od Ebu Hazima, od \u003c/span>[Sehla ibn Sa‘da es-Sa‘idija, da je Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao: Poslan sam i Čas kao ova dva — i primakao je svoja dva prsta, srednji i onaj do palca — i rekao: Moj primjer i primjer Časa jesu samo poput dva trkaća konja. Zatim je rekao: Moj primjer i primjer Časa jesu samo kao primjer čovjeka kojeg je njegov narod poslao kao izvidnika, pa je, kada se pobojao da će biti preteknut, zamahao svojom odjećom: Napadnuti ste! Napadnuti ste! Ja sam taj! Ja sam taj!]"},{"id":"14.7","ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا خَالِدٌ، عَنْ مُحَمَّدِ بْنِ جَعْفَرٍ، عَنْ أَبِي حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رَسُولُ الله ص:","bs":"Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Halid, od Muhammeda ibn Džafera, od Ebu Hazima, od Sehla ibn Sa‘da, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je:","ar_ranges":[[0,158]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا خَالِدٌ، عَنْ مُحَمَّدِ بْنِ جَعْفَرٍ، عَنْ أَبِي حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رَسُولُ الله ص:\u003c/span>","bs_ranges":[[0,133]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Halid, od Muhammeda ibn Džafera, od Ebu Hazima, od Sehla ibn Sa‘da, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je:"},{"id":"14.8","ar":"بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَجَمَعَ بَيْنَ إِصْبَعَيْهِ","bs":"Ja i Čas poslani smo kao ova dva,] i sastavio je svoja dva prsta.","ar_ranges":[],"ar_html":"بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَجَمَعَ بَيْنَ إِصْبَعَيْهِ","bs_ranges":[],"bs_html":"Ja i Čas poslani smo kao ova dva,] i sastavio je svoja dva prsta."}],"notes":[]},{"n":15,"ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا خَالِدٌ، قَالَ: حَدَّثَنَا سُلَيْمَانُ بْنُ بِلالٍ، قَالَ: حَدَّثَنِي أَبُو حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رسول الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ هَكَذَا،] وَقَرَنَ بَيْنَ إِصْبَعَيْهِ: الْوُسْطَى وَالَّتِي تَلِي الإِبْهَامَ.\n\nحَدَّثَنِي ابْنُ عَبْدِ الرحيم البرقي، عن سهل بن سعد، قَالَ: حَدَّثَنَا ابْنُ أَبِي مَرْيَمَ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ: حَدَّثَنِي أَبُو حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رَسُولُ الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَجَمَعَ بَيْنَ إِصْبَعَيْهِ.\n\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، عَنْ بَشِيرِ بْنِ الْمُهَاجِرِ، قَالَ: حَدَّثَنِي عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ: [سَمِعْتُ رسول الله ص يَقُولُ: بُعِثْتُ أَنَا وَالسَّاعَةَ جَمِيعًا، إِنْ كَادَتْ لِتَسْبِقَنِي] .\n\nحَدَّثَنِي مُحَمَّدُ بْنُ عُمَرَ بْنِ هَيَّاجٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ عَبْدِ الرَّحْمَنِ، قَالَ: حَدَّثَنِي عُبَيْدَةُ بْنُ الأَسْوَدِ، عَنْ مُجَالِدٍ، عَنْ قَيْسِ بْنِ أَبِي حَازِمٍ، عَنِ الْمُسْتَوْرِدِ بْنِ شداد الفهري، [عن النبي ص أَنَّهُ قَالَ: بُعِثْتُ فِي نَفْسِ السَّاعَةِ، سَبَقْتُهَا كَمَا سَبَقَتْ هَذِهِ هَذِهِ،] لإِصْبَعَيْهِ السَّبَّابَةِ وَالْوُسْطَى، وَوَصَفَ لَنَا أَبُو عَبْدِ اللَّهِ، وَجَمَعَهُمَا.\n\nحَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدِ بْنِ حَبِيبٍ، قَالَ: حَدَّثَنَا أَبُو نَصْرٍ، قَالَ:\n\nحَدَّثَنَا الْمَسْعُودِيُّ، عَنْ إِسْمَاعِيلَ بْنِ أَبِي خَالِدٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي جبيرة، قال: [قال رسول الله ص: بُعِثْتُ مَعَ السَّاعَةِ كَهَاتَيْنِ، - وَأَشَارَ بِإِصْبَعَيْهِ الْوُسْطَى وَالسَّبَّابَةِ- كَفَضْلِ هَذِهِ عَلَى هَذِهِ] .\n\nحَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، قَالَ: أَخْبَرَنَا يَزِيدُ، قَالَ: أَخْبَرَنَا إِسْمَاعِيلُ، عَنْ شُبَيْلِ بْنِ عَوْفٍ، عَنْ أَبِي جُبَيْرَةَ، عَنْ أَشْيَاخٍ مِنَ الأَنْصَارِ، قَالُوا:","bs":"\u003cp data-paragraph=\"15.1\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Halid, rekao je: Pričao nam je Sulejman ibn Bilal, rekao je: Pričao mi je Ebu Hazim, od Sehla ibn Sa‘da, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo ovako,] i primakao je svoja dva prsta: srednji i onaj do palca.\u003c/p>\u003cp data-paragraph=\"15.2\">Pričao mi je Ibn Abdurrahim el-Berki, od Sehla ibn Sa‘da, rekao je: Pričao nam je Ibn Ebi Merjem, rekao je: Pričao nam je Muhammed ibn Džafer, rekao je: Pričao mi je Ebu Hazim, od Sehla ibn Sa‘da, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva,] i sastavio je svoja dva prsta. ⟦Napomena prevodioca: ponovljeno ime Sehla ibn Sa‘da u lancu zadržano je kako stoji u prijepisu.⟧\u003c/p>\u003cp data-paragraph=\"15.3\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Ebu Nuajm, od Bešira ibn el-Muhadžira, koji je rekao: Pričao mi je Abdullah ibn Burejda, od njegova oca, koji je rekao: [Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Ja i Čas poslani smo zajedno; gotovo da me je pretekao.]\u003c/p>\u003cp data-paragraph=\"15.4\">Pričao mi je Muhammed ibn Omer ibn Hejjadž, rekao je: Pričao nam je Jahja ibn Abdurrahman, rekao je: Pričao mi je Ubejda ibn el-Esved, od Mudžalida, od Kajsa ibn Ebi Hazima, od El-Mustevrida ibn Šeddada el-Fihrija, [od Vjerovjesnika, neka mu Allah podari blagoslov i mir, da je rekao: Poslan sam pri samom dahu Časa; pretekao sam ga kao što je ovaj pretekao ovaj,] misleći na svoja dva prsta, kažiprst i srednji prst. Ebu Abdullah nam je to pokazao i sastavio ih.\u003c/p>\u003cp data-paragraph=\"15.5\">Pričao mi je Ahmed ibn Muhammed ibn Habib, rekao je: Pričao nam je Ebu Nasr, rekao je:\u003c/p>\u003cp data-paragraph=\"15.6\">Pričao nam je El-Mes‘udi, od Ismaila ibn Ebi Halida, od Eš-Ša‘bija, od Ebu Džubejre, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Poslan sam s Časom kao ova dva — i pokazao je sa svoja dva prsta, srednjim i kažiprstom — poput razlike za koju je ovaj duži od ovoga.]\u003c/p>\u003cp data-paragraph=\"15.7\">Pričao nam je Temim ibn el-Muntasir, rekao je: Obavijestio nas je Jezid, rekao je: Obavijestio nas je Ismail, od Šubejla ibn Avfa, od Ebu Džubejre, od starješina među ensarijama, koji su rekli:\u003c/p>","paragraphs":[{"id":"15.1","ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا خَالِدٌ، قَالَ: حَدَّثَنَا سُلَيْمَانُ بْنُ بِلالٍ، قَالَ: حَدَّثَنِي أَبُو حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رسول الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ هَكَذَا،] وَقَرَنَ بَيْنَ إِصْبَعَيْهِ: الْوُسْطَى وَالَّتِي تَلِي الإِبْهَامَ.","bs":"Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Halid, rekao je: Pričao nam je Sulejman ibn Bilal, rekao je: Pričao mi je Ebu Hazim, od Sehla ibn Sa‘da, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo ovako,] i primakao je svoja dva prsta: srednji i onaj do palca.","ar_ranges":[[0,182]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا خَالِدٌ، قَالَ: حَدَّثَنَا سُلَيْمَانُ بْنُ بِلالٍ، قَالَ: حَدَّثَنِي أَبُو حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رسول الله ص: \u003c/span>بُعِثْتُ أَنَا وَالسَّاعَةَ هَكَذَا،] وَقَرَنَ بَيْنَ إِصْبَعَيْهِ: الْوُسْطَى وَالَّتِي تَلِي الإِبْهَامَ.","bs_ranges":[[0,170]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Halid, rekao je: Pričao nam je Sulejman ibn Bilal, rekao je: Pričao mi je Ebu Hazim, od Sehla ibn Sa‘da, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo ovako,] i primakao je svoja dva prsta: srednji i onaj do palca."},{"id":"15.2","ar":"حَدَّثَنِي ابْنُ عَبْدِ الرحيم البرقي، عن سهل بن سعد، قَالَ: حَدَّثَنَا ابْنُ أَبِي مَرْيَمَ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ: حَدَّثَنِي أَبُو حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رَسُولُ الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَجَمَعَ بَيْنَ إِصْبَعَيْهِ.","bs":"Pričao mi je Ibn Abdurrahim el-Berki, od Sehla ibn Sa‘da, rekao je: Pričao nam je Ibn Ebi Merjem, rekao je: Pričao nam je Muhammed ibn Džafer, rekao je: Pričao mi je Ebu Hazim, od Sehla ibn Sa‘da, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva,] i sastavio je svoja dva prsta. ⟦Napomena prevodioca: ponovljeno ime Sehla ibn Sa‘da u lancu zadržano je kako stoji u prijepisu.⟧","ar_ranges":[[0,225]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي ابْنُ عَبْدِ الرحيم البرقي، عن سهل بن سعد، قَالَ: حَدَّثَنَا ابْنُ أَبِي مَرْيَمَ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ: حَدَّثَنِي أَبُو حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رَسُولُ الله ص: \u003c/span>بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَجَمَعَ بَيْنَ إِصْبَعَيْهِ.","bs_ranges":[[0,212]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ibn Abdurrahim el-Berki, od Sehla ibn Sa‘da, rekao je: Pričao nam je Ibn Ebi Merjem, rekao je: Pričao nam je Muhammed ibn Džafer, rekao je: Pričao mi je Ebu Hazim, od Sehla ibn Sa‘da, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva,] i sastavio je svoja dva prsta. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: ponovljeno ime Sehla ibn Sa‘da u lancu zadržano je kako stoji u prijepisu.⟧\u003c/span>"},{"id":"15.3","ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، عَنْ بَشِيرِ بْنِ الْمُهَاجِرِ، قَالَ: حَدَّثَنِي عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ: [سَمِعْتُ رسول الله ص يَقُولُ: بُعِثْتُ أَنَا وَالسَّاعَةَ جَمِيعًا، إِنْ كَادَتْ لِتَسْبِقَنِي] .","bs":"Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Ebu Nuajm, od Bešira ibn el-Muhadžira, koji je rekao: Pričao mi je Abdullah ibn Burejda, od njegova oca, koji je rekao: [Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Ja i Čas poslani smo zajedno; gotovo da me je pretekao.]","ar_ranges":[[0,195]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، عَنْ بَشِيرِ بْنِ الْمُهَاجِرِ، قَالَ: حَدَّثَنِي عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ: [سَمِعْتُ رسول الله ص يَقُولُ: \u003c/span>بُعِثْتُ أَنَا وَالسَّاعَةَ جَمِيعًا، إِنْ كَادَتْ لِتَسْبِقَنِي] .","bs_ranges":[[0,170],[171,250]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Ebu Nuajm, od Bešira ibn el-Muhadžira, koji je rekao: Pričao mi je Abdullah ibn Burejda, od njegova oca, koji je rekao: \u003c/span>[\u003cspan class=\"isnad\">Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: \u003c/span>Ja i Čas poslani smo zajedno; gotovo da me je pretekao.]"},{"id":"15.4","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ عُمَرَ بْنِ هَيَّاجٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ عَبْدِ الرَّحْمَنِ، قَالَ: حَدَّثَنِي عُبَيْدَةُ بْنُ الأَسْوَدِ، عَنْ مُجَالِدٍ، عَنْ قَيْسِ بْنِ أَبِي حَازِمٍ، عَنِ الْمُسْتَوْرِدِ بْنِ شداد الفهري، [عن النبي ص أَنَّهُ قَالَ: بُعِثْتُ فِي نَفْسِ السَّاعَةِ، سَبَقْتُهَا كَمَا سَبَقَتْ هَذِهِ هَذِهِ،] لإِصْبَعَيْهِ السَّبَّابَةِ وَالْوُسْطَى، وَوَصَفَ لَنَا أَبُو عَبْدِ اللَّهِ، وَجَمَعَهُمَا.","bs":"Pričao mi je Muhammed ibn Omer ibn Hejjadž, rekao je: Pričao nam je Jahja ibn Abdurrahman, rekao je: Pričao mi je Ubejda ibn el-Esved, od Mudžalida, od Kajsa ibn Ebi Hazima, od El-Mustevrida ibn Šeddada el-Fihrija, [od Vjerovjesnika, neka mu Allah podari blagoslov i mir, da je rekao: Poslan sam pri samom dahu Časa; pretekao sam ga kao što je ovaj pretekao ovaj,] misleći na svoja dva prsta, kažiprst i srednji prst. Ebu Abdullah nam je to pokazao i sastavio ih.","ar_ranges":[[0,244]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ عُمَرَ بْنِ هَيَّاجٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ عَبْدِ الرَّحْمَنِ، قَالَ: حَدَّثَنِي عُبَيْدَةُ بْنُ الأَسْوَدِ، عَنْ مُجَالِدٍ، عَنْ قَيْسِ بْنِ أَبِي حَازِمٍ، عَنِ الْمُسْتَوْرِدِ بْنِ شداد الفهري، [عن النبي ص \u003c/span>أَنَّهُ قَالَ: بُعِثْتُ فِي نَفْسِ السَّاعَةِ، سَبَقْتُهَا كَمَا سَبَقَتْ هَذِهِ هَذِهِ،] لإِصْبَعَيْهِ السَّبَّابَةِ وَالْوُسْطَى، وَوَصَفَ لَنَا أَبُو عَبْدِ اللَّهِ، وَجَمَعَهُمَا.","bs_ranges":[[0,215]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Omer ibn Hejjadž, rekao je: Pričao nam je Jahja ibn Abdurrahman, rekao je: Pričao mi je Ubejda ibn el-Esved, od Mudžalida, od Kajsa ibn Ebi Hazima, od El-Mustevrida ibn Šeddada el-Fihrija, \u003c/span>[od Vjerovjesnika, neka mu Allah podari blagoslov i mir, da je rekao: Poslan sam pri samom dahu Časa; pretekao sam ga kao što je ovaj pretekao ovaj,] misleći na svoja dva prsta, kažiprst i srednji prst. Ebu Abdullah nam je to pokazao i sastavio ih."},{"id":"15.5","ar":"حَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدِ بْنِ حَبِيبٍ، قَالَ: حَدَّثَنَا أَبُو نَصْرٍ، قَالَ:","bs":"Pričao mi je Ahmed ibn Muhammed ibn Habib, rekao je: Pričao nam je Ebu Nasr, rekao je:","ar_ranges":[[0,87]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدِ بْنِ حَبِيبٍ، قَالَ: حَدَّثَنَا أَبُو نَصْرٍ، قَالَ:\u003c/span>","bs_ranges":[[0,86]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ahmed ibn Muhammed ibn Habib, rekao je: Pričao nam je Ebu Nasr, rekao je:\u003c/span>"},{"id":"15.6","ar":"حَدَّثَنَا الْمَسْعُودِيُّ، عَنْ إِسْمَاعِيلَ بْنِ أَبِي خَالِدٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي جبيرة، قال: [قال رسول الله ص: بُعِثْتُ مَعَ السَّاعَةِ كَهَاتَيْنِ، - وَأَشَارَ بِإِصْبَعَيْهِ الْوُسْطَى وَالسَّبَّابَةِ- كَفَضْلِ هَذِهِ عَلَى هَذِهِ] .","bs":"Pričao nam je El-Mes‘udi, od Ismaila ibn Ebi Halida, od Eš-Ša‘bija, od Ebu Džubejre, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Poslan sam s Časom kao ova dva — i pokazao je sa svoja dva prsta, srednjim i kažiprstom — poput razlike za koju je ovaj duži od ovoga.]","ar_ranges":[[0,126]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا الْمَسْعُودِيُّ، عَنْ إِسْمَاعِيلَ بْنِ أَبِي خَالِدٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي جبيرة، قال: [قال رسول الله ص: \u003c/span>بُعِثْتُ مَعَ السَّاعَةِ كَهَاتَيْنِ، - وَأَشَارَ بِإِصْبَعَيْهِ الْوُسْطَى وَالسَّبَّابَةِ- كَفَضْلِ هَذِهِ عَلَى هَذِهِ] .","bs_ranges":[[0,100]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je El-Mes‘udi, od Ismaila ibn Ebi Halida, od Eš-Ša‘bija, od Ebu Džubejre, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Poslan sam s Časom kao ova dva — i pokazao je sa svoja dva prsta, srednjim i kažiprstom — poput razlike za koju je ovaj duži od ovoga.]"},{"id":"15.7","ar":"حَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، قَالَ: أَخْبَرَنَا يَزِيدُ، قَالَ: أَخْبَرَنَا إِسْمَاعِيلُ، عَنْ شُبَيْلِ بْنِ عَوْفٍ، عَنْ أَبِي جُبَيْرَةَ، عَنْ أَشْيَاخٍ مِنَ الأَنْصَارِ، قَالُوا:","bs":"Pričao nam je Temim ibn el-Muntasir, rekao je: Obavijestio nas je Jezid, rekao je: Obavijestio nas je Ismail, od Šubejla ibn Avfa, od Ebu Džubejre, od starješina među ensarijama, koji su rekli:","ar_ranges":[[0,191]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، قَالَ: أَخْبَرَنَا يَزِيدُ، قَالَ: أَخْبَرَنَا إِسْمَاعِيلُ، عَنْ شُبَيْلِ بْنِ عَوْفٍ، عَنْ أَبِي جُبَيْرَةَ، عَنْ أَشْيَاخٍ مِنَ الأَنْصَارِ، قَالُوا:\u003c/span>","bs_ranges":[[0,193]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Temim ibn el-Muntasir, rekao je: Obavijestio nas je Jezid, rekao je: Obavijestio nas je Ismail, od Šubejla ibn Avfa, od Ebu Džubejre, od starješina među ensarijama, koji su rekli:\u003c/span>"}],"notes":[]},{"n":16,"ar":"[سمعنا رسول الله ص يَقُولُ: جِئْتُ أَنَا وَالسَّاعَةَ هَكَذَا]- قَالَ الطَّبَرِيُّ: وَأَرَانَا تَمِيمٌ، وَضَمَّ السَّبَّابَةَ وَالْوُسْطَى وَقَالَ لَنَا: أَشَارَ يَزِيدُ بِإِصْبَعَيْهِ السَّبَّابَةِ وَالْوُسْطَى وَضَمَّهُمَا-[وَقَالَ: سَبَقْتُهَا كَمَا سَبَقَتْ هَذِهِ هَذِهِ فِي نَفْسِ من الساعة، او في نَفْسَ السَّاعَةِ] .\n\nفمعلوم إذ كان اليوم أوله طلوع الفجر وآخره غروب الشمس، وكان صحيحا عن نبينا ص، ما رويناه عنه قبل، أنه قال بعد ما صلى العصر: ما بقي من الدنيا فِيمَا مَضَى مِنْهَا إِلا كَمَا بَقِيَ مِنْ يومكم هذا فيما مضى منه.\n\nوأنه قال لأصحابه: بعثت أنا والساعة كهاتين- وجمع بين السبابة والوسطى- سبقتها بقدر هذه من هذه، يعني الوسطى من السبابة وكان قدر ما بين اوسط اوقات صلاه العصر- وذلك إذا صار ظل كل شيء مثليه- على التحري إنما يكون قدر نصف سبع اليوم، يزيد قليلا أو ينقص قليلا، وكذلك فضل ما بين الوسطى والسبابة، إنما يكون نحوا من ذلك وقريبا منه.\n\nوكان صحيحا مع ذلك عن رسول الله ص ما حَدَّثَنِي أَحْمَدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ وَهْبٍ، قَالَ: حَدَّثَنِي عَمِّي عَبْدُ اللَّهِ بْنُ وَهْبٍ، قَالَ:\n\nحَدَّثَنِي مُعَاوِيَةُ بْنُ صَالِحٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ جُبَيْرِ بْنِ نُفَيْرٍ، أَنَّهُ سَمِعَ أَبَا ثعلبه الخشني صاحب النبي ص يقول: [ان رسول الله ص قَالَ: لَنْ يُعْجِزَ اللَّهُ هَذِهِ الأُمَّةَ مِنْ نصف يوم،] وكان معنى قول النبي ذلك أن لن يعجز الله هذه الأمة من نصف يوم الذي مقداره ألف سنة- كان بينا أن أولى القولين- اللذين ذكرت في مبلغ قدر مدة جميع الزمان، اللذين أحدهما عن ابن عباس، والآخر منهما عن كعب- بالصواب، وأشبههما بما دلت عليه الأخبار الوارده عن رسول الله ص قول ابن عباس، الذي روينا عنه أنه قال: الدنيا جمعة من جمع الآخرة سبعة آلاف سنه","bs":"\u003cp data-paragraph=\"16.1\">[Čuli smo Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Došao sam ja i Čas ovako] — Et-Taberi je rekao: Temim nam je pokazao i primakao kažiprst i srednji prst, i rekao nam je: Jezid je pokazao svojim dvama prstima, kažiprstom i srednjim prstom, i primakao ih — [i rekao: Pretekao sam ga kao što je ovaj pretekao ovaj, pri jednom dahu Časa, ili pri samom dahu Časa.]\u003c/p>\u003cp data-paragraph=\"16.2\">Poznato je, budući da dan počinje izlaskom zore, a završava zalaskom Sunca, i budući da je vjerodostojno preneseno od našega Vjerovjesnika, neka mu Allah podari blagoslov i mir, ono što smo ranije od njega prenijeli: da je, nakon što je klanjao ikindiju, rekao: Od ovoga svijeta u odnosu na ono što je od njega prošlo ostalo je samo kao ono što je ostalo od ovoga vašeg dana u odnosu na ono što je od njega prošlo.\u003c/p>\u003cp data-paragraph=\"16.3\">I da je svojim ashabima rekao: Ja i Čas poslani smo kao ova dva — i sastavio je kažiprst i srednji prst — pretekao sam ga za razliku ovoga u odnosu na ovaj, misleći na srednji prst u odnosu na kažiprst. A mjera vremena između sredine ikindijskog vremena — to je kada sjenka svake stvari postane dvostruka — ⟦Napomena prevodioca: završna tačka ovog vremenskog raspona nije izričito navedena u dostupnoj rečenici.⟧, prema približnoj procjeni, iznosi samo polovinu sedmine dana, malo više ili malo manje. Također, razlika između srednjeg prsta i kažiprsta iznosi otprilike toliko i blizu tome.\u003c/p>\u003cp data-paragraph=\"16.4\">A uz to je vjerodostojno preneseno od Allahova Poslanika, neka mu Allah podari blagoslov i mir, ono što mi je pričao Ahmed ibn Abdurrahman ibn Vehb, rekao je: Pričao mi je moj amidža Abdullah ibn Vehb, rekao je:\u003c/p>\u003cp data-paragraph=\"16.5\">Pričao mi je Muavija ibn Salih, od Abdurrahmana ibn Džubejra ibn Nufejra, od njegova oca Džubejra ibn Nufejra, da je čuo Ebu Sa‘lebu el-Hušenija, ashaba Vjerovjesnika, neka mu Allah podari blagoslov i mir, kako govori: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Allah neće ovu zajednicu učiniti nemoćnom za polovinu dana.] A značenje tih Vjerovjesnikovih riječi bilo je da Allah ovu zajednicu neće učiniti nemoćnom za polovinu dana čije trajanje iznosi hiljadu godina. ⟦Napomena prevodioca: konstrukcija „لن يعجز الله هذه الأمة“ prenesena je doslovno; njeno značenje zahtijeva jezičku provjeru, bez prešutnog prepravljanja.⟧ Bilo je, dakle, jasno da je od dvaju stavova koje sam spomenuo o ukupnom trajanju svega vremena — jednoga prenesenog od Ibn Abbasa, a drugoga od Ka‘ba — ispravnosti bliži i vijestima prenesenim od Allahova Poslanika, neka mu Allah podari blagoslov i mir, sličniji stav Ibn Abbasa, od kojeg smo prenijeli da je rekao: Ovaj svijet je jedna sedmica među sedmicama onoga svijeta, sedam hiljada godina.\u003c/p>","paragraphs":[{"id":"16.1","ar":"[سمعنا رسول الله ص يَقُولُ: جِئْتُ أَنَا وَالسَّاعَةَ هَكَذَا]- قَالَ الطَّبَرِيُّ: وَأَرَانَا تَمِيمٌ، وَضَمَّ السَّبَّابَةَ وَالْوُسْطَى وَقَالَ لَنَا: أَشَارَ يَزِيدُ بِإِصْبَعَيْهِ السَّبَّابَةِ وَالْوُسْطَى وَضَمَّهُمَا-[وَقَالَ: سَبَقْتُهَا كَمَا سَبَقَتْ هَذِهِ هَذِهِ فِي نَفْسِ من الساعة، او في نَفْسَ السَّاعَةِ] .","bs":"[Čuli smo Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Došao sam ja i Čas ovako] — Et-Taberi je rekao: Temim nam je pokazao i primakao kažiprst i srednji prst, i rekao nam je: Jezid je pokazao svojim dvama prstima, kažiprstom i srednjim prstom, i primakao ih — [i rekao: Pretekao sam ga kao što je ovaj pretekao ovaj, pri jednom dahu Časa, ili pri samom dahu Časa.]","ar_ranges":[],"ar_html":"[سمعنا رسول الله ص يَقُولُ: جِئْتُ أَنَا وَالسَّاعَةَ هَكَذَا]- قَالَ الطَّبَرِيُّ: وَأَرَانَا تَمِيمٌ، وَضَمَّ السَّبَّابَةَ وَالْوُسْطَى وَقَالَ لَنَا: أَشَارَ يَزِيدُ بِإِصْبَعَيْهِ السَّبَّابَةِ وَالْوُسْطَى وَضَمَّهُمَا-[وَقَالَ: سَبَقْتُهَا كَمَا سَبَقَتْ هَذِهِ هَذِهِ فِي نَفْسِ من الساعة، او في نَفْسَ السَّاعَةِ] .","bs_ranges":[],"bs_html":"[Čuli smo Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Došao sam ja i Čas ovako] — Et-Taberi je rekao: Temim nam je pokazao i primakao kažiprst i srednji prst, i rekao nam je: Jezid je pokazao svojim dvama prstima, kažiprstom i srednjim prstom, i primakao ih — [i rekao: Pretekao sam ga kao što je ovaj pretekao ovaj, pri jednom dahu Časa, ili pri samom dahu Časa.]"},{"id":"16.2","ar":"فمعلوم إذ كان اليوم أوله طلوع الفجر وآخره غروب الشمس، وكان صحيحا عن نبينا ص، ما رويناه عنه قبل، أنه قال بعد ما صلى العصر: ما بقي من الدنيا فِيمَا مَضَى مِنْهَا إِلا كَمَا بَقِيَ مِنْ يومكم هذا فيما مضى منه.","bs":"Poznato je, budući da dan počinje izlaskom zore, a završava zalaskom Sunca, i budući da je vjerodostojno preneseno od našega Vjerovjesnika, neka mu Allah podari blagoslov i mir, ono što smo ranije od njega prenijeli: da je, nakon što je klanjao ikindiju, rekao: Od ovoga svijeta u odnosu na ono što je od njega prošlo ostalo je samo kao ono što je ostalo od ovoga vašeg dana u odnosu na ono što je od njega prošlo.","ar_ranges":[],"ar_html":"فمعلوم إذ كان اليوم أوله طلوع الفجر وآخره غروب الشمس، وكان صحيحا عن نبينا ص، ما رويناه عنه قبل، أنه قال بعد ما صلى العصر: ما بقي من الدنيا فِيمَا مَضَى مِنْهَا إِلا كَمَا بَقِيَ مِنْ يومكم هذا فيما مضى منه.","bs_ranges":[],"bs_html":"Poznato je, budući da dan počinje izlaskom zore, a završava zalaskom Sunca, i budući da je vjerodostojno preneseno od našega Vjerovjesnika, neka mu Allah podari blagoslov i mir, ono što smo ranije od njega prenijeli: da je, nakon što je klanjao ikindiju, rekao: Od ovoga svijeta u odnosu na ono što je od njega prošlo ostalo je samo kao ono što je ostalo od ovoga vašeg dana u odnosu na ono što je od njega prošlo."},{"id":"16.3","ar":"وأنه قال لأصحابه: بعثت أنا والساعة كهاتين- وجمع بين السبابة والوسطى- سبقتها بقدر هذه من هذه، يعني الوسطى من السبابة وكان قدر ما بين اوسط اوقات صلاه العصر- وذلك إذا صار ظل كل شيء مثليه- على التحري إنما يكون قدر نصف سبع اليوم، يزيد قليلا أو ينقص قليلا، وكذلك فضل ما بين الوسطى والسبابة، إنما يكون نحوا من ذلك وقريبا منه.","bs":"I da je svojim ashabima rekao: Ja i Čas poslani smo kao ova dva — i sastavio je kažiprst i srednji prst — pretekao sam ga za razliku ovoga u odnosu na ovaj, misleći na srednji prst u odnosu na kažiprst. A mjera vremena između sredine ikindijskog vremena — to je kada sjenka svake stvari postane dvostruka — ⟦Napomena prevodioca: završna tačka ovog vremenskog raspona nije izričito navedena u dostupnoj rečenici.⟧, prema približnoj procjeni, iznosi samo polovinu sedmine dana, malo više ili malo manje. Također, razlika između srednjeg prsta i kažiprsta iznosi otprilike toliko i blizu tome.","ar_ranges":[],"ar_html":"وأنه قال لأصحابه: بعثت أنا والساعة كهاتين- وجمع بين السبابة والوسطى- سبقتها بقدر هذه من هذه، يعني الوسطى من السبابة وكان قدر ما بين اوسط اوقا
