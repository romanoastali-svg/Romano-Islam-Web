بعه، ثم قال: «قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ» ، لِمَنْ سَأَلَ قَالَ: وَخَلَقَ يَوْمَ الْخَمِيسِ السَّمَاءَ، وَخَلَقَ يَوْمَ الْجُمُعَةِ النُّجُومَ وَالشَّمْسَ وَالْقَمَرَ وَالْمَلائِكَةَ، إِلَى ثَلاثِ سَاعَاتٍ بَقِيَتْ مِنْهُ، فَخَلَقَ فِي أَوَّلِ سَاعَةٍ مِنْ هَذِهِ الثَّلاثِ السَّاعَاتِ الآجَالَ مَنْ يَحْيَا وَمَنْ يَمُوتُ، وَفِي الثَّانِيَةِ أَلْقَى الآفَةَ عَلَى كُلِّ شَيْءٍ مِمَّا يَنْتَفِعُ بِهِ النَّاسُ، وَفِي الثَّالِثَةِ آدَمَ وَأَسْكَنَهُ الْجَنَّةَ، وَأَمَرَ إِبْلِيسَ بِالسُّجُودِ لَهُ","bs_tekst":"Ako je tako i ako je vjerodostojno od Allahova Poslanika, neka mu Allah podari blagoslov i mir, ono što nam je pričao Hennad ibn es-Serijj, rekao je: Pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa — Hennad je rekao: A ostatak predaje pročitao sam Ebu Bekru — da su Jevreji došli Vjerovjesniku, neka mu Allah podari blagoslov i mir, pa ga upitali o stvaranju nebesa i Zemlje, te je rekao: Allah je Zemlju stvorio u nedjelju i ponedjeljak; planine i koristi koje se nalaze u njima stvorio je u utorak; a u srijedu je stvorio drveće, vodu, gradove, naseljena i razorena mjesta. To su četiri. Zatim je rekao: ⟦Kur’anski navod, prijevod, 41:9–10⟧ „Reci: Zar vi zaista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova. I na njoj je, iznad nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu hranu u četiri dana, jednako za one koji pitaju“ — za onoga ko pita. Rekao je: U četvrtak je stvorio nebo, a u petak zvijezde, Sunce, Mjesec i meleke, do trenutka kada su od njega preostala tri sata. U prvome od ta tri sata stvorio je rokove — ko će živjeti i ko će umrijeti; u drugome je stavio nedaću na sve ono čime se ljudi koriste; a u trećem Adema, nastanio ga u Džennetu i naredio Iblisu da mu učini sedždu"},{"stranica":23,"ar_tekst":"وَأَخْرَجَهُ مِنْهَا فِي آخِرِ سَاعَةٍ ثُمَّ قَالَتِ الْيَهُودُ: ثُمَّ مَاذَا يَا مُحَمَّدُ؟ قَالَ: ثُمَّ اسْتَوَى عَلَى الْعَرْشِ، قَالُوا: قَدْ أَصَبْتَ لَوْ اتممت: قالوا: ثم استراح، فغضب النبي ص غضبا شديدا، فنزل: «وَلَقَدْ خَلَقْنَا السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ وَما مَسَّنا مِنْ لُغُوبٍ فَاصْبِرْ عَلى مَا يَقُولُونَ» .","bs_tekst":"i izveo ga iz njega u posljednjem satu. Zatim su Jevreji rekli: A zatim šta, Muhammede? Rekao je: Zatim se uzvisio nad Prijestoljem. Rekli su: Pogodio si, kada bi dovršio. Rekli su: Zatim se odmorio. Tada se Vjerovjesnik, neka mu Allah podari blagoslov i mir, veoma rasrdio, pa je objavljeno: ⟦Kur’anski navod, prijevod, 50:38–39, dio⟧ „Mi smo zaista stvorili nebesa i Zemlju i ono što je između njih u šest dana i nije Nas dotaknuo nikakav umor. Pa strpljivo podnosi ono što govore.“"},{"stranica":23,"ar_tekst":"حَدَّثَنِي الْقَاسِمُ بْنُ بِشْرِ بْنِ مَعْرُوفٍ وَالْحُسَيْنُ بن علي الصدائي، قالا: حدثنا حجاج، قال: قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مولى أم سلمة، عن أبي هريرة قال: [أخذ رسول الله ص بِيَدِي فَقَالَ: خَلَقَ اللَّهُ التُّرْبَةَ يَوْمَ السَّبْتِ، وَخَلَقَ فِيهَا الْجِبَالَ يَوْمَ الأَحَدِ، وَخَلَقَ الشَّجَرَ يَوْمَ الاثْنَيْنِ، وَخَلَقَ الْمَكْرُوهَ يَوْمَ الثُّلاثَاءِ، وَخَلَقَ النُّورَ يَوْمَ الأَرْبِعَاءِ، وَبَثَّ فِيهَا الدَّوَابَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ بَعْدَ الْعَصْرِ مِنْ يَوْمِ الْجُمُعَةِ، آخِرَ خَلْقٍ خُلِقَ، فِي آخِرِ سَاعَةٍ مِنْ سَاعَاتِ الْجُمُعَةِ، فِيمَا بَيْنَ الْعَصْرِ إِلَى اللَّيْلِ] .","bs_tekst":"Pričali su mi El-Kasim ibn Bišr ibn Ma‘ruf i El-Husejn ibn Ali es-Suda‘i; rekli su: Pričao nam je Hadždžadž, rekao je: Ibn Džurejdž je rekao: Obavijestio me je Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafi‘a, oslobođenika Umm Seleme, od Ebu Hurejre, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, uzeo me je za ruku, pa rekao: Allah je tlo stvorio u subotu, a planine na njemu stvorio je u nedjelju. Drveće je stvorio u ponedjeljak, ono što je neugodno stvorio je u utorak, svjetlost je stvorio u srijedu, životinje je po njemu rasprostro u četvrtak, a Adema je stvorio poslije ikindije u petak, kao posljednje stvorenje koje je stvoreno, u posljednjem od sati petka, između ikindije i noći.]"},{"stranica":23,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ بزيع، قال: حدثنا الفضيل بْنُ سُلَيْمَانَ، حَدَّثَنِي مُحَمَّدُ بْنُ زَيْدٍ، قَالَ: حَدَّثَنِي أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ، قَالَ:","bs_tekst":"Pričao nam je Muhammed ibn Abdullah ibn Bezi‘, rekao je: Pričao nam je El-Fudajl ibn Sulejman; pričao mi je Muhammed ibn Zejd, rekao je: Pričao mi je Ebu Selema ibn Abdurrahman ibn Avf, rekao je:"},{"stranica":23,"ar_tekst":"أَخْبَرَنِي ابْنُ سَلامٍ وَأَبُو هُرَيْرَةَ، فذكرا عن النبي ص السَّاعَةَ الَّتِي فِي يَوْمِ الْجُمُعَةِ، وَذَكَرَا أَنَّهُ قَالَهَا، قَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: أَنَا أَعْلَمُ أَيَّ سَاعَةٍ هِيَ، بَدَأَ اللَّهُ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ يَوْمَ الأَحَدِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ، فَهِيَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ.","bs_tekst":"Obavijestili su me Ibn Selam i Ebu Hurejra, pa su od Vjerovjesnika, neka mu Allah podari blagoslov i mir, spomenuli sat koji se nalazi u petku i spomenuli da je o njemu govorio. Abdullah ibn Selam je rekao: Ja znam koji je to sat. Allah je stvaranje nebesa i Zemlje započeo u nedjelju, a završio u posljednjem satu petka. Zato je on u posljednjem satu petka."},{"stranica":23,"ar_tekst":"حَدَّثَنِي الْمُثَنَّى، قال: حدثنا الحجاج، حَدَّثَنَا حَمَّادٌ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ عكرمه: [ان اليهود قالوا للنبي ص: ما يوم الأحد؟ فقال رسول","bs_tekst":"Pričao mi je El-Musenna, rekao je: Pričao nam je El-Hadždžadž; pričao nam je Hammad, od Ataa ibn es-Saiba, od Ikrime: [Jevreji su rekli Vjerovjesniku, neka mu Allah podari blagoslov i mir: Šta je nedjelja? Pa je Allahov Poslanik,"},{"stranica":24,"ar_tekst":"الله ص: خلق الله فيه الارض وبسطها، قالوا: فالاثنين؟ قال: خلق الله فِيهِ آدَمَ، قَالُوا: فَالثُّلاثَاءِ؟ قَالَ: خَلَقَ فِيهِ الْجِبَالَ وَالْمَاءَ وَكَذَا وَكَذَا وَمَا شَاءَ اللَّهُ، قَالُوا: فَيَوْمُ الأَرْبِعَاءِ؟ قَالَ: الأَقْوَاتَ، قَالُوا: فَيَوْمُ الْخَمِيسِ؟ قَالَ: خَلَقَ السَّمَوَاتِ، قَالُوا: فَيَوْمُ الْجُمُعَةِ؟ قَالَ: خَلَقَ اللَّهُ فِي سَاعَتَيْنِ اللَّيْلَ وَالنَّهَارَ، ثُمَّ قَالُوا:","bs_tekst":"neka mu Allah podari blagoslov i mir, rekao: Allah je u njoj stvorio Zemlju i rasprostro je. Rekli su: A ponedjeljak? Rekao je: Allah je u njemu stvorio Adema. Rekli su: A utorak? Rekao je: U njemu je stvorio planine i vodu i to i to i ono što je Allah htio. Rekli su: A srijeda? Rekao je: Hranu. Rekli su: A četvrtak? Rekao je: Stvorio je nebesa. Rekli su: A petak? Rekao je: Allah je u dva sata stvorio noć i dan. Zatim su rekli:"},{"stranica":24,"ar_tekst":"السَّبْتَ- وَذَكَرُوا الرَّاحَةَ- قَالَ: سُبْحَانَ الله! فانزل الله: «وَلَقَدْ خَلَقْنَا السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ وَما مَسَّنا مِنْ لُغُوبٍ] » .","bs_tekst":"Subota — i spomenuli su odmor. Rekao je: Slavljen neka je Allah! Pa je Allah objavio: ⟦Kur’anski navod, prijevod, 50:38⟧ „Mi smo zaista stvorili nebesa i Zemlju i ono što je između njih u šest dana i nije Nas dotaknuo nikakav umor.“]"},{"stranica":24,"ar_tekst":"فقد بين هذان الخبران اللذان رويناهما عن رسول الله ص أن الشمس والقمر خلقا بعد خلق الله أشياء كثيرة من خلقه، وذلك أن حديث ابن عباس عن رسول الله ص ورد بأن الله خلق الشمس والقمر يوم الجمعة فإن كان ذلك كذلك، فقد كانت الأرض والسماء وما فيهما- سوى الملائكة وآدم- مخلوقة قبل خلق الله الشمس والقمر، وكان ذلك كله ولا ليل ولا نهار، إذ كان الليل والنهار إنما هو اسم لساعات معلومة من قطع الشمس والقمر درج الفلك.","bs_tekst":"Ove dvije vijesti koje smo prenijeli od Allahova Poslanika, neka mu Allah podari blagoslov i mir, objasnile su da su Sunce i Mjesec stvoreni nakon što je Allah stvorio mnoge stvari od Svojih stvorenja. Jer predaja Ibn Abbasa od Allahova Poslanika, neka mu Allah podari blagoslov i mir, prenesena je s navodom da je Allah Sunce i Mjesec stvorio u petak. Ako je tako, Zemlja i nebo i ono što je u njima — osim meleka i Adema — bili su stvoreni prije nego što je Allah stvorio Sunce i Mjesec. Sve je to postojalo, a nije bilo ni noći ni dana, jer su noć i dan samo naziv za poznate sate prelaska Sunca i Mjeseca preko stepena nebeske putanje."},{"stranica":24,"ar_tekst":"وإذا كان صحيحا أن الأرض والسماء وما فيهما، سوى ما ذكرنا، قد كانت ولا شمس ولا قمر- كان معلوما أن ذلك كله كان ولا ليل ولا نهار.","bs_tekst":"Ako je tačno da su Zemlja i nebo i ono što je u njima, osim onoga što smo spomenuli, postojali bez Sunca i Mjeseca, poznato je da je sve to postojalo bez noći i dana."},{"stranica":24,"ar_tekst":"وكذلك حديث ابى هريرة عن [رسول الله ص، لأنه أخبر عنه أنه قال: خلق الله النور يوم الأربعاء،] يعني بالنور الشمس إن شاء الله.","bs_tekst":"Isto važi i za predaju Ebu Hurejre od [Allahova Poslanika, neka mu Allah podari blagoslov i mir, jer je od njega prenio da je rekao: Allah je svjetlost stvorio u srijedu,] pri čemu se pod svjetlošću misli na Sunce, ako Allah htjedne."},{"stranica":24,"ar_tekst":"فإن قال لنا قائل: قد زعمت أن اليوم إنما هو اسم لميقات ما بين طلوع الفجر إلى غروب الشمس، ثم زعمت الآن أن الله خلق الشمس والقمر بعد أيام من أول ابتدائه خلق الأشياء التي خلقها، فأثبت مواقيت، وسميتها بالأيام، ولا شمس ولا قمر، وهذا إن لم تأت ببرهان على صحته، فهو كلام ينقض بعضه بعضا!","bs_tekst":"Ako nam neko kaže: Tvrdio si da je dan samo naziv za razdoblje između izlaska zore i zalaska Sunca, a sada tvrdiš da je Allah Sunce i Mjesec stvorio nakon nekoliko dana od početka stvaranja stvari koje je stvorio. Time si utvrdio vremenska razdoblja i nazvao ih danima, a nema ni Sunca ni Mjeseca. Ako ne doneseš dokaz njegove ispravnosti, to je govor čiji jedan dio proturječi drugome!"},{"stranica":25,"ar_tekst":"قيل: إن الله سمى ما ذكرته أياما، فسميته بالاسم الذي سماه به، وكان وجه تسميه ذلك أياما، ولا شمس ولا قمر، نظير قوله عز وجل: «وَلَهُمْ رِزْقُهُمْ فِيها بُكْرَةً وَعَشِيًّا» ولا بكرة ولا عشي هنالك، إذ كان لا ليل في الآخرة ولا شمس ولا قمر، كما قال جل وعز: «وَلا يَزالُ الَّذِينَ كَفَرُوا فِي مِرْيَةٍ مِنْهُ حَتَّى تَأْتِيَهُمُ السَّاعَةُ بَغْتَةً أَوْ يَأْتِيَهُمْ عَذابُ يَوْمٍ عَقِيمٍ» .","bs_tekst":"Odgovara se: Allah je ono što sam spomenuo nazvao danima, pa sam to nazvao imenom kojim je On to nazvao. Smisao toga da se to nazove danima, iako nije bilo ni Sunca ni Mjeseca, sličan je Njegovim riječima, Silan je i Uzvišen: ⟦Kur’anski navod, prijevod, 19:62, dio⟧ „I u njemu će imati svoju opskrbu ujutro i navečer.“ A tamo nema ni jutra ni večeri, jer na onom svijetu nema ni noći, ni Sunca, ni Mjeseca, kao što je rekao, Veličanstveni i Silni: ⟦Kur’anski navod, prijevod, 22:55⟧ „A oni koji ne vjeruju neprestano će biti u sumnji u pogledu njega, sve dok im Čas ne dođe iznenada ili im ne dođe kazna neplodnoga dana.“"},{"stranica":25,"ar_tekst":"فسمى تعالى ذكره يوم القيامة يوما عقيما، إذ كان يوما لا ليل بعد مجيئه، وإنما أريد بتسمية ما سمي أياما قبل خلق الشمس والقمر قدر مدة ألف عام من أعوام الدنيا، التي العام منها اثنا عشر شهرا من شهور أهل الدنيا، التي تعد ساعاتها وأيامها بقطع الشمس والقمر درج الفلك، كما سمي بكرة وعشيا لما يرزقه أهل الجنة في قدر المدة التي كانوا يعرفون ذلك من الزمان في الدنيا بالشمس ومجراها في الفلك، ولا شمس عندهم ولا ليل وبنحو الذي قلنا في ذلك قال السلف من أهل العلم.","bs_tekst":"On, uzvišen je Njegov spomen, nazvao je Dan proživljenja neplodnim danom zato što je to dan nakon čijeg dolaska nema noći. Nazivanjem danima onoga što je tako nazvano prije stvaranja Sunca i Mjeseca namjeravalo se samo trajanje od hiljadu godina ovoga svijeta, u kojem godina ima dvanaest mjeseci od mjeseci stanovnika ovoga svijeta, čiji se sati i dani broje prelaskom Sunca i Mjeseca preko stepena nebeske putanje. Slično tome, jutrom i večeri nazvano je ono kada stanovnici Dženneta dobijaju opskrbu u trajanju vremenskog razdoblja koje su na ovom svijetu prepoznavali po Suncu i njegovu kretanju nebeskom putanjom, premda kod njih nema ni Sunca ni noći. Slično onome što smo o tome rekli govorili su i prethodnici među učenim ljudima."},{"stranica":25,"ar_tekst":"ذكر بعض من حضرنا ذكره ممن قال ذلك:","bs_tekst":"Spomen nekih među onima koji su to rekli, a čijeg smo se spomena sada prisjetili:"},{"stranica":25,"ar_tekst":"حَدَّثَنِي القاسم، قال: حَدَّثَنَا الحسين، قال: حَدَّثَنِي الحجاج، عن ابن جريج، عن مجاهد أنه قال: يقضي الله عز وجل أمر كل شيء ألف سنة إلى الملائكة، ثم كذلك حتى يمضي ألف سنة، ثم يقضي أمر كل شيء ألفا، ثم كذلك أبدا، قال: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ» قال: اليوم أن يقول لما يقضي إلى الملائكة ألف سنة: كن فيكون، ولكن سماه يوما، سماه كما شاء كل ذلك","bs_tekst":"Pričao mi je El-Kasim, rekao je: Pričao nam je El-Husejn, rekao je: Pričao mi je El-Hadždžadž, od Ibn Džurejdža, od Mudžahida, da je rekao: Allah, Silan je i Uzvišen, melekima određuje stvar svake stvari za hiljadu godina; zatim tako biva dok ne prođe hiljadu godina, pa određuje stvar svake stvari za hiljadu, i zatim tako zauvijek. Rekao je: ⟦Kur’anski navod, prijevod, 32:5, dio⟧ „U danu čije je trajanje hiljadu godina.“ Rekao je: Dan znači da On za ono što melekima određuje za hiljadu godina kaže: „Budi“, i ono bude. Ali nazvao ga je danom; nazvao ga je kako je htio. Sve to"},{"stranica":26,"ar_tekst":"عن مجاهد، قال: وقوله تعالى: «وَإِنَّ يَوْماً عِنْدَ رَبِّكَ كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ» قال: هو هو سواء.","bs_tekst":"prenosi se od Mudžahida. Rekao je: A Njegove riječi, Uzvišen je: ⟦Kur’anski navod, prijevod, 22:47, dio⟧ „A zaista je jedan dan kod tvoga Gospodara poput hiljadu godina koje brojite“ — rekao je: To je isto, jednako."},{"stranica":26,"ar_tekst":"وبنحو الذي ورد عن رسول الله ص من الخبر، بأن الله جل جلاله خلق الشمس والقمر بعد خلقه السموات والأرض وأشياء غير ذلك، ورد الخبر عن جماعة من السلف أنهم قالوه.","bs_tekst":"Slično vijesti prenesenoj od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je Allah, veličanstvena je Njegova uzvišenost, stvorio Sunce i Mjesec nakon što je stvorio nebesa i Zemlju i druge stvari, prenesena je i vijest od skupine prethodnika da su tako govorili."},{"stranica":26,"ar_tekst":"ذكر الخبر عمن قال ذلك منهم:","bs_tekst":"Spomen vijesti o onima među njima koji su to rekli:"},{"stranica":26,"ar_tekst":"حدثنا ابو هشام الرفاعى، حدثنا ابن يمان، حَدَّثَنَا سُفْيَانُ، عَنِ ابْنِ جُرَيْجٍ، عَنْ سُلَيْمَانَ بْنِ مُوسَى، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبَّاسٍ:","bs_tekst":"Pričao nam je Ebu Hišam er-Rifa‘i; pričao nam je Ibn Jeman; pričao nam je Sufjan, od Ibn Džurejdža, od Sulejmana ibn Muse, od Mudžahida, od Ibn Abbasa:"},{"stranica":26,"ar_tekst":"«فَقالَ لَها وَلِلْأَرْضِ ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ» .","bs_tekst":"⟦Kur’anski navod, prijevod, 41:11, dio⟧ „Pa je njemu i Zemlji rekao: Dođite dragovoljno ili protiv volje! Rekli su: Dolazimo pokorno.“"},{"stranica":26,"ar_tekst":"قَالَ: قَالَ اللَّهُ عَزَّ وَجَلَّ لِلسَّمَوَاتِ: أَطْلِعِي شمسى وقمرى، واطلعى نجومى.","bs_tekst":"Rekao je: Allah, Silan je i Uzvišen, rekao je nebesima: Izvedite Moje Sunce i Moj Mjesec i izvedite Moje zvijezde."},{"stranica":26,"ar_tekst":"وَقَالَ لِلأَرْضِ: شَقِّقِي أَنْهَارَكِ، وَأَخْرِجِي ثِمَارَكِ، فَقَالَتَا: أَتَيْنَا طَائِعِينَ.","bs_tekst":"I rekao je Zemlji: Otvori svoje rijeke i izvedi svoje plodove. Pa su njih dvoje rekli: Dolazimo pokorno."},{"stranica":26,"ar_tekst":"حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ،: قَالَ حَدَّثَنَا يَزِيدُ، قال: حدثنا سعيد، عن قتادة:","bs_tekst":"Pričao nam je Bišr ibn Muaz, rekao je: Pričao nam je Jezid, rekao je: Pričao nam je Seid, od Katade:"},{"stranica":26,"ar_tekst":"«وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها» ، خلق فيها شمسها وقمرها ونجومها وصلاحها.","bs_tekst":"⟦Kur’anski navod, prijevod, 41:12, dio⟧ „I svakom je nebu objavio njegovu odredbu“ — stvorio je na njemu njegovo Sunce, njegov Mjesec, njegove zvijezde i ono što mu služi za ispravno uređenje."},{"stranica":26,"ar_tekst":"فقد بينت هذه الأخبار التي ذكرناها عن رسول الله ص وعمن ذكرناها عنه أن الله عز وجل خلق السموات والأرض قبل خلقه الزمان والأيام والليالي، وقبل الشمس والقمر والله أعلم","bs_tekst":"Ove vijesti koje smo spomenuli od Allahova Poslanika, neka mu Allah podari blagoslov i mir, i od onih od kojih smo ih spomenuli, objasnile su da je Allah, Silan je i Uzvišen, stvorio nebesa i Zemlju prije nego što je stvorio vrijeme, dane i noći, te prije Sunca i Mjeseca. A Allah najbolje zna."},{"stranica":27,"ar_tekst":"القول في الإبانة عن فناء الزمان والليل والنهار وأن لا شيء يبقى غير الله تعالى ذكره","bs_tekst":"Rasprava kojom se objašnjava nestanak vremena, noći i dana i da ne ostaje ništa osim Allaha, uzvišen je Njegov spomen"},{"stranica":27,"ar_tekst":"والدلالة على صحة ذلك قول الله تعالى ذكره: «كُلُّ مَنْ عَلَيْها فانٍ وَيَبْقى وَجْهُ رَبِّكَ ذُو الْجَلالِ وَالْإِكْرامِ» ، وقوله تعالى: «لا إِلهَ إِلَّا هُوَ كُلُّ شَيْءٍ هالِكٌ إِلَّا وَجْهَهُ» فإن كان كل شيء هالك غير وجهه- كما قال جل وعز- وكان الليل والنهار ظلمة أو نورا خلقهما لمصالح خلقه، فلا شك انهما فانيان هالكان، كما اخبر، وكما قال: «إِذَا الشَّمْسُ كُوِّرَتْ» يعني بذلك أنها عميت فذهب ضوءها، وذلك عند قيام الساعة، وهذا ما لا يحتاج إلى الإكثار فيه، إذ كان مما يدين بالإقرار به جميع أهل التوحيد من أهل الإسلام وأهل التوراة والإنجيل والمجوس، وإنما ينكره قوم من غير أهل التوحيد، لم نقصد بهذا الكتاب قصد الإبانة عن خطإ قولهم فكل الذين ذكرنا عنهم أنهم مقرون بفناء جميع العالم حتى لا يبقى غير القديم الواحد، مقرون بأن الله عز وجل محييهم بعد فنائهم، وباعثهم بعد هلاكهم، خلا قوم من عبدة الأوثان، فإنهم يقرون بالفناء، وينكرون البعث","bs_tekst":"Dokaz ispravnosti toga jesu riječi Allaha, uzvišen je Njegov spomen: ⟦Kur’anski navod, prijevod, 55:26–27⟧ „Svako ko je na njoj prolazan je, a ostaje lice tvoga Gospodara, Posjednika veličanstvenosti i plemenitosti.“ I Njegove riječi, Uzvišen je: ⟦Kur’anski navod, prijevod, 28:88, dio⟧ „Nema boga osim Njega. Sve propada osim Njegova lica.“ Ako sve propada osim Njegova lica — kao što je rekao, Veličanstveni i Silni — i ako su noć i dan tama ili svjetlost koje je stvorio radi koristi Svojih stvorenja, nema sumnje da su oboje prolazni i da će nestati, kako je obavijestio i kako je rekao: ⟦Kur’anski navod, prijevod, 81:1⟧ „Kada Sunce bude smotano“ — time misli da će biti zaslijepljeno i da će njegovo svjetlo nestati, a to je pri nastupanju Časa. O tome ne treba mnogo govoriti jer je to ono čije priznavanje ispovijedaju svi koji priznaju Božiju jednoću među sljedbenicima islama, Tevrata i Indžila i među medžusijama. To poriču samo neki koji ne priznaju Božiju jednoću, a ovom knjigom nismo namjeravali objašnjavati pogrešnost njihova stava. Svi za koje smo naveli da priznaju nestanak cijeloga svijeta, sve dok ne ostane samo Jedini Bespočetni, priznaju i da će ih Allah, Silan je i Uzvišen, oživiti nakon njihova nestanka i podići nakon njihove propasti, osim nekih obožavalaca kipova: oni priznaju nestanak, ali poriču proživljenje."}]</script><script>if(parent!==window){parent.postMessage({type:'ri-taberi-part',payload:JSON.parse(document.getElementById('partData').textContent),database:JSON.parse(document.getElementById('databaseData').textContent)},'*');}</script></body></html>
