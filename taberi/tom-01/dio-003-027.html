هُوَ الَّذِي خَلَقَ اللَّيْلَ وَالنَّهارَ وَالشَّمْسَ وَالْقَمَرَ كُلٌّ فِي فَلَكٍ يَسْبَحُونَ» .\u003c/p>\u003cp data-pair=\"20.5\" id=\"ar-odlomak-20-5\">ومن جهل حدوث ذلك من خلق الله فإنه لن يجهل اختلاف أحوال الليل والنهار، بأن أحدهما يرد على الخلق- وهو الليل- بسواد وظلمة، وأن الآخر منهما يرد عليهم بنور وضياء، ونسخ لسواد الليل وظلمته، وهو النهار.\u003c/p>\u003cp data-pair=\"20.6\" id=\"ar-odlomak-20-6\">فإذا كان ذلك كذلك، وكان من المحال اجتماعهما مع اختلاف أحوالهما في وقت واحد في جزء واحد- كان معلوما يقينا أنه لا بد من أن يكون أحدهما كان قبل الآخر منهما، وأيهما كان منهما قبل صاحبه فإن الآخر منهما كان\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 20\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"20.1\" id=\"odlomak-20-1\">Rasprava o dokazivanju nastanka vremenskih trenutaka i razdoblja, noći i dana\u003c/p>\u003cp data-pair=\"20.2\" id=\"odlomak-20-2\">Već smo rekli da je vrijeme samo naziv za sate noći i dana, a sati noći i dana samo su mjere kretanja Sunca i Mjeseca po nebeskoj putanji, kao što je Allah, Silan je i Uzvišen, rekao:\u003c/p>\u003cp data-pair=\"20.3\" id=\"odlomak-20-3\">\u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 36:37–40⟧\u003c/span> „I znak im je noć: Mi s nje svlačimo dan, pa se oni odjednom nađu u tami. A Sunce teče do svoga određenog boravišta; to je određenje Silnoga, Sveznajućega. I Mjesecu smo odredili položaje, sve dok se ne vrati poput stare palmine peteljke. Niti Suncu priliči da dostigne Mjesec, niti noć prestiže dan; i svi plove po putanji.“\u003c/p>\u003cp data-pair=\"20.4\" id=\"odlomak-20-4\">Ako je vrijeme ono što smo spomenuli od sati noći i dana, a sati noći i dana samo prelazak Sunca i Mjeseca preko stepena nebeske putanje, onda se sa sigurnošću zna da je vrijeme nastalo i da su noć i dan nastali i da je Onaj koji je to doveo u postojanje Allah, koji je sam doveo u postojanje sva Svoja stvorenja, kao što je rekao: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 21:33⟧\u003c/span> „I On je stvorio noć i dan i Sunce i Mjesec; svi plove po putanji.“\u003c/p>\u003cp data-pair=\"20.5\" id=\"odlomak-20-5\">Onaj među Allahovim stvorenjima ko ne zna da je to nastalo neće ipak biti bez znanja o razlici stanja noći i dana: da jedno od njih dolazi stvorenjima — a to je noć — s crnilom i tamom, a drugo im dolazi sa svjetlom i sjajem i uklanjanjem crnila i tame noći, a to je dan.\u003c/p>\u003cp data-pair=\"20.6\" id=\"odlomak-20-6\">Budući da je tako i da je nemoguće da se oboje, s razlikom svojih stanja, istovremeno sastanu na istom dijelu prostora, sa sigurnošću se zna da je nužno jedno od njih bilo prije drugoga. Koje god od njih bilo prije svoga druga, ono drugo bilo je\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":21,"html":"\u003csection class=\"page\" data-page=\"21\" id=\"stranica-21\">\u003ch2>Stranica 21\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 21\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"21.1\" id=\"ar-odlomak-21-1\">لا شك بعده، وذلك إبانة ودليل على حدوثهما، وأنهما خلقان لخالقهما.\u003c/p>\u003cp data-pair=\"21.2\" id=\"ar-odlomak-21-2\">ومن الدلالة أيضا على حدوث الأيام والليالي أنه لا يوم إلا وهو بعد يوم كان قبله، وقبل يوم كائن بعده، فمعلوم أن ما لم يكن ثم كان، أنه محدث مخلوق، وأن له خالقا ومحدثا.\u003c/p>\u003cp data-pair=\"21.3\" id=\"ar-odlomak-21-3\">واخرى، أن الأيام والليالي معدودة، وما عد من الأشياء فغير خارج من أحد العددين: شفع أو وتر، فإن يكن شفعا فإن أولها اثنان، وذلك تصحيح القول بأن لها ابتداء وأولا، وإن كان وترا فإن أولها واحد، وذلك دليل على أن لها ابتداء وأولا، وما كان له ابتداء فإنه لا بد له من مبتدئ، هو خالقه\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 21\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"21.1\" id=\"odlomak-21-1\">bez sumnje poslije njega. To je objašnjenje i dokaz njihova nastanka i toga da su njih dvoje dva stvorenja svoga Stvoritelja.\u003c/p>\u003cp data-pair=\"21.2\" id=\"odlomak-21-2\">Među dokazima nastanka dana i noći jeste i to da nema dana a da nije poslije dana koji je bio prije njega i prije dana koji će biti poslije njega. Poznato je, dakle, da je ono što nije bilo pa zatim jeste nastalo i stvoreno i da ima Stvoritelja i Onoga koji ga je doveo u postojanje.\u003c/p>\u003cp data-pair=\"21.3\" id=\"odlomak-21-3\">I još: dani i noći mogu se brojati. Ono među stvarima što se broji ne izlazi izvan jednoga od dvaju brojeva: parnoga ili neparnoga. Ako je parno, početak mu je dva, a time se potvrđuje tvrdnja da ima početak i prvi dio. Ako je neparno, početak mu je jedan, a to je dokaz da ima početak i prvi dio. Ono što ima početak nužno ima i Onoga koji mu je dao početak, a On je njegov Stvoritelj.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":22,"html":"\u003csection class=\"page\" data-page=\"22\" id=\"stranica-22\">\u003ch2>Stranica 22\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 22\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"22.1\" id=\"ar-odlomak-22-1\">القول في هل كان الله عز وجل خلق قبل خلقه الزمان والليل والنهار شيئا غير ذلك من الخلق قد قلنا قبل: إن الزمان إنما هو ساعات الليل والنهار، وإن الساعات إنما هي قطع الشمس والقمر درجات الفلك.\u003c/p>\u003cp data-pair=\"22.2\" id=\"ar-odlomak-22-2\">فإذا كان ذلك كذلك، وكان صحيحا عن رسول الله ص ما \u003cspan class=\"isnad\">حَدَّثَنَا هَنَّادُ بْنُ السَّرِيِّ، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ أَبِي سَعْدٍ الْبَقَّالِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ- قَالَ هناد: \u003c/span>وقرات سائر الحديث على ابى بكر- ان اليهود أتت النبي ص فَسَأَلَتْهُ عَنْ خَلْقِ السَّمَوَاتِ وَالأَرْضِ فَقَالَ: خَلَقَ اللَّهُ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ وَمَا فِيهِنَّ مِنْ مَنَافِعَ، وَخَلَقَ يوم الأربعاء الشجر والماء والمدائن والعمران والخراب، فهذه اربعه، ثم قال: «قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ» ، لِمَنْ سَأَلَ قَالَ: وَخَلَقَ يَوْمَ الْخَمِيسِ السَّمَاءَ، وَخَلَقَ يَوْمَ الْجُمُعَةِ النُّجُومَ وَالشَّمْسَ وَالْقَمَرَ وَالْمَلائِكَةَ، إِلَى ثَلاثِ سَاعَاتٍ بَقِيَتْ مِنْهُ، فَخَلَقَ فِي أَوَّلِ سَاعَةٍ مِنْ هَذِهِ الثَّلاثِ السَّاعَاتِ الآجَالَ مَنْ يَحْيَا وَمَنْ يَمُوتُ، وَفِي الثَّانِيَةِ أَلْقَى الآفَةَ عَلَى كُلِّ شَيْءٍ مِمَّا يَنْتَفِعُ بِهِ النَّاسُ، وَفِي الثَّالِثَةِ آدَمَ وَأَسْكَنَهُ الْجَنَّةَ، وَأَمَرَ إِبْلِيسَ بِالسُّجُودِ لَهُ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 22\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"22.1\" id=\"odlomak-22-1\">Rasprava o tome je li Allah, Silan je i Uzvišen, prije nego što je stvorio vrijeme, noć i dan stvorio nešto drugo od stvorenja. Već smo rekli da vrijeme čine samo sati noći i dana i da sati predstavljaju samo prelazak Sunca i Mjeseca preko stepena nebeske putanje.\u003c/p>\u003cp data-pair=\"22.2\" id=\"odlomak-22-2\">Ako je tako i ako je vjerodostojno od Allahova Poslanika, neka mu Allah podari blagoslov i mir, ono što \u003cspan class=\"isnad\">nam je pričao Hennad ibn es-Serijj, rekao je: Pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa — Hennad je rekao: \u003c/span>A ostatak predaje pročitao sam Ebu Bekru — da su Jevreji došli Vjerovjesniku, neka mu Allah podari blagoslov i mir, pa ga upitali o stvaranju nebesa i Zemlje, te je rekao: Allah je Zemlju stvorio u nedjelju i ponedjeljak; planine i koristi koje se nalaze u njima stvorio je u utorak; a u srijedu je stvorio drveće, vodu, gradove, naseljena i razorena mjesta. To su četiri. Zatim je rekao: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 41:9–10⟧\u003c/span> „Reci: Zar vi zaista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova. I na njoj je, iznad nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu hranu u četiri dana, jednako za one koji pitaju“ — za onoga ko pita. Rekao je: U četvrtak je stvorio nebo, a u petak zvijezde, Sunce, Mjesec i meleke, do trenutka kada su od njega preostala tri sata. U prvome od ta tri sata stvorio je rokove — ko će živjeti i ko će umrijeti; u drugome je stavio nedaću na sve ono čime se ljudi koriste; a u trećem Adema, nastanio ga u Džennetu i naredio Iblisu da mu učini sedždu\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":23,"html":"\u003csection class=\"page\" data-page=\"23\" id=\"stranica-23\">\u003ch2>Stranica 23\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 23\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"23.1\" id=\"ar-odlomak-23-1\">وَأَخْرَجَهُ مِنْهَا فِي آخِرِ سَاعَةٍ ثُمَّ قَالَتِ الْيَهُودُ: ثُمَّ مَاذَا يَا مُحَمَّدُ؟ قَالَ: ثُمَّ اسْتَوَى عَلَى الْعَرْشِ، قَالُوا: قَدْ أَصَبْتَ لَوْ اتممت: قالوا: ثم استراح، فغضب النبي ص غضبا شديدا، فنزل: «وَلَقَدْ خَلَقْنَا السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ وَما مَسَّنا مِنْ لُغُوبٍ فَاصْبِرْ عَلى مَا يَقُولُونَ» .\u003c/p>\u003cp data-pair=\"23.2\" id=\"ar-odlomak-23-2\">\u003cspan class=\"isnad\">حَدَّثَنِي الْقَاسِمُ بْنُ بِشْرِ بْنِ مَعْرُوفٍ وَالْحُسَيْنُ بن علي الصدائي، قالا: حدثنا حجاج، قال: قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مولى أم سلمة، عن أبي هريرة قال: \u003c/span>[أخذ رسول الله ص بِيَدِي فَقَالَ: خَلَقَ اللَّهُ التُّرْبَةَ يَوْمَ السَّبْتِ، وَخَلَقَ فِيهَا الْجِبَالَ يَوْمَ الأَحَدِ، وَخَلَقَ الشَّجَرَ يَوْمَ الاثْنَيْنِ، وَخَلَقَ الْمَكْرُوهَ يَوْمَ الثُّلاثَاءِ، وَخَلَقَ النُّورَ يَوْمَ الأَرْبِعَاءِ، وَبَثَّ فِيهَا الدَّوَابَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ بَعْدَ الْعَصْرِ مِنْ يَوْمِ الْجُمُعَةِ، آخِرَ خَلْقٍ خُلِقَ، فِي آخِرِ سَاعَةٍ مِنْ سَاعَاتِ الْجُمُعَةِ، فِيمَا بَيْنَ الْعَصْرِ إِلَى اللَّيْلِ] .\u003c/p>\u003cp data-pair=\"23.3\" id=\"ar-odlomak-23-3\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ بزيع، قال: حدثنا الفضيل بْنُ سُلَيْمَانَ، حَدَّثَنِي مُحَمَّدُ بْنُ زَيْدٍ، قَالَ: حَدَّثَنِي أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ، قَالَ:\u003c/span>\u003c/p>\u003cp data-pair=\"23.4\" id=\"ar-odlomak-23-4\">\u003cspan class=\"isnad\">أَخْبَرَنِي ابْنُ سَلامٍ وَأَبُو هُرَيْرَةَ، فذكرا عن النبي ص السَّاعَةَ الَّتِي فِي يَوْمِ الْجُمُعَةِ، وَذَكَرَا أَنَّهُ قَالَهَا، قَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: \u003c/span>أَنَا أَعْلَمُ أَيَّ سَاعَةٍ هِيَ، بَدَأَ اللَّهُ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ يَوْمَ الأَحَدِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ، فَهِيَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ.\u003c/p>\u003cp data-pair=\"23.5\" id=\"ar-odlomak-23-5\">\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى، قال: حدثنا الحجاج، حَدَّثَنَا حَمَّادٌ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ عكرمه: \u003c/span>[ان اليهود قالوا للنبي ص: ما يوم الأحد؟ فقال رسول\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 23\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"23.1\" id=\"odlomak-23-1\">i izveo ga iz njega u posljednjem satu. Zatim su Jevreji rekli: A zatim šta, Muhammede? Rekao je: Zatim se uzvisio nad Prijestoljem. Rekli su: Pogodio si, kada bi dovršio. Rekli su: Zatim se odmorio. Tada se Vjerovjesnik, neka mu Allah podari blagoslov i mir, veoma rasrdio, pa je objavljeno: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 50:38–39, dio⟧\u003c/span> „Mi smo zaista stvorili nebesa i Zemlju i ono što je između njih u šest dana i nije Nas dotaknuo nikakav umor. Pa strpljivo podnosi ono što govore.“\u003c/p>\u003cp data-pair=\"23.2\" id=\"odlomak-23-2\">\u003cspan class=\"isnad\">Pričali su mi El-Kasim ibn Bišr ibn Ma‘ruf i El-Husejn ibn Ali es-Suda‘i; rekli su: Pričao nam je Hadždžadž, rekao je: Ibn Džurejdž je rekao: Obavijestio me je Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafi‘a, oslobođenika Umm Seleme, od Ebu Hurejre, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, uzeo me je za ruku, pa rekao: Allah je tlo stvorio u subotu, a planine na njemu stvorio je u nedjelju. Drveće je stvorio u ponedjeljak, ono što je neugodno stvorio je u utorak, svjetlost je stvorio u srijedu, životinje je po njemu rasprostro u četvrtak, a Adema je stvorio poslije ikindije u petak, kao posljednje stvorenje koje je stvoreno, u posljednjem od sati petka, između ikindije i noći.]\u003c/p>\u003cp data-pair=\"23.3\" id=\"odlomak-23-3\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Abdullah ibn Bezi‘, rekao je: Pričao nam je El-Fudajl ibn Sulejman; pričao mi je Muhammed ibn Zejd, rekao je: Pričao mi je Ebu Selema ibn Abdurrahman ibn Avf, rekao je:\u003c/span>\u003c/p>\u003cp data-pair=\"23.4\" id=\"odlomak-23-4\">\u003cspan class=\"isnad\">Obavijestili su me Ibn Selam i Ebu Hurejra, \u003c/span>pa su od Vjerovjesnika, neka mu Allah podari blagoslov i mir, spomenuli sat koji se nalazi u petku i spomenuli da je o njemu govorio. Abdullah ibn Selam je rekao: Ja znam koji je to sat. Allah je stvaranje nebesa i Zemlje započeo u nedjelju, a završio u posljednjem satu petka. Zato je on u posljednjem satu petka.\u003c/p>\u003cp data-pair=\"23.5\" id=\"odlomak-23-5\">\u003cspan class=\"isnad\">Pričao mi je El-Musenna, rekao je: Pričao nam je El-Hadždžadž; pričao nam je Hammad, od Ataa ibn es-Saiba, od Ikrime: \u003c/span>[Jevreji su rekli Vjerovjesniku, neka mu Allah podari blagoslov i mir: Šta je nedjelja? Pa je Allahov Poslanik,\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":24,"html":"\u003csection class=\"page\" data-page=\"24\" id=\"stranica-24\">\u003ch2>Stranica 24\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 24\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"24.1\" id=\"ar-odlomak-24-1\">الله ص: خلق الله فيه الارض وبسطها، قالوا: فالاثنين؟ قال: خلق الله فِيهِ آدَمَ، قَالُوا: فَالثُّلاثَاءِ؟ قَالَ: خَلَقَ فِيهِ الْجِبَالَ وَالْمَاءَ وَكَذَا وَكَذَا وَمَا شَاءَ اللَّهُ، قَالُوا: فَيَوْمُ الأَرْبِعَاءِ؟ قَالَ: الأَقْوَاتَ، قَالُوا: فَيَوْمُ الْخَمِيسِ؟ قَالَ: خَلَقَ السَّمَوَاتِ، قَالُوا: فَيَوْمُ الْجُمُعَةِ؟ قَالَ: خَلَقَ اللَّهُ فِي سَاعَتَيْنِ اللَّيْلَ وَالنَّهَارَ، ثُمَّ قَالُوا:\u003c/p>\u003cp data-pair=\"24.2\" id=\"ar-odlomak-24-2\">السَّبْتَ- وَذَكَرُوا الرَّاحَةَ- قَالَ: سُبْحَانَ الله! فانزل الله: «وَلَقَدْ خَلَقْنَا السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ وَما مَسَّنا مِنْ لُغُوبٍ] » .\u003c/p>\u003cp data-pair=\"24.3\" id=\"ar-odlomak-24-3\">فقد بين هذان الخبران اللذان رويناهما عن رسول الله ص أن الشمس والقمر خلقا بعد خلق الله أشياء كثيرة من خلقه، وذلك أن حديث ابن عباس عن رسول الله ص ورد بأن الله خلق الشمس والقمر يوم الجمعة فإن كان ذلك كذلك، فقد كانت الأرض والسماء وما فيهما- سوى الملائكة وآدم- مخلوقة قبل خلق الله الشمس والقمر، وكان ذلك كله ولا ليل ولا نهار، إذ كان الليل والنهار إنما هو اسم لساعات معلومة من قطع الشمس والقمر درج الفلك.\u003c/p>\u003cp data-pair=\"24.4\" id=\"ar-odlomak-24-4\">وإذا كان صحيحا أن الأرض والسماء وما فيهما، سوى ما ذكرنا، قد كانت ولا شمس ولا قمر- كان معلوما أن ذلك كله كان ولا ليل ولا نهار.\u003c/p>\u003cp data-pair=\"24.5\" id=\"ar-odlomak-24-5\">وكذلك حديث ابى هريرة عن [رسول الله ص، لأنه أخبر عنه أنه قال: خلق الله النور يوم الأربعاء،] يعني بالنور الشمس إن شاء الله.\u003c/p>\u003cp data-pair=\"24.6\" id=\"ar-odlomak-24-6\">فإن قال لنا قائل: قد زعمت أن اليوم إنما هو اسم لميقات ما بين طلوع الفجر إلى غروب الشمس، ثم زعمت الآن أن الله خلق الشمس والقمر بعد أيام من أول ابتدائه خلق الأشياء التي خلقها، فأثبت مواقيت، وسميتها بالأيام، ولا شمس ولا قمر، وهذا إن لم تأت ببرهان على صحته، فهو كلام ينقض بعضه بعضا!\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 24\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"24.1\" id=\"odlomak-24-1\">neka mu Allah podari blagoslov i mir, rekao: Allah je u njoj stvorio Zemlju i rasprostro je. Rekli su: A ponedjeljak? Rekao je: Allah je u njemu stvorio Adema. Rekli su: A utorak? Rekao je: U njemu je stvorio planine i vodu i to i to i ono što je Allah htio. Rekli su: A srijeda? Rekao je: Hranu. Rekli su: A četvrtak? Rekao je: Stvorio je nebesa. Rekli su: A petak? Rekao je: Allah je u dva sata stvorio noć i dan. Zatim su rekli:\u003c/p>\u003cp data-pair=\"24.2\" id=\"odlomak-24-2\">Subota — i spomenuli su odmor. Rekao je: Slavljen neka je Allah! Pa je Allah objavio: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 50:38⟧\u003c/span> „Mi smo zaista stvorili nebesa i Zemlju i ono što je između njih u šest dana i nije Nas dotaknuo nikakav umor.“]\u003c/p>\u003cp data-pair=\"24.3\" id=\"odlomak-24-3\">Ove dvije vijesti koje smo prenijeli od Allahova Poslanika, neka mu Allah podari blagoslov i mir, objasnile su da su Sunce i Mjesec stvoreni nakon što je Allah stvorio mnoge stvari od Svojih stvorenja. Jer predaja Ibn Abbasa od Allahova Poslanika, neka mu Allah podari blagoslov i mir, prenesena je s navodom da je Allah Sunce i Mjesec stvorio u petak. Ako je tako, Zemlja i nebo i ono što je u njima — osim meleka i Adema — bili su stvoreni prije nego što je Allah stvorio Sunce i Mjesec. Sve je to postojalo, a nije bilo ni noći ni dana, jer su noć i dan samo naziv za poznate sate prelaska Sunca i Mjeseca preko stepena nebeske putanje.\u003c/p>\u003cp data-pair=\"24.4\" id=\"odlomak-24-4\">Ako je tačno da su Zemlja i nebo i ono što je u njima, osim onoga što smo spomenuli, postojali bez Sunca i Mjeseca, poznato je da je sve to postojalo bez noći i dana.\u003c/p>\u003cp data-pair=\"24.5\" id=\"odlomak-24-5\">Isto važi i za predaju Ebu Hurejre od [Allahova Poslanika, neka mu Allah podari blagoslov i mir, jer je od njega prenio da je rekao: Allah je svjetlost stvorio u srijedu,] pri čemu se pod svjetlošću misli na Sunce, ako Allah htjedne.\u003c/p>\u003cp data-pair=\"24.6\" id=\"odlomak-24-6\">Ako nam neko kaže: Tvrdio si da je dan samo naziv za razdoblje između izlaska zore i zalaska Sunca, a sada tvrdiš da je Allah Sunce i Mjesec stvorio nakon nekoliko dana od početka stvaranja stvari koje je stvorio. Time si utvrdio vremenska razdoblja i nazvao ih danima, a nema ni Sunca ni Mjeseca. Ako ne doneseš dokaz njegove ispravnosti, to je govor čiji jedan dio proturječi drugome!\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":25,"html":"\u003csection class=\"page\" data-page=\"25\" id=\"stranica-25\">\u003ch2>Stranica 25\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 25\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"25.1\" id=\"ar-odlomak-25-1\">قيل: إن الله سمى ما ذكرته أياما، فسميته بالاسم الذي سماه به، وكان وجه تسميه ذلك أياما، ولا شمس ولا قمر، نظير قوله عز وجل: «وَلَهُمْ رِزْقُهُمْ فِيها بُكْرَةً وَعَشِيًّا» ولا بكرة ولا عشي هنالك، إذ كان لا ليل في الآخرة ولا شمس ولا قمر، كما قال جل وعز: «وَلا يَزالُ الَّذِينَ كَفَرُوا فِي مِرْيَةٍ مِنْهُ حَتَّى تَأْتِيَهُمُ السَّاعَةُ بَغْتَةً أَوْ يَأْتِيَهُمْ عَذابُ يَوْمٍ عَقِيمٍ» .\u003c/p>\u003cp data-pair=\"25.2\" id=\"ar-odlomak-25-2\">فسمى تعالى ذكره يوم القيامة يوما عقيما، إذ كان يوما لا ليل بعد مجيئه، وإنما أريد بتسمية ما سمي أياما قبل خلق الشمس والقمر قدر مدة ألف عام من أعوام الدنيا، التي العام منها اثنا عشر شهرا من شهور أهل الدنيا، التي تعد ساعاتها وأيامها بقطع الشمس والقمر درج الفلك، كما سمي بكرة وعشيا لما يرزقه أهل الجنة في قدر المدة التي كانوا يعرفون ذلك من الزمان في الدنيا بالشمس ومجراها في الفلك، ولا شمس عندهم ولا ليل وبنحو الذي قلنا في ذلك قال السلف من أهل العلم.\u003c/p>\u003cp data-pair=\"25.3\" id=\"ar-odlomak-25-3\">ذكر بعض من حضرنا ذكره ممن قال ذلك:\u003c/p>\u003cp data-pair=\"25.4\" id=\"ar-odlomak-25-4\">\u003cspan class=\"isnad\">حَدَّثَنِي القاسم، قال: حَدَّثَنَا الحسين، قال: حَدَّثَنِي الحجاج، عن ابن جريج، عن مجاهد \u003c/span>أنه قال: يقضي الله عز وجل أمر كل شيء ألف سنة إلى الملائكة، ثم كذلك حتى يمضي ألف سنة، ثم يقضي أمر كل شيء ألفا، ثم كذلك أبدا، قال: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ» قال: اليوم أن يقول لما يقضي إلى الملائكة ألف سنة: كن فيكون، ولكن سماه يوما، سماه كما شاء كل ذلك\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 25\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"25.1\" id=\"odlomak-25-1\">Odgovara se: Allah je ono što sam spomenuo nazvao danima, pa sam to nazvao imenom kojim je On to nazvao. Smisao toga da se to nazove danima, iako nije bilo ni Sunca ni Mjeseca, sličan je Njegovim riječima, Silan je i Uzvišen: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 19:62, dio⟧\u003c/span> „I u njemu će imati svoju opskrbu ujutro i navečer.“ A tamo nema ni jutra ni večeri, jer na onom svijetu nema ni noći, ni Sunca, ni Mjeseca, kao što je rekao, Veličanstveni i Silni: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 22:55⟧\u003c/span> „A oni koji ne vjeruju neprestano će biti u sumnji u pogledu njega, sve dok im Čas ne dođe iznenada ili im ne dođe kazna neplodnoga dana.“\u003c/p>\u003cp data-pair=\"25.2\" id=\"odlomak-25-2\">On, uzvišen je Njegov spomen, nazvao je Dan proživljenja neplodnim danom zato što je to dan nakon čijeg dolaska nema noći. Nazivanjem danima onoga što je tako nazvano prije stvaranja Sunca i Mjeseca namjeravalo se samo trajanje od hiljadu godina ovoga svijeta, u kojem godina ima dvanaest mjeseci od mjeseci stanovnika ovoga svijeta, čiji se sati i dani broje prelaskom Sunca i Mjeseca preko stepena nebeske putanje. Slično tome, jutrom i večeri nazvano je ono kada stanovnici Dženneta dobijaju opskrbu u trajanju vremenskog razdoblja koje su na ovom svijetu prepoznavali po Suncu i njegovu kretanju nebeskom putanjom, premda kod njih nema ni Sunca ni noći. Slično onome što smo o tome rekli govorili su i prethodnici među učenim ljudima.\u003c/p>\u003cp data-pair=\"25.3\" id=\"odlomak-25-3\">Spomen nekih među onima koji su to rekli, a čijeg smo se spomena sada prisjetili:\u003c/p>\u003cp data-pair=\"25.4\" id=\"odlomak-25-4\">\u003cspan class=\"isnad\">Pričao mi je El-Kasim, rekao je: Pričao nam je El-Husejn, rekao je: Pričao mi je El-Hadždžadž, od Ibn Džurejdža, od Mudžahida, da je rekao: \u003c/span>Allah, Silan je i Uzvišen, melekima određuje stvar svake stvari za hiljadu godina; zatim tako biva dok ne prođe hiljadu godina, pa određuje stvar svake stvari za hiljadu, i zatim tako zauvijek. Rekao je: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 32:5, dio⟧\u003c/span> „U danu čije je trajanje hiljadu godina.“ Rekao je: Dan znači da On za ono što melekima određuje za hiljadu godina kaže: „Budi“, i ono bude. Ali nazvao ga je danom; nazvao ga je kako je htio. Sve to\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":26,"html":"\u003csection class=\"page\" data-page=\"26\" id=\"stranica-26\">\u003ch2>Stranica 26\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 26\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"26.1\" id=\"ar-odlomak-26-1\">عن مجاهد، قال: وقوله تعالى: «وَإِنَّ يَوْماً عِنْدَ رَبِّكَ كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ» قال: هو هو سواء.\u003c/p>\u003cp data-pair=\"26.2\" id=\"ar-odlomak-26-2\">وبنحو الذي ورد عن رسول الله ص من الخبر، بأن الله جل جلاله خلق الشمس والقمر بعد خلقه السموات والأرض وأشياء غير ذلك، ورد الخبر عن جماعة من السلف أنهم قالوه.\u003c/p>\u003cp data-pair=\"26.3\" id=\"ar-odlomak-26-3\">ذكر الخبر عمن قال ذلك منهم:\u003c/p>\u003cp data-pair=\"26.4\" id=\"ar-odlomak-26-4\">\u003cspan class=\"isnad\">حدثنا ابو هشام الرفاعى، حدثنا ابن يمان، حَدَّثَنَا سُفْيَانُ، عَنِ ابْنِ جُرَيْجٍ، عَنْ سُلَيْمَانَ بْنِ مُوسَى، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبَّاسٍ:\u003c/span>\u003c/p>\u003cp data-pair=\"26.5\" id=\"ar-odlomak-26-5\">«فَقالَ لَها وَلِلْأَرْضِ ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ» .\u003c/p>\u003cp data-pair=\"26.6\" id=\"ar-odlomak-26-6\">قَالَ: قَالَ اللَّهُ عَزَّ وَجَلَّ لِلسَّمَوَاتِ: أَطْلِعِي شمسى وقمرى، واطلعى نجومى.\u003c/p>\u003cp data-pair=\"26.7\" id=\"ar-odlomak-26-7\">وَقَالَ لِلأَرْضِ: شَقِّقِي أَنْهَارَكِ، وَأَخْرِجِي ثِمَارَكِ، فَقَالَتَا: أَتَيْنَا طَائِعِينَ.\u003c/p>\u003cp data-pair=\"26.8\" id=\"ar-odlomak-26-8\">\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ،: قَالَ حَدَّثَنَا يَزِيدُ، قال: حدثنا سعيد، عن قتادة:\u003c/span>\u003c/p>\u003cp data-pair=\"26.9\" id=\"ar-odlomak-26-9\">«وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها» ، خلق فيها شمسها وقمرها ونجومها وصلاحها.\u003c/p>\u003cp data-pair=\"26.10\" id=\"ar-odlomak-26-10\">فقد بينت هذه الأخبار التي ذكرناها عن رسول الله ص وعمن ذكرناها عنه أن الله عز وجل خلق السموات والأرض قبل خلقه الزمان والأيام والليالي، وقبل الشمس والقمر والله أعلم\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 26\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"26.1\" id=\"odlomak-26-1\">prenosi se od Mudžahida. Rekao je: A Njegove riječi, Uzvišen je: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 22:47, dio⟧\u003c/span> „A zaista je jedan dan kod tvoga Gospodara poput hiljadu godina koje brojite“ — rekao je: To je isto, jednako.\u003c/p>\u003cp data-pair=\"26.2\" id=\"odlomak-26-2\">Slično vijesti prenesenoj od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je Allah, veličanstvena je Njegova uzvišenost, stvorio Sunce i Mjesec nakon što je stvorio nebesa i Zemlju i druge stvari, prenesena je i vijest od skupine prethodnika da su tako govorili.\u003c/p>\u003cp data-pair=\"26.3\" id=\"odlomak-26-3\">Spomen vijesti o onima među njima koji su to rekli:\u003c/p>\u003cp data-pair=\"26.4\" id=\"odlomak-26-4\">\u003cspan class=\"isnad\">Pričao nam je Ebu Hišam er-Rifa‘i; pričao nam je Ibn Jeman; pričao nam je Sufjan, od Ibn Džurejdža, od Sulejmana ibn Muse, od Mudžahida, od Ibn Abbasa:\u003c/span>\u003c/p>\u003cp data-pair=\"26.5\" id=\"odlomak-26-5\">\u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 41:11, dio⟧\u003c/span> „Pa je njemu i Zemlji rekao: Dođite dragovoljno ili protiv volje! Rekli su: Dolazimo pokorno.“\u003c/p>\u003cp data-pair=\"26.6\" id=\"odlomak-26-6\">Rekao je: Allah, Silan je i Uzvišen, rekao je nebesima: Izvedite Moje Sunce i Moj Mjesec i izvedite Moje zvijezde.\u003c/p>\u003cp data-pair=\"26.7\" id=\"odlomak-26-7\">I rekao je Zemlji: Otvori svoje rijeke i izvedi svoje plodove. Pa su njih dvoje rekli: Dolazimo pokorno.\u003c/p>\u003cp data-pair=\"26.8\" id=\"odlomak-26-8\">\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz, rekao je: Pričao nam je Jezid, rekao je: Pričao nam je Seid, od Katade:\u003c/span>\u003c/p>\u003cp data-pair=\"26.9\" id=\"odlomak-26-9\">\u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 41:12, dio⟧\u003c/span> „I svakom je nebu objavio njegovu odredbu“ — stvorio je na njemu njegovo Sunce, njegov Mjesec, njegove zvijezde i ono što mu služi za ispravno uređenje.\u003c/p>\u003cp data-pair=\"26.10\" id=\"odlomak-26-10\">Ove vijesti koje smo spomenuli od Allahova Poslanika, neka mu Allah podari blagoslov i mir, i od onih od kojih smo ih spomenuli, objasnile su da je Allah, Silan je i Uzvišen, stvorio nebesa i Zemlju prije nego što je stvorio vrijeme, dane i noći, te prije Sunca i Mjeseca. A Allah najbolje zna.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":27,"html":"\u003csection class=\"page\" data-page=\"27\" id=\"stranica-27\">\u003ch2>Stranica 27\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 27\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"27.1\" id=\"ar-odlomak-27-1\">القول في الإبانة عن فناء الزمان والليل والنهار وأن لا شيء يبقى غير الله تعالى ذكره\u003c/p>\u003cp data-pair=\"27.2\" id=\"ar-odlomak-27-2\">والدلالة على صحة ذلك قول الله تعالى ذكره: «كُلُّ مَنْ عَلَيْها فانٍ وَيَبْقى وَجْهُ رَبِّكَ ذُو الْجَلالِ وَالْإِكْرامِ» ، وقوله تعالى: «لا إِلهَ إِلَّا هُوَ كُلُّ شَيْءٍ هالِكٌ إِلَّا وَجْهَهُ» فإن كان كل شيء هالك غير وجهه- كما قال جل وعز- وكان الليل والنهار ظلمة أو نورا خلقهما لمصالح خلقه، فلا شك انهما فانيان هالكان، كما اخبر، وكما قال: «إِذَا الشَّمْسُ كُوِّرَتْ» يعني بذلك أنها عميت فذهب ضوءها، وذلك عند قيام الساعة، وهذا ما لا يحتاج إلى الإكثار فيه، إذ كان مما يدين بالإقرار به جميع أهل التوحيد من أهل الإسلام وأهل التوراة والإنجيل والمجوس، وإنما ينكره قوم من غير أهل التوحيد، لم نقصد بهذا الكتاب قصد الإبانة عن خطإ قولهم فكل الذين ذكرنا عنهم أنهم مقرون بفناء جميع العالم حتى لا يبقى غير القديم الواحد، مقرون بأن الله عز وجل محييهم بعد فنائهم، وباعثهم بعد هلاكهم، خلا قوم من عبدة الأوثان، فإنهم يقرون بالفناء، وينكرون البعث\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 27\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"27.1\" id=\"odlomak-27-1\">Rasprava kojom se objašnjava nestanak vremena, noći i dana i da ne ostaje ništa osim Allaha, uzvišen je Njegov spomen\u003c/p>\u003cp data-pair=\"27.2\" id=\"odlomak-27-2\">Dokaz ispravnosti toga jesu riječi Allaha, uzvišen je Njegov spomen: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 55:26–27⟧\u003c/span> „Svako ko je na njoj prolazan je, a ostaje lice tvoga Gospodara, Posjednika veličanstvenosti i plemenitosti.“ I Njegove riječi, Uzvišen je: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 28:88, dio⟧\u003c/span> „Nema boga osim Njega. Sve propada osim Njegova lica.“ Ako sve propada osim Njegova lica — kao što je rekao, Veličanstveni i Silni — i ako su noć i dan tama ili svjetlost koje je stvorio radi koristi Svojih stvorenja, nema sumnje da su oboje prolazni i da će nestati, kako je obavijestio i kako je rekao: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 81:1⟧\u003c/span> „Kada Sunce bude smotano“ — time misli da će biti zaslijepljeno i da će njegovo svjetlo nestati, a to je pri nastupanju Časa. O tome ne treba mnogo govoriti jer je to ono čije priznavanje ispovijedaju svi koji priznaju Božiju jednoću među sljedbenicima islama, Tevrata i Indžila i među medžusijama. To poriču samo neki koji ne priznaju Božiju jednoću, a ovom knjigom nismo namjeravali objašnjavati pogrešnost njihova stava. Svi za koje smo naveli da priznaju nestanak cijeloga svijeta, sve dok ne ostane samo Jedini Bespočetni, priznaju i da će ih Allah, Silan je i Uzvišen, oživiti nakon njihova nestanka i podići nakon njihove propasti, osim nekih obožavalaca kipova: oni priznaju nestanak, ali poriču proživljenje.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"}],"book":[{"n":3,"paragraphs":[{"id":"3.1","ar":"الجزء الأول","bs":"Prvi dio","ar_html":"الجزء الأول","bs_html":"Prvi dio","ar_ranges":[],"bs_ranges":[]},{"id":"3.2","ar":"بِسْمِ اللَّهِ الرَّحْمنِ الرَّحِيمِ","bs":"U ime Allaha, Milostivog, Samilosnog.","ar_html":"بِسْمِ اللَّهِ الرَّحْمنِ الرَّحِيمِ","bs_html":"U ime Allaha, Milostivog, Samilosnog.","ar_ranges":[],"bs_ranges":[]},{"id":"3.3","ar":"الحمد لله الأول قبل كل أول، والآخر بعد كل آخر، والدائم بلا زوال، والقائم على كل شيء بغير انتقال، والخالق خلقه من غير اصل ولا مثال، فهو الفرد الواحد من غير عدد، وهو الباقي بعد كل أحد، إلى غير نهاية ولا أمد له الكبرياء والعظمه، والبهاء والعزه، والسلطان والقدرة، تعالى عن أن يكون له شريك في سلطانه او في وحدانيته نديد، أو في تدبيره معين أو ظهير، أو أن يكون له ولد، أو صاحبه او كفء أحد، لا تحيط به الأوهام، ولا تحويه الأقطار، ولا تُدْرِكُهُ الْأَبْصارُ، وهو يدرك الأبصار، وهو اللطيف الخبير.","bs":"Hvala Allahu, Prvom prije svakog prvog i Posljednjem poslije svakog posljednjeg, Trajnom bez prestanka, Onome koji nad svakom stvari stoji bez premještanja, Stvoritelju koji je Svoja stvorenja stvorio bez prethodne osnove i uzora. On je Jedini, Jedan bez broja, i On je Onaj koji ostaje poslije svakoga, bez kraja i roka. Njemu pripadaju veličanstvenost i veličina, sjaj i moć, vlast i sposobnost. Uzvišen je iznad toga da ima sudruga u Svojoj vlasti, takmaca u Svojoj jednosti, pomagača ili potporu u Svome upravljanju, ili da ima dijete, družicu ili ikoga Sebi ravnog. Predodžbe Ga ne obuhvataju, prostori Ga ne sadrže. ⟦Kur’anski izraz, prijevod, 6:103⟧ „Pogledi Ga ne dostižu, a On dostiže poglede, i On je Blagi, o svemu Obaviješteni.“","ar_html":"الحمد لله الأول قبل كل أول، والآخر بعد كل آخر، والدائم بلا زوال، والقائم على كل شيء بغير انتقال، والخالق خلقه من غير اصل ولا مثال، فهو الفرد الواحد من غير عدد، وهو الباقي بعد كل أحد، إلى غير نهاية ولا أمد له الكبرياء والعظمه، والبهاء والعزه، والسلطان والقدرة، تعالى عن أن يكون له شريك في سلطانه او في وحدانيته نديد، أو في تدبيره معين أو ظهير، أو أن يكون له ولد، أو صاحبه او كفء أحد، لا تحيط به الأوهام، ولا تحويه الأقطار، ولا تُدْرِكُهُ الْأَبْصارُ، وهو يدرك الأبصار، وهو اللطيف الخبير.","bs_html":"Hvala Allahu, Prvom prije svakog prvog i Posljednjem poslije svakog posljednjeg, Trajnom bez prestanka, Onome koji nad svakom stvari stoji bez premještanja, Stvoritelju koji je Svoja stvorenja stvorio bez prethodne osnove i uzora. On je Jedini, Jedan bez broja, i On je Onaj koji ostaje poslije svakoga, bez kraja i roka. Njemu pripadaju veličanstvenost i veličina, sjaj i moć, vlast i sposobnost. Uzvišen je iznad toga da ima sudruga u Svojoj vlasti, takmaca u Svojoj jednosti, pomagača ili potporu u Svome upravljanju, ili da ima dijete, družicu ili ikoga Sebi ravnog. Predodžbe Ga ne obuhvataju, prostori Ga ne sadrže. \u003cspan class=\"translator-note\">⟦Kur’anski izraz, prijevod, 6:103⟧\u003c/span> „Pogledi Ga ne dostižu, a On dostiže poglede, i On je Blagi, o svemu Obaviješteni.“","ar_ranges":[],"bs_ranges":[]},{"id":"3.4","ar":"أحمده على آلائه، وأشكره على نعمائه، حمد من أفرده بالحمد، وشكر من رجا بالشكر منه المزيد، وأستهديه من القول والعمل لما يقربني منه ويرضيه، وأومن به إيمان مخلص له التوحيد، ومفرد له التمجيد.","bs":"Hvalim Ga za Njegove blagodati i zahvaljujem Mu na Njegovim darovima, hvalom onoga koji samo Njemu posvećuje hvalu i zahvalnošću onoga koji se zahvaljivanjem nada uvećanju od Njega. Od Njega tražim uputu u govoru i djelu ka onome što će me Njemu približiti i čime će On biti zadovoljan. Vjerujem u Njega vjerovanjem onoga koji Mu iskreno priznaje jedinstvo i samo Njemu posvećuje veličanje.","ar_html":"أحمده على آلائه، وأشكره على نعمائه، حمد من أفرده بالحمد، وشكر من رجا بالشكر منه المزيد، وأستهديه من القول والعمل لما يقربني منه ويرضيه، وأومن به إيمان مخلص له التوحيد، ومفرد له التمجيد.","bs_html":"Hvalim Ga za Njegove blagodati i zahvaljujem Mu na Njegovim darovima, hvalom onoga koji samo Njemu posvećuje hvalu i zahvalnošću onoga koji se zahvaljivanjem nada uvećanju od Njega. Od Njega tražim uputu u govoru i djelu ka onome što će me Njemu približiti i čime će On biti zadovoljan. Vjerujem u Njega vjerovanjem onoga koji Mu iskreno priznaje jedinstvo i samo Njemu posvećuje veličanje.","ar_ranges":[],"bs_ranges":[]},{"id":"3.5","ar":"وَأَشْهَدُ أَنْ لا إِلَهَ إِلا اللَّهُ وَحْدَهُ لا شريك له، وأشهد أن محمدا عبده النجيب، ورسوله الأمين، اصطفاه لرسالته، وابتعثه بوحيه، داعيا خلقه إلى عبادته، فصدع بأمره، وجاهد في سبيله، ونصح لأمته، وعبده حتى أتاه اليقين من عنده، غير مقصر في بلاغ، ولا وان في جهاد، صلى الله عليه أفضل صلاة وأزكاها، وسلم","bs":"Svjedočim da nema boga osim Allaha Jedinoga, koji nema sudruga, i svjedočim da je Muhammed Njegov odabrani rob i Njegov povjerljivi poslanik. Izabrao ga je za Svoje poslanstvo i poslao ga sa Svojom objavom, da Njegova stvorenja poziva na robovanje Njemu. On je otvoreno izvršio Njegovu naredbu, borio se na Njegovu putu, iskreno savjetovao svoj ummet i robovao Mu sve dok mu od Njega nije došla izvjesnost, ne podbacujući u dostavljanju i ne posustajući u borbi. Neka mu Allah podari najbolji i najčistiji blagoslov i neka mu podari mir.","ar_html":"وَأَشْهَدُ أَنْ لا إِلَهَ إِلا اللَّهُ وَحْدَهُ لا شريك له، وأشهد أن محمدا عبده النجيب، ورسوله الأمين، اصطفاه لرسالته، وابتعثه بوحيه، داعيا خلقه إلى عبادته، فصدع بأمره، وجاهد في سبيله، ونصح لأمته، وعبده حتى أتاه اليقين من عنده، غير مقصر في بلاغ، ولا وان في جهاد، صلى الله عليه أفضل صلاة وأزكاها، وسلم","bs_html":"Svjedočim da nema boga osim Allaha Jedinoga, koji nema sudruga, i svjedočim da je Muhammed Njegov odabrani rob i Njegov povjerljivi poslanik. Izabrao ga je za Svoje poslanstvo i poslao ga sa Svojom objavom, da Njegova stvorenja poziva na robovanje Njemu. On je otvoreno izvršio Njegovu naredbu, borio se na Njegovu putu, iskreno savjetovao svoj ummet i robovao Mu sve dok mu od Njega nije došla izvjesnost, ne podbacujući u dostavljanju i ne posustajući u borbi. Neka mu Allah podari najbolji i najčistiji blagoslov i neka mu podari mir.","ar_ranges":[],"bs_ranges":[]}],"ar":"الجزء الأول\n\nبِسْمِ اللَّهِ الرَّحْمنِ الرَّحِيمِ\n\nالحمد لله الأول قبل كل أول، والآخر بعد كل آخر، والدائم بلا زوال، والقائم على كل شيء بغير انتقال، والخالق خلقه من غير اصل ولا مثال، فهو الفرد الواحد من غير عدد، وهو الباقي بعد كل أحد، إلى غير نهاية ولا أمد له الكبرياء والعظمه، والبهاء والعزه، والسلطان والقدرة، تعالى عن أن يكون له شريك في سلطانه او في وحدانيته نديد، أو في تدبيره معين أو ظهير، أو أن يكون له ولد، أو صاحبه او كفء أحد، لا تحيط به الأوهام، ولا تحويه الأقطار، ولا تُدْرِكُهُ الْأَبْصارُ، وهو يدرك الأبصار، وهو اللطيف الخبير.\n\nأحمده على آلائه، وأشكره على نعمائه، حمد من أفرده بالحمد، وشكر من رجا بالشكر منه المزيد، وأستهديه من القول والعمل لما يقربني منه ويرضيه، وأومن به إيمان مخلص له التوحيد، ومفرد له التمجيد.\n\nوَأَشْهَدُ أَنْ لا إِلَهَ إِلا اللَّهُ وَحْدَهُ لا شريك له، وأشهد أن محمدا عبده النجيب، ورسوله الأمين، اصطفاه لرسالته، وابتعثه بوحيه، داعيا خلقه إلى عبادته، فصدع بأمره، وجاهد في سبيله، ونصح لأمته، وعبده حتى أتاه اليقين من عنده، غير مقصر في بلاغ، ولا وان في جهاد، صلى الله عليه أفضل صلاة وأزكاها، وسلم"},{"n":4,"paragraphs":[{"id":"4.1","ar":"أما بعد، فإن الله جل جلاله، وتقدست أسماؤه، خلق خلقه من غير ضرورة كانت به إلى خلقهم، وأنشأهم من غير حاجة كانت به إلى إنشائهم، بل خلق من خصه منهم بامره ونهيه، وامتحنه بعبادته، ليعبدوه فيجود عليهم بنعمه، وليحمدوه على نعمه فيزيدهم من فضله ومننه، ويسبغ عليهم فضله وطوله، كما قال عز وجل: «وَما خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ مَا أُرِيدُ مِنْهُمْ مِنْ رِزْقٍ وَما أُرِيدُ أَنْ يُطْعِمُونِ إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ» .","bs":"A zatim: Allah, veličanstvena je Njegova uzvišenost i sveta su Njegova imena, stvorio je Svoja stvorenja bez ikakve nužde koja bi Ga na njihovo stvaranje navela i načinio ih bez ikakve potrebe za njihovim nastankom. Naprotiv, one među njima koje je izdvojio Svojom naredbom i zabranom i iskušao robovanjem Njemu stvorio je da Mu robuju, pa da ih On obdari Svojim blagodatima, i da Ga hvale za Njegove blagodati, pa da im poveća Svoju dobrotu i darove i obilno im podari Svoju milost i dobročinstvo, kao što je rekao Silni i Uzvišeni: ⟦Kur’anski navod, prijevod, 51:56–58⟧ „Džine i ljude stvorio sam samo da Mi robuju. Ne tražim od njih nikakvu opskrbu i ne tražim da Me hrane. Zaista je Allah Opskrbitelj, Posjednik snage, Čvrsti.“","ar_html":"أما بعد، فإن الله جل جلاله، وتقدست أسماؤه، خلق خلقه من غير ضرورة كانت به إلى خلقهم، وأنشأهم من غير حاجة كانت به إلى إنشائهم، بل خلق من خصه منهم بامره ونهيه، وامتحنه بعبادته، ليعبدوه فيجود عليهم بنعمه، وليحمدوه على نعمه فيزيدهم من فضله ومننه، ويسبغ عليهم فضله وطوله، كما قال عز وجل: «وَما خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ مَا أُرِيدُ مِنْهُمْ مِنْ رِزْقٍ وَما أُرِيدُ أَنْ يُطْعِمُونِ إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ» .","bs_html":"A zatim: Allah, veličanstvena je Njegova uzvišenost i sveta su Njegova imena, stvorio je Svoja stvorenja bez ikakve nužde koja bi Ga na njihovo stvaranje navela i načinio ih bez ikakve potrebe za njihovim nastankom. Naprotiv, one među njima koje je izdvojio Svojom naredbom i zabranom i iskušao robovanjem Njemu stvorio je da Mu robuju, pa da ih On obdari Svojim blagodatima, i da Ga hvale za Njegove blagodati, pa da im poveća Svoju dobrotu i darove i obilno im podari Svoju milost i dobročinstvo, kao što je rekao Silni i Uzvišeni: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 51:56–58⟧\u003c/span> „Džine i ljude stvorio sam samo da Mi robuju. Ne tražim od njih nikakvu opskrbu i ne tražim da Me hrane. Zaista je Allah Opskrbitelj, Posjednik snage, Čvrsti.“","ar_ranges":[],"bs_ranges":[]},{"id":"4.2","ar":"فلم يزده خلقه إياهم- إذ خلقهم- في سلطانه على ما لم يزل قبل خلقه إياهم مثقال ذرة، ولا هو إن أفناهم واعدمهم ينقصه افناؤه إياهم ميزان شعره، لأنه لا تغيره الأحوال، ولا يدخله الملال، ولا ينقص سلطانه الأيام والليال، لأنه خالق الدهور والأزمان، فعم جميعهم في العاجل فضله وجوده، وشملهم كرمه وطوله، فجعل لهم أسماعا وأبصارا وأفئدة، وخصهم بعقول يصلون بها الى التمييز بين الحق والباطل، ويعرفون بها المنافع والمضار، وجعل لهم الأرض بساطا ليسلكوا منها سبلا فجاجا، والسماء سقفا محفوظا، وبناء مسموكا، وأنزل لهم منها الغيث بالإدرار، والأرزاق بالمقدار، واجرى لهم فيها قمر الليل وشمس النهار يتعاقبان بمصالحهم دائبين، فجعل لهم الليل لباسا، والنهار معاشا، وخالف- منًّا مِنْه عليهم وتطولا- بين قمر الليل وشمس النهار، فمحا آية الليل وجعل آية النهار مبصرة، كما قال جل جلاله وتقدست أسماؤه: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً لِتَبْتَغُوا فَضْلًا","bs":"Njegovo stvaranje njih — kada ih je stvorio — nije Njegovu vlast, u odnosu na ono kakva je oduvijek bila prije njihova stvaranja, povećalo ni za težinu trunke. Niti bi, kada bi ih uništio i doveo u nepostojanje, njihovo uništenje umanjilo Njegovu vlast za težinu dlake. Jer Njega stanja ne mijenjaju, zamor Mu ne dolazi i dani i noći ne umanjuju Njegovu vlast, jer je On Stvoritelj vjekova i vremena. Sve ih je u ovom životu obuhvatila Njegova dobrota i darežljivost, a Njegova plemenitost i dobročinstvo obuhvatili su ih sve. Dao im je sluh, vid i srca i izdvojio ih razumima kojima mogu razlikovati istinu od neistine i prepoznavati koristi i štete. Učinio im je Zemlju prostirkom da po njoj prolaze prostranim putevima, a nebo zaštićenim svodom i visoko uzdignutim zdanjem. S njega im je spuštao kišu u obilju i opskrbu u određenoj mjeri. Po njemu im je pokrenuo noćni Mjesec i dnevno Sunce da se, neprestano djelujući za njihovu korist, smjenjuju. Učinio im je noć pokrivalom, a dan vremenom za stjecanje sredstava za život. Kao dar i dobročinstvo prema njima, načinio je razliku između noćnog Mjeseca i dnevnog Sunca: izbrisao je znak noći, a znak dana učinio vidljivim, kao što je rekao, veličanstvena je Njegova uzvišenost i sveta su Njegova imena: ⟦Kur’anski navod, prijevod, 17:12, nastavlja se⟧ „Noć i dan učinili smo dvama znakovima, pa smo znak noći izbrisali, a znak dana učinili vidljivim, da biste tražili dobrotu","ar_html":"فلم يزده خلقه إياهم- إذ خلقهم- في سلطانه على ما لم يزل قبل خلقه إياهم مثقال ذرة، ولا هو إن أفناهم واعدمهم ينقصه افناؤه إياهم ميزان شعره، لأنه لا تغيره الأحوال، ولا يدخله الملال، ولا ينقص سلطانه الأيام والليال، لأنه خالق الدهور والأزمان، فعم جميعهم في العاجل فضله وجوده، وشملهم كرمه وطوله، فجعل لهم أسماعا وأبصارا وأفئدة، وخصهم بعقول يصلون بها الى التمييز بين الحق والباطل، ويعرفون بها المنافع والمضار، وجعل لهم الأرض بساطا ليسلكوا منها سبلا فجاجا، والسماء سقفا محفوظا، وبناء مسموكا، وأنزل لهم منها الغيث بالإدرار، والأرزاق بالمقدار، واجرى لهم فيها قمر الليل وشمس النهار يتعاقبان بمصالحهم دائبين، فجعل لهم الليل لباسا، والنهار معاشا، وخالف- منًّا مِنْه عليهم وتطولا- بين قمر الليل وشمس النهار، فمحا آية الليل وجعل آية النهار مبصرة، كما قال جل جلاله وتقدست أسماؤه: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً لِتَبْتَغُوا فَضْلًا","bs_html":"Njegovo stvaranje njih — kada ih je stvorio — nije Njegovu vlast, u odnosu na ono kakva je oduvijek bila prije njihova stvaranja, povećalo ni za težinu trunke. Niti bi, kada bi ih uništio i doveo u nepostojanje, njihovo uništenje umanjilo Njegovu vlast za težinu dlake. Jer Njega stanja ne mijenjaju, zamor Mu ne dolazi i dani i noći ne umanjuju Njegovu vlast, jer je On Stvoritelj vjekova i vremena. Sve ih je u ovom životu obuhvatila Njegova dobrota i darežljivost, a Njegova plemenitost i dobročinstvo obuhvatili su ih sve. Dao im je sluh, vid i srca i izdvojio ih razumima kojima mogu razlikovati istinu od neistine i prepoznavati koristi i štete. Učinio im je Zemlju prostirkom da po njoj prolaze prostranim putevima, a nebo zaštićenim svodom i visoko uzdignutim zdanjem. S njega im je spuštao kišu u obilju i opskrbu u određenoj mjeri. Po njemu im je pokrenuo noćni Mjesec i dnevno Sunce da se, neprestano djelujući za njihovu korist, smjenjuju. Učinio im je noć pokrivalom, a dan vremenom za stjecanje sredstava za život. Kao dar i dobročinstvo prema njima, načinio je razliku između noćnog Mjeseca i dnevnog Sunca: izbrisao je znak noći, a znak dana učinio vidljivim, kao što je rekao, veličanstvena je Njegova uzvišenost i sveta su Njegova imena: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 17:12, nastavlja se⟧\u003c/span> „Noć i dan učinili smo dvama znakovima, pa smo znak noći izbrisali, a znak dana učinili vidljivim, da biste tražili dobrotu","ar_ranges":[],"bs_ranges":[]}],"ar":"أما بعد، فإن الله جل جلاله، وتقدست أسماؤه، خلق خلقه من غير ضرورة كانت به إلى خلقهم، وأنشأهم من غير حاجة كانت به إلى إنشائهم، بل خلق من خصه منهم بامره ونهيه، وامتحنه بعبادته، ليعبدوه فيجود عليهم بنعمه، وليحمدوه على نعمه فيزيدهم من فضله ومننه، ويسبغ عليهم فضله وطوله، كما قال عز وجل: «وَما خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ مَا أُرِيدُ مِنْهُمْ مِنْ رِزْقٍ وَما أُرِيدُ أَنْ يُطْعِمُونِ إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ» .\n\nفلم يزده خلقه إياهم- إذ خلقهم- في سلطانه على ما لم يزل قبل خلقه إياهم مثقال ذرة، ولا هو إن أفناهم واعدمهم ينقصه افناؤه إياهم ميزان شعره، لأنه لا تغيره الأحوال، ولا يدخله الملال، ولا ينقص سلطانه الأيام والليال، لأنه خالق الدهور والأزمان، فعم جميعهم في العاجل فضله وجوده، وشملهم كرمه وطوله، فجعل لهم أسماعا وأبصارا وأفئدة، وخصهم بعقول يصلون بها الى التمييز بين الحق والباطل، ويعرفون بها المنافع والمضار، وجعل لهم الأرض بساطا ليسلكوا منها سبلا فجاجا، والسماء سقفا محفوظا، وبناء مسموكا، وأنزل لهم منها الغيث بالإدرار، والأرزاق بالمقدار، واجرى لهم فيها قمر الليل وشمس النهار يتعاقبان بمصالحهم دائبين، فجعل لهم الليل لباسا، والنهار معاشا، وخالف- منًّا مِنْه عليهم وتطولا- بين قمر الليل وشمس النهار، فمحا آية الليل وجعل آية النهار مبصرة، كما قال جل جلاله وتقدست أسماؤه: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً لِتَبْتَغُوا فَضْلًا"},{"n":5,"paragraphs":[{"id":"5.1","ar":"مِنْ رَبِّكُمْ وَلِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسابَ وَكُلَّ شَيْءٍ فَصَّلْناهُ تَفْصِيلًا» .","bs":"od svoga Gospodara i da biste znali broj godina i računanje. I svaku smo stvar podrobno razjasnili.“ ⟦Završetak prijevoda kur’anskog navoda, 17:12.⟧","ar_html":"مِنْ رَبِّكُمْ وَلِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسابَ وَكُلَّ شَيْءٍ فَصَّلْناهُ تَفْصِيلًا» .","bs_html":"od svoga Gospodara i da biste znali broj godina i računanje. I svaku smo stvar podrobno razjasnili.“ \u003cspan class=\"translator-note\">⟦Završetak prijevoda kur’anskog navoda, 17:12.⟧\u003c/span>","ar_ranges":[],"bs_ranges":[]},{"id":"5.2","ar":"وليصلوا بذلك إلى العلم بأوقات فروضهم التي فرضها عليهم في ساعات الليل والنهار والشهور والسنين، من الصلوات والزكوات والحج والصيام وغير ذلك من فروضهم، وحين حل ديونهم وحقوقهم، كما قال عز وجل: «يَسْئَلُونَكَ عَنِ الْأَهِلَّةِ قُلْ هِيَ مَواقِيتُ لِلنَّاسِ وَالْحَجِّ» ، وقال: «هُوَ الَّذِي جَعَلَ الشَّمْسَ ضِياءً وَالْقَمَرَ نُوراً وَقَدَّرَهُ مَنازِلَ لِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسابَ مَا خَلَقَ اللَّهُ ذلِكَ إِلَّا بِالْحَقِّ يُفَصِّلُ الْآياتِ لِقَوْمٍ يَعْلَمُونَ إِنَّ فِي اخْتِلافِ اللَّيْلِ وَالنَّهارِ وَما خَلَقَ اللَّهُ فِي السَّماواتِ وَالْأَرْضِ لَآياتٍ لِقَوْمٍ يَتَّقُونَ» .","bs":"I da bi time došli do spoznaje vremena svojih obaveza koje im je propisao u satima noći i dana, mjesecima i godinama: namaza, zekata, hadža, posta i drugih njihovih obaveza, te vremena dospijeća njihovih dugova i prava, kao što je rekao Silni i Uzvišeni: ⟦Kur’anski navod, prijevod, 2:189⟧ „Pitaju te o mlađacima. Reci: Oni su oznake vremena ljudima i za hadž.“ I rekao je: ⟦Kur’anski navod, prijevod, 10:5–6⟧ „On je Sunce učinio sjajem, a Mjesec svjetlom i odredio mu položaje da biste znali broj godina i računanje. Allah je to stvorio samo s istinom. On podrobno izlaže znakove ljudima koji znaju. Zaista u smjeni noći i dana i u onome što je Allah stvorio na nebesima i na Zemlji postoje znakovi za ljude koji se čuvaju.“","ar_html":"وليصلوا بذلك إلى العلم بأوقات فروضهم التي فرضها عليهم في ساعات الليل والنهار والشهور والسنين، من الصلوات والزكوات والحج والصيام وغير ذلك من فروضهم، وحين حل ديونهم وحقوقهم، كما قال عز وجل: «يَسْئَلُونَكَ عَنِ الْأَهِلَّةِ قُلْ هِيَ مَواقِيتُ لِلنَّاسِ وَالْحَجِّ» ، وقال: «هُوَ الَّذِي جَعَلَ الشَّمْسَ ضِياءً وَالْقَمَرَ نُوراً وَقَدَّرَهُ مَنازِلَ لِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسابَ مَا خَلَقَ اللَّهُ ذلِكَ إِلَّا بِالْحَقِّ يُفَصِّلُ الْآياتِ لِقَوْمٍ يَعْلَمُونَ إِنَّ فِي اخْتِلافِ اللَّيْلِ وَالنَّهارِ وَما خَلَقَ اللَّهُ فِي السَّماواتِ وَالْأَرْضِ لَآياتٍ لِقَوْمٍ يَتَّقُونَ» .","bs_html":"I da bi time došli do spoznaje vremena svojih obaveza koje im je propisao u satima noći i dana, mjesecima i godinama: namaza, zekata, hadža, posta i drugih njihovih obaveza, te vremena dospijeća njihovih dugova i prava, kao što je rekao Silni i Uzvišeni: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 2:189⟧\u003c/span> „Pitaju te o mlađacima. Reci: Oni su oznake vremena ljudima i za hadž.“ I rekao je: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 10:5–6⟧\u003c/span> „On je Sunce učinio sjajem, a Mjesec svjetlom i odredio mu položaje da biste znali broj godina i računanje. Allah je to stvorio samo s istinom. On podrobno izlaže znakove ljudima koji znaju. Zaista u smjeni noći i dana i u onome što je Allah stvorio na nebesima i na Zemlji postoje znakovi za ljude koji se čuvaju.“","ar_ranges":[],"bs_ranges":[]},{"id":"5.3","ar":"إنعاما منه بكل ذلك على خلقه، وتفضلا منه به عليهم وتطولا، فشَكَره على نعمه التي أنعمها عليهم من خلقه خَلْق عظيم، فزاد كثيرا منهم من آلائه وأياديه، على ما ابتدأهم به من فضله وطوله، كما وعدهم جل جلاله بقوله: «وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِنْ شَكَرْتُمْ لَأَزِيدَنَّكُمْ وَلَئِنْ كَفَرْتُمْ إِنَّ عَذابِي لَشَدِيدٌ» ، وجمع لهم الى الزيادة التي زادهم في عاجل دنياهم، الفوز بالنعيم المقيم، والخلود في جنات النعيم، في آجل آخرتهم وأخر لكثير منهم الزيادة التي وعدهم فمدهم الى حين مصيرهم اليه ووقت قدومهم عليه، توفيرا منه كرامته عليهم يوم تبلى السرائر وكفر نعمه خلق منهم عظيم، فجحدوا آلاءه وعبدوا سواه، فسلب كثيرا منهم ما ابتدأهم به من الفضل والإحسان، وأحل","bs":"Sve je to učinio kao blagodat Svojim stvorenjima, kao dobrotu i dobročinstvo prema njima. Veliko mnoštvo Njegovih stvorenja zahvaljivalo Mu je za blagodati kojima ih je obdario, pa je mnogima među njima povećao Svoje blagodati i darove povrh dobrote i dobročinstva kojima ih je na početku obasuo, kao što im je obećao, veličanstvena je Njegova uzvišenost, riječima: ⟦Kur’anski navod, prijevod, 14:7⟧ „I kada je vaš Gospodar obznanio: Ako budete zahvalni, sigurno ću vam povećati; a ako budete nezahvalni, Moja je kazna zaista žestoka.“ Povećanju koje im je podario u njihovom sadašnjem zemaljskom životu pridružio je uspjeh u trajnoj blagodati i vječni boravak u baščama uživanja u njihovom budućem životu na onom svijetu. Mnogima među njima odgodio je povećanje koje im je obećao i ostavio im rok do njihova povratka Njemu i vremena njihova dolaska pred Njega, da bi im Svoju počast u punini dao na Dan kada budu ispitivane tajne. A veliko mnoštvo njih pokazalo je nezahvalnost za Njegove blagodati: poricali su Njegove darove i robovali drugome mimo Njega. Mnogima među njima oduzeo je dobrotu i dobročinstvo kojima ih je na početku obdario i spustio je","ar_html":"إنعاما منه بكل ذلك على خلقه، وتفضلا منه به عليهم وتطولا، فشَكَره على نعمه التي أنعمها عليهم من خلقه خَلْق عظيم، فزاد كثيرا منهم من آلائه وأياديه، على ما ابتدأهم به من فضله وطوله، كما وعدهم جل جلاله بقوله: «وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِنْ شَكَرْتُمْ لَأَزِيدَنَّكُمْ وَلَئِنْ كَفَرْتُمْ إِنَّ عَذابِي لَشَدِيدٌ» ، وجمع لهم الى الزيادة التي زادهم في عاجل دنياهم، الفوز بالنعيم المقيم، والخلود في جنات النعيم، في آجل آخرتهم وأخر لكثير منهم الزيادة التي وعدهم فمدهم الى حين مصيرهم اليه ووقت قدومهم عليه، توفيرا منه كرامته عليهم يوم تبلى السرائر وكفر نعمه خلق منهم عظيم، فجحدوا آلاءه وعبدوا سواه، فسلب كثيرا منهم ما ابتدأهم به من الفضل والإحسان، وأحل","bs_html":"Sve je to učinio kao blagodat Svojim stvorenjima, kao dobrotu i dobročinstvo prema njima. Veliko mnoštvo Njegovih stvorenja zahvaljivalo Mu je za blagodati kojima ih je obdario, pa je mnogima među njima povećao Svoje blagodati i darove povrh dobrote i dobročinstva kojima ih je na početku obasuo, kao što im je obećao, veličanstvena je Njegova uzvišenost, riječima: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 14:7⟧\u003c/span> „I kada je vaš Gospodar obznanio: Ako budete zahvalni, sigurno ću vam povećati; a ako budete nezahvalni, Moja je kazna zaista žestoka.“ Povećanju koje im je podario u njihovom sadašnjem zemaljskom životu pridružio je uspjeh u trajnoj blagodati i vječni boravak u baščama uživanja u njihovom budućem životu na onom svijetu. Mnogima među njima odgodio je povećanje koje im je obećao i ostavio im rok do njihova povratka Njemu i vremena njihova dolaska pred Njega, da bi im Svoju počast u punini dao na Dan kada budu ispitivane tajne. A veliko mnoštvo njih pokazalo je nezahvalnost za Njegove blagodati: poricali su Njegove darove i robovali drugome mimo Njega. Mnogima među njima oduzeo je dobrotu i dobročinstvo kojima ih je na početku obdario i spustio je","ar_ranges":[],"bs_ranges":[]}],"ar":"مِنْ رَبِّكُمْ وَلِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسابَ وَكُلَّ شَيْءٍ فَصَّلْناهُ تَفْصِيلًا» .\n\nوليصلوا بذلك إلى العلم بأوقات فروضهم التي فرضها عليهم في ساعات الليل والنهار والشهور والسنين، من الصلوات والزكوات والحج والصيام وغير ذلك من فروضهم، وحين حل ديونهم وحقوقهم، كما قال عز وجل: «يَسْئَلُونَكَ عَنِ الْأَهِلَّةِ قُلْ هِيَ مَواقِيتُ لِلنَّاسِ وَالْحَجِّ» ، وقال: «هُوَ الَّذِي جَعَلَ الشَّمْسَ ضِياءً وَالْقَمَرَ نُوراً وَقَدَّرَهُ مَنازِلَ لِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسابَ مَا خَلَقَ اللَّهُ ذلِكَ إِلَّا بِالْحَقِّ يُفَصِّلُ الْآياتِ لِقَوْمٍ يَعْلَمُونَ إِنَّ فِي اخْتِلافِ اللَّيْلِ وَالنَّهارِ وَما خَلَقَ اللَّهُ فِي السَّماواتِ وَالْأَرْضِ لَآياتٍ لِقَوْمٍ يَتَّقُونَ» .\n\nإنعاما منه بكل ذلك على خلقه، وتفضلا منه به عليهم وتطولا، فشَكَره على نعمه التي أنعمها عليهم من خلقه خَلْق عظيم، فزاد كثيرا منهم من آلائه وأياديه، على ما ابتدأهم به من فضله وطوله، كما وعدهم جل جلاله بقوله: «وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِنْ شَكَرْتُمْ لَأَزِيدَنَّكُمْ وَلَئِنْ كَفَرْتُمْ إِنَّ عَذابِي لَشَدِيدٌ» ، وجمع لهم الى الزيادة التي زادهم في عاجل دنياهم، الفوز بالنعيم المقيم، والخلود في جنات النعيم، في آجل آخرتهم وأخر لكثير منهم الزيادة التي وعدهم فمدهم الى حين مصيرهم اليه ووقت قدومهم عليه، توفيرا منه كرامته عليهم يوم تبلى السرائر وكفر نعمه خلق منهم عظيم، فجحدوا آلاءه وعبدوا سواه، فسلب كثيرا منهم ما ابتدأهم به من الفضل والإحسان، وأحل"},{"n":6,"ar":"بهم النقمة المهلكة في العاجل، وذخر لهم العقوبة المخزية في الآجل، ومتع كثيرا منهم بنعمه ايام حياتهم استدراجا منه لهم، وتوقيرا منه عليهم أوزارهم، ليستحقوا من عقوبته في الآجل ما قد أعد لهم.\n\nنعوذ بالله من عمل يقرب من سخطه، ونسأله التوفيق لما يدني من رضاه ومحبته.\n\nقال أبو جعفر: وأنا ذاكر في كتابي هذا من ملوك كل زمان، من لدن ابتدأ ربنا جل جلاله خلق خلقه إلى حال فنائهم، من انتهى إلينا خبره ممن ابتدأه الله تعالى بآلائه ونعمه فشكر نعمه، من رسول له مرسل، أو ملك مسلط، أو خليفة مستخلف، فزاده إلى ما ابتدأه به من نعمه في العاجل نعما، وإلى ما تفضل به عليه فضلا، ومن أخر ذلك له منهم، وجعله له عنده ذخرا ومن كفر منهم نعمه فسلبه ما ابتدأه به من نعمه، وعجل له نقمه ومن كفر منهم نعمه فمتعه بما أنعم به عليه إلى حين وفاته وهلاكه، مقرونا ذكر كل من أنا ذاكره منهم في كتابي هذا بذكر زمانه، وجمل ما كان من حوادث الأمور في عصره وأيامه، إذ كان الاستقصاء في ذلك يقصر عنه العمر، وتطول به الكتب، مع ذكري مع ذلك مبلغ مدة أكله، وحين أجله، بعد تقديمي أمام ذلك ما تقديمه بنا أولى، والابتداء به قبله أحجى، من البيان عن الزمان: ما هو؟ وكم قدر جميعه، وابتداء أوله، وانتهاء آخره؟ وهل كان قبل خلق الله تعالى إياه شيء غيره؟ وهل هو فان؟ وهل بعد فنائه شيء غير وجه المسبح الخلاق، تعالى ذكره؟\n\nوما الذي كان قبل خلق الله إياه؟ وما هو كائن بعد فنائه وانقضائه؟ وكيف","bs":"\u003cp class=\"small\" style=\"color:#53675c\">Napomena prevodioca: početak stranice nastavlja posljednju rečenicu stranice 5.\u003c/p>\u003cp data-paragraph=\"6.1\">na njih uništavajuću kaznu u ovom životu, a za budući im je sačuvao ponižavajuću kaznu. Mnogima među njima dopuštao je da uživaju u Njegovim blagodatima tokom dana svoga života, postepeno ih tako privodeći kazni i umnožavajući im terete grijeha, kako bi u budućem životu zaslužili kaznu koju im je pripremio.\u003c/p>\u003cp data-paragraph=\"6.2\">Utječemo se Allahu od djela koje približava Njegovoj srdžbi i molimo Ga za uspjeh u onome što približava Njegovu zadovoljstvu i ljubavi.\u003c/p>\u003cp data-paragraph=\"6.3\">Ebu Džafer je rekao: U ovoj svojoj knjizi spomenut ću, među vladarima svakoga vremena, od kada je naš Gospodar, veličanstvena je Njegova uzvišenost, započeo stvaranje Svojih stvorenja pa do stanja njihova nestanka, one o kojima su do nas stigle vijesti: one koje je Allah Uzvišeni najprije obdario Svojim darovima i blagodatima, pa su zahvaljivali za Njegove blagodati, bilo da je riječ o Njegovu poslanom poslaniku, vladaru kojem je data vlast ili halifi postavljenom za nasljednika, pa im je On blagodatima kojima ih je na početku obdario u ovom životu dodao druge blagodati i dobroti koju im je ukazao dodao novu dobrotu; i one kojima je to odgodio i kod Sebe im to učinio zalihom; i one među njima koji su bili nezahvalni za Njegove blagodati, pa im je oduzeo blagodati kojima ih je na početku obdario i ubrzao im Svoju kaznu; i one među njima koji su bili nezahvalni za Njegove blagodati, pa im je ipak dopuštao da uživaju u onome čime ih je obdario do vremena njihove smrti i propasti. Spomen svakoga koga budem spominjao u ovoj svojoj knjizi povezat ću sa spomenom njegova vremena i općim prikazom događaja u njegovu dobu i njegovim danima, jer bi iscrpno istraživanje toga premašilo životni vijek i produžilo knjige. Uz to ću spominjati dužinu vremena njegova uživanja u opskrbi i čas njegova kraja, nakon što tome prethodno izložim ono što je prikladnije da izložimo prvo i razložnije da time započnemo prije toga: objašnjenje vremena — šta je ono; koliko je ukupno njegovo trajanje; početak njegova prvog dijela i završetak njegova posljednjeg; je li prije nego što ga je Allah Uzvišeni stvorio postojalo nešto drugo; hoće li ono nestati; i hoće li nakon njegova nestanka postojati išta osim lica Stvoritelja, kojem se slava iskazuje, uzvišen je Njegov spomen?\u003c/p>\u003cp data-paragraph=\"6.4\">Šta je postojalo prije nego što ga je Allah stvorio? Šta će postojati nakon njegova nestanka i završetka? Kako\u003c/p>","paragraphs":[{"id":"6.1","ar":"بهم النقمة المهلكة في العاجل، وذخر لهم العقوبة المخزية في الآجل، ومتع كثيرا منهم بنعمه ايام حياتهم استدراجا منه لهم، وتوقيرا منه عليهم أوزارهم، ليستحقوا من عقوبته في الآجل ما قد أعد لهم.","bs":"na njih uništavajuću kaznu u ovom životu, a za budući im je sačuvao ponižavajuću kaznu. Mnogima među njima dopuštao je da uživaju u Njegovim blagodatima tokom dana svoga života, postepeno ih tako privodeći kazni i umnožavajući im terete grijeha, kako bi u budućem životu zaslužili kaznu koju im je pripremio.","ar_ranges":[],"ar_html":"بهم النقمة المهلكة في العاجل، وذخر لهم العقوبة المخزية في الآجل، ومتع كثيرا منهم بنعمه ايام حياتهم استدراجا منه لهم، وتوقيرا منه عليهم أوزارهم، ليستحقوا من عقوبته في الآجل ما قد أعد لهم.","bs_ranges":[],"bs_html":"na njih uništavajuću kaznu u ovom životu, a za budući im je sačuvao ponižavajuću kaznu. Mnogima među njima dopuštao je da uživaju u Njegovim blagodatima tokom dana svoga života, postepeno ih tako privodeći kazni i umnožavajući im terete grijeha, kako bi u budućem životu zaslužili kaznu koju im je pripremio."},{"id":"6.2","ar":"نعوذ بالله من عمل يقرب من سخطه، ونسأله التوفيق لما يدني من رضاه ومحبته.","bs":"Utječemo se Allahu od djela koje približava Njegovoj srdžbi i molimo Ga za uspjeh u onome što približava Njegovu zadovoljstvu i ljubavi.","ar_ranges":[],"ar_html":"نعوذ بالله من عمل يقرب من سخطه، ونسأله التوفيق لما يدني من رضاه ومحبته.","bs_ranges":[],"bs_html":"Utječemo se Allahu od djela koje približava Njegovoj srdžbi i molimo Ga za uspjeh u onome što približava Njegovu zadovoljstvu i ljubavi."},{"id":"6.3","ar":"قال أبو جعفر: وأنا ذاكر في كتابي هذا من ملوك كل زمان، من لدن ابتدأ ربنا جل جلاله خلق خلقه إلى حال فنائهم، من انتهى إلينا خبره ممن ابتدأه الله تعالى بآلائه ونعمه فشكر نعمه، من رسول له مرسل، أو ملك مسلط، أو خليفة مستخلف، فزاده إلى ما ابتدأه به من نعمه في العاجل نعما، وإلى ما تفضل به عليه فضلا، ومن أخر ذلك له منهم، وجعله له عنده ذخرا ومن كفر منهم نعمه فسلبه ما ابتدأه به من نعمه، وعجل له نقمه ومن كفر منهم نعمه فمتعه بما أنعم به عليه إلى حين وفاته وهلاكه، مقرونا ذكر كل من أنا ذاكره منهم في كتابي هذا بذكر زمانه، وجمل ما كان من حوادث الأمور في عصره وأيامه، إذ كان الاستقصاء في ذلك يقصر عنه العمر، وتطول به الكتب، مع ذكري مع ذلك مبلغ مدة أكله، وحين أجله، بعد تقديمي أمام ذلك ما تقديمه بنا أولى، والابتداء به قبله أحجى، من البيان عن الزمان: ما هو؟ وكم قدر جميعه، وابتداء أوله، وانتهاء آخره؟ وهل كان قبل خلق الله تعالى إياه شيء غيره؟ وهل هو فان؟ وهل بعد فنائه شيء غير وجه المسبح الخلاق، تعالى ذكره؟","bs":"Ebu Džafer je rekao: U ovoj svojoj knjizi spomenut ću, među vladarima svakoga vremena, od kada je naš Gospodar, veličanstvena je Njegova uzvišenost, započeo stvaranje Svojih stvorenja pa do stanja njihova nestanka, one o kojima su do nas stigle vijesti: one koje je Allah Uzvišeni najprije obdario Svojim darovima i blagodatima, pa su zahvaljivali za Njegove blagodati, bilo da je riječ o Njegovu poslanom poslaniku, vladaru kojem je data vlast ili halifi postavljenom za nasljednika, pa im je On blagodatima kojima ih je na početku obdario u ovom životu dodao druge blagodati i dobroti koju im je ukazao dodao novu dobrotu; i one kojima je to odgodio i kod Sebe im to učinio zalihom; i one među njima koji su bili nezahvalni za Njegove blagodati, pa im je oduzeo blagodati kojima ih je na početku obdario i ubrzao im Svoju kaznu; i one među njima koji su bili nezahvalni za Njegove blagodati, pa im je ipak dopuštao da uživaju u onome čime ih je obdario do vremena njihove smrti i propasti. Spomen svakoga koga budem spominjao u ovoj svojoj knjizi povezat ću sa spomenom njegova vremena i općim prikazom događaja u njegovu dobu i njegovim danima, jer bi iscrpno istraživanje toga premašilo životni vijek i produžilo knjige. Uz to ću spominjati dužinu vremena njegova uživanja u opskrbi i čas njegova kraja, nakon što tome prethodno izložim ono što je prikladnije da izložimo prvo i razložnije da time započnemo prije toga: objašnjenje vremena — šta je ono; koliko je ukupno njegovo trajanje; početak njegova prvog dijela i završetak njegova posljednjeg; je li prije nego što ga je Allah Uzvišeni stvorio postojalo nešto drugo; hoće li ono nestati; i hoće li nakon njegova nestanka postojati išta osim lica Stvoritelja, kojem se slava iskazuje, uzvišen je Njegov spomen?","ar_ranges":[],"ar_html":"قال أبو جعفر: وأنا ذاكر في كتابي هذا من ملوك كل زمان، من لدن ابتدأ ربنا جل جلاله خلق خلقه إلى حال فنائهم، من انتهى إلينا خبره ممن ابتدأه الله تعالى بآلائه ونعمه فشكر نعمه، من رسول له مرسل، أو ملك مسلط، أو خليفة مستخلف، فزاده إلى ما ابتدأه به من نعمه في العاجل نعما، وإلى ما تفضل به عليه فضلا، ومن أخر ذلك له منهم، وجعله له عنده ذخرا ومن كفر منهم نعمه فسلبه ما ابتدأه به من نعمه، وعجل له نقمه ومن كفر منهم نعمه فمتعه بما أنعم به عليه إلى حين وفاته وهلاكه، مقرونا ذكر كل من أنا ذاكره منهم في كتابي هذا بذكر زمانه، وجمل ما كان من حوادث الأمور في عصره وأيامه، إذ كان الاستقصاء في ذلك يقصر عنه العمر، وتطول به الكتب، مع ذكري مع ذلك مبلغ مدة أكله، وحين أجله، بعد تقديمي أمام ذلك ما تقديمه بنا أولى، والابتداء به قبله أحجى، من البيان عن الزمان: ما هو؟ وكم قدر جميعه، وابتداء أوله، وانتهاء آخره؟ وهل كان قبل خلق الله تعالى إياه شيء غيره؟ وهل هو فان؟ وهل بعد فنائه شيء غير وجه المسبح الخلاق، تعالى ذكره؟","bs_ranges":[],"bs_html":"Ebu Džafer je rekao: U ovoj svojoj knjizi spomenut ću, među vladarima svakoga vremena, od kada je naš Gospodar, veličanstvena je Njegova uzvišenost, započeo stvaranje Svojih stvorenja pa do stanja njihova nestanka, one o kojima su do nas stigle vijesti: one koje je Allah Uzvišeni najprije obdario Svojim darovima i blagodatima, pa su zahvaljivali za Njegove blagodati, bilo da je riječ o Njegovu poslanom poslaniku, vladaru kojem je data vlast ili halifi postavljenom za nasljednika, pa im je On blagodatima kojima ih je na početku obdario u ovom životu dodao druge blagodati i dobroti koju im je ukazao dodao novu dobrotu; i one kojima je to odgodio i kod Sebe im to učinio zalihom; i one među njima koji su bili nezahvalni za Njegove blagodati, pa im je oduzeo blagodati kojima ih je na početku obdario i ubrzao im Svoju kaznu; i one među njima koji su bili nezahvalni za Njegove blagodati, pa im je ipak dopuštao da uživaju u onome čime ih je obdario do vremena njihove smrti i propasti. Spomen svakoga koga budem spominjao u ovoj svojoj knjizi povezat ću sa spomenom njegova vremena i općim prikazom događaja u njegovu dobu i njegovim danima, jer bi iscrpno istraživanje toga premašilo životni vijek i produžilo knjige. Uz to ću spominjati dužinu vremena njegova uživanja u opskrbi i čas njegova kraja, nakon što tome prethodno izložim ono što je prikladnije da izložimo prvo i razložnije da time započnemo prije toga: objašnjenje vremena — šta je ono; koliko je ukupno njegovo trajanje; početak njegova prvog dijela i završetak njegova posljednjeg; je li prije nego što ga je Allah Uzvišeni stvorio postojalo nešto drugo; hoće li ono nestati; i hoće li nakon njegova nestanka postojati išta osim lica Stvoritelja, kojem se slava iskazuje, uzvišen je Njegov spomen?"},{"id":"6.4","ar":"وما الذي كان قبل خلق الله إياه؟ وما هو كائن بعد فنائه وانقضائه؟ وكيف","bs":"Šta je postojalo prije nego što ga je Allah stvorio? Šta će postojati nakon njegova nestanka i završetka? Kako","ar_ranges":[],"ar_html":"وما الذي كان قبل خلق الله إياه؟ وما هو كائن بعد فنائه وانقضائه؟ وكيف","bs_ranges":[],"bs_html":"Šta je postojalo prije nego što ga je Allah stvorio? Šta će postojati nakon njegova nestanka i završetka? Kako"}],"notes":[]},{"n":7,"ar":"كان ابتداء خلق الله تعالى إياه؟ وكيف يكون فناؤه؟ والدلالة على أن لا قديم إلا الله الواحد القهار، الذي له ملك السموات والأرض وما بينهما وما تحت الثرى بوجيز من الدلالة غير طويل، إذ لم نقصد بكتابنا هذا قصد الاحتجاج لذلك، بل لما ذكرنا من تاريخ الملوك الماضين وجمل من أخبارهم، وأزمان الرسل والأنبياء ومقادير أعمارهم، وأيام الخلفاء السالفين وبعض سيرهم، ومبالغ ولاياتهم، والكائن الذي كان من الأحداث في أعصارهم ثم أنا متبع آخر ذلك كله- إن شاء الله وأيد منه بعون وقوة- ذكر صحابه نبينا محمد ص وأسمائهم وكناهم ومبالغ أنسابهم ومبالغ أعمارهم، ووقت وفاة كل إنسان منهم، والموضع الذي كانت به وفاته ثم متبعهم ذكر من كان بعدهم من التابعين لهم بإحسان، على نحو ما شرطنا من ذكرهم ثم ملحق بهم ذكر من كان بعدهم من الخلف لهم كذلك، وزائد في أمورهم للإبانة عمن حمدت منهم روايته، وتقبلت أخباره، ومن رفضت منهم روايته ونبذت أخباره، ومن وهن منهم نقله، وضعف خبره وما السبب الذي من أجله نبذ من نبذ منهم خبره، والعلة التي من أجلها وهن من وهن منهم نقله.\n\nوإلى الله عز وجل أنا راغب في العون على ما أقصده وأنويه، والتوفيق لما ألتمسه وأبغيه، فإنه ولي الحول والقوة، وصلى الله على محمد نبيه وآله وسلم تسليما.\n\nوليعلم الناظر في كتابنا هذا أن اعتمادي في كل ما أحضرت ذكره فيه مما شرطت أني راسمه فيه، إنما هو على ما رويت من الأخبار التي أنا ذاكرها فيه، والآثار التي أنا مسندها إلى رواتها فيه، دون ما أدرك بحجج العقول، واستنبط","bs":"\u003cp data-paragraph=\"7.1\">je Allah Uzvišeni započeo njegovo stvaranje i kako će ono nestati? I dokazivanje da nema ničega bespočetnog osim Allaha, Jedinoga, Svepotčinitelja, kojem pripada vlast nebesa i Zemlje, onoga što je između njih i onoga što je ispod tla, sažetim, a ne dugim dokazom, jer ovom našom knjigom nismo namjeravali dokazivati to, nego ono što smo spomenuli: historiju prošlih vladara i opće prikaze njihovih vijesti, vremena poslanika i vjerovjesnika i dužine njihovih života, dane prethodnih halifa i nešto od njihovih životopisa, trajanje njihovih vlasti i događaje koji su se zbili u njihovim razdobljima. Zatim ću svemu tome na kraju — ako Allah htjedne i potpomogne me Svojom pomoći i snagom — pridružiti spomen ashaba našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir, njihova imena, njihove nadimke, dokle sežu njihova rodoslovlja, dužine njihovih života, vrijeme smrti svakoga pojedinca među njima i mjesto u kojem je umro. Zatim ću za njima navesti spomen onih koji su ih slijedili u dobročinstvu, na način koji smo postavili kao uslov za njihovo spominjanje. Zatim ću im pridružiti spomen onih koji su došli poslije njih, na isti način, i dodati pojedinosti o njima radi razjašnjenja čije je prenošenje među njima pohvaljeno i čije su vijesti prihvaćene, čije je prenošenje odbačeno i čije su vijesti odbačene, čije je prenošenje ocijenjeno slabim i čija je vijest slaba, te koji je razlog zbog kojeg je odbačena vijest onoga čija je vijest odbačena i koji je uzrok zbog kojeg je oslabljeno prenošenje onoga čije je prenošenje oslabljeno.\u003c/p>\u003cp data-paragraph=\"7.2\">Allahu, Silan je i Uzvišen, obraćam se želeći pomoć u onome čemu težim i što namjeravam i uspjeh u onome što tražim i želim, jer On je Posjednik moći i snage. Neka Allah blagoslovi Muhammeda, Svoga vjerovjesnika, i njegovu porodicu i neka im podari potpuni mir.\u003c/p>\u003cp data-paragraph=\"7.3\">Neka onaj ko razmatra ovu našu knjigu zna da se moje oslanjanje, u svemu što sam u njoj spomenuo od onoga za šta sam postavio uslov da ću to u njoj zabilježiti, zasniva samo na vijestima koje su mi prenesene i koje u njoj navodim, i na predajama koje u njoj lancem prenosilaca pripisujem njihovim prenosiocima, a ne na onome što se spoznaje razumskim dokazima i izvodi\u003c/p>","paragraphs":[{"id":"7.1","ar":"كان ابتداء خلق الله تعالى إياه؟ وكيف يكون فناؤه؟ والدلالة على أن لا قديم إلا الله الواحد القهار، الذي له ملك السموات والأرض وما بينهما وما تحت الثرى بوجيز من الدلالة غير طويل، إذ لم نقصد بكتابنا هذا قصد الاحتجاج لذلك، بل لما ذكرنا من تاريخ الملوك الماضين وجمل من أخبارهم، وأزمان الرسل والأنبياء ومقادير أعمارهم، وأيام الخلفاء السالفين وبعض سيرهم، ومبالغ ولاياتهم، والكائن الذي كان من الأحداث في أعصارهم ثم أنا متبع آخر ذلك كله- إن شاء الله وأيد منه بعون وقوة- ذكر صحابه نبينا محمد ص وأسمائهم وكناهم ومبالغ أنسابهم ومبالغ أعمارهم، ووقت وفاة كل إنسان منهم، والموضع الذي كانت به وفاته ثم متبعهم ذكر من كان بعدهم من التابعين لهم بإحسان، على نحو ما شرطنا من ذكرهم ثم ملحق بهم ذكر من كان بعدهم من الخلف لهم كذلك، وزائد في أمورهم للإبانة عمن حمدت منهم روايته، وتقبلت أخباره، ومن رفضت منهم روايته ونبذت أخباره، ومن وهن منهم نقله، وضعف خبره وما السبب الذي من أجله نبذ من نبذ منهم خبره، والعلة التي من أجلها وهن من وهن منهم نقله.","bs":"je Allah Uzvišeni započeo njegovo stvaranje i kako će ono nestati? I dokazivanje da nema ničega bespočetnog osim Allaha, Jedinoga, Svepotčin
