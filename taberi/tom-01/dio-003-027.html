<!doctype html><html lang="bs"><head><meta charset="utf-8"><title>Taberi · tom 1 · 3–27</title></head><body><script id="partData" type="application/json">{"id":"01-001","start":3,"end":27,"pages":[{"n":3,"html":"\u003csection class=\"page\" data-page=\"3\" id=\"stranica-3\">\u003ch2>Stranica 3\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 3\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"3.1\" id=\"ar-odlomak-3-1\">الجزء الأول\u003c/p>\u003cp data-pair=\"3.2\" id=\"ar-odlomak-3-2\">بِسْمِ اللَّهِ الرَّحْمنِ الرَّحِيمِ\u003c/p>\u003cp data-pair=\"3.3\" id=\"ar-odlomak-3-3\">الحمد لله الأول قبل كل أول، والآخر بعد كل آخر، والدائم بلا زوال، والقائم على كل شيء بغير انتقال، والخالق خلقه من غير اصل ولا مثال، فهو الفرد الواحد من غير عدد، وهو الباقي بعد كل أحد، إلى غير نهاية ولا أمد له الكبرياء والعظمه، والبهاء والعزه، والسلطان والقدرة، تعالى عن أن يكون له شريك في سلطانه او في وحدانيته نديد، أو في تدبيره معين أو ظهير، أو أن يكون له ولد، أو صاحبه او كفء أحد، لا تحيط به الأوهام، ولا تحويه الأقطار، ولا تُدْرِكُهُ الْأَبْصارُ، وهو يدرك الأبصار، وهو اللطيف الخبير.\u003c/p>\u003cp data-pair=\"3.4\" id=\"ar-odlomak-3-4\">أحمده على آلائه، وأشكره على نعمائه، حمد من أفرده بالحمد، وشكر من رجا بالشكر منه المزيد، وأستهديه من القول والعمل لما يقربني منه ويرضيه، وأومن به إيمان مخلص له التوحيد، ومفرد له التمجيد.\u003c/p>\u003cp data-pair=\"3.5\" id=\"ar-odlomak-3-5\">وَأَشْهَدُ أَنْ لا إِلَهَ إِلا اللَّهُ وَحْدَهُ لا شريك له، وأشهد أن محمدا عبده النجيب، ورسوله الأمين، اصطفاه لرسالته، وابتعثه بوحيه، داعيا خلقه إلى عبادته، فصدع بأمره، وجاهد في سبيله، ونصح لأمته، وعبده حتى أتاه اليقين من عنده، غير مقصر في بلاغ، ولا وان في جهاد، صلى الله عليه أفضل صلاة وأزكاها، وسلم\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 3\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"3.1\" id=\"odlomak-3-1\">Prvi dio\u003c/p>\u003cp data-pair=\"3.2\" id=\"odlomak-3-2\">U ime Allaha, Milostivog, Samilosnog.\u003c/p>\u003cp data-pair=\"3.3\" id=\"odlomak-3-3\">Hvala Allahu, Prvom prije svakog prvog i Posljednjem poslije svakog posljednjeg, Trajnom bez prestanka, Onome koji nad svakom stvari stoji bez premještanja, Stvoritelju koji je Svoja stvorenja stvorio bez prethodne osnove i uzora. On je Jedini, Jedan bez broja, i On je Onaj koji ostaje poslije svakoga, bez kraja i roka. Njemu pripadaju veličanstvenost i veličina, sjaj i moć, vlast i sposobnost. Uzvišen je iznad toga da ima sudruga u Svojoj vlasti, takmaca u Svojoj jednosti, pomagača ili potporu u Svome upravljanju, ili da ima dijete, družicu ili ikoga Sebi ravnog. Predodžbe Ga ne obuhvataju, prostori Ga ne sadrže. \u003cspan class=\"translator-note\">⟦Kur’anski izraz, prijevod, 6:103⟧\u003c/span> „Pogledi Ga ne dostižu, a On dostiže poglede, i On je Blagi, o svemu Obaviješteni.“\u003c/p>\u003cp data-pair=\"3.4\" id=\"odlomak-3-4\">Hvalim Ga za Njegove blagodati i zahvaljujem Mu na Njegovim darovima, hvalom onoga koji samo Njemu posvećuje hvalu i zahvalnošću onoga koji se zahvaljivanjem nada uvećanju od Njega. Od Njega tražim uputu u govoru i djelu ka onome što će me Njemu približiti i čime će On biti zadovoljan. Vjerujem u Njega vjerovanjem onoga koji Mu iskreno priznaje jedinstvo i samo Njemu posvećuje veličanje.\u003c/p>\u003cp data-pair=\"3.5\" id=\"odlomak-3-5\">Svjedočim da nema boga osim Allaha Jedinoga, koji nema sudruga, i svjedočim da je Muhammed Njegov odabrani rob i Njegov povjerljivi poslanik. Izabrao ga je za Svoje poslanstvo i poslao ga sa Svojom objavom, da Njegova stvorenja poziva na robovanje Njemu. On je otvoreno izvršio Njegovu naredbu, borio se na Njegovu putu, iskreno savjetovao svoj ummet i robovao Mu sve dok mu od Njega nije došla izvjesnost, ne podbacujući u dostavljanju i ne posustajući u borbi. Neka mu Allah podari najbolji i najčistiji blagoslov i neka mu podari mir.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":4,"html":"\u003csection class=\"page\" data-page=\"4\" id=\"stranica-4\">\u003ch2>Stranica 4\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 4\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"4.1\" id=\"ar-odlomak-4-1\">أما بعد، فإن الله جل جلاله، وتقدست أسماؤه، خلق خلقه من غير ضرورة كانت به إلى خلقهم، وأنشأهم من غير حاجة كانت به إلى إنشائهم، بل خلق من خصه منهم بامره ونهيه، وامتحنه بعبادته، ليعبدوه فيجود عليهم بنعمه، وليحمدوه على نعمه فيزيدهم من فضله ومننه، ويسبغ عليهم فضله وطوله، كما قال عز وجل: «وَما خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ مَا أُرِيدُ مِنْهُمْ مِنْ رِزْقٍ وَما أُرِيدُ أَنْ يُطْعِمُونِ إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ» .\u003c/p>\u003cp data-pair=\"4.2\" id=\"ar-odlomak-4-2\">فلم يزده خلقه إياهم- إذ خلقهم- في سلطانه على ما لم يزل قبل خلقه إياهم مثقال ذرة، ولا هو إن أفناهم واعدمهم ينقصه افناؤه إياهم ميزان شعره، لأنه لا تغيره الأحوال، ولا يدخله الملال، ولا ينقص سلطانه الأيام والليال، لأنه خالق الدهور والأزمان، فعم جميعهم في العاجل فضله وجوده، وشملهم كرمه وطوله، فجعل لهم أسماعا وأبصارا وأفئدة، وخصهم بعقول يصلون بها الى التمييز بين الحق والباطل، ويعرفون بها المنافع والمضار، وجعل لهم الأرض بساطا ليسلكوا منها سبلا فجاجا، والسماء سقفا محفوظا، وبناء مسموكا، وأنزل لهم منها الغيث بالإدرار، والأرزاق بالمقدار، واجرى لهم فيها قمر الليل وشمس النهار يتعاقبان بمصالحهم دائبين، فجعل لهم الليل لباسا، والنهار معاشا، وخالف- منًّا مِنْه عليهم وتطولا- بين قمر الليل وشمس النهار، فمحا آية الليل وجعل آية النهار مبصرة، كما قال جل جلاله وتقدست أسماؤه: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً لِتَبْتَغُوا فَضْلًا\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 4\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"4.1\" id=\"odlomak-4-1\">A zatim: Allah, veličanstvena je Njegova uzvišenost i sveta su Njegova imena, stvorio je Svoja stvorenja bez ikakve nužde koja bi Ga na njihovo stvaranje navela i načinio ih bez ikakve potrebe za njihovim nastankom. Naprotiv, one među njima koje je izdvojio Svojom naredbom i zabranom i iskušao robovanjem Njemu stvorio je da Mu robuju, pa da ih On obdari Svojim blagodatima, i da Ga hvale za Njegove blagodati, pa da im poveća Svoju dobrotu i darove i obilno im podari Svoju milost i dobročinstvo, kao što je rekao Silni i Uzvišeni: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 51:56–58⟧\u003c/span> „Džine i ljude stvorio sam samo da Mi robuju. Ne tražim od njih nikakvu opskrbu i ne tražim da Me hrane. Zaista je Allah Opskrbitelj, Posjednik snage, Čvrsti.“\u003c/p>\u003cp data-pair=\"4.2\" id=\"odlomak-4-2\">Njegovo stvaranje njih — kada ih je stvorio — nije Njegovu vlast, u odnosu na ono kakva je oduvijek bila prije njihova stvaranja, povećalo ni za težinu trunke. Niti bi, kada bi ih uništio i doveo u nepostojanje, njihovo uništenje umanjilo Njegovu vlast za težinu dlake. Jer Njega stanja ne mijenjaju, zamor Mu ne dolazi i dani i noći ne umanjuju Njegovu vlast, jer je On Stvoritelj vjekova i vremena. Sve ih je u ovom životu obuhvatila Njegova dobrota i darežljivost, a Njegova plemenitost i dobročinstvo obuhvatili su ih sve. Dao im je sluh, vid i srca i izdvojio ih razumima kojima mogu razlikovati istinu od neistine i prepoznavati koristi i štete. Učinio im je Zemlju prostirkom da po njoj prolaze prostranim putevima, a nebo zaštićenim svodom i visoko uzdignutim zdanjem. S njega im je spuštao kišu u obilju i opskrbu u određenoj mjeri. Po njemu im je pokrenuo noćni Mjesec i dnevno Sunce da se, neprestano djelujući za njihovu korist, smjenjuju. Učinio im je noć pokrivalom, a dan vremenom za stjecanje sredstava za život. Kao dar i dobročinstvo prema njima, načinio je razliku između noćnog Mjeseca i dnevnog Sunca: izbrisao je znak noći, a znak dana učinio vidljivim, kao što je rekao, veličanstvena je Njegova uzvišenost i sveta su Njegova imena: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 17:12, nastavlja se⟧\u003c/span> „Noć i dan učinili smo dvama znakovima, pa smo znak noći izbrisali, a znak dana učinili vidljivim, da biste tražili dobrotu\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":5,"html":"\u003csection class=\"page\" data-page=\"5\" id=\"stranica-5\">\u003ch2>Stranica 5\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 5\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"5.1\" id=\"ar-odlomak-5-1\">مِنْ رَبِّكُمْ وَلِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسابَ وَكُلَّ شَيْءٍ فَصَّلْناهُ تَفْصِيلًا» .\u003c/p>\u003cp data-pair=\"5.2\" id=\"ar-odlomak-5-2\">وليصلوا بذلك إلى العلم بأوقات فروضهم التي فرضها عليهم في ساعات الليل والنهار والشهور والسنين، من الصلوات والزكوات والحج والصيام وغير ذلك من فروضهم، وحين حل ديونهم وحقوقهم، كما قال عز وجل: «يَسْئَلُونَكَ عَنِ الْأَهِلَّةِ قُلْ هِيَ مَواقِيتُ لِلنَّاسِ وَالْحَجِّ» ، وقال: «هُوَ الَّذِي جَعَلَ الشَّمْسَ ضِياءً وَالْقَمَرَ نُوراً وَقَدَّرَهُ مَنازِلَ لِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسابَ مَا خَلَقَ اللَّهُ ذلِكَ إِلَّا بِالْحَقِّ يُفَصِّلُ الْآياتِ لِقَوْمٍ يَعْلَمُونَ إِنَّ فِي اخْتِلافِ اللَّيْلِ وَالنَّهارِ وَما خَلَقَ اللَّهُ فِي السَّماواتِ وَالْأَرْضِ لَآياتٍ لِقَوْمٍ يَتَّقُونَ» .\u003c/p>\u003cp data-pair=\"5.3\" id=\"ar-odlomak-5-3\">إنعاما منه بكل ذلك على خلقه، وتفضلا منه به عليهم وتطولا، فشَكَره على نعمه التي أنعمها عليهم من خلقه خَلْق عظيم، فزاد كثيرا منهم من آلائه وأياديه، على ما ابتدأهم به من فضله وطوله، كما وعدهم جل جلاله بقوله: «وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِنْ شَكَرْتُمْ لَأَزِيدَنَّكُمْ وَلَئِنْ كَفَرْتُمْ إِنَّ عَذابِي لَشَدِيدٌ» ، وجمع لهم الى الزيادة التي زادهم في عاجل دنياهم، الفوز بالنعيم المقيم، والخلود في جنات النعيم، في آجل آخرتهم وأخر لكثير منهم الزيادة التي وعدهم فمدهم الى حين مصيرهم اليه ووقت قدومهم عليه، توفيرا منه كرامته عليهم يوم تبلى السرائر وكفر نعمه خلق منهم عظيم، فجحدوا آلاءه وعبدوا سواه، فسلب كثيرا منهم ما ابتدأهم به من الفضل والإحسان، وأحل\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 5\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"5.1\" id=\"odlomak-5-1\">od svoga Gospodara i da biste znali broj godina i računanje. I svaku smo stvar podrobno razjasnili.“ \u003cspan class=\"translator-note\">⟦Završetak prijevoda kur’anskog navoda, 17:12.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"5.2\" id=\"odlomak-5-2\">I da bi time došli do spoznaje vremena svojih obaveza koje im je propisao u satima noći i dana, mjesecima i godinama: namaza, zekata, hadža, posta i drugih njihovih obaveza, te vremena dospijeća njihovih dugova i prava, kao što je rekao Silni i Uzvišeni: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 2:189⟧\u003c/span> „Pitaju te o mlađacima. Reci: Oni su oznake vremena ljudima i za hadž.“ I rekao je: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 10:5–6⟧\u003c/span> „On je Sunce učinio sjajem, a Mjesec svjetlom i odredio mu položaje da biste znali broj godina i računanje. Allah je to stvorio samo s istinom. On podrobno izlaže znakove ljudima koji znaju. Zaista u smjeni noći i dana i u onome što je Allah stvorio na nebesima i na Zemlji postoje znakovi za ljude koji se čuvaju.“\u003c/p>\u003cp data-pair=\"5.3\" id=\"odlomak-5-3\">Sve je to učinio kao blagodat Svojim stvorenjima, kao dobrotu i dobročinstvo prema njima. Veliko mnoštvo Njegovih stvorenja zahvaljivalo Mu je za blagodati kojima ih je obdario, pa je mnogima među njima povećao Svoje blagodati i darove povrh dobrote i dobročinstva kojima ih je na početku obasuo, kao što im je obećao, veličanstvena je Njegova uzvišenost, riječima: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 14:7⟧\u003c/span> „I kada je vaš Gospodar obznanio: Ako budete zahvalni, sigurno ću vam povećati; a ako budete nezahvalni, Moja je kazna zaista žestoka.“ Povećanju koje im je podario u njihovom sadašnjem zemaljskom životu pridružio je uspjeh u trajnoj blagodati i vječni boravak u baščama uživanja u njihovom budućem životu na onom svijetu. Mnogima među njima odgodio je povećanje koje im je obećao i ostavio im rok do njihova povratka Njemu i vremena njihova dolaska pred Njega, da bi im Svoju počast u punini dao na Dan kada budu ispitivane tajne. A veliko mnoštvo njih pokazalo je nezahvalnost za Njegove blagodati: poricali su Njegove darove i robovali drugome mimo Njega. Mnogima među njima oduzeo je dobrotu i dobročinstvo kojima ih je na početku obdario i spustio je\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":6,"html":"\u003csection class=\"page\" data-page=\"6\" id=\"stranica-6\">\u003ch2>Stranica 6\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 6\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"6.1\" id=\"ar-odlomak-6-1\">بهم النقمة المهلكة في العاجل، وذخر لهم العقوبة المخزية في الآجل، ومتع كثيرا منهم بنعمه ايام حياتهم استدراجا منه لهم، وتوقيرا منه عليهم أوزارهم، ليستحقوا من عقوبته في الآجل ما قد أعد لهم.\u003c/p>\u003cp data-pair=\"6.2\" id=\"ar-odlomak-6-2\">نعوذ بالله من عمل يقرب من سخطه، ونسأله التوفيق لما يدني من رضاه ومحبته.\u003c/p>\u003cp data-pair=\"6.3\" id=\"ar-odlomak-6-3\">قال أبو جعفر: وأنا ذاكر في كتابي هذا من ملوك كل زمان، من لدن ابتدأ ربنا جل جلاله خلق خلقه إلى حال فنائهم، من انتهى إلينا خبره ممن ابتدأه الله تعالى بآلائه ونعمه فشكر نعمه، من رسول له مرسل، أو ملك مسلط، أو خليفة مستخلف، فزاده إلى ما ابتدأه به من نعمه في العاجل نعما، وإلى ما تفضل به عليه فضلا، ومن أخر ذلك له منهم، وجعله له عنده ذخرا ومن كفر منهم نعمه فسلبه ما ابتدأه به من نعمه، وعجل له نقمه ومن كفر منهم نعمه فمتعه بما أنعم به عليه إلى حين وفاته وهلاكه، مقرونا ذكر كل من أنا ذاكره منهم في كتابي هذا بذكر زمانه، وجمل ما كان من حوادث الأمور في عصره وأيامه، إذ كان الاستقصاء في ذلك يقصر عنه العمر، وتطول به الكتب، مع ذكري مع ذلك مبلغ مدة أكله، وحين أجله، بعد تقديمي أمام ذلك ما تقديمه بنا أولى، والابتداء به قبله أحجى، من البيان عن الزمان: ما هو؟ وكم قدر جميعه، وابتداء أوله، وانتهاء آخره؟ وهل كان قبل خلق الله تعالى إياه شيء غيره؟ وهل هو فان؟ وهل بعد فنائه شيء غير وجه المسبح الخلاق، تعالى ذكره؟\u003c/p>\u003cp data-pair=\"6.4\" id=\"ar-odlomak-6-4\">وما الذي كان قبل خلق الله إياه؟ وما هو كائن بعد فنائه وانقضائه؟ وكيف\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 6\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"6.1\" id=\"odlomak-6-1\">na njih uništavajuću kaznu u ovom životu, a za budući im je sačuvao ponižavajuću kaznu. Mnogima među njima dopuštao je da uživaju u Njegovim blagodatima tokom dana svoga života, postepeno ih tako privodeći kazni i umnožavajući im terete grijeha, kako bi u budućem životu zaslužili kaznu koju im je pripremio.\u003c/p>\u003cp data-pair=\"6.2\" id=\"odlomak-6-2\">Utječemo se Allahu od djela koje približava Njegovoj srdžbi i molimo Ga za uspjeh u onome što približava Njegovu zadovoljstvu i ljubavi.\u003c/p>\u003cp data-pair=\"6.3\" id=\"odlomak-6-3\">Ebu Džafer je rekao: U ovoj svojoj knjizi spomenut ću, među vladarima svakoga vremena, od kada je naš Gospodar, veličanstvena je Njegova uzvišenost, započeo stvaranje Svojih stvorenja pa do stanja njihova nestanka, one o kojima su do nas stigle vijesti: one koje je Allah Uzvišeni najprije obdario Svojim darovima i blagodatima, pa su zahvaljivali za Njegove blagodati, bilo da je riječ o Njegovu poslanom poslaniku, vladaru kojem je data vlast ili halifi postavljenom za nasljednika, pa im je On blagodatima kojima ih je na početku obdario u ovom životu dodao druge blagodati i dobroti koju im je ukazao dodao novu dobrotu; i one kojima je to odgodio i kod Sebe im to učinio zalihom; i one među njima koji su bili nezahvalni za Njegove blagodati, pa im je oduzeo blagodati kojima ih je na početku obdario i ubrzao im Svoju kaznu; i one među njima koji su bili nezahvalni za Njegove blagodati, pa im je ipak dopuštao da uživaju u onome čime ih je obdario do vremena njihove smrti i propasti. Spomen svakoga koga budem spominjao u ovoj svojoj knjizi povezat ću sa spomenom njegova vremena i općim prikazom događaja u njegovu dobu i njegovim danima, jer bi iscrpno istraživanje toga premašilo životni vijek i produžilo knjige. Uz to ću spominjati dužinu vremena njegova uživanja u opskrbi i čas njegova kraja, nakon što tome prethodno izložim ono što je prikladnije da izložimo prvo i razložnije da time započnemo prije toga: objašnjenje vremena — šta je ono; koliko je ukupno njegovo trajanje; početak njegova prvog dijela i završetak njegova posljednjeg; je li prije nego što ga je Allah Uzvišeni stvorio postojalo nešto drugo; hoće li ono nestati; i hoće li nakon njegova nestanka postojati išta osim lica Stvoritelja, kojem se slava iskazuje, uzvišen je Njegov spomen?\u003c/p>\u003cp data-pair=\"6.4\" id=\"odlomak-6-4\">Šta je postojalo prije nego što ga je Allah stvorio? Šta će postojati nakon njegova nestanka i završetka? Kako\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":7,"html":"\u003csection class=\"page\" data-page=\"7\" id=\"stranica-7\">\u003ch2>Stranica 7\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 7\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"7.1\" id=\"ar-odlomak-7-1\">كان ابتداء خلق الله تعالى إياه؟ وكيف يكون فناؤه؟ والدلالة على أن لا قديم إلا الله الواحد القهار، الذي له ملك السموات والأرض وما بينهما وما تحت الثرى بوجيز من الدلالة غير طويل، إذ لم نقصد بكتابنا هذا قصد الاحتجاج لذلك، بل لما ذكرنا من تاريخ الملوك الماضين وجمل من أخبارهم، وأزمان الرسل والأنبياء ومقادير أعمارهم، وأيام الخلفاء السالفين وبعض سيرهم، ومبالغ ولاياتهم، والكائن الذي كان من الأحداث في أعصارهم ثم أنا متبع آخر ذلك كله- إن شاء الله وأيد منه بعون وقوة- ذكر صحابه نبينا محمد ص وأسمائهم وكناهم ومبالغ أنسابهم ومبالغ أعمارهم، ووقت وفاة كل إنسان منهم، والموضع الذي كانت به وفاته ثم متبعهم ذكر من كان بعدهم من التابعين لهم بإحسان، على نحو ما شرطنا من ذكرهم ثم ملحق بهم ذكر من كان بعدهم من الخلف لهم كذلك، وزائد في أمورهم للإبانة عمن حمدت منهم روايته، وتقبلت أخباره، ومن رفضت منهم روايته ونبذت أخباره، ومن وهن منهم نقله، وضعف خبره وما السبب الذي من أجله نبذ من نبذ منهم خبره، والعلة التي من أجلها وهن من وهن منهم نقله.\u003c/p>\u003cp data-pair=\"7.2\" id=\"ar-odlomak-7-2\">وإلى الله عز وجل أنا راغب في العون على ما أقصده وأنويه، والتوفيق لما ألتمسه وأبغيه، فإنه ولي الحول والقوة، وصلى الله على محمد نبيه وآله وسلم تسليما.\u003c/p>\u003cp data-pair=\"7.3\" id=\"ar-odlomak-7-3\">وليعلم الناظر في كتابنا هذا أن اعتمادي في كل ما أحضرت ذكره فيه مما شرطت أني راسمه فيه، إنما هو على ما رويت من الأخبار التي أنا ذاكرها فيه، والآثار التي أنا مسندها إلى رواتها فيه، دون ما أدرك بحجج العقول، واستنبط\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 7\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"7.1\" id=\"odlomak-7-1\">je Allah Uzvišeni započeo njegovo stvaranje i kako će ono nestati? I dokazivanje da nema ničega bespočetnog osim Allaha, Jedinoga, Svepotčinitelja, kojem pripada vlast nebesa i Zemlje, onoga što je između njih i onoga što je ispod tla, sažetim, a ne dugim dokazom, jer ovom našom knjigom nismo namjeravali dokazivati to, nego ono što smo spomenuli: historiju prošlih vladara i opće prikaze njihovih vijesti, vremena poslanika i vjerovjesnika i dužine njihovih života, dane prethodnih halifa i nešto od njihovih životopisa, trajanje njihovih vlasti i događaje koji su se zbili u njihovim razdobljima. Zatim ću svemu tome na kraju — ako Allah htjedne i potpomogne me Svojom pomoći i snagom — pridružiti spomen ashaba našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir, njihova imena, njihove nadimke, dokle sežu njihova rodoslovlja, dužine njihovih života, vrijeme smrti svakoga pojedinca među njima i mjesto u kojem je umro. Zatim ću za njima navesti spomen onih koji su ih slijedili u dobročinstvu, na način koji smo postavili kao uslov za njihovo spominjanje. Zatim ću im pridružiti spomen onih koji su došli poslije njih, na isti način, i dodati pojedinosti o njima radi razjašnjenja čije je prenošenje među njima pohvaljeno i čije su vijesti prihvaćene, čije je prenošenje odbačeno i čije su vijesti odbačene, čije je prenošenje ocijenjeno slabim i čija je vijest slaba, te koji je razlog zbog kojeg je odbačena vijest onoga čija je vijest odbačena i koji je uzrok zbog kojeg je oslabljeno prenošenje onoga čije je prenošenje oslabljeno.\u003c/p>\u003cp data-pair=\"7.2\" id=\"odlomak-7-2\">Allahu, Silan je i Uzvišen, obraćam se želeći pomoć u onome čemu težim i što namjeravam i uspjeh u onome što tražim i želim, jer On je Posjednik moći i snage. Neka Allah blagoslovi Muhammeda, Svoga vjerovjesnika, i njegovu porodicu i neka im podari potpuni mir.\u003c/p>\u003cp data-pair=\"7.3\" id=\"odlomak-7-3\">Neka onaj ko razmatra ovu našu knjigu zna da se moje oslanjanje, u svemu što sam u njoj spomenuo od onoga za šta sam postavio uslov da ću to u njoj zabilježiti, zasniva samo na vijestima koje su mi prenesene i koje u njoj navodim, i na predajama koje u njoj lancem prenosilaca pripisujem njihovim prenosiocima, a ne na onome što se spoznaje razumskim dokazima i izvodi\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":8,"html":"\u003csection class=\"page\" data-page=\"8\" id=\"stranica-8\">\u003ch2>Stranica 8\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 8\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"8.1\" id=\"ar-odlomak-8-1\">بفكر النفوس، إلا اليسير القليل منه، إذ كان العلم بما كان من أخبار الماضين، وما هو كائن من أنباء الحادثين، غير واصل إلى من لم يشاهدهم ولم يدرك زمانهم، إلا بأخبار المخبرين، ونقل الناقلين، دون الاستخراج بالعقول، والاستنباط بفكر النفوس فما يكن في كتابي هذا من خبر ذكرناه عن بعض الماضين مما يستنكره قارئه، أو يستشنعه سامعه، من أجل أنه لم يعرف له وجها في الصحة، ولا معنى في الحقيقة، فليعلم انه لم يؤت في ذلك من قبلنا، وإنما أتى من قبل بعض ناقليه إلينا، وإنا إنما أدينا ذلك على نحو ما أدي إلينا\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 8\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"8.1\" id=\"odlomak-8-1\">promišljanjem duše, osim vrlo maloga dijela toga. Jer znanje o vijestima prošlih i o izvještajima o događajima koji se zbivaju ne dopire do onoga ko ih nije vidio i nije doživio njihovo vrijeme drugačije nego putem izvještaja onih koji izvještavaju i prenošenja onih koji prenose, a ne razumskim izvođenjem i zaključivanjem promišljanjem duše. Stoga, ako u ovoj mojoj knjizi bude neka vijest koju smo prenijeli o nekima od prošlih, koju njen čitalac bude smatrao neprihvatljivom ili njen slušalac odbojnom zato što za nju ne nalazi osnovu ispravnosti niti smisao u stvarnosti, neka zna da to nije došlo od nas, nego od nekoga od onih koji su nam je prenijeli, a mi smo to samo prenijeli onako kako je preneseno nama.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":9,"html":"\u003csection class=\"page\" data-page=\"9\" id=\"stranica-9\">\u003ch2>Stranica 9\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 9\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"9.1\" id=\"ar-odlomak-9-1\">[القول في الزمان ما هو]\u003c/p>\u003cp data-pair=\"9.2\" id=\"ar-odlomak-9-2\">قال ابو جعفر: فالزمان هو ساعات الليل والنهار، وقد يقال ذلك للطويل من المدة والقصير منها، والعرب تقول: أتيتك زمان الحجاج أمير، وزمن الحجاج أمير- تعني به: إذ الحجاج أمير وتقول: اتيتك زمان الصرام وزمن الصرام- تعني به وقت الصرام ويقولون أيضا: أتيتك أزمان الحجاج أمير، فيجمعون الزمان، يريدون بذلك أن يجعلوا كل وقت من أوقات إمارته زمانا من الأزمنة، كما قال الراجز:\u003c/p>\u003cp data-pair=\"9.3\" id=\"ar-odlomak-9-3\">جاء الشتاء وقميصي أخلاق ... شراذم يضحك منه التواق\u003c/p>\u003cp data-pair=\"9.4\" id=\"ar-odlomak-9-4\">فجعل القميص أخلاقا، يريد بذلك وصف كل قطعة منه بالإخلاق، كما يقولون: أرض سباسب، ونحو ذلك.\u003c/p>\u003cp data-pair=\"9.5\" id=\"ar-odlomak-9-5\">ومن قولهم للزمان: زمن قول أعشى بني قيس بن ثعلبة:\u003c/p>\u003cp data-pair=\"9.6\" id=\"ar-odlomak-9-6\">وكنت امرا زمنا بالعراق ... عفيف المناخ طويل التغن\u003c/p>\u003cp data-pair=\"9.7\" id=\"ar-odlomak-9-7\">يريد بقوله: زمنا زمانا، فالزمان اسم لما ذكرت من ساعات الليل والنهار على ما قد بينت ووصفت\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 9\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"9.1\" id=\"odlomak-9-1\">Rasprava o vremenu: šta je ono\u003c/p>\u003cp data-pair=\"9.2\" id=\"odlomak-9-2\">Ebu Džafer je rekao: Vrijeme su sati noći i dana. Taj se izraz može upotrijebiti za dugo i kratko razdoblje. Arapi kažu: „Došao sam ti u vrijeme kada je El-Hadždžadž bio zapovjednik“, upotrebljavajući i izraz „zeman“ i izraz „zemen“, a time misle: „Dok je El-Hadždžadž bio zapovjednik.“ I kažu: „Došao sam ti u vrijeme berbe“, upotrebljavajući „zeman es-siram“ i „zemen es-siram“, a time misle na vrijeme berbe. Također kažu: „Došao sam ti u vremenima kada je El-Hadždžadž bio zapovjednik“, stavljajući riječ „vrijeme“ u množinu. Time žele svaki trenutak njegova zapovjedništva učiniti jednim vremenom među vremenima, kao što je rekao pjesnik redžeza:\u003c/p>\u003cp data-pair=\"9.3\" id=\"odlomak-9-3\">„Došla je zima, a moja košulja sva pohabana —\nu dronjcima kojima se Et-Tevvak smije.“\u003c/p>\u003cp data-pair=\"9.4\" id=\"odlomak-9-4\">Košulju je označio množinskim izrazom „ahlak“, želeći svaki njen komad opisati pohabanošću, kao što kažu „zemlja — puste ravnice“ i tome slično.\u003c/p>\u003cp data-pair=\"9.5\" id=\"odlomak-9-5\">Među primjerima njihove upotrebe riječi „zemen“ za „zeman“ jesu riječi El-A‘šaa iz plemena Benu Kajs ibn Sa‘lebe:\u003c/p>\u003cp data-pair=\"9.6\" id=\"odlomak-9-6\">„Bio sam čovjek, neko vrijeme u Iraku,\nčestita boravišta, dugotrajnog pjevanja.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: završni izraz stiha „طويل التغن“ zahtijeva provjeru prema štampanom tekstu; ovdje je prenesen prema dostupnom prijepisu.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"9.7\" id=\"odlomak-9-7\">Riječju „zemen“ misli na „zeman“. Vrijeme je, dakle, naziv za ono što sam spomenuo od sati noći i dana, kako sam već objasnio i opisao.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":10,"html":"\u003csection class=\"page\" data-page=\"10\" id=\"stranica-10\">\u003ch2>Stranica 10\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 10\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"10.1\" id=\"ar-odlomak-10-1\">القول في كم قدر جميع الزمان من ابتدائه إلى انتهائه وأوله إلى آخره\u003c/p>\u003cp data-pair=\"10.2\" id=\"ar-odlomak-10-2\">اختلف السلف قبلنا من أهل العلم في ذلك، فقال بعضهم: قدر جميع ذلك سبعة آلاف سنة.\u003c/p>\u003cp data-pair=\"10.3\" id=\"ar-odlomak-10-3\">ذكر من قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"10.4\" id=\"ar-odlomak-10-4\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ يَعْقُوبَ، عَنْ حَمَّادٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: \u003c/span>الدنيا جمعة من جمع الآخرة، سبعة آلاف سنه، فقد مضى سته آلاف سنه ومائتا سَنَةٍ، وَلَيَأْتِيَنَّ عَلَيْهَا مِئُونَ مِنْ سِنِينَ، لَيْسَ عَلَيْهَا مُوَحِّدٌ.\u003c/p>\u003cp data-pair=\"10.5\" id=\"ar-odlomak-10-5\">وَقَالَ آخَرُونَ: قَدْرُ جَمِيعِ ذَلِكَ سِتَّةُ آلافِ سَنَةٍ.\u003c/p>\u003cp data-pair=\"10.6\" id=\"ar-odlomak-10-6\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"10.7\" id=\"ar-odlomak-10-7\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو هِشَامٍ، قَالَ: حَدَّثَنَا مُعَاوِيَةُ بْنُ هِشَامٍ، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ أَبِي صَالِحٍ، قَالَ: قَالَ كَعْبٌ: \u003c/span>الدُّنْيَا سِتَّةُ آلافِ سَنَةٍ.\u003c/p>\u003cp data-pair=\"10.8\" id=\"ar-odlomak-10-8\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ سَهْلِ بْنِ عَسْكَرٍ، قال: حدثنا اسمعيل بن عبد الكريم، قال: حدثني عبد الصمد بن معقل، أنه سمع وهبا يقول: \u003c/span>قد خلا من الدنيا خمسه آلاف سنه وستمائه سنه، وانى لأَعْرِفُ كُلَّ زَمَانٍ مِنْهَا، مَا كَانَ فِيهِ من الملوك والأنبياء قلت لِوَهْبِ بْنِ مُنَبِّهٍ: كَمِ الدُّنْيَا؟ قَالَ: سِتَّةُ آلاف سنه\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 10\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"10.1\" id=\"odlomak-10-1\">Rasprava o tome koliko ukupno traje vrijeme od njegova početka do njegova završetka, od njegova prvog do njegova posljednjeg dijela\u003c/p>\u003cp data-pair=\"10.2\" id=\"odlomak-10-2\">Prethodnici među učenim ljudima prije nas razišli su se o tome. Neki su rekli: Ukupno trajanje svega toga iznosi sedam hiljada godina.\u003c/p>\u003cp data-pair=\"10.3\" id=\"odlomak-10-3\">Spomen onoga ko je to rekao:\u003c/p>\u003cp data-pair=\"10.4\" id=\"odlomak-10-4\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, rekao je: Pričao nam je Jahja ibn Vadih, rekao je: Pričao nam je Jahja ibn Jakub, od Hammada, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: \u003c/span>Ovaj svijet je jedna sedmica među sedmicama onoga svijeta, sedam hiljada godina. Već je prošlo šest hiljada i dvjesto godina, a doći će mu stotine godina tokom kojih na njemu neće biti nikoga ko priznaje Božiju jednoću.\u003c/p>\u003cp data-pair=\"10.5\" id=\"odlomak-10-5\">Drugi su rekli: Ukupno trajanje svega toga iznosi šest hiljada godina.\u003c/p>\u003cp data-pair=\"10.6\" id=\"odlomak-10-6\">Spomen onoga ko je to rekao:\u003c/p>\u003cp data-pair=\"10.7\" id=\"odlomak-10-7\">\u003cspan class=\"isnad\">Pričao nam je Ebu Hišam, rekao je: Pričao nam je Muavija ibn Hišam, od Sufjana, od El-A‘meša, od Ebu Saliha, koji je rekao: Ka‘b je rekao: \u003c/span>Ovaj svijet traje šest hiljada godina.\u003c/p>\u003cp data-pair=\"10.8\" id=\"odlomak-10-8\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Sehl ibn Asker, rekao je: Pričao nam je Ismail ibn Abdulkerim, rekao je: Pričao mi je Abdussamed ibn Ma‘kil da je čuo Vehba kako govori: \u003c/span>Od ovoga svijeta već je prošlo pet hiljada i šest stotina godina. Ja zaista znam svako njegovo razdoblje, koji su u njemu bili vladari i vjerovjesnici. Rekao sam Vehbu ibn Munebbihu: Koliko traje ovaj svijet? Rekao je: Šest hiljada godina.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":11,"html":"\u003csection class=\"page\" data-page=\"11\" id=\"stranica-11\">\u003ch2>Stranica 11\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 11\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"11.1\" id=\"ar-odlomak-11-1\">قال أبو جعفر: والصواب من القول في ذَلِكَ مَا دَلَّ عَلَى صِحَّتِهِ الْخَبَرُ الْوَارِدُ عن رسول الله ص، وَذَلِكَ مَا \u003cspan class=\"isnad\">حَدَّثَنَا بِهِ مُحَمَّدُ بْنُ بَشَّارٍ وَعَلِيُّ بْنُ سَهْلٍ، قَالا: حَدَّثَنَا مُؤَمَّلٌ، قَالَ: حَدَّثَنَا سُفْيَانُ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنِ ابْنِ عُمَرَ، قَالَ: [سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ: \u003c/span>أَجَلُكُمْ فِي أَجَلِ مَنْ كَانَ قَبْلَكُمْ، مِنْ صَلاةِ الْعَصْرِ إِلَى مَغْرِبِ الشَّمْسِ] .\u003c/p>\u003cp data-pair=\"11.2\" id=\"ar-odlomak-11-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ نَافِعٍ، عَنِ ابْنِ عمر، قال: [سمعت النبي ص يَقُولُ: \u003c/span>أَلا إِنَّمَا أَجَلُكُمْ فِي أَجَلِ مَنْ خَلا مِنَ الأُمَمِ، كَمَا بَيْنَ صَلاةِ الْعَصْرِ إِلَى مَغْرِبِ الشَّمْسِ] .\u003c/p>\u003cp data-pair=\"11.3\" id=\"ar-odlomak-11-3\">\u003cspan class=\"isnad\">حَدَّثَنَا الْحَسَنُ بْنُ عَرَفَةَ، قَالَ: حَدَّثَنِي عَمَّارُ بْنُ مُحَمَّدٍ، ابْنُ أُخْتِ سُفْيَانَ الثَّوْرِيِّ، أَبُو الْيَقْظَانِ، عَنْ لَيْثِ بْنِ أَبِي سُلَيْمٍ، عَنْ مُغِيرَةَ بْنِ حَكِيمٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ: [قَالَ رَسُولُ الله ص: \u003c/span>مَا بَقِيَ لأُمَّتِي مِنَ الدُّنْيَا إِلا كَمِقْدَارِ الشَّمْسِ إِذَا صُلِّيَتِ الْعَصْرُ] .\u003c/p>\u003cp data-pair=\"11.4\" id=\"ar-odlomak-11-4\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ عَوْفٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، قَالَ: حَدَّثَنَا شَرِيكٌ، قَالَ: سَمِعْتُ سَلَمَةَ بْنَ كُهَيْلٍ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عُمَرَ، قَالَ: \u003c/span>[كُنَّا جُلُوسًا عند النبي ص وَالشَّمْسُ مُرْتَفِعَةٌ عَلَى قُعَيْقِعَانَ بَعْدَ الْعَصْرِ، فَقَالَ:\u003c/p>\u003cp data-pair=\"11.5\" id=\"ar-odlomak-11-5\">مَا أَعْمَارُكُمْ فِي أَعْمَارِ مَنْ مَضَى إِلا كَمَا بَقِيَ مِنْ هَذَا النَّهَارِ فِيمَا مَضَى مِنْهُ] .\u003c/p>\u003cp data-pair=\"11.6\" id=\"ar-odlomak-11-6\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ وَمُحَمَّدُ بْنُ الْمُثَنَّى- قال ابن بشار: حدثنى خلف ابن مُوسَى، وَقَالَ ابْنُ الْمُثَنَّى: حَدَّثَنَا خَلَفُ بْنُ مُوسَى- قَالَ: حَدَّثَنِي أَبِي، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ \u003c/span>أَنَّ رَسُولَ اللَّهِ ص خَطَبَ أَصْحَابَهُ يَوْمًا- وَقَدْ كَادَتِ الشَّمْسُ أَنْ تَغِيبَ، وَلَمْ يَبْقَ مِنْهَا إِلا شِقٌّ يَسِيرٌ-[فقال: والذى\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 11\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"11.1\" id=\"odlomak-11-1\">Ebu Džafer je rekao: Ispravan stav o tome jeste onaj na čiju ispravnost ukazuje vijest prenesena od Allahova Poslanika, neka mu Allah podari blagoslov i mir. To je ono što su nam pričali Muhammed ibn Beššar i Ali ibn Sehl; rekli su: \u003cspan class=\"isnad\">Pričao nam je Muemmel, rekao je: Pričao nam je Sufjan, od Abdullaha ibn Dinara, od Ibn Omera, koji je rekao: \u003c/span>[\u003cspan class=\"isnad\">Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: \u003c/span>Vaš rok u odnosu na rok onih koji su bili prije vas jeste od ikindijskog namaza do zalaska Sunca.]\u003c/p>\u003cp data-pair=\"11.2\" id=\"odlomak-11-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, rekao je: Pričao nam je Selema, rekao je: Pričao mi je Muhammed ibn Ishak, od Nafi‘a, od Ibn Omera, koji je rekao: \u003c/span>[\u003cspan class=\"isnad\">Čuo sam Vjerovjesnika, neka mu Allah podari blagoslov i mir, kako govori: \u003c/span>Znajte da je vaš rok u odnosu na rok prošlih naroda poput vremena između ikindijskog namaza i zalaska Sunca.]\u003c/p>\u003cp data-pair=\"11.3\" id=\"odlomak-11-3\">\u003cspan class=\"isnad\">Pričao nam je El-Hasan ibn Arefa, rekao je: Pričao mi je Ammar ibn Muhammed, sin sestre Sufjana es-Sevrija, Ebu el-Jekzan, od Lejsa ibn Ebi Sulejma, od Mugire ibn Hakima, od Abdullaha ibn Omera, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Mome ummetu od ovoga svijeta ostalo je samo onoliko koliko iznosi Sunce kada se klanja ikindija.]\u003c/p>\u003cp data-pair=\"11.4\" id=\"odlomak-11-4\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Avf, rekao je: Pričao nam je Ebu Nuajm, rekao je: Pričao nam je Šerik, rekao je: Čuo sam Selemu ibn Kuhejla, od Mudžahida, od Ibn Omera, koji je rekao: \u003c/span>[Sjedili smo kod Vjerovjesnika, neka mu Allah podari blagoslov i mir, poslije ikindije, dok je Sunce bilo visoko iznad Kuajki‘ana, pa je rekao:\u003c/p>\u003cp data-pair=\"11.5\" id=\"odlomak-11-5\">Vaši životni vijekovi u odnosu na životne vijekove onih koji su prošli jesu samo poput onoga što je ostalo od ovoga dana u odnosu na ono što je od njega prošlo.]\u003c/p>\u003cp data-pair=\"11.6\" id=\"odlomak-11-6\">\u003cspan class=\"isnad\">Pričali su nam Ibn Beššar i Muhammed ibn el-Musenna — Ibn Beššar je rekao: Pričao mi je Halef ibn Musa, a Ibn el-Musenna je rekao: Pričao nam je Halef ibn Musa — rekao je: Pričao mi je moj otac, od Katade, od Enesa ibn Malika, \u003c/span>da je Allahov Poslanik, neka mu Allah podari blagoslov i mir, jednoga dana održao govor svojim ashabima — a Sunce je gotovo bilo zašlo i ostao je samo njegov mali dio — [pa je rekao: Tako mi Onoga u čijoj je\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":12,"html":"\u003csection class=\"page\" data-page=\"12\" id=\"stranica-12\">\u003ch2>Stranica 12\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 12\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"12.1\" id=\"ar-odlomak-12-1\">نَفْسُ مُحَمَّدٍ بِيَدِهِ مَا بَقِيَ مِنْ دُنْيَاكُمْ فِيمَا مَضَى مِنْهَا إِلا كَمَا بَقِيَ مِنْ يَوْمِكُمْ هَذَا فِيمَا مَضَى مِنْهُ، وَمَا تَرَوْنَ مِنَ الشَّمْسِ إِلا الْيَسِيرَ] .\u003c/p>\u003cp data-pair=\"12.2\" id=\"ar-odlomak-12-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا ابْنُ عُيَيْنَةَ، عَنْ عَلِيِّ بْنِ زَيْدٍ، عَنْ أَبِي نَضْرَةَ، عَنْ أَبِي سَعِيدٍ، قال: [قال النبي ص عِنْدَ غُرُوبِ الشَّمْسِ: \u003c/span>إِنَّمَا مَثَلُ مَا بَقِيَ مِنَ الدُّنْيَا فِيمَا مَضَى مِنْهَا كَبَقِيَّةِ يَوْمِكُمْ هَذَا فِيمَا مَضَى مِنْهُ] .\u003c/p>\u003cp data-pair=\"12.3\" id=\"ar-odlomak-12-3\">\u003cspan class=\"isnad\">حَدَّثَنَا هَنَّادُ بْنُ السَّرِيِّ وَأَبُو هِشَامٍ الرِّفَاعِيُّ، قَالا: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ أَبِي حُصَيْنٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رسول الله ص: \u003c/span>بعثت انا وَالسَّاعَةَ كَهَاتَيْنِ- وَأَشَارَ بِالسَّبَّابَةِ وَالْوُسْطَى] .\u003c/p>\u003cp data-pair=\"12.4\" id=\"ar-odlomak-12-4\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كريب، حَدَّثَنَا يَحْيَى بْنُ آدَمَ، عَنْ أَبِي بَكْرٍ، عَنْ أَبِي حُصَيْنٍ، عَنْ أَبِي صَالِحٍ، عَنْ ابى هريرة، عن النبي بِنَحْوِهِ.\u003c/span>\u003c/p>\u003cp data-pair=\"12.5\" id=\"ar-odlomak-12-5\">\u003cspan class=\"isnad\">حَدَّثَنَا هَنَّادٌ، قَالَ: حَدَّثَنَا أَبُو الأَحْوَصِ وَأَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سَمُرَةَ، قَالَ: [قَالَ رسول الله ص: \u003c/span>بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .\u003c/p>\u003cp data-pair=\"12.6\" id=\"ar-odlomak-12-6\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عَثَّامُ بْنُ عَلِيٍّ، عَنِ الأَعْمَشِ، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سَمُرَةَ، [قَالَ: \u003c/span>كَأَنِّي أَنْظُرُ إِلَى إِصْبَعَيْ رَسُولِ الله ص- وَأَشَارَ بِالْمُسَبِّحَةِ وَالَّتِي تَلِيهَا- وَهُوَ يَقُولُ:\u003c/p>\u003cp data-pair=\"12.7\" id=\"ar-odlomak-12-7\">بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَذِهِ مِنْ هَذِهِ] .\u003c/p>\u003cp data-pair=\"12.8\" id=\"ar-odlomak-12-8\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنِي يَحْيَى بْنُ وَاضِحٍ، قَالَ: حدثنا فطر، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سمره، قال: [قال رسول الله ص: \u003c/span>بُعِثْتُ مِنَ السَّاعَةِ كَهَاتَيْنِ]- وَجَمَعَ بَيْنَ إِصْبَعَيْهِ السبابة والوسطى\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 12\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"12.1\" id=\"odlomak-12-1\">ruci Muhammedova duša, od vašega svijeta u odnosu na ono što je od njega prošlo ostalo je samo kao ono što je ostalo od ovoga vašeg dana u odnosu na ono što je od njega prošlo, a od Sunca vidite samo malo.]\u003c/p>\u003cp data-pair=\"12.2\" id=\"odlomak-12-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, rekao je: Pričao nam je Ibn Ujejna, od Alija ibn Zejda, od Ebu Nadre, od Ebu Seida, koji je rekao: \u003c/span>[Vjerovjesnik, neka mu Allah podari blagoslov i mir, pri zalasku Sunca rekao je: Primjer onoga što je ostalo od ovoga svijeta u odnosu na ono što je od njega prošlo jeste samo poput ostatka ovoga vašeg dana u odnosu na ono što je od njega prošlo.]\u003c/p>\u003cp data-pair=\"12.3\" id=\"odlomak-12-3\">\u003cspan class=\"isnad\">Pričali su nam Hennad ibn es-Serijj i Ebu Hišam er-Rifa‘i; rekli su: Pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Husajna, od Ebu Saliha, od Ebu Hurejre, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva — i pokazao je kažiprstom i srednjim prstom.]\u003c/p>\u003cp data-pair=\"12.4\" id=\"odlomak-12-4\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb; pričao nam je Jahja ibn Adem, od Ebu Bekra, od Ebu Husajna, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, \u003c/span>nešto slično tome.\u003c/p>\u003cp data-pair=\"12.5\" id=\"odlomak-12-5\">\u003cspan class=\"isnad\">Pričao nam je Hennad, rekao je: Pričali su nam Ebu el-Ahves i Ebu Muavija, od El-A‘meša, od Ebu Halida el-Valibija, od Džabira ibn Semure, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.]\u003c/p>\u003cp data-pair=\"12.6\" id=\"odlomak-12-6\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Assam ibn Ali, od El-A‘meša, od Ebu Halida el-Valibija, od Džabira ibn Semure, \u003c/span>[koji je rekao: Kao da gledam dva prsta Allahova Poslanika, neka mu Allah podari blagoslov i mir — pokazao je kažiprstom i onim do njega — dok govori:\u003c/p>\u003cp data-pair=\"12.7\" id=\"odlomak-12-7\">Poslan sam u odnosu na Čas kao ovaj u odnosu na ovaj.]\u003c/p>\u003cp data-pair=\"12.8\" id=\"odlomak-12-8\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, rekao je: Pričao mi je Jahja ibn Vadih, rekao je: Pričao nam je Fitr, od Ebu Halida el-Valibija, od Džabira ibn Semure, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Poslan sam u odnosu na Čas kao ova dva] — i sastavio je svoja dva prsta, kažiprst i srednji prst.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":13,"html":"\u003csection class=\"page\" data-page=\"13\" id=\"stranica-13\">\u003ch2>Stranica 13\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 13\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"13.1\" id=\"ar-odlomak-13-1\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ: حَدَّثَنَا شُعْبَةُ، قَالَ: سَمِعْتُ قَتَادَةَ يُحَدِّثُ، قَالَ: حَدَّثَنَا أَنَسُ بْنُ مَالِكٍ، قَالَ: [قال رسول الله ص: \u003c/span>بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] قَالَ شُعْبَةُ:\u003c/p>\u003cp data-pair=\"13.2\" id=\"ar-odlomak-13-2\">\u003cspan class=\"isnad\">سَمِعْتُ قَتَادَةَ يَقُولُ فِي قَصَصِهِ: \u003c/span>كَفَضْلِ إِحْدَاهُمَا عَلَى الأُخْرَى، قَالَ: لا أَدْرِي أَذَكَرَهُ عَنْ أَنَسٍ أَوْ قَالَهُ قَتَادَةُ.\u003c/p>\u003cp data-pair=\"13.3\" id=\"ar-odlomak-13-3\">\u003cspan class=\"isnad\">حَدَّثَنَا خَلادُ بْنُ أَسْلَمَ، قَالَ: حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ:\u003c/span>\u003c/p>\u003cp data-pair=\"13.4\" id=\"ar-odlomak-13-4\">\u003cspan class=\"isnad\">حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، قَالَ: حَدَّثَنَا أَنَسُ بْنُ مالك، قال: [قال رسول الله ص: \u003c/span>بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .\u003c/p>\u003cp data-pair=\"13.5\" id=\"ar-odlomak-13-5\">\u003cspan class=\"isnad\">حَدَّثَنَا مُجَاهِدُ بْنُ مُوسَى، قَالَ: حَدَّثَنَا يَزِيدُ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، عَنِ النبي ص \u003c/span>مِثْلَهُ، وَزَادَ فِي حَدِيثِهِ:\u003c/p>\u003cp data-pair=\"13.6\" id=\"ar-odlomak-13-6\">وَأَشَارَ بِالْوُسْطَى وَالسَّبَّابَةِ.\u003c/p>\u003cp data-pair=\"13.7\" id=\"ar-odlomak-13-7\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا أَيُّوبُ بْنُ سُوَيْدٍ، عَنِ الأوزاعي، قال: حدثنا اسمعيل بْنُ عُبَيْدِ اللَّهِ، قَالَ: \u003c/span>قَدِمَ أَنَسُ بْنُ مَالِكٍ عَلَى الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ، فَقَالَ له الوليد: ماذا سمعت رسول الله ص يَذْكُرُ بِهِ السَّاعَةَ؟ قَالَ: [سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ:\u003c/p>\u003cp data-pair=\"13.8\" id=\"ar-odlomak-13-8\">أَنْتُمْ وَالسَّاعَةَ كَهَاتَيْنِ،] وَأَشَارَ بِإِصْبَعَيْهِ.\u003c/p>\u003cp data-pair=\"13.9\" id=\"ar-odlomak-13-9\">\u003cspan class=\"isnad\">حَدَّثَنِي الْعَبَّاسُ بْنُ الْوَلِيدِ، قَالَ: أَخْبَرَنِي أَبِي، قَالَ: حدثنا الأوزاعي، قال: حدثنى اسمعيل بْنُ عُبَيْدِ اللَّهِ، قَالَ: \u003c/span>قَدِمَ أَنَسُ بْنُ مَالِكٍ عَلَى الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ، فَقَالَ لَهُ الْوَلِيدُ: مَاذَا سَمِعْتَ مِنْ رَسُولِ اللَّهِ ص يَذْكُرُ بِهِ السَّاعَةَ؟ [قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ص يقول: أنتم والساعة كتين] .\u003c/p>\u003cp data-pair=\"13.10\" id=\"ar-odlomak-13-10\">\u003cspan class=\"isnad\">حَدَّثَنِي ابْنُ عَبْدِ الرَّحِيمِ الْبَرْقِيُّ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ أَبِي سَلَمَةَ،\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 13\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"13.1\" id=\"odlomak-13-1\">\u003cspan class=\"isnad\">Pričao nam je Ibn el-Musenna, rekao je: Pričao nam je Muhammed ibn Džafer, rekao je: Pričao nam je Šu‘ba, rekao je: Čuo sam Katadu kako pripovijeda; rekao je: Pričao nam je Enes ibn Malik, rekao je: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.] Šu‘ba je rekao:\u003c/p>\u003cp data-pair=\"13.2\" id=\"odlomak-13-2\">\u003cspan class=\"isnad\">Čuo sam Katadu kako u svojim kazivanjima govori: \u003c/span>Poput razlike za koju je jedan od njih duži od drugoga. Rekao je: Ne znam je li to spomenuo prenoseći od Enesa ili je to rekao Katada.\u003c/p>\u003cp data-pair=\"13.3\" id=\"odlomak-13-3\">\u003cspan class=\"isnad\">Pričao nam je Hallad ibn Eslem, rekao je: Pričao nam je En-Nadr ibn Šumejl, rekao je:\u003c/span>\u003c/p>\u003cp data-pair=\"13.4\" id=\"odlomak-13-4\">\u003cspan class=\"isnad\">Pričao nam je Šu‘ba, od Katade, koji je rekao: Pričao nam je Enes ibn Malik, rekao je: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.]\u003c/p>\u003cp data-pair=\"13.5\" id=\"odlomak-13-5\">\u003cspan class=\"isnad\">Pričao nam je Mudžahid ibn Musa, rekao je: Pričao nam je Jezid, rekao je: Pričao nam je Šu‘ba, od Katade, od Enesa ibn Malika, od Vjerovjesnika, neka mu Allah podari blagoslov i mir, \u003c/span>isto to, a u svojoj je predaji dodao:\u003c/p>\u003cp data-pair=\"13.6\" id=\"odlomak-13-6\">I pokazao je srednjim prstom i kažiprstom.\u003c/p>\u003cp data-pair=\"13.7\" id=\"odlomak-13-7\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Abdullah ibn Abdulhakem, rekao je: Pričao nam je Ejjub ibn Suvejd, od El-Evza‘ija, koji je rekao: Pričao nam je Ismail ibn Ubejdullah, rekao je: \u003c/span>Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa mu je El-Velid rekao: Šta si čuo od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da govori o Času? Rekao je: [Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori:\u003c/p>\u003cp data-pair=\"13.8\" id=\"odlomak-13-8\">Vi i Čas ste kao ova dva,] i pokazao je sa svoja dva prsta.\u003c/p>\u003cp data-pair=\"13.9\" id=\"odlomak-13-9\">\u003cspan class=\"isnad\">Pričao mi je El-Abbas ibn el-Velid, rekao je: Obavijestio me je moj otac, rekao je: Pričao nam je El-Evza‘i, rekao je: Pričao mi je Ismail ibn Ubejdullah, rekao je: \u003c/span>Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa mu je El-Velid rekao: Šta si čuo od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da govori o Času? [Rekao je: Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Vi i Čas ste „كتين“.] \u003cspan class=\"translator-note\">⟦Napomena prevodioca: na ovom mjestu prijepis ima nejasan zapis „كتين“; nije prešutno zamijenjen riječju iz paralelne predaje.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"13.10\" id=\"odlomak-13-10\">\u003cspan class=\"isnad\">Pričao mi je Ibn Abdurrahim el-Berki, rekao je: Pričao nam je Amr ibn Ebi Selema,\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":14,"html":"\u003csection class=\"page\" data-page=\"14\" id=\"stranica-14\">\u003ch2>Stranica 14\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 14\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"14.1\" id=\"ar-odlomak-14-1\">\u003cspan class=\"isnad\">عن الأوزاعي، قال: حدثنى اسمعيل بْنُ عُبَيْدِ اللَّهِ، قَالَ: \u003c/span>قَدِمَ أَنَسُ بْنُ مَالِكٍ عَلَى الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ، فَذَكَرَ مِثْلَهُ \u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا الْمُعْتَمِرُ بْنُ سُلَيْمَانَ، عَنْ أَبِيهِ، قَالَ: حَدَّثَنِي مَعْبَدٌ، حَدَّثَ أَنَسٌ، [عَنْ رَسُولِ اللَّهِ ص \u003c/span>أَنَّهُ قَالَ: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَقَالَ بِإِصْبَعَيْهِ: هَكَذَا.\u003c/p>\u003cp data-pair=\"14.2\" id=\"ar-odlomak-14-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ الْمُثَنَّى قَالَ: حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي التَّيَّاحِ، عَنْ أَنَسٍ، قَالَ: [قَالَ رَسُولُ الله ص:\u003c/span>\u003c/p>\u003cp data-pair=\"14.3\" id=\"ar-odlomak-14-3\">بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ:] السَّبَّابَةِ وَالْوُسْطَى قَالَ أَبُو مُوسَى: وَأَشَارَ وَهْبٌ بِالسَّبَّابَةِ وَالْوُسْطَى \u003cspan class=\"isnad\">حَدَّثَنِي عَبْدُ اللَّهِ بْنُ أَبِي زِيَادٍ، قَالَ: حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، قَالَ:\u003c/span>\u003c/p>\u003cp data-pair=\"14.4\" id=\"ar-odlomak-14-4\">\u003cspan class=\"isnad\">حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي التَّيَّاحِ وَقَتَادَةَ، عَنْ أَنَسٍ، قَالَ: [قَالَ رسول الله ص: \u003c/span>بعثت انا وَالسَّاعَةَ كَهَاتَيْنِ،] وَقَرَنَ بَيْنَ إِصْبَعَيْهِ.\u003c/p>\u003cp data-pair=\"14.5\" id=\"ar-odlomak-14-5\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ بَزِيعٍ، قَالَ: حَدَّثَنَا الفضيل بن سليمان، حَدَّثَنَا أَبُو حَازِمٍ، قَالَ: حَدَّثَنَا سَهْلُ بْنُ سعد، قال: \u003c/span>[رايت رسول الله ص قَالَ بِإِصْبَعَيْهِ هَكَذَا، الْوُسْطَى وَالَّتِي تَلِي الإِبْهَامَ: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .\u003c/p>\u003cp data-pair=\"14.6\" id=\"ar-odlomak-14-6\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ يَزِيدَ الأَدَمِيُّ، قَالَ: حَدَّثَنَا أَبُو ضَمْرَةَ، عَنْ أَبِي حَازِمٍ، عَنْ [سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ \u003c/span>ان رسول الله ص قَالَ: بُعِثْتُ وَالسَّاعَةَ كَهَاتَيْنِ- وَضَمَّ بَيْنَ إِصْبَعَيْهِ الْوُسْطَى، وَالَّتِي تَلِي الإِبْهَامَ- وَقَالَ: مَا مَثَلِي وَمَثَلُ السَّاعَةِ إِلا كَفَرَسَيْ رِهَانٍ، ثُمَّ قَالَ: مَا مَثَلِي وَمَثَلُ السَّاعَةِ إِلا كَمَثَلِ رَجُلٍ بَعَثَهُ قَوْمٌ طَلِيعَةً، فَلَمَّا خَشِيَ أَنْ يُسْبَقُ أَلاحَ بِثَوْبِهِ: أُتِيتُمْ، أُتِيتُمْ، أَنَا ذَاكَ أَنَا ذَاكَ] .\u003c/p>\u003cp data-pair=\"14.7\" id=\"ar-odlomak-14-7\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا خَالِدٌ، عَنْ مُحَمَّدِ بْنِ جَعْفَرٍ، عَنْ أَبِي حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رَسُولُ الله ص:\u003c/span>\u003c/p>\u003cp data-pair=\"14.8\" id=\"ar-odlomak-14-8\">بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَجَمَعَ بَيْنَ إِصْبَعَيْهِ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 14\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"14.1\" id=\"odlomak-14-1\">\u003cspan class=\"isnad\">od El-Evza‘ija, koji je rekao: Pričao mi je Ismail ibn Ubejdullah, rekao je: \u003c/span>Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa je spomenuo isto to. \u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Abdula‘la, rekao je: Pričao nam je El-Mu‘temir ibn Sulejman, od njegova oca, koji je rekao: Pričao mi je Ma‘bed; Enes je pripovijedao \u003c/span>[od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je rekao: Ja i Čas poslani smo kao ova dva,] i sa svoja dva prsta pokazao je: Ovako.\u003c/p>\u003cp data-pair=\"14.2\" id=\"odlomak-14-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn el-Musenna, rekao je: Pričao nam je Vehb ibn Džerir, rekao je: Pričao nam je Šu‘ba, od Ebu et-Tejjaha, od Enesa, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je:\u003c/p>\u003cp data-pair=\"14.3\" id=\"odlomak-14-3\">Ja i Čas poslani smo kao ova dva:] kažiprst i srednji prst. Ebu Musa je rekao: Vehb je pokazao kažiprstom i srednjim prstom. \u003cspan class=\"isnad\">Pričao mi je Abdullah ibn Ebi Zijad, rekao je: Pričao nam je Vehb ibn Džerir, rekao je:\u003c/span>\u003c/p>\u003cp data-pair=\"14.4\" id=\"odlomak-14-4\">\u003cspan class=\"isnad\">Pričao nam je Šu‘ba, od Ebu et-Tejjaha i Katade, od Enesa, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva,] i primakao je svoja dva prsta jedan drugome.\u003c/p>\u003cp data-pair=\"14.5\" id=\"odlomak-14-5\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Abdullah ibn Bezi‘, rekao je: Pričao nam je El-Fudajl ibn Sulejman; pričao nam je Ebu Hazim, rekao je: Pričao nam je Sehl ibn Sa‘d, rekao je: \u003c/span>[Vidio sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako sa svoja dva prsta, srednjim i onim do palca, pokazuje ovako: Ja i Čas poslani smo kao ova dva.]\u003c/p>\u003cp data-pair=\"14.6\" id=\"odlomak-14-6\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Jezid el-Ademi, rekao je: Pričao nam je Ebu Damra, od Ebu Hazima, od \u003c/span>[Sehla ibn Sa‘da es-Sa‘idija, da je Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao: Poslan sam i Čas kao ova dva — i primakao je svoja dva prsta, srednji i onaj do palca — i rekao: Moj primjer i primjer Časa jesu samo poput dva trkaća konja. Zatim je rekao: Moj primjer i primjer Časa jesu samo kao primjer čovjeka kojeg je njegov narod poslao kao izvidnika, pa je, kada se pobojao da će biti preteknut, zamahao svojom odjećom: Napadnuti ste! Napadnuti ste! Ja sam taj! Ja sam taj!]\u003c/p>\u003cp data-pair=\"14.7\" id=\"odlomak-14-7\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Halid, od Muhammeda ibn Džafera, od Ebu Hazima, od Sehla ibn Sa‘da, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je:\u003c/p>\u003cp data-pair=\"14.8\" id=\"odlomak-14-8\">Ja i Čas poslani smo kao ova dva,] i sastavio je svoja dva prsta.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":15,"html":"\u003csection class=\"page\" data-page=\"15\" id=\"stranica-15\">\u003ch2>Stranica 15\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 15\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"15.1\" id=\"ar-odlomak-15-1\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا خَالِدٌ، قَالَ: حَدَّثَنَا سُلَيْمَانُ بْنُ بِلالٍ، قَالَ: حَدَّثَنِي أَبُو حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رسول الله ص: \u003c/span>بُعِثْتُ أَنَا وَالسَّاعَةَ هَكَذَا،] وَقَرَنَ بَيْنَ إِصْبَعَيْهِ: الْوُسْطَى وَالَّتِي تَلِي الإِبْهَامَ.\u003c/p>\u003cp data-pair=\"15.2\" id=\"ar-odlomak-15-2\">\u003cspan class=\"isnad\">حَدَّثَنِي ابْنُ عَبْدِ الرحيم البرقي، عن سهل بن سعد، قَالَ: حَدَّثَنَا ابْنُ أَبِي مَرْيَمَ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ: حَدَّثَنِي أَبُو حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رَسُولُ الله ص: \u003c/span>بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَجَمَعَ بَيْنَ إِصْبَعَيْهِ.\u003c/p>\u003cp data-pair=\"15.3\" id=\"ar-odlomak-15-3\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، عَنْ بَشِيرِ بْنِ الْمُهَاجِرِ، قَالَ: حَدَّثَنِي عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ: [سَمِعْتُ رسول الله ص يَقُولُ: \u003c/span>بُعِثْتُ أَنَا وَالسَّاعَةَ جَمِيعًا، إِنْ كَادَتْ لِتَسْبِقَنِي] .\u003c/p>\u003cp data-pair=\"15.4\" id=\"ar-odlomak-15-4\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ عُمَرَ بْنِ هَيَّاجٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ عَبْدِ الرَّحْمَنِ، قَالَ: حَدَّثَنِي عُبَيْدَةُ بْنُ الأَسْوَدِ، عَنْ مُجَالِدٍ، عَنْ قَيْسِ بْنِ أَبِي حَازِمٍ، عَنِ الْمُسْتَوْرِدِ بْنِ شداد الفهري، [عن النبي ص \u003c/span>أَنَّهُ قَالَ: بُعِثْتُ فِي نَفْسِ السَّاعَةِ، سَبَقْتُهَا كَمَا سَبَقَتْ هَذِهِ هَذِهِ،] لإِصْبَعَيْهِ السَّبَّابَةِ وَالْوُسْطَى، وَوَصَفَ لَنَا أَبُو عَبْدِ اللَّهِ، وَجَمَعَهُمَا.\u003c/p>\u003cp data-pair=\"15.5\" id=\"ar-odlomak-15-5\">\u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدِ بْنِ حَبِيبٍ، قَالَ: حَدَّثَنَا أَبُو نَصْرٍ، قَالَ:\u003c/span>\u003c/p>\u003cp data-pair=\"15.6\" id=\"ar-odlomak-15-6\">\u003cspan class=\"isnad\">حَدَّثَنَا الْمَسْعُودِيُّ، عَنْ إِسْمَاعِيلَ بْنِ أَبِي خَالِدٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي جبيرة، قال: [قال رسول الله ص: \u003c/span>بُعِثْتُ مَعَ السَّاعَةِ كَهَاتَيْنِ، - وَأَشَارَ بِإِصْبَعَيْهِ الْوُسْطَى وَالسَّبَّابَةِ- كَفَضْلِ هَذِهِ عَلَى هَذِهِ] .\u003c/p>\u003cp data-pair=\"15.7\" id=\"ar-odlomak-15-7\">\u003cspan class=\"isnad\">حَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، قَالَ: أَخْبَرَنَا يَزِيدُ، قَالَ: أَخْبَرَنَا إِسْمَاعِيلُ، عَنْ شُبَيْلِ بْنِ عَوْفٍ، عَنْ أَبِي جُبَيْرَةَ، عَنْ أَشْيَاخٍ مِنَ الأَنْصَارِ، قَالُوا:\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 15\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"15.1\" id=\"odlomak-15-1\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Halid, rekao je: Pričao nam je Sulejman ibn Bilal, rekao je: Pričao mi je Ebu Hazim, od Sehla ibn Sa‘da, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo ovako,] i primakao je svoja dva prsta: srednji i onaj do palca.\u003c/p>\u003cp data-pair=\"15.2\" id=\"odlomak-15-2\">\u003cspan class=\"isnad\">Pričao mi je Ibn Abdurrahim el-Berki, od Sehla ibn Sa‘da, rekao je: Pričao nam je Ibn Ebi Merjem, rekao je: Pričao nam je Muhammed ibn Džafer, rekao je: Pričao mi je Ebu Hazim, od Sehla ibn Sa‘da, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva,] i sastavio je svoja dva prsta. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: ponovljeno ime Sehla ibn Sa‘da u lancu zadržano je kako stoji u prijepisu.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"15.3\" id=\"odlomak-15-3\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Ebu Nuajm, od Bešira ibn el-Muhadžira, koji je rekao: Pričao mi je Abdullah ibn Burejda, od njegova oca, koji je rekao: \u003c/span>[\u003cspan class=\"isnad\">Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: \u003c/span>Ja i Čas poslani smo zajedno; gotovo da me je pretekao.]\u003c/p>\u003cp data-pair=\"15.4\" id=\"odlomak-15-4\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Omer ibn Hejjadž, rekao je: Pričao nam je Jahja ibn Abdurrahman, rekao je: Pričao mi je Ubejda ibn el-Esved, od Mudžalida, od Kajsa ibn Ebi Hazima, od El-Mustevrida ibn Šeddada el-Fihrija, \u003c/span>[od Vjerovjesnika, neka mu Allah podari blagoslov i mir, da je rekao: Poslan sam pri samom dahu Časa; pretekao sam ga kao što je ovaj pretekao ovaj,] misleći na svoja dva prsta, kažiprst i srednji prst. Ebu Abdullah nam je to pokazao i sastavio ih.\u003c/p>\u003cp data-pair=\"15.5\" id=\"odlomak-15-5\">\u003cspan class=\"isnad\">Pričao mi je Ahmed ibn Muhammed ibn Habib, rekao je: Pričao nam je Ebu Nasr, rekao je:\u003c/span>\u003c/p>\u003cp data-pair=\"15.6\" id=\"odlomak-15-6\">\u003cspan class=\"isnad\">Pričao nam je El-Mes‘udi, od Ismaila ibn Ebi Halida, od Eš-Ša‘bija, od Ebu Džubejre, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Poslan sam s Časom kao ova dva — i pokazao je sa svoja dva prsta, srednjim i kažiprstom — poput razlike za koju je ovaj duži od ovoga.]\u003c/p>\u003cp data-pair=\"15.7\" id=\"odlomak-15-7\">\u003cspan class=\"isnad\">Pričao nam je Temim ibn el-Muntasir, rekao je: Obavijestio nas je Jezid, rekao je: Obavijestio nas je Ismail, od Šubejla ibn Avfa, od Ebu Džubejre, od starješina među ensarijama, koji su rekli:\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":16,"html":"\u003csection class=\"page\" data-page=\"16\" id=\"stranica-16\">\u003ch2>Stranica 16\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 16\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"16.1\" id=\"ar-odlomak-16-1\">[سمعنا رسول الله ص يَقُولُ: جِئْتُ أَنَا وَالسَّاعَةَ هَكَذَا]- قَالَ الطَّبَرِيُّ: وَأَرَانَا تَمِيمٌ، وَضَمَّ السَّبَّابَةَ وَالْوُسْطَى وَقَالَ لَنَا: أَشَارَ يَزِيدُ بِإِصْبَعَيْهِ السَّبَّابَةِ وَالْوُسْطَى وَضَمَّهُمَا-[وَقَالَ: سَبَقْتُهَا كَمَا سَبَقَتْ هَذِهِ هَذِهِ فِي نَفْسِ من الساعة، او في نَفْسَ السَّاعَةِ] .\u003c/p>\u003cp data-pair=\"16.2\" id=\"ar-odlomak-16-2\">فمعلوم إذ كان اليوم أوله طلوع الفجر وآخره غروب الشمس، وكان صحيحا عن نبينا ص، ما رويناه عنه قبل، أنه قال بعد ما صلى العصر: ما بقي من الدنيا فِيمَا مَضَى مِنْهَا إِلا كَمَا بَقِيَ مِنْ يومكم هذا فيما مضى منه.\u003c/p>\u003cp data-pair=\"16.3\" id=\"ar-odlomak-16-3\">وأنه قال لأصحابه: بعثت أنا والساعة كهاتين- وجمع بين السبابة والوسطى- سبقتها بقدر هذه من هذه، يعني الوسطى من السبابة وكان قدر ما بين اوسط اوقات صلاه العصر- وذلك إذا صار ظل كل شيء مثليه- على التحري إنما يكون قدر نصف سبع اليوم، يزيد قليلا أو ينقص قليلا، وكذلك فضل ما بين الوسطى والسبابة، إنما يكون نحوا من ذلك وقريبا منه.\u003c/p>\u003cp data-pair=\"16.4\" id=\"ar-odlomak-16-4\">وكان صحيحا مع ذلك عن رسول الله ص ما \u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ وَهْبٍ، قَالَ: حَدَّثَنِي عَمِّي عَبْدُ اللَّهِ بْنُ وَهْبٍ، قَالَ:\u003c/span>\u003c/p>\u003cp data-pair=\"16.5\" id=\"ar-odlomak-16-5\">\u003cspan class=\"isnad\">حَدَّثَنِي مُعَاوِيَةُ بْنُ صَالِحٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ جُبَيْرِ بْنِ نُفَيْرٍ، أَنَّهُ سَمِعَ أَبَا ثعلبه الخشني صاحب النبي ص يقول: \u003c/span>[ان رسول الله ص قَالَ: لَنْ يُعْجِزَ اللَّهُ هَذِهِ الأُمَّةَ مِنْ نصف يوم،] وكان معنى قول النبي ذلك أن لن يعجز الله هذه الأمة من نصف يوم الذي مقداره ألف سنة- كان بينا أن أولى القولين- اللذين ذكرت في مبلغ قدر مدة جميع الزمان، اللذين أحدهما عن ابن عباس، والآخر منهما عن كعب- بالصواب، وأشبههما بما دلت عليه الأخبار الوارده عن رسول الله ص قول ابن عباس، الذي روينا عنه أنه قال: الدنيا جمعة من جمع الآخرة سبعة آلاف سنه\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 16\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"16.1\" id=\"odlomak-16-1\">[Čuli smo Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Došao sam ja i Čas ovako] — Et-Taberi je rekao: Temim nam je pokazao i primakao kažiprst i srednji prst, i rekao nam je: Jezid je pokazao svojim dvama prstima, kažiprstom i srednjim prstom, i primakao ih — [i rekao: Pretekao sam ga kao što je ovaj pretekao ovaj, pri jednom dahu Časa, ili pri samom dahu Časa.]\u003c/p>\u003cp data-pair=\"16.2\" id=\"odlomak-16-2\">Poznato je, budući da dan počinje izlaskom zore, a završava zalaskom Sunca, i budući da je vjerodostojno preneseno od našega Vjerovjesnika, neka mu Allah podari blagoslov i mir, ono što smo ranije od njega prenijeli: da je, nakon što je klanjao ikindiju, rekao: Od ovoga svijeta u odnosu na ono što je od njega prošlo ostalo je samo kao ono što je ostalo od ovoga vašeg dana u odnosu na ono što je od njega prošlo.\u003c/p>\u003cp data-pair=\"16.3\" id=\"odlomak-16-3\">I da je svojim ashabima rekao: Ja i Čas poslani smo kao ova dva — i sastavio je kažiprst i srednji prst — pretekao sam ga za razliku ovoga u odnosu na ovaj, misleći na srednji prst u odnosu na kažiprst. A mjera vremena između sredine ikindijskog vremena — to je kada sjenka svake stvari postane dvostruka — \u003cspan class=\"translator-note\">⟦Napomena prevodioca: završna tačka ovog vremenskog raspona nije izričito navedena u dostupnoj rečenici.⟧\u003c/span>, prema približnoj procjeni, iznosi samo polovinu sedmine dana, malo više ili malo manje. Također, razlika između srednjeg prsta i kažiprsta iznosi otprilike toliko i blizu tome.\u003c/p>\u003cp data-pair=\"16.4\" id=\"odlomak-16-4\">A uz to je vjerodostojno preneseno od Allahova Poslanika, neka mu Allah podari blagoslov i mir, ono što \u003cspan class=\"isnad\">mi je pričao Ahmed ibn Abdurrahman ibn Vehb, rekao je: Pričao mi je moj amidža Abdullah ibn Vehb, rekao je:\u003c/span>\u003c/p>\u003cp data-pair=\"16.5\" id=\"odlomak-16-5\">\u003cspan class=\"isnad\">Pričao mi je Muavija ibn Salih, od Abdurrahmana ibn Džubejra ibn Nufejra, od njegova oca Džubejra ibn Nufejra, da je čuo Ebu Sa‘lebu el-Hušenija, ashaba Vjerovjesnika, neka mu Allah podari blagoslov i mir, kako govori: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Allah neće ovu zajednicu učiniti nemoćnom za polovinu dana.] A značenje tih Vjerovjesnikovih riječi bilo je da Allah ovu zajednicu neće učiniti nemoćnom za polovinu dana čije trajanje iznosi hiljadu godina. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: konstrukcija „لن يعجز الله هذه الأمة“ prenesena je doslovno; njeno značenje zahtijeva jezičku provjeru, bez prešutnog prepravljanja.⟧\u003c/span> Bilo je, dakle, jasno da je od dvaju stavova koje sam spomenuo o ukupnom trajanju svega vremena — jednoga prenesenog od Ibn Abbasa, a drugoga od Ka‘ba — ispravnosti bliži i vijestima prenesenim od Allahova Poslanika, neka mu Allah podari blagoslov i mir, sličniji stav Ibn Abbasa, od kojeg smo prenijeli da je rekao: Ovaj svijet je jedna sedmica među sedmicama onoga svijeta, sedam hiljada godina.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":17,"html":"\u003csection class=\"page\" data-page=\"17\" id=\"stranica-17\">\u003ch2>Stranica 17\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 17\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"17.1\" id=\"ar-odlomak-17-1\">وإذ كان ذلك كذلك، وكان الخبر عن رسول الله ص صحيحا أنه أخبر عن الباقي من ذلك في حياته انه نصف يوم، وذلك خمسمائة عام، إذ كان ذلك نصف يوم من الأيام التي قدر اليوم الواحد منها ألف عام- كان معلوما أن الماضي من الدنيا الى وقت قول النبي ص ما رويناه عن أبي ثعلبة الخشني عنه، كان قدر سته آلاف سنه وخمسمائة سنة، أو نحوا من ذلك وقريبا منه والله أعلم.\u003c/p>\u003cp data-pair=\"17.2\" id=\"ar-odlomak-17-2\">فهذا الذي قلنا- في قدر مدة أزمان الدنيا، من مبدأ أولها إلى منتهى آخرها- من أثبت ما قيل في ذلك عندنا من القول، للشواهد الدالة التي بيناها على صحة ذلك.\u003c/p>\u003cp data-pair=\"17.3\" id=\"ar-odlomak-17-3\">وقد روي عن رسول الله ص خبر يدل على صحة قول من قال: إن الدنيا كلها ستة آلاف سنة، لو كان صحيحا سنده لم نعد القول به إلى غيره، وذلك ما \u003cspan class=\"isnad\">حَدَّثَنِي بِهِ مُحَمَّدُ بْنُ سِنَانٍ الْقَزَّازُ، قَالَ: حَدَّثَنَا عَبْدُ الصَّمَدِ ابن عبد الوارث، حدثنا زبان، عَنْ عَاصِمٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هريرة، ان [رسول الله ص قَالَ: \u003c/span>الْحُقْبُ ثَمَانُونَ عَامًا، الْيَوْمُ مِنْهَا سُدُسُ الدُّنْيَا] .\u003c/p>\u003cp data-pair=\"17.4\" id=\"ar-odlomak-17-4\">فبين في هذا الخبر أن الدنيا كلها ستة آلاف سنة، وذلك أن اليوم الذي هو من أيام الآخرة إذا كان مقداره ألف سنة من سني الدنيا، وكان اليوم الواحد من ذلك سدس الدنيا، كان معلوما بذلك أن جميعها ستة أيام من أيام الآخرة، وذلك ستة آلاف سنة.\u003c/p>\u003cp data-pair=\"17.5\" id=\"ar-odlomak-17-5\">وقد زعم اليهود أن جميع ما ثبت عندهم- على ما في التوراة مما هو فيها من لدن خلق الله آدم إلى وقت الهجرة، وذلك في التوراة التي هي في ايديهم اليوم- اربعه آلاف سنه وستمائه سنة واثنتان وأربعون سنة، وقد ذكروا تفصيل ذلك بولادة رجل رجل، ونبي نبي، وموته من عهد آدم إلى هجرة نبينا محمد ص\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 17\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"17.1\" id=\"odlomak-17-1\">Budući da je tako i da je vjerodostojna vijest od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je za svoga života obavijestio kako od toga preostaje pola dana, a to je pet stotina godina, jer je to polovina jednoga od dana čije trajanje iznosi hiljadu godina, poznato je da je od ovoga svijeta do vremena kada je Vjerovjesnik, neka mu Allah podari blagoslov i mir, izgovorio ono što smo od njega prenijeli preko Ebu Sa‘lebe el-Hušenija prošlo šest hiljada i pet stotina godina ili približno tome i blizu toga. A Allah najbolje zna.\u003c/p>\u003cp data-pair=\"17.2\" id=\"odlomak-17-2\">Ovo što smo rekli o dužini trajanja vremena ovoga svijeta, od njegova prvog početka do njegova posljednjeg završetka, prema nama pripada najčvršćim stavovima izrečenim o tome, zbog dokaznih svjedočanstava kojima smo razjasnili njegovu ispravnost.\u003c/p>\u003cp data-pair=\"17.3\" id=\"odlomak-17-3\">Od Allahova Poslanika, neka mu Allah podari blagoslov i mir, prenesena je vijest koja ukazuje na ispravnost stava onoga ko kaže da cijeli ovaj svijet traje šest hiljada godina. Kada bi njen lanac prenosilaca bio vjerodostojan, ne bismo od toga stava prešli na drugi. To je ono što \u003cspan class=\"isnad\">mi je pričao Muhammed ibn Sinan el-Kazzaz, rekao je: Pričao nam je Abdussamed ibn Abdulvaris; pričao nam je Zebban, od Asima, od Ebu Saliha, od Ebu Hurejre, \u003c/span>da je [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao: Hukb je osamdeset godina; jedan njegov dan je šestina ovoga svijeta.]\u003c/p>\u003cp data-pair=\"17.4\" id=\"odlomak-17-4\">U ovoj je vijesti jasno da cijeli ovaj svijet traje šest hiljada godina, jer ako dan koji pripada danima onoga svijeta iznosi hiljadu godina od godina ovoga svijeta, a jedan takav dan predstavlja šestinu ovoga svijeta, time je poznato da on u cijelosti traje šest dana od dana onoga svijeta, a to je šest hiljada godina.\u003c/p>\u003cp data-pair=\"17.5\" id=\"odlomak-17-5\">Jevreji tvrde da ukupno ono što je kod njih utvrđeno — prema onome što se nalazi u Tevratu, od kada je Allah stvorio Adema do vremena Hidžre, i to u Tevratu koji je danas u njihovim rukama — iznosi četiri hiljade šest stotina četrdeset i dvije godine. To su podrobno izložili navodeći rođenje čovjeka po čovjeka i vjerovjesnika po vjerovjesnika i njegovu smrt, od Ademova vremena do Hidžre našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":18,"html":"\u003csection class=\"page\" data-page=\"18\" id=\"stranica-18\">\u003ch2>Stranica 18\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 18\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"18.1\" id=\"ar-odlomak-18-1\">وسأذكر تفصيلهم ذلك إن شاء الله، وتفصيل غيرهم ممن فصله من علماء أهل الكتب وغيرهم من أهل العلم بالسير وأخبار الناس إذا انتهيت إليه إن شاء الله.\u003c/p>\u003cp data-pair=\"18.2\" id=\"ar-odlomak-18-2\">وأما اليونانية من النصارى فإنها تزعم أن الذي ادعته اليهود من ذلك باطل، وأن الصحيح من القول في قدر مدة أيام الدنيا- من لدن خلق الله آدم إلى وقت هجره نبينا محمد ص على سياق ما عندهم في التوراة التي هي في ايديهم- خمسه آلاف سنه وتسعمائة سنة واثنتان وتسعون سنة وأشهر وذكروا تفصيل ما ادعوه من ذلك بولادة نبي نبي، وملك ملك، ووفاته من عهد آدم إلى وقت هجره رسول الله ص، وزعموا أن اليهود إنما نقصوا ما نقصوا من عدد سني ما بين تاريخهم وتاريخ النصارى دفعا منهم لنبوه عيسى بن مريم ع إذ كانت صفته ووقت مبعثه مثبتة في التوراة وقالوا: لم يأت الوقت الذي وقت لنا في التوراة أن الذي صفته صفة عيسى يكون فيه، وهم ينتظرون- بزعمهم- خروجه ووقته.\u003c/p>\u003cp data-pair=\"18.3\" id=\"ar-odlomak-18-3\">واحسب أن الذي ينتظرونه ويدعون أن صفته في التوراة مثبتة، هو الدجال الذي وصفه رسول الله ص لأمته، وذكر لهم أن عامة أتباعه اليهود، فإن كان ذلك هو عبد الله بن صياد، فهو من نسل اليهود.\u003c/p>\u003cp data-pair=\"18.4\" id=\"ar-odlomak-18-4\">وأما المجوس فإنهم يزعمون أن قدر مدة الزمان من لدن ملك جيومرت إلى وقت هجرة نبينا ص ثلاثة آلاف سنة ومائة سنة وتسع وثلاثون سنة، وهم لا يذكرون مع ذلك نسبا يعرف فوق جيومرت، ويزعمون أنه آدم أبو البشر، ص وعلى جميع أنبياء الله ورسله.\u003c/p>\u003cp data-pair=\"18.5\" id=\"ar-odlomak-18-5\">ثم أهل الأخبار بعد في أمره مختلفون، فمن قائل منهم فيه مثل قول المجوس، ومن قائل منهم إنه تسمى بآدم بعد أن ملك الأقاليم السبعة، وأنه إنما هو جامر بن يافث ابن نوح، كان بنوح ع برا ولخدمته ملازما، وعليه حدبا شفيقا، فدعا الله له ولذريته نوح- لذلك من بره به وخدمته له- بطول العمر، والتمكين في\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 18\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"18.1\" id=\"odlomak-18-1\">Njihovo podrobno izlaganje spomenut ću, ako Allah htjedne, kao i podrobno izlaganje drugih koji su to izložili među učenjacima sljedbenika knjiga i drugim poznavaocima životopisa i ljudskih vijesti, kada do toga dođem, ako Allah htjedne.\u003c/p>\u003cp data-pair=\"18.2\" id=\"odlomak-18-2\">A grčki kršćani tvrde da je ono što su Jevreji tvrdili o tome neistinito i da ispravan stav o trajanju dana ovoga svijeta — od kada je Allah stvorio Adema do vremena Hidžre našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir, prema redoslijedu onoga što imaju u Tevratu koji je u njihovim rukama — iznosi pet hiljada devet stotina devedeset i dvije godine i nekoliko mjeseci. Podrobno su izložili ono što su o tome tvrdili, navodeći rođenje vjerovjesnika po vjerovjesnika i vladara po vladara i njegovu smrt, od Ademova vremena do vremena Hidžre Allahova Poslanika, neka mu Allah podari blagoslov i mir. Tvrdili su da su Jevreji umanjili broj godina za onoliko za koliko se njihov račun razlikuje od kršćanskoga računa kako bi odbacili vjerovjesništvo Isaa, sina Merjemina, neka je mir na njega, jer su njegov opis i vrijeme njegova poslanja zapisani u Tevratu. Rekli su: Još nije došlo vrijeme koje nam je u Tevratu određeno za dolazak onoga čiji je opis poput Isaova opisa. Oni, prema vlastitoj tvrdnji, očekuju njegov dolazak i njegovo vrijeme.\u003c/p>\u003cp data-pair=\"18.3\" id=\"odlomak-18-3\">Smatram da je onaj koga očekuju i za čiji opis tvrde da je zapisan u Tevratu Dedždžal kojeg je Allahov Poslanik, neka mu Allah podari blagoslov i mir, opisao svome ummetu i spomenuo im da će većina njegovih sljedbenika biti Jevreji. Ako je taj Abdullah ibn Sajjad, onda je on od jevrejskog potomstva.\u003c/p>\u003cp data-pair=\"18.4\" id=\"odlomak-18-4\">A medžusije tvrde da trajanje vremena od početka Gejumertove vladavine do vremena Hidžre našega Vjerovjesnika, neka mu Allah podari blagoslov i mir, iznosi tri hiljade stotinu trideset i devet godina. Uz to ne navode poznato rodoslovlje iznad Gejumerta i tvrde da je on Adem, otac čovječanstva, neka mu Allah podari blagoslov i mir, kao i svim Allahovim vjerovjesnicima i poslanicima.\u003c/p>\u003cp data-pair=\"18.5\" id=\"odlomak-18-5\">Poznavaoci vijesti ipak se razilaze o njemu. Neki govore isto što i medžusije. Neki govore da se nazvao Ademom nakon što je zavladao sedmerim oblastima i da je on zapravo Džamir ibn Jafes ibn Nuh, koji je prema Nuhu, neka je mir na njega, bio dobročinitelj, stalno mu služio i bio prema njemu brižan i milostiv. Zato je Nuh — zbog njegova dobročinstva i služenja njemu — molio Allaha da njemu i njegovu potomstvu podari dug život, učvršćenost u\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":19,"html":"\u003csection class=\"page\" data-page=\"19\" id=\"stranica-19\">\u003ch2>Stranica 19\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 19\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"19.1\" id=\"ar-odlomak-19-1\">البلاد، والنصر على من ناوأه وإياهم، واتصال الملك له ولذريته، ودوامه له ولهم، فاستجيب له فيه، فأعطى جيومرت ذلك وولده، فهو ابو الفراس، ولم يزل الملك فيه وفي ولده إلى أن زال عنهم بدخول المسلمين مدائن كسرى، وغلبة أهل الإسلام إياهم على ملكهم.\u003c/p>\u003cp data-pair=\"19.2\" id=\"ar-odlomak-19-2\">ومن قائل غير ذلك، وسنذكر إن شاء الله ما انتهى إلينا من القول فيه إذا انتهينا إلى ذكرنا تاريخ الملوك ومبالغ أعمارهم، وأنسابهم وأسباب ملكهم\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 19\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"19.1\" id=\"odlomak-19-1\">zemljama, pobjedu nad onima koji se njemu i njima suprotstave, te neprekinutu vlast njemu i njegovu potomstvu i njeno trajanje njemu i njima. Njegova je molba za njega bila uslišana, pa je to dato Gejumertu i njegovu potomstvu. On je otac „el-firas“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: prijepis glasi „الفراس“; moguće čitanje kao naziv naroda nije ovdje prešutno usvojeno.⟧\u003c/span>. Vlast je ostala u njemu i njegovu potomstvu sve dok im nije nestala ulaskom muslimana u Kisrine gradove i pobjedom sljedbenika islama nad njima u njihovoj vlasti.\u003c/p>\u003cp data-pair=\"19.2\" id=\"odlomak-19-2\">Neki govore drugačije od toga. Spomenut ćemo, ako Allah htjedne, ono što je do nas stiglo od stavova o njemu kada dođemo do spominjanja historije vladara, dužina njihovih života, njihovih rodoslovlja i uzroka njihove vlasti.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":20,"html":"\u003csection class=\"page\" data-page=\"20\" id=\"stranica-20\">\u003ch2>Stranica 20\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 20\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"20.1\" id=\"ar-odlomak-20-1\">[القول في الدلالة على حدوث الأوقات والأزمان والليل والنهار]\u003c/p>\u003cp data-pair=\"20.2\" id=\"ar-odlomak-20-2\">قد قلنا قبل إن الزمان إنما هو اسم لساعات الليل والنهار، وساعات الليل والنهار إنما هي مقادير من جري الشمس والقمر في الفلك، كما قال الله عز وجل:\u003c/p>\u003cp data-pair=\"20.3\" id=\"ar-odlomak-20-3\">«وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهارَ فَإِذا هُمْ مُظْلِمُونَ وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ وَالْقَمَرَ قَدَّرْناهُ مَنازِلَ حَتَّى عادَ كَالْعُرْجُونِ الْقَدِيمِ لَا الشَّمْسُ يَنْبَغِي لَها أَنْ تُدْرِكَ الْقَمَرَ وَلَا اللَّيْلُ سابِقُ النَّهارِ وَكُلٌّ فِي فَلَكٍ يَسْبَحُونَ» .\u003c/p>\u003cp data-pair=\"20.4\" id=\"ar-odlomak-20-4\">فإذا كان الزمان ما ذكرنا من ساعات الليل والنهار، وكانت ساعات الليل والنهار إنما هي قطع الشمس والقمر درجات الفلك، كان بيقين معلوما أن الزمان محدث والليل والنهار محدثان، وان محدث ذلك الله الذي تفرد بإحداث جميع خلقه، كما قال: «وَ
