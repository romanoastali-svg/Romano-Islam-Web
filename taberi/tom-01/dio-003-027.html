ذِهِ الأُمَّةَ مِنْ نصف يوم،] وكان معنى قول النبي ذلك أن لن يعجز الله هذه الأمة من نصف يوم الذي مقداره ألف سنة- كان بينا أن أولى القولين- اللذين ذكرت في مبلغ قدر مدة جميع الزمان، اللذين أحدهما عن ابن عباس، والآخر منهما عن كعب- بالصواب، وأشبههما بما دلت عليه الأخبار الوارده عن رسول الله ص قول ابن عباس، الذي روينا عنه أنه قال: الدنيا جمعة من جمع الآخرة سبعة آلاف سنه","bs":"Pričao mi je Muavija ibn Salih, od Abdurrahmana ibn Džubejra ibn Nufejra, od njegova oca Džubejra ibn Nufejra, da je čuo Ebu Sa‘lebu el-Hušenija, ashaba Vjerovjesnika, neka mu Allah podari blagoslov i mir, kako govori: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Allah neće ovu zajednicu učiniti nemoćnom za polovinu dana.] A značenje tih Vjerovjesnikovih riječi bilo je da Allah ovu zajednicu neće učiniti nemoćnom za polovinu dana čije trajanje iznosi hiljadu godina. ⟦Napomena prevodioca: konstrukcija „لن يعجز الله هذه الأمة“ prenesena je doslovno; njeno značenje zahtijeva jezičku provjeru, bez prešutnog prepravljanja.⟧ Bilo je, dakle, jasno da je od dvaju stavova koje sam spomenuo o ukupnom trajanju svega vremena — jednoga prenesenog od Ibn Abbasa, a drugoga od Ka‘ba — ispravnosti bliži i vijestima prenesenim od Allahova Poslanika, neka mu Allah podari blagoslov i mir, sličniji stav Ibn Abbasa, od kojeg smo prenijeli da je rekao: Ovaj svijet je jedna sedmica među sedmicama onoga svijeta, sedam hiljada godina.","ar_ranges":[[0,180]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُعَاوِيَةُ بْنُ صَالِحٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ جُبَيْرِ بْنِ نُفَيْرٍ، أَنَّهُ سَمِعَ أَبَا ثعلبه الخشني صاحب النبي ص يقول: \u003c/span>[ان رسول الله ص قَالَ: لَنْ يُعْجِزَ اللَّهُ هَذِهِ الأُمَّةَ مِنْ نصف يوم،] وكان معنى قول النبي ذلك أن لن يعجز الله هذه الأمة من نصف يوم الذي مقداره ألف سنة- كان بينا أن أولى القولين- اللذين ذكرت في مبلغ قدر مدة جميع الزمان، اللذين أحدهما عن ابن عباس، والآخر منهما عن كعب- بالصواب، وأشبههما بما دلت عليه الأخبار الوارده عن رسول الله ص قول ابن عباس، الذي روينا عنه أنه قال: الدنيا جمعة من جمع الآخرة سبعة آلاف سنه","bs_ranges":[[0,219]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muavija ibn Salih, od Abdurrahmana ibn Džubejra ibn Nufejra, od njegova oca Džubejra ibn Nufejra, da je čuo Ebu Sa‘lebu el-Hušenija, ashaba Vjerovjesnika, neka mu Allah podari blagoslov i mir, kako govori: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Allah neće ovu zajednicu učiniti nemoćnom za polovinu dana.] A značenje tih Vjerovjesnikovih riječi bilo je da Allah ovu zajednicu neće učiniti nemoćnom za polovinu dana čije trajanje iznosi hiljadu godina. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: konstrukcija „لن يعجز الله هذه الأمة“ prenesena je doslovno; njeno značenje zahtijeva jezičku provjeru, bez prešutnog prepravljanja.⟧\u003c/span> Bilo je, dakle, jasno da je od dvaju stavova koje sam spomenuo o ukupnom trajanju svega vremena — jednoga prenesenog od Ibn Abbasa, a drugoga od Ka‘ba — ispravnosti bliži i vijestima prenesenim od Allahova Poslanika, neka mu Allah podari blagoslov i mir, sličniji stav Ibn Abbasa, od kojeg smo prenijeli da je rekao: Ovaj svijet je jedna sedmica među sedmicama onoga svijeta, sedam hiljada godina."}],"notes":[]},{"n":17,"ar":"وإذ كان ذلك كذلك، وكان الخبر عن رسول الله ص صحيحا أنه أخبر عن الباقي من ذلك في حياته انه نصف يوم، وذلك خمسمائة عام، إذ كان ذلك نصف يوم من الأيام التي قدر اليوم الواحد منها ألف عام- كان معلوما أن الماضي من الدنيا الى وقت قول النبي ص ما رويناه عن أبي ثعلبة الخشني عنه، كان قدر سته آلاف سنه وخمسمائة سنة، أو نحوا من ذلك وقريبا منه والله أعلم.\n\nفهذا الذي قلنا- في قدر مدة أزمان الدنيا، من مبدأ أولها إلى منتهى آخرها- من أثبت ما قيل في ذلك عندنا من القول، للشواهد الدالة التي بيناها على صحة ذلك.\n\nوقد روي عن رسول الله ص خبر يدل على صحة قول من قال: إن الدنيا كلها ستة آلاف سنة، لو كان صحيحا سنده لم نعد القول به إلى غيره، وذلك ما حَدَّثَنِي بِهِ مُحَمَّدُ بْنُ سِنَانٍ الْقَزَّازُ، قَالَ: حَدَّثَنَا عَبْدُ الصَّمَدِ ابن عبد الوارث، حدثنا زبان، عَنْ عَاصِمٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هريرة، ان [رسول الله ص قَالَ: الْحُقْبُ ثَمَانُونَ عَامًا، الْيَوْمُ مِنْهَا سُدُسُ الدُّنْيَا] .\n\nفبين في هذا الخبر أن الدنيا كلها ستة آلاف سنة، وذلك أن اليوم الذي هو من أيام الآخرة إذا كان مقداره ألف سنة من سني الدنيا، وكان اليوم الواحد من ذلك سدس الدنيا، كان معلوما بذلك أن جميعها ستة أيام من أيام الآخرة، وذلك ستة آلاف سنة.\n\nوقد زعم اليهود أن جميع ما ثبت عندهم- على ما في التوراة مما هو فيها من لدن خلق الله آدم إلى وقت الهجرة، وذلك في التوراة التي هي في ايديهم اليوم- اربعه آلاف سنه وستمائه سنة واثنتان وأربعون سنة، وقد ذكروا تفصيل ذلك بولادة رجل رجل، ونبي نبي، وموته من عهد آدم إلى هجرة نبينا محمد ص","bs":"\u003cp data-paragraph=\"17.1\">Budući da je tako i da je vjerodostojna vijest od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je za svoga života obavijestio kako od toga preostaje pola dana, a to je pet stotina godina, jer je to polovina jednoga od dana čije trajanje iznosi hiljadu godina, poznato je da je od ovoga svijeta do vremena kada je Vjerovjesnik, neka mu Allah podari blagoslov i mir, izgovorio ono što smo od njega prenijeli preko Ebu Sa‘lebe el-Hušenija prošlo šest hiljada i pet stotina godina ili približno tome i blizu toga. A Allah najbolje zna.\u003c/p>\u003cp data-paragraph=\"17.2\">Ovo što smo rekli o dužini trajanja vremena ovoga svijeta, od njegova prvog početka do njegova posljednjeg završetka, prema nama pripada najčvršćim stavovima izrečenim o tome, zbog dokaznih svjedočanstava kojima smo razjasnili njegovu ispravnost.\u003c/p>\u003cp data-paragraph=\"17.3\">Od Allahova Poslanika, neka mu Allah podari blagoslov i mir, prenesena je vijest koja ukazuje na ispravnost stava onoga ko kaže da cijeli ovaj svijet traje šest hiljada godina. Kada bi njen lanac prenosilaca bio vjerodostojan, ne bismo od toga stava prešli na drugi. To je ono što mi je pričao Muhammed ibn Sinan el-Kazzaz, rekao je: Pričao nam je Abdussamed ibn Abdulvaris; pričao nam je Zebban, od Asima, od Ebu Saliha, od Ebu Hurejre, da je [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao: Hukb je osamdeset godina; jedan njegov dan je šestina ovoga svijeta.]\u003c/p>\u003cp data-paragraph=\"17.4\">U ovoj je vijesti jasno da cijeli ovaj svijet traje šest hiljada godina, jer ako dan koji pripada danima onoga svijeta iznosi hiljadu godina od godina ovoga svijeta, a jedan takav dan predstavlja šestinu ovoga svijeta, time je poznato da on u cijelosti traje šest dana od dana onoga svijeta, a to je šest hiljada godina.\u003c/p>\u003cp data-paragraph=\"17.5\">Jevreji tvrde da ukupno ono što je kod njih utvrđeno — prema onome što se nalazi u Tevratu, od kada je Allah stvorio Adema do vremena Hidžre, i to u Tevratu koji je danas u njihovim rukama — iznosi četiri hiljade šest stotina četrdeset i dvije godine. To su podrobno izložili navodeći rođenje čovjeka po čovjeka i vjerovjesnika po vjerovjesnika i njegovu smrt, od Ademova vremena do Hidžre našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir.\u003c/p>","paragraphs":[{"id":"17.1","ar":"وإذ كان ذلك كذلك، وكان الخبر عن رسول الله ص صحيحا أنه أخبر عن الباقي من ذلك في حياته انه نصف يوم، وذلك خمسمائة عام، إذ كان ذلك نصف يوم من الأيام التي قدر اليوم الواحد منها ألف عام- كان معلوما أن الماضي من الدنيا الى وقت قول النبي ص ما رويناه عن أبي ثعلبة الخشني عنه، كان قدر سته آلاف سنه وخمسمائة سنة، أو نحوا من ذلك وقريبا منه والله أعلم.","bs":"Budući da je tako i da je vjerodostojna vijest od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je za svoga života obavijestio kako od toga preostaje pola dana, a to je pet stotina godina, jer je to polovina jednoga od dana čije trajanje iznosi hiljadu godina, poznato je da je od ovoga svijeta do vremena kada je Vjerovjesnik, neka mu Allah podari blagoslov i mir, izgovorio ono što smo od njega prenijeli preko Ebu Sa‘lebe el-Hušenija prošlo šest hiljada i pet stotina godina ili približno tome i blizu toga. A Allah najbolje zna.","ar_ranges":[],"ar_html":"وإذ كان ذلك كذلك، وكان الخبر عن رسول الله ص صحيحا أنه أخبر عن الباقي من ذلك في حياته انه نصف يوم، وذلك خمسمائة عام، إذ كان ذلك نصف يوم من الأيام التي قدر اليوم الواحد منها ألف عام- كان معلوما أن الماضي من الدنيا الى وقت قول النبي ص ما رويناه عن أبي ثعلبة الخشني عنه، كان قدر سته آلاف سنه وخمسمائة سنة، أو نحوا من ذلك وقريبا منه والله أعلم.","bs_ranges":[],"bs_html":"Budući da je tako i da je vjerodostojna vijest od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je za svoga života obavijestio kako od toga preostaje pola dana, a to je pet stotina godina, jer je to polovina jednoga od dana čije trajanje iznosi hiljadu godina, poznato je da je od ovoga svijeta do vremena kada je Vjerovjesnik, neka mu Allah podari blagoslov i mir, izgovorio ono što smo od njega prenijeli preko Ebu Sa‘lebe el-Hušenija prošlo šest hiljada i pet stotina godina ili približno tome i blizu toga. A Allah najbolje zna."},{"id":"17.2","ar":"فهذا الذي قلنا- في قدر مدة أزمان الدنيا، من مبدأ أولها إلى منتهى آخرها- من أثبت ما قيل في ذلك عندنا من القول، للشواهد الدالة التي بيناها على صحة ذلك.","bs":"Ovo što smo rekli o dužini trajanja vremena ovoga svijeta, od njegova prvog početka do njegova posljednjeg završetka, prema nama pripada najčvršćim stavovima izrečenim o tome, zbog dokaznih svjedočanstava kojima smo razjasnili njegovu ispravnost.","ar_ranges":[],"ar_html":"فهذا الذي قلنا- في قدر مدة أزمان الدنيا، من مبدأ أولها إلى منتهى آخرها- من أثبت ما قيل في ذلك عندنا من القول، للشواهد الدالة التي بيناها على صحة ذلك.","bs_ranges":[],"bs_html":"Ovo što smo rekli o dužini trajanja vremena ovoga svijeta, od njegova prvog početka do njegova posljednjeg završetka, prema nama pripada najčvršćim stavovima izrečenim o tome, zbog dokaznih svjedočanstava kojima smo razjasnili njegovu ispravnost."},{"id":"17.3","ar":"وقد روي عن رسول الله ص خبر يدل على صحة قول من قال: إن الدنيا كلها ستة آلاف سنة، لو كان صحيحا سنده لم نعد القول به إلى غيره، وذلك ما حَدَّثَنِي بِهِ مُحَمَّدُ بْنُ سِنَانٍ الْقَزَّازُ، قَالَ: حَدَّثَنَا عَبْدُ الصَّمَدِ ابن عبد الوارث، حدثنا زبان، عَنْ عَاصِمٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هريرة، ان [رسول الله ص قَالَ: الْحُقْبُ ثَمَانُونَ عَامًا، الْيَوْمُ مِنْهَا سُدُسُ الدُّنْيَا] .","bs":"Od Allahova Poslanika, neka mu Allah podari blagoslov i mir, prenesena je vijest koja ukazuje na ispravnost stava onoga ko kaže da cijeli ovaj svijet traje šest hiljada godina. Kada bi njen lanac prenosilaca bio vjerodostojan, ne bismo od toga stava prešli na drugi. To je ono što mi je pričao Muhammed ibn Sinan el-Kazzaz, rekao je: Pričao nam je Abdussamed ibn Abdulvaris; pričao nam je Zebban, od Asima, od Ebu Saliha, od Ebu Hurejre, da je [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao: Hukb je osamdeset godina; jedan njegov dan je šestina ovoga svijeta.]","ar_ranges":[[132,322]],"ar_html":"وقد روي عن رسول الله ص خبر يدل على صحة قول من قال: إن الدنيا كلها ستة آلاف سنة، لو كان صحيحا سنده لم نعد القول به إلى غيره، وذلك ما \u003cspan class=\"isnad\">حَدَّثَنِي بِهِ مُحَمَّدُ بْنُ سِنَانٍ الْقَزَّازُ، قَالَ: حَدَّثَنَا عَبْدُ الصَّمَدِ ابن عبد الوارث، حدثنا زبان، عَنْ عَاصِمٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هريرة، ان [رسول الله ص قَالَ: \u003c/span>الْحُقْبُ ثَمَانُونَ عَامًا، الْيَوْمُ مِنْهَا سُدُسُ الدُّنْيَا] .","bs_ranges":[[281,438]],"bs_html":"Od Allahova Poslanika, neka mu Allah podari blagoslov i mir, prenesena je vijest koja ukazuje na ispravnost stava onoga ko kaže da cijeli ovaj svijet traje šest hiljada godina. Kada bi njen lanac prenosilaca bio vjerodostojan, ne bismo od toga stava prešli na drugi. To je ono što \u003cspan class=\"isnad\">mi je pričao Muhammed ibn Sinan el-Kazzaz, rekao je: Pričao nam je Abdussamed ibn Abdulvaris; pričao nam je Zebban, od Asima, od Ebu Saliha, od Ebu Hurejre, \u003c/span>da je [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao: Hukb je osamdeset godina; jedan njegov dan je šestina ovoga svijeta.]"},{"id":"17.4","ar":"فبين في هذا الخبر أن الدنيا كلها ستة آلاف سنة، وذلك أن اليوم الذي هو من أيام الآخرة إذا كان مقداره ألف سنة من سني الدنيا، وكان اليوم الواحد من ذلك سدس الدنيا، كان معلوما بذلك أن جميعها ستة أيام من أيام الآخرة، وذلك ستة آلاف سنة.","bs":"U ovoj je vijesti jasno da cijeli ovaj svijet traje šest hiljada godina, jer ako dan koji pripada danima onoga svijeta iznosi hiljadu godina od godina ovoga svijeta, a jedan takav dan predstavlja šestinu ovoga svijeta, time je poznato da on u cijelosti traje šest dana od dana onoga svijeta, a to je šest hiljada godina.","ar_ranges":[],"ar_html":"فبين في هذا الخبر أن الدنيا كلها ستة آلاف سنة، وذلك أن اليوم الذي هو من أيام الآخرة إذا كان مقداره ألف سنة من سني الدنيا، وكان اليوم الواحد من ذلك سدس الدنيا، كان معلوما بذلك أن جميعها ستة أيام من أيام الآخرة، وذلك ستة آلاف سنة.","bs_ranges":[],"bs_html":"U ovoj je vijesti jasno da cijeli ovaj svijet traje šest hiljada godina, jer ako dan koji pripada danima onoga svijeta iznosi hiljadu godina od godina ovoga svijeta, a jedan takav dan predstavlja šestinu ovoga svijeta, time je poznato da on u cijelosti traje šest dana od dana onoga svijeta, a to je šest hiljada godina."},{"id":"17.5","ar":"وقد زعم اليهود أن جميع ما ثبت عندهم- على ما في التوراة مما هو فيها من لدن خلق الله آدم إلى وقت الهجرة، وذلك في التوراة التي هي في ايديهم اليوم- اربعه آلاف سنه وستمائه سنة واثنتان وأربعون سنة، وقد ذكروا تفصيل ذلك بولادة رجل رجل، ونبي نبي، وموته من عهد آدم إلى هجرة نبينا محمد ص","bs":"Jevreji tvrde da ukupno ono što je kod njih utvrđeno — prema onome što se nalazi u Tevratu, od kada je Allah stvorio Adema do vremena Hidžre, i to u Tevratu koji je danas u njihovim rukama — iznosi četiri hiljade šest stotina četrdeset i dvije godine. To su podrobno izložili navodeći rođenje čovjeka po čovjeka i vjerovjesnika po vjerovjesnika i njegovu smrt, od Ademova vremena do Hidžre našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir.","ar_ranges":[],"ar_html":"وقد زعم اليهود أن جميع ما ثبت عندهم- على ما في التوراة مما هو فيها من لدن خلق الله آدم إلى وقت الهجرة، وذلك في التوراة التي هي في ايديهم اليوم- اربعه آلاف سنه وستمائه سنة واثنتان وأربعون سنة، وقد ذكروا تفصيل ذلك بولادة رجل رجل، ونبي نبي، وموته من عهد آدم إلى هجرة نبينا محمد ص","bs_ranges":[],"bs_html":"Jevreji tvrde da ukupno ono što je kod njih utvrđeno — prema onome što se nalazi u Tevratu, od kada je Allah stvorio Adema do vremena Hidžre, i to u Tevratu koji je danas u njihovim rukama — iznosi četiri hiljade šest stotina četrdeset i dvije godine. To su podrobno izložili navodeći rođenje čovjeka po čovjeka i vjerovjesnika po vjerovjesnika i njegovu smrt, od Ademova vremena do Hidžre našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir."}],"notes":[]},{"n":18,"ar":"وسأذكر تفصيلهم ذلك إن شاء الله، وتفصيل غيرهم ممن فصله من علماء أهل الكتب وغيرهم من أهل العلم بالسير وأخبار الناس إذا انتهيت إليه إن شاء الله.\n\nوأما اليونانية من النصارى فإنها تزعم أن الذي ادعته اليهود من ذلك باطل، وأن الصحيح من القول في قدر مدة أيام الدنيا- من لدن خلق الله آدم إلى وقت هجره نبينا محمد ص على سياق ما عندهم في التوراة التي هي في ايديهم- خمسه آلاف سنه وتسعمائة سنة واثنتان وتسعون سنة وأشهر وذكروا تفصيل ما ادعوه من ذلك بولادة نبي نبي، وملك ملك، ووفاته من عهد آدم إلى وقت هجره رسول الله ص، وزعموا أن اليهود إنما نقصوا ما نقصوا من عدد سني ما بين تاريخهم وتاريخ النصارى دفعا منهم لنبوه عيسى بن مريم ع إذ كانت صفته ووقت مبعثه مثبتة في التوراة وقالوا: لم يأت الوقت الذي وقت لنا في التوراة أن الذي صفته صفة عيسى يكون فيه، وهم ينتظرون- بزعمهم- خروجه ووقته.\n\nواحسب أن الذي ينتظرونه ويدعون أن صفته في التوراة مثبتة، هو الدجال الذي وصفه رسول الله ص لأمته، وذكر لهم أن عامة أتباعه اليهود، فإن كان ذلك هو عبد الله بن صياد، فهو من نسل اليهود.\n\nوأما المجوس فإنهم يزعمون أن قدر مدة الزمان من لدن ملك جيومرت إلى وقت هجرة نبينا ص ثلاثة آلاف سنة ومائة سنة وتسع وثلاثون سنة، وهم لا يذكرون مع ذلك نسبا يعرف فوق جيومرت، ويزعمون أنه آدم أبو البشر، ص وعلى جميع أنبياء الله ورسله.\n\nثم أهل الأخبار بعد في أمره مختلفون، فمن قائل منهم فيه مثل قول المجوس، ومن قائل منهم إنه تسمى بآدم بعد أن ملك الأقاليم السبعة، وأنه إنما هو جامر بن يافث ابن نوح، كان بنوح ع برا ولخدمته ملازما، وعليه حدبا شفيقا، فدعا الله له ولذريته نوح- لذلك من بره به وخدمته له- بطول العمر، والتمكين في","bs":"\u003cp data-paragraph=\"18.1\">Njihovo podrobno izlaganje spomenut ću, ako Allah htjedne, kao i podrobno izlaganje drugih koji su to izložili među učenjacima sljedbenika knjiga i drugim poznavaocima životopisa i ljudskih vijesti, kada do toga dođem, ako Allah htjedne.\u003c/p>\u003cp data-paragraph=\"18.2\">A grčki kršćani tvrde da je ono što su Jevreji tvrdili o tome neistinito i da ispravan stav o trajanju dana ovoga svijeta — od kada je Allah stvorio Adema do vremena Hidžre našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir, prema redoslijedu onoga što imaju u Tevratu koji je u njihovim rukama — iznosi pet hiljada devet stotina devedeset i dvije godine i nekoliko mjeseci. Podrobno su izložili ono što su o tome tvrdili, navodeći rođenje vjerovjesnika po vjerovjesnika i vladara po vladara i njegovu smrt, od Ademova vremena do vremena Hidžre Allahova Poslanika, neka mu Allah podari blagoslov i mir. Tvrdili su da su Jevreji umanjili broj godina za onoliko za koliko se njihov račun razlikuje od kršćanskoga računa kako bi odbacili vjerovjesništvo Isaa, sina Merjemina, neka je mir na njega, jer su njegov opis i vrijeme njegova poslanja zapisani u Tevratu. Rekli su: Još nije došlo vrijeme koje nam je u Tevratu određeno za dolazak onoga čiji je opis poput Isaova opisa. Oni, prema vlastitoj tvrdnji, očekuju njegov dolazak i njegovo vrijeme.\u003c/p>\u003cp data-paragraph=\"18.3\">Smatram da je onaj koga očekuju i za čiji opis tvrde da je zapisan u Tevratu Dedždžal kojeg je Allahov Poslanik, neka mu Allah podari blagoslov i mir, opisao svome ummetu i spomenuo im da će većina njegovih sljedbenika biti Jevreji. Ako je taj Abdullah ibn Sajjad, onda je on od jevrejskog potomstva.\u003c/p>\u003cp data-paragraph=\"18.4\">A medžusije tvrde da trajanje vremena od početka Gejumertove vladavine do vremena Hidžre našega Vjerovjesnika, neka mu Allah podari blagoslov i mir, iznosi tri hiljade stotinu trideset i devet godina. Uz to ne navode poznato rodoslovlje iznad Gejumerta i tvrde da je on Adem, otac čovječanstva, neka mu Allah podari blagoslov i mir, kao i svim Allahovim vjerovjesnicima i poslanicima.\u003c/p>\u003cp data-paragraph=\"18.5\">Poznavaoci vijesti ipak se razilaze o njemu. Neki govore isto što i medžusije. Neki govore da se nazvao Ademom nakon što je zavladao sedmerim oblastima i da je on zapravo Džamir ibn Jafes ibn Nuh, koji je prema Nuhu, neka je mir na njega, bio dobročinitelj, stalno mu služio i bio prema njemu brižan i milostiv. Zato je Nuh — zbog njegova dobročinstva i služenja njemu — molio Allaha da njemu i njegovu potomstvu podari dug život, učvršćenost u\u003c/p>","paragraphs":[{"id":"18.1","ar":"وسأذكر تفصيلهم ذلك إن شاء الله، وتفصيل غيرهم ممن فصله من علماء أهل الكتب وغيرهم من أهل العلم بالسير وأخبار الناس إذا انتهيت إليه إن شاء الله.","bs":"Njihovo podrobno izlaganje spomenut ću, ako Allah htjedne, kao i podrobno izlaganje drugih koji su to izložili među učenjacima sljedbenika knjiga i drugim poznavaocima životopisa i ljudskih vijesti, kada do toga dođem, ako Allah htjedne.","ar_ranges":[],"ar_html":"وسأذكر تفصيلهم ذلك إن شاء الله، وتفصيل غيرهم ممن فصله من علماء أهل الكتب وغيرهم من أهل العلم بالسير وأخبار الناس إذا انتهيت إليه إن شاء الله.","bs_ranges":[],"bs_html":"Njihovo podrobno izlaganje spomenut ću, ako Allah htjedne, kao i podrobno izlaganje drugih koji su to izložili među učenjacima sljedbenika knjiga i drugim poznavaocima životopisa i ljudskih vijesti, kada do toga dođem, ako Allah htjedne."},{"id":"18.2","ar":"وأما اليونانية من النصارى فإنها تزعم أن الذي ادعته اليهود من ذلك باطل، وأن الصحيح من القول في قدر مدة أيام الدنيا- من لدن خلق الله آدم إلى وقت هجره نبينا محمد ص على سياق ما عندهم في التوراة التي هي في ايديهم- خمسه آلاف سنه وتسعمائة سنة واثنتان وتسعون سنة وأشهر وذكروا تفصيل ما ادعوه من ذلك بولادة نبي نبي، وملك ملك، ووفاته من عهد آدم إلى وقت هجره رسول الله ص، وزعموا أن اليهود إنما نقصوا ما نقصوا من عدد سني ما بين تاريخهم وتاريخ النصارى دفعا منهم لنبوه عيسى بن مريم ع إذ كانت صفته ووقت مبعثه مثبتة في التوراة وقالوا: لم يأت الوقت الذي وقت لنا في التوراة أن الذي صفته صفة عيسى يكون فيه، وهم ينتظرون- بزعمهم- خروجه ووقته.","bs":"A grčki kršćani tvrde da je ono što su Jevreji tvrdili o tome neistinito i da ispravan stav o trajanju dana ovoga svijeta — od kada je Allah stvorio Adema do vremena Hidžre našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir, prema redoslijedu onoga što imaju u Tevratu koji je u njihovim rukama — iznosi pet hiljada devet stotina devedeset i dvije godine i nekoliko mjeseci. Podrobno su izložili ono što su o tome tvrdili, navodeći rođenje vjerovjesnika po vjerovjesnika i vladara po vladara i njegovu smrt, od Ademova vremena do vremena Hidžre Allahova Poslanika, neka mu Allah podari blagoslov i mir. Tvrdili su da su Jevreji umanjili broj godina za onoliko za koliko se njihov račun razlikuje od kršćanskoga računa kako bi odbacili vjerovjesništvo Isaa, sina Merjemina, neka je mir na njega, jer su njegov opis i vrijeme njegova poslanja zapisani u Tevratu. Rekli su: Još nije došlo vrijeme koje nam je u Tevratu određeno za dolazak onoga čiji je opis poput Isaova opisa. Oni, prema vlastitoj tvrdnji, očekuju njegov dolazak i njegovo vrijeme.","ar_ranges":[],"ar_html":"وأما اليونانية من النصارى فإنها تزعم أن الذي ادعته اليهود من ذلك باطل، وأن الصحيح من القول في قدر مدة أيام الدنيا- من لدن خلق الله آدم إلى وقت هجره نبينا محمد ص على سياق ما عندهم في التوراة التي هي في ايديهم- خمسه آلاف سنه وتسعمائة سنة واثنتان وتسعون سنة وأشهر وذكروا تفصيل ما ادعوه من ذلك بولادة نبي نبي، وملك ملك، ووفاته من عهد آدم إلى وقت هجره رسول الله ص، وزعموا أن اليهود إنما نقصوا ما نقصوا من عدد سني ما بين تاريخهم وتاريخ النصارى دفعا منهم لنبوه عيسى بن مريم ع إذ كانت صفته ووقت مبعثه مثبتة في التوراة وقالوا: لم يأت الوقت الذي وقت لنا في التوراة أن الذي صفته صفة عيسى يكون فيه، وهم ينتظرون- بزعمهم- خروجه ووقته.","bs_ranges":[],"bs_html":"A grčki kršćani tvrde da je ono što su Jevreji tvrdili o tome neistinito i da ispravan stav o trajanju dana ovoga svijeta — od kada je Allah stvorio Adema do vremena Hidžre našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir, prema redoslijedu onoga što imaju u Tevratu koji je u njihovim rukama — iznosi pet hiljada devet stotina devedeset i dvije godine i nekoliko mjeseci. Podrobno su izložili ono što su o tome tvrdili, navodeći rođenje vjerovjesnika po vjerovjesnika i vladara po vladara i njegovu smrt, od Ademova vremena do vremena Hidžre Allahova Poslanika, neka mu Allah podari blagoslov i mir. Tvrdili su da su Jevreji umanjili broj godina za onoliko za koliko se njihov račun razlikuje od kršćanskoga računa kako bi odbacili vjerovjesništvo Isaa, sina Merjemina, neka je mir na njega, jer su njegov opis i vrijeme njegova poslanja zapisani u Tevratu. Rekli su: Još nije došlo vrijeme koje nam je u Tevratu određeno za dolazak onoga čiji je opis poput Isaova opisa. Oni, prema vlastitoj tvrdnji, očekuju njegov dolazak i njegovo vrijeme."},{"id":"18.3","ar":"واحسب أن الذي ينتظرونه ويدعون أن صفته في التوراة مثبتة، هو الدجال الذي وصفه رسول الله ص لأمته، وذكر لهم أن عامة أتباعه اليهود، فإن كان ذلك هو عبد الله بن صياد، فهو من نسل اليهود.","bs":"Smatram da je onaj koga očekuju i za čiji opis tvrde da je zapisan u Tevratu Dedždžal kojeg je Allahov Poslanik, neka mu Allah podari blagoslov i mir, opisao svome ummetu i spomenuo im da će većina njegovih sljedbenika biti Jevreji. Ako je taj Abdullah ibn Sajjad, onda je on od jevrejskog potomstva.","ar_ranges":[],"ar_html":"واحسب أن الذي ينتظرونه ويدعون أن صفته في التوراة مثبتة، هو الدجال الذي وصفه رسول الله ص لأمته، وذكر لهم أن عامة أتباعه اليهود، فإن كان ذلك هو عبد الله بن صياد، فهو من نسل اليهود.","bs_ranges":[],"bs_html":"Smatram da je onaj koga očekuju i za čiji opis tvrde da je zapisan u Tevratu Dedždžal kojeg je Allahov Poslanik, neka mu Allah podari blagoslov i mir, opisao svome ummetu i spomenuo im da će većina njegovih sljedbenika biti Jevreji. Ako je taj Abdullah ibn Sajjad, onda je on od jevrejskog potomstva."},{"id":"18.4","ar":"وأما المجوس فإنهم يزعمون أن قدر مدة الزمان من لدن ملك جيومرت إلى وقت هجرة نبينا ص ثلاثة آلاف سنة ومائة سنة وتسع وثلاثون سنة، وهم لا يذكرون مع ذلك نسبا يعرف فوق جيومرت، ويزعمون أنه آدم أبو البشر، ص وعلى جميع أنبياء الله ورسله.","bs":"A medžusije tvrde da trajanje vremena od početka Gejumertove vladavine do vremena Hidžre našega Vjerovjesnika, neka mu Allah podari blagoslov i mir, iznosi tri hiljade stotinu trideset i devet godina. Uz to ne navode poznato rodoslovlje iznad Gejumerta i tvrde da je on Adem, otac čovječanstva, neka mu Allah podari blagoslov i mir, kao i svim Allahovim vjerovjesnicima i poslanicima.","ar_ranges":[],"ar_html":"وأما المجوس فإنهم يزعمون أن قدر مدة الزمان من لدن ملك جيومرت إلى وقت هجرة نبينا ص ثلاثة آلاف سنة ومائة سنة وتسع وثلاثون سنة، وهم لا يذكرون مع ذلك نسبا يعرف فوق جيومرت، ويزعمون أنه آدم أبو البشر، ص وعلى جميع أنبياء الله ورسله.","bs_ranges":[],"bs_html":"A medžusije tvrde da trajanje vremena od početka Gejumertove vladavine do vremena Hidžre našega Vjerovjesnika, neka mu Allah podari blagoslov i mir, iznosi tri hiljade stotinu trideset i devet godina. Uz to ne navode poznato rodoslovlje iznad Gejumerta i tvrde da je on Adem, otac čovječanstva, neka mu Allah podari blagoslov i mir, kao i svim Allahovim vjerovjesnicima i poslanicima."},{"id":"18.5","ar":"ثم أهل الأخبار بعد في أمره مختلفون، فمن قائل منهم فيه مثل قول المجوس، ومن قائل منهم إنه تسمى بآدم بعد أن ملك الأقاليم السبعة، وأنه إنما هو جامر بن يافث ابن نوح، كان بنوح ع برا ولخدمته ملازما، وعليه حدبا شفيقا، فدعا الله له ولذريته نوح- لذلك من بره به وخدمته له- بطول العمر، والتمكين في","bs":"Poznavaoci vijesti ipak se razilaze o njemu. Neki govore isto što i medžusije. Neki govore da se nazvao Ademom nakon što je zavladao sedmerim oblastima i da je on zapravo Džamir ibn Jafes ibn Nuh, koji je prema Nuhu, neka je mir na njega, bio dobročinitelj, stalno mu služio i bio prema njemu brižan i milostiv. Zato je Nuh — zbog njegova dobročinstva i služenja njemu — molio Allaha da njemu i njegovu potomstvu podari dug život, učvršćenost u","ar_ranges":[],"ar_html":"ثم أهل الأخبار بعد في أمره مختلفون، فمن قائل منهم فيه مثل قول المجوس، ومن قائل منهم إنه تسمى بآدم بعد أن ملك الأقاليم السبعة، وأنه إنما هو جامر بن يافث ابن نوح، كان بنوح ع برا ولخدمته ملازما، وعليه حدبا شفيقا، فدعا الله له ولذريته نوح- لذلك من بره به وخدمته له- بطول العمر، والتمكين في","bs_ranges":[],"bs_html":"Poznavaoci vijesti ipak se razilaze o njemu. Neki govore isto što i medžusije. Neki govore da se nazvao Ademom nakon što je zavladao sedmerim oblastima i da je on zapravo Džamir ibn Jafes ibn Nuh, koji je prema Nuhu, neka je mir na njega, bio dobročinitelj, stalno mu služio i bio prema njemu brižan i milostiv. Zato je Nuh — zbog njegova dobročinstva i služenja njemu — molio Allaha da njemu i njegovu potomstvu podari dug život, učvršćenost u"}],"notes":[]},{"n":19,"ar":"البلاد، والنصر على من ناوأه وإياهم، واتصال الملك له ولذريته، ودوامه له ولهم، فاستجيب له فيه، فأعطى جيومرت ذلك وولده، فهو ابو الفراس، ولم يزل الملك فيه وفي ولده إلى أن زال عنهم بدخول المسلمين مدائن كسرى، وغلبة أهل الإسلام إياهم على ملكهم.\n\nومن قائل غير ذلك، وسنذكر إن شاء الله ما انتهى إلينا من القول فيه إذا انتهينا إلى ذكرنا تاريخ الملوك ومبالغ أعمارهم، وأنسابهم وأسباب ملكهم","bs":"\u003cp data-paragraph=\"19.1\">zemljama, pobjedu nad onima koji se njemu i njima suprotstave, te neprekinutu vlast njemu i njegovu potomstvu i njeno trajanje njemu i njima. Njegova je molba za njega bila uslišana, pa je to dato Gejumertu i njegovu potomstvu. On je otac „el-firas“ ⟦Napomena prevodioca: prijepis glasi „الفراس“; moguće čitanje kao naziv naroda nije ovdje prešutno usvojeno.⟧. Vlast je ostala u njemu i njegovu potomstvu sve dok im nije nestala ulaskom muslimana u Kisrine gradove i pobjedom sljedbenika islama nad njima u njihovoj vlasti.\u003c/p>\u003cp data-paragraph=\"19.2\">Neki govore drugačije od toga. Spomenut ćemo, ako Allah htjedne, ono što je do nas stiglo od stavova o njemu kada dođemo do spominjanja historije vladara, dužina njihovih života, njihovih rodoslovlja i uzroka njihove vlasti.\u003c/p>","paragraphs":[{"id":"19.1","ar":"البلاد، والنصر على من ناوأه وإياهم، واتصال الملك له ولذريته، ودوامه له ولهم، فاستجيب له فيه، فأعطى جيومرت ذلك وولده، فهو ابو الفراس، ولم يزل الملك فيه وفي ولده إلى أن زال عنهم بدخول المسلمين مدائن كسرى، وغلبة أهل الإسلام إياهم على ملكهم.","bs":"zemljama, pobjedu nad onima koji se njemu i njima suprotstave, te neprekinutu vlast njemu i njegovu potomstvu i njeno trajanje njemu i njima. Njegova je molba za njega bila uslišana, pa je to dato Gejumertu i njegovu potomstvu. On je otac „el-firas“ ⟦Napomena prevodioca: prijepis glasi „الفراس“; moguće čitanje kao naziv naroda nije ovdje prešutno usvojeno.⟧. Vlast je ostala u njemu i njegovu potomstvu sve dok im nije nestala ulaskom muslimana u Kisrine gradove i pobjedom sljedbenika islama nad njima u njihovoj vlasti.","ar_ranges":[],"ar_html":"البلاد، والنصر على من ناوأه وإياهم، واتصال الملك له ولذريته، ودوامه له ولهم، فاستجيب له فيه، فأعطى جيومرت ذلك وولده، فهو ابو الفراس، ولم يزل الملك فيه وفي ولده إلى أن زال عنهم بدخول المسلمين مدائن كسرى، وغلبة أهل الإسلام إياهم على ملكهم.","bs_ranges":[],"bs_html":"zemljama, pobjedu nad onima koji se njemu i njima suprotstave, te neprekinutu vlast njemu i njegovu potomstvu i njeno trajanje njemu i njima. Njegova je molba za njega bila uslišana, pa je to dato Gejumertu i njegovu potomstvu. On je otac „el-firas“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: prijepis glasi „الفراس“; moguće čitanje kao naziv naroda nije ovdje prešutno usvojeno.⟧\u003c/span>. Vlast je ostala u njemu i njegovu potomstvu sve dok im nije nestala ulaskom muslimana u Kisrine gradove i pobjedom sljedbenika islama nad njima u njihovoj vlasti."},{"id":"19.2","ar":"ومن قائل غير ذلك، وسنذكر إن شاء الله ما انتهى إلينا من القول فيه إذا انتهينا إلى ذكرنا تاريخ الملوك ومبالغ أعمارهم، وأنسابهم وأسباب ملكهم","bs":"Neki govore drugačije od toga. Spomenut ćemo, ako Allah htjedne, ono što je do nas stiglo od stavova o njemu kada dođemo do spominjanja historije vladara, dužina njihovih života, njihovih rodoslovlja i uzroka njihove vlasti.","ar_ranges":[],"ar_html":"ومن قائل غير ذلك، وسنذكر إن شاء الله ما انتهى إلينا من القول فيه إذا انتهينا إلى ذكرنا تاريخ الملوك ومبالغ أعمارهم، وأنسابهم وأسباب ملكهم","bs_ranges":[],"bs_html":"Neki govore drugačije od toga. Spomenut ćemo, ako Allah htjedne, ono što je do nas stiglo od stavova o njemu kada dođemo do spominjanja historije vladara, dužina njihovih života, njihovih rodoslovlja i uzroka njihove vlasti."}],"notes":[]},{"n":20,"ar":"[القول في الدلالة على حدوث الأوقات والأزمان والليل والنهار]\n\nقد قلنا قبل إن الزمان إنما هو اسم لساعات الليل والنهار، وساعات الليل والنهار إنما هي مقادير من جري الشمس والقمر في الفلك، كما قال الله عز وجل:\n\n«وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهارَ فَإِذا هُمْ مُظْلِمُونَ وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ وَالْقَمَرَ قَدَّرْناهُ مَنازِلَ حَتَّى عادَ كَالْعُرْجُونِ الْقَدِيمِ لَا الشَّمْسُ يَنْبَغِي لَها أَنْ تُدْرِكَ الْقَمَرَ وَلَا اللَّيْلُ سابِقُ النَّهارِ وَكُلٌّ فِي فَلَكٍ يَسْبَحُونَ» .\n\nفإذا كان الزمان ما ذكرنا من ساعات الليل والنهار، وكانت ساعات الليل والنهار إنما هي قطع الشمس والقمر درجات الفلك، كان بيقين معلوما أن الزمان محدث والليل والنهار محدثان، وان محدث ذلك الله الذي تفرد بإحداث جميع خلقه، كما قال: «وَهُوَ الَّذِي خَلَقَ اللَّيْلَ وَالنَّهارَ وَالشَّمْسَ وَالْقَمَرَ كُلٌّ فِي فَلَكٍ يَسْبَحُونَ» .\n\nومن جهل حدوث ذلك من خلق الله فإنه لن يجهل اختلاف أحوال الليل والنهار، بأن أحدهما يرد على الخلق- وهو الليل- بسواد وظلمة، وأن الآخر منهما يرد عليهم بنور وضياء، ونسخ لسواد الليل وظلمته، وهو النهار.\n\nفإذا كان ذلك كذلك، وكان من المحال اجتماعهما مع اختلاف أحوالهما في وقت واحد في جزء واحد- كان معلوما يقينا أنه لا بد من أن يكون أحدهما كان قبل الآخر منهما، وأيهما كان منهما قبل صاحبه فإن الآخر منهما كان","bs":"\u003cp data-paragraph=\"20.1\">Rasprava o dokazivanju nastanka vremenskih trenutaka i razdoblja, noći i dana\u003c/p>\u003cp data-paragraph=\"20.2\">Već smo rekli da je vrijeme samo naziv za sate noći i dana, a sati noći i dana samo su mjere kretanja Sunca i Mjeseca po nebeskoj putanji, kao što je Allah, Silan je i Uzvišen, rekao:\u003c/p>\u003cp data-paragraph=\"20.3\">⟦Kur’anski navod, prijevod, 36:37–40⟧ „I znak im je noć: Mi s nje svlačimo dan, pa se oni odjednom nađu u tami. A Sunce teče do svoga određenog boravišta; to je određenje Silnoga, Sveznajućega. I Mjesecu smo odredili položaje, sve dok se ne vrati poput stare palmine peteljke. Niti Suncu priliči da dostigne Mjesec, niti noć prestiže dan; i svi plove po putanji.“\u003c/p>\u003cp data-paragraph=\"20.4\">Ako je vrijeme ono što smo spomenuli od sati noći i dana, a sati noći i dana samo prelazak Sunca i Mjeseca preko stepena nebeske putanje, onda se sa sigurnošću zna da je vrijeme nastalo i da su noć i dan nastali i da je Onaj koji je to doveo u postojanje Allah, koji je sam doveo u postojanje sva Svoja stvorenja, kao što je rekao: ⟦Kur’anski navod, prijevod, 21:33⟧ „I On je stvorio noć i dan i Sunce i Mjesec; svi plove po putanji.“\u003c/p>\u003cp data-paragraph=\"20.5\">Onaj među Allahovim stvorenjima ko ne zna da je to nastalo neće ipak biti bez znanja o razlici stanja noći i dana: da jedno od njih dolazi stvorenjima — a to je noć — s crnilom i tamom, a drugo im dolazi sa svjetlom i sjajem i uklanjanjem crnila i tame noći, a to je dan.\u003c/p>\u003cp data-paragraph=\"20.6\">Budući da je tako i da je nemoguće da se oboje, s razlikom svojih stanja, istovremeno sastanu na istom dijelu prostora, sa sigurnošću se zna da je nužno jedno od njih bilo prije drugoga. Koje god od njih bilo prije svoga druga, ono drugo bilo je\u003c/p>","paragraphs":[{"id":"20.1","ar":"[القول في الدلالة على حدوث الأوقات والأزمان والليل والنهار]","bs":"Rasprava o dokazivanju nastanka vremenskih trenutaka i razdoblja, noći i dana","ar_ranges":[],"ar_html":"[القول في الدلالة على حدوث الأوقات والأزمان والليل والنهار]","bs_ranges":[],"bs_html":"Rasprava o dokazivanju nastanka vremenskih trenutaka i razdoblja, noći i dana"},{"id":"20.2","ar":"قد قلنا قبل إن الزمان إنما هو اسم لساعات الليل والنهار، وساعات الليل والنهار إنما هي مقادير من جري الشمس والقمر في الفلك، كما قال الله عز وجل:","bs":"Već smo rekli da je vrijeme samo naziv za sate noći i dana, a sati noći i dana samo su mjere kretanja Sunca i Mjeseca po nebeskoj putanji, kao što je Allah, Silan je i Uzvišen, rekao:","ar_ranges":[],"ar_html":"قد قلنا قبل إن الزمان إنما هو اسم لساعات الليل والنهار، وساعات الليل والنهار إنما هي مقادير من جري الشمس والقمر في الفلك، كما قال الله عز وجل:","bs_ranges":[],"bs_html":"Već smo rekli da je vrijeme samo naziv za sate noći i dana, a sati noći i dana samo su mjere kretanja Sunca i Mjeseca po nebeskoj putanji, kao što je Allah, Silan je i Uzvišen, rekao:"},{"id":"20.3","ar":"«وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهارَ فَإِذا هُمْ مُظْلِمُونَ وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ وَالْقَمَرَ قَدَّرْناهُ مَنازِلَ حَتَّى عادَ كَالْعُرْجُونِ الْقَدِيمِ لَا الشَّمْسُ يَنْبَغِي لَها أَنْ تُدْرِكَ الْقَمَرَ وَلَا اللَّيْلُ سابِقُ النَّهارِ وَكُلٌّ فِي فَلَكٍ يَسْبَحُونَ» .","bs":"⟦Kur’anski navod, prijevod, 36:37–40⟧ „I znak im je noć: Mi s nje svlačimo dan, pa se oni odjednom nađu u tami. A Sunce teče do svoga određenog boravišta; to je određenje Silnoga, Sveznajućega. I Mjesecu smo odredili položaje, sve dok se ne vrati poput stare palmine peteljke. Niti Suncu priliči da dostigne Mjesec, niti noć prestiže dan; i svi plove po putanji.“","ar_ranges":[],"ar_html":"«وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهارَ فَإِذا هُمْ مُظْلِمُونَ وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ وَالْقَمَرَ قَدَّرْناهُ مَنازِلَ حَتَّى عادَ كَالْعُرْجُونِ الْقَدِيمِ لَا الشَّمْسُ يَنْبَغِي لَها أَنْ تُدْرِكَ الْقَمَرَ وَلَا اللَّيْلُ سابِقُ النَّهارِ وَكُلٌّ فِي فَلَكٍ يَسْبَحُونَ» .","bs_ranges":[],"bs_html":"\u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 36:37–40⟧\u003c/span> „I znak im je noć: Mi s nje svlačimo dan, pa se oni odjednom nađu u tami. A Sunce teče do svoga određenog boravišta; to je određenje Silnoga, Sveznajućega. I Mjesecu smo odredili položaje, sve dok se ne vrati poput stare palmine peteljke. Niti Suncu priliči da dostigne Mjesec, niti noć prestiže dan; i svi plove po putanji.“"},{"id":"20.4","ar":"فإذا كان الزمان ما ذكرنا من ساعات الليل والنهار، وكانت ساعات الليل والنهار إنما هي قطع الشمس والقمر درجات الفلك، كان بيقين معلوما أن الزمان محدث والليل والنهار محدثان، وان محدث ذلك الله الذي تفرد بإحداث جميع خلقه، كما قال: «وَهُوَ الَّذِي خَلَقَ اللَّيْلَ وَالنَّهارَ وَالشَّمْسَ وَالْقَمَرَ كُلٌّ فِي فَلَكٍ يَسْبَحُونَ» .","bs":"Ako je vrijeme ono što smo spomenuli od sati noći i dana, a sati noći i dana samo prelazak Sunca i Mjeseca preko stepena nebeske putanje, onda se sa sigurnošću zna da je vrijeme nastalo i da su noć i dan nastali i da je Onaj koji je to doveo u postojanje Allah, koji je sam doveo u postojanje sva Svoja stvorenja, kao što je rekao: ⟦Kur’anski navod, prijevod, 21:33⟧ „I On je stvorio noć i dan i Sunce i Mjesec; svi plove po putanji.“","ar_ranges":[],"ar_html":"فإذا كان الزمان ما ذكرنا من ساعات الليل والنهار، وكانت ساعات الليل والنهار إنما هي قطع الشمس والقمر درجات الفلك، كان بيقين معلوما أن الزمان محدث والليل والنهار محدثان، وان محدث ذلك الله الذي تفرد بإحداث جميع خلقه، كما قال: «وَهُوَ الَّذِي خَلَقَ اللَّيْلَ وَالنَّهارَ وَالشَّمْسَ وَالْقَمَرَ كُلٌّ فِي فَلَكٍ يَسْبَحُونَ» .","bs_ranges":[],"bs_html":"Ako je vrijeme ono što smo spomenuli od sati noći i dana, a sati noći i dana samo prelazak Sunca i Mjeseca preko stepena nebeske putanje, onda se sa sigurnošću zna da je vrijeme nastalo i da su noć i dan nastali i da je Onaj koji je to doveo u postojanje Allah, koji je sam doveo u postojanje sva Svoja stvorenja, kao što je rekao: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 21:33⟧\u003c/span> „I On je stvorio noć i dan i Sunce i Mjesec; svi plove po putanji.“"},{"id":"20.5","ar":"ومن جهل حدوث ذلك من خلق الله فإنه لن يجهل اختلاف أحوال الليل والنهار، بأن أحدهما يرد على الخلق- وهو الليل- بسواد وظلمة، وأن الآخر منهما يرد عليهم بنور وضياء، ونسخ لسواد الليل وظلمته، وهو النهار.","bs":"Onaj među Allahovim stvorenjima ko ne zna da je to nastalo neće ipak biti bez znanja o razlici stanja noći i dana: da jedno od njih dolazi stvorenjima — a to je noć — s crnilom i tamom, a drugo im dolazi sa svjetlom i sjajem i uklanjanjem crnila i tame noći, a to je dan.","ar_ranges":[],"ar_html":"ومن جهل حدوث ذلك من خلق الله فإنه لن يجهل اختلاف أحوال الليل والنهار، بأن أحدهما يرد على الخلق- وهو الليل- بسواد وظلمة، وأن الآخر منهما يرد عليهم بنور وضياء، ونسخ لسواد الليل وظلمته، وهو النهار.","bs_ranges":[],"bs_html":"Onaj među Allahovim stvorenjima ko ne zna da je to nastalo neće ipak biti bez znanja o razlici stanja noći i dana: da jedno od njih dolazi stvorenjima — a to je noć — s crnilom i tamom, a drugo im dolazi sa svjetlom i sjajem i uklanjanjem crnila i tame noći, a to je dan."},{"id":"20.6","ar":"فإذا كان ذلك كذلك، وكان من المحال اجتماعهما مع اختلاف أحوالهما في وقت واحد في جزء واحد- كان معلوما يقينا أنه لا بد من أن يكون أحدهما كان قبل الآخر منهما، وأيهما كان منهما قبل صاحبه فإن الآخر منهما كان","bs":"Budući da je tako i da je nemoguće da se oboje, s razlikom svojih stanja, istovremeno sastanu na istom dijelu prostora, sa sigurnošću se zna da je nužno jedno od njih bilo prije drugoga. Koje god od njih bilo prije svoga druga, ono drugo bilo je","ar_ranges":[],"ar_html":"فإذا كان ذلك كذلك، وكان من المحال اجتماعهما مع اختلاف أحوالهما في وقت واحد في جزء واحد- كان معلوما يقينا أنه لا بد من أن يكون أحدهما كان قبل الآخر منهما، وأيهما كان منهما قبل صاحبه فإن الآخر منهما كان","bs_ranges":[],"bs_html":"Budući da je tako i da je nemoguće da se oboje, s razlikom svojih stanja, istovremeno sastanu na istom dijelu prostora, sa sigurnošću se zna da je nužno jedno od njih bilo prije drugoga. Koje god od njih bilo prije svoga druga, ono drugo bilo je"}],"notes":[]},{"n":21,"ar":"لا شك بعده، وذلك إبانة ودليل على حدوثهما، وأنهما خلقان لخالقهما.\n\nومن الدلالة أيضا على حدوث الأيام والليالي أنه لا يوم إلا وهو بعد يوم كان قبله، وقبل يوم كائن بعده، فمعلوم أن ما لم يكن ثم كان، أنه محدث مخلوق، وأن له خالقا ومحدثا.\n\nواخرى، أن الأيام والليالي معدودة، وما عد من الأشياء فغير خارج من أحد العددين: شفع أو وتر، فإن يكن شفعا فإن أولها اثنان، وذلك تصحيح القول بأن لها ابتداء وأولا، وإن كان وترا فإن أولها واحد، وذلك دليل على أن لها ابتداء وأولا، وما كان له ابتداء فإنه لا بد له من مبتدئ، هو خالقه","bs":"\u003cp data-paragraph=\"21.1\">bez sumnje poslije njega. To je objašnjenje i dokaz njihova nastanka i toga da su njih dvoje dva stvorenja svoga Stvoritelja.\u003c/p>\u003cp data-paragraph=\"21.2\">Među dokazima nastanka dana i noći jeste i to da nema dana a da nije poslije dana koji je bio prije njega i prije dana koji će biti poslije njega. Poznato je, dakle, da je ono što nije bilo pa zatim jeste nastalo i stvoreno i da ima Stvoritelja i Onoga koji ga je doveo u postojanje.\u003c/p>\u003cp data-paragraph=\"21.3\">I još: dani i noći mogu se brojati. Ono među stvarima što se broji ne izlazi izvan jednoga od dvaju brojeva: parnoga ili neparnoga. Ako je parno, početak mu je dva, a time se potvrđuje tvrdnja da ima početak i prvi dio. Ako je neparno, početak mu je jedan, a to je dokaz da ima početak i prvi dio. Ono što ima početak nužno ima i Onoga koji mu je dao početak, a On je njegov Stvoritelj.\u003c/p>","paragraphs":[{"id":"21.1","ar":"لا شك بعده، وذلك إبانة ودليل على حدوثهما، وأنهما خلقان لخالقهما.","bs":"bez sumnje poslije njega. To je objašnjenje i dokaz njihova nastanka i toga da su njih dvoje dva stvorenja svoga Stvoritelja.","ar_ranges":[],"ar_html":"لا شك بعده، وذلك إبانة ودليل على حدوثهما، وأنهما خلقان لخالقهما.","bs_ranges":[],"bs_html":"bez sumnje poslije njega. To je objašnjenje i dokaz njihova nastanka i toga da su njih dvoje dva stvorenja svoga Stvoritelja."},{"id":"21.2","ar":"ومن الدلالة أيضا على حدوث الأيام والليالي أنه لا يوم إلا وهو بعد يوم كان قبله، وقبل يوم كائن بعده، فمعلوم أن ما لم يكن ثم كان، أنه محدث مخلوق، وأن له خالقا ومحدثا.","bs":"Među dokazima nastanka dana i noći jeste i to da nema dana a da nije poslije dana koji je bio prije njega i prije dana koji će biti poslije njega. Poznato je, dakle, da je ono što nije bilo pa zatim jeste nastalo i stvoreno i da ima Stvoritelja i Onoga koji ga je doveo u postojanje.","ar_ranges":[],"ar_html":"ومن الدلالة أيضا على حدوث الأيام والليالي أنه لا يوم إلا وهو بعد يوم كان قبله، وقبل يوم كائن بعده، فمعلوم أن ما لم يكن ثم كان، أنه محدث مخلوق، وأن له خالقا ومحدثا.","bs_ranges":[],"bs_html":"Među dokazima nastanka dana i noći jeste i to da nema dana a da nije poslije dana koji je bio prije njega i prije dana koji će biti poslije njega. Poznato je, dakle, da je ono što nije bilo pa zatim jeste nastalo i stvoreno i da ima Stvoritelja i Onoga koji ga je doveo u postojanje."},{"id":"21.3","ar":"واخرى، أن الأيام والليالي معدودة، وما عد من الأشياء فغير خارج من أحد العددين: شفع أو وتر، فإن يكن شفعا فإن أولها اثنان، وذلك تصحيح القول بأن لها ابتداء وأولا، وإن كان وترا فإن أولها واحد، وذلك دليل على أن لها ابتداء وأولا، وما كان له ابتداء فإنه لا بد له من مبتدئ، هو خالقه","bs":"I još: dani i noći mogu se brojati. Ono među stvarima što se broji ne izlazi izvan jednoga od dvaju brojeva: parnoga ili neparnoga. Ako je parno, početak mu je dva, a time se potvrđuje tvrdnja da ima početak i prvi dio. Ako je neparno, početak mu je jedan, a to je dokaz da ima početak i prvi dio. Ono što ima početak nužno ima i Onoga koji mu je dao početak, a On je njegov Stvoritelj.","ar_ranges":[],"ar_html":"واخرى، أن الأيام والليالي معدودة، وما عد من الأشياء فغير خارج من أحد العددين: شفع أو وتر، فإن يكن شفعا فإن أولها اثنان، وذلك تصحيح القول بأن لها ابتداء وأولا، وإن كان وترا فإن أولها واحد، وذلك دليل على أن لها ابتداء وأولا، وما كان له ابتداء فإنه لا بد له من مبتدئ، هو خالقه","bs_ranges":[],"bs_html":"I još: dani i noći mogu se brojati. Ono među stvarima što se broji ne izlazi izvan jednoga od dvaju brojeva: parnoga ili neparnoga. Ako je parno, početak mu je dva, a time se potvrđuje tvrdnja da ima početak i prvi dio. Ako je neparno, početak mu je jedan, a to je dokaz da ima početak i prvi dio. Ono što ima početak nužno ima i Onoga koji mu je dao početak, a On je njegov Stvoritelj."}],"notes":[]},{"n":22,"ar":"القول في هل كان الله عز وجل خلق قبل خلقه الزمان والليل والنهار شيئا غير ذلك من الخلق قد قلنا قبل: إن الزمان إنما هو ساعات الليل والنهار، وإن الساعات إنما هي قطع الشمس والقمر درجات الفلك.\n\nفإذا كان ذلك كذلك، وكان صحيحا عن رسول الله ص ما حَدَّثَنَا هَنَّادُ بْنُ السَّرِيِّ، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ أَبِي سَعْدٍ الْبَقَّالِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ- قَالَ هناد: وقرات سائر الحديث على ابى بكر- ان اليهود أتت النبي ص فَسَأَلَتْهُ عَنْ خَلْقِ السَّمَوَاتِ وَالأَرْضِ فَقَالَ: خَلَقَ اللَّهُ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ وَمَا فِيهِنَّ مِنْ مَنَافِعَ، وَخَلَقَ يوم الأربعاء الشجر والماء والمدائن والعمران والخراب، فهذه اربعه، ثم قال: «قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ» ، لِمَنْ سَأَلَ قَالَ: وَخَلَقَ يَوْمَ الْخَمِيسِ السَّمَاءَ، وَخَلَقَ يَوْمَ الْجُمُعَةِ النُّجُومَ وَالشَّمْسَ وَالْقَمَرَ وَالْمَلائِكَةَ، إِلَى ثَلاثِ سَاعَاتٍ بَقِيَتْ مِنْهُ، فَخَلَقَ فِي أَوَّلِ سَاعَةٍ مِنْ هَذِهِ الثَّلاثِ السَّاعَاتِ الآجَالَ مَنْ يَحْيَا وَمَنْ يَمُوتُ، وَفِي الثَّانِيَةِ أَلْقَى الآفَةَ عَلَى كُلِّ شَيْءٍ مِمَّا يَنْتَفِعُ بِهِ النَّاسُ، وَفِي الثَّالِثَةِ آدَمَ وَأَسْكَنَهُ الْجَنَّةَ، وَأَمَرَ إِبْلِيسَ بِالسُّجُودِ لَهُ","bs":"\u003cp data-paragraph=\"22.1\">Rasprava o tome je li Allah, Silan je i Uzvišen, prije nego što je stvorio vrijeme, noć i dan stvorio nešto drugo od stvorenja. Već smo rekli da vrijeme čine samo sati noći i dana i da sati predstavljaju samo prelazak Sunca i Mjeseca preko stepena nebeske putanje.\u003c/p>\u003cp data-paragraph=\"22.2\">Ako je tako i ako je vjerodostojno od Allahova Poslanika, neka mu Allah podari blagoslov i mir, ono što nam je pričao Hennad ibn es-Serijj, rekao je: Pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa — Hennad je rekao: A ostatak predaje pročitao sam Ebu Bekru — da su Jevreji došli Vjerovjesniku, neka mu Allah podari blagoslov i mir, pa ga upitali o stvaranju nebesa i Zemlje, te je rekao: Allah je Zemlju stvorio u nedjelju i ponedjeljak; planine i koristi koje se nalaze u njima stvorio je u utorak; a u srijedu je stvorio drveće, vodu, gradove, naseljena i razorena mjesta. To su četiri. Zatim je rekao: ⟦Kur’anski navod, prijevod, 41:9–10⟧ „Reci: Zar vi zaista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova. I na njoj je, iznad nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu hranu u četiri dana, jednako za one koji pitaju“ — za onoga ko pita. Rekao je: U četvrtak je stvorio nebo, a u petak zvijezde, Sunce, Mjesec i meleke, do trenutka kada su od njega preostala tri sata. U prvome od ta tri sata stvorio je rokove — ko će živjeti i ko će umrijeti; u drugome je stavio nedaću na sve ono čime se ljudi koriste; a u trećem Adema, nastanio ga u Džennetu i naredio Iblisu da mu učini sedždu\u003c/p>","paragraphs":[{"id":"22.1","ar":"القول في هل كان الله عز وجل خلق قبل خلقه الزمان والليل والنهار شيئا غير ذلك من الخلق قد قلنا قبل: إن الزمان إنما هو ساعات الليل والنهار، وإن الساعات إنما هي قطع الشمس والقمر درجات الفلك.","bs":"Rasprava o tome je li Allah, Silan je i Uzvišen, prije nego što je stvorio vrijeme, noć i dan stvorio nešto drugo od stvorenja. Već smo rekli da vrijeme čine samo sati noći i dana i da sati pred لسَّائِلِينَ» ، لِمَنْ سَأَلَ قَالَ: وَخَلَقَ يَوْمَ الْخَمِيسِ السَّمَاءَ، وَخَلَقَ يَوْمَ الْجُمُعَةِ النُّجُومَ وَالشَّمْسَ وَالْقَمَرَ وَالْمَلائِكَةَ، إِلَى ثَلاثِ سَاعَاتٍ بَقِيَتْ مِنْهُ، فَخَلَقَ فِي أَوَّلِ سَاعَةٍ مِنْ هَذِهِ الثَّلاثِ السَّاعَاتِ الآجَالَ مَنْ يَحْيَا وَمَنْ يَمُوتُ، وَفِي الثَّانِيَةِ أَلْقَى الآفَةَ عَلَى كُلِّ شَيْءٍ مِمَّا يَنْتَفِعُ بِهِ النَّاسُ، وَفِي الثَّالِثَةِ آدَمَ وَأَسْكَنَهُ الْجَنَّةَ، وَأَمَرَ إِبْلِيسَ بِالسُّجُودِ لَهُ","bs_ranges":[[104,253]],"bs_html":"Ako je tako i ako je vjerodostojno od Allahova Poslanika, neka mu Allah podari blagoslov i mir, ono što \u003cspan class=\"isnad\">nam je pričao Hennad ibn es-Serijj, rekao je: Pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa — Hennad je rekao: \u003c/span>A ostatak predaje pročitao sam Ebu Bekru — da su Jevreji došli Vjerovjesniku, neka mu Allah podari blagoslov i mir, pa ga upitali o stvaranju nebesa i Zemlje, te je rekao: Allah je Zemlju stvorio u nedjelju i ponedjeljak; planine i koristi koje se nalaze u njima stvorio je u utorak; a u srijedu je stvorio drveće, vodu, gradove, naseljena i razorena mjesta. To su četiri. Zatim je rekao: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 41:9–10⟧\u003c/span> „Reci: Zar vi zaista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova. I na njoj je, iznad nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu hranu u četiri dana, jednako za one koji pitaju“ — za onoga ko pita. Rekao je: U četvrtak je stvorio nebo, a u petak zvijezde, Sunce, Mjesec i meleke, do trenutka kada su od njega preostala tri sata. U prvome od ta tri sata stvorio je rokove — ko će živjeti i ko će umrijeti; u drugome je stavio nedaću na sve ono čime se ljudi koriste; a u trećem Adema, nastanio ga u Džennetu i naredio Iblisu da mu učini sedždu"}],"notes":[]},{"n":23,"ar":"وَأَخْرَجَهُ مِنْهَا فِي آخِرِ سَاعَةٍ ثُمَّ قَالَتِ الْيَهُودُ: ثُمَّ مَاذَا يَا مُحَمَّدُ؟ قَالَ: ثُمَّ اسْتَوَى عَلَى الْعَرْشِ، قَالُوا: قَدْ أَصَبْتَ لَوْ اتممت: قالوا: ثم استراح، فغضب النبي ص غضبا شديدا، فنزل: «وَلَقَدْ خَلَقْنَا السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ وَما مَسَّنا مِنْ لُغُوبٍ فَاصْبِرْ عَلى مَا يَقُولُونَ» .\n\nحَدَّثَنِي الْقَاسِمُ بْنُ بِشْرِ بْنِ مَعْرُوفٍ وَالْحُسَيْنُ بن علي الصدائي، قالا: حدثنا حجاج، قال: قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مولى أم سلمة، عن أبي هريرة قال: [أخذ رسول الله ص بِيَدِي فَقَالَ: خَلَقَ اللَّهُ التُّرْبَةَ يَوْمَ السَّبْتِ، وَخَلَقَ فِيهَا الْجِبَالَ يَوْمَ الأَحَدِ، وَخَلَقَ الشَّجَرَ يَوْمَ الاثْنَيْنِ، وَخَلَقَ الْمَكْرُوهَ يَوْمَ الثُّلاثَاءِ، وَخَلَقَ النُّورَ يَوْمَ الأَرْبِعَاءِ، وَبَثَّ فِيهَا الدَّوَابَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ بَعْدَ الْعَصْرِ مِنْ يَوْمِ الْجُمُعَةِ، آخِرَ خَلْقٍ خُلِقَ، فِي آخِرِ سَاعَةٍ مِنْ سَاعَاتِ الْجُمُعَةِ، فِيمَا بَيْنَ الْعَصْرِ إِلَى اللَّيْلِ] .\n\nحَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ بزيع، قال: حدثنا الفضيل بْنُ سُلَيْمَانَ، حَدَّثَنِي مُحَمَّدُ بْنُ زَيْدٍ، قَالَ: حَدَّثَنِي أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ، قَالَ:\n\nأَخْبَرَنِي ابْنُ سَلامٍ وَأَبُو هُرَيْرَةَ، فذكرا عن النبي ص السَّاعَةَ الَّتِي فِي يَوْمِ الْجُمُعَةِ، وَذَكَرَا أَنَّهُ قَالَهَا، قَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: أَنَا أَعْلَمُ أَيَّ سَاعَةٍ هِيَ، بَدَأَ اللَّهُ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ يَوْمَ الأَحَدِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ، فَهِيَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ.\n\nحَدَّثَنِي الْمُثَنَّى، قال: حدثنا الحجاج، حَدَّثَنَا حَمَّادٌ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ عكرمه: [ان اليهود قالوا للنبي ص: ما يوم الأحد؟ فقال رسول","bs":"\u003cp data-paragraph=\"23.1\">i izveo ga iz njega u posljednjem satu. Zatim su Jevreji rekli: A zatim šta, Muhammede? Rekao je: Zatim se uzvisio nad Prijestoljem. Rekli su: Pogodio si, kada bi dovršio. Rekli su: Zatim se odmorio. Tada se Vjerovjesnik, neka mu Allah podari blagoslov i mir, veoma rasrdio, pa je objavljeno: ⟦Kur’anski navod, prijevod, 50:38–39, dio⟧ „Mi smo zaista stvorili nebesa i Zemlju i ono što je između njih u šest dana i nije Nas dotaknuo nikakav umor. Pa strpljivo podnosi ono što govore.“\u003c/p>\u003cp data-paragraph=\"23.2\">Pričali su mi El-Kasim ibn Bišr ibn Ma‘ruf i El-Husejn ibn Ali es-Suda‘i; rekli su: Pričao nam je Hadždžadž, rekao je: Ibn Džurejdž je rekao: Obavijestio me je Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafi‘a, oslobođenika Umm Seleme, od Ebu Hurejre, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, uzeo me je za ruku, pa rekao: Allah je tlo stvorio u subotu, a planine na njemu stvorio je u nedjelju. Drveće je stvorio u ponedjeljak, ono što je neugodno stvorio je u utorak, svjetlost je stvorio u srijedu, životinje je po njemu rasprostro u četvrtak, a Adema je stvorio poslije ikindije u petak, kao posljednje stvorenje koje je stvoreno, u posljednjem od sati petka, između ikindije i noći.]\u003c/p>\u003cp data-paragraph=\"23.3\">Pričao nam je Muhammed ibn Abdullah ibn Bezi‘, rekao je: Pričao nam je El-Fudajl ibn Sulejman; pričao mi je Muhammed ibn Zejd, rekao je: Pričao mi je Ebu Selema ibn Abdurrahman ibn Avf, rekao je:\u003c/p>\u003cp data-paragraph=\"23.4\">Obavijestili su me Ibn Selam i Ebu Hurejra, pa su od Vjerovjesnika, neka mu Allah podari blagoslov i mir, spomenuli sat koji se nalazi u petku i spomenuli da je o njemu govorio. Abdullah ibn Selam je rekao: Ja znam koji je to sat. Allah je stvaranje nebesa i Zemlje započeo u nedjelju, a završio u posljednjem satu petka. Zato je on u posljednjem satu petka.\u003c/p>\u003cp data-paragraph=\"23.5\">Pričao mi je El-Musenna, rekao je: Pričao nam je El-Hadždžadž; pričao nam je Hammad, od Ataa ibn es-Saiba, od Ikrime: [Jevreji su rekli Vjerovjesniku, neka mu Allah podari blagoslov i mir: Šta je nedjelja? Pa je Allahov Poslanik,\u003c/p>","paragraphs":[{"id":"23.1","ar":"وَأَخْرَجَهُ مِنْهَا فِي آخِرِ سَاعَةٍ ثُمَّ قَالَتِ الْيَهُودُ: ثُمَّ مَاذَا يَا مُحَمَّدُ؟ قَالَ: ثُمَّ اسْتَوَى عَلَى الْعَرْشِ، قَالُوا: قَدْ أَصَبْتَ لَوْ اتممت: قالوا: ثم استراح، فغضب النبي ص غضبا شديدا، فنزل: «وَلَقَدْ خَلَقْنَا السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ وَما مَسَّنا مِنْ لُغُوبٍ فَاصْبِرْ عَلى مَا يَقُولُونَ» .","bs":"i izveo ga iz njega u posljednjem satu. Zatim su Jevreji rekli: A zatim šta, Muhammede? Rekao je: Zatim se uzvisio nad Prijestoljem. Rekli su: Pogodio si, kada bi dovršio. Rekli su: Zatim se odmorio. Tada se Vjerovjesnik, neka mu Allah podari blagoslov i mir, veoma rasrdio, pa je objavljeno: ⟦Kur’anski navod, prijevod, 50:38–39, dio⟧ „Mi smo zaista stvorili nebesa i Zemlju i ono što je između njih u šest dana i nije Nas dotaknuo nikakav umor. Pa strpljivo podnosi ono što govore.“","ar_ranges":[],"ar_html":"وَأَخْرَجَهُ مِنْهَا فِي آخِرِ سَاعَةٍ ثُمَّ قَالَتِ الْيَهُودُ: ثُمَّ مَاذَا يَا مُحَمَّدُ؟ قَالَ: ثُمَّ اسْتَوَى عَلَى الْعَرْشِ، قَالُوا: قَدْ أَصَبْتَ لَوْ اتممت: قالوا: ثم استراح، فغضب النبي ص غضبا شديدا، فنزل: «وَلَقَدْ خَلَقْنَا السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ وَما مَسَّنا مِنْ لُغُوبٍ فَاصْبِرْ عَلى مَا يَقُولُونَ» .","bs_ranges":[],"bs_html":"i izveo ga iz njega u posljednjem satu. Zatim su Jevreji rekli: A zatim šta, Muhammede? Rekao je: Zatim se uzvisio nad Prijestoljem. Rekli su: Pogodio si, kada bi dovršio. Rekli su: Zatim se odmorio. Tada se Vjerovjesnik, neka mu Allah podari blagoslov i mir, veoma rasrdio, pa je objavljeno: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 50:38–39, dio⟧\u003c/span> „Mi smo zaista stvorili nebesa i Zemlju i ono što je između njih u šest dana i nije Nas dotaknuo nikakav umor. Pa strpljivo podnosi ono što govore.“"},{"id":"23.2","ar":"حَدَّثَنِي الْقَاسِمُ بْنُ بِشْرِ بْنِ مَعْرُوفٍ وَالْحُسَيْنُ بن علي الصدائي، قالا: حدثنا حجاج، قال: قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مولى أم سلمة، عن أبي هريرة قال: [أخذ رسول الله ص بِيَدِي فَقَالَ: خَلَقَ اللَّهُ التُّرْبَةَ يَوْمَ السَّبْتِ، وَخَلَقَ فِيهَا الْجِبَالَ يَوْمَ الأَحَدِ، وَخَلَقَ الشَّجَرَ يَوْمَ الاثْنَيْنِ، وَخَلَقَ الْمَكْرُوهَ يَوْمَ الثُّلاثَاءِ، وَخَلَقَ النُّورَ يَوْمَ الأَرْبِعَاءِ، وَبَثَّ فِيهَا الدَّوَابَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ بَعْدَ الْعَصْرِ مِنْ يَوْمِ الْجُمُعَةِ، آخِرَ خَلْقٍ خُلِقَ، فِي آخِرِ سَاعَةٍ مِنْ سَاعَاتِ الْجُمُعَةِ، فِيمَا بَيْنَ الْعَصْرِ إِلَى اللَّيْلِ] .","bs":"Pričali su mi El-Kasim ibn Bišr ibn Ma‘ruf i El-Husejn ibn Ali es-Suda‘i; rekli su: Pričao nam je Hadždžadž, rekao je: Ibn Džurejdž je rekao: Obavijestio me je Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafi‘a, oslobođenika Umm Seleme, od Ebu Hurejre, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, uzeo me je za ruku, pa rekao: Allah je tlo stvorio u subotu, a planine na njemu stvorio je u nedjelju. Drveće je stvorio u ponedjeljak, ono što je neugodno stvorio je u utorak, svjetlost je stvorio u srijedu, životinje je po njemu rasprostro u četvrtak, a Adema je stvorio poslije ikindije u petak, kao posljednje stvorenje koje je stvoreno, u posljednjem od sati petka, između ikindije i noći.]","ar_ranges":[[0,209]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي الْقَاسِمُ بْنُ بِشْرِ بْنِ مَعْرُوفٍ وَالْحُسَيْنُ بن علي الصدائي، قالا: حدثنا حجاج، قال: قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مولى أم سلمة، عن أبي هريرة قال: \u003c/span>[أخذ رسول الله ص بِيَدِي فَقَالَ: خَلَقَ اللَّهُ التُّرْبَةَ يَوْمَ السَّبْتِ، وَخَلَقَ فِيهَا الْجِبَالَ يَوْمَ الأَحَدِ، وَخَلَقَ الشَّجَرَ يَوْمَ الاثْنَيْنِ، وَخَلَقَ الْمَكْرُوهَ يَوْمَ الثُّلاثَاءِ، وَخَلَقَ النُّورَ يَوْمَ الأَرْبِعَاءِ، وَبَثَّ فِيهَا الدَّوَابَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ بَعْدَ الْعَصْرِ مِنْ يَوْمِ الْجُمُعَةِ، آخِرَ خَلْقٍ خُلِقَ، فِي آخِرِ سَاعَةٍ مِنْ سَاعَاتِ الْجُمُعَةِ، فِيمَا بَيْنَ الْعَصْرِ إِلَى اللَّيْلِ] .","bs_ranges":[[0,282]],"bs_html":"\u003cspan class=\"isnad\">Pričali su mi El-Kasim ibn Bišr ibn Ma‘ruf i El-Husejn ibn Ali es-Suda‘i; rekli su: Pričao nam je Hadždžadž, rekao je: Ibn Džurejdž je rekao: Obavijestio me je Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafi‘a, oslobođenika Umm Seleme, od Ebu Hurejre, koji je rekao: \u003c/span>[Allahov Poslanik, neka mu Allah podari blagoslov i mir, uzeo me je za ruku, pa rekao: Allah je tlo stvorio u subotu, a planine na njemu stvorio je u nedjelju. Drveće je stvorio u ponedjeljak, ono što je neugodno stvorio je u utorak, svjetlost je stvorio u srijedu, životinje je po njemu rasprostro u četvrtak, a Adema je stvorio poslije ikindije u petak, kao posljednje stvorenje koje je stvoreno, u posljednjem od sati petka, između ikindije i noći.]"},{"id":"23.3","ar":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ بزيع، قال: حدثنا الفضيل بْنُ سُلَيْمَانَ، حَدَّثَنِي مُحَمَّدُ بْنُ زَيْدٍ، قَالَ: حَدَّثَنِي أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ، قَالَ:","bs":"Pričao nam je Muhammed ibn Abdullah ibn Bezi‘, rekao je: Pričao nam je El-Fudajl ibn Sulejman; pričao mi je Muhammed ibn Zejd, rekao je: Pričao mi je Ebu Selema ibn Abdurrahman ibn Avf, rekao je:","ar_ranges":[[0,198]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ بزيع، قال: حدثنا الفضيل بْنُ سُلَيْمَانَ، حَدَّثَنِي مُحَمَّدُ بْنُ زَيْدٍ، قَالَ: حَدَّثَنِي أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ، قَالَ:\u003c/span>","bs_ranges":[[0,195]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Abdullah ibn Bezi‘, rekao je: Pričao nam je El-Fudajl ibn Sulejman; pričao mi je Muhammed ibn Zejd, rekao je: Pričao mi je Ebu Selema ibn Abdurrahman ibn Avf, rekao je:\u003c/span>"},{"id":"23.4","ar":"أَخْبَرَنِي ابْنُ سَلامٍ وَأَبُو هُرَيْرَةَ، فذكرا عن النبي ص السَّاعَةَ الَّتِي فِي يَوْمِ الْجُمُعَةِ، وَذَكَرَا أَنَّهُ قَالَهَا، قَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: أَنَا أَعْلَمُ أَيَّ سَاعَةٍ هِيَ، بَدَأَ اللَّهُ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ يَوْمَ الأَحَدِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ، فَهِيَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ.","bs":"Obavijestili su me Ibn Selam i Ebu Hurejra, pa su od Vjerovjesnika, neka mu Allah podari blagoslov i mir, spomenuli sat koji se nalazi u petku i spomenuli da je o njemu govorio. Abdullah ibn Selam je rekao: Ja znam koji je to sat. Allah je stvaranje nebesa i Zemlje započeo u nedjelju, a završio u posljednjem satu petka. Zato je on u posljednjem satu petka.","ar_ranges":[[0,167]],"ar_html":"\u003cspan class=\"isnad\">أَخْبَرَنِي ابْنُ سَلامٍ وَأَبُو هُرَيْرَةَ، فذكرا عن النبي ص السَّاعَةَ الَّتِي فِي يَوْمِ الْجُمُعَةِ، وَذَكَرَا أَنَّهُ قَالَهَا، قَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: \u003c/span>أَنَا أَعْلَمُ أَيَّ سَاعَةٍ هِيَ، بَدَأَ اللَّهُ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ يَوْمَ الأَحَدِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ، فَهِيَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ.","bs_ranges":[[0,44]],"bs_html":"\u003cspan class=\"isnad\">Obavijestili su me Ibn Selam i Ebu Hurejra, \u003c/span>pa su od Vjerovjesnika, neka mu Allah podari blagoslov i mir, spomenuli sat koji se nalazi u petku i spomenuli da je o njemu govorio. Abdullah ibn Selam je rekao: Ja znam koji je to sat. Allah je stvaranje nebesa i Zemlje započeo u nedjelju, a završio u posljednjem satu petka. Zato je on u posljednjem satu petka."},{"id":"23.5","ar":"حَدَّثَنِي الْمُثَنَّى، قال: حدثنا الحجاج، حَدَّثَنَا حَمَّادٌ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ عكرمه: [ان اليهود قالوا للنبي ص: ما يوم الأحد؟ فقال رسول","bs":"Pričao mi je El-Musenna, rekao je: Pričao nam je El-Hadždžadž; pričao nam je Hammad, od Ataa ibn es-Saiba, od Ikrime: [Jevreji su rekli Vjerovjesniku, neka mu Allah podari blagoslov i mir: Šta je nedjelja? Pa je Allahov Poslanik,","ar_ranges":[[0,106]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى، قال: حدثنا الحجاج، حَدَّثَنَا حَمَّادٌ، عَنْ عَطَاءِ بْنِ السَّائِبِ، عَنْ عكرمه: \u003c/span>[ان اليهود قالوا للنبي ص: ما يوم الأحد؟ فقال رسول","bs_ranges":[[0,118]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je El-Musenna, rekao je: Pričao nam je El-Hadždžadž; pričao nam je Hammad, od Ataa ibn es-Saiba, od Ikrime: \u003c/span>[Jevreji su rekli Vjerovjesniku, neka mu Allah podari blagoslov i mir: Šta je nedjelja? Pa je Allahov Poslanik,"}],"notes":[]},{"n":24,"ar":"الله ص: خلق الله فيه الارض وبسطها، قالوا: فالاثنين؟ قال: خلق الله فِيهِ آدَمَ، قَالُوا: فَالثُّلاثَاءِ؟ قَالَ: خَلَقَ فِيهِ الْجِبَالَ وَالْمَاءَ وَكَذَا وَكَذَا وَمَا شَاءَ اللَّهُ، قَالُوا: فَيَوْمُ الأَرْبِعَاءِ؟ قَالَ: الأَقْوَاتَ، قَالُوا: فَيَوْمُ الْخَمِيسِ؟ قَالَ: خَلَقَ السَّمَوَاتِ، قَالُوا: فَيَوْمُ الْجُمُعَةِ؟ قَالَ: خَلَقَ اللَّهُ فِي سَاعَتَيْنِ اللَّيْلَ وَالنَّهَارَ، ثُمَّ قَالُوا:\n\nالسَّبْتَ- وَذَكَرُوا الرَّاحَةَ- قَالَ: سُبْحَانَ الله! فانزل الله: «وَلَقَدْ خَلَقْنَا السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ وَما مَسَّنا مِنْ لُغُوبٍ] » .\n\nفقد بين هذان الخبران اللذان رويناهما عن رسول الله ص أن الشمس والقمر خلقا بعد خلق الله أشياء كثيرة من خلقه، وذلك أن حديث ابن عباس عن رسول الله ص ورد بأن الله خلق الشمس والقمر يوم الجمعة فإن كان ذلك كذلك، فقد كانت الأرض والسماء وما فيهما- سوى الملائكة وآدم- مخلوقة قبل خلق الله الشمس والقمر، وكان ذلك كله ولا ليل ولا نهار، إذ كان الليل والنهار إنما هو اسم لساعات معلومة من قطع الشمس والقمر درج الفلك.\n\nوإذا كان صحيحا أن الأرض والسماء وما فيهما، سوى ما ذكرنا، قد كانت ولا شمس ولا قمر- كان معلوما أن ذلك كله كان ولا ليل ولا نهار.\n\nوكذلك حديث ابى هريرة عن [رسول الله ص، لأنه أخبر عنه أنه قال: خلق الله النور يوم الأربعاء،] يعني بالنور الشمس إن شاء الله.\n\nفإن قال لنا قائل: قد زعمت أن اليوم إنما هو اسم لميقات ما بين طلوع الفجر إلى غروب الشمس، ثم زعمت الآن أن الله خلق الشمس والقمر بعد أيام من أول ابتدائه خلق الأشياء التي خلقها، فأثبت مواقيت، وسميتها بالأيام، ولا شمس ولا قمر، وهذا إن لم تأت ببرهان على صحته، فهو كلام ينقض بعضه بعضا!","bs":"\u003cp data-paragraph=\"24.1\">neka mu Allah podari blagoslov i mir, rekao: Allah je u njoj stvorio Zemlju i rasprostro je. Rekli su: A ponedjeljak? Rekao je: Allah je u njemu stvorio Adema. Rekli su: A utorak? Rekao je: U njemu je stvorio planine i vodu i to i to i ono što je Allah htio. Rekli su: A srijeda? Rekao je: Hranu. Rekli su: A četvrtak? Rekao je: Stvorio je nebesa. Rekli su: A petak? Rekao je: Allah je u dva sata stvorio noć i dan. Zatim su rekli:\u003c/p>\u003cp data-paragraph=\"24.2\">Subota — i spomenuli su odmor. Rekao je: Slavljen neka je Allah! Pa je Allah objavio: ⟦Kur’anski navod, prijevod, 50:38⟧ „Mi smo zaista stvorili nebesa i Zemlju i ono što je između njih u šest dana i nije Nas dotaknuo nikakav umor.“]\u003c/p>\u003cp data-paragraph=\"24.3\">Ove dvije vijesti koje smo prenijeli od Allahova Poslanika, neka mu Allah podari blagoslov i mir, objasnile su da su Sunce i Mjesec stvoreni nakon što je Allah stvorio mnoge stvari od Svojih stvorenja. Jer predaja Ibn Abbasa od Allahova Poslanika, neka mu Allah podari blagoslov i mir, prenesena je s navodom da je Allah Sunce i Mjesec stvorio u petak. Ako je tako, Zemlja i nebo i ono što je u njima — osim meleka i Adema — bili su stvoreni prije nego što je Allah stvorio Sunce i Mjesec. Sve je to postojalo, a nije bilo ni noći ni dana, jer su noć i dan samo naziv za poznate sate prelaska Sunca i Mjeseca preko stepena nebeske putanje.\u003c/p>\u003cp data-paragraph=\"24.4\">Ako je tačno da su Zemlja i nebo i ono što je u njima, osim onoga što smo spomenuli, postojali bez Sunca i Mjeseca, poznato je da je sve to postojalo bez noći i dana.\u003c/p>\u003cp data-paragraph=\"24.5\">Isto važi i za predaju Ebu Hurejre od [Allahova Poslanika, neka mu Allah podari blagoslov i mir, jer je od njega prenio da je rekao: Allah je svjetlost stvorio u srijedu,] pri čemu se pod svjetlošću misli na Sunce, ako Allah htjedne.\u003c/p>\u003cp data-paragraph=\"24.6\">Ako nam neko kaže: Tvrdio si da je dan samo naziv za razdoblje između izlaska zore i zalaska Sunca, a sada tvrdiš da je Allah Sunce i Mjesec stvorio nakon nekoliko dana od početka stvaranja stvari koje je stvorio. Time si utvrdio vremenska razdoblja i nazvao ih danima, a nema ni Sunca ni Mjeseca. Ako ne doneseš dokaz njegove ispravnosti, to je govor čiji jedan dio proturječi drugome!\u003c/p>","paragraphs":[{"id":"24.1","ar":"الله ص: خلق الله فيه الارض وبسطها، قالوا: فالاثنين؟ قال: خلق الله فِيهِ آدَمَ، قَالُوا: فَالثُّلاثَاءِ؟ قَالَ: خَلَقَ فِيهِ الْجِبَالَ وَالْمَاءَ وَكَذَا وَكَذَا وَمَا شَاءَ اللَّهُ، قَالُوا: فَيَوْمُ الأَرْبِعَاءِ؟ قَالَ: الأَقْوَاتَ، قَالُوا: فَيَوْمُ الْخَمِيسِ؟ قَالَ: خَلَقَ السَّمَوَاتِ، قَالُوا: فَيَوْمُ الْجُمُعَةِ؟ قَالَ: خَلَقَ اللَّهُ فِي سَاعَتَيْنِ اللَّيْلَ وَالنَّهَارَ، ثُمَّ قَالُوا:","bs":"neka mu Allah podari blagoslov i mir, rekao: Allah je u njoj stvorio Zemlju i rasprostro je. Rekli su: A ponedjeljak? Rekao je: Allah je u njemu stvorio Adema. Rekli su: A utorak? Rekao je: U njemu je stvorio planine i vodu i to i to i ono što je Allah htio. Rekli su: A srijeda? Rekao je: Hranu. Rekli su: A četvrtak? Rekao je: Stvorio je nebesa. Rekli su: A petak? Rekao je: Allah je u dva sata stvorio noć i dan. Zatim su rekli:","ar_ranges":[],"ar_html":"الله ص: خلق الله فيه الارض وبسطها، قالوا: فالاثنين؟ قال: خلق الله فِيهِ آدَمَ، قَالُوا: فَالثُّلاثَاءِ؟ قَالَ: خَلَقَ فِيهِ الْجِبَالَ وَالْمَاءَ وَكَذَا وَكَذَا وَمَا شَاءَ اللَّهُ، قَالُوا: فَيَوْمُ الأَرْبِعَاءِ؟ قَالَ: الأَقْوَاتَ، قَالُوا: فَيَوْمُ الْخَمِيسِ؟ قَالَ: خَلَقَ السَّمَوَاتِ، قَالُوا: فَيَوْمُ الْجُمُعَةِ؟ قَالَ: خَلَقَ اللَّهُ فِي سَاعَتَيْنِ اللَّيْلَ وَالنَّهَارَ، ثُمَّ قَالُوا:","bs_ranges":[],"bs_html":"neka mu Allah podari blagoslov i mir, rekao: Allah je u njoj stvorio Zemlju i rasprostro je. Rekli su: A ponedjeljak? Rekao je: Allah je u njemu stvorio Adema. Rekli su: A utorak? Rekao je: U njemu je stvorio planine i vodu i to i to i ono što je Allah htio. Rekli su: A srijeda? Rekao je: Hranu. Rekli su: A četvrtak? Rekao je: Stvorio je nebesa. Rekli su: A petak? Rekao je: Allah je u dva sata stvorio noć i dan. Zatim su rekli:"},{"id":"24.2","ar":"السَّبْتَ- وَذَكَرُوا الرَّاحَةَ- قَالَ: سُبْحَانَ الله! فانزل الله: «وَل orio u srijedu,] pri čemu se pod svjetlošću misli na Sunce, ako Allah htjedne.","ar_ranges":[],"ar_html":"وكذلك حديث ابى هريرة عن [رسول الله ص، لأنه أخبر عنه أنه قال: خلق الله النور يوم الأربعاء،] يعني بالنور الشمس إن شاء الله.","bs_ranges":[],"bs_html":"Isto važi i za predaju Ebu Hurejre od [Allahova Poslanika, neka mu Allah podari blagoslov i mir, jer je od njega prenio da je rekao: Allah je svjetlost stvorio u srijedu,] pri čemu se pod svjetlošću misli na Sunce, ako Allah htjedne."},{"id":"24.6","ar":"فإن قال لنا قائل: قد زعمت أن اليوم إنما هو اسم لميقات ما بين طلوع الفجر إلى غروب الشمس، ثم زعمت الآن أن الله خلق الشمس والقمر بعد أيام من أول ابتدائه خلق الأشياء التي خلقها، فأثبت مواقيت، وسميتها بالأيام، ولا شمس ولا قمر، وهذا إن لم تأت ببرهان على صحته، فهو كلام ينقض بعضه بعضا!","bs":"Ako nam neko kaže: Tvrdio si da je dan samo naziv za razdoblje između izlaska zore i zalaska Sunca, a sada tvrdiš da je Allah Sunce i Mjesec stvorio nakon nekoliko dana od početka stvaranja stvari koje je stvorio. Time si utvrdio vremenska razdoblja i nazvao ih danima, a nema ni Sunca ni Mjeseca. Ako ne doneseš dokaz njegove ispravnosti, to je govor čiji jedan dio proturječi drugome!","ar_ranges":[],"ar_html":"فإن قال لنا قائل: قد زعمت أن اليوم إنما هو اسم لميقات ما بين طلوع الفجر إلى غروب الشمس، ثم زعمت الآن أن الله خلق الشمس والقمر بعد أيام من أول ابتدائه خلق الأشياء التي خلقها، فأثبت مواقيت، وسميتها بالأيام، ولا شمس ولا قمر، وهذا إن لم تأت ببرهان على صحته، فهو كلام ينقض بعضه بعضا!","bs_ranges":[],"bs_html":"Ako nam neko kaže: Tvrdio si da je dan samo naziv za razdoblje između izlaska zore i zalaska Sunca, a sada tvrdiš da je Allah Sunce i Mjesec stvorio nakon nekoliko dana od početka stvaranja stvari koje je stvorio. Time si utvrdio vremenska razdoblja i nazvao ih danima, a nema ni Sunca ni Mjeseca. Ako ne doneseš dokaz njegove ispravnosti, to je govor čiji jedan dio proturječi drugome!"}],"notes":[]},{"n":25,"ar":"قيل: إن الله سمى ما ذكرته أياما، فسميته بالاسم الذي سماه به، وكان وجه تسميه ذلك أياما، ولا شمس ولا قمر، نظير قوله عز وجل: «وَلَهُمْ رِزْقُهُمْ فِيها بُكْرَةً وَعَشِيًّا» ولا بكرة ولا عشي هنالك، إذ كان لا ليل في الآخرة ولا شمس ولا قمر، كما قال جل وعز: «وَلا يَزالُ الَّذِينَ كَفَرُوا فِي مِرْيَةٍ مِنْهُ حَتَّى تَأْتِيَهُمُ السَّاعَةُ بَغْتَةً أَوْ يَأْتِيَهُمْ عَذابُ يَوْمٍ عَقِيمٍ» .\n\nفسمى تعالى ذكره يوم القيامة يوما عقيما، إذ كان يوما لا ليل بعد مجيئه، وإنما أريد بتسمية ما سمي أياما قبل خلق الشمس والقمر قدر مدة ألف عام من أعوام الدنيا، التي العام منها اثنا عشر شهرا من شهور أهل الدنيا، التي تعد ساعاتها وأيامها بقطع الشمس والقمر درج الفلك، كما سمي بكرة وعشيا لما يرزقه أهل الجنة في قدر المدة التي كانوا يعرفون ذلك من الزمان في الدنيا بالشمس ومجراها في الفلك، ولا شمس عندهم ولا ليل وبنحو الذي قلنا في ذلك قال السلف من أهل العلم.\n\nذكر بعض من حضرنا ذكره ممن قال ذلك:\n\nحَدَّثَنِي القاسم، قال: حَدَّثَنَا الحسين، قال: حَدَّثَنِي الحجاج، عن ابن جريج، عن مجاهد أنه قال: يقضي الله عز وجل أمر كل شيء ألف سنة إلى الملائكة، ثم كذلك حتى يمضي ألف سنة، ثم يقضي أمر كل شيء ألفا، ثم كذلك أبدا، قال: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ» قال: اليوم أن يقول لما يقضي إلى الملائكة ألف سنة: كن فيكون، ولكن سماه يوما، سماه كما شاء كل ذلك","bs":"\u003cp data-paragraph=\"25.1\">Odgovara se: Allah je ono što sam spomenuo nazvao danima, pa sam to nazvao imenom kojim je On to nazvao. Smisao toga da se to nazove danima, iako nije bilo ni Sunca ni Mjeseca, sličan je Njegovim riječima, Silan je i Uzvišen: ⟦Kur’anski navod, prijevod, 19:62, dio⟧ „I u njemu će imati svoju opskrbu ujutro i navečer.“ A tamo nema ni jutra ni večeri, jer na onom svijetu nema ni noći, ni Sunca, ni Mjeseca, kao što je rekao, Veličanstveni i Silni: ⟦Kur’anski navod, prijevod, 22:55⟧ „A oni koji ne vjeruju neprestano će biti u sumnji u pogledu njega, sve dok im Čas ne dođe iznenada ili im ne dođe kazna neplodnoga dana.“\u003c/p>\u003cp data-paragraph=\"25.2\">On, uzvišen je Njegov spomen, nazvao je Dan proživljenja neplodnim danom zato što je to dan nakon čijeg dolaska nema noći. Nazivanjem danima onoga što je tako nazvano prije stvaranja Sunca i Mjeseca namjeravalo se samo trajanje od hiljadu godina ovoga svijeta, u kojem godina ima dvanaest mjeseci od mjeseci stanovnika ovoga svijeta, čiji se sati i dani broje prelaskom Sunca i Mjeseca preko stepena nebeske putanje. Slično tome, jutrom i večeri nazvano je ono kada stanovnici Dženneta dobijaju opskrbu u trajanju vremenskog razdoblja koje su na ovom svijetu prepoznavali po Suncu i njegovu kretanju nebeskom putanjom, premda kod njih nema ni Sunca ni noći. Slično onome što smo o tome rekli govorili su i prethodnici među učenim ljudima.\u003c/p>\u003cp data-paragraph=\"25.3\">Spomen nekih među onima koji su to rekli, a čijeg smo se spomena sada prisjetili:\u003c/p>\u003cp data-paragraph=\"25.4\">Pričao mi je El-Kasim, rekao je: Pričao nam je El-Husejn, rekao je: Pričao mi je El-Hadždžadž, od Ibn Džurejdža, od Mudžahida, da je rekao: Allah, Silan je i Uzvišen, melekima određuje stvar svake stvari za hiljadu godina; zatim tako biva dok ne prođe hiljadu godina, pa određuje stvar svake stvari za hiljadu, i zatim tako zauvijek. Rekao je: ⟦Kur’anski navod, prijevod, 32:5, dio⟧ „U danu čije je trajanje hiljadu godina.“ Rekao je: Dan znači da On za ono što melekima određuje za hiljadu godina kaže: „Budi“, i ono bude. Ali nazvao ga je danom; nazvao ga je kako je htio. Sve to\u003c/p>","paragraphs":[{"id":"25.1","ar":"قيل: إن الله سمى ما ذكرته أياما، فسميته بالاسم الذي سماه به، وكان وجه تسميه ذلك أياما، ولا شمس ولا قمر، نظير قوله عز وجل: «وَلَهُمْ رِزْقُهُمْ فِيها بُكْرَةً وَعَشِيًّا» ولا بكرة ولا عشي هنالك، إذ كان لا ليل في الآخرة ولا شمس ولا قمر، كما قال جل وعز: «وَلا يَزالُ الَّذِينَ كَفَرُوا فِي مِرْيَةٍ مِنْهُ حَتَّى تَأْتِيَهُمُ السَّاعَةُ بَغْتَةً أَوْ يَأْتِيَهُمْ عَذابُ يَوْمٍ عَقِيمٍ» .","bs":"Odgovara se: Allah je ono što sam spomenuo nazvao danima, pa sam to nazvao imenom kojim je On to nazvao. Smisao toga da se to nazove danima, iako nije bilo ni Sunca ni Mjeseca, sličan je Njegovim riječima, Silan je i Uzvišen: ⟦Kur’anski navod, prijevod, 19:62, dio⟧ „I u njemu će imati svoju opskrbu ujutro i navečer.“ A tamo nema ni jutra ni večeri, jer na onom svijetu nema ni noći, ni Sunca, ni Mjeseca, kao što je rekao, Veličanstveni i Silni: ⟦Kur’anski navod, prijevod, 22:55⟧ „A oni koji ne vjeruju neprestano će biti u sumnji u pogledu njega, sve dok im Čas ne dođe iznenada ili im ne dođe kazna neplodnoga dana.“","ar_ranges":[],"ar_html":"قيل: إن الله سمى ما ذكرته أياما، فسميته بالاسم الذي سماه به، وكان وجه تسميه ذلك أياما، ولا شمس ولا قمر، نظير قوله عز وجل: «وَلَهُمْ رِزْقُهُمْ فِيها بُكْرَةً وَعَشِيًّا» ولا بكرة ولا عشي هنالك، إذ كان لا ليل في الآخرة ولا شمس ولا قمر، كما قال جل وعز: «وَلا يَزالُ الَّذِينَ كَفَرُوا فِي مِرْيَةٍ مِنْهُ حَتَّى تَأْتِيَهُمُ السَّاعَةُ بَغْتَةً أَوْ يَأْتِيَهُمْ عَذابُ يَوْمٍ عَقِيمٍ» .","bs_ranges":[],"bs_html":"Odgovara se: Allah je ono što sam spomenuo nazvao danima, pa sam to nazvao imenom kojim je On to nazvao. Smisao toga da se to nazove danima, iako nije bilo ni Sunca ni Mjeseca, sličan je Njegovim riječima, Silan je i Uzvišen: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 19:62, dio⟧\u003c/span> „I u njemu će imati svoju opskrbu ujutro i navečer.“ A tamo nema ni jutra ni večeri, jer na onom svijetu nema ni noći, ni Sunca, ni Mjeseca, kao što je rekao, Veličanstveni i Silni: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 22:55⟧\u003c/span> „A oni koji ne vjeruju neprestano će biti u sumnji u pogledu njega, sve dok im Čas ne dođe iznenada ili im ne dođe kazna neplodnoga dana.“"},{"id":"25.2","ar":"فسمى تعالى ذكره يوم القيامة يوما عقيما، إذ كان يوما لا ليل بعد مجيئه، وإنما أريد بتسمية ما سمي أياما قبل خلق الشمس والقمر قدر مدة ألف عام من أعوام الدنيا، التي العام منها اثنا عشر شهرا من شهور أهل الدنيا، التي تعد ساعاتها وأيامها بقطع الشمس والقمر درج الفلك، كما سمي بكرة وعشيا لما يرزقه أهل الجنة في قدر المدة التي كانوا يعرفون ذلك من الزمان في الدنيا بالشمس ومجراها في الفلك، ولا شمس عندهم ولا ليل وبنحو الذي  među učenim ljudima."},{"id":"25.3","ar":"ذكر بعض من حضرنا ذكره ممن قال ذلك:","bs":"Spomen nekih među onima koji su to rekli, a čijeg smo se spomena sada prisjetili:","ar_ranges":[],"ar_html":"ذكر بعض من حضرنا ذكره ممن قال ذلك:","bs_ranges":[],"bs_html":"Spomen nekih među onima koji su to rekli, a čijeg smo se spomena sada prisjetili:"},{"id":"25.4","ar":"حَدَّثَنِي القاسم، قال: حَدَّثَنَا الحسين، قال: حَدَّثَنِي الحجاج، عن ابن جريج، عن مجاهد أنه قال: يقضي الله عز وجل أمر كل شيء ألف سنة إلى الملائكة، ثم كذلك حتى يمضي ألف سنة، ثم يقضي أمر كل شيء ألفا، ثم كذلك أبدا، قال: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ» قال: اليوم أن يقول لما يقضي إلى الملائكة ألف سنة: كن فيكون، ولكن سماه يوما، سماه كما شاء كل ذلك","bs":"Pričao mi je El-Kasim, rekao je: Pričao nam je El-Husejn, rekao je: Pričao mi je El-Hadždžadž, od Ibn Džurejdža, od Mudžahida, da je rekao: Allah, Silan je i Uzvišen, melekima određuje stvar svake stvari za hiljadu godina; zatim tako biva dok ne prođe hiljadu godina, pa određuje stvar svake stvari za hiljadu, i zatim tako zauvijek. Rekao je: ⟦Kur’anski navod, prijevod, 32:5, dio⟧ „U danu čije je trajanje hiljadu godina.“ Rekao je: Dan znači da On za ono što melekima određuje za hiljadu godina kaže: „Budi“, i ono bude. Ali nazvao ga je danom; nazvao ga je kako je htio. Sve to","ar_ranges":[[0,89]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي القاسم، قال: حَدَّثَنَا الحسين، قال: حَدَّثَنِي الحجاج، عن ابن جريج، عن مجاهد \u003c/span>أنه قال: يقضي الله عز وجل أمر كل شيء ألف سنة إلى الملائكة، ثم كذلك حتى يمضي ألف سنة، ثم يقضي أمر كل شيء ألفا، ثم كذلك أبدا، قال: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ» قال: اليوم أن يقول لما يقضي إلى الملائكة ألف سنة: كن فيكون، ولكن سماه يوما، سماه كما شاء كل ذلك","bs_ranges":[[0,140]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je El-Kasim, rekao je: Pričao nam je El-Husejn, rekao je: Pričao mi je El-Hadždžadž, od Ibn Džurejdža, od Mudžahida, da je rekao: \u003c/span>Allah, Silan je i Uzvišen, melekima određuje stvar svake stvari za hiljadu godina; zatim tako biva dok ne prođe hiljadu godina, pa određuje stvar svake stvari za hiljadu, i zatim tako zauvijek. Rekao je: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 32:5, dio⟧\u003c/span> „U danu čije je trajanje hiljadu godina.“ Rekao je: Dan znači da On za ono što melekima određuje za hiljadu godina kaže: „Budi“, i ono bude. Ali nazvao ga je danom; nazvao ga je kako je htio. Sve to"}],"notes":[]},{"n":26,"ar":"عن مجاهد، قال: وقوله تعالى: «وَإِنَّ يَوْماً عِنْدَ رَبِّكَ كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ» قال: هو هو سواء.\n\nوبنحو الذي ورد عن رسول الله ص من الخبر، بأن الله جل جلاله خلق الشمس والقمر بعد خلقه السموات والأرض وأشياء غير ذلك، ورد الخبر عن جماعة من السلف أنهم قالوه.\n\nذكر الخبر عمن قال ذلك منهم:\n\nحدثنا ابو هشام الرفاعى، حدثنا ابن يمان، حَدَّثَنَا سُفْيَانُ، عَنِ ابْنِ جُرَيْجٍ، عَنْ سُلَيْمَانَ بْنِ مُوسَى، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبَّاسٍ:\n\n«فَقالَ لَها وَلِلْأَرْضِ ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ» .\n\nقَالَ: قَالَ اللَّهُ عَزَّ وَجَلَّ لِلسَّمَوَاتِ: أَطْلِعِي شمسى وقمرى، واطلعى نجومى.\n\nوَقَالَ لِلأَرْضِ: شَقِّقِي أَنْهَارَكِ، وَأَخْرِجِي ثِمَارَكِ، فَقَالَتَا: أَتَيْنَا طَائِعِينَ.\n\nحَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ،: قَالَ حَدَّثَنَا يَزِيدُ، قال: حدثنا سعيد، عن قتادة:\n\n«وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها» ، خلق فيها شمسها وقمرها ونجومها وصلاحها.\n\nفقد بينت هذه الأخبار التي ذكرناها عن رسول الله ص وعمن ذكرناها عنه أن الله عز وجل خلق السموات والأرض قبل خلقه الزمان والأيام والليالي، وقبل الشمس والقمر والله أعلم","bs":"\u003cp data-paragraph=\"26.1\">prenosi se od Mudžahida. Rekao je: A Njegove riječi, Uzvišen je: ⟦Kur’anski navod, prijevod, 22:47, dio⟧ „A zaista je jedan dan kod tvoga Gospodara poput hiljadu godina koje brojite“ — rekao je: To je isto, jednako.\u003c/p>\u003cp data-paragraph=\"26.2\">Slično vijesti prenesenoj od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je Allah, veličanstvena je Njegova uzvišenost, stvorio Sunce i Mjesec nakon što j
