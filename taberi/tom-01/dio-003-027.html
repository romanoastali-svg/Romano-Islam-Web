e stvorio nebesa i Zemlju i druge stvari, prenesena je i vijest od skupine prethodnika da su tako govorili.\u003c/p>\u003cp data-paragraph=\"26.3\">Spomen vijesti o onima među njima koji su to rekli:\u003c/p>\u003cp data-paragraph=\"26.4\">Pričao nam je Ebu Hišam er-Rifa‘i; pričao nam je Ibn Jeman; pričao nam je Sufjan, od Ibn Džurejdža, od Sulejmana ibn Muse, od Mudžahida, od Ibn Abbasa:\u003c/p>\u003cp data-paragraph=\"26.5\">⟦Kur’anski navod, prijevod, 41:11, dio⟧ „Pa je njemu i Zemlji rekao: Dođite dragovoljno ili protiv volje! Rekli su: Dolazimo pokorno.“\u003c/p>\u003cp data-paragraph=\"26.6\">Rekao je: Allah, Silan je i Uzvišen, rekao je nebesima: Izvedite Moje Sunce i Moj Mjesec i izvedite Moje zvijezde.\u003c/p>\u003cp data-paragraph=\"26.7\">I rekao je Zemlji: Otvori svoje rijeke i izvedi svoje plodove. Pa su njih dvoje rekli: Dolazimo pokorno.\u003c/p>\u003cp data-paragraph=\"26.8\">Pričao nam je Bišr ibn Muaz, rekao je: Pričao nam je Jezid, rekao je: Pričao nam je Seid, od Katade:\u003c/p>\u003cp data-paragraph=\"26.9\">⟦Kur’anski navod, prijevod, 41:12, dio⟧ „I svakom je nebu objavio njegovu odredbu“ — stvorio je na njemu njegovo Sunce, njegov Mjesec, njegove zvijezde i ono što mu služi za ispravno uređenje.\u003c/p>\u003cp data-paragraph=\"26.10\">Ove vijesti koje smo spomenuli od Allahova Poslanika, neka mu Allah podari blagoslov i mir, i od onih od kojih smo ih spomenuli, objasnile su da je Allah, Silan je i Uzvišen, stvorio nebesa i Zemlju prije nego što je stvorio vrijeme, dane i noći, te prije Sunca i Mjeseca. A Allah najbolje zna.\u003c/p>","paragraphs":[{"id":"26.1","ar":"عن مجاهد، قال: وقوله تعالى: «وَإِنَّ يَوْماً عِنْدَ رَبِّكَ كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ» قال: هو هو سواء.","bs":"prenosi se od Mudžahida. Rekao je: A Njegove riječi, Uzvišen je: ⟦Kur’anski navod, prijevod, 22:47, dio⟧ „A zaista je jedan dan kod tvoga Gospodara poput hiljadu godina koje brojite“ — rekao je: To je isto, jednako.","ar_ranges":[],"ar_html":"عن مجاهد، قال: وقوله تعالى: «وَإِنَّ يَوْماً عِنْدَ رَبِّكَ كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ» قال: هو هو سواء.","bs_ranges":[],"bs_html":"prenosi se od Mudžahida. Rekao je: A Njegove riječi, Uzvišen je: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 22:47, dio⟧\u003c/span> „A zaista je jedan dan kod tvoga Gospodara poput hiljadu godina koje brojite“ — rekao je: To je isto, jednako."},{"id":"26.2","ar":"وبنحو الذي ورد عن رسول الله ص من الخبر، بأن الله جل جلاله خلق الشمس والقمر بعد خلقه السموات والأرض وأشياء غير ذلك، ورد الخبر عن جماعة من السلف أنهم قالوه.","bs":"Slično vijesti prenesenoj od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je Allah, veličanstvena je Njegova uzvišenost, stvorio Sunce i Mjesec nakon što je stvorio nebesa i Zemlju i druge stvari, prenesena je i vijest od skupine prethodnika da su tako govorili.","ar_ranges":[],"ar_html":"وبنحو الذي ورد عن رسول الله ص من الخبر، بأن الله جل جلاله خلق الشمس والقمر بعد خلقه السموات والأرض وأشياء غير ذلك، ورد الخبر عن جماعة من السلف أنهم قالوه.","bs_ranges":[],"bs_html":"Slično vijesti prenesenoj od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je Allah, veličanstvena je Njegova uzvišenost, stvorio Sunce i Mjesec nakon što je stvorio nebesa i Zemlju i druge stvari, prenesena je i vijest od skupine prethodnika da su tako govorili."},{"id":"26.3","ar":"ذكر الخبر عمن قال ذلك منهم:","bs":"Spomen vijesti o onima među njima koji su to rekli:","ar_ranges":[],"ar_html":"ذكر الخبر عمن قال ذلك منهم:","bs_ranges":[],"bs_html":"Spomen vijesti o onima među njima koji su to rekli:"},{"id":"26.4","ar":"حدثنا ابو هشام الرفاعى، حدثنا ابن يمان، حَدَّثَنَا سُفْيَانُ، عَنِ ابْنِ جُرَيْجٍ، عَنْ سُلَيْمَانَ بْنِ مُوسَى، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبَّاسٍ:","bs":"Pričao nam je Ebu Hišam er-Rifa‘i; pričao nam je Ibn Jeman; pričao nam je Sufjan, od Ibn Džurejdža, od Sulejmana ibn Muse, od Mudžahida, od Ibn Abbasa:","ar_ranges":[[0,149]],"ar_html":"\u003cspan class=\"isnad\">حدثنا ابو هشام الرفاعى، حدثنا ابن يمان، حَدَّثَنَا سُفْيَانُ، عَنِ ابْنِ جُرَيْجٍ، عَنْ سُلَيْمَانَ بْنِ مُوسَى، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبَّاسٍ:\u003c/span>","bs_ranges":[[0,151]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Hišam er-Rifa‘i; pričao nam je Ibn Jeman; pričao nam je Sufjan, od Ibn Džurejdža, od Sulejmana ibn Muse, od Mudžahida, od Ibn Abbasa:\u003c/span>"},{"id":"26.5","ar":"«فَقالَ لَها وَلِلْأَرْضِ ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ» .","bs":"⟦Kur’anski navod, prijevod, 41:11, dio⟧ „Pa je njemu i Zemlji rekao: Dođite dragovoljno ili protiv volje! Rekli su: Dolazimo pokorno.“","ar_ranges":[],"ar_html":"«فَقالَ لَها وَلِلْأَرْضِ ائْتِيا طَوْعاً أَوْ كَرْهاً قالَتا أَتَيْنا طائِعِينَ» .","bs_ranges":[],"bs_html":"\u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 41:11, dio⟧\u003c/span> „Pa je njemu i Zemlji rekao: Dođite dragovoljno ili protiv volje! Rekli su: Dolazimo pokorno.“"},{"id":"26.6","ar":"قَالَ: قَالَ اللَّهُ عَزَّ وَجَلَّ لِلسَّمَوَاتِ: أَطْلِعِي شمسى وقمرى، واطلعى نجومى.","bs":"Rekao je: Allah, Silan je i Uzvišen, rekao je nebesima: Izvedite Moje Sunce i Moj Mjesec i izvedite Moje zvijezde.","ar_ranges":[],"ar_html":"قَالَ: قَالَ اللَّهُ عَزَّ وَجَلَّ لِلسَّمَوَاتِ: أَطْلِعِي شمسى وقمرى، واطلعى نجومى.","bs_ranges":[],"bs_html":"Rekao je: Allah, Silan je i Uzvišen, rekao je nebesima: Izvedite Moje Sunce i Moj Mjesec i izvedite Moje zvijezde."},{"id":"26.7","ar":"وَقَالَ لِلأَرْضِ: شَقِّقِي أَنْهَارَكِ، وَأَخْرِجِي ثِمَارَكِ، فَقَالَتَا: أَتَيْنَا طَائِعِينَ.","bs":"I rekao je Zemlji: Otvori svoje rijeke i izvedi svoje plodove. Pa su njih dvoje rekli: Dolazimo pokorno.","ar_ranges":[],"ar_html":"وَقَالَ لِلأَرْضِ: شَقِّقِي أَنْهَارَكِ، وَأَخْرِجِي ثِمَارَكِ، فَقَالَتَا: أَتَيْنَا طَائِعِينَ.","bs_ranges":[],"bs_html":"I rekao je Zemlji: Otvori svoje rijeke i izvedi svoje plodove. Pa su njih dvoje rekli: Dolazimo pokorno."},{"id":"26.8","ar":"حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ،: قَالَ حَدَّثَنَا يَزِيدُ، قال: حدثنا سعيد، عن قتادة:","bs":"Pričao nam je Bišr ibn Muaz, rekao je: Pričao nam je Jezid, rekao je: Pričao nam je Seid, od Katade:","ar_ranges":[[0,85]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ،: قَالَ حَدَّثَنَا يَزِيدُ، قال: حدثنا سعيد، عن قتادة:\u003c/span>","bs_ranges":[[0,100]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz, rekao je: Pričao nam je Jezid, rekao je: Pričao nam je Seid, od Katade:\u003c/span>"},{"id":"26.9","ar":"«وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها» ، خلق فيها شمسها وقمرها ونجومها وصلاحها.","bs":"⟦Kur’anski navod, prijevod, 41:12, dio⟧ „I svakom je nebu objavio njegovu odredbu“ — stvorio je na njemu njegovo Sunce, njegov Mjesec, njegove zvijezde i ono što mu služi za ispravno uređenje.","ar_ranges":[],"ar_html":"«وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها» ، خلق فيها شمسها وقمرها ونجومها وصلاحها.","bs_ranges":[],"bs_html":"\u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 41:12, dio⟧\u003c/span> „I svakom je nebu objavio njegovu odredbu“ — stvorio je na njemu njegovo Sunce, njegov Mjesec, njegove zvijezde i ono što mu služi za ispravno uređenje."},{"id":"26.10","ar":"فقد بينت هذه الأخبار التي ذكرناها عن رسول الله ص وعمن ذكرناها عنه أن الله عز وجل خلق السموات والأرض قبل خلقه الزمان والأيام والليالي، وقبل الشمس والقمر والله أعلم","bs":"Ove vijesti koje smo spomenuli od Allahova Poslanika, neka mu Allah podari blagoslov i mir, i od onih od kojih smo ih spomenuli, objasnile su da je Allah, Silan je i Uzvišen, stvorio nebesa i Zemlju prije nego što je stvorio vrijeme, dane i noći, te prije Sunca i Mjeseca. A Allah najbolje zna.","ar_ranges":[],"ar_html":"فقد بينت هذه الأخبار التي ذكرناها عن رسول الله ص وعمن ذكرناها عنه أن الله عز وجل خلق السموات والأرض قبل خلقه الزمان والأيام والليالي، وقبل الشمس والقمر والله أعلم","bs_ranges":[],"bs_html":"Ove vijesti koje smo spomenuli od Allahova Poslanika, neka mu Allah podari blagoslov i mir, i od onih od kojih smo ih spomenuli, objasnile su da je Allah, Silan je i Uzvišen, stvorio nebesa i Zemlju prije nego što je stvorio vrijeme, dane i noći, te prije Sunca i Mjeseca. A Allah najbolje zna."}],"notes":[]},{"n":27,"ar":"القول في الإبانة عن فناء الزمان والليل والنهار وأن لا شيء يبقى غير الله تعالى ذكره\n\nوالدلالة على صحة ذلك قول الله تعالى ذكره: «كُلُّ مَنْ عَلَيْها فانٍ وَيَبْقى وَجْهُ رَبِّكَ ذُو الْجَلالِ وَالْإِكْرامِ» ، وقوله تعالى: «لا إِلهَ إِلَّا هُوَ كُلُّ شَيْءٍ هالِكٌ إِلَّا وَجْهَهُ» فإن كان كل شيء هالك غير وجهه- كما قال جل وعز- وكان الليل والنهار ظلمة أو نورا خلقهما لمصالح خلقه، فلا شك انهما فانيان هالكان، كما اخبر، وكما قال: «إِذَا الشَّمْسُ كُوِّرَتْ» يعني بذلك أنها عميت فذهب ضوءها، وذلك عند قيام الساعة، وهذا ما لا يحتاج إلى الإكثار فيه، إذ كان مما يدين بالإقرار به جميع أهل التوحيد من أهل الإسلام وأهل التوراة والإنجيل والمجوس، وإنما ينكره قوم من غير أهل التوحيد، لم نقصد بهذا الكتاب قصد الإبانة عن خطإ قولهم فكل الذين ذكرنا عنهم أنهم مقرون بفناء جميع العالم حتى لا يبقى غير القديم الواحد، مقرون بأن الله عز وجل محييهم بعد فنائهم، وباعثهم بعد هلاكهم، خلا قوم من عبدة الأوثان، فإنهم يقرون بالفناء، وينكرون البعث","bs":"\u003cp data-paragraph=\"27.1\">Rasprava kojom se objašnjava nestanak vremena, noći i dana i da ne ostaje ništa osim Allaha, uzvišen je Njegov spomen\u003c/p>\u003cp data-paragraph=\"27.2\">Dokaz ispravnosti toga jesu riječi Allaha, uzvišen je Njegov spomen: ⟦Kur’anski navod, prijevod, 55:26–27⟧ „Svako ko je na njoj prolazan je, a ostaje lice tvoga Gospodara, Posjednika veličanstvenosti i plemenitosti.“ I Njegove riječi, Uzvišen je: ⟦Kur’anski navod, prijevod, 28:88, dio⟧ „Nema boga osim Njega. Sve propada osim Njegova lica.“ Ako sve propada osim Njegova lica — kao što je rekao, Veličanstveni i Silni — i ako su noć i dan tama ili svjetlost koje je stvorio radi koristi Svojih stvorenja, nema sumnje da su oboje prolazni i da će nestati, kako je obavijestio i kako je rekao: ⟦Kur’anski navod, prijevod, 81:1⟧ „Kada Sunce bude smotano“ — time misli da će biti zaslijepljeno i da će njegovo svjetlo nestati, a to je pri nastupanju Časa. O tome ne treba mnogo govoriti jer je to ono čije priznavanje ispovijedaju svi koji priznaju Božiju jednoću među sljedbenicima islama, Tevrata i Indžila i među medžusijama. To poriču samo neki koji ne priznaju Božiju jednoću, a ovom knjigom nismo namjeravali objašnjavati pogrešnost njihova stava. Svi za koje smo naveli da priznaju nestanak cijeloga svijeta, sve dok ne ostane samo Jedini Bespočetni, priznaju i da će ih Allah, Silan je i Uzvišen, oživiti nakon njihova nestanka i podići nakon njihove propasti, osim nekih obožavalaca kipova: oni priznaju nestanak, ali poriču proživljenje.\u003c/p>","paragraphs":[{"id":"27.1","ar":"القول في الإبانة عن فناء الزمان والليل والنهار وأن لا شيء يبقى غير الله تعالى ذكره","bs":"Rasprava kojom se objašnjava nestanak vremena, noći i dana i da ne ostaje ništa osim Allaha, uzvišen je Njegov spomen","ar_ranges":[],"ar_html":"القول في الإبانة عن فناء الزمان والليل والنهار وأن لا شيء يبقى غير الله تعالى ذكره","bs_ranges":[],"bs_html":"Rasprava kojom se objašnjava nestanak vremena, noći i dana i da ne ostaje ništa osim Allaha, uzvišen je Njegov spomen"},{"id":"27.2","ar":"والدلالة على صحة ذلك قول الله تعالى ذكره: «كُلُّ مَنْ عَلَيْها فانٍ وَيَبْقى وَجْهُ رَبِّكَ ذُو الْجَلالِ وَالْإِكْرامِ» ، وقوله تعالى: «لا إِلهَ إِلَّا هُوَ كُلُّ شَيْءٍ هالِكٌ إِلَّا وَجْهَهُ» فإن كان كل شيء هالك غير وجهه- كما قال جل وعز- وكان الليل والنهار ظلمة أو نورا خلقهما لمصالح خلقه، فلا شك انهما فانيان هالكان، كما اخبر، وكما قال: «إِذَا الشَّمْسُ كُوِّرَتْ» يعني بذلك أنها عميت فذهب ضوءها، وذلك عند قيام الساعة، وهذا ما لا يحتاج إلى الإكثار فيه، إذ كان مما يدين بالإقرار به جميع أهل التوحيد من أهل الإسلام وأهل التوراة والإنجيل والمجوس، وإنما ينكره قوم من غير أهل التوحيد، لم نقصد بهذا الكتاب قصد الإبانة عن خطإ قولهم فكل الذين ذكرنا عنهم أنهم مقرون بفناء جميع العالم حتى لا يبقى غير القديم الواحد، مقرون بأن الله عز وجل محييهم بعد فنائهم، وباعثهم بعد هلاكهم، خلا قوم من عبدة الأوثان، فإنهم يقرون بالفناء، وينكرون البعث","bs":"Dokaz ispravnosti toga jesu riječi Allaha, uzvišen je Njegov spomen: ⟦Kur’anski navod, prijevod, 55:26–27⟧ „Svako ko je na njoj prolazan je, a ostaje lice tvoga Gospodara, Posjednika veličanstvenosti i plemenitosti.“ I Njegove riječi, Uzvišen je: ⟦Kur’anski navod, prijevod, 28:88, dio⟧ „Nema boga osim Njega. Sve propada osim Njegova lica.“ Ako sve propada osim Njegova lica — kao što je rekao, Veličanstveni i Silni — i ako su noć i dan tama ili svjetlost koje je stvorio radi koristi Svojih stvorenja, nema sumnje da su oboje prolazni i da će nestati, kako je obavijestio i kako je rekao: ⟦Kur’anski navod, prijevod, 81:1⟧ „Kada Sunce bude smotano“ — time misli da će biti zaslijepljeno i da će njegovo svjetlo nestati, a to je pri nastupanju Časa. O tome ne treba mnogo govoriti jer je to ono čije priznavanje ispovijedaju svi koji priznaju Božiju jednoću među sljedbenicima islama, Tevrata i Indžila i među medžusijama. To poriču samo neki koji ne priznaju Božiju jednoću, a ovom knjigom nismo namjeravali objašnjavati pogrešnost njihova stava. Svi za koje smo naveli da priznaju nestanak cijeloga svijeta, sve dok ne ostane samo Jedini Bespočetni, priznaju i da će ih Allah, Silan je i Uzvišen, oživiti nakon njihova nestanka i podići nakon njihove propasti, osim nekih obožavalaca kipova: oni priznaju nestanak, ali poriču proživljenje.","ar_ranges":[],"ar_html":"والدلالة على صحة ذلك قول الله تعالى ذكره: «كُلُّ مَنْ عَلَيْها فانٍ وَيَبْقى وَجْهُ رَبِّكَ ذُو الْجَلالِ وَالْإِكْرامِ» ، وقوله تعالى: «لا إِلهَ إِلَّا هُوَ كُلُّ شَيْءٍ هالِكٌ إِلَّا وَجْهَهُ» فإن كان كل شيء هالك غير وجهه- كما قال جل وعز- وكان الليل والنهار ظلمة أو نورا خلقهما لمصالح خلقه، فلا شك انهما فانيان هالكان، كما اخبر، وكما قال: «إِذَا الشَّمْسُ كُوِّرَتْ» يعني بذلك أنها عميت فذهب ضوءها، وذلك عند قيام الساعة، وهذا ما لا يحتاج إلى الإكثار فيه، إذ كان مما يدين بالإقرار به جميع أهل التوحيد من أهل الإسلام وأهل التوراة والإنجيل والمجوس، وإنما ينكره قوم من غير أهل التوحيد، لم نقصد بهذا الكتاب قصد الإبانة عن خطإ قولهم فكل الذين ذكرنا عنهم أنهم مقرون بفناء جميع العالم حتى لا يبقى غير القديم الواحد، مقرون بأن الله عز وجل محييهم بعد فنائهم، وباعثهم بعد هلاكهم، خلا قوم من عبدة الأوثان، فإنهم يقرون بالفناء، وينكرون البعث","bs_ranges":[],"bs_html":"Dokaz ispravnosti toga jesu riječi Allaha, uzvišen je Njegov spomen: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 55:26–27⟧\u003c/span> „Svako ko je na njoj prolazan je, a ostaje lice tvoga Gospodara, Posjednika veličanstvenosti i plemenitosti.“ I Njegove riječi, Uzvišen je: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 28:88, dio⟧\u003c/span> „Nema boga osim Njega. Sve propada osim Njegova lica.“ Ako sve propada osim Njegova lica — kao što je rekao, Veličanstveni i Silni — i ako su noć i dan tama ili svjetlost koje je stvorio radi koristi Svojih stvorenja, nema sumnje da su oboje prolazni i da će nestati, kako je obavijestio i kako je rekao: \u003cspan class=\"translator-note\">⟦Kur’anski navod, prijevod, 81:1⟧\u003c/span> „Kada Sunce bude smotano“ — time misli da će biti zaslijepljeno i da će njegovo svjetlo nestati, a to je pri nastupanju Časa. O tome ne treba mnogo govoriti jer je to ono čije priznavanje ispovijedaju svi koji priznaju Božiju jednoću među sljedbenicima islama, Tevrata i Indžila i među medžusijama. To poriču samo neki koji ne priznaju Božiju jednoću, a ovom knjigom nismo namjeravali objašnjavati pogrešnost njihova stava. Svi za koje smo naveli da priznaju nestanak cijeloga svijeta, sve dok ne ostane samo Jedini Bespočetni, priznaju i da će ih Allah, Silan je i Uzvišen, oživiti nakon njihova nestanka i podići nakon njihove propasti, osim nekih obožavalaca kipova: oni priznaju nestanak, ali poriču proživljenje."}],"notes":[]}]}</script><script id="databaseData" type="application/json">[{"stranica":3,"ar_tekst":"الجزء الأول","bs_tekst":"Prvi dio"},{"stranica":3,"ar_tekst":"بِسْمِ اللَّهِ الرَّحْمنِ الرَّحِيمِ","bs_tekst":"U ime Allaha, Milostivog, Samilosnog."},{"stranica":3,"ar_tekst":"الحمد لله الأول قبل كل أول، والآخر بعد كل آخر، والدائم بلا زوال، والقائم على كل شيء بغير انتقال، والخالق خلقه من غير اصل ولا مثال، فهو الفرد الواحد من غير عدد، وهو الباقي بعد كل أحد، إلى غير نهاية ولا أمد له الكبرياء والعظمه، والبهاء والعزه، والسلطان والقدرة، تعالى عن أن يكون له شريك في سلطانه او في وحدانيته نديد، أو في تدبيره معين أو ظهير، أو أن يكون له ولد، أو صاحبه او كفء أحد، لا تحيط به الأوهام، ولا تحويه الأقطار، ولا تُدْرِكُهُ الْأَبْصارُ، وهو يدرك الأبصار، وهو اللطيف الخبير.","bs_tekst":"Hvala Allahu, Prvom prije svakog prvog i Posljednjem poslije svakog posljednjeg, Trajnom bez prestanka, Onome koji nad svakom stvari stoji bez premještanja, Stvoritelju koji je Svoja stvorenja stvorio bez prethodne osnove i uzora. On je Jedini, Jedan bez broja, i On je Onaj koji ostaje poslije svakoga, bez kraja i roka. Njemu pripadaju veličanstvenost i veličina, sjaj i moć, vlast i sposobnost. Uzvišen je iznad toga da ima sudruga u Svojoj vlasti, takmaca u Svojoj jednosti, pomagača ili potporu u Svome upravljanju, ili da ima dijete, družicu ili ikoga Sebi ravnog. Predodžbe Ga ne obuhvataju, prostori Ga ne sadrže. ⟦Kur’anski izraz, prijevod, 6:103⟧ „Pogledi Ga ne dostižu, a On dostiže poglede, i On je Blagi, o svemu Obaviješteni.“"},{"stranica":3,"ar_tekst":"أحمده على آلائه، وأشكره على نعمائه، حمد من أفرده بالحمد، وشكر من رجا بالشكر منه المزيد، وأستهديه من القول والعمل لما يقربني منه ويرضيه، وأومن به إيمان مخلص له التوحيد، ومفرد له التمجيد.","bs_tekst":"Hvalim Ga za Njegove blagodati i zahvaljujem Mu na Njegovim darovima, hvalom onoga koji samo Njemu posvećuje hvalu i zahvalnošću onoga koji se zahvaljivanjem nada uvećanju od Njega. Od Njega tražim uputu u govoru i djelu ka onome što će me Njemu približiti i čime će On biti zadovoljan. Vjerujem u Njega vjerovanjem onoga koji Mu iskreno priznaje jedinstvo i samo Njemu posvećuje veličanje."},{"stranica":3,"ar_tekst":"وَأَشْهَدُ أَنْ لا إِلَهَ إِلا اللَّهُ وَحْدَهُ لا شريك له، وأشهد أن محمدا عبده النجيب، ورسوله الأمين، اصطفاه لرسالته، وابتعثه بوحيه، داعيا خلقه إلى عبادته، فصدع بأمره، وجاهد في سبيله، ونصح لأمته، وعبده حتى أتاه اليقين من عنده، غير مقصر في بلاغ، ولا وان في جهاد، صلى الله عليه أفضل صلاة وأزكاها، وسلم","bs_tekst":"Svjedočim da nema boga osim Allaha Jedinoga, koji nema sudruga, i svjedočim da je Muhammed Njegov odabrani rob i Njegov povjerljivi poslanik. Izabrao ga je za Svoje poslanstvo i poslao ga sa Svojom objavom, da Njegova stvorenja poziva na robovanje Njemu. On je otvoreno izvršio Njegovu naredbu, borio se na Njegovu putu, iskreno savjetovao svoj ummet i robovao Mu sve dok mu od Njega nije došla izvjesnost, ne podbacujući u dostavljanju i ne posustajući u borbi. Neka mu Allah podari najbolji i najčistiji blagoslov i neka mu podari mir."},{"stranica":4,"ar_tekst":"أما بعد، فإن الله جل جلاله، وتقدست أسماؤه، خلق خلقه من غير ضرورة كانت به إلى خلقهم، وأنشأهم من غير حاجة كانت به إلى إنشائهم، بل خلق من خصه منهم بامره ونهيه، وامتحنه بعبادته، ليعبدوه فيجود عليهم بنعمه، وليحمدوه على نعمه فيزيدهم من فضله ومننه، ويسبغ عليهم فضله وطوله، كما قال عز وجل: «وَما خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ مَا أُرِيدُ مِنْهُمْ مِنْ رِزْقٍ وَما أُرِيدُ أَنْ يُطْعِمُونِ إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ» .","bs_tekst":"A zatim: Allah, veličanstvena je Njegova uzvišenost i sveta su Njegova imena, stvorio je Svoja stvorenja bez ikakve nužde koja bi Ga na njihovo stvaranje navela i načinio ih bez ikakve potrebe za njihovim nastankom. Naprotiv, one među njima koje je izdvojio Svojom naredbom i zabranom i iskušao robovanjem Njemu stvorio je da Mu robuju, pa da ih On obdari Svojim blagodatima, i da Ga hvale za Njegove blagodati, pa da im poveća Svoju dobrotu i darove i obilno im podari Svoju milost i dobročinstvo, kao što je rekao Silni i Uzvišeni: ⟦Kur’anski navod, prijevod, 51:56–58⟧ „Džine i ljude stvorio sam samo da Mi robuju. Ne tražim od njih nikakvu opskrbu i ne tražim da Me hrane. Zaista je Allah Opskrbitelj, Posjednik snage, Čvrsti.“"},{"stranica":4,"ar_tekst":"فلم يزده خلقه إياهم- إذ خلقهم- في سلطانه على ما لم يزل قبل خلقه إياهم مثقال ذرة، ولا هو إن أفناهم واعدمهم ينقصه افناؤه إياهم ميزان شعره، لأنه لا تغيره الأحوال، ولا يدخله الملال، ولا ينقص سلطانه الأيام والليال، لأنه خالق الدهور والأزمان، فعم جميعهم في العاجل فضله وجوده، وشملهم كرمه وطوله، فجعل لهم أسماعا وأبصارا وأفئدة، وخصهم بعقول يصلون بها الى التمييز بين الحق والباطل، ويعرفون بها المنافع والمضار، وجعل لهم الأرض بساطا ليسلكوا منها سبلا فجاجا، والسماء سقفا محفوظا، وبناء مسموكا، وأنزل لهم منها الغيث بالإدرار، والأرزاق بالمقدار، واجرى لهم فيها قمر الليل وشمس النهار يتعاقبان بمصالحهم دائبين، فجعل لهم الليل لباسا، والنهار معاشا، وخالف- منًّا مِنْه عليهم وتطولا- بين قمر الليل وشمس النهار، فمحا آية الليل وجعل آية النهار مبصرة، كما قال جل جلاله وتقدست أسماؤه: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً لِتَبْتَغُوا فَضْلًا","bs_tekst":"Njegovo stvaranje njih — kada ih je stvorio — nije Njegovu vlast, u odnosu na ono kakva je oduvijek bila prije njihova stvaranja, povećalo ni za težinu trunke. Niti bi, kada bi ih uništio i doveo u nepostojanje, njihovo uništenje umanjilo Njegovu vlast za težinu dlake. Jer Njega stanja ne mijenjaju, zamor Mu ne dolazi i dani i noći ne umanjuju Njegovu vlast, jer je On Stvoritelj vjekova i vremena. Sve ih je u ovom životu obuhvatila Njegova dobrota i darežljivost, a Njegova plemenitost i dobročinstvo obuhvatili su ih sve. Dao im je sluh, vid i srca i izdvojio ih razumima kojima mogu razlikovati istinu od neistine i prepoznavati koristi i štete. Učinio im je Zemlju prostirkom da po njoj prolaze prostranim putevima, a nebo zaštićenim svodom i visoko uzdignutim zdanjem. S njega im je spuštao kišu u obilju i opskrbu u određenoj mjeri. Po njemu im je pokrenuo noćni Mjesec i dnevno Sunce da se, neprestano djelujući za njihovu korist, smjenjuju. Učinio im je noć pokrivalom, a dan vremenom za stjecanje sredstava za život. Kao dar i dobročinstvo prema njima, načinio je razliku između noćnog Mjeseca i dnevnog Sunca: izbrisao je znak noći, a znak dana učinio vidljivim, kao što je rekao, veličanstvena je Njegova uzvišenost i sveta su Njegova imena: ⟦Kur’anski navod, prijevod, 17:12, nastavlja se⟧ „Noć i dan učinili smo dvama znakovima, pa smo znak noći izbrisali, a znak dana učinili vidljivim, da biste tražili dobrotu"},{"stranica":5,"ar_tekst":"مِنْ رَبِّكُمْ وَلِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسابَ وَكُلَّ شَيْءٍ فَصَّلْناهُ تَفْصِيلًا» .","bs_tekst":"od svoga Gospodara i da biste znali broj godina i računanje. I svaku smo stvar podrobno razjasnili.“ ⟦Završetak prijevoda kur’anskog navoda, 17:12.⟧"},{"stranica":5,"ar_tekst":"وليصلوا بذلك إلى العلم بأوقات فروضهم التي فرضها عليهم في ساعات الليل والنهار والشهور والسنين، من الصلوات والزكوات والحج والصيام وغير ذلك من فروضهم، وحين حل ديونهم وحقوقهم، كما قال عز وجل: «يَسْئَلُونَكَ عَنِ الْأَهِلَّةِ قُلْ هِيَ مَواقِيتُ لِلنَّاسِ وَالْحَجِّ» ، وقال: «هُوَ الَّذِي جَعَلَ الشَّمْسَ ضِياءً وَالْقَمَرَ نُوراً وَقَدَّرَهُ مَنازِلَ لِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسابَ مَا خَلَقَ اللَّهُ ذلِكَ إِلَّا بِالْحَقِّ يُفَصِّلُ الْآياتِ لِقَوْمٍ يَعْلَمُونَ إِنَّ فِي اخْتِلافِ اللَّيْلِ وَالنَّهارِ وَما خَلَقَ اللَّهُ فِي السَّماواتِ وَالْأَرْضِ لَآياتٍ لِقَوْمٍ يَتَّقُونَ» .","bs_tekst":"I da bi time došli do spoznaje vremena svojih obaveza koje im je propisao u satima noći i dana, mjesecima i godinama: namaza, zekata, hadža, posta i drugih njihovih obaveza, te vremena dospijeća njihovih dugova i prava, kao što je rekao Silni i Uzvišeni: ⟦Kur’anski navod, prijevod, 2:189⟧ „Pitaju te o mlađacima. Reci: Oni su oznake vremena ljudima i za hadž.“ I rekao je: ⟦Kur’anski navod, prijevod, 10:5–6⟧ „On je Sunce učinio sjajem, a Mjesec svjetlom i odredio mu položaje da biste znali broj godina i računanje. Allah je to stvorio samo s istinom. On podrobno izlaže znakove ljudima koji znaju. Zaista u smjeni noći i dana i u onome što je Allah stvorio na nebesima i na Zemlji postoje znakovi za ljude koji se čuvaju.“"},{"stranica":5,"ar_tekst":"إنعاما منه بكل ذلك على خلقه، وتفضلا منه به عليهم وتطولا، فشَكَره على نعمه التي أنعمها عليهم من خلقه خَلْق عظيم، فزاد كثيرا منهم من آلائه وأياديه، على ما ابتدأهم به من فضله وطوله، كما وعدهم جل جلاله بقوله: «وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِنْ شَكَرْتُمْ لَأَزِيدَنَّكُمْ وَلَئِنْ كَفَرْتُمْ إِنَّ عَذابِي لَشَدِيدٌ» ، وجمع لهم الى الزيادة التي زادهم في عاجل دنياهم، الفوز بالنعيم المقيم، والخلود في جنات النعيم، في آجل آخرتهم وأخر لكثير منهم الزيادة التي وعدهم فمدهم الى حين مصيرهم اليه ووقت قدومهم عليه، توفيرا منه كرامته عليهم يوم تبلى السرائر وكفر نعمه خلق منهم عظيم، فجحدوا آلاءه وعبدوا سواه، فسلب كثيرا منهم ما ابتدأهم به من الفضل والإحسان، وأحل","bs_tekst":"Sve je to učinio kao blagodat Svojim stvorenjima, kao dobrotu i dobročinstvo prema njima. Veliko mnoštvo Njegovih stvorenja zahvaljivalo Mu je za blagodati kojima ih je obdario, pa je mnogima među njima povećao Svoje blagodati i darove povrh dobrote i dobročinstva kojima ih je na početku obasuo, kao što im je obećao, veličanstvena je Njegova uzvišenost, riječima: ⟦Kur’anski navod, prijevod, 14:7⟧ „I kada je vaš Gospodar obznanio: Ako budete zahvalni, sigurno ću vam povećati; a ako budete nezahvalni, Moja je kazna zaista žestoka.“ Povećanju koje im je podario u njihovom sadašnjem zemaljskom životu pridružio je uspjeh u trajnoj blagodati i vječni boravak u baščama uživanja u njihovom budućem životu na onom svijetu. Mnogima među njima odgodio je povećanje koje im je obećao i ostavio im rok do njihova povratka Njemu i vremena njihova dolaska pred Njega, da bi im Svoju počast u punini dao na Dan kada budu ispitivane tajne. A veliko mnoštvo njih pokazalo je nezahvalnost za Njegove blagodati: poricali su Njegove darove i robovali drugome mimo Njega. Mnogima među njima oduzeo je dobrotu i dobročinstvo kojima ih je na početku obdario i spustio je"},{"stranica":6,"ar_tekst":"بهم النقمة المهلكة في العاجل، وذخر لهم العقوبة المخزية في الآجل، ومتع كثيرا منهم بنعمه ايام حياتهم استدراجا منه لهم، وتوقيرا منه عليهم أوزارهم، ليستحقوا من عقوبته في الآجل ما قد أعد لهم.","bs_tekst":"na njih uništavajuću kaznu u ovom životu, a za budući im je sačuvao ponižavajuću kaznu. Mnogima među njima dopuštao je da uživaju u Njegovim blagodatima tokom dana svoga života, postepeno ih tako privodeći kazni i umnožavajući im terete grijeha, kako bi u budućem životu zaslužili kaznu koju im je pripremio."},{"stranica":6,"ar_tekst":"نعوذ بالله من عمل يقرب من سخطه، ونسأله التوفيق لما يدني من رضاه ومحبته.","bs_tekst":"Utječemo se Allahu od djela koje približava Njegovoj srdžbi i molimo Ga za uspjeh u onome što približava Njegovu zadovoljstvu i ljubavi."},{"stranica":6,"ar_tekst":"قال أبو جعفر: وأنا ذاكر في كتابي هذا من ملوك كل زمان، من لدن ابتدأ ربنا جل جلاله خلق خلقه إلى حال فنائهم، من انتهى إلينا خبره ممن ابتدأه الله تعالى بآلائه ونعمه فشكر نعمه، من رسول له مرسل، أو ملك مسلط، أو خليفة مستخلف، فزاده إلى ما ابتدأه به من نعمه في العاجل نعما، وإلى ما تفضل به عليه فضلا، ومن أخر ذلك له منهم، وجعله له عنده ذخرا ومن كفر منهم نعمه فسلبه ما ابتدأه به من نعمه، وعجل له نقمه ومن كفر منهم نعمه فمتعه بما أنعم به عليه إلى حين وفاته وهلاكه، مقرونا ذكر كل من أنا ذاكره منهم في كتابي هذا بذكر زمانه، وجمل ما كان من حوادث الأمور في عصره وأيامه، إذ كان الاستقصاء في ذلك يقصر عنه العمر، وتطول به الكتب، مع ذكري مع ذلك مبلغ مدة أكله، وحين أجله، بعد تقديمي أمام ذلك ما تقديمه بنا أولى، والابتداء به قبله أحجى، من البيان عن الزمان: ما هو؟ وكم قدر جميعه، وابتداء أوله، وانتهاء آخره؟ وهل كان قبل خلق الله تعالى إياه شيء غيره؟ وهل هو فان؟ وهل بعد فنائه شيء غير وجه المسبح الخلاق، تعالى ذكره؟","bs_tekst":"Ebu Džafer je rekao: U ovoj svojoj knjizi spomenut ću, među vladarima svakoga vremena, od kada je naš Gospodar, veličanstvena je Njegova uzvišenost, započeo stvaranje Svojih stvorenja pa do stanja njihova nestanka, one o kojima su do nas stigle vijesti: one koje je Allah Uzvišeni najprije obdario Svojim darovima i blagodatima, pa su zahvaljivali za Njegove blagodati, bilo da je riječ o Njegovu poslanom poslaniku, vladaru kojem je data vlast ili halifi postavljenom za nasljednika, pa im je On blagodatima kojima ih je na početku obdario u ovom životu dodao druge blagodati i dobroti koju im je ukazao dodao novu dobrotu; i one kojima je to odgodio i kod Sebe im to učinio zalihom; i one među njima koji su bili nezahvalni za Njegove blagodati, pa im je oduzeo blagodati kojima ih je na početku obdario i ubrzao im Svoju kaznu; i one među njima koji su bili nezahvalni za Njegove blagodati, pa im je ipak dopuštao da uživaju u onome čime ih je obdario do vremena njihove smrti i propasti. Spomen svakoga koga budem spominjao u ovoj svojoj knjizi povezat ću sa spomenom njegova vremena i općim prikazom događaja u njegovu dobu i njegovim danima, jer bi iscrpno istraživanje toga premašilo životni vijek i produžilo knjige. Uz to ću spominjati dužinu vremena njegova uživanja u opskrbi i čas njegova kraja, nakon što tome prethodno izložim ono što je prikladnije da izložimo prvo i razložnije da time započnemo prije toga: objašnjenje vremena — šta je ono; koliko je ukupno njegovo trajanje; početak njegova prvog dijela i završetak njegova posljednjeg; je li prije nego što ga je Allah Uzvišeni stvorio postojalo nešto drugo; hoće li ono nestati; i hoće li nakon njegova nestanka postojati išta osim lica Stvoritelja, kojem se slava iskazuje, uzvišen je Njegov spomen?"},{"stranica":6,"ar_tekst":"وما الذي كان قبل خلق الله إياه؟ وما هو كائن بعد فنائه وانقضائه؟ وكيف","bs_tekst":"Šta je postojalo prije nego što ga je Allah stvorio? Šta će postojati nakon njegova nestanka i završetka? Kako"},{"stranica":7,"ar_tekst":"كان ابتداء خلق الله تعالى إياه؟ وكيف يكون فناؤه؟ والدلالة على أن لا قديم إلا الله الواحد القهار، الذي له ملك السموات والأرض وما بينهما وما تحت الثرى بوجيز من الدلالة غير طويل، إذ لم نقصد بكتابنا هذا قصد الاحتجاج لذلك، بل لما ذكرنا من تاريخ الملوك الماضين وجمل من أخبارهم، وأزمان الرسل والأنبياء ومقادير أعمارهم، وأيام الخلفاء السالفين وبعض سيرهم، ومبالغ ولاياتهم، والكائن الذي كان من الأحداث في أعصارهم ثم أنا متبع آخر ذلك كله- إن شاء الله وأيد منه بعون وقوة- ذكر صحابه نبينا محمد ص وأسمائهم وكناهم ومبالغ أنسابهم ومبالغ أعمارهم، ووقت وفاة كل إنسان منهم، والموضع الذي كانت به وفاته ثم متبعهم ذكر من كان بعدهم من التابعين لهم بإحسان، على نحو ما شرطنا من ذكرهم ثم ملحق بهم ذكر من كان بعدهم من الخلف لهم كذلك، وزائد في أمورهم للإبانة عمن حمدت منهم روايته، وتقبلت أخباره، ومن رفضت منهم روايته ونبذت أخباره، ومن وهن منهم نقله، وضعف خبره وما السبب الذي من أجله نبذ من نبذ منهم خبره، والعلة التي من أجلها وهن من وهن منهم نقله.","bs_tekst":"je Allah Uzvišeni započeo njegovo stvaranje i kako će ono nestati? I dokazivanje da nema ničega bespočetnog osim Allaha, Jedinoga, Svepotčinitelja, kojem pripada vlast nebesa i Zemlje, onoga što je između njih i onoga što je ispod tla, sažetim, a ne dugim dokazom, jer ovom našom knjigom nismo namjeravali dokazivati to, nego ono što smo spomenuli: historiju prošlih vladara i opće prikaze njihovih vijesti, vremena poslanika i vjerovjesnika i dužine njihovih života, dane prethodnih halifa i nešto od njihovih životopisa, trajanje njihovih vlasti i događaje koji su se zbili u njihovim razdobljima. Zatim ću svemu tome na kraju — ako Allah htjedne i potpomogne me Svojom pomoći i snagom — pridružiti spomen ashaba našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir, njihova imena, njihove nadimke, dokle sežu njihova rodoslovlja, dužine njihovih života, vrijeme smrti svakoga pojedinca među njima i mjesto u kojem je umro. Zatim ću za njima navesti spomen onih koji su ih slijedili u dobročinstvu, na način koji smo postavili kao uslov za njihovo spominjanje. Zatim ću im pridružiti spomen onih koji su došli poslije njih, na isti način, i dodati pojedinosti o njima radi razjašnjenja čije je prenošenje među njima pohvaljeno i čije su vijesti prihvaćene, čije je prenošenje odbačeno i čije su vijesti odbačene, čije je prenošenje ocijenjeno slabim i čija je vijest slaba, te koji je razlog zbog kojeg je odbačena vijest onoga čija je vijest odbačena i koji je uzrok zbog kojeg je oslabljeno prenošenje onoga čije je prenošenje oslabljeno."},{"stranica":7,"ar_tekst":"وإلى الله عز وجل أنا راغب في العون على ما أقصده وأنويه، والتوفيق لما ألتمسه وأبغيه، فإنه ولي الحول والقوة، وصلى الله على محمد نبيه وآله وسلم تسليما.","bs_tekst":"Allahu, Silan je i Uzvišen, obraćam se želeći pomoć u onome čemu težim i što namjeravam i uspjeh u onome što tražim i želim, jer On je Posjednik moći i snage. Neka Allah blagoslovi Muhammeda, Svoga vjerovjesnika, i njegovu porodicu i neka im podari potpuni mir."},{"stranica":7,"ar_tekst":"وليعلم الناظر في كتابنا هذا أن اعتمادي في كل ما أحضرت ذكره فيه مما شرطت أني راسمه فيه، إنما هو على ما رويت من الأخبار التي أنا ذاكرها فيه، والآثار التي أنا مسندها إلى رواتها فيه، دون ما أدرك بحجج العقول، واستنبط","bs_tekst":"Neka onaj ko razmatra ovu našu knjigu zna da se moje oslanjanje, u svemu što sam u njoj spomenuo od onoga za šta sam postavio uslov da ću to u njoj zabilježiti, zasniva samo na vijestima koje su mi prenesene i koje u njoj navodim, i na predajama koje u njoj lancem prenosilaca pripisujem njihovim prenosiocima, a ne na onome što se spoznaje razumskim dokazima i izvodi"},{"stranica":8,"ar_tekst":"بفكر النفوس، إلا اليسير القليل منه، إذ كان العلم بما كان من أخبار الماضين، وما هو كائن من أنباء الحادثين، غير واصل إلى من لم يشاهدهم ولم يدرك زمانهم، إلا بأخبار المخبرين، ونقل الناقلين، دون الاستخراج بالعقول، والاستنباط بفكر النفوس فما يكن في كتابي هذا من خبر ذكرناه عن بعض الماضين مما يستنكره قارئه، أو يستشنعه سامعه، من أجل أنه لم يعرف له وجها في الصحة، ولا معنى في الحقيقة، فليعلم انه لم يؤت في ذلك من قبلنا، وإنما أتى من قبل بعض ناقليه إلينا، وإنا إنما أدينا ذلك على نحو ما أدي إلينا","bs_tekst":"promišljanjem duše, osim vrlo maloga dijela toga. Jer znanje o vijestima prošlih i o izvještajima o događajima koji se zbivaju ne dopire do onoga ko ih nije vidio i nije doživio njihovo vrijeme drugačije nego putem izvještaja onih koji izvještavaju i prenošenja onih koji prenose, a ne razumskim izvođenjem i zaključivanjem promišljanjem duše. Stoga, ako u ovoj mojoj knjizi bude neka vijest koju smo prenijeli o nekima od prošlih, koju njen čitalac bude smatrao neprihvatljivom ili njen slušalac odbojnom zato što za nju ne nalazi osnovu ispravnosti niti smisao u stvarnosti, neka zna da to nije došlo od nas, nego od nekoga od onih koji su nam je prenijeli, a mi smo to samo prenijeli onako kako je preneseno nama."},{"stranica":9,"ar_tekst":"[القول في الزمان ما هو]","bs_tekst":"Rasprava o vremenu: šta je ono"},{"stranica":9,"ar_tekst":"قال ابو جعفر: فالزمان هو ساعات الليل والنهار، وقد يقال ذلك للطويل من المدة والقصير منها، والعرب تقول: أتيتك زمان الحجاج أمير، وزمن الحجاج أمير- تعني به: إذ الحجاج أمير وتقول: اتيتك زمان الصرام وزمن الصرام- تعني به وقت الصرام ويقولون أيضا: أتيتك أزمان الحجاج أمير، فيجمعون الزمان، يريدون بذلك أن يجعلوا كل وقت من أوقات إمارته زمانا من الأزمنة، كما قال الراجز:","bs_tekst":"Ebu Džafer je rekao: Vrijeme su sati noći i dana. Taj se izraz može upotrijebiti za dugo i kratko razdoblje. Arapi kažu: „Došao sam ti u vrijeme kada je El-Hadždžadž bio zapovjednik“, upotrebljavajući i izraz „zeman“ i izraz „zemen“, a time misle: „Dok je El-Hadždžadž bio zapovjednik.“ I kažu: „Došao sam ti u vrijeme berbe“, upotrebljavajući „zeman es-siram“ i „zemen es-siram“, a time misle na vrijeme berbe. Također kažu: „Došao sam ti u vremenima kada je El-Hadždžadž bio zapovjednik“, stavljajući riječ „vrijeme“ u množinu. Time žele svaki trenutak njegova zapovjedništva učiniti jednim vremenom među vremenima, kao što je rekao pjesnik redžeza:"},{"stranica":9,"ar_tekst":"جاء الشتاء وقميصي أخلاق ... شراذم يضحك منه التواق","bs_tekst":"„Došla je zima, a moja košulja sva pohabana —\nu dronjcima kojima se Et-Tevvak smije.“"},{"stranica":9,"ar_tekst":"فجعل القميص أخلاقا، يريد بذلك وصف كل قطعة منه بالإخلاق، كما يقولون: أرض سباسب، ونحو ذلك.","bs_tekst":"Košulju je označio množinskim izrazom „ahlak“, želeći svaki njen komad opisati pohabanošću, kao što kažu „zemlja — puste ravnice“ i tome slično."},{"stranica":9,"ar_tekst":"ومن قولهم للزمان: زمن قول أعشى بني قيس بن ثعلبة:","bs_tekst":"Među primjerima njihove upotrebe riječi „zemen“ za „zeman“ jesu riječi El-A‘šaa iz plemena Benu Kajs ibn Sa‘lebe:"},{"stranica":9,"ar_tekst":"وكنت امرا زمنا بالعراق ... عفيف المناخ طويل التغن","bs_tekst":"„Bio sam čovjek, neko vrijeme u Iraku,\nčestita boravišta, dugotrajnog pjevanja.“ ⟦Napomena prevodioca: završni izraz stiha „طويل التغن“ zahtijeva provjeru prema štampanom tekstu; ovdje je prenesen prema dostupnom prijepisu.⟧"},{"stranica":9,"ar_tekst":"يريد بقوله: زمنا زمانا، فالزمان اسم لما ذكرت من ساعات الليل والنهار على ما قد بينت ووصفت","bs_tekst":"Riječju „zemen“ misli na „zeman“. Vrijeme je, dakle, naziv za ono što sam spomenuo od sati noći i dana, kako sam već objasnio i opisao."},{"stranica":10,"ar_tekst":"القول في كم قدر جميع الزمان من ابتدائه إلى انتهائه وأوله إلى آخره","bs_tekst":"Rasprava o tome koliko ukupno traje vrijeme od njegova početka do njegova završetka, od njegova prvog do njegova posljednjeg dijela"},{"stranica":10,"ar_tekst":"اختلف السلف قبلنا من أهل العلم في ذلك، فقال بعضهم: قدر جميع ذلك سبعة آلاف سنة.","bs_tekst":"Prethodnici među učenim ljudima prije nas razišli su se o tome. Neki su rekli: Ukupno trajanje svega toga iznosi sedam hiljada godina."},{"stranica":10,"ar_tekst":"ذكر من قَالَ ذَلِكَ:","bs_tekst":"Spomen onoga ko je to rekao:"},{"stranica":10,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ يَعْقُوبَ، عَنْ حَمَّادٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: الدنيا جمعة من جمع الآخرة، سبعة آلاف سنه، فقد مضى سته آلاف سنه ومائتا سَنَةٍ، وَلَيَأْتِيَنَّ عَلَيْهَا مِئُونَ مِنْ سِنِينَ، لَيْسَ عَلَيْهَا مُوَحِّدٌ.","bs_tekst":"Pričao nam je Ibn Humejd, rekao je: Pričao nam je Jahja ibn Vadih, rekao je: Pričao nam je Jahja ibn Jakub, od Hammada, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: Ovaj svijet je jedna sedmica među sedmicama onoga svijeta, sedam hiljada godina. Već je prošlo šest hiljada i dvjesto godina, a doći će mu stotine godina tokom kojih na njemu neće biti nikoga ko priznaje Božiju jednoću."},{"stranica":10,"ar_tekst":"وَقَالَ آخَرُونَ: قَدْرُ جَمِيعِ ذَلِكَ سِتَّةُ آلافِ سَنَةٍ.","bs_tekst":"Drugi su rekli: Ukupno trajanje svega toga iznosi šest hiljada godina."},{"stranica":10,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onoga ko je to rekao:"},{"stranica":10,"ar_tekst":"حَدَّثَنَا أَبُو هِشَامٍ، قَالَ: حَدَّثَنَا مُعَاوِيَةُ بْنُ هِشَامٍ، عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ أَبِي صَالِحٍ، قَالَ: قَالَ كَعْبٌ: الدُّنْيَا سِتَّةُ آلافِ سَنَةٍ.","bs_tekst":"Pričao nam je Ebu Hišam, rekao je: Pričao nam je Muavija ibn Hišam, od Sufjana, od El-A‘meša, od Ebu Saliha, koji je rekao: Ka‘b je rekao: Ovaj svijet traje šest hiljada godina."},{"stranica":10,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ سَهْلِ بْنِ عَسْكَرٍ، قال: حدثنا اسمعيل بن عبد الكريم، قال: حدثني عبد الصمد بن معقل، أنه سمع وهبا يقول: قد خلا من الدنيا خمسه آلاف سنه وستمائه سنه، وانى لأَعْرِفُ كُلَّ زَمَانٍ مِنْهَا، مَا كَانَ فِيهِ من الملوك والأنبياء قلت لِوَهْبِ بْنِ مُنَبِّهٍ: كَمِ الدُّنْيَا؟ قَالَ: سِتَّةُ آلاف سنه","bs_tekst":"Pričao nam je Muhammed ibn Sehl ibn Asker, rekao je: Pričao nam je Ismail ibn Abdulkerim, rekao je: Pričao mi je Abdussamed ibn Ma‘kil da je čuo Vehba kako govori: Od ovoga svijeta već je prošlo pet hiljada i šest stotina godina. Ja zaista znam svako njegovo razdoblje, koji su u njemu bili vladari i vjerovjesnici. Rekao sam Vehbu ibn Munebbihu: Koliko traje ovaj svijet? Rekao je: Šest hiljada godina."},{"stranica":11,"ar_tekst":"قال أبو جعفر: والصواب من القول في ذَلِكَ مَا دَلَّ عَلَى صِحَّتِهِ الْخَبَرُ الْوَارِدُ عن رسول الله ص، وَذَلِكَ مَا حَدَّثَنَا بِهِ مُحَمَّدُ بْنُ بَشَّارٍ وَعَلِيُّ بْنُ سَهْلٍ، قَالا: حَدَّثَنَا مُؤَمَّلٌ، قَالَ: حَدَّثَنَا سُفْيَانُ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنِ ابْنِ عُمَرَ، قَالَ: [سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ: أَجَلُكُمْ فِي أَجَلِ مَنْ كَانَ قَبْلَكُمْ، مِنْ صَلاةِ الْعَصْرِ إِلَى مَغْرِبِ الشَّمْسِ] .","bs_tekst":"Ebu Džafer je rekao: Ispravan stav o tome jeste onaj na čiju ispravnost ukazuje vijest prenesena od Allahova Poslanika, neka mu Allah podari blagoslov i mir. To je ono što su nam pričali Muhammed ibn Beššar i Ali ibn Sehl; rekli su: Pričao nam je Muemmel, rekao je: Pričao nam je Sufjan, od Abdullaha ibn Dinara, od Ibn Omera, koji je rekao: [Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Vaš rok u odnosu na rok onih koji su bili prije vas jeste od ikindijskog namaza do zalaska Sunca.]"},{"stranica":11,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ نَافِعٍ، عَنِ ابْنِ عمر، قال: [سمعت النبي ص يَقُولُ: أَلا إِنَّمَا أَجَلُكُمْ فِي أَجَلِ مَنْ خَلا مِنَ الأُمَمِ، كَمَا بَيْنَ صَلاةِ الْعَصْرِ إِلَى مَغْرِبِ الشَّمْسِ] .","bs_tekst":"Pričao nam je Ibn Humejd, rekao je: Pričao nam je Selema, rekao je: Pričao mi je Muhammed ibn Ishak, od Nafi‘a, od Ibn Omera, koji je rekao: [Čuo sam Vjerovjesnika, neka mu Allah podari blagoslov i mir, kako govori: Znajte da je vaš rok u odnosu na rok prošlih naroda poput vremena između ikindijskog namaza i zalaska Sunca.]"},{"stranica":11,"ar_tekst":"حَدَّثَنَا الْحَسَنُ بْنُ عَرَفَةَ، قَالَ: حَدَّثَنِي عَمَّارُ بْنُ مُحَمَّدٍ، ابْنُ أُخْتِ سُفْيَانَ الثَّوْرِيِّ، أَبُو الْيَقْظَانِ، عَنْ لَيْثِ بْنِ أَبِي سُلَيْمٍ، عَنْ مُغِيرَةَ بْنِ حَكِيمٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ: [قَالَ رَسُولُ الله ص: مَا بَقِيَ لأُمَّتِي مِنَ الدُّنْيَا إِلا كَمِقْدَارِ الشَّمْسِ إِذَا صُلِّيَتِ الْعَصْرُ] .","bs_tekst":"Pričao nam je El-Hasan ibn Arefa, rekao je: Pričao mi je Ammar ibn Muhammed, sin sestre Sufjana es-Sevrija, Ebu el-Jekzan, od Lejsa ibn Ebi Sulejma, od Mugire ibn Hakima, od Abdullaha ibn Omera, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Mome ummetu od ovoga svijeta ostalo je samo onoliko koliko iznosi Sunce kada se klanja ikindija.]"},{"stranica":11,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ عَوْفٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، قَالَ: حَدَّثَنَا شَرِيكٌ، قَالَ: سَمِعْتُ سَلَمَةَ بْنَ كُهَيْلٍ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عُمَرَ، قَالَ: [كُنَّا جُلُوسًا عند النبي ص وَالشَّمْسُ مُرْتَفِعَةٌ عَلَى قُعَيْقِعَانَ بَعْدَ الْعَصْرِ، فَقَالَ:","bs_tekst":"Pričao mi je Muhammed ibn Avf, rekao je: Pričao nam je Ebu Nuajm, rekao je: Pričao nam je Šerik, rekao je: Čuo sam Selemu ibn Kuhejla, od Mudžahida, od Ibn Omera, koji je rekao: [Sjedili smo kod Vjerovjesnika, neka mu Allah podari blagoslov i mir, poslije ikindije, dok je Sunce bilo visoko iznad Kuajki‘ana, pa je rekao:"},{"stranica":11,"ar_tekst":"مَا أَعْمَارُكُمْ فِي أَعْمَارِ مَنْ مَضَى إِلا كَمَا بَقِيَ مِنْ هَذَا النَّهَارِ فِيمَا مَضَى مِنْهُ] .","bs_tekst":"Vaši životni vijekovi u odnosu na životne vijekove onih koji su prošli jesu samo poput onoga što je ostalo od ovoga dana u odnosu na ono što je od njega prošlo.]"},{"stranica":11,"ar_tekst":"حَدَّثَنَا ابْنُ بَشَّارٍ وَمُحَمَّدُ بْنُ الْمُثَنَّى- قال ابن بشار: حدثنى خلف ابن مُوسَى، وَقَالَ ابْنُ الْمُثَنَّى: حَدَّثَنَا خَلَفُ بْنُ مُوسَى- قَالَ: حَدَّثَنِي أَبِي، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ أَنَّ رَسُولَ اللَّهِ ص خَطَبَ أَصْحَابَهُ يَوْمًا- وَقَدْ كَادَتِ الشَّمْسُ أَنْ تَغِيبَ، وَلَمْ يَبْقَ مِنْهَا إِلا شِقٌّ يَسِيرٌ-[فقال: والذى","bs_tekst":"Pričali su nam Ibn Beššar i Muhammed ibn el-Musenna — Ibn Beššar je rekao: Pričao mi je Halef ibn Musa, a Ibn el-Musenna je rekao: Pričao nam je Halef ibn Musa — rekao je: Pričao mi je moj otac, od Katade, od Enesa ibn Malika, da je Allahov Poslanik, neka mu Allah podari blagoslov i mir, jednoga dana održao govor svojim ashabima — a Sunce je gotovo bilo zašlo i ostao je samo njegov mali dio — [pa je rekao: Tako mi Onoga u čijoj je"},{"stranica":12,"ar_tekst":"نَفْسُ مُحَمَّدٍ بِيَدِهِ مَا بَقِيَ مِنْ دُنْيَاكُمْ فِيمَا مَضَى مِنْهَا إِلا كَمَا بَقِيَ مِنْ يَوْمِكُمْ هَذَا فِيمَا مَضَى مِنْهُ، وَمَا تَرَوْنَ مِنَ الشَّمْسِ إِلا الْيَسِيرَ] .","bs_tekst":"ruci Muhammedova duša, od vašega svijeta u odnosu na ono što je od njega prošlo ostalo je samo kao ono što je ostalo od ovoga vašeg dana u odnosu na ono što je od njega prošlo, a od Sunca vidite samo malo.]"},{"stranica":12,"ar_tekst":"حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا ابْنُ عُيَيْنَةَ، عَنْ عَلِيِّ بْنِ زَيْدٍ، عَنْ أَبِي نَضْرَةَ، عَنْ أَبِي سَعِيدٍ، قال: [قال النبي ص عِنْدَ غُرُوبِ الشَّمْسِ: إِنَّمَا مَثَلُ مَا بَقِيَ مِنَ الدُّنْيَا فِيمَا مَضَى مِنْهَا كَبَقِيَّةِ يَوْمِكُمْ هَذَا فِيمَا مَضَى مِنْهُ] .","bs_tekst":"Pričao nam je Ibn Veki‘, rekao je: Pričao nam je Ibn Ujejna, od Alija ibn Zejda, od Ebu Nadre, od Ebu Seida, koji je rekao: [Vjerovjesnik, neka mu Allah podari blagoslov i mir, pri zalasku Sunca rekao je: Primjer onoga što je ostalo od ovoga svijeta u odnosu na ono što je od njega prošlo jeste samo poput ostatka ovoga vašeg dana u odnosu na ono što je od njega prošlo.]"},{"stranica":12,"ar_tekst":"حَدَّثَنَا هَنَّادُ بْنُ السَّرِيِّ وَأَبُو هِشَامٍ الرِّفَاعِيُّ، قَالا: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ أَبِي حُصَيْنٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رسول الله ص: بعثت انا وَالسَّاعَةَ كَهَاتَيْنِ- وَأَشَارَ بِالسَّبَّابَةِ وَالْوُسْطَى] .","bs_tekst":"Pričali su nam Hennad ibn es-Serijj i Ebu Hišam er-Rifa‘i; rekli su: Pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Husajna, od Ebu Saliha, od Ebu Hurejre, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva — i pokazao je kažiprstom i srednjim prstom.]"},{"stranica":12,"ar_tekst":"حَدَّثَنَا أَبُو كريب، حَدَّثَنَا يَحْيَى بْنُ آدَمَ، عَنْ أَبِي بَكْرٍ، عَنْ أَبِي حُصَيْنٍ، عَنْ أَبِي صَالِحٍ، عَنْ ابى هريرة، عن النبي بِنَحْوِهِ.","bs_tekst":"Pričao nam je Ebu Kurejb; pričao nam je Jahja ibn Adem, od Ebu Bekra, od Ebu Husajna, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, nešto slično tome."},{"stranica":12,"ar_tekst":"حَدَّثَنَا هَنَّادٌ، قَالَ: حَدَّثَنَا أَبُو الأَحْوَصِ وَأَبُو مُعَاوِيَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سَمُرَةَ، قَالَ: [قَالَ رسول الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .","bs_tekst":"Pričao nam je Hennad, rekao je: Pričali su nam Ebu el-Ahves i Ebu Muavija, od El-A‘meša, od Ebu Halida el-Valibija, od Džabira ibn Semure, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.]"},{"stranica":12,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عَثَّامُ بْنُ عَلِيٍّ، عَنِ الأَعْمَشِ، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سَمُرَةَ، [قَالَ: كَأَنِّي أَنْظُرُ إِلَى إِصْبَعَيْ رَسُولِ الله ص- وَأَشَارَ بِالْمُسَبِّحَةِ وَالَّتِي تَلِيهَا- وَهُوَ يَقُولُ:","bs_tekst":"Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Assam ibn Ali, od El-A‘meša, od Ebu Halida el-Valibija, od Džabira ibn Semure, [koji je rekao: Kao da gledam dva prsta Allahova Poslanika, neka mu Allah podari blagoslov i mir — pokazao je kažiprstom i onim do njega — dok govori:"},{"stranica":12,"ar_tekst":"بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَذِهِ مِنْ هَذِهِ] .","bs_tekst":"Poslan sam u odnosu na Čas kao ovaj u odnosu na ovaj.]"},{"stranica":12,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنِي يَحْيَى بْنُ وَاضِحٍ، قَالَ: حدثنا فطر، عَنْ أَبِي خَالِدٍ الْوَالِبِيِّ، عَنْ جَابِرِ بْنِ سمره، قال: [قال رسول الله ص: بُعِثْتُ مِنَ السَّاعَةِ كَهَاتَيْنِ]- وَجَمَعَ بَيْنَ إِصْبَعَيْهِ السبابة والوسطى","bs_tekst":"Pričao nam je Ibn Humejd, rekao je: Pričao mi je Jahja ibn Vadih, rekao je: Pričao nam je Fitr, od Ebu Halida el-Valibija, od Džabira ibn Semure, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Poslan sam u odnosu na Čas kao ova dva] — i sastavio je svoja dva prsta, kažiprst i srednji prst."},{"stranica":13,"ar_tekst":"حَدَّثَنَا ابْنُ الْمُثَنَّى، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ: حَدَّثَنَا شُعْبَةُ، قَالَ: سَمِعْتُ قَتَادَةَ يُحَدِّثُ، قَالَ: حَدَّثَنَا أَنَسُ بْنُ مَالِكٍ، قَالَ: [قال رسول الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] قَالَ شُعْبَةُ:","bs_tekst":"Pričao nam je Ibn el-Musenna, rekao je: Pričao nam je Muhammed ibn Džafer, rekao je: Pričao nam je Šu‘ba, rekao je: Čuo sam Katadu kako pripovijeda; rekao je: Pričao nam je Enes ibn Malik, rekao je: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.] Šu‘ba je rekao:"},{"stranica":13,"ar_tekst":"سَمِعْتُ قَتَادَةَ يَقُولُ فِي قَصَصِهِ: كَفَضْلِ إِحْدَاهُمَا عَلَى الأُخْرَى، قَالَ: لا أَدْرِي أَذَكَرَهُ عَنْ أَنَسٍ أَوْ قَالَهُ قَتَادَةُ.","bs_tekst":"Čuo sam Katadu kako u svojim kazivanjima govori: Poput razlike za koju je jedan od njih duži od drugoga. Rekao je: Ne znam je li to spomenuo prenoseći od Enesa ili je to rekao Katada."},{"stranica":13,"ar_tekst":"حَدَّثَنَا خَلادُ بْنُ أَسْلَمَ، قَالَ: حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ:","bs_tekst":"Pričao nam je Hallad ibn Eslem, rekao je: Pričao nam je En-Nadr ibn Šumejl, rekao je:"},{"stranica":13,"ar_tekst":"حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، قَالَ: حَدَّثَنَا أَنَسُ بْنُ مالك، قال: [قال رسول الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .","bs_tekst":"Pričao nam je Šu‘ba, od Katade, koji je rekao: Pričao nam je Enes ibn Malik, rekao je: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva.]"},{"stranica":13,"ar_tekst":"حَدَّثَنَا مُجَاهِدُ بْنُ مُوسَى، قَالَ: حَدَّثَنَا يَزِيدُ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، عَنِ النبي ص مِثْلَهُ، وَزَادَ فِي حَدِيثِهِ:","bs_tekst":"Pričao nam je Mudžahid ibn Musa, rekao je: Pričao nam je Jezid, rekao je: Pričao nam je Šu‘ba, od Katade, od Enesa ibn Malika, od Vjerovjesnika, neka mu Allah podari blagoslov i mir, isto to, a u svojoj je predaji dodao:"},{"stranica":13,"ar_tekst":"وَأَشَارَ بِالْوُسْطَى وَالسَّبَّابَةِ.","bs_tekst":"I pokazao je srednjim prstom i kažiprstom."},{"stranica":13,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا أَيُّوبُ بْنُ سُوَيْدٍ، عَنِ الأوزاعي، قال: حدثنا اسمعيل بْنُ عُبَيْدِ اللَّهِ، قَالَ: قَدِمَ أَنَسُ بْنُ مَالِكٍ عَلَى الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ، فَقَالَ له الوليد: ماذا سمعت رسول الله ص يَذْكُرُ بِهِ السَّاعَةَ؟ قَالَ: [سَمِعْتُ رَسُولَ اللَّهِ ص يَقُولُ:","bs_tekst":"Pričao nam je Muhammed ibn Abdullah ibn Abdulhakem, rekao je: Pričao nam je Ejjub ibn Suvejd, od El-Evza‘ija, koji je rekao: Pričao nam je Ismail ibn Ubejdullah, rekao je: Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa mu je El-Velid rekao: Šta si čuo od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da govori o Času? Rekao je: [Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori:"},{"stranica":13,"ar_tekst":"أَنْتُمْ وَالسَّاعَةَ كَهَاتَيْنِ،] وَأَشَارَ بِإِصْبَعَيْهِ.","bs_tekst":"Vi i Čas ste kao ova dva,] i pokazao je sa svoja dva prsta."},{"stranica":13,"ar_tekst":"حَدَّثَنِي الْعَبَّاسُ بْنُ الْوَلِيدِ، قَالَ: أَخْبَرَنِي أَبِي، قَالَ: حدثنا الأوزاعي، قال: حدثنى اسمعيل بْنُ عُبَيْدِ اللَّهِ، قَالَ: قَدِمَ أَنَسُ بْنُ مَالِكٍ عَلَى الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ، فَقَالَ لَهُ الْوَلِيدُ: مَاذَا سَمِعْتَ مِنْ رَسُولِ اللَّهِ ص يَذْكُرُ بِهِ السَّاعَةَ؟ [قَالَ: سَمِعْتُ رَسُولَ اللَّهِ ص يقول: أنتم والساعة كتين] .","bs_tekst":"Pričao mi je El-Abbas ibn el-Velid, rekao je: Obavijestio me je moj otac, rekao je: Pričao nam je El-Evza‘i, rekao je: Pričao mi je Ismail ibn Ubejdullah, rekao je: Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa mu je El-Velid rekao: Šta si čuo od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da govori o Času? [Rekao je: Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Vi i Čas ste „كتين“.] ⟦Napomena prevodioca: na ovom mjestu prijepis ima nejasan zapis „كتين“; nije prešutno zamijenjen riječju iz paralelne predaje.⟧"},{"stranica":13,"ar_tekst":"حَدَّثَنِي ابْنُ عَبْدِ الرَّحِيمِ الْبَرْقِيُّ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ أَبِي سَلَمَةَ،","bs_tekst":"Pričao mi je Ibn Abdurrahim el-Berki, rekao je: Pričao nam je Amr ibn Ebi Selema,"},{"stranica":14,"ar_tekst":"عن الأوزاعي، قال: حدثنى اسمعيل بْنُ عُبَيْدِ اللَّهِ، قَالَ: قَدِمَ أَنَسُ بْنُ مَالِكٍ عَلَى الْوَلِيدِ بْنِ عَبْدِ الْمَلِكِ، فَذَكَرَ مِثْلَهُ حَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ الأَعْلَى، قَالَ: حَدَّثَنَا الْمُعْتَمِرُ بْنُ سُلَيْمَانَ، عَنْ أَبِيهِ، قَالَ: حَدَّثَنِي مَعْبَدٌ، حَدَّثَ أَنَسٌ، [عَنْ رَسُولِ اللَّهِ ص أَنَّهُ قَالَ: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَقَالَ بِإِصْبَعَيْهِ: هَكَذَا.","bs_tekst":"od El-Evza‘ija, koji je rekao: Pričao mi je Ismail ibn Ubejdullah, rekao je: Enes ibn Malik došao je El-Velidu ibn Abdulmeliku, pa je spomenuo isto to. Pričao mi je Muhammed ibn Abdula‘la, rekao je: Pričao nam je El-Mu‘temir ibn Sulejman, od njegova oca, koji je rekao: Pričao mi je Ma‘bed; Enes je pripovijedao [od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je rekao: Ja i Čas poslani smo kao ova dva,] i sa svoja dva prsta pokazao je: Ovako."},{"stranica":14,"ar_tekst":"حَدَّثَنَا ابْنُ الْمُثَنَّى قَالَ: حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، قَالَ: حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي التَّيَّاحِ، عَنْ أَنَسٍ، قَالَ: [قَالَ رَسُولُ الله ص:","bs_tekst":"Pričao nam je Ibn el-Musenna, rekao je: Pričao nam je Vehb ibn Džerir, rekao je: Pričao nam je Šu‘ba, od Ebu et-Tejjaha, od Enesa, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je:"},{"stranica":14,"ar_tekst":"بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ:] السَّبَّابَةِ وَالْوُسْطَى قَالَ أَبُو مُوسَى: وَأَشَارَ وَهْبٌ بِالسَّبَّابَةِ وَالْوُسْطَى حَدَّثَنِي عَبْدُ اللَّهِ بْنُ أَبِي زِيَادٍ، قَالَ: حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، قَالَ:","bs_tekst":"Ja i Čas poslani smo kao ova dva:] kažiprst i srednji prst. Ebu Musa je rekao: Vehb je pokazao kažiprstom i srednjim prstom. Pričao mi je Abdullah ibn Ebi Zijad, rekao je: Pričao nam je Vehb ibn Džerir, rekao je:"},{"stranica":14,"ar_tekst":"حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي التَّيَّاحِ وَقَتَادَةَ، عَنْ أَنَسٍ، قَالَ: [قَالَ رسول الله ص: بعثت انا وَالسَّاعَةَ كَهَاتَيْنِ،] وَقَرَنَ بَيْنَ إِصْبَعَيْهِ.","bs_tekst":"Pričao nam je Šu‘ba, od Ebu et-Tejjaha i Katade, od Enesa, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva,] i primakao je svoja dva prsta jedan drugome."},{"stranica":14,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ بَزِيعٍ، قَالَ: حَدَّثَنَا الفضيل بن سليمان، حَدَّثَنَا أَبُو حَازِمٍ، قَالَ: حَدَّثَنَا سَهْلُ بْنُ سعد، قال: [رايت رسول الله ص قَالَ بِإِصْبَعَيْهِ هَكَذَا، الْوُسْطَى وَالَّتِي تَلِي الإِبْهَامَ: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ] .","bs_tekst":"Pričao mi je Muhammed ibn Abdullah ibn Bezi‘, rekao je: Pričao nam je El-Fudajl ibn Sulejman; pričao nam je Ebu Hazim, rekao je: Pričao nam je Sehl ibn Sa‘d, rekao je: [Vidio sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako sa svoja dva prsta, srednjim i onim do palca, pokazuje ovako: Ja i Čas poslani smo kao ova dva.]"},{"stranica":14,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ يَزِيدَ الأَدَمِيُّ، قَالَ: حَدَّثَنَا أَبُو ضَمْرَةَ، عَنْ أَبِي حَازِمٍ، عَنْ [سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ ان رسول الله ص قَالَ: بُعِثْتُ وَالسَّاعَةَ كَهَاتَيْنِ- وَضَمَّ بَيْنَ إِصْبَعَيْهِ الْوُسْطَى، وَالَّتِي تَلِي الإِبْهَامَ- وَقَالَ: مَا مَثَلِي وَمَثَلُ السَّاعَةِ إِلا كَفَرَسَيْ رِهَانٍ، ثُمَّ قَالَ: مَا مَثَلِي وَمَثَلُ السَّاعَةِ إِلا كَمَثَلِ رَجُلٍ بَعَثَهُ قَوْمٌ طَلِيعَةً، فَلَمَّا خَشِيَ أَنْ يُسْبَقُ أَلاحَ بِثَوْبِهِ: أُتِيتُمْ، أُتِيتُمْ، أَنَا ذَاكَ أَنَا ذَاكَ] .","bs_tekst":"Pričao nam je Muhammed ibn Jezid el-Ademi, rekao je: Pričao nam je Ebu Damra, od Ebu Hazima, od [Sehla ibn Sa‘da es-Sa‘idija, da je Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao: Poslan sam i Čas kao ova dva — i primakao je svoja dva prsta, srednji i onaj do palca — i rekao: Moj primjer i primjer Časa jesu samo poput dva trkaća konja. Zatim je rekao: Moj primjer i primjer Časa jesu samo kao primjer čovjeka kojeg je njegov narod poslao kao izvidnika, pa je, kada se pobojao da će biti preteknut, zamahao svojom odjećom: Napadnuti ste! Napadnuti ste! Ja sam taj! Ja sam taj!]"},{"stranica":14,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا خَالِدٌ، عَنْ مُحَمَّدِ بْنِ جَعْفَرٍ، عَنْ أَبِي حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رَسُولُ الله ص:","bs_tekst":"Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Halid, od Muhammeda ibn Džafera, od Ebu Hazima, od Sehla ibn Sa‘da, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je:"},{"stranica":14,"ar_tekst":"بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَجَمَعَ بَيْنَ إِصْبَعَيْهِ","bs_tekst":"Ja i Čas poslani smo kao ova dva,] i sastavio je svoja dva prsta."},{"stranica":15,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا خَالِدٌ، قَالَ: حَدَّثَنَا سُلَيْمَانُ بْنُ بِلالٍ، قَالَ: حَدَّثَنِي أَبُو حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رسول الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ هَكَذَا،] وَقَرَنَ بَيْنَ إِصْبَعَيْهِ: الْوُسْطَى وَالَّتِي تَلِي الإِبْهَامَ.","bs_tekst":"Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Halid, rekao je: Pričao nam je Sulejman ibn Bilal, rekao je: Pričao mi je Ebu Hazim, od Sehla ibn Sa‘da, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo ovako,] i primakao je svoja dva prsta: srednji i onaj do palca."},{"stranica":15,"ar_tekst":"حَدَّثَنِي ابْنُ عَبْدِ الرحيم البرقي، عن سهل بن سعد، قَالَ: حَدَّثَنَا ابْنُ أَبِي مَرْيَمَ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ: حَدَّثَنِي أَبُو حَازِمٍ، عَنْ سَهْلِ بْنِ سَعْدٍ، قَالَ: [قَالَ رَسُولُ الله ص: بُعِثْتُ أَنَا وَالسَّاعَةَ كَهَاتَيْنِ،] وَجَمَعَ بَيْنَ إِصْبَعَيْهِ.","bs_tekst":"Pričao mi je Ibn Abdurrahim el-Berki, od Sehla ibn Sa‘da, rekao je: Pričao nam je Ibn Ebi Merjem, rekao je: Pričao nam je Muhammed ibn Džafer, rekao je: Pričao mi je Ebu Hazim, od Sehla ibn Sa‘da, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Ja i Čas poslani smo kao ova dva,] i sastavio je svoja dva prsta. ⟦Napomena prevodioca: ponovljeno ime Sehla ibn Sa‘da u lancu zadržano je kako stoji u prijepisu.⟧"},{"stranica":15,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، عَنْ بَشِيرِ بْنِ الْمُهَاجِرِ، قَالَ: حَدَّثَنِي عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ: [سَمِعْتُ رسول الله ص يَقُولُ: بُعِثْتُ أَنَا وَالسَّاعَةَ جَمِيعًا، إِنْ كَادَتْ لِتَسْبِقَنِي] .","bs_tekst":"Pričao nam je Ebu Kurejb, rekao je: Pričao nam je Ebu Nuajm, od Bešira ibn el-Muhadžira, koji je rekao: Pričao mi je Abdullah ibn Burejda, od njegova oca, koji je rekao: [Čuo sam Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Ja i Čas poslani smo zajedno; gotovo da me je pretekao.]"},{"stranica":15,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ عُمَرَ بْنِ هَيَّاجٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ عَبْدِ الرَّحْمَنِ، قَالَ: حَدَّثَنِي عُبَيْدَةُ بْنُ الأَسْوَدِ، عَنْ مُجَالِدٍ، عَنْ قَيْسِ بْنِ أَبِي حَازِمٍ، عَنِ الْمُسْتَوْرِدِ بْنِ شداد الفهري، [عن النبي ص أَنَّهُ قَالَ: بُعِثْتُ فِي نَفْسِ السَّاعَةِ، سَبَقْتُهَا كَمَا سَبَقَتْ هَذِهِ هَذِهِ،] لإِصْبَعَيْهِ السَّبَّابَةِ وَالْوُسْطَى، وَوَصَفَ لَنَا أَبُو عَبْدِ اللَّهِ، وَجَمَعَهُمَا.","bs_tekst":"Pričao mi je Muhammed ibn Omer ibn Hejjadž, rekao je: Pričao nam je Jahja ibn Abdurrahman, rekao je: Pričao mi je Ubejda ibn el-Esved, od Mudžalida, od Kajsa ibn Ebi Hazima, od El-Mustevrida ibn Šeddada el-Fihrija, [od Vjerovjesnika, neka mu Allah podari blagoslov i mir, da je rekao: Poslan sam pri samom dahu Časa; pretekao sam ga kao što je ovaj pretekao ovaj,] misleći na svoja dva prsta, kažiprst i srednji prst. Ebu Abdullah nam je to pokazao i sastavio ih."},{"stranica":15,"ar_tekst":"حَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدِ بْنِ حَبِيبٍ، قَالَ: حَدَّثَنَا أَبُو نَصْرٍ، قَالَ:","bs_tekst":"Pričao mi je Ahmed ibn Muhammed ibn Habib, rekao je: Pričao nam je Ebu Nasr, rekao je:"},{"stranica":15,"ar_tekst":"حَدَّثَنَا الْمَسْعُودِيُّ، عَنْ إِسْمَاعِيلَ بْنِ أَبِي خَالِدٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي جبيرة، قال: [قال رسول الله ص: بُعِثْتُ مَعَ السَّاعَةِ كَهَاتَيْنِ، - وَأَشَارَ بِإِصْبَعَيْهِ الْوُسْطَى وَالسَّبَّابَةِ- كَفَضْلِ هَذِهِ عَلَى هَذِهِ] .","bs_tekst":"Pričao nam je El-Mes‘udi, od Ismaila ibn Ebi Halida, od Eš-Ša‘bija, od Ebu Džubejre, koji je rekao: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Poslan sam s Časom kao ova dva — i pokazao je sa svoja dva prsta, srednjim i kažiprstom — poput razlike za koju je ovaj duži od ovoga.]"},{"stranica":15,"ar_tekst":"حَدَّثَنَا تَمِيمُ بْنُ الْمُنْتَصِرِ، قَالَ: أَخْبَرَنَا يَزِيدُ، قَالَ: أَخْبَرَنَا إِسْمَاعِيلُ، عَنْ شُبَيْلِ بْنِ عَوْفٍ، عَنْ أَبِي جُبَيْرَةَ، عَنْ أَشْيَاخٍ مِنَ الأَنْصَارِ، قَالُوا:","bs_tekst":"Pričao nam je Temim ibn el-Muntasir, rekao je: Obavijestio nas je Jezid, rekao je: Obavijestio nas je Ismail, od Šubejla ibn Avfa, od Ebu Džubejre, od starješina među ensarijama, koji su rekli:"},{"stranica":16,"ar_tekst":"[سمعنا رسول الله ص يَقُولُ: جِئْتُ أَنَا وَالسَّاعَةَ هَكَذَا]- قَالَ الطَّبَرِيُّ: وَأَرَانَا تَمِيمٌ، وَضَمَّ السَّبَّابَةَ وَالْوُسْطَى وَقَالَ لَنَا: أَشَارَ يَزِيدُ بِإِصْبَعَيْهِ السَّبَّابَةِ وَالْوُسْطَى وَضَمَّهُمَا-[وَقَالَ: سَبَقْتُهَا كَمَا سَبَقَتْ هَذِهِ هَذِهِ فِي نَفْسِ من الساعة، او في نَفْسَ السَّاعَةِ] .","bs_tekst":"[Čuli smo Allahova Poslanika, neka mu Allah podari blagoslov i mir, kako govori: Došao sam ja i Čas ovako] — Et-Taberi je rekao: Temim nam je pokazao i primakao kažiprst i srednji prst, i rekao nam je: Jezid je pokazao svojim dvama prstima, kažiprstom i srednjim prstom, i primakao ih — [i rekao: Pretekao sam ga kao što je ovaj pretekao ovaj, pri jednom dahu Časa, ili pri samom dahu Časa.]"},{"stranica":16,"ar_tekst":"فمعلوم إذ كان اليوم أوله طلوع الفجر وآخره غروب الشمس، وكان صحيحا عن نبينا ص، ما رويناه عنه قبل، أنه قال بعد ما صلى العصر: ما بقي من الدنيا فِيمَا مَضَى مِنْهَا إِلا كَمَا بَقِيَ مِنْ يومكم هذا فيما مضى منه.","bs_tekst":"Poznato je, budući da dan počinje izlaskom zore, a završava zalaskom Sunca, i budući da je vjerodostojno preneseno od našega Vjerovjesnika, neka mu Allah podari blagoslov i mir, ono što smo ranije od njega prenijeli: da je, nakon što je klanjao ikindiju, rekao: Od ovoga svijeta u odnosu na ono što je od njega prošlo ostalo je samo kao ono što je ostalo od ovoga vašeg dana u odnosu na ono što je od njega prošlo."},{"stranica":16,"ar_tekst":"وأنه قال لأصحابه: بعثت أنا والساعة كهاتين- وجمع بين السبابة والوسطى- سبقتها بقدر هذه من هذه، يعني الوسطى من السبابة وكان قدر ما بين اوسط اوقات صلاه العصر- وذلك إذا صار ظل كل شيء مثليه- على التحري إنما يكون قدر نصف سبع اليوم، يزيد قليلا أو ينقص قليلا، وكذلك فضل ما بين الوسطى والسبابة، إنما يكون نحوا من ذلك وقريبا منه.","bs_tekst":"I da je svojim ashabima rekao: Ja i Čas poslani smo kao ova dva — i sastavio je kažiprst i srednji prst — pretekao sam ga za razliku ovoga u odnosu na ovaj, misleći na srednji prst u odnosu na kažiprst. A mjera vremena između sredine ikindijskog vremena — to je kada sjenka svake stvari postane dvostruka — ⟦Napomena prevodioca: završna tačka ovog vremenskog raspona nije izričito navedena u dostupnoj rečenici.⟧, prema približnoj procjeni, iznosi samo polovinu sedmine dana, malo više ili malo manje. Također, razlika između srednjeg prsta i kažiprsta iznosi otprilike toliko i blizu tome."},{"stranica":16,"ar_tekst":"وكان صحيحا مع ذلك عن رسول الله ص ما حَدَّثَنِي أَحْمَدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ وَهْبٍ، قَالَ: حَدَّثَنِي عَمِّي عَبْدُ اللَّهِ بْنُ وَهْبٍ، قَالَ:","bs_tekst":"A uz to je vjerodostojno preneseno od Allahova Poslanika, neka mu Allah podari blagoslov i mir, ono što mi je pričao Ahmed ibn Abdurrahman ibn Vehb, rekao je: Pričao mi je moj amidža Abdullah ibn Vehb, rekao je:"},{"stranica":16,"ar_tekst":"حَدَّثَنِي مُعَاوِيَةُ بْنُ صَالِحٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ جُبَيْرِ بْنِ نُفَيْرٍ، أَنَّهُ سَمِعَ أَبَا ثعلبه الخشني صاحب النبي ص يقول: [ان رسول الله ص قَالَ: لَنْ يُعْجِزَ اللَّهُ هَذِهِ الأُمَّةَ مِنْ نصف يوم،] وكان معنى قول النبي ذلك أن لن يعجز الله هذه الأمة من نصف يوم الذي مقداره ألف سنة- كان بينا أن أولى القولين- اللذين ذكرت في مبلغ قدر مدة جميع الزمان، اللذين أحدهما عن ابن عباس، والآخر منهما عن كعب- بالصواب، وأشبههما بما دلت عليه الأخبار الوارده عن رسول الله ص قول ابن عباس، الذي روينا عنه أنه قال: الدنيا جمعة من جمع الآخرة سبعة آلاف سنه","bs_tekst":"Pričao mi je Muavija ibn Salih, od Abdurrahmana ibn Džubejra ibn Nufejra, od njegova oca Džubejra ibn Nufejra, da je čuo Ebu Sa‘lebu el-Hušenija, ashaba Vjerovjesnika, neka mu Allah podari blagoslov i mir, kako govori: [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao je: Allah neće ovu zajednicu učiniti nemoćnom za polovinu dana.] A značenje tih Vjerovjesnikovih riječi bilo je da Allah ovu zajednicu neće učiniti nemoćnom za polovinu dana čije trajanje iznosi hiljadu godina. ⟦Napomena prevodioca: konstrukcija „لن يعجز الله هذه الأمة“ prenesena je doslovno; njeno značenje zahtijeva jezičku provjeru, bez prešutnog prepravljanja.⟧ Bilo je, dakle, jasno da je od dvaju stavova koje sam spomenuo o ukupnom trajanju svega vremena — jednoga prenesenog od Ibn Abbasa, a drugoga od Ka‘ba — ispravnosti bliži i vijestima prenesenim od Allahova Poslanika, neka mu Allah podari blagoslov i mir, sličniji stav Ibn Abbasa, od kojeg smo prenijeli da je rekao: Ovaj svijet je jedna sedmica među sedmicama onoga svijeta, sedam hiljada godina."},{"stranica":17,"ar_tekst":"وإذ كان ذلك كذلك، وكان الخبر عن رسول الله ص صحيحا أنه أخبر عن الباقي من ذلك في حياته انه نصف يوم، وذلك خمسمائة عام، إذ كان ذلك نصف يوم من الأيام التي قدر اليوم الواحد منها ألف عام- كان معلوما أن الماضي من الدنيا الى وقت قول النبي ص ما رويناه عن أبي ثعلبة الخشني عنه، كان قدر سته آلاف سنه وخمسمائة سنة، أو نحوا من ذلك وقريبا منه والله أعلم.","bs_tekst":"Budući da je tako i da je vjerodostojna vijest od Allahova Poslanika, neka mu Allah podari blagoslov i mir, da je za svoga života obavijestio kako od toga preostaje pola dana, a to je pet stotina godina, jer je to polovina jednoga od dana čije trajanje iznosi hiljadu godina, poznato je da je od ovoga svijeta do vremena kada je Vjerovjesnik, neka mu Allah podari blagoslov i mir, izgovorio ono što smo od njega prenijeli preko Ebu Sa‘lebe el-Hušenija prošlo šest hiljada i pet stotina godina ili približno tome i blizu toga. A Allah najbolje zna."},{"stranica":17,"ar_tekst":"فهذا الذي قلنا- في قدر مدة أزمان الدنيا، من مبدأ أولها إلى منتهى آخرها- من أثبت ما قيل في ذلك عندنا من القول، للشواهد الدالة التي بيناها على صحة ذلك.","bs_tekst":"Ovo što smo rekli o dužini trajanja vremena ovoga svijeta, od njegova prvog početka do njegova posljednjeg završetka, prema nama pripada najčvršćim stavovima izrečenim o tome, zbog dokaznih svjedočanstava kojima smo razjasnili njegovu ispravnost."},{"stranica":17,"ar_tekst":"وقد روي عن رسول الله ص خبر يدل على صحة قول من قال: إن الدنيا كلها ستة آلاف سنة، لو كان صحيحا سنده لم نعد القول به إلى غيره، وذلك ما حَدَّثَنِي بِهِ مُحَمَّدُ بْنُ سِنَانٍ الْقَزَّازُ، قَالَ: حَدَّثَنَا عَبْدُ الصَّمَدِ ابن عبد الوارث، حدثنا زبان، عَنْ عَاصِمٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هريرة، ان [رسول الله ص قَالَ: الْحُقْبُ ثَمَانُونَ عَامًا، الْيَوْمُ مِنْهَا سُدُسُ الدُّنْيَا] .","bs_tekst":"Od Allahova Poslanika, neka mu Allah podari blagoslov i mir, prenesena je vijest koja ukazuje na ispravnost stava onoga ko kaže da cijeli ovaj svijet traje šest hiljada godina. Kada bi njen lanac prenosilaca bio vjerodostojan, ne bismo od toga stava prešli na drugi. To je ono što mi je pričao Muhammed ibn Sinan el-Kazzaz, rekao je: Pričao nam je Abdussamed ibn Abdulvaris; pričao nam je Zebban, od Asima, od Ebu Saliha, od Ebu Hurejre, da je [Allahov Poslanik, neka mu Allah podari blagoslov i mir, rekao: Hukb je osamdeset godina; jedan njegov dan je šestina ovoga svijeta.]"},{"stranica":17,"ar_tekst":"فبين في هذا الخبر أن الدنيا كلها ستة آلاف سنة، وذلك أن اليوم الذي هو من أيام الآخرة إذا كان مقداره ألف سنة من سني الدنيا، وكان اليوم الواحد من ذلك سدس الدنيا، كان معلوما بذلك أن جميعها ستة أيام من أيام الآخرة، وذلك ستة آلاف سنة.","bs_tekst":"U ovoj je vijesti jasno da cijeli ovaj svijet traje šest hiljada godina, jer ako dan koji pripada danima onoga svijeta iznosi hiljadu godina od godina ovoga svijeta, a jedan takav dan predstavlja šestinu ovoga svijeta, time je poznato da on u cijelosti traje šest dana od dana onoga svijeta, a to je šest hiljada godina."},{"stranica":17,"ar_tekst":"وقد زعم اليهود أن جميع ما ثبت عندهم- على ما في التوراة مما هو فيها من لدن خلق الله آدم إلى وقت الهجرة، وذلك في التوراة التي هي في ايديهم اليوم- اربعه آلاف سنه وستمائه سنة واثنتان وأربعون سنة، وقد ذكروا تفصيل ذلك بولادة رجل رجل، ونبي نبي، وموته من عهد آدم إلى هجرة نبينا محمد ص","bs_tekst":"Jevreji tvrde da ukupno ono što je kod njih utvrđeno — prema onome što se nalazi u Tevratu, od kada je Allah stvorio Adema do vremena Hidžre, i to u Tevratu koji je danas u njihovim rukama — iznosi četiri hiljade šest stotina četrdeset i dvije godine. To su podrobno izložili navodeći rođenje čovjeka po čovjeka i vjerovjesnika po vjerovjesnika i njegovu smrt, od Ademova vremena do Hidžre našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir."},{"stranica":18,"ar_tekst":"وسأذكر تفصيلهم ذلك إن شاء الله، وتفصيل غيرهم ممن فصله من علماء أهل الكتب وغيرهم من أهل العلم بالسير وأخبار الناس إذا انتهيت إليه إن شاء الله.","bs_tekst":"Njihovo podrobno izlaganje spomenut ću, ako Allah htjedne, kao i podrobno izlaganje drugih koji su to izložili među učenjacima sljedbenika knjiga i drugim poznavaocima životopisa i ljudskih vijesti, kada do toga dođem, ako Allah htjedne."},{"stranica":18,"ar_tekst":"وأما اليونانية من النصارى فإنها تزعم أن الذي ادعته اليهود من ذلك باطل، وأن الصحيح من القول في قدر مدة أيام الدنيا- من لدن خلق الله آدم إلى وقت هجره نبينا محمد ص على سياق ما عندهم في التوراة التي هي في ايديهم- خمسه آلاف سنه وتسعمائة سنة واثنتان وتسعون سنة وأشهر وذكروا تفصيل ما ادعوه من ذلك بولادة نبي نبي، وملك ملك، ووفاته من عهد آدم إلى وقت هجره رسول الله ص، وزعموا أن اليهود إنما نقصوا ما نقصوا من عدد سني ما بين تاريخهم وتاريخ النصارى دفعا منهم لنبوه عيسى بن مريم ع إذ كانت صفته ووقت مبعثه مثبتة في التوراة وقالوا: لم يأت الوقت الذي وقت لنا في التوراة أن الذي صفته صفة عيسى يكون فيه، وهم ينتظرون- بزعمهم- خروجه ووقته.","bs_tekst":"A grčki kršćani tvrde da je ono što su Jevreji tvrdili o tome neistinito i da ispravan stav o trajanju dana ovoga svijeta — od kada je Allah stvorio Adema do vremena Hidžre našega vjerovjesnika Muhammeda, neka mu Allah podari blagoslov i mir, prema redoslijedu onoga što imaju u Tevratu koji je u njihovim rukama — iznosi pet hiljada devet stotina devedeset i dvije godine i nekoliko mjeseci. Podrobno su izložili ono što su o tome tvrdili, navodeći rođenje vjerovjesnika po vjerovjesnika i vladara po vladara i njegovu smrt, od Ademova vremena do vremena Hidžre Allahova Poslanika, neka mu Allah podari blagoslov i mir. Tvrdili su da su Jevreji umanjili broj godina za onoliko za koliko se njihov račun razlikuje od kršćanskoga računa kako bi odbacili vjerovjesništvo Isaa, sina Merjemina, neka je mir na njega, jer su njegov opis i vrijeme njegova poslanja zapisani u Tevratu. Rekli su: Još nije došlo vrijeme koje nam je u Tevratu određeno za dolazak onoga čiji je opis poput Isaova opisa. Oni, prema vlastitoj tvrdnji, očekuju njegov dolazak i njegovo vrijeme."},{"stranica":18,"ar_tekst":"واحسب أن الذي ينتظرونه ويدعون أن صفته في التوراة مثبتة، هو الدجال الذي وصفه رسول الله ص لأمته، وذكر لهم أن عامة أتباعه اليهود، فإن كان ذلك هو عبد الله بن صياد، فهو من نسل اليهود.","bs_tekst":"Smatram da je onaj koga očekuju i za čiji opis tvrde da je zapisan u Tevratu Dedždžal kojeg je Allahov Poslanik, neka mu Allah podari blagoslov i mir, opisao svome ummetu i spomenuo im da će većina njegovih sljedbenika biti Jevreji. Ako je taj Abdullah ibn Sajjad, onda je on od jevrejskog potomstva."},{"stranica":18,"ar_tekst":"وأما المجوس فإنهم يزعمون أن قدر مدة الزمان من لدن ملك جيومرت إلى وقت هجرة نبينا ص ثلاثة آلاف سنة ومائة سنة وتسع وثلاثون سنة، وهم لا يذكرون مع ذلك نسبا يعرف فوق جيومرت، ويزعمون أنه آدم أبو البشر، ص وعلى جميع أنبياء الله ورسله.","bs_tekst":"A medžusije tvrde da trajanje vremena od početka Gejumertove vladavine do vremena Hidžre našega Vjerovjesnika, neka mu Allah podari blagoslov i mir, iznosi tri hiljade stotinu trideset i devet godina. Uz to ne navode poznato rodoslovlje iznad Gejumerta i tvrde da je on Adem, otac čovječanstva, neka mu Allah podari blagoslov i mir, kao i svim Allahovim vjerovjesnicima i poslanicima."},{"stranica":18,"ar_tekst":"ثم أهل الأخبار بعد في أمره مختلفون، فمن قائل منهم فيه مثل قول المجوس، ومن قائل منهم إنه تسمى بآدم بعد أن ملك الأقاليم السبعة، وأنه إنما هو جامر بن يافث ابن نوح، كان بنوح ع برا ولخدمته ملازما، وعليه حدبا شفيقا، فدعا الله له ولذريته نوح- لذلك من بره به وخدمته له- بطول العمر، والتمكين في","bs_tekst":"Poznavaoci vijesti ipak se razilaze o njemu. Neki govore isto što i medžusije. Neki govore da se nazvao Ademom nakon što je zavladao sedmerim oblastima i da je on zapravo Džamir ibn Jafes ibn Nuh, koji je prema Nuhu, neka je mir na njega, bio dobročinitelj, stalno mu služio i bio prema njemu brižan i milostiv. Zato je Nuh — zbog njegova dobročinstva i služenja njemu — molio Allaha da njemu i njegovu potomstvu podari dug život, učvršćenost u"},{"stranica":19,"ar_tekst":"البلاد، والنصر على من ناوأه وإياهم، واتصال الملك له ولذريته، ودوامه له ولهم، فاستجيب له فيه، فأعطى جيومرت ذلك وولده، فهو ابو الفراس، ولم يزل الملك فيه وفي ولده إلى أن زال عنهم بدخول المسلمين مدائن كسرى، وغلبة أهل الإسلام إياهم على ملكهم.","bs_tekst":"zemljama, pobjedu nad onima koji se njemu i njima suprotstave, te neprekinutu vlast njemu i njegovu potomstvu i njeno trajanje njemu i njima. Njegova je molba za njega bila uslišana, pa je to dato Gejumertu i njegovu potomstvu. On je otac „el-firas“ ⟦Napomena prevodioca: prijepis glasi „الفراس“; moguće čitanje kao naziv naroda nije ovdje prešutno usvojeno.⟧. Vlast je ostala u njemu i njegovu potomstvu sve dok im nije nestala ulaskom muslimana u Kisrine gradove i pobjedom sljedbenika islama nad njima u njihovoj vlasti."},{"stranica":19,"ar_tekst":"ومن قائل غير ذلك، وسنذكر إن شاء الله ما انتهى إلينا من القول فيه إذا انتهينا إلى ذكرنا تاريخ الملوك ومبالغ أعمارهم، وأنسابهم وأسباب ملكهم","bs_tekst":"Neki govore drugačije od toga. Spomenut ćemo, ako Allah htjedne, ono što je do nas stiglo od stavova o njemu kada dođemo do spominjanja historije vladara, dužina njihovih života, njihovih rodoslovlja i uzroka njihove vlasti."},{"stranica":20,"ar_tekst":"[القول في الدلالة على حدوث الأوقات والأزمان والليل والنهار]","bs_tekst":"Rasprava o dokazivanju nastanka vremenskih trenutaka i razdoblja, noći i dana"},{"stranica":20,"ar_tekst":"قد قلنا قبل إن الزمان إنما هو اسم لساعات الليل والنهار، وساعات الليل والنهار إنما هي مقادير من جري الشمس والقمر في الفلك، كما قال الله عز وجل:","bs_tekst":"Već smo rekli da je vrijeme samo naziv za sate noći i dana, a sati noći i dana samo su mjere kretanja Sunca i Mjeseca po nebeskoj putanji, kao što je Allah, Silan je i Uzvišen, rekao:"},{"stranica":20,"ar_tekst":"«وَآيَةٌ لَهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهارَ فَإِذا هُمْ مُظْلِمُونَ وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ وَالْقَمَرَ قَدَّرْناهُ مَنازِلَ حَتَّى عادَ كَالْعُرْجُونِ الْقَدِيمِ لَا الشَّمْسُ يَنْبَغِي لَها أَنْ تُدْرِكَ الْقَمَرَ وَلَا اللَّيْلُ سابِقُ النَّهارِ وَكُلٌّ فِي فَلَكٍ يَسْبَحُونَ» .","bs_tekst":"⟦Kur’anski navod, prijevod, 36:37–40⟧ „I znak im je noć: Mi s nje svlačimo dan, pa se oni odjednom nađu u tami. A Sunce teče do svoga određenog boravišta; to je određenje Silnoga, Sveznajućega. I Mjesecu smo odredili položaje, sve dok se ne vrati poput stare palmine peteljke. Niti Suncu priliči da dostigne Mjesec, niti noć prestiže dan; i svi plove po putanji.“"},{"stranica":20,"ar_tekst":"فإذا كان الزمان ما ذكرنا من ساعات الليل والنهار، وكانت ساعات الليل والنهار إنما هي قطع الشمس والقمر درجات الفلك، كان بيقين معلوما أن الزمان محدث والليل والنهار محدثان، وان محدث ذلك الله الذي تفرد بإحداث جميع خلقه، كما قال: «وَهُوَ الَّذِي خَلَقَ اللَّيْلَ وَالنَّهارَ وَالشَّمْسَ وَالْقَمَرَ كُلٌّ فِي فَلَكٍ يَسْبَحُونَ» .","bs_tekst":"Ako je vrijeme ono što smo spomenuli od sati noći i dana, a sati noći i dana samo prelazak Sunca i Mjeseca preko stepena nebeske putanje, onda se sa sigurnošću zna da je vrijeme nastalo i da su noć i dan nastali i da je Onaj koji je to doveo u postojanje Allah, koji je sam doveo u postojanje sva Svoja stvorenja, kao što je rekao: ⟦Kur’anski navod, prijevod, 21:33⟧ „I On je stvorio noć i dan i Sunce i Mjesec; svi plove po putanji.“"},{"stranica":20,"ar_tekst":"ومن جهل حدوث ذلك من خلق الله فإنه لن يجهل اختلاف أحوال الليل والنهار، بأن أحدهما يرد على الخلق- وهو الليل- بسواد وظلمة، وأن الآخر منهما يرد عليهم بنور وضياء، ونسخ لسواد الليل وظلمته، وهو النهار.","bs_tekst":"Onaj među Allahovim stvorenjima ko ne zna da je to nastalo neće ipak biti bez znanja o razlici stanja noći i dana: da jedno od njih dolazi stvorenjima — a to je noć — s crnilom i tamom, a drugo im dolazi sa svjetlom i sjajem i uklanjanjem crnila i tame noći, a to je dan."},{"stranica":20,"ar_tekst":"فإذا كان ذلك كذلك، وكان من المحال اجتماعهما مع اختلاف أحوالهما في وقت واحد في جزء واحد- كان معلوما يقينا أنه لا بد من أن يكون أحدهما كان قبل الآخر منهما، وأيهما كان منهما قبل صاحبه فإن الآخر منهما كان","bs_tekst":"Budući da je tako i da je nemoguće da se oboje, s razlikom svojih stanja, istovremeno sastanu na istom dijelu prostora, sa sigurnošću se zna da je nužno jedno od njih bilo prije drugoga. Koje god od njih bilo prije svoga druga, ono drugo bilo je"},{"stranica":21,"ar_tekst":"لا شك بعده، وذلك إبانة ودليل على حدوثهما، وأنهما خلقان لخالقهما.","bs_tekst":"bez sumnje poslije njega. To je objašnjenje i dokaz njihova nastanka i toga da su njih dvoje dva stvorenja svoga Stvoritelja."},{"stranica":21,"ar_tekst":"ومن الدلالة أيضا على حدوث الأيام والليالي أنه لا يوم إلا وهو بعد يوم كان قبله، وقبل يوم كائن بعده، فمعلوم أن ما لم يكن ثم كان، أنه محدث مخلوق، وأن له خالقا ومحدثا.","bs_tekst":"Među dokazima nastanka dana i noći jeste i to da nema dana a da nije poslije dana koji je bio prije njega i prije dana koji će biti poslije njega. Poznato je, dakle, da je ono što nije bilo pa zatim jeste nastalo i stvoreno i da ima Stvoritelja i Onoga koji ga je doveo u postojanje."},{"stranica":21,"ar_tekst":"واخرى، أن الأيام والليالي معدودة، وما عد من الأشياء فغير خارج من أحد العددين: شفع أو وتر، فإن يكن شفعا فإن أولها اثنان، وذلك تصحيح القول بأن لها ابتداء وأولا، وإن كان وترا فإن أولها واحد، وذلك دليل على أن لها ابتداء وأولا، وما كان له ابتداء فإنه لا بد له من مبتدئ، هو خالقه","bs_tekst":"I još: dani i noći mogu se brojati. Ono među stvarima što se broji ne izlazi izvan jednoga od dvaju brojeva: parnoga ili neparnoga. Ako je parno, početak mu je dva, a time se potvrđuje tvrdnja da ima početak i prvi dio. Ako je neparno, početak mu je jedan, a to je dokaz da ima početak i prvi dio. Ono što ima početak nužno ima i Onoga koji mu je dao početak, a On je njegov Stvoritelj."},{"stranica":22,"ar_tekst":"القول في هل كان الله عز وجل خلق قبل خلقه الزمان والليل والنهار شيئا غير ذلك من الخلق قد قلنا قبل: إن الزمان إنما هو ساعات الليل والنهار، وإن الساعات إنما هي قطع الشمس والقمر درجات الفلك.","bs_tekst":"Rasprava o tome je li Allah, Silan je i Uzvišen, prije nego što je stvorio vrijeme, noć i dan stvorio nešto drugo od stvorenja. Već smo rekli da vrijeme čine samo sati noći i dana i da sati predstavljaju samo prelazak Sunca i Mjeseca preko stepena nebeske putanje."},{"stranica":22,"ar_tekst":"فإذا كان ذلك كذلك، وكان صحيحا عن رسول الله ص ما حَدَّثَنَا هَنَّادُ بْنُ السَّرِيِّ، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنْ أَبِي سَعْدٍ الْبَقَّالِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ- قَالَ هناد: وقرات سائر الحديث على ابى بكر- ان اليهود أتت النبي ص فَسَأَلَتْهُ عَنْ خَلْقِ السَّمَوَاتِ وَالأَرْضِ فَقَالَ: خَلَقَ اللَّهُ الأَرْضَ يَوْمَ الأَحَدِ وَالاثْنَيْنِ، وَخَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ وَمَا فِيهِنَّ مِنْ مَنَافِعَ، وَخَلَقَ يوم الأربعاء الشجر والماء والمدائن والعمران والخراب، فهذه ار
