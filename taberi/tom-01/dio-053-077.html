, kao posljednje stvorenje, u posljednjem satu petka, između ikindije i noći.’“"},{"id":"56.5","ar":"فإذا كان الله تعالى ذكره خلق الخلق من لدن ابتداء خلق السموات والأرض إلى حين فراغه من خلق جميعهم في ستة أيام، وكان كل يوم من","bs":"Ako je Allah, Uzvišen je spomen Njegov, stvorio stvorenja od početka stvaranja nebesa i Zemlje do dovršetka stvaranja svih njih u šest dana, a svaki od","ar_ranges":[],"ar_html":"فإذا كان الله تعالى ذكره خلق الخلق من لدن ابتداء خلق السموات والأرض إلى حين فراغه من خلق جميعهم في ستة أيام، وكان كل يوم من","bs_ranges":[],"bs_html":"Ako je Allah, Uzvišen je spomen Njegov, stvorio stvorenja od početka stvaranja nebesa i Zemlje do dovršetka stvaranja svih njih u šest dana, a svaki od"}],"notes":[]},{"n":57,"ar":"الأيام الستة التي خلقهم فيها مقداره ألف سنة من أيام الدنيا، وكان بين ابتدائه في خلق ذلك وخلق القلم الذي أمره بكتابه كل ما هو كائن إلى قيام الساعة ألف عام، وذلك يوم من أيام الآخرة التي قدر اليوم الواحد منها ألف عام من أيام الدنيا- كان معلوما أن قدر مدة ما بين أول ابتداء ربنا عز وجل في خلق ما خلق من خلقه إلى الفراغ من آخرهم سبعة آلاف عام يزيد إن شاء الله شيئا أو ينقص شيئا، على ما قد روينا من الآثار والأخبار التي ذكرناها، وتركنا ذكر كثير منها كراهة إطالة الكتاب بذكرها.\nوإذا كان ذلك كذلك، وكان صحيحا أن مدة ما بين فراغ ربنا تعالى ذكره- من خلق جميع خلقه إلى وقت فناء جميعهم بما قد دللنا قبل، واستشهدنا من الشواهد، وبما سنشرح فيما بعد- سبعة آلاف سنة، تزيد قليلا أو تنقص قليلا- كان معلوما بذلك أن مدة ما بين أول خلق خلقه الله تعالى إلى قيام الساعة وفناء جميع العالم، أربعة عشر ألف عام من أعوام الدنيا، وذلك أربعة عشر يوما من أيام الآخرة، سبعة أيام من ذلك- وهي سبعة آلاف عام من أعوام الدنيا- مدة ما بين أول ابتداء الله جل وتقدس في خلق أول خلقه إلى فراغه من خلق آخرهم- وهو آدم ابو البشر ص، وسبعة أيام أخر، وهي سبعة آلاف عام من أعوام الدنيا، من ذلك مدة ما بين فراغه جل ثناؤه من خلق آخر خلقه- وهو آدم- إلى فناء آخرهم وقيام الساعة، وعود الأمر إلى ما كان عليه قبل أن يكون شيء غير القديم البارئ الذي له الخلق والأمر الذي كان قبل كل شيء، فلا شيء كان قبله، والكائن بعد كل شيء فلا شيء يبقى غير وجهه الكريم.\nفإن قال قائل: وما دليلك على أن الأيام الستة التي خلق الله فيهن خلقه كان قدر كل يوم منهن قدر ألف عام من أعوام الدنيا دون أن يكون ذلك","bs":"\u003cp data-paragraph=\"57.1\">šest dana u kojima ih je stvorio trajao hiljadu godina od dana ovoga svijeta, te ako je između početka toga stvaranja i stvaranja pera, kojem je naredio da zapiše sve što će biti do nastupanja Časa, bilo hiljadu godina — a to je jedan od dana budućeg svijeta, od kojih jedan traje hiljadu godina ovoga svijeta — onda je poznato da je razdoblje od prvog početka stvaranja stvorenja našeg Gospodara, Silnog i Uzvišenog, do dovršetka stvaranja posljednjeg od njih iznosilo sedam hiljada godina, uz nešto više ili manje, ako Allah htjedne, prema predajama i izvješćima koja smo prenijeli i spomenuli. Mnoga od njih nismo naveli jer nismo željeli njihovim navođenjem oduljiti knjigu.\u003c/p>\u003cp data-paragraph=\"57.2\">Ako je tako, i ako je tačno da je razdoblje od vremena kada je naš Gospodar, Uzvišen je spomen Njegov, dovršio stvaranje svih Svojih stvorenja do vremena nestanka svih njih — prema onome što smo ranije dokazivali, potkrijepili svjedočanstvima i što ćemo kasnije objasniti — sedam hiljada godina, uz nešto više ili manje, onda je time poznato da razdoblje od prvog stvorenja koje je Uzvišeni Allah stvorio do nastupanja Časa i nestanka cijelog svijeta iznosi četrnaest hiljada godina ovoga svijeta. To je četrnaest dana budućeg svijeta. Sedam od tih dana — odnosno sedam hiljada godina ovoga svijeta — razdoblje je od prvog početka Allahovog stvaranja, Uzvišen je i Svet, do dovršetka stvaranja posljednjeg od njih, a to je Adem, otac čovječanstva, sallallahu alejhi ve sellem. Drugih sedam dana, odnosno sedam hiljada godina ovoga svijeta, razdoblje je od vremena kada je Onaj čija je hvala uzvišena dovršio stvaranje Svoga posljednjeg stvorenja — Adema — do nestanka posljednjeg od njih i nastupanja Časa. Tada će se stanje vratiti na ono kakvo je bilo prije nego što je bilo išta osim Bespočetnog Tvorca, kojem pripadaju stvaranje i naredba, koji je bio prije svega pa prije Njega nije bilo ničega, i koji ostaje poslije svega pa ne ostaje ništa osim Njegovog plemenitog Lica.\u003c/p>\u003cp data-paragraph=\"57.3\">Ako neko kaže: „Koji je tvoj dokaz da je svaki od šest dana u kojima je Allah stvarao Svoja stvorenja trajao hiljadu godina ovoga svijeta, umjesto da su ti dani bili\u003c/p>","paragraphs":[{"id":"57.1","ar":"الأيام الستة التي خلقهم فيها مقداره ألف سنة من أيام الدنيا، وكان بين ابتدائه في خلق ذلك وخلق القلم الذي أمره بكتابه كل ما هو كائن إلى قيام الساعة ألف عام، وذلك يوم من أيام الآخرة التي قدر اليوم الواحد منها ألف عام من أيام الدنيا- كان معلوما أن قدر مدة ما بين أول ابتداء ربنا عز وجل في خلق ما خلق من خلقه إلى الفراغ من آخرهم سبعة آلاف عام يزيد إن شاء الله شيئا أو ينقص شيئا، على ما قد روينا من الآثار والأخبار التي ذكرناها، وتركنا ذكر كثير منها كراهة إطالة الكتاب بذكرها.","bs":"šest dana u kojima ih je stvorio trajao hiljadu godina od dana ovoga svijeta, te ako je između početka toga stvaranja i stvaranja pera, kojem je naredio da zapiše sve što će biti do nastupanja Časa, bilo hiljadu godina — a to je jedan od dana budućeg svijeta, od kojih jedan traje hiljadu godina ovoga svijeta — onda je poznato da je razdoblje od prvog početka stvaranja stvorenja našeg Gospodara, Silnog i Uzvišenog, do dovršetka stvaranja posljednjeg od njih iznosilo sedam hiljada godina, uz nešto više ili manje, ako Allah htjedne, prema predajama i izvješćima koja smo prenijeli i spomenuli. Mnoga od njih nismo naveli jer nismo željeli njihovim navođenjem oduljiti knjigu.","ar_ranges":[],"ar_html":"الأيام الستة التي خلقهم فيها مقداره ألف سنة من أيام الدنيا، وكان بين ابتدائه في خلق ذلك وخلق القلم الذي أمره بكتابه كل ما هو كائن إلى قيام الساعة ألف عام، وذلك يوم من أيام الآخرة التي قدر اليوم الواحد منها ألف عام من أيام الدنيا- كان معلوما أن قدر مدة ما بين أول ابتداء ربنا عز وجل في خلق ما خلق من خلقه إلى الفراغ من آخرهم سبعة آلاف عام يزيد إن شاء الله شيئ time poznato da razdoblje od prvog stvorenja koje je Uzvišeni Allah stvorio do nastupanja Časa i nestanka cijelog svijeta iznosi četrnaest hiljada godina ovoga svijeta. To je četrnaest dana budućeg svijeta. Sedam od tih dana — odnosno sedam hiljada godina ovoga svijeta — razdoblje je od prvog početka Allahovog stvaranja, Uzvišen je i Svet, do dovršetka stvaranja posljednjeg od njih, a to je Adem, otac čovječanstva, sallallahu alejhi ve sellem. Drugih sedam dana, odnosno sedam hiljada godina ovoga svijeta, razdoblje je od vremena kada je Onaj čija je hvala uzvišena dovršio stvaranje Svoga posljednjeg stvorenja — Adema — do nestanka posljednjeg od njih i nastupanja Časa. Tada će se stanje vratiti na ono kakvo je bilo prije nego što je bilo išta osim Bespočetnog Tvorca, kojem pripadaju stvaranje i naredba, koji je bio prije svega pa prije Njega nije bilo ničega, i koji ostaje poslije svega pa ne ostaje ništa osim Njegovog plemenitog Lica.","ar_ranges":[],"ar_html":"وإذا كان ذلك كذلك، وكان صحيحا أن مدة ما بين فراغ ربنا تعالى ذكره- من خلق جميع خلقه إلى وقت فناء جميعهم بما قد دللنا قبل، واستشهدنا من الشواهد، وبما سنشرح فيما بعد- سبعة آلاف سنة، تزيد قليلا أو تنقص قليلا- كان معلوما بذلك أن مدة ما بين أول خلق خلقه الله تعالى إلى قيام الساعة وفناء جميع العالم، أربعة عشر ألف عام من أعوام الدنيا، وذلك أربعة عشر يوما من أيام الآخرة، سبعة أيام من ذلك- وهي سبعة آلاف عام من أعوام الدنيا- مدة ما بين أول ابتداء الله جل وتقدس في خلق أول خلقه إلى فراغه من خلق آخرهم- وهو آدم ابو البشر ص، وسبعة أيام أخر، وهي سبعة آلاف عام من أعوام الدنيا، من ذلك مدة ما بين فراغه جل ثناؤه من خلق آخر خلقه- وهو آدم- إلى فناء آخرهم وقيام الساعة، وعود الأمر إلى ما كان عليه قبل أن يكون شيء غير القديم البارئ الذي له الخلق والأمر الذي كان قبل كل شيء، فلا شيء كان قبله، والكائن بعد كل شيء فلا شيء يبقى غير وجهه الكريم.","bs_ranges":[],"bs_html":"Ako je tako, i ako je tačno da je razdoblje od vremena kada je naš Gospodar, Uzvišen je spomen Njegov, dovršio stvaranje svih Svojih stvorenja do vremena nestanka svih njih — prema onome što smo ranije dokazivali, potkrijepili svjedočanstvima i što ćemo kasnije objasniti — sedam hiljada godina, uz nešto više ili manje, onda je time poznato da razdoblje od prvog stvorenja koje je Uzvišeni Allah stvorio do nastupanja Časa i nestanka cijelog svijeta iznosi četrnaest hiljada godina ovoga svijeta. To je četrnaest dana budućeg svijeta. Sedam od tih dana — odnosno sedam hiljada godina ovoga svijeta — razdoblje je od prvog početka Allahovog stvaranja, Uzvišen je i Svet, do dovršetka stvaranja posljednjeg od njih, a to je Adem, otac čovječanstva, sallallahu alejhi ve sellem. Drugih sedam dana, odnosno sedam hiljada godina ovoga svijeta, razdoblje je od vremena kada je Onaj čija je hvala uzvišena dovršio stvaranje Svoga posljednjeg stvorenja — Adema — do nestanka posljednjeg od njih i nastupanja Časa. Tada će se stanje vratiti na ono kakvo je bilo prije nego što je bilo išta osim Bespočetnog Tvorca, kojem pripadaju stvaranje i naredba, koji je bio prije svega pa prije Njega nije bilo ničega, i koji ostaje poslije svega pa ne ostaje ništa osim Njegovog plemenitog Lica."},{"id":"57.3","ar":"فإن قال قائل: وما دليلك على أن الأيام الستة التي خلق الله فيهن خلقه كان قدر كل يوم منهن قدر ألف عام من أعوام الدنيا دون أن يكون ذلك","bs":"Ako neko kaže: „Koji je tvoj dokaz da je svaki od šest dana u kojima je Allah stvarao Svoja stvorenja trajao hiljadu godina ovoga svijeta, umjesto da su ti dani bili","ar_ranges":[],"ar_html":"فإن قال قائل: وما دليلك على أن الأيام الستة التي خلق الله فيهن خلقه كان قدر كل يوم منهن قدر ألف عام من أعوام الدنيا دون أن يكون ذلك","bs_ranges":[],"bs_html":"Ako neko kaže: „Koji je tvoj dokaz da je svaki od šest dana u kojima je Allah stvarao Svoja stvorenja trajao hiljadu godina ovoga svijeta, umjesto da su ti dani bili"}],"notes":[]},{"n":58,"ar":"كأيام أهل الدنيا التي يتعارفونها بينهم، وإنما قال الله عز وجل في كتابه:\n«الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ*» ، فلم يعلمنا أن ذلك كما ذكرت، بل أخبرنا أنه خلق ذلك في ستة أيام، والأيام المعروفة عند المخاطبين بهذه المخاطبة هي أيامهم التي أول اليوم منها طلوع الفجر إلى غروب الشمس، ومن قولك: إن خطاب الله عباده بما خاطبهم به في تنزيله إنما هو موجه إلى الأشهر والأغلب عليه من معانيه، وقد وجهت خبر الله في كتابه عن خلقه السموات والأرض وما بينهما في ستة أيام إلى غير المعروف من معاني الأيام، وأمر الله عز وجل إذا أراد شيئا أن يكونه أنفذ وأمضى من أن يوصف بأنه خلق السموات والأرض وما بينهما في ستة أيام، مقدارهن ستة آلاف عام من أعوام الدنيا، وإنما أمره إذا أراد شيئا أن يقول له: كن فيكون، وذلك كما قال ربنا تبارك وتعالى: «وَما أَمْرُنا إِلَّا واحِدَةٌ كَلَمْحٍ بِالْبَصَرِ» ؟\nقيل له: قد قلنا فيما تقدم من كتابنا هذا إنا إنما نعتمد في معظم ما نرسمه في كتابنا هذا على الآثار والاخبار عن نبينا ص وعن السلف الصالحين قبلنا دون الاستخراج بالعقول والفكر، إذ أكثره خبر عما مضى من الأمور، وعما هو كائن من الأحداث، وذلك غير مدرك علمه بالاستنباط الاستخراج بالعقول:\n\nفإن قال: فهل من حجة على صحة ذلك من جهة الخبر؟\n\nقيل: ذلك ما لا نعلم قائلا من أئمة الدين قال خلافه.\n\nفإن قال: فهل من رواية عن أحد منهم بذلك؟\nقيل: علم ذلك عند أهل العلم من السلف كان أشهر من أن يحتاج فيه إلى رواية منسوبة إلى شخص منهم بعينه، وقد روي ذلك عن جماعة منهم مسمين بأعيانهم","bs":"\u003cp data-paragraph=\"58.1\">poput dana koje ljudi ovoga svijeta među sobom poznaju? Allah, Silan i Uzvišen, u Svojoj Knjizi samo kaže: ‘Onaj koji je stvorio nebesa, Zemlju i ono što je između njih u šest dana.’ Nije nas obavijestio da je to onako kako si spomenuo, nego da je to stvorio u šest dana. Dani koje poznaju oni kojima su te riječi upućene njihovi su dani, od pojave zore do zalaska Sunca. Ti kažeš da se Allahovo obraćanje robovima u Njegovoj Objavi tumači prema najpoznatijem i preovlađujućem značenju tih riječi, a Njegovo izvješće u Knjizi o stvaranju nebesa, Zemlje i onoga što je između njih u šest dana usmjerio si prema značenju dana koje nije uobičajeno. Kada Allah, Silan i Uzvišen, želi da nešto nastane, Njegova naredba djelotvornija je i izvršnija od toga da se opisuje kako je nebesa, Zemlju i ono što je između njih stvarao šest dana koji traju šest hiljada godina ovoga svijeta. Njegova je naredba, kada nešto želi, samo da tome kaže: Budi! — i ono bude. To je kao što je naš Gospodar, Blagoslovljen i Uzvišen, rekao: ‘A Naša je naredba samo jedna, kao treptaj oka.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: izraz o šest dana nalazi se, između ostalog, u El-Furkan, 25:59, i Es-Sedžda, 32:4; drugi izričiti navod je El-Kamer, 54:50.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"58.2\">Odgovara mu se: Već smo u prethodnom dijelu ove knjige rekli da se u većini onoga što u njoj bilježimo oslanjamo na predaje i izvješća od našeg Vjerovjesnika, sallallahu alejhi ve sellem, i od dobrih prethodnika prije nas, a ne na zaključivanje razumom i razmišljanjem. Većina toga izvještava o prošlim zbivanjima i događajima koji će nastupiti, a znanje o tome ne može se steći izvođenjem zaključaka i razumskim domišljanjem.\u003c/p>\u003cp data-paragraph=\"58.3\">Ako kaže: „Postoji li, iz predaja, dokaz da je to ispravno?“\u003c/p>\u003cp data-paragraph=\"58.4\">Odgovara se: Ne znamo nijednog od imama vjere koji je o tome rekao suprotno.\u003c/p>\u003cp data-paragraph=\"58.5\">Ako kaže: „Postoji li predaja od nekoga od njih o tome?“\u003c/p>\u003cp data-paragraph=\"58.6\">Odgovara se: Znanje o tome među učenim prethodnicima bilo je previše poznato da bi zahtijevalo predaju pripisanu jednome od njih poimenično. Ipak, to je preneseno od jedne skupine njih, navedenih poimenično.\u003c/p>","paragraphs":[{"id":"58.1","ar":"كأيام أهل الدنيا التي يتعارفونها بينهم، وإنما قال الله عز وجل في كتابه:\n«الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ*» ، فلم يعلمنا أن ذلك كما ذكرت، بل أخبرنا أنه خلق ذلك في ستة أيام، والأيام المعروفة عند المخاطبين بهذه المخاطبة هي أيامهم التي أول اليوم منها طلوع الفجر إلى غروب الشمس، ومن قولك: إن خطاب الله عباده بما خاطبهم به في تنزيله إنما هو موجه إلى الأشهر والأغلب عليه من معانيه، وقد وجهت خبر الله في كتابه عن خلقه السموات والأرض وما بينهما في ستة أيام إلى غير المعروف من معاني الأيام، وأمر الله عز وجل إذا أراد شيئا أن يكونه أنفذ وأمضى من أن يوصف بأنه خلق السموات والأرض وما بينهما في ستة أيام، مقدارهن ستة آلاف عام من أعوام الدنيا، وإنما أمره إذا أراد شيئا أن يقول له: كن فيكون، وذلك كما قال ربنا تبارك وتعالى: «وَما أَمْرُنا إِلَّا واحِدَةٌ كَلَمْحٍ بِالْبَصَرِ» ؟","bs":"poput dana koje ljudi ovoga svijeta među sobom poznaju? Allah, Silan i Uzvišen, u Svojoj Knjizi samo kaže: ‘Onaj koji je stvorio nebesa, Zemlju i ono što je između njih u šest dana.’ Nije nas obavijestio da je to onako kako si spomenuo, nego da je to stvorio u šest dana. Dani koje poznaju oni kojima su te riječi upućene njihovi su dani, od pojave zore do zalaska Sunca. Ti kažeš da se Allahovo obraćanje robovima u Njegovoj Objavi tumači prema najpoznatijem i preovlađujućem značenju tih riječi, a Njegovo izvješće u Knjizi o stvaranju nebesa, Zemlje i onoga što je između njih u šest dana usmjerio si prema značenju dana koje nije uobičajeno. Kada Allah, Silan i Uzvišen, želi da nešto nastane, Njegova naredba djelotvornija je i izvršnija od toga da se opisuje kako je nebesa, Zemlju i ono što je između njih stvarao šest dana koji traju šest hiljada godina ovoga svijeta. Njegova je naredba, kada nešto želi, samo da tome kaže: Budi! — i ono bude. To je kao što je naš Gospodar, Blagoslovljen i Uzvišen, rekao: ‘A Naša je naredba samo jedna, kao treptaj oka.’“ ⟦Prijevodi kur’anskih navoda: izraz o šest dana nalazi se, između ostalog, u El-Furkan, 25:59, i Es-Sedžda, 32:4; drugi izričiti navod je El-Kamer, 54:50.⟧","ar_ranges":[],"ar_html":"كأيام أهل الدنيا التي يتعارفونها بينهم، وإنما قال الله عز وجل في كتابه:\n«الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ*» ، فلم يعلمنا أن ذلك كما ذكرت، بل أخبرنا أنه خلق ذلك في ستة أيام، والأيام المعروفة عند المخاطبين بهذه المخاطبة هي أيامهم التي أول اليوم منها طلوع الفجر إلى غروب الشمس، ومن قولك: إن خطاب الله عباده بما خاطبهم به في تنزيله إنما هو موجه إلى الأشهر والأغلب عليه من معانيه، وقد وجهت خبر الله في كتابه عن خلقه السموات والأرض وما بينهما في ستة أيام إلى غير المعروف من معاني الأيام، وأمر الله عز وجل إذا أراد شيئا أن يكونه أنفذ وأمضى من أن يوصف بأنه خلق السموات والأرض وما بينهما في ستة أيام، مقدارهن ستة آلاف عام من أعوام الدنيا، وإنما أمره إذا أراد شيئا أن يقول له: كن فيكون، وذلك كما قال ربنا تبارك وتعالى: «وَما أَمْرُنا إِلَّا واحِدَةٌ كَلَمْحٍ بِالْبَصَرِ» ؟","bs_ranges":[],"bs_html":"poput dana koje ljudi ovoga svijeta među sobom poznaju? Allah, Silan i Uzvišen, u Svojoj Knjizi samo kaže: ‘Onaj koji je stvorio nebesa, Zemlju i ono što je između njih u šest dana.’ Nije nas obavijestio da je to onako kako si spomenuo, nego da je to stvorio u šest dana. Dani koje poznaju oni kojima su te riječi upućene njihovi su dani, od pojave zore do zalaska Sunca. Ti kažeš da se Allahovo obraćanje robovima u Njegovoj Objavi tumači prema najpoznatijem i preovlađujućem značenju tih riječi, a Njegovo izvješće u Knjizi o stvaranju nebesa, Zemlje i onoga što je između njih u šest dana usmjerio si prema značenju dana koje nije uobičajeno. Kada Allah, Silan i Uzvišen, želi da nešto nastane, Njegova naredba djelotvornija je i izvršnija od toga da se opisuje kako je nebesa, Zemlju i ono što je između njih stvarao šest dana koji traju šest hiljada godina ovoga svijeta. Njegova je naredba, kada nešto želi, samo da tome kaže: Budi! — i ono bude. To je kao što je naš Gospodar, Blagoslovljen i Uzvišen, rekao: ‘A Naša je naredba samo jedna, kao treptaj oka.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: izraz o šest dana nalazi se, između ostalog, u El-Furkan, 25:59, i Es-Sedžda, 32:4; drugi izričiti navod je El-Kamer, 54:50.⟧\u003c/span>"},{"id":"58.2","ar":"قيل له: قد قلنا فيما تقدم من كتابنا هذا إنا إنما نعتمد في معظم ما نرسمه في كتابنا هذا على الآثار والاخبار عن نبينا ص وعن السلف الصالحين قبلنا دون الاستخراج بالعقول والفكر، إذ أكثره خبر عما مضى من الأمور، وعما هو كائن من الأحداث، وذلك غير مدرك علمه بالاستنباط الاستخراج بالعقول:","bs":"Odgovara mu se: Već smo u prethodnom dijelu ove knjige rekli da se u većini onoga što u njoj bilježimo oslanjamo na predaje i izvješća od našeg Vjerovjesnika, sallallahu alejhi ve sellem, i od dobrih prethodnika prije nas, a ne na zaključivanje razumom i razmišljanjem. Većina toga izvještava o prošlim zbivanjima i događajima koji će nastupiti, a znanje o tome ne može se steći izvođenjem zaključaka i razumskim domišljanjem.","ar_ranges":[],"ar_html":"قيل له: قد قلنا فيما تقدم من كتابنا هذا إنا إنما نعتمد في معظم ما نرسمه في كتابنا هذا على الآثار والاخبار عن نبينا ص وعن السلف الصالحين قبلنا دون الاستخراج بالعقول والفكر، إذ أكثره خبر عما مضى من الأمور، وعما هو كائن من الأحداث، وذلك غير مدرك علمه بالاستنباط الاستخراج بالعقول:","bs_ranges":[],"bs_html":"Odgovara mu se: Već smo u prethodnom dijelu ove knjige rekli da se u većini onoga što u njoj bilježimo oslanjamo na predaje i izvješća od našeg Vjerovjesnika, sallallahu alejhi ve sellem, i od dobrih prethodnika prije nas, a ne na zaključivanje razumom i razmišljanjem. Većina toga izvještava o prošlim zbivanjima i događajima koji će nastupiti, a znanje o tome ne može se steći izvođenjem zaključaka i razumskim domišljanjem."},{"id":"58.3","ar":"فإن قال: فهل من حجة على صحة ذلك من جهة الخبر؟","bs":"Ako kaže: „Postoji li, iz predaja, dokaz da je to ispravno?“","ar_ranges":[],"ar_html":"فإن قال: فهل من حجة على صحة ذلك من جهة الخبر؟","bs_ranges":[],"bs_html":"Ako kaže: „Postoji li, iz predaja, dokaz da je to ispravno?“"},{"id":"58.4","ar":"قيل: ذلك ما لا نعلم قائلا من أئمة الدين قال خلافه.","bs":"Odgovara se: Ne znamo nijednog od imama vjere koji je o tome rekao suprotno.","ar_ranges":[],"ar_html":"قيل: ذلك ما لا نعلم قائلا من أئمة الدين قال خلافه.","bs_ranges":[],"bs_html":"Odgovara se: Ne znamo nijednog od imama vjere koji je o tome rekao suprotno."},{"id":"58.5","ar":"فإن قال: فهل من رواية عن أحد منهم بذلك؟","bs":"Ako kaže: „Postoji li predaja od nekoga od njih o tome?“","ar_ranges":[],"ar_html":"فإن قال: فهل من رواية عن أحد منهم بذلك؟","bs_ranges":[],"bs_html":"Ako kaže: „Postoji li predaja od nekoga od njih o tome?“"},{"id":"58.6","ar":"قيل: علم ذلك عند أهل العلم من السلف كان أشهر من أن يحتاج فيه إلى رواية منسوبة إلى شخص منهم بعينه، وقد روي ذلك عن جماعة منهم مسمين بأعيانهم","bs":"Odgovara se: Znanje o tome među učenim prethodnicima bilo je previše poznato da bi zahtijevalo predaju pripisanu jednome od njih poimenično. Ipak, to je preneseno od jedne skupine njih, navedenih poimenično.","ar_ranges":[],"ar_html":"قيل: علم ذلك عند أهل العلم من السلف كان أشهر من أن يحتاج فيه إلى رواية منسوبة إلى شخص منهم بعينه، وقد روي ذلك عن جماعة منهم مسمين بأعيانهم","bs_ranges":[],"bs_html":"Odgovara se: Znanje o tome među učenim prethodnicima bilo je previše poznato da bi zahtijevalo predaju pripisanu jednome od njih poimenično. Ipak, to je preneseno od jedne skupine njih, navedenih poimenično."}],"notes":[]},{"n":59,"ar":"فإن قال: فاذكرهم لنا.\nقيل: حَدَّثَنَا ابْنُ حميد، قَالَ: حَدَّثَنَا حكام: عن عنبسة، عن سِمَاكٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: خلق الله السموات والأرض في ستة أيام، فَكُلُّ يَوْمٍ مِنْ هَذِهِ الأَيَّامِ كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ أَنْتُمْ حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنْ إِسْرَائِيلَ، عَنْ سِمَاكٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ» .\n\nقَالَ: السِّتَّةُ الأَيَّامُ الَّتِي خَلَقَ اللَّهُ فِيهَا السَّمَوَاتِ وَالأَرْضَ.\nحَدَّثَنَا عبدة، حَدَّثَنِي الحسين بن الفرج، قال: سمعت أبا معاذ يقول: أخبرنا عبيد، قال: سمعت الضحاك يقول في قوله: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ» : يعني هذا اليوم من الأيام الستة التي خلق الله فيهن السموات والأرض وما بينهما.\n\nحَدَّثَنِي المثنى، حَدَّثَنَا علي، عن المسيب بن شريك، عن أبي روق، عن الضحاك: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» .\n\nقال: من ايام الآخرة، كل يوم كان مقداره ألف سنة، ابتدأ في الخلق يوم الأحد، واجتمع الخلق يوم الجمعة.\nحَدَّثَنَا ابن حميد قَالَ: حَدَّثَنَا جرير، عن الأعمش، عن أبي صالح: عن كعب، قال: بدأ الله خلق السموات والأرض يوم الأحد والاثنين والثلاثاء والأربعاء والخميس، وفرغ منها يوم الجمعة، قال: فجعل مكان كل يوم ألف سنة","bs":"\u003cp data-paragraph=\"59.1\">Ako kaže: „Onda nam ih navedi.“\u003c/p>\u003cp data-paragraph=\"59.2\">Odgovara se: Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Hukkam, od Anbese, od Simaka, od Ikrime, od Ibn Abbasa, koji je rekao: „Allah je stvorio nebesa i Zemlju u šest dana. Svaki od tih dana bio je poput hiljadu godina koje vi brojite.“\u003c/p>\u003cp data-paragraph=\"59.3\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je moj otac, od Israila, od Simaka, od Ikrime, od Ibn Abbasa, o riječima: „U danu koji traje hiljadu godina koje vi brojite.“ Rekao je: „To je šest dana u kojima je Allah stvorio nebesa i Zemlju.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Es-Sedžda, 32:5, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"59.4\">Pričao nam je Abde: pričao mi je Husejn ibn el-Feredž, koji je rekao: čuo sam Ebu Muaza kako kaže: obavijestio nas je Ubejd, koji je rekao: čuo sam Dahhaka kako, o riječima: „U danu koji traje hiljadu godina koje vi brojite“, kaže: „Misli se na ovaj dan iz šest dana u kojima je Allah stvorio nebesa, Zemlju i ono što je između njih.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Es-Sedžda, 32:5, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"59.5\">Pričao mi je Musenna: pričao nam je Ali, od Musejjeba ibn Šerika, od Ebu Revka, od Dahhaka, o riječima: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Rekao je: „Od dana budućeg svijeta; svaki dan trajao je hiljadu godina. Stvaranje je započeo u nedjelju, a stvaranje je objedinjeno u petak.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"59.6\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Džerir, od A‘meša, od Ebu Saliha, od Ka‘ba, koji je rekao: „Allah je započeo stvaranje nebesa i Zemlje u nedjelju, ponedjeljak, utorak, srijedu i četvrtak, a dovršio ga je u petak.“ Rekao je: „Na mjesto svakog dana postavio je hiljadu godina.“\u003c/p>","paragraphs":[{"id":"59.1","ar":"فإن قال: فاذكرهم لنا.","bs":"Ako kaže: „Onda nam ih navedi.“","ar_ranges":[],"ar_html":"فإن قال: فاذكرهم لنا.","bs_ranges":[],"bs_html":"Ako kaže: „Onda nam ih navedi.“"},{"id":"59.2","ar":"قيل: حَدَّثَنَا ابْنُ حميد، قَالَ: حَدَّثَنَا حكام: عن عنبسة، عن سِمَاكٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: خلق الله السموات والأرض في ستة أيام، فَكُلُّ يَوْمٍ مِنْ هَذِهِ الأَيَّامِ كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ أَنْتُمْ","bs":"Odgovara se: Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Hukkam, od Anbese, od Simaka, od Ikrime, od Ibn Abbasa, koji je rekao: „Allah je stvorio nebesa i Zemlju u šest dana. Svaki od tih dana bio je poput hiljadu godina koje vi brojite.“","ar_ranges":[[5,118]],"ar_html":"قيل: \u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حميد، قَالَ: حَدَّثَنَا حكام: عن عنبسة، عن سِمَاكٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>خلق الله السموات والأرض في ستة أيام، فَكُلُّ يَوْمٍ مِنْ هَذِهِ الأَيَّامِ كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ أَنْتُمْ","bs_ranges":[[13,139]],"bs_html":"Odgovara se: \u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Hukkam, od Anbese, od Simaka, od Ikrime, od Ibn Abbasa, koji je rekao: \u003c/span>„Allah je stvorio nebesa i Zemlju u šest dana. Svaki od tih dana bio je poput hiljadu godina koje vi brojite.“"},{"id":"59.3","ar":"حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنْ إِسْرَائِيلَ، عَنْ سِمَاكٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ» .\n\nقَالَ: السِّتَّةُ الأَيَّامُ الَّتِي خَلَقَ اللَّهُ فِيهَا السَّمَوَاتِ وَالأَرْضَ.","bs":"Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je moj otac, od Israila, od Simaka, od Ikrime, od Ibn Abbasa, o riječima: „U danu koji traje hiljadu godina koje vi brojite.“ Rekao je: „To je šest dana u kojima je Allah stvorio nebesa i Zemlju.“ ⟦Prijevod kur’anskog navoda: Es-Sedžda, 32:5, dio ajeta.⟧","ar_ranges":[[0,122]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنْ إِسْرَائِيلَ، عَنْ سِمَاكٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ: \u003c/span>«فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ» .\n\nقَالَ: السِّتَّةُ الأَيَّامُ الَّتِي خَلَقَ اللَّهُ فِيهَا السَّمَوَاتِ وَالأَرْضَ.","bs_ranges":[[0,113]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je moj otac, od Israila, od Simaka, od Ikrime, od Ibn Abbasa, \u003c/span>o riječima: „U danu koji traje hiljadu godina koje vi brojite.“ Rekao je: „To je šest dana u kojima je Allah stvorio nebesa i Zemlju.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Es-Sedžda, 32:5, dio ajeta.⟧\u003c/span>"},{"id":"59.4","ar":"حَدَّثَنَا عبدة، حَدَّثَنِي الحسين بن الفرج، قال: سمعت أبا معاذ يقول: أخبرنا عبيد، قال: سمعت الضحاك يقول في قوله: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ» : يعني هذا اليوم من الأيام الستة التي خلق الله فيهن السموات والأرض وما بينهما.","bs":"Pričao nam je Abde: pričao mi je Husejn ibn el-Feredž, koji je rekao: čuo sam Ebu Muaza kako kaže: obavijestio nas je Ubejd, koji je rekao: čuo sam Dahhaka kako, o riječima: „U danu koji traje hiljadu godina koje vi brojite“, kaže: „Misli se na ovaj dan iz šest dana u kojima je Allah stvorio nebesa, Zemlju i ono što je između njih.“ ⟦Prijevod kur’anskog navoda: Es-Sedžda, 32:5, dio ajeta.⟧","ar_ranges":[[0,105]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا عبدة، حَدَّثَنِي الحسين بن الفرج، قال: سمعت أبا معاذ يقول: أخبرنا عبيد، قال: سمعت الضحاك يقول \u003c/span>في قوله: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ» : يعني هذا اليوم من الأيام الستة التي خلق الله فيهن السموات والأرض وما بينهما.","bs_ranges":[[0,162]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Abde: pričao mi je Husejn ibn el-Feredž, koji je rekao: čuo sam Ebu Muaza kako kaže: obavijestio nas je Ubejd, koji je rekao: čuo sam Dahhaka kako, \u003c/span>o riječima: „U danu koji traje hiljadu godina koje vi brojite“, kaže: „Misli se na ovaj dan iz šest dana u kojima je Allah stvorio nebesa, Zemlju i ono što je između njih.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Es-Sedžda, 32:5, dio ajeta.⟧\u003c/span>"},{"id":"59.5","ar":"حَدَّثَنِي المثنى، حَدَّثَنَا علي، عن المسيب بن شريك، عن أبي روق، عن الضحاك: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» .\n\nقال: من ايام الآخرة، كل يوم كان مقداره ألف سنة، ابتدأ في الخلق يوم الأحد، واجتمع الخلق يوم الجمعة.","bs":"Pričao mi je Musenna: pričao nam je Ali, od Musejjeba ibn Šerika, od Ebu Revka, od Dahhaka, o riječima: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Rekao je: „Od dana budućeg svijeta; svaki dan trajao je hiljadu godina. Stvaranje je započeo u nedjelju, a stvaranje je objedinjeno u petak.“ ⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧","ar_ranges":[[0,77]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي المثنى، حَدَّثَنَا علي، عن المسيب بن شريك، عن أبي روق، عن الضحاك: \u003c/span>«وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» .\n\nقال: من ايام الآخرة، كل يوم كان مقداره ألف سنة، ابتدأ في الخلق يوم الأحد، واجتمع الخلق يوم الجمعة.","bs_ranges":[[0,92]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musenna: pričao nam je Ali, od Musejjeba ibn Šerika, od Ebu Revka, od Dahhaka, \u003c/span>o riječima: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Rekao je: „Od dana budućeg svijeta; svaki dan trajao je hiljadu godina. Stvaranje je započeo u nedjelju, a stvaranje je objedinjeno u petak.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>"},{"id":"59.6","ar":"حَدَّثَنَا ابن حميد قَالَ: حَدَّثَنَا جرير، عن الأعمش، عن أبي صالح: عن كعب، قال: بدأ الله خلق السموات والأرض يوم الأحد والاثنين والثلاثاء والأربعاء والخميس، وفرغ منها يوم الجمعة، قال: فجعل مكان كل يوم ألف سنة","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Džerir, od A‘meša, od Ebu Saliha, od Ka‘ba, koji je rekao: „Allah je započeo stvaranje nebesa i Zemlje u nedjelju, ponedjeljak, utorak, srijedu i četvrtak, a dovršio ga je u petak.“ Rekao je: „Na mjesto svakog dana postavio je hiljadu godina.“","ar_ranges":[[0,81]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد قَالَ: حَدَّثَنَا جرير، عن الأعمش، عن أبي صالح: عن كعب، قال: \u003c/span>بدأ الله خلق السموات والأرض يوم الأحد والاثنين والثلاثاء والأربعاء والخميس، وفرغ منها يوم الجمعة، قال: فجعل مكان كل يوم ألف سنة","bs_ranges":[[0,114]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Džerir, od A‘meša, od Ebu Saliha, od Ka‘ba, koji je rekao: \u003c/span>„Allah je započeo stvaranje nebesa i Zemlje u nedjelju, ponedjeljak, utorak, srijedu i četvrtak, a dovršio ga je u petak.“ Rekao je: „Na mjesto svakog dana postavio je hiljadu godina.“"}],"notes":[]},{"n":60,"ar":"حَدَّثَنِي الْمُثَنَّى، قَالَ: حَدَّثَنَا الْحَجَّاجُ، حَدَّثَنَا أَبُو عوانة، عن أبي بشر، عن مجاهد، قال: يَوْمٌ مِنَ السِّتَّةِ الأَيَّامِ، كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ.\nفهذا هذا وبعد، فلا وجه لقول قائل: وكيف يوصف الله تعالى ذكره بأنه خلق السموات والأرض وما بينهما في ستة أيام قدر مدتها من أيام الدنيا ستة آلاف سنة، وإنما أمره إذا أراد شيئا أن يقول له: كن فيكون، لأنه لا شيء يتوهمه متوهم في قول قائل ذلك إلا وهو موجود في قول قائل: خلق ذلك كله في ستة أيام مدتها مدة ستة أيام من أيام الدنيا، لأن أمره جل جلاله إذا أراد شيئا أن يقول له كن فيكون","bs":"\u003cp data-paragraph=\"60.1\">Pričao mi je Musenna, koji je rekao: pričao nam je Hadždžadž: pričao nam je Ebu Avana, od Ebu Bišra, od Mudžahida, koji je rekao: „Jedan od šest dana bio je poput hiljadu godina koje vi brojite.“\u003c/p>\u003cp data-paragraph=\"60.2\">Tako stoji s ovim. Osim toga, nema osnove za riječi onoga koji pita: „Kako se Allah, Uzvišen je spomen Njegov, opisuje da je stvorio nebesa, Zemlju i ono što je između njih u šest dana čije je trajanje šest hiljada godina ovoga svijeta, kada je Njegova naredba, ako nešto želi, samo da tome kaže: Budi! — i ono bude?“ Jer nema ničega što bi neko mogao prigovoriti takvoj tvrdnji a da se to isto ne bi moglo prigovoriti tvrdnji da je sve to stvorio u šest dana koji traju šest dana ovoga svijeta. Njegova je naredba, Uzvišeno je Njegovo veličanstvo, kada nešto želi, samo da tome kaže: Budi! — i ono bude.\u003c/p>","paragraphs":[{"id":"60.1","ar":"حَدَّثَنِي الْمُثَنَّى، قَالَ: حَدَّثَنَا الْحَجَّاجُ، حَدَّثَنَا أَبُو عوانة، عن أبي بشر، عن مجاهد، قال: يَوْمٌ مِنَ السِّتَّةِ الأَيَّامِ، كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ.","bs":"Pričao mi je Musenna, koji je rekao: pričao nam je Hadždžadž: pričao nam je Ebu Avana, od Ebu Bišra, od Mudžahida, koji je rekao: „Jedan od šest dana bio je poput hiljadu godina koje vi brojite.“","ar_ranges":[[0,106]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى، قَالَ: حَدَّثَنَا الْحَجَّاجُ، حَدَّثَنَا أَبُو عوانة، عن أبي بشر، عن مجاهد، قال: \u003c/span>يَوْمٌ مِنَ السِّتَّةِ الأَيَّامِ، كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ.","bs_ranges":[[0,130]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musenna, koji je rekao: pričao nam je Hadždžadž: pričao nam je Ebu Avana, od Ebu Bišra, od Mudžahida, koji je rekao: \u003c/span>„Jedan od šest dana bio je poput hiljadu godina koje vi brojite.“"},{"id":"60.2","ar":"فهذا هذا وبعد، فلا وجه لقول قائل: وكيف يوصف الله تعالى ذكره بأنه خلق السموات والأرض وما بينهما في ستة أيام قدر مدتها من أيام الدنيا ستة آلاف سنة، وإنما أمره إذا أراد شيئا أن يقول له: كن فيكون، لأنه لا شيء يتوهمه متوهم في قول قائل ذلك إلا وهو موجود في قول قائل: خلق ذلك كله في ستة أيام مدتها مدة ستة أيام من أيام الدنيا، لأن أمره جل جلاله إذا أراد شيئا أن يقول له كن فيكون","bs":"Tako stoji s ovim. Osim toga, nema osnove za riječi onoga koji pita: „Kako se Allah, Uzvišen je spomen Njegov, opisuje da je stvorio nebesa, Zemlju i ono što je između njih u šest dana čije je trajanje šest hiljada godina ovoga svijeta, kada je Njegova naredba, ako nešto želi, samo da tome kaže: Budi! — i ono bude?“ Jer nema ničega što bi neko mogao prigovoriti takvoj tvrdnji a da se to isto ne bi moglo prigovoriti tvrdnji da je sve to stvorio u šest dana koji traju šest dana ovoga svijeta. Njegova je naredba, Uzvišeno je Njegovo veličanstvo, kada nešto želi, samo da tome kaže: Budi! — i ono bude.","ar_ranges":[],"ar_html":"فهذا هذا وبعد، فلا وجه لقول قائل: وكيف يوصف الله تعالى ذكره بأنه خلق السموات والأرض وما بينهما في ستة أيام قدر مدتها من أيام الدنيا ستة آلاف سنة، وإنما أمره إذا أراد شيئا أن يقول له: كن فيكون، لأنه لا شيء يتوهمه متوهم في قول قائل ذلك إلا وهو موجود في قول قائل: خلق ذلك كله في ستة أيام مدتها مدة ستة أيام من أيام الدنيا، لأن أمره جل جلاله إذا أراد شيئا أن يقول له كن فيكون","bs_ranges":[],"bs_html":"Tako stoji s ovim. Osim toga, nema osnove za riječi onoga koji pita: „Kako se Allah, Uzvišen je spomen Njegov, opisuje da je stvorio nebesa, Zemlju i ono što je između njih u šest dana čije je trajanje šest hiljada godina ovoga svijeta, kada je Njegova naredba, ako nešto želi, samo da tome kaže: Budi! — i ono bude?“ Jer nema ničega što bi neko mogao prigovoriti takvoj tvrdnji a da se to isto ne bi moglo prigovoriti tvrdnji da je sve to stvorio u šest dana koji traju šest dana ovoga svijeta. Njegova je naredba, Uzvišeno je Njegovo veličanstvo, kada nešto želi, samo da tome kaže: Budi! — i ono bude."}],"notes":[]},{"n":61,"ar":"[القول في الليل والنهار أيهما خلق قبل صاحبه]\nوفي بدء خلق الشمس والقمر وصفتهما إذ كانت الأزمنة بهما تعرف قد قلنا في خلق الله عز ذكره ما خلق من الأشياء قبل خلقه الأوقات والأزمنة، وبيَّنَّا أن الأوقات والأزمنة إنما هي ساعات الليل والنهار، وأن ذلك إنما هو قطع الشمس والقمر درجات الفلك، فلنقل الآن: بأي ذلك كان الابتداء، بالليل أم بالنهار؟ إذ كان الاختلاف في ذلك موجودا بين ذوي النظر فيه، بأن بعضهم يقول فيه: خلق الله الليل قبل النهار، ويستشهد على حقيقة قوله ذلك بأن الشمس إذا غابت وذهب ضوءها الذي هو نهار هجم الليل بظلامه، فكان معلوما بذلك أن الضياء هو المتورد على الليل، وأن الليل إن لم يبطله النهار المتورد عليه هو الثابت، فكان بذلك من أمرهما دلالة على أن الليل هو الأول خلقا، وأن الشمس هو الآخر منهما خلقا، وهذا قول يروى عن ابن عباس.\nحَدَّثَنَا ابْنُ بَشَّارٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ، عَنْ سُفْيَانَ، عَنْ أَبِيهِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: سُئِلَ: هَلِ اللَّيْلُ كَانَ قَبْلَ النَّهَارِ؟.\n\nقَالَ: أَرَأَيْتُمْ حِينَ كَانَتِ السَّمَوَاتُ وَالأَرْضُ رَتْقًا، هَلْ كَانَ بَيْنَهُمَا إِلا ظُلْمَةٌ! ذَلِكَ لِتَعْلَمُوا أَنَّ اللَّيْلَ كَانَ قَبْلَ النَّهَارِ.\nحَدَّثَنَا الْحَسَنُ بْنُ يَحْيَى، قَالَ: أَخْبَرَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا الثَّوْرِيُّ، عَنْ أَبِيهِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّيْلَ قَبْلَ النَّهَارِ، ثُمَّ قال: «كانَتا رَتْقاً فَفَتَقْناهُما» .\n\nحَدَّثَنَا محمد بن بشار، قال: حَدَّثَنَا وهب بن جرير، حَدَّثَنَا أبي، قال: سمعت يحيى بن أيوب يحدث عن يزيد بن أبي حبيب، عن مرثد","bs":"\u003cp data-paragraph=\"61.1\">Rasprava o noći i danu: šta je od njih prvo stvoreno?\u003c/p>\u003cp data-paragraph=\"61.2\">I o početku stvaranja Sunca i Mjeseca i njihovim svojstvima, jer se pomoću njih poznaju vremena. Već smo govorili o tome šta je Allah, Silan je spomen Njegov, stvorio prije stvaranja vremenskih odsječaka i razdoblja. Objasnili smo da su vremenski odsječci i razdoblja zapravo sati noći i dana, a da su oni prelaženje Sunca i Mjeseca preko stupnjeva nebeske putanje. Sada ćemo govoriti o tome čime je započeto: noću ili danom. O tome postoji razilaženje među onima koji to razmatraju. Neki kažu da je Allah stvorio noć prije dana. Kao dokaz za istinitost svojih riječi navode da, kada Sunce zađe i nestane njegove svjetlosti, koja je dan, nastupi noć sa svojom tamom. Time se, kažu, zna da svjetlost dolazi na noć i da noć ostaje ako je ne ukloni dan koji dolazi na nju. Takvo stanje njih dvoje ukazuje da je noć prva stvorena, a Sunce stvoreno poslije nje. Ovo mišljenje prenosi se od Ibn Abbasa.\u003c/p>\u003cp data-paragraph=\"61.3\">Pričao nam je Ibn Beššar: pričao nam je Abdurrahman, od Sufjana, od njegovog oca, od Ikrime, od Ibn Abbasa, koji je rekao da je upitan: „Je li noć bila prije dana?“ Odgovorio je: „Recite mi: kada su nebesa i Zemlja bili spojeni, je li između njih bilo išta osim tame? To je zato da znate da je noć bila prije dana.“\u003c/p>\u003cp data-paragraph=\"61.4\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak: obavijestio nas je Sevri, od svoga oca, od Ikrime, od Ibn Abbasa, koji je rekao: „Noć je prije dana.“ Zatim je naveo: „Bili su spojena cjelina, pa smo ih razdvojili.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:30, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"61.5\">Pričao nam je Muhammed ibn Beššar, koji je rekao: pričao nam je Vehb ibn Džerir: pričao nam je moj otac, koji je rekao: čuo sam Jahjaa ibn Ejjuba kako prenosi od Jezida ibn Ebu Habiba, od Merseda\u003c/p>","paragraphs":[{"id":"61.1","ar":"[القول في الليل والنهار أيهما خلق قبل صاحبه]","bs":"Rasprava o noći i danu: šta je od njih prvo stvoreno?","ar_ranges":[],"ar_html":"[القول في الليل والنهار أيهما خلق قبل صاحبه]","bs_ranges":[],"bs_html":"Rasprava o noći i danu: šta je od njih prvo stvoreno?"},{"id":"61.2","ar":"وفي بدء خلق الشمس والقمر وصفتهما إذ كانت الأزمنة بهما تعرف قد قلنا في خلق الله عز ذكره ما خلق من الأشياء قبل خلقه الأوقات والأزمنة، وبيَّنَّا أن الأوقات والأزمنة إنما هي ساعات الليل والنهار، وأن ذلك إنما هو قطع الشمس والقمر درجات الفلك، فلنقل الآن: بأي ذلك كان الابتداء، بالليل أم بالنهار؟ إذ كان الاختلاف في ذلك موجودا بين ذوي النظر فيه، بأن بعضهم يقول فيه: خلق الله الليل قبل النهار، ويستشهد على حقيقة قوله ذلك بأن الشمس إذا غابت وذهب ضوءها الذي هو نهار هجم الليل بظلامه، فكان معلوما بذلك أن الضياء هو المتورد على الليل، وأن الليل إن لم يبطله النهار المتورد عليه هو الثابت، فكان بذلك من أمرهما دلالة على أن الليل هو الأول خلقا، وأن الشمس هو الآخر منهما خلقا، وهذا قول يروى عن ابن عباس.","bs":"I o početku stvaranja Sunca i Mjeseca i njihovim svojstvima, jer se pomoću njih poznaju vremena. Već smo govorili o tome šta je Allah, Silan je spomen Njegov, stvorio prije stvaranja vremenskih odsječaka i razdoblja. Objasnili smo da su vremenski odsječci i razdoblja zapravo sati noći i dana, a da su oni prelaženje Sunca i Mjeseca preko stupnjeva nebeske putanje. Sada ćemo govoriti o tome čime je započeto: noću ili danom. O tome postoji razilaženje među onima koji to razmatraju. Neki kažu da je Allah stvorio noć prije dana. Kao dokaz za istinitost svojih riječi navode da, kada Sunce zađe i nestane njegove svjetlosti, koja je dan, nastupi noć sa svojom tamom. Time se, kažu, zna da svjetlost dolazi na noć i da noć ostaje ako je ne ukloni dan koji dolazi na nju. Takvo stanje njih dvoje ukazuje da je noć prva stvorena, a Sunce stvoreno poslije nje. Ovo mišljenje prenosi se od Ibn Abbasa.","ar_ranges":[],"ar_html":"وفي بدء خلق الشمس والقمر وصفتهما إذ كانت الأزمنة بهما تعرف قد قلنا في خلق الله عز ذكره ما خلق من الأشياء قبل خلقه الأوقات والأزمنة، وبيَّنَّا أن الأوقات والأزمنة إنما هي ساعات الليل والنهار، وأن ذلك إنما هو قطع الشمس والقمر درجات الفلك، فلنقل الآن: بأي ذلك كان الابتداء، بالليل أم بالنهار؟ إذ كان الاختلاف في ذلك موجودا بين ذوي النظر فيه، بأن بعضهم يقول فيه: خلق الله الليل قبل النهار، ويستشهد على حقيقة قوله ذلك بأن الشمس إذا غابت وذهب ضوءها الذي هو نهار هجم الليل بظلامه، فكان معلوما بذلك أن الضياء هو المتورد على الليل، وأن الليل إن لم يبطله النهار المتورد عليه هو الثابت، فكان بذلك من أمرهما دلالة على أن الليل هو الأول خلقا، وأن الشمس هو الآخر منهما خلقا، وهذا قول يروى عن ابن عباس.","bs_ranges":[],"bs_html":"I o početku stvaranja Sunca i Mjeseca i njihovim svojstvima, jer se pomoću njih poznaju vremena. Već smo govorili o tome šta je Allah, Silan je spomen Njegov, stvorio prije stvaranja vremenskih odsječaka i razdoblja. Objasnili smo da su vremenski odsječci i razdoblja zapravo sati noći i dana, a da su oni prelaženje Sunca i Mjeseca preko stupnjeva nebeske putanje. Sada ćemo govoriti o tome čime je započeto: noću ili danom. O tome postoji razilaženje među onima koji to razmatraju. Neki kažu da je Allah stvorio noć prije dana. Kao dokaz za istinitost svojih riječi navode da, kada Sunce zađe i nestane njegove svjetlosti, koja je dan, nastupi noć sa svojom tamom. Time se, kažu, zna da svjetlost dolazi na noć i da noć ostaje ako je ne ukloni dan koji dolazi na nju. Takvo stanje njih dvoje ukazuje da je noć prva stvorena, a Sunce stvoreno poslije nje. Ovo mišljenje prenosi se od Ibn Abbasa."},{"id":"61.3","ar":"حَدَّثَنَا ابْنُ بَشَّارٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ، عَنْ سُفْيَانَ، عَنْ أَبِيهِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: سُئِلَ: هَلِ اللَّيْلُ كَانَ قَبْلَ النَّهَارِ؟.\n\nقَالَ: أَرَأَيْتُمْ حِينَ كَانَتِ السَّمَوَاتُ وَالأَرْضُ رَتْقًا، هَلْ كَانَ بَيْنَهُمَا إِلا ظُلْمَةٌ! ذَلِكَ لِتَعْلَمُوا أَنَّ اللَّيْلَ كَانَ قَبْلَ النَّهَارِ.","bs":"Pričao nam je Ibn Beššar: pričao nam je Abdurrahman, od Sufjana, od njegovog oca, od Ikrime, od Ibn Abbasa, koji je rekao da je upitan: „Je li noć bila prije dana?“ Odgovorio je: „Recite mi: kada su nebesa i Zemlja bili spojeni, je li između njih bilo išta osim tame? To je zato da znate da je noć bila prije dana.“","ar_ranges":[[0,132]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ، عَنْ سُفْيَانَ، عَنْ أَبِيهِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>سُئِلَ: هَلِ اللَّيْلُ كَانَ قَبْلَ النَّهَارِ؟.\n\nقَالَ: أَرَأَيْتُمْ حِينَ كَانَتِ السَّمَوَاتُ وَالأَرْضُ رَتْقًا، هَلْ كَانَ بَيْنَهُمَا إِلا ظُلْمَةٌ! ذَلِكَ لِتَعْلَمُوا أَنَّ اللَّيْلَ كَانَ قَبْلَ النَّهَارِ.","bs_ranges":[[0,122]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar: pričao nam je Abdurrahman, od Sufjana, od njegovog oca, od Ikrime, od Ibn Abbasa, koji je rekao \u003c/span>da je upitan: „Je li noć bila prije dana?“ Odgovorio je: „Recite mi: kada su nebesa i Zemlja bili spojeni, je li između njih bilo išta osim tame? To je zato da znate da je noć bila prije dana.“"},{"id":"61.4","ar":"حَدَّثَنَا الْحَسَنُ بْنُ يَحْيَى، قَالَ: أَخْبَرَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا الثَّوْرِيُّ، عَنْ أَبِيهِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّيْلَ قَبْلَ النَّهَارِ، ثُمَّ قال: «كانَتا رَتْقاً فَفَتَقْناهُما» .","bs":"Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak: obavijestio nas je Sevri, od svoga oca, od Ikrime, od Ibn Abbasa, koji je rekao: „Noć je prije dana.“ Zatim je naveo: „Bili su spojena cjelina, pa smo ih razdvojili.“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:30, dio ajeta.⟧","ar_ranges":[[0,159]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا الْحَسَنُ بْنُ يَحْيَى، قَالَ: أَخْبَرَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا الثَّوْرِيُّ، عَنْ أَبِيهِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ اللَّيْلَ قَبْلَ النَّهَارِ، ثُمَّ قال: «كانَتا رَتْقاً فَفَتَقْناهُما» .","bs_ranges":[[0,159]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak: obavijestio nas je Sevri, od svoga oca, od Ikrime, od Ibn Abbasa, koji je rekao: \u003c/span>„Noć je prije dana.“ Zatim je naveo: „Bili su spojena cjelina, pa smo ih razdvojili.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:30, dio ajeta.⟧\u003c/span>"},{"id":"61.5","ar":"حَدَّثَنَا محمد بن بشار، قال: حَدَّثَنَا وهب بن جرير، حَدَّثَنَا أبي، قال: سمعت يحيى بن أيوب يحدث عن يزيد بن أبي حبيب، عن مرثد","bs":"Pričao nam je Muhammed ibn Beššar, koji je rekao: pričao nam je Vehb ibn Džerir: pričao nam je moj otac, koji je rekao: čuo sam Jahjaa ibn Ejjuba kako prenosi od Jezida ibn Ebu Habiba, od Merseda","ar_ranges":[[0,126]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا محمد بن بشار، قال: حَدَّثَنَا وهب بن جرير، حَدَّثَنَا أبي، قال: سمعت يحيى بن أيوب يحدث عن يزيد بن أبي حبيب، عن مرثد\u003c/span>","bs_ranges":[[0,195]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Beššar, koji je rekao: pričao nam je Vehb ibn Džerir: pričao nam je moj otac, koji je rekao: čuo sam Jahjaa ibn Ejjuba kako prenosi od Jezida ibn Ebu Habiba, od Merseda\u003c/span>"}],"notes":[]},{"n":62,"ar":"ابن عبد الله اليزني، قال: لم يكن عقبة بن عامر إذا رأى الهلال- هلال رمضان- يقوم تلك الليلة حتى يصوم يومها، ثم يقوم بعد ذلك فذكرت ذلك لابن حجيرة فقال: الليل قبل النهار أم النهار قبل الليل؟\nوقال آخرون: كان النهار قبل الليل، واستشهدوا لصحة قولهم هذا بأن الله عز ذكره كان ولا ليل ولا نهار ولا شيء غيره، وأن نوره كان يضيء به كل شيء خلقه بعد ما خلقه حتى خلق الليل.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\nحَدَّثَنِي عَلِيُّ بْنُ سَهْلٍ، حَدَّثَنَا الْحَسَنُ بْنُ بِلالٍ، قَالَ: حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنِ الزُّبَيْرِ أَبِي عَبْدِ السَّلامِ، عَنْ أَيُّوبَ بْنِ عَبْدِ اللَّهِ الْفِهْرِيِّ أَنَّ ابْنَ مَسْعُودٍ قَالَ: إِنَّ رَبَّكُمْ لَيْسَ عِنْدَهُ لَيْلٌ وَلا نَهَارٌ، نُورُ السَّمَوَاتِ مِنْ نُورِ وَجْهِهِ، وَإِنَّ مِقْدَارَ كُلِّ يَوْمٍ مِنْ أَيَّامِكُمْ هَذِهِ عِنْدَهُ اثْنَتَا عَشْرَةَ سَاعَةً.\n\nقال أبو جعفر: وأولى القولين في ذلك عندي بالصواب قول من قال:\nكان الليل قبل النهار، لأن النهار هو ما ذكرت من ضوء الشمس، وإنما خلق الله الشمس وأجراها في الفلك بعد ما دحا الأرض فبسطها، كما قال عز وجل: «أَأَنْتُمْ أَشَدُّ خَلْقاً أَمِ السَّماءُ بَناها رَفَعَ سَمْكَها فَسَوَّاها وَأَغْطَشَ لَيْلَها وَأَخْرَجَ ضُحاها» ، فإذا كانت الشمس خلقت بعد ما سمكت السماء، وأغطش ليلها، فمعلوم أنها كانت- قبل أن تخلق الشمس، وقبل أن يخرج الله من السماء ضحاها- مظلمة لا مضيئة.\n\nوبعد، فإن في مشاهدتنا من أمر الليل والنهار ما نشاهده دليلا بَيِّنًا","bs":"\u003cp data-paragraph=\"62.1\">ibn Abdullaha el-Jezenija, koji je rekao: „Kada bi Ukba ibn Amir ugledao mlađak — ramazanski mlađak — te noći ne bi klanjao noćni namaz dok ne bi ispostio njen dan, a nakon toga bi klanjao noćni namaz. To sam spomenuo Ibn Hudžejri, pa je rekao: ‘Je li noć prije dana ili dan prije noći?’“\u003c/p>\u003cp data-paragraph=\"62.2\">Drugi su rekli da je dan bio prije noći. Kao dokaz ispravnosti svojih riječi navode da je Allah, Silan je spomen Njegov, bio kada nije bilo ni noći, ni dana, niti ičega osim Njega, te da je Njegova svjetlost osvjetljavala sve što je stvorio, nakon što bi to stvorio, sve dok nije stvorio noć.\u003c/p>\u003cp data-paragraph=\"62.3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"62.4\">Pričao mi je Ali ibn Sehl: pričao nam je Hasen ibn Bilal, koji je rekao: pričao nam je Hammad ibn Selema, od Zubejra Ebu Abdusselama, od Ejjuba ibn Abdullaha el-Fihrija, da je Ibn Mesud rekao: „Kod vašeg Gospodara nema ni noći ni dana. Svjetlost nebesa potječe od svjetlosti Njegovog Lica. Svaki od ovih vaših dana kod Njega traje dvanaest sati.“\u003c/p>\u003cp data-paragraph=\"62.5\">Ebu Džafer kaže: Od dva mišljenja, smatram ispravnijim ono prema kojem je noć bila prije dana. Dan je ono što sam spomenuo: Sunčeva svjetlost. Allah je stvorio Sunce i pokrenuo ga nebeskom putanjom tek nakon što je rasprostro i pružio Zemlju, kako je rekao On, Silan i Uzvišen: „Jeste li vi teži za stvaranje ili nebo? On ga je izgradio; podigao je njegov svod i uredio ga; njegovu noć učinio je tamnom i izveo njegovo jutarnje svjetlo.“ Ako je Sunce stvoreno nakon što je nebo podignuto i njegova noć učinjena tamnom, onda je poznato da je nebo, prije nego što je Sunce stvoreno i prije nego što je Allah iz njega izveo njegovo jutarnje svjetlo, bilo tamno, a ne svijetlo. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Naziat, 79:27–29.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"62.6\">Osim toga, ono što svojim očima opažamo o noći i danu jasan je dokaz\u003c/p>","paragraphs":[{"id":"62.1","ar":"ابن عبد الله اليزني، قال: لم يكن عقبة بن عامر إذا رأى الهلال- هلال رمضان- يقوم تلك الليلة حتى يصوم يومها، ثم يقوم بعد ذلك فذكرت ذلك لابن حجيرة فقال: الليل قبل النهار أم النهار قبل الليل؟","bs":"ibn Abdullaha el-Jezenija, koji je rekao: „Kada bi Ukba ibn Amir ugledao mlađak — ramazanski mlađak — te noći ne bi klanjao noćni namaz dok ne bi ispostio njen dan, a nakon toga bi klanjao noćni namaz. To sam spomenuo Ibn Hudžejri, pa je rekao: ‘Je li noć prije dana ili dan prije noći?’“","ar_ranges":[[0,26]],"ar_html":"\u003cspan class=\"isnad\">ابن عبد الله اليزني، قال: \u003c/span>لم يكن عقبة بن عامر إذا رأى الهلال- هلال رمضان- يقوم تلك الليلة حتى يصوم يومها، ثم يقوم بعد ذلك فذكرت ذلك لابن حجيرة فقال: الليل قبل النهار أم النهار قبل الليل؟","bs_ranges":[[0,42]],"bs_html":"\u003cspan class=\"isnad\">ibn Abdullaha el-Jezenija, koji je rekao: \u003c/span>„Kada bi Ukba ibn Amir ugledao mlađak — ramazanski mlađak — te noći ne bi klanjao noćni namaz dok ne bi ispostio njen dan, a nakon toga bi klanjao noćni namaz. To sam spomenuo Ibn Hudžejri, pa je rekao: ‘Je li noć prije dana ili dan prije noći?’“"},{"id":"62.2","ar":"وقال آخرون: كان النهار قبل الليل، واستشهدوا لصحة قولهم هذا بأن الله عز ذكره كان ولا ليل ولا نهار ولا شيء غيره، وأن نوره كان يضيء به كل شيء خلقه بعد ما خلقه حتى خلق الليل.","bs":"Drugi su rekli da je dan bio prije noći. Kao dokaz ispravnosti svojih riječi navode da je Allah, Silan je spomen Njegov, bio kada nije bilo ni noći, ni dana, niti ičega osim Njega, te da je Njegova svjetlost osvjetljavala sve što je stvorio, nakon što bi to stvorio, sve dok nije stvorio noć.","ar_ranges":[],"ar_html":"وقال آخرون: كان النهار قبل الليل، واستشهدوا لصحة قولهم هذا بأن الله عز ذكره كان ولا ليل ولا نهار ولا شيء غيره، وأن نوره كان يضيء به كل شيء خلقه بعد ما خلقه حتى خلق الليل.","bs_ranges":[],"bs_html":"Drugi su rekli da je dan bio prije noći. Kao dokaz ispravnosti svojih riječi navode da je Allah, Silan je spomen Njegov, bio kada nije bilo ni noći, ni dana, niti ičega osim Njega, te da je Njegova svjetlost osvjetljavala sve što je stvorio, nakon što bi to stvorio, sve dok nije stvorio noć."},{"id":"62.3","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"62.4","ar":"حَدَّثَنِي عَلِيُّ بْنُ سَهْلٍ، حَدَّثَنَا الْحَسَنُ بْنُ بِلالٍ، قَالَ: حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنِ الزُّبَيْرِ أَبِي عَبْدِ السَّلامِ، عَنْ أَيُّوبَ بْنِ عَبْدِ اللَّهِ الْفِهْرِيِّ أَنَّ ابْنَ مَسْعُودٍ قَالَ: إِنَّ رَبَّكُمْ لَيْسَ عِنْدَهُ لَيْلٌ وَلا نَهَارٌ، نُورُ السَّمَوَاتِ مِنْ نُورِ وَجْهِهِ، وَإِنَّ مِقْدَارَ كُلِّ يَوْمٍ مِنْ أَيَّامِكُمْ هَذِهِ عِنْدَهُ اثْنَتَا عَشْرَةَ سَاعَةً.","bs":"Pričao mi je Ali ibn Sehl: pričao nam je Hasen ibn Bilal, koji je rekao: pričao nam je Hammad ibn Selema, od Zubejra Ebu Abdusselama, od Ejjuba ibn Abdullaha el-Fihrija, da je Ibn Mesud rekao: „Kod vašeg Gospodara nema ni noći ni dana. Svjetlost nebesa potječe od svjetlosti Njegovog Lica. Svaki od ovih vaših dana kod Njega traje dvanaest sati.“","ar_ranges":[[0,225]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي عَلِيُّ بْنُ سَهْلٍ، حَدَّثَنَا الْحَسَنُ بْنُ بِلالٍ، قَالَ: حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنِ الزُّبَيْرِ أَبِي عَبْدِ السَّلامِ، عَنْ أَيُّوبَ بْنِ عَبْدِ اللَّهِ الْفِهْرِيِّ أَنَّ ابْنَ مَسْعُودٍ قَالَ: \u003c/span>إِنَّ رَبَّكُمْ لَيْسَ عِنْدَهُ لَيْلٌ وَلا نَهَارٌ، نُورُ السَّمَوَاتِ مِنْ نُورِ وَجْهِهِ، وَإِنَّ مِقْدَارَ كُلِّ يَوْمٍ مِنْ أَيَّامِكُمْ هَذِهِ عِنْدَهُ اثْنَتَا عَشْرَةَ سَاعَةً.","bs_ranges":[[0,170]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ali ibn Sehl: pričao nam je Hasen ibn Bilal, koji je rekao: pričao nam je Hammad ibn Selema, od Zubejra Ebu Abdusselama, od Ejjuba ibn Abdullaha el-Fihrija, \u003c/span>da je Ibn Mesud rekao: „Kod vašeg Gospodara nema ni noći ni dana. Svjetlost nebesa potječe od svjetlosti Njegovog Lica. Svaki od ovih vaših dana kod Njega traje dvanaest sati.“"},{"id":"62.5","ar":"قال أبو جعفر: وأولى القولين في ذلك عندي بالصواب قول من قال:\nكان الليل قبل النهار، لأن النهار هو ما ذكرت من ضوء الشمس، وإنما خلق الله الشمس وأجراها في الفلك بعد ما دحا الأرض فبسطها، كما قال عز وجل: «أَأَنْتُمْ أَشَدُّ خَلْقاً أَمِ السَّماءُ بَناها رَفَعَ سَمْكَها فَسَوَّاها وَأَغْطَشَ لَيْلَها وَأَخْرَجَ ضُحاها» ، فإذا كانت الشمس خلقت بعد ما سمكت السماء، وأغطش ليلها، فمعلوم أنها كانت- قبل أن تخلق الشمس، وقبل أن يخرج الله من السماء ضحاها- مظلمة لا مضيئة.","bs":"Ebu Džafer kaže: Od dva mišljenja, smatram ispravnijim ono prema kojem je noć bila prije dana. Dan je ono što sam spomenuo: Sunčeva svjetlost. Allah je stvorio Sunce i pokrenuo ga nebeskom putanjom tek nakon što je rasprostro i pružio Zemlju, kako je rekao On, Silan i Uzvišen: „Jeste li vi teži za stvaranje ili nebo? On ga je izgradio; podigao je njegov svod i uredio ga; njegovu noć učinio je tamnom i izveo njegovo jutarnje svjetlo.“ Ako je Sunce stvoreno nakon što je nebo podignuto i njegova noć učinjena tamnom, onda je poznato da je nebo, prije nego što je Sunce stvoreno i prije nego što je Allah iz njega izveo njegovo jutarnje svjetlo, bilo tamno, a ne svijetlo. ⟦Prijevod kur’anskog navoda: En-Naziat, 79:27–29.⟧","ar_ranges":[],"ar_html":"قال أبو جعفر: وأولى القولين في ذلك عندي بالصواب قول من قال:\nكان الليل قبل النهار، لأن النهار هو ما ذكرت من ضوء الشمس، وإنما خلق الله الشمس وأجراها في الفلك بعد ما دحا الأرض فبسطها، كما قال عز وجل: «أَأَنْتُمْ أَشَدُّ خَلْقاً أَمِ السَّماءُ بَناها رَفَعَ سَمْكَها فَسَوَّاها وَأَغْطَشَ لَيْلَها وَأَخْرَجَ ضُحاها» ، فإذا كانت الشمس خلقت بعد ما سمكت السماء، وأغطش ليلها، فمعلوم أنها كانت- قبل أن تخلق الشمس، وقبل أن يخرج الله من السماء ضحاها- مظلمة لا مضيئة.","bs_ranges":[],"bs_html":"Ebu Džafer kaže: Od dva mišljenja, smatram ispravnijim ono prema kojem je noć bila prije dana. Dan je ono što sam spomenuo: Sunčeva svjetlost. Allah je stvorio Sunce i pokrenuo ga nebeskom putanjom tek nakon što je rasprostro i pružio Zemlju, kako je rekao On, Silan i Uzvišen: „Jeste li vi teži za stvaranje ili nebo? On ga je izgradio; podigao je njegov svod i uredio ga; njegovu noć učinio je tamnom i izveo njegovo jutarnje svjetlo.“ Ako je Sunce stvoreno nakon što je nebo podignuto i njegova noć učinjena tamnom, onda je poznato da je nebo, prije nego što je Sunce stvoreno i prije nego što je Allah iz njega izveo njegovo jutarnje svjetlo, bilo tamno, a ne svijetlo. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Naziat, 79:27–29.⟧\u003c/span>"},{"id":"62.6","ar":"وبعد، فإن في مشاهدتنا من أمر الليل والنهار ما نشاهده دليلا بَيِّنًا","bs":"Osim toga, ono što svojim očima opažamo o noći i danu jasan je dokaz","ar_ranges":[],"ar_html":"وبعد، فإن في مشاهدتنا من أمر الليل والنهار ما نشاهده دليلا بَيِّنًا","bs_ranges":[],"bs_html":"Osim toga, ono što svojim očima opažamo o noći i danu jasan je dokaz"}],"notes":[]},{"n":63,"ar":"على أن النهار هو الهاجم على الليل لأن الشمس متى غابت فذهب ضوءها ليلا او نهارا أظلم الجو، فكان معلوما بذلك أن النهار هو الهاجم على الليل بضوئه ونوره والله أعلم.\n\nفأما القول في بدء خلقهما فإن الخبر عن رسول الله ص بوقت خلق الله الشمس والقمر مختلف.\nفأما ابْنِ عَبَّاسٍ فروي عنه أنه قال: خلق الله يوم الجمعة الشمس والقمر والنجوم والملائكة إلى ثلاث ساعات بقيت منه، حَدَّثَنَا بذلك هناد بن السري، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمه، عن ابن عباس، عن النبي ص.\n[وروى ابو هريرة عن النبي ص أنه قال: خلق الله النور يوم الأربعاء،] حَدَّثَنِي بِذَلِكَ الْقَاسِمُ بْنُ بِشْرٍ وَالْحُسَيْنُ بْنُ عَلِيٍّ، قَالا: حَدَّثَنَا حَجَّاجُ بْنُ مُحَمَّدٍ، عَنِ ابْنِ جُرَيْجٍ، عَنْ إِسْمَاعِيلَ بْنِ أُمَيَّةَ، عَنْ أيوب بن خالد، عن عبد الله بن رافع، عن ابى هريرة، عن النبي ص.\nوأي ذلك كان، فقد خلق الله قبل خلقه إياهما خلقا كثيرا غيرهما، ثم خلقهما عز وجل لما هو أعلم به من مصلحة خلقه، فجعلهما دائبي الجري، ثم فصل بينهما، فجعل إحداهما آية الليل، والأخرى أية النهار، فمحا آية الليل، وجعل آية النهار مبصره وقد روى عن رسول الله ص في سبب اختلاف حالتي آية الليل وآية النهار أخبار أنا ذاكر منها بعض ما حضرني ذكره وعن جماعة من السلف أيضا نحو ذلك.\n\nفمما روى عن رسول الله ص في ذلك، ما حَدَّثَنِي مُحَمَّدُ بْنُ أَبِي مَنْصُورٍ الآملي، حَدَّثَنَا خَلَفُ بْنُ وَاصِلٍ، قَالَ: حَدَّثَنَا عُمَرُ بْنُ","bs":"\u003cp data-paragraph=\"63.1\">da je dan taj koji nastupa na noć. Kada god Sunce zađe i njegova svjetlost nestane, noću ili danju, prostor se zamrači. Time se zna da je dan taj koji svojom svjetlošću i sjajem nastupa na noć. A Allah najbolje zna.\u003c/p>\u003cp data-paragraph=\"63.2\">Što se tiče govora o početku njihovog stvaranja, predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, o vremenu kada je Allah stvorio Sunce i Mjesec razlikuju se.\u003c/p>\u003cp data-paragraph=\"63.3\">Od Ibn Abbasa preneseno je da je rekao: „Allah je u petak stvorio Sunce, Mjesec, zvijezde i meleke, do preostala tri sata toga dana.“ To nam je pričao Hennad ibn es-Serijj, koji je rekao: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/p>\u003cp data-paragraph=\"63.4\">Ebu Hurejre prenio je od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Allah je stvorio svjetlost u srijedu.“ To su mi pričali Kasim ibn Bišr i Husejn ibn Ali; obojica su rekli: pričao nam je Hadždžadž ibn Muhammed, od Ibn Džurejdža, od Ismaila ibn Umejje, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/p>\u003cp data-paragraph=\"63.5\">Kako god bilo, prije stvaranja njih dvoje Allah je stvorio mnoga druga stvorenja. Potom ih je On, Silan i Uzvišen, stvorio zbog koristi za Svoja stvorenja koju najbolje zna. Učinio je da neprestano teku, zatim ih je razlikovao: jedno je učinio znakom noći, a drugo znakom dana. Znak noći je izbrisao, a znak dana učinio takvim da se pomoću njega vidi. Od Allahovog Poslanika, sallallahu alejhi ve sellem, prenesene su predaje o razlogu različitosti znaka noći i znaka dana. Spomenut ću neke od onih kojih se sada sjećam. Nešto slično preneseno je i od jedne skupine prethodnika.\u003c/p>\u003cp data-paragraph=\"63.6\">Među onim što je od Allahovog Poslanika, sallallahu alejhi ve sellem, o tome preneseno jeste ono što mi je pričao Muhammed ibn Ebu Mensur el-Amuli: pričao nam je Halef ibn Vasil, koji je rekao: pričao nam je Omer ibn\u003c/p>","paragraphs":[{"id":"63.1","ar":"على أن النهار هو الهاجم على الليل لأن الشمس متى غابت فذهب ضوءها ليلا او نهارا أظلم الجو، فكان معلوما بذلك أن النهار هو الهاجم على الليل بضوئه ونوره والله أعلم.","bs":"da je dan taj koji nastupa na noć. Kada god Sunce zađe i njegova svjetlost nestane, noću ili danju, prostor se zamrači. Time se zna da je dan taj koji svojom svjetlošću i sjajem nastupa na noć. A Allah najbolje zna.","ar_ranges":[],"ar_html":"على أن النهار هو الهاجم على الليل لأن الشمس متى غابت فذهب ضوءها ليلا او نهارا أظلم الجو، فكان معلوما بذلك أن النهار هو الهاجم على الليل بضوئه ونوره والله أعلم.","bs_ranges":[],"bs_html":"da je dan taj koji nastupa na noć. Kada god Sunce zađe i njegova svjetlost nestane, noću ili danju, prostor se zamrači. Time se zna da je dan taj koji svojom svjetlošću i sjajem nastupa na noć. A Allah najbolje zna."},{"id":"63.2","ar":"فأما القول في بدء خلقهما فإن الخبر عن رسول الله ص بوقت خلق الله الشمس والقمر مختلف.","bs":"Što se tiče govora o početku njihovog stvaranja, predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, o vremenu kada je Allah stvorio Sunce i Mjesec razlikuju se.","ar_ranges":[],"ar_html":"فأما القول في بدء خلقهما فإن الخبر عن رسول الله ص بوقت خلق الله الشمس والقمر مختلف.","bs_ranges":[],"bs_html":"Što se tiče govora o početku njihovog stvaranja, predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, o vremenu kada je Allah stvorio Sunce i Mjesec razlikuju se."},{"id":"63.3","ar":"فأما ابْنِ عَبَّاسٍ فروي عنه أنه قال: خلق الله يوم الجمعة الشمس والقمر والنجوم والملائكة إلى ثلاث ساعات بقيت منه، حَدَّثَنَا بذلك هناد بن السري، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمه، عن ابن عباس، عن النبي ص.\n[","bs":"Od Ibn Abbasa preneseno je da je rekao: „Allah je u petak stvorio Sunce, Mjesec, zvijezde i meleke, do preostala tri sata toga dana.“ To nam je pričao Hennad ibn es-Serijj, koji je rekao: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem.","ar_ranges":[[114,248]],"ar_html":"فأما ابْنِ عَبَّاسٍ فروي عنه أنه قال: خلق الله يوم الجمعة الشمس والقمر والنجوم والملائكة إلى ثلاث ساعات بقيت منه، \u003cspan class=\"isnad\">حَدَّثَنَا بذلك هناد بن السري، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمه، عن ابن عباس، عن النبي ص.\n[\u003c/span>","bs_ranges":[[137,319]],"bs_html":"Od Ibn Abbasa preneseno je da je rekao: „Allah je u petak stvorio Sunce, Mjesec, zvijezde i meleke, do preostala tri sata toga dana.“ To \u003cspan class=\"isnad\">nam je pričao Hennad ibn es-Serijj, koji je rekao: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/span>"},{"id":"63.4","ar":"وروى ابو هريرة عن النبي ص أنه قال: خلق الله النور يوم الأربعاء،] حَدَّثَنِي بِذَلِكَ الْقَاسِمُ بْنُ بِشْرٍ وَالْحُسَيْنُ بْنُ عَلِيٍّ، قَالا: حَدَّثَنَا حَجَّاجُ بْنُ مُحَمَّدٍ، عَنِ ابْنِ جُرَيْجٍ، عَنْ إِسْمَاعِيلَ بْنِ أُمَيَّةَ، عَنْ أيوب بن خالد، عن عبد الله بن رافع، عن ابى هريرة، عن النبي ص.","bs":"Ebu Hurejre prenio je od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Allah je stvorio svjetlost u srijedu.“ To su mi pričali Kasim ibn Bišr i Husejn ibn Ali; obojica su rekli: pričao nam je Hadždžadž ibn Muhammed, od Ibn Džurejdža, od Ismaila ibn Umejje, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem.","ar_ranges":[[65,299]],"ar_html":"وروى ابو هريرة عن النبي ص أنه قال: خلق الله النور يوم الأربعاء،] \u003cspan class=\"isnad\">حَدَّثَنِي بِذَلِكَ الْقَاسِمُ بْنُ بِشْرٍ وَالْحُسَيْنُ بْنُ عَلِيٍّ، قَالا: حَدَّثَنَا حَجَّاجُ بْنُ مُحَمَّدٍ، عَنِ ابْنِ جُرَيْجٍ، عَنْ إِسْمَاعِيلَ بْنِ أُمَيَّةَ، عَنْ أيوب بن خالد، عن عبد الله بن رافع، عن ابى هريرة، عن النبي ص.\u003c/span>","bs_ranges":[[190,377]],"bs_html":"Ebu Hurejre prenio je od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Allah je stvorio svjetlost u srijedu.“ To su mi pričali Kasim ibn Bišr i Husejn ibn Ali; obojica su rekli: \u003cspan class=\"isnad\">pričao nam je Hadždžadž ibn Muhammed, od Ibn Džurejdža, od Ismaila ibn Umejje, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/span>"},{"id":"63.5","ar":"وأي ذلك كان، فقد خلق الله قبل خلقه إياهما خلقا كثيرا غيرهما، ثم خلقهما عز وجل لما هو أعلم به من مصلحة خلقه، فجعلهما دائبي الجري، ثم فصل بينهما، فجعل إحداهما آية الليل، والأخرى أية النهار، فمحا آية الليل، وجعل آية النهار مبصره وقد روى عن رسول الله ص في سبب اختلاف حالتي آية الليل وآية النهار أخبار أنا ذاكر منها بعض ما حضرني ذكره وعن جماعة من السلف أيضا نحو ذلك.","bs":"Kako god bilo, prije stvaranja njih dvoje Allah je stvorio mnoga druga stvorenja. Potom ih je On, Silan i Uzvišen, stvorio zbog koristi za Svoja stvorenja koju najbolje zna. Učinio je da neprestano teku, zatim ih je razlikovao: jedno je učinio znakom noći, a drugo znakom dana. Znak noći je izbrisao, a znak dana učinio takvim da se pomoću njega vidi. Od Allahovog Poslanika, sallallahu alejhi ve sellem, prenesene su predaje o razlogu različitosti znaka noći i znaka dana. Spomenut ću neke od onih kojih se sada sjećam. Nešto slično preneseno je i od jedne skupine prethodnika.","ar_ranges":[],"ar_html":"وأي ذلك كان، فقد خلق الله قبل خلقه إياهما خلقا كثيرا غيرهما، ثم خلقهما عز وجل لما هو أعلم به من مصلحة خلقه، فجعلهما دائبي الجري، ثم فصل بينهما، فجعل إحداهما آية الليل، والأخرى أية النهار، فمحا آية الليل، وجعل آية النهار مبصره وقد روى عن رسول الله ص في سبب اختلاف حالتي آية الليل وآية النهار أخبار أنا ذاكر منها بعض ما حضرني ذكره وعن جماعة من السلف أيضا نحو ذلك.","bs_ranges":[],"bs_html":"Kako god bilo, prije stvaranja njih dvoje Allah je stvorio mnoga druga stvorenja. Potom ih je On, Silan i Uzvišen, stvorio zbog koristi za Svoja stvorenja koju najbolje zna. Učinio je da neprestano teku, zatim ih je razlikovao: jedno je učinio znakom noći, a drugo znakom dana. Znak noći je izbrisao, a znak dana učinio takvim da se pomoću njega vidi. Od Allahovog Poslanika, sallallahu alejhi ve sellem, prenesene su predaje o razlogu različitosti znaka noći i znaka dana. Spomenut ću neke od onih kojih se sada sjećam. Nešto slično preneseno je i od jedne skupine prethodnika."},{"id":"63.6","ar":"فمما روى عن رسول الله ص في ذلك، ما حَدَّثَنِي مُحَمَّدُ بْنُ أَبِي مَنْصُورٍ الآملي، حَدَّثَنَا خَلَفُ بْنُ وَاصِلٍ، قَالَ: حَدَّثَنَا عُمَرُ بْنُ","bs":"Među onim što je od Allahovog Poslanika, sallallahu alejhi ve sellem, o tome preneseno jeste ono što mi je pričao Muhammed ibn Ebu Mensur el-Amuli: pričao nam je Halef ibn Vasil, koji je rekao: pričao nam je Omer ibn","ar_ranges":[[35,146]],"ar_html":"فمما روى عن رسول الله ص في ذلك، ما \u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ أَبِي مَنْصُورٍ الآملي، حَدَّثَنَا خَلَفُ بْنُ وَاصِلٍ، قَالَ: حَدَّثَنَا عُمَرُ بْنُ\u003c/span>","bs_ranges":[[101,216]],"bs_html":"Među onim što je od Allahovog Poslanika, sallallahu alejhi ve sellem, o tome preneseno jeste ono što \u003cspan class=\"isnad\">mi je pričao Muhammed ibn Ebu Mensur el-Amuli: pričao nam je Halef ibn Vasil, koji je rekao: pričao nam je Omer ibn\u003c/span>"}],"notes":[]},{"n":64,"ar":"صُبْحٍ أَبُو نُعَيْمٍ الْبَلْخِيُّ، عَنْ مُقَاتِلِ بْنِ حَيَّانَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبْزَى، عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قَالَ: كُنْتُ آخُذُ بِيَدِ رسول الله ص وَنَحْنُ نَتَمَاشَى جَمِيعًا نَحْوَ الْمَغْرِبِ، وَقَدْ طَفَلَتِ الشَّمْسُ، فَمَا زِلْنَا نَنْظُرُ إِلَيْهَا حَتَّى غَابَتْ، [قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ تَغْرُبُ؟ قَالَ: تَغْرُبُ فِي السَّمَاءِ، ثُمَّ تُرْفَعُ مِنْ سَمَاءٍ إِلَى سَمَاءٍ حَتَّى تُرْفَعَ إِلَى السَّمَاءِ السابعة العليا، حتى تكون تحت العرش، فتخر سَاجِدَةً، فَتَسْجُدُ مَعَهَا الْمَلائِكَةُ الْمُوَكَّلُونَ بِهَا، ثُمَّ تَقُولُ: يَا رَبِّ، مِنْ أَيْنَ تَأْمُرُنِي أَنْ أَطْلُعَ، أَمِنْ مَغْرِبِي أَمْ مِنْ مَطْلَعِي؟ قَالَ: فَذَلِكَ قَوْلُهُ عَزَّ وَجَلَّ: «وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها» حَيْثُ تُحْبَسُ تَحْتَ الْعَرْشِ، «ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ» قال: يعنى ب ذَلِكَ صُنْعُ الرَّبِّ الْعَزِيزِ فِي مُلْكِهِ الْعَلِيمِ بخلقه قال: فيأتيها جبرئيل بحلة ضوء من نور العرش، على مقادير ساعات النهار، في طوله في الصيف، أو قصره في الشتاء، أو ما بين ذلك في الخريف والربيع قال: فتلبس تلك الحلة كما يلبس احدكم ثيابه، ثم تنطلق بها في جو السماء حتى تطلع من مطلعها، قال النبي ص: فكأنها قد حبست مقدار ثلاث ليال ثم لا تكسى ضوءا، وتؤمر أن تطلع من مغربها، فذلك قوله عز وجل: «إِذَا الشَّمْسُ كُوِّرَتْ» .\nقال: والقمر كذلك في مطلعه ومجراه في أفق السماء ومغربه وارتفاعه إلى السماء السابعة العليا، ومحبسه تحت العرش وسجوده واستئذانه، ولكن جبرائيل ع يأتيه بالحلة من نور الكرسي قال: فذلك قوله عز وجل: «جَعَلَ الشَّمْسَ ضِياءً وَالْقَمَرَ نُوراً] » قال أبو ذر: ثم عدلت مع رسول الله ص","bs":"\u003cp data-paragraph=\"64.1\">Subh, Ebu Nuajm el-Belhi, od Mukatila ibn Hajjana, od Abdurrahmana ibn Ebze, od Ebu Zerra el-Gifarija, koji je rekao: „Držao sam Allahovog Poslanika, sallallahu alejhi ve sellem, za ruku dok smo zajedno hodali prema zapadu. Sunce se primicalo zalasku i gledali smo ga sve dok nije zašlo.“ Rekao je: „Upitao sam: ‘Allahov Poslaniče, gdje ono zalazi?’ Odgovorio je: ‘Zalazi na nebu, zatim se podiže s jednog neba na drugo dok ne bude podignuto do najvišeg, sedmog neba, dok ne bude ispod Arša. Tada pada ničice na sedždu, a s njim sedždu čine i meleki zaduženi za njega. Zatim govori: Gospodaru moj, odakle mi naređuješ da izađem: sa svoga zapada ili sa svoga istoka?’“ Rekao je: „To su riječi Njega, Silnog i Uzvišenog: ‘I Sunce teče do svoga boravišta’ — gdje se zadržava pod Aršom — ‘To je određenje Silnoga, Sveznajućeg.’“ Rekao je: „Time se misli na djelo Gospodara, Silnoga u Svojoj vlasti, Sveznajućeg o Svojim stvorenjima.“ Rekao je: „Tada mu Džibril donosi svijetlu odoru od svjetlosti Arša, prema broju sati dana: njegovoj dužini ljeti, kratkoći zimi ili onome između toga ujesen i u proljeće.“ Rekao je: „Oblači tu odoru kao što neko od vas oblači svoju odjeću, zatim s njom kreće nebeskim prostorom dok ne izađe na svome istoku.“ Vjerovjesnik, sallallahu alejhi ve sellem, rekao je: „Kao da je već zadržano koliko traju tri noći; zatim se više ne odijeva sjajem i naređuje mu se da izađe sa svoga zapada. To su riječi Njega, Silnog i Uzvišenog: ‘Kada Sunce bude smotano.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Ja-Sin, 36:38, navedeni dijelovi; Et-Tekvir, 81:1.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"64.2\">Rekao je: „Tako je i s Mjesecom: s njegovim izlaskom, kretanjem nebeskim obzorjem, zalaskom, uzdizanjem do najvišeg, sedmog neba, zadržavanjem ispod Arša, sedždom i traženjem dopuštenja. Međutim, Džibril, alejhis-selam, njemu donosi odoru od svjetlosti Kursijja.“ Rekao je: „To su riječi Njega, Silnog i Uzvišenog: ‘Sunce je učinio sjajem, a Mjesec svjetlošću.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Junus, 10:5, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"64.3\">Ebu Zerr je rekao: „Zatim sam skrenuo zajedno s Allahovim Poslanikom, sallallahu alejhi ve sellem,\u003c/p>","paragraphs":[{"id":"64.1","ar":"صُبْحٍ أَبُو نُعَيْمٍ الْبَلْخِيُّ، عَنْ مُقَاتِلِ بْنِ حَيَّانَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبْزَى، عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قَالَ: كُنْتُ آخُذُ بِيَدِ رسول الله ص وَنَحْنُ نَتَمَاشَى جَمِيعًا نَحْوَ الْمَغْرِبِ، وَقَدْ طَفَلَتِ الشَّمْسُ، فَمَا زِلْنَا نَنْظُرُ إِلَيْهَا حَتَّى غَابَتْ، [قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ تَغْرُبُ؟ قَالَ: تَغْرُبُ فِي السَّمَاءِ، ثُمَّ تُرْفَعُ مِنْ سَمَاءٍ إِلَى سَمَاءٍ حَتَّى تُرْفَعَ إِلَى السَّمَاءِ السابعة العليا، حتى تكون تحت العرش، فتخر سَاجِدَةً، فَتَسْجُدُ مَعَهَا الْمَلائِكَةُ الْمُوَكَّلُونَ بِهَا، ثُمَّ تَقُولُ: يَا رَبِّ، مِنْ أَيْنَ تَأْمُرُنِي أَنْ أَطْلُعَ، أَمِنْ مَغْرِبِي أَمْ مِنْ مَطْلَعِي؟ قَالَ: فَذَلِكَ قَوْلُهُ عَزَّ وَجَلَّ: «وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها» حَيْثُ تُحْبَسُ تَحْتَ الْعَرْشِ، «ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ» قال: يعنى ب ذَلِكَ صُنْعُ الرَّبِّ الْعَزِيزِ فِي مُلْكِهِ الْعَلِيمِ بخلقه قال: فيأتيها جبرئيل بحلة ضوء من نور العرش، على مقادير س
