ك يكسيان النور والضوء، ويطلعان على الناس ويغربان كما كانا قبل ذلك، وأما الناس فإنهم نظروا إلى ما نظروا إليه من فظاعة الآية، فيلحون على الدنيا حتى يجروا فيها الأنهار، ويغرسوا فيها الشجر، ويبنوا فيها البنيان وأما الدنيا فإنه لو أنتج رجل مهرا لم يركبه من لدن طلوع الشمس من مغربها إلى يوم ينفخ في الصور.\nفقال حذيفة بن اليمان: أنا وأهلي فداؤك يا رسول الله! فكيف هم عند النفخ في الصور! فقال: يا حذيفة، والذي نفس محمد بيده، لتقومن الساعة ولينفخن في الصور والرجل قد لط حوضه فلا يسقى منه، ولتقومن الساعة والثوب بين الرجلين فلا يطويانه، ولا يتبايعانه ولتقومن الساعة والرجل قد رفع لقمته إلى فيه فلا يطعمها، ولتقومن الساعة والرجل قد انصرف بلبن لقحته من تحتها فلا يشربه، ثم تلا رسول الله ص هذه الآية: «وَلَيَأْتِيَنَّهُمْ بَغْتَةً وَهُمْ لا يَشْعُرُونَ» .\nفإذا نفخ في الصور، وقامت الساعة، وميز الله بين أهل الجنة وأهل النار ولما يدخلوهما بعد، إذ يدعو الله عز وجل بالشمس والقمر، فيجاء بهما أسودين مكورين قد وقعا في زلزال وبلبال، ترعد فرائصهما من هول ذلك اليوم ومخافة الرحمن، حتى إذا كانا حيال العرش خرا لله ساجدين، فيقولان: إلهنا قد علمت طاعتنا ودءوبنا في عبادتك، وسرعتنا للمضي في أمرك أيام الدنيا، فلا تعذبنا بعبادة المشركين إيانا، فإنا لم ندع الى عبادتنا، ولم نذهل عن عبادتك! قال: فيقول الرب تبارك وتعالى: صدقتما، وإني قضيت على نفسي أن أبدئ وأعيد، وإني معيدكما فيما بدأتكما منه، فارجعا إلى ما خلقتما منه،","bs":"\u003cp data-paragraph=\"74.1\">poslije toga ponovo će biti odjeveni svjetlošću i sjajem, izlazit će ljudima i zalaziti kao i prije. Što se tiče ljudi, nakon što vide strahotu toga znaka, uporno će se posvetiti ovome svijetu, sve dok njime ne provedu rijeke, u njemu ne zasade drveće i ne podignu građevine. A što se tiče trajanja svijeta, kada bi neko dobio ždrijebe, ne bi ga stigao zajahati u vremenu od Sunčevog izlaska sa zapada do dana kada se puhne u rog.’\u003c/p>\u003cp data-paragraph=\"74.2\">Huzejfa ibn el-Jeman rekao je: ‘Ja i moja porodica žrtva smo za tebe, Allahov Poslaniče! Kakvo će njihovo stanje biti kada se puhne u rog?’ Odgovorio je: ‘Huzejfa, tako mi Onoga u čijoj je ruci Muhammedova duša, Čas će nastupiti i u rog će se puhnuti dok čovjek bude upravo oblijepio svoje pojilo, a neće iz njega napojiti. Čas će nastupiti dok odjeća bude između dvojice ljudi, pa je neće ni složiti niti zaključiti kupoprodaju. Čas će nastupiti dok čovjek bude podigao zalogaj prema ustima, pa ga neće pojesti. Čas će nastupiti dok se čovjek bude vraćao s mlijekom svoje tek pomužene deve, pa ga neće popiti.’ Zatim je Allahov Poslanik, sallallahu alejhi ve sellem, proučio ovaj ajet: ‘I doći će im iznenada, a oni neće ni osjetiti.’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Ankebut, 29:53, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"74.3\">‘Kada se puhne u rog, nastupi Čas i Allah razdvoji stanovnike Dženneta i stanovnike Vatre, a oni još ne uđu u njih, Allah, Silan i Uzvišen, pozvat će Sunce i Mjesec. Bit će dovedeni crni i smotani, u potresu i pometnji; slabine će im drhtati od strahote toga dana i straha od Milostivog. Kada budu naspram Arša, past će Allahu na sedždu i reći: Bože naš, Ti znaš našu pokornost, našu ustrajnost u ibadetu Tebi i našu brzinu u izvršavanju Tvojih naredbi tokom dana ovoga svijeta. Nemoj nas kazniti zato što su nas mnogobošci obožavali! Mi nismo pozivali da budemo obožavani i nismo zaboravili ibadet Tebi.’ Rekao je: ‘Gospodar, Blagoslovljen i Uzvišen, reći će: Istinu ste rekli. Odredio sam Sebi da započinjem i vraćam. Vratit ću vas u ono iz čega sam vas prvobitno načinio. Vratite se u ono od čega ste stvoreni.\u003c/p>","paragraphs":[{"id":"74.1","ar":"بعد ذلك يكسيان النور والضوء، ويطلعان على الناس ويغربان كما كانا قبل ذلك، وأما الناس فإنهم نظروا إلى ما نظروا إليه من فظاعة الآية، فيلحون على الدنيا حتى يجروا فيها الأنهار، ويغرسوا فيها الشجر، ويبنوا فيها البنيان وأما الدنيا فإنه لو أنتج رجل مهرا لم يركبه من لدن طلوع الشمس من مغربها إلى يوم ينفخ في الصور.","bs":"poslije toga ponovo će biti odjeveni svjetlošću i sjajem, izlazit će ljudima i zalaziti kao i prije. Što se tiče ljudi, nakon što vide strahotu toga znaka, uporno će se posvetiti ovome svijetu, sve dok njime ne provedu rijeke, u njemu ne zasade drveće i ne podignu građevine. A što se tiče trajanja svijeta, kada bi neko dobio ždrijebe, ne bi ga stigao zajahati u vremenu od Sunčevog izlaska sa zapada do dana kada se puhne u rog.’","ar_ranges":[],"ar_html":"بعد ذلك يكسيان النور والضوء، ويطلعان على الناس ويغربان كما كانا قبل ذلك، وأما الناس فإنهم نظروا إلى ما نظروا إليه من فظاعة الآية، فيلحون على الدنيا حتى يجروا فيها الأنهار، ويغرسوا فيها الشجر، ويبنوا فيها البنيان وأما الدنيا فإنه لو أنتج رجل مهرا لم يركبه من لدن طلوع الشمس من مغربها إلى يوم ينفخ في الصور.","bs_ranges":[],"bs_html":"poslije toga ponovo će biti odjeveni svjetlošću i sjajem, izlazit će ljudima i zalaziti kao i prije. Što se tiče ljudi, nakon što vide strahotu toga znaka, uporno će se posvetiti ovome svijetu, sve dok njime ne provedu rijeke, u njemu ne zasade drveće i ne podignu građevine. A što se tiče trajanja svijeta, kada bi neko dobio ždrijebe, ne bi ga stigao zajahati u vremenu od Sunčevog izlaska sa zapada do dana kada se puhne u rog.’"},{"id":"74.2","ar":"فقال حذيفة بن اليمان: أنا وأهلي فداؤك يا رسول الله! فكيف هم عند النفخ في الصور! فقال: يا حذيفة، والذي نفس محمد بيده، لتقومن الساعة ولينفخن في الصور والرجل قد لط حوضه فلا يسقى منه، ولتقومن الساعة والثوب بين الرجلين فلا يطويانه، ولا يتبايعانه ولتقومن الساعة والرجل قد رفع لقمته إلى فيه فلا يطعمها، ولتقومن الساعة والرجل قد انصرف بلبن لقحته من تحتها فلا يشربه، ثم تلا رسول الله ص هذه الآية: «وَلَيَأْتِيَنَّهُمْ بَغْتَةً وَهُمْ لا يَشْعُرُونَ» .","bs":"Huzejfa ibn el-Jeman rekao je: ‘Ja i moja porodica žrtva smo za tebe, Allahov Poslaniče! Kakvo će njihovo stanje biti kada se puhne u rog?’ Odgovorio je: ‘Huzejfa, tako mi Onoga u čijoj je ruci Muhammedova duša, Čas će nastupiti i u rog će se puhnuti dok čovjek bude upravo oblijepio svoje pojilo, a neće iz njega napojiti. Čas će nastupiti dok odjeća bude između dvojice ljudi, pa je neće ni složiti niti zaključiti kupoprodaju. Čas će nast علمت طاعتنا ودءوبنا في عبادتك، وسرعتنا للمضي في أمرك أيام الدنيا، فلا تعذبنا بعبادة المشركين إيانا، فإنا لم ندع الى عبادتنا، ولم نذهل عن عبادتك! قال: فيقول الرب تبارك وتعالى: صدقتما، وإني قضيت على نفسي أن أبدئ وأعيد، وإني معيدكما فيما بدأتكما منه، فارجعا إلى ما خلقتما منه،","bs":"‘Kada se puhne u rog, nastupi Čas i Allah razdvoji stanovnike Dženneta i stanovnike Vatre, a oni još ne uđu u njih, Allah, Silan i Uzvišen, pozvat će Sunce i Mjesec. Bit će dovedeni crni i smotani, u potresu i pometnji; slabine će im drhtati od strahote toga dana i straha od Milostivog. Kada budu naspram Arša, past će Allahu na sedždu i reći: Bože naš, Ti znaš našu pokornost, našu ustrajnost u ibadetu Tebi i našu brzinu u izvršavanju Tvojih naredbi tokom dana ovoga svijeta. Nemoj nas kazniti zato što su nas mnogobošci obožavali! Mi nismo pozivali da budemo obožavani i nismo zaboravili ibadet Tebi.’ Rekao je: ‘Gospodar, Blagoslovljen i Uzvišen, reći će: Istinu ste rekli. Odredio sam Sebi da započinjem i vraćam. Vratit ću vas u ono iz čega sam vas prvobitno načinio. Vratite se u ono od čega ste stvoreni.","ar_ranges":[],"ar_html":"فإذا نفخ في الصور، وقامت الساعة، وميز الله بين أهل الجنة وأهل النار ولما يدخلوهما بعد، إذ يدعو الله عز وجل بالشمس والقمر، فيجاء بهما أسودين مكورين قد وقعا في زلزال وبلبال، ترعد فرائصهما من هول ذلك اليوم ومخافة الرحمن، حتى إذا كانا حيال العرش خرا لله ساجدين، فيقولان: إلهنا قد علمت طاعتنا ودءوبنا في عبادتك، وسرعتنا للمضي في أمرك أيام الدنيا، فلا تعذبنا بعبادة المشركين إيانا، فإنا لم ندع الى عبادتنا، ولم نذهل عن عبادتك! قال: فيقول الرب تبارك وتعالى: صدقتما، وإني قضيت على نفسي أن أبدئ وأعيد، وإني معيدكما فيما بدأتكما منه، فارجعا إلى ما خلقتما منه،","bs_ranges":[],"bs_html":"‘Kada se puhne u rog, nastupi Čas i Allah razdvoji stanovnike Dženneta i stanovnike Vatre, a oni još ne uđu u njih, Allah, Silan i Uzvišen, pozvat će Sunce i Mjesec. Bit će dovedeni crni i smotani, u potresu i pometnji; slabine će im drhtati od strahote toga dana i straha od Milostivog. Kada budu naspram Arša, past će Allahu na sedždu i reći: Bože naš, Ti znaš našu pokornost, našu ustrajnost u ibadetu Tebi i našu brzinu u izvršavanju Tvojih naredbi tokom dana ovoga svijeta. Nemoj nas kazniti zato što su nas mnogobošci obožavali! Mi nismo pozivali da budemo obožavani i nismo zaboravili ibadet Tebi.’ Rekao je: ‘Gospodar, Blagoslovljen i Uzvišen, reći će: Istinu ste rekli. Odredio sam Sebi da započinjem i vraćam. Vratit ću vas u ono iz čega sam vas prvobitno načinio. Vratite se u ono od čega ste stvoreni."}],"notes":[]},{"n":75,"ar":"قالا: إلهنا، ومم خلقتنا؟ قال: خلقتكما من نور عرشي، فارجعا إليه قال:\n\nفيلتمع من كل واحد منهما برقة تكاد تخطف الأبصار نورا، فتختلط بنور العرش فذلك قوله عز وجل: «يُبْدِئُ وَيُعِيدُ] » .\nقال عكرمة: فقمت مع النفر الذين حدثوا به، حتى أتينا كعبا فأخبرناه بما كان من وجد ابن عباس من حديثه، وبما حدث عن رسول الله ص، فقام كعب معنا حتى أتينا ابْنَ عَبَّاسٍ، فقال: قد بلغني ما كان من وجدك من حديثي، وأستغفر الله وأتوب إليه، وإني إنما حدثت عن كتاب دارس قد تداولته الأيدي، ولا أدري ما كان فيه من تبديل اليهود، وإنك حدثت عن كتاب جديد حديث العهد بالرحمن عز وجل وعن سيد الأنبياء وخير النبيين، فأنا أحب أن تحدثني الحديث فأحفظه عنك، فإذا حدثت به كان مكان حديثي الأول.\nقال عكرمة: فأعاد عليه ابْنِ عَبَّاسٍ الحديث، وأنا أستقريه في قلبي بابا بابا، فما زاد شيئا ولا نقص، ولا قدم شيئا ولا أخر، فزادني ذلك في ابْنِ عَبَّاسٍ رغبة، وللحديث حفظا.\n\nومما روي عن السلف في ذلك مَا حَدَّثَنَاهُ ابن حميد، قال:\n\nحدثنا جَرِيرٌ، عَنْ عَبْدِ الْعَزِيزِ بْنِ رُفَيْعٍ، عَنْ أَبِي الطُّفَيْلِ، قَالَ: [قَالَ ابْنُ الْكَواءِ لِعَلِيٍّ ع: يَا أَمِيرَ الْمُؤْمِنِينَ، مَا هَذِهِ اللَّطْخَةُ الَّتِي فِي الْقَمَرِ؟\nفَقَالَ: وَيْحَكَ! أَمَا تَقْرَأُ الْقُرْآنَ: «فَمَحَوْنا آيَةَ اللَّيْلِ» ! فهذه محوه]","bs":"\u003cp data-paragraph=\"75.1\">Oni će reći: Bože naš, a od čega si nas stvorio? Reći će: Stvorio sam vas od svjetlosti Svoga Arša, pa joj se vratite.’ Rekao je: ‘Iz svakoga od njih bljesnut će munja svjetlosti koja gotovo oduzima vid, pa će se pomiješati sa svjetlošću Arša. To su riječi Njega, Silnog i Uzvišenog: Započinje i vraća.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Burudž, 85:13, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"75.2\">Ikrima je rekao: „Ustao sam s ljudima kojima je to ispričao i otišli smo Ka‘bu. Obavijestili smo ga koliko se Ibn Abbas rasrdio zbog njegovog kazivanja i šta je prenio od Allahovog Poslanika, sallallahu alejhi ve sellem. Ka‘b je ustao i pošao s nama, pa smo došli Ibn Abbasu. Rekao je: ‘Do mene je doprlo koliko si se rasrdio zbog moga kazivanja. Tražim oprost od Allaha i kajem Mu se. Prenosio sam iz stare, istrošene knjige koja je prelazila iz ruke u ruku, a ne znam kakve su izmjene Jevreji u nju unijeli. Ti si kazivao prema novoj Knjizi, koja je nedavno došla od Milostivog, Silnog i Uzvišenog, i od prvaka vjerovjesnika i najboljeg među njima. Želio bih da mi ispričaš tu predaju kako bih je od tebe zapamtio, pa kada je budem prenosio, da zamijeni moje prvo kazivanje.’“\u003c/p>\u003cp data-paragraph=\"75.3\">Ikrima je rekao: „Ibn Abbas ponovio mu je predaju, a ja sam je u srcu pratio dio po dio. Nije ništa ni dodao ni oduzeo, niti je išta stavio prije ili poslije svoga mjesta. To je još povećalo moju privrženost Ibn Abbasu i učvrstilo mi pamćenje predaje.“\u003c/p>\u003cp data-paragraph=\"75.4\">Među onim što je o tome preneseno od prethodnika jeste ono što nam je pričao Ibn Humejd, koji je rekao: pričao nam je Džerir, od Abdulaziza ibn Rufej‘a, od Ebu Tufejla, koji je rekao: „Ibn el-Kevva rekao je Aliju, alejhis-selam: ‘Vladaru pravovjernih, kakva je ovo mrlja na Mjesecu?’ Odgovorio je: ‘Teško tebi! Zar ne čitaš Kur’an: Znak noći izbrisali smo! To je njegovo brisanje.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"75.1","ar":"قالا: إلهنا، ومم خلقتنا؟ قال: خلقتكما من نور عرشي، فارجعا إليه قال:\n\nفيلتمع من كل واحد منهما برقة تكاد تخطف الأبصار نورا، فتختلط بنور العرش فذلك قوله عز وجل: «يُبْدِئُ وَيُعِيدُ] » .","bs":"Oni će reći: Bože naš, a od čega si nas stvorio? Reći će: Stvorio sam vas od svjetlosti Svoga Arša, pa joj se vratite.’ Rekao je: ‘Iz svakoga od njih bljesnut će munja svjetlosti koja gotovo oduzima vid, pa će se pomiješati sa svjetlošću Arša. To su riječi Njega, Silnog i Uzvišenog: Započinje i vraća.’“ ⟦Prijevod kur’anskog navoda: El-Burudž, 85:13, navedeni dio.⟧","ar_ranges":[],"ar_html":"قالا: إلهنا، ومم خلقتنا؟ قال: خلقتكما من نور عرشي، فارجعا إليه قال:\n\nفيلتمع من كل واحد منهما برقة تكاد تخطف الأبصار نورا، فتختلط بنور العرش فذلك قوله عز وجل: «يُبْدِئُ وَيُعِيدُ] » .","bs_ranges":[],"bs_html":"Oni će reći: Bože naš, a od čega si nas stvorio? Reći će: Stvorio sam vas od svjetlosti Svoga Arša, pa joj se vratite.’ Rekao je: ‘Iz svakoga od njih bljesnut će munja svjetlosti koja gotovo oduzima vid, pa će se pomiješati sa svjetlošću Arša. To su riječi Njega, Silnog i Uzvišenog: Započinje i vraća.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Burudž, 85:13, navedeni dio.⟧\u003c/span>"},{"id":"75.2","ar":"قال عكرمة: فقمت مع النفر الذين حدثوا به، حتى أتينا كعبا فأخبرناه بما كان من وجد ابن عباس من حديثه، وبما حدث عن رسول الله ص، فقام كعب معنا حتى أتينا ابْنَ عَبَّاسٍ، فقال: قد بلغني ما كان من وجدك من حديثي، وأستغفر الله وأتوب إليه، وإني إنما حدثت عن كتاب دارس قد تداولته الأيدي، ولا أدري ما كان فيه من تبديل اليهود، وإنك حدثت عن كتاب جديد حديث العهد بالرحمن عز وجل وعن سيد الأنبياء وخير النبيين، فأنا أحب أن تحدثني الحديث فأحفظه عنك، فإذا حدثت به كان مكان حديثي الأول.","bs":"Ikrima je rekao: „Ustao sam s ljudima kojima je to ispričao i otišli smo Ka‘bu. Obavijestili smo ga koliko se Ibn Abbas rasrdio zbog njegovog kazivanja i šta je prenio od Allahovog Poslanika, sallallahu alejhi ve sellem. Ka‘b je ustao i pošao s nama, pa smo došli Ibn Abbasu. Rekao je: ‘Do mene je doprlo koliko si se rasrdio zbog moga kazivanja. Tražim oprost od Allaha i kajem Mu se. Prenosio sam iz stare, istrošene knjige koja je prelazila iz ruke u ruku, a ne znam kakve su izmjene Jevreji u nju unijeli. Ti si kazivao prema novoj Knjizi, koja je nedavno došla od Milostivog, Silnog i Uzvišenog, i od prvaka vjerovjesnika i najboljeg među njima. Želio bih da mi ispričaš tu predaju kako bih je od tebe zapamtio, pa kada je budem prenosio, da zamijeni moje prvo kazivanje.’“","ar_ranges":[],"ar_html":"قال عكرمة: فقمت مع النفر الذين حدثوا به، حتى أتينا كعبا فأخبرناه بما كان من وجد ابن عباس من حديثه، وبما حدث عن رسول الله ص، فقام كعب معنا حتى أتينا ابْنَ عَبَّاسٍ، فقال: قد بلغني ما كان من وجدك من حديثي، وأستغفر الله وأتوب إليه، وإني إنما حدثت عن كتاب دارس قد تداولته الأيدي، ولا أدري ما كان فيه من تبديل اليهود، وإنك حدثت عن كتاب جديد حديث العهد بالرحمن عز وجل وعن سيد الأنبياء وخير النبيين، فأنا أحب أن تحدثني الحديث فأحفظه عنك، فإذا حدثت به كان مكان حديثي الأول.","bs_ranges":[],"bs_html":"Ikrima je rekao: „Ustao sam s ljudima kojima je to ispričao i otišli smo Ka‘bu. Obavijestili smo ga koliko se Ibn Abbas rasrdio zbog njegovog kazivanja i šta je prenio od Allahovog Poslanika, sallallahu alejhi ve sellem. Ka‘b je ustao i pošao s nama, pa smo došli Ibn Abbasu. Rekao je: ‘Do mene je doprlo koliko si se rasrdio zbog moga kazivanja. Tražim oprost od Allaha i kajem Mu se. Prenosio sam iz stare, istrošene knjige koja je prelazila iz ruke u ruku, a ne znam kakve su izmjene Jevreji u nju unijeli. Ti si kazivao prema novoj Knjizi, koja je nedavno došla od Milostivog, Silnog i Uzvišenog, i od prvaka vjerovjesnika i najboljeg među njima. Želio bih da mi ispričaš tu predaju kako bih je od tebe zapamtio, pa kada je budem prenosio, da zamijeni moje prvo kazivanje.’“"},{"id":"75.3","ar":"قال عكرمة: فأعاد عليه ابْنِ عَبَّاسٍ الحديث، وأنا أستقريه في قلبي بابا بابا، فما زاد شيئا ولا نقص، ولا قدم شيئا ولا أخر، فزادني ذلك في ابْنِ عَبَّاسٍ رغبة، وللحديث حفظا.","bs":"Ikrima je rekao: „Ibn Abbas ponovio mu je predaju, a ja sam je u srcu pratio dio po dio. Nije ništa ni dodao ni oduzeo, niti je išta stavio prije ili poslije svoga mjesta. To je još povećalo moju privrženost Ibn Abbasu i učvrstilo mi pamćenje predaje.“","ar_ranges":[],"ar_html":"قال عكرمة: فأعاد عليه ابْنِ عَبَّاسٍ الحديث، وأنا أستقريه في قلبي بابا بابا، فما زاد شيئا ولا نقص، ولا قدم شيئا ولا أخر، فزادني ذلك في ابْنِ عَبَّاسٍ رغبة، وللحديث حفظا.","bs_ranges":[],"bs_html":"Ikrima je rekao: „Ibn Abbas ponovio mu je predaju, a ja sam je u srcu pratio dio po dio. Nije ništa ni dodao ni oduzeo, niti je išta stavio prije ili poslije svoga mjesta. To je još povećalo moju privrženost Ibn Abbasu i učvrstilo mi pamćenje predaje.“"},{"id":"75.4","ar":"ومما روي عن السلف في ذلك مَا حَدَّثَنَاهُ ابن حميد، قال:\n\nحدثنا جَرِيرٌ، عَنْ عَبْدِ الْعَزِيزِ بْنِ رُفَيْعٍ، عَنْ أَبِي الطُّفَيْلِ، قَالَ: [قَالَ ابْنُ الْكَواءِ لِعَلِيٍّ ع: يَا أَمِيرَ الْمُؤْمِنِينَ، مَا هَذِهِ اللَّطْخَةُ الَّتِي فِي الْقَمَرِ؟\nفَقَالَ: وَيْحَكَ! أَمَا تَقْرَأُ الْقُرْآنَ: «فَمَحَوْنا آيَةَ اللَّيْلِ» ! فهذه محوه]","bs":"Među onim što je o tome preneseno od prethodnika jeste ono što nam je pričao Ibn Humejd, koji je rekao: pričao nam je Džerir, od Abdulaziza ibn Rufej‘a, od Ebu Tufejla, koji je rekao: „Ibn el-Kevva rekao je Aliju, alejhis-selam: ‘Vladaru pravovjernih, kakva je ovo mrlja na Mjesecu?’ Odgovorio je: ‘Teško tebi! Zar ne čitaš Kur’an: Znak noći izbrisali smo! To je njegovo brisanje.’“ ⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧","ar_ranges":[[58,178]],"ar_html":"ومما روي عن السلف في ذلك مَا حَدَّثَنَاهُ ابن حميد، قال:\n\n\u003cspan class=\"isnad\">حدثنا جَرِيرٌ، عَنْ عَبْدِ الْعَزِيزِ بْنِ رُفَيْعٍ، عَنْ أَبِي الطُّفَيْلِ، قَالَ: [قَالَ ابْنُ الْكَواءِ لِعَلِيٍّ ع: \u003c/span>يَا أَمِيرَ الْمُؤْمِنِينَ، مَا هَذِهِ اللَّطْخَةُ الَّتِي فِي الْقَمَرِ؟\nفَقَالَ: وَيْحَكَ! أَمَا تَقْرَأُ الْقُرْآنَ: «فَمَحَوْنا آيَةَ اللَّيْلِ» ! فهذه محوه]","bs_ranges":[[63,184]],"bs_html":"Među onim što je o tome preneseno od prethodnika jeste ono što \u003cspan class=\"isnad\">nam je pričao Ibn Humejd, koji je rekao: pričao nam je Džerir, od Abdulaziza ibn Rufej‘a, od Ebu Tufejla, koji je rekao: \u003c/span>„Ibn el-Kevva rekao je Aliju, alejhis-selam: ‘Vladaru pravovjernih, kakva je ovo mrlja na Mjesecu?’ Odgovorio je: ‘Teško tebi! Zar ne čitaš Kur’an: Znak noći izbrisali smo! To je njegovo brisanje.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>"}],"notes":[]},{"n":76,"ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا طَلْقٌ، عَنْ زَائِدَةَ، عَنْ عَاصِمٍ، عَنْ عَلِيِّ بْنِ رَبِيعَةَ، [قال: سال ابن الكواء عليا ع فَقَالَ:\nمَا هَذَا السَّوَادُ فِي الْقَمَرِ؟ فَقَالَ عَلِيٌّ: «فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، هُوَ الْمَحْوُ] .\n\nحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ، قَالَ: حَدَّثَنَا إِسْرَائِيلُ، عَنْ أَبِي إِسْحَاقَ، عَنْ عُبَيْدِ بْنِ عُمَيْرٍ، قَالَ: [كنت عند على ع، فَسَأَلَهُ ابْنُ الْكَوَاءِ عَنِ السَّوَادِ الَّذِي فِي الْقَمَرِ فَقَالَ: ذَاكَ آيَةُ اللَّيْلِ مُحِيَتْ] .\n\nحَدَّثَنَا ابْنُ أَبِي الشَّوَارِبِ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ:\nحَدَّثَنَا عِمْرَانُ بْنُ حُدَيْرٍ، عَنْ رفيع، ابى كثيره، قَالَ: [قَالَ عَلِيُّ بْنُ أَبِي طَالِبٍ رَضِيَ اللَّهُ عَنْهُ: سَلُوا عَمَّا شِئْتُمْ، فَقَامَ ابْنُ الْكَوَاءِ فَقَالَ: مَا السَّوَادُ الَّذِي فِي الْقَمَرِ؟ فَقَالَ: قَاتَلَكَ اللَّهُ! هَلا سَأَلْتَ عَنْ أَمْرِ دِينِكَ وَآخِرَتِكَ! ثُمَّ قَالَ:\n\nذَاكَ مَحْوُ اللَّيْلِ] .\nحَدَّثَنَا زَكَرِيَّاءُ بْنُ يَحْيَى بْنِ أَبَانٍ الْمِصْرِيُّ، قَالَ: حَدَّثَنَا ابْنُ عُفَيْرٍ، قَالَ: حَدَّثَنَا ابْنُ لَهِيعَةَ، عَنْ حُيَيِّ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ، [أَنَّ رَجُلا قَالَ لِعَلِيٍّ رَضِيَ اللَّهُ عَنْهُ: مَا السَّوَادُ الَّذِي فِي الْقَمَرِ؟ قَالَ: إِنَّ اللَّهَ يَقُولُ: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً] » .\nحَدَّثَنِي مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ: حَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَوْلَهُ: «وَجَعَلْنَا","bs":"\u003cp data-paragraph=\"76.1\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Talk, od Zaide, od Asima, od Alija ibn Rebie, koji je rekao: „Ibn el-Kevva upitao je Alija, alejhis-selam: ‘Šta je ovo crnilo na Mjesecu?’ Ali je odgovorio: ‘Znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi. To je brisanje.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"76.2\">Pričao nam je Ibn Beššar, koji je rekao: pričao nam je Abdurrahman, koji je rekao: pričao nam je Israil, od Ebu Ishaka, od Ubejda ibn Umejra, koji je rekao: „Bio sam kod Alija, alejhis-selam, pa ga je Ibn el-Kevva upitao o crnilu na Mjesecu. Odgovorio je: ‘To je znak noći koji je izbrisan.’“\u003c/p>\u003cp data-paragraph=\"76.3\">Pričao nam je Ibn Ebu Ševarib, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Imran ibn Hudejr, od Refi‘a, Ebu Kesire, koji je rekao: „Ali ibn Ebu Talib, radijallahu anhu, rekao je: ‘Pitajte o čemu god hoćete.’ Ibn el-Kevva ustao je i rekao: ‘Šta je crnilo na Mjesecu?’ Odgovorio je: ‘Allah te ubio! Zašto nisi pitao o svojoj vjeri i budućem svijetu!’ Zatim je rekao: ‘To je brisanje noći.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: ime i nadimak prenosioca u izvoru glase رفيع، ابى كثيره; posljednja riječ zahtijeva provjeru čitanja, pa ovdje nije zamijenjena drugim poznatim imenom.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"76.4\">Pričao nam je Zekerijja ibn Jahja ibn Eban el-Misri, koji je rekao: pričao nam je Ibn Ufejr, koji je rekao: pričao nam je Ibn Lehi‘a, od Hujejja ibn Abdullaha, od Ebu Abdurrahmana, od Abdullaha ibn Amra ibn el-Asa, da je neki čovjek rekao Aliju, radijallahu anhu: „Šta je crnilo na Mjesecu?“ Odgovorio je: „Allah kaže: ‘I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"76.5\">Pričao mi je Muhammed ibn Sa‘d, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je moj amidža, koji je rekao: pričao mi je moj otac, od svoga oca, od Ibn Abbasa, o Njegovim riječima: „I\u003c/p>","paragraphs":[{"id":"76.1","ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا طَلْقٌ، عَنْ زَائِدَةَ، عَنْ عَاصِمٍ، عَنْ عَلِيِّ بْنِ رَبِيعَةَ، [قال: سال ابن الكواء عليا ع فَقَالَ:\nمَا هَذَا السَّوَادُ فِي الْقَمَرِ؟ فَقَالَ عَلِيٌّ: «فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، هُوَ الْمَحْوُ] .","bs":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Talk, od Zaide, od Asima, od Alija ibn Rebie, koji je rekao: „Ibn el-Kevva upitao je Alija, alejhis-selam: ‘Šta je ovo crnilo na Mjesecu?’ Ali je odgovorio: ‘Znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi. To je brisanje.’“ ⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧","ar_ranges":[[0,118]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا طَلْقٌ، عَنْ زَائِدَةَ، عَنْ عَاصِمٍ، عَنْ عَلِيِّ بْنِ رَبِيعَةَ، [قال: \u003c/span>سال ابن الكواء عليا ع فَقَالَ:\nمَا هَذَا السَّوَادُ فِي الْقَمَرِ؟ فَقَالَ عَلِيٌّ: «فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، هُوَ الْمَحْوُ] .","bs_ranges":[[0,116]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Talk, od Zaide, od Asima, od Alija ibn Rebie, koji je rekao: \u003c/span>„Ibn el-Kevva upitao je Alija, alejhis-selam: ‘Šta je ovo crnilo na Mjesecu?’ Ali je odgovorio: ‘Znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi. To je brisanje.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>"},{"id":"76.2","ar":"حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ، قَالَ: حَدَّثَنَا إِسْرَائِيلُ، عَنْ أَبِي إِسْحَاقَ، عَنْ عُبَيْدِ بْنِ عُمَيْرٍ، قَالَ: [كنت عند على ع، فَسَأَلَهُ ابْنُ الْكَوَاءِ عَنِ السَّوَادِ الَّذِي فِي الْقَمَرِ فَقَالَ: ذَاكَ آيَةُ اللَّيْلِ مُحِيَتْ] .","bs":"Pričao nam je Ibn Beššar, koji je rekao: pričao nam je Abdurrahman, koji je rekao: pričao nam je Israil, od Ebu Ishaka, od Ubejda ibn Umejra, koji je rekao: „Bio sam kod Alija, alejhis-selam, pa ga je Ibn el-Kevva upitao o crnilu na Mjesecu. Odgovorio je: ‘To je znak noći koji je izbrisan.’“","ar_ranges":[[0,155]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ، قَالَ: حَدَّثَنَا إِسْرَائِيلُ، عَنْ أَبِي إِسْحَاقَ، عَنْ عُبَيْدِ بْنِ عُمَيْرٍ، قَالَ: \u003c/span>[كنت عند على ع، فَسَأَلَهُ ابْنُ الْكَوَاءِ عَنِ السَّوَادِ الَّذِي فِي الْقَمَرِ فَقَالَ: ذَاكَ آيَةُ اللَّيْلِ مُحِيَتْ] .","bs_ranges":[[0,157]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar, koji je rekao: pričao nam je Abdurrahman, koji je rekao: pričao nam je Israil, od Ebu Ishaka, od Ubejda ibn Umejra, koji je rekao: \u003c/span>„Bio sam kod Alija, alejhis-selam, pa ga je Ibn el-Kevva upitao o crnilu na Mjesecu. Odgovorio je: ‘To je znak noći koji je izbrisan.’“"},{"id":"76.3","ar":"حَدَّثَنَا ابْنُ أَبِي الشَّوَارِبِ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ:\nحَدَّثَنَا عِمْرَانُ بْنُ حُدَيْرٍ، عَنْ رفيع، ابى كثيره، قَالَ: [قَالَ عَلِيُّ بْنُ أَبِي طَالِبٍ رَضِيَ اللَّهُ عَنْهُ: سَلُوا عَمَّا شِئْتُمْ، فَقَامَ ابْنُ الْكَوَاءِ فَقَالَ: مَا السَّوَادُ الَّذِي فِي الْقَمَرِ؟ فَقَالَ: قَاتَلَكَ اللَّهُ! هَلا سَأَلْتَ عَنْ أَمْرِ دِينِكَ وَآخِرَتِكَ! ثُمَّ قَالَ:\n\nذَاكَ مَحْوُ اللَّيْلِ] .","bs":"Pričao nam je Ibn Ebu Ševarib, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Imran ibn Hudejr, od Refi‘a, Ebu Kesire, koji je rekao: „Ali ibn Ebu Talib, radijallahu anhu, rekao je: ‘Pitajte o čemu god hoćete.’ Ibn el-Kevva ustao je i rekao: ‘Šta je crnilo na Mjesecu?’ Odgovorio je: ‘Allah te ubio! Zašto nisi pitao o svojoj vjeri i budućem svijetu!’ Zatim je rekao: ‘To je brisanje noći.’“ ⟦Napomena prevodioca: ime i nadimak prenosioca u izvoru glase رفيع، ابى كثيره; posljednja riječ zahtijeva provjeru čitanja, pa ovdje nije zamijenjena drugim poznatim imenom.⟧","ar_ranges":[[0,207]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ أَبِي الشَّوَارِبِ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ:\nحَدَّثَنَا عِمْرَانُ بْنُ حُدَيْرٍ، عَنْ رفيع، ابى كثيره، قَالَ: [قَالَ عَلِيُّ بْنُ أَبِي طَالِبٍ رَضِيَ اللَّهُ عَنْهُ: \u003c/span>سَلُوا عَمَّا شِئْتُمْ، فَقَامَ ابْنُ الْكَوَاءِ فَقَالَ: مَا السَّوَادُ الَّذِي فِي الْقَمَرِ؟ فَقَالَ: قَاتَلَكَ اللَّهُ! هَلا سَأَلْتَ عَنْ أَمْرِ دِينِكَ وَآخِرَتِكَ! ثُمَّ قَالَ:\n\nذَاكَ مَحْوُ اللَّيْلِ] .","bs_ranges":[[0,163]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Ebu Ševarib, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Imran ibn Hudejr, od Refi‘a, Ebu Kesire, koji je rekao: \u003c/span>„Ali ibn Ebu Talib, radijallahu anhu, rekao je: ‘Pitajte o čemu god hoćete.’ Ibn el-Kevva ustao je i rekao: ‘Šta je crnilo na Mjesecu?’ Odgovorio je: ‘Allah te ubio! Zašto nisi pitao o svojoj vjeri i budućem svijetu!’ Zatim je rekao: ‘To je brisanje noći.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: ime i nadimak prenosioca u izvoru glase رفيع، ابى كثيره; posljednja riječ zahtijeva provjeru čitanja, pa ovdje nije zamijenjena drugim poznatim imenom.⟧\u003c/span>"},{"id":"76.4","ar":"حَدَّثَنَا زَكَرِيَّاءُ بْنُ يَحْيَى بْنِ أَبَانٍ الْمِصْرِيُّ، قَالَ: حَدَّثَنَا ابْنُ عُفَيْرٍ، قَالَ: حَدَّثَنَا ابْنُ لَهِيعَةَ، عَنْ حُيَيِّ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ، [أَنَّ رَجُلا قَالَ لِعَلِيٍّ رَضِيَ اللَّهُ عَنْهُ: مَا السَّوَادُ الَّذِي فِي الْقَمَرِ؟ قَالَ: إِنَّ اللَّهَ يَقُولُ: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً] » .","bs":"Pričao nam je Zekerijja ibn Jahja ibn Eban el-Misri, koji je rekao: pričao nam je Ibn Ufejr, koji je rekao: pričao nam je Ibn Lehi‘a, od Hujejja ibn Abdullaha, od Ebu Abdurrahmana, od Abdullaha ibn Amra ibn el-Asa, da je neki čovjek rekao Aliju, radijallahu anhu: „Šta je crnilo na Mjesecu?“ Odgovorio je: „Allah kaže: ‘I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi.’“ ⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧","ar_ranges":[[0,299]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا زَكَرِيَّاءُ بْنُ يَحْيَى بْنِ أَبَانٍ الْمِصْرِيُّ، قَالَ: حَدَّثَنَا ابْنُ عُفَيْرٍ، قَالَ: حَدَّثَنَا ابْنُ لَهِيعَةَ، عَنْ حُيَيِّ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ، [أَنَّ رَجُلا قَالَ لِعَلِيٍّ رَضِيَ اللَّهُ عَنْهُ: \u003c/span>مَا السَّوَادُ الَّذِي فِي الْقَمَرِ؟ قَالَ: إِنَّ اللَّهَ يَقُولُ: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً] » .","bs_ranges":[[0,215]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Zekerijja ibn Jahja ibn Eban el-Misri, koji je rekao: pričao nam je Ibn Ufejr, koji je rekao: pričao nam je Ibn Lehi‘a, od Hujejja ibn Abdullaha, od Ebu Abdurrahmana, od Abdullaha ibn Amra ibn el-Asa, \u003c/span>da je neki čovjek rekao Aliju, radijallahu anhu: „Šta je crnilo na Mjesecu?“ Odgovorio je: „Allah kaže: ‘I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>"},{"id":"76.5","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ: حَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَوْلَهُ: «وَجَعَلْنَا","bs":"Pričao mi je Muhammed ibn Sa‘d, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je moj amidža, koji je rekao: pričao mi je moj otac, od svoga oca, od Ibn Abbasa, o Njegovim riječima: „I","ar_ranges":[[0,155]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ: حَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَوْلَهُ: \u003c/span>«وَجَعَلْنَا","bs_ranges":[[0,198]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sa‘d, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je moj amidža, koji je rekao: pričao mi je moj otac, od svoga oca, od Ibn Abbasa, o Njegovim riječima: \u003c/span>„I"}],"notes":[]},{"n":77,"ar":"اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ» ، قَالَ: هُوَ السَّوَادُ بِاللَّيْلِ.\nحَدَّثَنَا الْقَاسِمُ، قَالَ: حدثنا الحسين، قال: حدثنا حجاج، عن ابن جُرَيْجٍ قَالَ: قَالَ ابْنُ عَبَّاسٍ: كَانَ الْقَمَرُ يُضِيءُ كَمَا تُضِيءُ الشَّمْسُ، وَالْقَمَرُ آيَةُ اللَّيْلِ، والشمس آيه النهار، «فَمَحَوْنا آيَةَ اللَّيْلِ» ، قال: السواد الذي في القمر، كذلك خلقه الله.\nحَدَّثَنَا الْقَاسِمُ، قَالَ: حَدَّثَنِي الْحُسَيْنُ، قَالَ: حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، عَنْ مُجَاهِدٍ: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ» ، قَالَ: لَيْلا وَنَهَارًا كَذَلِكَ خَلَقَهُمَا اللَّهُ عَزَّ وَجَلَّ.\n\nقَالَ ابْنُ جُرَيْجٍ: وَأَخْبَرَنَا عَبْدُ اللَّهِ بْنُ كَثِيرٍ، قَالَ: «فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، قَالَ: ظُلْمَةُ اللَّيْلِ وَسَدَفُ النَّهَارِ.\nحَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ: حَدَّثَنَا سَعِيدٌ عَنْ قَتَادَةَ، قوله عز وجل: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ» ، كنا نحدث أن محو آية الليل سواد القمر الذي فيه، «وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، منيرة، وخلق الشمس أنور من القمر وأعظم.\nحدثنا محمد بن عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى وحدثني الحارث، قال: حدثنا الحسن، قال: حدثنا ورقاء، جميعا عن ابن أبي نجيح، عن مجاهد: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ» ، قال: ليلا ونهارا، كذلك جعلهما الله عز وجل","bs":"\u003cp data-paragraph=\"77.1\">noć i dan učinili smo dvama znakovima; znak noći izbrisali smo.“ Rekao je: „To je crnilo u noći.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"77.2\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao nam je Hadždžadž, od Ibn Džurejdža, koji je rekao: Ibn Abbas je rekao: „Mjesec je svijetlio kao što svijetli Sunce. Mjesec je znak noći, a Sunce znak dana. ‘Znak noći izbrisali smo.’“ Rekao je: „Crnilo koje je na Mjesecu — tako ga je Allah stvorio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"77.3\">Pričao nam je Kasim, koji je rekao: pričao mi je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, od Mudžahida, o riječima: „I noć i dan učinili smo dvama znakovima.“ Rekao je: „Noć i dan — tako ih je Allah, Silan i Uzvišen, stvorio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"77.4\">Ibn Džurejdž je rekao: „Obavijestio nas je i Abdullah ibn Kesir.“ Rekao je, o riječima: „Znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi“: „Tama noći i sedef dana.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio. Napomena prevodioca: سدف النهار u izvoru nema potpune oznake za izgovor. Riječ „sedef“ ovdje je transliteracija tog arapskog izraza, a ne bosanski naziv za materijal. Čitanje i značenje ovog izraza u navedenom spoju nisu sigurno utvrđeni.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"77.5\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, o riječima Njega, Silnog i Uzvišenog: „I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo.“ „Nama se prenosilo da je brisanje znaka noći crnilo koje je na Mjesecu. ‘A znak dana učinili takvim da se pomoću njega vidi’ — svijetlim. Sunce je stvorio svjetlijim i većim od Mjeseca.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Isra, 17:12, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"77.6\">Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa; a pričao mi je i Haris, koji je rekao: pričao nam je Hasen, koji je rekao: pričao nam je Verka — svi od Ibn Ebu Nedžiha, od Mudžahida, o riječima: „I noć i dan učinili smo dvama znakovima.“ Rekao je: „Noć i dan — tako ih je Allah, Silan i Uzvišen, učinio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"77.1","ar":"اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ» ، قَالَ: هُوَ السَّوَادُ بِاللَّيْلِ.","bs":"noć i dan učinili smo dvama znakovima; znak noći izbrisali smo.“ Rekao je: „To je crnilo u noći.“ ⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: El-Isra, 17:12, navedeni dio.⟧","ar_ranges":[],"ar_html":"اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ» ، قَالَ: هُوَ السَّوَادُ بِاللَّيْلِ.","bs_ranges":[],"bs_html":"noć i dan učinili smo dvama znakovima; znak noći izbrisali smo.“ Rekao je: „To je crnilo u noći.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: El-Isra, 17:12, navedeni dio.⟧\u003c/span>"},{"id":"77.2","ar":"حَدَّثَنَا الْقَاسِمُ، قَالَ: حدثنا الحسين، قال: حدثنا حجاج، عن ابن جُرَيْجٍ قَالَ: قَالَ ابْنُ عَبَّاسٍ: كَانَ الْقَمَرُ يُضِيءُ كَمَا تُضِيءُ الشَّمْسُ، وَالْقَمَرُ آيَةُ اللَّيْلِ، والشمس آيه النهار، «فَمَحَوْنا آيَةَ اللَّيْلِ» ، قال: السواد الذي في القمر، كذلك خلقه الله.","bs":"Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao nam je Hadždžadž, od Ibn Džurejdža, koji je rekao: Ibn Abbas je rekao: „Mjesec je sv tml":"\u003cspan class=\"isnad\">Pričao nam je Kasim, koji je rekao: pričao mi je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, od Mudžahida, \u003c/span>o riječima: „I noć i dan učinili smo dvama znakovima.“ Rekao je: „Noć i dan — tako ih je Allah, Silan i Uzvišen, stvorio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>"},{"id":"77.4","ar":"قَالَ ابْنُ جُرَيْجٍ: وَأَخْبَرَنَا عَبْدُ اللَّهِ بْنُ كَثِيرٍ، قَالَ: «فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، قَالَ: ظُلْمَةُ اللَّيْلِ وَسَدَفُ النَّهَارِ.","bs":"Ibn Džurejdž je rekao: „Obavijestio nas je i Abdullah ibn Kesir.“ Rekao je, o riječima: „Znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi“: „Tama noći i sedef dana.“ ⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio. Napomena prevodioca: سدف النهار u izvoru nema potpune oznake za izgovor. Riječ „sedef“ ovdje je transliteracija tog arapskog izraza, a ne bosanski naziv za materijal. Čitanje i značenje ovog izraza u navedenom spoju nisu sigurno utvrđeni.⟧","ar_ranges":[[22,72]],"ar_html":"قَالَ ابْنُ جُرَيْجٍ: \u003cspan class=\"isnad\">وَأَخْبَرَنَا عَبْدُ اللَّهِ بْنُ كَثِيرٍ، قَالَ: \u003c/span>«فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، قَالَ: ظُلْمَةُ اللَّيْلِ وَسَدَفُ النَّهَارِ.","bs_ranges":[[24,64]],"bs_html":"Ibn Džurejdž je rekao: „\u003cspan class=\"isnad\">Obavijestio nas je i Abdullah ibn Kesir.\u003c/span>“ Rekao je, o riječima: „Znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi“: „Tama noći i sedef dana.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio. Napomena prevodioca: سدف النهار u izvoru nema potpune oznake za izgovor. Riječ „sedef“ ovdje je transliteracija tog arapskog izraza, a ne bosanski naziv za materijal. Čitanje i značenje ovog izraza u navedenom spoju nisu sigurno utvrđeni.⟧\u003c/span>"},{"id":"77.5","ar":"حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ: حَدَّثَنَا سَعِيدٌ عَنْ قَتَادَةَ، قوله عز وجل: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ» ، كنا نحدث أن محو آية الليل سواد القمر الذي فيه، «وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، منيرة، وخلق الشمس أنور من القمر وأعظم.","bs":"Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, o riječima Njega, Silnog i Uzvišenog: „I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo.“ „Nama se prenosilo da je brisanje znaka noći crnilo koje je na Mjesecu. ‘A znak dana učinili takvim da se pomoću njega vidi’ — svijetlim. Sunce je stvorio svjetlijim i većim od Mjeseca.“ ⟦Prijevodi kur’anskih navoda: El-Isra, 17:12, navedeni dijelovi.⟧","ar_ranges":[[0,128]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ: حَدَّثَنَا سَعِيدٌ عَنْ قَتَادَةَ، قوله عز وجل: \u003c/span>«وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ» ، كنا نحدث أن محو آية الليل سواد القمر الذي فيه، «وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، منيرة، وخلق الشمس أنور من القمر وأعظم.","bs_ranges":[[0,122]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo.“ „Nama se prenosilo da je brisanje znaka noći crnilo koje je na Mjesecu. ‘A znak dana učinili takvim da se pomoću njega vidi’ — svijetlim. Sunce je stvorio svjetlijim i većim od Mjeseca.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Isra, 17:12, navedeni dijelovi.⟧\u003c/span>"},{"id":"77.6","ar":"حدثنا محمد بن عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى وحدثني الحارث، قال: حدثنا الحسن، قال: حدثنا ورقاء، جميعا عن ابن أبي نجيح، عن مجاهد: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ» ، قال: ليلا ونهارا، كذلك جعلهما الله عز وجل","bs":"Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa; a pričao mi je i Haris, koji je rekao: pričao nam je Hasen, koji je rekao: pričao nam je Verka — svi od Ibn Ebu Nedžiha, od Mudžahida, o riječima: „I noć i dan učinili smo dvama znakovima.“ Rekao je: „Noć i dan — tako ih je Allah, Silan i Uzvišen, učinio.“ ⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧","ar_ranges":[[0,141]],"ar_html":"\u003cspan class=\"isnad\">حدثنا محمد بن عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى وحدثني الحارث، قال: حدثنا الحسن، قال: حدثنا ورقاء، جميعا عن ابن أبي نجيح، عن مجاهد: \u003c/span>«وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ» ، قال: ليلا ونهارا، كذلك جعلهما الله عز وجل","bs_ranges":[[0,240]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa; a pričao mi je i Haris, koji je rekao: pričao nam je Hasen, koji je rekao: pričao nam je Verka — svi od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>o riječima: „I noć i dan učinili smo dvama znakovima.“ Rekao je: „Noć i dan — tako ih je Allah, Silan i Uzvišen, učinio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>"}],"notes":[]}]}</script><script id="databaseData" type="application/json">[{"stranica":53,"ar_tekst":"تَفْخَرُ عَلَى الأَرْضِ، فَذَلِكَ قَوْلُهُ تَعَالَى: «وَأَلْقى فِي الْأَرْضِ رَواسِيَ أَنْ تَمِيدَ بِكُمْ*» .","bs_tekst":"ponose nad Zemljom. To su Njegove, Uzvišeni je On, riječi: ‘I po Zemlji je postavio čvrste planine da se ne ljulja s vama.’“ ⟦Prijevod kur’anskog navoda: isti izraz nalazi se u En-Nahl, 16:15, i Lukman, 31:10. Izvor ovdje ne navodi broj ajeta.⟧"},{"stranica":53,"ar_tekst":"قال أبو جعفر: فقد أنبأ قول هؤلاء الذين ذكرت: إن الله تعالى أخرج من الماء دخانا حين أراد أن يخلق السموات والأرض، فسما عليه- يعنون بقولهم:\n\nفسما عليه علا على الماء، وكل شيء كان فوق شيء عاليا عليه فهو له سماء- ثم أيبس بعد ذلك الماء، فجعله أرضا واحدة- إن الله خلق السماء غير مسواة قبل الأرض، ثم خلق الأرض.","bs_tekst":"Ebu Džafer kaže: Riječi ovih koje sam spomenuo — da je Uzvišeni Allah iz vode izveo dim kada je htio stvoriti nebesa i Zemlju, pa se dim uzvisio nad njom; pod riječima „uzvisio se nad njom“ misle da se podigao iznad vode, a sve što je iznad nečega i nad njim se uzdiže njemu je nebo; zatim je nakon toga osušio vodu i učinio je jednom zemljom — pokazuju da je Allah stvorio još neuređeno nebo prije Zemlje, a zatim je stvorio Zemlju."},{"stranica":53,"ar_tekst":"وإن كان الأمر كما قال هؤلاء، فغير محال أن يكون الله تعالى أثار من الماء دخانا فعلاه على الماء، فكان له سماء، ثم ايبس الماء فصار الدخان الذي سما عليه أرضا، ولم يدحها، ولم يقدر فيها أقواتها، ولم يخرج منها ماءها ومرعاها، حتى استوى إلى السماء، التي هي الدخان الثائر من الماء العالي عليه، فسواهن سبع سموات، ثم دحا الأرض التي كانت ماء فيبسه ففتقه، فجعلها سبع أرضين، وقدر فيها أقواتها، و «أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» ، كما قال عز وجل فيكون كل الذي روي عن ابن عباس في ذلك- على ما رويناه- صحيحا معناه.","bs_tekst":"Ako je stvar onakva kako su ovi rekli, nije nemoguće da je Uzvišeni Allah iz vode podigao dim, uzvisio ga nad vodom i da joj je on bio nebo; zatim je osušio vodu, pa je dim koji se uzvisio nad njom postao zemljom. Nije je rasprostro, niti je na njoj odredio njenu opskrbu, niti je iz nje izveo njenu vodu i njene pašnjake, sve dok se nije usmjerio prema nebu, koje je dim podignut iz vode i uzdignut nad njom, i od njih sačinio sedam nebesa. Zatim je rasprostro Zemlju, koja je bila voda, pa ju je osušio, razdvojio i učinio je sedmerim zemljama, odredio na njoj njenu opskrbu i „iz nje izveo njenu vodu i njene pašnjake, a planine učvrstio“, kako je rekao On, Silan i Uzvišen. Tako je sve što je od Ibn Abbasa o tome preneseno — onako kako smo prenijeli — ispravnog značenja. ⟦Prijevod kur’anskog navoda: En-Naziat, 79:31–32. Napomena prevodioca: izvor doslovno kaže „pa je dim koji se uzvisio nad njom postao zemljom“ (فصار الدخان الذي سما عليه أرضا), što nije jasno usklađeno s prethodnim objašnjenjem o osušenoj vodi. Formulacija je sačuvana, bez prešutne ispravke; treba provjeriti štampano izdanje.⟧"},{"stranica":53,"ar_tekst":"وأما يوم الاثنين فقد ذكرنا اختلاف العلماء فيما خلق فيه، وما روي في ذلك عن رسول الله ص قبل.","bs_tekst":"Što se tiče ponedjeljka, već smo ranije spomenuli razilaženje učenih o onome što je u njemu stvoreno i ono što je o tome preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem."},{"stranica":53,"ar_tekst":"وأما ما خلق في يوم الثلاثاء والأربعاء، فقد ذكرنا أيضا بعض ما روي فيه، ونذكر في هذا الموضع بعض ما لم نذكر منه قبل.","bs_tekst":"Što se tiče onoga što je stvoreno u utorak i srijedu, već smo također spomenuli neke predaje o tome, a ovdje ćemo navesti neke koje ranije nismo naveli."},{"stranica":53,"ar_tekst":"فالذي صح عندنا أنه خلق فيهما ما حَدَّثَنِي به موسى بن هارون، قال: حدثنا عمرو بن حماد، حدثنا أسباط، عن السدي، في خبر ذكره","bs_tekst":"Prema onome što je kod nas potvrđeno, u ta dva dana stvoreno je ono o čemu mi je pričao Musa ibn Harun: rekao je: pričao nam je Amr ibn Hammad: pričao nam je Esbat, od Suddija, u izvješću koje je naveo"},{"stranica":54,"ar_tekst":"عن أبي مالك، وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن عبد الله بن مسعود- وعن ناس من أصحاب رسول الله ص:","bs_tekst":"od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem:"},{"stranica":54,"ar_tekst":"وخلق الجبال فيها- يعني في الأرض- وأقوات أهلها وشجرها وما ينبغي لها في يومين: في الثلاثاء والأربعاء، وذلك حين يقول الله عز وجل: «قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ» ، يقول: من سأل فهكذا الأمر، ثم استوى إِلَى السَّمَاءِ وَهِيَ دُخَانٌ، وكان ذلك الدخان من تنفس الماء حين تنفس، فجعلها سماء واحدة، ثم فتقها فجعلها سبع سموات في يومين في الخميس والجمعة.","bs_tekst":"„Na njoj — misli se na Zemlju — stvorio je planine, opskrbu njenih stanovnika, njeno drveće i ono što joj treba u dva dana: u utorak i srijedu. To je ono kada Allah, Silan i Uzvišen, kaže: ‘Reci: Zar vi doista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova! Na njoj je, povrh nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu opskrbu u četiri dana, jednako za one koji pitaju.’ Kaže: Ko pita, stvar je takva. Zatim se usmjerio prema nebu, a ono je bilo dim. Taj je dim potekao od isparavanja vode kada je isparavala. Učinio ga je jednim nebom, zatim ga razdvojio i učinio ga sedmerim nebesima u dva dana: u četvrtak i petak.“ ⟦Prijevod izdvojenog kur’anskog navoda: Fussilet, 41:9–10.⟧"},{"stranica":54,"ar_tekst":"حَدَّثَنِي الْمُثَنَّى، قَالَ: حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، قَالَ: إِنَّ اللَّهَ تَعَالَى خَلَقَ الأَقْوَاتَ وَالرَّوَاسِيَ فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ.","bs_tekst":"Pričao mi je Musenna: rekao je: pričao nam je Ebu Salih: rekao je: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, koji je rekao: „Uzvišeni Allah stvorio je opskrbu i čvrste planine u utorak i srijedu.“"},{"stranica":54,"ar_tekst":"حَدَّثَنِي تميم بن المنتصر، قال: أخبرنا إسحاق، عن شَرِيكٍ، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\nإِنَّ اللَّهَ تَعَالَى خَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ فَذَلِكَ قَوْلُ النَّاسِ: هُوَ يَوْمٌ ثَقِيلٌ.","bs_tekst":"Pričao mi je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Uzvišeni Allah stvorio je planine u utorak. Otuda riječi ljudi: ‘To je težak dan.’“"},{"stranica":54,"ar_tekst":"قال أبو جعفر: والصواب من القول في ذلك عندنا، ما رويناه [عن النبي ص، قال: إن الله تعالى خلق يوم الثلاثاء الجبال وما فيهن من المنافع، وخلق يوم الأربعاء الشجر، والماء، والمدائن، والعمران، والخراب] حَدَّثَنَا بِذَلِكَ هَنَّادٌ، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عن ابن عباس، عن النبي ص.","bs_tekst":"Ebu Džafer kaže: Ispravno mišljenje o tome kod nas jeste ono što smo prenijeli od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Uzvišeni Allah stvorio je u utorak planine i koristi koje su u njima, a u srijedu je stvorio drveće, vodu, gradove, nastanjenost i opustjelost.“ To nam je pričao Hennad: rekao je: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem."},{"stranica":54,"ar_tekst":"وقد روى عن النبي ص أَنَّ اللَّهَ خَلَقَ الْجِبَالَ يَوْمَ الأَحَدِ، وَالشَّجَرَ يَوْمَ الاثْنَيْنِ، وَخَلَقَ الْمَكْرُوهَ يَوْمَ الثُّلاثَاءِ، وَالنُّورَ يوم الأربعاء،","bs_tekst":"Od Vjerovjesnika, sallallahu alejhi ve sellem, preneseno je i da je Allah stvorio planine u nedjelju, drveće u ponedjeljak, ono što je neugodno u utorak, a svjetlost u srijedu."},{"stranica":55,"ar_tekst":"حَدَّثَنِي به القاسم بن بشر بن معروف، والحسين بن علي الصدائي، قالا:\n\nحدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مولى أم سلمة، عن أبي هريرة، عن النبي ص.","bs_tekst":"To su mi pričali Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem."},{"stranica":55,"ar_tekst":"والخبر الأول أصح مخرجا، وأولى بالحق، لأنه قول أكثر السلف.","bs_tekst":"Prva predaja ima vjerodostojniji put prenošenja i bliža je istini jer predstavlja mišljenje većine prethodnika."},{"stranica":55,"ar_tekst":"وأما يوم الخميس فإنه خلق فيه السموات، ففتقت بعد أن كانت رتقا، كما حَدَّثَنِي موسى بن هارون، قال: حدثنا عمرو بن حماد، قال:\n\nحدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك، وعن أبي صالح عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب النبي ص: «ثُمَّ اسْتَوى إِلَى السَّماءِ وَهِيَ دُخانٌ» ، وكان ذلك الدخان من تنفس الماء حين تنفس وجعلها سماء واحدة، ثم فتقها فجعلها سبع سموات في يومين، في الخميس والجمعة.","bs_tekst":"Što se tiče četvrtka, u njemu je stvorio nebesa, pa su razdvojena nakon što su bila spojena, kako mi je pričao Musa ibn Harun: rekao je: pričao nam je Amr ibn Hammad: rekao je: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: „Zatim se usmjerio prema nebu, a ono je bilo dim.“ Taj dim potekao je od isparavanja vode kada je isparavala. Učinio ga je jednim nebom, zatim ga razdvojio i učinio ga sedmerim nebesima u dva dana, u četvrtak i petak. ⟦Prijevod kur’anskog navoda: Fussilet, 41:11, dio ajeta.⟧"},{"stranica":55,"ar_tekst":"وإنما سمي يوم الجمعة لأنه جمع فيه خلق السموات والأرض «وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها» قال: خلق في كل سماء خلقها من الملائكة، والخلق الذي فيها من البحار وجبال البرد وما لم يعلم، ثم زين السماء الدنيا بالكواكب، فجعلها زينة وحفظا، تحفظ من الشياطين، فلما فرغ من خلق ما أحب استوى على العرش فذلك حين يقول: «خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ*» ، ويقول:\n\n«كانَتا رَتْقاً فَفَتَقْناهُما» .","bs_tekst":"Petak je nazvan jevmul-džumu‘a jer je u njemu objedinjeno stvaranje nebesa i Zemlje. „I svakome nebu objavio je njegovu odredbu.“ Rekao je: „Na svakom nebu stvorio je njegove meleke i stvorenja koja su na njemu: mora, planine od grada i ono što nije poznato. Zatim je najbliže nebo ukrasio nebeskim tijelima, učinio ih ukrasom i zaštitom koja štiti od šejtana. Kada je dovršio stvaranje onoga što je htio, uzvisio se nad Aršom. To je ono kada kaže: ‘Stvorio je nebesa i Zemlju u šest dana’, i kada kaže: ‘Bili su spojena cjelina, pa smo ih razdvojili.’“ ⟦Prijevodi kur’anskih navoda, redom: Fussilet, 41:12, dio ajeta; izraz o stvaranju u šest dana javlja se na više mjesta, između ostalog u El-A‘raf, 7:54, i Hud, 11:7; El-Enbija, 21:30, dio ajeta. „Planine od grada“ ovdje znači planine od ledenih zrna; navedeno je dio predaje.⟧"},{"stranica":55,"ar_tekst":"حَدَّثَنِي الْمُثَنَّى، حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، قَالَ: إِنَّ اللَّهَ تَعَالَى خَلَقَ السَّمَوَاتِ فِي الْخَمِيسِ وَالْجُمُعَةِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ،","bs_tekst":"Pričao mi je Musenna: pričao nam je Ebu Salih: rekao je: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, koji je rekao: „Uzvišeni Allah stvorio je nebesa u četvrtak i petak i dovršio je u posljednjem satu petka,"},{"stranica":56,"ar_tekst":"فَخَلَقَ فِيهَا آدَمَ عَلَى عَجَلٍ، فَتِلْكَ السَّاعَةُ التي تقوم فيها الساعة.","bs_tekst":"pa je u njemu u žurbi stvorio Adema. To je sat u kojem će nastupiti Čas.“"},{"stranica":56,"ar_tekst":"حدثني تميم بن المنتصر، قال: أخبرنا إسحاق، عَنْ شَرِيكٍ، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّهَ تَعَالَى خَلَقَ مَوَاضِعَ الأَنْهَارِ والشجر يوم الأربعاء، وخلق الطير والوحوش وَالْهَوَامَّ وَالسِّبَاعَ يَوْمَ الْخَمِيسِ، وَخَلَقَ الإِنْسَانَ يَوْمَ الْجُمُعَةِ، فَفَرَغَ مِنْ خَلْقِ كُلِّ شَيْءٍ يَوْمَ الْجُمُعَةِ","bs_tekst":"Pričao mi je Temim ibn el-Muntesir, koji je rekao: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Uzvišeni Allah stvorio je mjesta rijeka i drveće u srijedu, a ptice, divlje životinje, gmizavce i zvijeri u četvrtak. Čovjeka je stvorio u petak i u petak je dovršio stvaranje svega.“"},{"stranica":56,"ar_tekst":"وهذا الذي قاله من ذكرنا قوله، من أن الله عز وجل خلق السموات والملائكة وآدم في يوم الخميس والجمعة، هو الصحيح عندنا، للخبر الذي حَدَّثَنَا بِهِ هَنَّادُ بن السري قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عن ابن عباس، عن النبي ص- قَالَ:\nهَنَّادٌ، وَقَرَأْتُ سَائِرَ الْحَدِيثِ- قَالَ: وَخَلَقَ يَوْمَ الْخَمِيسِ السَّمَاءَ، وَخَلَقَ يَوْمَ الْجُمُعَةِ النُّجُومَ وَالشَّمْسَ وَالْقَمَرَ وَالْمَلائِكَةَ إِلَى ثَلاثِ سَاعَاتٍ بَقِيَتْ مِنْهُ، فَخَلَقَ فِي أَوَّلِ سَاعَةٍ مِنْ هَذِهِ الثَّلاثِ سَاعَاتِ الآجَالَ، مَنْ يَحْيَا وَمَنْ يَمُوتُ، وَفِي الثَّانِيَةِ أَلْقَى الآفَةَ عَلَى كُلِّ شَيْءٍ مِمَّا يَنْتَفِعُ بِهِ النَّاسُ، وَفِي الثَّالِثَةِ آدَمَ وَأَسْكَنَهُ الْجَنَّةَ، وَأَمَرَ إِبْلِيسَ بِالسُّجُودِ، وَأَخْرَجَهُ مِنْهَا فِي آخِرِ سَاعَةٍ.","bs_tekst":"Ono što su rekli oni čije smo riječi spomenuli — da je Allah, Silan i Uzvišen, stvorio nebesa, meleke i Adema u četvrtak i petak — kod nas je ispravno, zbog predaje koju nam je pričao Hennad ibn es-Serijj, koji je rekao: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem — Hennad je rekao: „Ostatak hadisa sam pročitao“ — da je rekao: „U četvrtak je stvorio nebo, a u petak je stvarao zvijezde, Sunce, Mjesec i meleke, do preostala tri sata toga dana. U prvom od ta tri sata stvorio je rokove života, ko će živjeti i ko će umrijeti. U drugom je pustio nedaću na sve čime se ljudi koriste. U trećem je stvorio Adema, nastanio ga u Džennetu, naredio Iblisu da učini sedždu i izveo ga iz njega u posljednjem satu.“ ⟦Napomena prevodioca: zamjenica u „izveo ga iz njega“ prenosi arapsko وأخرجه منها; samo ovo mjesto ne razrješava izričito na koga se „ga“ odnosi.⟧"},{"stranica":56,"ar_tekst":"حَدَّثَنِي الْقَاسِمُ بْنُ بِشْرِ بن معروف، والحسين بن علي الصدائي، قالا: حدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن اميه، عن أيوب ابن خالد، عن عبد الله بن رافع مولى أُمِّ سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [أَخَذَ رسول الله ص بِيَدِي فَقَالَ: وَبَثَّ فِيهَا- يَعْنِي فِي الأَرْضِ- الدَّوَابَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ بَعْدَ الْعَصْرِ مِنْ يَوْمِ الْجُمُعَةِ آخِرَ خَلْقٍ فِي آخِرِ سَاعَةٍ، مِنْ سَاعَاتِ الْجُمُعَةِ فِيمَا بَيْنَ الْعَصْرِ الى الليل] .","bs_tekst":"Pričali su mi Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, uzeo me za ruku i rekao: ‘Po njoj — misli se na Zemlju — rasijao je životinje u četvrtak, a Adema je stvorio poslije ikindije u petak, kao posljednje stvorenje, u posljednjem satu petka, između ikindije i noći.’“"},{"stranica":56,"ar_tekst":"فإذا كان الله تعالى ذكره خلق الخلق من لدن ابتداء خلق السموات والأرض إلى حين فراغه من خلق جميعهم في ستة أيام، وكان كل يوم من","bs_tekst":"Ako je Allah, Uzvišen je spomen Njegov, stvorio stvorenja od početka stvaranja nebesa i Zemlje do dovršetka stvaranja svih njih u šest dana, a svaki od"},{"stranica":57,"ar_tekst":"الأيام الستة التي خلقهم فيها مقداره ألف سنة من أيام الدنيا، وكان بين ابتدائه في خلق ذلك وخلق القلم الذي أمره بكتابه كل ما هو كائن إلى قيام الساعة ألف عام، وذلك يوم من أيام الآخرة التي قدر اليوم الواحد منها ألف عام من أيام الدنيا- كان معلوما أن قدر مدة ما بين أول ابتداء ربنا عز وجل في خلق ما خلق من خلقه إلى الفراغ من آخرهم سبعة آلاف عام يزيد إن شاء الله شيئا أو ينقص شيئا، على ما قد روينا من الآثار والأخبار التي ذكرناها، وتركنا ذكر كثير منها كراهة إطالة الكتاب بذكرها.","bs_tekst":"šest dana u kojima ih je stvorio trajao hiljadu godina od dana ovoga svijeta, te ako je između početka toga stvaranja i stvaranja pera, kojem je naredio da zapiše sve što će biti do nastupanja Časa, bilo hiljadu godina — a to je jedan od dana budućeg svijeta, od kojih jedan traje hiljadu godina ovoga svijeta — onda je poznato da je razdoblje od prvog početka stvaranja stvorenja našeg Gospodara, Silnog i Uzvišenog, do dovršetka stvaranja posljednjeg od njih iznosilo sedam hiljada godina, uz nešto više ili manje, ako Allah htjedne, prema predajama i izvješćima koja smo prenijeli i spomenuli. Mnoga od njih nismo naveli jer nismo željeli njihovim navođenjem oduljiti knjigu."},{"stranica":57,"ar_tekst":"وإذا كان ذلك كذلك، وكان صحيحا أن مدة ما بين فراغ ربنا تعالى ذكره- من خلق جميع خلقه إلى وقت فناء جميعهم بما قد دللنا قبل، واستشهدنا من الشواهد، وبما سنشرح فيما بعد- سبعة آلاف سنة، تزيد قليلا أو تنقص قليلا- كان معلوما بذلك أن مدة ما بين أول خلق خلقه الله تعالى إلى قيام الساعة وفناء جميع العالم، أربعة عشر ألف عام من أعوام الدنيا، وذلك أربعة عشر يوما من أيام الآخرة، سبعة أيام من ذلك- وهي سبعة آلاف عام من أعوام الدنيا- مدة ما بين أول ابتداء الله جل وتقدس في خلق أول خلقه إلى فراغه من خلق آخرهم- وهو آدم ابو البشر ص، وسبعة أيام أخر، وهي سبعة آلاف عام من أعوام الدنيا، من ذلك مدة ما بين فراغه جل ثناؤه من خلق آخر خلقه- وهو آدم- إلى فناء آخرهم وقيام الساعة، وعود الأمر إلى ما كان عليه قبل أن يكون شيء غير القديم البارئ الذي له الخلق والأمر الذي كان قبل كل شيء، فلا شيء كان قبله، والكائن بعد كل شيء فلا شيء يبقى غير وجهه الكريم.","bs_tekst":"Ako je tako, i ako je tačno da je razdoblje od vremena kada je naš Gospodar, Uzvišen je spomen Njegov, dovršio stvaranje svih Svojih stvorenja do vremena nestanka svih njih — prema onome što smo ranije dokazivali, potkrijepili svjedočanstvima i što ćemo kasnije objasniti — sedam hiljada godina, uz nešto više ili manje, onda je time poznato da razdoblje od prvog stvorenja koje je Uzvišeni Allah stvorio do nastupanja Časa i nestanka cijelog svijeta iznosi četrnaest hiljada godina ovoga svijeta. To je četrnaest dana budućeg svijeta. Sedam od tih dana — odnosno sedam hiljada godina ovoga svijeta — razdoblje je od prvog početka Allahovog stvaranja, Uzvišen je i Svet, do dovršetka stvaranja posljednjeg od njih, a to je Adem, otac čovječanstva, sallallahu alejhi ve sellem. Drugih sedam dana, odnosno sedam hiljada godina ovoga svijeta, razdoblje je od vremena kada je Onaj čija je hvala uzvišena dovršio stvaranje Svoga posljednjeg stvorenja — Adema — do nestanka posljednjeg od njih i nastupanja Časa. Tada će se stanje vratiti na ono kakvo je bilo prije nego što je bilo išta osim Bespočetnog Tvorca, kojem pripadaju stvaranje i naredba, koji je bio prije svega pa prije Njega nije bilo ničega, i koji ostaje poslije svega pa ne ostaje ništa osim Njegovog plemenitog Lica."},{"stranica":57,"ar_tekst":"فإن قال قائل: وما دليلك على أن الأيام الستة التي خلق الله فيهن خلقه كان قدر كل يوم منهن قدر ألف عام من أعوام الدنيا دون أن يكون ذلك","bs_tekst":"Ako neko kaže: „Koji je tvoj dokaz da je svaki od šest dana u kojima je Allah stvarao Svoja stvorenja trajao hiljadu godina ovoga svijeta, umjesto da su ti dani bili"},{"stranica":58,"ar_tekst":"كأيام أهل الدنيا التي يتعارفونها بينهم، وإنما قال الله عز وجل في كتابه:\n«الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ*» ، فلم يعلمنا أن ذلك كما ذكرت، بل أخبرنا أنه خلق ذلك في ستة أيام، والأيام المعروفة عند المخاطبين بهذه المخاطبة هي أيامهم التي أول اليوم منها طلوع الفجر إلى غروب الشمس، ومن قولك: إن خطاب الله عباده بما خاطبهم به في تنزيله إنما هو موجه إلى الأشهر والأغلب عليه من معانيه، وقد وجهت خبر الله في كتابه عن خلقه السموات والأرض وما بينهما في ستة أيام إلى غير المعروف من معاني الأيام، وأمر الله عز وجل إذا أراد شيئا أن يكونه أنفذ وأمضى من أن يوصف بأنه خلق السموات والأرض وما بينهما في ستة أيام، مقدارهن ستة آلاف عام من أعوام الدنيا، وإنما أمره إذا أراد شيئا أن يقول له: كن فيكون، وذلك كما قال ربنا تبارك وتعالى: «وَما أَمْرُنا إِلَّا واحِدَةٌ كَلَمْحٍ بِالْبَصَرِ» ؟","bs_tekst":"poput dana koje ljudi ovoga svijeta među sobom poznaju? Allah, Silan i Uzvišen, u Svojoj Knjizi samo kaže: ‘Onaj koji je stvorio nebesa, Zemlju i ono što je između njih u šest dana.’ Nije nas obavijestio da je to onako kako si spomenuo, nego da je to stvorio u šest dana. Dani koje poznaju oni kojima su te riječi upućene njihovi su dani, od pojave zore do zalaska Sunca. Ti kažeš da se Allahovo obraćanje robovima u Njegovoj Objavi tumači prema najpoznatijem i preovlađujućem značenju tih riječi, a Njegovo izvješće u Knjizi o stvaranju nebesa, Zemlje i onoga što je između njih u šest dana usmjerio si prema značenju dana koje nije uobičajeno. Kada Allah, Silan i Uzvišen, želi da nešto nastane, Njegova naredba djelotvornija je i izvršnija od toga da se opisuje kako je nebesa, Zemlju i ono što je između njih stvarao šest dana koji traju šest hiljada godina ovoga svijeta. Njegova je naredba, kada nešto želi, samo da tome kaže: Budi! — i ono bude. To je kao što je naš Gospodar, Blagoslovljen i Uzvišen, rekao: ‘A Naša je naredba samo jedna, kao treptaj oka.’“ ⟦Prijevodi kur’anskih navoda: izraz o šest dana nalazi se, između ostalog, u El-Furkan, 25:59, i Es-Sedžda, 32:4; drugi izričiti navod je El-Kamer, 54:50.⟧"},{"stranica":58,"ar_tekst":"قيل له: قد قلنا فيما تقدم من كتابنا هذا إنا إنما نعتمد في معظم ما نرسمه في كتابنا هذا على الآثار والاخبار عن نبينا ص وعن السلف الصالحين قبلنا دون الاستخراج بالعقول والفكر، إذ أكثره خبر عما مضى من الأمور، وعما هو كائن من الأحداث، وذلك غير مدرك علمه بالاستنباط الاستخراج بالعقول:","bs_tekst":"Odgovara mu se: Već smo u prethodnom dijelu ove knjige rekli da se u većini onoga što u njoj bilježimo oslanjamo na predaje i izvješća od našeg Vjerovjesnika, sallallahu alejhi ve sellem, i od dobrih prethodnika prije nas, a ne na zaključivanje razumom i razmišljanjem. Većina toga izvještava o prošlim zbivanjima i događajima koji će nastupiti, a znanje o tome ne može se steći izvođenjem zaključaka i razumskim domišljanjem."},{"stranica":58,"ar_tekst":"فإن قال: فهل من حجة على صحة ذلك من جهة الخبر؟","bs_tekst":"Ako kaže: „Postoji li, iz predaja, dokaz da je to ispravno?“"},{"stranica":58,"ar_tekst":"قيل: ذلك ما لا نعلم قائلا من أئمة الدين قال خلافه.","bs_tekst":"Odgovara se: Ne znamo nijednog od imama vjere koji je o tome rekao suprotno."},{"stranica":58,"ar_tekst":"فإن قال: فهل من رواية عن أحد منهم بذلك؟","bs_tekst":"Ako kaže: „Postoji li predaja od nekoga od njih o tome?“"},{"stranica":58,"ar_tekst":"قيل: علم ذلك عند أهل العلم من السلف كان أشهر من أن يحتاج فيه إلى رواية منسوبة إلى شخص منهم بعينه، وقد روي ذلك عن جماعة منهم مسمين بأعيانهم","bs_tekst":"Odgovara se: Znanje o tome među učenim prethodnicima bilo je previše poznato da bi zahtijevalo predaju pripisanu jednome od njih poimenično. Ipak, to je preneseno od jedne skupine njih, navedenih poimenično."},{"stranica":59,"ar_tekst":"فإن قال: فاذكرهم لنا.","bs_tekst":"Ako kaže: „Onda nam ih navedi.“"},{"stranica":59,"ar_tekst":"قيل: حَدَّثَنَا ابْنُ حميد، قَالَ: حَدَّثَنَا حكام: عن عنبسة، عن سِمَاكٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: خلق الله السموات والأرض في ستة أيام، فَكُلُّ يَوْمٍ مِنْ هَذِهِ الأَيَّامِ كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ أَنْتُمْ","bs_tekst":"Odgovara se: Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Hukkam, od Anbese, od Simaka, od Ikrime, od Ibn Abbasa, koji je rekao: „Allah je stvorio nebesa i Zemlju u šest dana. Svaki od tih dana bio je poput hiljadu godina koje vi brojite.“"},{"stranica":59,"ar_tekst":"حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنْ إِسْرَائِيلَ، عَنْ سِمَاكٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ» .\n\nقَالَ: السِّتَّةُ الأَيَّامُ الَّتِي خَلَقَ اللَّهُ فِيهَا السَّمَوَاتِ وَالأَرْضَ.","bs_tekst":"Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je moj otac, od Israila, od Simaka, od Ikrime, od Ibn Abbasa, o riječima: „U danu koji traje hiljadu godina koje vi brojite.“ Rekao je: „To je šest dana u kojima je Allah stvorio nebesa i Zemlju.“ ⟦Prijevod kur’anskog navoda: Es-Sedžda, 32:5, dio ajeta.⟧"},{"stranica":59,"ar_tekst":"حَدَّثَنَا عبدة، حَدَّثَنِي الحسين بن الفرج، قال: سمعت أبا معاذ يقول: أخبرنا عبيد، قال: سمعت الضحاك يقول في قوله: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ» : يعني هذا اليوم من الأيام الستة التي خلق الله فيهن السموات والأرض وما بينهما.","bs_tekst":"Pričao nam je Abde: pričao mi je Husejn ibn el-Feredž, koji je rekao: čuo sam Ebu Muaza kako kaže: obavijestio nas je Ubejd, koji je rekao: čuo sam Dahhaka kako, o riječima: „U danu koji traje hiljadu godina koje vi brojite“, kaže: „Misli se na ovaj dan iz šest dana u kojima je Allah stvorio nebesa, Zemlju i ono što je između njih.“ ⟦Prijevod kur’anskog navoda: Es-Sedžda, 32:5, dio ajeta.⟧"},{"stranica":59,"ar_tekst":"حَدَّثَنِي المثنى، حَدَّثَنَا علي، عن المسيب بن شريك، عن أبي روق، عن الضحاك: «وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» .\n\nقال: من ايام الآخرة، كل يوم كان مقداره ألف سنة، ابتدأ في الخلق يوم الأحد، واجتمع الخلق يوم الجمعة.","bs_tekst":"Pričao mi je Musenna: pričao nam je Ali, od Musejjeba ibn Šerika, od Ebu Revka, od Dahhaka, o riječima: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Rekao je: „Od dana budućeg svijeta; svaki dan trajao je hiljadu godina. Stvaranje je započeo u nedjelju, a stvaranje je objedinjeno u petak.“ ⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧"},{"stranica":59,"ar_tekst":"حَدَّثَنَا ابن حميد قَالَ: حَدَّثَنَا جرير، عن الأعمش، عن أبي صالح: عن كعب، قال: بدأ الله خلق السموات والأرض يوم الأحد والاثنين والثلاثاء والأربعاء والخميس، وفرغ منها يوم الجمعة، قال: فجعل مكان كل يوم ألف سنة","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Džerir, od A‘meša, od Ebu Saliha, od Ka‘ba, koji je rekao: „Allah je započeo stvaranje nebesa i Zemlje u nedjelju, ponedjeljak, utorak, srijedu i četvrtak, a dovršio ga je u petak.“ Rekao je: „Na mjesto svakog dana postavio je hiljadu godina.“"},{"stranica":60,"ar_tekst":"حَدَّثَنِي الْمُثَنَّى، قَالَ: حَدَّثَنَا الْحَجَّاجُ، حَدَّثَنَا أَبُو عوانة، عن أبي بشر، عن مجاهد، قال: يَوْمٌ مِنَ السِّتَّةِ الأَيَّامِ، كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ.","bs_tekst":"Pričao mi je Musenna, koji je rekao: pričao nam je Hadždžadž: pričao nam je Ebu Avana, od Ebu Bišra, od Mudžahida, koji je rekao: „Jedan od šest dana bio je poput hiljadu godina koje vi brojite.“"},{"stranica":60,"ar_tekst":"فهذا هذا وبعد، فلا وجه لقول قائل: وكيف يوصف الله تعالى ذكره بأنه خلق السموات والأرض وما بينهما في ستة أيام قدر مدتها من أيام الدنيا ستة آلاف سنة، وإنما أمره إذا أراد شيئا أن يقول له: كن فيكون، لأنه لا شيء يتوهمه متوهم في قول قائل ذلك إلا وهو موجود في قول قائل: خلق ذلك كله في ستة أيام مدتها مدة ستة أيام من أيام الدنيا، لأن أمره جل جلاله إذا أراد شيئا أن يقول له كن فيكون","bs_tekst":"Tako stoji s ovim. Osim toga, nema osnove za riječi onoga koji pita: „Kako se Allah, Uzvišen je spomen Njegov, opisuje da je stvorio nebesa, Zemlju i ono što je između njih u šest dana čije je trajanje šest hiljada godina ovoga svijeta, kada je Njegova naredba, ako nešto želi, samo da tome kaže: Budi! — i ono bude?“ Jer nema ničega što bi neko mogao prigovoriti takvoj tvrdnji a da se to isto ne bi moglo prigovoriti tvrdnji da je sve to stvorio u šest dana koji traju šest dana ovoga svijeta. Njegova je naredba, Uzvišeno je Njegovo veličanstvo, kada nešto želi, samo da tome kaže: Budi! — i ono bude."},{"stranica":61,"ar_tekst":"[القول في الليل والنهار أيهما خلق قبل صاحبه]","bs_tekst":"Rasprava o noći i danu: šta je od njih prvo stvoreno?"},{"stranica":61,"ar_tekst":"وفي بدء خلق الشمس والقمر وصفتهما إذ كانت الأزمنة بهما تعرف قد قلنا في خلق الله عز ذكره ما خلق من الأشياء قبل خلقه الأوقات والأزمنة، وبيَّنَّا أن الأوقات والأزمنة إنما هي ساعات الليل والنهار، وأن ذلك إنما هو قطع الشمس والقمر درجات الفلك، فلنقل الآن: بأي ذلك كان الابتداء، بالليل أم بالنهار؟ إذ كان الاختلاف في ذلك موجودا بين ذوي النظر فيه، بأن بعضهم يقول فيه: خلق الله الليل قبل النهار، ويستشهد على حقيقة قوله ذلك بأن الشمس إذا غابت وذهب ضوءها الذي هو نهار هجم الليل بظلامه، فكان معلوما بذلك أن الضياء هو المتورد على الليل، وأن الليل إن لم يبطله النهار المتورد عليه هو الثابت، فكان بذلك من أمرهما دلالة على أن الليل هو الأول خلقا، وأن الشمس هو الآخر منهما خلقا، وهذا قول يروى عن ابن عباس.","bs_tekst":"I o početku stvaranja Sunca i Mjeseca i njihovim svojstvima, jer se pomoću njih poznaju vremena. Već smo govorili o tome šta je Allah, Silan je spomen Njegov, stvorio prije stvaranja vremenskih odsječaka i razdoblja. Objasnili smo da su vremenski odsječci i razdoblja zapravo sati noći i dana, a da su oni prelaženje Sunca i Mjeseca preko stupnjeva nebeske putanje. Sada ćemo govoriti o tome čime je započeto: noću ili danom. O tome postoji razilaženje među onima koji to razmatraju. Neki kažu da je Allah stvorio noć prije dana. Kao dokaz za istinitost svojih riječi navode da, kada Sunce zađe i nestane njegove svjetlosti, koja je dan, nastupi noć sa svojom tamom. Time se, kažu, zna da svjetlost dolazi na noć i da noć ostaje ako je ne ukloni dan koji dolazi na nju. Takvo stanje njih dvoje ukazuje da je noć prva stvorena, a Sunce stvoreno poslije nje. Ovo mišljenje prenosi se od Ibn Abbasa."},{"stranica":61,"ar_tekst":"حَدَّثَنَا ابْنُ بَشَّارٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ، عَنْ سُفْيَانَ، عَنْ أَبِيهِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: سُئِلَ: هَلِ اللَّيْلُ كَانَ قَبْلَ النَّهَارِ؟.\n\nقَالَ: أَرَأَيْتُمْ حِينَ كَانَتِ السَّمَوَاتُ وَالأَرْضُ رَتْقًا، هَلْ كَانَ بَيْنَهُمَا إِلا ظُلْمَةٌ! ذَلِكَ لِتَعْلَمُوا أَنَّ اللَّيْلَ كَانَ قَبْلَ النَّهَارِ.","bs_tekst":"Pričao nam je Ibn Beššar: pričao nam je Abdurrahman, od Sufjana, od njegovog oca, od Ikrime, od Ibn Abbasa, koji je rekao da je upitan: „Je li noć bila prije dana?“ Odgovorio je: „Recite mi: kada su nebesa i Zemlja bili spojeni, je li između njih bilo išta osim tame? To je zato da znate da je noć bila prije dana.“"},{"stranica":61,"ar_tekst":"حَدَّثَنَا الْحَسَنُ بْنُ يَحْيَى، قَالَ: أَخْبَرَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا الثَّوْرِيُّ، عَنْ أَبِيهِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّيْلَ قَبْلَ النَّهَارِ، ثُمَّ قال: «كانَتا رَتْقاً فَفَتَقْناهُما» .","bs_tekst":"Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak: obavijestio nas je Sevri, od svoga oca, od Ikrime, od Ibn Abbasa, koji je rekao: „Noć je prije dana.“ Zatim je naveo: „Bili su spojena cjelina, pa smo ih razdvojili.“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:30, dio ajeta.⟧"},{"stranica":61,"ar_tekst":"حَدَّثَنَا محمد بن بشار، قال: حَدَّثَنَا وهب بن جرير، حَدَّثَنَا أبي، قال: سمعت يحيى بن أيوب يحدث عن يزيد بن أبي حبيب، عن مرثد","bs_tekst":"Pričao nam je Muhammed ibn Beššar, koji je rekao: pričao nam je Vehb ibn Džerir: pričao nam je moj otac, koji je rekao: čuo sam Jahjaa ibn Ejjuba kako prenosi od Jezida ibn Ebu Habiba, od Merseda"},{"stranica":62,"ar_tekst":"ابن عبد الله اليزني، قال: لم يكن عقبة بن عامر إذا رأى الهلال- هلال رمضان- يقوم تلك الليلة حتى يصوم يومها، ثم يقوم بعد ذلك فذكرت ذلك لابن حجيرة فقال: الليل قبل النهار أم النهار قبل الليل؟","bs_tekst":"ibn Abdullaha el-Jezenija, koji je rekao: „Kada bi Ukba ibn Amir ugledao mlađak — ramazanski mlađak — te noći ne bi klanjao noćni namaz dok ne bi ispostio njen dan, a nakon toga bi klanjao noćni namaz. To sam spomenuo Ibn Hudžejri, pa je rekao: ‘Je li noć prije dana ili dan prije noći?’“"},{"stranica":62,"ar_tekst":"وقال آخرون: كان النهار قبل الليل، واستشهدوا لصحة قولهم هذا بأن الله عز ذكره كان ولا ليل ولا نهار ولا شيء غيره، وأن نوره كان يضيء به كل شيء خلقه بعد ما خلقه حتى خلق الليل.","bs_tekst":"Drugi su rekli da je dan bio prije noći. Kao dokaz ispravnosti svojih riječi navode da je Allah, Silan je spomen Njegov, bio kada nije bilo ni noći, ni dana, niti ičega osim Njega, te da je Njegova svjetlost osvjetljavala sve što je stvorio, nakon što bi to stvorio, sve dok nije stvorio noć."},{"stranica":62,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":62,"ar_tekst":"حَدَّثَنِي عَلِيُّ بْنُ سَهْلٍ، حَدَّثَنَا الْحَسَنُ بْنُ بِلالٍ، قَالَ: حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنِ الزُّبَيْرِ أَبِي عَبْدِ السَّلامِ، عَنْ أَيُّوبَ بْنِ عَبْدِ اللَّهِ الْفِهْرِيِّ أَنَّ ابْنَ مَسْعُودٍ قَالَ: إِنَّ رَبَّكُمْ لَيْسَ عِنْدَهُ لَيْلٌ وَلا نَهَارٌ، نُورُ السَّمَوَاتِ مِنْ نُورِ وَجْهِهِ، وَإِنَّ مِقْدَارَ كُلِّ يَوْمٍ مِنْ أَيَّامِكُمْ هَذِهِ عِنْدَهُ اثْنَتَا عَشْرَةَ سَاعَةً.","bs_tekst":"Pričao mi je Ali ibn Sehl: pričao nam je Hasen ibn Bilal, koji je rekao: pričao nam je Hammad ibn Selema, od Zubejra Ebu Abdusselama, od Ejjuba ibn Abdullaha el-Fihrija, da je Ibn Mesud rekao: „Kod vašeg Gospodara nema ni noći ni dana. Svjetlost nebesa potječe od svjetlosti Njegovog Lica. Svaki od ovih vaših dana kod Njega traje dvanaest sati.“"},{"stranica":62,"ar_tekst":"قال أبو جعفر: وأولى القولين في ذلك عندي بالصواب قول من قال:\nكان الليل قبل النهار، لأن النهار هو ما ذكرت من ضوء الشمس، وإنما خلق الله الشمس وأجراها في الفلك بعد ما دحا الأرض فبسطها، كما قال عز وجل: «أَأَنْتُمْ أَشَدُّ خَلْقاً أَمِ السَّماءُ بَناها رَفَعَ سَمْكَها فَسَوَّاها وَأَغْطَشَ لَيْلَها وَأَخْرَجَ ضُحاها» ، فإذا كانت الشمس خلقت بعد ما سمكت السماء، وأغطش ليلها، فمعلوم أنها كانت- قبل أن تخلق الشمس، وقبل أن يخرج الله من السماء ضحاها- مظلمة لا مضيئة.","bs_tekst":"Ebu Džafer kaže: Od dva mišljenja, smatram ispravnijim ono prema kojem je noć bila prije dana. Dan je ono što sam spomenuo: Sunčeva svjetlost. Allah je stvorio Sunce i pokrenuo ga nebeskom putanjom tek nakon što je rasprostro i pružio Zemlju, kako je rekao On, Silan i Uzvišen: „Jeste li vi teži za stvaranje ili nebo? On ga je izgradio; podigao je njegov svod i uredio ga; njegovu noć učinio je tamnom i izveo njegovo jutarnje svjetlo.“ Ako je Sunce stvoreno nakon što je nebo podignuto i njegova noć učinjena tamnom, onda je poznato da je nebo, prije nego što je Sunce stvoreno i prije nego što je Allah iz njega izveo njegovo jutarnje svjetlo, bilo tamno, a ne svijetlo. ⟦Prijevod kur’anskog navoda: En-Naziat, 79:27–29.⟧"},{"stranica":62,"ar_tekst":"وبعد، فإن في مشاهدتنا من أمر الليل والنهار ما نشاهده دليلا بَيِّنًا","bs_tekst":"Osim toga, ono što svojim očima opažamo o noći i danu jasan je dokaz"},{"stranica":63,"ar_tekst":"على أن النهار هو الهاجم على الليل لأن الشمس متى غابت فذهب ضوءها ليلا او نهارا أظلم الجو، فكان معلوما بذلك أن النهار هو الهاجم على الليل بضوئه ونوره والله أعلم.","bs_tekst":"da je dan taj koji nastupa na noć. Kada god Sunce zađe i njegova svjetlost nestane, noću ili danju, prostor se zamrači. Time se zna da je dan taj koji svojom svjetlošću i sjajem nastupa na noć. A Allah najbolje zna."},{"stranica":63,"ar_tekst":"فأما القول في بدء خلقهما فإن الخبر عن رسول الله ص بوقت خلق الله الشمس والقمر مختلف.","bs_tekst":"Što se tiče govora o početku njihovog stvaranja, predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, o vremenu kada je Allah stvorio Sunce i Mjesec razlikuju se."},{"stranica":63,"ar_tekst":"فأما ابْنِ عَبَّاسٍ فروي عنه أنه قال: خلق الله يوم الجمعة الشمس والقمر والنجوم والملائكة إلى ثلاث ساعات بقيت منه، حَدَّثَنَا بذلك هناد بن السري، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمه، عن ابن عباس، عن النبي ص.\n[","bs_tekst":"Od Ibn Abbasa preneseno je da je rekao: „Allah je u petak stvorio Sunce, Mjesec, zvijezde i meleke, do preostala tri sata toga dana.“ To nam je pričao Hennad ibn es-Serijj, koji je rekao: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem."},{"stranica":63,"ar_tekst":"وروى ابو هريرة عن النبي ص أنه قال: خلق الله النور يوم الأربعاء،] حَدَّثَنِي بِذَلِكَ الْقَاسِمُ بْنُ بِشْرٍ وَالْحُسَيْنُ بْنُ عَلِيٍّ، قَالا: حَدَّثَنَا حَجَّاجُ بْنُ مُحَمَّدٍ، عَنِ ابْنِ جُرَيْجٍ، عَنْ إِسْمَاعِيلَ بْنِ أُمَيَّةَ، عَنْ أيوب بن خالد، عن عبد الله بن رافع، عن ابى هريرة، عن النبي ص.","bs_tekst":"Ebu Hurejre prenio je od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Allah je stvorio svjetlost u srijedu.“ To su mi pričali Kasim ibn Bišr i Husejn ibn Ali; obojica su rekli: pričao nam je Hadždžadž ibn Muhammed, od Ibn Džurejdža, od Ismaila ibn Umejje, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem."},{"stranica":63,"ar_tekst":"وأي ذلك كان، فقد خلق الله قبل خلقه إياهما خلقا كثيرا غيرهما، ثم خلقهما عز وجل لما هو أعلم به من مصلحة خلقه، فجعلهما دائبي الجري، ثم فصل بينهما، فجعل إحداهما آية الليل، والأخرى أية النهار، فمحا آية الليل، وجعل آية النهار مبصره وقد روى عن رسول الله ص في سبب اختلاف حالتي آية الليل وآية النهار أخبار أنا ذاكر منها بعض ما حضرني ذكره وعن جماعة من السلف أيضا نحو ذلك.","bs_tekst":"Kako god bilo, prije stvaranja njih dvoje Allah je stvorio mnoga druga stvorenja. Potom ih je On, Silan i Uzvišen, stvorio zbog koristi za Svoja stvorenja koju najbolje zna. Učinio je da neprestano teku, zatim ih je razlikovao: jedno je učinio znakom noći, a drugo znakom dana. Znak noći je izbrisao, a znak dana učinio takvim da se pomoću njega vidi. Od Allahovog Poslanika, sallallahu alejhi ve sellem, prenesene su predaje o razlogu različitosti znaka noći i znaka dana. Spomenut ću neke od onih kojih se sada sjećam. Nešto slično preneseno je i od jedne skupine prethodnika."},{"stranica":63,"ar_tekst":"فمما روى عن رسول الله ص في ذلك، ما حَدَّثَنِي مُحَمَّدُ بْنُ أَبِي مَنْصُورٍ الآملي، حَدَّثَنَا خَلَفُ بْنُ وَاصِلٍ، قَالَ: حَدَّثَنَا عُمَرُ بْنُ","bs_tekst":"Među onim što je od Allahovog Poslanika, sallallahu alejhi ve sellem, o tome preneseno jeste ono što mi je pričao Muhammed ibn Ebu Mensur el-Amuli: pričao nam je Halef ibn Vasil, koji je rekao: pričao nam je Omer ibn"},{"stranica":64,"ar_tekst":"صُبْحٍ أَبُو نُعَيْمٍ الْبَلْخِيُّ، عَنْ مُقَاتِلِ بْنِ حَيَّانَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبْزَى، عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قَالَ: كُنْتُ آخُذُ بِيَدِ رسول الله ص وَنَحْنُ نَتَمَاشَى جَمِيعًا نَحْوَ الْمَغْرِبِ، وَقَدْ طَفَلَتِ الشَّمْسُ، فَمَا زِلْنَا نَنْظُرُ إِلَيْهَا حَتَّى غَابَتْ، [قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ تَغْرُبُ؟ قَالَ: تَغْرُبُ فِي السَّمَاءِ، ثُمَّ تُرْفَعُ مِنْ سَمَاءٍ إِلَى سَمَاءٍ حَتَّى تُرْفَعَ إِلَى السَّمَاءِ السابعة العليا، حتى تكون تحت العرش، فتخر سَاجِدَةً، فَتَسْجُدُ مَعَهَا الْمَلائِكَةُ الْمُوَكَّلُونَ بِهَا، ثُمَّ تَقُولُ: يَا رَبِّ، مِنْ أَيْنَ تَأْمُرُنِي أَنْ أَطْلُعَ، أَمِنْ مَغْرِبِي أَمْ مِنْ مَطْلَعِي؟ قَالَ: فَذَلِكَ قَوْلُهُ عَزَّ وَجَلَّ: «وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها» حَيْثُ تُحْبَسُ تَحْتَ الْعَرْشِ، «ذلِكَ تَقْدِيرُ الْعَزِيزِ الْ
