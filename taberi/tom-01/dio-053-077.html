<!doctype html><html lang="bs"><head><meta charset="utf-8"><title>Taberi · tom 1 · 53–77</title></head><body><script id="partData" type="application/json">{"id":"01-003","start":53,"end":77,"pages":[{"n":53,"html":"\u003csection class=\"page\" data-page=\"53\" id=\"stranica-53\">\u003ch2>Stranica 53\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 53\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"53.1\" id=\"ar-odlomak-53-1\">تَفْخَرُ عَلَى الأَرْضِ، فَذَلِكَ قَوْلُهُ تَعَالَى: «وَأَلْقى فِي الْأَرْضِ رَواسِيَ أَنْ تَمِيدَ بِكُمْ*» .\u003c/p>\u003cp data-pair=\"53.2\" id=\"ar-odlomak-53-2\">قال أبو جعفر: فقد أنبأ قول هؤلاء الذين ذكرت: إن الله تعالى أخرج من الماء دخانا حين أراد أن يخلق السموات والأرض، فسما عليه- يعنون بقولهم:\n\nفسما عليه علا على الماء، وكل شيء كان فوق شيء عاليا عليه فهو له سماء- ثم أيبس بعد ذلك الماء، فجعله أرضا واحدة- إن الله خلق السماء غير مسواة قبل الأرض، ثم خلق الأرض.\u003c/p>\u003cp data-pair=\"53.3\" id=\"ar-odlomak-53-3\">وإن كان الأمر كما قال هؤلاء، فغير محال أن يكون الله تعالى أثار من الماء دخانا فعلاه على الماء، فكان له سماء، ثم ايبس الماء فصار الدخان الذي سما عليه أرضا، ولم يدحها، ولم يقدر فيها أقواتها، ولم يخرج منها ماءها ومرعاها، حتى استوى إلى السماء، التي هي الدخان الثائر من الماء العالي عليه، فسواهن سبع سموات، ثم دحا الأرض التي كانت ماء فيبسه ففتقه، فجعلها سبع أرضين، وقدر فيها أقواتها، و «أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» ، كما قال عز وجل فيكون كل الذي روي عن ابن عباس في ذلك- على ما رويناه- صحيحا معناه.\u003c/p>\u003cp data-pair=\"53.4\" id=\"ar-odlomak-53-4\">وأما يوم الاثنين فقد ذكرنا اختلاف العلماء فيما خلق فيه، وما روي في ذلك عن رسول الله ص قبل.\u003c/p>\u003cp data-pair=\"53.5\" id=\"ar-odlomak-53-5\">وأما ما خلق في يوم الثلاثاء والأربعاء، فقد ذكرنا أيضا بعض ما روي فيه، ونذكر في هذا الموضع بعض ما لم نذكر منه قبل.\u003c/p>\u003cp data-pair=\"53.6\" id=\"ar-odlomak-53-6\">فالذي صح عندنا أنه خلق فيهما ما \u003cspan class=\"isnad\">حَدَّثَنِي به موسى بن هارون، قال: حدثنا عمرو بن حماد، حدثنا أسباط، عن السدي، في خبر ذكره\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 53\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"53.1\" id=\"odlomak-53-1\">ponose nad Zemljom. To su Njegove, Uzvišeni je On, riječi: ‘I po Zemlji je postavio čvrste planine da se ne ljulja s vama.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: isti izraz nalazi se u En-Nahl, 16:15, i Lukman, 31:10. Izvor ovdje ne navodi broj ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"53.2\" id=\"odlomak-53-2\">Ebu Džafer kaže: Riječi ovih koje sam spomenuo — da je Uzvišeni Allah iz vode izveo dim kada je htio stvoriti nebesa i Zemlju, pa se dim uzvisio nad njom; pod riječima „uzvisio se nad njom“ misle da se podigao iznad vode, a sve što je iznad nečega i nad njim se uzdiže njemu je nebo; zatim je nakon toga osušio vodu i učinio je jednom zemljom — pokazuju da je Allah stvorio još neuređeno nebo prije Zemlje, a zatim je stvorio Zemlju.\u003c/p>\u003cp data-pair=\"53.3\" id=\"odlomak-53-3\">Ako je stvar onakva kako su ovi rekli, nije nemoguće da je Uzvišeni Allah iz vode podigao dim, uzvisio ga nad vodom i da joj je on bio nebo; zatim je osušio vodu, pa je dim koji se uzvisio nad njom postao zemljom. Nije je rasprostro, niti je na njoj odredio njenu opskrbu, niti je iz nje izveo njenu vodu i njene pašnjake, sve dok se nije usmjerio prema nebu, koje je dim podignut iz vode i uzdignut nad njom, i od njih sačinio sedam nebesa. Zatim je rasprostro Zemlju, koja je bila voda, pa ju je osušio, razdvojio i učinio je sedmerim zemljama, odredio na njoj njenu opskrbu i „iz nje izveo njenu vodu i njene pašnjake, a planine učvrstio“, kako je rekao On, Silan i Uzvišen. Tako je sve što je od Ibn Abbasa o tome preneseno — onako kako smo prenijeli — ispravnog značenja. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Naziat, 79:31–32. Napomena prevodioca: izvor doslovno kaže „pa je dim koji se uzvisio nad njom postao zemljom“ (فصار الدخان الذي سما عليه أرضا), što nije jasno usklađeno s prethodnim objašnjenjem o osušenoj vodi. Formulacija je sačuvana, bez prešutne ispravke; treba provjeriti štampano izdanje.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"53.4\" id=\"odlomak-53-4\">Što se tiče ponedjeljka, već smo ranije spomenuli razilaženje učenih o onome što je u njemu stvoreno i ono što je o tome preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem.\u003c/p>\u003cp data-pair=\"53.5\" id=\"odlomak-53-5\">Što se tiče onoga što je stvoreno u utorak i srijedu, već smo također spomenuli neke predaje o tome, a ovdje ćemo navesti neke koje ranije nismo naveli.\u003c/p>\u003cp data-pair=\"53.6\" id=\"odlomak-53-6\">Prema onome što je kod nas potvrđeno, u ta dva dana stvoreno je ono o čemu \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun: rekao je: pričao nam je Amr ibn Hammad: pričao nam je Esbat, od Suddija, u izvješću koje je naveo\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":54,"html":"\u003csection class=\"page\" data-page=\"54\" id=\"stranica-54\">\u003ch2>Stranica 54\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 54\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"54.1\" id=\"ar-odlomak-54-1\">\u003cspan class=\"isnad\">عن أبي مالك، وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن عبد الله بن مسعود- وعن ناس من أصحاب رسول الله ص:\u003c/span>\u003c/p>\u003cp data-pair=\"54.2\" id=\"ar-odlomak-54-2\">وخلق الجبال فيها- يعني في الأرض- وأقوات أهلها وشجرها وما ينبغي لها في يومين: في الثلاثاء والأربعاء، وذلك حين يقول الله عز وجل: «قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ» ، يقول: من سأل فهكذا الأمر، ثم استوى إِلَى السَّمَاءِ وَهِيَ دُخَانٌ، وكان ذلك الدخان من تنفس الماء حين تنفس، فجعلها سماء واحدة، ثم فتقها فجعلها سبع سموات في يومين في الخميس والجمعة.\u003c/p>\u003cp data-pair=\"54.3\" id=\"ar-odlomak-54-3\">\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى، قَالَ: حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ تَعَالَى خَلَقَ الأَقْوَاتَ وَالرَّوَاسِيَ فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ.\u003c/p>\u003cp data-pair=\"54.4\" id=\"ar-odlomak-54-4\">\u003cspan class=\"isnad\">حَدَّثَنِي تميم بن المنتصر، قال: أخبرنا إسحاق، عن شَرِيكٍ، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\n\u003c/span>إِنَّ اللَّهَ تَعَالَى خَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ فَذَلِكَ قَوْلُ النَّاسِ: هُوَ يَوْمٌ ثَقِيلٌ.\u003c/p>\u003cp data-pair=\"54.5\" id=\"ar-odlomak-54-5\">قال أبو جعفر: والصواب من القول في ذلك عندنا، ما رويناه [عن النبي ص، قال: إن الله تعالى خلق يوم الثلاثاء الجبال وما فيهن من المنافع، وخلق يوم الأربعاء الشجر، والماء، والمدائن، والعمران، والخراب] \u003cspan class=\"isnad\">حَدَّثَنَا بِذَلِكَ هَنَّادٌ، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عن ابن عباس، عن النبي ص.\u003c/span>\u003c/p>\u003cp data-pair=\"54.6\" id=\"ar-odlomak-54-6\">وقد روى عن النبي ص أَنَّ اللَّهَ خَلَقَ الْجِبَالَ يَوْمَ الأَحَدِ، وَالشَّجَرَ يَوْمَ الاثْنَيْنِ، وَخَلَقَ الْمَكْرُوهَ يَوْمَ الثُّلاثَاءِ، وَالنُّورَ يوم الأربعاء،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 54\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"54.1\" id=\"odlomak-54-1\">\u003cspan class=\"isnad\">od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem:\u003c/span>\u003c/p>\u003cp data-pair=\"54.2\" id=\"odlomak-54-2\">„Na njoj — misli se na Zemlju — stvorio je planine, opskrbu njenih stanovnika, njeno drveće i ono što joj treba u dva dana: u utorak i srijedu. To je ono kada Allah, Silan i Uzvišen, kaže: ‘Reci: Zar vi doista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova! Na njoj je, povrh nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu opskrbu u četiri dana, jednako za one koji pitaju.’ Kaže: Ko pita, stvar je takva. Zatim se usmjerio prema nebu, a ono je bilo dim. Taj je dim potekao od isparavanja vode kada je isparavala. Učinio ga je jednim nebom, zatim ga razdvojio i učinio ga sedmerim nebesima u dva dana: u četvrtak i petak.“ \u003cspan class=\"translator-note\">⟦Prijevod izdvojenog kur’anskog navoda: Fussilet, 41:9–10.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"54.3\" id=\"odlomak-54-3\">\u003cspan class=\"isnad\">Pričao mi je Musenna: rekao je: pričao nam je Ebu Salih: rekao je: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, koji je rekao: \u003c/span>„Uzvišeni Allah stvorio je opskrbu i čvrste planine u utorak i srijedu.“\u003c/p>\u003cp data-pair=\"54.4\" id=\"odlomak-54-4\">\u003cspan class=\"isnad\">Pričao mi je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: \u003c/span>„Uzvišeni Allah stvorio je planine u utorak. Otuda riječi ljudi: ‘To je težak dan.’“\u003c/p>\u003cp data-pair=\"54.5\" id=\"odlomak-54-5\">Ebu Džafer kaže: Ispravno mišljenje o tome kod nas jeste ono što smo prenijeli od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Uzvišeni Allah stvorio je u utorak planine i koristi koje su u njima, a u srijedu je stvorio drveće, vodu, gradove, nastanjenost i opustjelost.“ To \u003cspan class=\"isnad\">nam je pričao Hennad: rekao je: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/span>\u003c/p>\u003cp data-pair=\"54.6\" id=\"odlomak-54-6\">Od Vjerovjesnika, sallallahu alejhi ve sellem, preneseno je i da je Allah stvorio planine u nedjelju, drveće u ponedjeljak, ono što je neugodno u utorak, a svjetlost u srijedu.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":55,"html":"\u003csection class=\"page\" data-page=\"55\" id=\"stranica-55\">\u003ch2>Stranica 55\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 55\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"55.1\" id=\"ar-odlomak-55-1\">\u003cspan class=\"isnad\">حَدَّثَنِي به القاسم بن بشر بن معروف، والحسين بن علي الصدائي، قالا:\n\nحدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مولى أم سلمة، عن أبي هريرة، عن النبي ص.\u003c/span>\u003c/p>\u003cp data-pair=\"55.2\" id=\"ar-odlomak-55-2\">والخبر الأول أصح مخرجا، وأولى بالحق، لأنه قول أكثر السلف.\u003c/p>\u003cp data-pair=\"55.3\" id=\"ar-odlomak-55-3\">وأما يوم الخميس فإنه خلق فيه السموات، ففتقت بعد أن كانت رتقا، كما \u003cspan class=\"isnad\">حَدَّثَنِي موسى بن هارون، قال: حدثنا عمرو بن حماد، قال:\n\nحدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك، وعن أبي صالح عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب النبي ص: \u003c/span>«ثُمَّ اسْتَوى إِلَى السَّماءِ وَهِيَ دُخانٌ» ، وكان ذلك الدخان من تنفس الماء حين تنفس وجعلها سماء واحدة، ثم فتقها فجعلها سبع سموات في يومين، في الخميس والجمعة.\u003c/p>\u003cp data-pair=\"55.4\" id=\"ar-odlomak-55-4\">وإنما سمي يوم الجمعة لأنه جمع فيه خلق السموات والأرض «وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها» قال: خلق في كل سماء خلقها من الملائكة، والخلق الذي فيها من البحار وجبال البرد وما لم يعلم، ثم زين السماء الدنيا بالكواكب، فجعلها زينة وحفظا، تحفظ من الشياطين، فلما فرغ من خلق ما أحب استوى على العرش فذلك حين يقول: «خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ*» ، ويقول:\n\n«كانَتا رَتْقاً فَفَتَقْناهُما» .\u003c/p>\u003cp data-pair=\"55.5\" id=\"ar-odlomak-55-5\">\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى، حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ تَعَالَى خَلَقَ السَّمَوَاتِ فِي الْخَمِيسِ وَالْجُمُعَةِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 55\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"55.1\" id=\"odlomak-55-1\">To su mi pričali Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: \u003cspan class=\"isnad\">pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/span>\u003c/p>\u003cp data-pair=\"55.2\" id=\"odlomak-55-2\">Prva predaja ima vjerodostojniji put prenošenja i bliža je istini jer predstavlja mišljenje većine prethodnika.\u003c/p>\u003cp data-pair=\"55.3\" id=\"odlomak-55-3\">Što se tiče četvrtka, u njemu je stvorio nebesa, pa su razdvojena nakon što su bila spojena, kako \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun: rekao je: pričao nam je Amr ibn Hammad: rekao je: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: \u003c/span>„Zatim se usmjerio prema nebu, a ono je bilo dim.“ Taj dim potekao je od isparavanja vode kada je isparavala. Učinio ga je jednim nebom, zatim ga razdvojio i učinio ga sedmerim nebesima u dva dana, u četvrtak i petak. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Fussilet, 41:11, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"55.4\" id=\"odlomak-55-4\">Petak je nazvan jevmul-džumu‘a jer je u njemu objedinjeno stvaranje nebesa i Zemlje. „I svakome nebu objavio je njegovu odredbu.“ Rekao je: „Na svakom nebu stvorio je njegove meleke i stvorenja koja su na njemu: mora, planine od grada i ono što nije poznato. Zatim je najbliže nebo ukrasio nebeskim tijelima, učinio ih ukrasom i zaštitom koja štiti od šejtana. Kada je dovršio stvaranje onoga što je htio, uzvisio se nad Aršom. To je ono kada kaže: ‘Stvorio je nebesa i Zemlju u šest dana’, i kada kaže: ‘Bili su spojena cjelina, pa smo ih razdvojili.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda, redom: Fussilet, 41:12, dio ajeta; izraz o stvaranju u šest dana javlja se na više mjesta, između ostalog u El-A‘raf, 7:54, i Hud, 11:7; El-Enbija, 21:30, dio ajeta. „Planine od grada“ ovdje znači planine od ledenih zrna; navedeno je dio predaje.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"55.5\" id=\"odlomak-55-5\">\u003cspan class=\"isnad\">Pričao mi je Musenna: pričao nam je Ebu Salih: rekao je: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, koji je rekao: \u003c/span>„Uzvišeni Allah stvorio je nebesa u četvrtak i petak i dovršio je u posljednjem satu petka,\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":56,"html":"\u003csection class=\"page\" data-page=\"56\" id=\"stranica-56\">\u003ch2>Stranica 56\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 56\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"56.1\" id=\"ar-odlomak-56-1\">فَخَلَقَ فِيهَا آدَمَ عَلَى عَجَلٍ، فَتِلْكَ السَّاعَةُ التي تقوم فيها الساعة.\u003c/p>\u003cp data-pair=\"56.2\" id=\"ar-odlomak-56-2\">\u003cspan class=\"isnad\">حدثني تميم بن المنتصر، قال: أخبرنا إسحاق، عَنْ شَرِيكٍ، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ تَعَالَى خَلَقَ مَوَاضِعَ الأَنْهَارِ والشجر يوم الأربعاء، وخلق الطير والوحوش وَالْهَوَامَّ وَالسِّبَاعَ يَوْمَ الْخَمِيسِ، وَخَلَقَ الإِنْسَانَ يَوْمَ الْجُمُعَةِ، فَفَرَغَ مِنْ خَلْقِ كُلِّ شَيْءٍ يَوْمَ الْجُمُعَةِ\u003c/p>\u003cp data-pair=\"56.3\" id=\"ar-odlomak-56-3\">وهذا الذي قاله من ذكرنا قوله، من أن الله عز وجل خلق السموات والملائكة وآدم في يوم الخميس والجمعة، هو الصحيح عندنا، للخبر الذي \u003cspan class=\"isnad\">حَدَّثَنَا بِهِ هَنَّادُ بن السري قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عن ابن عباس، عن النبي ص- قَالَ:\nهَنَّادٌ، وَقَرَأْتُ سَائِرَ الْحَدِيثِ- قَالَ: \u003c/span>وَخَلَقَ يَوْمَ الْخَمِيسِ السَّمَاءَ، وَخَلَقَ يَوْمَ الْجُمُعَةِ النُّجُومَ وَالشَّمْسَ وَالْقَمَرَ وَالْمَلائِكَةَ إِلَى ثَلاثِ سَاعَاتٍ بَقِيَتْ مِنْهُ، فَخَلَقَ فِي أَوَّلِ سَاعَةٍ مِنْ هَذِهِ الثَّلاثِ سَاعَاتِ الآجَالَ، مَنْ يَحْيَا وَمَنْ يَمُوتُ، وَفِي الثَّانِيَةِ أَلْقَى الآفَةَ عَلَى كُلِّ شَيْءٍ مِمَّا يَنْتَفِعُ بِهِ النَّاسُ، وَفِي الثَّالِثَةِ آدَمَ وَأَسْكَنَهُ الْجَنَّةَ، وَأَمَرَ إِبْلِيسَ بِالسُّجُودِ، وَأَخْرَجَهُ مِنْهَا فِي آخِرِ سَاعَةٍ.\u003c/p>\u003cp data-pair=\"56.4\" id=\"ar-odlomak-56-4\">\u003cspan class=\"isnad\">حَدَّثَنِي الْقَاسِمُ بْنُ بِشْرِ بن معروف، والحسين بن علي الصدائي، قالا: حدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن اميه، عن أيوب ابن خالد، عن عبد الله بن رافع مولى أُمِّ سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: \u003c/span>[أَخَذَ رسول الله ص بِيَدِي فَقَالَ: وَبَثَّ فِيهَا- يَعْنِي فِي الأَرْضِ- الدَّوَابَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ بَعْدَ الْعَصْرِ مِنْ يَوْمِ الْجُمُعَةِ آخِرَ خَلْقٍ فِي آخِرِ سَاعَةٍ، مِنْ سَاعَاتِ الْجُمُعَةِ فِيمَا بَيْنَ الْعَصْرِ الى الليل] .\u003c/p>\u003cp data-pair=\"56.5\" id=\"ar-odlomak-56-5\">فإذا كان الله تعالى ذكره خلق الخلق من لدن ابتداء خلق السموات والأرض إلى حين فراغه من خلق جميعهم في ستة أيام، وكان كل يوم من\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 56\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"56.1\" id=\"odlomak-56-1\">pa je u njemu u žurbi stvorio Adema. To je sat u kojem će nastupiti Čas.“\u003c/p>\u003cp data-pair=\"56.2\" id=\"odlomak-56-2\">\u003cspan class=\"isnad\">Pričao mi je Temim ibn el-Muntesir, koji je rekao: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: \u003c/span>„Uzvišeni Allah stvorio je mjesta rijeka i drveće u srijedu, a ptice, divlje životinje, gmizavce i zvijeri u četvrtak. Čovjeka je stvorio u petak i u petak je dovršio stvaranje svega.“\u003c/p>\u003cp data-pair=\"56.3\" id=\"odlomak-56-3\">Ono što su rekli oni čije smo riječi spomenuli — da je Allah, Silan i Uzvišen, stvorio nebesa, meleke i Adema u četvrtak i petak — kod nas je ispravno, zbog predaje koju \u003cspan class=\"isnad\">nam je pričao Hennad ibn es-Serijj, koji je rekao: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem — Hennad je rekao: „Ostatak hadisa sam pročitao“ — \u003c/span>da je rekao: „U četvrtak je stvorio nebo, a u petak je stvarao zvijezde, Sunce, Mjesec i meleke, do preostala tri sata toga dana. U prvom od ta tri sata stvorio je rokove života, ko će živjeti i ko će umrijeti. U drugom je pustio nedaću na sve čime se ljudi koriste. U trećem je stvorio Adema, nastanio ga u Džennetu, naredio Iblisu da učini sedždu i izveo ga iz njega u posljednjem satu.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: zamjenica u „izveo ga iz njega“ prenosi arapsko وأخرجه منها; samo ovo mjesto ne razrješava izričito na koga se „ga“ odnosi.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"56.4\" id=\"odlomak-56-4\">\u003cspan class=\"isnad\">Pričali su mi Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, uzeo me za ruku i rekao: ‘Po njoj — misli se na Zemlju — rasijao je životinje u četvrtak, a Adema je stvorio poslije ikindije u petak, kao posljednje stvorenje, u posljednjem satu petka, između ikindije i noći.’“\u003c/p>\u003cp data-pair=\"56.5\" id=\"odlomak-56-5\">Ako je Allah, Uzvišen je spomen Njegov, stvorio stvorenja od početka stvaranja nebesa i Zemlje do dovršetka stvaranja svih njih u šest dana, a svaki od\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":57,"html":"\u003csection class=\"page\" data-page=\"57\" id=\"stranica-57\">\u003ch2>Stranica 57\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 57\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"57.1\" id=\"ar-odlomak-57-1\">الأيام الستة التي خلقهم فيها مقداره ألف سنة من أيام الدنيا، وكان بين ابتدائه في خلق ذلك وخلق القلم الذي أمره بكتابه كل ما هو كائن إلى قيام الساعة ألف عام، وذلك يوم من أيام الآخرة التي قدر اليوم الواحد منها ألف عام من أيام الدنيا- كان معلوما أن قدر مدة ما بين أول ابتداء ربنا عز وجل في خلق ما خلق من خلقه إلى الفراغ من آخرهم سبعة آلاف عام يزيد إن شاء الله شيئا أو ينقص شيئا، على ما قد روينا من الآثار والأخبار التي ذكرناها، وتركنا ذكر كثير منها كراهة إطالة الكتاب بذكرها.\u003c/p>\u003cp data-pair=\"57.2\" id=\"ar-odlomak-57-2\">وإذا كان ذلك كذلك، وكان صحيحا أن مدة ما بين فراغ ربنا تعالى ذكره- من خلق جميع خلقه إلى وقت فناء جميعهم بما قد دللنا قبل، واستشهدنا من الشواهد، وبما سنشرح فيما بعد- سبعة آلاف سنة، تزيد قليلا أو تنقص قليلا- كان معلوما بذلك أن مدة ما بين أول خلق خلقه الله تعالى إلى قيام الساعة وفناء جميع العالم، أربعة عشر ألف عام من أعوام الدنيا، وذلك أربعة عشر يوما من أيام الآخرة، سبعة أيام من ذلك- وهي سبعة آلاف عام من أعوام الدنيا- مدة ما بين أول ابتداء الله جل وتقدس في خلق أول خلقه إلى فراغه من خلق آخرهم- وهو آدم ابو البشر ص، وسبعة أيام أخر، وهي سبعة آلاف عام من أعوام الدنيا، من ذلك مدة ما بين فراغه جل ثناؤه من خلق آخر خلقه- وهو آدم- إلى فناء آخرهم وقيام الساعة، وعود الأمر إلى ما كان عليه قبل أن يكون شيء غير القديم البارئ الذي له الخلق والأمر الذي كان قبل كل شيء، فلا شيء كان قبله، والكائن بعد كل شيء فلا شيء يبقى غير وجهه الكريم.\u003c/p>\u003cp data-pair=\"57.3\" id=\"ar-odlomak-57-3\">فإن قال قائل: وما دليلك على أن الأيام الستة التي خلق الله فيهن خلقه كان قدر كل يوم منهن قدر ألف عام من أعوام الدنيا دون أن يكون ذلك\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 57\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"57.1\" id=\"odlomak-57-1\">šest dana u kojima ih je stvorio trajao hiljadu godina od dana ovoga svijeta, te ako je između početka toga stvaranja i stvaranja pera, kojem je naredio da zapiše sve što će biti do nastupanja Časa, bilo hiljadu godina — a to je jedan od dana budućeg svijeta, od kojih jedan traje hiljadu godina ovoga svijeta — onda je poznato da je razdoblje od prvog početka stvaranja stvorenja našeg Gospodara, Silnog i Uzvišenog, do dovršetka stvaranja posljednjeg od njih iznosilo sedam hiljada godina, uz nešto više ili manje, ako Allah htjedne, prema predajama i izvješćima koja smo prenijeli i spomenuli. Mnoga od njih nismo naveli jer nismo željeli njihovim navođenjem oduljiti knjigu.\u003c/p>\u003cp data-pair=\"57.2\" id=\"odlomak-57-2\">Ako je tako, i ako je tačno da je razdoblje od vremena kada je naš Gospodar, Uzvišen je spomen Njegov, dovršio stvaranje svih Svojih stvorenja do vremena nestanka svih njih — prema onome što smo ranije dokazivali, potkrijepili svjedočanstvima i što ćemo kasnije objasniti — sedam hiljada godina, uz nešto više ili manje, onda je time poznato da razdoblje od prvog stvorenja koje je Uzvišeni Allah stvorio do nastupanja Časa i nestanka cijelog svijeta iznosi četrnaest hiljada godina ovoga svijeta. To je četrnaest dana budućeg svijeta. Sedam od tih dana — odnosno sedam hiljada godina ovoga svijeta — razdoblje je od prvog početka Allahovog stvaranja, Uzvišen je i Svet, do dovršetka stvaranja posljednjeg od njih, a to je Adem, otac čovječanstva, sallallahu alejhi ve sellem. Drugih sedam dana, odnosno sedam hiljada godina ovoga svijeta, razdoblje je od vremena kada je Onaj čija je hvala uzvišena dovršio stvaranje Svoga posljednjeg stvorenja — Adema — do nestanka posljednjeg od njih i nastupanja Časa. Tada će se stanje vratiti na ono kakvo je bilo prije nego što je bilo išta osim Bespočetnog Tvorca, kojem pripadaju stvaranje i naredba, koji je bio prije svega pa prije Njega nije bilo ničega, i koji ostaje poslije svega pa ne ostaje ništa osim Njegovog plemenitog Lica.\u003c/p>\u003cp data-pair=\"57.3\" id=\"odlomak-57-3\">Ako neko kaže: „Koji je tvoj dokaz da je svaki od šest dana u kojima je Allah stvarao Svoja stvorenja trajao hiljadu godina ovoga svijeta, umjesto da su ti dani bili\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":58,"html":"\u003csection class=\"page\" data-page=\"58\" id=\"stranica-58\">\u003ch2>Stranica 58\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 58\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"58.1\" id=\"ar-odlomak-58-1\">كأيام أهل الدنيا التي يتعارفونها بينهم، وإنما قال الله عز وجل في كتابه:\n«الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ وَما بَيْنَهُما فِي سِتَّةِ أَيَّامٍ*» ، فلم يعلمنا أن ذلك كما ذكرت، بل أخبرنا أنه خلق ذلك في ستة أيام، والأيام المعروفة عند المخاطبين بهذه المخاطبة هي أيامهم التي أول اليوم منها طلوع الفجر إلى غروب الشمس، ومن قولك: إن خطاب الله عباده بما خاطبهم به في تنزيله إنما هو موجه إلى الأشهر والأغلب عليه من معانيه، وقد وجهت خبر الله في كتابه عن خلقه السموات والأرض وما بينهما في ستة أيام إلى غير المعروف من معاني الأيام، وأمر الله عز وجل إذا أراد شيئا أن يكونه أنفذ وأمضى من أن يوصف بأنه خلق السموات والأرض وما بينهما في ستة أيام، مقدارهن ستة آلاف عام من أعوام الدنيا، وإنما أمره إذا أراد شيئا أن يقول له: كن فيكون، وذلك كما قال ربنا تبارك وتعالى: «وَما أَمْرُنا إِلَّا واحِدَةٌ كَلَمْحٍ بِالْبَصَرِ» ؟\u003c/p>\u003cp data-pair=\"58.2\" id=\"ar-odlomak-58-2\">قيل له: قد قلنا فيما تقدم من كتابنا هذا إنا إنما نعتمد في معظم ما نرسمه في كتابنا هذا على الآثار والاخبار عن نبينا ص وعن السلف الصالحين قبلنا دون الاستخراج بالعقول والفكر، إذ أكثره خبر عما مضى من الأمور، وعما هو كائن من الأحداث، وذلك غير مدرك علمه بالاستنباط الاستخراج بالعقول:\u003c/p>\u003cp data-pair=\"58.3\" id=\"ar-odlomak-58-3\">فإن قال: فهل من حجة على صحة ذلك من جهة الخبر؟\u003c/p>\u003cp data-pair=\"58.4\" id=\"ar-odlomak-58-4\">قيل: ذلك ما لا نعلم قائلا من أئمة الدين قال خلافه.\u003c/p>\u003cp data-pair=\"58.5\" id=\"ar-odlomak-58-5\">فإن قال: فهل من رواية عن أحد منهم بذلك؟\u003c/p>\u003cp data-pair=\"58.6\" id=\"ar-odlomak-58-6\">قيل: علم ذلك عند أهل العلم من السلف كان أشهر من أن يحتاج فيه إلى رواية منسوبة إلى شخص منهم بعينه، وقد روي ذلك عن جماعة منهم مسمين بأعيانهم\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 58\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"58.1\" id=\"odlomak-58-1\">poput dana koje ljudi ovoga svijeta među sobom poznaju? Allah, Silan i Uzvišen, u Svojoj Knjizi samo kaže: ‘Onaj koji je stvorio nebesa, Zemlju i ono što je između njih u šest dana.’ Nije nas obavijestio da je to onako kako si spomenuo, nego da je to stvorio u šest dana. Dani koje poznaju oni kojima su te riječi upućene njihovi su dani, od pojave zore do zalaska Sunca. Ti kažeš da se Allahovo obraćanje robovima u Njegovoj Objavi tumači prema najpoznatijem i preovlađujućem značenju tih riječi, a Njegovo izvješće u Knjizi o stvaranju nebesa, Zemlje i onoga što je između njih u šest dana usmjerio si prema značenju dana koje nije uobičajeno. Kada Allah, Silan i Uzvišen, želi da nešto nastane, Njegova naredba djelotvornija je i izvršnija od toga da se opisuje kako je nebesa, Zemlju i ono što je između njih stvarao šest dana koji traju šest hiljada godina ovoga svijeta. Njegova je naredba, kada nešto želi, samo da tome kaže: Budi! — i ono bude. To je kao što je naš Gospodar, Blagoslovljen i Uzvišen, rekao: ‘A Naša je naredba samo jedna, kao treptaj oka.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: izraz o šest dana nalazi se, između ostalog, u El-Furkan, 25:59, i Es-Sedžda, 32:4; drugi izričiti navod je El-Kamer, 54:50.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"58.2\" id=\"odlomak-58-2\">Odgovara mu se: Već smo u prethodnom dijelu ove knjige rekli da se u većini onoga što u njoj bilježimo oslanjamo na predaje i izvješća od našeg Vjerovjesnika, sallallahu alejhi ve sellem, i od dobrih prethodnika prije nas, a ne na zaključivanje razumom i razmišljanjem. Većina toga izvještava o prošlim zbivanjima i događajima koji će nastupiti, a znanje o tome ne može se steći izvođenjem zaključaka i razumskim domišljanjem.\u003c/p>\u003cp data-pair=\"58.3\" id=\"odlomak-58-3\">Ako kaže: „Postoji li, iz predaja, dokaz da je to ispravno?“\u003c/p>\u003cp data-pair=\"58.4\" id=\"odlomak-58-4\">Odgovara se: Ne znamo nijednog od imama vjere koji je o tome rekao suprotno.\u003c/p>\u003cp data-pair=\"58.5\" id=\"odlomak-58-5\">Ako kaže: „Postoji li predaja od nekoga od njih o tome?“\u003c/p>\u003cp data-pair=\"58.6\" id=\"odlomak-58-6\">Odgovara se: Znanje o tome među učenim prethodnicima bilo je previše poznato da bi zahtijevalo predaju pripisanu jednome od njih poimenično. Ipak, to je preneseno od jedne skupine njih, navedenih poimenično.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":59,"html":"\u003csection class=\"page\" data-page=\"59\" id=\"stranica-59\">\u003ch2>Stranica 59\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 59\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"59.1\" id=\"ar-odlomak-59-1\">فإن قال: فاذكرهم لنا.\u003c/p>\u003cp data-pair=\"59.2\" id=\"ar-odlomak-59-2\">قيل: \u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حميد، قَالَ: حَدَّثَنَا حكام: عن عنبسة، عن سِمَاكٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>خلق الله السموات والأرض في ستة أيام، فَكُلُّ يَوْمٍ مِنْ هَذِهِ الأَيَّامِ كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ أَنْتُمْ\u003c/p>\u003cp data-pair=\"59.3\" id=\"ar-odlomak-59-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا أَبِي، عَنْ إِسْرَائِيلَ، عَنْ سِمَاكٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ: \u003c/span>«فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ» .\n\nقَالَ: السِّتَّةُ الأَيَّامُ الَّتِي خَلَقَ اللَّهُ فِيهَا السَّمَوَاتِ وَالأَرْضَ.\u003c/p>\u003cp data-pair=\"59.4\" id=\"ar-odlomak-59-4\">\u003cspan class=\"isnad\">حَدَّثَنَا عبدة، حَدَّثَنِي الحسين بن الفرج، قال: سمعت أبا معاذ يقول: أخبرنا عبيد، قال: سمعت الضحاك يقول \u003c/span>في قوله: «فِي يَوْمٍ كانَ مِقْدارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ» : يعني هذا اليوم من الأيام الستة التي خلق الله فيهن السموات والأرض وما بينهما.\u003c/p>\u003cp data-pair=\"59.5\" id=\"ar-odlomak-59-5\">\u003cspan class=\"isnad\">حَدَّثَنِي المثنى، حَدَّثَنَا علي، عن المسيب بن شريك، عن أبي روق، عن الضحاك: \u003c/span>«وَهُوَ الَّذِي خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ» .\n\nقال: من ايام الآخرة، كل يوم كان مقداره ألف سنة، ابتدأ في الخلق يوم الأحد، واجتمع الخلق يوم الجمعة.\u003c/p>\u003cp data-pair=\"59.6\" id=\"ar-odlomak-59-6\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد قَالَ: حَدَّثَنَا جرير، عن الأعمش، عن أبي صالح: عن كعب، قال: \u003c/span>بدأ الله خلق السموات والأرض يوم الأحد والاثنين والثلاثاء والأربعاء والخميس، وفرغ منها يوم الجمعة، قال: فجعل مكان كل يوم ألف سنة\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 59\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"59.1\" id=\"odlomak-59-1\">Ako kaže: „Onda nam ih navedi.“\u003c/p>\u003cp data-pair=\"59.2\" id=\"odlomak-59-2\">Odgovara se: \u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Hukkam, od Anbese, od Simaka, od Ikrime, od Ibn Abbasa, koji je rekao: \u003c/span>„Allah je stvorio nebesa i Zemlju u šest dana. Svaki od tih dana bio je poput hiljadu godina koje vi brojite.“\u003c/p>\u003cp data-pair=\"59.3\" id=\"odlomak-59-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je moj otac, od Israila, od Simaka, od Ikrime, od Ibn Abbasa, \u003c/span>o riječima: „U danu koji traje hiljadu godina koje vi brojite.“ Rekao je: „To je šest dana u kojima je Allah stvorio nebesa i Zemlju.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Es-Sedžda, 32:5, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"59.4\" id=\"odlomak-59-4\">\u003cspan class=\"isnad\">Pričao nam je Abde: pričao mi je Husejn ibn el-Feredž, koji je rekao: čuo sam Ebu Muaza kako kaže: obavijestio nas je Ubejd, koji je rekao: čuo sam Dahhaka kako, \u003c/span>o riječima: „U danu koji traje hiljadu godina koje vi brojite“, kaže: „Misli se na ovaj dan iz šest dana u kojima je Allah stvorio nebesa, Zemlju i ono što je između njih.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Es-Sedžda, 32:5, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"59.5\" id=\"odlomak-59-5\">\u003cspan class=\"isnad\">Pričao mi je Musenna: pričao nam je Ali, od Musejjeba ibn Šerika, od Ebu Revka, od Dahhaka, \u003c/span>o riječima: „On je Taj koji je nebesa i Zemlju stvorio u šest dana.“ Rekao je: „Od dana budućeg svijeta; svaki dan trajao je hiljadu godina. Stvaranje je započeo u nedjelju, a stvaranje je objedinjeno u petak.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:7, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"59.6\" id=\"odlomak-59-6\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Džerir, od A‘meša, od Ebu Saliha, od Ka‘ba, koji je rekao: \u003c/span>„Allah je započeo stvaranje nebesa i Zemlje u nedjelju, ponedjeljak, utorak, srijedu i četvrtak, a dovršio ga je u petak.“ Rekao je: „Na mjesto svakog dana postavio je hiljadu godina.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":60,"html":"\u003csection class=\"page\" data-page=\"60\" id=\"stranica-60\">\u003ch2>Stranica 60\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 60\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"60.1\" id=\"ar-odlomak-60-1\">\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى، قَالَ: حَدَّثَنَا الْحَجَّاجُ، حَدَّثَنَا أَبُو عوانة، عن أبي بشر، عن مجاهد، قال: \u003c/span>يَوْمٌ مِنَ السِّتَّةِ الأَيَّامِ، كَأَلْفِ سَنَةٍ مِمَّا تَعُدُّونَ.\u003c/p>\u003cp data-pair=\"60.2\" id=\"ar-odlomak-60-2\">فهذا هذا وبعد، فلا وجه لقول قائل: وكيف يوصف الله تعالى ذكره بأنه خلق السموات والأرض وما بينهما في ستة أيام قدر مدتها من أيام الدنيا ستة آلاف سنة، وإنما أمره إذا أراد شيئا أن يقول له: كن فيكون، لأنه لا شيء يتوهمه متوهم في قول قائل ذلك إلا وهو موجود في قول قائل: خلق ذلك كله في ستة أيام مدتها مدة ستة أيام من أيام الدنيا، لأن أمره جل جلاله إذا أراد شيئا أن يقول له كن فيكون\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 60\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"60.1\" id=\"odlomak-60-1\">\u003cspan class=\"isnad\">Pričao mi je Musenna, koji je rekao: pričao nam je Hadždžadž: pričao nam je Ebu Avana, od Ebu Bišra, od Mudžahida, koji je rekao: \u003c/span>„Jedan od šest dana bio je poput hiljadu godina koje vi brojite.“\u003c/p>\u003cp data-pair=\"60.2\" id=\"odlomak-60-2\">Tako stoji s ovim. Osim toga, nema osnove za riječi onoga koji pita: „Kako se Allah, Uzvišen je spomen Njegov, opisuje da je stvorio nebesa, Zemlju i ono što je između njih u šest dana čije je trajanje šest hiljada godina ovoga svijeta, kada je Njegova naredba, ako nešto želi, samo da tome kaže: Budi! — i ono bude?“ Jer nema ničega što bi neko mogao prigovoriti takvoj tvrdnji a da se to isto ne bi moglo prigovoriti tvrdnji da je sve to stvorio u šest dana koji traju šest dana ovoga svijeta. Njegova je naredba, Uzvišeno je Njegovo veličanstvo, kada nešto želi, samo da tome kaže: Budi! — i ono bude.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":61,"html":"\u003csection class=\"page\" data-page=\"61\" id=\"stranica-61\">\u003ch2>Stranica 61\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 61\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"61.1\" id=\"ar-odlomak-61-1\">[القول في الليل والنهار أيهما خلق قبل صاحبه]\u003c/p>\u003cp data-pair=\"61.2\" id=\"ar-odlomak-61-2\">وفي بدء خلق الشمس والقمر وصفتهما إذ كانت الأزمنة بهما تعرف قد قلنا في خلق الله عز ذكره ما خلق من الأشياء قبل خلقه الأوقات والأزمنة، وبيَّنَّا أن الأوقات والأزمنة إنما هي ساعات الليل والنهار، وأن ذلك إنما هو قطع الشمس والقمر درجات الفلك، فلنقل الآن: بأي ذلك كان الابتداء، بالليل أم بالنهار؟ إذ كان الاختلاف في ذلك موجودا بين ذوي النظر فيه، بأن بعضهم يقول فيه: خلق الله الليل قبل النهار، ويستشهد على حقيقة قوله ذلك بأن الشمس إذا غابت وذهب ضوءها الذي هو نهار هجم الليل بظلامه، فكان معلوما بذلك أن الضياء هو المتورد على الليل، وأن الليل إن لم يبطله النهار المتورد عليه هو الثابت، فكان بذلك من أمرهما دلالة على أن الليل هو الأول خلقا، وأن الشمس هو الآخر منهما خلقا، وهذا قول يروى عن ابن عباس.\u003c/p>\u003cp data-pair=\"61.3\" id=\"ar-odlomak-61-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ، عَنْ سُفْيَانَ، عَنْ أَبِيهِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>سُئِلَ: هَلِ اللَّيْلُ كَانَ قَبْلَ النَّهَارِ؟.\n\nقَالَ: أَرَأَيْتُمْ حِينَ كَانَتِ السَّمَوَاتُ وَالأَرْضُ رَتْقًا، هَلْ كَانَ بَيْنَهُمَا إِلا ظُلْمَةٌ! ذَلِكَ لِتَعْلَمُوا أَنَّ اللَّيْلَ كَانَ قَبْلَ النَّهَارِ.\u003c/p>\u003cp data-pair=\"61.4\" id=\"ar-odlomak-61-4\">\u003cspan class=\"isnad\">حَدَّثَنَا الْحَسَنُ بْنُ يَحْيَى، قَالَ: أَخْبَرَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا الثَّوْرِيُّ، عَنْ أَبِيهِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ اللَّيْلَ قَبْلَ النَّهَارِ، ثُمَّ قال: «كانَتا رَتْقاً فَفَتَقْناهُما» .\u003c/p>\u003cp data-pair=\"61.5\" id=\"ar-odlomak-61-5\">\u003cspan class=\"isnad\">حَدَّثَنَا محمد بن بشار، قال: حَدَّثَنَا وهب بن جرير، حَدَّثَنَا أبي، قال: سمعت يحيى بن أيوب يحدث عن يزيد بن أبي حبيب، عن مرثد\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 61\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"61.1\" id=\"odlomak-61-1\">Rasprava o noći i danu: šta je od njih prvo stvoreno?\u003c/p>\u003cp data-pair=\"61.2\" id=\"odlomak-61-2\">I o početku stvaranja Sunca i Mjeseca i njihovim svojstvima, jer se pomoću njih poznaju vremena. Već smo govorili o tome šta je Allah, Silan je spomen Njegov, stvorio prije stvaranja vremenskih odsječaka i razdoblja. Objasnili smo da su vremenski odsječci i razdoblja zapravo sati noći i dana, a da su oni prelaženje Sunca i Mjeseca preko stupnjeva nebeske putanje. Sada ćemo govoriti o tome čime je započeto: noću ili danom. O tome postoji razilaženje među onima koji to razmatraju. Neki kažu da je Allah stvorio noć prije dana. Kao dokaz za istinitost svojih riječi navode da, kada Sunce zađe i nestane njegove svjetlosti, koja je dan, nastupi noć sa svojom tamom. Time se, kažu, zna da svjetlost dolazi na noć i da noć ostaje ako je ne ukloni dan koji dolazi na nju. Takvo stanje njih dvoje ukazuje da je noć prva stvorena, a Sunce stvoreno poslije nje. Ovo mišljenje prenosi se od Ibn Abbasa.\u003c/p>\u003cp data-pair=\"61.3\" id=\"odlomak-61-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar: pričao nam je Abdurrahman, od Sufjana, od njegovog oca, od Ikrime, od Ibn Abbasa, koji je rekao \u003c/span>da je upitan: „Je li noć bila prije dana?“ Odgovorio je: „Recite mi: kada su nebesa i Zemlja bili spojeni, je li između njih bilo išta osim tame? To je zato da znate da je noć bila prije dana.“\u003c/p>\u003cp data-pair=\"61.4\" id=\"odlomak-61-4\">\u003cspan class=\"isnad\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak: obavijestio nas je Sevri, od svoga oca, od Ikrime, od Ibn Abbasa, koji je rekao: \u003c/span>„Noć je prije dana.“ Zatim je naveo: „Bili su spojena cjelina, pa smo ih razdvojili.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:30, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"61.5\" id=\"odlomak-61-5\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Beššar, koji je rekao: pričao nam je Vehb ibn Džerir: pričao nam je moj otac, koji je rekao: čuo sam Jahjaa ibn Ejjuba kako prenosi od Jezida ibn Ebu Habiba, od Merseda\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":62,"html":"\u003csection class=\"page\" data-page=\"62\" id=\"stranica-62\">\u003ch2>Stranica 62\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 62\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"62.1\" id=\"ar-odlomak-62-1\">\u003cspan class=\"isnad\">ابن عبد الله اليزني، قال: \u003c/span>لم يكن عقبة بن عامر إذا رأى الهلال- هلال رمضان- يقوم تلك الليلة حتى يصوم يومها، ثم يقوم بعد ذلك فذكرت ذلك لابن حجيرة فقال: الليل قبل النهار أم النهار قبل الليل؟\u003c/p>\u003cp data-pair=\"62.2\" id=\"ar-odlomak-62-2\">وقال آخرون: كان النهار قبل الليل، واستشهدوا لصحة قولهم هذا بأن الله عز ذكره كان ولا ليل ولا نهار ولا شيء غيره، وأن نوره كان يضيء به كل شيء خلقه بعد ما خلقه حتى خلق الليل.\u003c/p>\u003cp data-pair=\"62.3\" id=\"ar-odlomak-62-3\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"62.4\" id=\"ar-odlomak-62-4\">\u003cspan class=\"isnad\">حَدَّثَنِي عَلِيُّ بْنُ سَهْلٍ، حَدَّثَنَا الْحَسَنُ بْنُ بِلالٍ، قَالَ: حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنِ الزُّبَيْرِ أَبِي عَبْدِ السَّلامِ، عَنْ أَيُّوبَ بْنِ عَبْدِ اللَّهِ الْفِهْرِيِّ أَنَّ ابْنَ مَسْعُودٍ قَالَ: \u003c/span>إِنَّ رَبَّكُمْ لَيْسَ عِنْدَهُ لَيْلٌ وَلا نَهَارٌ، نُورُ السَّمَوَاتِ مِنْ نُورِ وَجْهِهِ، وَإِنَّ مِقْدَارَ كُلِّ يَوْمٍ مِنْ أَيَّامِكُمْ هَذِهِ عِنْدَهُ اثْنَتَا عَشْرَةَ سَاعَةً.\u003c/p>\u003cp data-pair=\"62.5\" id=\"ar-odlomak-62-5\">قال أبو جعفر: وأولى القولين في ذلك عندي بالصواب قول من قال:\nكان الليل قبل النهار، لأن النهار هو ما ذكرت من ضوء الشمس، وإنما خلق الله الشمس وأجراها في الفلك بعد ما دحا الأرض فبسطها، كما قال عز وجل: «أَأَنْتُمْ أَشَدُّ خَلْقاً أَمِ السَّماءُ بَناها رَفَعَ سَمْكَها فَسَوَّاها وَأَغْطَشَ لَيْلَها وَأَخْرَجَ ضُحاها» ، فإذا كانت الشمس خلقت بعد ما سمكت السماء، وأغطش ليلها، فمعلوم أنها كانت- قبل أن تخلق الشمس، وقبل أن يخرج الله من السماء ضحاها- مظلمة لا مضيئة.\u003c/p>\u003cp data-pair=\"62.6\" id=\"ar-odlomak-62-6\">وبعد، فإن في مشاهدتنا من أمر الليل والنهار ما نشاهده دليلا بَيِّنًا\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 62\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"62.1\" id=\"odlomak-62-1\">\u003cspan class=\"isnad\">ibn Abdullaha el-Jezenija, koji je rekao: \u003c/span>„Kada bi Ukba ibn Amir ugledao mlađak — ramazanski mlađak — te noći ne bi klanjao noćni namaz dok ne bi ispostio njen dan, a nakon toga bi klanjao noćni namaz. To sam spomenuo Ibn Hudžejri, pa je rekao: ‘Je li noć prije dana ili dan prije noći?’“\u003c/p>\u003cp data-pair=\"62.2\" id=\"odlomak-62-2\">Drugi su rekli da je dan bio prije noći. Kao dokaz ispravnosti svojih riječi navode da je Allah, Silan je spomen Njegov, bio kada nije bilo ni noći, ni dana, niti ičega osim Njega, te da je Njegova svjetlost osvjetljavala sve što je stvorio, nakon što bi to stvorio, sve dok nije stvorio noć.\u003c/p>\u003cp data-pair=\"62.3\" id=\"odlomak-62-3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"62.4\" id=\"odlomak-62-4\">\u003cspan class=\"isnad\">Pričao mi je Ali ibn Sehl: pričao nam je Hasen ibn Bilal, koji je rekao: pričao nam je Hammad ibn Selema, od Zubejra Ebu Abdusselama, od Ejjuba ibn Abdullaha el-Fihrija, \u003c/span>da je Ibn Mesud rekao: „Kod vašeg Gospodara nema ni noći ni dana. Svjetlost nebesa potječe od svjetlosti Njegovog Lica. Svaki od ovih vaših dana kod Njega traje dvanaest sati.“\u003c/p>\u003cp data-pair=\"62.5\" id=\"odlomak-62-5\">Ebu Džafer kaže: Od dva mišljenja, smatram ispravnijim ono prema kojem je noć bila prije dana. Dan je ono što sam spomenuo: Sunčeva svjetlost. Allah je stvorio Sunce i pokrenuo ga nebeskom putanjom tek nakon što je rasprostro i pružio Zemlju, kako je rekao On, Silan i Uzvišen: „Jeste li vi teži za stvaranje ili nebo? On ga je izgradio; podigao je njegov svod i uredio ga; njegovu noć učinio je tamnom i izveo njegovo jutarnje svjetlo.“ Ako je Sunce stvoreno nakon što je nebo podignuto i njegova noć učinjena tamnom, onda je poznato da je nebo, prije nego što je Sunce stvoreno i prije nego što je Allah iz njega izveo njegovo jutarnje svjetlo, bilo tamno, a ne svijetlo. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Naziat, 79:27–29.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"62.6\" id=\"odlomak-62-6\">Osim toga, ono što svojim očima opažamo o noći i danu jasan je dokaz\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":63,"html":"\u003csection class=\"page\" data-page=\"63\" id=\"stranica-63\">\u003ch2>Stranica 63\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 63\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"63.1\" id=\"ar-odlomak-63-1\">على أن النهار هو الهاجم على الليل لأن الشمس متى غابت فذهب ضوءها ليلا او نهارا أظلم الجو، فكان معلوما بذلك أن النهار هو الهاجم على الليل بضوئه ونوره والله أعلم.\u003c/p>\u003cp data-pair=\"63.2\" id=\"ar-odlomak-63-2\">فأما القول في بدء خلقهما فإن الخبر عن رسول الله ص بوقت خلق الله الشمس والقمر مختلف.\u003c/p>\u003cp data-pair=\"63.3\" id=\"ar-odlomak-63-3\">فأما ابْنِ عَبَّاسٍ فروي عنه أنه قال: خلق الله يوم الجمعة الشمس والقمر والنجوم والملائكة إلى ثلاث ساعات بقيت منه، \u003cspan class=\"isnad\">حَدَّثَنَا بذلك هناد بن السري، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمه، عن ابن عباس، عن النبي ص.\n[\u003c/span>\u003c/p>\u003cp data-pair=\"63.4\" id=\"ar-odlomak-63-4\">وروى ابو هريرة عن النبي ص أنه قال: خلق الله النور يوم الأربعاء،] \u003cspan class=\"isnad\">حَدَّثَنِي بِذَلِكَ الْقَاسِمُ بْنُ بِشْرٍ وَالْحُسَيْنُ بْنُ عَلِيٍّ، قَالا: حَدَّثَنَا حَجَّاجُ بْنُ مُحَمَّدٍ، عَنِ ابْنِ جُرَيْجٍ، عَنْ إِسْمَاعِيلَ بْنِ أُمَيَّةَ، عَنْ أيوب بن خالد، عن عبد الله بن رافع، عن ابى هريرة، عن النبي ص.\u003c/span>\u003c/p>\u003cp data-pair=\"63.5\" id=\"ar-odlomak-63-5\">وأي ذلك كان، فقد خلق الله قبل خلقه إياهما خلقا كثيرا غيرهما، ثم خلقهما عز وجل لما هو أعلم به من مصلحة خلقه، فجعلهما دائبي الجري، ثم فصل بينهما، فجعل إحداهما آية الليل، والأخرى أية النهار، فمحا آية الليل، وجعل آية النهار مبصره وقد روى عن رسول الله ص في سبب اختلاف حالتي آية الليل وآية النهار أخبار أنا ذاكر منها بعض ما حضرني ذكره وعن جماعة من السلف أيضا نحو ذلك.\u003c/p>\u003cp data-pair=\"63.6\" id=\"ar-odlomak-63-6\">فمما روى عن رسول الله ص في ذلك، ما \u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ أَبِي مَنْصُورٍ الآملي، حَدَّثَنَا خَلَفُ بْنُ وَاصِلٍ، قَالَ: حَدَّثَنَا عُمَرُ بْنُ\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 63\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"63.1\" id=\"odlomak-63-1\">da je dan taj koji nastupa na noć. Kada god Sunce zađe i njegova svjetlost nestane, noću ili danju, prostor se zamrači. Time se zna da je dan taj koji svojom svjetlošću i sjajem nastupa na noć. A Allah najbolje zna.\u003c/p>\u003cp data-pair=\"63.2\" id=\"odlomak-63-2\">Što se tiče govora o početku njihovog stvaranja, predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, o vremenu kada je Allah stvorio Sunce i Mjesec razlikuju se.\u003c/p>\u003cp data-pair=\"63.3\" id=\"odlomak-63-3\">Od Ibn Abbasa preneseno je da je rekao: „Allah je u petak stvorio Sunce, Mjesec, zvijezde i meleke, do preostala tri sata toga dana.“ To \u003cspan class=\"isnad\">nam je pričao Hennad ibn es-Serijj, koji je rekao: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/span>\u003c/p>\u003cp data-pair=\"63.4\" id=\"odlomak-63-4\">Ebu Hurejre prenio je od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Allah je stvorio svjetlost u srijedu.“ To su mi pričali Kasim ibn Bišr i Husejn ibn Ali; obojica su rekli: \u003cspan class=\"isnad\">pričao nam je Hadždžadž ibn Muhammed, od Ibn Džurejdža, od Ismaila ibn Umejje, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/span>\u003c/p>\u003cp data-pair=\"63.5\" id=\"odlomak-63-5\">Kako god bilo, prije stvaranja njih dvoje Allah je stvorio mnoga druga stvorenja. Potom ih je On, Silan i Uzvišen, stvorio zbog koristi za Svoja stvorenja koju najbolje zna. Učinio je da neprestano teku, zatim ih je razlikovao: jedno je učinio znakom noći, a drugo znakom dana. Znak noći je izbrisao, a znak dana učinio takvim da se pomoću njega vidi. Od Allahovog Poslanika, sallallahu alejhi ve sellem, prenesene su predaje o razlogu različitosti znaka noći i znaka dana. Spomenut ću neke od onih kojih se sada sjećam. Nešto slično preneseno je i od jedne skupine prethodnika.\u003c/p>\u003cp data-pair=\"63.6\" id=\"odlomak-63-6\">Među onim što je od Allahovog Poslanika, sallallahu alejhi ve sellem, o tome preneseno jeste ono što \u003cspan class=\"isnad\">mi je pričao Muhammed ibn Ebu Mensur el-Amuli: pričao nam je Halef ibn Vasil, koji je rekao: pričao nam je Omer ibn\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":64,"html":"\u003csection class=\"page\" data-page=\"64\" id=\"stranica-64\">\u003ch2>Stranica 64\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 64\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"64.1\" id=\"ar-odlomak-64-1\">\u003cspan class=\"isnad\">صُبْحٍ أَبُو نُعَيْمٍ الْبَلْخِيُّ، عَنْ مُقَاتِلِ بْنِ حَيَّانَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبْزَى، عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قَالَ: \u003c/span>كُنْتُ آخُذُ بِيَدِ رسول الله ص وَنَحْنُ نَتَمَاشَى جَمِيعًا نَحْوَ الْمَغْرِبِ، وَقَدْ طَفَلَتِ الشَّمْسُ، فَمَا زِلْنَا نَنْظُرُ إِلَيْهَا حَتَّى غَابَتْ، [قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ تَغْرُبُ؟ قَالَ: تَغْرُبُ فِي السَّمَاءِ، ثُمَّ تُرْفَعُ مِنْ سَمَاءٍ إِلَى سَمَاءٍ حَتَّى تُرْفَعَ إِلَى السَّمَاءِ السابعة العليا، حتى تكون تحت العرش، فتخر سَاجِدَةً، فَتَسْجُدُ مَعَهَا الْمَلائِكَةُ الْمُوَكَّلُونَ بِهَا، ثُمَّ تَقُولُ: يَا رَبِّ، مِنْ أَيْنَ تَأْمُرُنِي أَنْ أَطْلُعَ، أَمِنْ مَغْرِبِي أَمْ مِنْ مَطْلَعِي؟ قَالَ: فَذَلِكَ قَوْلُهُ عَزَّ وَجَلَّ: «وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها» حَيْثُ تُحْبَسُ تَحْتَ الْعَرْشِ، «ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ» قال: يعنى ب ذَلِكَ صُنْعُ الرَّبِّ الْعَزِيزِ فِي مُلْكِهِ الْعَلِيمِ بخلقه قال: فيأتيها جبرئيل بحلة ضوء من نور العرش، على مقادير ساعات النهار، في طوله في الصيف، أو قصره في الشتاء، أو ما بين ذلك في الخريف والربيع قال: فتلبس تلك الحلة كما يلبس احدكم ثيابه، ثم تنطلق بها في جو السماء حتى تطلع من مطلعها، قال النبي ص: فكأنها قد حبست مقدار ثلاث ليال ثم لا تكسى ضوءا، وتؤمر أن تطلع من مغربها، فذلك قوله عز وجل: «إِذَا الشَّمْسُ كُوِّرَتْ» .\u003c/p>\u003cp data-pair=\"64.2\" id=\"ar-odlomak-64-2\">قال: والقمر كذلك في مطلعه ومجراه في أفق السماء ومغربه وارتفاعه إلى السماء السابعة العليا، ومحبسه تحت العرش وسجوده واستئذانه، ولكن جبرائيل ع يأتيه بالحلة من نور الكرسي قال: فذلك قوله عز وجل: «جَعَلَ الشَّمْسَ ضِياءً وَالْقَمَرَ نُوراً] »\u003c/p>\u003cp data-pair=\"64.3\" id=\"ar-odlomak-64-3\">قال أبو ذر: ثم عدلت مع رسول الله ص\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 64\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"64.1\" id=\"odlomak-64-1\">\u003cspan class=\"isnad\">Subh, Ebu Nuajm el-Belhi, od Mukatila ibn Hajjana, od Abdurrahmana ibn Ebze, od Ebu Zerra el-Gifarija, koji je rekao: \u003c/span>„Držao sam Allahovog Poslanika, sallallahu alejhi ve sellem, za ruku dok smo zajedno hodali prema zapadu. Sunce se primicalo zalasku i gledali smo ga sve dok nije zašlo.“ Rekao je: „Upitao sam: ‘Allahov Poslaniče, gdje ono zalazi?’ Odgovorio je: ‘Zalazi na nebu, zatim se podiže s jednog neba na drugo dok ne bude podignuto do najvišeg, sedmog neba, dok ne bude ispod Arša. Tada pada ničice na sedždu, a s njim sedždu čine i meleki zaduženi za njega. Zatim govori: Gospodaru moj, odakle mi naređuješ da izađem: sa svoga zapada ili sa svoga istoka?’“ Rekao je: „To su riječi Njega, Silnog i Uzvišenog: ‘I Sunce teče do svoga boravišta’ — gdje se zadržava pod Aršom — ‘To je određenje Silnoga, Sveznajućeg.’“ Rekao je: „Time se misli na djelo Gospodara, Silnoga u Svojoj vlasti, Sveznajućeg o Svojim stvorenjima.“ Rekao je: „Tada mu Džibril donosi svijetlu odoru od svjetlosti Arša, prema broju sati dana: njegovoj dužini ljeti, kratkoći zimi ili onome između toga ujesen i u proljeće.“ Rekao je: „Oblači tu odoru kao što neko od vas oblači svoju odjeću, zatim s njom kreće nebeskim prostorom dok ne izađe na svome istoku.“ Vjerovjesnik, sallallahu alejhi ve sellem, rekao je: „Kao da je već zadržano koliko traju tri noći; zatim se više ne odijeva sjajem i naređuje mu se da izađe sa svoga zapada. To su riječi Njega, Silnog i Uzvišenog: ‘Kada Sunce bude smotano.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Ja-Sin, 36:38, navedeni dijelovi; Et-Tekvir, 81:1.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"64.2\" id=\"odlomak-64-2\">Rekao je: „Tako je i s Mjesecom: s njegovim izlaskom, kretanjem nebeskim obzorjem, zalaskom, uzdizanjem do najvišeg, sedmog neba, zadržavanjem ispod Arša, sedždom i traženjem dopuštenja. Međutim, Džibril, alejhis-selam, njemu donosi odoru od svjetlosti Kursijja.“ Rekao je: „To su riječi Njega, Silnog i Uzvišenog: ‘Sunce je učinio sjajem, a Mjesec svjetlošću.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Junus, 10:5, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"64.3\" id=\"odlomak-64-3\">Ebu Zerr je rekao: „Zatim sam skrenuo zajedno s Allahovim Poslanikom, sallallahu alejhi ve sellem,\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":65,"html":"\u003csection class=\"page\" data-page=\"65\" id=\"stranica-65\">\u003ch2>Stranica 65\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 65\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"65.1\" id=\"ar-odlomak-65-1\">فصلينا المغرب\u003c/p>\u003cp data-pair=\"65.2\" id=\"ar-odlomak-65-2\">فهذا الخبر عن رسول الله ينبئ أن سبب اختلاف حالة الشمس والقمر إنما هو أن ضوء الشمس من كسوة كسيتها من ضوء العرش، وأن نور القمر من كسوة كسيها من نور الكرسي\u003c/p>\u003cp data-pair=\"65.3\" id=\"ar-odlomak-65-3\">فأما الخبر الآخر الذي يدل على غير هذا المعنى، فما \u003cspan class=\"isnad\">حدثنى محمد ابن أَبِي مَنْصُورٍ، قَالَ: حَدَّثَنَا خَلَفُ بْنُ وَاصِلٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، عَنْ مُقَاتِلِ بْنِ حَيَّانَ، عَنْ عِكْرِمَةَ قَالَ: \u003c/span>بَيْنَا ابْنِ عَبَّاسٍ ذَاتَ يَوْمٍ جَالِسٌ إِذْ جَاءَهُ رَجُلٌ، فَقَالَ: يا بن عَبَّاسٍ، سَمِعْتُ الْعَجَبَ مِنْ كَعْبٍ الْحَبْرِ يَذْكُرُ فِي الشَّمْسِ وَالْقَمَرِ قَالَ: وَكَانَ مُتَّكِئًا فَاحْتَفَزَ ثُمَّ قَالَ: وَمَا ذَاكَ؟ قَالَ: زَعَمَ أَنَّهُ يُجَاءُ بِالشَّمْسِ وَالْقَمَرِ يَوْمَ الْقِيَامَةِ كَأَنَّهُمَا ثَوْرَانِ عَقِيرَانِ، فَيُقْذَفَانِ فِي جَهَنَّمَ قَالَ عِكْرِمَةُ: فَطَارَتْ مِنَ ابْنِ عَبَّاسٍ شِقَّةٌ وَوَقَعَتْ أُخْرَى غَضَبًا، ثُمَّ قَالَ: كَذَبَ كَعْبٌ! كَذَبَ كَعْبٌ! كَذَبَ كَعْبٌ! ثَلاثَ مَرَّاتٍ، بَلْ هَذِهِ يَهُودِيَّةٌ يُرِيدُ إِدْخَالَهَا فِي الإِسْلامِ، اللَّهُ أَجَلُّ وَأَكْرَمُ مِنْ أَنْ يُعَذِّبَ عَلَى طَاعَتِهِ، أَلَمْ تَسْمَعْ لِقَوْلِ اللَّهِ تَبَارَكَ وَتعَالَى: «وَسَخَّرَ لَكُمُ الشَّمْسَ وَالْقَمَرَ دائِبَيْنِ» ، إِنَّمَا يَعْنِي دءوبِهِمَا فِي الطَّاعَةِ، فَكَيْفَ يُعَذِّبُ عَبْدَيْنِ يُثْنِي عَلَيْهِمَا، أَنَّهُمَا دَائِبَانِ فِي طَاعَتِهِ! قَاتَلَ اللَّهُ هَذَا الْحَبْرَ وَقَبَّحَ حَبْرِيَّتَهُ! مَا أَجْرَأَهُ عَلَى اللَّهِ وَأَعْظَمَ فِرْيَتِهِ عَلَى هَذَيْنِ الْعَبْدَيْنِ الْمُطِيعَيْنِ لِلَّهِ!\u003c/p>\u003cp data-pair=\"65.4\" id=\"ar-odlomak-65-4\">قَالَ: ثُمَّ اسْتَرْجَعَ مِرَارًا، وَأَخَذَ عُوَيْدًا مِنَ الأَرْضِ، فَجَعَلَ يَنْكُتُهُ فِي الأَرْضِ، فَظَلَّ كَذَلِكَ مَا شَاءَ اللَّهُ، ثُمَّ انه رفع راسه، ورمى بالعويد [فقال: أَلا أُحَدِّثُكُمْ بِمَا سَمِعْتُ مِنْ رَسُولِ اللَّهِ ص، يَقُولُ فِي الشَّمْسِ وَالْقَمَرِ وَبَدْءِ خَلْقِهِمَا وَمَصِيرُ أَمْرِهِمَا؟ فَقُلْنَا: بَلَى رَحِمَكَ اللَّهُ!\u003c/p>\u003cp data-pair=\"65.5\" id=\"ar-odlomak-65-5\">فَقَالَ: إِنَّ رسول الله ص سُئِلَ عَنْ ذَلِكَ، فَقَالَ: إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى لَمَّا أَبْرَمَ خَلْقَهُ إِحْكَامًا فَلَمْ يَبْقَ مِنْ خَلْقِهِ غَيْرُ آدَمَ خَلَقَ شَمْسَيْنِ مِنْ نُورِ عَرْشِهِ، فَأَمَّا مَا كَانَ فِي سَابِقِ عِلْمِهِ أَنَّهُ يَدَعُهَا شَمْسًا، فَإِنَّهُ خَلَقَهَا مِثْلَ الدُّنْيَا مَا بَيْنَ مَشَارِقِهَا وَمَغَارِبِهَا،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 65\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"65.1\" id=\"odlomak-65-1\">pa smo klanjali akšam.“\u003c/p>\u003cp data-pair=\"65.2\" id=\"odlomak-65-2\">Ova predaja od Allahovog Poslanika izvještava da je razlog različitosti Sunca i Mjeseca to što Sunčeva svjetlost potječe od odore kojom je odjeveno, od svjetlosti Arša, a Mjesečeva svjetlost od odore kojom je odjeven, od svjetlosti Kursijja.\u003c/p>\u003cp data-pair=\"65.3\" id=\"odlomak-65-3\">Druga predaja, koja upućuje na drugačije značenje, jeste ono što \u003cspan class=\"isnad\">mi je pričao Muhammed ibn Ebu Mensur, koji je rekao: pričao nam je Halef ibn Vasil, koji je rekao: pričao nam je Ebu Nuajm, od Mukatila ibn Hajjana, od Ikrime, koji je rekao: \u003c/span>„Dok je Ibn Abbas jednoga dana sjedio, došao mu je neki čovjek i rekao: ‘Ibn Abbase, čuo sam čudnu stvar koju Ka‘b el-Habr govori o Suncu i Mjesecu.’“ Rekao je: „Ibn Abbas bio je naslonjen, pa se uspravio i rekao: ‘A šta je to?’ Odgovorio je: ‘Tvrdi da će Sunce i Mjesec na Kijametskom danu biti dovedeni poput dva bika presječenih tetiva, pa će biti bačeni u Džehennem.’“ Ikrima je rekao: „Od srdžbe je jedna strana Ibn Abbasa poletjela, a druga pala. Zatim je rekao: ‘Ka‘b je slagao! Ka‘b je slagao! Ka‘b je slagao!’ — tri puta. ‘Naprotiv, to je jevrejsko učenje koje želi unijeti u islam! Allah je uzvišeniji i plemenitiji od toga da kažnjava zbog pokornosti Njemu. Zar nisi čuo riječi Allaha, Blagoslovljenog i Uzvišenog: I potčinio vam je Sunce i Mjesec, koji neprestano teku? Time se misli na njihovu neprestanu pokornost. Kako bi kažnjavao dva roba koja hvali zato što neprestano ustrajavaju u pokornosti Njemu! Allah ubio ovog učenjaka i unakazio njegovo učeno zvanje! Kako je samo drzak prema Allahu i kako je velika njegova potvora protiv ova dva Allahu pokorna roba!’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Ibrahim, 14:33, navedeni dio. Napomena prevodioca: izraz طارت منه شقة ووقعت أخرى slikovito opisuje silnu srdžbu; doslovna slika sačuvana je u prijevodu.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"65.4\" id=\"odlomak-65-4\">Rekao je: „Zatim je više puta izgovorio: ‘Mi smo Allahovi i Njemu se vraćamo’, uzeo sa zemlje štapić i njime stao bockati zemlju. Ostao je tako koliko je Allah htio. Potom je podigao glavu, bacio štapić i rekao: ‘Hoćete li da vam ispričam šta sam čuo Allahovog Poslanika, sallallahu alejhi ve sellem, kako govori o Suncu i Mjesecu, početku njihovog stvaranja i ishodu njihovog stanja?’ Odgovorili smo: ‘Hoćemo, Allah ti se smilovao!’\u003c/p>\u003cp data-pair=\"65.5\" id=\"odlomak-65-5\">Rekao je: ‘Allahov Poslanik, sallallahu alejhi ve sellem, upitan je o tome, pa je rekao: Kada je Allah, Blagoslovljen i Uzvišen, čvrsto uredio Svoje stvaranje, te od Njegovih stvorenja nije preostao niko osim Adema, stvorio je dva sunca od svjetlosti Svoga Arša. Ono za koje je u Svome prethodnom znanju znao da će ga ostaviti suncem stvorio je velikim poput ovoga svijeta, između njegovih istoka i zapada,\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":66,"html":"\u003csection class=\"page\" data-page=\"66\" id=\"stranica-66\">\u003ch2>Stranica 66\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 66\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"66.1\" id=\"ar-odlomak-66-1\">وَأَمَّا مَا كَانَ فِي سَابِقِ عِلْمِهِ أَنَّهُ يَطْمِسُهَا وَيُحَوِّلُهَا قَمَرًا، فَإِنَّهُ دُونَ الشَّمْسِ فِي الْعِظَمِ، وَلَكِنْ إِنَّمَا يُرَى صِغَرُهُمَا مِنْ شِدَّةِ ارْتِفَاعِ السَّمَاءِ وَبُعْدِهَا مِنَ الأَرْضِ.\u003c/p>\u003cp data-pair=\"66.2\" id=\"ar-odlomak-66-2\">قَالَ: فَلَوْ تَرَكَ اللَّهُ الشَّمْسَيْنِ كَمَا كَانَ خَلَقَهُمَا فِي بَدْءِ الأَمْرِ لَمْ يَكُنْ يُعْرَفُ اللَّيْلُ مِنَ النَّهَارِ، وَلا النَّهَارُ مِنَ اللَّيْلِ، وَكَانَ لا يَدْرِي الأَجِيرُ إِلَى مَتَى يَعْمَلُ، وَمَتَى يَأْخُذُ أَجْرَهُ وَلا يَدْرِي الصَّائِمُ إِلَى مَتَى يَصُومُ، وَلا تَدْرِي الْمَرْأَةُ كَيْفَ تَعْتَدُّ، وَلا يَدْرِي الْمُسْلِمُونَ مَتَى وَقْتُ الْحَجِّ، وَلا يَدْرِي الدُّيَّانُ مَتَى تَحِلُّ دُيُونُهُمْ، وَلا يَدْرِي النَّاسُ مَتَى يَنْصَرِفُونَ لِمَعَايِشِهِمْ، وَمَتَى يَسْكُنُونَ لِرَاحَةِ أَجْسَادِهِمْ.\u003c/p>\u003cp data-pair=\"66.3\" id=\"ar-odlomak-66-3\">وَكَانَ الرَّبُّ عَزَّ وَجَلَّ أَنْظَرَ لِعِبَادِهِ وَأَرْحَمَ بِهِمْ، فأرسل جبرئيل ع فَأَمَرَ جِنَاحه على وجه القمر- وهو يومئذ شمس- ثلاث مرات، فطمس عنه الضوء، وبقي فيه النور، فذلك قوله عز وجل: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» قال: فالسواد الذي ترونه في القمر شبه الخطوط فيه فهو أثر المحو ثم خلق الله للشمس عجلة من ضوء نور العرش لها ثلاثمائة وستون عروه، ووكل بالشمس وعجلتها ثلاثمائة وستين ملكا من الملائكة من أهل السماء الدنيا، قد تعلق كل ملك منهم بعروة من تلك العرا، ووكل بالقمر وعجلته ثلاثمائة وستين ملكا من الملائكة من أهل السماء، قد تعلق بكل عروه من تلك العرا ملك منهم.\u003c/p>\u003cp data-pair=\"66.4\" id=\"ar-odlomak-66-4\">ثم قال: وخلق الله لهما مشارق ومغارب في قطري الأرض وكنفي السماء ثمانين ومائة عين في المغرب، طينة سوداء، فذلك قوله عز وجل: «وَجَدَها تَغْرُبُ فِي عَيْنٍ حَمِئَةٍ» انما يعنى حماه سوداء من طين، وثمانين ومائة عين في\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 66\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"66.1\" id=\"odlomak-66-1\">a ono za koje je u Svome prethodnom znanju znao da će mu izbrisati sjaj i pretvoriti ga u Mjesec manje je od Sunca. Međutim, njih dvoje izgledaju maleni zbog velike visine neba i njegove udaljenosti od Zemlje.’\u003c/p>\u003cp data-pair=\"66.2\" id=\"odlomak-66-2\">Rekao je: ‘Da je Allah ostavio ta dva sunca onakvima kakva ih je na početku stvorio, ne bi se razlikovali ni noć od dana ni dan od noći. Najamnik ne bi znao dokad radi i kada prima svoju nadnicu; postač ne bi znao dokad posti; žena ne bi znala kako računati iddet; muslimani ne bi znali kada je vrijeme hadža; povjerioci ne bi znali kada dospijevaju njihova potraživanja; ljudi ne bi znali kada da krenu za svojom opskrbom i kada da se umire radi odmora svojih tijela.\u003c/p>\u003cp data-pair=\"66.3\" id=\"odlomak-66-3\">Gospodar, Silan i Uzvišen, bolje je gledao na dobro Svojih robova i bio im milostiviji. Poslao je Džibrila, alejhis-selam, pa je on tri puta prevukao svojim krilom preko lica Mjeseca — a on je tada bio sunce — i izbrisao mu sjaj, dok mu je svjetlost ostala. To su riječi Njega, Silnog i Uzvišenog: I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi.’ Rekao je: ‘Crnilo koje na Mjesecu vidite poput crta trag je toga brisanja. Zatim je Allah za Sunce stvorio točak od sjaja svjetlosti Arša, s tristo šezdeset hvatišta. Za Sunce i njegov točak zadužio je tristo šezdeset meleka od stanovnika najbližeg neba. Svaki od njih uhvatio se za jedno od tih hvatišta. Za Mjesec i njegov točak zadužio je tristo šezdeset meleka od stanovnika neba; za svako hvatište uhvatio se jedan od njih.’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"66.4\" id=\"odlomak-66-4\">Zatim je rekao: ‘Allah im je stvorio istoke i zapade na krajevima Zemlje i stranama neba: stotinu osamdeset izvora na zapadu, crno blato. To su riječi Njega, Silnog i Uzvišenog: Našao ga je kako zalazi u izvoru muljevitom. Misli se na crni mulj od blata. I stotinu osamdeset izvora na \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:86, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":67,"html":"\u003csection class=\"page\" data-page=\"67\" id=\"stranica-67\">\u003ch2>Stranica 67\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 67\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"67.1\" id=\"ar-odlomak-67-1\">المشرق مثل ذلك طينة سوداء تفور غليا كغلي القدر إذا ما اشتد غليها قال:\nفكل يوم وكل ليله لها مطلع جديد ومغرب جديد، ما بين أولها مطلعا، وآخرها مغربا أطول ما يكون النهار في الصيف إلى آخرها مطلعا، وأولها مغربا أقصر ما يكون النهار في الشتاء، فذلك قوله تعالى: «رَبُّ الْمَشْرِقَيْنِ وَرَبُّ الْمَغْرِبَيْنِ» يعنى آخرها هاهنا وآخرها ثم، وترك ما بين ذلك من المشارق والمغارب، ثم جمعهما فقال: «بِرَبِّ الْمَشارِقِ وَالْمَغارِبِ» ، فذكر عدة تلك العيون كلها.\u003c/p>\u003cp data-pair=\"67.2\" id=\"ar-odlomak-67-2\">قال: وخلق الله بحرا، فجرى دون السماء مقدار ثلاث فراسخ، وهو موج مكفوف قائم في الهواء بأمر الله عز وجل لا يقطر منه قطرة، والبحار كلها.\nساكنة، وذلك البحر جار في سرعة السهم ثم انطلاقه في الهواء مستويا، كأنه حبل ممدود ما بين المشرق والمغرب، فتجري الشمس والقمر والخنس في لجة غمر ذلك البحر، فذلك قوله تعالى: «كُلٌّ فِي فَلَكٍ يَسْبَحُونَ*» ، والفلك دوران العجلة في لجة غمر ذلك البحر والذي نفس محمد بيده، لو بدت الشمس من ذلك البحر لأحرقت كل شيء في الأرض، حتى الصخور والحجارة، ولو بدا القمر من ذلك لافتتن أهل الأرض حتى يعبدوه من دون الله، إلا من شاء الله أن يعصم من أوليائه.\u003c/p>\u003cp data-pair=\"67.3\" id=\"ar-odlomak-67-3\">قال ابْنُ عَبَّاسٍ: فقال عَلِيّ بن أبي طالب رَضِيَ اللَّهُ عَنْهُ: بأبي أنت وأمي يا رسول الله! ذكرت مجرى الخنس مع الشمس والقمر، وقد أقسم الله بالخنس في القرآن إلى ما كان من ذكرك، فما الخنس؟ قال: يا علي، هن خمسة كواكب: البرجيس، وزحل، وعطارد، وبهرام، والزهرة،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 67\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"67.1\" id=\"odlomak-67-1\">istoku, s istim takvim crnim blatom koje ključa poput lonca kada mu se ključanje pojača.’ Rekao je: ‘Za svaki dan i svaku noć postoji nov izlazak i nov zalazak: od prvog izvora izlaska i posljednjeg izvora zalaska, kada je dan ljeti najduži, do posljednjeg izvora izlaska i prvog izvora zalaska, kada je dan zimi najkraći. To su Njegove, Uzvišeni je On, riječi: Gospodar dvaju istoka i Gospodar dvaju zapada. Misli na posljednji ovdje i posljednji tamo, a izostavio je istoke i zapade između njih. Potom ih je sve obuhvatio riječima: Gospodarom istoka i zapada, pa je spomenuo broj svih tih izvora.’ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Er-Rahman, 55:17; El-Me‘aridž, 70:40, navedeni dio. U drugom navodu „istoka i zapada“ prenosi množinu arapskog izraza.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"67.2\" id=\"odlomak-67-2\">Rekao je: ‘Allah je stvorio more koje teče ispod neba na udaljenosti od tri fersaha. To je zadržan val koji Allahovom, Silan je i Uzvišen, naredbom stoji u zraku, a iz njega ne kapne ni kap. Sva su mora mirna, a to more teče brzinom strijele, zatim ravno prolazi kroz zrak, kao da je uže razapeto između istoka i zapada. Sunce, Mjesec i hunnes kreću se dubinom toga mora. To su Njegove, Uzvišeni je On, riječi: Svi u putanji plove. Felek je kruženje točka u dubini toga mora. Tako mi Onoga u čijoj je ruci Muhammedova duša, kada bi se Sunce pokazalo izvan toga mora, spalilo bi sve na Zemlji, čak i stijene i kamenje. A kada bi se Mjesec pokazao izvan njega, stanovnici Zemlje bili bi toliko opčinjeni da bi ga obožavali mimo Allaha, osim onih Svojih štićenika koje bi Allah htio sačuvati.’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: izraz كل في فلك يسبحون nalazi se u El-Enbija, 21:33, i Ja-Sin, 36:40. „Hunnes“ je naziv iz predaje, objašnjen u sljedećem dijalogu; „felek“ znači putanja ili nebeska orbita.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"67.3\" id=\"odlomak-67-3\">Ibn Abbas je rekao: „Ali ibn Ebu Talib, radijallahu anhu, rekao je: ‘Neka su mi otac i majka žrtva za tebe, Allahov Poslaniče! Spomenuo si kretanje hunnesa zajedno sa Suncem i Mjesecom, a Allah se hunnesom zakleo u Kur’anu, pored onoga što si spomenuo. Šta je hunnes?’ Odgovorio je: ‘Alija, to je pet nebeskih tijela: Birdžis, Zuhal, Utarid, Behram i Zuhra,\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":68,"html":"\u003csection class=\"page\" data-page=\"68\" id=\"stranica-68\">\u003ch2>Stranica 68\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 68\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"68.1\" id=\"ar-odlomak-68-1\">فهذه الكواكب الخمسة الطالعات الجاريات، مثل الشمس والقمر، العاديات معهما، فأما سائر الكواكب فمعلقات من السماء كتعليق القناديل من المساجد، وهي تحوم مع السماء دورانا بالتسبيح والتقديس والصلاة لله، ثم قال النبي ص: فإن أحببتم أن تستبينوا ذلك، فانظروا إلى دوران الفلك مره هاهنا ومره هاهنا، فذلك دوران السماء، ودوران الكواكب معها كلها سوى هذه الخمسة، ودورانها اليوم كما ترون، وتلك صلاتها، ودورانها إلى يوم القيامة في سرعة دوران الرحا من أهوال يوم القيامة وزلازله، فذلك قوله عز وجل: «ْمَ تَمُورُ السَّماءُ مَوْراً وَتَسِيرُ الْجِبالُ سَيْراً.\nفَوَيْلٌ يَوْمَئِذٍ لِلْمُكَذِّبِينَ» .\u003c/p>\u003cp data-pair=\"68.2\" id=\"ar-odlomak-68-2\">قال: فإذا طلعت الشمس فإنها تطلع من بعض تلك العيون على عجلتها ومعها ثلاثمائة وستون ملكا ناشري أجنحتهم، يجرونها في الفلك بالتسبيح والتقديس والصلاة لله على قدر ساعات الليل وساعات النهار ليلا كان أو نهارا، فإذا أحب الله أن يبتلي الشمس والقمر فيري العباد آية من الآيات فيستعتبهم رجوعا عن معصيته وإقبالا على طاعته، خرت الشمس من العجلة فتقع في غمر ذلك البحر وهو الفلك، فإذا أحب الله أن يعظم الآية ويشدد تخويف العباد وقعت الشمس كلها فلا يبقى منها على العجلة شيء، فذلك حين يظلم النهار وتبدو النجوم، وهو المنتهى من كسوفها فإذا أراد أن يجعل آية دون آية وقع منها النصف أو الثلث أو الثلثان في الماء، ويبقى سائر ذلك على العجلة، فهو كسوف دون كسوف، وبلاء للشمس أو للقمر، وتخويف للعباد، واستعتاب من الرب عز وجل، فأي ذلك كان صارت الملائكة الموكلون بعجلتها فرقتين: فرقة منها يقبلون على الشمس فيجرونها نحو العجلة، والفرقة الأخرى\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 68\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"68.1\" id=\"odlomak-68-1\">to je tih pet nebeskih tijela koja izlaze i teku poput Sunca i Mjeseca i zajedno s njima se kreću. Ostala nebeska tijela obješena su o nebo kao što se svjetiljke vješaju u džamijama. Ona kruže zajedno s nebom slaveći, posvećujući i moleći se Allahu.’ Zatim je Vjerovjesnik, sallallahu alejhi ve sellem, rekao: ‘Ako želite da vam to bude jasno, pogledajte kruženje nebeske putanje, jednom ovamo, a drugi put onamo. To je kruženje neba i kruženje s njim svih nebeskih tijela osim ovih pet. Njihovo je današnje kruženje onakvo kakvo vidite i to je njihova molitva. Njihovo kruženje do Kijametskog dana brzo je poput okretanja mlinskog kamena, zbog strahota Kijametskog dana i njegovih potresa. To su riječi Njega, Silnog i Uzvišenog: [Na dan] kada se nebo silno uskomeša i planine se pokrenu. Teško tada poricateljima!’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Et-Tur, 52:9–11. Izraz إلى يوم القيامة doslovno je prenesen kao „do Kijametskog dana“; vremenski odnos u rečenici nije sasvim jasan. Početak arapskog navoda u izvoru oštećen je i glasi ْمَ تَمُورُ; dopunjeno „Na dan“ označeno je uglastim zagradama prema tekstu ajeta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"68.2\" id=\"odlomak-68-2\">Rekao je: ‘Kada Sunce izlazi, ono izlazi iz jednog od tih izvora na svome točku. Uz njega je tristo šezdeset meleka raširenih krila, koji ga vuku po nebeskoj putanji slaveći, posvećujući i moleći se Allahu, prema broju sati noći i sati dana, bilo noću ili danju. Kada Allah htjedne iskušati Sunce i Mjesec, pokazati robovima jedan od znakova i pozvati ih da se vrate od nepokornosti Njemu i okrenu se pokornosti, Sunce pada s točka u dubinu toga mora, a to je felek. Kada Allah želi taj znak učiniti velikim i jače zastrašiti robove, cijelo Sunce padne, pa na točku od njega ne ostane ništa. Tada dan potamni i pokažu se zvijezde; to je krajnji stepen njegove pomrčine. Ako želi pokazati manji znak, u vodu padne polovina, trećina ili dvije trećine Sunca, dok mu ostatak ostaje na točku. To je manja pomrčina od druge pomrčine, iskušenje Sunca ili Mjeseca, zastrašivanje robova i Gospodarev, Silan je i Uzvišen, poziv na povratak. Šta god od toga bilo, meleki zaduženi za njegov točak podijele se u dvije skupine. Jedna se okreće Suncu i vuče ga prema točku, a druga\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":69,"html":"\u003csection class=\"page\" data-page=\"69\" id=\"stranica-69\">\u003ch2>Stranica 69\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 69\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"69.1\" id=\"ar-odlomak-69-1\">يقبلون على العجلة فيجرونها نحو الشمس، وهم في ذلك يقرونها في الفلك بالتسبيح والتقديس والصلاة لله على قدر ساعات النهار أو ساعات الليل، ليلا كان أو نهارا، في الصيف كان ذلك أو في الشتاء، أو ما بين ذلك في الخريف والربيع، لكيلا يزيد في طولهما شيء، ولكن قد ألهمهم الله علم ذلك، وجعل لهم تلك القوة، والذي ترون من خروج الشمس أو القمر بعد الكسوف قليلا قليلا، من غمر ذلك البحر الذي يعلوهما، فإذا أخرجوها كلها اجتمعت الملائكة كلهم، فاحتملوها حتى يضعوها على العجلة، فيحمدون الله على ما قواهم لذلك، ويتعلقون بعرا العجلة، ويجرونها في الفلك بالتسبيح والتقديس والصلاة لله حتى يبلغوا بها المغرب، فإذا بلغوا بها المغرب أدخلوها تلك العين، فتسقط من أفق السماء في العين.\u003c/p>\u003cp data-pair=\"69.2\" id=\"ar-odlomak-69-2\">ثم قال النبي ص، وعجب من خلق الله: وللعجب من القدرة فيما لم نر أعجب من ذلك، وذلك قول جبرئيل ع لساره:\n\n«أَتَعْجَبِينَ مِنْ أَمْرِ اللَّهِ» وذلك أن الله عز وجل خلق مدينتين: إحداهما بالمشرق والأخرى بالمغرب، أهل المدينة التي بالمشرق من بقايا عاد من نسل مؤمنيهم، وأهل التي بالمغرب من بقايا ثمود من نسل الذين آمنوا بصالح، اسم التي بالمشرق بالسريانية مرقيسيا وبالعربية جابلق واسم التي بالمغرب بالسريانية برجيسيا وبالعربية جابرس ولكل مدينة منهما عشرة آلاف باب، ما بين\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 69\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"69.1\" id=\"odlomak-69-1\">se okreće točku i vuče ga prema Suncu. Pritom ga održavaju na nebeskoj putanji slaveći, posvećujući i moleći se Allahu, prema broju sati dana ili sati noći, bilo noću ili danju, ljeti, zimi ili između toga ujesen i u proljeće, kako se njihovoj dužini ne bi ništa dodalo. Allah ih je, međutim, nadahnuo znanjem o tome i dao im tu snagu. Ono što vidite od postepenog pojavljivanja Sunca ili Mjeseca nakon pomrčine izlazak je iz dubine toga mora koje ih prekriva. Kada ga potpuno izvuku, svi se meleki okupe i ponesu ga dok ga ne postave na točak. Hvale Allaha što im je dao snagu za to, hvataju se za hvatišta točka i vuku ga po nebeskoj putanji slaveći, posvećujući i moleći se Allahu, dok ga ne dovedu do zapada. Kada ga dovedu do zapada, uvedu ga u taj izvor, pa ono s nebeskog obzorja pada u izvor.’\u003c/p>\u003cp data-pair=\"69.2\" id=\"odlomak-69-2\">Zatim je Vjerovjesnik, sallallahu alejhi ve sellem, rekao, čudeći se Allahovom stvaranju: ‘Još je čudesnija moć u onome što nismo vidjeli. To su Džibrilove, alejhis-selam, riječi upućene Sari: Zar se čudiš Allahovoj naredbi? Allah, Silan i Uzvišen, stvorio je dva grada: jedan na istoku, a drugi na zapadu. Stanovnici istočnog grada ostaci su Ada, potomci njihovih vjernika, a stanovnici zapadnog grada ostaci su Semuda, potomci onih koji su vjerovali Salihu. Ime istočnog grada na sirjačkom je Markisija, a na arapskom Džabulak. Ime zapadnog grada na sirjačkom je Birdžisija, a na arapskom Džaburas. Svaki od ta dva grada ima deset hiljada vrata. Između \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:73, navedeni dio. Imena gradova prenesena su prema arapskom zapisu مرقيسيا، جابلق، برجيسيا، جابرس; izgovor nije potpuno označen u izvoru.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":70,"html":"\u003csection class=\"page\" data-page=\"70\" id=\"stranica-70\">\u003ch2>Stranica 70\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 70\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"70.1\" id=\"ar-odlomak-70-1\">كل بابين فرسخ، ينوب كل يوم على كل باب من أبواب هاتين المدينتين عشرة آلاف رجل من الحراسة، عليهم السلاح، لا تنوبهم الحراسة بعد ذلك إلى يوم ينفخ في الصور، فو الذى نفس محمد بيده، لولا كثرة هؤلاء القوم وضجيج أصواتهم لسمع الناس من جميع أهل الدنيا هدة وقعة الشمس حين تطلع وحين تغرب، ومن ورائهم ثلاث أمم: منسك، وتافيل، وتاريس، ومن دونهم يأجوج وماجوج.\u003c/p>\u003cp data-pair=\"70.2\" id=\"ar-odlomak-70-2\">وان جبرئيل ع انطلق بي اليهم ليله اسرى بي من المسجد الحرام إلى المسجد الأقصى، فدعوت يأجوج ومأجوج إلى عبادة الله عز وجل فأبوا أن يجيبوني، ثم انطلق بي إلى أهل المدينتين، فدعوتهم إلى دين الله عز وجل والى عبادته فأجابوا وأنابوا، فهم في الدين إخواننا، من أحسن منهم فهو مع محسنكم، ومن أساء منهم فأولئك مع المسيئين منكم ثم انطلق بي إلى الأمم الثلاث، فدعوتهم إلى دين الله وإلى عبادته فأنكروا ما دعوتهم إليه، فكفروا بالله عز وجل وكذبوا رسله، فهم مع يأجوج ومأجوج وسائر من عصى الله في النار، فإذا ما غربت الشمس رفع بها من سماء إلى سماء في سرعة طيران الملائكة، حتى يبلغ بها إلى السماء السابعة العليا، حتى تكون تحت العرش فتخر ساجده، وتسجد معها الملائكة الموكلون بها، فيحدر بها من سماء إلى سماء، فإذا وصلت إلى هذه السماء فذلك حين ينفجر ال
