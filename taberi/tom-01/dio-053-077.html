نَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبْزَى، عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قَالَ: \u003c/span>كُنْتُ آخُذُ بِيَدِ رسول الله ص وَنَحْنُ نَتَمَاشَى جَمِيعًا نَحْوَ الْمَغْرِبِ، وَقَدْ طَفَلَتِ الشَّمْسُ، فَمَا زِلْنَا نَنْظُرُ إِلَيْهَا حَتَّى غَابَتْ، [قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، أَيْنَ تَغْرُبُ؟ قَالَ: تَغْرُبُ فِي السَّمَاءِ، ثُمَّ تُرْفَعُ مِنْ سَمَاءٍ إِلَى سَمَاءٍ حَتَّى تُرْفَعَ إِلَى السَّمَاءِ السابعة العليا، حتى تكون تحت العرش، فتخر سَاجِدَةً، فَتَسْجُدُ مَعَهَا الْمَلائِكَةُ الْمُوَكَّلُونَ بِهَا، ثُمَّ تَقُولُ: يَا رَبِّ، مِنْ أَيْنَ تَأْمُرُنِي أَنْ أَطْلُعَ، أَمِنْ مَغْرِبِي أَمْ مِنْ مَطْلَعِي؟ قَالَ: فَذَلِكَ قَوْلُهُ عَزَّ وَجَلَّ: «وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَها» حَيْثُ تُحْبَسُ تَحْتَ الْعَرْشِ، «ذلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ» قال: يعنى ب ذَلِكَ صُنْعُ الرَّبِّ الْعَزِيزِ فِي مُلْكِهِ الْعَلِيمِ بخلقه قال: فيأتيها جبرئيل بحلة ضوء من نور العرش، على مقادير ساعات النهار، في طوله في الصيف، أو قصره في الشتاء، أو ما بين ذلك في الخريف والربيع قال: فتلبس تلك الحلة كما يلبس احدكم ثيابه، ثم تنطلق بها في جو السماء حتى تطلع من مطلعها، قال النبي ص: فكأنها قد حبست مقدار ثلاث ليال ثم لا تكسى ضوءا، وتؤمر أن تطلع من مغربها، فذلك قوله عز وجل: «إِذَا الشَّمْسُ كُوِّرَتْ» .","bs_ranges":[[0,118]],"bs_html":"\u003cspan class=\"isnad\">Subh, Ebu Nuajm el-Belhi, od Mukatila ibn Hajjana, od Abdurrahmana ibn Ebze, od Ebu Zerra el-Gifarija, koji je rekao: \u003c/span>„Držao sam Allahovog Poslanika, sallallahu alejhi ve sellem, za ruku dok smo zajedno hodali prema zapadu. Sunce se primicalo zalasku i gledali smo ga sve dok nije zašlo.“ Rekao je: „Upitao sam: ‘Allahov Poslaniče, gdje ono zalazi?’ Odgovorio je: ‘Zalazi na nebu, zatim se podiže s jednog neba na drugo dok ne bude podignuto do najvišeg, sedmog neba, dok ne bude ispod Arša. Tada pada ničice na sedždu, a s njim sedždu čine i meleki zaduženi za njega. Zatim govori: Gospodaru moj, odakle mi naređuješ da izađem: sa svoga zapada ili sa svoga istoka?’“ Rekao je: „To su riječi Njega, Silnog i Uzvišenog: ‘I Sunce teče do svoga boravišta’ — gdje se zadržava pod Aršom — ‘To je određenje Silnoga, Sveznajućeg.’“ Rekao je: „Time se misli na djelo Gospodara, Silnoga u Svojoj vlasti, Sveznajućeg o Svojim stvorenjima.“ Rekao je: „Tada mu Džibril donosi svijetlu odoru od svjetlosti Arša, prema broju sati dana: njegovoj dužini ljeti, kratkoći zimi ili onome između toga ujesen i u proljeće.“ Rekao je: „Oblači tu odoru kao što neko od vas oblači svoju odjeću, zatim s njom kreće nebeskim prostorom dok ne izađe na svome istoku.“ Vjerovjesnik, sallallahu alejhi ve sellem, rekao je: „Kao da je već zadržano koliko traju tri noći; zatim se više ne odijeva sjajem i naređuje mu se da izađe sa svoga zapada. To su riječi Njega, Silnog i Uzvišenog: ‘Kada Sunce bude smotano.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Ja-Sin, 36:38, navedeni dijelovi; Et-Tekvir, 81:1.⟧\u003c/span>"},{"id":"64.2","ar":"قال: والقمر كذلك في مطلعه ومجراه في أفق السماء ومغربه وارتفاعه إلى السماء السابعة العليا، ومحبسه تحت العرش وسجوده واستئذانه، ولكن جبرائيل ع يأتيه بالحلة من نور الكرسي قال: فذلك قوله عز وجل: «جَعَلَ الشَّمْسَ ضِياءً وَالْقَمَرَ نُوراً] »","bs":"Rekao je: „Tako je i s Mjesecom: s njegovim izlaskom, kretanjem nebeskim obzorjem, zalaskom, uzdizanjem do najvišeg, sedmog neba, zadržavanjem ispod Arša, sedždom i traženjem dopuštenja. Međutim, Džibril, alejhis-selam, njemu donosi odoru od svjetlosti Kursijja.“ Rekao je: „To su riječi Njega, Silnog i Uzvišenog: ‘Sunce je učinio sjajem, a Mjesec svjetlošću.’“ ⟦Prijevod kur’anskog navoda: Junus, 10:5, navedeni dio.⟧","ar_ranges":[],"ar_html":"قال: والقمر كذلك في مطلعه ومجراه في أفق السماء ومغربه وارتفاعه إلى السماء السابعة العليا، ومحبسه تحت العرش وسجوده واستئذانه، ولكن جبرائيل ع يأتيه بالحلة من نور الكرسي قال: فذلك قوله عز وجل: «جَعَلَ الشَّمْسَ ضِياءً وَالْقَمَرَ نُوراً] »","bs_ranges":[],"bs_html":"Rekao je: „Tako je i s Mjesecom: s njegovim izlaskom, kretanjem nebeskim obzorjem, zalaskom, uzdizanjem do najvišeg, sedmog neba, zadržavanjem ispod Arša, sedždom i traženjem dopuštenja. Međutim, Džibril, alejhis-selam, njemu donosi odoru od svjetlosti Kursijja.“ Rekao je: „To su riječi Njega, Silnog i Uzvišenog: ‘Sunce je učinio sjajem, a Mjesec svjetlošću.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Junus, 10:5, navedeni dio.⟧\u003c/span>"},{"id":"64.3","ar":"قال أبو ذر: ثم عدلت مع رسول الله ص","bs":"Ebu Zerr je rekao: „Zatim sam skrenuo zajedno s Allahovim Poslanikom, sallallahu alejhi ve sellem,","ar_ranges":[],"ar_html":"قال أبو ذر: ثم عدلت مع رسول الله ص","bs_ranges":[],"bs_html":"Ebu Zerr je rekao: „Zatim sam skrenuo zajedno s Allahovim Poslanikom, sallallahu alejhi ve sellem,"}],"notes":[]},{"n":65,"ar":"فصلينا المغرب فهذا الخبر عن رسول الله ينبئ أن سبب اختلاف حالة الشمس والقمر إنما هو أن ضوء الشمس من كسوة كسيتها من ضوء العرش، وأن نور القمر من كسوة كسيها من نور الكرسي فأما الخبر الآخر الذي يدل على غير هذا المعنى، فما حدثنى محمد ابن أَبِي مَنْصُورٍ، قَالَ: حَدَّثَنَا خَلَفُ بْنُ وَاصِلٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، عَنْ مُقَاتِلِ بْنِ حَيَّانَ، عَنْ عِكْرِمَةَ قَالَ: بَيْنَا ابْنِ عَبَّاسٍ ذَاتَ يَوْمٍ جَالِسٌ إِذْ جَاءَهُ رَجُلٌ، فَقَالَ: يا بن عَبَّاسٍ، سَمِعْتُ الْعَجَبَ مِنْ كَعْبٍ الْحَبْرِ يَذْكُرُ فِي الشَّمْسِ وَالْقَمَرِ قَالَ: وَكَانَ مُتَّكِئًا فَاحْتَفَزَ ثُمَّ قَالَ: وَمَا ذَاكَ؟ قَالَ: زَعَمَ أَنَّهُ يُجَاءُ بِالشَّمْسِ وَالْقَمَرِ يَوْمَ الْقِيَامَةِ كَأَنَّهُمَا ثَوْرَانِ عَقِيرَانِ، فَيُقْذَفَانِ فِي جَهَنَّمَ قَالَ عِكْرِمَةُ: فَطَارَتْ مِنَ ابْنِ عَبَّاسٍ شِقَّةٌ وَوَقَعَتْ أُخْرَى غَضَبًا، ثُمَّ قَالَ: كَذَبَ كَعْبٌ! كَذَبَ كَعْبٌ! كَذَبَ كَعْبٌ! ثَلاثَ مَرَّاتٍ، بَلْ هَذِهِ يَهُودِيَّةٌ يُرِيدُ إِدْخَالَهَا فِي الإِسْلامِ، اللَّهُ أَجَلُّ وَأَكْرَمُ مِنْ أَنْ يُعَذِّبَ عَلَى طَاعَتِهِ، أَلَمْ تَسْمَعْ لِقَوْلِ اللَّهِ تَبَارَكَ وَتعَالَى: «وَسَخَّرَ لَكُمُ الشَّمْسَ وَالْقَمَرَ دائِبَيْنِ» ، إِنَّمَا يَعْنِي دءوبِهِمَا فِي الطَّاعَةِ، فَكَيْفَ يُعَذِّبُ عَبْدَيْنِ يُثْنِي عَلَيْهِمَا، أَنَّهُمَا دَائِبَانِ فِي طَاعَتِهِ! قَاتَلَ اللَّهُ هَذَا الْحَبْرَ وَقَبَّحَ حَبْرِيَّتَهُ! مَا أَجْرَأَهُ عَلَى اللَّهِ وَأَعْظَمَ فِرْيَتِهِ عَلَى هَذَيْنِ الْعَبْدَيْنِ الْمُطِيعَيْنِ لِلَّهِ! قَالَ: ثُمَّ اسْتَرْجَعَ مِرَارًا، وَأَخَذَ عُوَيْدًا مِنَ الأَرْضِ، فَجَعَلَ يَنْكُتُهُ فِي الأَرْضِ، فَظَلَّ كَذَلِكَ مَا شَاءَ اللَّهُ، ثُمَّ انه رفع راسه، ورمى بالعويد [فقال: أَلا أُحَدِّثُكُمْ بِمَا سَمِعْتُ مِنْ رَسُولِ اللَّهِ ص، يَقُولُ فِي الشَّمْسِ وَالْقَمَرِ وَبَدْءِ خَلْقِهِمَا وَمَصِيرُ أَمْرِهِمَا؟ فَقُلْنَا: بَلَى رَحِمَكَ اللَّهُ! فَقَالَ: إِنَّ رسول الله ص سُئِلَ عَنْ ذَلِكَ، فَقَالَ: إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى لَمَّا أَبْرَمَ خَلْقَهُ إِحْكَامًا فَلَمْ يَبْقَ مِنْ خَلْقِهِ غَيْرُ آدَمَ خَلَقَ شَمْسَيْنِ مِنْ نُورِ عَرْشِهِ، فَأَمَّا مَا كَانَ فِي سَابِقِ عِلْمِهِ أَنَّهُ يَدَعُهَا شَمْسًا، فَإِنَّهُ خَلَقَهَا مِثْلَ الدُّنْيَا مَا بَيْنَ مَشَارِقِهَا وَمَغَارِبِهَا،","bs":"\u003cp data-paragraph=\"65.1\">pa smo klanjali akšam.“\u003c/p>\u003cp data-paragraph=\"65.2\">Ova predaja od Allahovog Poslanika izvještava da je razlog različitosti Sunca i Mjeseca to što Sunčeva svjetlost potječe od odore kojom je odjeveno, od svjetlosti Arša, a Mjesečeva svjetlost od odore kojom je odjeven, od svjetlosti Kursijja.\u003c/p>\u003cp data-paragraph=\"65.3\">Druga predaja, koja upućuje na drugačije značenje, jeste ono što mi je pričao Muhammed ibn Ebu Mensur, koji je rekao: pričao nam je Halef ibn Vasil, koji je rekao: pričao nam je Ebu Nuajm, od Mukatila ibn Hajjana, od Ikrime, koji je rekao: „Dok je Ibn Abbas jednoga dana sjedio, došao mu je neki čovjek i rekao: ‘Ibn Abbase, čuo sam čudnu stvar koju Ka‘b el-Habr govori o Suncu i Mjesecu.’“ Rekao je: „Ibn Abbas bio je naslonjen, pa se uspravio i rekao: ‘A šta je to?’ Odgovorio je: ‘Tvrdi da će Sunce i Mjesec na Kijametskom danu biti dovedeni poput dva bika presječenih tetiva, pa će biti bačeni u Džehennem.’“ Ikrima je rekao: „Od srdžbe je jedna strana Ibn Abbasa poletjela, a druga pala. Zatim je rekao: ‘Ka‘b je slagao! Ka‘b je slagao! Ka‘b je slagao!’ — tri puta. ‘Naprotiv, to je jevrejsko učenje koje želi unijeti u islam! Allah je uzvišeniji i plemenitiji od toga da kažnjava zbog pokornosti Njemu. Zar nisi čuo riječi Allaha, Blagoslovljenog i Uzvišenog: I potčinio vam je Sunce i Mjesec, koji neprestano teku? Time se misli na njihovu neprestanu pokornost. Kako bi kažnjavao dva roba koja hvali zato što neprestano ustrajavaju u pokornosti Njemu! Allah ubio ovog učenjaka i unakazio njegovo učeno zvanje! Kako je samo drzak prema Allahu i kako je velika njegova potvora protiv ova dva Allahu pokorna roba!’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Ibrahim, 14:33, navedeni dio. Napomena prevodioca: izraz طارت منه شقة ووقعت أخرى slikovito opisuje silnu srdžbu; doslovna slika sačuvana je u prijevodu.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"65.4\">Rekao je: „Zatim je više puta izgovorio: ‘Mi smo Allahovi i Njemu se vraćamo’, uzeo sa zemlje štapić i njime stao bockati zemlju. Ostao je tako koliko je Allah htio. Potom je podigao glavu, bacio štapić i rekao: ‘Hoćete li da vam ispričam šta sam čuo Allahovog Poslanika, sallallahu alejhi ve sellem, kako govori o Suncu i Mjesecu, početku njihovog stvaranja i ishodu njihovog stanja?’ Odgovorili smo: ‘Hoćemo, Allah ti se smilovao!’\u003c/p>\u003cp data-paragraph=\"65.5\">Rekao je: ‘Allahov Poslanik, sallallahu alejhi ve sellem, upitan je o tome, pa je rekao: Kada je Allah, Blagoslovljen i Uzvišen, čvrsto uredio Svoje stvaranje, te od Njegovih stvorenja nije preostao niko osim Adema, stvorio je dva sunca od svjetlosti Svoga Arša. Ono za koje je u Svome prethodnom znanju znao da će ga ostaviti suncem stvorio je velikim poput ovoga svijeta, između njegovih istoka i zapada,\u003c/p>","paragraphs":[{"id":"65.1","ar":"فصلينا المغرب","bs":"pa smo klanjali akšam.“","ar_ranges":[],"ar_html":"فصلينا المغرب","bs_ranges":[],"bs_html":"pa smo klanjali akšam.“"},{"id":"65.2","ar":"فهذا الخبر عن رسول الله ينبئ أن سبب اختلاف حالة الشمس والقمر إنما هو أن ضوء الشمس من كسوة كسيتها من ضوء العرش، وأن نور القمر من كسوة كسيها من نور الكرسي","bs":"Ova predaja od Allahovog Poslanika izvještava da je razlog različitosti Sunca i Mjeseca to što Sunčeva svjetlost potječe od odore kojom je odjeveno, od svjetlosti Arša, a Mjesečeva svjetlost od odore kojom je odjeven, od svjetlosti Kursijja.","ar_ranges":[],"ar_html":"فهذا الخبر عن رسول الله ينبئ أن سبب اختلاف حالة الشمس والقمر إنما هو أن ضوء الشمس من كسوة كسيتها من ضوء العرش، وأن نور القمر من كسوة كسيها من نور الكرسي","bs_ranges":[],"bs_html":"Ova predaja od Allahovog Poslanika izvještava da je razlog različitosti Sunca i Mjeseca to što Sunčeva svjetlost potječe od odore kojom je odjeveno, od svjetlosti Arša, a Mjesečeva svjetlost od odore kojom je odjeven, od svjetlosti Kursijja."},{"id":"65.3","ar":"فأما الخبر الآخر الذي يدل على غير هذا المعنى، فما حدثنى محمد ابن أَبِي مَنْصُورٍ، قَالَ: حَدَّثَنَا خَلَفُ بْنُ وَاصِلٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، عَنْ مُقَاتِلِ بْنِ حَيَّانَ، عَنْ عِكْرِمَةَ قَالَ: بَيْنَا ابْنِ عَبَّاسٍ ذَاتَ يَوْمٍ جَالِسٌ إِذْ جَاءَهُ رَجُلٌ، فَقَالَ: يا بن عَبَّاسٍ، سَمِعْتُ الْعَجَبَ مِنْ كَعْبٍ الْحَبْرِ يَذْكُرُ فِي الشَّمْسِ وَالْقَمَرِ قَالَ: وَكَانَ مُتَّكِئًا فَاحْتَفَزَ ثُمَّ قَالَ: وَمَا ذَاكَ؟ قَالَ: زَعَمَ أَنَّهُ يُجَاءُ بِالشَّمْسِ وَالْقَمَرِ يَوْمَ الْقِيَامَةِ كَأَنَّهُمَا ثَوْرَانِ عَقِيرَانِ، فَيُقْذَفَانِ فِي جَهَنَّمَ قَالَ عِكْرِمَةُ: فَطَارَتْ مِنَ ابْنِ عَبَّاسٍ شِقَّةٌ وَوَقَعَتْ أُخْرَى غَضَبًا، ثُمَّ قَالَ: كَذَبَ كَعْبٌ! كَذَبَ كَعْبٌ! كَذَبَ كَعْبٌ! ثَلاثَ مَرَّاتٍ، بَلْ هَذِهِ يَهُودِيَّةٌ يُرِيدُ إِدْخَالَهَا فِي الإِسْلامِ، اللَّهُ أَجَلُّ وَأَكْرَمُ مِنْ أَنْ يُعَذِّبَ عَلَى طَاعَتِهِ، أَلَمْ تَسْمَعْ لِقَوْلِ اللَّهِ تَبَارَكَ وَتعَالَى: «وَسَخَّرَ لَكُمُ الشَّمْسَ وَالْقَمَرَ دائِبَيْنِ» ، إِنَّمَا يَعْنِي دءوبِهِمَا فِي الطَّاعَةِ، فَكَيْفَ يُعَذِّبُ عَبْدَيْنِ يُثْنِي عَلَيْهِمَا، أَنَّهُمَا دَائِبَانِ فِي طَاعَتِهِ! قَاتَلَ اللَّهُ هَذَا الْحَبْرَ وَقَبَّحَ حَبْرِيَّتَهُ! مَا أَجْرَأَهُ عَلَى اللَّهِ وَأَعْظَمَ فِرْيَتِهِ عَلَى هَذَيْنِ الْعَبْدَيْنِ الْمُطِيعَيْنِ لِلَّهِ!","bs":"Druga predaja, koja upućuje na drugačije značenje, jeste ono što mi je pričao Muhammed ibn Ebu Mensur, koji je rekao: pričao nam je Halef ibn Vasil, koji je rekao: pričao nam je Ebu Nuajm, od Mukatila ibn Hajjana, od Ikrime, koji je rekao: „Dok je Ibn Abbas jednoga dana sjedio, došao mu je neki čovjek i rekao: ‘Ibn Abbase, čuo sam čudnu stvar koju Ka‘b el-Habr govori o Suncu i Mjesecu.’“ Rekao je: „Ibn Abbas bio je naslonjen, pa se uspravio i rekao: ‘A šta je to?’ Odgovorio je: ‘Tvrdi da će Sunce i Mjesec na Kijametskom danu biti dovedeni poput dva bika presječenih tetiva, pa će biti bačeni u Džehennem.’“ Ikrima je rekao: „Od srdžbe je jedna strana Ibn Abbasa poletjela, a druga pala. Zatim je rekao: ‘Ka‘b je slagao! Ka‘b je slagao! Ka‘b je slagao!’ — tri puta. ‘Naprotiv, to je jevrejsko učenje koje želi unijeti u islam! Allah je uzvišeniji i plemenitiji od toga da kažnjava zbog pokornosti Njemu. Zar nisi čuo riječi Allaha, Blagoslovljenog i Uzvišenog: I potčinio vam je Sunce i Mjesec, koji neprestano teku? Time se misli na njihovu neprestanu pokornost. Kako bi kažnjavao dva roba koja hvali zato što neprestano ustrajavaju u pokornosti Njemu! Allah ubio ovog učenjaka i unakazio njegovo učeno zvanje! Kako je samo drzak prema Allahu i kako je velika njegova potvora protiv ova dva Allahu pokorna roba!’“ ⟦Prijevod kur’anskog navoda: Ibrahim, 14:33, navedeni dio. Napomena prevodioca: izraz طارت منه شقة ووقعت أخرى slikovito opisuje silnu srdžbu; doslovna slika sačuvana je u prijevodu.⟧","ar_ranges":[[50,208]],"ar_html":"فأما الخبر الآخر الذي يدل على غير هذا المعنى، فما \u003cspan class=\"isnad\">حدثنى محمد ابن أَبِي مَنْصُورٍ، قَالَ: حَدَّثَنَا خَلَفُ بْنُ وَاصِلٍ، قَالَ: حَدَّثَنَا أَبُو نُعَيْمٍ، عَنْ مُقَاتِلِ بْنِ حَيَّانَ، عَنْ عِكْرِمَةَ قَالَ: \u003c/span>بَيْنَا ابْنِ عَبَّاسٍ ذَاتَ يَوْمٍ جَالِسٌ إِذْ جَاءَهُ رَجُلٌ، فَقَالَ: يا بن عَبَّاسٍ، سَمِعْتُ الْعَجَبَ مِنْ كَعْبٍ الْحَبْرِ يَذْكُرُ فِي الشَّمْسِ وَالْقَمَرِ قَالَ: وَكَانَ مُتَّكِئًا فَاحْتَفَزَ ثُمَّ قَالَ: وَمَا ذَاكَ؟ قَالَ: زَعَمَ أَنَّهُ يُجَاءُ بِالشَّمْسِ وَالْقَمَرِ يَوْمَ الْقِيَامَةِ كَأَنَّهُمَا ثَوْرَانِ عَقِيرَانِ، فَيُقْذَفَانِ فِي جَهَنَّمَ قَالَ عِكْرِمَةُ: فَطَارَتْ مِنَ ابْنِ عَبَّاسٍ شِقَّةٌ وَوَقَعَتْ أُخْرَى غَضَبًا، ثُمَّ قَالَ: كَذَبَ كَعْبٌ! كَذَبَ كَعْبٌ! كَذَبَ كَعْبٌ! ثَلاثَ مَرَّاتٍ، بَلْ هَذِهِ يَهُودِيَّةٌ يُرِيدُ إِدْخَالَهَا فِي الإِسْلامِ، اللَّهُ أَجَلُّ وَأَكْرَمُ مِنْ أَنْ يُعَذِّبَ عَلَى طَاعَتِهِ، أَلَمْ تَسْمَعْ لِقَوْلِ اللَّهِ تَبَارَكَ وَتعَالَى: «وَسَخَّرَ لَكُمُ الشَّمْسَ وَالْقَمَرَ دائِبَيْنِ» ، إِنَّمَا يَعْنِي دءوبِهِمَا فِي الطَّاعَةِ، فَكَيْفَ يُعَذِّبُ عَبْدَيْنِ يُثْنِي عَلَيْهِمَا، أَنَّهُمَا دَائِبَانِ فِي طَاعَتِهِ! قَاتَلَ اللَّهُ هَذَا الْحَبْرَ وَقَبَّحَ حَبْرِيَّتَهُ! مَا أَجْرَأَهُ عَلَى اللَّهِ وَأَعْظَمَ فِرْيَتِهِ عَلَى هَذَيْنِ الْعَبْدَيْنِ الْمُطِيعَيْنِ لِلَّهِ!","bs_ranges":[[65,240]],"bs_html":"Druga predaja, koja upućuje na drugačije značenje, jeste ono što \u003cspan class=\"isnad\">mi je pričao Muhammed ibn Ebu Mensur, koji je rekao: pričao nam je Halef ibn Vasil, koji je rekao: pričao nam je Ebu Nuajm, od Mukatila ibn Hajjana, od Ikrime, koji je rekao: \u003c/span>„Dok je Ibn Abbas jednoga dana sjedio, došao mu je neki čovjek i rekao: ‘Ibn Abbase, čuo sam čudnu stvar koju Ka‘b el-Habr govori o Suncu i Mjesecu.’“ Rekao je: „Ibn Abbas bio je naslonjen, pa se uspravio i rekao: ‘A šta je to?’ Odgovorio je: ‘Tvrdi da će Sunce i Mjesec na Kijametskom danu biti dovedeni poput dva bika presječenih tetiva, pa će biti bačeni u Džehennem.’“ Ikrima je rekao: „Od srdžbe je jedna strana Ibn Abbasa poletjela, a druga pala. Zatim je rekao: ‘Ka‘b je slagao! Ka‘b je slagao! Ka‘b je slagao!’ — tri puta. ‘Naprotiv, to je jevrejsko učenje koje želi unijeti u islam! Allah je uzvišeniji i plemenitiji od toga da kažnjava zbog pokornosti Njemu. Zar nisi čuo riječi Allaha, Blagoslovljenog i Uzvišenog: I potčinio vam je Sunce i Mjesec, koji neprestano teku? Time se misli na njihovu neprestanu pokornost. Kako bi kažnjavao dva roba koja hvali zato što neprestano ustrajavaju u pokornosti Njemu! Allah ubio ovog učenjaka i unakazio njegovo učeno zvanje! Kako je samo drzak prema Allahu i kako je velika njegova potvora protiv ova dva Allahu pokorna roba!’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Ibrahim, 14:33, navedeni dio. Napomena prevodioca: izraz طارت منه شقة ووقعت أخرى slikovito opisuje silnu srdžbu; doslovna slika sačuvana je u prijevodu.⟧\u003c/span>"},{"id":"65.4","ar":"قَالَ: ثُمَّ اسْتَرْجَعَ مِرَارًا، وَأَخَذَ عُوَيْدًا مِنَ الأَرْضِ، فَجَعَلَ يَنْكُتُهُ فِي الأَرْضِ، فَظَلَّ كَذَلِكَ مَا شَاءَ اللَّهُ، ثُمَّ انه رفع راسه، ورمى بالعويد [فقال: أَلا أُحَدِّثُكُمْ بِمَا سَمِعْتُ مِنْ رَسُولِ اللَّهِ ص، يَقُولُ فِي الشَّمْسِ وَالْقَمَرِ وَبَدْءِ خَلْقِهِمَا وَمَصِيرُ أَمْرِهِمَا؟ فَقُلْنَا: بَلَى رَحِمَكَ اللَّهُ!","bs":"Rekao je: „Zatim je više puta izgovorio: ‘Mi smo Allahovi i Njemu se vraćamo’, uzeo sa zemlje štapić i njime stao bockati zemlju. Ostao je tako koliko je Allah htio. Potom je podigao glavu, bacio štapić i rekao: ‘Hoćete li da vam ispričam šta sam čuo Allahovog Poslanika, sallallahu alejhi ve sellem, kako govori o Suncu i Mjesecu, početku njihovog stvaranja i ishodu njihovog stanja?’ Odgovorili smo: ‘Hoćemo, Allah ti se smilovao!’","ar_ranges":[],"ar_html":"قَالَ: ثُمَّ اسْتَرْجَعَ مِرَارًا، وَأَخَذَ عُوَيْدًا مِنَ الأَرْضِ، فَجَعَلَ يَنْكُتُهُ فِي الأَرْضِ، فَظَلَّ كَذَلِكَ مَا شَاءَ اللَّهُ، ثُمَّ انه رفع راسه، ورمى بالعويد [فقال: أَلا أُحَدِّثُكُمْ بِمَا سَمِعْتُ مِنْ رَسُولِ اللَّهِ ص، يَقُولُ فِي الشَّمْسِ وَالْقَمَرِ وَبَدْءِ خَلْقِهِمَا وَمَصِيرُ أَمْرِهِمَا؟ فَقُلْنَا: بَلَى رَحِمَكَ اللَّهُ!","bs_ranges":[],"bs_html":"Rekao je: „Zatim je više puta izgovorio: ‘Mi smo Allahovi i Njemu se vraćamo’, uzeo sa zemlje štapić i njime stao bockati zemlju. Ostao je tako koliko je Allah htio. Potom je podigao glavu, bacio štapić i rekao: ‘Hoćete li da vam ispričam šta sam čuo Allahovog Poslanika, sallallahu alejhi ve sellem, kako govori o Suncu i Mjesecu, početku njihovog stvaranja i ishodu njihovog stanja?’ Odgovorili smo: ‘Hoćemo, Allah ti se smilovao!’"},{"id":"65.5","ar":"فَقَالَ: إِنَّ رسول الله ص سُئِلَ عَنْ ذَلِكَ، فَقَالَ: إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى لَمَّا أَبْرَمَ خَلْقَهُ إِحْكَامًا فَلَمْ يَبْقَ مِنْ خَلْقِهِ غَيْرُ آدَمَ خَلَقَ شَمْسَيْنِ مِنْ نُورِ عَرْشِهِ، فَأَمَّا مَا كَانَ فِي سَابِقِ عِلْمِهِ أَنَّهُ يَدَعُهَا شَمْسًا، فَإِنَّهُ خَلَقَهَا مِثْلَ الدُّنْيَا مَا بَيْنَ مَشَارِقِهَا وَمَغَارِبِهَا،","bs":"Rekao je: ‘Allahov Poslanik, sallallahu alejhi ve sellem, upitan je o tome, pa je rekao: Kada je Allah, Blagoslovljen i Uzvišen, čvrsto uredio Svoje stvaranje, te od Njegovih stvorenja nije preostao niko osim Adema, stvorio je dva sunca od svjetlosti Svoga Arša. Ono za koje je u Svome prethodnom znanju znao da će ga ostaviti suncem stvorio je velikim poput ovoga svijeta, između njegovih istoka i zapada,","ar_ranges":[],"ar_html":"فَقَالَ: إِنَّ رسول الله ص سُئِلَ عَنْ ذَلِكَ، فَقَالَ: إِنَّ اللَّهَ تَبَارَكَ وَتَعَالَى لَمَّا أَبْرَمَ خَلْقَهُ إِحْكَامًا فَلَمْ يَبْقَ مِنْ خَلْقِهِ غَيْرُ آدَمَ خَلَقَ شَمْسَيْنِ مِنْ نُورِ عَرْشِهِ، فَأَمَّا مَا كَانَ فِي سَابِقِ عِلْمِهِ أَنَّهُ يَدَعُهَا شَمْسًا، فَإِنَّهُ خَلَقَهَا مِثْلَ الدُّنْيَا مَا بَيْنَ مَشَارِقِهَا وَمَغَارِبِهَا،","bs_ranges":[],"bs_html":"Rekao je: ‘Allahov Poslanik, sallallahu alejhi ve sellem, upitan je o tome, pa je rekao: Kada je Allah, Blagoslovljen i Uzvišen, čvrsto uredio Svoje stvaranje, te od Njegovih stvorenja nije preostao niko osim Adema, stvorio je dva sunca od svjetlosti Svoga Arša. Ono za koje je u Svome prethodnom znanju znao da će ga ostaviti suncem stvorio je velikim poput ovoga svijeta, između njegovih istoka i zapada,"}],"notes":[]},{"n":66,"ar":"وَأَمَّا مَا كَانَ فِي سَابِقِ عِلْمِهِ أَنَّهُ يَطْمِسُهَا وَيُحَوِّلُهَا قَمَرًا، فَإِنَّهُ دُونَ الشَّمْسِ فِي الْعِظَمِ، وَلَكِنْ إِنَّمَا يُرَى صِغَرُهُمَا مِنْ شِدَّةِ ارْتِفَاعِ السَّمَاءِ وَبُعْدِهَا مِنَ الأَرْضِ.\nقَالَ: فَلَوْ تَرَكَ اللَّهُ الشَّمْسَيْنِ كَمَا كَانَ خَلَقَهُمَا فِي بَدْءِ الأَمْرِ لَمْ يَكُنْ يُعْرَفُ اللَّيْلُ مِنَ النَّهَارِ، وَلا النَّهَارُ مِنَ اللَّيْلِ، وَكَانَ لا يَدْرِي الأَجِيرُ إِلَى مَتَى يَعْمَلُ، وَمَتَى يَأْخُذُ أَجْرَهُ وَلا يَدْرِي الصَّائِمُ إِلَى مَتَى يَصُومُ، وَلا تَدْرِي الْمَرْأَةُ كَيْفَ تَعْتَدُّ، وَلا يَدْرِي الْمُسْلِمُونَ مَتَى وَقْتُ الْحَجِّ، وَلا يَدْرِي الدُّيَّانُ مَتَى تَحِلُّ دُيُونُهُمْ، وَلا يَدْرِي النَّاسُ مَتَى يَنْصَرِفُونَ لِمَعَايِشِهِمْ، وَمَتَى يَسْكُنُونَ لِرَاحَةِ أَجْسَادِهِمْ.\nوَكَانَ الرَّبُّ عَزَّ وَجَلَّ أَنْظَرَ لِعِبَادِهِ وَأَرْحَمَ بِهِمْ، فأرسل جبرئيل ع فَأَمَرَ جِنَاحه على وجه القمر- وهو يومئذ شمس- ثلاث مرات، فطمس عنه الضوء، وبقي فيه النور، فذلك قوله عز وجل: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» قال: فالسواد الذي ترونه في القمر شبه الخطوط فيه فهو أثر المحو ثم خلق الله للشمس عجلة من ضوء نور العرش لها ثلاثمائة وستون عروه، ووكل بالشمس وعجلتها ثلاثمائة وستين ملكا من الملائكة من أهل السماء الدنيا، قد تعلق كل ملك منهم بعروة من تلك العرا، ووكل بالقمر وعجلته ثلاثمائة وستين ملكا من الملائكة من أهل السماء، قد تعلق بكل عروه من تلك العرا ملك منهم.\nثم قال: وخلق الله لهما مشارق ومغارب في قطري الأرض وكنفي السماء ثمانين ومائة عين في المغرب، طينة سوداء، فذلك قوله عز وجل: «وَجَدَها تَغْرُبُ فِي عَيْنٍ حَمِئَةٍ» انما يعنى حماه سوداء من طين، وثمانين ومائة عين في","bs":"\u003cp data-paragraph=\"66.1\">a ono za koje je u Svome prethodnom znanju znao da će mu izbrisati sjaj i pretvoriti ga u Mjesec manje je od Sunca. Međutim, njih dvoje izgledaju maleni zbog velike visine neba i njegove udaljenosti od Zemlje.’\u003c/p>\u003cp data-paragraph=\"66.2\">Rekao je: ‘Da je Allah ostavio ta dva sunca onakvima kakva ih je na početku stvorio, ne bi se razlikovali ni noć od dana ni dan od noći. Najamnik ne bi znao dokad radi i kada prima svoju nadnicu; postač ne bi znao dokad posti; žena ne bi znala kako računati iddet; muslimani ne bi znali kada je vrijeme hadža; povjerioci ne bi znali kada dospijevaju njihova potraživanja; ljudi ne bi znali kada da krenu za svojom opskrbom i kada da se umire radi odmora svojih tijela.\u003c/p>\u003cp data-paragraph=\"66.3\">Gospodar, Silan i Uzvišen, bolje je gledao na dobro Svojih robova i bio im milostiviji. Poslao je Džibrila, alejhis-selam, pa je on tri puta prevukao svojim krilom preko lica Mjeseca — a on je tada bio sunce — i izbrisao mu sjaj, dok mu je svjetlost ostala. To su riječi Njega, Silnog i Uzvišenog: I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi.’ Rekao je: ‘Crnilo koje na Mjesecu vidite poput crta trag je toga brisanja. Zatim je Allah za Sunce stvorio točak od sjaja svjetlosti Arša, s tristo šezdeset hvatišta. Za Sunce i njegov točak zadužio je tristo šezdeset meleka od stanovnika najbližeg neba. Svaki od njih uhvatio se za jedno od tih hvatišta. Za Mjesec i njegov točak zadužio je tristo šezdeset meleka od stanovnika neba; za svako hvatište uhvatio se jedan od njih.’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"66.4\">Zatim je rekao: ‘Allah im je stvorio istoke i zapade na krajevima Zemlje i stranama neba: stotinu osamdeset izvora na zapadu, crno blato. To su riječi Njega, Silnog i Uzvišenog: Našao ga je kako zalazi u izvoru muljevitom. Misli se na crni mulj od blata. I stotinu osamdeset izvora na \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:86, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"66.1","ar":"وَأَمَّا مَا كَانَ فِي سَابِقِ عِلْمِهِ أَنَّهُ يَطْمِسُهَا وَيُحَوِّلُهَا قَمَرًا، فَإِنَّهُ دُونَ الشَّمْسِ فِي الْعِظَمِ، وَلَكِنْ إِنَّمَا يُرَى صِغَرُهُمَا مِنْ شِدَّةِ ارْتِفَاعِ السَّمَاءِ وَبُعْدِهَا مِنَ الأَرْضِ.","bs":"a ono za koje je u Svome prethodnom znanju znao da će mu izbrisati sjaj i pretvoriti ga u Mjesec manje je od Sunca. Međutim, njih dvoje izgledaju maleni zbog velike visine neba i njegove udaljenosti od Zemlje.’","ar_ranges":[],"ar_html":"وَأَمَّا مَا كَانَ فِي سَابِقِ عِلْمِهِ أَنَّهُ يَطْمِسُهَا وَيُحَوِّلُهَا قَمَرًا، فَإِنَّهُ دُونَ الشَّمْسِ فِي الْعِظَمِ، وَلَكِنْ إِنَّمَا يُرَى صِغَرُهُمَا مِنْ شِدَّةِ ارْتِفَاعِ السَّمَاءِ وَبُعْدِهَا مِنَ الأَرْضِ.","bs_ranges":[],"bs_html":"a ono za koje je u Svome prethodnom znanju znao da će mu izbrisati sjaj i pretvoriti ga u Mjesec manje je od Sunca. Međutim, njih dvoje izgledaju maleni zbog velike visine neba i njegove udaljenosti od Zemlje.’"},{"id":"66.2","ar":"قَالَ: فَلَوْ تَرَكَ اللَّهُ الشَّمْسَيْنِ كَمَا كَانَ خَلَقَهُمَا فِي بَدْءِ الأَمْرِ لَمْ يَكُنْ يُعْرَفُ اللَّيْلُ مِنَ النَّهَارِ، وَلا النَّهَارُ مِنَ اللَّيْلِ، وَكَانَ لا يَدْرِي الأَجِيرُ إِلَى مَتَى يَعْمَلُ، وَمَتَى يَأْخُذُ أَجْرَهُ وَلا يَدْرِي الصَّائِمُ إِلَى مَتَى يَصُومُ، وَلا تَدْرِي الْمَرْأَةُ كَيْفَ تَعْتَدُّ، وَلا يَدْرِي الْمُسْلِمُونَ مَتَى وَقْتُ الْحَجِّ، وَلا يَدْرِي الدُّيَّانُ مَتَى تَحِلُّ دُيُونُهُمْ، وَلا يَدْرِي النَّاسُ مَتَى يَنْصَرِفُونَ لِمَعَايِشِهِمْ، وَمَتَى يَسْكُنُونَ لِرَاحَةِ أَجْسَادِهِمْ.","bs":"Rekao je: ‘Da je Allah ostavio ta dva sunca onakvima kakva ih je na početku stvorio, ne bi se razlikovali ni noć od dana ni dan od noći. Najamnik ne bi znao dokad radi i kada prima svoju nadnicu; postač ne bi znao dokad posti; žena ne bi znala kako računati iddet; muslimani ne bi znali kada je vrijeme hadža; povjerioci ne bi znali kada dospijevaju njihova potraživanja; ljudi ne bi znali kada da krenu za svojom opskrbom i kada da se umire radi odmora svojih tijela.","ar_ranges":[],"ar_html":"قَالَ: فَلَوْ تَرَكَ اللَّهُ الشَّمْسَيْنِ كَمَا كَانَ خَلَقَهُمَا فِي بَدْءِ الأَمْرِ لَمْ يَكُنْ يُعْرَفُ اللَّيْلُ مِنَ النَّهَارِ، وَلا النَّهَارُ مِنَ اللَّيْلِ، وَكَانَ لا يَدْرِي الأَجِيرُ إِلَى مَتَى يَعْمَلُ، وَمَتَى يَأْخُذُ أَجْرَهُ وَلا يَدْرِي الصَّائِمُ إِلَى مَتَى يَصُومُ، وَلا تَدْرِي الْمَرْأَةُ كَيْفَ تَعْتَدُّ، وَلا يَدْرِي الْمُسْلِمُونَ مَتَى وَقْتُ الْحَجِّ، وَلا يَدْرِي الدُّيَّانُ مَتَى تَحِلُّ دُيُونُهُمْ، وَلا يَدْرِي النَّاسُ مَتَى يَنْصَرِفُونَ لِمَعَايِشِهِمْ، وَمَتَى يَسْكُنُونَ لِرَاحَةِ أَجْسَادِهِمْ.","bs_ranges":[],"bs_html":"Rekao je: ‘Da je Allah ostavio ta dva sunca onakvima kakva ih je na početku stvorio, ne bi se razlikovali ni noć od dana ni dan od noći. Najamnik ne bi znao dokad radi i kada prima svoju nadnicu; postač ne bi znao dokad posti; žena ne bi znala kako računati iddet; muslimani ne bi znali kada je vrijeme hadža; povjerioci ne bi znali kada dospijevaju njihova potraživanja; ljudi ne bi znali kada da krenu za svojom opskrbom i kada da se umire radi odmora svojih tijela."},{"id":"66.3","ar":"وَكَانَ الرَّبُّ عَزَّ وَجَلَّ أَنْظَرَ لِعِبَادِهِ وَأَرْحَمَ بِهِمْ، فأرسل جبرئيل ع فَأَمَرَ جِنَاحه على وجه القمر- وهو يومئذ شمس- ثلاث مرات، فطمس عنه الضوء، وبقي فيه النور، فذلك قوله عز وجل: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» قال: فالسواد الذي ترونه في القمر شبه الخطوط فيه فهو أثر المحو ثم خلق الله للشمس عجلة من ضوء نور العرش لها ثلاثمائة وستون عروه، ووكل بالشمس وعجلتها ثلاثمائة وستين ملكا من الملائكة من أهل السماء الدنيا، قد تعلق كل ملك منهم بعروة من تلك العرا، ووكل بالقمر وعجلته ثلاثمائة وستين ملكا من الملائكة من أهل السماء، قد تعلق بكل عروه من تلك العرا ملك منهم.","bs":"Gospodar, Silan i Uzvišen, bolje je gledao na dobro Svojih robova i bio im milostiviji. Poslao je Džibrila, alejhis-selam, pa je on tri puta prevukao svojim krilom preko lica Mjeseca — a on je tada bio sunce — i izbrisao mu sjaj, dok mu je svjetlost ostala. To su riječi Njega, Silnog i Uzvišenog: I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi.’ Rekao je: ‘Crnilo koje na Mjesecu vidite poput crta trag je toga brisanja. Zatim je Allah za Sunce stvorio točak od sjaja svjetlosti Arša, s tristo šezdeset hvatišta. Za Sunce i njegov točak zadužio je tristo šezdeset meleka od stanovnika najbližeg neba. Svaki od njih uhvatio se za jedno od tih hvatišta. Za Mjesec i njegov točak zadužio je tristo šezdeset meleka od stanovnika neba; za svako hvatište uhvatio se jedan od njih.’ ⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧","ar_ranges":[],"ar_html":"وَكَانَ الرَّبُّ عَزَّ وَجَلَّ أَنْظَرَ لِعِبَادِهِ وَأَرْحَمَ بِهِمْ، فأرسل جبرئيل ع فَأَمَرَ جِنَاحه على وجه القمر- وهو يومئذ شمس- ثلاث مرات، فطمس عنه الضوء، وبقي فيه النور، فذلك قوله عز وجل: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» قال: فالسواد الذي ترونه في القمر شبه الخطوط فيه فهو أثر المحو ثم خلق الله للشمس عجلة من ضوء نور العرش لها ثلاثمائة وستون عروه، ووكل بالشمس وعجلتها ثلاثمائة وستين ملكا من الملائكة من أهل السماء الدنيا، قد تعلق كل ملك منهم بعروة من تلك العرا، ووكل بالقمر وعجلته ثلاثمائة وستين ملكا من الملائكة من أهل السماء، قد تعلق بكل عروه من تلك العرا ملك منهم.","bs_ranges":[],"bs_html":"Gospodar, Silan i Uzvišen, bolje je gledao na dobro Svojih robova i bio im milostiviji. Poslao je Džibrila, alejhis-selam, pa je on tri puta prevukao svojim krilom preko lica Mjeseca — a on je tada bio sunce — i izbrisao mu sjaj, dok mu je svjetlost ostala. To su riječi Njega, Silnog i Uzvišenog: I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi.’ Rekao je: ‘Crnilo koje na Mjesecu vidite poput crta trag je toga brisanja. Zatim je Allah za Sunce stvorio točak od sjaja svjetlosti Arša, s tristo šezdeset hvatišta. Za Sunce i njegov točak zadužio je tristo šezdeset meleka od stanovnika najbližeg neba. Svaki od njih uhvatio se za jedno od tih hvatišta. Za Mjesec i njegov točak zadužio je tristo šezdeset meleka od stanovnika neba; za svako hvatište uhvatio se jedan od njih.’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>"},{"id":"66.4","ar":"ثم قال: وخلق الله لهما مشارق ومغارب في قطري الأرض وكنفي السماء ثمانين ومائة عين في المغرب، طينة سوداء، فذلك قوله عز وجل: «وَجَدَها تَغْرُبُ فِي عَيْنٍ حَمِئَةٍ» انما يعنى حماه سوداء من طين، وثمانين ومائة عين في","bs":"Zatim je rekao: ‘Allah im je stvorio istoke i zapade na krajevima Zemlje i stranama neba: stotinu osamdeset izvora na zapadu, crno blato. To su riječi Njega, Silnog i Uzvišenog: Našao ga je kako zalazi u izvoru muljevitom. Misli se na crni mulj od blata. I stotinu osamdeset izvora na ⟦Prijevod kur’anskog navoda: El-Kehf, 18:86, navedeni dio.⟧","ar_ranges":[],"ar_html":"ثم قال: وخلق الله لهما مشارق ومغارب في قطري الأرض وكنفي السماء ثمانين ومائة عين في المغرب، طينة سوداء، فذلك قوله عز وجل: «وَجَدَها تَغْرُبُ فِي عَيْنٍ حَمِئَةٍ» انما يعنى حماه سوداء من طين، وثمانين ومائة عين في","bs_ranges":[],"bs_html":"Zatim je rekao: ‘Allah im je stvorio istoke i zapade na krajevima Zemlje i stranama neba: stotinu osamdeset izvora na zapadu, crno blato. To su riječi Njega, Silnog i Uzvišenog: Našao ga je kako zalazi u izvoru muljevitom. Misli se na crni mulj od blata. I stotinu osamdeset izvora na \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Kehf, 18:86, navedeni dio.⟧\u003c/span>"}],"notes":[]},{"n":67,"ar":"المشرق مثل ذلك طينة سوداء تفور غليا كغلي القدر إذا ما اشتد غليها قال:\nفكل يوم وكل ليله لها مطلع جديد ومغرب جديد، ما بين أولها مطلعا، وآخرها مغربا أطول ما يكون النهار في الصيف إلى آخرها مطلعا، وأولها مغربا أقصر ما يكون النهار في الشتاء، فذلك قوله تعالى: «رَبُّ الْمَشْرِقَيْنِ وَرَبُّ الْمَغْرِبَيْنِ» يعنى آخرها هاهنا وآخرها ثم، وترك ما بين ذلك من المشارق والمغارب، ثم جمعهما فقال: «بِرَبِّ الْمَشارِقِ وَالْمَغارِبِ» ، فذكر عدة تلك العيون كلها.\n\nقال: وخلق الله بحرا، فجرى دون السماء مقدار ثلاث فراسخ، وهو موج مكفوف قائم في الهواء بأمر الله عز وجل لا يقطر منه قطرة، والبحار كلها.\nساكنة، وذلك البحر جار في سرعة السهم ثم انطلاقه في الهواء مستويا، كأنه حبل ممدود ما بين المشرق والمغرب، فتجري الشمس والقمر والخنس في لجة غمر ذلك البحر، فذلك قوله تعالى: «كُلٌّ فِي فَلَكٍ يَسْبَحُونَ*» ، والفلك دوران العجلة في لجة غمر ذلك البحر والذي نفس محمد بيده، لو بدت الشمس من ذلك البحر لأحرقت كل شيء في الأرض، حتى الصخور والحجارة، ولو بدا القمر من ذلك لافتتن أهل الأرض حتى يعبدوه من دون الله، إلا من شاء الله أن يعصم من أوليائه.\nقال ابْنُ عَبَّاسٍ: فقال عَلِيّ بن أبي طالب رَضِيَ اللَّهُ عَنْهُ: بأبي أنت وأمي يا رسول الله! ذكرت مجرى الخنس مع الشمس والقمر، وقد أقسم الله بالخنس في القرآن إلى ما كان من ذكرك، فما الخنس؟ قال: يا علي، هن خمسة كواكب: البرجيس، وزحل، وعطارد، وبهرام، والزهرة،","bs":"\u003cp data-paragraph=\"67.1\">istoku, s istim takvim crnim blatom koje ključa poput lonca kada mu se ključanje pojača.’ Rekao je: ‘Za svaki dan i svaku noć postoji nov izlazak i nov zalazak: od prvog izvora izlaska i posljednjeg izvora zalaska, kada je dan ljeti najduži, do posljednjeg izvora izlaska i prvog izvora zalaska, kada je dan zimi najkraći. To su Njegove, Uzvišeni je On, riječi: Gospodar dvaju istoka i Gospodar dvaju zapada. Misli na posljednji ovdje i posljednji tamo, a izostavio je istoke i zapade između njih. Potom ih je sve obuhvatio riječima: Gospodarom istoka i zapada, pa je spomenuo broj svih tih izvora.’ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Er-Rahman, 55:17; El-Me‘aridž, 70:40, navedeni dio. U drugom navodu „istoka i zapada“ prenosi množinu arapskog izraza.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"67.2\">Rekao je: ‘Allah je stvorio more koje teče ispod neba na udaljenosti od tri fersaha. To je zadržan val koji Allahovom, Silan je i Uzvišen, naredbom stoji u zraku, a iz njega ne kapne ni kap. Sva su mora mirna, a to more teče brzinom strijele, zatim ravno prolazi kroz zrak, kao da je uže razapeto između istoka i zapada. Sunce, Mjesec i hunnes kreću se dubinom toga mora. To su Njegove, Uzvišeni je On, riječi: Svi u putanji plove. Felek je kruženje točka u dubini toga mora. Tako mi Onoga u čijoj je ruci Muhammedova duša, kada bi se Sunce pokazalo izvan toga mora, spalilo bi sve na Zemlji, čak i stijene i kamenje. A kada bi se Mjesec pokazao izvan njega, stanovnici Zemlje bili bi toliko opčinjeni da bi ga obožavali mimo Allaha, osim onih Svojih štićenika koje bi Allah htio sačuvati.’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: izraz كل في فلك يسبحون nalazi se u El-Enbija, 21:33, i Ja-Sin, 36:40. „Hunnes“ je naziv iz predaje, objašnjen u sljedećem dijalogu; „felek“ znači putanja ili nebeska orbita.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"67.3\">Ibn Abbas je rekao: „Ali ibn Ebu Talib, radijallahu anhu, rekao je: ‘Neka su mi otac i majka žrtva za tebe, Allahov Poslaniče! Spomenuo si kretanje hunnesa zajedno sa Suncem i Mjesecom, a Allah se hunnesom zakleo u Kur’anu, pored onoga što si spomenuo. Šta je hunnes?’ Odgovorio je: ‘Alija, to je pet nebeskih tijela: Birdžis, Zuhal, Utarid, Behram i Zuhra,\u003c/p>","paragraphs":[{"id":"67.1","ar":"المشرق مثل ذلك طينة سوداء تفور غليا كغلي القدر إذا ما اشتد غليها قال:\nفكل يوم وكل ليله لها مطلع جديد ومغرب جديد، ما بين أولها مطلعا، وآخرها مغربا أطول ما يكون النهار في الصيف إلى آخرها مطلعا، وأولها مغربا أقصر ما يكون النهار في الشتاء، فذلك قوله تعالى: «رَبُّ الْمَشْرِقَيْنِ وَرَبُّ الْمَغْرِبَيْنِ» يعنى آخرها هاهنا وآخرها ثم، وترك ما بين ذلك من المشارق والمغارب، ثم جمعهما فقال: «بِرَبِّ الْمَشارِقِ وَالْمَغارِبِ» ، فذكر عدة تلك العيون كلها.","bs":"istoku, s istim takvim crnim blatom koje ključa poput lonca kada mu se ključanje pojača.’ Rekao je: ‘Za svaki dan i svaku noć postoji nov izlazak i nov zalazak: od prvog izvora izlaska i posljednjeg izvora zalaska, kada je dan ljeti najduži, do posljednjeg izvora izlaska i prvog izvora zalaska, kada je dan zimi najkraći. To su Njegove, Uzvišeni je On, riječi: Gospodar dvaju istoka i Gospodar dvaju zapada. Misli na posljednji ovdje i posljednji tamo, a izostavio je istoke i zapade između njih. Potom ih je sve obuhvatio riječima: Gospodarom istoka i zapada, pa je spomenuo broj svih tih izvora.’ ⟦Prijevodi kur’anskih navoda: Er-Rahman, 55:17; El-Me‘aridž, 70:40, navedeni dio. U drugom navodu „istoka i zapada“ prenosi množinu arapskog izraza.⟧","ar_ranges":[],"ar_html":"المشرق مثل ذلك طينة سوداء تفور غليا كغلي القدر إذا ما اشتد غليها قال:\nفكل يوم وكل ليله لها مطلع جديد ومغرب جديد، ما بين أولها مطلعا، وآخرها مغربا أطول ما يكون النهار في الصيف إلى آخرها مطلعا، وأولها مغربا أقصر ما يكون النهار في الشتاء، فذلك قوله تعالى: «رَبُّ الْمَشْرِقَيْنِ وَرَبُّ الْمَغْرِبَيْنِ» يعنى آخرها هاهنا وآخرها ثم، وترك ما بين ذلك من المشارق والمغارب، ثم جمعهما فقال: «بِرَبِّ الْمَشارِقِ وَالْمَغارِبِ» ، فذكر عدة تلك العيون كلها.","bs_ranges":[],"bs_html":"istoku, s istim takvim crnim blatom koje ključa poput lonca kada mu se ključanje pojača.’ Rekao je: ‘Za svaki dan i svaku noć postoji nov izlazak i nov zalazak: od prvog izvora izlaska i posljednjeg izvora zalaska, kada je dan ljeti najduži, do posljednjeg izvora izlaska i prvog izvora zalaska, kada je dan zimi najkraći. To su Njegove, Uzvišeni je On, riječi: Gospodar dvaju istoka i Gospodar dvaju zapada. Misli na posljednji ovdje i posljednji tamo, a izostavio je istoke i zapade između njih. Potom ih je sve obuhvatio riječima: Gospodarom istoka i zapada, pa je spomenuo broj svih tih izvora.’ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: Er-Rahman, 55:17; El-Me‘aridž, 70:40, navedeni dio. U drugom navodu „istoka i zapada“ prenosi množinu arapskog izraza.⟧\u003c/span>"},{"id":"67.2","ar":"قال: وخلق الله بحرا، فجرى دون السماء مقدار ثلاث فراسخ، وهو موج مكفوف قائم في الهواء بأمر الله عز وجل لا يقطر منه قطرة، والبحار كلها.\nساكنة، وذلك البحر جار في سرعة السهم ثم انطلاقه في الهواء مستويا، كأنه حبل ممدود ما بين المشرق والمغرب، فتجري الشمس والقمر والخنس في لجة غمر ذلك البحر، فذلك قوله تعالى: «كُلٌّ فِي فَلَكٍ يَسْبَحُونَ*» ، والفلك دوران العجلة في لجة غمر ذلك البحر والذي نفس محمد بيده، لو بدت الشمس من ذلك البحر لأحرقت كل شيء في الأرض، حتى الصخور والحجارة، ولو بدا القمر من ذلك لافتتن أهل الأرض حتى يعبدوه من دون الله، إلا من شاء الله أن يعصم من أوليائه.","bs":"Rekao je: ‘Allah je stvorio more koje teče ispod neba na udaljenosti od tri fersaha. To je zadržan val koji Allahovom, Silan je i Uzvišen, naredbom stoji u zraku, a iz njega ne kapne ni kap. Sva su mora mirna, a to more teče brzinom strijele, zatim ravno prolazi kroz zrak, kao da je uže razapeto između istoka i zapada. Sunce, Mjesec i hunnes kreću se dubinom toga mora. To su Njegove, Uzvišeni je On, riječi: Svi u putanji plove. Felek je kruženje točka u dubini toga mora. Tako mi Onoga u čijoj je ruci Muhammedova duša, kada bi se Sunce pokazalo izvan toga mora, spalilo bi sve na Zemlji, čak i stijene i kamenje. A kada bi se Mjesec pokazao izvan njega, stanovnici Zemlje bili bi toliko opčinjeni da bi ga obožavali mimo Allaha, osim onih Svojih štićenika koje bi Allah htio sačuvati.’ ⟦Prijevod kur’anskog navoda: izraz كل في فلك يسبحون nalazi se u El-Enbija, 21:33, i Ja-Sin, 36:40. „Hunnes“ je naziv iz predaje, objašnjen u sljedećem dijalogu; „felek“ znači putanja ili nebeska orbita.⟧","ar_ranges":[],"ar_html":"قال: وخلق الله بحرا، فجرى دون السماء مقدار ثلاث فراسخ، وهو موج مكفوف قائم في الهواء بأمر الله عز وجل لا يقطر منه قطرة، والبحار كلها.\nساكنة، وذلك البحر جار في سرعة السهم ثم انطلاقه في الهواء مستويا، كأنه حبل ممدود ما بين المشرق والمغرب، فتجري الشمس والقمر والخنس في لجة غمر ذلك البحر، فذلك قوله تعالى: «كُلٌّ فِي فَلَكٍ يَسْبَحُونَ*» ، والفلك دوران العجلة في لجة غمر ذلك البحر والذي نفس محمد بيده، لو بدت الشمس من ذلك البحر لأحرقت كل شيء في الأرض، حتى الصخور والحجارة، ولو بدا القمر من ذلك لافتتن أهل الأرض حتى يعبدوه من دون الله، إلا من شاء الله أن يعصم من أوليائه.","bs_ranges":[],"bs_html":"Rekao je: ‘Allah je stvorio more koje teče ispod neba na udaljenosti od tri fersaha. To je zadržan val koji Allahovom, Silan je i Uzvišen, naredbom stoji u zraku, a iz njega ne kapne ni kap. Sva su mora mirna, a to more teče brzinom strijele, zatim ravno prolazi kroz zrak, kao da je uže razapeto između istoka i zapada. Sunce, Mjesec i hunnes kreću se dubinom toga mora. To su Njegove, Uzvišeni je On, riječi: Svi u putanji plove. Felek je kruženje točka u dubini toga mora. Tako mi Onoga u čijoj je ruci Muhammedova duša, kada bi se Sunce pokazalo izvan toga mora, spalilo bi sve na Zemlji, čak i stijene i kamenje. A kada bi se Mjesec pokazao izvan njega, stanovnici Zemlje bili bi toliko opčinjeni da bi ga obožavali mimo Allaha, osim onih Svojih štićenika koje bi Allah htio sačuvati.’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: izraz كل في فلك يسبحون nalazi se u El-Enbija, 21:33, i Ja-Sin, 36:40. „Hunnes“ je naziv iz predaje, objašnjen u sljedećem dijalogu; „felek“ znači putanja ili nebeska orbita.⟧\u003c/span>"},{"id":"67.3","ar":"قال ابْنُ عَبَّاسٍ: فقال عَلِيّ بن أبي طالب رَضِيَ اللَّهُ عَنْهُ: بأبي أنت وأمي يا رسول الله! ذكرت مجرى الخنس مع الشمس والقمر، وقد أقسم الله بالخنس في القرآن إلى ما كان من ذكرك، فما الخنس؟ قال: يا علي، هن خمسة كواكب: البرجيس، وزحل، وعطارد، وبهرام، والزهرة،","bs":"Ibn Abbas je rekao: „Ali ibn Ebu Talib, radijallahu anhu, rekao je: ‘Neka su mi otac i majka žrtva za tebe, Allahov Poslaniče! Spomenuo si kretanje hunnesa zajedno sa Suncem i Mjesecom, a Allah se hunnesom zakleo u Kur’anu, pored onoga što si spomenuo. Šta je hunnes?’ Odgovorio je: ‘Alija, to je pet nebeskih tijela: Birdžis, Zuhal, Utarid, Behram i Zuhra,","ar_ranges":[],"ar_html":"قال ابْنُ عَبَّاسٍ: فقال عَلِيّ بن أبي طالب رَضِيَ اللَّهُ عَنْهُ: بأبي أنت وأمي يا رسول الله! ذكرت مجرى الخنس مع الشمس والقمر، وقد أقسم الله بالخنس في القرآن إلى ما كان من ذكرك، فما الخنس؟ قال: يا علي، هن خمسة كواكب: البرجيس، وزحل، وعطارد، وبهرام، والزهرة،","bs_ranges":[],"bs_html":"Ibn Abbas je rekao: „Ali ibn Ebu Talib, radijallahu anhu, rekao je: ‘Neka su mi otac i majka žrtva za tebe, Allahov Poslaniče! Spomenuo si kretanje hunnesa zajedno sa Suncem i Mjesecom, a Allah se hunnesom zakleo u Kur’anu, pored onoga što si spomenuo. Šta je hunnes?’ Odgovorio je: ‘Alija, to je pet nebeskih tijela: Birdžis, Zuhal, Utarid, Behram i Zuhra,"}],"notes":[]},{"n":68,"ar":"فهذه الكواكب الخمسة الطالعات الجاريات، مثل الشمس والقمر، العاديات معهما، فأما سائر الكواكب فمعلقات من السماء كتعليق القناديل من المساجد، وهي تحوم مع السماء دورانا بالتسبيح والتقديس والصلاة لله، ثم قال النبي ص: فإن أحببتم أن تستبينوا ذلك، فانظروا إلى دوران الفلك مره هاهنا ومره هاهنا، فذلك دوران السماء، ودوران الكواكب معها كلها سوى هذه الخمسة، ودورانها اليوم كما ترون، وتلك صلاتها، ودورانها إلى يوم القيامة في سرعة دوران الرحا من أهوال يوم القيامة وزلازله، فذلك قوله عز وجل: «ْمَ تَمُورُ السَّماءُ مَوْراً وَتَسِيرُ الْجِبالُ سَيْراً.\nفَوَيْلٌ يَوْمَئِذٍ لِلْمُكَذِّبِينَ» .\nقال: فإذا طلعت الشمس فإنها تطلع من بعض تلك العيون على عجلتها ومعها ثلاثمائة وستون ملكا ناشري أجنحتهم، يجرونها في الفلك بالتسبيح والتقديس والصلاة لله على قدر ساعات الليل وساعات النهار ليلا كان أو نهارا، فإذا أحب الله أن يبتلي الشمس والقمر فيري العباد آية من الآيات فيستعتبهم رجوعا عن معصيته وإقبالا على طاعته، خرت الشمس من العجلة فتقع في غمر ذلك البحر وهو الفلك، فإذا أحب الله أن يعظم الآية ويشدد تخويف العباد وقعت الشمس كلها فلا يبقى منها على العجلة شيء، فذلك حين يظلم النهار وتبدو النجوم، وهو المنتهى من كسوفها فإذا أراد أن يجعل آية دون آية وقع منها النصف أو الثلث أو الثلثان في الماء، ويبقى سائر ذلك على العجلة، فهو كسوف دون كسوف، وبلاء للشمس أو للقمر، وتخويف للعباد، واستعتاب من الرب عز وجل، فأي ذلك كان صارت الملائكة الموكلون بعجلتها فرقتين: فرقة منها يقبلون على الشمس فيجرونها نحو العجلة، والفرقة الأخرى","bs":"\u003cp data-paragraph=\"68.1\">to je tih pet nebeskih tijela koja izlaze i teku poput Sunca i Mjeseca i zajedno s njima se kreću. Ostala nebeska tijela obješena su o nebo kao što se svjetiljke vješaju u džamijama. Ona kruže zajedno s nebom slaveći, posvećujući i moleći se Allahu.’ Zatim je Vjerovjesnik, sallallahu alejhi ve sellem, rekao: ‘Ako želite da vam to bude jasno, pogledajte kruženje nebeske putanje, jednom ovamo, a drugi put onamo. To je kruženje neba i kruženje s njim svih nebeskih tijela osim ovih pet. Njihovo je današnje kruženje onakvo kakvo vidite i to je njihova molitva. Njihovo kruženje do Kijametskog dana brzo je poput okretanja mlinskog kamena, zbog strahota Kijametskog dana i njegovih potresa. To su riječi Njega, Silnog i Uzvišenog: [Na dan] kada se nebo silno uskomeša i planine se pokrenu. Teško tada poricateljima!’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Et-Tur, 52:9–11. Izraz إلى يوم القيامة doslovno je prenesen kao „do Kijametskog dana“; vremenski odnos u rečenici nije sasvim jasan. Početak arapskog navoda u izvoru oštećen je i glasi ْمَ تَمُورُ; dopunjeno „Na dan“ označeno je uglastim zagradama prema tekstu ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"68.2\">Rekao je: ‘Kada Sunce izlazi, ono izlazi iz jednog od tih izvora na svome točku. Uz njega je tristo šezdeset meleka raširenih krila, koji ga vuku po nebeskoj putanji slaveći, posvećujući i moleći se Allahu, prema broju sati noći i sati dana, bilo noću ili danju. Kada Allah htjedne iskušati Sunce i Mjesec, pokazati robovima jedan od znakova i pozvati ih da se vrate od nepokornosti Njemu i okrenu se pokornosti, Sunce pada s točka u dubinu toga mora, a to je felek. Kada Allah želi taj znak učiniti velikim i jače zastrašiti robove, cijelo Sunce padne, pa na točku od njega ne ostane ništa. Tada dan potamni i pokažu se zvijezde; to je krajnji stepen njegove pomrčine. Ako želi pokazati manji znak, u vodu padne polovina, trećina ili dvije trećine Sunca, dok mu ostatak ostaje na točku. To je manja pomrčina od druge pomrčine, iskušenje Sunca ili Mjeseca, zastrašivanje robova i Gospodarev, Silan je i Uzvišen, poziv na povratak. Šta god od toga bilo, meleki zaduženi za njegov točak podijele se u dvije skupine. Jedna se okreće Suncu i vuče ga prema točku, a druga\u003c/p>","paragraphs":[{"id":"68.1","ar":"فهذه الكواكب الخمسة الطالعات الجاريات، مثل الشمس والقمر، العاديات معهما، فأما سائر الكواكب فمعلقات من السماء كتعليق القناديل من المساجد، وهي تحوم مع السماء دورانا بالتسبيح والتقديس والصلاة لله، ثم قال النبي ص: فإن أحببتم أن تستبينوا ذلك، فانظروا إلى دوران الفلك مره هاهنا ومره هاهنا، فذلك دوران السماء، ودوران الكواك  izvora na svome točku. Uz njega je tristo šezdeset meleka raširenih krila, koji ga vuku po nebeskoj putanji slaveći, posvećujući i moleći se Allahu, prema broju sati noći i sati dana, bilo noću ili danju. Kada Allah htjedne iskušati Sunce i Mjesec, pokazati robovima jedan od znakova i pozvati ih da se vrate od nepokornosti Njemu i okrenu se pokornosti, Sunce pada s točka u dubinu toga mora, a to je felek. Kada Allah želi taj znak učiniti velikim i jače zastrašiti robove, cijelo Sunce padne, pa na točku od njega ne ostane ništa. Tada dan potamni i pokažu se zvijezde; to je krajnji stepen njegove pomrčine. Ako želi pokazati manji znak, u vodu padne polovina, trećina ili dvije trećine Sunca, dok mu ostatak ostaje na točku. To je manja pomrčina od druge pomrčine, iskušenje Sunca ili Mjeseca, zastrašivanje robova i Gospodarev, Silan je i Uzvišen, poziv na povratak. Šta god od toga bilo, meleki zaduženi za njegov točak podijele se u dvije skupine. Jedna se okreće Suncu i vuče ga prema točku, a druga"}],"notes":[]},{"n":69,"ar":"يقبلون على العجلة فيجرونها نحو الشمس، وهم في ذلك يقرونها في الفلك بالتسبيح والتقديس والصلاة لله على قدر ساعات النهار أو ساعات الليل، ليلا كان أو نهارا، في الصيف كان ذلك أو في الشتاء، أو ما بين ذلك في الخريف والربيع، لكيلا يزيد في طولهما شيء، ولكن قد ألهمهم الله علم ذلك، وجعل لهم تلك القوة، والذي ترون من خروج الشمس أو القمر بعد الكسوف قليلا قليلا، من غمر ذلك البحر الذي يعلوهما، فإذا أخرجوها كلها اجتمعت الملائكة كلهم، فاحتملوها حتى يضعوها على العجلة، فيحمدون الله على ما قواهم لذلك، ويتعلقون بعرا العجلة، ويجرونها في الفلك بالتسبيح والتقديس والصلاة لله حتى يبلغوا بها المغرب، فإذا بلغوا بها المغرب أدخلوها تلك العين، فتسقط من أفق السماء في العين.\nثم قال النبي ص، وعجب من خلق الله: وللعجب من القدرة فيما لم نر أعجب من ذلك، وذلك قول جبرئيل ع لساره:\n\n«أَتَعْجَبِينَ مِنْ أَمْرِ اللَّهِ» وذلك أن الله عز وجل خلق مدينتين: إحداهما بالمشرق والأخرى بالمغرب، أهل المدينة التي بالمشرق من بقايا عاد من نسل مؤمنيهم، وأهل التي بالمغرب من بقايا ثمود من نسل الذين آمنوا بصالح، اسم التي بالمشرق بالسريانية مرقيسيا وبالعربية جابلق واسم التي بالمغرب بالسريانية برجيسيا وبالعربية جابرس ولكل مدينة منهما عشرة آلاف باب، ما بين","bs":"\u003cp data-paragraph=\"69.1\">se okreće točku i vuče ga prema Suncu. Pritom ga održavaju na nebeskoj putanji slaveći, posvećujući i moleći se Allahu, prema broju sati dana ili sati noći, bilo noću ili danju, ljeti, zimi ili između toga ujesen i u proljeće, kako se njihovoj dužini ne bi ništa dodalo. Allah ih je, međutim, nadahnuo znanjem o tome i dao im tu snagu. Ono što vidite od postepenog pojavljivanja Sunca ili Mjeseca nakon pomrčine izlazak je iz dubine toga mora koje ih prekriva. Kada ga potpuno izvuku, svi se meleki okupe i ponesu ga dok ga ne postave na točak. Hvale Allaha što im je dao snagu za to, hvataju se za hvatišta točka i vuku ga po nebeskoj putanji slaveći, posvećujući i moleći se Allahu, dok ga ne dovedu do zapada. Kada ga dovedu do zapada, uvedu ga u taj izvor, pa ono s nebeskog obzorja pada u izvor.’\u003c/p>\u003cp data-paragraph=\"69.2\">Zatim je Vjerovjesnik, sallallahu alejhi ve sellem, rekao, čudeći se Allahovom stvaranju: ‘Još je čudesnija moć u onome što nismo vidjeli. To su Džibrilove, alejhis-selam, riječi upućene Sari: Zar se čudiš Allahovoj naredbi? Allah, Silan i Uzvišen, stvorio je dva grada: jedan na istoku, a drugi na zapadu. Stanovnici istočnog grada ostaci su Ada, potomci njihovih vjernika, a stanovnici zapadnog grada ostaci su Semuda, potomci onih koji su vjerovali Salihu. Ime istočnog grada na sirjačkom je Markisija, a na arapskom Džabulak. Ime zapadnog grada na sirjačkom je Birdžisija, a na arapskom Džaburas. Svaki od ta dva grada ima deset hiljada vrata. Između \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Hud, 11:73, navedeni dio. Imena gradova prenesena su prema arapskom zapisu مرقيسيا، جابلق، برجيسيا، جابرس; izgovor nije potpuno označen u izvoru.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"69.1","ar":"يقبلون على العجلة فيجرونها نحو الشمس، وهم في ذ وج.\nوان جبرئيل ع انطلق بي اليهم ليله اسرى بي من المسجد الحرام إلى المسجد الأقصى، فدعوت يأجوج ومأجوج إلى عبادة الله عز وجل فأبوا أن يجيبوني، ثم انطلق بي إلى أهل المدينتين، فدعوتهم إلى دين الله عز وجل والى عبادته فأجابوا وأنابوا، فهم في الدين إخواننا، من أحسن منهم فهو مع محسنكم، ومن أساء منهم فأولئك مع المسيئين منكم ثم انطلق بي إلى الأمم الثلاث، فدعوتهم إلى دين الله وإلى عبادته فأنكروا ما دعوتهم إليه، فكفروا بالله عز وجل وكذبوا رسله، فهم مع يأجوج ومأجوج وسائر من عصى الله في النار، فإذا ما غربت الشمس رفع بها من سماء إلى سماء في سرعة طيران الملائكة، حتى يبلغ بها إلى السماء السابعة العليا، حتى تكون تحت العرش فتخر ساجده، وتسجد معها الملائكة الموكلون بها، فيحدر بها من سماء إلى سماء، فإذا وصلت إلى هذه السماء فذلك حين ينفجر الفجر، فإذا انحدرت من بعض تلك العيون، فذاك حين يضيء الصبح، فإذا وصلت إلى هذا الوجه من السماء فذاك حين يضيء النهار.\nقال: وجعل الله عند المشرق حجابا من الظلمة على البحر السابع، مقدار","bs":"\u003cp data-paragraph=\"70.1\">svakih dvojih vrata je fersah. Svakoga dana na svakim vratima tih dvaju gradova smjenjuje se po deset hiljada naoružanih stražara. Poslije toga njihova stražarska smjena više ne dolazi sve do dana kada se puhne u rog. Tako mi Onoga u čijoj je ruci Muhammedova duša, da nema mnoštva tih ljudi i buke njihovih glasova, svi ljudi svijeta čuli bi tutnjavu pada Sunca pri njegovom izlasku i zalasku. Iza njih su tri naroda: Mensek, Tafil i Taris, a ispred njih Jedžudž i Medžudž. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: imena triju naroda u izvoru su منسك، تافيل، تاريس, bez potpunih oznaka za izgovor; transliteracija je nesigurna.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"70.2\">Džibril, alejhis-selam, odveo me njima u noći kada sam prenesen iz Mesdžidul-harama u Mesdžidul-aksa. Pozvao sam Jedžudža i Medžudža da obožavaju Allaha, Silnog i Uzvišenog, ali su odbili odazvati mi se. Zatim me odveo stanovnicima dvaju gradova. Pozvao sam ih Allahovoj, Silan je i Uzvišen, vjeri i obožavanju Njega. Odazvali su se i pokajnički Mu se okrenuli. Oni su naša braća u vjeri: ko od njih čini dobro s vašim je dobročiniteljima, a ko od njih čini zlo s vašim je zločiniteljima. Zatim me odveo trima narodima. Pozvao sam ih Allahovoj vjeri i obožavanju Njega, ali su odbacili ono čemu sam ih pozvao: nisu povjerovali u Allaha, Silnog i Uzvišenog, i poricali su Njegove poslanike. Zato su oni s Jedžudžom i Medžudžom i svim ostalim nepokornima Allahu u Vatri. Kada Sunce zađe, podiže se s jednog neba na drugo brzinom leta meleka, dok ne stigne do najvišeg, sedmog neba i ne bude ispod Arša. Tada pada na sedždu, a s njim sedždu čine meleki zaduženi za njega. Potom se spušta s jednog neba na drugo. Kada stigne do ovoga neba, tada izbija zora. Kada se spusti iz jednog od tih izvora, tada zasja jutro. Kada stigne na ovu stranu neba, tada zasja dan.\u003c/p>\u003cp data-paragraph=\"70.3\">Rekao je: ‘Allah je na istoku, na sedmom moru, postavio zastor tame, veličine\u003c/p>","paragraphs":[{"id":"70.1","ar":"كل بابين فرسخ، ينوب كل يوم على كل باب من أبواب هاتين المدينتين عشرة آلاف رجل من الحراسة، عليهم السلاح، لا تنوبهم الحراسة بعد ذلك إلى يوم ينفخ في الصور، فو الذى نفس محمد بيده، لولا كثرة هؤلاء القوم وضجيج أصواتهم لسمع الناس من جميع أهل الدنيا هدة وقعة الشمس حين تطلع وحين تغرب، ومن ورائهم ثلاث أمم: منسك، وتافيل، وتاريس، ومن دونهم يأجوج وماجوج.","bs":"svakih dvojih vrata je fersah. Svakoga dana na svakim vratima tih dvaju gradova smjenjuje se po deset hiljada naoružanih stražara. Poslije toga njihova stražarska smjena više ne dolazi sve do dana kada se puhne u rog. Tako mi Onoga u čijoj je ruci Muhammedova duša, da nema mnoštva tih ljudi i buke njihovih glasova, svi ljudi svijeta čuli bi tutnjavu pada Sunca pri njegovom izlasku i zalasku. Iza njih su tri naroda: Mensek, Tafil i Taris, a ispred njih Jedžudž i Medžudž. ⟦Napomena prevodioca: imena triju naroda u izvoru su منسك، تافيل، تاريس, bez potpunih oznaka za izgovor; transliteracija je nesigurna.⟧","ar_ranges":[],"ar_html":"كل بابين فرسخ، ينوب كل يوم على كل باب من أبو . Pozvao sam Jedžudža i Medžudža da obožavaju Allaha, Silnog i Uzvišenog, ali su odbili odazvati mi se. Zatim me odveo stanovnicima dvaju gradova. Pozvao sam ih Allahovoj, Silan je i Uzvišen, vjeri i obožavanju Njega. Odazvali su se i pokajnički Mu se okrenuli. Oni su naša braća u vjeri: ko od njih čini dobro s vašim je dobročiniteljima, a ko od njih čini zlo s vašim je zločiniteljima. Zatim me odveo trima narodima. Pozvao sam ih Allahovoj vjeri i obožavanju Njega, ali su odbacili ono čemu sam ih pozvao: nisu povjerovali u Allaha, Silnog i Uzvišenog, i poricali su Njegove poslanike. Zato su oni s Jedžudžom i Medžudžom i svim ostalim nepokornima Allahu u Vatri. Kada Sunce zađe, podiže se s jednog neba na drugo brzinom leta meleka, dok ne stigne do najvišeg, sedmog neba i ne bude ispod Arša. Tada pada na sedždu, a s njim sedždu čine meleki zaduženi za njega. Potom se spušta s jednog neba na drugo. Kada stigne do ovoga neba, tada izbija zora. Kada se spusti iz jednog od tih izvora, tada zasja jutro. Kada stigne na ovu stranu neba, tada zasja dan."},{"id":"70.3","ar":"قال: وجعل الله عند المشرق حجابا من الظلمة على البحر السابع، مقدار","bs":"Rekao je: ‘Allah je na istoku, na sedmom moru, postavio zastor tame, veličine","ar_ranges":[],"ar_html":"قال: وجعل الله عند المشرق حجابا من الظلمة على البحر السابع، مقدار","bs_ranges":[],"bs_html":"Rekao je: ‘Allah je na istoku, na sedmom moru, postavio zastor tame, veličine"}],"notes":[]},{"n":71,"ar":"عدة الليالي منذ يوم خلق الله الدنيا إلى يوم تصرم، فإذا كان عند الغروب أقبل ملك قد وكل بالليل فيقبض قبضة من ظلمة ذلك الحجاب، ثم يستقبل المغرب، فلا يزال يرسل من الظلمة من خلل اصابته قليلا قليلا وهو يراعي الشفق، فإذا غاب الشفق أرسل الظلمة كلها ثم ينشر جناحيه، فيبلغان قطري الأرض وكنفي السماء، ويجاوزان ما شاء الله عز وجل خارجا في الهواء، فيسوق ظلمة الليل بجناحيه بالتسبيح والتقديس والصلاة لله حتى يبلغ المغرب، فإذا بلغ المغرب انفجر الصبح من المشرق، فضم جناحيه، ثم يضم الظلمة بعضها إلى بعض بكفيه، ثم يقبض عليها بكف واحدة نحو قبضته إذا تناولها من الحجاب بالمشرق، فيضعها عند المغرب على البحر السابع من هناك ظلمة الليل فإذا ما نقل ذلك الحجاب من المشرق إلى المغرب نفخ في الصور، وانقضت الدنيا، فضوء النهار من قبل المشرق، وظلمة الليل من قبل ذلك الحجاب، فلا تزال الشمس والقمر كذلك من مطالعهما إلى مغاربهما إلى ارتفاعهما، إلى السماء السابعة العليا، إلى محبسهما تحت العرش، حتى يأتي الوقت الذي ضرب الله لتوبة العباد، فتكثر المعاصي في الأرض ويذهب المعروف، فلا يأمر به أحد، ويفشو المنكر فلا ينهى عنه أحد.\nفإذا كان ذلك حبست الشمس مقدار ليلة تحت العرش، فكلما سجدت واستأذنت: من أين تطلع؟ لم يحر إليها جواب، حتى يوافيها القمر ويسجد معها، ويستأذن: من أين يطلع؟ فلا يحار إليه جواب، حتى يحبسهما مقدار ثلاث ليال للشمس، وليلتين للقمر، فلا يعرف طول تلك الليلة إلا المتهجدون في الأرض، وهم حينئذ عصابة قليلة في كل بلدة من بلاد المسلمين، في هو ان من الناس وذلة من أنفسهم، فينام أحدهم تلك الليلة قدر ما كان ينام قبلها من الليالي، ثم يقوم فيتوضأ ويدخل مصلاه فيصلي ورده، كما كان يصلي","bs":"\u003cp data-paragraph=\"71.1\">broja noći od dana kada je Allah stvorio ovaj svijet do dana njegova završetka. Kada se približi zalazak, dolazi melek zadužen za noć, zahvati pregršt tame iz toga zastora i okrene se prema zapadu. Stalno, malo-pomalo, propušta tamu između svojih prstiju, prateći večernji sumrak. Kada sumrak nestane, pušta svu tamu, zatim širi svoja krila, pa ona dosegnu krajeve Zemlje i strane neba i izlaze dalje u zračni prostor koliko Allah, Silan i Uzvišen, htjedne. Svojim krilima goni noćnu tamu, slaveći, posvećujući i moleći se Allahu, sve dok ne stigne do zapada. Kada stigne do zapada, na istoku izbije jutro. Tada skupi krila, zatim dlanovima sabira tamu, jednu uz drugu, pa je stisne u jedan dlan, poput pregršti koju je uzeo iz zastora na istoku. Ostavi je na zapadu, na sedmom moru. Odatle je noćna tama. Kada se taj zastor prenese s istoka na zapad, puhnut će se u rog i ovaj svijet će se završiti. Svjetlost dana dolazi s istoka, a noćna tama od toga zastora. Sunce i Mjesec neprestano tako prolaze od svojih izlazaka do svojih zalazaka, pa do svoga uzdizanja do najvišeg, sedmog neba i do zadržavanja ispod Arša, sve dok ne dođe vrijeme koje je Allah odredio za pokajanje robova. Tada će na Zemlji biti mnogo grijeha, nestat će dobro i niko ga neće naređivati, a zlo će se raširiti i niko ga neće zabranjivati. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u izrazu من خلل اصابته izvor ima اصابته, što u ovom kontekstu izgleda kao greška umjesto أصابعه („njegovi prsti“). Predloženo čitanje označeno je ovdje; arapski izvornik nije mijenjan.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"71.2\">Kada se to dogodi, Sunce će biti zadržano ispod Arša koliko traje jedna noć. Kad god učini sedždu i zatraži dopuštenje odakle da izađe, neće mu se odgovoriti, sve dok mu ne dođe Mjesec i s njim učini sedždu. I on će tražiti dopuštenje odakle da izađe, ali mu se neće odgovoriti, sve dok ih ne zadrži koliko traju tri noći za Sunce i dvije noći za Mjesec. Dužinu te noći prepoznat će samo oni koji na Zemlji klanjaju noću. Tada će ih biti malo u svakom muslimanskom mjestu; ljudi će ih omalovažavati, a oni će biti skromni u sebi. Jedan od njih spavat će te noći koliko je spavao i prethodnih noći, zatim će ustati, uzeti abdest, ući na mjesto gdje klanja i klanjati svoj uobičajeni dio noćnog namaza, kao što je klanjao\u003c/p>","paragraphs":[{"id":"71.1","ar":"عدة الليالي منذ يوم خلق الله الدنيا إلى يوم تصرم، فإذا كان عند الغروب أقبل ملك قد وكل بالليل فيقبض قبضة من ظلمة ذلك الحجاب، ثم يستقبل المغرب، فلا يزال يرسل من الظلمة من خلل اصابته قليلا قليلا وهو يراعي الشفق، فإذا غاب الشفق أرسل الظلمة كلها ثم ينشر جناحيه، فيبلغان قطري الأرض وكنفي السماء، ويجاوزان ما شاء الله عز وجل خارجا في الهواء، فيسوق ظلمة الليل بجناحيه بالتسبيح والتقديس والصلاة لله حتى يبلغ المغرب، فإذا بلغ المغرب انفجر الصبح من المشرق، فضم جناحيه، ثم يضم الظلمة بعضها إلى بعض بكفيه، ثم يقبض عليها بكف واحدة نحو قبضته إذا تناولها من الحجاب بالمشرق، فيضعها عند المغرب على البحر السابع من هناك ظلمة الليل فإذا ما نقل ذلك الحجاب من المشرق إلى المغرب نفخ في الصور، وانق من بلاد المسلمين، في هو ان من الناس وذلة من أنفسهم، فينام أحدهم تلك الليلة قدر ما كان ينام قبلها من الليالي، ثم يقوم فيتوضأ ويدخل مصلاه فيصلي ورده، كما كان يصلي","bs_ranges":[],"bs_html":"Kada se to dogodi, Sunce će biti zadržano ispod Arša koliko traje jedna noć. Kad god učini sedždu i zatraži dopuštenje odakle da izađe, neće mu se odgovoriti, sve dok mu ne dođe Mjesec i s njim učini sedždu. I on će tražiti dopuštenje odakle da izađe, ali mu se neće odgovoriti, sve dok ih ne zadrži koliko traju tri noći za Sunce i dvije noći za Mjesec. Dužinu te noći prepoznat će samo oni koji na Zemlji klanjaju noću. Tada će ih biti malo u svakom muslimanskom mjestu; ljudi će ih omalovažavati, a oni će biti skromni u sebi. Jedan od njih spavat će te noći koliko je spavao i prethodnih noći, zatim će ustati, uzeti abdest, ući na mjesto gdje klanja i klanjati svoj uobičajeni dio noćnog namaza, kao što je klanjao"}],"notes":[]},{"n":72,"ar":"قبل ذلك، ثم يخرج فلا يرى الصبح، فينكر ذلك ويظن فيه الظنون من الشر ثم يقول: فلعلي خففت قراءتي، أو قصرت صلاتي، أو قمت قبل حيني!] [قال: ثم يعود أيضا فيصلي ورده كمثل ورده، الليلة الثانية، ثم يخرج فلا يرى الصبح، فيزيده ذلك إنكارا، ويخالطه الخوف، ويظن في ذلك الظنون من الشر، ثم يقول: فلعلي خففت قراءتي، أو قصرت صلاتي، أو قمت من أول الليل! ثم يعود أيضا الثالثة وهو وجل مشفق لما يتوقع من هول تلك الليلة، فيصلي أيضا مثل ورده، الليلة الثالثة، ثم يخرج فإذا هو بالليل مكانه والنجوم قد استدارت وصارت إلى مكانها من أول الليل فيشفق عند ذلك شفقة الخائف العارف بما كان يتوقع من هول تلك الليلة فيستلحمه الخوف، ويستخفه البكاء، ثم ينادي بعضهم بعضا، وقبل ذلك كانوا يتعارفون ويتواصلون، فيجتمع المتهجدون من أهل كل بلدة إلى مسجد من مساجدها، ويجأرون إلى الله عز وجل بالبكاء والصراخ بقية تلك الليلة، والغافلون في غفلتهم، حتى إذا ما تم لهما مقدار ثلاث ليال للشمس وللقمر ليلتين، أتاهما جبرئيل فيقول:\nان الرب عز وجل يأمر كما أن ترجعا إلى مغاربكما فتطلعا منها، وأنه لا ضوء لكما عندنا ولا نور قال: فيبكيان عند ذلك بكاء يسمعه أهل سبع سموات من دونهما وأهل سرادقات العرش وحملة العرش من فوقهما، فيبكون لبكائهما مع ما يخالطهم من خوف الموت، وخوف يوم القيامة.\nقال: فبينا الناس ينتظرون طلوعهما من المشرق إذا هما قد طلعا خلف أقفيتهم من المغرب أسودين مكورين كالغرارتين، ولا ضوء للشمس ولا نور للقمر، مثلهما في كسوفهما قبل ذلك، فيتصايح أهل الدنيا وتذهل الأمهات عن أولادها، والأحبة عن ثمرة قلوبها، فتشتغل كل نفس بما أتاها قال:\n\nفأما الصالحون والأبرار فإنه ينفعهم بكاؤهم يومئذ، ويكتب ذلك لهم عبادة.\n\nوأما الفاسقون والفجار فإنه لا ينفعهم بكاؤهم يومئذ، ويكتب ذلك عليهم خسارة قال: فيرتفعان مثل البعيرين القرينين، ينازع كل واحد منهما","bs":"\u003cp data-paragraph=\"72.1\">i prije toga. Zatim će izaći, ali neće vidjeti jutro. To će mu biti neobično i pomišljat će na različita zla. Zatim će reći: Možda sam skratio svoje učenje, ili svoj namaz, ili sam ustao prije svoga vremena!’ Rekao je: ‘Potom će se ponovo vratiti i klanjati dio noćnog namaza jednak svome uobičajenom dijelu, drugu noć. Zatim će izaći, ali neće vidjeti jutro. To će mu biti još neobičnije, obuzet će ga strah i pomišljat će na različita zla. Zatim će reći: Možda sam skratio svoje učenje, ili svoj namaz, ili sam ustao na početku noći! Zatim će se vratiti i treći put, u strahu i zebnji zbog strahote te noći koju očekuje, pa će opet klanjati koliko i obično, treću noć. Potom će izaći i zateći noć na istom mjestu, dok su zvijezde već obišle krug i vratile se na svoj položaj s početka noći. Tada će se prestrašiti strahom onoga koji se boji i zna kakvu je strahotu te noći očekivao. Strah će ga potpuno obuzeti, a plač svladati. Zatim će dozivati jedni druge, a već su se prije toga međusobno poznavali i održavali veze. Noćni klanjači svakoga mjesta okupit će se u jednoj od njegovih džamija, pa će ostatak te noći vapiti Allahu, Silnom i Uzvišenom, plačući i vičući, dok će nemarni ostati u svojoj nemarnosti. Kada se ispuni trajanje triju noći za Sunce i dviju za Mjesec, doći će im Džibril i reći: Gospodar, Silan i Uzvišen, naređuje vam da se vratite svojim zapadima i izađete odatle; kod nas za vas nema ni sjaja ni svjetlosti.’ Rekao je: ‘Tada će zaplakati plačem koji će čuti stanovnici sedmerih nebesa ispod njih i stanovnici zastora oko Arša i nosioci Arša iznad njih. Plakat će zbog njihovog plača, uz strah od smrti i strah od Kijametskog dana koji će ih prožimati.\u003c/p>\u003cp data-paragraph=\"72.2\">Rekao je: ‘Dok ljudi budu očekivali njihov izlazak s istoka, oni će izaći iza njihovih potiljaka, sa zapada, crni i smotani poput dviju velikih vreća. Sunce neće imati sjaja, a Mjesec svjetlosti, poput njih za vrijeme ranijih pomrčina. Stanovnici svijeta podići će krik; majke će zaboraviti svoju djecu, a voljeni plodove svojih srca. Svaka će duša biti zaokupljena onim što ju je snašlo.’ Rekao je:\u003c/p>\u003cp data-paragraph=\"72.3\">‘Što se tiče dobrih i čestitih, njihov će im plač toga dana koristiti i bit će im upisan kao ibadet.\u003c/p>\u003cp data-paragraph=\"72.4\">A što se tiče grješnika i razvratnika, njihov im plač toga dana neće koristiti i bit će im upisan kao gubitak.’ Rekao je: ‘Njih dvoje uzdizat će se poput dviju zajedno vezanih deva, dok će se jedno s drugim\u003c/p>","paragraphs":[{"id":"72.1","ar":"قبل ذلك، ثم يخرج فلا يرى الصبح، فينكر ذلك ويظن فيه الظنون من الشر ثم يقول: فلعلي خففت قراءتي، أو قصرت صلاتي، أو قمت قبل حيني!] [قال: ثم يعود أيضا فيصلي ورده كمثل ورده، الليلة الثانية، ثم يخرج فلا يرى الصبح، فيزيده ذلك إنكارا، ويخالطه الخوف، ويظن في ذلك الظنون من الشر، ثم يقول: فلعلي خففت قراءتي، أو قصرت صلاتي، أو قمت من أول الليل! ثم يعود أيضا الثالثة وهو وجل مشفق لما يتوقع من هول تلك الليلة، فيصلي أيضا مثل ورده، الليلة الثالثة، ثم يخرج فإذا هو بالليل مكانه والنجوم قد استدارت وصارت إلى مكانها من أول الليل فيشفق عند ذلك شفقة الخائف العارف بما كان يتوقع من هول تلك الليلة فيستلحمه الخوف، ويستخفه البكاء، ثم ينادي بعضهم بعضا، وقبل ذلك كانوا يتعارفون ويتواصلون، فيجتمع المتهجدون من أهل كل بلدة إلى مسجد من مساجدها، ويجأرون إلى الله عز وجل بالبكاء والصراخ بقية تلك الليلة، والغافلون في غفلتهم، حتى إذا ما تم لهما مقدار ثلاث ليال للشمس وللقمر ليلتين، أتاهما جبرئيل فيقول:\nان الرب ع a potpuno obuzeti, a plač svladati. Zatim će dozivati jedni druge, a već su se prije toga međusobno poznavali i održavali veze. Noćni klanjači svakoga mjesta okupit će se u jednoj od njegovih džamija, pa će ostatak te noći vapiti Allahu, Silnom i Uzvišenom, plačući i vičući, dok će nemarni ostati u svojoj nemarnosti. Kada se ispuni trajanje triju noći za Sunce i dviju za Mjesec, doći će im Džibril i reći: Gospodar, Silan i Uzvišen, naređuje vam da se vratite svojim zapadima i izađete odatle; kod nas za vas nema ni sjaja ni svjetlosti.’ Rekao je: ‘Tada će zaplakati plačem koji će čuti stanovnici sedmerih nebesa ispod njih i stanovnici zastora oko Arša i nosioci Arša iznad njih. Plakat će zbog njihovog plača, uz strah od smrti i strah od Kijametskog dana koji će ih prožimati."},{"id":"72.2","ar":"قال: فبينا الناس ينتظرون طلوعهما من المشرق إذا هما قد طلعا خلف أقفيتهم من المغرب أسودين مكورين كالغرارتين، ولا ضوء للشمس ولا نور للقمر، مثلهما في كسوفهما قبل ذلك، فيتصايح أهل الدنيا وتذهل الأمهات عن أولادها، والأحبة عن ثمرة قلوبها، فتشتغل كل نفس بما أتاها قال:","bs":"Rekao je: ‘Dok ljudi budu očekivali njihov izlazak s istoka, oni će izaći iza njihovih potiljaka, sa zapada, crni i smotani poput dviju velikih vreća. Sunce neće imati sjaja, a Mjesec svjetlosti, poput njih za vrijeme ranijih pomrčina. Stanovnici svijeta podići će krik; majke će zaboraviti svoju djecu, a voljeni plodove svojih srca. Svaka će duša biti zaokupljena onim što ju je snašlo.’ Rekao je:","ar_ranges":[],"ar_html":"قال: فبينا الناس ينتظرون طلوعهما من المشرق إذا هما قد طلعا خلف أقفيتهم من المغرب أسودين مكورين كالغرارتين، ولا ضوء للشمس ولا نور للقمر، مثلهما في كسوفهما قبل ذلك، فيتصايح أهل الدنيا وتذهل الأمهات عن أولادها، والأحبة عن ثمرة قلوبها، فتشتغل كل نفس بما أتاها قال:","bs_ranges":[],"bs_html":"Rekao je: ‘Dok ljudi budu očekivali njihov izlazak s istoka, oni će izaći iza njihovih potiljaka, sa zapada, crni i smotani poput dviju velikih vreća. Sunce neće imati sjaja, a Mjesec svjetlosti, poput njih za vrijeme ranijih pomrčina. Stanovnici svijeta podići će krik; majke će zaboraviti svoju djecu, a voljeni plodove svojih srca. Svaka će duša biti zaokupljena onim što ju je snašlo.’ Rekao je:"},{"id":"72.3","ar":"فأما الصالحون والأبرار فإنه ينفعهم بكاؤهم يومئذ، ويكتب ذلك لهم عبادة.","bs":"‘Što se tiče dobrih i čestitih, njihov će im plač toga dana koristiti i bit će im upisan kao ibadet.","ar_ranges":[],"ar_html":"فأما الصالحون والأبرار فإنه ينفعهم بكاؤهم يومئذ، ويكتب ذلك لهم عبادة.","bs_ranges":[],"bs_html":"‘Što se tiče dobrih i čestitih, njihov će im plač toga dana koristiti i bit će im upisan kao ibadet."},{"id":"72.4","ar":"وأما الفاسقون والفجار فإنه لا ينفعهم بكاؤهم يومئذ، ويكتب ذلك عليهم خسارة قال: فيرتفعان مثل البعيرين القرينين، ينازع كل واحد منهما","bs":"A što se tiče grješnika i razvratnika, njihov im plač toga dana neće koristiti i bit će im upisan kao gubitak.’ Rekao je: ‘Njih dvoje uzdizat će se poput dviju zajedno vezanih deva, dok će se jedno s drugim","ar_ranges":[],"ar_html":"وأما الفاسقون والفجار فإنه لا ينفعهم بكاؤهم يومئذ، ويكتب ذلك عليهم خسارة قال: فيرتفعان مثل البعيرين القرينين، ينازع كل واحد منهما","bs_ranges":[],"bs_html":"A što se tiče grješnika i razvratnika, njihov im plač toga dana neće koristiti i bit će im upisan kao gubitak.’ Rekao je: ‘Njih dvoje uzdizat će se poput dviju zajedno vezanih deva, dok će se jedno s drugim"}],"notes":[]},{"n":73,"ar":"صاحبه استباقا، حتى إذا بلغا سرة السماء- وهو منصفها- أتاهما جبرئيل فأخذ بقرونهما ثم ردهما إلى المغرب، فلا يغربهما في مغاربهما من تلك العيون، ولكن يغربهما في باب التوبة.\nفقال عمر بن الخطاب رضي الله عنه: أنا وأهلي فداؤك يا رسول الله! فما باب التوبة؟ قال: يا عمر، خلق الله عز وجل بابا للتوبة خلف المغرب، مصراعين من ذهب، مكللا بالدر والجوهر، ما بين المصراع إلى المصراع الآخر مسيرة أربعين عاما للراكب المسرع، فذلك الباب مفتوح منذ خلق الله خلقه إلى صبيحة تلك الليلة عند طلوع الشمس والقمر من مغاربهما، ولم يتب عبد من عباد الله توبة نصوحا من لدن آدم إلى صبيحة تلك الليلة إلا ولجت تلك التوبة في ذلك الباب، ثم ترفع إلى الله عز وجل قال معاذ بن جبل: بأبي أنت وأمي يا رسول الله! وما التوبة النصوح؟\nقال: أن يندم المذنب على الذنب الذي أصابه فيعتذر إلى الله ثم لا يعود إليه، كما لا يعود اللبن إلى الضرع قال: فيرد جبرئيل بالمصراعين فيلأم بينهما ويصيرهما كأنه لم يكن فيما بينهما صدع قط، فإذا اغلق باب التوبة لم يقبل بعد ذلك توبة، ولم ينفع بعد ذلك حسنة يعملها في الإسلام إلا من كان قبل ذلك محسنا، فإنه يجري لهم وعليهم بعد ذلك ما كان يجري قبل ذلك، قال فذلك قوله عز وجل: «يَوْمَ يَأْتِي بَعْضُ آياتِ رَبِّكَ لا يَنْفَعُ نَفْساً إِيمانُها لَمْ تَكُنْ آمَنَتْ مِنْ قَبْلُ أَوْ كَسَبَتْ فِي إِيمانِها خَيْراً» .\nفقال أُبي بن كعب: بأبي أنت وأمي يا رسول الله! فكيف بالشمس والقمر بعد ذلك! وكيف بالناس والدنيا! فقال: يا أبي، إن الشمس والقمر","bs":"\u003cp data-paragraph=\"73.1\">nadmetati u utrci. Kada stignu do sredine neba — njegovog središta — doći će im Džibril, uhvatiti ih za njihove rogove i vratiti ih na zapad. Neće ih spustiti da zađu u svoje zapade među onim izvorima, nego će ih spustiti da zađu na vratima pokajanja.’\u003c/p>\u003cp data-paragraph=\"73.2\">Omer ibn el-Hattab, radijallahu anhu, rekao je: ‘Ja i moja porodica žrtva smo za tebe, Allahov Poslaniče! Šta su vrata pokajanja?’ Odgovorio je: ‘Omere, Allah, Silan i Uzvišen, stvorio je iza zapada vrata za pokajanje, s dvama zlatnim krilima, ovjenčanim biserima i draguljima. Između jednoga i drugoga krila je četrdeset godina puta za brzog jahača. Ta vrata otvorena su od kada je Allah stvorio Svoja stvorenja do jutra te noći, kada Sunce i Mjesec izađu sa svojih zapada. Nijedan Allahov rob, od Adema do jutra te noći, nije se iskreno pokajao a da to njegovo pokajanje nije ušlo na ta vrata, a zatim bilo uzdignuto Allahu, Silnom i Uzvišenom.’ Muaz ibn Džebel rekao je: ‘Neka su mi otac i majka žrtva za tebe, Allahov Poslaniče! Šta je iskreno pokajanje?’\u003c/p>\u003cp data-paragraph=\"73.3\">Odgovorio je: ‘Da se grješnik pokaje zbog grijeha koji je počinio, zatraži oprost od Allaha, a zatim mu se ne vrati, kao što se mlijeko ne vraća u vime.’ Rekao je: ‘Džibril će tada vratiti dva krila vrata, spojiti ih i učiniti kao da između njih nikada nije bilo pukotine. Kada se vrata pokajanja zatvore, nakon toga se neće primati pokajanje niti će koristiti dobro djelo učinjeno u islamu, osim onome ko je i prije toga činio dobro. Njima će se i dalje upisivati u korist i na teret ono što se upisivalo i ranije.’ Rekao je: ‘To su riječi Njega, Silnog i Uzvišenog: Na dan kada dođu neki znakovi Gospodara tvoga, duši neće koristiti njeno vjerovanje ako nije vjerovala prije ili u svome vjerovanju stekla neko dobro.’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-En‘am, 6:158, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"73.4\">Ubejj ibn Ka‘b rekao je: ‘Neka su mi otac i majka žrtva za tebe, Allahov Poslaniče! A šta će poslije toga biti sa Suncem i Mjesecom? I šta će biti s ljudima i ovim svijetom?’ Odgovorio je: ‘Ubejje, Sunce i Mjesec\u003c/p>","paragraphs":[{"id":"73.1","ar":"صاحبه استباقا، حتى إذا بلغا سرة السماء- وهو منصفها- أتاهما جبرئيل فأخذ بقرونهما ثم ردهما إلى المغرب، فلا يغربهما في مغاربهما من تلك العيون، ولكن يغربهما في باب التوبة.","bs":"nadmetati u utrci. Kada stignu do sredine neba — njegovog središta — doći će im Džibril, uhvatiti ih za njihove rogove i vratiti ih na zapad. Neće ih spustiti da zađu u svoje zapade među onim izvorima, nego će ih spustiti da zađu na vratima pokajanja.’","ar_ranges":[],"ar_html":"صاحبه استباقا، حتى إذا بلغا سرة السماء- وهو منصفها- أتاهما جبرئيل فأخذ بقرونهما ثم ردهما إلى المغرب، فلا يغربهما في مغاربهما من تلك العيون، ولكن يغربهما في باب التوبة.","bs_ranges":[],"bs_html":"nadmetati u utrci. Kada stignu do sredine neba — njegovog središta — doći će im Džibril, uhvatiti ih za njihove rogove i vratiti ih na zapad. Neće ih spustiti da zađu u svoje zapade među onim izvorima, nego će ih spustiti da zađu na vratima pokajanja.’"},{"id":"73.2","ar":"فقال عمر بن الخطاب رضي الله عنه: أنا وأهلي فداؤك يا رسول الله! فما باب التوبة؟ قال: يا عمر، خلق الله عز و im biserima i draguljima. Između jednoga i drugoga krila je četrdeset godina puta za brzog jahača. Ta vrata otvorena su od kada je Allah stvorio Svoja stvorenja do jutra te noći, kada Sunce i Mjesec izađu sa svojih zapada. Nijedan Allahov rob, od Adema do jutra te noći, nije se iskreno pokajao a da to njegovo pokajanje nije ušlo na ta vrata, a zatim bilo uzdignuto Allahu, Silnom i Uzvišenom.’ Muaz ibn Džebel rekao je: ‘Neka su mi otac i majka žrtva za tebe, Allahov Poslaniče! Šta je iskreno pokajanje?’"},{"id":"73.3","ar":"قال: أن يندم المذنب على الذنب الذي أصابه فيعتذر إلى الله ثم لا يعود إليه، كما لا يعود اللبن إلى الضرع قال: فيرد جبرئيل بالمصراعين فيلأم بينهما ويصيرهما كأنه لم يكن فيما بينهما صدع قط، فإذا اغلق باب التوبة لم يقبل بعد ذلك توبة، ولم ينفع بعد ذلك حسنة يعملها في الإسلام إلا من كان قبل ذلك محسنا، فإنه يجري لهم وعليهم بعد ذلك ما كان يجري قبل ذلك، قال فذلك قوله عز وجل: «يَوْمَ يَأْتِي بَعْضُ آياتِ رَبِّكَ لا يَنْفَعُ نَفْساً إِيمانُها لَمْ تَكُنْ آمَنَتْ مِنْ قَبْلُ أَوْ كَسَبَتْ فِي إِيمانِها خَيْراً» .","bs":"Odgovorio je: ‘Da se grješnik pokaje zbog grijeha koji je počinio, zatraži oprost od Allaha, a zatim mu se ne vrati, kao što se mlijeko ne vraća u vime.’ Rekao je: ‘Džibril će tada vratiti dva krila vrata, spojiti ih i učiniti kao da između njih nikada nije bilo pukotine. Kada se vrata pokajanja zatvore, nakon toga se neće primati pokajanje niti će koristiti dobro djelo učinjeno u islamu, osim onome ko je i prije toga činio dobro. Njima će se i dalje upisivati u korist i na teret ono što se upisivalo i ranije.’ Rekao je: ‘To su riječi Njega, Silnog i Uzvišenog: Na dan kada dođu neki znakovi Gospodara tvoga, duši neće koristiti njeno vjerovanje ako nije vjerovala prije ili u svome vjerovanju stekla neko dobro.’ ⟦Prijevod kur’anskog navoda: El-En‘am, 6:158, navedeni dio.⟧","ar_ranges":[],"ar_html":"قال: أن يندم المذنب على الذنب الذي أصابه فيعتذر إلى الله ثم لا يعود إليه، كما لا يعود اللبن إلى الضرع قال: فيرد جبرئيل بالمصراعين فيلأم بينهما ويصيرهما ك
