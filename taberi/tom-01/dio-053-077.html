فجر، فإذا انحدرت من بعض تلك العيون، فذاك حين يضيء الصبح، فإذا وصلت إلى هذا الوجه من السماء فذاك حين يضيء النهار.\u003c/p>\u003cp data-pair=\"70.3\" id=\"ar-odlomak-70-3\">قال: وجعل الله عند المشرق حجابا من الظلمة على البحر السابع، مقدار\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 70\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"70.1\" id=\"odlomak-70-1\">svakih dvojih vrata je fersah. Svakoga dana na svakim vratima tih dvaju gradova smjenjuje se po deset hiljada naoružanih stražara. Poslije toga njihova stražarska smjena više ne dolazi sve do dana kada se puhne u rog. Tako mi Onoga u čijoj je ruci Muhammedova duša, da nema mnoštva tih ljudi i buke njihovih glasova, svi ljudi svijeta čuli bi tutnjavu pada Sunca pri njegovom izlasku i zalasku. Iza njih su tri naroda: Mensek, Tafil i Taris, a ispred njih Jedžudž i Medžudž. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: imena triju naroda u izvoru su منسك، تافيل، تاريس, bez potpunih oznaka za izgovor; transliteracija je nesigurna.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"70.2\" id=\"odlomak-70-2\">Džibril, alejhis-selam, odveo me njima u noći kada sam prenesen iz Mesdžidul-harama u Mesdžidul-aksa. Pozvao sam Jedžudža i Medžudža da obožavaju Allaha, Silnog i Uzvišenog, ali su odbili odazvati mi se. Zatim me odveo stanovnicima dvaju gradova. Pozvao sam ih Allahovoj, Silan je i Uzvišen, vjeri i obožavanju Njega. Odazvali su se i pokajnički Mu se okrenuli. Oni su naša braća u vjeri: ko od njih čini dobro s vašim je dobročiniteljima, a ko od njih čini zlo s vašim je zločiniteljima. Zatim me odveo trima narodima. Pozvao sam ih Allahovoj vjeri i obožavanju Njega, ali su odbacili ono čemu sam ih pozvao: nisu povjerovali u Allaha, Silnog i Uzvišenog, i poricali su Njegove poslanike. Zato su oni s Jedžudžom i Medžudžom i svim ostalim nepokornima Allahu u Vatri. Kada Sunce zađe, podiže se s jednog neba na drugo brzinom leta meleka, dok ne stigne do najvišeg, sedmog neba i ne bude ispod Arša. Tada pada na sedždu, a s njim sedždu čine meleki zaduženi za njega. Potom se spušta s jednog neba na drugo. Kada stigne do ovoga neba, tada izbija zora. Kada se spusti iz jednog od tih izvora, tada zasja jutro. Kada stigne na ovu stranu neba, tada zasja dan.\u003c/p>\u003cp data-pair=\"70.3\" id=\"odlomak-70-3\">Rekao je: ‘Allah je na istoku, na sedmom moru, postavio zastor tame, veličine\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":71,"html":"\u003csection class=\"page\" data-page=\"71\" id=\"stranica-71\">\u003ch2>Stranica 71\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 71\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"71.1\" id=\"ar-odlomak-71-1\">عدة الليالي منذ يوم خلق الله الدنيا إلى يوم تصرم، فإذا كان عند الغروب أقبل ملك قد وكل بالليل فيقبض قبضة من ظلمة ذلك الحجاب، ثم يستقبل المغرب، فلا يزال يرسل من الظلمة من خلل اصابته قليلا قليلا وهو يراعي الشفق، فإذا غاب الشفق أرسل الظلمة كلها ثم ينشر جناحيه، فيبلغان قطري الأرض وكنفي السماء، ويجاوزان ما شاء الله عز وجل خارجا في الهواء، فيسوق ظلمة الليل بجناحيه بالتسبيح والتقديس والصلاة لله حتى يبلغ المغرب، فإذا بلغ المغرب انفجر الصبح من المشرق، فضم جناحيه، ثم يضم الظلمة بعضها إلى بعض بكفيه، ثم يقبض عليها بكف واحدة نحو قبضته إذا تناولها من الحجاب بالمشرق، فيضعها عند المغرب على البحر السابع من هناك ظلمة الليل فإذا ما نقل ذلك الحجاب من المشرق إلى المغرب نفخ في الصور، وانقضت الدنيا، فضوء النهار من قبل المشرق، وظلمة الليل من قبل ذلك الحجاب، فلا تزال الشمس والقمر كذلك من مطالعهما إلى مغاربهما إلى ارتفاعهما، إلى السماء السابعة العليا، إلى محبسهما تحت العرش، حتى يأتي الوقت الذي ضرب الله لتوبة العباد، فتكثر المعاصي في الأرض ويذهب المعروف، فلا يأمر به أحد، ويفشو المنكر فلا ينهى عنه أحد.\u003c/p>\u003cp data-pair=\"71.2\" id=\"ar-odlomak-71-2\">فإذا كان ذلك حبست الشمس مقدار ليلة تحت العرش، فكلما سجدت واستأذنت: من أين تطلع؟ لم يحر إليها جواب، حتى يوافيها القمر ويسجد معها، ويستأذن: من أين يطلع؟ فلا يحار إليه جواب، حتى يحبسهما مقدار ثلاث ليال للشمس، وليلتين للقمر، فلا يعرف طول تلك الليلة إلا المتهجدون في الأرض، وهم حينئذ عصابة قليلة في كل بلدة من بلاد المسلمين، في هو ان من الناس وذلة من أنفسهم، فينام أحدهم تلك الليلة قدر ما كان ينام قبلها من الليالي، ثم يقوم فيتوضأ ويدخل مصلاه فيصلي ورده، كما كان يصلي\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 71\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"71.1\" id=\"odlomak-71-1\">broja noći od dana kada je Allah stvorio ovaj svijet do dana njegova završetka. Kada se približi zalazak, dolazi melek zadužen za noć, zahvati pregršt tame iz toga zastora i okrene se prema zapadu. Stalno, malo-pomalo, propušta tamu između svojih prstiju, prateći večernji sumrak. Kada sumrak nestane, pušta svu tamu, zatim širi svoja krila, pa ona dosegnu krajeve Zemlje i strane neba i izlaze dalje u zračni prostor koliko Allah, Silan i Uzvišen, htjedne. Svojim krilima goni noćnu tamu, slaveći, posvećujući i moleći se Allahu, sve dok ne stigne do zapada. Kada stigne do zapada, na istoku izbije jutro. Tada skupi krila, zatim dlanovima sabira tamu, jednu uz drugu, pa je stisne u jedan dlan, poput pregršti koju je uzeo iz zastora na istoku. Ostavi je na zapadu, na sedmom moru. Odatle je noćna tama. Kada se taj zastor prenese s istoka na zapad, puhnut će se u rog i ovaj svijet će se završiti. Svjetlost dana dolazi s istoka, a noćna tama od toga zastora. Sunce i Mjesec neprestano tako prolaze od svojih izlazaka do svojih zalazaka, pa do svoga uzdizanja do najvišeg, sedmog neba i do zadržavanja ispod Arša, sve dok ne dođe vrijeme koje je Allah odredio za pokajanje robova. Tada će na Zemlji biti mnogo grijeha, nestat će dobro i niko ga neće naređivati, a zlo će se raširiti i niko ga neće zabranjivati. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u izrazu من خلل اصابته izvor ima اصابته, što u ovom kontekstu izgleda kao greška umjesto أصابعه („njegovi prsti“). Predloženo čitanje označeno je ovdje; arapski izvornik nije mijenjan.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"71.2\" id=\"odlomak-71-2\">Kada se to dogodi, Sunce će biti zadržano ispod Arša koliko traje jedna noć. Kad god učini sedždu i zatraži dopuštenje odakle da izađe, neće mu se odgovoriti, sve dok mu ne dođe Mjesec i s njim učini sedždu. I on će tražiti dopuštenje odakle da izađe, ali mu se neće odgovoriti, sve dok ih ne zadrži koliko traju tri noći za Sunce i dvije noći za Mjesec. Dužinu te noći prepoznat će samo oni koji na Zemlji klanjaju noću. Tada će ih biti malo u svakom muslimanskom mjestu; ljudi će ih omalovažavati, a oni će biti skromni u sebi. Jedan od njih spavat će te noći koliko je spavao i prethodnih noći, zatim će ustati, uzeti abdest, ući na mjesto gdje klanja i klanjati svoj uobičajeni dio noćnog namaza, kao što je klanjao\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":72,"html":"\u003csection class=\"page\" data-page=\"72\" id=\"stranica-72\">\u003ch2>Stranica 72\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 72\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"72.1\" id=\"ar-odlomak-72-1\">قبل ذلك، ثم يخرج فلا يرى الصبح، فينكر ذلك ويظن فيه الظنون من الشر ثم يقول: فلعلي خففت قراءتي، أو قصرت صلاتي، أو قمت قبل حيني!] [قال: ثم يعود أيضا فيصلي ورده كمثل ورده، الليلة الثانية، ثم يخرج فلا يرى الصبح، فيزيده ذلك إنكارا، ويخالطه الخوف، ويظن في ذلك الظنون من الشر، ثم يقول: فلعلي خففت قراءتي، أو قصرت صلاتي، أو قمت من أول الليل! ثم يعود أيضا الثالثة وهو وجل مشفق لما يتوقع من هول تلك الليلة، فيصلي أيضا مثل ورده، الليلة الثالثة، ثم يخرج فإذا هو بالليل مكانه والنجوم قد استدارت وصارت إلى مكانها من أول الليل فيشفق عند ذلك شفقة الخائف العارف بما كان يتوقع من هول تلك الليلة فيستلحمه الخوف، ويستخفه البكاء، ثم ينادي بعضهم بعضا، وقبل ذلك كانوا يتعارفون ويتواصلون، فيجتمع المتهجدون من أهل كل بلدة إلى مسجد من مساجدها، ويجأرون إلى الله عز وجل بالبكاء والصراخ بقية تلك الليلة، والغافلون في غفلتهم، حتى إذا ما تم لهما مقدار ثلاث ليال للشمس وللقمر ليلتين، أتاهما جبرئيل فيقول:\nان الرب عز وجل يأمر كما أن ترجعا إلى مغاربكما فتطلعا منها، وأنه لا ضوء لكما عندنا ولا نور قال: فيبكيان عند ذلك بكاء يسمعه أهل سبع سموات من دونهما وأهل سرادقات العرش وحملة العرش من فوقهما، فيبكون لبكائهما مع ما يخالطهم من خوف الموت، وخوف يوم القيامة.\u003c/p>\u003cp data-pair=\"72.2\" id=\"ar-odlomak-72-2\">قال: فبينا الناس ينتظرون طلوعهما من المشرق إذا هما قد طلعا خلف أقفيتهم من المغرب أسودين مكورين كالغرارتين، ولا ضوء للشمس ولا نور للقمر، مثلهما في كسوفهما قبل ذلك، فيتصايح أهل الدنيا وتذهل الأمهات عن أولادها، والأحبة عن ثمرة قلوبها، فتشتغل كل نفس بما أتاها قال:\u003c/p>\u003cp data-pair=\"72.3\" id=\"ar-odlomak-72-3\">فأما الصالحون والأبرار فإنه ينفعهم بكاؤهم يومئذ، ويكتب ذلك لهم عبادة.\u003c/p>\u003cp data-pair=\"72.4\" id=\"ar-odlomak-72-4\">وأما الفاسقون والفجار فإنه لا ينفعهم بكاؤهم يومئذ، ويكتب ذلك عليهم خسارة قال: فيرتفعان مثل البعيرين القرينين، ينازع كل واحد منهما\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 72\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"72.1\" id=\"odlomak-72-1\">i prije toga. Zatim će izaći, ali neće vidjeti jutro. To će mu biti neobično i pomišljat će na različita zla. Zatim će reći: Možda sam skratio svoje učenje, ili svoj namaz, ili sam ustao prije svoga vremena!’ Rekao je: ‘Potom će se ponovo vratiti i klanjati dio noćnog namaza jednak svome uobičajenom dijelu, drugu noć. Zatim će izaći, ali neće vidjeti jutro. To će mu biti još neobičnije, obuzet će ga strah i pomišljat će na različita zla. Zatim će reći: Možda sam skratio svoje učenje, ili svoj namaz, ili sam ustao na početku noći! Zatim će se vratiti i treći put, u strahu i zebnji zbog strahote te noći koju očekuje, pa će opet klanjati koliko i obično, treću noć. Potom će izaći i zateći noć na istom mjestu, dok su zvijezde već obišle krug i vratile se na svoj položaj s početka noći. Tada će se prestrašiti strahom onoga koji se boji i zna kakvu je strahotu te noći očekivao. Strah će ga potpuno obuzeti, a plač svladati. Zatim će dozivati jedni druge, a već su se prije toga međusobno poznavali i održavali veze. Noćni klanjači svakoga mjesta okupit će se u jednoj od njegovih džamija, pa će ostatak te noći vapiti Allahu, Silnom i Uzvišenom, plačući i vičući, dok će nemarni ostati u svojoj nemarnosti. Kada se ispuni trajanje triju noći za Sunce i dviju za Mjesec, doći će im Džibril i reći: Gospodar, Silan i Uzvišen, naređuje vam da se vratite svojim zapadima i izađete odatle; kod nas za vas nema ni sjaja ni svjetlosti.’ Rekao je: ‘Tada će zaplakati plačem koji će čuti stanovnici sedmerih nebesa ispod njih i stanovnici zastora oko Arša i nosioci Arša iznad njih. Plakat će zbog njihovog plača, uz strah od smrti i strah od Kijametskog dana koji će ih prožimati.\u003c/p>\u003cp data-pair=\"72.2\" id=\"odlomak-72-2\">Rekao je: ‘Dok ljudi budu očekivali njihov izlazak s istoka, oni će izaći iza njihovih potiljaka, sa zapada, crni i smotani poput dviju velikih vreća. Sunce neće imati sjaja, a Mjesec svjetlosti, poput njih za vrijeme ranijih pomrčina. Stanovnici svijeta podići će krik; majke će zaboraviti svoju djecu, a voljeni plodove svojih srca. Svaka će duša biti zaokupljena onim što ju je snašlo.’ Rekao je:\u003c/p>\u003cp data-pair=\"72.3\" id=\"odlomak-72-3\">‘Što se tiče dobrih i čestitih, njihov će im plač toga dana koristiti i bit će im upisan kao ibadet.\u003c/p>\u003cp data-pair=\"72.4\" id=\"odlomak-72-4\">A što se tiče grješnika i razvratnika, njihov im plač toga dana neće koristiti i bit će im upisan kao gubitak.’ Rekao je: ‘Njih dvoje uzdizat će se poput dviju zajedno vezanih deva, dok će se jedno s drugim\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":73,"html":"\u003csection class=\"page\" data-page=\"73\" id=\"stranica-73\">\u003ch2>Stranica 73\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 73\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"73.1\" id=\"ar-odlomak-73-1\">صاحبه استباقا، حتى إذا بلغا سرة السماء- وهو منصفها- أتاهما جبرئيل فأخذ بقرونهما ثم ردهما إلى المغرب، فلا يغربهما في مغاربهما من تلك العيون، ولكن يغربهما في باب التوبة.\u003c/p>\u003cp data-pair=\"73.2\" id=\"ar-odlomak-73-2\">فقال عمر بن الخطاب رضي الله عنه: أنا وأهلي فداؤك يا رسول الله! فما باب التوبة؟ قال: يا عمر، خلق الله عز وجل بابا للتوبة خلف المغرب، مصراعين من ذهب، مكللا بالدر والجوهر، ما بين المصراع إلى المصراع الآخر مسيرة أربعين عاما للراكب المسرع، فذلك الباب مفتوح منذ خلق الله خلقه إلى صبيحة تلك الليلة عند طلوع الشمس والقمر من مغاربهما، ولم يتب عبد من عباد الله توبة نصوحا من لدن آدم إلى صبيحة تلك الليلة إلا ولجت تلك التوبة في ذلك الباب، ثم ترفع إلى الله عز وجل قال معاذ بن جبل: بأبي أنت وأمي يا رسول الله! وما التوبة النصوح؟\u003c/p>\u003cp data-pair=\"73.3\" id=\"ar-odlomak-73-3\">قال: أن يندم المذنب على الذنب الذي أصابه فيعتذر إلى الله ثم لا يعود إليه، كما لا يعود اللبن إلى الضرع قال: فيرد جبرئيل بالمصراعين فيلأم بينهما ويصيرهما كأنه لم يكن فيما بينهما صدع قط، فإذا اغلق باب التوبة لم يقبل بعد ذلك توبة، ولم ينفع بعد ذلك حسنة يعملها في الإسلام إلا من كان قبل ذلك محسنا، فإنه يجري لهم وعليهم بعد ذلك ما كان يجري قبل ذلك، قال فذلك قوله عز وجل: «يَوْمَ يَأْتِي بَعْضُ آياتِ رَبِّكَ لا يَنْفَعُ نَفْساً إِيمانُها لَمْ تَكُنْ آمَنَتْ مِنْ قَبْلُ أَوْ كَسَبَتْ فِي إِيمانِها خَيْراً» .\u003c/p>\u003cp data-pair=\"73.4\" id=\"ar-odlomak-73-4\">فقال أُبي بن كعب: بأبي أنت وأمي يا رسول الله! فكيف بالشمس والقمر بعد ذلك! وكيف بالناس والدنيا! فقال: يا أبي، إن الشمس والقمر\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 73\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"73.1\" id=\"odlomak-73-1\">nadmetati u utrci. Kada stignu do sredine neba — njegovog središta — doći će im Džibril, uhvatiti ih za njihove rogove i vratiti ih na zapad. Neće ih spustiti da zađu u svoje zapade među onim izvorima, nego će ih spustiti da zađu na vratima pokajanja.’\u003c/p>\u003cp data-pair=\"73.2\" id=\"odlomak-73-2\">Omer ibn el-Hattab, radijallahu anhu, rekao je: ‘Ja i moja porodica žrtva smo za tebe, Allahov Poslaniče! Šta su vrata pokajanja?’ Odgovorio je: ‘Omere, Allah, Silan i Uzvišen, stvorio je iza zapada vrata za pokajanje, s dvama zlatnim krilima, ovjenčanim biserima i draguljima. Između jednoga i drugoga krila je četrdeset godina puta za brzog jahača. Ta vrata otvorena su od kada je Allah stvorio Svoja stvorenja do jutra te noći, kada Sunce i Mjesec izađu sa svojih zapada. Nijedan Allahov rob, od Adema do jutra te noći, nije se iskreno pokajao a da to njegovo pokajanje nije ušlo na ta vrata, a zatim bilo uzdignuto Allahu, Silnom i Uzvišenom.’ Muaz ibn Džebel rekao je: ‘Neka su mi otac i majka žrtva za tebe, Allahov Poslaniče! Šta je iskreno pokajanje?’\u003c/p>\u003cp data-pair=\"73.3\" id=\"odlomak-73-3\">Odgovorio je: ‘Da se grješnik pokaje zbog grijeha koji je počinio, zatraži oprost od Allaha, a zatim mu se ne vrati, kao što se mlijeko ne vraća u vime.’ Rekao je: ‘Džibril će tada vratiti dva krila vrata, spojiti ih i učiniti kao da između njih nikada nije bilo pukotine. Kada se vrata pokajanja zatvore, nakon toga se neće primati pokajanje niti će koristiti dobro djelo učinjeno u islamu, osim onome ko je i prije toga činio dobro. Njima će se i dalje upisivati u korist i na teret ono što se upisivalo i ranije.’ Rekao je: ‘To su riječi Njega, Silnog i Uzvišenog: Na dan kada dođu neki znakovi Gospodara tvoga, duši neće koristiti njeno vjerovanje ako nije vjerovala prije ili u svome vjerovanju stekla neko dobro.’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-En‘am, 6:158, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"73.4\" id=\"odlomak-73-4\">Ubejj ibn Ka‘b rekao je: ‘Neka su mi otac i majka žrtva za tebe, Allahov Poslaniče! A šta će poslije toga biti sa Suncem i Mjesecom? I šta će biti s ljudima i ovim svijetom?’ Odgovorio je: ‘Ubejje, Sunce i Mjesec\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":74,"html":"\u003csection class=\"page\" data-page=\"74\" id=\"stranica-74\">\u003ch2>Stranica 74\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 74\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"74.1\" id=\"ar-odlomak-74-1\">بعد ذلك يكسيان النور والضوء، ويطلعان على الناس ويغربان كما كانا قبل ذلك، وأما الناس فإنهم نظروا إلى ما نظروا إليه من فظاعة الآية، فيلحون على الدنيا حتى يجروا فيها الأنهار، ويغرسوا فيها الشجر، ويبنوا فيها البنيان وأما الدنيا فإنه لو أنتج رجل مهرا لم يركبه من لدن طلوع الشمس من مغربها إلى يوم ينفخ في الصور.\u003c/p>\u003cp data-pair=\"74.2\" id=\"ar-odlomak-74-2\">فقال حذيفة بن اليمان: أنا وأهلي فداؤك يا رسول الله! فكيف هم عند النفخ في الصور! فقال: يا حذيفة، والذي نفس محمد بيده، لتقومن الساعة ولينفخن في الصور والرجل قد لط حوضه فلا يسقى منه، ولتقومن الساعة والثوب بين الرجلين فلا يطويانه، ولا يتبايعانه ولتقومن الساعة والرجل قد رفع لقمته إلى فيه فلا يطعمها، ولتقومن الساعة والرجل قد انصرف بلبن لقحته من تحتها فلا يشربه، ثم تلا رسول الله ص هذه الآية: «وَلَيَأْتِيَنَّهُمْ بَغْتَةً وَهُمْ لا يَشْعُرُونَ» .\u003c/p>\u003cp data-pair=\"74.3\" id=\"ar-odlomak-74-3\">فإذا نفخ في الصور، وقامت الساعة، وميز الله بين أهل الجنة وأهل النار ولما يدخلوهما بعد، إذ يدعو الله عز وجل بالشمس والقمر، فيجاء بهما أسودين مكورين قد وقعا في زلزال وبلبال، ترعد فرائصهما من هول ذلك اليوم ومخافة الرحمن، حتى إذا كانا حيال العرش خرا لله ساجدين، فيقولان: إلهنا قد علمت طاعتنا ودءوبنا في عبادتك، وسرعتنا للمضي في أمرك أيام الدنيا، فلا تعذبنا بعبادة المشركين إيانا، فإنا لم ندع الى عبادتنا، ولم نذهل عن عبادتك! قال: فيقول الرب تبارك وتعالى: صدقتما، وإني قضيت على نفسي أن أبدئ وأعيد، وإني معيدكما فيما بدأتكما منه، فارجعا إلى ما خلقتما منه،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 74\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"74.1\" id=\"odlomak-74-1\">poslije toga ponovo će biti odjeveni svjetlošću i sjajem, izlazit će ljudima i zalaziti kao i prije. Što se tiče ljudi, nakon što vide strahotu toga znaka, uporno će se posvetiti ovome svijetu, sve dok njime ne provedu rijeke, u njemu ne zasade drveće i ne podignu građevine. A što se tiče trajanja svijeta, kada bi neko dobio ždrijebe, ne bi ga stigao zajahati u vremenu od Sunčevog izlaska sa zapada do dana kada se puhne u rog.’\u003c/p>\u003cp data-pair=\"74.2\" id=\"odlomak-74-2\">Huzejfa ibn el-Jeman rekao je: ‘Ja i moja porodica žrtva smo za tebe, Allahov Poslaniče! Kakvo će njihovo stanje biti kada se puhne u rog?’ Odgovorio je: ‘Huzejfa, tako mi Onoga u čijoj je ruci Muhammedova duša, Čas će nastupiti i u rog će se puhnuti dok čovjek bude upravo oblijepio svoje pojilo, a neće iz njega napojiti. Čas će nastupiti dok odjeća bude između dvojice ljudi, pa je neće ni složiti niti zaključiti kupoprodaju. Čas će nastupiti dok čovjek bude podigao zalogaj prema ustima, pa ga neće pojesti. Čas će nastupiti dok se čovjek bude vraćao s mlijekom svoje tek pomužene deve, pa ga neće popiti.’ Zatim je Allahov Poslanik, sallallahu alejhi ve sellem, proučio ovaj ajet: ‘I doći će im iznenada, a oni neće ni osjetiti.’ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Ankebut, 29:53, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"74.3\" id=\"odlomak-74-3\">‘Kada se puhne u rog, nastupi Čas i Allah razdvoji stanovnike Dženneta i stanovnike Vatre, a oni još ne uđu u njih, Allah, Silan i Uzvišen, pozvat će Sunce i Mjesec. Bit će dovedeni crni i smotani, u potresu i pometnji; slabine će im drhtati od strahote toga dana i straha od Milostivog. Kada budu naspram Arša, past će Allahu na sedždu i reći: Bože naš, Ti znaš našu pokornost, našu ustrajnost u ibadetu Tebi i našu brzinu u izvršavanju Tvojih naredbi tokom dana ovoga svijeta. Nemoj nas kazniti zato što su nas mnogobošci obožavali! Mi nismo pozivali da budemo obožavani i nismo zaboravili ibadet Tebi.’ Rekao je: ‘Gospodar, Blagoslovljen i Uzvišen, reći će: Istinu ste rekli. Odredio sam Sebi da započinjem i vraćam. Vratit ću vas u ono iz čega sam vas prvobitno načinio. Vratite se u ono od čega ste stvoreni.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":75,"html":"\u003csection class=\"page\" data-page=\"75\" id=\"stranica-75\">\u003ch2>Stranica 75\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 75\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"75.1\" id=\"ar-odlomak-75-1\">قالا: إلهنا، ومم خلقتنا؟ قال: خلقتكما من نور عرشي، فارجعا إليه قال:\n\nفيلتمع من كل واحد منهما برقة تكاد تخطف الأبصار نورا، فتختلط بنور العرش فذلك قوله عز وجل: «يُبْدِئُ وَيُعِيدُ] » .\u003c/p>\u003cp data-pair=\"75.2\" id=\"ar-odlomak-75-2\">قال عكرمة: فقمت مع النفر الذين حدثوا به، حتى أتينا كعبا فأخبرناه بما كان من وجد ابن عباس من حديثه، وبما حدث عن رسول الله ص، فقام كعب معنا حتى أتينا ابْنَ عَبَّاسٍ، فقال: قد بلغني ما كان من وجدك من حديثي، وأستغفر الله وأتوب إليه، وإني إنما حدثت عن كتاب دارس قد تداولته الأيدي، ولا أدري ما كان فيه من تبديل اليهود، وإنك حدثت عن كتاب جديد حديث العهد بالرحمن عز وجل وعن سيد الأنبياء وخير النبيين، فأنا أحب أن تحدثني الحديث فأحفظه عنك، فإذا حدثت به كان مكان حديثي الأول.\u003c/p>\u003cp data-pair=\"75.3\" id=\"ar-odlomak-75-3\">قال عكرمة: فأعاد عليه ابْنِ عَبَّاسٍ الحديث، وأنا أستقريه في قلبي بابا بابا، فما زاد شيئا ولا نقص، ولا قدم شيئا ولا أخر، فزادني ذلك في ابْنِ عَبَّاسٍ رغبة، وللحديث حفظا.\u003c/p>\u003cp data-pair=\"75.4\" id=\"ar-odlomak-75-4\">ومما روي عن السلف في ذلك مَا حَدَّثَنَاهُ ابن حميد، قال:\n\n\u003cspan class=\"isnad\">حدثنا جَرِيرٌ، عَنْ عَبْدِ الْعَزِيزِ بْنِ رُفَيْعٍ، عَنْ أَبِي الطُّفَيْلِ، قَالَ: [قَالَ ابْنُ الْكَواءِ لِعَلِيٍّ ع: \u003c/span>يَا أَمِيرَ الْمُؤْمِنِينَ، مَا هَذِهِ اللَّطْخَةُ الَّتِي فِي الْقَمَرِ؟\nفَقَالَ: وَيْحَكَ! أَمَا تَقْرَأُ الْقُرْآنَ: «فَمَحَوْنا آيَةَ اللَّيْلِ» ! فهذه محوه]\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 75\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"75.1\" id=\"odlomak-75-1\">Oni će reći: Bože naš, a od čega si nas stvorio? Reći će: Stvorio sam vas od svjetlosti Svoga Arša, pa joj se vratite.’ Rekao je: ‘Iz svakoga od njih bljesnut će munja svjetlosti koja gotovo oduzima vid, pa će se pomiješati sa svjetlošću Arša. To su riječi Njega, Silnog i Uzvišenog: Započinje i vraća.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Burudž, 85:13, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"75.2\" id=\"odlomak-75-2\">Ikrima je rekao: „Ustao sam s ljudima kojima je to ispričao i otišli smo Ka‘bu. Obavijestili smo ga koliko se Ibn Abbas rasrdio zbog njegovog kazivanja i šta je prenio od Allahovog Poslanika, sallallahu alejhi ve sellem. Ka‘b je ustao i pošao s nama, pa smo došli Ibn Abbasu. Rekao je: ‘Do mene je doprlo koliko si se rasrdio zbog moga kazivanja. Tražim oprost od Allaha i kajem Mu se. Prenosio sam iz stare, istrošene knjige koja je prelazila iz ruke u ruku, a ne znam kakve su izmjene Jevreji u nju unijeli. Ti si kazivao prema novoj Knjizi, koja je nedavno došla od Milostivog, Silnog i Uzvišenog, i od prvaka vjerovjesnika i najboljeg među njima. Želio bih da mi ispričaš tu predaju kako bih je od tebe zapamtio, pa kada je budem prenosio, da zamijeni moje prvo kazivanje.’“\u003c/p>\u003cp data-pair=\"75.3\" id=\"odlomak-75-3\">Ikrima je rekao: „Ibn Abbas ponovio mu je predaju, a ja sam je u srcu pratio dio po dio. Nije ništa ni dodao ni oduzeo, niti je išta stavio prije ili poslije svoga mjesta. To je još povećalo moju privrženost Ibn Abbasu i učvrstilo mi pamćenje predaje.“\u003c/p>\u003cp data-pair=\"75.4\" id=\"odlomak-75-4\">Među onim što je o tome preneseno od prethodnika jeste ono što \u003cspan class=\"isnad\">nam je pričao Ibn Humejd, koji je rekao: pričao nam je Džerir, od Abdulaziza ibn Rufej‘a, od Ebu Tufejla, koji je rekao: \u003c/span>„Ibn el-Kevva rekao je Aliju, alejhis-selam: ‘Vladaru pravovjernih, kakva je ovo mrlja na Mjesecu?’ Odgovorio je: ‘Teško tebi! Zar ne čitaš Kur’an: Znak noći izbrisali smo! To je njegovo brisanje.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":76,"html":"\u003csection class=\"page\" data-page=\"76\" id=\"stranica-76\">\u003ch2>Stranica 76\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 76\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"76.1\" id=\"ar-odlomak-76-1\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا طَلْقٌ، عَنْ زَائِدَةَ، عَنْ عَاصِمٍ، عَنْ عَلِيِّ بْنِ رَبِيعَةَ، [قال: \u003c/span>سال ابن الكواء عليا ع فَقَالَ:\nمَا هَذَا السَّوَادُ فِي الْقَمَرِ؟ فَقَالَ عَلِيٌّ: «فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، هُوَ الْمَحْوُ] .\u003c/p>\u003cp data-pair=\"76.2\" id=\"ar-odlomak-76-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ، قَالَ: حَدَّثَنَا إِسْرَائِيلُ، عَنْ أَبِي إِسْحَاقَ، عَنْ عُبَيْدِ بْنِ عُمَيْرٍ، قَالَ: \u003c/span>[كنت عند على ع، فَسَأَلَهُ ابْنُ الْكَوَاءِ عَنِ السَّوَادِ الَّذِي فِي الْقَمَرِ فَقَالَ: ذَاكَ آيَةُ اللَّيْلِ مُحِيَتْ] .\u003c/p>\u003cp data-pair=\"76.3\" id=\"ar-odlomak-76-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ أَبِي الشَّوَارِبِ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ:\nحَدَّثَنَا عِمْرَانُ بْنُ حُدَيْرٍ، عَنْ رفيع، ابى كثيره، قَالَ: [قَالَ عَلِيُّ بْنُ أَبِي طَالِبٍ رَضِيَ اللَّهُ عَنْهُ: \u003c/span>سَلُوا عَمَّا شِئْتُمْ، فَقَامَ ابْنُ الْكَوَاءِ فَقَالَ: مَا السَّوَادُ الَّذِي فِي الْقَمَرِ؟ فَقَالَ: قَاتَلَكَ اللَّهُ! هَلا سَأَلْتَ عَنْ أَمْرِ دِينِكَ وَآخِرَتِكَ! ثُمَّ قَالَ:\n\nذَاكَ مَحْوُ اللَّيْلِ] .\u003c/p>\u003cp data-pair=\"76.4\" id=\"ar-odlomak-76-4\">\u003cspan class=\"isnad\">حَدَّثَنَا زَكَرِيَّاءُ بْنُ يَحْيَى بْنِ أَبَانٍ الْمِصْرِيُّ، قَالَ: حَدَّثَنَا ابْنُ عُفَيْرٍ، قَالَ: حَدَّثَنَا ابْنُ لَهِيعَةَ، عَنْ حُيَيِّ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِي عَبْدِ الرَّحْمَنِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ، [أَنَّ رَجُلا قَالَ لِعَلِيٍّ رَضِيَ اللَّهُ عَنْهُ: \u003c/span>مَا السَّوَادُ الَّذِي فِي الْقَمَرِ؟ قَالَ: إِنَّ اللَّهَ يَقُولُ: «وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً] » .\u003c/p>\u003cp data-pair=\"76.5\" id=\"ar-odlomak-76-5\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ: حَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَوْلَهُ: \u003c/span>«وَجَعَلْنَا\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 76\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"76.1\" id=\"odlomak-76-1\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Talk, od Zaide, od Asima, od Alija ibn Rebie, koji je rekao: \u003c/span>„Ibn el-Kevva upitao je Alija, alejhis-selam: ‘Šta je ovo crnilo na Mjesecu?’ Ali je odgovorio: ‘Znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi. To je brisanje.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"76.2\" id=\"odlomak-76-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar, koji je rekao: pričao nam je Abdurrahman, koji je rekao: pričao nam je Israil, od Ebu Ishaka, od Ubejda ibn Umejra, koji je rekao: \u003c/span>„Bio sam kod Alija, alejhis-selam, pa ga je Ibn el-Kevva upitao o crnilu na Mjesecu. Odgovorio je: ‘To je znak noći koji je izbrisan.’“\u003c/p>\u003cp data-pair=\"76.3\" id=\"odlomak-76-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Ebu Ševarib, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Imran ibn Hudejr, od Refi‘a, Ebu Kesire, koji je rekao: \u003c/span>„Ali ibn Ebu Talib, radijallahu anhu, rekao je: ‘Pitajte o čemu god hoćete.’ Ibn el-Kevva ustao je i rekao: ‘Šta je crnilo na Mjesecu?’ Odgovorio je: ‘Allah te ubio! Zašto nisi pitao o svojoj vjeri i budućem svijetu!’ Zatim je rekao: ‘To je brisanje noći.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: ime i nadimak prenosioca u izvoru glase رفيع، ابى كثيره; posljednja riječ zahtijeva provjeru čitanja, pa ovdje nije zamijenjena drugim poznatim imenom.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"76.4\" id=\"odlomak-76-4\">\u003cspan class=\"isnad\">Pričao nam je Zekerijja ibn Jahja ibn Eban el-Misri, koji je rekao: pričao nam je Ibn Ufejr, koji je rekao: pričao nam je Ibn Lehi‘a, od Hujejja ibn Abdullaha, od Ebu Abdurrahmana, od Abdullaha ibn Amra ibn el-Asa, \u003c/span>da je neki čovjek rekao Aliju, radijallahu anhu: „Šta je crnilo na Mjesecu?“ Odgovorio je: „Allah kaže: ‘I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"76.5\" id=\"odlomak-76-5\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Sa‘d, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je moj amidža, koji je rekao: pričao mi je moj otac, od svoga oca, od Ibn Abbasa, o Njegovim riječima: \u003c/span>„I\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":77,"html":"\u003csection class=\"page\" data-page=\"77\" id=\"stranica-77\">\u003ch2>Stranica 77\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 77\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"77.1\" id=\"ar-odlomak-77-1\">اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ» ، قَالَ: هُوَ السَّوَادُ بِاللَّيْلِ.\u003c/p>\u003cp data-pair=\"77.2\" id=\"ar-odlomak-77-2\">\u003cspan class=\"isnad\">حَدَّثَنَا الْقَاسِمُ، قَالَ: حدثنا الحسين، قال: حدثنا حجاج، عن ابن جُرَيْجٍ قَالَ: قَالَ ابْنُ عَبَّاسٍ: \u003c/span>كَانَ الْقَمَرُ يُضِيءُ كَمَا تُضِيءُ الشَّمْسُ، وَالْقَمَرُ آيَةُ اللَّيْلِ، والشمس آيه النهار، «فَمَحَوْنا آيَةَ اللَّيْلِ» ، قال: السواد الذي في القمر، كذلك خلقه الله.\u003c/p>\u003cp data-pair=\"77.3\" id=\"ar-odlomak-77-3\">\u003cspan class=\"isnad\">حَدَّثَنَا الْقَاسِمُ، قَالَ: حَدَّثَنِي الْحُسَيْنُ، قَالَ: حَدَّثَنِي حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، عَنْ مُجَاهِدٍ: \u003c/span>«وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ» ، قَالَ: لَيْلا وَنَهَارًا كَذَلِكَ خَلَقَهُمَا اللَّهُ عَزَّ وَجَلَّ.\u003c/p>\u003cp data-pair=\"77.4\" id=\"ar-odlomak-77-4\">قَالَ ابْنُ جُرَيْجٍ: \u003cspan class=\"isnad\">وَأَخْبَرَنَا عَبْدُ اللَّهِ بْنُ كَثِيرٍ، قَالَ: \u003c/span>«فَمَحَوْنا آيَةَ اللَّيْلِ وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، قَالَ: ظُلْمَةُ اللَّيْلِ وَسَدَفُ النَّهَارِ.\u003c/p>\u003cp data-pair=\"77.5\" id=\"ar-odlomak-77-5\">\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ: حَدَّثَنَا سَعِيدٌ عَنْ قَتَادَةَ، قوله عز وجل: \u003c/span>«وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ فَمَحَوْنا آيَةَ اللَّيْلِ» ، كنا نحدث أن محو آية الليل سواد القمر الذي فيه، «وَجَعَلْنا آيَةَ النَّهارِ مُبْصِرَةً» ، منيرة، وخلق الشمس أنور من القمر وأعظم.\u003c/p>\u003cp data-pair=\"77.6\" id=\"ar-odlomak-77-6\">\u003cspan class=\"isnad\">حدثنا محمد بن عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى وحدثني الحارث، قال: حدثنا الحسن، قال: حدثنا ورقاء، جميعا عن ابن أبي نجيح، عن مجاهد: \u003c/span>«وَجَعَلْنَا اللَّيْلَ وَالنَّهارَ آيَتَيْنِ» ، قال: ليلا ونهارا، كذلك جعلهما الله عز وجل\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 77\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"77.1\" id=\"odlomak-77-1\">noć i dan učinili smo dvama znakovima; znak noći izbrisali smo.“ Rekao je: „To je crnilo u noći.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"77.2\" id=\"odlomak-77-2\">\u003cspan class=\"isnad\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao nam je Hadždžadž, od Ibn Džurejdža, koji je rekao: Ibn Abbas je rekao: \u003c/span>„Mjesec je svijetlio kao što svijetli Sunce. Mjesec je znak noći, a Sunce znak dana. ‘Znak noći izbrisali smo.’“ Rekao je: „Crnilo koje je na Mjesecu — tako ga je Allah stvorio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"77.3\" id=\"odlomak-77-3\">\u003cspan class=\"isnad\">Pričao nam je Kasim, koji je rekao: pričao mi je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, od Mudžahida, \u003c/span>o riječima: „I noć i dan učinili smo dvama znakovima.“ Rekao je: „Noć i dan — tako ih je Allah, Silan i Uzvišen, stvorio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"77.4\" id=\"odlomak-77-4\">Ibn Džurejdž je rekao: „\u003cspan class=\"isnad\">Obavijestio nas je i Abdullah ibn Kesir.\u003c/span>“ Rekao je, o riječima: „Znak noći izbrisali smo, a znak dana učinili takvim da se pomoću njega vidi“: „Tama noći i sedef dana.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio. Napomena prevodioca: سدف النهار u izvoru nema potpune oznake za izgovor. Riječ „sedef“ ovdje je transliteracija tog arapskog izraza, a ne bosanski naziv za materijal. Čitanje i značenje ovog izraza u navedenom spoju nisu sigurno utvrđeni.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"77.5\" id=\"odlomak-77-5\">\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „I noć i dan učinili smo dvama znakovima; znak noći izbrisali smo.“ „Nama se prenosilo da je brisanje znaka noći crnilo koje je na Mjesecu. ‘A znak dana učinili takvim da se pomoću njega vidi’ — svijetlim. Sunce je stvorio svjetlijim i većim od Mjeseca.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Isra, 17:12, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"77.6\" id=\"odlomak-77-6\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa; a pričao mi je i Haris, koji je rekao: pričao nam je Hasen, koji je rekao: pričao nam je Verka — svi od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>o riječima: „I noć i dan učinili smo dvama znakovima.“ Rekao je: „Noć i dan — tako ih je Allah, Silan i Uzvišen, učinio.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Isra, 17:12, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"}],"book":[{"n":53,"ar":"تَفْخَرُ عَلَى الأَرْضِ، فَذَلِكَ قَوْلُهُ تَعَالَى: «وَأَلْقى فِي الْأَرْضِ رَواسِيَ أَنْ تَمِيدَ بِكُمْ*» .\n\nقال أبو جعفر: فقد أنبأ قول هؤلاء الذين ذكرت: إن الله تعالى أخرج من الماء دخانا حين أراد أن يخلق السموات والأرض، فسما عليه- يعنون بقولهم:\n\nفسما عليه علا على الماء، وكل شيء كان فوق شيء عاليا عليه فهو له سماء- ثم أيبس بعد ذلك الماء، فجعله أرضا واحدة- إن الله خلق السماء غير مسواة قبل الأرض، ثم خلق الأرض.\n\nوإن كان الأمر كما قال هؤلاء، فغير محال أن يكون الله تعالى أثار من الماء دخانا فعلاه على الماء، فكان له سماء، ثم ايبس الماء فصار الدخان الذي سما عليه أرضا، ولم يدحها، ولم يقدر فيها أقواتها، ولم يخرج منها ماءها ومرعاها، حتى استوى إلى السماء، التي هي الدخان الثائر من الماء العالي عليه، فسواهن سبع سموات، ثم دحا الأرض التي كانت ماء فيبسه ففتقه، فجعلها سبع أرضين، وقدر فيها أقواتها، و «أَخْرَجَ مِنْها ماءَها وَمَرْعاها وَالْجِبالَ أَرْساها» ، كما قال عز وجل فيكون كل الذي روي عن ابن عباس في ذلك- على ما رويناه- صحيحا معناه.\n\nوأما يوم الاثنين فقد ذكرنا اختلاف العلماء فيما خلق فيه، وما روي في ذلك عن رسول الله ص قبل.\n\nوأما ما خلق في يوم الثلاثاء والأربعاء، فقد ذكرنا أيضا بعض ما روي فيه، ونذكر في هذا الموضع بعض ما لم نذكر منه قبل.\n\nفالذي صح عندنا أنه خلق فيهما ما حَدَّثَنِي به موسى بن هارون، قال: حدثنا عمرو بن حماد، حدثنا أسباط، عن السدي، في خبر ذكره","bs":"\u003cp data-paragraph=\"53.1\">ponose nad Zemljom. To su Njegove, Uzvišeni je On, riječi: ‘I po Zemlji je postavio čvrste planine da se ne ljulja s vama.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: isti izraz nalazi se u En-Nahl, 16:15, i Lukman, 31:10. Izvor ovdje ne navodi broj ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"53.2\">Ebu Džafer kaže: Riječi ovih koje sam spomenuo — da je Uzvišeni Allah iz vode izveo dim kada je htio stvoriti nebesa i Zemlju, pa se dim uzvisio nad njom; pod riječima „uzvisio se nad njom“ misle da se podigao iznad vode, a sve što je iznad nečega i nad njim se uzdiže njemu je nebo; zatim je nakon toga osušio vodu i učinio je jednom zemljom — pokazuju da je Allah stvorio još neuređeno nebo prije Zemlje, a zatim je stvorio Zemlju.\u003c/p>\u003cp data-paragraph=\"53.3\">Ako je stvar onakva kako su ovi rekli, nije nemoguće da je Uzvišeni Allah iz vode podigao dim, uzvisio ga nad vodom i da joj je on bio nebo; zatim je osušio vodu, pa je dim koji se uzvisio nad njom postao zemljom. Nije je rasprostro, niti je na njoj odredio njenu opskrbu, niti je iz nje izveo njenu vodu i njene pašnjake, sve dok se nije usmjerio prema nebu, koje je dim podignut iz vode i uzdignut nad njom, i od njih sačinio sedam nebesa. Zatim je rasprostro Zemlju, koja je bila voda, pa ju je osušio, razdvojio i učinio je sedmerim zemljama, odredio na njoj njenu opskrbu i „iz nje izveo njenu vodu i njene pašnjake, a planine učvrstio“, kako je rekao On, Silan i Uzvišen. Tako je sve što je od Ibn Abbasa o tome preneseno — onako kako smo prenijeli — ispravnog značenja. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Naziat, 79:31–32. Napomena prevodioca: izvor doslovno kaže „pa je dim koji se uzvisio nad njom postao zemljom“ (فصار الدخان الذي سما عليه أرضا), što nije jasno usklađeno s prethodnim objašnjenjem o osušenoj vodi. Formulacija je sačuvana, bez prešutne ispravke; treba provjeriti štampano izdanje.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"53.4\">Što se tiče ponedjeljka, već smo ranije spomenuli razilaženje učenih o onome što je u njemu stvoreno i ono što je o tome preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem.\u003c/p>\u003cp data-paragraph=\"53.5\">Što se tiče onoga što je stvoreno u utorak i srijedu, već smo također spomenuli neke predaje o tome, a ovdje ćemo navesti neke koje ranije nismo naveli.\u003c/p>\u003cp data-paragraph=\"53.6\">Prema onome što je kod nas potvrđeno, u ta dva dana stvoreno je ono o čemu mi je pričao Musa ibn Harun: rekao je: pričao nam je Amr ibn Hammad: pričao nam je Esbat, od Suddija, u izvješću koje je naveo\u003c/p>","paragraphs":[{"id":"53.1","ar":"تَفْخَرُ عَلَى الأَرْضِ، فَذَلِكَ قَوْلُهُ تَعَالَى: «وَأَلْقى فِي الْأَرْضِ رَواسِيَ أَنْ تَمِيدَ بِكُمْ*» .","bs":"ponose nad Zemljom. To su Njegove, Uzvišeni je On, riječi: ‘I po Zemlji je postavio čvrste planine da se ne ljulja s vama.’“ ⟦Prijevod kur’anskog navoda: isti izraz nalazi se u En-Nahl, 16:15, i Lukman, 31:10. Izvor ovdje ne navodi broj ajeta.⟧","ar_ranges":[],"ar_html":"تَفْخَرُ عَلَى الأَرْضِ، فَذَلِكَ قَوْلُهُ تَعَالَى: «وَأَلْقى فِي الْأَرْضِ رَواسِيَ أَنْ تَمِيدَ بِكُمْ*» .","bs_ranges":[],"bs_html":"ponose nad Zemljom. To su Njegove, Uzvišeni je On, riječi: ‘I po Zemlji je postavio čvrste planine da se ne ljulja s vama.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: isti izraz nalazi se u En-Nahl, 16:15, i Lukman, 31:10. Izvor ovdje ne navodi broj ajeta.⟧\u003c/span>"},{"id":"53.2","ar":"قال أبو جعفر: فقد أنبأ قول هؤلاء الذين ذكرت: إن الله تعالى أخرج من الماء دخانا حين أراد أن يخلق السموات والأرض، فسما عليه- يعنون بقولهم:\n\nفسما عليه علا على الماء، وكل شيء كان فوق شيء عاليا عليه فهو له سماء- ثم أيبس بعد ذلك الماء، فجعله أرضا واحدة- إن الله خلق السماء غير مسواة قبل الأرض، ثم خلق الأرض.","bs":"Ebu Džafer kaže: Riječi ovih koje sam spomenuo — da je Uzvišeni Allah iz vode izveo dim kada je htio stvoriti nebesa i Zemlju, pa se dim uzvisio nad njom; pod riječima „uzvisio se nad njom“ misle da se podigao iznad vode, a sve što je iznad nečega i nad njim se uzdiže njemu je nebo; zatim je nakon toga osušio vodu i učinio je jednom zemljom — pokazuju da je Allah stvorio još neuređeno nebo prije Zemlje, a zatim je stvorio Zemlju.","ar_ranges":[],"ar_html":"قال أبو جعفر: فقد أنبأ قول هؤلاء الذين ذكرت: إن الله تعالى أخرج من الماء دخانا حين أراد أن يخلق السموات والأرض، فسما عليه- يعنون بقولهم:\n\nفسما عليه علا على الماء، وكل شيء كان فوق شيء عاليا عليه فهو له سماء- ثم أيبس بعد ذلك الماء، فجعله أرضا واحدة- إن الله خلق السماء غير مسواة قبل الأرض، ثم خلق الأرض.","bs_ranges":[],"bs_html":"Ebu Džafer kaže: Riječi ovih koje sam spomenuo — da je Uzvišeni Allah iz vode izveo dim kada je htio stvoriti nebesa i Zemlju, pa se dim uzvisio nad njom; pod riječima „uzvisio se na  العلماء فيما خلق فيه، وما روي في ذلك عن رسول الله ص قبل.","bs_ranges":[],"bs_html":"Što se tiče ponedjeljka, već smo ranije spomenuli razilaženje učenih o onome što je u njemu stvoreno i ono što je o tome preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem."},{"id":"53.5","ar":"وأما ما خلق في يوم الثلاثاء والأربعاء، فقد ذكرنا أيضا بعض ما روي فيه، ونذكر في هذا الموضع بعض ما لم نذكر منه قبل.","bs":"Što se tiče onoga što je stvoreno u utorak i srijedu, već smo također spomenuli neke predaje o tome, a ovdje ćemo navesti neke koje ranije nismo naveli.","ar_ranges":[],"ar_html":"وأما ما خلق في يوم الثلاثاء والأربعاء، فقد ذكرنا أيضا بعض ما روي فيه، ونذكر في هذا الموضع بعض ما لم نذكر منه قبل.","bs_ranges":[],"bs_html":"Što se tiče onoga što je stvoreno u utorak i srijedu, već smo također spomenuli neke predaje o tome, a ovdje ćemo navesti neke koje ranije nismo naveli."},{"id":"53.6","ar":"فالذي صح عندنا أنه خلق فيهما ما حَدَّثَنِي به موسى بن هارون، قال: حدثنا عمرو بن حماد، حدثنا أسباط، عن السدي، في خبر ذكره","bs":"Prema onome što je kod nas potvrđeno, u ta dva dana stvoreno je ono o čemu mi je pričao Musa ibn Harun: rekao je: pričao nam je Amr ibn Hammad: pričao nam je Esbat, od Suddija, u izvješću koje je naveo","ar_ranges":[[32,120]],"ar_html":"فالذي صح عندنا أنه خلق فيهما ما \u003cspan class=\"isnad\">حَدَّثَنِي به موسى بن هارون، قال: حدثنا عمرو بن حماد، حدثنا أسباط، عن السدي، في خبر ذكره\u003c/span>","bs_ranges":[[75,201]],"bs_html":"Prema onome što je kod nas potvrđeno, u ta dva dana stvoreno je ono o čemu \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun: rekao je: pričao nam je Amr ibn Hammad: pričao nam je Esbat, od Suddija, u izvješću koje je naveo\u003c/span>"}],"notes":[]},{"n":54,"ar":"عن أبي مالك، وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن عبد الله بن مسعود- وعن ناس من أصحاب رسول الله ص:\n\nوخلق الجبال فيها- يعني في الأرض- وأقوات أهلها وشجرها وما ينبغي لها في يومين: في الثلاثاء والأربعاء، وذلك حين يقول الله عز وجل: «قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ» ، يقول: من سأل فهكذا الأمر، ثم استوى إِلَى السَّمَاءِ وَهِيَ دُخَانٌ، وكان ذلك الدخان من تنفس الماء حين تنفس، فجعلها سماء واحدة، ثم فتقها فجعلها سبع سموات في يومين في الخميس والجمعة.\n\nحَدَّثَنِي الْمُثَنَّى، قَالَ: حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، قَالَ: إِنَّ اللَّهَ تَعَالَى خَلَقَ الأَقْوَاتَ وَالرَّوَاسِيَ فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ.\n\nحَدَّثَنِي تميم بن المنتصر، قال: أخبرنا إسحاق، عن شَرِيكٍ، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\nإِنَّ اللَّهَ تَعَالَى خَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ فَذَلِكَ قَوْلُ النَّاسِ: هُوَ يَوْمٌ ثَقِيلٌ.\n\nقال أبو جعفر: والصواب من القول في ذلك عندنا، ما رويناه [عن النبي ص، قال: إن الله تعالى خلق يوم الثلاثاء الجبال وما فيهن من المنافع، وخلق يوم الأربعاء الشجر، والماء، والمدائن، والعمران، والخراب] حَدَّثَنَا بِذَلِكَ هَنَّادٌ، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عن ابن عباس، عن النبي ص.\n\nوقد روى عن النبي ص أَنَّ اللَّهَ خَلَقَ الْجِبَالَ يَوْمَ الأَحَدِ، وَالشَّجَرَ يَوْمَ الاثْنَيْنِ، وَخَلَقَ الْمَكْرُوهَ يَوْمَ الثُّلاثَاءِ، وَالنُّورَ يوم الأربعاء،","bs":"\u003cp data-paragraph=\"54.1\">od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem:\u003c/p>\u003cp data-paragraph=\"54.2\">„Na njoj — misli se na Zemlju — stvorio je planine, opskrbu njenih stanovnika, njeno drveće i ono što joj treba u dva dana: u utorak i srijedu. To je ono kada Allah, Silan i Uzvišen, kaže: ‘Reci: Zar vi doista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova! Na njoj je, povrh nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu opskrbu u četiri dana, jednako za one koji pitaju.’ Kaže: Ko pita, stvar je takva. Zatim se usmjerio prema nebu, a ono je bilo dim. Taj je dim potekao od isparavanja vode kada je isparavala. Učinio ga je jednim nebom, zatim ga razdvojio i učinio ga sedmerim nebesima u dva dana: u četvrtak i petak.“ \u003cspan class=\"translator-note\">⟦Prijevod izdvojenog kur’anskog navoda: Fussilet, 41:9–10.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"54.3\">Pričao mi je Musenna: rekao je: pričao nam je Ebu Salih: rekao je: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, koji je rekao: „Uzvišeni Allah stvorio je opskrbu i čvrste planine u utorak i srijedu.“\u003c/p>\u003cp data-paragraph=\"54.4\">Pričao mi je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Uzvišeni Allah stvorio je planine u utorak. Otuda riječi ljudi: ‘To je težak dan.’“\u003c/p>\u003cp data-paragraph=\"54.5\">Ebu Džafer kaže: Ispravno mišljenje o tome kod nas jeste ono što smo prenijeli od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Uzvišeni Allah stvorio je u utorak planine i koristi koje su u njima, a u srijedu je stvorio drveće, vodu, gradove, nastanjenost i opustjelost.“ To nam je pričao Hennad: rekao je: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/p>\u003cp data-paragraph=\"54.6\">Od Vjerovjesnika, sallallahu alejhi ve sellem, preneseno je i da je Allah stvorio planine u nedjelju, drveće u ponedjeljak, ono što je neugodno u utorak, a svjetlost u srijedu.\u003c/p>","paragraphs":[{"id":"54.1","ar":"عن أبي مالك، وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن عبد الله بن مسعود- وعن ناس من أصحاب رسول الله ص:","bs":"od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem:","ar_ranges":[[0,109]],"ar_html":"\u003cspan class=\"isnad\">عن أبي مالك، وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن عبد الله بن مسعود- وعن ناس من أصحاب رسول الله ص:\u003c/span>","bs_ranges":[[0,165]],"bs_html":"\u003cspan class=\"isnad\">od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem:\u003c/span>"},{"id":"54.2","ar":"وخلق الجبال فيها- يعني في الأرض- وأقوات أهلها وشجرها وما ينبغي لها في يومين: في الثلاثاء والأربعاء، وذلك حين يقول الله عز وجل: «قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ» ، يقول: من سأل فهكذا الأمر، ثم استوى إِلَى السَّمَاءِ وَهِيَ دُخَانٌ، وكان ذلك الدخان من تنفس الماء حين تنفس، فجعلها سماء واحدة، ثم فتقها فجعلها سبع سموات في يومين في الخميس والجمعة.","bs":"„Na njoj — misli se na Zemlju — stvorio je planine, opskrbu njenih stanovnika, njeno drveće i ono što joj treba u dva dana: u utorak i srijedu. To je ono kada Allah, Silan i Uzvišen, kaže: ‘Reci: Zar vi doista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova! Na njoj je, povrh nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu opskrbu u četiri dana, jednako za one koji pitaju.’ Kaže: Ko pita, stvar je takva. Zatim se usmjerio prema nebu, a ono je bilo dim. Taj je dim potekao od isparavanja vode kada je isparavala. Učinio ga je jednim nebom, zatim ga razdvojio i učinio ga sedmerim nebesima u dva dana: u četvrtak i petak.“ ⟦Prijevod izdvojenog kur’anskog navoda: Fussilet, 41:9–10.⟧","ar_ranges":[],"ar_html":"وخلق الجبال فيها- يعني في الأرض- وأقوات أهلها وشجرها وما ينبغي لها في يومين: في الثلاثاء والأربعاء، وذلك حين يقول الله عز وجل: «قُلْ أَإِنَّكُمْ لَتَكْفُرُونَ بِالَّذِي خَلَقَ الْأَرْضَ فِي يَوْمَيْنِ وَتَجْعَلُونَ لَهُ أَنْداداً ذلِكَ رَبُّ الْعالَمِينَ وَجَعَلَ فِيها رَواسِيَ مِنْ فَوْقِها وَبارَكَ فِيها وَقَدَّرَ فِيها أَقْواتَها فِي أَرْبَعَةِ أَيَّامٍ سَواءً لِلسَّائِلِينَ» ، يقول: من سأل فهكذا الأمر، ثم استوى إِلَى السَّمَاءِ وَهِيَ دُخَانٌ، وكان ذلك الدخان من تنفس الماء حين تنفس، فجعلها سماء واحدة، ثم فتقها فجعلها سبع سموات في يومين في الخميس والجمعة.","bs_ranges":[],"bs_html":"„Na njoj — misli se na Zemlju — stvorio je planine, opskrbu njenih stanovnika, njeno drveće i ono što joj treba u dva dana: u utorak i srijedu. To je ono kada Allah, Silan i Uzvišen, kaže: ‘Reci: Zar vi doista ne vjerujete u Onoga koji je Zemlju stvorio u dva dana i pripisujete Mu ravne? To je Gospodar svjetova! Na njoj je, povrh nje, postavio čvrste planine, blagoslovio je i odredio na njoj njenu opskrbu u četiri dana, jednako za one koji pitaju.’ Kaže: Ko pita, stvar je takva. Zatim se usmjerio prema nebu, a ono je bilo dim. Taj je dim potekao od isparavanja vode kada je isparavala. Učinio ga je jednim nebom, zatim ga razdvojio i učinio ga sedmerim nebesima u dva dana: u četvrtak i petak.“ \u003cspan class=\"translator-note\">⟦Prijevod izdvojenog kur’anskog navoda: Fussilet, 41:9–10.⟧\u003c/span>"},{"id":"54.3","ar":"حَدَّثَنِي الْمُثَنَّى، قَالَ: حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، قَالَ: إِنَّ اللَّهَ تَعَالَى خَلَقَ الأَقْوَاتَ وَالرَّوَاسِيَ فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ.","bs":"Pričao mi je Musenna: rekao je: pričao nam je Ebu Salih: rekao je: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, koji je rekao: „Uzvišeni Allah stvorio je opskrbu i čvrste planine u utorak i srijedu.“","ar_ranges":[[0,164]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى، قَالَ: حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ تَعَالَى خَلَقَ الأَقْوَاتَ وَالرَّوَاسِيَ فِي الثُّلاثَاءِ وَالأَرْبِعَاءِ.","bs_ranges":[[0,156]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musenna: rekao je: pričao nam je Ebu Salih: rekao je: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, koji je rekao: \u003c/span>„Uzvišeni Allah stvorio je opskrbu i čvrste planine u utorak i srijedu.“"},{"id":"54.4","ar":"حَدَّثَنِي تميم بن المنتصر، قال: أخبرنا إسحاق، عن شَرِيكٍ، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\nإِنَّ اللَّهَ تَعَالَى خَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ فَذَلِكَ قَوْلُ النَّاسِ: هُوَ يَوْمٌ ثَقِيلٌ.","bs":"Pričao mi je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Uzvišeni Allah stvorio je planine u utorak. Otuda riječi ljudi: ‘To je težak dan.’“","ar_ranges":[[0,147]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي تميم بن المنتصر، قال: أخبرنا إسحاق، عن شَرِيكٍ، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\n\u003c/span>إِنَّ اللَّهَ تَعَالَى خَلَقَ الْجِبَالَ يَوْمَ الثُّلاثَاءِ فَذَلِكَ قَوْلُ النَّاسِ: هُوَ يَوْمٌ ثَقِيلٌ.","bs_ranges":[[0,159]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Temim ibn el-Muntesir: rekao je: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: \u003c/span>„Uzvišeni Allah stvorio je planine u utorak. Otuda riječi ljudi: ‘To je težak dan.’“"},{"id":"54.5","ar":"قال أبو جعفر: والصواب من القول في ذلك عندنا، ما رويناه [عن النبي ص، قال: إن الله تعالى خلق يوم الثلاثاء الجبال وما فيهن من المنافع، وخلق يوم الأربعاء الشجر، والماء، والمدائن، والعمران، والخراب] حَدَّثَنَا بِذَلِكَ هَنَّادٌ، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عن ابن عباس، عن النبي ص.","bs":"Ebu Džafer kaže: Ispravno mišljenje o tome kod nas jeste ono što smo prenijeli od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Uzvišeni Allah stvorio je u utorak planine i koristi koje su u njima, a u srijedu je stvorio drveće, vodu, gradove, nastanjenost i opustjelost.“ To nam je pričao Hennad: rekao je: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem.","ar_ranges":[[194,325]],"ar_html":"قال أبو جعفر: والصواب من القول في ذلك عندنا، ما رويناه [عن النبي ص، قال: إن الله تعالى خلق يوم الثلاثاء الجبال وما فيهن من المنافع، وخلق يوم الأربعاء الشجر، والماء، والمدائن، والعمران، والخراب] \u003cspan class=\"isnad\">حَدَّثَنَا بِذَلِكَ هَنَّادٌ، قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عن ابن عباس، عن النبي ص.\u003c/span>","bs_ranges":[[288,451]],"bs_html":"Ebu Džafer kaže: Ispravno mišljenje o tome kod nas jeste ono što smo prenijeli od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Uzvišeni Allah stvorio je u utorak planine i koristi koje su u njima, a u srijedu je stvorio drveće, vodu, gradove, nastanjenost i opustjelost.“ To \u003cspan class=\"isnad\">nam je pričao Hennad: rekao je: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/span>"},{"id":"54.6","ar":"وقد روى عن النبي ص أَنَّ اللَّهَ خَلَقَ الْجِبَالَ يَوْمَ الأَحَدِ، وَالشَّجَرَ يَوْمَ الاثْنَيْنِ، وَخَلَقَ الْمَكْرُوهَ يَوْمَ الثُّلاثَاءِ، وَالنُّورَ يوم الأربعاء،","bs":"Od Vjerovjesnika, sallallahu alejhi ve sellem, preneseno je i da je Allah stvorio planine u nedjelju, drveće u ponedjeljak, ono što je neugodno u utorak, a svjetlost u srijedu.","ar_ranges":[],"ar_html":"وقد روى عن النبي ص أَنَّ اللَّهَ خَلَقَ الْجِبَالَ يَوْمَ الأَحَدِ، وَالشَّجَرَ يَوْمَ الاثْنَيْنِ، وَخَلَقَ الْمَكْرُوهَ يَوْمَ الثُّلاثَاءِ، وَالنُّورَ يوم الأربعاء،","bs_ranges":[],"bs_html":"Od Vjerovjesnika, sallallahu alejhi ve sellem, preneseno je i da je Allah stvorio planine u nedjelju, drveće u ponedjeljak, ono što je neugodno u utorak, a svjetlost u srijedu."}],"notes":[]},{"n":55,"ar":"حَدَّثَنِي به القاسم بن بشر بن معروف، والحسين بن علي الصدائي، قالا:\n\nحدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مولى أم سلمة، عن أبي هريرة، عن النبي ص.\n\nوالخبر الأول أصح مخرجا، وأولى بالحق، لأنه قول أكثر السلف.\n\nوأما يوم الخميس فإنه خلق فيه السموات، ففتقت بعد أن كانت رتقا، كما حَدَّثَنِي موسى بن هارون، قال: حدثنا عمرو بن حماد، قال:\n\nحدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك، وعن أبي صالح عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب النبي ص: «ثُمَّ اسْتَوى إِلَى السَّماءِ وَهِيَ دُخانٌ» ، وكان ذلك الدخان من تنفس الماء حين تنفس وجعلها سماء واحدة، ثم فتقها فجعلها سبع سموات في يومين، في الخميس والجمعة.\n\nوإنما سمي يوم الجمعة لأنه جمع فيه خلق السموات والأرض «وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها» قال: خلق في كل سماء خلقها من الملائكة، والخلق الذي فيها من البحار وجبال البرد وما لم يعلم، ثم زين السماء الدنيا بالكواكب، فجعلها زينة وحفظا، تحفظ من الشياطين، فلما فرغ من خلق ما أحب استوى على العرش فذلك حين يقول: «خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ*» ، ويقول:\n\n«كانَتا رَتْقاً فَفَتَقْناهُما» .\n\nحَدَّثَنِي الْمُثَنَّى، حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، قَالَ: إِنَّ اللَّهَ تَعَالَى خَلَقَ السَّمَوَاتِ فِي الْخَمِيسِ وَالْجُمُعَةِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ،","bs":"\u003cp data-paragraph=\"55.1\">To su mi pričali Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/p>\u003cp data-paragraph=\"55.2\">Prva predaja ima vjerodostojniji put prenošenja i bliža je istini jer predstavlja mišljenje većine prethodnika.\u003c/p>\u003cp data-paragraph=\"55.3\">Što se tiče četvrtka, u njemu je stvorio nebesa, pa su razdvojena nakon što su bila spojena, kako mi je pričao Musa ibn Harun: rekao je: pričao nam je Amr ibn Hammad: rekao je: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: „Zatim se usmjerio prema nebu, a ono je bilo dim.“ Taj dim potekao je od isparavanja vode kada je isparavala. Učinio ga je jednim nebom, zatim ga razdvojio i učinio ga sedmerim nebesima u dva dana, u četvrtak i petak. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Fussilet, 41:11, dio ajeta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"55.4\">Petak je nazvan jevmul-džumu‘a jer je u njemu objedinjeno stvaranje nebesa i Zemlje. „I svakome nebu objavio je njegovu odredbu.“ Rekao je: „Na svakom nebu stvorio je njegove meleke i stvorenja koja su na njemu: mora, planine od grada i ono što nije poznato. Zatim je najbliže nebo ukrasio nebeskim tijelima, učinio ih ukrasom i zaštitom koja štiti od šejtana. Kada je dovršio stvaranje onoga što je htio, uzvisio se nad Aršom. To je ono kada kaže: ‘Stvorio je nebesa i Zemlju u šest dana’, i kada kaže: ‘Bili su spojena cjelina, pa smo ih razdvojili.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda, redom: Fussilet, 41:12, dio ajeta; izraz o stvaranju u šest dana javlja se na više mjesta, između ostalog u El-A‘raf, 7:54, i Hud, 11:7; El-Enbija, 21:30, dio ajeta. „Planine od grada“ ovdje znači planine od ledenih zrna; navedeno je dio predaje.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"55.5\">Pričao mi je Musenna: pričao nam je Ebu Salih: rekao je: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, koji je rekao: „Uzvišeni Allah stvorio je nebesa u četvrtak i petak i dovršio je u posljednjem satu petka,\u003c/p>\u003cp class=\"small\" style=\"color:#53675c\">Ova predaja nastavlja se na izvornoj stranici 56.\u003c/p>","paragraphs":[{"id":"55.1","ar":"حَدَّثَنِي به القاسم بن بشر بن معروف، والحسين بن علي الصدائي، قالا:\n\nحدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مولى أم سلمة، عن أبي هريرة، عن النبي ص.","bs":"To su mi pričali Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem.","ar_ranges":[[0,195]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي به القاسم بن بشر بن معروف، والحسين بن علي الصدائي، قالا:\n\nحدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن أمية، عن أيوب بن خالد، عن عبد الله بن رافع مولى أم سلمة، عن أبي هريرة، عن النبي ص.\u003c/span>","bs_ranges":[[88,304]],"bs_html":"To su mi pričali Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: \u003cspan class=\"isnad\">pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem.\u003c/span>"},{"id":"55.2","ar":"والخبر الأول أصح مخرجا، وأولى بالحق، لأنه قول أكثر السلف.","bs":"Prva predaja ima vjerodostojniji put prenošenja i bliža je istini jer predstavlja mišljenje većine prethodnika.","ar_ranges":[],"ar_html":"والخبر الأول أصح مخرجا، وأولى بالحق، لأنه قول أكثر السلف.","bs_ranges":[],"bs_html":"Prva predaja ima vjerodostojniji put prenošenja i bliža je istini jer predstavlja mišljenje većine prethodnika."},{"id":"55.3","ar":"وأما يوم الخميس فإنه خلق فيه السموات، ففتقت بعد أن كانت رتقا، كما حَدَّثَنِي موسى بن هارون، قال: حدثنا عمرو بن حماد، قال:\n\nحدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك، وعن أبي صالح عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب النبي ص: «ثُمَّ اسْتَوى إِلَى السَّماءِ وَهِيَ دُخانٌ» ، وكان ذلك الدخان من تنفس الماء حين تنفس وجعلها سماء واحدة، ثم فتقها فجعلها سبع سموات في يومين، في الخميس والجمعة.","bs":"Što se tiče četvrtka, u njemu je stvorio nebesa, pa su razdvojena nakon što su bila spojena, kako mi je pričao Musa ibn Harun: rekao je: pričao nam je Amr ibn Hammad: rekao je: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: „Zatim se usmjerio prema nebu, a ono je bilo dim.“ Taj dim potekao je od isparavanja vode kada je isparavala. Učinio ga je jednim nebom, zatim ga razdvojio i učinio ga sedmerim nebesima u dva dana, u četvrtak i petak. ⟦Prijevod kur’anskog navoda: Fussilet, 41:11, dio ajeta.⟧","ar_ranges":[[66,262]],"ar_html":"وأما يوم الخميس فإنه خلق فيه السموات، ففتقت بعد أن كانت رتقا، كما \u003cspan class=\"isnad\">حَدَّثَنِي موسى بن هارون، قال: حدثنا عمرو بن حماد، قال:\n\nحدثنا أسباط، عن السدي، في خبر ذكره عن أبي مالك، وعن أبي صالح عن ابن عباس- وعن مرة الهمداني عن عبد الله بن مسعود- وعن ناس من اصحاب النبي ص: \u003c/span>«ثُمَّ اسْتَوى إِلَى السَّماءِ وَهِيَ دُخانٌ» ، وكان ذلك الدخان من تنفس الماء حين تنفس وجعلها سماء واحدة، ثم فتقها فجعلها سبع سموات في يومين، في الخميس والجمعة.","bs_ranges":[[98,395]],"bs_html":"Što se tiče četvrtka, u njemu je stvorio nebesa, pa su razdvojena nakon što su bila spojena, kako \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun: rekao je: pričao nam je Amr ibn Hammad: rekao je: pričao nam je Esbat, od Suddija, u izvješću koje je naveo od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Abdullaha ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem: \u003c/span>„Zatim se usmjerio prema nebu, a ono je bilo dim.“ Taj dim potekao je od isparavanja vode kada je isparavala. Učinio ga je jednim nebom, zatim ga razdvojio i učinio ga sedmerim nebesima u dva dana, u četvrtak i petak. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Fussilet, 41:11, dio ajeta.⟧\u003c/span>"},{"id":"55.4","ar":"وإنما سمي يوم الجمعة لأنه جمع فيه خلق السموات والأرض «وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها» قال: خلق في كل سماء خلقها من الملائكة، والخلق الذي فيها من البحار وجبال البرد وما لم يعلم، ثم زين السماء الدنيا بالكواكب، فجعلها زينة وحفظا، تحفظ من الشياطين، فلما فرغ من خلق ما أحب استوى على العرش فذلك حين يقول: «خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ*» ، ويقول:\n\n«كانَتا رَتْقاً فَفَتَقْناهُما» .","bs":"Petak je nazvan jevmul-džumu‘a jer je u njemu objedinjeno stvaranje nebesa i Zemlje. „I svakome nebu objavio je njegovu odredbu.“ Rekao je: „Na svakom nebu stvorio je njegove meleke i stvorenja koja su na njemu: mora, planine od grada i ono što nije poznato. Zatim je najbliže nebo ukrasio nebeskim tijelima, učinio ih ukrasom i zaštitom koja štiti od šejtana. Kada je dovršio stvaranje onoga što je htio, uzvisio se nad Aršom. To je ono kada kaže: ‘Stvorio je nebesa i Zemlju u šest dana’, i kada kaže: ‘Bili su spojena cjelina, pa smo ih razdvojili.’“ ⟦Prijevodi kur’anskih navoda, redom: Fussilet, 41:12, dio ajeta; izraz o stvaranju u šest dana javlja se na više mjesta, između ostalog u El-A‘raf, 7:54, i Hud, 11:7; El-Enbija, 21:30, dio ajeta. „Planine od grada“ ovdje znači planine od ledenih zrna; navedeno je dio predaje.⟧","ar_ranges":[],"ar_html":"وإنما سمي يوم الجمعة لأنه جمع فيه خلق السموات والأرض «وَأَوْحى فِي كُلِّ سَماءٍ أَمْرَها» قال: خلق في كل سماء خلقها من الملائكة، والخلق الذي فيها من البحار وجبال البرد وما لم يعلم، ثم زين السماء الدنيا بالكواكب، فجعلها زينة وحفظا، تحفظ من الشياطين، فلما فرغ من خلق ما أحب استوى على العرش فذلك حين يقول: «خَلَقَ السَّماواتِ وَالْأَرْضَ فِي سِتَّةِ أَيَّامٍ*» ، ويقول:\n\n«كانَتا رَتْقاً فَفَتَقْناهُما» .","bs_ranges":[],"bs_html":"Petak je nazvan jevmul-džumu‘a jer je u njemu objedinjeno stvaranje nebesa i Zemlje. „I svakome nebu objavio je njegovu odredbu.“ Rekao je: „Na svakom nebu stvorio je njegove meleke i stvorenja koja su na njemu: mora, planine od grada i ono što nije poznato. Zatim je najbliže nebo ukrasio nebeskim tijelima, učinio ih ukrasom i zaštitom koja štiti od šejtana. Kada je dovršio stvaranje onoga što je htio, uzvisio se nad Aršom. To je ono kada kaže: ‘Stvorio je nebesa i Zemlju u šest dana’, i kada kaže: ‘Bili su spojena cjelina, pa smo ih razdvojili.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda, redom: Fussilet, 41:12, dio ajeta; izraz o stvaranju u šest dana javlja se na više mjesta, između ostalog u El-A‘raf, 7:54, i Hud, 11:7; El-Enbija, 21:30, dio ajeta. „Planine od grada“ ovdje znači planine od ledenih zrna; navedeno je dio predaje.⟧\u003c/span>"},{"id":"55.5","ar":"حَدَّثَنِي الْمُثَنَّى، حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، قَالَ: إِنَّ اللَّهَ تَعَالَى خَلَقَ السَّمَوَاتِ فِي الْخَمِيسِ وَالْجُمُعَةِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ،","bs":"Pričao mi je Musenna: pričao nam je Ebu Salih: rekao je: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, koji je rekao: „Uzvišeni Allah stvorio je nebesa u četvrtak i petak i dovršio je u posljednjem satu petka,","ar_ranges":[[0,157]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي الْمُثَنَّى، حَدَّثَنَا أَبُو صَالِحٍ، قَالَ: حَدَّثَنِي أَبُو مَعْشَرٍ، عَنْ سَعِيدِ بْنِ أَبِي سَعِيدٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ تَعَالَى خَلَقَ السَّمَوَاتِ فِي الْخَمِيسِ وَالْجُمُعَةِ، وَفَرَغَ فِي آخِرِ سَاعَةٍ مِنْ يَوْمِ الْجُمُعَةِ،","bs_ranges":[[0,146]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Musenna: pričao nam je Ebu Salih: rekao je: pričao mi je Ebu Ma‘šer, od Seida ibn Ebu Seida, od Abdullaha ibn Selama, koji je rekao: \u003c/span>„Uzvišeni Allah stvorio je nebesa u četvrtak i petak i dovršio je u posljednjem satu petka,"}],"notes":[]},{"n":56,"ar":"فَخَلَقَ فِيهَا آدَمَ عَلَى عَجَلٍ، فَتِلْكَ السَّاعَةُ التي تقوم فيها الساعة.\nحدثني تميم بن المنتصر، قال: أخبرنا إسحاق، عَنْ شَرِيكٍ، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّهَ تَعَالَى خَلَقَ مَوَاضِعَ الأَنْهَارِ والشجر يوم الأربعاء، وخلق الطير والوحوش وَالْهَوَامَّ وَالسِّبَاعَ يَوْمَ الْخَمِيسِ، وَخَلَقَ الإِنْسَانَ يَوْمَ الْجُمُعَةِ، فَفَرَغَ مِنْ خَلْقِ كُلِّ شَيْءٍ يَوْمَ الْجُمُعَةِ وهذا الذي قاله من ذكرنا قوله، من أن الله عز وجل خلق السموات والملائكة وآدم في يوم الخميس والجمعة، هو الصحيح عندنا، للخبر الذي حَدَّثَنَا بِهِ هَنَّادُ بن السري قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عن ابن عباس، عن النبي ص- قَالَ:\nهَنَّادٌ، وَقَرَأْتُ سَائِرَ الْحَدِيثِ- قَالَ: وَخَلَقَ يَوْمَ الْخَمِيسِ السَّمَاءَ، وَخَلَقَ يَوْمَ الْجُمُعَةِ النُّجُومَ وَالشَّمْسَ وَالْقَمَرَ وَالْمَلائِكَةَ إِلَى ثَلاثِ سَاعَاتٍ بَقِيَتْ مِنْهُ، فَخَلَقَ فِي أَوَّلِ سَاعَةٍ مِنْ هَذِهِ الثَّلاثِ سَاعَاتِ الآجَالَ، مَنْ يَحْيَا وَمَنْ يَمُوتُ، وَفِي الثَّانِيَةِ أَلْقَى الآفَةَ عَلَى كُلِّ شَيْءٍ مِمَّا يَنْتَفِعُ بِهِ النَّاسُ، وَفِي الثَّالِثَةِ آدَمَ وَأَسْكَنَهُ الْجَنَّةَ، وَأَمَرَ إِبْلِيسَ بِالسُّجُودِ، وَأَخْرَجَهُ مِنْهَا فِي آخِرِ سَاعَةٍ.\nحَدَّثَنِي الْقَاسِمُ بْنُ بِشْرِ بن معروف، والحسين بن علي الصدائي، قالا: حدثنا حجاج، قال ابن جريج: أخبرني إسماعيل بن اميه، عن أيوب ابن خالد، عن عبد الله بن رافع مولى أُمِّ سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [أَخَذَ رسول الله ص بِيَدِي فَقَالَ: وَبَثَّ فِيهَا- يَعْنِي فِي الأَرْضِ- الدَّوَابَّ يَوْمَ الْخَمِيسِ، وَخَلَقَ آدَمَ بَعْدَ الْعَصْرِ مِنْ يَوْمِ الْجُمُعَةِ آخِرَ خَلْقٍ فِي آخِرِ سَاعَةٍ، مِنْ سَاعَاتِ الْجُمُعَةِ فِيمَا بَيْنَ الْعَصْرِ الى الليل] .\nفإذا كان الله تعالى ذكره خلق الخلق من لدن ابتداء خلق السموات والأرض إلى حين فراغه من خلق جميعهم في ستة أيام، وكان كل يوم من","bs":"\u003cp class=\"small\" style=\"color:#53675c\">Početak stranice nastavlja predaju sa stranice 55.\u003c/p>\u003cp data-paragraph=\"56.1\">pa je u njemu u žurbi stvorio Adema. To je sat u kojem će nastupiti Čas.“\u003c/p>\u003cp data-paragraph=\"56.2\">Pričao mi je Temim ibn el-Muntesir, koji je rekao: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Uzvišeni Allah stvorio je mjesta rijeka i drveće u srijedu, a ptice, divlje životinje, gmizavce i zvijeri u četvrtak. Čovjeka je stvorio u petak i u petak je dovršio stvaranje svega.“\u003c/p>\u003cp data-paragraph=\"56.3\">Ono što su rekli oni čije smo riječi spomenuli — da je Allah, Silan i Uzvišen, stvorio nebesa, meleke i Adema u četvrtak i petak — kod nas je ispravno, zbog predaje koju nam je pričao Hennad ibn es-Serijj, koji je rekao: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem — Hennad je rekao: „Ostatak hadisa sam pročitao“ — da je rekao: „U četvrtak je stvorio nebo, a u petak je stvarao zvijezde, Sunce, Mjesec i meleke, do preostala tri sata toga dana. U prvom od ta tri sata stvorio je rokove života, ko će živjeti i ko će umrijeti. U drugom je pustio nedaću na sve čime se ljudi koriste. U trećem je stvorio Adema, nastanio ga u Džennetu, naredio Iblisu da učini sedždu i izveo ga iz njega u posljednjem satu.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: zamjenica u „izveo ga iz njega“ prenosi arapsko وأخرجه منها; samo ovo mjesto ne razrješava izričito na koga se „ga“ odnosi.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"56.4\">Pričali su mi Kasim ibn Bišr ibn Ma‘ruf i Husejn ibn Ali es-Sudai; obojica su rekli: pričao nam je Hadždžadž. Ibn Džurejdž je rekao: obavijestio me Ismail ibn Umejja, od Ejjuba ibn Halida, od Abdullaha ibn Rafia, oslobođenika Ummu Seleme, od Ebu Hurejre, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, uzeo me za ruku i rekao: ‘Po njoj — misli se na Zemlju — rasijao je životinje u četvrtak, a Adema je stvorio poslije ikindije u petak, kao posljednje stvorenje, u posljednjem satu petka, između ikindije i noći.’“\u003c/p>\u003cp data-paragraph=\"56.5\">Ako je Allah, Uzvišen je spomen Njegov, stvorio stvorenja od početka stvaranja nebesa i Zemlje do dovršetka stvaranja svih njih u šest dana, a svaki od\u003c/p>","paragraphs":[{"id":"56.1","ar":"فَخَلَقَ فِيهَا آدَمَ عَلَى عَجَلٍ، فَتِلْكَ السَّاعَةُ التي تقوم فيها الساعة.","bs":"pa je u njemu u žurbi stvorio Adema. To je sat u kojem će nastupiti Čas.“","ar_ranges":[],"ar_html":"فَخَلَقَ فِيهَا آدَمَ عَلَى عَجَلٍ، فَتِلْكَ السَّاعَةُ التي تقوم فيها الساعة.","bs_ranges":[],"bs_html":"pa je u njemu u žurbi stvorio Adema. To je sat u kojem će nastupiti Čas.“"},{"id":"56.2","ar":"حدثني تميم بن المنتصر، قال: أخبرنا إسحاق، عَنْ شَرِيكٍ، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ اللَّهَ تَعَالَى خَلَقَ مَوَاضِعَ الأَنْهَارِ والشجر يوم الأربعاء، وخلق الطير والوحوش وَالْهَوَامَّ وَالسِّبَاعَ يَوْمَ الْخَمِيسِ، وَخَلَقَ الإِنْسَانَ يَوْمَ الْجُمُعَةِ، فَفَرَغَ مِنْ خَلْقِ كُلِّ شَيْءٍ يَوْمَ الْجُمُعَةِ","bs":"Pričao mi je Temim ibn el-Muntesir, koji je rekao: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha, od Ibn Abbasa, koji je rekao: „Uzvišeni Allah stvorio je mjesta rijeka i drveće u srijedu, a ptice, divlje životinje, gmizavce i zvijeri u četvrtak. Čovjeka je stvorio u petak i u petak je dovršio stvaranje svega.“","ar_ranges":[[0,143]],"ar_html":"\u003cspan class=\"isnad\">حدثني تميم بن المنتصر، قال: أخبرنا إسحاق، عَنْ شَرِيكٍ، عَنْ غَالِبِ بْنِ غَلابٍ، عَنْ عَطَاءِ بْنِ أَبِي رَبَاحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ اللَّهَ تَعَالَى خَلَقَ مَوَاضِعَ الأَنْهَارِ والشجر يوم الأربعاء، وخلق الطير والوحوش وَالْهَوَامَّ وَالسِّبَاعَ يَوْمَ الْخَمِيسِ، وَخَلَقَ الإِنْسَانَ يَوْمَ الْجُمُعَةِ، فَفَرَغَ مِنْ خَلْقِ كُلِّ شَيْءٍ يَوْمَ الْجُمُعَةِ","bs_ranges":[[0,164]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Temim ibn el-Muntesir, koji je rekao: obavijestio nas je Ishak, od Šerika, od Galiba ibn Gilaba, od Ataa ibn Ebu Rebaha 317]],"ar_html":"وهذا الذي قاله من ذكرنا قوله، من أن الله عز وجل خلق السموات والملائكة وآدم في يوم الخميس والجمعة، هو الصحيح عندنا، للخبر الذي \u003cspan class=\"isnad\">حَدَّثَنَا بِهِ هَنَّادُ بن السري قَالَ: حَدَّثَنَا أَبُو بَكْرِ بْنُ عَيَّاشٍ، عَنِ أبي سعد البقال، عن عكرمة، عن ابن عباس، عن النبي ص- قَالَ:\nهَنَّادٌ، وَقَرَأْتُ سَائِرَ الْحَدِيثِ- قَالَ: \u003c/span>وَخَلَقَ يَوْمَ الْخَمِيسِ السَّمَاءَ، وَخَلَقَ يَوْمَ الْجُمُعَةِ النُّجُومَ وَالشَّمْسَ وَالْقَمَرَ وَالْمَلائِكَةَ إِلَى ثَلاثِ سَاعَاتٍ بَقِيَتْ مِنْهُ، فَخَلَقَ فِي أَوَّلِ سَاعَةٍ مِنْ هَذِهِ الثَّلاثِ سَاعَاتِ الآجَالَ، مَنْ يَحْيَا وَمَنْ يَمُوتُ، وَفِي الثَّانِيَةِ أَلْقَى الآفَةَ عَلَى كُلِّ شَيْءٍ مِمَّا يَنْتَفِعُ بِهِ النَّاسُ، وَفِي الثَّالِثَةِ آدَمَ وَأَسْكَنَهُ الْجَنَّةَ، وَأَمَرَ إِبْلِيسَ بِالسُّجُودِ، وَأَخْرَجَهُ مِنْهَا فِي آخِرِ سَاعَةٍ.","bs_ranges":[[170,403]],"bs_html":"Ono što su rekli oni čije smo riječi spomenuli — da je Allah, Silan i Uzvišen, stvorio nebesa, meleke i Adema u četvrtak i petak — kod nas je ispravno, zbog predaje koju \u003cspan class=\"isnad\">nam je pričao Hennad ibn es-Serijj, koji je rekao: pričao nam je Ebu Bekr ibn Ajjaš, od Ebu Sa‘da el-Bekkala, od Ikrime, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem — Hennad je rekao: „Ostatak hadisa sam pročitao“ — \u003c/span>da je rekao: „U četvrtak je stvorio nebo, a u petak je stvarao zvijezde, Sunce, Mjesec i meleke, do preostala tri sata toga dana. U prvom od ta tri sata stvorio je rokove života, ko će živjeti i ko će umrijeti. U drugom je pustio nedaću na sve čime se ljudi koriste. U trećem je stvorio Adema, nastanio ga u Džennetu, naredio Iblisu da učini sedždu i izveo ga iz njega u posljednjem satu.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: zamjenica u „izveo ga iz njega“ prenosi arapsko وأخرجه منها; samo ovo mjesto ne razrješava izričito na koga se „ga“ odnosi.⟧\u003c/span>"},{"id":"56.4","ar":"حَدَّثَنِي الْقَاسِمُ بْنُ بِشْرِ بن معروف، والحسين بن علي الصدائي، قالا: ح
