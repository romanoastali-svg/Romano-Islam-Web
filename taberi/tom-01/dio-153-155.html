<!doctype html><html lang="bs"><head><meta charset="utf-8"><title>Taberi · tom 1 · 153–155</title></head><body><script id="partData" type="application/json">{"id":"01-007","start":153,"end":155,"pages":[{"n":153,"html":"\u003csection class=\"page\" data-page=\"153\" id=\"stranica-153\">\u003ch2>Stranica 153\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 153\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"153.1\" id=\"ar-odlomak-153-1\">كِتَابٍ أَنْزَلَهُ اللَّهُ عَزَّ وَجَلَّ؟ قَالَ: مِائَةُ كتاب واربعه كتب، انزل الله على شيث خَمْسِينَ صَحِيفَةً] .\u003c/p>\u003cp data-pair=\"153.2\" id=\"ar-odlomak-153-2\">وَإِلَى شِيثَ أَنْسَابُ بَنِي آدَمَ كُلِّهِمُ الْيَوْمَ، وَذَلِكَ أَنَّ نَسْلَ سَائِرِ وَلَدِ آدَمَ غَيْرَ نَسْلِ شِيثَ، انْقَرَضُوا وَبَادُوا فَلَمْ يَبْقَ مِنْهُمْ أَحَدٌ، فَأَنْسَابُ النَّاسِ كُلِّهِمُ الْيَوْمَ الى شيث ع.\u003c/p>\u003cp data-pair=\"153.3\" id=\"ar-odlomak-153-3\">وَأَمَّا الْفُرْسُ الَّذِينَ قَالُوا إِنَّ جِيُومِرْتَ هُوَ آدم، فإنهم قالوا: ولد لجيومرت ابنه ميشى، وتزوج ميشى اخته ميشانه فولدت له سيامك بن ميشى، وسيامى ابنه ميشى، فولد لسيامك بن ميشى بن جيومرت افرواك، وديس، وبراسب، واجوب، وأوراش بنو سيامك، وأفرى، ودذى، وبرى وأوراشى بنات سيامك، أمهم جميعا سيامى بنت ميشى، وَهِيَ أُخْتُ أَبِيهِمْ.\u003c/p>\u003cp data-pair=\"153.4\" id=\"ar-odlomak-153-4\">وَذَكَرُوا أَنَّ الأَرْضَ كُلَّهَا سَبْعَةُ أَقَالِيمَ، فَأَرْضُ بَابِلَ وَمَا يوصلُ إِلَيْهِ مِمَّا يَأْتِيهِ النَّاسُ بَرًّا أَوْ بَحْرًا فَهُوَ إِقْلِيمٌ وَاحِدٌ، وَسُكَّانُهُ نَسْلُ وَلَدِ أفرواك بْنِ سيامكَ وَأَعْقَابُهُمْ، وَأَمَّا الأَقَالِيمُ السِّتَّةُ الْبَاقِيَةِ الَّتِي لا يوصلُ إِلَيْهَا الْيَوْمَ بَرًّا أَوْ بَحْرًا فَنَسْلُ سَائِرِ وَلَدِ سيامكَ، مِنْ بَنِيهِ وَبَنَاتِهِ.\u003c/p>\u003cp data-pair=\"153.5\" id=\"ar-odlomak-153-5\">فَوُلِدَ لأفرواك بْنِ سيامك مِنْ أَفْرَى بِنْتِ سيامِكَ هُوشنكُ بيشدَاذَ الْمَلِكُ، وَهُوَ الَّذِي خَلَفَ جَدَّهُ جيومرتَ فِي الْمُلْكِ، وَأَوَّلُ مَنْ جُمِعَ لَهُ مُلْكُ الأَقَالِيمِ السَّبْعَةِ، وَسَنَذْكُرُ أَخْبَارَهُ إِنْ شَاءَ اللَّهُ إِذَا انْتَهَيْنَا إِلَيْهِ وَكَانَ بَعْضُهُمْ يَزْعُمُ أَنَّ أوشهنجَ هَذَا، هُوَ ابْنُ آدَمَ لِصُلْبِهِ مِنْ حَوَّاءَ.\u003c/p>\u003cp data-pair=\"153.6\" id=\"ar-odlomak-153-6\">وَأَمَّا \u003cspan class=\"isnad\">هِشَامٌ الْكَلْبِيُّ فَإِنَّهُ فِيمَا حَدَّثْتُ عَنْهُ قَال\u003c/span>َ: بَلَغَنَا وَاللَّهُ أَعْلَمُ- أَوَّلَ مَلِكٍ مَلَكَ الأَرْضَ أوشهنقُ بْنُ عَابرِ بن شالخ بن أرفخشد بن سام بن نوح قال:\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 153\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"153.1\" id=\"odlomak-153-1\">knjiga Allah, Silan i Uzvišen, objavio?’ Odgovorio je: ‘Stotinu i četiri knjige. Šisu je Allah objavio pedeset listova.’“\u003c/p>\u003cp data-pair=\"153.2\" id=\"odlomak-153-2\">Porijeklo svih Ademovih potomaka danas vodi do Šisa. Potomstvo ostale Ademove djece, osim Šisovog potomstva, izumrlo je i nestalo, pa od njih niko nije ostao. Zato porijeklo svih ljudi danas vodi do Šisa, alejhis-selam.\u003c/p>\u003cp data-pair=\"153.3\" id=\"odlomak-153-3\">Perzijanci koji govore da je Džejumert Adem kazali su: „Džejumertu je rođen sin Miši. Miši se oženio svojom sestrom Mišanom, pa mu je rodila Sijamaka ibn Mišija i Sijami, Mišijevu kćerku. Sijamaku ibn Mišiju ibn Džejumertu rođeni su Efruvak, Dis, Barasb, Adžub i Uraš, Sijamakovi sinovi, te Afra, Dazi, Bari i Uraši, Sijamakove kćeri. Svima im je majka bila Sijami, Mišijeva kćerka i sestra njihovog oca.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: rijetka perzijska imena prenesena su približno prema arapskom zapisu. Nijedno ime u popisu sinova ili kćeri nije izostavljeno.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"153.4\" id=\"odlomak-153-4\">Naveli su da cijela Zemlja ima sedam oblasti. Babilonska zemlja i sve do čega se odatle može stići kopnom ili morem jedna su oblast. Njeni su stanovnici potomci djece Efruvaka ibn Sijamaka i njihovi nasljednici. Ostalih šest oblasti, do kojih se danas ne može stići kopnom ili morem, nastanjuje potomstvo ostale Sijamakove djece, njegovih sinova i kćeri.\u003c/p>\u003cp data-pair=\"153.5\" id=\"odlomak-153-5\">Efruvaku ibn Sijamaku od Afre, Sijamakove kćerke, rođen je kralj Hušenk Bišdaz. On je naslijedio svoga djeda Džejumerta na vlasti i prvi je kojem je objedinjena vlast nad sedam oblasti. Njegove ćemo vijesti, ako Allah htjedne, navesti kada dođemo do njega. Neki su tvrdili da je ovaj Ušhendž Ademov neposredni sin od Havve.\u003c/p>\u003cp data-pair=\"153.6\" id=\"odlomak-153-6\">Što se tiče \u003cspan class=\"isnad\">Hišama el-Kelbija, on je, prema onome što mi je preneseno od njega, rekao:\u003c/span> „Do nas je doprlo — a Allah najbolje zna — da je prvi kralj koji je zavladao Zemljom bio Ušhenk ibn Abir ibn Šalih ibn Arfahšad ibn Sam ibn Nuh.“ Rekao je:\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":154,"html":"\u003csection class=\"page\" data-page=\"154\" id=\"stranica-154\">\u003ch2>Stranica 154\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 154\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"154.1\" id=\"ar-odlomak-154-1\">وَالْفُرْسُ تَدَّعِيهِ وَتَزْعُمُ أَنَّهُ كَانَ بَعْدَ وَفَاةِ آدَمَ بِمِائَتَيْ سَنَةٍ، قَالَ: وَإِنَّمَا كَانَ هَذَا الْمَلِكُ فِيمَا بَلَغَنَا بَعْدَ نُوحٍ بِمِائَتَيْ سَنَةٍ، فَصَيَّرَهُ أَهْلُ فَارِسَ بَعْدَ آدَمَ بِمِائَتَيْ سَنَةٍ، وَلَمْ يَعْرِفُوا مَا كَانَ قَبْلَ نُوحٍ.\u003c/p>\u003cp data-pair=\"154.2\" id=\"ar-odlomak-154-2\">وَهَذَا الَّذِي قَالَهُ هِشَامٌ قَوْلٌ لا وَجْهَ لَهُ، لأَنَّ هوشهنكَ الْمِلكَ فِي أَهْلِ الْمَعْرِفَةِ بِأَنْسَابِ الْفُرْسِ أَشْهَرُ مِنَ الْحَجَّاجِ بْنِ يُوسُفَ فِي أَهْلِ الإِسْلامِ، وَكُلُّ قَوْمٍ فَهُمْ بِآبَائِهِمْ وَأَنْسَابِهِمْ وَمَآثِرِهِمْ أَعْلَمُ مِنْ غَيْرِهِمْ، وَإِنَّمَا يَرْجِعُ فِي كُلِّ أَمْرٍ الْتَبَسَ إِلَى أَهْلِهِ.\u003c/p>\u003cp data-pair=\"154.3\" id=\"ar-odlomak-154-3\">وَقَدْ زَعَمَ بَعْضُ نَسَّابَةُ الْفُرْسِ أَنَّ أوشهنجَ بيشداذَ الْمَلِكَ هَذَا هُوَ مهلائيلُ، وَأَنَّ أَبَاهُ فرواكَ هُوَ قينانُ أَبُو مهلائيلَ، وَأَنَّ سيامكَ هُوَ أنوشُ ابو قينان، وان ميشى هُوَ شيثَ أَبُو أنوشَ، وَأَنَّ جيومرتَ هُوَ آدم ص.\u003c/p>\u003cp data-pair=\"154.4\" id=\"ar-odlomak-154-4\">فَإِنْ كَانَ الأَمْرُ كَمَا قَالَ، فَلا شَكَّ أَنَّ أوشهنجَ كَانَ فِي زَمَانِ آدَمَ رَجُلا، وذلك ان مهلائيل فيما ذكر في الكتاب الأُوَلِ كَانَتْ وِلادَةُ أُمِّهِ دينةَ ابنةِ براكيلَ ابن محويل بن خنوخ بن قين بن آدم إِيَّاهُ بَعْدَ مَا مَضَى مِنْ عُمْرِ آدَمَ ص ثلاثمائة سَنَةٍ وَخَمْسٌ وَتِسْعُونَ سَنَةً، فَقَدْ كَانَ لَهُ حين وفاه آدم ستمائه سنه وخمسين سِنِينَ، عَلَى حِسَابِ \u003cspan class=\"isnad\">مَا رُوِيَ عَنْ رَسُولِ الله ص\u003c/span> فِي عُمْرِ آدَمَ أَنَّهُ كَانَ عُمْرُهُ أَلْفَ سَنَةٍ.\u003c/p>\u003cp data-pair=\"154.5\" id=\"ar-odlomak-154-5\">وَقَدْ زَعَمَتْ عُلَمَاءُ الْفُرْسِ أَنَّ مَلِكَ أوشهنجَ هَذَا كَانَ أَرْبَعِينَ سَنَةً فَإِنْ كَانَ الأَمْرُ فِي هَذَا الْمَلِكِ كَالَّذِي قَالَهُ النَّسَّابَةُ الَّذِي ذَكَرْتُ عَنْهُ مَا ذَكَرْتُ فَلَمْ يَبْعُدْ مَنْ قَالَ: إِنَّ مُلْكَهُ كَانَ بَعْدَ وَفَاةِ آدم ص بمائتي سنه\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 154\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"154.1\" id=\"odlomak-154-1\">„Perzijanci ga svojataju i tvrde da je bio dvjesto godina nakon Ademove smrti.“ Rekao je: „Prema onome što je do nas doprlo, ovaj je kralj bio dvjesto godina poslije Nuha, a Perzijanci su ga smjestili dvjesto godina nakon Adema i nisu znali šta je bilo prije Nuha.“\u003c/p>\u003cp data-pair=\"154.2\" id=\"odlomak-154-2\">Ono što je Hišam rekao nema osnove. Kralj Hušenk među poznavaocima perzijskih rodoslovlja poznatiji je nego Hadždžadž ibn Jusuf među sljedbenicima islama. Svaki narod bolje od drugih poznaje svoje pretke, rodoslovlja i znamenita djela. U svakoj nejasnoj stvari obraća se onima kojima ta stvar pripada.\u003c/p>\u003cp data-pair=\"154.3\" id=\"odlomak-154-3\">Neki perzijski rodoslovci tvrde da je ovaj kralj Ušhendž Bišdaz zapravo Mehlail, da je njegov otac Feruvak zapravo Kajnan, Mehlailov otac, da je Sijamak zapravo Enuš, Kajnanov otac, da je Miši zapravo Šis, Enušov otac, a da je Džejumert Adem, sallallahu alejhi ve sellem.\u003c/p>\u003cp data-pair=\"154.4\" id=\"odlomak-154-4\">Ako je stvar onakva kako kaže, onda nema sumnje da je Ušhendž u Ademovo vrijeme bio odrastao čovjek. Prema onome što je navedeno u Prvoj knjizi, Mehlaila je njegova majka Dina, kćerka Berakila ibn Mahvila ibn Hanuha ibn Kajna ibn Adema, rodila nakon što je od Ademovog, sallallahu alejhi ve sellem, života prošlo tristo devedeset pet godina. U vrijeme Ademove smrti imao je šest stotina pedeset godina, prema proračunu na osnovu onoga \u003cspan class=\"isnad\">što je preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem,\u003c/span> da je Adem živio hiljadu godina. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: brojevi 395, 650 i 1000 preneseni su kako stoje u izvoru; njihova računska neusaglašenost nije prešutno ispravljena.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"154.5\" id=\"odlomak-154-5\">Perzijski učenjaci tvrde da je ovaj Ušhendž vladao četrdeset godina. Ako je u slučaju ovoga kralja stvar onakva kako kaže rodoslovac čije sam riječi naveo, onda nije daleko od istine onaj koji kaže da je njegova vladavina bila dvjesto godina poslije smrti Adema, sallallahu alejhi ve sellem. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: varijante هوشنك، أوشهنج، أوشهنق prenesene su različitim oblicima imena, prema zapisu izvora, bez njihovog prešutnog ujednačavanja.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":155,"html":"\u003csection class=\"page\" data-page=\"155\" id=\"stranica-155\">\u003ch2>Stranica 155\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 155\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"155.1\" id=\"ar-odlomak-155-1\">[ذكر وفاه آدم ع]\u003c/p>\u003cp data-pair=\"155.2\" id=\"ar-odlomak-155-2\">اختلف في مدة عمره، وابن كم كان يوم قبضه الله عز وجل إليه.\u003c/p>\u003cp data-pair=\"155.3\" id=\"ar-odlomak-155-3\">فأما الاخبار عن رسول الله ص فإنها واردة بما \u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ خَلَفٍ الْعَسْقَلانِيُّ، قَالَ: حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، قَالَ:\nحَدَّثَنَا أَبُو خَالِدٍ سُلَيْمَانُ بْنُ حَيَّانَ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سلمه، عن ابى هريرة عن النبي ص- قَالَ أَبُو خَالِدٍ: وحدثني الأَعْمَشُ، عَنْ أَبِي صالح عن ابى هريرة عن النبي ص قَالَ أَبُو خَالِدٍ: وحدثني دَاوُدُ بْنُ أَبِي هِنْدٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي هُرَيْرَةَ عَنِ النبي ص قَالَ أَبُو خَالِدٍ: وحدثني ابْنُ أَبِي ذُبَابٍ الدَّوْسِيُّ، قَالَ: حَدَّثَنَا سَعِيدٌ الْمَقْبُرِيُّ وَيَزِيدُ بْنُ هرمز، عن ابى هريرة، [عن النبي ص- أَنَّهُ قَال\u003c/span>َ: خَلَقَ اللَّهُ آدَمَ بِيَدِهِ وَنَفَخَ فِيهِ مِنْ رُوحِهِ، وَأَمَرَ الْمَلائِكَةَ فَسَجَدُوا لَهُ، فَجَلَسَ فَعَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ لَهُ ربه: يرحمك ربك، ايت أُولَئِكَ الْمَلأَ مِنَ الْمَلائِكَةِ فَقُلْ لَهُمُ: السَّلامُ عليكم، فأتاهم فقال لهم: السلام عليكم قالوا لَهُ: وَعَلَيْكَ السَّلامُ وَرَحْمَةُ اللَّهِ، ثُمَّ رَجَعَ إِلَى رَبِّهِ فَقَالَ لَهُ: هَذِهِ تَحِيَّتُكَ وَتَحِيَّةُ ذُرِّيَّتِكَ بَيْنَهُمْ، ثُمَّ قَبَضَ لَهُ يَدَيْهِ، فَقَالَ له: خُذْ وَاخْتَرْ، قَالَ:\nاخْتَرْتُ يَمِينَ رَبِّي وَكِلْتَا يَدَيْهِ يَمِينٌ، فَفَتَحَهَا لَهُ، فَإِذَا فِيهَا صُورَةُ آدَمَ وَذُرِّيَّتِهِ كُلِّهِمْ، فَإِذَا كُلُّ رَجُلٍ مَكْتُوبٌ عِنْدَهُ أَجَلُهُ، وَإِذَا آدَمُ قَدْ كُتِبَ لَهُ عُمْرُ أَلْفِ سَنَةٍ، وَإِذَا قَوْمٌ عَلَيْهِمِ النُّورُ، فَقَالَ: يَا رَبِّ، مَنْ هَؤُلاءِ الَّذِينَ عَلَيْهِمِ النُّورُ، فَقَالَ: هَؤُلاءِ الأَنْبِيَاءُ وَالرُّسُلُ الَّذِينَ أُرْسِلُ إِلَى عِبَادِي، وَإِذَا فِيهِمْ رَجُلٌ هُوَ أَضْوَءُهُمْ نُورًا، وَلَمْ يُكْتَبْ لَهُ مِنَ الْعُمْرِ إِلا اربعون سنه، فقال: يا رب، ما بال هذا، من اضوئهم نُورًا وَلَمْ يُكْتَبْ لَهُ مِنَ الْعُمْرِ إِلا أَرْبَعُونَ سَنَةً؟ فَقَالَ:\nذَاكَ مَا كُتِبَ لَهُ، فَقَالَ: يَا رَبِّ، انْقُصْ لَهُ مِنْ عُمْرِي ستين سنه فقال رسول الله ص: فَلَمَّا أَسْكَنَهُ اللَّهُ الْجَنَّةَ ثُمَّ أُهْبِطَ إِلَى الأَرْضِ كَانَ يَعُدُّ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 155\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"155.1\" id=\"odlomak-155-1\">Spomen smrti Adema, alejhis-selam\u003c/p>\u003cp data-pair=\"155.2\" id=\"odlomak-155-2\">Postoji razilaženje o dužini njegovog života i o tome koliko je godina imao kada ga je Allah, Silan i Uzvišen, uzeo Sebi.\u003c/p>\u003cp data-pair=\"155.3\" id=\"odlomak-155-3\">Što se tiče predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, one prenose ono što \u003cspan class=\"isnad\">mi je pričao Muhammed ibn Halef el-Askalani, koji je rekao: pričao nam je Adem ibn Ebu Ijas, koji je rekao: pričao nam je Ebu Halid Sulejman ibn Hajjan, koji je rekao: pričao mi je Muhammed ibn Amr, od Ebu Seleme, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem — Ebu Halid je rekao: a pričao mi je i A‘meš, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Davud ibn Ebu Hind, od Ša‘bija, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Ibn Ebu Zubab ed-Devsi, koji je rekao: pričali su nam Seid el-Makburi i Jezid ibn Hurmuz, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao:\u003c/span> „Allah je stvorio Adema Svojom rukom, udahnuo u njega od Svoga Duha i naredio melekima, pa su mu učinili sedždu. Sjeo je, kihnuo i rekao: ‘Hvala Allahu!’ Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar. Otiđi onom zboru meleka i reci im: Es-selamu alejkum!’ Došao im je i rekao: ‘Es-selamu alejkum!’ Odgovorili su mu: ‘Ve alejkes-selamu ve rahmetullah!’ Potom se vratio svome Gospodaru, koji mu je rekao: ‘Ovo je tvoj pozdrav i pozdrav tvojih potomaka među njima.’ Zatim je pred njim stisnuo Svoje dvije ruke i rekao mu: ‘Uzmi i izaberi.’ Odgovorio je: ‘Izabrao sam desnicu svoga Gospodara, a obje Njegove ruke su desnice.’ Otvorio mu je, a u njoj je bio lik Adema i cijelog njegovog potomstva. Uz svakoga čovjeka bilo je zapisano trajanje njegovog života. Ademu je bilo zapisano hiljadu godina života. Tu su bili ljudi na kojima je bila svjetlost, pa je upitao: ‘Gospodaru moj, ko su ovi na kojima je svjetlost?’ Odgovorio je: ‘Ovo su vjerovjesnici i poslanici koje šaljem Svojim robovima.’ Među njima je bio čovjek koji je svijetlio najsnažnije, a bilo mu je zapisano samo četrdeset godina života. Upitao je: ‘Gospodaru moj, zašto je ovaj među onima s najjačom svjetlošću, a zapisano mu je samo četrdeset godina života?’ Odgovorio je: ‘Tako mu je zapisano.’ Rekao je: ‘Gospodaru moj, uzmi šezdeset godina od moga života i daj mu.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Kada ga je Allah nastanio u Džennetu, a potom je spušten na Zemlju, brojao je\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"}],"book":[{"n":153,"ar":"كِتَابٍ أَنْزَلَهُ اللَّهُ عَزَّ وَجَلَّ؟ قَالَ: مِائَةُ كتاب واربعه كتب، انزل الله على شيث خَمْسِينَ صَحِيفَةً] .\nوَإِلَى شِيثَ أَنْسَابُ بَنِي آدَمَ كُلِّهِمُ الْيَوْمَ، وَذَلِكَ أَنَّ نَسْلَ سَائِرِ وَلَدِ آدَمَ غَيْرَ نَسْلِ شِيثَ، انْقَرَضُوا وَبَادُوا فَلَمْ يَبْقَ مِنْهُمْ أَحَدٌ، فَأَنْسَابُ النَّاسِ كُلِّهِمُ الْيَوْمَ الى شيث ع.\nوَأَمَّا الْفُرْسُ الَّذِينَ قَالُوا إِنَّ جِيُومِرْتَ هُوَ آدم، فإنهم قالوا: ولد لجيومرت ابنه ميشى، وتزوج ميشى اخته ميشانه فولدت له سيامك بن ميشى، وسيامى ابنه ميشى، فولد لسيامك بن ميشى بن جيومرت افرواك، وديس، وبراسب، واجوب، وأوراش بنو سيامك، وأفرى، ودذى، وبرى وأوراشى بنات سيامك، أمهم جميعا سيامى بنت ميشى، وَهِيَ أُخْتُ أَبِيهِمْ.\nوَذَكَرُوا أَنَّ الأَرْضَ كُلَّهَا سَبْعَةُ أَقَالِيمَ، فَأَرْضُ بَابِلَ وَمَا يوصلُ إِلَيْهِ مِمَّا يَأْتِيهِ النَّاسُ بَرًّا أَوْ بَحْرًا فَهُوَ إِقْلِيمٌ وَاحِدٌ، وَسُكَّانُهُ نَسْلُ وَلَدِ أفرواك بْنِ سيامكَ وَأَعْقَابُهُمْ، وَأَمَّا الأَقَالِيمُ السِّتَّةُ الْبَاقِيَةِ الَّتِي لا يوصلُ إِلَيْهَا الْيَوْمَ بَرًّا أَوْ بَحْرًا فَنَسْلُ سَائِرِ وَلَدِ سيامكَ، مِنْ بَنِيهِ وَبَنَاتِهِ.\nفَوُلِدَ لأفرواك بْنِ سيامك مِنْ أَفْرَى بِنْتِ سيامِكَ هُوشنكُ بيشدَاذَ الْمَلِكُ، وَهُوَ الَّذِي خَلَفَ جَدَّهُ جيومرتَ فِي الْمُلْكِ، وَأَوَّلُ مَنْ جُمِعَ لَهُ مُلْكُ الأَقَالِيمِ السَّبْعَةِ، وَسَنَذْكُرُ أَخْبَارَهُ إِنْ شَاءَ اللَّهُ إِذَا انْتَهَيْنَا إِلَيْهِ وَكَانَ بَعْضُهُمْ يَزْعُمُ أَنَّ أوشهنجَ هَذَا، هُوَ ابْنُ آدَمَ لِصُلْبِهِ مِنْ حَوَّاءَ.\nوَأَمَّا هِشَامٌ الْكَلْبِيُّ فَإِنَّهُ فِيمَا حَدَّثْتُ عَنْهُ قَالَ: بَلَغَنَا وَاللَّهُ أَعْلَمُ- أَوَّلَ مَلِكٍ مَلَكَ الأَرْضَ أوشهنقُ بْنُ عَابرِ بن شالخ بن أرفخشد بن سام بن نوح قال:","ar_html":"كِتَابٍ أَنْزَلَهُ اللَّهُ عَزَّ وَجَلَّ؟ قَالَ: مِائَةُ كتاب واربعه كتب، انزل الله على شيث خَمْسِينَ صَحِيفَةً] .\n\nوَإِلَى شِيثَ أَنْسَابُ بَنِي آدَمَ كُلِّهِمُ الْيَوْمَ، وَذَلِكَ أَنَّ نَسْلَ سَائِرِ وَلَدِ آدَمَ غَيْرَ نَسْلِ شِيثَ، انْقَرَضُوا وَبَادُوا فَلَمْ يَبْقَ مِنْهُمْ أَحَدٌ، فَأَنْسَابُ النَّاسِ كُلِّهِمُ الْيَوْمَ الى شيث ع.\n\nوَأَمَّا الْفُرْسُ الَّذِينَ قَالُوا إِنَّ جِيُومِرْتَ هُوَ آدم، فإنهم قالوا: ولد لجيومرت ابنه ميشى، وتزوج ميشى اخته ميشانه فولدت له سيامك بن ميشى، وسيامى ابنه ميشى، فولد لسيامك بن ميشى بن جيومرت افرواك، وديس، وبراسب، واجوب، وأوراش بنو سيامك، وأفرى، ودذى، وبرى وأوراشى بنات سيامك، أمهم جميعا سيامى بنت ميشى، وَهِيَ أُخْتُ أَبِيهِمْ.\n\nوَذَكَرُوا أَنَّ الأَرْضَ كُلَّهَا سَبْعَةُ أَقَالِيمَ، فَأَرْضُ بَابِلَ وَمَا يوصلُ إِلَيْهِ مِمَّا يَأْتِيهِ النَّاسُ بَرًّا أَوْ بَحْرًا فَهُوَ إِقْلِيمٌ وَاحِدٌ، وَسُكَّانُهُ نَسْلُ وَلَدِ أفرواك بْنِ سيامكَ وَأَعْقَابُهُمْ، وَأَمَّا الأَقَالِيمُ السِّتَّةُ الْبَاقِيَةِ الَّتِي لا يوصلُ إِلَيْهَا الْيَوْمَ بَرًّا أَوْ بَحْرًا فَنَسْلُ سَائِرِ وَلَدِ سيامكَ، مِنْ بَنِيهِ وَبَنَاتِهِ.\n\nفَوُلِدَ لأفرواك بْنِ سيامك مِنْ أَفْرَى بِنْتِ سيامِكَ هُوشنكُ بيشدَاذَ الْمَلِكُ، وَهُوَ الَّذِي خَلَفَ جَدَّهُ جيومرتَ فِي الْمُلْكِ، وَأَوَّلُ مَنْ جُمِعَ لَهُ مُلْكُ الأَقَالِيمِ السَّبْعَةِ، وَسَنَذْكُرُ أَخْبَارَهُ إِنْ شَاءَ اللَّهُ إِذَا انْتَهَيْنَا إِلَيْهِ وَكَانَ بَعْضُهُمْ يَزْعُمُ أَنَّ أوشهنجَ هَذَا، هُوَ ابْنُ آدَمَ لِصُلْبِهِ مِنْ حَوَّاءَ.\n\nوَأَمَّا \u003cspan class=\"isnad\">هِشَامٌ الْكَلْبِيُّ فَإِنَّهُ فِيمَا حَدَّثْتُ عَنْهُ قَال\u003c/span>َ: بَلَغَنَا وَاللَّهُ أَعْلَمُ- أَوَّلَ مَلِكٍ مَلَكَ الأَرْضَ أوشهنقُ بْنُ عَابرِ بن شالخ بن أرفخشد بن سام بن نوح قال:","bs":"\u003cp data-paragraph=\"153.1\">knjiga Allah, Silan i Uzvišen, objavio?’ Odgovorio je: ‘Stotinu i četiri knjige. Šisu je Allah objavio pedeset listova.’“\u003c/p>\u003cp data-paragraph=\"153.2\">Porijeklo svih Ademovih potomaka danas vodi do Šisa. Potomstvo ostale Ademove djece, osim Šisovog potomstva, izumrlo je i nestalo, pa od njih niko nije ostao. Zato porijeklo svih ljudi danas vodi do Šisa, alejhis-selam.\u003c/p>\u003cp data-paragraph=\"153.3\">Perzijanci koji govore da je Džejumert Adem kazali su: „Džejumertu je rođen sin Miši. Miši se oženio svojom sestrom Mišanom, pa mu je rodila Sijamaka ibn Mišija i Sijami, Mišijevu kćerku. Sijamaku ibn Mišiju ibn Džejumertu rođeni su Efruvak, Dis, Barasb, Adžub i Uraš, Sijamakovi sinovi, te Afra, Dazi, Bari i Uraši, Sijamakove kćeri. Svima im je majka bila Sijami, Mišijeva kćerka i sestra njihovog oca.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: rijetka perzijska imena prenesena su približno prema arapskom zapisu. Nijedno ime u popisu sinova ili kćeri nije izostavljeno.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"153.4\">Naveli su da cijela Zemlja ima sedam oblasti. Babilonska zemlja i sve do čega se odatle može stići kopnom ili morem jedna su oblast. Njeni su stanovnici potomci djece Efruvaka ibn Sijamaka i njihovi nasljednici. Ostalih šest oblasti, do kojih se danas ne može stići kopnom ili morem, nastanjuje potomstvo ostale Sijamakove djece, njegovih sinova i kćeri.\u003c/p>\u003cp data-paragraph=\"153.5\">Efruvaku ibn Sijamaku od Afre, Sijamakove kćerke, rođen je kralj Hušenk Bišdaz. On je naslijedio svoga djeda Džejumerta na vlasti i prvi je kojem je objedinjena vlast nad sedam oblasti. Njegove ćemo vijesti, ako Allah htjedne, navesti kada dođemo do njega. Neki su tvrdili da je ovaj Ušhendž Ademov neposredni sin od Havve.\u003c/p>\u003cp data-paragraph=\"153.6\">Što se tiče \u003cspan class=\"isnad\">Hišama el-Kelbija, on je, prema onome što mi je preneseno od njega, rekao:\u003c/span> „Do nas je doprlo — a Allah najbolje zna — da je prvi kralj koji je zavladao Zemljom bio Ušhenk ibn Abir ibn Šalih ibn Arfahšad ibn Sam ibn Nuh.“ Rekao je:\u003c/p>","paragraphs":[{"id":"153.1","ar":"كِتَابٍ أَنْزَلَهُ اللَّهُ عَزَّ وَجَلَّ؟ قَالَ: مِائَةُ كتاب واربعه كتب، انزل الله على شيث خَمْسِينَ صَحِيفَةً] .","ar_html":"كِتَابٍ أَنْزَلَهُ اللَّهُ عَزَّ وَجَلَّ؟ قَالَ: مِائَةُ كتاب واربعه كتب، انزل الله على شيث خَمْسِينَ صَحِيفَةً] .","ar_isnad_ranges":[],"bs":"knjiga Allah, Silan i Uzvišen, objavio?’ Odgovorio je: ‘Stotinu i četiri knjige. Šisu je Allah objavio pedeset listova.’“","bs_html":"knjiga Allah, Silan i Uzvišen, objavio?’ Odgovorio je: ‘Stotinu i četiri knjige. Šisu je Allah objavio pedeset listova.’“","bs_isnad_count":0},{"id":"153.2","ar":"وَإِلَى شِيثَ أَنْسَابُ بَنِي آدَمَ كُلِّهِمُ الْيَوْمَ، وَذَلِكَ أَنَّ نَسْلَ سَائِرِ وَلَدِ آدَمَ غَيْرَ نَسْلِ شِيثَ، انْقَرَضُوا وَبَادُوا فَلَمْ يَبْقَ مِنْهُمْ أَحَدٌ، فَأَنْسَابُ النَّاسِ كُلِّهِمُ الْيَوْمَ الى شيث ع.","ar_html":"وَإِلَى شِيثَ أَنْسَابُ بَنِي آدَمَ كُلِّهِمُ الْيَوْمَ، وَذَلِكَ أَنَّ نَسْلَ سَائِرِ وَلَدِ آدَمَ غَيْرَ نَسْلِ شِيثَ، انْقَرَضُوا وَبَادُوا فَلَمْ يَبْقَ مِنْهُمْ أَحَدٌ، فَأَنْسَابُ النَّاسِ كُلِّهِمُ الْيَوْمَ الى شيث ع.","ar_isnad_r eneseno od njega, rekao: „Do nas je doprlo — a Allah najbolje zna — da je prvi kralj koji je zavladao Zemljom bio Ušhenk ibn Abir ibn Šalih ibn Arfahšad ibn Sam ibn Nuh.“ Rekao je:","bs_html":"Što se tiče \u003cspan class=\"isnad\">Hišama el-Kelbija, on je, prema onome što mi je preneseno od njega, rekao:\u003c/span> „Do nas je doprlo — a Allah najbolje zna — da je prvi kralj koji je zavladao Zemljom bio Ušhenk ibn Abir ibn Šalih ibn Arfahšad ibn Sam ibn Nuh.“ Rekao je:","bs_isnad_count":1}],"notes":[]},{"n":154,"ar":"وَالْفُرْسُ تَدَّعِيهِ وَتَزْعُمُ أَنَّهُ كَانَ بَعْدَ وَفَاةِ آدَمَ بِمِائَتَيْ سَنَةٍ، قَالَ: وَإِنَّمَا كَانَ هَذَا الْمَلِكُ فِيمَا بَلَغَنَا بَعْدَ نُوحٍ بِمِائَتَيْ سَنَةٍ، فَصَيَّرَهُ أَهْلُ فَارِسَ بَعْدَ آدَمَ بِمِائَتَيْ سَنَةٍ، وَلَمْ يَعْرِفُوا مَا كَانَ قَبْلَ نُوحٍ.\nوَهَذَا الَّذِي قَالَهُ هِشَامٌ قَوْلٌ لا وَجْهَ لَهُ، لأَنَّ هوشهنكَ الْمِلكَ فِي أَهْلِ الْمَعْرِفَةِ بِأَنْسَابِ الْفُرْسِ أَشْهَرُ مِنَ الْحَجَّاجِ بْنِ يُوسُفَ فِي أَهْلِ الإِسْلامِ، وَكُلُّ قَوْمٍ فَهُمْ بِآبَائِهِمْ وَأَنْسَابِهِمْ وَمَآثِرِهِمْ أَعْلَمُ مِنْ غَيْرِهِمْ، وَإِنَّمَا يَرْجِعُ فِي كُلِّ أَمْرٍ الْتَبَسَ إِلَى أَهْلِهِ.\nوَقَدْ زَعَمَ بَعْضُ نَسَّابَةُ الْفُرْسِ أَنَّ أوشهنجَ بيشداذَ الْمَلِكَ هَذَا هُوَ مهلائيلُ، وَأَنَّ أَبَاهُ فرواكَ هُوَ قينانُ أَبُو مهلائيلَ، وَأَنَّ سيامكَ هُوَ أنوشُ ابو قينان، وان ميشى هُوَ شيثَ أَبُو أنوشَ، وَأَنَّ جيومرتَ هُوَ آدم ص.\nفَإِنْ كَانَ الأَمْرُ كَمَا قَالَ، فَلا شَكَّ أَنَّ أوشهنجَ كَانَ فِي زَمَانِ آدَمَ رَجُلا، وذلك ان مهلائيل فيما ذكر في الكتاب الأُوَلِ كَانَتْ وِلادَةُ أُمِّهِ دينةَ ابنةِ براكيلَ ابن محويل بن خنوخ بن قين بن آدم إِيَّاهُ بَعْدَ مَا مَضَى مِنْ عُمْرِ آدَمَ ص ثلاثمائة سَنَةٍ وَخَمْسٌ وَتِسْعُونَ سَنَةً، فَقَدْ كَانَ لَهُ حين وفاه آدم ستمائه سنه وخمسين سِنِينَ، عَلَى حِسَابِ مَا رُوِيَ عَنْ رَسُولِ الله ص فِي عُمْرِ آدَمَ أَنَّهُ كَانَ عُمْرُهُ أَلْفَ سَنَةٍ.\nوَقَدْ زَعَمَتْ عُلَمَاءُ الْفُرْسِ أَنَّ مَلِكَ أوشهنجَ هَذَا كَانَ أَرْبَعِينَ سَنَةً فَإِنْ كَانَ الأَمْرُ فِي هَذَا الْمَلِكِ كَالَّذِي قَالَهُ النَّسَّابَةُ الَّذِي ذَكَرْتُ عَنْهُ مَا ذَكَرْتُ فَلَمْ يَبْعُدْ مَنْ قَالَ: إِنَّ مُلْكَهُ كَانَ بَعْدَ وَفَاةِ آدم ص بمائتي سنه","ar_html":"وَالْفُرْسُ تَدَّعِيهِ وَتَزْعُمُ أَنَّهُ كَانَ بَعْدَ وَفَاةِ آدَمَ بِمِائَتَيْ سَنَةٍ، قَالَ: وَإِنَّمَا كَانَ هَذَا الْمَلِكُ فِيمَا بَلَغَنَا بَعْدَ نُوحٍ بِمِائَتَيْ سَنَةٍ، فَصَيَّرَهُ أَهْلُ فَارِسَ بَعْدَ آدَمَ بِمِائَتَيْ سَنَةٍ، وَلَمْ يَعْرِفُوا مَا كَانَ قَبْلَ نُوحٍ.\n\nوَهَذَا الَّذِي قَالَهُ هِشَامٌ قَوْلٌ لا وَجْهَ لَهُ، لأَنَّ هوشهنكَ الْمِلكَ فِي أَهْلِ الْمَعْرِفَةِ بِأَنْسَابِ الْفُرْسِ أَشْهَرُ مِنَ الْحَجَّاجِ بْنِ يُوسُفَ فِي أَهْلِ الإِسْلامِ، وَكُلُّ قَوْمٍ فَهُمْ بِآبَائِهِمْ وَأَنْسَابِهِمْ وَمَآثِرِهِمْ أَعْلَمُ مِنْ غَيْرِهِمْ، وَإِنَّمَا يَرْجِعُ فِي كُلِّ أَمْرٍ الْتَبَسَ إِلَى أَهْلِهِ.\n\nوَقَدْ زَعَمَ بَعْضُ نَسَّابَةُ الْفُرْسِ أَنَّ أوشهنجَ بيشداذَ الْمَلِكَ هَذَا هُوَ مهلائيلُ، وَأَنَّ أَبَاهُ فرواكَ هُوَ قينانُ أَبُو مهلائيلَ، وَأَنَّ سيامكَ هُوَ أنوشُ ابو قينان، وان ميشى هُوَ شيثَ أَبُو أنوشَ، وَأَنَّ جيومرتَ هُوَ آدم ص.\n\nفَإِنْ كَانَ الأَمْرُ كَمَا قَالَ، فَلا شَكَّ أَنَّ أوشهنجَ كَانَ فِي زَمَانِ آدَمَ رَجُلا، وذلك ان مهلائيل فيما ذكر في الكتاب الأُوَلِ كَانَتْ وِلادَةُ أُمِّهِ دينةَ ابنةِ براكيلَ ابن محويل بن خنوخ بن قين بن آدم إِيَّاهُ بَعْدَ مَا مَضَى مِنْ عُمْرِ آدَمَ ص ثلاثمائة سَنَةٍ وَخَمْسٌ وَتِسْعُونَ سَنَةً، فَقَدْ كَانَ لَهُ حين وفاه آدم ستمائه سنه وخمسين سِنِينَ، عَلَى حِسَابِ \u003cspan class=\"isnad\">مَا رُوِيَ عَنْ رَسُولِ الله ص\u003c/span> فِي عُمْرِ آدَمَ أَنَّهُ كَانَ عُمْرُهُ أَلْفَ سَنَةٍ.\n\nوَقَدْ زَعَمَتْ عُلَمَاءُ الْفُرْسِ أَنَّ مَلِكَ أوشهنجَ هَذَا كَانَ أَرْبَعِينَ سَنَةً فَإِنْ كَانَ الأَمْرُ فِي هَذَا الْمَلِكِ كَالَّذِي قَالَهُ النَّسَّابَةُ الَّذِي ذَكَرْتُ عَنْهُ مَا ذَكَرْتُ فَلَمْ يَبْعُدْ مَنْ قَالَ: إِنَّ مُلْكَهُ كَانَ بَعْدَ وَفَاةِ آدم ص بمائتي سنه","bs":"\u003cp data-paragraph=\"154.1\">„Perzijanci ga svojataju i tvrde da je bio dvjesto godina nakon Ademove smrti.“ Rekao je: „Prema onome što je do nas doprlo, ovaj je kralj bio dvjesto godina poslije Nuha, a Perzijanci su ga smjestili dvjesto godina nakon Adema i nisu znali šta je bilo prije Nuha.“\u003c/p>\u003cp data-paragraph=\"154.2\">Ono što je Hišam rekao nema osnove. Kralj Hušenk među poznavaocima perzijskih rodoslovlja poznatiji je nego Hadždžadž ibn Jusuf među sljedbenicima islama. Svaki narod bolje od drugih poznaje svoje pretke, rodoslovlja i znamenita djela. U svakoj nejasnoj stvari obraća se onima kojima ta stvar pripada.\u003c/p>\u003cp data-paragraph=\"154.3\">Neki perzijski rodoslovci tvrde da je ovaj kralj Ušhendž Bišdaz zapravo Mehlail, da je njegov otac Feruvak zapravo Kajnan, Mehlailov otac, da je Sijamak zapravo Enuš, Kajnanov otac, da je Miši zapravo Šis, Enušov otac, a da je Džejumert Adem, sallallahu alejhi ve sellem.\u003c/p>\u003cp data-paragraph=\"154.4\">Ako je stvar onakva kako kaže, onda nema sumnje da je Ušhendž u Ademovo vrijeme bio odrastao čovjek. Prema onome što je navedeno u Prvoj knjizi, Mehlaila je njegova majka Dina, kćerka Berakila ibn Mahvila ibn Hanuha ibn Kajna ibn Adema, rodila nakon što je od Ademovog, sallallahu alejhi ve sellem, života prošlo tristo devedeset pet godina. U vrijeme Ademove smrti imao je šest stotina pedeset godina, prema proračunu na osnovu onoga \u003cspan class=\"isnad\">što je preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem,\u003c/span> da je Adem živio hiljadu godina. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: brojevi 395, 650 i 1000 preneseni su kako stoje u izvoru; njihova računska neusaglašenost nije prešutno ispravljena.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"154.5\">Perzijski učenjaci tvrde da je ovaj Ušhendž vladao četrdeset godina. Ako je u slučaju ovoga kralja stvar onakva kako kaže rodoslovac čije sam riječi naveo, onda nije daleko od istine onaj koji kaže da je njegova vladavina bila dvjesto godina poslije smrti Adema, sallallahu alejhi ve sellem. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: varijante هوشنك، أوشهنج، أوشهنق =\"isnad\">što je preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem,\u003c/span> da je Adem živio hiljadu godina. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: brojevi 395, 650 i 1000 preneseni su kako stoje u izvoru; njihova računska neusaglašenost nije prešutno ispravljena.⟧\u003c/span>","bs_isnad_count":1},{"id":"154.5","ar":"وَقَدْ زَعَمَتْ عُلَمَاءُ الْفُرْسِ أَنَّ مَلِكَ أوشهنجَ هَذَا كَانَ أَرْبَعِينَ سَنَةً فَإِنْ كَانَ الأَمْرُ فِي هَذَا الْمَلِكِ كَالَّذِي قَالَهُ النَّسَّابَةُ الَّذِي ذَكَرْتُ عَنْهُ مَا ذَكَرْتُ فَلَمْ يَبْعُدْ مَنْ قَالَ: إِنَّ مُلْكَهُ كَانَ بَعْدَ وَفَاةِ آدم ص بمائتي سنه","ar_html":"وَقَدْ زَعَمَتْ عُلَمَاءُ الْفُرْسِ أَنَّ مَلِكَ أوشهنجَ هَذَا كَانَ أَرْبَعِينَ سَنَةً فَإِنْ كَانَ الأَمْرُ فِي هَذَا الْمَلِكِ كَالَّذِي قَالَهُ النَّسَّابَةُ الَّذِي ذَكَرْتُ عَنْهُ مَا ذَكَرْتُ فَلَمْ يَبْعُدْ مَنْ قَالَ: إِنَّ مُلْكَهُ كَانَ بَعْدَ وَفَاةِ آدم ص بمائتي سنه","ar_isnad_ranges":[],"bs":"Perzijski učenjaci tvrde da je ovaj Ušhendž vladao četrdeset godina. Ako je u slučaju ovoga kralja stvar onakva kako kaže rodoslovac čije sam riječi naveo, onda nije daleko od istine onaj koji kaže da je njegova vladavina bila dvjesto godina poslije smrti Adema, sallallahu alejhi ve sellem. ⟦Napomena prevodioca: varijante هوشنك، أوشهنج، أوشهنق prenesene su različitim oblicima imena, prema zapisu izvora, bez njihovog prešutnog ujednačavanja.⟧","bs_html":"Perzijski učenjaci tvrde da je ovaj Ušhendž vladao četrdeset godina. Ako je u slučaju ovoga kralja stvar onakva kako kaže rodoslovac čije sam riječi naveo, onda nije daleko od istine onaj koji kaže da je njegova vladavina bila dvjesto godina poslije smrti Adema, sallallahu alejhi ve sellem. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: varijante هوشنك، أوشهنج، أوشهنق prenesene su različitim oblicima imena, prema zapisu izvora, bez njihovog prešutnog ujednačavanja.⟧\u003c/span>","bs_isnad_count":0}],"notes":[]},{"n":155,"ar":"[ذكر وفاه آدم ع]\n\nاختلف في مدة عمره، وابن كم كان يوم قبضه الله عز وجل إليه.\n\nفأما الاخبار عن رسول الله ص فإنها واردة بما حَدَّثَنِي مُحَمَّدُ بْنُ خَلَفٍ الْعَسْقَلانِيُّ، قَالَ: حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، قَالَ:\nحَدَّثَنَا أَبُو خَالِدٍ سُلَيْمَانُ بْنُ حَيَّانَ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سلمه، عن ابى هريرة عن النبي ص- قَالَ أَبُو خَالِدٍ: وحدثني الأَعْمَشُ، عَنْ أَبِي صالح عن ابى هريرة عن النبي ص قَالَ أَبُو خَالِدٍ: وحدثني دَاوُدُ بْنُ أَبِي هِنْدٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي هُرَيْرَةَ عَنِ النبي ص قَالَ أَبُو خَالِدٍ: وحدثني ابْنُ أَبِي ذُبَابٍ الدَّوْسِيُّ، قَالَ: حَدَّثَنَا سَعِيدٌ الْمَقْبُرِيُّ وَيَزِيدُ بْنُ هرمز، عن ابى هريرة، [عن النبي ص- أَنَّهُ قَالَ: خَلَقَ اللَّهُ آدَمَ بِيَدِهِ وَنَفَخَ فِيهِ مِنْ رُوحِهِ، وَأَمَرَ الْمَلائِكَةَ فَسَجَدُوا لَهُ، فَجَلَسَ فَعَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ لَهُ ربه: يرحمك ربك، ايت أُولَئِكَ الْمَلأَ مِنَ الْمَلائِكَةِ فَقُلْ لَهُمُ: السَّلامُ عليكم، فأتاهم فقال لهم: السلام عليكم قالوا لَهُ: وَعَلَيْكَ السَّلامُ وَرَحْمَةُ اللَّهِ، ثُمَّ رَجَعَ إِلَى رَبِّهِ فَقَالَ لَهُ: هَذِهِ تَحِيَّتُكَ وَتَحِيَّةُ ذُرِّيَّتِكَ بَيْنَهُمْ، ثُمَّ قَبَضَ لَهُ يَدَيْهِ، فَقَالَ له: خُذْ وَاخْتَرْ، قَالَ:\nاخْتَرْتُ يَمِينَ رَبِّي وَكِلْتَا يَدَيْهِ يَمِينٌ، فَفَتَحَهَا لَهُ، فَإِذَا فِيهَا صُورَةُ آدَمَ وَذُرِّيَّتِهِ كُلِّهِمْ، فَإِذَا كُلُّ رَجُلٍ مَكْتُوبٌ عِنْدَهُ أَجَلُهُ، وَإِذَا آدَمُ قَدْ كُتِبَ لَهُ عُمْرُ أَلْفِ سَنَةٍ، وَإِذَا قَوْمٌ عَلَيْهِمِ النُّورُ، فَقَالَ: يَا رَبِّ، مَنْ هَؤُلاءِ الَّذِينَ عَلَيْهِمِ النُّورُ، فَقَالَ: هَؤُلاءِ الأَنْبِيَاءُ وَالرُّسُلُ الَّذِينَ أُرْسِلُ إِلَى عِبَادِي، وَإِذَا فِيهِمْ رَجُلٌ هُوَ أَضْوَءُهُمْ نُورًا، وَلَمْ يُكْتَبْ لَهُ مِنَ الْعُمْرِ إِلا اربعون سنه، فقال: يا رب، ما بال هذا، من اضوئهم نُورًا وَلَمْ يُكْتَبْ لَهُ مِنَ الْعُمْرِ إِلا أَرْبَعُونَ سَنَةً؟ فَقَالَ:\nذَاكَ مَا كُتِبَ لَهُ، فَقَالَ: يَا رَبِّ، انْقُصْ لَهُ مِنْ عُمْرِي ستين سنه فقال رسول الله ص: فَلَمَّا أَسْكَنَهُ اللَّهُ الْجَنَّةَ ثُمَّ أُهْبِطَ إِلَى الأَرْضِ كَانَ يَعُدُّ","ar_html":"[ذكر وفاه آدم ع] ُهْبِطَ إِلَى الأَرْضِ كَانَ يَعُدُّ","bs":"\u003cp data-paragraph=\"155.1\">Spomen smrti Adema, alejhis-selam\u003c/p>\u003cp data-paragraph=\"155.2\">Postoji razilaženje o dužini njegovog života i o tome koliko je godina imao kada ga je Allah, Silan i Uzvišen, uzeo Sebi.\u003c/p>\u003cp data-paragraph=\"155.3\">Što se tiče predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, one prenose ono što \u003cspan class=\"isnad\">mi je pričao Muhammed ibn Halef el-Askalani, koji je rekao: pričao nam je Adem ibn Ebu Ijas, koji je rekao: pričao nam je Ebu Halid Sulejman ibn Hajjan, koji je rekao: pričao mi je Muhammed ibn Amr, od Ebu Seleme, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem — Ebu Halid je rekao: a pričao mi je i A‘meš, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Davud ibn Ebu Hind, od Ša‘bija, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Ibn Ebu Zubab ed-Devsi, koji je rekao: pričali su nam Seid el-Makburi i Jezid ibn Hurmuz, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao:\u003c/span> „Allah je stvorio Adema Svojom rukom, udahnuo u njega od Svoga Duha i naredio melekima, pa su mu učinili sedždu. Sjeo je, kihnuo i rekao: ‘Hvala Allahu!’ Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar. Otiđi onom zboru meleka i reci im: Es-selamu alejkum!’ Došao im je i rekao: ‘Es-selamu alejkum!’ Odgovorili su mu: ‘Ve alejkes-selamu ve rahmetullah!’ Potom se vratio svome Gospodaru, koji mu je rekao: ‘Ovo je tvoj pozdrav i pozdrav tvojih potomaka među njima.’ Zatim je pred njim stisnuo Svoje dvije ruke i rekao mu: ‘Uzmi i izaberi.’ Odgovorio je: ‘Izabrao sam desnicu svoga Gospodara, a obje Njegove ruke su desnice.’ Otvorio mu je, a u njoj je bio lik Adema i cijelog njegovog potomstva. Uz svakoga čovjeka bilo je zapisano trajanje njegovog života. Ademu je bilo zapisano hiljadu godina života. Tu su bili ljudi na kojima je bila svjetlost, pa je upitao: ‘Gospodaru moj, ko su ovi na kojima je svjetlost?’ Odgovorio je: ‘Ovo su vjerovjesnici i poslanici koje šaljem Svojim robovima.’ Među njima je bio čovjek koji je svijetlio najsnažnije, a bilo mu je zapisano samo četrdeset godina života. Upitao je: ‘Gospodaru moj, zašto je ovaj među onima s najjačom svjetlošću, a zapisano mu je samo četrdeset godina života?’ Odgovorio je: ‘Tako mu je zapisano.’ Rekao je: ‘Gospodaru moj, uzmi šezdeset godina od moga života i daj mu.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Kada ga je Allah nastanio u Džennetu, a potom je spušten na Zemlju, brojao je\u003c/p>\u003cp class=\"small\" style=\"color:#53675c\">Predaja se nastavlja na izvornoj stranici 156.\u003c/p>","paragraphs":[{"id":"155.1","ar":"[ذكر وفاه آدم ع]","ar_html":"[ذكر وفاه آدم ع]","ar_isnad_ranges":[],"bs":"Spomen smrti Adema, alejhis-selam","bs_html":"Spomen smrti Adema, alejhis-selam","bs_isnad_count":0},{"id":"155.2","ar":"اختلف في مدة عمره، وابن كم كان يوم قبضه الله عز وجل إليه.","ar_html":"اختلف في مدة عمره، وابن كم كان يوم قبضه الله عز وجل إليه.","ar_isnad_ranges":[],"bs":"Postoji razilaženje o dužini njegovog života i o tome koliko je godina imao kada ga je Allah, Silan i Uzvišen, uzeo Sebi.","bs_html":"Postoji razilaženje o dužini njegovog života i o tome koliko je godina imao kada ga je Allah, Silan i Uzvišen, uzeo Sebi.","bs_isnad_count":0},{"id":"155.3","ar":"فأما الاخبار عن رسول الله ص فإنها واردة بما حَدَّثَنِي مُحَمَّدُ بْنُ خَلَفٍ الْعَسْقَلانِيُّ، قَالَ: حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، قَالَ:\nحَدَّثَنَا أَبُو خَالِدٍ سُلَيْمَانُ بْنُ حَيَّانَ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سلمه، عن ابى هريرة عن النبي ص- قَالَ أَبُو خَالِدٍ: وحدثني الأَعْمَشُ، عَنْ أَبِي صالح عن ابى هريرة عن النبي ص قَالَ أَبُو خَالِدٍ: وحدثني دَاوُدُ بْنُ أَبِي هِنْدٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي هُرَيْرَةَ عَنِ النبي ص قَالَ أَبُو خَالِدٍ: وحدثني ابْنُ أَبِي ذُبَابٍ الدَّوْسِيُّ، قَالَ: حَدَّثَنَا سَعِيدٌ الْمَقْبُرِيُّ وَيَزِيدُ بْنُ هرمز، عن ابى هريرة، [عن النبي ص- أَنَّهُ قَالَ: خَلَقَ اللَّهُ آدَمَ بِيَدِهِ وَنَفَخَ فِيهِ مِنْ رُوحِهِ، وَأَمَرَ الْمَلائِكَةَ فَسَجَدُوا لَهُ، فَجَلَسَ فَعَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ لَهُ ربه: يرحمك ربك، ايت أُولَئِكَ الْمَلأَ مِنَ الْمَلائِكَةِ فَقُلْ لَهُمُ: السَّلامُ عليكم، فأتاهم فقال لهم: السلام عليكم قالوا لَهُ: وَعَلَيْكَ السَّلامُ وَرَحْمَةُ اللَّهِ، ثُمَّ رَجَعَ إِلَى رَبِّهِ فَقَالَ لَهُ: هَذِهِ تَحِيَّتُكَ وَتَحِيَّةُ ذُرِّيَّتِكَ بَيْنَهُمْ، ثُمَّ قَبَضَ لَهُ يَدَيْهِ، فَقَالَ له: خُذْ وَاخْتَرْ، قَالَ:\nاخْتَرْتُ يَمِينَ رَبِّي وَكِلْتَا يَدَيْهِ يَمِينٌ، فَفَتَحَهَا لَهُ، فَإِذَا فِيهَا صُورَةُ آدَمَ وَذُرِّيَّتِهِ كُلِّهِمْ، فَإِذَا كُلُّ رَجُلٍ مَكْتُوبٌ عِنْدَهُ أَجَلُهُ، وَإِذَا آدَمُ قَدْ كُتِبَ لَهُ عُمْرُ أَلْفِ سَنَةٍ، وَإِذَا قَوْمٌ عَلَيْهِمِ النُّورُ، فَقَالَ: يَا رَبِّ، مَنْ هَؤُلاءِ الَّذِينَ عَلَيْهِمِ النُّورُ، فَقَالَ: هَؤُلاءِ الأَنْبِيَاءُ وَالرُّسُلُ الَّذِينَ أُرْسِلُ إِلَى عِبَادِي، وَإِذَا فِيهِمْ رَجُلٌ هُوَ أَضْوَءُهُمْ نُورًا، وَلَمْ يُكْتَبْ لَهُ مِنَ الْعُمْرِ إِلا اربعون سنه، فقال: يا رب، ما بال هذا، من اضوئهم نُورًا وَلَمْ يُكْتَبْ لَهُ مِنَ الْعُمْرِ إِلا أَرْبَعُونَ سَنَةً؟ فَقَالَ:\nذَاكَ مَا كُتِبَ لَهُ، فَقَالَ: يَا رَبِّ، انْقُصْ لَهُ مِنْ عُمْرِي ستين سنه فقال رسول الله ص: فَلَمَّا أَسْكَنَهُ اللَّهُ الْجَنَّةَ ثُمَّ أُهْبِطَ إِلَى الأَرْضِ كَانَ يَعُدُّ","ar_html":"فأما الاخبار عن رسول الله ص فإنها واردة بما \u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ خَلَفٍ الْعَسْقَلانِيُّ، قَالَ: حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، قَالَ:\nحَدَّثَنَا أَبُو خَالِدٍ سُلَيْمَانُ بْنُ حَيَّانَ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سلمه، عن ابى هريرة عن النبي ص- قَالَ أَبُو خَالِدٍ: وحدثني الأَعْمَشُ، عَنْ أَبِي صالح عن ابى هريرة عن النبي ص قَالَ أَبُو خَالِدٍ: وحدثني دَاوُدُ بْنُ أَبِي هِنْدٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي هُرَيْرَةَ عَنِ النبي ص قَالَ أَبُو خَالِدٍ: وحدثني ابْنُ أَبِي ذُبَابٍ الدَّوْسِيُّ، قَالَ: حَدَّثَنَا سَعِيدٌ الْمَقْبُرِ ada ga je Allah nastanio u Džennetu, a potom je spušten na Zemlju, brojao je","bs_isnad_count":1}],"notes":[]}]}</script><script id="databaseData" type="application/json">[{"stranica":153,"ar_tekst":"كِتَابٍ أَنْزَلَهُ اللَّهُ عَزَّ وَجَلَّ؟ قَالَ: مِائَةُ كتاب واربعه كتب، انزل الله على شيث خَمْسِينَ صَحِيفَةً] .","bs_tekst":"knjiga Allah, Silan i Uzvišen, objavio?’ Odgovorio je: ‘Stotinu i četiri knjige. Šisu je Allah objavio pedeset listova.’“"},{"stranica":153,"ar_tekst":"وَإِلَى شِيثَ أَنْسَابُ بَنِي آدَمَ كُلِّهِمُ الْيَوْمَ، وَذَلِكَ أَنَّ نَسْلَ سَائِرِ وَلَدِ آدَمَ غَيْرَ نَسْلِ شِيثَ، انْقَرَضُوا وَبَادُوا فَلَمْ يَبْقَ مِنْهُمْ أَحَدٌ، فَأَنْسَابُ النَّاسِ كُلِّهِمُ الْيَوْمَ الى شيث ع.","bs_tekst":"Porijeklo svih Ademovih potomaka danas vodi do Šisa. Potomstvo ostale Ademove djece, osim Šisovog potomstva, izumrlo je i nestalo, pa od njih niko nije ostao. Zato porijeklo svih ljudi danas vodi do Šisa, alejhis-selam."},{"stranica":153,"ar_tekst":"وَأَمَّا الْفُرْسُ الَّذِينَ قَالُوا إِنَّ جِيُومِرْتَ هُوَ آدم، فإنهم قالوا: ولد لجيومرت ابنه ميشى، وتزوج ميشى اخته ميشانه فولدت له سيامك بن ميشى، وسيامى ابنه ميشى، فولد لسيامك بن ميشى بن جيومرت افرواك، وديس، وبراسب، واجوب، وأوراش بنو سيامك، وأفرى، ودذى، وبرى وأوراشى بنات سيامك، أمهم جميعا سيامى بنت ميشى، وَهِيَ أُخْتُ أَبِيهِمْ.","bs_tekst":"Perzijanci koji govore da je Džejumert Adem kazali su: „Džejumertu je rođen sin Miši. Miši se oženio svojom sestrom Mišanom, pa mu je rodila Sijamaka ibn Mišija i Sijami, Mišijevu kćerku. Sijamaku ibn Mišiju ibn Džejumertu rođeni su Efruvak, Dis, Barasb, Adžub i Uraš, Sijamakovi sinovi, te Afra, Dazi, Bari i Uraši, Sijamakove kćeri. Svima im je majka bila Sijami, Mišijeva kćerka i sestra njihovog oca.“ ⟦Napomena prevodioca: rijetka perzijska imena prenesena su približno prema arapskom zapisu. Nijedno ime u popisu sinova ili kćeri nije izostavljeno.⟧"},{"stranica":153,"ar_tekst":"وَذَكَرُوا أَنَّ الأَرْضَ كُلَّهَا سَبْعَةُ أَقَالِيمَ، فَأَرْضُ بَابِلَ وَمَا يوصلُ إِلَيْهِ مِمَّا يَأْتِيهِ النَّاسُ بَرًّا أَوْ بَحْرًا فَهُوَ إِقْلِيمٌ وَاحِدٌ، وَسُكَّانُهُ نَسْلُ وَلَدِ أفرواك بْنِ سيامكَ وَأَعْقَابُهُمْ، وَأَمَّا الأَقَالِيمُ السِّتَّةُ الْبَاقِيَةِ الَّتِي لا يوصلُ إِلَيْهَا الْيَوْمَ بَرًّا أَوْ بَحْرًا فَنَسْلُ سَائِرِ وَلَدِ سيامكَ، مِنْ بَنِيهِ وَبَنَاتِهِ.","bs_tekst":"Naveli su da cijela Zemlja ima sedam oblasti. Babilonska zemlja i sve do čega se odatle može stići kopnom ili morem jedna su oblast. Njeni su stanovnici potomci djece Efruvaka ibn Sijamaka i njihovi nasljednici. Ostalih šest oblasti, do kojih se danas ne može stići kopnom ili morem, nastanjuje potomstvo ostale Sijamakove djece, njegovih sinova i kćeri."},{"stranica":153,"ar_tekst":"فَوُلِدَ لأفرواك بْنِ سيامك مِنْ أَفْرَى بِنْتِ سيامِكَ هُوشنكُ بيشدَاذَ الْمَلِكُ، وَهُوَ الَّذِي خَلَفَ جَدَّهُ جيومرتَ فِي الْمُلْكِ، وَأَوَّلُ مَنْ جُمِعَ لَهُ مُلْكُ الأَقَالِيمِ السَّبْعَةِ، وَسَنَذْكُرُ أَخْبَارَهُ إِنْ شَاءَ اللَّهُ إِذَا انْتَهَيْنَا إِلَيْهِ وَكَانَ بَعْضُهُمْ يَزْعُمُ أَنَّ أوشهنجَ هَذَا، هُوَ ابْنُ آدَمَ لِصُلْبِهِ مِنْ حَوَّاءَ.","bs_tekst":"Efruvaku ibn Sijamaku od Afre, Sijamakove kćerke, rođen je kralj Hušenk Bišdaz. On je naslijedio svoga djeda Džejumerta na vlasti i prvi je kojem je objedinjena vlast nad sedam oblasti. Njegove ćemo vijesti, ako Allah htjedne, navesti kada dođemo do njega. Neki su tvrdili da je ovaj Ušhendž Ademov neposredni sin od Havve."},{"stranica":153,"ar_tekst":"وَأَمَّا هِشَامٌ الْكَلْبِيُّ فَإِنَّهُ فِيمَا حَدَّثْتُ عَنْهُ قَالَ: بَلَغَنَا وَاللَّهُ أَعْلَمُ- أَوَّلَ مَلِكٍ مَلَكَ الأَرْضَ أوشهنقُ بْنُ عَابرِ بن شالخ بن أرفخشد بن سام بن نوح قال:","bs_tekst":"Što se tiče Hišama el-Kelbija, on je, prema onome što mi je preneseno od njega, rekao: „Do nas je doprlo — a Allah najbolje zna — da je prvi kralj koji je zavladao Zemljom bio Ušhenk ibn Abir ibn Šalih ibn Arfahšad ibn Sam ibn Nuh.“ Rekao je:"},{"stranica":154,"ar_tekst":"وَالْفُرْسُ تَدَّعِيهِ وَتَزْعُمُ أَنَّهُ كَانَ بَعْدَ وَفَاةِ آدَمَ بِمِائَتَيْ سَنَةٍ، قَالَ: وَإِنَّمَا كَانَ هَذَا الْمَلِكُ فِيمَا بَلَغَنَا بَعْدَ نُوحٍ بِمِائَتَيْ سَنَةٍ، فَصَيَّرَهُ أَهْلُ فَارِسَ بَعْدَ آدَمَ بِمِائَتَيْ سَنَةٍ، وَلَمْ يَعْرِفُوا مَا كَانَ قَبْلَ نُوحٍ.","bs_tekst":"„Perzijanci ga svojataju i tvrde da je bio dvjesto godina nakon Ademove smrti.“ Rekao je: „Prema onome što je do nas doprlo, ovaj je kralj bio dvjesto godina poslije Nuha, a Perzijanci su ga smjestili dvjesto godina nakon Adema i nisu znali šta je bilo prije Nuha.“"},{"stranica":154,"ar_tekst":"وَهَذَا الَّذِي قَالَهُ هِشَامٌ قَوْلٌ لا وَجْهَ لَهُ، لأَنَّ هوشهنكَ الْمِلكَ فِي أَهْلِ الْمَعْرِفَةِ بِأَنْسَابِ الْفُرْسِ أَشْهَرُ مِنَ الْحَجَّاجِ بْنِ يُوسُفَ فِي أَهْلِ الإِسْلامِ، وَكُلُّ قَوْمٍ فَهُمْ بِآبَائِهِمْ وَأَنْسَابِهِمْ وَمَآثِرِهِمْ أَعْلَمُ مِنْ غَيْرِهِمْ، وَإِنَّمَا يَرْجِعُ فِي كُلِّ أَمْرٍ الْتَبَسَ إِلَى أَهْلِهِ.","bs_tekst":"Ono što je Hišam rekao nema osnove. Kralj Hušenk među poznavaocima perzijskih rodoslovlja poznatiji je nego Hadždžadž ibn Jusuf među sljedbenicima islama. Svaki narod bolje od drugih poznaje svoje pretke, rodoslovlja i znamenita djela. U svakoj nejasnoj stvari obraća se onima kojima ta stvar pripada."},{"stranica":154,"ar_tekst":"وَقَدْ زَعَمَ بَعْضُ نَسَّابَةُ الْفُرْسِ أَنَّ أوشهنجَ بيشداذَ الْمَلِكَ هَذَا هُوَ مهلائيلُ، وَأَنَّ أَبَاهُ فرواكَ هُوَ قينانُ أَبُو مهلائيلَ، وَأَنَّ سيامكَ هُوَ أنوشُ ابو قينان، وان ميشى هُوَ شيثَ أَبُو أنوشَ، وَأَنَّ جيومرتَ هُوَ آدم ص.","bs_tekst":"Neki perzijski rodoslovci tvrde da je ovaj kralj Ušhendž Bišdaz zapravo Mehlail, da je njegov otac Feruvak zapravo Kajnan, Mehlailov otac, da je Sijamak zapravo Enuš, Kajnanov otac, da je Miši zapravo Šis, Enušov otac, a da je Džejumert Adem, sallallahu alejhi ve sellem."},{"stranica":154,"ar_tekst":"فَإِنْ كَانَ الأَمْرُ كَمَا قَالَ، فَلا شَكَّ أَنَّ أوشهنجَ كَانَ فِي زَمَانِ آدَمَ رَجُلا، وذلك ان مهلائيل فيما ذكر في الكتاب الأُوَلِ كَانَتْ وِلادَةُ أُمِّهِ دينةَ ابنةِ براكيلَ ابن محويل بن خنوخ بن قين بن آدم إِيَّاهُ بَعْدَ مَا مَضَى مِنْ عُمْرِ آدَمَ ص ثلاثمائة سَنَةٍ وَخَمْسٌ وَتِسْعُونَ سَنَةً، فَقَدْ كَانَ لَهُ حين وفاه آدم ستمائه سنه وخمسين سِنِينَ، عَلَى حِسَابِ مَا رُوِيَ عَنْ رَسُولِ الله ص فِي عُمْرِ آدَمَ أَنَّهُ كَانَ عُمْرُهُ أَلْفَ سَنَةٍ.","bs_tekst":"Ako je stvar onakva kako kaže, onda nema sumnje da je Ušhendž u Ademovo vrijeme bio odrastao čovjek. Prema onome što je navedeno u Prvoj knjizi, Mehlaila je njegova majka Dina, kćerka Berakila ibn Mahvila ibn Hanuha ibn Kajna ibn Adema, rodila nakon što je od Ademovog, sallallahu alejhi ve sellem, života prošlo tristo devedeset pet godina. U vrijeme Ademove smrti imao je šest stotina pedeset godina, prema proračunu na osnovu onoga što je preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem, da je Adem živio hiljadu godina. ⟦Napomena prevodioca: brojevi 395, 650 i 1000 preneseni su kako stoje u izvoru; njihova računska neusaglašenost nije prešutno ispravljena.⟧"},{"stranica":154,"ar_tekst":"وَقَدْ زَعَمَتْ عُلَمَاءُ الْفُرْسِ أَنَّ مَلِكَ أوشهنجَ هَذَا كَانَ أَرْبَعِينَ سَنَةً فَإِنْ كَانَ الأَمْرُ فِي هَذَا الْمَلِكِ كَالَّذِي قَالَهُ النَّسَّابَةُ الَّذِي ذَكَرْتُ عَنْهُ مَا ذَكَرْتُ فَلَمْ يَبْعُدْ مَنْ قَالَ: إِنَّ مُلْكَهُ كَانَ بَعْدَ وَفَاةِ آدم ص بمائتي سنه","bs_tekst":"Perzijski učenjaci tvrde da je ovaj Ušhendž vladao četrdeset godina. Ako je u slučaju ovoga kralja stvar onakva kako kaže rodoslovac čije sam riječi naveo, onda nije daleko od istine onaj koji kaže da je njegova vladavina bila dvjesto godina poslije smrti Adema, sallallahu alejhi ve sellem. ⟦Napomena prevodioca: varijante هوشنك، أوشهنج، أوشهنق prenesene su različitim oblicima imena, prema zapisu izvora, bez njihovog prešutnog ujednačavanja.⟧"},{"stranica":155,"ar_tekst":"[ذكر وفاه آدم ع]","bs_tekst":"Spomen smrti Adema, alejhis-selam"},{"stranica":155,"ar_tekst":"اختلف في مدة عمره، وابن كم كان يوم قبضه الله عز وجل إليه.","bs_tekst":"Postoji razilaženje o dužini njegovog života i o tome koliko je godina imao kada ga je Allah, Silan i Uzvišen, uzeo Sebi."},{"stranica":155,"ar_tekst":"فأما الاخبار عن رسول الله ص فإنها واردة بما حَدَّثَنِي مُحَمَّدُ بْنُ خَلَفٍ الْعَسْقَلانِيُّ، قَالَ: حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، قَالَ:\nحَدَّثَنَا أَبُو خَالِدٍ سُلَيْمَانُ بْنُ حَيَّانَ، قَالَ: حَدَّثَنِي مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سلمه، عن ابى هريرة عن النبي ص- قَالَ أَبُو خَالِدٍ: وحدثني الأَعْمَشُ، عَنْ أَبِي صالح عن ابى هريرة عن النبي ص قَالَ أَبُو خَالِدٍ: وحدثني دَاوُدُ بْنُ أَبِي هِنْدٍ، عَنِ الشَّعْبِيِّ، عَنْ أَبِي هُرَيْرَةَ عَنِ النبي ص قَالَ أَبُو خَالِدٍ: وحدثني ابْنُ أَبِي ذُبَابٍ الدَّوْسِيُّ، قَالَ: حَدَّثَنَا سَعِيدٌ الْمَقْبُرِيُّ وَيَزِيدُ بْنُ هرمز، عن ابى هريرة، [عن النبي ص- أَنَّهُ قَالَ: خَلَقَ اللَّهُ آدَمَ بِيَدِهِ وَنَفَخَ فِيهِ مِنْ رُوحِهِ، وَأَمَرَ الْمَلائِكَةَ فَسَجَدُوا لَهُ، فَجَلَسَ فَعَطَسَ فَقَالَ: الْحَمْدُ لِلَّهِ، فَقَالَ لَهُ ربه: يرحمك ربك، ايت أُولَئِكَ الْمَلأَ مِنَ الْمَلائِكَةِ فَقُلْ لَهُمُ: السَّلامُ عليكم، فأتاهم فقال لهم: السلام عليكم قالوا لَهُ: وَعَلَيْكَ السَّلامُ وَرَحْمَةُ اللَّهِ، ثُمَّ رَجَعَ إِلَى رَبِّهِ فَقَالَ لَهُ: هَذِهِ تَحِيَّتُكَ وَتَحِيَّةُ ذُرِّيَّتِكَ بَيْنَهُمْ، ثُمَّ قَبَضَ لَهُ يَدَيْهِ، فَقَالَ له: خُذْ وَاخْتَرْ، قَالَ:\nاخْتَرْتُ يَمِينَ رَبِّي وَكِلْتَا يَدَيْهِ يَمِينٌ، فَفَتَحَهَا لَهُ، فَإِذَا فِيهَا صُورَةُ آدَمَ وَذُرِّيَّتِهِ كُلِّهِمْ، فَإِذَا كُلُّ رَجُلٍ مَكْتُوبٌ عِنْدَهُ أَجَلُهُ، وَإِذَا آدَمُ قَدْ كُتِبَ لَهُ عُمْرُ أَلْفِ سَنَةٍ، وَإِذَا قَوْمٌ عَلَيْهِمِ النُّورُ، فَقَالَ: يَا رَبِّ، مَنْ هَؤُلاءِ الَّذِينَ عَلَيْهِمِ النُّورُ، فَقَالَ: هَؤُلاءِ الأَنْبِيَاءُ وَالرُّسُلُ الَّذِينَ أُرْسِلُ إِلَى عِبَادِي، وَإِذَا فِيهِمْ رَجُلٌ هُوَ أَضْوَءُهُمْ نُورًا، وَلَمْ يُكْتَبْ لَهُ مِنَ الْعُمْرِ إِلا اربعون سنه، فقال: يا رب، ما بال هذا، من اضوئهم نُورًا وَلَمْ يُكْتَبْ لَهُ مِنَ الْعُمْرِ إِلا أَرْبَعُونَ سَنَةً؟ فَقَالَ:\nذَاكَ مَا كُتِبَ لَهُ، فَقَالَ: يَا رَبِّ، انْقُصْ لَهُ مِنْ عُمْرِي ستين سنه فقال رسول الله ص: فَلَمَّا أَسْكَنَهُ اللَّهُ الْجَنَّةَ ثُمَّ أُهْبِطَ إِلَى الأَرْضِ كَانَ يَعُدُّ","bs_tekst":"Što se tiče predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, one prenose ono što mi je pričao Muhammed ibn Halef el-Askalani, koji je rekao: pričao nam je Adem ibn Ebu Ijas, koji je rekao: pričao nam je Ebu Halid Sulejman ibn Hajjan, koji je rekao: pričao mi je Muhammed ibn Amr, od Ebu Seleme, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem — Ebu Halid je rekao: a pričao mi je i A‘meš, od Ebu Saliha, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Davud ibn Ebu Hind, od Ša‘bija, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem. Ebu Halid je rekao: a pričao mi je i Ibn Ebu Zubab ed-Devsi, koji je rekao: pričali su nam Seid el-Makburi i Jezid ibn Hurmuz, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, da je rekao: „Allah je stvorio Adema Svojom rukom, udahnuo u njega od Svoga Duha i naredio melekima, pa su mu učinili sedždu. Sjeo je, kihnuo i rekao: ‘Hvala Allahu!’ Njegov Gospodar rekao mu je: ‘Smilovao ti se tvoj Gospodar. Otiđi onom zboru meleka i reci im: Es-selamu alejkum!’ Došao im je i rekao: ‘Es-selamu alejkum!’ Odgovorili su mu: ‘Ve alejkes-selamu ve rahmetullah!’ Potom se vratio svome Gospodaru, koji mu je rekao: ‘Ovo je tvoj pozdrav i pozdrav tvojih potomaka među njima.’ Zatim je pred njim stisnuo Svoje dvije ruke i rekao mu: ‘Uzmi i izaberi.’ Odgovorio je: ‘Izabrao sam desnicu svoga Gospodara, a obje Njegove ruke su desnice.’ Otvorio mu je, a u njoj je bio lik Adema i cijelog njegovog potomstva. Uz svakoga čovjeka bilo je zapisano trajanje njegovog života. Ademu je bilo zapisano hiljadu godina života. Tu su bili ljudi na kojima je bila svjetlost, pa je upitao: ‘Gospodaru moj, ko su ovi na kojima je svjetlost?’ Odgovorio je: ‘Ovo su vjerovjesnici i poslanici koje šaljem Svojim robovima.’ Među njima je bio čovjek koji je svijetlio najsnažnije, a bilo mu je zapisano samo četrdeset godina života. Upitao je: ‘Gospodaru moj, zašto je ovaj među onima s najjačom svjetlošću, a zapisano mu je samo četrdeset godina života?’ Odgovorio je: ‘Tako mu je zapisano.’ Rekao je: ‘Gospodaru moj, uzmi šezdeset godina od moga života i daj mu.’ Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Kada ga je Allah nastanio u Džennetu, a potom je spušten na Zemlju, brojao je"}]</script><script>if(parent!==window){parent.postMessage({type:'ri-taberi-part',payload:JSON.parse(document.getElementById('partData').textContent),database:JSON.parse(document.getElementById('databaseData').textContent)},'*');}</script></body></html>
