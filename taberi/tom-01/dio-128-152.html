 5:27, navedeni dio.⟧\u003c/span>","bs_isnad_count":0},{"id":"148.4","ar":"فَحَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الصَّمَدِ بْنُ عَبْدِ الْوَارِثِ، قال: حدثنا عُمَرُ بْنُ إِبْرَاهِيمَ، عَنْ قَتَادَةَ، عَنِ الْحَسَنِ، عن سمره بن جندب، [عن النبي ع قَالَ: كَانَتْ حَوَّاءُ لا يَعِيشُ لَهَا وَلَدٌ، فَنَذَرَتْ لِئَنْ عَاشَ لَهَا وَلَدٌ لَتُسَمِّيَنَّهُ عَبْدَ الْحَارِثِ، فَعَاشَ لَهَا وَلَدٌ فَسَمَّتْهُ عَبْدَ الْحَارِثِ، وانما كان ذلك عن وحى الشيطان] .","ar_html":"فَ\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الصَّمَدِ بْنُ عَبْدِ الْوَارِثِ، قال: حدثنا عُمَرُ بْنُ إِبْرَاهِيمَ، عَنْ قَتَادَةَ، عَنِ الْحَسَنِ، عن سمره بن جندب، [عن النبي ع قَال\u003c/span>َ: كَانَتْ حَوَّاءُ لا يَعِيشُ لَهَا وَلَدٌ، فَنَذَرَتْ لِئَنْ عَاشَ لَهَا وَلَدٌ لَتُسَمِّيَنَّهُ عَبْدَ الْحَارِثِ، فَعَاشَ لَهَا وَلَدٌ فَسَمَّتْهُ عَبْدَ الْحَارِثِ، وانما كان ذلك عن وحى الشيطان] .","ar_isnad_ranges":[[2,199]],"bs":"Pričao nam je Muhammed ibn Beššar, koji je rekao: pričao nam je Abdussamed ibn Abdulvaris, koji je rekao: pričao nam je Omer ibn Ibrahim, od Katade, od Hasena, od Semure ibn Džunduba, od Vjerovjesnika, alejhis-selam, koji je rekao: „Havvi nijedno dijete nije ostajalo živo, pa se zavjetovala da će, ako joj dijete ostane živo, nazvati ga Abdulharis. Jedno joj je dijete ostalo živo i nazvala ga je Abdulharis. To je bilo samo po šejtanovom došaptavanju.“","bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Beššar, koji je rekao: pričao nam je Abdussamed ibn Abdulvaris, koji je rekao: pričao nam je Omer ibn Ibrahim, od Katade, od Hasena, od Semure ibn Džunduba, od Vjerovjesnika, alejhis-selam, koji je rekao:\u003c/span> „Havvi nijedno dijete nije ostajalo živo, pa se zavjetovala da će, ako joj dijete ostane živo, nazvati ga Abdulharis. Jedno joj je dijete ostalo živo i nazvala ga je Abdulharis. To je bilo samo po šejtanovom došaptavanju.“","bs_isnad_count":1},{"id":"148.5","ar":"وحدثنا ابن حميد، قال: حدثنا سلمة، عن ابْنِ إِسْحَاقَ، عَنْ دَاوُدَ بْنِ الْحُصَيْنِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: كَانَتْ حَوَّاءُ تَلِدُ لآدَمَ فَتُعَبِّدُهُمُ اللَّهَ عَزَّ وَجَلَّ وَتُسَمِّيهِمْ: عَبْدَ اللَّهِ، وَعُبَيْدَ اللَّهِ، وَنَحْوَ ذَلِكَ،","ar_html":"\u003cspan class=\"isnad\">وحدثنا ابن حميد، قال: حدثنا سلمة، عن ابْنِ إِسْحَاقَ، عَنْ دَاوُدَ بْنِ الْحُصَيْنِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ: كَانَتْ حَوَّاءُ تَلِدُ لآدَمَ فَتُعَبِّدُهُمُ اللَّهَ عَزَّ وَجَلَّ وَتُسَمِّيهِمْ: عَبْدَ اللَّهِ، وَعُبَيْدَ اللَّهِ، وَنَحْوَ ذَلِكَ،","ar_isnad_ranges":[[0,127]],"bs":"Pričao nam je i Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, od Davuda ibn el-Husajna, od Ikrime, od Ibn Abbasa, koji je rekao: „Havva je Ademu rađala djecu i pripisivala ih robovanju Allahu, Silnom i Uzvišenom, dajući im imena poput Abdullah, Ubejdullah i slična,","bs_html":"\u003cspan class=\"isnad\">Pričao nam je i Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, od Davuda ibn el-Husajna, od Ikrime, od Ibn Abbasa, koji je rekao:\u003c/span> „Havva je Ademu rađala djecu i pripisivala ih robovanju Allahu, Silnom i Uzvišenom, dajući im imena poput Abdullah, Ubejdullah i slična,","bs_isnad_count":1}],"notes":[]},{"n":149,"ar":"فيصيبهم الموت، فأتاها ابليس وآدم ع، فَقَالَ: إِنَّكُمَا لَوْ تُسَمِّيَانَهُ بِغَيْرِ الَّذِي تُسَمِّيَانَهُ بِهِ لَعَاشَ، فَوَلَدَتْ لَهُ ذَكَرًا، فَسَمَّيَاهُ عَبْدَ الْحَارِثِ، فَفِيهِ أَنْزَلَ اللَّهُ عَزَّ ذِكْرُهُ، يَقُولُ اللَّهُ عَزَّ وَجَلَّ: «هُوَ الَّذِي خَلَقَكُمْ مِنْ نَفْسٍ واحِدَةٍ» ، إِلَى قَوْلِهِ: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» الى آخر الآية حدثنا ابن وكيع، قال: حدثنا ابن فضيل، عن سالم بن أبي حفصة، عن سعيد بن جبير: «فَلَمَّا أَثْقَلَتْ دَعَوَا اللَّهَ رَبَّهُما» الى قوله:\n«فَتَعالَى اللَّهُ عَمَّا يُشْرِكُونَ» .\n\nقال: ولما حملت حواء في أول ولد ولدته حين أثقلت أتاها إبليس قبل أن تلد فقال: يا حواء، ما هذا في بطنك؟ فقالت: ما ادرى من؟ فقال:\n\nأين يخرج؟ من أنفك؟ أو من عينك؟ أو من أذنك؟ قالت: لا أدري، قال: أرأيت إن خرج سليما أمطيعتي أنت فيما آمرك به؟ قالت: نعم، قال:\nسميه عبد الحارث- وقد كان يسمى إبليس لعنه الله الحارث- فقالت: نعم، ثم قالت بعد ذلك لآدم: أتاني آت في النوم فقال لي: كذا وكذا، فقال: ان ذاك الشيطان فاحذريه، فإنه عدونا الذي أخرجنا من الجنة، ثم أتاها إبليس لعنه الله فأعاد عليها، فقالت: نعم، فلما وضعته أخرجه الله سليما فسمته عبد الحارث، فهو قوله: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» الى قوله: «فَتَعالَى اللَّهُ عَمَّا يُشْرِكُونَ» .\nحَدَّثَنَا ابن وكيع، قال: حَدَّثَنَا جرير وابن فضيل، عن عبد الملك، عن سعيد بن جبير، قال: قيل له: أشرك آدم؟ قال: اعوذ بالله ان ازعم ان آدم ع أشرك! ولكن حواء لما أثقلت أتاها إبليس","ar_html":"فيصيبهم الموت، فأتاها ابليس وآدم ع، فَقَالَ: إِنَّكُمَا لَوْ تُسَمِّيَانَهُ بِغَيْرِ الَّذِي تُسَمِّيَانَهُ بِهِ لَعَاشَ، فَوَلَدَتْ لَهُ ذَكَرًا، فَسَمَّيَاهُ عَبْدَ الْحَارِثِ، فَفِيهِ أَنْزَلَ اللَّهُ عَزَّ ذِكْرُهُ، يَقُولُ اللَّهُ عَزَّ وَجَلَّ: «هُوَ الَّذِي خَلَقَكُمْ مِنْ نَفْسٍ واحِدَةٍ» ، إِلَى قَوْلِهِ: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» الى آخر الآية\n\n\u003cspan class=\"isnad\">حدثنا ابن وكيع، قال: حدثنا ابن فضيل، عن سالم بن أبي حفصة، عن سعيد بن جبير\u003c/span>: «فَلَمَّا أَثْقَلَتْ دَعَوَا اللَّهَ رَبَّهُما» الى قوله:\n«فَتَعالَى اللَّهُ عَمَّا يُشْرِكُونَ» .\n\nقال: ولما حملت حواء في أول ولد ولدته حين أثقلت أتاها إبليس قبل أن تلد فقال: يا حواء، ما هذا في بطنك؟ فقالت: ما ادرى من؟ فقال:\n\nأين يخرج؟ من أنفك؟ أو من عينك؟ أو من أذنك؟ قالت: لا أدري، قال: أرأيت إن خرج سليما أمطيعتي أنت فيما آمرك به؟ قالت: نعم، قال:\nسميه عبد الحارث- وقد كان يسمى إبليس لعنه الله الحارث- فقالت: نعم، ثم قالت بعد ذلك لآدم: أتاني آت في النوم فقال لي: كذا وكذا، فقال: ان ذاك الشيطان فاحذريه، فإنه عدونا الذي أخرجنا من الجنة، ثم أتاها إبليس لعنه الله فأعاد عليها، فقالت: نعم، فلما وضعته أخرجه الله سليما فسمته عبد الحارث، فهو قوله: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» الى قوله: «فَتَعالَى اللَّهُ عَمَّا يُشْرِكُونَ» .\n\n\u003cspan class=\"isnad\">حَدَّثَنَا ابن وكيع، قال: حَدَّثَنَا جرير وابن فضيل، عن عبد الملك، عن سعيد بن جبير، قال\u003c/span>: قيل له: أشرك آدم؟ قال: اعوذ بالله ان ازعم ان آدم ع أشرك! ولكن حواء لما أثقلت أتاها إبليس","bs":"\u003cp data-paragraph=\"149.1\">pa bi ih zadesila smrt. Iblis je došao njoj i Ademu, alejhis-selam, i rekao: ‘Kada biste mu dali neko drugo ime, umjesto onoga koje dajete, ostao bi živ.’ Rodila mu je dječaka, pa su ga nazvali Abdulharis. O tome je Allah, Silan je spomen Njegov, objavio. Allah, Silan i Uzvišen, kaže: ‘On je Taj koji vas je stvorio od jedne duše’ — do Njegovih riječi: ‘Pripisali su Mu sudionike u onome što im je dao’ — do kraja ajeta.“ \u003cspan class=\"translator-note\">⟦Prijevodi navedenog početka i završnog dijela: El-A‘raf, 7:189–190. Prijelazi „do“ potječu iz izvora.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"149.2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Ibn Fudajl, od Salima ibn Ebu Hafse, od Seida ibn Džubejra,\u003c/span> o riječima: „Kada je otežala, njih dvoje molili su Allaha, svoga Gospodara“ — do Njegovih riječi: „Uzvišen je Allah iznad onoga što Mu pridružuju.“ Rekao je: „Kada je Havva zanijela prvo dijete i trudnoća joj postala teška, Iblis joj je došao prije nego što je rodila. Rekao je: ‘Havva, šta je to u tvojoj utrobi?’ Odgovorila je: ‘Ne znam ko je.’ Upitao je: ‘Odakle će izaći? Iz tvoga nosa, oka ili uha?’ Odgovorila je: ‘Ne znam.’ Rekao je: ‘Reci mi, ako izađe zdravo, hoćeš li me poslušati u onome što ti naredim?’ Odgovorila je: ‘Hoću.’ Rekao je: ‘Nazovi ga Abdulharis.’ Iblis, Allah ga prokleo, bio je nazivan Harisom. Odgovorila je: ‘Hoću.’ Potom je rekla Ademu: ‘Neko mi je došao u snu i rekao to i to.’ Odgovorio je: ‘To je šejtan. Čuvaj ga se! On je naš neprijatelj koji nas je izveo iz Dženneta.’ Zatim joj je Iblis, Allah ga prokleo, ponovo došao i ponovio joj to. Odgovorila je: ‘Hoću.’ Kada je rodila, Allah ga je izveo zdravoga, pa ga je nazvala Abdulharis. To su Njegove riječi: ‘Pripisali su Mu sudionike u onome što im je dao’ — do Njegovih riječi: ‘Uzvišen je Allah iznad onoga što Mu pridružuju.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-A‘raf, 7:189–190, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"149.3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričali su nam Džerir i Ibn Fudajl, od Abdulmelika, od Seida ibn Džubejra, koji je rekao:\u003c/span> „Upitan je: ‘Je li Adem počinio širk?’ Odgovorio je: ‘Utječem se Allahu od toga da tvrdim da je Adem, alejhis-selam, počinio širk! Ali kada je Havvina trudnoća otežala, došao joj je Iblis\u003c/p>","paragraphs":[{"id":"149.1","ar":"فيصيبهم الموت، فأتاها ابليس وآدم ع، فَقَالَ: إِنَّكُمَا لَوْ تُسَمِّيَانَهُ بِغَيْرِ الَّذِي تُسَمِّيَانَهُ بِهِ لَعَاشَ، فَوَلَدَتْ لَهُ ذَكَرًا، فَسَمَّيَاهُ عَبْدَ الْحَارِثِ، فَفِيهِ أَنْزَلَ اللَّهُ عَزَّ ذِكْرُهُ، يَقُولُ اللَّهُ عَزَّ وَجَلَّ: «هُوَ الَّذِي خَلَقَكُمْ مِنْ نَفْسٍ واحِدَةٍ» ، إِلَى قَوْلِهِ: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» الى آخر الآية","ar_html":"فيصيبهم الموت، فأتاها ابليس وآدم ع، فَقَالَ: إِنَّكُمَا لَوْ تُسَمِّيَانَهُ بِغَيْرِ الَّذِي تُسَمِّيَانَهُ بِهِ لَعَاشَ، فَوَلَدَتْ لَهُ ذَكَرًا، فَسَمَّيَاهُ عَبْدَ الْحَارِثِ، فَفِيهِ أَنْزَلَ اللَّهُ عَزَّ ذِكْرُهُ، يَقُولُ اللَّهُ عَزَّ وَجَلَّ: «هُوَ الَّذِي خَلَقَكُمْ مِنْ نَفْسٍ واحِدَةٍ» ، إِلَى قَوْلِهِ: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» الى آخر الآية","ar_isnad_ranges":[],"bs":"pa bi ih zadesila smrt. Iblis je došao njoj i Ademu, alejhis-selam, i rekao: ‘Kada biste mu dali neko drugo ime, umjesto onoga koje dajete, ostao bi živ.’ Rodila mu je dječaka, pa su ga nazvali Abdulharis. O tome je Allah, Silan je spomen Njegov, objavio. Allah, Silan i Uzvišen, kaže: ‘On je Taj koji vas je stvorio od jedne duše’ — do Njegovih riječi: ‘Pripisali su Mu sudionike u onome što im je dao’ — do kraja ajeta.“ ⟦Prijevodi navedenog početka i završnog dijela: El-A‘raf, 7:189–190. Prijelazi „do“ potječu iz izvora.⟧","bs_html":"pa bi ih zadesila smrt. Iblis je došao njoj i Ademu, alejhis-selam, i rekao: ‘Kada biste mu dali neko drugo ime, umjesto onoga koj činio širk! Ali kada je Havvina trudnoća otežala, došao joj je Iblis","bs_isnad_count":1}],"notes":[]},{"n":150,"ar":"فقال لها: من أين يخرج هذا؟ من أنفك، أو من عينك، أو من فيك؟\n\nفقنطها، ثم قال: أرأيت إن خرج سويا- قال ابن وكيع: زاد ابن فضيل:\n\nلم يضرك ولم يقتلك- أتطيعينني؟ قالت: نعم، قال: فسميه عبد الحارث، ففعلت- زاد جرير: فإنما كان شركه في الاسم.\nحَدَّثَنَا موسى بن هارون، قال: حدثنا عمرو بن حماد، قال:\nحَدَّثَنَا أسباط، عن السدي: فولدت- يعني حواء- غلاما، فأتاها إبليس فقال: سموه عبدي، وإلا قتلته، قال له آدم: قد أطعتك وأخرجتني من الجنة فأبى أن يطيعه، فسماه عبد الرحمن، فسلط عليه إبليس لعنه الله فقتله، فحملت بآخر فلما ولدته، قال: سميه عبدى والا قتلته، قال له آدم ع: قد أطعتك فأخرجتني من الجنة فأبى فسماه صالحا، فقتله، فلما كان الثالث قال لهما: فإذ غلبتموني فسموه عبد الحارث، وكان اسم إبليس الحارث، - وإنما سمى ابليس حين ابلس تحير- فذلك حين يقول الله عز وجل: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» - يعني في الأسماء.\nفهؤلاء الذين ذكرت الرواية عنهم بما ذكرت، من أنه مات لآدم وحواء أولاد قبلهما، ومن لم نذكر أقوالهم ممن عددهم أكثر من عدد من ذكرت قوله والرواية عنه، قالوا خلاف قول الحسن الذي روي عنه أنه قال: أول من مات آدم ع.\n\nوكان آدم مع ما كان الله عز وجل قد أعطاه من ملك الأرض والسلطان فيها قد نبأه، وجعله رسولا إلى ولده، وأنزل عليه إحدى وعشرين صحيفة كتبها آدم ع بخطه، علمه إياها جبرئيل ع.\nوَقَدْ حَدَّثَنَا أَحْمَدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ وَهْبٍ، قَالَ: حَدَّثَنَا عَمِّي، قَالَ: حَدَّثَنِي الْمَاضِي بْنُ مُحَمَّدٍ، عَنْ أَبِي سُلَيْمَانَ، عَنِ الْقَاسِمِ بْنِ مُحَمَّدٍ، عَنْ","ar_html":"فقال لها: من أين يخرج هذا؟ من أنفك، أو من عينك، أو من فيك؟\n\nفقنطها، ثم قال: أرأيت إن خرج سويا- \u003cspan class=\"isnad\">قال ابن وكيع: زاد ابن فضيل\u003c/span>:\n\nلم يضرك ولم يقتلك- أتطيعينني؟ قالت: نعم، قال: فسميه عبد الحارث، ففعلت- \u003cspan class=\"isnad\">زاد جرير\u003c/span>: فإنما كان شركه في الاسم.\n\n\u003cspan class=\"isnad\">حَدَّثَنَا موسى بن هارون، قال: حدثنا عمرو بن حماد، قال:\nحَدَّثَنَا أسباط، عن السدي\u003c/span>: فولدت- يعني حواء- غلاما، فأتاها إبليس فقال: سموه عبدي، وإلا قتلته، قال له آدم: قد أطعتك وأخرجتني من الجنة فأبى أن يطيعه، فسماه عبد الرحمن، فسلط عليه إبليس لعنه الله فقتله، فحملت بآخر فلما ولدته، قال: سميه عبدى والا قتلته، قال له آدم ع: قد أطعتك فأخرجتني من الجنة فأبى فسماه صالحا، فقتله، فلما كان الثالث قال لهما: فإذ غلبتموني فسموه عبد الحارث، وكان اسم إبليس الحارث، - وإنما سمى ابليس حين ابلس تحير- فذلك حين يقول الله عز وجل: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» - يعني في الأسماء.\n\nفهؤلاء الذين ذكرت الرواية عنهم بما ذكرت، من أنه مات لآدم وحواء أولاد قبلهما، ومن لم نذكر أقوالهم ممن عددهم أكثر من عدد من ذكرت قوله والرواية عنه، قالوا خلاف \u003cspan class=\"isnad\">قول الحسن الذي روي عنه أنه قال\u003c/span>: أول من مات آدم ع.\n\nوكان آدم مع ما كان الله عز وجل قد أعطاه من ملك الأرض والسلطان فيها قد نبأه، وجعله رسولا إلى ولده، وأنزل عليه إحدى وعشرين صحيفة كتبها آدم ع بخطه، علمه إياها جبرئيل ع.\n\nوَقَدْ \u003cspan class=\"isnad\">حَدَّثَنَا أَحْمَدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ وَهْبٍ، قَالَ: حَدَّثَنَا عَمِّي، قَالَ: حَدَّثَنِي الْمَاضِي بْنُ مُحَمَّدٍ، عَنْ أَبِي سُلَيْمَانَ، عَنِ الْقَاسِمِ بْنِ مُحَمَّدٍ، عَن\u003c/span>ْ","bs":"\u003cp data-paragraph=\"150.1\">i rekao joj: Odakle će ovo izaći: iz tvoga nosa, oka ili usta? Bacio ju je u očaj, pa rekao: Reci mi, ako izađe pravilno oblikovano’ — \u003cspan class=\"isnad\">Ibn Veki‘ je rekao: Ibn Fudajl dodao je:\u003c/span> ‘i ne naškodi ti niti te ubije’ — ‘hoćeš li me poslušati?’ Odgovorila je: ‘Hoću.’ Rekao je: ‘Nazovi ga Abdulharis.’ Učinila je tako.“ \u003cspan class=\"isnad\">Džerir je dodao:\u003c/span> „Njegov širk bio je samo u imenu.“\u003c/p>\u003cp data-paragraph=\"150.2\">\u003cspan class=\"isnad\">Pričao nam je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija:\u003c/span> „Rodila je“ — misli se Havva — „dječaka. Iblis joj je došao i rekao: ‘Nazovite ga mojim robom, inače ću ga ubiti.’ Adem mu je rekao: ‘Već sam te poslušao, pa si me izveo iz Dženneta.’ Odbio ga je poslušati i nazvao dijete Abdurrahman. Iblisu, Allah ga prokleo, data je vlast nad njim, pa ga je ubio. Ponovo je zanijela. Kada je rodila, rekao je: ‘Nazovi ga mojim robom, inače ću ga ubiti.’ Adem, alejhis-selam, rekao mu je: ‘Već sam te poslušao, pa si me izveo iz Dženneta.’ Odbio je i nazvao ga Salihom, pa ga je ubio. Kada je došlo treće dijete, rekao im je: ‘Kada ste me već nadvladali, nazovite ga Abdulharis.’ Iblisovo ime bilo je Haris; Iblisom je nazvan tek kada je pao u očaj i zbunjenost. To je ono kada Allah, Silan i Uzvišen, kaže: ‘Pripisali su Mu sudionike u onome što im je dao’ — misli se u imenima.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:190, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"150.3\">Oni od kojih sam prenio navedeno — da su Ademu i Havvi djeca umirala prije njih — i oni čija mišljenja nisam spomenuo, a kojih je više od onih čije sam mišljenje i predaju naveo, govorili su suprotno \u003cspan class=\"isnad\">mišljenju Hasena, od kojeg je preneseno da je rekao:\u003c/span> „Prvi je umro Adem, alejhis-selam.“\u003c/p>\u003cp data-paragraph=\"150.4\">Uz ono što mu je Allah, Silan i Uzvišen, dao od vlasti nad Zemljom i upravljanja njome, Adema je učinio i vjerovjesnikom i poslanikom njegovoj djeci. Spustio mu je dvadeset jedan list objave, koje je Adem, alejhis-selam, napisao svojom rukom, a kojima ga je poučio Džibril, alejhis-selam.\u003c/p>\u003cp data-paragraph=\"150.5\">\u003cspan class=\"isnad\">Pričao nam je Ahmed ibn Abdurrahman ibn Vehb, koji je rekao: pričao nam je moj amidža, koji je rekao: pričao mi je Madi ibn Muhammed, od Ebu Sulejmana, od Kasima ibn Muhammeda, od\u003c/span>\u003c/p>","paragraphs":[{"id":"150.1","ar":"فقال لها: من أين يخرج هذا؟ من أنفك، أو من عينك، أو من فيك؟\n\nفقنطها، ثم قال: أرأيت إن خرج سويا- قال ابن وكيع: زاد ابن فضيل:\n\nلم يضرك ولم يقتلك- أتطيعينني؟ قالت: نعم، قال: فسميه عبد الحارث، ففعلت- زاد جرير: فإنما كان شركه في الاسم.","ar_html":"فقال لها: من أين يخرج هذا؟ من أنفك، أو من عينك، أو من فيك؟\n\nفقنطها، ثم قال: أرأيت إن خرج سويا- \u003cspan class=\"isnad\">قال ابن وكيع: زاد ابن فضيل\u003c/span>:\n\nلم يضرك ولم يقتلك- أتطيعينني؟ قالت: نعم، قال: فسميه عبد الحارث، ففعلت- \u003cspan class=\"isnad\">زاد جرير\u003c/span>: فإنما كان شركه في الاسم.","ar_isnad_ranges":[[95,121],[195,203]],"bs":"i rekao joj: Odakle će ovo izaći: iz tvoga nosa, oka ili usta? Bacio ju je u očaj, pa rekao: Reci mi, ako izađe pravilno oblikovano’ — Ibn Veki‘ je rekao: Ibn Fudajl dodao je: ‘i ne naškodi ti niti te ubije’ — ‘hoćeš li me poslušati?’ Odgovorila je: ‘Hoću.’ Rekao je: ‘Nazovi ga Abdulharis.’ Učinila je tako.“ Džerir je dodao: „Njegov širk bio je samo u imenu.“","bs_html":"i rekao joj: Odakle će ovo izaći: iz tvoga nosa, oka ili usta? Bacio ju je u očaj, pa rekao: Reci mi, ako izađe pravilno oblikovano’ — \u003cspan class=\"isnad\">Ibn Veki‘ je rekao: Ibn Fudajl dodao je:\u003c/span> ‘i ne naškodi ti niti te ubije’ — ‘hoćeš li me poslušati?’ Odgovorila je: ‘Hoću.’ Rekao je: ‘Nazovi ga Abdulharis.’ Učinila je tako.“ \u003cspan class=\"isnad\">Džerir je dodao:\u003c/span> „Njegov širk bio je samo u imenu.“","bs_isnad_count":2},{"id":"150.2","ar":"حَدَّثَنَا موسى بن هارون، قال: حدثنا عمرو بن حماد، قال:\nحَدَّثَنَا أسباط، عن السدي: فولدت- يعني حواء- غلاما، فأتاها إبليس فقال: سموه عبدي، وإلا قتلته، قال له آدم: قد أطعتك وأخرجتني من الجنة فأبى أن يطيعه، فسماه عبد الرحمن، فسلط عليه إبليس لعنه الله فقتله، فحملت بآخر فلما ولدته، قال: سميه عبدى والا قتلته، قال له آدم ع: قد أطعتك فأخرجتني من الجنة فأبى فسماه صالحا، فقتله، فلما كان الثالث قال لهما: فإذ غلبتموني فسموه عبد الحارث، وكان اسم إبليس الحارث، - وإنما سمى ابليس حين ابلس تحير- فذلك حين يقول الله عز وجل: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» - يعني في الأسماء.","ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا موسى بن هارون، قال: حدثنا عمرو بن حماد، قال:\nحَدَّثَنَا أسباط، عن السدي\u003c/span>: فولدت- يعني حواء- غلاما، فأتاها إبليس فقال: سموه عبدي، وإلا قتلته، قال له آدم: قد أطعتك وأخرجتني من الجنة فأبى أن يطيعه، فسماه عبد الرحمن، a si me izveo iz Dženneta.’ Odbio je i nazvao ga Salihom, pa ga je ubio. Kada je došlo treće dijete, rekao im je: ‘Kada ste me već nadvladali, nazovite ga Abdulharis.’ Iblisovo ime bilo je Haris; Iblisom je nazvan tek kada je pao u očaj i zbunjenost. To je ono kada Allah, Silan i Uzvišen, kaže: ‘Pripisali su Mu sudionike u onome što im je dao’ — misli se u imenima.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:190, navedeni dio.⟧\u003c/span>","bs_isnad_count":1},{"id":"150.3","ar":"فهؤلاء الذين ذكرت الرواية عنهم بما ذكرت، من أنه مات لآدم وحواء أولاد قبلهما، ومن لم نذكر أقوالهم ممن عددهم أكثر من عدد من ذكرت قوله والرواية عنه، قالوا خلاف قول الحسن الذي روي عنه أنه قال: أول من مات آدم ع.","ar_html":"فهؤلاء الذين ذكرت الرواية عنهم بما ذكرت، من أنه مات لآدم وحواء أولاد قبلهما، ومن لم نذكر أقوالهم ممن عددهم أكثر من عدد من ذكرت قوله والرواية عنه، قالوا خلاف \u003cspan class=\"isnad\">قول الحسن الذي روي عنه أنه قال\u003c/span>: أول من مات آدم ع.","ar_isnad_ranges":[[157,187]],"bs":"Oni od kojih sam prenio navedeno — da su Ademu i Havvi djeca umirala prije njih — i oni čija mišljenja nisam spomenuo, a kojih je više od onih čije sam mišljenje i predaju naveo, govorili su suprotno mišljenju Hasena, od kojeg je preneseno da je rekao: „Prvi je umro Adem, alejhis-selam.“","bs_html":"Oni od kojih sam prenio navedeno — da su Ademu i Havvi djeca umirala prije njih — i oni čija mišljenja nisam spomenuo, a kojih je više od onih čije sam mišljenje i predaju naveo, govorili su suprotno \u003cspan class=\"isnad\">mišljenju Hasena, od kojeg je preneseno da je rekao:\u003c/span> „Prvi je umro Adem, alejhis-selam.“","bs_isnad_count":1},{"id":"150.4","ar":"وكان آدم مع ما كان الله عز وجل قد أعطاه من ملك الأرض والسلطان فيها قد نبأه، وجعله رسولا إلى ولده، وأنزل عليه إحدى وعشرين صحيفة كتبها آدم ع بخطه، علمه إياها جبرئيل ع.","ar_html":"وكان آدم مع ما كان الله عز وجل قد أعطاه من ملك الأرض والسلطان فيها قد نبأه، وجعله رسولا إلى ولده، وأنزل عليه إحدى وعشرين صحيفة كتبها آدم ع بخطه، علمه إياها جبرئيل ع.","ar_isnad_ranges":[],"bs":"Uz ono što mu je Allah, Silan i Uzvišen, dao od vlasti nad Zemljom i upravljanja njome, Adema je učinio i vjerovjesnikom i poslanikom njegovoj djeci. Spustio mu je dvadeset jedan list objave, koje je Adem, alejhis-selam, napisao svojom rukom, a kojima ga je poučio Džibril, alejhis-selam.","bs_html":"Uz ono što mu je Allah, Silan i Uzvišen, dao od vlasti nad Zemljom i upravljanja njome, Adema je učinio i vjerovjesnikom i poslanikom njegovoj djeci. Spustio mu je dvadeset jedan list objave, koje je Adem, alejhis-selam, napisao svojom rukom, a kojima ga je poučio Džibril, alejhis-selam.","bs_isnad_count":0},{"id":"150.5","ar":"وَقَدْ حَدَّثَنَا أَحْمَدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ وَهْبٍ، قَالَ: حَدَّثَنَا عَمِّي، قَالَ: حَدَّثَنِي الْمَاضِي بْنُ مُحَمَّدٍ، عَنْ أَبِي سُلَيْمَانَ، عَنِ الْقَاسِمِ بْنِ مُحَمَّدٍ، عَنْ","ar_html":"وَقَدْ \u003cspan class=\"isnad\">حَدَّثَنَا أَحْمَدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ وَهْبٍ، قَالَ: حَدَّثَنَا عَمِّي، قَالَ: حَدَّثَنِي الْمَاضِي بْنُ مُحَمَّدٍ، عَنْ أَبِي سُلَيْمَانَ، عَنِ الْقَاسِمِ بْنِ مُحَمَّدٍ، عَن\u003c/span>ْ","ar_isnad_ranges":[[7,193]],"bs":"Pričao nam je Ahmed ibn Abdurrahman ibn Vehb, koji je rekao: pričao nam je moj amidža, koji je rekao: pričao mi je Madi ibn Muhammed, od Ebu Sulejmana, od Kasima ibn Muhammeda, od","bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ahmed ibn Abdurrahman ibn Vehb, koji je rekao: pričao nam je moj amidža, koji je rekao: pričao mi je Madi ibn Muhammed, od Ebu Sulejmana, od Kasima ibn Muhammeda, od\u003c/span>","bs_isnad_count":1}],"notes":[]},{"n":151,"ar":"أَبِي إِدْرِيسَ الْخَوْلانِيِّ، [عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قال: دخلت المسجد فإذا رسول الله ص جالس وحده، فجلست اليه فقال لي: يَا أَبَا ذَرٍّ، إِنَّ لِلْمَسْجِدِ تَحِيَّةً وَإِنَّ تَحِيَّتَهُ رَكْعَتَانِ، فَقُمْ فَارْكَعْهُمَا، فَلَمَّا رَكَعْتُهُمَا جَلَسْتُ إِلَيْهِ فَقُلْتُ: يَا رَسُولَ اللَّهِ، إِنَّكَ أَمَرْتَنِي بِالصَّلاةِ فَمَا الصَّلاةُ؟ قَالَ: خَيْرُ مَوْضُوعٍ، اسْتُكْثِرَ أَوِ اسْتُقِلَّ، ثُمَّ ذَكَرَ قِصَّةً طَوِيلَةً قَالَ فِيهَا: قُلْتُ: يَا رَسُولَ اللَّهِ، كَمِ الأَنْبِيَاءُ؟ قَالَ: مِائَةُ أَلْفٍ وَأَرْبَعَةٌ وَعِشْرُونَ أَلْفًا، قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، كَمِ الْمُرْسَلُ مِنْ ذلك؟ قال: ثلاثمائة وَثَلاثَةَ عَشَرَ جَمًّا غَفِيرًا، يَعْنِي كَثِيرًا طَيِّبًا، قَالَ: قُلْتُ يَا رَسُولَ اللَّهِ، مَنْ كَانَ أَوَّلَهُمْ؟ قَالَ: آدَمُ، قَالَ: قُلْتُ يَا رَسُولَ اللَّهِ، وَآدَمُ نَبِيٌّ مُرْسَلٌ؟ قَالَ: نَعَمْ خَلَقَهُ اللَّهُ بِيَدِهِ، وَنَفَخَ فِيهِ مِنْ رُوحِهِ، ثُمَّ سَوَّاهُ قُبُلا] .\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سلمة، قال: حدثنى محمد ابن إِسْحَاقَ، عَنْ جَعْفَرِ بْنِ الزُّبَيْرِ، عَنِ الْقَاسِمِ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِي أُمَامَةَ، [عَنْ أَبِي ذَرٍّ قَالَ: قُلْتُ، يَا نَبِيَّ اللَّهِ، أَنَبِيًّا كَانَ آدَمُ؟ قَالَ: نَعَمْ، كَانَ نَبِيًّا، كَلَّمَهُ اللَّهُ قُبُلا] .\n\nوَقِيلَ: إِنَّهُ كَانَ مِمَّا أَنْزَلَ اللَّهُ تَعَالَى عَلَى آدَمَ تَحْرِيمُ الْمَيْتَةِ وَالدَّمِ وَلَحْمِ الْخِنْزِيرِ وَحُرُوفُ الْمُعْجَمِ فِي إِحْدَى وعشرين ورقه","ar_html":"\u003cspan class=\"isnad\">أَبِي إِدْرِيسَ الْخَوْلانِيِّ، [عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قال\u003c/span>: دخلت المسجد فإذا رسول الله ص جالس وحده، فجلست اليه فقال لي: يَا أَبَا ذَرٍّ، إِنَّ لِلْمَسْجِدِ تَحِيَّةً وَإِنَّ تَحِيَّتَهُ رَكْعَتَانِ، فَقُمْ فَارْكَعْهُمَا، فَلَمَّا رَكَعْتُهُمَا جَلَسْتُ إِلَيْهِ فَقُلْتُ: يَا رَسُولَ اللَّهِ، إِنَّكَ أَمَرْتَنِي بِالصَّلاةِ فَمَا الصَّلاةُ؟ قَالَ: خَيْرُ مَوْضُوعٍ، اسْتُكْثِرَ أَوِ اسْتُقِلَّ، ثُمَّ ذَكَرَ قِصَّةً طَوِيلَةً قَالَ فِيهَا: قُلْتُ: يَا رَسُولَ اللَّهِ، كَمِ الأَنْبِيَاءُ؟ قَالَ: مِائَةُ أَلْفٍ وَأَرْبَعَةٌ وَعِشْرُونَ أَلْفًا، قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، كَمِ الْمُرْسَلُ مِنْ ذلك؟ قال: ثلاثمائة وَثَلاثَةَ عَشَرَ جَمًّا غَفِيرًا، يَعْنِي كَثِيرًا طَيِّبًا، قَالَ: قُلْتُ يَا رَسُولَ اللَّهِ، مَنْ كَانَ أَوَّلَهُمْ؟ قَالَ: آدَمُ، قَالَ: قُلْتُ يَا رَسُولَ اللَّهِ، وَآدَمُ نَبِيٌّ مُرْسَلٌ؟ قَالَ: نَعَمْ خَلَقَهُ اللَّهُ بِيَدِهِ، وَنَفَخَ فِيهِ مِنْ رُوحِهِ، ثُمَّ سَوَّاهُ قُبُلا] .\n\n\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سلمة، قال: حدثنى محمد ابن إِسْحَاقَ، عَنْ جَعْفَرِ بْنِ الزُّبَيْرِ، عَنِ الْقَاسِمِ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِي أُمَامَةَ، [عَنْ أَبِي ذَرٍّ قَال\u003c/span>َ: قُلْتُ، يَا نَبِيَّ اللَّهِ، أَنَبِيًّا كَانَ آدَمُ؟ قَالَ: نَعَمْ، كَانَ نَبِيًّا، كَلَّمَهُ اللَّهُ قُبُلا] .\n\nوَقِيلَ: إِنَّهُ كَانَ مِمَّا أَنْزَلَ اللَّهُ تَعَالَى عَلَى آدَمَ تَحْرِيمُ الْمَيْتَةِ وَالدَّمِ وَلَحْمِ الْخِنْزِيرِ وَحُرُوفُ الْمُعْجَمِ فِي إِحْدَى وعشرين ورقه","bs":"\u003cp data-paragraph=\"151.1\">\u003cspan class=\"isnad\">Ebu Idrisa el-Havlanija, od Ebu Zerra el-Gifarija, koji je rekao:\u003c/span> „Ušao sam u džamiju i zatekao Allahovog Poslanika, sallallahu alejhi ve sellem, kako sjedi sam. Sjeo sam pored njega, pa mi je rekao: ‘Ebu Zerre, džamija ima svoj pozdrav, a njen pozdrav su dva rekata. Ustani i klanjaj ih.’ Kada sam ih klanjao, sjeo sam pored njega i rekao: ‘Allahov Poslaniče, naredio si mi namaz, pa šta je namaz?’ Odgovorio je: ‘Dobro koje je ustanovljeno, bilo ga mnogo ili malo.’ Zatim je spomenuo dugu pripovijest u kojoj je rekao: ‘Upitao sam: Allahov Poslaniče, koliko je vjerovjesnika? Odgovorio je: Stotinu dvadeset četiri hiljade.’ Rekao je: ‘Upitao sam: Allahov Poslaniče, koliko je među njima poslanika? Odgovorio je: Tristo trinaest, veliko mnoštvo’ — znači mnogo i dobro. Rekao je: ‘Upitao sam: Allahov Poslaniče, ko je bio prvi među njima? Odgovorio je: Adem.’ Rekao je: ‘Upitao sam: Allahov Poslaniče, je li Adem bio vjerovjesnik i poslanik? Odgovorio je: Jeste. Allah ga je stvorio Svojom rukom, udahnuo u njega od Svoga Duha, zatim ga neposredno oblikovao.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: „Zatim je spomenuo dugu pripovijest“ nalazi se u izvoru; to nije naknadno skraćivanje ovog prijevoda. Završetak izvora glasi ثم سواه قبلا, doslovno ovdje prenesen „zatim ga neposredno oblikovao“. Formulacija je nejasna i nije zamijenjena drugim, uobičajenijim glagolom.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"151.2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao mi je Muhammed ibn Ishak, od Džafera ibn ez-Zubejra, od Kasima ibn Abdurrahmana, od Ebu Umame, od Ebu Zerra, koji je rekao:\u003c/span> „Upitao sam: ‘Allahov Vjerovjesniče, je li Adem bio vjerovjesnik?’ Odgovorio je: ‘Jeste, bio je vjerovjesnik; Allah mu je govorio neposredno.’“\u003c/p>\u003cp data-paragraph=\"151.3\">Rečeno je da je među onim što je Uzvišeni Allah objavio Ademu bila zabrana strvine, krvi i svinjskog mesa, te slova abecede na dvadeset jednom listu.\u003c/p>","paragraphs":[{"id":"151.1","ar":"أَبِي إِدْرِيسَ الْخَوْلانِيِّ، [عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قال: دخلت المسجد فإذا رسول الله ص جالس وحده، فجلست اليه فقال لي: يَا أَبَا ذَرٍّ، إِنَّ لِلْمَسْجِدِ تَحِيَّةً وَإِنَّ تَحِيَّتَهُ رَكْعَتَانِ، فَقُمْ فَارْكَعْهُمَا، فَلَمَّا رَكَعْتُهُمَا جَلَسْتُ إِلَيْهِ فَقُلْتُ: يَا رَسُولَ اللَّهِ، إِنَّكَ أَمَرْتَنِي بِالصَّلاةِ فَمَا الصَّلاةُ؟ قَالَ: خَيْرُ مَوْضُوعٍ، اسْتُكْثِرَ أَوِ اسْتُقِلَّ، ثُمَّ ذَكَرَ قِصَّةً طَوِيلَةً قَالَ فِيهَا: قُلْتُ: يَا رَسُولَ اللَّهِ، كَمِ الأَنْبِيَاءُ؟ قَالَ: مِائَةُ أَلْفٍ وَأَرْبَعَةٌ وَعِشْرُونَ أَلْفًا، قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، كَمِ الْمُرْسَلُ مِنْ ذلك؟ قال: ثلاثمائة وَثَلاثَةَ عَشَرَ جَمًّا غَفِيرًا، يَعْنِي كَثِيرًا طَيِّبًا، قَالَ: قُلْتُ يَا رَسُولَ اللَّهِ، مَنْ كَانَ أَوَّلَهُمْ؟ قَالَ: آدَمُ، قَالَ: قُلْتُ يَا رَسُولَ اللَّهِ، وَآدَمُ نَبِيٌّ مُرْسَلٌ؟ قَالَ: نَعَمْ خَلَقَهُ اللَّهُ بِيَدِهِ، وَنَفَخَ فِيهِ مِنْ رُوحِهِ، ثُمَّ سَوَّاهُ قُبُلا] .","ar_html":"\u003cspan class=\"isnad\">أَبِي إِدْرِيسَ الْخَوْلانِيِّ، [عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قال\u003c/span>: دخلت المسجد فإذا رسول الله ص جالس وحده، فجلست اليه فقال لي: يَا أَبَا ذَرٍّ، إِنَّ لِلْمَسْجِدِ تَحِيَّةً وَإِنَّ تَحِيَّتَهُ رَكْعَتَانِ، فَقُمْ فَارْكَعْهُمَا، فَلَمَّا رَكَعْتُهُمَا جَلَسْتُ إِلَيْهِ فَقُلْتُ: يَا رَسُولَ اللَّهِ، إِنَّكَ أَمَرْتَنِي بِالص مَامَةَ، [عَنْ أَبِي ذَرٍّ قَال\u003c/span>َ: قُلْتُ، يَا نَبِيَّ اللَّهِ، أَنَبِيًّا كَانَ آدَمُ؟ قَالَ: نَعَمْ، كَانَ نَبِيًّا، كَلَّمَهُ اللَّهُ قُبُلا] .","ar_isnad_ranges":[[0,199]],"bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao mi je Muhammed ibn Ishak, od Džafera ibn ez-Zubejra, od Kasima ibn Abdurrahmana, od Ebu Umame, od Ebu Zerra, koji je rekao: „Upitao sam: ‘Allahov Vjerovjesniče, je li Adem bio vjerovjesnik?’ Odgovorio je: ‘Jeste, bio je vjerovjesnik; Allah mu je govorio neposredno.’“","bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao mi je Muhammed ibn Ishak, od Džafera ibn ez-Zubejra, od Kasima ibn Abdurrahmana, od Ebu Umame, od Ebu Zerra, koji je rekao:\u003c/span> „Upitao sam: ‘Allahov Vjerovjesniče, je li Adem bio vjerovjesnik?’ Odgovorio je: ‘Jeste, bio je vjerovjesnik; Allah mu je govorio neposredno.’“","bs_isnad_count":1},{"id":"151.3","ar":"وَقِيلَ: إِنَّهُ كَانَ مِمَّا أَنْزَلَ اللَّهُ تَعَالَى عَلَى آدَمَ تَحْرِيمُ الْمَيْتَةِ وَالدَّمِ وَلَحْمِ الْخِنْزِيرِ وَحُرُوفُ الْمُعْجَمِ فِي إِحْدَى وعشرين ورقه","ar_html":"وَقِيلَ: إِنَّهُ كَانَ مِمَّا أَنْزَلَ اللَّهُ تَعَالَى عَلَى آدَمَ تَحْرِيمُ الْمَيْتَةِ وَالدَّمِ وَلَحْمِ الْخِنْزِيرِ وَحُرُوفُ الْمُعْجَمِ فِي إِحْدَى وعشرين ورقه","ar_isnad_ranges":[],"bs":"Rečeno je da je među onim što je Uzvišeni Allah objavio Ademu bila zabrana strvine, krvi i svinjskog mesa, te slova abecede na dvadeset jednom listu.","bs_html":"Rečeno je da je među onim što je Uzvišeni Allah objavio Ademu bila zabrana strvine, krvi i svinjskog mesa, te slova abecede na dvadeset jednom listu.","bs_isnad_count":0}],"notes":[]},{"n":152,"ar":"ذكر ولادة حواء شيثا\n\nولما مضى لآدم ص من عمره مائة وثلاثون سنة، وذلك بعد قتل قابيل هابيل بخمس سنين، ولدت له حواء ابنه شيثا، فذكر أهل التوراة أن شيثا ولد فردا بغير توءم، وتفسير شيث عندهم هبة الله، ومعناه أنه خلف من هابيل.\nحَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنِي ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنَا هِشَامٌ، قَالَ: أَخْبَرَنِي أبي، عن أبي صالح، عن ابن عباس، قَالَ: وَلَدَتْ حَوَّاءُ لآدَمَ شِيثًا وَأُخْتَهُ عَزْوَرَا، فَسُمِّيَ هَبَةُ اللَّهِ، اشْتُقَّ لَهُ مِنْ هَابِيلَ، قال لها جبرئيل حِينَ وَلَدَتْهُ: هَذَا هِبَةُ اللَّهِ بَدَلُ هَابِيلَ، وهو بالعربية شث، وبالسريانية شَاثَ، وَبِالْعِبْرَانِيَّةِ شِيثُ، وَإِلَيْهِ أَوْصَى آدَمُ، وَكَانَ آدَمُ يَوْمَ وُلِدَ لَهُ شِيثُ ابْنُ ثَلاثِينَ وَمِائَةِ سَنَةٍ.\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، قَالَ: لَمَّا حَضَرَتْ آدَمَ الْوَفَاةُ- فِيمَا يَذْكُرُونَ وَاللَّهُ أَعْلَمُ- دَعَا ابْنَهُ شِيثًا فَعَهِدَ إِلَيْهِ عَهْدَهُ، وَعَلَّمَهُ سَاعَاتِ اللَّيْلِ وَالنَّهَارِ، وَأَعْلَمَهُ عِبَادَةَ الْخَلْقِ فِي كُلِّ سَاعَةٍ مِنْهُنَّ، فَأَخْبَرَهُ أَنَّ لِكُلِّ سَاعَةٍ صِنْفًا مِنَ الْخَلْقِ فِيهَا عِبَادَتُهُ وَقَالَ لَهُ: يَا بُنَيَّ إِنَّ الطُّوفَانَ سَيَكُونُ فِي الأَرْضِ يَلْبَثُ فِيهَا سَبْعَ سِنِينَ وَكَتَبَ وَصِيَّتَهُ، فَكَانَ شيث- فيما ذكر- وصى ابيه آدم ع، وَصَارَتِ الرِّيَاسَةُ مِنْ بَعْدِ وَفَاةِ آدَمَ لِشِيثٍ، فَأَنْزَلَ اللَّهُ عَلَيْهِ فِيمَا رُوِيَ عَنْ رَسُولِ الله ص خَمْسِينَ صَحِيفَةً.\nحَدَّثَنَا أَحْمَدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ وَهْبٍ، قَالَ: حَدَّثَنَا عَمِّي، قَالَ: حَدَّثَنَا الْمَاضِي بْنُ مُحَمَّدٍ، عَنْ أَبِي سُلَيْمَانَ، عَنِ الْقَاسِمِ بْنِ مُحَمَّدٍ، عَنْ أَبِي إِدْرِيسَ الْخَوْلانِيِّ، [عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، كَمْ","ar_html":"ذكر ولادة حواء شيثا\n\nولما مضى لآدم ص من عمره مائة وثلاثون سنة، وذلك بعد قتل قابيل هابيل بخمس سنين، ولدت له حواء ابنه شيثا، فذكر أهل التوراة أن شيثا ولد فردا بغير توءم، وتفسير شيث عندهم هبة الله، ومعناه أنه خلف من هابيل.\n\n\u003cspan class=\"isnad\">حَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنِي ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنَا هِشَامٌ، قَالَ: أَخْبَرَنِي أبي، عن أبي صالح، عن ابن عباس، قَال\u003c/span>َ: وَلَدَتْ حَوَّاءُ لآدَمَ شِيثًا وَأُخْتَهُ عَزْوَرَا، فَسُمِّيَ هَبَةُ اللَّهِ، اشْتُقَّ لَهُ مِنْ هَابِيلَ، قال لها جبرئيل حِينَ وَلَدَتْهُ: هَذَا هِبَةُ اللَّهِ بَدَلُ هَابِيلَ، وهو بالعربية شث، وبالسريانية شَاثَ، وَبِالْعِبْرَانِيَّةِ شِيثُ، وَإِلَيْهِ أَوْصَى آدَمُ، وَكَانَ آدَمُ يَوْمَ وُلِدَ لَهُ شِيثُ ابْنُ ثَلاثِينَ وَمِائَةِ سَنَةٍ.\n\n\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، قَال\u003c/span>َ: لَمَّا حَضَرَتْ آدَمَ الْوَفَاةُ- فِيمَا يَذْكُرُونَ وَاللَّهُ أَعْلَمُ- دَعَا ابْنَهُ شِيثًا فَعَهِدَ إِلَيْهِ عَهْدَهُ، وَعَلَّمَهُ سَاعَاتِ اللَّيْلِ وَالنَّهَارِ، وَأَعْلَمَهُ عِبَادَةَ الْخَلْقِ فِي كُلِّ سَاعَةٍ مِنْهُنَّ، فَأَخْبَرَهُ أَنَّ لِكُلِّ سَاعَةٍ صِنْفًا مِنَ الْخَلْقِ فِيهَا عِبَادَتُهُ وَقَالَ لَهُ: يَا بُنَيَّ إِنَّ الطُّوفَانَ سَيَكُونُ فِي الأَرْضِ يَلْبَثُ فِيهَا سَبْعَ سِنِينَ وَكَتَبَ وَصِيَّتَهُ، فَكَانَ شيث- فيما ذكر- وصى ابيه آدم ع، وَصَارَتِ الرِّيَاسَةُ مِنْ بَعْدِ وَفَاةِ آدَمَ لِشِيثٍ، فَأَنْزَلَ اللَّهُ عَلَيْهِ \u003cspan class=\"isnad\">فِيمَا رُوِيَ عَنْ رَسُولِ الله ص\u003c/span> خَمْسِينَ صَحِيفَةً.\n\n\u003cspan class=\"isnad\">حَدَّثَنَا أَحْمَدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ وَهْبٍ، قَالَ: حَدَّثَنَا عَمِّي، قَالَ: حَدَّثَنَا الْمَاضِي بْنُ مُحَمَّدٍ، عَنْ أَبِي سُلَيْمَانَ، عَنِ الْقَاسِمِ بْنِ مُحَمَّدٍ، عَنْ أَبِي إِدْرِيسَ الْخَوْلانِيِّ، [عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قَال\u003c/span>َ: قُلْتُ: يَا رَسُولَ اللَّهِ، كَمْ","bs":"\u003cp data-paragraph=\"152.1\">Spomen Havvinog rođenja Šisa\u003c/p>\u003cp data-paragraph=\"152.2\">Kada je Adem, sallallahu alejhi ve sellem, napunio stotinu trideset godina — pet godina nakon što je Kabil ubio Habila — Havva mu je rodila sina Šisa. Sljedbenici Tevrata navode da je Šis rođen sam, bez blizanca. Šis kod njih znači „Allahov dar“, a smisao je da je zamjena za Habila.\u003c/p>\u003cp data-paragraph=\"152.3\">\u003cspan class=\"isnad\">Pričao mi je Haris ibn Muhammed, koji je rekao: pričao mi je Ibn Sa‘d, koji je rekao: obavijestio nas je Hišam, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao:\u003c/span> „Havva je Ademu rodila Šisa i njegovu sestru Azuru. Nazvan je Hibetullah — Allahov dar — i ime mu je izvedeno iz Habilovog. Džibril joj je, kada ga je rodila, rekao: ‘Ovo je Allahov dar kao zamjena za Habila.’ Na arapskom je Šes, na sirjačkom Šas, a na hebrejskom Šis. Njemu je Adem ostavio oporuku. Kada mu je Šis rođen, Adem je imao stotinu trideset godina.“ \u003cspan class=\"translator-note\">⟦Oblici imena u izvoru: arapski شث, sirjački شاث, hebrejski شيث; sestrino ime عزورا.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"152.4\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, koji je rekao:\u003c/span> „Kada se Ademu približila smrt — prema onome što navode, a Allah najbolje zna — pozvao je svoga sina Šisa i dao mu svoju oporuku. Poučio ga je satima noći i dana i obavijestio o ibadetu stvorenja u svakom od tih sati. Kazao mu je da u svakom satu jedna skupina stvorenja obavlja svoj ibadet. Rekao mu je: ‘Sine moj, na Zemlji će biti Potop koji će trajati sedam godina.’ Napisao je svoju oporuku.“ Prema onome što je navedeno, Šis je bio oporučeni nasljednik svoga oca Adema, alejhis-selam, i nakon Ademove smrti njemu je pripalo poglavarstvo. Allah mu je, prema onome \u003cspan class=\"isnad\">što je preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem,\u003c/span> spustio pedeset listova objave.\u003c/p>\u003cp data-paragraph=\"152.5\">\u003cspan class=\"isnad\">Pričao nam je Ahmed ibn Abdurrahman ibn Vehb, koji je rekao: pričao nam je moj amidža, koji je rekao: pričao nam je Madi ibn Muhammed, od Ebu Sulejmana, od Kasima ibn Muhammeda, od Ebu Idrisa el-Havlanija, od Ebu Zerra el-Gifarija, koji je rekao:\u003c/span> „Upitao sam: ‘Allahov Poslaniče, koliko je\u003c/p>","paragraphs":[{"id":"152.1","ar":"ذكر ولادة حواء شيثا","ar_html":"ذكر ولادة حواء شيثا","ar_isnad_ranges":[],"bs":"Spomen Havvinog rođenja Šisa","bs_html":"Spomen Havvinog rođenja Šisa","bs_isnad_count":0},{"id":"152.2","ar": Zerra el-Gifarija, koji je rekao:\u003c/span> „Upitao sam: ‘Allahov Poslaniče, koliko je","bs_isnad_count":1}],"notes":[]}]}</script><script id="databaseData" type="application/json">[{"stranica":128,"ar_tekst":"حِينَ أُهْبِطَ عَلَى الْجَبَلِ إِلَى قَضِيبٍ مِنْ حَدِيدٍ نَابِتٍ عَلَى الْجَبَلِ، فَقَالَ: هَذَا مِنْ هَذَا، فَجَعَلَ يَكْسِرُ أَشْجَارًا قَدْ عَتِقَتْ وَيَبِسَتْ بِالمِطْرَقَةِ، ثُمَّ أَوْقَدَ عَلَى ذَلِكَ الْغُصْنُ حَتَّى ذَابَ، فَكَانَ أَوَّلُ شَيْءٍ ضَرَبَهُ مُدْيَةً، فَكَانَ يَعْمَلُ بِهَا، ثُمَّ ضَرَبَ التَّنُّورَ، وَهُوَ الَّذِي وَرِثَهُ نُوحٌ، وَهُوَ الَّذِي فَارَ بِالْعَذَابِ بِالْهِنْدِ.","bs_tekst":"željeznu šipku koja je izrastala na planini i rekao: ‘Ovo je od ovoga.’ Čekićem je počeo lomiti stara i osušena stabla, zatim je nad tom granom raspalio vatru dok se nije istopila. Prvo što je iskovao bio je nož kojim je radio. Zatim je iskovao peć, koju je naslijedio Nuh, i to je ona iz koje je u Indiji izbio talas kazne."},{"stranica":128,"ar_tekst":"وَكَانَ آدَمُ حِينَ هَبَطَ يَمْسَحُ رَأْسَهُ السَّمَاءُ، فَمِنْ ثَمَّ صَلِعَ، وَأَوْرَثَ وَلَدَهُ الصَّلَعَ وَنَفَرَتْ مِنْ طُولِهِ دَوَابُّ الْبَرِّ، فَصَارَتْ وَحْشًا مِنْ يومئذ، وكان آدم ع وَهُوَ عَلَى ذَلِكَ الْجَبَلِ قَائِمٌ يَسْمَعُ أَصْوَاتَ الْمَلائِكَةِ، وَيَجِدُ رِيحَ الْجَنَّةِ، فَحُطَّ مِنْ طُولِهِ ذَلِكَ إِلَى سِتِّينَ ذِرَاعًا، فَكَانَ ذَلِكَ طُولُهُ إِلَى أَنْ مَاتَ وَلَمْ يُجْمَعْ حُسْنُ آدَمَ ع لأحد من ولده الا ليوسف ع.","bs_tekst":"Kada je Adem spušten, nebo mu je dodirivalo glavu. Zato je oćelavio i svojim potomcima prenio ćelavost. Zemaljske životinje prepale su se njegove visine, pa su od toga dana postale divlje. Dok je Adem, alejhis-selam, stajao na toj planini, slušao je glasove meleka i osjećao džennetski miris. Zatim je njegova visina smanjena na šezdeset lakata i takva je ostala do njegove smrti. Ademova, alejhis-selam, ljepota nije u cijelosti objedinjena ni u jednom njegovom potomku osim u Jusufu, alejhis-selam."},{"stranica":128,"ar_tekst":"وَقِيلَ: إِنَّ مِنَ الثِّمَارِ الَّتِي زَوَّدَ اللَّهُ عز وجل آدم ع حين اهبط إِلَى الأَرْضِ ثَلاثِينَ نَوْعًا، عَشَرَةً مِنْهَا فِي الْقُشُورِ وَعَشَرَةً لَهَا نَوَى، وَعَشَرَةً لا قُشُورَ لَهَا وَلا نَوَى فَأَمَّا الَّتِي فِي الْقُشُورِ مِنْهَا فَالْجَوْزُ، وَاللَّوْزُ، وَالْفُسْتُقُ، وَالْبُنْدُقُ، وَالْخَشْخَاشُ، وَالْبَلُّوطُ، والشاهبلوط، وَالرَّانِجُ، وَالرُّمَّانُ، وَالْمَوْزُ وَأَمَّا الَّتِي لَهَا نَوَى مِنْهَا فَالْخَوْخُ، وَالْمِشْمِشُ، وَالإِجَّاصُ، وَالرُّطَبُ، وَالْغُبَيْرَاءُ، وَالنَّبَقُ، وَالزُّعْرُورُ، وَالْعِنَّابُ، وَالْمُقْلُ، وَالشَّاهَلُوجُ وَأَمَّا الَّتِي لا قُشُورَ لَهَا وَلا نَوَى فَالتُّفَّاحُ، وَالسَّفَرْجَلُ، وَالْكُمَّثْرَى، وَالْعِنَبُ، وَالتُّوتُ، وَالتِّينُ، وَالأُتْرُجُّ، وَالْخُرْنُوبُ، وَالْخِيارُ، وَالْبِطِّيخُ.","bs_tekst":"Rečeno je da je među plodovima kojima je Allah, Silan i Uzvišen, opskrbio Adema, alejhis-selam, kada je spušten na Zemlju, bilo trideset vrsta: deset u ljuskama, deset s košticama i deset bez ljuske i koštice. U ljuskama su: orah, badem, pistacija, lješnjak, mak, žir, pitomi kesten, randž, nar i banana. S košticama su: breskva, kajsija, šljiva, svježa datula, gubejra, nebek, glog, unab, mukl i šahludž. Bez ljuske i koštice su: jabuka, dunja, kruška, grožđe, dud, smokva, četrun, rogač, krastavac i lubenica. ⟦Napomena prevodioca: klasifikacija i svih trideset naziva sačuvani su prema izvoru. Nazivi الرانج، الغبيراء، النبق، العناب، المقل، الشاهلوج preneseni su kao randž, gubejra, nebek, unab, mukl i šahludž; njihova precizna botanička identifikacija nije ovdje potvrđena.⟧"},{"stranica":128,"ar_tekst":"وَقِيلَ: كَانَ مِمَّا أَخْرَجَ آدَمُ مَعَهُ مِنَ الْجَنَّةِ صُرَّةٌ مِنْ حِنْطَةٍ، وَقِيلَ: إِنَّ الْحِنْطَةَ انما جاءه بها جبرئيل ع بَعْدَ أَنْ جَاعَ آدَمُ، وَاسْتَطْعَمَ رَبَّهُ، فَبَعَثَ الله اليه مع جبرئيل ع بِسَبْعِ حَبَّاتٍ مِنْ حِنْطَةٍ، فَوَضَعَهَا فِي يَدِ آدم ع، فقال آدم لجبرئيل: ما هذا؟ فقال له جبرئيل: هَذَا الَّذِي أَخْرَجَكَ مِنَ الْجَنَّةِ، وَكَانَ وَزْنُ الحبه منها مائه الف درهم وثمانمائه دِرْهَمٍ، فَقَالَ آدَمُ:\nمَا أَصْنَعُ بِهَذَا؟ قَالَ: انْثُرْهُ فِي الأَرْضِ فَفَعَلَ، فَأَنْبَتَهُ اللَّهُ عَزَّ وَجَلَّ مِنْ سَاعَتِهِ، فَجَرَتْ سُنَّةٌ فِي وَلَدِهِ الْبَذْرُ فِي الأَرْضِ، ثُمَّ أَمَرَهُ فَحَصَدَهُ، ثُمَّ أَمَرَهُ فَجَمَعَهُ وَفَرَكَهُ بِيَدِهِ، ثُمَّ أَمَرَهُ أَنْ يُذْرِيَهُ، ثُمَّ أَتَاهُ بِحَجَرَيْنِ فَوَضَعَ أَحَدَهُمَا عَلَى الآخر","bs_tekst":"Rečeno je da je Adem sa sobom iz Dženneta iznio i vrećicu pšenice. Rečeno je i da mu je pšenicu donio Džibril, alejhis-selam, nakon što je Adem ogladnio i zatražio hranu od svoga Gospodara. Allah mu je preko Džibrila, alejhis-selam, poslao sedam zrna pšenice, pa ih je stavio u Ademovu, alejhis-selam, ruku. Adem je upitao Džibrila: ‘Šta je ovo?’ Džibril mu je odgovorio: ‘Ovo je ono što te izvelo iz Dženneta.’ Težina jednoga zrna bila je stotinu hiljada i osam stotina dirhema. Adem je rekao: ‘Šta da radim s ovim?’ Odgovorio je: ‘Posij to po zemlji.’ Učinio je to, pa je Allah, Silan i Uzvišen, dao da nikne istoga časa. Tako je sijanje po zemlji postalo ustaljena praksa među njegovim potomcima. Zatim mu je naredio da požanje, pa je požnjeo. Potom mu je naredio da sakupi i protrlja rukama, zatim da ovije. Onda mu je donio dva kamena i položio jedan na drugi,"},{"stranica":129,"ar_tekst":"فَطَحَنَهُ، ثُمَّ أَمَرَهُ أَنْ يَعْجِنَهُ، ثُمَّ أَمَرَهُ ان يخبزه مله، وجمع له جبرئيل ع الْحَجَرَ وَالْحَدِيدَ فَقَدَحَهُ، فَخَرَجَتْ مِنْهُ النَّارُ، فَهُوَ أول من خبز الملة.","bs_tekst":"pa je samljeo. Zatim mu je naredio da zamijesi i da ispeče hljeb u žaru. Džibril, alejhis-selam, sakupio mu je kamen i željezo, kresnuo ih i iz njih je izašla vatra. Tako je on bio prvi koji je pekao hljeb u žaru.“"},{"stranica":129,"ar_tekst":"وهذا القول الَّذِي حَكَيْنَاهُ عَنْ قَائِلِ هَذَا الْقَوْلِ، خِلافُ مَا جَاءَتْ بِهِ الرِّوَايَاتُ عَنْ سَلَفِ أُمَّةِ نبينا ص، وَذَلِكَ أَنَّ الْمُثَنَّى بْنَ إِبْرَاهِيمَ حَدَّثَنِي أَنَّ إِسْحَاقَ حَدَّثَهُ، قَالَ: حَدَّثَنَا عَبْدُ الرَّزَّاقِ، قَالَ: أَخْبَرَنَا سُفْيَانُ بْنُ عُيَيْنَةَ وَابْنُ الْمُبَارَكِ، عَنِ الْحَسَنِ بْنِ عُمَارَةَ، عَنِ الْمِنْهَالِ بْنِ عَمْرٍو، وعن سعيد ابن جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: كَانَتِ الشَّجَرَةَ الَّتِي نَهَى اللَّهُ عَنْهَا آدَمَ وَزَوْجَتَهُ السُّنْبُلَةُ، فَلَمَّا أَكَلا مِنْهَا بَدَتْ لَهُمَا سَوْءَاتُهُمَا، وَكَانَ الَّذِي وَارَى عَنْهُمَا مِنْ سَوْءَاتِهِمَا أَظْفَارُهُمَا، وَطَفِقَا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ، وَرَقِ التِّينِ يُلْصِقَانِ بَعْضَهَا إِلَى بَعْضٍ، فَانْطَلَقَ آدَمُ مُوَلِّيًا فِي الْجَنَّةِ، فَأَخَذَتْ بِرَأْسِهِ شَجَرَةٌ مِنَ الْجَنَّةِ فَنَادَاهُ: يَا آدَمُ، أَمِنِّي تَفِرُّ؟ قَالَ: لا، ولكنى استحيتك يَا رَبِّ، قَالَ: أَمَا كَانَ لَكَ فِيمَا مَنَحْتُكَ مِنَ الْجَنَّةِ وَأَبَحْتُكَ مِنْهَا مَنْدُوحَةٌ عَمَّا حَرَّمْتُ عَلَيْكَ! قَالَ: بَلَى يَا رَبِّ، وَلَكِنْ وَعِزَّتِكَ مَا حَسِبْتُ أَنَّ أَحَدًا يَحْلِفُ بِكَ كَاذِبًا، قَالَ- وَهُوَ قَوْلُ اللَّهِ تَبَارَكَ وَتَعَالَى: «وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» - قَالَ: فَبِعِزَّتِي لأُهْبِطَنَّكَ إِلَى الأَرْضِ، فَلا تَنَالُ الْعَيْشَ إِلا كَدًّا.","bs_tekst":"Ovo mišljenje koje smo prenijeli od onoga koji ga zastupa suprotno je onome što su donijele predaje od prethodnika iz ummeta našeg Vjerovjesnika, sallallahu alejhi ve sellem. Naime, Musenna ibn Ibrahim pričao mi je da mu je Ishak pričao, rekavši: pričao nam je Abdurrezzak, koji je rekao: obavijestili su nas Sufjan ibn Ujejna i Ibn el-Mubarek, od Hasena ibn Umare, od Minhala ibn Amra i od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Drvo koje je Allah zabranio Ademu i njegovoj supruzi bio je klas. Kada su jeli s njega, otkrila su im se stidna mjesta. Ono što im je skrivalo stidna mjesta bili su njihovi nokti. Počeli su po sebi spajati džennetsko lišće, lišće smokve, lijepeći jedne listove uz druge. Adem je okrenuo leđa i krenuo po Džennetu, pa mu je jedno džennetsko drvo zahvatilo glavu. Dozvao ga je: ‘Ademe, zar bježiš od Mene?’ Odgovorio je: ‘Ne, nego sam Te se postidio, Gospodaru moj.’ Rekao je: ‘Zar ti u onome što sam ti podario od Dženneta i dopustio ti u njemu nije bilo dovoljno prostora da se kloniš onoga što sam ti zabranio?’ Odgovorio je: ‘Jeste, Gospodaru moj, ali tako mi Tvoje moći, nisam mislio da bi se iko mogao Tobom lažno zakleti.’“ Rekao je — a to su riječi Allaha, Blagoslovljenog i Uzvišenog: „I zakleo im se: Ja sam vam, doista, iskren savjetnik.“ Rekao je: „Tako Mi Moje moći, sigurno ću te spustiti na Zemlju, pa do životne opskrbe nećeš dolaziti osim mukotrpnim radom.“"},{"stranica":129,"ar_tekst":"قَالَ: فَأُهْبِطَ مِنَ الْجَنَّةِ، وَكَانَا يَأْكُلانِ فِيهَا رَغَدًا، فَأُهْبِطَ إِلَى غَيْرِ رَغَدٍ مِنْ طَعَامٍ وَشَرَابٍ، فَعُلِّمَ صَنْعَةَ الْحَدِيدِ، وَأُمِرَ بِالْحَرْثِ فَحَرَثَ وَزَرَعَ ثُمَّ سَقَى، حَتَّى إِذَا بَلَغَ حَصَدَهُ، ثُمَّ دَاسَهُ، ثُمَّ ذَرَاهُ، ثُمَّ طَحَنَهُ، ثُمَّ عَجَنَهُ، ثُمَّ خَبَزَهُ، ثُمَّ اكله، فلم يبلغه حَتَّى بَلَغَ مِنْهُ مَا شَاءَ اللَّهُ أَنْ يبلغ","bs_tekst":"Rekao je: „Spušten je iz Dženneta, a njih dvoje u njemu su jeli obilno. Spušten je tamo gdje hrana i piće nisu bili obilno dostupni. Poučen je obradi željeza i naređeno mu je da ore, pa je orao i sijao, zatim zalijevao. Kada je sazrelo, požnjeo je, potom ovršio, ovijao, samljeo, zamijesio, ispekao i zatim jeo. Do toga nije stigao dok ga nije zadesilo onoliko napora koliko je Allah htio da ga zadesi.“ ⟦Prijevod izričitog kur’anskog navoda u prethodnom odlomku: El-A‘raf, 7:21.⟧"},{"stranica":130,"ar_tekst":"حدثنا ابن حميد، قال: حدثنا يعقوب، عن جعفر، عن سعيد، قال: أهبط إلى آدم ثور احمر، فكان يحدث عليه، ويمسح العرق عن جبينه، فهو الذي قال الله عز وجل: «فَلا يُخْرِجَنَّكُما مِنَ الْجَنَّةِ فَتَشْقى» ، فكان ذلك شقاؤه.","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jakub, od Džafera, od Seida, koji je rekao: „Ademu je spušten crveni bik, pa je njime [orao — nesigurno čitanje] i brisao znoj sa čela. To je ono što je Allah, Silan i Uzvišen, rekao: ‘Neka vas zato ne izvede iz Dženneta, pa da se mučiš.’ To je bila njegova muka.“ ⟦Prijevod kur’anskog navoda: Ta-Ha, 20:117, navedeni dio. Napomena prevodioca: izvor ima فكان يحدث عليه, nejasnu formulaciju koja nije doslovan izraz za oranje. Predloženo čitanje zasniva se na kontekstu i zahtijeva provjeru štampanog izdanja.⟧"},{"stranica":130,"ar_tekst":"فهذا الذي قاله هؤلاء هو أولى بالصواب، وأشبه بما دل عليه كتاب ربنا عز وجل، وذلك أن الله عز ذكره لما تقدم إلى آدم وزوجته حواء بالنهي عن طاعة عدوهما، قال لآدم: «يَا آدَمُ إِنَّ هَذَا عَدُوٌّ لَكَ وَلِزَوْجِكَ فَلا يُخْرِجَنَّكُما مِنَ الْجَنَّةِ فَتَشْقى إِنَّ لَكَ أَلَّا تَجُوعَ فِيها وَلا تَعْرى.\nوَأَنَّكَ لا تَظْمَؤُا فِيها وَلا تَضْحى» ، فكان معلوما أن الشقاء الذي أعلمه أنه يكون إن أطاع عدوه إبليس، هو مشقة الوصول إلى ما يزيل الجوع والعري عنه، وذلك هي الأسباب التي بها يصل أولاده إلى الغذاء، من حراثة وبذر وعلاج وسقي، وغير ذلك من الأسباب الشاقة المؤلمة ولو كان جبرئيل أتاه بالغذاء الذي يصل إليه ببذره دون سائر المؤن غيره، لم يكن هناك من الشقاء الذي توعده به ربه على طاعة الشيطان ومعصية الرحمن كبير خطب، ولكن الأمر كان- والله أعلم- على ما روينا عن ابْنِ عَبَّاسٍ وغيره.","bs_tekst":"Ono što su ovi rekli preče je smatrati ispravnim i bliže je onome na šta ukazuje Knjiga našeg Gospodara, Silnog i Uzvišenog. Kada je Allah, Silan je spomen Njegov, unaprijed zabranio Ademu i njegovoj supruzi Havvi da se pokore svome neprijatelju, rekao je Ademu: „Ademe, ovo je neprijatelj tebi i tvojoj supruzi. Neka vas zato ne izvede iz Dženneta, pa da se mučiš! U njemu nećeš ni gladovati ni go biti. U njemu nećeš ni žednjeti ni Sunčevoj žezi biti izložen.“ Zato je bilo poznato da je muka o kojoj ga je obavijestio da će ga snaći ako se pokori svome neprijatelju Iblisu teškoća dolaska do onoga što će s njega ukloniti glad i golotinju. To su načini pomoću kojih njegovi potomci dolaze do hrane: oranje, sijanje, trud, zalijevanje i druga teška i bolna sredstva. Da mu je Džibril donosio hranu do koje bi došao samo sijanjem, bez svih ostalih napora, ne bi bilo velike teškoće u muci kojom mu je Gospodar zaprijetio zbog pokornosti šejtanu i nepokornosti Milostivom. Međutim, stvar je bila — a Allah najbolje zna — onakva kakvu smo prenijeli od Ibn Abbasa i drugih. ⟦Prijevod kur’anskog navoda: Ta-Ha, 20:117–119.⟧"},{"stranica":130,"ar_tekst":"وقد قيل: إن آدم ع نزل معه السندان، والكلبتان، والميقعة، والمطرقة.","bs_tekst":"Rečeno je da su s Ademom, alejhis-selam, spušteni nakovanj, kliješta, udarač i čekić."},{"stranica":130,"ar_tekst":"ذِكْرُ من قال ذلك:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":130,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا الحسين، عَنْ عَلْبَاءَ بْنِ أَحْمَرَ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: ثَلاثَةُ أَشْيَاءٍ نَزَلَتْ مَعَ آدم ع: السِّنْدَانُ، وَالْكَلْبَتَانِ، وَالْمِيقَعَةُ، وَالْمِطْرَقَةُ","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jahja ibn Vadih, koji je rekao: pričao nam je Husejn, od Albaa ibn Ahmera, od Ikrime, od Ibn Abbasa, koji je rekao: „Tri stvari spuštene su s Ademom, alejhis-selam: nakovanj, kliješta, udarač i čekić.“ ⟦Napomena prevodioca: izvor kaže „tri stvari“, a navodi četiri naziva: السندان، الكلبتان، الميقعة، المطرقة. Broj i svi nazivi ostavljeni su kako stoje; „udarač“ prenosi الميقعة, naziv alata koji se upotrebljava i u značenju čekića.⟧"},{"stranica":131,"ar_tekst":"ثُمَّ إِنَّ اللَّهَ عَزَّ ذِكْرُهُ فِيمَا ذُكِرَ أَنْزَلَ آدَمَ مِنَ الْجَبَلِ الَّذِي أَهْبَطَهُ عَلَيْهِ إِلَى سَفْحِهِ، وَمَلَّكَهُ الأَرْضَ كُلَّهَا، وَجَمِيعَ مَا عَلَيْهَا مِنَ الْجِنِّ وَالْبَهَائِمِ وَالدَّوَابِّ وَالْوَحْشِ وَالطَّيْرِ وغير ذلك، وان آدم ع لَمَّا نَزَلَ مِنْ رَأْسِ ذَلِكَ الْجَبَلِ، وَفَقَدَ كَلامَ أَهْلِ السَّمَاءِ، وَغَابَتْ عَنْهُ أَصْوَاتُ الْمَلائِكَةِ، وَنَظَرَ إِلَى سِعَةِ الأَرْضِ وَبَسْطَتِهَا، وَلَمْ يَرَ فِيهَا أَحَدًا غَيْرَهُ، اسْتَوْحَشَ فَقَالَ: يَا رَبِّ، أَمَا لأَرْضِكَ هَذِهِ عَامِرٌ يُسَبِّحُكَ غَيْرِي! فأجيب بما حَدَّثَنِي المثنى بن إبراهيم، قال: أخبرنا إسحاق بن الحجاج، قال: حدثنا إسماعيل بن عبد الكريم، قال: حدثنى عبد الصمد ابن معقل، أنه سمع وهبا يقول: إن آدم لما أهبط إلى الأرض فرأى سعتها ولم ير فيها أحدا غيره قال: يا رب، أما لأرضك هذه عامر يسبح بحمدك ويقدس لك غيري! قال الله: إني سأجعل فيها من ولدك من يسبح بحمدي ويقدسني، وسأجعل فيها بيوتا ترفع لذكري، ويسبح فيها خلقي، ويذكر فيها اسمي، وسأجعل من تلك البيوت بيتا أخصه بكرامتي، وأوثره باسمي، وأسميه بيتي، أنطقه بعظمتي، وعليه وضعت جلالي ثم أنا مع ذلك في كل شيء ومع كل شيء، أجعل ذلك البيت حرما آمنا يحرم بحرمته من حوله ومن تحته ومن فوقه، فمن حرمه بحرمتي استوجب بذلك كرامتي، ومن أخاف أهله فيه فقد أخفر ذمتي، وأباح حرمتي أجعله أول بيت وضع للناس ببطن مكة مباركا، يأتونه شعثا غبرا على كل ضامر، من كل فج عميق، يرجون بالتلبية رجيجا، ويثجون بالبكاء ثجيجا، ويعجون بالتكبير عجيجا، فمن اعتمده ولا يريد غيره فقد وفد إليَّ وزارني وضافني، وحق على الكريم أن يكرم وفده وأضيافه، وأن يسعف كلا بحاجته تعمره يا آدم ما كنت حيا، ثم تعمره الأمم والقرون والأنبياء من ولدك أمة بعد أمة، وقرنا بعد قرن.","bs_tekst":"Zatim je Allah, Silan je spomen Njegov, prema onome što je navedeno, spustio Adema s planine na koju ga je bio spustio do njenog podnožja i dao mu vlast nad cijelom Zemljom i svim što je na njoj: džinima, stokom, životinjama, zvijerima, pticama i drugim. Kada je Adem, alejhis-selam, sišao s vrha te planine, ostao bez govora stanovnika neba, prestao čuti glasove meleka i pogledao prostranost i širinu Zemlje, a na njoj nije vidio nikoga osim sebe, osjetio je osamljenost i rekao: „Gospodaru moj, zar na ovoj Tvojoj Zemlji nema nikoga osim mene ko Te slavi?“ Odgovoreno mu je onim što mi je pričao Musenna ibn Ibrahim, koji je rekao: obavijestio nas je Ishak ibn el-Hadždžadž, koji je rekao: pričao nam je Ismail ibn Abdulkerim, koji je rekao: pričao mi je Abdussamed ibn Ma‘kil, da je čuo Vehba kako govori: „Kada je Adem spušten na Zemlju, vidio njenu prostranost i nije vidio nikoga osim sebe, rekao je: ‘Gospodaru moj, zar na ovoj Tvojoj Zemlji nema nikoga osim mene ko Te s hvalom slavi i svetost Ti iskazuje?’ Allah je rekao: ‘Na njoj ću učiniti od tvojih potomaka one koji će Me s hvalom slaviti i svetost Mi iskazivati. Na njoj ću učiniti domove koji će biti podignuti radi Moga spominjanja, u kojima će Me Moja stvorenja slaviti i spominjati Moje ime. Jedan od tih domova posebno ću počastiti, izdvojiti Svojim imenom i nazvati Svojim Hramom. Dat ću mu da govori o Mojoj veličini i na njega položiti Svoje veličanstvo. Uz sve to, Ja sam u svemu i sa svime. Taj ću Hram učiniti sigurnim svetim prostorom, čijom će svetošću biti sveto ono oko njega, ispod njega i iznad njega. Ko ga bude poštovao kao svetoga zbog Moje svetosti, time će zavrijediti Moju počast. Ko u njemu bude zastrašivao njegove stanovnike, prekršit će Moju zaštitu i povrijediti Moju svetost. Učinit ću ga prvim Hramom postavljenim ljudima u unutrašnjosti Meke, blagoslovljenim. Dolazit će mu raščupani i prašnjavi, na svakoj iscrpljenoj devi, iz svakog dalekog klanca; glasno će izgovarati telbiju, obilno plakati i snažno uzvikivati tekbir. Ko se njemu uputi, ne želeći ništa drugo, došao je Meni, posjetio Me i bio Moj gost. Plemenitome priliči da počasti svoje izaslanike i goste i svakome udovolji njegovoj potrebi. Ti ćeš ga, Ademe, posjećivati i održavati dok si živ, a zatim će ga posjećivati i održavati narodi, naraštaji i vjerovjesnici od tvojih potomaka, narod za narodom i naraštaj za naraštajem.’“"},{"stranica":131,"ar_tekst":"ثم أمر آدم ع- فيما ذكر- أن يأتي البيت الحرام الذي اهبط","bs_tekst":"Zatim je Ademu, alejhis-selam, prema onome što je navedeno, naređeno da dođe Svetom Hramu koji mu je spušten"},{"stranica":132,"ar_tekst":"له إلى الأرض، فيطوف به كما كان يرى الملائكة تطوف حول عرش الله، وكان ذلك ياقوتة واحدة أو درة واحدة، كما حدثني الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن أبان، أن البيت أهبط ياقوتة واحدة أو درة واحدة، حتى إذا أغرق الله قوم نوح رفعه وبقي أساسه، فبوأه الله عز وجل لإبراهيم فبناه، وقد ذكرت الأخبار الواردة بذلك فيما مضى قبل.","bs_tekst":"na Zemlju i da ga obilazi kao što je viđao meleke kako obilaze oko Allahovog Arša. Bio je to jedan rubin ili jedan biser, kako mi je pričao Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Ebana: „Hram je spušten kao jedan rubin ili jedan biser. Kada je Allah potopio Nuhov narod, podigao ga je, a njegovi temelji ostali su. Allah, Silan i Uzvišen, odredio ih je Ibrahimu, pa ga je izgradio.“ Već sam ranije naveo predaje koje govore o tome."},{"stranica":132,"ar_tekst":"فذكر ان آدم ع بكى واشتد بكاؤه على خطيئته، وندم عليها، وسأل الله عز وجل قبول توبته، وغفران خطيئته، فقال في مسألته إياه: ما سأل من ذلك، كما حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا ابْنُ عَطِيَّةَ، عَنْ قَيْسٍ، عَنِ ابْنِ أَبِي لَيْلَى، عَنِ الْمِنْهَالِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ: «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ فَتابَ عَلَيْهِ» قَالَ: أَيْ رَبِّ، أَلَمْ تَخْلُقْنِي بِيَدِكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَنْفُخْ فِيَّ مِنْ رُوحِكَ؟\nقَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تُسْكِنِّي جَنَّتَكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَسْبِقْ رَحْمَتُكَ غَضَبَكَ؟ قَالَ: بَلَى، قَالَ: أَرَأَيْتَ إِنْ تُبْتُ وَأَصْلَحْتُ أَرَاجِعِي أَنْتَ إِلَى الْجَنَّةِ؟ قَالَ: بَلَى، قَالَ: فَهُوَ قَوْلُهُ تعالى: «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» .","bs_tekst":"Navedeno je da je Adem, alejhis-selam, plakao, gorko oplakivao svoj grijeh, kajao se zbog njega i molio Allaha, Silnog i Uzvišenog, da mu primi pokajanje i oprosti grijeh. U svojoj molbi izgovorio je ono što je tražio, kako nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Ibn Atijja, od Kajsa, od Ibn Ebu Lejle, od Minhala, od Seida ibn Džubejra, od Ibn Abbasa, o riječima: „Adem je od svoga Gospodara primio riječi, pa mu je On prihvatio pokajanje.“ Rekao je: „‘Gospodaru moj, zar me nisi stvorio Svojom rukom?’ Odgovorio je: ‘Jesam.’ Rekao je: ‘Gospodaru moj, zar u mene nisi udahnuo od Svoga Duha?’ Odgovorio je: ‘Jesam.’ Rekao je: ‘Gospodaru moj, zar me nisi nastanio u Svome Džennetu?’ Odgovorio je: ‘Jesam.’ Rekao je: ‘Gospodaru moj, zar Tvoja milost nije prethodila Tvojoj srdžbi?’ Odgovorio je: ‘Jeste.’ Rekao je: ‘Reci mi, ako se pokajem i popravim, hoćeš li me vratiti u Džennet?’ Odgovorio je: ‘Hoću.’“ Rekao je: „To su Njegove, Uzvišeni je On, riječi: ‘Adem je od svoga Gospodara primio riječi.’“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dijelovi.⟧"},{"stranica":132,"ar_tekst":"حَدَّثَنِي بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زريع، عن سعيد، عن قتادة، قوله تعالى «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» ذكر لنا أنه قال:\nيا رب: أرأيت إن أنا تبت وأصلحت! قال: إذا أرجعك إلى الجنة، قال:\n\nوقال الحسن: إنهما قالا: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .","bs_tekst":"Pričao mi je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, od Seida, od Katade, o riječima Uzvišenog: „Adem je od svoga Gospodara primio riječi.“ „Navedeno nam je da je rekao: ‘Gospodaru moj, reci mi, ako se pokajem i popravim?’ Odgovorio je: ‘Tada ću te vratiti u Džennet.’“ Rekao je: „Hasen je rekao: ‘Njih dvoje rekli su: Gospodaru naš, sami smo sebi nepravdu učinili. Ako nam ne oprostiš i ne smiluješ nam se, sigurno ćemo biti među gubitnicima.’“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dio; El-A‘raf, 7:23.⟧"},{"stranica":132,"ar_tekst":"حدثنا أحمد بن إسحاق الأهوازي، قال: حدثنا أبو أحمد، قال: حَدَّثَنَا سفيان وقيس، عن خصيف، عن مجاهد، في قوله عز وجل:","bs_tekst":"Pričao nam je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričali su nam Sufjan i Kajs, od Husajfa, od Mudžahida, o riječima Njega, Silnog i Uzvišenog:"},{"stranica":133,"ar_tekst":"«فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» قال: قوله: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .","bs_tekst":"„Adem je od svoga Gospodara primio riječi.“ Rekao je: „To su njegove riječi: ‘Gospodaru naš, sami smo sebi nepravdu učinili. Ako nam ne oprostiš i ne smiluješ nam se, sigurno ćemo biti među gubitnicima.’“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dio; El-A‘raf, 7:23.⟧"},{"stranica":133,"ar_tekst":"حَدَّثَنِي الحارث، قال: حدثنا ابن سعد، قال: أخبرنا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أَخْبَرَنَا أَبِي، عَنْ أَبِي صَالِحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أَنْزَلَ آدَمُ مَعَهُ حِينَ أُهْبِطَ مِنَ الْجَنَّةِ الْحَجَرَ الأَسْوَدَ، وَكَانَ أَشَدَّ بَيَاضًا مِنَ الثَّلْجِ، وَبَكَى آدَمُ وَحَوَّاءُ عَلَى مَا فَاتَهُمَا- يَعْنِي مِنْ نَعِيمِ الْجَنَّةِ- مِائَتَيْ سَنَةٍ، وَلَمْ يَأْكُلا وَلَمْ يَشْرَبَا أَرْبَعِينَ يَوْمًا، ثُمَّ أَكَلا وَشَرِبَا، وَهُمَا يَوْمَئِذٍ عَلَى بُوذَ، الْجَبَلِ الَّذِي أُهْبِطَ عَلَيْهِ آدَمُ وَلَمْ يَقْرَبْ حَوَّاءَ مِائَةَ سَنَةٍ.","bs_tekst":"Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio nas je Hišam ibn Muhammed, koji je rekao: obavijestio nas je moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Kada je spušten iz Dženneta, Adem je sa sobom spustio Crni kamen, koji je bio bjelji od snijega. Adem i Havva dvjesto godina plakali su za onim što su izgubili — misli se na džennetsko uživanje. Četrdeset dana nisu ni jeli ni pili, a zatim su jeli i pili. Tada su bili na Buzu, planini na koju je Adem spušten. Stotinu godina nije se približio Havvi.“"},{"stranica":133,"ar_tekst":"حَدَّثَنَا أبو همام، قال: حدثني أبي، قال: حدثني زياد بن خيثمة، عن أبي يحيى بائع القت، قال: قال لي مجاهد، ونحن جلوس في المسجد: هل ترى هذا؟ قلت: يا أبا الحجاج، الحجر؟ قال: كذلك تقول؟\nقلت: او ليس حجرا! قال: فو الله لحدثني عبد الله بن عباس أنها ياقوتة بيضاء، خرج بها آدم من الجنة، كان يمسح بها دموعه، وأن آدم لم ترقأ دموعه منذ خرج من الجنة حتى رجع إليها ألفي سنة، وما قدر منه إبليس على شيء، فقلت له: يا أبا الحجاج، فمن أي شيء اسود؟ قال: كان الْحُيَّضُ يلمسنه في الجاهلية فخرج آدم ع من الهند يؤم البيت الذي أمره الله عز وجل بالمصير إليه، حتى أتاه، فطاف به، ونسك المناسك، فذكر أنه التقى هو وحواء بعرفات، فتعارفا بها، ثم ازدلف إليها بالمزدلفة، ثم رجع إلى الهند مع حواء، فاتخذا مغارة يأويان إليها في ليلهما ونهارهما، وأرسل الله إليهما ملكا يعلمهما ما يلبسانه ويستتران به، فزعموا أن ذلك كان من جلود الضأن والأنعام والسباع وقال بعضهم: إنما كان ذلك لباس أولادهما، فأما آدم وحواء فإن لباسهما كان ما كانا خصفا على أنفسهما من ورق الجنة ثم إن الله عز ذكره مسح ظهر آدم ع بنعمان من عرفة، وأخرج","bs_tekst":"Pričao nam je Ebu Hemmam, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao, dok smo sjedili u džamiji: „Vidiš li ovo?“ Upitao sam: „Ebu Hadždžadže, kamen?“ Rekao je: „Tako kažeš?“ Odgovorio sam: „Zar nije kamen?“ Rekao je: „Tako mi Allaha, pričao mi je Abdullah ibn Abbas da je to bijeli rubin s kojim je Adem izašao iz Dženneta i kojim je brisao suze. Ademove suze nisu prestale teći otkad je izašao iz Dženneta sve dok se nije u njega vratio, dvije hiljade godina, a Iblis nad njim ni u čemu nije imao moći.“ Upitao sam ga: „Ebu Hadždžadže, zbog čega je onda pocrnio?“ Odgovorio je: „U džahilijetu su ga doticale žene s mjesečnicom.“ Adem, alejhis-selam, krenuo je iz Indije prema Hramu kojem mu je Allah, Silan i Uzvišen, naredio da ode. Stigao je do njega, obišao ga i izvršio obrede. Navedeno je da su se on i Havva sreli na Arefatu i tamo se prepoznali, a zatim joj se približio na Muzdelifi. Potom se s Havvom vratio u Indiju i uzeli su pećinu za sklonište tokom svojih noći i dana. Allah im je poslao meleka da ih pouči čime će se odijevati i pokrivati. Tvrde da je to bilo od koža ovaca, stoke i zvijeri. Neki su rekli da je to bila odjeća njihove djece, dok su Adem i Havva nosili ono džennetsko lišće kojim su se pokrili. Zatim je Allah, Silan je spomen Njegov, potrao leđa Adema, alejhis-selam, u Nu‘manu kod Arefe i izveo"},{"stranica":134,"ar_tekst":"ذريته، فنثرهم بين يديه كالذر، فأخذ مواثيقهم، وأشهدهم على أنفسهم:\n\nألست بربكم؟ قالوا: بلى، كما قال عز وجل: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» .","bs_tekst":"njegovo potomstvo. Rasuo ih je pred Sobom poput sitnih mrava, uzeo od njih zavjete i učinio ih svjedocima protiv samih sebe: „Zar Ja nisam vaš Gospodar?“ Odgovorili su: „Jesi“, kako je rekao On, Silan i Uzvišen: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧"},{"stranica":134,"ar_tekst":"وَقَدْ حَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدٍ الطُّوسِيُّ، قَالَ: حَدَّثَنَا الْحُسَيْنُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا جَرِيرُ بْنُ حَازِمٍ، عَنْ كُلْثُومِ بْنِ جَبْرٍ، عَنْ سعيد ابن جبير، عن ابن عباس، [عن النبي ص، قَالَ: أَخَذَ اللَّهُ الْمِيثَاقَ مِنْ ظَهْرِ آدَمَ بِنَعْمَانَ- يَعْنِي عَرَفَةَ- فَأَخْرَجَ مِنْ صُلْبِهِ كُلَّ ذُرِّيَّةٍ ذَرَأَهَا، فَنَثَرَهُمْ بَيْنَ يَدَيْهِ كَالذَّرِّ، ثُمَّ كَلَّمَهُمْ قِبَلا، وَقَالَ: «أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى شَهِدْنا أَنْ تَقُولُوا يَوْمَ الْقِيامَةِ» إِلَى قَوْلِهِ: «بِما فَعَلَ الْمُبْطِلُونَ] » .","bs_tekst":"Pričao mi je Ahmed ibn Muhammed et-Tusi, koji je rekao: pričao nam je Husejn ibn Muhammed, koji je rekao: pričao nam je Džerir ibn Hazim, od Kulsuma ibn Džebra, od Seida ibn Džubejra, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao: „Allah je uzeo zavjet iz Ademovih leđa u Nu‘manu — misli se na Arefu. Iz njegovih slabina izveo je sve potomstvo koje je stvorio i rasuo ih pred Sobom poput sitnih mrava. Zatim im je neposredno govorio i rekao: ‘Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi, svjedočimo! Da na Kijametskom danu ne kažete’ — do Njegovih riječi: ‘zbog onoga što su činili oni koji su neistinu slijedili.’“ ⟦Prijevodi navedenog početka i završetka: El-A‘raf, 7:172–173. Izraz „do Njegovih riječi“ pripada izvoru.⟧"},{"stranica":134,"ar_tekst":"حَدَّثَنِي عِمْرَانُ بْنُ مُوسَى الْقَزَّازُ، حَدَّثَنَا عَبْدُ الْوَارِثِ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا كُلْثُومُ بْنُ جَبْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ فِي قَوْلِهِ:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قَالَ: مَسَحَ رَبُّنَا ظَهْرَ آدَمَ، فَخَرَجَتْ كُلُّ نسمة هو خالقها إلى يوم القيامة بنعمان هَذِهِ- وَأَشَارَ بِيَدِهِ- فَأَخَذَ مَوَاثِيقَهُمْ، وَأَشْهَدَهُمْ عَلَى أَنْفُسِهِمْ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى.","bs_tekst":"Pričao mi je Imran ibn Musa el-Kazzaz: pričao nam je Abdulvaris ibn Seid, koji je rekao: pričao nam je Kulsum ibn Džebr, od Seida ibn Džubejra, od Ibn Abbasa, o Njegovim riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Naš je Gospodar potrao Ademova leđa, pa je iz njega izašao svaki čovjek kojeg će stvoriti do Kijametskog dana u ovom Nu‘manu“ — i pokazao je rukom. „Uzeo je od njih zavjete i učinio ih svjedocima protiv samih sebe: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧"},{"stranica":134,"ar_tekst":"حَدَّثَنَا ابْنُ وَكِيعٍ وَيَعْقُوبُ بْنُ إِبْرَاهِيمَ، قَالا: حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ كُلْثُومِ بْنِ جَبْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ فِي قَوْلِهِ عز وجل:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قَالَ: مَسَحَ ظَهْرَ آدَمَ فَخَرَجَ كُلُّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ بِنَعْمَانَ، هَذَا الَّذِي وَرَاءَ عَرَفَةَ، وَأَخَذَ مِيثَاقَهُمْ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى شَهِدْنَا، وَاللَّفْظُ لِحَدِيثِ يَعْقُوبَ.","bs_tekst":"Pričali su nam Ibn Veki‘ i Jakub ibn Ibrahim; obojica su rekli: pričao nam je Ibn Ulejja, od Kulsuma ibn Džebra, od Seida ibn Džubejra, od Ibn Abbasa, o riječima Njega, Silnog i Uzvišenog: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Potrao je Ademova leđa, pa je u Nu‘manu, ovome iza Arefe, izašao svaki čovjek kojeg će stvoriti do Kijametskog dana. Uzeo je od njih zavjet: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi, svjedočimo.’“ Ovo je formulacija Jakubove predaje. ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧"},{"stranica":134,"ar_tekst":"حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، عن عطاء،","bs_tekst":"Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Imran ibn Ujejna, od Ataa,"},{"stranica":135,"ar_tekst":"عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أُهْبِطَ آدَمُ حِينَ أُهْبِطَ فَمَسَحَ اللَّهُ ظَهْرَهُ، فَأَخْرَجَ مِنْهُ كُلَّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ، ثُمَّ قَالَ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى، ثُمَّ تَلَى: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، فَجَفَّ الْقَلَمُ مِنْ يَوْمِئِذٍ بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ.","bs_tekst":"od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Kada je Adem spušten, Allah mu je potrao leđa i izveo iz njega svakoga čovjeka kojeg će stvoriti do Kijametskog dana. Zatim je rekao: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’ Potom je proučio: ‘I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.’ Od toga dana pero se osušilo nad onim što će biti do Kijametskog dana.“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧"},{"stranica":135,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ عيسى، عن الأعمش، عن حَبِيبِ بْنِ أَبِي ثَابِتٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ في «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، قَالَ: لَمَّا خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ ع أَخَذَ ذُرِّيَّتَهُ مِنْ ظَهْرِهِ مِثْلَ الذَّرِّ، فَقَبَضَ قَبْضَتَيْنِ، فَقَالَ لأَصْحَابِ الْيَمِينِ: ادْخُلُوا الْجَنَّةَ بِسَلامٍ، وَقَالَ لِلآخَرِينَ: ادْخُلُوا النَّارَ وَلا أُبَالِي.","bs_tekst":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Jahja ibn Isa, od A‘meša, od Habiba ibn Ebu Sabita, od Seida ibn Džubejra, od Ibn Abbasa, o riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.“ Rekao je: „Kada je Allah, Silan i Uzvišen, stvorio Adema, alejhis-selam, uzeo je iz njegovih leđa njegovo potomstvo poput sitnih mrava. Zahvatio je dvije pregršti i rekao onima s desne strane: ‘Uđite u Džennet u miru’, a drugima je rekao: ‘Uđite u Vatru i ne marim.’“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧"},{"stranica":135,"ar_tekst":"حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعِيدٍ الْجَوْهَرِيُّ، قَالَ: حَدَّثَنَا رَوْحُ بْنُ عُبَادَةَ وَسَعْدُ بْنُ عَبْدِ الْحَمِيدِ بْنِ جَعْفَرٍ، عَنْ مَالِكِ بْنِ أَنَسٍ، عَنْ زَيْدِ بْنِ أَبِي أُنَيْسَةَ، عَنْ عَبْدِ الْحَمِيدِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ زَيْدِ بْنِ الْخَطَّابِ، عَنْ مُسْلِمِ بْنِ يَسَارٍ الْجُهَنِيِّ، [أَنَّ عُمَرَ بْنَ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ سُئِلَ عَنْ هَذِهِ الآية:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، فقال عمر: سمعت رسول الله ص قَالَ: إِنَّ اللَّهَ خَلَقَ آدَمَ ثُمَّ مَسَحَ عَلَى ظَهْرِهِ بِيَمِينِهِ وَاسْتَخْرَجَ مِنْهُ ذُرِّيَّةً، فَقَالَ: خَلَقْتُ هَؤُلاءِ لِلْجَنَّةِ وَبِعَمَلِ أَهْلِ الْجَنَّةِ يَعْمَلُونَ، ثُمَّ مَسَحَ عَلَى ظَهْرِهِ فَاسْتَخْرَجَ مِنْهُ ذُرِّيَّةً فَقَالَ: خَلَقْتُ هَؤُلاءِ لِلنَّارِ وَبِعَمَلِ أَهْلِ النَّارِ يَعْمَلُونَ، فَقَالَ رَجُلٌ: يَا رَسُولَ اللَّهِ، فَفِيمَ الْعَمَلُ؟ قَالَ: إِنَّ اللَّهَ تَبَارَكَ وَتعالى إِذَا خَلَقَ الْعَبْدَ لِلْجَنَّةِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ الْجَنَّةِ، حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ الجنه فيدخله الْجَنَّةِ، وَإِذَا خَلَقَ الْعَبْدَ لِلنَّارِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ النَّارِ حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ النَّارِ فَيُدْخِلُهُ النَّارَ] .","bs_tekst":"Pričao nam je Ibrahim ibn Seid el-Dževheri, koji je rekao: pričali su nam Revh ibn Ubada i Sa‘d ibn Abdulhamid ibn Džafer, od Malika ibn Enesa, od Zejda ibn Ebu Unejse, od Abdulhamida ibn Abdurrahmana ibn Zejda ibn el-Hattaba, od Muslima ibn Jesara el-Džuhenija, da je Omer ibn el-Hattab, radijallahu anhu, upitan o ovom ajetu: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.“ Omer je rekao: „Čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže: ‘Allah je stvorio Adema, zatim mu Svojom desnicom potrao leđa i iz njega izveo potomstvo. Rekao je: Ove sam stvorio za Džennet i oni će činiti djela stanovnika Dženneta. Zatim mu je potrao leđa i iz njega izveo potomstvo. Rekao je: Ove sam stvorio za Vatru i oni će činiti djela stanovnika Vatre.’ Neki je čovjek rekao: ‘Allahov Poslaniče, čemu onda djela?’ Odgovorio je: ‘Kada Allah, Blagoslovljen i Uzvišen, stvori roba za Džennet, upotrijebi ga za djela stanovnika Dženneta sve dok ne umre čineći neko od djela stanovnika Dženneta, pa ga uvede u Džennet. Kada roba stvori za Vatru, upotrijebi ga za djela stanovnika Vatre sve dok ne umre čineći neko od djela stanovnika Vatre, pa ga uvede u Vatru.’“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧"},{"stranica":135,"ar_tekst":"وَقِيلَ: إِنَّهُ أخذ ذريه آدم ع من ظهره بدحنا","bs_tekst":"Rečeno je da je Ademovo, alejhis-selam, potomstvo iz njegovih leđa izveo u Dehni."},{"stranica":136,"ar_tekst":"ذكر من قال ذلك:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":136,"ar_tekst":"حدثنا ابن حميد، قَالَ: حَدَّثَنَا حَكَّامٌ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ قَيْسٍ، عَنْ عَطَاءٍ، عَنْ سَعِيدٍ، عَنِ ابْنِ عَبَّاسٍ: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» قَالَ: لَمَّا خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ مسح ظهره بدحنا فَأَخْرَجَ مِنْ ظَهْرِهِ كُلَّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ، فَقَالَ:\nأَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى، قَالَ: فَيَرَوْنَ يَوْمَئِذٍ، جَفَّ الْقَلَمُ بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ وَقَالَ بَعْضُهُمْ: أَخْرَجَ اللَّهُ ذُرِّيَّةَ آدَمَ مِنْ صُلْبِهِ فِي السَّمَاءِ قَبْلَ أَنْ يُهْبِطَهُ إِلَى الأَرْضِ، وَبَعْدَ أَنْ أَخْرَجَهُ مِنَ الْجَنَّةِ.","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Hukkam, koji je rekao: pričao nam je Amr ibn Kajs, od Ataa, od Seida, od Ibn Abbasa, o riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.“ Rekao je: „Kada je Allah, Silan i Uzvišen, stvorio Adema, potrao mu je leđa u Dehni i iz njegovih leđa izveo svakoga čovjeka kojeg će stvoriti do Kijametskog dana. Rekao je: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’“ Rekao je: „Prema tome, smatraju da se toga dana pero osušilo nad onim što će biti do Kijametskog dana.“ Neki su rekli: „Allah je Ademovo potomstvo izveo iz njegovih slabina na nebu, prije nego što ga je spustio na Zemlju, a nakon što ga je izveo iz Dženneta.“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio. Toponim je u izvoru zapisan بدحنا; izgovor „Dehna“ približan je.⟧"},{"stranica":136,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذلك:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":136,"ar_tekst":"حدثنا ابن وكيع، قال: حدثنا عمرو بن حماد، عن أسباط، عن السدي: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قال: أخرج الله آدم من الجنة ولم يهبطه من السماء، ثم إنه مسح من آدم صفحة ظهره اليمنى، فأخرج منه ذرية كهيئة الذر بيضاء مثل اللؤلؤ، فقال لهم: ادخلوا الجنه برحمتي، ومسح صفحه ظهره اليسرى، فأخرج منه كهيئة الذر سودا، فقال: ادخلوا النار ولا أبالي فذلك حين يقول: أصحاب اليمين وأصحاب الشمال ثم أخذ الميثاق فقال: ألست بربكم؟ قالوا بلى، فأعطاه طائفة طائعين، وطائفة على وجه التقية","bs_tekst":"Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Amr ibn Hammad, od Esbata, od Suddija, o riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Allah je izveo Adema iz Dženneta, ali ga još nije spustio s neba. Zatim je potrao desnu stranu Ademovih leđa, pa iz njega izveo potomstvo poput sitnih mrava, bijelo poput bisera. Rekao im je: ‘Uđite u Džennet Mojom milošću.’ Potrao je lijevu stranu njegovih leđa, pa iz njega izveo nešto poput sitnih mrava, crno. Rekao je: ‘Uđite u Vatru i ne marim.’ To je ono kada govori o stanovnicima desne i stanovnicima lijeve strane. Zatim je uzeo zavjet i rekao: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’ Jedna skupina dala Mu je zavjet pokorno, a druga iz tekijje — prikrivajući svoj stvarni stav.“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧"},{"stranica":137,"ar_tekst":"ذكر الأحداث التي كانت في عهد آدم ع بعد أن أهبط إلى الأرض","bs_tekst":"Spomen događaja iz Ademovog, alejhis-selam, vremena nakon što je spušten na Zemlju"},{"stranica":137,"ar_tekst":"فكان أول ذلك قتل قابيل بن آدم أخاه هابيل، وأهل العلم يختلفون في اسم قابيل، فيقول بعضهم: هو قين بن آدم، ويقول بعضهم: هو قايين ابن آدم ويقول بعضهم: هو قاين ويقول بعضهم: هو قابيل.","bs_tekst":"Prvi od tih događaja bio je kada je Kabil, Ademov sin, ubio svoga brata Habila. Učeni ljudi razilaze se o Kabilovom imenu. Neki kažu da je to Kajn, Ademov sin; neki kažu Kajin, Ademov sin; neki kažu Kain, a neki Kabil. ⟦Arapski oblici imena, navedenim redom: قين، قايين، قاين، قابيل.⟧"},{"stranica":137,"ar_tekst":"واختلفوا أيضا في السبب الذي من أجله قتله:\nفقال بعضهم في ذلك مَا حَدَّثَنِي بِهِ مُوسَى بن هارون الهمداني، قال:\nحدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من أصحاب رسول الله ص، قَالَ: كَانَ لا يُولَدُ لآدَمَ مَوْلُودٌ إِلا وُلِدَ مَعَهُ جَارِيَةٌ، فَكَانَ يُزَوِّجُ غُلامَ هَذَا البطن جاريه هذا البطن الآخر ويزوج جاريه هذا البطن غلام هَذَا الْبَطْنِ الآخَرِ، حَتَّى وُلِدَ لَهُ ابْنَانِ، يُقَالُ لَهُمَا قَابِيلُ وَهَابِيلُ، وَكَانَ قَابِيلُ صَاحِبَ زَرْعٍ، وَكَانَ هَابِيلُ صَاحِبَ ضَرْعٍ، وَكَانَ قَابِيلُ أَكْبَرَهُمَا، وَكَانَتْ لَهُ أُخْتٌ أَحْسَنَ مِنْ أُخْتِ هَابِيلَ، وَإِنَّ هَابِيلَ طَلَبَ أَنْ يَنْكِحَ أُخْتَ قَابِيلَ، فَأَبَى عَلَيْهِ وَقَالَ: هِيَ أُخْتِي وُلِدَتْ مَعِي، وَهِيَ أَحْسَنُ مِنْ أُخْتِكَ، وَأَنَا أَحَقُّ أَنْ أَتَزَوَّجَهَا، فَأَمَرَهُ أَبُوهُ أَنْ يُزَوِّجَهَا هَابِيلَ، فَأَبَى وَإِنَّهُمَا قَرَّبَا قُرْبَانًا إِلَى اللَّهِ أَيُّهُمَا أَحَقُّ بِالْجَارِيَةِ، وَكَانَ","bs_tekst":"Razišli su se i o razlogu zbog kojeg ga je ubio. Neki su o tome rekli ono što mi je pričao Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, koji je rekao: „Ademu se nije rodio dječak a da se s njim nije rodila i djevojčica. Dječaka iz jednoga poroda ženio je djevojčicom iz drugoga poroda, a djevojčicu iz jednoga poroda udavao za dječaka iz drugoga. Tako su mu rođena dva sina po imenu Kabil i Habil. Kabil je obrađivao zemlju, a Habil držao stoku. Kabil je bio stariji. Imao je sestru ljepšu od Habilove sestre. Habil je zatražio da se oženi Kabilovom sestrom, ali je Kabil odbio i rekao: ‘Ona je moja sestra, rođena sa mnom; ljepša je od tvoje sestre i ja imam više prava da se njome oženim.’ Otac mu je naredio da je uda za Habila, ali je odbio. Njih su dvojica Allahu prinijeli žrtvu da se pokaže koji ima više prava na djevojku. Tada je"},{"stranica":138,"ar_tekst":"آدَمُ يَوْمَئِذٍ قَدْ غَابَ عَنْهُمَا وَأَتَى مَكَّةَ يَنْظُرُ إِلَيْهَا، قَالَ اللَّهُ لآدَمَ: يَا آدَمُ، هَلْ تَعْلَمُ أَنَّ لِي بَيْتًا فِي الأَرْضِ؟ قَالَ: اللَّهُمَّ لا، قَالَ: فَإِنَّ لِي بَيْتًا بِمَكَّةَ فَأْتِهِ، فَقَالَ آدَمُ لِلسَّمَاءِ: احْفَظِي وَلَدَيَّ بِالأَمَانَةِ، فَأَبَتْ، وَقَالَ لِلأَرْضِ فَأَبَتْ، وَقَالَ لِلْجِبَالِ: فَأَبَتْ، فَقَالَ لِقَابِيلَ، فَقَالَ: نَعَمْ، تَذْهَبُ وَتَرْجِعُ وَتَجِدُ أَهْلَكَ كَمَا يَسُرُّكَ فَلَمَّا انْطَلَقَ آدَمُ قَرَّبَا قُرْبَانًا، وَكَانَ قَابِيلُ يَفْخَرُ عَلَيْهِ فَيَقُولُ: أَنَا أَحَقُّ بِهَا مِنْكَ هِيَ أُخْتِي، وَأَنَا أَكْبَرُ مِنْكَ، وَأَنَا وَصِيُّ وَالِدِي، فَلَمَّا قَرَّبَا، قَرَّبَ هَابِيلُ جَذَعَةَ سَمِينَةً، وَقَرَّبَ قَابِيلُ حِزْمَةَ سُنْبُلٍ، فَوَجَدَ فِيهَا سُنْبُلَةً عَظِيمَةً فَفَرَكَهَا فَأَكَلَهَا، فَنَزَلَتِ النَّارُ فَأَكَلَتْ قُرْبَانَ هَابِيلَ، وَتَرَكَتْ قُرْبَانَ قَابِيلَ، فَغَضِبَ وَقَالَ: لأَقْتُلَنَّكَ حَتَّى لا تَنْكِحَ أُخْتِي، فَقَالَ هَابِيلُ:\n«إِنَّما يَتَقَبَّلُ اللَّهُ مِنَ الْمُتَّقِينَ لَئِنْ بَسَطْتَ إِلَيَّ يَدَكَ لِتَقْتُلَنِي مَا أَنَا بِباسِطٍ يَدِيَ إِلَيْكَ لِأَقْتُلَكَ» ، إِلَى قَوْلِهِ: «فَطَوَّعَتْ لَهُ نَفْسُهُ قَتْلَ أَخِيهِ» ، فَطَلَبَهُ لِيَقْتُلَهُ، فَرَاغَ الْغُلامُ مِنْهُ فِي رُءُوسِ الْجِبَالِ، فَأَتَاهُ يَوْمًا مِنَ الأَيَّامِ وَهُوَ يَرْعَى غَنَمَهُ فِي جَبَلٍ وَهُوَ نَائِمٌ، فَرَفَعَ صَخْرَةً فَشَدَخَ بِهَا رَأْسَهُ، فَمَاتَ وَتَرَكَهُ بِالْعَرَاءِ، لا يَعْلَمُ كَيْفَ يُدْفَنُ، فَبَعَثَ اللَّهُ غُرَابَيْنِ أَخَوَيْنِ فَاقْتَتَلا، فَقَتَلَ أَحَدُهُمَا صَاحِبَهُ، فَحَفَرَ لَهُ ثُمَّ حثا عليه، فلما رآه قال: «يا وَيْلَتى أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هذَا الْغُرابِ فَأُوارِيَ سَوْأَةَ أَخِي» ، فَهُوَ قَوْلُهُ عَزَّ وَجَلَّ: «فَبَعَثَ اللَّهُ غُراباً يَبْحَثُ فِي الْأَرْضِ لِيُرِيَهُ كَيْفَ يُوارِي سَوْأَةَ أَخِيهِ» فَرَجَعَ آدَمُ فَوَجَدَ ابْنَهُ قَدْ قَتَلَ أَخَاهُ، فَذَلِكَ حِينَ يَقُولُ اللَّهُ عَزَّ وَجَلَّ: «إِنَّا عَرَضْنَا الْأَمانَةَ عَلَى السَّماواتِ وَالْأَرْضِ وَالْجِبالِ» - إِلَى آخِرِ الآيَةِ- «إِنَّهُ كانَ ظَلُوماً جَهُولًا\n» يَعْنِي قَابِيلَ حِينَ حَمَلَ أَمَانَةَ آدَمَ، ثُمَّ لَمْ يَحْفَظْ لَهُ أَهْلَهُ","bs_tekst":"Adem bio odsutan od njih i otišao u Meku da je vidi. Allah je rekao Ademu: ‘Ademe, znaš li da Ja na Zemlji imam Hram?’ Odgovorio je: ‘Allahu moj, ne znam.’ Rekao je: ‘Imam Hram u Meki, pa mu otiđi.’ Adem je nebu rekao: ‘Čuvaj moju djecu kao povjereni emanet’, ali je odbilo. Rekao je to i Zemlji, pa je odbila, a rekao je i planinama, pa su odbile. Rekao je to Kabilu i on je odgovorio: ‘Hoću. Otići ćeš, vratiti se i zateći svoju porodicu onakvom kakva će te obradovati.’ Kada je Adem otišao, prinijeli su žrtve. Kabil se uznosio nad njim govoreći: ‘Ja imam više prava na nju nego ti. Ona je moja sestra, stariji sam od tebe i ja sam očev oporučeni nasljednik.’ Kada su
