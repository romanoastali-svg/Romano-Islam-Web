ekao:\u003c/span> „Dvojica ljudi iz Kur’ana, o kojima Allah, Silan i Uzvišen, kaže: ‘I kazuj im istinito vijest o dvojici Ademovih sinova’, bili su od sinova Israilovih, a nisu bili Ademovi neposredni sinovi. Prinošenje žrtve bilo je među sinovima Israilovim, a Adem je bio prvi koji je umro.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Maida, 5:27, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"143.4\" id=\"odlomak-143-4\">Neki su rekli da je Adem imao odnos s Havvom stotinu godina nakon njihovog spuštanja na Zemlju. Rodila mu je Kabila i njegovu sestru blizanku Kelimu u jednom porodu, zatim Habila i njegovu sestru blizanku u jednom porodu. Kada su odrasli, Adem, alejhis-selam, htio je Kabilovu sestru, rođenu s njim u jednom porodu, udati za Habila. Kabil je to odbio. Zbog toga su prinijeli žrtve, pa je Habilova žrtva primljena, a Kabilova nije. Kabil mu je pozavidio i ubio ga kod klanca Hara. Zatim je Kabil sišao s planine držeći za ruku svoju sestru Kelimu i s njom pobjegao u Aden, u jemenskoj zemlji. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: imena u izvoru glase قليما i عقبة حرى. Prenesena su približno kao „Kelima“ i „klanac Hara“, bez sigurnog određenja izgovora ili poistovjećivanja mjesta.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"143.5\" id=\"odlomak-143-5\">O tome \u003cspan class=\"isnad\">mi je pričao Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio me Hišam, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao:\u003c/span> „Kada je Kabil ubio svoga brata Habila, uzeo je sestru za ruku, pa s njom sišao s planine Buz u podnožje. Adem je rekao Kabilu: ‘Odlazi! Neprestano ćeš biti prestrašen i nećeš biti siguran ni od koga koga vidiš.’ Nijedan njegov potomak nije prolazio pored njega a da nije gađao prema njemu. Došao je jedan slijepi Kabilov sin, s kojim je bio njegov sin. Sin je slijepome rekao: ‘Ovo je tvoj otac Kabil.’ Slijepi je gađao svoga oca Kabila i ubio ga. Sin slijepoga rekao je: ‘Oče, ubio si\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":144,"html":"\u003csection class=\"page\" data-page=\"144\" id=\"stranica-144\">\u003ch2>Stranica 144\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 144\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"144.1\" id=\"ar-odlomak-144-1\">يَا أَبَتَاهُ أَبَاكَ، فَرَفَعَ الأَعْمَى يَدَهُ، فَلَطَمَ ابْنَهُ فَمَاتَ ابْنُهُ، فَقَالَ الأَعْمَى: وَيْلٌ لِي! قَتَلْتُ أَبِي بِرَمْيَتِي، وَقَتَلْتُ ابْنِي بِلَطْمَتِي! وَذُكِرَ فِي التَّوْرَاةِ أَنَّ هَابِيلَ قُتِلَ وَلَهُ عِشْرُونَ سَنَةً، وَأَنَّ قَابِيلَ كَانَ لَهُ يَوْمَ قَتَلَهُ خَمْسٌ وَعِشْرُونَ سَنَةً.\u003c/p>\u003cp data-pair=\"144.2\" id=\"ar-odlomak-144-2\">وَالصَّحِيحُ مِنَ الْقَوْلِ عِنْدَنَا أَنَّ الَّذِي ذَكَرَ اللَّهُ فِي كِتَابِهِ أَنَّهُ قتل أخاه من ابنى آدم هو ابن آدَمَ لِصُلْبِهِ، لِنَقْلِ الْحُجَّةِ أَنَّ ذَلِكَ كَذَلِكَ، وَأَنَّ \u003cspan class=\"isnad\">هَنَّادَ بْنَ السَّرِيِّ حَدَّثَنَا، قَالَ: حَدَّثَنَا أَبُو مُعَاوِيَةَ وَوَكِيعٌ جَمِيعًا عَنِ الأَعْمَشِ.\n- وَحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا جَرِيرٌ وَحَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا جَرِيرٌ وَأَبُو مُعَاوِيَةَ عَنِ الأَعْمَشِ- عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، قَالَ: [قَالَ النَّبِيُّ ص\u003c/span>: مَا مِنْ نَفْسٍ تُقْتَلُ ظُلْمًا إِلا كَانَ عَلَى ابْنِ آدَمَ الأَوَّلِ كِفْلٌ مِنْهَا،] وَذَلِكَ لأَنَّهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ.\u003c/p>\u003cp data-pair=\"144.3\" id=\"ar-odlomak-144-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ- وَحَدَّثَنَا ابْنُ وَكِيعٍ قَالَ: حَدَّثَنَا أَبِي- جَمِيعًا عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، عن النبي ص\u003c/span> نَحْوَهُ.\u003c/p>\u003cp data-pair=\"144.4\" id=\"ar-odlomak-144-4\">فَقَدْ بَيَّنَ هَذَا الْخَبَرُ عَنْ رَسُولِ الله ص صِحَّةَ قَوْلِ مَنْ قَالَ:\nإِنَّ اللَّذَيْنِ قَصَّ اللَّهُ فِي كِتَابِهِ قِصَّتَهُمَا مِنَ ابْنَيْ آدَمَ كَانَا ابْنَيْهِ لِصُلْبِهِ، لأَنَّهُ لا شَكَّ أَنَّهُمَا لَوْ كَانَا مِنْ بَنِي إِسْرَائِيلَ- \u003cspan class=\"isnad\">كَمَا رُوِيَ عَنِ الْحَسَن\u003c/span>ِ- لَمْ يَكُنِ الَّذِي وُصِفَ مِنْهُمَا بِأَنَّهُ قَتَلَ أَخَاهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ، إِذْ كَانَ الْقَتْلَ فِي بَنِي آدَمَ قَدْ كَانَ قَبْلَ إِسْرَائِيلَ وَوَلَدِهِ.\u003c/p>\u003cp data-pair=\"144.5\" id=\"ar-odlomak-144-5\">فَإِنْ قَالَ قَائِلٌ: فَمَا بُرْهَانُكَ عَلَى أَنَّهُمَا وَلَدَا آدَمَ لِصُلْبِهِ، وَإِنْ لَمْ يَكُونَا مِنْ بَنِي إِسْرَائِيلَ؟\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 144\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"144.1\" id=\"odlomak-144-1\">svoga oca!’ Slijepi je podigao ruku i ošamario sina, pa je sin umro. Slijepi je rekao: ‘Teško meni! Ubio sam svoga oca svojim hicem i svoga sina svojim šamarom!’“ Navedeno je u Tevratu da je Habil ubijen kada je imao dvadeset godina, a da je Kabil na dan kada ga je ubio imao dvadeset pet godina.\u003c/p>\u003cp data-pair=\"144.2\" id=\"odlomak-144-2\">Ispravno je, prema našem mišljenju, da je onaj među dvojicom Ademovih sinova za kojeg je Allah u Svojoj Knjizi naveo da je ubio brata bio Ademov neposredni sin. Tako je preneseno predajom koja ima dokaznu snagu, a \u003cspan class=\"isnad\">Hennad ibn es-Serijj pričao nam je, rekavši: pričali su nam Ebu Muavija i Veki‘, obojica od A‘meša. A pričao nam je i Ibn Humejd, koji je rekao: pričao nam je Džerir. Pričao nam je i Ibn Veki‘, koji je rekao: pričali su nam Džerir i Ebu Muavija, od A‘meša — od Abdullaha ibn Murre, od Mesruka, od Abdullaha, koji je rekao: Vjerovjesnik, sallallahu alejhi ve sellem, rekao je:\u003c/span> „Nijedna duša nije nepravedno ubijena a da prvi Ademov sin nema udjela u tome“, zato što je on prvi uspostavio ubijanje.\u003c/p>\u003cp data-pair=\"144.3\" id=\"odlomak-144-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar, koji je rekao: pričao nam je Abdurrahman ibn Mehdi — a pričao nam je i Ibn Veki‘, koji je rekao: pričao nam je moj otac — obojica od Sufjana, od A‘meša, od Abdullaha ibn Murre, od Mesruka, od Abdullaha, od Vjerovjesnika, sallallahu alejhi ve sellem,\u003c/span> nešto slično tome.\u003c/p>\u003cp data-pair=\"144.4\" id=\"odlomak-144-4\">Ova predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, pokazala je ispravnost mišljenja onoga ko kaže da su njih dvojica, čiju je pripovijest Allah ispričao u Svojoj Knjizi, bili Ademovi neposredni sinovi. Nema sumnje da, kada bi bili od sinova Israilovih — \u003cspan class=\"isnad\">kako je preneseno od Hasena\u003c/span> — onaj za kojeg je navedeno da je ubio brata ne bi bio prvi koji je uspostavio ubijanje, jer je među Ademovim potomcima ubijanja bilo i prije Israila i njegovih potomaka.\u003c/p>\u003cp data-pair=\"144.5\" id=\"odlomak-144-5\">Ako neko kaže: „Koji je tvoj dokaz da su bili Ademovi neposredni sinovi, iako nisu bili od sinova Israilovih?“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":145,"html":"\u003csection class=\"page\" data-page=\"145\" id=\"stranica-145\">\u003ch2>Stranica 145\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 145\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"145.1\" id=\"ar-odlomak-145-1\">قِيلَ: لا خِلافَ بَيْنَ سَلَفِ عُلَمَاءِ أُمَّتِنَا في ذلك، إذا فَسَدَ قَوْلُ مَنْ قَالَ:\nكَانَا مِنْ بَنِي إِسْرَائِيلَ وَذُكِرَ أَنَّ قَابِيلَ لَمَّا قَتَلَ أَخَاهُ هابيل بكاه آدم ع فَقَالَ- فِيمَا \u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنْ غِيَاثِ بْنِ إِبْرَاهِيمَ، عَنْ أَبِي إِسْحَاقَ الْهَمْدَانِيِّ، قَالَ: قَالَ عَلِيُّ بْنُ أَبِي طَالِبٍ كَرَّمَ اللَّهُ وَجْهَه\u003c/span>ُ: لَمَّا قَتَلَ ابْنُ آدَمَ أَخَاهُ بَكَاهُ آدَمُ، فَقَالَ:\u003c/p>\u003cp data-pair=\"145.2\" id=\"ar-odlomak-145-2\">تَغَيَّرَتِ الْبِلادُ ومن عليها ... فوجه الأَرْضِ مُغْبَرٌّ قَبِيحُ\n\nتَغَيَّرَ كُلُّ ذِي طَعْمٍ وَلَوْنٍ ... وَقَلَّ بَشَاشَةُ الْوَجْهِ الْمَلِيحِ\u003c/p>\u003cp data-pair=\"145.3\" id=\"ar-odlomak-145-3\">قَالَ: فَأُجِيبَ آدم ع:\u003c/p>\u003cp data-pair=\"145.4\" id=\"ar-odlomak-145-4\">أَبَا هَابِيلَ قَدْ قُتِلا جَمِيعًا ... وَصَارَ الْحَيُّ كَالْمَيْتِ الذَّبِيحِ\n\nوَجَاءَ بِشِرَّةٍ قَدْ كَانَ مِنْهَا ... عَلَى خَوْفٍ فَجَاءَ بِهَا يَصِيحُ\u003c/p>\u003cp data-pair=\"145.5\" id=\"ar-odlomak-145-5\">وَذُكِرَ أَنَّ حواء ولدت لادم ع عِشْرِينَ وَمِائَةَ بَطْنٍ، أَوَّلُهُمْ قَابِيلُ وَتَوْءَمَتُهُ قلِيمَا، وَآخِرُهُمْ عَبْدُ الْمُغِيثِ وَتَوْءَمَتُهُ أَمَةُ الْمُغِيثِ.\u003c/p>\u003cp data-pair=\"145.6\" id=\"ar-odlomak-145-6\">وَأَمَّا \u003cspan class=\"isnad\">ابْنُ إِسْحَاقَ فَذُكِرَ عَنْه\u003c/span>ُ مَا قَدْ ذَكَرْتُ قَبْلُ، وَهُوَ أَنَّ جَمِيعَ مَا وَلَدَتْهُ حَوَّاءُ لآدَمَ لِصُلْبِهِ أَرْبَعُونَ مِنْ ذَكَرٍ وَأُنْثَى فِي عِشْرِينَ بَطْنًا، وَقَالَ: قَدْ بَلَغَنَا أَسْمَاءُ بَعْضِهِمْ وَلَمْ يَبْلُغْنَا بَعْضٌ.\u003c/p>\u003cp data-pair=\"145.7\" id=\"ar-odlomak-145-7\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال\u003c/span>:\n\nفكان من بلغنا اسمه خمسة عشر رجلا وأربع نسوة، منهم قين وتوءمته، وهابيل وليوذا وأشوث بنت آدم وتوءمها، وشيث وتوءمته، وحزورة وتوءمها، على\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 145\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"145.1\" id=\"odlomak-145-1\">Odgovara se: U tome nema razilaženja među učenim prethodnicima našeg ummeta, kada je već neodrživo mišljenje onoga koji kaže da su bili od sinova Israilovih. Navedeno je da je Adem, alejhis-selam, oplakivao Habila kada ga je Kabil ubio i rekao — prema onome što \u003cspan class=\"isnad\">nam je pričao Ibn Humejd, koji je rekao: pričao nam je Selema, od Gijasa ibn Ibrahima, od Ebu Ishaka el-Hemdanija, koji je rekao: Ali ibn Ebu Talib, Allah mu lice počastio, rekao je:\u003c/span> „Kada je Ademov sin ubio brata, Adem ga je oplakivao i rekao:\u003c/p>\u003cp data-pair=\"145.2\" id=\"odlomak-145-2\">Promijeniše se zemlje i oni na njima — lice zemlje prašnjavo je i ružno.\u003cbr/>Promijeni se sve što ima okus i boju — i malo ostade vedrine lijepoga lica.“\u003c/p>\u003cp data-pair=\"145.3\" id=\"odlomak-145-3\">Rekao je: „Ademu, alejhis-selam, odgovoreno je:\u003c/p>\u003cp data-pair=\"145.4\" id=\"odlomak-145-4\">Oče Habilov, obojica su ubijeni — živi je postao poput mrtvoga, zaklanog.\u003cbr/>Došao je sa zlom od kojeg je strepio — pa je s njim došao vičući.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: drugi polustih posljednjeg stiha i veza zamjenica nisu sasvim jasni. Slika iz izvora prenesena je bez dopisivanja objašnjenja ili novih stihova.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"145.5\" id=\"odlomak-145-5\">Navedeno je da je Havva Ademu, alejhis-selam, rodila u stotinu dvadeset poroda. Prvi su bili Kabil i njegova sestra blizanka Kelima, a posljednji Abdulmugis i njegova sestra blizanka Emetulmugis.\u003c/p>\u003cp data-pair=\"145.6\" id=\"odlomak-145-6\">\u003cspan class=\"isnad\">Od Ibn Ishaka navedeno je ono što sam već prije spomenuo:\u003c/span> da je Havva Ademu rodila ukupno četrdeset njegove neposredne djece, muške i ženske, u dvadeset poroda. Rekao je: „Do nas su doprla imena nekih od njih, a nekih nisu.“\u003c/p>\u003cp data-pair=\"145.7\" id=\"odlomak-145-7\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao:\u003c/span> „Među onima čija su nam imena doprla bilo je petnaest muškaraca i četiri žene: Kajn i njegova sestra blizanka, Habil, Lejuza, Ešus, Ademova kćerka, i njen blizanac, Šis i njegova sestra blizanka, te Hazura i njen blizanac, u\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":146,"html":"\u003csection class=\"page\" data-page=\"146\" id=\"stranica-146\">\u003ch2>Stranica 146\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 146\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"146.1\" id=\"ar-odlomak-146-1\">ثلاثين ومائه سنه من عمره ثم اباد بن آدم وتوءمته، ثم بالغ بن آدم وتوءمته، ثم أثاثي بن آدم وتوءمته، ثم توبه بن آدم وتوءمته، ثم بنان ابن آدم وتوءمته، ثم شبوبة بن آدم وتوءمته، ثم حيان بن آدم وتوءمته، ثم ضرابيس بن آدم وتوءمته، ثم هذر بن آدم وتوءمته، ثم يحود بن آدم وتوءمته، ثم سندل بن آدم وتوءمته، ثم بارق بن آدم وتوءمته، كل رجل منهم تولد معه امرأة في بطنه الذي يحمل به فيه.\u003c/p>\u003cp data-pair=\"146.2\" id=\"ar-odlomak-146-2\">وقد زعم أكثر علماء الفرس أن جيومرت هو آدم، وزعم بعضهم أنه ابن آدم لصلبه من حواء.\u003c/p>\u003cp data-pair=\"146.3\" id=\"ar-odlomak-146-3\">وقال فيه غيرهم أقوالا كثيرة، يطول بذكر أقوالهم الكتاب، وتركنا ذكر ذلك إذ كان قصدنا في كتابنا هذا ذكر الملوك وأيامهم، وما قد شرطنا في كتابنا هذا أنا ذاكروه فيه، ولم يكن ذكر اختلاف المختلفين في نسب ملك من جنس ما أنشأنا له صنعة الكتاب، فإن ذكرنا من ذلك شيئا فلتعريف من ذكرنا، ليعرفه من لم يكن به عارفا، فأما ذكر الاختلاف في نسبه فإنه غير المقصود به في كتابنا هذا.\u003c/p>\u003cp data-pair=\"146.4\" id=\"ar-odlomak-146-4\">وقد خالف علماء الفرس فيما قالوا من ذلك آخرون من غيرهم ممن زعم أنه آدم، ووافق علماء الفرس على اسمه وخالفه في عينه وصفته، فزعم أن\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 146\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"146.1\" id=\"odlomak-146-1\">stotinu tridesetoj godini njegovog života; zatim Abad, Ademov sin, i njegova sestra blizanka; zatim Balig, Ademov sin, i njegova sestra blizanka; zatim Esasi, Ademov sin, i njegova sestra blizanka; zatim Tevba, Ademov sin, i njegova sestra blizanka; zatim Benan, Ademov sin, i njegova sestra blizanka; zatim Šebuba, Ademov sin, i njegova sestra blizanka; zatim Hajjan, Ademov sin, i njegova sestra blizanka; zatim Darabis, Ademov sin, i njegova sestra blizanka; zatim Hezer, Ademov sin, i njegova sestra blizanka; zatim Jehud, Ademov sin, i njegova sestra blizanka; zatim Sendel, Ademov sin, i njegova sestra blizanka; zatim Barik, Ademov sin, i njegova sestra blizanka. Sa svakim muškarcem među njima rođena je i žena u istom porodu u kojem je on nošen.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: rijetka imena iz ove liste prenesena su približno prema zapisu izvora; izgovor nije svuda označen. Popis i sva ponavljanja srodstva sačuvani su.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"146.2\" id=\"odlomak-146-2\">Većina perzijskih učenjaka tvrdi da je Džejumert Adem, a neki tvrde da je Ademov neposredni sin od Havve.\u003c/p>\u003cp data-pair=\"146.3\" id=\"odlomak-146-3\">Drugi su o njemu iznijeli mnogo mišljenja koja bi, kada bismo ih naveli, oduljila knjigu. Ostavili smo ih nespomenutim jer je naša namjera u ovoj knjizi navoditi kraljeve i njihova vremena i ono što smo u njoj postavili da ćemo navesti. Navođenje razilaženja o porijeklu nekog kralja ne pripada onome zbog čega smo počeli sastavljati knjigu. Ako nešto od toga spomenemo, to je radi predstavljanja onoga koga spominjemo, da ga upozna onaj ko ga nije poznavao. Razilaženje o njegovom porijeklu nije cilj ove naše knjige.\u003c/p>\u003cp data-pair=\"146.4\" id=\"odlomak-146-4\">Perzijskim učenjacima u onome što su o tome rekli usprotivili su se drugi koji nisu od njih, u vezi s tvrdnjom da je on Adem. Složili su se s perzijskim učenjacima o njegovom imenu, ali su se razlikovali o njegovom identitetu i svojstvima. Tvrdili su da je\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":147,"html":"\u003csection class=\"page\" data-page=\"147\" id=\"stranica-147\">\u003ch2>Stranica 147\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 147\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"147.1\" id=\"ar-odlomak-147-1\">جيومرت الذى زعمت الفرس انه آدم ع انما هو جامر بن يافث ابن نوح، وأنه كان معمرا سيدا، نزل جبل دنباوند من جبال طبرستان من أرض المشرق، وتملك بها وبفارس، ثم عظم أمره وأمر ولده، حتى ملكوا بابل، وملكوا في بعض الأوقات الأقاليم كلها، وأن جيومرت منع من البلاد ما صار إليه، وابتنى المدن والحصون وعمرها، وأعد السلاح، واتخذ الخيل، وأنه تجبر في آخر عمره، وتسمى بآدم، وقال: من سماني بغير هذا الاسم ضربت عنقه، وأنه تزوج ثلاثين امرأة، فكثر منهن نسله، وأن ماري ابنه وماريانة أخته، ممن كان ولد له في آخر عمره، فأعجب بهما وقدمهما، فصار الملوك بذلك السبب من نسلهما، وأن ملكه اتسع وعظم.\u003c/p>\u003cp data-pair=\"147.2\" id=\"ar-odlomak-147-2\">وإنما ذكرت من أمر جيومرت في هذا الموضع ما ذكرت، لأنه لا تدافع بين علماء الأمم أن جيومرت هو أبو الفرس من العجم، وإنما اختلفوا فيه:\nهل هو آدم أبو البشر على ما قاله الذين ذكرنا قولهم أم هو غيره؟ ثم مع ذلك فلأن ملكه وملك أولاده لم يزل منتظما على سياق، متسقا بأرض المشرق وجبالها إلى أن قتل يزدجرد بن شهريار من ولد ولده بمرو- أبعده الله- أيام عثمان بن عفان رضي الله عنه، فتأريخ ما مضى من سني العالم على أعمار ملوكهم أسهل بيانا، وأوضح منارا منه على أعمار ملوك غيرهم من الأمم، إذ لا تعلم أمة من الأمم الذين ينتسبون الى آدم ع دامت لها المملكة، واتصل لهم الملك، وكانت لهم ملوك تجمعهم، ورءوس تحامي عنهم من ناوأهم، وتغالب بهم من عازهم، وتدفع ظالمهم عن مظلومهم، وتحملهم من الأمور على ما فيه حظهم\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 147\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"147.1\" id=\"odlomak-147-1\">Džejumert, za kojeg Perzijanci tvrde da je Adem, alejhis-selam, zapravo Džamir ibn Jafis ibn Nuh. Bio je dugovječan poglavar. Nastanio se na planini Dunbavend, jednoj od taberistanskih planina na istoku, i zavladao tamo i Perzijom. Zatim je porastao njegov značaj i značaj njegovih potomaka, sve dok nisu zavladali Babilonom i u nekim razdobljima svim oblastima. Džejumert je branio krajeve koje je stekao, gradio i nastanjivao gradove i tvrđave, pripremao oružje i držao konje. Na kraju života osilio se i nazvao sebe Ademom. Rekao je: „Ko me nazove drugim imenom, odrubit ću mu glavu.“ Oženio se trideset žena i od njih imao brojno potomstvo. Njegov sin Mari i njegova sestra Marijana rođeni su mu pred kraj života. Zavolio ih je i dao im prednost, pa su iz tog razloga kraljevi potekli od njihova potomstva. Njegovo se kraljevstvo proširilo i uvećalo.\u003c/p>\u003cp data-pair=\"147.2\" id=\"odlomak-147-2\">O Džejumertu sam na ovome mjestu naveo to što sam naveo zato što među učenjacima različitih naroda nema osporavanja da je Džejumert otac Perzijanaca među nearapskim narodima. Razilaze se samo je li on Adem, otac čovječanstva, kako kažu oni čije smo mišljenje spomenuli, ili neko drugi. Osim toga, njegova vlast i vlast njegovih potomaka neprestano su se nastavljale uređeno i usklađeno na istoku i njegovim planinama, sve dok u Mervu nije ubijen Jezdedžird ibn Šehrijar, potomak njegovih potomaka — Allah ga udaljio — u vrijeme Osmana ibn Affana, radijallahu anhu. Zato je prikazivanje proteklih godina svijeta prema životima njihovih kraljeva jednostavnije i jasnije nego prema životima kraljeva drugih naroda. Nije poznat nijedan drugi narod koji se pripisuje Ademu, alejhis-selam, kojem je kraljevstvo toliko trajalo i vlast se nastavljala, koji je imao kraljeve što su ga okupljali i poglavare koji su ga branili od neprijatelja, borili se pomoću njega protiv suparnika, štitili potlačene među njima od njihovih tlačitelja i vodili ih u onome u čemu je njihova korist\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":148,"html":"\u003csection class=\"page\" data-page=\"148\" id=\"stranica-148\">\u003ch2>Stranica 148\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 148\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"148.1\" id=\"ar-odlomak-148-1\">على اتصال ودوام ونظام، يأخذ ذلك آخرهم عن أولهم، وغابرهم عن سالفهم- سواهم، فالتأريخ على أعمار ملوكهم أصح مخرجا، وأحسن وضوحا.\u003c/p>\u003cp data-pair=\"148.2\" id=\"ar-odlomak-148-2\">وأنا ذاكر ما انتهى إلينا من القول في عمر آدم ع وأعمار من كان بعده من ولده الذين خلفوه في النبوة والملك، على قول من خالف قول الفرس الذين زعموا أنه جيومرت، وعلى قول من قال: إنه هو جيومرت أبو الفرس، وذاكر ما اختلفوا فيه من أمرهم إلى الحال التي اجتمعوا عليها، فاتفقوا على من ملك منهم في زمان بعينه أنه كان هو الملك في ذلك الزمان إِنْ شَاءَ اللَّهُ، وَلا حول وَلا قوة إلا بالله، ثم سائق ذلك كذلك إلى زماننا هذا.\u003c/p>\u003cp data-pair=\"148.3\" id=\"ar-odlomak-148-3\">ونرجع الآن إلى الزيادة في الإبانة عن خطإ قول من قال: إن أول ميت كان في أول الارض آدم، وإنكاره الذين قص الله نبأهما في قوله:\n\n«وَاتْلُ عَلَيْهِمْ نَبَأَ ابْنَيْ آدَمَ بِالْحَقِّ إِذْ قَرَّبا قُرْباناً» ، أن يكونا من صلب آدم من أجل ذلك.\u003c/p>\u003cp data-pair=\"148.4\" id=\"ar-odlomak-148-4\">فَ\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الصَّمَدِ بْنُ عَبْدِ الْوَارِثِ، قال: حدثنا عُمَرُ بْنُ إِبْرَاهِيمَ، عَنْ قَتَادَةَ، عَنِ الْحَسَنِ، عن سمره بن جندب، [عن النبي ع قَال\u003c/span>َ: كَانَتْ حَوَّاءُ لا يَعِيشُ لَهَا وَلَدٌ، فَنَذَرَتْ لِئَنْ عَاشَ لَهَا وَلَدٌ لَتُسَمِّيَنَّهُ عَبْدَ الْحَارِثِ، فَعَاشَ لَهَا وَلَدٌ فَسَمَّتْهُ عَبْدَ الْحَارِثِ، وانما كان ذلك عن وحى الشيطان] .\u003c/p>\u003cp data-pair=\"148.5\" id=\"ar-odlomak-148-5\">\u003cspan class=\"isnad\">وحدثنا ابن حميد، قال: حدثنا سلمة، عن ابْنِ إِسْحَاقَ، عَنْ دَاوُدَ بْنِ الْحُصَيْنِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ: كَانَتْ حَوَّاءُ تَلِدُ لآدَمَ فَتُعَبِّدُهُمُ اللَّهَ عَزَّ وَجَلَّ وَتُسَمِّيهِمْ: عَبْدَ اللَّهِ، وَعُبَيْدَ اللَّهِ، وَنَحْوَ ذَلِكَ،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 148\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"148.1\" id=\"odlomak-148-1\">neprekinuto, trajno i uređeno, tako da posljednji preuzimaju od prvih, a kasniji od ranijih — osim njih. Zato je datiranje prema životima njihovih kraljeva pouzdanije i jasnije.\u003c/p>\u003cp data-pair=\"148.2\" id=\"odlomak-148-2\">Navest ću ono što je do nas došlo o životnom vijeku Adema, alejhis-selam, i životima onih njegovih potomaka poslije njega koji su ga naslijedili u vjerovjesništvu i vlasti, prema mišljenju onoga koji se protivi Perzijancima što tvrde da je on Džejumert i prema mišljenju onoga koji kaže da je on Džejumert, otac Perzijanaca. Navest ću i ono u čemu su se o njima razilazili, sve do stanja u kojem su se složili i usaglasili ko je među njima u određenom vremenu bio kralj, ako Allah htjedne. Nema snage ni moći osim u Allaha. Zatim ću tako nastaviti sve do našeg vremena.\u003c/p>\u003cp data-pair=\"148.3\" id=\"odlomak-148-3\">Sada se vraćamo daljnjem razjašnjenju greške onoga koji kaže da je prvi umrli na početku Zemlje bio Adem i zato poriče da su dvojica o kojima je Allah ispričao vijest u riječima: „I kazuj im istinito vijest o dvojici Ademovih sinova: kada su prinijeli žrtvu“, bili njegovi neposredni sinovi. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Maida, 5:27, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"148.4\" id=\"odlomak-148-4\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Beššar, koji je rekao: pričao nam je Abdussamed ibn Abdulvaris, koji je rekao: pričao nam je Omer ibn Ibrahim, od Katade, od Hasena, od Semure ibn Džunduba, od Vjerovjesnika, alejhis-selam, koji je rekao:\u003c/span> „Havvi nijedno dijete nije ostajalo živo, pa se zavjetovala da će, ako joj dijete ostane živo, nazvati ga Abdulharis. Jedno joj je dijete ostalo živo i nazvala ga je Abdulharis. To je bilo samo po šejtanovom došaptavanju.“\u003c/p>\u003cp data-pair=\"148.5\" id=\"odlomak-148-5\">\u003cspan class=\"isnad\">Pričao nam je i Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, od Davuda ibn el-Husajna, od Ikrime, od Ibn Abbasa, koji je rekao:\u003c/span> „Havva je Ademu rađala djecu i pripisivala ih robovanju Allahu, Silnom i Uzvišenom, dajući im imena poput Abdullah, Ubejdullah i slična,\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":149,"html":"\u003csection class=\"page\" data-page=\"149\" id=\"stranica-149\">\u003ch2>Stranica 149\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 149\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"149.1\" id=\"ar-odlomak-149-1\">فيصيبهم الموت، فأتاها ابليس وآدم ع، فَقَالَ: إِنَّكُمَا لَوْ تُسَمِّيَانَهُ بِغَيْرِ الَّذِي تُسَمِّيَانَهُ بِهِ لَعَاشَ، فَوَلَدَتْ لَهُ ذَكَرًا، فَسَمَّيَاهُ عَبْدَ الْحَارِثِ، فَفِيهِ أَنْزَلَ اللَّهُ عَزَّ ذِكْرُهُ، يَقُولُ اللَّهُ عَزَّ وَجَلَّ: «هُوَ الَّذِي خَلَقَكُمْ مِنْ نَفْسٍ واحِدَةٍ» ، إِلَى قَوْلِهِ: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» الى آخر الآية\u003c/p>\u003cp data-pair=\"149.2\" id=\"ar-odlomak-149-2\">\u003cspan class=\"isnad\">حدثنا ابن وكيع، قال: حدثنا ابن فضيل، عن سالم بن أبي حفصة، عن سعيد بن جبير\u003c/span>: «فَلَمَّا أَثْقَلَتْ دَعَوَا اللَّهَ رَبَّهُما» الى قوله:\n«فَتَعالَى اللَّهُ عَمَّا يُشْرِكُونَ» .\n\nقال: ولما حملت حواء في أول ولد ولدته حين أثقلت أتاها إبليس قبل أن تلد فقال: يا حواء، ما هذا في بطنك؟ فقالت: ما ادرى من؟ فقال:\n\nأين يخرج؟ من أنفك؟ أو من عينك؟ أو من أذنك؟ قالت: لا أدري، قال: أرأيت إن خرج سليما أمطيعتي أنت فيما آمرك به؟ قالت: نعم، قال:\nسميه عبد الحارث- وقد كان يسمى إبليس لعنه الله الحارث- فقالت: نعم، ثم قالت بعد ذلك لآدم: أتاني آت في النوم فقال لي: كذا وكذا، فقال: ان ذاك الشيطان فاحذريه، فإنه عدونا الذي أخرجنا من الجنة، ثم أتاها إبليس لعنه الله فأعاد عليها، فقالت: نعم، فلما وضعته أخرجه الله سليما فسمته عبد الحارث، فهو قوله: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» الى قوله: «فَتَعالَى اللَّهُ عَمَّا يُشْرِكُونَ» .\u003c/p>\u003cp data-pair=\"149.3\" id=\"ar-odlomak-149-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن وكيع، قال: حَدَّثَنَا جرير وابن فضيل، عن عبد الملك، عن سعيد بن جبير، قال\u003c/span>: قيل له: أشرك آدم؟ قال: اعوذ بالله ان ازعم ان آدم ع أشرك! ولكن حواء لما أثقلت أتاها إبليس\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 149\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"149.1\" id=\"odlomak-149-1\">pa bi ih zadesila smrt. Iblis je došao njoj i Ademu, alejhis-selam, i rekao: ‘Kada biste mu dali neko drugo ime, umjesto onoga koje dajete, ostao bi živ.’ Rodila mu je dječaka, pa su ga nazvali Abdulharis. O tome je Allah, Silan je spomen Njegov, objavio. Allah, Silan i Uzvišen, kaže: ‘On je Taj koji vas je stvorio od jedne duše’ — do Njegovih riječi: ‘Pripisali su Mu sudionike u onome što im je dao’ — do kraja ajeta.“ \u003cspan class=\"translator-note\">⟦Prijevodi navedenog početka i završnog dijela: El-A‘raf, 7:189–190. Prijelazi „do“ potječu iz izvora.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"149.2\" id=\"odlomak-149-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Ibn Fudajl, od Salima ibn Ebu Hafse, od Seida ibn Džubejra,\u003c/span> o riječima: „Kada je otežala, njih dvoje molili su Allaha, svoga Gospodara“ — do Njegovih riječi: „Uzvišen je Allah iznad onoga što Mu pridružuju.“ Rekao je: „Kada je Havva zanijela prvo dijete i trudnoća joj postala teška, Iblis joj je došao prije nego što je rodila. Rekao je: ‘Havva, šta je to u tvojoj utrobi?’ Odgovorila je: ‘Ne znam ko je.’ Upitao je: ‘Odakle će izaći? Iz tvoga nosa, oka ili uha?’ Odgovorila je: ‘Ne znam.’ Rekao je: ‘Reci mi, ako izađe zdravo, hoćeš li me poslušati u onome što ti naredim?’ Odgovorila je: ‘Hoću.’ Rekao je: ‘Nazovi ga Abdulharis.’ Iblis, Allah ga prokleo, bio je nazivan Harisom. Odgovorila je: ‘Hoću.’ Potom je rekla Ademu: ‘Neko mi je došao u snu i rekao to i to.’ Odgovorio je: ‘To je šejtan. Čuvaj ga se! On je naš neprijatelj koji nas je izveo iz Dženneta.’ Zatim joj je Iblis, Allah ga prokleo, ponovo došao i ponovio joj to. Odgovorila je: ‘Hoću.’ Kada je rodila, Allah ga je izveo zdravoga, pa ga je nazvala Abdulharis. To su Njegove riječi: ‘Pripisali su Mu sudionike u onome što im je dao’ — do Njegovih riječi: ‘Uzvišen je Allah iznad onoga što Mu pridružuju.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-A‘raf, 7:189–190, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"149.3\" id=\"odlomak-149-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričali su nam Džerir i Ibn Fudajl, od Abdulmelika, od Seida ibn Džubejra, koji je rekao:\u003c/span> „Upitan je: ‘Je li Adem počinio širk?’ Odgovorio je: ‘Utječem se Allahu od toga da tvrdim da je Adem, alejhis-selam, počinio širk! Ali kada je Havvina trudnoća otežala, došao joj je Iblis\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":150,"html":"\u003csection class=\"page\" data-page=\"150\" id=\"stranica-150\">\u003ch2>Stranica 150\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 150\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"150.1\" id=\"ar-odlomak-150-1\">فقال لها: من أين يخرج هذا؟ من أنفك، أو من عينك، أو من فيك؟\n\nفقنطها، ثم قال: أرأيت إن خرج سويا- \u003cspan class=\"isnad\">قال ابن وكيع: زاد ابن فضيل\u003c/span>:\n\nلم يضرك ولم يقتلك- أتطيعينني؟ قالت: نعم، قال: فسميه عبد الحارث، ففعلت- \u003cspan class=\"isnad\">زاد جرير\u003c/span>: فإنما كان شركه في الاسم.\u003c/p>\u003cp data-pair=\"150.2\" id=\"ar-odlomak-150-2\">\u003cspan class=\"isnad\">حَدَّثَنَا موسى بن هارون، قال: حدثنا عمرو بن حماد، قال:\nحَدَّثَنَا أسباط، عن السدي\u003c/span>: فولدت- يعني حواء- غلاما، فأتاها إبليس فقال: سموه عبدي، وإلا قتلته، قال له آدم: قد أطعتك وأخرجتني من الجنة فأبى أن يطيعه، فسماه عبد الرحمن، فسلط عليه إبليس لعنه الله فقتله، فحملت بآخر فلما ولدته، قال: سميه عبدى والا قتلته، قال له آدم ع: قد أطعتك فأخرجتني من الجنة فأبى فسماه صالحا، فقتله، فلما كان الثالث قال لهما: فإذ غلبتموني فسموه عبد الحارث، وكان اسم إبليس الحارث، - وإنما سمى ابليس حين ابلس تحير- فذلك حين يقول الله عز وجل: «جَعَلا لَهُ شُرَكاءَ فِيما آتاهُما» - يعني في الأسماء.\u003c/p>\u003cp data-pair=\"150.3\" id=\"ar-odlomak-150-3\">فهؤلاء الذين ذكرت الرواية عنهم بما ذكرت، من أنه مات لآدم وحواء أولاد قبلهما، ومن لم نذكر أقوالهم ممن عددهم أكثر من عدد من ذكرت قوله والرواية عنه، قالوا خلاف \u003cspan class=\"isnad\">قول الحسن الذي روي عنه أنه قال\u003c/span>: أول من مات آدم ع.\u003c/p>\u003cp data-pair=\"150.4\" id=\"ar-odlomak-150-4\">وكان آدم مع ما كان الله عز وجل قد أعطاه من ملك الأرض والسلطان فيها قد نبأه، وجعله رسولا إلى ولده، وأنزل عليه إحدى وعشرين صحيفة كتبها آدم ع بخطه، علمه إياها جبرئيل ع.\u003c/p>\u003cp data-pair=\"150.5\" id=\"ar-odlomak-150-5\">وَقَدْ \u003cspan class=\"isnad\">حَدَّثَنَا أَحْمَدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ وَهْبٍ، قَالَ: حَدَّثَنَا عَمِّي، قَالَ: حَدَّثَنِي الْمَاضِي بْنُ مُحَمَّدٍ، عَنْ أَبِي سُلَيْمَانَ، عَنِ الْقَاسِمِ بْنِ مُحَمَّدٍ، عَن\u003c/span>ْ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 150\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"150.1\" id=\"odlomak-150-1\">i rekao joj: Odakle će ovo izaći: iz tvoga nosa, oka ili usta? Bacio ju je u očaj, pa rekao: Reci mi, ako izađe pravilno oblikovano’ — \u003cspan class=\"isnad\">Ibn Veki‘ je rekao: Ibn Fudajl dodao je:\u003c/span> ‘i ne naškodi ti niti te ubije’ — ‘hoćeš li me poslušati?’ Odgovorila je: ‘Hoću.’ Rekao je: ‘Nazovi ga Abdulharis.’ Učinila je tako.“ \u003cspan class=\"isnad\">Džerir je dodao:\u003c/span> „Njegov širk bio je samo u imenu.“\u003c/p>\u003cp data-pair=\"150.2\" id=\"odlomak-150-2\">\u003cspan class=\"isnad\">Pričao nam je Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija:\u003c/span> „Rodila je“ — misli se Havva — „dječaka. Iblis joj je došao i rekao: ‘Nazovite ga mojim robom, inače ću ga ubiti.’ Adem mu je rekao: ‘Već sam te poslušao, pa si me izveo iz Dženneta.’ Odbio ga je poslušati i nazvao dijete Abdurrahman. Iblisu, Allah ga prokleo, data je vlast nad njim, pa ga je ubio. Ponovo je zanijela. Kada je rodila, rekao je: ‘Nazovi ga mojim robom, inače ću ga ubiti.’ Adem, alejhis-selam, rekao mu je: ‘Već sam te poslušao, pa si me izveo iz Dženneta.’ Odbio je i nazvao ga Salihom, pa ga je ubio. Kada je došlo treće dijete, rekao im je: ‘Kada ste me već nadvladali, nazovite ga Abdulharis.’ Iblisovo ime bilo je Haris; Iblisom je nazvan tek kada je pao u očaj i zbunjenost. To je ono kada Allah, Silan i Uzvišen, kaže: ‘Pripisali su Mu sudionike u onome što im je dao’ — misli se u imenima.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:190, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"150.3\" id=\"odlomak-150-3\">Oni od kojih sam prenio navedeno — da su Ademu i Havvi djeca umirala prije njih — i oni čija mišljenja nisam spomenuo, a kojih je više od onih čije sam mišljenje i predaju naveo, govorili su suprotno \u003cspan class=\"isnad\">mišljenju Hasena, od kojeg je preneseno da je rekao:\u003c/span> „Prvi je umro Adem, alejhis-selam.“\u003c/p>\u003cp data-pair=\"150.4\" id=\"odlomak-150-4\">Uz ono što mu je Allah, Silan i Uzvišen, dao od vlasti nad Zemljom i upravljanja njome, Adema je učinio i vjerovjesnikom i poslanikom njegovoj djeci. Spustio mu je dvadeset jedan list objave, koje je Adem, alejhis-selam, napisao svojom rukom, a kojima ga je poučio Džibril, alejhis-selam.\u003c/p>\u003cp data-pair=\"150.5\" id=\"odlomak-150-5\">\u003cspan class=\"isnad\">Pričao nam je Ahmed ibn Abdurrahman ibn Vehb, koji je rekao: pričao nam je moj amidža, koji je rekao: pričao mi je Madi ibn Muhammed, od Ebu Sulejmana, od Kasima ibn Muhammeda, od\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":151,"html":"\u003csection class=\"page\" data-page=\"151\" id=\"stranica-151\">\u003ch2>Stranica 151\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 151\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"151.1\" id=\"ar-odlomak-151-1\">\u003cspan class=\"isnad\">أَبِي إِدْرِيسَ الْخَوْلانِيِّ، [عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قال\u003c/span>: دخلت المسجد فإذا رسول الله ص جالس وحده، فجلست اليه فقال لي: يَا أَبَا ذَرٍّ، إِنَّ لِلْمَسْجِدِ تَحِيَّةً وَإِنَّ تَحِيَّتَهُ رَكْعَتَانِ، فَقُمْ فَارْكَعْهُمَا، فَلَمَّا رَكَعْتُهُمَا جَلَسْتُ إِلَيْهِ فَقُلْتُ: يَا رَسُولَ اللَّهِ، إِنَّكَ أَمَرْتَنِي بِالصَّلاةِ فَمَا الصَّلاةُ؟ قَالَ: خَيْرُ مَوْضُوعٍ، اسْتُكْثِرَ أَوِ اسْتُقِلَّ، ثُمَّ ذَكَرَ قِصَّةً طَوِيلَةً قَالَ فِيهَا: قُلْتُ: يَا رَسُولَ اللَّهِ، كَمِ الأَنْبِيَاءُ؟ قَالَ: مِائَةُ أَلْفٍ وَأَرْبَعَةٌ وَعِشْرُونَ أَلْفًا، قَالَ: قُلْتُ: يَا رَسُولَ اللَّهِ، كَمِ الْمُرْسَلُ مِنْ ذلك؟ قال: ثلاثمائة وَثَلاثَةَ عَشَرَ جَمًّا غَفِيرًا، يَعْنِي كَثِيرًا طَيِّبًا، قَالَ: قُلْتُ يَا رَسُولَ اللَّهِ، مَنْ كَانَ أَوَّلَهُمْ؟ قَالَ: آدَمُ، قَالَ: قُلْتُ يَا رَسُولَ اللَّهِ، وَآدَمُ نَبِيٌّ مُرْسَلٌ؟ قَالَ: نَعَمْ خَلَقَهُ اللَّهُ بِيَدِهِ، وَنَفَخَ فِيهِ مِنْ رُوحِهِ، ثُمَّ سَوَّاهُ قُبُلا] .\u003c/p>\u003cp data-pair=\"151.2\" id=\"ar-odlomak-151-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سلمة، قال: حدثنى محمد ابن إِسْحَاقَ، عَنْ جَعْفَرِ بْنِ الزُّبَيْرِ، عَنِ الْقَاسِمِ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِي أُمَامَةَ، [عَنْ أَبِي ذَرٍّ قَال\u003c/span>َ: قُلْتُ، يَا نَبِيَّ اللَّهِ، أَنَبِيًّا كَانَ آدَمُ؟ قَالَ: نَعَمْ، كَانَ نَبِيًّا، كَلَّمَهُ اللَّهُ قُبُلا] .\u003c/p>\u003cp data-pair=\"151.3\" id=\"ar-odlomak-151-3\">وَقِيلَ: إِنَّهُ كَانَ مِمَّا أَنْزَلَ اللَّهُ تَعَالَى عَلَى آدَمَ تَحْرِيمُ الْمَيْتَةِ وَالدَّمِ وَلَحْمِ الْخِنْزِيرِ وَحُرُوفُ الْمُعْجَمِ فِي إِحْدَى وعشرين ورقه\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 151\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"151.1\" id=\"odlomak-151-1\">\u003cspan class=\"isnad\">Ebu Idrisa el-Havlanija, od Ebu Zerra el-Gifarija, koji je rekao:\u003c/span> „Ušao sam u džamiju i zatekao Allahovog Poslanika, sallallahu alejhi ve sellem, kako sjedi sam. Sjeo sam pored njega, pa mi je rekao: ‘Ebu Zerre, džamija ima svoj pozdrav, a njen pozdrav su dva rekata. Ustani i klanjaj ih.’ Kada sam ih klanjao, sjeo sam pored njega i rekao: ‘Allahov Poslaniče, naredio si mi namaz, pa šta je namaz?’ Odgovorio je: ‘Dobro koje je ustanovljeno, bilo ga mnogo ili malo.’ Zatim je spomenuo dugu pripovijest u kojoj je rekao: ‘Upitao sam: Allahov Poslaniče, koliko je vjerovjesnika? Odgovorio je: Stotinu dvadeset četiri hiljade.’ Rekao je: ‘Upitao sam: Allahov Poslaniče, koliko je među njima poslanika? Odgovorio je: Tristo trinaest, veliko mnoštvo’ — znači mnogo i dobro. Rekao je: ‘Upitao sam: Allahov Poslaniče, ko je bio prvi među njima? Odgovorio je: Adem.’ Rekao je: ‘Upitao sam: Allahov Poslaniče, je li Adem bio vjerovjesnik i poslanik? Odgovorio je: Jeste. Allah ga je stvorio Svojom rukom, udahnuo u njega od Svoga Duha, zatim ga neposredno oblikovao.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: „Zatim je spomenuo dugu pripovijest“ nalazi se u izvoru; to nije naknadno skraćivanje ovog prijevoda. Završetak izvora glasi ثم سواه قبلا, doslovno ovdje prenesen „zatim ga neposredno oblikovao“. Formulacija je nejasna i nije zamijenjena drugim, uobičajenijim glagolom.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"151.2\" id=\"odlomak-151-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao mi je Muhammed ibn Ishak, od Džafera ibn ez-Zubejra, od Kasima ibn Abdurrahmana, od Ebu Umame, od Ebu Zerra, koji je rekao:\u003c/span> „Upitao sam: ‘Allahov Vjerovjesniče, je li Adem bio vjerovjesnik?’ Odgovorio je: ‘Jeste, bio je vjerovjesnik; Allah mu je govorio neposredno.’“\u003c/p>\u003cp data-pair=\"151.3\" id=\"odlomak-151-3\">Rečeno je da je među onim što je Uzvišeni Allah objavio Ademu bila zabrana strvine, krvi i svinjskog mesa, te slova abecede na dvadeset jednom listu.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":152,"html":"\u003csection class=\"page\" data-page=\"152\" id=\"stranica-152\">\u003ch2>Stranica 152\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 152\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"152.1\" id=\"ar-odlomak-152-1\">ذكر ولادة حواء شيثا\u003c/p>\u003cp data-pair=\"152.2\" id=\"ar-odlomak-152-2\">ولما مضى لآدم ص من عمره مائة وثلاثون سنة، وذلك بعد قتل قابيل هابيل بخمس سنين، ولدت له حواء ابنه شيثا، فذكر أهل التوراة أن شيثا ولد فردا بغير توءم، وتفسير شيث عندهم هبة الله، ومعناه أنه خلف من هابيل.\u003c/p>\u003cp data-pair=\"152.3\" id=\"ar-odlomak-152-3\">\u003cspan class=\"isnad\">حَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنِي ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنَا هِشَامٌ، قَالَ: أَخْبَرَنِي أبي، عن أبي صالح، عن ابن عباس، قَال\u003c/span>َ: وَلَدَتْ حَوَّاءُ لآدَمَ شِيثًا وَأُخْتَهُ عَزْوَرَا، فَسُمِّيَ هَبَةُ اللَّهِ، اشْتُقَّ لَهُ مِنْ هَابِيلَ، قال لها جبرئيل حِينَ وَلَدَتْهُ: هَذَا هِبَةُ اللَّهِ بَدَلُ هَابِيلَ، وهو بالعربية شث، وبالسريانية شَاثَ، وَبِالْعِبْرَانِيَّةِ شِيثُ، وَإِلَيْهِ أَوْصَى آدَمُ، وَكَانَ آدَمُ يَوْمَ وُلِدَ لَهُ شِيثُ ابْنُ ثَلاثِينَ وَمِائَةِ سَنَةٍ.\u003c/p>\u003cp data-pair=\"152.4\" id=\"ar-odlomak-152-4\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنْ مُحَمَّدِ بْنِ إِسْحَاقَ، قَال\u003c/span>َ: لَمَّا حَضَرَتْ آدَمَ الْوَفَاةُ- فِيمَا يَذْكُرُونَ وَاللَّهُ أَعْلَمُ- دَعَا ابْنَهُ شِيثًا فَعَهِدَ إِلَيْهِ عَهْدَهُ، وَعَلَّمَهُ سَاعَاتِ اللَّيْلِ وَالنَّهَارِ، وَأَعْلَمَهُ عِبَادَةَ الْخَلْقِ فِي كُلِّ سَاعَةٍ مِنْهُنَّ، فَأَخْبَرَهُ أَنَّ لِكُلِّ سَاعَةٍ صِنْفًا مِنَ الْخَلْقِ فِيهَا عِبَادَتُهُ وَقَالَ لَهُ: يَا بُنَيَّ إِنَّ الطُّوفَانَ سَيَكُونُ فِي الأَرْضِ يَلْبَثُ فِيهَا سَبْعَ سِنِينَ وَكَتَبَ وَصِيَّتَهُ، فَكَانَ شيث- فيما ذكر- وصى ابيه آدم ع، وَصَارَتِ الرِّيَاسَةُ مِنْ بَعْدِ وَفَاةِ آدَمَ لِشِيثٍ، فَأَنْزَلَ اللَّهُ عَلَيْهِ \u003cspan class=\"isnad\">فِيمَا رُوِيَ عَنْ رَسُولِ الله ص\u003c/span> خَمْسِينَ صَحِيفَةً.\u003c/p>\u003cp data-pair=\"152.5\" id=\"ar-odlomak-152-5\">\u003cspan class=\"isnad\">حَدَّثَنَا أَحْمَدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ وَهْبٍ، قَالَ: حَدَّثَنَا عَمِّي، قَالَ: حَدَّثَنَا الْمَاضِي بْنُ مُحَمَّدٍ، عَنْ أَبِي سُلَيْمَانَ، عَنِ الْقَاسِمِ بْنِ مُحَمَّدٍ، عَنْ أَبِي إِدْرِيسَ الْخَوْلانِيِّ، [عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ، قَال\u003c/span>َ: قُلْتُ: يَا رَسُولَ اللَّهِ، كَمْ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 152\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"152.1\" id=\"odlomak-152-1\">Spomen Havvinog rođenja Šisa\u003c/p>\u003cp data-pair=\"152.2\" id=\"odlomak-152-2\">Kada je Adem, sallallahu alejhi ve sellem, napunio stotinu trideset godina — pet godina nakon što je Kabil ubio Habila — Havva mu je rodila sina Šisa. Sljedbenici Tevrata navode da je Šis rođen sam, bez blizanca. Šis kod njih znači „Allahov dar“, a smisao je da je zamjena za Habila.\u003c/p>\u003cp data-pair=\"152.3\" id=\"odlomak-152-3\">\u003cspan class=\"isnad\">Pričao mi je Haris ibn Muhammed, koji je rekao: pričao mi je Ibn Sa‘d, koji je rekao: obavijestio nas je Hišam, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao:\u003c/span> „Havva je Ademu rodila Šisa i njegovu sestru Azuru. Nazvan je Hibetullah — Allahov dar — i ime mu je izvedeno iz Habilovog. Džibril joj je, kada ga je rodila, rekao: ‘Ovo je Allahov dar kao zamjena za Habila.’ Na arapskom je Šes, na sirjačkom Šas, a na hebrejskom Šis. Njemu je Adem ostavio oporuku. Kada mu je Šis rođen, Adem je imao stotinu trideset godina.“ \u003cspan class=\"translator-note\">⟦Oblici imena u izvoru: arapski شث, sirjački شاث, hebrejski شيث; sestrino ime عزورا.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"152.4\" id=\"odlomak-152-4\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, koji je rekao:\u003c/span> „Kada se Ademu približila smrt — prema onome što navode, a Allah najbolje zna — pozvao je svoga sina Šisa i dao mu svoju oporuku. Poučio ga je satima noći i dana i obavijestio o ibadetu stvorenja u svakom od tih sati. Kazao mu je da u svakom satu jedna skupina stvorenja obavlja svoj ibadet. Rekao mu je: ‘Sine moj, na Zemlji će biti Potop koji će trajati sedam godina.’ Napisao je svoju oporuku.“ Prema onome što je navedeno, Šis je bio oporučeni nasljednik svoga oca Adema, alejhis-selam, i nakon Ademove smrti njemu je pripalo poglavarstvo. Allah mu je, prema onome \u003cspan class=\"isnad\">što je preneseno od Allahovog Poslanika, sallallahu alejhi ve sellem,\u003c/span> spustio pedeset listova objave.\u003c/p>\u003cp data-pair=\"152.5\" id=\"odlomak-152-5\">\u003cspan class=\"isnad\">Pričao nam je Ahmed ibn Abdurrahman ibn Vehb, koji je rekao: pričao nam je moj amidža, koji je rekao: pričao nam je Madi ibn Muhammed, od Ebu Sulejmana, od Kasima ibn Muhammeda, od Ebu Idrisa el-Havlanija, od Ebu Zerra el-Gifarija, koji je rekao:\u003c/span> „Upitao sam: ‘Allahov Poslaniče, koliko je\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"}],"book":[{"n":128,"ar":"حِينَ أُهْبِطَ عَلَى الْجَبَلِ إِلَى قَضِيبٍ مِنْ حَدِيدٍ نَابِتٍ عَلَى الْجَبَلِ، فَقَالَ: هَذَا مِنْ هَذَا، فَجَعَلَ يَكْسِرُ أَشْجَارًا قَدْ عَتِقَتْ وَيَبِسَتْ بِالمِطْرَقَةِ، ثُمَّ أَوْقَدَ عَلَى ذَلِكَ الْغُصْنُ حَتَّى ذَابَ، فَكَانَ أَوَّلُ شَيْءٍ ضَرَبَهُ مُدْيَةً، فَكَانَ يَعْمَلُ بِهَا، ثُمَّ ضَرَبَ التَّنُّورَ، وَهُوَ الَّذِي وَرِثَهُ نُوحٌ، وَهُوَ الَّذِي فَارَ بِالْعَذَابِ بِالْهِنْدِ.\nوَكَانَ آدَمُ حِينَ هَبَطَ يَمْسَحُ رَأْسَهُ السَّمَاءُ، فَمِنْ ثَمَّ صَلِعَ، وَأَوْرَثَ وَلَدَهُ الصَّلَعَ وَنَفَرَتْ مِنْ طُولِهِ دَوَابُّ الْبَرِّ، فَصَارَتْ وَحْشًا مِنْ يومئذ، وكان آدم ع وَهُوَ عَلَى ذَلِكَ الْجَبَلِ قَائِمٌ يَسْمَعُ أَصْوَاتَ الْمَلائِكَةِ، وَيَجِدُ رِيحَ الْجَنَّةِ، فَحُطَّ مِنْ طُولِهِ ذَلِكَ إِلَى سِتِّينَ ذِرَاعًا، فَكَانَ ذَلِكَ طُولُهُ إِلَى أَنْ مَاتَ وَلَمْ يُجْمَعْ حُسْنُ آدَمَ ع لأحد من ولده الا ليوسف ع.\nوَقِيلَ: إِنَّ مِنَ الثِّمَارِ الَّتِي زَوَّدَ اللَّهُ عز وجل آدم ع حين اهبط إِلَى الأَرْضِ ثَلاثِينَ نَوْعًا، عَشَرَةً مِنْهَا فِي الْقُشُورِ وَعَشَرَةً لَهَا نَوَى، وَعَشَرَةً لا قُشُورَ لَهَا وَلا نَوَى فَأَمَّا الَّتِي فِي الْقُشُورِ مِنْهَا فَالْجَوْزُ، وَاللَّوْزُ، وَالْفُسْتُقُ، وَالْبُنْدُقُ، وَالْخَشْخَاشُ، وَالْبَلُّوطُ، والشاهبلوط، وَالرَّانِجُ، وَالرُّمَّانُ، وَالْمَوْزُ وَأَمَّا الَّتِي لَهَا نَوَى مِنْهَا فَالْخَوْخُ، وَالْمِشْمِشُ، وَالإِجَّاصُ، وَالرُّطَبُ، وَالْغُبَيْرَاءُ، وَالنَّبَقُ، وَالزُّعْرُورُ، وَالْعِنَّابُ، وَالْمُقْلُ، وَالشَّاهَلُوجُ وَأَمَّا الَّتِي لا قُشُورَ لَهَا وَلا نَوَى فَالتُّفَّاحُ، وَالسَّفَرْجَلُ، وَالْكُمَّثْرَى، وَالْعِنَبُ، وَالتُّوتُ، وَالتِّينُ، وَالأُتْرُجُّ، وَالْخُرْنُوبُ، وَالْخِيارُ، وَالْبِطِّيخُ.\nوَقِيلَ: كَانَ مِمَّا أَخْرَجَ آدَمُ مَعَهُ مِنَ الْجَنَّةِ صُرَّةٌ مِنْ حِنْطَةٍ، وَقِيلَ: إِنَّ الْحِنْطَةَ انما جاءه بها جبرئيل ع بَعْدَ أَنْ جَاعَ آدَمُ، وَاسْتَطْعَمَ رَبَّهُ، فَبَعَثَ الله اليه مع جبرئيل ع بِسَبْعِ حَبَّاتٍ مِنْ حِنْطَةٍ، فَوَضَعَهَا فِي يَدِ آدم ع، فقال آدم لجبرئيل: ما هذا؟ فقال له جبرئيل: هَذَا الَّذِي أَخْرَجَكَ مِنَ الْجَنَّةِ، وَكَانَ وَزْنُ الحبه منها مائه الف درهم وثمانمائه دِرْهَمٍ، فَقَالَ آدَمُ:\nمَا أَصْنَعُ بِهَذَا؟ قَالَ: انْثُرْهُ فِي الأَرْضِ فَفَعَلَ، فَأَنْبَتَهُ اللَّهُ عَزَّ وَجَلَّ مِنْ سَاعَتِهِ، فَجَرَتْ سُنَّةٌ فِي وَلَدِهِ الْبَذْرُ فِي الأَرْضِ، ثُمَّ أَمَرَهُ فَحَصَدَهُ، ثُمَّ أَمَرَهُ فَجَمَعَهُ وَفَرَكَهُ بِيَدِهِ، ثُمَّ أَمَرَهُ أَنْ يُذْرِيَهُ، ثُمَّ أَتَاهُ بِحَجَرَيْنِ فَوَضَعَ أَحَدَهُمَا عَلَى الآخر","bs":"\u003cp data-paragraph=\"128.1\">željeznu šipku koja je izrastala na planini i rekao: ‘Ovo je od ovoga.’ Čekićem je počeo lomiti stara i osušena stabla, zatim je nad tom granom raspalio vatru dok se nije istopila. Prvo što je iskovao bio je nož kojim je radio. Zatim je iskovao peć, koju je naslijedio Nuh, i to je ona iz koje je u Indiji izbio talas kazne.\u003c/p>\u003cp data-paragraph=\"128.2\">Kada je Adem spušten, nebo mu je dodirivalo glavu. Zato je oćelavio i svojim potomcima prenio ćelavost. Zemaljske životinje prepale su se njegove visine, pa su od toga dana postale divlje. Dok je Adem, alejhis-selam, stajao na toj planini, slušao je glasove meleka i osjećao džennetski miris. Zatim je njegova visina smanjena na šezdeset lakata i takva je ostala do njegove smrti. Ademova, alejhis-selam, ljepota nije u cijelosti objedinjena ni u jednom njegovom potomku osim u Jusufu, alejhis-selam.\u003c/p>\u003cp data-paragraph=\"128.3\">Rečeno je da je među plodovima kojima je Allah, Silan i Uzvišen, opskrbio Adema, alejhis-selam, kada je spušten na Zemlju, bilo trideset vrsta: deset u ljuskama, deset s košticama i deset bez ljuske i koštice. U ljuskama su: orah, badem, pistacija, lješnjak, mak, žir, pitomi kesten, randž, nar i banana. S košticama su: breskva, kajsija, šljiva, svježa datula, gubejra, nebek, glog, unab, mukl i šahludž. Bez ljuske i koštice su: jabuka, dunja, kruška, grožđe, dud, smokva, četrun, rogač, krastavac i lubenica. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: klasifikacija i svih trideset naziva sačuvani su prema izvoru. Nazivi الرانج، الغبيراء، النبق، العناب، المقل، الشاهلوج preneseni su kao randž, gubejra, nebek, unab, mukl i šahludž; njihova precizna botanička identifikacija nije ovdje potvrđena.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"128.4\">Rečeno je da je Adem sa sobom iz Dženneta iznio i vrećicu pšenice. Rečeno je i da mu je pšenicu donio Džibril, alejhis-selam, nakon što je Adem ogladnio i zatražio hranu od svoga Gospodara. Allah mu je preko Džibrila, alejhis-selam, poslao sedam zrna pšenice, pa ih je stavio u Ademovu, alejhis-selam, ruku. Adem je upitao Džibrila: ‘Šta je ovo?’ Džibril mu je odgovorio: ‘Ovo je ono što te izvelo iz Dženneta.’ Težina jednoga zrna bila je stotinu hiljada i osam stotina dirhema. Adem je rekao: ‘Šta da radim s ovim?’ Odgovorio je: ‘Posij to po zemlji.’ Učinio je to, pa je Allah, Silan i Uzvišen, dao da nikne istoga časa. Tako je sijanje po zemlji postalo ustaljena praksa među njegovim potomcima. Zatim mu je naredio da požanje, pa je požnjeo. Potom mu je naredio da sakupi i protrlja rukama, zatim da ovije. Onda mu je donio dva kamena i položio jedan na drugi,\u003c/p>","paragraphs":[{"id":"128.1","ar":"حِينَ أُهْبِطَ عَلَى الْجَبَلِ إِلَى قَضِيبٍ مِنْ حَدِيدٍ نَابِتٍ عَلَى الْجَبَلِ، فَقَالَ: هَذَا مِنْ هَذَا، فَجَعَلَ يَكْسِرُ أَشْجَارًا قَدْ عَتِقَتْ وَيَبِسَتْ بِالمِطْرَقَةِ، ثُمَّ أَوْقَدَ عَلَى ذَلِكَ الْغُصْنُ حَتَّى ذَابَ، فَكَانَ أَوَّلُ شَيْءٍ ضَرَبَهُ مُدْيَةً، فَكَانَ يَعْمَلُ بِهَا، ثُمَّ ضَرَبَ التَّنُّورَ، وَهُوَ الَّذِي وَرِثَهُ نُوحٌ، وَهُوَ الَّذِي فَارَ بِالْعَذَابِ بِالْهِنْدِ.","bs":"željeznu šipku koja je izrastala na planini i rekao: ‘Ovo je od ovoga.’ Čekićem je počeo lomiti stara i osušena stabla, zatim je nad tom granom raspalio vatru dok se nije istopila. Prvo što je iskovao bio je nož kojim je radio. Zatim je iskovao peć, koju je naslijedio Nuh, i to je ona iz koje je u Indiji izbio talas kazne.","ar_ranges":[],"ar_html":"حِينَ أُهْبِطَ عَلَى الْجَبَلِ إِلَى قَضِيبٍ مِنْ حَدِيدٍ نَابِتٍ عَلَى الْجَبَلِ، فَقَالَ: هَذَا مِنْ ه . Nazivi الرانج، الغبيراء، النبق، العناب، المقل، الشاهلوج preneseni su kao randž, gubejra, nebek, unab, mukl i šahludž; njihova precizna botanička identifikacija nije ovdje potvrđena.⟧","ar_ranges":[],"ar_html":"وَقِيلَ: إِنَّ مِنَ الثِّمَارِ الَّتِي زَوَّدَ اللَّهُ عز وجل آدم ع حين اهبط إِلَى الأَرْضِ ثَلاثِينَ نَوْعًا، عَشَرَةً مِنْهَا فِي الْقُشُورِ وَعَشَرَةً لَهَا نَوَى، وَعَشَرَةً لا قُشُورَ لَهَا وَلا نَوَى فَأَمَّا الَّتِي فِي الْقُشُورِ مِنْهَا فَالْجَوْزُ، وَاللَّوْزُ، وَالْفُسْتُقُ، وَالْبُنْدُقُ، وَالْخَشْخَاشُ، وَالْبَلُّوطُ، والشاهبلوط، وَالرَّانِجُ، وَالرُّمَّانُ، وَالْمَوْزُ وَأَمَّا الَّتِي لَهَا نَوَى مِنْهَا فَالْخَوْخُ، وَالْمِشْمِشُ، وَالإِجَّاصُ، وَالرُّطَبُ، وَالْغُبَيْرَاءُ، وَالنَّبَقُ، وَالزُّعْرُورُ، وَالْعِنَّابُ، وَالْمُقْلُ، وَالشَّاهَلُوجُ وَأَمَّا الَّتِي لا قُشُورَ لَهَا وَلا نَوَى فَالتُّفَّاحُ، وَالسَّفَرْجَلُ، وَالْكُمَّثْرَى، وَالْعِنَبُ، وَالتُّوتُ، وَالتِّينُ، وَالأُتْرُجُّ، وَالْخُرْنُوبُ، وَالْخِيارُ، وَالْبِطِّيخُ.","bs_ranges":[],"bs_html":"Rečeno je da je među plodovima kojima je Allah, Silan i Uzvišen, opskrbio Adema, alejhis-selam, kada je spušten na Zemlju, bilo trideset vrsta: deset u ljuskama, deset s košticama i deset bez ljuske i koštice. U ljuskama su: orah, badem, pistacija, lješnjak, mak, žir, pitomi kesten, randž, nar i banana. S košticama su: breskva, kajsija, šljiva, svježa datula, gubejra, nebek, glog, unab, mukl i šahludž. Bez ljuske i koštice su: jabuka, dunja, kruška, grožđe, dud, smokva, četrun, rogač, krastavac i lubenica. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: klasifikacija i svih trideset naziva sačuvani su prema izvoru. Nazivi الرانج، الغبيراء، النبق، العناب، المقل، الشاهلوج preneseni su kao randž, gubejra, nebek, unab, mukl i šahludž; njihova precizna botanička identifikacija nije ovdje potvrđena.⟧\u003c/span>"},{"id":"128.4","ar":"وَقِيلَ: كَانَ مِمَّا أَخْرَجَ آدَمُ مَعَهُ مِنَ الْجَنَّةِ صُرَّةٌ مِنْ حِنْطَةٍ، وَقِيلَ: إِنَّ الْحِنْطَةَ انما جاءه بها جبرئيل ع بَعْدَ أَنْ جَاعَ آدَمُ، وَاسْتَطْعَمَ رَبَّهُ، فَبَعَثَ الله اليه مع جبرئيل ع بِسَبْعِ حَبَّاتٍ مِنْ حِنْطَةٍ، فَوَضَعَهَا فِي يَدِ آدم ع، فقال آدم لجبرئيل: ما هذا؟ فقال له جبرئيل: هَذَا الَّذِي أَخْرَجَكَ مِنَ الْجَنَّةِ، وَكَانَ وَزْنُ الحبه منها مائه الف درهم وثمانمائه دِرْهَمٍ، فَقَالَ آدَمُ:\nمَا أَصْنَعُ بِهَذَا؟ قَالَ: انْثُرْهُ فِي الأَرْضِ فَفَعَلَ، فَأَنْبَتَهُ اللَّهُ عَزَّ وَجَلَّ مِنْ سَاعَتِهِ، فَجَرَتْ سُنَّةٌ فِي وَلَدِهِ الْبَذْرُ فِي الأَرْضِ، ثُمَّ أَمَرَهُ فَحَصَدَهُ، ثُمَّ أَمَرَهُ فَجَمَعَهُ وَفَرَكَهُ بِيَدِهِ، ثُمَّ أَمَرَهُ أَنْ يُذْرِيَهُ، ثُمَّ أَتَاهُ بِحَجَرَيْنِ فَوَضَعَ أَحَدَهُمَا عَلَى الآخر","bs":"Rečeno je da je Adem sa sobom iz Dženneta iznio i vrećicu pšenice. Rečeno je i da mu je pšenicu donio Džibril, alejhis-selam, nakon što je Adem ogladnio i zatražio hranu od svoga Gospodara. Allah mu je preko Džibrila, alejhis-selam, poslao sedam zrna pšenice, pa ih je stavio u Ademovu, alejhis-selam, ruku. Adem je upitao Džibrila: ‘Šta je ovo?’ Džibril mu je odgovorio: ‘Ovo je ono što te izvelo iz Dženneta.’ Težina jednoga zrna bila je stotinu hiljada i osam stotina dirhema. Adem je rekao: ‘Šta da radim s ovim?’ Odgovorio je: ‘Posij to po zemlji.’ Učinio je to, pa je Allah, Silan i Uzvišen, dao da nikne istoga časa. Tako je sijanje po zemlji postalo ustaljena praksa među njegovim potomcima. Zatim mu je naredio da požanje, pa je požnjeo. Potom mu je naredio da sakupi i protrlja rukama, zatim da ovije. Onda mu je donio dva kamena i položio jedan na drugi,","ar_ranges":[],"ar_html":"وَقِيلَ: كَانَ مِمَّا أَخْرَجَ آدَمُ مَعَهُ مِنَ الْجَنَّةِ صُرَّةٌ مِنْ حِنْطَةٍ، وَقِيلَ: إِنَّ الْحِنْطَةَ انما جاءه بها جبرئيل ع بَعْدَ أَنْ جَاعَ آدَمُ، وَاسْتَطْعَمَ رَبَّهُ، فَبَعَثَ الله اليه مع جبرئيل ع بِسَبْعِ حَبَّاتٍ مِنْ حِنْطَةٍ، فَوَضَعَهَا فِي يَدِ آدم ع، فقال آدم لجبرئيل: ما هذا؟ فقال له جبرئيل: هَذَا الَّذِي أَخْرَجَكَ مِنَ الْجَنَّةِ، وَكَانَ وَزْنُ الحبه منها مائه الف درهم وثمانمائه دِرْهَمٍ، فَقَالَ آدَمُ:\nمَا أَصْنَعُ بِهَذَا؟ قَالَ: انْثُرْهُ فِي الأَرْضِ ِمَا أَظْفَارُهُمَا، وَطَفِقَا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ، وَرَقِ التِّينِ يُلْصِقَانِ بَعْضَهَا إِلَى بَعْضٍ، فَانْطَلَقَ آدَمُ مُوَلِّيًا فِي الْجَنَّةِ، فَأَخَذَتْ بِرَأْسِهِ شَجَرَةٌ مِنَ الْجَنَّةِ فَنَادَاهُ: يَا آدَمُ، أَمِنِّي تَفِرُّ؟ قَالَ: لا، ولكنى استحيتك يَا رَبِّ، قَالَ: أَمَا كَانَ لَكَ فِيمَا مَنَحْتُكَ مِنَ الْجَنَّةِ وَأَبَحْتُكَ مِنْهَا مَنْدُوحَةٌ عَمَّا حَرَّمْتُ عَلَيْكَ! قَالَ: بَلَى يَا رَبِّ، وَلَكِنْ وَعِزَّتِكَ مَا حَسِبْتُ أَنَّ أَحَدًا يَحْلِفُ بِكَ كَاذِبًا، قَالَ- وَهُوَ قَوْلُ اللَّهِ تَبَارَكَ وَتَعَالَى: «وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» - قَالَ: فَبِعِزَّتِي لأُهْبِطَنَّكَ إِلَى الأَرْضِ، فَلا تَنَالُ الْعَيْشَ إِلا كَدًّا.\nقَالَ: فَأُهْبِطَ مِنَ الْجَنَّةِ، وَكَانَا يَأْكُلانِ فِيهَا رَغَدًا، فَأُهْبِطَ إِلَى غَيْرِ رَغَدٍ مِنْ طَعَامٍ وَشَرَابٍ، فَعُلِّمَ صَنْعَةَ الْحَدِيدِ، وَأُمِرَ بِالْحَرْثِ فَحَرَثَ وَزَرَعَ ثُمَّ سَقَى، حَتَّى إِذَا بَلَغَ حَصَدَهُ، ثُمَّ دَاسَهُ، ثُمَّ ذَرَاهُ، ثُمَّ طَحَنَهُ، ثُمَّ عَجَنَهُ، ثُمَّ خَبَزَهُ، ثُمَّ اكله، فلم يبلغه حَتَّى بَلَغَ مِنْهُ مَا شَاءَ اللَّهُ أَنْ يبلغ","bs":"\u003cp data-paragraph=\"129.1\">pa je samljeo. Zatim mu je naredio da zamijesi i da ispeče hljeb u žaru. Džibril, alejhis-selam, sakupio mu je kamen i željezo, kresnuo ih i iz njih je izašla vatra. Tako je on bio prvi koji je pekao hljeb u žaru.“\u003c/p>\u003cp data-paragraph=\"129.2\">Ovo mišljenje koje smo prenijeli od onoga koji ga zastupa suprotno je onome što su donijele predaje od prethodnika iz ummeta našeg Vjerovjesnika, sallallahu alejhi ve sellem. Naime, Musenna ibn Ibrahim pričao mi je da mu je Ishak pričao, rekavši: pričao nam je Abdurrezzak, koji je rekao: obavijestili su nas Sufjan ibn Ujejna i Ibn el-Mubarek, od Hasena ibn Umare, od Minhala ibn Amra i od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Drvo koje je Allah zabranio Ademu i njegovoj supruzi bio je klas. Kada su jeli s njega, otkrila su im se stidna mjesta. Ono što im je skrivalo stidna mjesta bili su njihovi nokti. Počeli su po sebi spajati džennetsko lišće, lišće smokve, lijepeći jedne listove uz druge. Adem je okrenuo leđa i krenuo po Džennetu, pa mu je jedno džennetsko drvo zahvatilo glavu. Dozvao ga je: ‘Ademe, zar bježiš od Mene?’ Odgovorio je: ‘Ne, nego sam Te se postidio, Gospodaru moj.’ Rekao je: ‘Zar ti u onome što sam ti podario od Dženneta i dopustio ti u njemu nije bilo dovoljno prostora da se kloniš onoga što sam ti zabranio?’ Odgovorio je: ‘Jeste, Gospodaru moj, ali tako mi Tvoje moći, nisam mislio da bi se iko mogao Tobom lažno zakleti.’“ Rekao je — a to su riječi Allaha, Blagoslovljenog i Uzvišenog: „I zakleo im se: Ja sam vam, doista, iskren savjetnik.“ Rekao je: „Tako Mi Moje moći, sigurno ću te spustiti na Zemlju, pa do životne opskrbe nećeš dolaziti osim mukotrpnim radom.“\u003c/p>\u003cp data-paragraph=\"129.3\">Rekao je: „Spušten je iz Dženneta, a njih dvoje u njemu su jeli obilno. Spušten je tamo gdje hrana i piće nisu bili obilno dostupni. Poučen je obradi željeza i naređeno mu je da ore, pa je orao i sijao, zatim zalijevao. Kada je sazrelo, požnjeo je, potom ovršio, ovijao, samljeo, zamijesio, ispekao i zatim jeo. Do toga nije stigao dok ga nije zadesilo onoliko napora koliko je Allah htio da ga zadesi.“ \u003cspan class=\"translator-note\">⟦Prijevod izričitog kur’anskog navoda u prethodnom odlomku: El-A‘raf, 7:21.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"129.1","ar":"فَطَحَنَهُ، ثُمَّ أَمَرَهُ أَنْ يَعْجِنَهُ، ثُمَّ أَمَرَهُ ان يخبزه مله، وجمع له جبرئيل ع الْحَجَرَ وَالْحَدِيدَ فَقَدَحَهُ، فَخَرَجَتْ مِنْهُ النَّارُ، فَهُوَ أول من خبز الملة.","bs":"pa je samljeo. Zatim mu je naredio da zamijesi i da ispeče hljeb u žaru. Džibril, alejhis-selam, sakupio mu je kamen i željezo, kresnuo ih i iz njih je izašla vatra. Tako je on bio prvi koji je pekao hljeb u žaru.“","ar_ranges":[],"ar_html":"فَطَحَنَهُ، ثُمَّ أَمَرَهُ أَنْ يَعْجِنَهُ، ثُمَّ أَمَرَهُ ان يخبزه مله، وجمع له جبرئيل ع الْحَجَرَ وَالْحَدِيدَ فَقَدَحَهُ، فَخَرَجَتْ مِنْهُ النَّارُ، فَهُوَ أول من خبز الملة.","bs_ranges":[],"bs_html":"pa je samljeo. Zatim mu je naredio da zamijesi i da ispeče hljeb u žaru. Džibril, alejhis-selam, sakupio mu je kamen i željezo, kresnuo ih i iz njih je izašla vatra. Tako je on bio prvi koji je pekao hljeb u žaru.“"},{"id":"129.2","ar":"وهذا القول الَّذِي حَكَيْنَاهُ عَنْ قَائِلِ هَذَا الْقَوْلِ، خِلافُ مَا جَاءَتْ بِهِ الرِّوَايَاتُ عَنْ سَلَفِ أُمَّةِ نبينا ص، وَذَلِكَ أَنَّ الْمُثَنَّى بْنَ إِبْرَاهِيمَ حَدَّثَنِي أَنَّ إِسْحَاقَ حَدَّثَهُ، قَالَ: حَدَّثَنَا عَبْدُ الرَّزَّاقِ، قَالَ: أَخْبَرَنَا سُفْيَانُ بْنُ عُيَيْنَةَ وَابْنُ الْمُبَارَكِ، عَنِ الْحَسَنِ بْنِ عُمَارَةَ، عَنِ الْمِنْهَالِ بْنِ عَمْرٍو، وعن سعيد ابن جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: كَانَتِ الشَّجَرَةَ الَّتِي نَهَى اللَّهُ عَنْهَا آدَمَ وَزَوْجَتَهُ السُّنْبُلَةُ، فَلَمَّا أَكَلا مِنْهَا بَدَتْ لَهُمَا سَوْءَاتُهُمَا، وَكَانَ الَّذِي وَارَى عَنْهُمَا مِنْ سَوْءَاتِهِمَا أَظْفَارُهُمَا، وَطَفِقَا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ، وَرَقِ التِّينِ يُلْصِقَانِ بَعْضَهَا إِلَى بَعْضٍ، فَانْطَلَقَ آدَمُ مُوَلِّيًا فِي الْجَنَّةِ، فَأَخَذَتْ بِرَأْسِهِ شَجَرَةٌ مِنَ الْجَنَّةِ فَنَادَاهُ: يَا آدَمُ، أَمِنِّي تَفِرُّ؟ قَالَ: لا، ولكنى استحيتك يَا رَبِّ، قَالَ: أَمَا كَانَ لَكَ فِيمَا مَنَحْتُكَ مِنَ الْجَنَّةِ وَأَبَحْتُكَ مِنْهَا مَنْدُوحَةٌ عَمَّا حَرَّمْتُ عَلَيْكَ! قَالَ: بَلَى يَا رَبِّ، وَلَكِنْ وَعِزَّتِكَ مَا حَسِبْتُ أَنَّ أَحَدًا يَحْلِفُ بِكَ كَاذِبًا، قَالَ- وَهُوَ قَوْلُ اللَّهِ تَبَارَكَ وَتَعَالَى: «وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» - قَالَ: فَبِعِزَّتِي لأُهْبِطَنَّكَ إِلَى الأَرْضِ، فَلا تَنَالُ الْعَيْشَ إِلا كَدًّا.","bs":"Ovo mišljenje koje smo prenijeli od onoga koji ga zastupa suprotno je onome što su donijele predaje od prethodnika iz ummeta našeg Vjerovjesnika, sallallahu alejhi ve sellem. Naime, Musenna ibn Ibrahim pričao mi je da mu je Ishak pričao, rekavši: pričao nam je Abdurrezzak, koji je rekao: obavijestili su nas Sufjan ibn Ujejna i Ibn el-Mubarek, od Hasena ibn Umare, od Minhala ibn Amra i od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Drvo koje je Allah zabranio Ademu i njegovoj supruzi bio je klas. Kada su jeli s njega, otkrila su im se stidna mjesta. Ono što im je skrivalo stidna mjesta bili su njihovi nokti. Počeli su po sebi spajati džennetsko lišće, lišće smokve, lijepeći jedne listove uz druge. Adem je okrenuo leđa i krenuo po Džennetu, pa mu je jedno džennetsko drvo zahvatilo glavu. Dozvao ga je: ‘Ademe, zar bježiš od Mene?’ Odgovorio je: ‘Ne, nego sam Te se postidio, Gospodaru moj.’ Rekao je: ‘Zar ti u onome što sam ti podario od Dženneta i dopustio ti u njemu nije bilo dovoljno prostora da se kloniš onoga što sam ti zabranio?’ Odgovorio je: ‘Jeste, Gospodaru moj, ali tako mi Tvoje moći, nisam mislio da bi se iko mogao Tobom lažno zakleti.’“ Rekao je — a to su riječi Allaha, Blagoslovljenog i Uzvišenog: „I zakleo im se: Ja sam vam, doista, iskren savjetnik.“ Rekao je: „Tako Mi Moje moći, sigurno ću te spustiti na Zemlju, pa do životne opskrbe nećeš dolaziti osim mukotrpnim radom.“","ar_ranges":[[173,430]],"ar_html":"وهذا القول الَّذِي حَكَيْنَاهُ عَنْ قَائِلِ هَذَا الْقَوْلِ، خِلافُ مَا جَاءَتْ بِهِ الرِّوَايَاتُ عَنْ سَلَفِ أُمَّةِ نبينا ص، وَذَلِكَ أَنَّ الْمُثَنَّى بْنَ إِبْرَاهِيمَ \u003cspan class=\"isnad\">حَدَّثَنِي أَنَّ إِسْحَاقَ حَدَّثَهُ، قَالَ: حَدَّثَنَا عَبْدُ الرَّزَّاقِ، قَالَ: أَخْبَرَنَا سُفْيَانُ بْنُ عُيَيْنَةَ وَابْنُ الْمُبَارَكِ، عَنِ الْحَسَنِ بْنِ عُمَارَةَ، عَنِ الْمِنْهَالِ بْنِ عَمْرٍو، وعن سعيد ابن جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>كَانَتِ الشَّجَرَةَ الَّتِي نَهَى اللَّهُ عَنْهَا آدَمَ وَزَوْجَتَهُ السُّنْبُلَةُ، فَلَمَّا أَكَلا مِنْهَا بَدَتْ لَهُمَا سَوْءَاتُهُمَا، وَكَانَ الَّذِي وَارَى عَنْهُمَا مِنْ سَوْءَاتِهِمَا أَظْفَارُهُمَا، وَطَفِقَا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ، وَرَقِ التِّينِ يُلْصِقَانِ بَعْضَهَا إِلَى بَعْضٍ، فَانْطَلَقَ آدَمُ مُوَلِّيًا فِي الْجَنَّةِ، فَأَخَذَتْ بِرَأْسِهِ شَجَرَةٌ مِنَ الْجَنَّةِ فَنَادَاهُ: يَا آدَمُ، أَمِنِّي تَفِرُّ؟ قَالَ: لا، ول  رَغَدًا، فَأُهْبِطَ إِلَى غَيْرِ رَغَدٍ مِنْ طَعَامٍ وَشَرَابٍ، فَعُلِّمَ صَنْعَةَ الْحَدِيدِ، وَأُمِرَ بِالْحَرْثِ فَحَرَثَ وَزَرَعَ ثُمَّ سَقَى، حَتَّى إِذَا بَلَغَ حَصَدَهُ، ثُمَّ دَاسَهُ، ثُمَّ ذَرَاهُ، ثُمَّ طَحَنَهُ، ثُمَّ عَجَنَهُ، ثُمَّ خَبَزَهُ، ثُمَّ اكله، فلم يبلغه حَتَّى بَلَغَ مِنْهُ مَا شَاءَ اللَّهُ أَنْ يبلغ","bs":"Rekao je: „Spušten je iz Dženneta, a njih dvoje u njemu su jeli obilno. Spušten je tamo gdje hrana i piće nisu bili obilno dostupni. Poučen je obradi željeza i naređeno mu je da ore, pa je orao i sijao, zatim zalijevao. Kada je sazrelo, požnjeo je, potom ovršio, ovijao, samljeo, zamijesio, ispekao i zatim jeo. Do toga nije stigao dok ga nije zadesilo onoliko napora koliko je Allah htio da ga zadesi.“ ⟦Prijevod izričitog kur’anskog navoda u prethodnom odlomku: El-A‘raf, 7:21.⟧","ar_ranges":[],"ar_html":"قَالَ: فَأُهْبِطَ مِنَ الْجَنَّةِ، وَكَانَا يَأْكُلانِ فِيهَا رَغَدًا، فَأُهْبِطَ إِلَى غَيْرِ رَغَدٍ مِنْ طَعَامٍ وَشَرَابٍ، فَعُلِّمَ صَنْعَةَ الْحَدِيدِ، وَأُمِرَ بِالْحَرْثِ فَحَرَثَ وَزَرَعَ ثُمَّ سَقَى، حَتَّى إِذَا بَلَغَ حَصَدَهُ، ثُمَّ دَاسَهُ، ثُمَّ ذَرَاهُ، ثُمَّ طَحَنَهُ، ثُمَّ عَجَنَهُ، ثُمَّ خَبَزَهُ، ثُمَّ اكله، فلم يبلغه حَتَّى بَلَغَ مِنْهُ مَا شَاءَ اللَّهُ أَنْ يبلغ","bs_ranges":[],"bs_html":"Rekao je: „Spušten je iz Dženneta, a njih dvoje u njemu su jeli obilno. Spušten je tamo gdje hrana i piće nisu bili obilno dostupni. Poučen je obradi željeza i naređeno mu je da ore, pa je orao i sijao, zatim zalijevao. Kada je sazrelo, požnjeo je, potom ovršio, ovijao, samljeo, zamijesio, ispekao i zatim jeo. Do toga nije stigao dok ga nije zadesilo onoliko napora koliko je Allah htio da ga zadesi.“ \u003cspan class=\"translator-note\">⟦Prijevod izričitog kur’anskog navoda u prethodnom odlomku: El-A‘raf, 7:21.⟧\u003c/span>"}],"notes":[]},{"n":130,"ar":"حدثنا ابن حميد، قال: حدثنا يعقوب، عن جعفر، عن سعيد، قال: أهبط إلى آدم ثور احمر، فكان يحدث عليه، ويمسح العرق عن جبينه، فهو الذي قال الله عز وجل: «فَلا يُخْرِجَنَّكُما مِنَ الْجَنَّةِ فَتَشْقى» ، فكان ذلك شقاؤه.\nفهذا الذي قاله هؤلاء هو أولى بالصواب، وأشبه بما دل عليه كتاب ربنا عز وجل، وذلك أن الله عز ذكره لما تقدم إلى آدم وزوجته حواء بالنهي عن طاعة عدوهما، قال لآدم: «يَا آدَمُ إِنَّ هَذَا عَدُوٌّ لَكَ وَلِزَوْجِكَ فَلا يُخْرِجَنَّكُما مِنَ الْجَنَّةِ فَتَشْقى إِنَّ لَكَ أَلَّا تَجُوعَ فِيها وَلا تَعْرى.\nوَأَنَّكَ لا تَظْمَؤُا فِيها وَلا تَضْحى» ، فكان معلوما أن الشقاء الذي أعلمه أنه يكون إن أطاع عدوه إبليس، هو مشقة الوصول إلى ما يزيل الجوع والعري عنه، وذلك هي الأسباب التي بها يصل أولاده إلى الغذاء، من حراثة وبذر وعلاج وسقي، وغير ذلك من الأسباب الشاقة المؤلمة ولو كان جبرئيل أتاه بالغذاء الذي يصل إليه ببذره دون سائر المؤن غيره، لم يكن هناك من الشقاء الذي توعده به ربه على طاعة الشيطان ومعصية الرحمن كبير خطب، ولكن الأمر كان- والله أعلم- على ما روينا عن ابْنِ عَبَّاسٍ وغيره.\nوقد قيل: إن آدم ع نزل معه السندان، والكلبتان، والميقعة، والمطرقة.\n\nذِكْرُ من قال ذلك:\n\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا الحسين، عَنْ عَلْبَاءَ بْنِ أَحْمَرَ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: ثَلاثَةُ أَشْيَاءٍ نَزَلَتْ مَعَ آدم ع: السِّنْدَانُ، وَالْكَلْبَتَانِ، وَالْمِيقَعَةُ، وَالْمِطْرَقَةُ","bs":"\u003cp data-paragraph=\"130.1\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jakub, od Džafera, od Seida, koji je rekao: „Ademu je spušten crveni bik, pa je njime [orao — nesigurno čitanje] i brisao znoj sa čela. To je ono što je Allah, Silan i Uzvišen, rekao: ‘Neka vas zato ne izvede iz Dženneta, pa da se mučiš.’ To je bila njegova muka.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Ta-Ha, 20:117, navedeni dio. Napomena prevodioca: izvor ima فكان يحدث عليه, nejasnu formulaciju koja nije doslovan izraz za oranje. Predloženo čitanje zasniva se na kontekstu i zahtijeva provjeru štampanog izdanja.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"130.2\">Ono što su ovi rekli preče je smatrati ispravnim i bliže je onome na šta ukazuje Knjiga našeg Gospodara, Silnog i Uzvišenog. Kada je Allah, Silan je spomen Njegov, unaprijed zabranio Ademu i njegovoj supruzi Havvi da se pokore svome neprijatelju, rekao je Ademu: „Ademe, ovo je neprijatelj tebi i tvojoj supruzi. Neka vas zato ne izvede iz Dženneta, pa da se mučiš! U njemu nećeš ni gladovati ni go biti. U njemu nećeš ni žednjeti ni Sunčevoj žezi biti izložen.“ Zato je bilo poznato da je muka o kojoj ga je obavijestio da će ga snaći ako se pokori svome neprijatelju Iblisu teškoća dolaska do onoga što će s njega ukloniti glad i golotinju. To su načini pomoću kojih njegovi potomci dolaze do hrane: oranje, sijanje, trud, zalijevanje i druga teška i bolna sredstva. Da mu je Džibril donosio hranu do koje bi došao samo sijanjem, bez svih ostalih napora, ne bi bilo velike teškoće u muci kojom mu je Gospodar zaprijetio zbog pokornosti šejtanu i nepokornosti Milostivom. Međutim, stvar je bila — a Allah najbolje zna — onakva kakvu smo prenijeli od Ibn Abbasa i drugih. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Ta-Ha, 20:117–119.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"130.3\">Rečeno je da su s Ademom, alejhis-selam, spušteni nakovanj, kliješta, udarač i čekić.\u003c/p>\u003cp data-paragraph=\"130.4\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"130.5\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jahja ibn Vadih, koji je rekao: pričao nam je Husejn, od Albaa ibn Ahmera, od Ikrime, od Ibn Abbasa, koji je rekao: „Tri stvari spuštene su s Ademom, alejhis-selam: nakovanj, kliješta, udarač i čekić.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor kaže „tri stvari“, a navodi četiri naziva: السندان، الكلبتان، الميقعة، المطرقة. Broj i svi nazivi ostavljeni su kako stoje; „udarač“ prenosi الميقعة, naziv alata koji se upotrebljava i u značenju čekića.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"130.1","ar":"حدثنا ابن حميد، قال: حدثنا يعقوب، عن جعفر، عن سعيد، قال: أهبط إلى آدم ثور احمر، فكان يحدث عليه، ويمسح العرق عن جبينه، فهو الذي قال الله عز وجل: «فَل ":[],"ar_html":"ذِكْرُ من قال ذلك:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"130.5","ar":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا الحسين، عَنْ عَلْبَاءَ بْنِ أَحْمَرَ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: ثَلاثَةُ أَشْيَاءٍ نَزَلَتْ مَعَ آدم ع: السِّنْدَانُ، وَالْكَلْبَتَانِ، وَالْمِيقَعَةُ، وَالْمِطْرَقَةُ","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jahja ibn Vadih, koji je rekao: pričao nam je Husejn, od Albaa ibn Ahmera, od Ikrime, od Ibn Abbasa, koji je rekao: „Tri stvari spuštene su s Ademom, alejhis-selam: nakovanj, kliješta, udarač i čekić.“ ⟦Napomena prevodioca: izvor kaže „tri stvari“, a navodi četiri naziva: السندان، الكلبتان، الميقعة، المطرقة. Broj i svi nazivi ostavljeni su kako stoje; „udarač“ prenosi الميقعة, naziv alata koji se upotrebljava i u značenju čekića.⟧","ar_ranges":[[0,167]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا الحسين، عَنْ عَلْبَاءَ بْنِ أَحْمَرَ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>ثَلاثَةُ أَشْيَاءٍ نَزَلَتْ مَعَ آدم ع: السِّنْدَانُ، وَالْكَلْبَتَانِ، وَالْمِيقَعَةُ، وَالْمِطْرَقَةُ","bs_ranges":[[0,171]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jahja ibn Vadih, koji je rekao: pričao nam je Husejn, od Albaa ibn Ahmera, od Ikrime, od Ibn Abbasa, koji je rekao: \u003c/span>„Tri stvari spuštene su s Ademom, alejhis-selam: nakovanj, kliješta, udarač i čekić.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor kaže „tri stvari“, a navodi četiri naziva: السندان، الكلبتان، الميقعة، المطرقة. Broj i svi nazivi ostavljeni su kako stoje; „udarač“ prenosi الميقعة, naziv alata koji se upotrebljava i u značenju čekića.⟧\u003c/span>"}],"notes":[]},{"n":131,"ar":"ثُمَّ إِنَّ اللَّهَ عَزَّ ذِكْرُهُ فِيمَا ذُكِرَ أَنْزَلَ آدَمَ مِنَ الْجَبَلِ الَّذِي أَهْبَطَهُ عَلَيْهِ إِلَى سَفْحِهِ، وَمَلَّكَهُ الأَرْضَ كُلَّهَا، وَجَمِيعَ مَا عَلَيْهَا مِنَ الْجِنِّ وَالْبَهَائِمِ وَالدَّوَابِّ وَالْوَحْشِ وَالطَّيْرِ وغير ذلك، وان آدم ع لَمَّا نَزَلَ مِنْ رَأْسِ ذَلِكَ الْجَبَلِ، وَفَقَدَ كَلامَ أَهْلِ السَّمَاءِ، وَغَابَتْ عَنْهُ أَصْوَاتُ الْمَلائِكَةِ، وَنَظَرَ إِلَى سِعَةِ الأَرْضِ وَبَسْطَتِهَا، وَلَمْ يَرَ فِيهَا أَحَدًا غَيْرَهُ، اسْتَوْحَشَ فَقَالَ: يَا رَبِّ، أَمَا لأَرْضِكَ هَذِهِ عَامِرٌ يُسَبِّحُكَ غَيْرِي! فأجيب بما حَدَّثَنِي المثنى بن إبراهيم، قال: أخبرنا إسحاق بن الحجاج، قال: حدثنا إسماعيل بن عبد الكريم، قال: حدثنى عبد الصمد ابن معقل، أنه سمع وهبا يقول: إن آدم لما أهبط إلى الأرض فرأى سعتها ولم ير فيها أحدا غيره قال: يا رب، أما لأرضك هذه عامر يسبح بحمدك ويقدس لك غيري! قال الله: إني سأجعل فيها من ولدك من يسبح بحمدي ويقدسني، وسأجعل فيها بيوتا ترفع لذكري، ويسبح فيها خلقي، ويذكر فيها اسمي، وسأجعل من تلك البيوت بيتا أخصه بكرامتي، وأوثره باسمي، وأسميه بيتي، أنطقه بعظمتي، وعليه وضعت جلالي ثم أنا مع ذلك في كل شيء ومع كل شيء، أجعل ذلك البيت حرما آمنا يحرم بحرمته من حوله ومن تحته ومن فوقه، فمن حرمه بحرمتي استوجب بذلك كرامتي، ومن أخاف أهله فيه فقد أخفر ذمتي، وأباح حرمتي أجعله أول بيت وضع للناس ببطن مكة مباركا، يأتونه شعثا غبرا على كل ضامر، من كل فج عميق، يرجون بالتلبية رجيجا، ويثجون بالبكاء ثجيجا، ويعجون بالتكبير عجيجا، فمن اعتمده ولا يريد غيره فقد وفد إليَّ وزارني وضافني، وحق على الكريم أن يكرم وفده وأضيافه، وأن يسعف كلا بحاجته تعمره يا آدم ما كنت حيا، ثم تعمره الأمم والقرون والأنبياء من ولدك أمة بعد أمة، وقرنا بعد قرن.\nثم أمر آدم ع- فيما ذكر- أن يأتي البيت الحرام الذي اهبط","ar_html":"ثُمَّ إِنَّ اللَّهَ عَزَّ ذِكْرُهُ فِيمَا ذُكِرَ أَنْزَلَ آدَمَ مِنَ الْجَبَلِ الَّذِي أَهْبَطَهُ عَلَيْهِ إِلَى سَفْحِهِ، وَمَلَّكَهُ الأَرْضَ كُلَّهَا، وَجَمِيعَ مَا عَلَيْهَا مِنَ الْجِنِّ وَالْبَهَائِمِ وَالدَّوَابِّ وَالْوَحْشِ وَالطَّيْرِ وغير ذلك، وان آدم ع لَمَّا نَزَلَ مِنْ رَأْسِ ذَلِكَ الْجَبَلِ، وَفَقَدَ كَلامَ أَهْلِ السَّمَاءِ، وَغَابَتْ عَنْهُ أَصْوَاتُ الْمَلائِكَةِ، وَنَظَرَ إِلَى سِعَةِ الأَرْضِ وَبَسْطَتِهَا، وَلَمْ يَرَ فِيهَا أَحَدًا غَيْرَهُ، اسْتَوْحَشَ فَقَالَ: يَا رَبِّ، أَمَا لأَرْضِكَ هَذِهِ عَامِرٌ يُسَبِّحُكَ غَيْرِي! فأجيب بما \u003cspan class=\"isnad\">حَدَّثَنِي المثنى بن إبراهيم، قال: أخبرنا إسحاق بن الحجاج، قال: حدثنا إسماعيل بن عبد الكريم، قال: حدثنى عبد الصمد ابن معقل، أنه سمع وهبا يقول\u003c/span>: إن آدم لما أهبط إلى الأرض فرأى سعتها ولم ير فيها أحدا غيره قال: يا رب، أما لأرضك هذه عامر يسبح بحمدك ويقدس لك غيري! قال الله: إني سأجعل فيها من ولدك من يسبح بحمدي ويقدسني، وسأجعل فيها بيوتا ترفع لذكري، ويسبح فيها خلقي، ويذكر فيها اسمي، وسأجعل من تلك البيوت بيتا أخصه بكرامتي، وأوثره باسمي، وأسميه بيتي، أنطقه بعظمتي، وعليه وضعت جلالي ثم أنا مع ذلك في كل شيء ومع كل شيء، أجعل ذلك البيت حرما آمنا يحرم بحرمته من حوله ومن تحته ومن فوقه، فمن حرمه بحرمتي استوجب بذلك كرامتي، ومن أخاف أهله فيه فقد أخفر ذمتي، وأباح حرمتي أجعله أول بيت وضع للناس ببطن مكة مباركا، يأتونه شعثا غبرا على كل ضامر، من كل فج عميق، يرجون بالتلبية رجيجا، ويثجون بالبكاء ثجيجا، ويعجون بالتكبير عجيجا، فمن اعتمده ولا يريد غيره فقد وفد إليَّ وزارني وضافني، وحق على الكريم أن يكرم وفده وأضيافه، وأن يسعف كلا بحاجته تعمره يا آدم ما كنت حيا، ثم تعمره الأمم والقرون والأنبياء من ولدك أمة بعد أمة، وقرنا بعد قرن.\n\nثم أمر آدم ع- فيما ذكر- أن يأتي البيت الحرام الذي اهبط","bs":"\u003cp data-paragraph=\"131.1\">Zatim je Allah, Silan je spomen Njegov, prema onome što je navedeno, spustio Adema s planine na koju ga je bio spustio do njenog podnožja i dao mu vlast nad cijelom Zemljom i svim što je na njoj: džinima, stokom, životinjama, zvijerima, pticama i drugim. Kada je Adem, alejhis-selam, sišao s vrha te planine, ostao bez govora stanovnika neba, prestao čuti glasove meleka i pogledao prostranost i širinu Zemlje, a na njoj nije vidio nikoga osim sebe, osjetio je osamljenost i rekao: „Gospodaru moj, zar na ovoj Tvojoj Zemlji nema nikoga osim mene ko Te slavi?“ Odgovoreno mu je onim što \u003cspan class=\"isnad\">mi je pričao Musenna ibn Ibrahim, koji je rekao: obavijestio nas je Ishak ibn el-Hadždžadž, koji je rekao: pričao nam je Ismail ibn Abdulkerim, koji je rekao: pričao mi je Abdussamed ibn Ma‘kil, da je čuo Vehba kako govori:\u003c/span> „Kada je Adem spušten na Zemlju, vidio njenu prostranost i nije vidio nikoga osim sebe, rekao je: ‘Gospodaru moj, zar na ovoj Tvojoj Zemlji nema nikoga osim mene ko Te s hvalom slavi i svetost Ti iskazuje?’ Allah je rekao: ‘Na njoj ću učiniti od tvojih potomaka one koji će Me s hvalom slaviti i svetost Mi iskazivati. Na njoj ću učiniti domove koji će biti podignuti radi Moga spominjanja, u kojima će Me Moja stvorenja slaviti i spominjati Moje ime. Jedan od tih domova posebno ću počastiti, izdvojiti Svojim imenom i nazvati Svojim Hramom. Dat ću mu da govori o Mojoj veličini i na njega položiti Svoje veličanstvo. Uz sve to, Ja sam u svemu i sa svime. Taj ću Hram učiniti sigurnim svetim prostorom, čijom će svetošću biti sveto ono oko njega, ispod njega i iznad njega. Ko ga bude poštovao kao svetoga zbog Moje svetosti, time će zavrijediti Moju počast. Ko u njemu bude zastrašivao njegove stanovnike, prekršit će Moju zaštitu i povrijediti Moju svetost. Učinit ću ga prvim Hramom postavljenim ljudima u unutrašnjosti Meke, blagoslovljenim. Dolazit će mu raščupani i prašnjavi, na svakoj iscrpljenoj devi, iz svakog dalekog klanca; glasno će izgovarati telbiju, obilno plakati i snažno uzvikivati tekbir. Ko se njemu uputi, ne želeći ništa drugo, došao je Meni, posjetio Me i bio Moj gost. Plemenitome priliči da počasti svoje izaslanike i goste i svakome udovolji njegovoj potrebi. Ti ćeš ga, Ademe, posjećivati i održavati dok si živ, a zatim će ga posjećivati i održavati narodi, naraštaji i vjerovjesnici od tvojih potomaka, narod za narodom i naraštaj za naraštajem.’“\u003c/p>\u003cp data-paragraph=\"131.2\">Zatim je Ademu, alejhis-selam, prema onome što je navedeno, naređeno da dođe Svetom Hramu koji mu je spušten\u003c/p>","paragraphs":[{"id":"131.1","ar":"ثُمَّ إِنَّ اللَّهَ عَزَّ ذِكْرُهُ فِيمَا ذُكِرَ أَنْزَلَ آدَمَ مِنَ الْجَبَلِ الَّذِي أَهْبَطَهُ عَلَيْهِ إِلَى سَفْحِهِ، وَمَلَّكَهُ الأَرْضَ كُ
