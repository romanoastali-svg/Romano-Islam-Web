an class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Maida, 5:27–28, navedeni dijelovi; 5:30, navedeni dio; 5:31, navedeni dijelovi; El-Ahzab, 33:72, navedeni početak i završetak. Prijelazi „do“ potječu iz izvora. Završno poistovjećivanje s Kabilom pripada navedenoj predaji.⟧\u003c/span>","bs_isnad_count":0}],"notes":[]},{"n":139,"ar":"وَقَالَ آخَرُونَ: كَانَ السَّبَبُ فِي ذَلِكَ أَنَّ آدَمَ كَانَ يُولَدُ لَهُ مِنْ حَوَّاءَ فِي كُلِّ بَطْنٍ ذَكَرٌ وَأُنْثَى، فَإِذَا بَلَغَ الذَّكَرُ منهما زوج منه ولده الأُنْثَى الَّتِي وُلِدَتْ مَعَ أَخِيهِ الَّذِي وُلِدَ فِي الْبَطْنِ الآخَرِ، قَبْلَهُ أَوْ بَعْدَهُ.\nفَرَغِبَ قَابِيلُ بِتَوْءَمَتِهِ عَنْ هَابِيلَ.\n\nكَمَا حَدَّثَنِي الْقَاسِمُ بن الحسن، قال: حدثنا الحسين، قال:\nحدثني حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: أَخْبَرَنِي عَبْدُ اللَّهِ بْنُ عُثْمَانَ بْنِ خُثَيْمٍ، قَالَ: أَقْبَلْتُ مَعَ سَعِيدِ بْنِ جُبَيْرٍ أَرْمِي الْجَمْرَةَ، وَهُوَ متقنع متوكى عَلَى يَدِي، حَتَّى إِذَا وَازَيْنَا بِمَنْزِلِ سَمُرَةَ الصَّوَّافِ، وَقَفَ يُحَدِّثُنِي عَنِ ابْنِ عَبَّاسٍ، قَالَ: نُهِيَ أَنْ تَنْكِحَ الْمَرْأَةُ أَخَاهَا تَوْءَمَهَا، وَيَنْكِحُهَا غَيْرُهُ مِنْ إِخْوَتِهَا، وَكَانَ يُولَدُ فِي كُلِّ بَطْنٍ رَجُلٌ وَامْرَأَةٌ، فَوُلِدَتِ امْرَأَةٌ وَسِيمَةٌ وَوُلِدَتِ امْرَأَةٌ قَبِيحَةٌ، فَقَالَ أَخُو الدَّمِيمَةِ: أَنْكِحْنِي أُخْتَكَ وَأُنْكِحَكَ أُخْتِي، قَالَ: لا، أَنَا أَحَقُّ بِأُخْتِي، فَقَرَّبَا قُرْبَانًا فَتُقُبِّلَ مِنْ صَاحِبِ الْكَبْشِ، وَلَمْ يُتَقَبَّلْ مِنْ صَاحِبِ الزَّرْعِ، فَقَتَلَهُ، فَلَمْ يَزَلْ ذَلِكَ الْكَبْشُ مَحْبُوسًا عِنْدَ اللَّهِ عَزَّ وَجَلَّ حَتَّى أَخْرَجَهُ فِي فِدَاءِ إِسْحَاقَ، فَذَبَحَهُ عَلَى هَذَا الصَّفَا، فِي ثَبِيرٍ، عِنْدَ مَنْزِلِ سَمُرَةَ الصَّوَّافِ، وَهُوَ عَلَى يَمِينِكَ حِينَ تَرْمِي الْجِمَارَ.\nحدثنا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ بَعْضِ أَهْلِ العلم من أهل الكتاب الأول، أن آدم ع كان يغشى حواء في الجنة قبل أن تصيب الخطيئة، فحملت له بقين بن آدم وتوءمته، فلم تجد عليهما وحما ولا وصبا، ولم تجد عليهما طلقا حين ولدتهما، ولم تر معهما دما لطهر الجنة، فلما أكلا من الشجرة وأصابا المعصية، وهبطا إلى الأرض واطمأنا بها تغشاها، فحملت بهابيل وتوءمته، فوجدت عليهما الوحم والوصب، ووجدت حين ولدتهما الطلق ورأت معهما الدم، وكانت حواء-","ar_html":"وَقَالَ آخَرُونَ: كَانَ السَّبَبُ فِي ذَلِكَ أَنَّ آدَمَ كَانَ يُولَدُ لَهُ مِنْ حَوَّاءَ فِي كُلِّ بَطْنٍ ذَكَرٌ وَأُنْثَى، فَإِذَا بَلَغَ الذَّكَرُ منهما زوج منه ولده الأُنْثَى الَّتِي وُلِدَتْ مَعَ أَخِيهِ الَّذِي وُلِدَ فِي الْبَطْنِ الآخَرِ، قَبْلَهُ أَوْ بَعْدَهُ.\nفَرَغِبَ قَابِيلُ بِتَوْءَمَتِهِ عَنْ هَابِيلَ.\n\nكَمَا \u003cspan class=\"isnad\">حَدَّثَنِي الْقَاسِمُ بن الحسن، قال: حدثنا الحسين، قال:\nحدثني حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: أَخْبَرَنِي عَبْدُ اللَّهِ بْنُ عُثْمَانَ بْنِ خُثَيْمٍ، قَال\u003c/span>َ: أَقْبَلْتُ مَعَ سَعِيدِ بْنِ جُبَيْرٍ أَرْمِي الْجَمْرَةَ، وَهُوَ متقنع متوكى عَلَى يَدِي، حَتَّى إِذَا وَازَيْنَا بِمَنْزِلِ سَمُرَةَ الصَّوَّافِ، وَقَفَ \u003cspan class=\"isnad\">يُحَدِّثُنِي عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ: نُهِيَ أَنْ تَنْكِحَ الْمَرْأَةُ أَخَاهَا تَوْءَمَهَا، وَيَنْكِحُهَا غَيْرُهُ مِنْ إِخْوَتِهَا، وَكَانَ يُولَدُ فِي كُلِّ بَطْنٍ رَجُلٌ وَامْرَأَةٌ، فَوُلِدَتِ امْرَأَةٌ وَسِيمَةٌ وَوُلِدَتِ امْرَأَةٌ قَبِيحَةٌ، فَقَالَ أَخُو الدَّمِيمَةِ: أَنْكِحْنِي أُخْتَكَ وَأُنْكِحَكَ أُخْتِي، قَالَ: لا، أَنَا أَحَقُّ بِأُخْتِي، فَقَرَّبَا قُرْبَانًا فَتُقُبِّلَ مِنْ صَاحِبِ الْكَبْشِ، وَلَمْ يُتَقَبَّلْ مِنْ صَاحِبِ الزَّرْعِ، فَقَتَلَهُ، فَلَمْ يَزَلْ ذَلِكَ الْكَبْشُ مَحْبُوسًا عِنْدَ اللَّهِ عَزَّ وَجَلَّ حَتَّى أَخْرَجَهُ فِي فِدَاءِ إِسْحَاقَ، فَذَبَحَهُ عَلَى هَذَا الصَّفَا، فِي ثَبِيرٍ، عِنْدَ مَنْزِلِ سَمُرَةَ الصَّوَّافِ، وَهُوَ عَلَى يَمِينِكَ حِينَ تَرْمِي الْجِمَارَ.\n\n\u003cspan class=\"isnad\">حدثنا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ بَعْضِ أَهْلِ العلم من أهل الكتاب الأول\u003c/span>، أن آدم ع كان يغشى حواء في الجنة قبل أن تصيب الخطيئة، فحملت له بقين بن آدم وتوءمته، فلم تجد عليهما وحما ولا وصبا، ولم تجد عليهما طلقا حين ولدتهما، ولم تر معهما دما لطهر الجنة، فلما أكلا من الشجرة وأصابا المعصية، وهبطا إلى الأرض واطمأنا بها تغشاها، فحملت بهابيل وتوءمته، فوجدت عليهما الوحم والوصب، ووجدت حين ولدتهما الطلق ورأت معهما الدم، وكانت حواء-","bs":"\u003cp data-paragraph=\"139.1\">Drugi su rekli da je razlog bio sljedeći: Ademu bi Havva pri svakom porodu rodila dječaka i djevojčicu. Kada bi dječak odrastao, ženio bi ga svojom kćerkom rođenom s njegovim bratom u drugom porodu, prije ili poslije njega. Kabil nije htio dati svoju sestru blizanku Habilu.\u003c/p>\u003cp data-paragraph=\"139.2\">Kako \u003cspan class=\"isnad\">mi je pričao Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, koji je rekao: obavijestio me Abdullah ibn Osman ibn Husejm, koji je rekao:\u003c/span> „Pošao sam sa Seidom ibn Džubejrom da bacam kamenčiće na Džemru. Bio je pokrivene glave i oslanjao se na moju ruku. Kada smo se našli naspram kuće Semure es-Savvafa, zastao je i \u003cspan class=\"isnad\">kazivao mi od Ibn Abbasa, koji je rekao:\u003c/span> ‘Ženi je bilo zabranjeno da se uda za svoga brata blizanca, ali njome se mogao oženiti drugi njen brat. U svakom porodu rađali su se muškarac i žena. Rođena je jedna lijepa žena i jedna ružna. Brat ružne rekao je: Udaj svoju sestru za mene, a ja ću svoju udati za tebe. Odgovorio je: Ne, ja imam više prava na svoju sestru. Prinijeli su žrtve, pa je primljena od onoga koji je prinio ovna, a nije primljena od onoga koji je prinio usjev. Zato ga je ubio. Taj je ovan ostao zadržan kod Allaha, Silnog i Uzvišenog, sve dok ga nije izveo kao otkup za Ishaka. Zaklao ga je na ovoj stijeni u Sebiru, kod kuće Semure es-Savvafa, s tvoje desne strane kada bacaš kamenčiće.’“\u003c/p>\u003cp data-paragraph=\"139.3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Muhammed ibn Ishak, od nekih učenih među sljedbenicima Prve knjige,\u003c/span> da je Adem, alejhis-selam, imao odnos s Havvom u Džennetu prije nego što je počinila grijeh. Zanijela mu je Kajna, Ademovog sina, i njegovu sestru blizanku. S njima nije osjećala ni trudničku mučninu ni tegobu, pri njihovom rođenju nije osjećala trudove i s njima nije vidjela krvi zbog čistoće Dženneta. Kada su jeli s drveta, počinili grijeh, spušteni na Zemlju i nastanili se na njoj, imao je odnos s njom. Zanijela je Habila i njegovu sestru blizanku. S njima je osjećala trudničku mučninu i tegobu, pri njihovom rođenju osjećala trudove i vidjela krv. Havva je —\u003c/p>","paragraphs":[{"id":"139.1","ar":"وَقَالَ آخَرُونَ: كَانَ السَّبَبُ فِي ذَلِكَ أَنَّ آدَمَ كَانَ يُولَدُ لَهُ مِنْ حَوَّاءَ فِي كُلِّ بَطْنٍ ذَكَرٌ وَأُنْثَى، فَإِذَا بَلَغَ الذَّكَرُ منهما زوج منه ولده الأُنْثَى الَّتِي وُلِدَتْ مَعَ أَخِيهِ الَّذِي وُلِدَ فِي الْبَطْنِ الآخَرِ، قَبْلَهُ أَوْ بَعْدَهُ.\nفَرَغِبَ قَابِيلُ بِتَوْءَمَتِهِ عَنْ هَابِيلَ.","ar_html":"وَقَالَ آخَرُونَ: كَانَ السَّبَبُ فِي ذَلِكَ أَنَّ آدَمَ كَانَ يُولَدُ لَهُ مِنْ حَوَّاءَ فِي كُلِّ بَطْنٍ ذَكَرٌ وَأُنْثَى، فَإِذَا بَلَغَ الذَّكَرُ منهما زوج منه ولده الأُنْثَى الَّتِي وُلِدَتْ مَعَ أَخِيهِ الَّذِي وُلِدَ فِي الْبَطْنِ الآخَرِ، قَبْلَهُ أَوْ بَعْدَهُ.\nفَرَغِبَ قَابِيلُ بِتَوْءَمَتِهِ عَنْ هَابِيلَ.","ar_isnad_ranges":[],"bs":"Drugi su rekli da je razlog bio sljedeći: Ademu bi Havva pri svakom porodu rodila dječaka i djevojčicu. Kada bi dječak odrastao, ženio bi ga svojom kćerkom rođenom s njegovim bratom u drugom porodu, prije ili poslije njega. Kabil nije htio dati svoju sestru blizanku Habilu.","bs_html":"Drugi su rekli da je razlog bio sljedeći: Ademu bi Havva pri svakom porodu rodila dječaka i djevojčicu. Kada bi dječak odrastao, ženio bi ga svojom kćerkom rođenom s njegovim bratom u drugom porodu, prije ili poslije njega. Kabil nije htio dati svoju sestru blizanku Habilu.","bs_isnad_count":0},{"id":"139.2","ar":"كَمَا حَدَّثَنِي الْقَاسِمُ بن الحسن، قال: حدثنا الحسين، قال:\nحدثني حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: أَخْبَرَنِي عَبْدُ اللَّهِ بْنُ عُثْمَانَ بْنِ خُثَيْمٍ، قَالَ: أَقْبَلْتُ ذا قبله الله عز وجل، فلما قبل الله قربان هابيل- وكان في ذلك القضاء له بأخت قين- غضب قين، وغلب عليه الكبر واستحوذ عليه الشيطان، فاتبع أخاه هابيل، وهو في ماشيته فقتله، فهما اللذان قص الله خبرهما في القرآن على محمد ص، فقال:\n\n«وَاتْلُ عَلَيْهِمْ» يعني أهل الكتاب «نَبَأَ ابْنَيْ آدَمَ بِالْحَقِّ إِذْ قَرَّبا قُرْباناً","ar_html":"فيما يذكرون- لا تحمل إلا توءما ذكرا وأنثى، فولدت حواء لآدم أربعين ولدا لصلبه من ذكر وأنثى في عشرين بطنا، وكان الرجل منهم أي أخواته شاء تزوج إلا توءمته التي تولد معه، فإنها لا تحل له، وذلك أنه لم يكن نساء يومئذ إلا أخواتهم وأمهم حواء.\n\n\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن محمد بن إسحاق، عن بعض أهل العلم بالكتاب الأول\u003c/span> أن آدم أمر ابنه قينا أن ينكح توءمته هابيل، وأمر هابيل أن ينكح أخته توءمته قينا، فسلم لذلك هابيل ورضي، وأبى ذلك قين وكره تكرما عن أخت هابيل، ورغب بأخته عن هابيل، وقال، نحن ولادة الجنة، وهما من ولادة الأرض، وأنا أحق بأختي- ويقول بعض أهل العلم من أهل الكتاب الأول: بل كانت أخت قين من أحسن الناس، فضن بها عن أخيه، وأرادها لنفسه- والله أعلم أي ذلك كان- فقال له أبوه: يا بني إنها لا تحل لك، فأبى قين أن يقبل ذلك من قول أبيه، فقال له أبوه: يا بني، فقرب قربانا، ويقرب أخوك هابيل قربانا، فأيكما قبل الله قربانه فهو أحق بها، وكان قين على بذر الأرض، وكان هابيل على رعاية الماشية، فقرب قين قمحا، وقرب هابيل أبكارا من أبكار غنمه- وبعضهم يقول:\nقرب بقره- فأرسل الله جل وعز نارا بيضاء، فأكلت قربان هابيل وتركت قربان قين وبذلك كان يقبل القربان إذا قبله الله عز وجل، فلما قبل الله قربان هابيل- وكان في ذلك القضاء له بأخت قين- غضب قين، وغلب عليه الكبر واستحوذ عليه الشيطان، فاتبع أخاه هابيل، وهو في ماشيته فقتله، فهما اللذان قص الله خبرهما في القرآن على محمد ص، فقال:\n\n«وَاتْلُ عَلَيْهِمْ» يعني أهل الكتاب «نَبَأَ ابْنَيْ آدَمَ بِالْحَقِّ إِذْ قَرَّبا قُرْباناً","bs":"\u003cp data-paragraph=\"140.1\">prema onome što navode — nosila samo blizance, muškarca i ženu. Havva je Ademu u dvadeset poroda rodila četrdeset njegove rođene djece, muške i ženske. Muškarac među njima mogao se oženiti kojom god je sestrom htio, osim svojom sestrom blizankom koja je s njim rođena; ona mu nije bila dopuštena. Tada nije bilo drugih žena osim njihovih sestara i njihove majke Havve.\u003c/p>\u003cp data-paragraph=\"140.2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, od nekih poznavalaca Prve knjige,\u003c/span> da je Adem naredio svome sinu Kajnu da svoju sestru blizanku uda za Habila, a Habilu da svoju sestru blizanku uda za Kajna. Habil se tome pokorio i prihvatio, dok je Kajn to odbio i nije htio, smatrajući sebe odviše uglednim za Habilovu sestru i svoju sestru previše vrijednom za Habila. Rekao je: „Mi smo rođeni u Džennetu, a njih dvoje rođeni su na Zemlji. Ja imam više prava na svoju sestru.“ Neki od učenih sljedbenika Prve knjige govore: „Naprotiv, Kajnova sestra bila je među najljepšim ljudima, pa ju je ljubomorno čuvao od brata i želio je za sebe.“ A Allah najbolje zna šta je od toga bilo. Otac mu je rekao: „Sine moj, ona ti nije dopuštena.“ Kajn je odbio prihvatiti te očeve riječi. Otac mu je rekao: „Sine moj, prinesi žrtvu, a neka i tvoj brat Habil prinese žrtvu. Od kojega Allah primi žrtvu, taj ima više prava na nju.“ Kajn se bavio sijanjem zemlje, a Habil čuvanjem stoke. Kajn je prinio pšenicu, a Habil prvorođenu mladunčad svojih ovaca. Neki kažu da je prinio kravu. Allah, Slavljen i Silan, poslao je bijelu vatru. Pojela je Habilovu žrtvu, a ostavila Kajnovu. Tako je žrtva bila primana kada bi je Allah, Silan i Uzvišen, prihvatio. Kada je Allah prihvatio Habilovu žrtvu — a time je presuđeno da mu pripadne Kajnova sestra — Kajn se rasrdio, obuzela ga je oholost i šejtan je ovladao njime. Slijedio je svoga brata Habila dok je bio uz stoku i ubio ga. To su njih dvojica čiju je vijest Allah u Kur’anu ispričao Muhammedu, sallallahu alejhi ve sellem, rekavši: „I kazuj im“ — misli se sljedbenicima Knjige — „istinito vijest o dvojici Ademovih sinova: kada su prinijeli žrtvu, \u003cspan class=\"translator-note\">⟦Prijevo رِفُونَ» قال: ويزعم أهل التوراة أن قينا حين قتل أخاه هابيل، قال الله له: أين أخوك هابيل؟ قال: ما أدري، ما كنت عليه رقيبا، فقال الله له: إن صوت دم أخيك ليناديني من الأرض! الآن أنت ملعون من الأرض التي فتحت فاها، فتلقت دم أخيك من يدك، فإذا أنت عملت في الأرض، فإنها لا تعود تعطيك حرثها حتى تكون فزعا تائها في الأرض، فقال قين: عظمت خطيئتي من أن تغفرها، قد اخرجتنى اليوم عن وجه الارض واتوارى من قدامك، وأكون فزعا تائها في الأرض، وكل من لقيني، قتلني فقال الله عز وجل: ليس ذلك كذلك، فلا يكون كل من قتل قتيلا يجزى بواحد سبعة، ولكن من قتل قينا يجزي سبعة، وجعل الله في قين آية لئلا يقتله كل من وجده، وخرج قين من قدام الله عز وجل من شرقي عدن الجنة.\nوقال آخرون في ذلك: إنما كان قتل القاتل منهما أخاه أن الله عز وجل أمرهما بتقريب قربان، فتقبل قربان أحدهما، ولم يتقبل من الآخر، فبغاه الذي لم يتقبل قربانه فقتله.\n\nذكر من قال ذلك:\n\nحَدَّثَنَا ابْنُ بَشَّارٍ، قال: حَدَّثَنَا مُحَمَّدُ بْنُ جعفر، قال: حدثنا","ar_html":"فَتُقُبِّلَ مِنْ أَحَدِهِما» إلى آخر القصة، قال: فلما قتله سقط في يديه، ولم يدر كيف يواريه، وذلك أنه كان- فيما يزعمون- أول قتيل من بني آدم:\n«فَبَعَثَ اللَّهُ غُراباً يَبْحَثُ فِي الْأَرْضِ لِيُرِيَهُ كَيْفَ يُوارِي سَوْأَةَ أَخِيهِ قالَ يا وَيْلَتى أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هذَا الْغُرابِ فَأُوارِيَ سَوْأَةَ أَخِي» .\nإلى قوله: «ثُمَّ إِنَّ كَثِيراً مِنْهُمْ بَعْدَ ذلِكَ فِي الْأَرْضِ لَمُسْرِفُونَ» قال: ويزعم أهل التوراة أن قينا حين قتل أخاه هابيل، قال الله له: أين أخوك هابيل؟ قال: ما أدري، ما كنت عليه رقيبا، فقال الله له: إن صوت دم أخيك ليناديني من الأرض! الآن أنت ملعون من الأرض التي فتحت فاها، فتلقت دم أخيك من يدك، فإذا أنت عملت في الأرض، فإنها لا تعود تعطيك حرثها حتى تكون فزعا تائها في الأرض، فقال قين: عظمت خطيئتي من أن تغفرها، قد اخرجتنى اليوم عن وجه الارض واتوارى من قدامك، وأكون فزعا تائها في الأرض، وكل من لقيني، قتلني فقال الله عز وجل: ليس ذلك كذلك، فلا يكون كل من قتل قتيلا يجزى بواحد سبعة، ولكن من قتل قينا يجزي سبعة، وجعل الله في قين آية لئلا يقتله كل من وجده، وخرج قين من قدام الله عز وجل من شرقي عدن الجنة.\n\nوقال آخرون في ذلك: إنما كان قتل القاتل منهما أخاه أن الله عز وجل أمرهما بتقريب قربان، فتقبل قربان أحدهما، ولم يتقبل من الآخر، فبغاه الذي لم يتقبل قربانه فقتله.\n\nذكر من قال ذلك:\n\n\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، قال: حَدَّثَنَا مُحَمَّدُ بْنُ جعفر، قال: حدثنا\u003c/span>","bs":"\u003cp data-paragraph=\"141.1\">pa je od jednoga primljena“ — do kraja pripovijesti. Rekao je: „Kada ga je ubio, obuzelo ga je kajanje i nije znao kako da ga zakopa. Prema onome što tvrde, on je bio prvi ubijeni među Ademovim potomcima. ‘Pa je Allah poslao gavrana da kopa po zemlji kako bi mu pokazao kako da zakopa tijelo svoga brata. Rekao je: Teško meni! Zar sam nemoćan biti poput ovoga gavrana i zakopati tijelo svoga brata?’ — do Njegovih riječi: ‘Zatim su mnogi od njih i nakon toga na Zemlji, doista, pretjerivali.’“ Rekao je: „Sljedbenici Tevrata tvrde da je, kada je Kajn ubio svoga brata Habila, Allah njemu rekao: ‘Gdje je tvoj brat Habil?’ Odgovorio je: ‘Ne znam; nisam bio njegov čuvar.’ Allah mu je rekao: ‘Glas krvi tvoga brata doziva Me iz zemlje! Sada si proklet od zemlje koja je otvorila svoja usta i primila krv tvoga brata iz tvoje ruke. Kada budeš radio na zemlji, ona ti više neće davati svoj urod; bit ćeš prestrašen i lutati Zemljom.’ Kajn je rekao: ‘Moj je grijeh prevelik da bi mi ga oprostio. Danas si me protjerao s lica zemlje i sakrit ću se ispred Tebe; bit ću prestrašen i lutati Zemljom, a svako ko me sretne ubit će me.’ Allah, Silan i Uzvišen, rekao je: ‘Nije tako. Neće svako ko nekoga ubije za jednoga biti kažnjen sedmerostruko; nego će onaj ko ubije Kajna biti kažnjen sedmerostruko.’ Allah je na Kajnu postavio znak kako ga ne bi ubio svako ko ga nađe. Kajn je otišao ispred Allaha, Silnog i Uzvišenog, istočno od Edena, Dženneta.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Maida, 5:27, nastavak; 5:31, navedeni dio; 5:32, završni dio. Izrazi „do kraja pripovijesti“ i „do Njegovih riječi“ nalaze se u izvoru. Kazivanje koje slijedi o Kajnovom razgovoru pripisano je sljedbenicima Tevrata.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"141.2\">Drugi su o tome rekli: „Razlog zbog kojeg je jedan od njih ubio svoga brata bio je samo to što im je Allah, Silan i Uzvišen, naredio da prinesu žrtve. Žrtva jednoga primljena je, a drugoga nije, pa je onaj čija žrtva nije primljena nepravedno nasrnuo na njega i ubio ga.“\u003c/p>\u003cp data-paragraph=\"141.3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"141.4\">\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar, koji je rekao: pričao nam je Muhammed ibn Džafer, koji je rekao: pričao nam je\u003c/span>\u003c/p>","paragraphs":[{"id":"141.1","ar":"فَتُقُبِّلَ مِنْ أَحَدِهِما» إلى آخر القصة، قال: فلما قتله سقط في يديه، ولم يدر كيف يواريه، وذلك أنه كان- فيما يزعمون- أول قتيل من بني آدم:\n«فَبَعَثَ اللَّهُ غُراباً يَبْحَثُ فِي الْأَرْضِ لِيُرِيَهُ كَيْفَ يُوارِي سَوْأَةَ أَخِيهِ قالَ يا وَيْلَتى أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هذَا الْغُرابِ فَأُوارِيَ سَوْأَةَ أَخِي» .\nإلى قوله: «ثُمَّ إِنَّ كَثِيراً مِنْهُمْ بَعْدَ ذلِكَ فِي الْأَرْضِ لَمُسْرِفُونَ» قال: ويزعم أهل التوراة أن قينا حين قتل أخاه هابيل، قال الله له: أين أخوك هابيل؟ قال: ما أدري، ما كنت عليه رقيبا، فقال الله له: إن صوت دم أخيك ليناديني من الأرض! الآن أنت ملعون من الأرض التي فتحت فاها، فتلقت دم أخيك من يدك، فإذا أنت عملت في الأرض، فإنها لا تعود تعطيك حرثها حتى تكون فزعا تائها في الأرض، فقال قين: عظمت خطيئتي من أن تغفرها، قد اخرجتنى اليوم عن وجه الارض واتوارى من قدامك، وأكون فزعا تائها في الأرض، وكل من لقيني، قتلني فقال الله عز وجل: ليس ذلك كذلك، فلا يكون كل من قتل قتيلا يجزى بواحد سبعة، ولكن من قتل قينا يجزي سبعة، وجعل الله في قين آية لئلا يقتله كل من وجده، وخرج قين من قدام الله عز وجل من شرقي عدن الجنة.","ar_html":"فَتُقُبِّلَ مِنْ أَحَدِهِما» إلى آخر القصة، قال: فلما قتله سقط في يديه، ولم يدر كيف يواريه، وذلك أنه كان- فيما يزعمون- أول قتيل من بني آدم:\n«فَبَعَثَ اللَّهُ غُراباً يَبْحَثُ فِي الْأَرْضِ لِيُرِيَهُ كَيْفَ يُوارِي سَوْأَةَ أَخِيهِ قالَ يا وَيْلَتى أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هذَا الْغُرابِ فَأُوارِيَ سَوْأَة نَّ ابْنَيْ آدَمَ اللَّذَيْنِ قَرَّبَا قُرْبَانًا فَتُقُبِّلَ مِنْ أَحَدِهِمَا وَلَمْ يُتَقَبَّل مِنَ الآخَرِ كَانَ أَحَدُهُمَا صَاحِبَ حَرْثٍ، وَالآخَرُ صَاحِبَ غَنَمٍ، وَأَنَّهُمَا أُمِرَا أَنْ يُقَرِّبَا قُرْبَانًا، وَأَنَّ صَاحِبَ الْغَنَمِ قَرَّبَ أَكْرَمَ غَنَمِهِ وَأَسْمَنَهَا وَأَحْسَنَهَا، طَيِّبَةً بِهَا نَفْسُهُ، وَأَنَّ صَاحِبَ الْحَرْثِ قرب، شر حرثه: الكوزر وَالزِّوَانَ، غَيْرَ طَيِّبَةٍ بِهَا نَفْسُهُ، وَأَنَّ اللَّهَ عَزَّ وَجَلَّ تَقَبَّلَ قُرْبَانَ صَاحِبِ الْغَنَمِ، وَلَمْ يَتَقَبَّلْ قُرْبَانَ صَاحِبِ الْحَرْثِ، وَكَانَ مِنْ قِصَّتِهِمَا مَا قَصَّ اللَّهُ فِي كِتَابِهِ وَقَالَ: أَيْمِ اللَّهِ، إِنْ كَانَ الْمَقْتُولُ لأَشَدَّ الرَّجُلَيْنِ، وَلَكِنْ مَنَعَهُ التَّحَرُّجُ أَنْ يَنْبَسِطَ إِلَى أَخِيهِ.\nوَقَالَ آخَرُونَ بِمَا حَدَّثَنِي بِهِ مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ: حَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\nكَانَ مِنْ شَأْنِهِمَا أَنَّهُ لَمْ يَكُنْ مِسْكِينٌ يُتَصَدَّقُ عَلَيْهِ، وَإِنَّمَا كَانَ الْقُرْبَانُ يُقَرِّبُهُ الرَّجُلُ، فَبَيْنَا ابْنَا آدَمَ قَاعِدَانِ إِذْ قَالا: لَوْ قَرَّبْنَا قُرْبَانًا! وَكَانَ الرَّجُلُ إِذَا قَرَّبَ قُرْبَانًا فَرَضِيَهُ اللَّهُ عَزَّ وَجَلَّ أَرْسَلَ إِلَيْهِ نَارًا فَأَكَلَتْهُ، وَإِنْ لَمْ يَكُنْ رَضِيَهُ اللَّهُ خَبَتِ النَّارُ، فَقَرَّبَا قُرْبَانًا، وَكَانَ أَحَدُهُمَا رَاعِيًا وَالآخَرُ حَرَّاثًا، وَإِنَّ صَاحِبَ الْغَنَمِ قَرَّبَ خَيْرَ غَنَمِهِ وَأَسْمَنَهَا، وَقَرْبَ الآخَرُ بَعْضَ زَرْعِهِ، فَجَاءَتِ النار فنزلت بينهما فَأَكَلَتِ الشَّاةَ وَتَرَكَتِ الزَّرْعَ، وَإِنَّ ابْنَ آدَمَ قَالَ لأَخِيهِ: أَتَمْشِي فِي النَّاسِ، وَقَدْ عَلِمُوا أَنَّكَ قَرَّبْتَ قُرْبَانًا فَتُقُبِّلَ مِنْكَ وَرُدَّ عَلَيَّ قُرْبَانِي! فَلا وَاللَّهِ لا يَنْظُرُ النَّاسُ إِلَيَّ وَإِلَيْكَ وَأَنْتَ خَيْرٌ مِنِّي، فَقَالَ: لأَقْتُلَنَّكَ، فَقَالَ لَهُ أَخُوهُ:\nمَا ذَنْبِي! إِنَّما يَتَقَبَّلُ اللَّهُ مِنَ الْمُتَّقِينَ.\n\nوَقَالَ آخَرُونَ: لَمْ تَكُنْ قِصَّةُ هَذَيْنِ الرَّجُلَيْنِ فِي عَهْدِ آدَمَ، وَلا كَانَ القربان","ar_html":"\u003cspan class=\"isnad\">عَوْفٌ، عَنْ أَبِي الْمُغِيرَةِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، قَال\u003c/span>َ: إِنَّ ابْنَيْ آدَمَ اللَّذَيْنِ قَرَّبَا قُرْبَانًا فَتُقُبِّلَ مِنْ أَحَدِهِمَا وَلَمْ يُتَقَبَّل مِنَ الآخَرِ كَانَ أَحَدُهُمَا صَاحِبَ حَرْثٍ، وَالآخَرُ صَاحِبَ غَنَمٍ، وَأَنَّهُمَا أُمِرَا أَنْ يُقَرِّبَا قُرْبَانًا، وَأَنَّ صَاحِبَ الْغَنَمِ قَرَّبَ أَكْرَمَ غَنَمِهِ وَأَسْمَنَهَا وَأَحْسَنَهَا، طَيِّبَةً بِهَا نَفْسُهُ، وَأَنَّ صَاحِبَ الْحَرْثِ قرب، شر حرثه: الكوزر وَالزِّوَانَ، غَيْرَ طَيِّبَةٍ بِهَا نَفْسُهُ، وَأَنَّ اللَّهَ عَزَّ وَجَلَّ تَقَبَّلَ قُرْبَانَ صَاحِبِ الْغَنَمِ، وَلَمْ يَتَقَبَّلْ قُرْبَانَ صَاحِبِ الْحَرْثِ، وَكَانَ مِنْ قِصَّتِهِمَا مَا قَصَّ اللَّهُ فِي كِتَابِهِ وَقَالَ: أَيْمِ اللَّهِ، إِنْ كَانَ الْمَقْتُولُ لأَشَدَّ الرَّجُلَيْنِ، وَلَكِنْ مَنَعَهُ التَّحَرُّجُ أَنْ يَنْبَسِطَ إِلَى أَخِيهِ.\n\nوَقَالَ آخَرُونَ بِمَا \u003cspan class=\"isnad\">حَدَّثَنِي بِهِ مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ: حَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ:\nكَانَ مِنْ شَأْنِهِمَا أَنَّهُ لَمْ يَكُنْ مِسْكِينٌ يُتَصَدَّقُ عَلَيْهِ، وَإِنَّمَا كَانَ الْقُرْبَانُ يُقَرِّبُهُ الرَّجُلُ، فَبَيْنَا ابْنَا آدَمَ قَاعِدَانِ إِذْ قَالا: لَوْ قَرَّبْنَا قُرْبَانًا! وَكَانَ الرَّجُلُ إِذَا قَرَّبَ قُرْبَانًا فَرَضِيَهُ اللَّهُ عَزَّ وَجَلَّ أَرْسَلَ إِلَيْهِ نَارًا فَأَكَلَتْهُ، وَإِنْ لَمْ يَكُنْ رَضِيَهُ اللَّهُ خَبَتِ النَّارُ، فَقَرَّبَا قُرْبَانًا، وَكَانَ أَحَدُهُمَا رَاعِيًا وَالآخَرُ حَرَّاثًا، وَإِنَّ صَاحِبَ الْغَنَمِ قَرَّبَ خَيْرَ غَنَمِهِ وَأَسْمَنَهَا، وَقَرْبَ الآخَرُ بَعْضَ زَرْعِهِ، فَجَاءَتِ النار فنزلت بينهما فَأَكَلَتِ الشَّاةَ وَتَرَكَتِ الزَّرْعَ، وَإِنَّ ابْنَ آدَمَ قَالَ لأَخِيهِ: أَتَمْشِي فِي النَّاسِ، وَقَدْ عَلِمُوا أَنَّكَ قَرَّبْتَ قُرْبَانًا فَتُقُبِّلَ مِنْكَ وَرُدَّ عَلَيَّ قُرْبَانِي! فَلا وَاللَّهِ لا يَنْظُرُ النَّاسُ إِلَيَّ وَإِلَيْكَ وَأَنْتَ خَيْرٌ مِنِّي، فَقَالَ: لأَقْتُلَنَّكَ، فَقَالَ لَهُ أَخُوهُ:\nمَا ذَنْبِي! إِنَّما يَتَقَبَّلُ اللَّهُ مِنَ الْمُتَّقِينَ.\n\nوَقَالَ آخَرُونَ: لَمْ تَكُنْ قِصَّةُ هَذَيْنِ الرَّجُلَيْنِ فِي عَهْدِ آدَمَ، وَلا كَانَ القربان","bs":"\u003cp data-paragraph=\"142.1\">\u003cspan class=\"isnad\">Avf, od Ebu Mugire, od Abdullaha ibn Amra, koji je rekao:\u003c/span> „Dvojica Ademovih sinova koji su prinijeli žrtve, pa je od jednoga primljena, a od drugoga nije, bili su jedan obrađivač zemlje, a drugi vlasnik ovaca. Naređeno im je da prinesu žrtve. Vlasnik ovaca prinio je svoju najvredniju, najdeblju i najljepšu ovcu, drage volje. Obrađivač zemlje prinio je najgori dio svoga usjeva: kevzer i zivan, ne čineći to drage volje. Allah, Silan i Uzvišen, primio je žrtvu vlasnika ovaca, a nije primio žrtvu obrađivača zemlje. O njima se dogodilo ono što je Allah ispričao u Svojoj Knjizi.“ Rekao je: „Tako mi Allaha, ubijeni je bio snažniji od njih dvojice, ali ga je strah od grijeha spriječio da digne ruku na svoga brata.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: الكوزر والزوان preneseno je približno kao „kevzer i zivan“; tačna identifikacija tih naziva u ovom navodu nije potvrđena.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"142.2\">Drugi su rekli ono što \u003cspan class=\"isnad\">mi je pričao Muhammed ibn Sa‘d, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je moj amidža, koji je rekao: pričao mi je moj otac, od svoga oca, od Ibn Abbasa, koji je rekao:\u003c/span> „Njihov slučaj bio je ovakav: nije bilo siromaha kome bi se dala sadaka, nego je čovjek prinosio žrtvu. Dok su dvojica Ademovih sinova sjedila, rekli su: ‘Kada bismo prinijeli žrtvu!’ Kada bi čovjek prinio žrtvu i Allah, Silan i Uzvišen, bio zadovoljan njome, poslao bi joj vatru koja bi je pojela; ako Allah nije bio njome zadovoljan, vatra bi se ugasila. Prinijeli su žrtve. Jedan je bio pastir, a drugi zemljoradnik. Vlasnik ovaca prinio je svoju najbolju i najdeblju ovcu, a drugi nešto od svoga usjeva. Vatra je došla, spustila se između njih, pojela ovcu i ostavila usjev. Ademov sin rekao je svome bratu: ‘Zar ćeš hodati među ljudima dok oni znaju da si prinio žrtvu i da je od tebe primljena, a moja je odbijena? Ne, tako mi Allaha, ljudi neće gledati mene i tebe, a da si ti bolji od mene!’ Rekao je: ‘Ubit ću te!’ Brat mu je rekao: ‘Šta sam ja skrivio? Allah prima samo od bogobojaznih.’“ \u003cspan class=\"translator-note\">⟦Završna rečenica „Allah prima samo od bogobojaznih“ odgovara riječima iz El-Maida, 5:27.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"142.3\">Drugi su rekli: „Događaj ove dvojice nije bio u Ademovo doba niti je žrtva prinesena\u003c/p>","paragraphs":[{"id":"142.1","ar":"عَوْفٌ، عَنْ أَبِي الْمُغِيرَةِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، قَالَ: إِنَّ ابْنَيْ آدَمَ اللَّذَيْنِ قَرَّبَا قُرْبَانًا فَتُقُبِّلَ مِنْ أَحَدِهِمَا وَلَمْ يُتَقَبَّل مِنَ الآخَرِ كَانَ أَحَدُهُمَا صَاحِبَ حَرْثٍ، وَالآخَرُ صَاحِبَ غَنَمٍ، وَأَنَّهُمَا أُمِرَا أَنْ يُقَرِّبَا قُرْبَانًا، وَأَنَّ صَاحِبَ الْغَنَمِ قَرَّبَ أَكْرَمَ غَنَمِهِ وَأَسْمَنَهَا وَأَحْسَنَهَا، طَيِّبَةً بِهَا نَفْسُهُ، وَأَنَّ صَاحِبَ الْحَرْثِ قرب، شر حرثه: الكوزر وَالزِّوَانَ، غَيْرَ طَيِّبَةٍ بِهَا نَفْسُهُ، وَأَنَّ اللَّهَ عَزَّ وَجَلَّ تَقَبَّلَ قُرْبَانَ صَاحِبِ الْغَنَمِ، وَلَمْ يَتَقَبَّلْ قُرْبَانَ صَاحِبِ الْحَرْثِ، وَكَانَ مِنْ قِصَّتِهِمَا مَا قَصَّ اللَّهُ فِي كِتَابِهِ وَقَالَ: أَيْمِ اللَّهِ، إِنْ كَانَ الْمَقْتُولُ لأَشَدَّ الرَّجُلَيْنِ، وَلَكِنْ مَنَعَهُ التَّحَرُّجُ أَنْ يَنْبَسِطَ إِلَى أَخِيهِ.","ar_html":"\u003cspan class=\"isnad\">عَوْفٌ، عَنْ أَبِي الْمُغِيرَةِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، قَال\u003c/span>َ: إِنَّ ابْنَيْ آدَمَ اللَّذَيْنِ قَرَّبَا قُرْبَانًا فَتُقُبِّلَ مِنْ أَحَدِهِمَا وَلَمْ يُتَقَبَّل مِنَ الآخَرِ كَانَ أَحَدُهُمَا صَاحِبَ حَرْثٍ، وَالآخَرُ صَاحِبَ غَنَمٍ، وَأَنَّهُمَا أُمِرَا أَنْ يُقَرِّبَا قُرْبَانًا، وَأَنَّ صَاحِبَ الْغَنَمِ قَرَّبَ أَكْرَمَ غَنَمِهِ وَأَسْمَنَهَا وَأَحْسَنَهَا، طَيِّبَةً بِهَا نَفْسُهُ، وَأَنَّ صَاحِبَ الْحَرْثِ قرب، شر حرثه: الكوزر وَالزِّوَانَ، غَيْرَ طَيِّبَةٍ بِهَا نَفْسُهُ، وَأَنَّ اللَّهَ عَزَّ وَجَلَّ تَقَبَّلَ قُرْبَانَ صَاحِبِ الْغَنَمِ، وَلَمْ يَتَقَبَّلْ قُرْبَانَ صَاحِبِ الْحَرْثِ، وَكَانَ مِنْ قِصَّتِهِمَا مَا قَصَّ اللَّهُ فِي كِتَابِهِ وَقَالَ: أَيْمِ اللَّهِ، إِنْ كَانَ الْمَقْتُولُ لأَشَدَّ الرَّجُلَيْنِ، وَلَكِنْ مَنَعَهُ التَّحَرُّجُ أَنْ يَنْبَسِطَ إِلَى أَخِيهِ.","ar_isnad_ranges":[[0,71]],"bs":"Avf, od Ebu Mugire, od Abdullaha ibn Amra, koji je rekao: „Dvojica Ademovih sinova koji su prinijeli žrtve, pa je od jednoga primljena, a od drugoga nije, bili su jedan obrađivač zemlje, a drugi vlasnik ovaca. Naređeno im je da prinesu žrtve. Vlasnik ovaca prinio je svoju najvredniju, najdeblju i najljepšu ovcu, drage volje. Obrađivač zemlje prinio je najgori dio svoga usjeva: kevzer i zivan, ne čineći to drage volje. Allah, Silan i Uzvišen, primio je žrtvu vlasnika ovaca, a nije primio žrtvu obrađivača zemlje. O njima se dogodilo ono što je Allah ispričao u Svojoj Knjizi.“ Rekao je: „Tako mi Allaha, ubijeni je bio snažniji od njih dvojice, ali ga je strah od grijeha spriječio da digne ruku na svoga brata.“ ⟦Napomena prevodioca: الكوزر والزوان preneseno je približno kao „kevzer i zivan“; tačna identifikacija tih naziva u ovom navodu nije potvrđena.⟧","bs_html":"\u003cspan class=\"isnad\">Avf, od Ebu Mugire, od Abdullaha ibn Amra, koji je rekao:\u003c/span> „Dvojica Ademovih sinova koji su prinijeli žrtve, pa je od jednoga primljena, a od drugoga nije, bili su jedan obrađivač zemlje, a drugi vlasnik ovaca. Naređeno im je da prinesu žrtve. Vlasnik ovaca prinio je svoju najvredniju, najdeblju i najljepšu ovcu, drage volje. Obrađivač zemlje prinio je najgori dio svoga usjeva: kevzer i zivan, ne čineći to drage volje. Allah, Silan i Uzvišen, primio je žrtvu vlasnika ovaca, a nije primio žrtvu obrađivača zemlje. O njima se dogodilo ono što je Allah ispričao u Svojoj Knjizi.“ Rekao je: „Tako mi Allaha, ubijeni je bio snažniji od njih dvojice, ali ga je strah od grijeha spriječio da digne ruku na svoga brata.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: الكوزر والزوان preneseno je približno kao „kevzer i zivan“; tačna identifikacija tih naziva u ovom navodu nije potvrđena.⟧\u003c/span>","bs_isnad_count":1},{"id":"142.2","ar":"وَقَالَ آخَرُونَ بِمَا حَدَّثَنِي بِهِ مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ: حَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\nكَانَ مِنْ شَأْنِهِمَا أَنَّهُ لَمْ يَكُنْ مِسْكِينٌ يُتَصَدَّقُ عَلَيْهِ، وَإِنَّمَا كَانَ الْقُرْبَانُ يُقَرِّبُهُ الرَّجُلُ، فَبَيْنَا ابْنَا آدَمَ قَاعِدَانِ إِذْ قَالا: لَوْ قَرَّبْنَا قُرْبَانًا! وَكَانَ الرَّجُلُ إِذَا قَرَّبَ قُرْبَانًا فَرَضِيَهُ اللَّهُ عَزَّ وَجَلَّ أَرْسَلَ إِلَيْهِ نَارًا فَأَكَلَتْهُ، وَإِنْ لَمْ يَكُنْ رَضِيَهُ اللَّهُ خَبَتِ النَّارُ، فَقَرَّبَا قُرْبَانًا، وَكَانَ أَحَدُهُمَا رَاعِيًا وَالآخَرُ حَرَّاثًا، وَإِنَّ صَاحِبَ الْغَنَمِ قَرَّبَ خَيْرَ غَنَمِهِ وَأَسْمَنَهَا، وَقَرْبَ الآخَرُ بَعْضَ زَرْعِهِ، فَجَاءَتِ النار فنزلت بينهما فَأَكَلَتِ الشَّاةَ وَتَرَكَتِ الزَّرْعَ، وَإِنَّ ابْنَ آدَمَ قَالَ لأَخِيهِ: أَتَمْشِي فِي النَّاسِ، وَقَدْ عَلِمُوا أَنَّكَ قَرَّبْتَ قُرْبَانًا فَتُقُبِّلَ مِنْكَ وَرُدَّ عَلَيَّ قُرْبَانِي! فَلا وَاللَّهِ لا يَنْظُرُ النَّاسُ إِلَيَّ وَإِلَيْكَ وَأَنْتَ خَيْرٌ مِنِّي، فَقَالَ: لأَقْتُلَنَّكَ، فَقَالَ لَهُ أَخُوهُ:\nمَا ذَنْبِي! إِنَّما يَتَقَبَّلُ اللَّهُ مِنَ الْمُتَّقِينَ.","ar_html":"وَقَالَ آخَرُونَ بِمَا \u003cspan class=\"isnad\">حَدَّثَنِي بِهِ مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ: حَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ:\nكَانَ مِنْ شَأْنِهِمَا أَنَّهُ لَمْ يَكُنْ مِسْكِينٌ يُتَصَدَّقُ عَلَيْهِ، وَإِنَّمَا كَانَ الْقُرْبَانُ يُقَرِّبُهُ الرَّجُلُ، فَبَيْنَا ابْنَا آدَمَ قَاعِدَانِ إِذْ قَالا: لَوْ قَرَّبْنَا قُرْبَانًا! وَكَانَ الرَّجُلُ إِذَا قَرَّبَ قُرْبَانًا فَرَضِيَهُ اللَّهُ عَزَّ وَجَلَّ أَرْسَلَ إِلَيْهِ نَارًا فَأَكَلَتْهُ، وَإِنْ لَمْ يَكُنْ رَضِيَهُ اللَّهُ خَبَتِ النَّارُ، فَقَرَّبَا قُرْبَانًا، وَكَانَ أَحَدُهُمَا رَاعِيًا وَالآخَرُ حَرَّاثًا، وَإِنَّ صَاحِبَ الْغَنَمِ قَرَّبَ خ  مات.\nوقال بعضهم: إن آدم غشي حواء بعد مهبطهما إلى الأرض بمائة سنة، فولدت له قابيل وتوءمته قليما في بطن واحد، ثم هابيل وتوءمته في بطن واحد، فلما شبوا أراد آدم ع أن يزوج أخت قابيل التي ولدت معه في بطن واحد من هابيل، فامتنع من ذلك قابيل، وقربا بهذا السبب قربانا فتقبل قربان هابيل، ولم يتقبل قربان قابيل، فحسده قابيل، فقتله عند عقبه حرى ثم نزل قابيل من الجبل، آخذا بيد أخته قليما، فهرب بها إلى عدن من أرض اليمن.\nحَدَّثَنِي بِذَلِكَ الْحَارِثُ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنِي هِشَامٌ، قَالَ: أَخْبَرَنِي أبي، عن أبي صالح، عن ابن عباس، قَالَ: لَمَّا قَتَلَ قَابِيلُ أَخَاهُ هَابِيلَ أَخَذَ بِيَدِ أُخْتِهِ ثُمَّ هَبَطَ بِهَا مِنْ جَبَلِ بُوذَ إِلَى الْحَضِيضِ، فَقَالَ آدَمُ لِقَابِيلَ: اذْهَبْ فَلا تَزَالُ مَرْعُوبًا لا تَأْمَنُ مَنْ تَرَاهُ، فَكَانَ لا يَمُرُّ بِهِ أَحَدٌ مِنْ وَلَدِهِ إِلا رَمَاهُ، فَأَقْبَلَ ابْنٌ لِقَابِيلَ أَعْمَى، وَمَعَهُ ابْنٌ لَهُ، فَقَالَ لِلأَعْمَى ابْنُهُ:\nهَذَا أَبُوكَ قَابِيلُ، فَرَمَى الأَعْمَى أَبَاهُ قَابِيلَ فَقَتَلَهُ، فَقَالَ ابْنُ الأَعْمَى: قَتَلْتَ","ar_html":"فِي عَصْرِهِ، وَقَالُوا: إِنَّمَا كَانَ هَذَانِ رَجُلَيْنِ مِنْ بَنِي إِسْرَائِيلَ، وَقَالُوا: إِنَّ أَوَّلَ مَيِّتٍ مات في الارض آدم ع، لَمْ يَمُتْ قَبْلَهُ أَحَدٌ.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n\n\u003cspan class=\"isnad\">حَدَّثَنَا سفيان بن وكيع، قال: حَدَّثَنَا سهل بن يوسف، عن عمرو، عن الحسن، قال\u003c/span>: كان الرجلان اللذان في القرآن قال الله عز وجل فيهما: «وَاتْلُ عَلَيْهِمْ نَبَأَ ابْنَيْ آدَمَ بِالْحَقِّ» من بني إسرائيل، ولم يكونا ابني آدم لصلبه، وإنما كان القربان في بني إسرائيل، وكان آدم أول من مات.\n\nوقال بعضهم: إن آدم غشي حواء بعد مهبطهما إلى الأرض بمائة سنة، فولدت له قابيل وتوءمته قليما في بطن واحد، ثم هابيل وتوءمته في بطن واحد، فلما شبوا أراد آدم ع أن يزوج أخت قابيل التي ولدت معه في بطن واحد من هابيل، فامتنع من ذلك قابيل، وقربا بهذا السبب قربانا فتقبل قربان هابيل، ولم يتقبل قربان قابيل، فحسده قابيل، فقتله عند عقبه حرى ثم نزل قابيل من الجبل، آخذا بيد أخته قليما، فهرب بها إلى عدن من أرض اليمن.\n\n\u003cspan class=\"isnad\">حَدَّثَنِي بِذَلِكَ الْحَارِثُ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنِي هِشَامٌ، قَالَ: أَخْبَرَنِي أبي، عن أبي صالح، عن ابن عباس، قَال\u003c/span>َ: لَمَّا قَتَلَ قَابِيلُ أَخَاهُ هَابِيلَ أَخَذَ بِيَدِ أُخْتِهِ ثُمَّ هَبَطَ بِهَا مِنْ جَبَلِ بُوذَ إِلَى الْحَضِيضِ، فَقَالَ آدَمُ لِقَابِيلَ: اذْهَبْ فَلا تَزَالُ مَرْعُوبًا لا تَأْمَنُ مَنْ تَرَاهُ، فَكَانَ لا يَمُرُّ بِهِ أَحَدٌ مِنْ وَلَدِهِ إِلا رَمَاهُ، فَأَقْبَلَ ابْنٌ لِقَابِيلَ أَعْمَى، وَمَعَهُ ابْنٌ لَهُ، فَقَالَ لِلأَعْمَى ابْنُهُ:\nهَذَا أَبُوكَ قَابِيلُ، فَرَمَى الأَعْمَى أَبَاهُ قَابِيلَ فَقَتَلَهُ، فَقَالَ ابْنُ الأَعْمَى: قَتَلْتَ","bs":"\u003cp data-paragraph=\"143.1\">u njegovo vrijeme. Bili su to samo dvojica ljudi među sinovima Israilovim.“ Rekli su: „Prvi koji je umro na Zemlji bio je Adem, alejhis-selam; prije njega niko nije umro.“\u003c/p>\u003cp data-paragraph=\"143.2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"143.3\">\u003cspan class=\"isnad\">Pričao nam je Sufjan ibn Veki‘, koji je rekao: pričao nam je Sehl ibn Jusuf, od Amra, od Hasena, koji je rekao:\u003c/span> „Dvojica ljudi iz Kur’ana, o kojima Allah, Silan i Uzvišen, kaže: ‘I kazuj im istinito vijest o dvojici Ademovih sinova’, bili su od sinova Israilovih, a nisu bili Ademovi neposredni sinovi. Prinošenje žrtve bilo je među sinovima Israilovim, a Adem je bio prvi koji je umro.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Maida, 5:27, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"143.4\">Neki su rekli da je Adem imao odnos s Havvom stotinu godina nakon njihovog spuštanja na Zemlju. Rodila mu je Kabila i njegovu sestru blizanku Kelimu u jednom porodu, zatim Habila i njegovu sestru blizanku u jednom porodu. Kada su odrasli, Adem, alejhis-selam, htio je Kabilovu sestru, rođenu s njim u jednom porodu, udati za Habila. Kabil je to odbio. Zbog toga su prinijeli žrtve, pa je Habilova žrtva primljena, a Kabilova nije. Kabil mu je pozavidio i ubio ga kod klanca Hara. Zatim je Kabil sišao s planine držeći za ruku svoju sestru Kelimu i s njom pobjegao u Aden, u jemenskoj zemlji. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: imena u izvoru glase قليما i عقبة حرى. Prenesena su približno kao „Kelima“ i „klanac Hara“, bez sigurnog određenja izgovora ili poistovjećivanja mjesta.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"143.5\">O tome \u003cspan class=\"isnad\">mi je pričao Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio me Hišam, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao:\u003c/span> „Kada je Kabil ubio svoga brata Habila, uzeo je sestru za ruku, pa s njom sišao s planine Buz u podnožje. Adem je rekao Kabilu: ‘Odlazi! Neprestano ćeš biti prestrašen i nećeš biti siguran ni od koga koga vidiš.’ Nijedan njegov potomak nije prolazio pored njega a da nije gađao prema njemu. Došao je jedan slijepi Kabilov sin, s kojim je bio njegov sin. Sin je slijepome rekao: ‘Ovo je tvoj otac Kabil.’ Slijepi je gađao svoga oca Kabila i ubio ga. Sin slijepoga rekao je: ‘Oče, ubio si\u003c/p>","paragraphs":[{"id":"143.1","ar":"فِي عَصْرِهِ، وَقَالُوا: إِنَّمَا كَانَ هَذَانِ رَجُلَيْنِ مِنْ بَنِي إِسْرَائِيلَ، وَقَالُوا: إِنَّ أَوَّلَ مَيِّتٍ مات في الارض آدم ع، لَمْ يَمُتْ قَبْلَهُ أَحَدٌ.","ar_html":"فِي عَصْرِهِ، وَقَالُوا: إِنَّمَا كَانَ هَذَانِ رَجُلَيْنِ مِنْ بَنِي إِسْرَائِيلَ، وَقَالُوا: إِنَّ أَوَّلَ مَيِّتٍ مات في الارض آدم ع، لَمْ يَمُتْ قَبْلَهُ أَحَدٌ.","ar_isnad_ranges":[],"bs":"u njegovo vrijeme. Bili su to samo dvojica ljudi među sinovima Israilovim.“ Rekli su: „Prvi koji je umro na Zemlji bio je Adem, alejhis-selam; prije njega niko nije umro.“","bs_html":"u njegovo vrijeme. Bili su to samo dvojica ljudi među sinovima Israilovim.“ Rekli su: „Prvi koji je umro na Zemlji bio je Adem, alejhis-selam; prije njega niko nije umro.“","bs_isnad_count":0},{"id":"143.2","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","ar_isnad_ranges":[],"bs":"Spomen onih koji su to rekli:",  بهذا السبب قربانا فتقبل قربان هابيل، ولم يتقبل قربان قابيل، فحسده قابيل، فقتله عند عقبه حرى ثم نزل قابيل من الجبل، آخذا بيد أخته قليما، فهرب بها إلى عدن من أرض اليمن.","ar_html":"وقال بعضهم: إن آدم غشي حواء بعد مهبطهما إلى الأرض بمائة سنة، فولدت له قابيل وتوءمته قليما في بطن واحد، ثم هابيل وتوءمته في بطن واحد، فلما شبوا أراد آدم ع أن يزوج أخت قابيل التي ولدت معه في بطن واحد من هابيل، فامتنع من ذلك قابيل، وقربا بهذا السبب قربانا فتقبل قربان هابيل، ولم يتقبل قربان قابيل، فحسده قابيل، فقتله عند عقبه حرى ثم نزل قابيل من الجبل، آخذا بيد أخته قليما، فهرب بها إلى عدن من أرض اليمن.","ar_isnad_ranges":[],"bs":"Neki su rekli da je Adem imao odnos s Havvom stotinu godina nakon njihovog spuštanja na Zemlju. Rodila mu je Kabila i njegovu sestru blizanku Kelimu u jednom porodu, zatim Habila i njegovu sestru blizanku u jednom porodu. Kada su odrasli, Adem, alejhis-selam, htio je Kabilovu sestru, rođenu s njim u jednom porodu, udati za Habila. Kabil je to odbio. Zbog toga su prinijeli žrtve, pa je Habilova žrtva primljena, a Kabilova nije. Kabil mu je pozavidio i ubio ga kod klanca Hara. Zatim je Kabil sišao s planine držeći za ruku svoju sestru Kelimu i s njom pobjegao u Aden, u jemenskoj zemlji. ⟦Napomena prevodioca: imena u izvoru glase قليما i عقبة حرى. Prenesena su približno kao „Kelima“ i „klanac Hara“, bez sigurnog određenja izgovora ili poistovjećivanja mjesta.⟧","bs_html":"Neki su rekli da je Adem imao odnos s Havvom stotinu godina nakon njihovog spuštanja na Zemlju. Rodila mu je Kabila i njegovu sestru blizanku Kelimu u jednom porodu, zatim Habila i njegovu sestru blizanku u jednom porodu. Kada su odrasli, Adem, alejhis-selam, htio je Kabilovu sestru, rođenu s njim u jednom porodu, udati za Habila. Kabil je to odbio. Zbog toga su prinijeli žrtve, pa je Habilova žrtva primljena, a Kabilova nije. Kabil mu je pozavidio i ubio ga kod klanca Hara. Zatim je Kabil sišao s planine držeći za ruku svoju sestru Kelimu i s njom pobjegao u Aden, u jemenskoj zemlji. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: imena u izvoru glase قليما i عقبة حرى. Prenesena su približno kao „Kelima“ i „klanac Hara“, bez sigurnog određenja izgovora ili poistovjećivanja mjesta.⟧\u003c/span>","bs_isnad_count":0},{"id":"143.5","ar":"حَدَّثَنِي بِذَلِكَ الْحَارِثُ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنِي هِشَامٌ، قَالَ: أَخْبَرَنِي أبي، عن أبي صالح، عن ابن عباس، قَالَ: لَمَّا قَتَلَ قَابِيلُ أَخَاهُ هَابِيلَ أَخَذَ بِيَدِ أُخْتِهِ ثُمَّ هَبَطَ بِهَا مِنْ جَبَلِ بُوذَ إِلَى الْحَضِيضِ، فَقَالَ آدَمُ لِقَابِيلَ: اذْهَبْ فَلا تَزَالُ مَرْعُوبًا لا تَأْمَنُ مَنْ تَرَاهُ، فَكَانَ لا يَمُرُّ بِهِ أَحَدٌ مِنْ وَلَدِهِ إِلا رَمَاهُ، فَأَقْبَلَ ابْنٌ لِقَابِيلَ أَعْمَى، وَمَعَهُ ابْنٌ لَهُ، فَقَالَ لِلأَعْمَى ابْنُهُ:\nهَذَا أَبُوكَ قَابِيلُ، فَرَمَى الأَعْمَى أَبَاهُ قَابِيلَ فَقَتَلَهُ، فَقَالَ ابْنُ الأَعْمَى: قَتَلْتَ","ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي بِذَلِكَ الْحَارِثُ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنِي هِشَامٌ، قَالَ: أَخْبَرَنِي أبي، عن أبي صالح، عن ابن عباس، قَال\u003c/span>َ: لَمَّا قَتَلَ قَابِيلُ أَخَاهُ هَابِيلَ أَخَذَ بِيَدِ أُخْتِهِ ثُمَّ هَبَطَ بِهَا مِنْ جَبَلِ بُوذَ إِلَى الْحَضِيضِ، فَقَالَ آدَمُ لِقَابِيلَ: اذْهَبْ فَلا تَزَالُ مَرْعُوبًا لا تَأْمَنُ مَنْ تَرَاهُ، فَكَانَ لا يَمُرُّ بِهِ أَحَدٌ مِنْ وَلَدِهِ إِلا رَمَاهُ، فَأَقْبَلَ ابْنٌ لِقَابِيلَ أَعْمَى، وَمَعَهُ ابْنٌ لَهُ، فَقَالَ لِلأَعْمَى ابْنُهُ:\nهَذَا أَبُوكَ قَابِيلُ، فَرَمَى الأَعْمَى أَبَاهُ قَابِيلَ فَقَتَلَهُ، فَقَالَ ابْنُ الأَعْمَى: قَتَلْتَ","ar_isnad_ranges":[[0,146]],"bs":"O tome mi je pričao Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio me Hišam, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Kada je Kabil ubio svoga brata Habila, uzeo je sestru za ruku, pa s njom sišao s planine Buz u podnožje. Adem je rekao Kabilu: ‘Odlazi! Neprestano ćeš biti prestrašen i nećeš biti siguran ni od koga koga vidiš.’ Nijedan njegov potomak nije prolazio pored njega a da nije gađao prema njemu. Došao je jedan slijepi Kabilov sin, s kojim je bio njegov sin. Sin je slijepome rekao: ‘Ovo je tvoj otac Kabil.’ Slijepi je gađao svoga oca Kabila i ubio ga. Sin slijepoga rekao je: ‘Oče, ubio si","bs_html":"O tome \u003cspan class=\"isnad\">mi je pričao Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio me Hišam, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao:\u003c/span> „Kada je Kabil ubio svoga brata Habila, uzeo je sestru za ruku, pa s njom sišao s planine Buz u podnožje. Adem je rekao Kabilu: ‘Odlazi! Neprestano ćeš biti prestrašen i nećeš biti siguran ni od koga koga vidiš.’ Nijedan njegov potomak nije prolazio pored njega a da nije gađao prema njemu. Došao je jedan slijepi Kabilov sin, s kojim je bio njegov sin. Sin je slijepome rekao: ‘Ovo je tvoj otac Kabil.’ Slijepi je gađao svoga oca Kabila i ubio ga. Sin slijepoga rekao je: ‘Oče, ubio si","bs_isnad_count":1}],"notes":[]},{"n":144,"ar":"يَا أَبَتَاهُ أَبَاكَ، فَرَفَعَ الأَعْمَى يَدَهُ، فَلَطَمَ ابْنَهُ فَمَاتَ ابْنُهُ، فَقَالَ الأَعْمَى: وَيْلٌ لِي! قَتَلْتُ أَبِي بِرَمْيَتِي، وَقَتَلْتُ ابْنِي بِلَطْمَتِي! وَذُكِرَ فِي التَّوْرَاةِ أَنَّ هَابِيلَ قُتِلَ وَلَهُ عِشْرُونَ سَنَةً، وَأَنَّ قَابِيلَ كَانَ لَهُ يَوْمَ قَتَلَهُ خَمْسٌ وَعِشْرُونَ سَنَةً.\nوَالصَّحِيحُ مِنَ الْقَوْلِ عِنْدَنَا أَنَّ الَّذِي ذَكَرَ اللَّهُ فِي كِتَابِهِ أَنَّهُ قتل أخاه من ابنى آدم هو ابن آدَمَ لِصُلْبِهِ، لِنَقْلِ الْحُجَّةِ أَنَّ ذَلِكَ كَذَلِكَ، وَأَنَّ هَنَّادَ بْنَ السَّرِيِّ حَدَّثَنَا، قَالَ: حَدَّثَنَا أَبُو مُعَاوِيَةَ وَوَكِيعٌ جَمِيعًا عَنِ الأَعْمَشِ.\n- وَحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا جَرِيرٌ وَحَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا جَرِيرٌ وَأَبُو مُعَاوِيَةَ عَنِ الأَعْمَشِ- عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، قَالَ: [قَالَ النَّبِيُّ ص: مَا مِنْ نَفْسٍ تُقْتَلُ ظُلْمًا إِلا كَانَ عَلَى ابْنِ آدَمَ الأَوَّلِ كِفْلٌ مِنْهَا،] وَذَلِكَ لأَنَّهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ.\nحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ- وَحَدَّثَنَا ابْنُ وَكِيعٍ قَالَ: حَدَّثَنَا أَبِي- جَمِيعًا عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، عن النبي ص نَحْوَهُ.\n\nفَقَدْ بَيَّنَ هَذَا الْخَبَرُ عَنْ رَسُولِ الله ص صِحَّةَ قَوْلِ مَنْ قَالَ:\nإِنَّ اللَّذَيْنِ قَصَّ اللَّهُ فِي كِتَابِهِ قِصَّتَهُمَا مِنَ ابْنَيْ آدَمَ كَانَا ابْنَيْهِ لِصُلْبِهِ، لأَنَّهُ لا شَكَّ أَنَّهُمَا لَوْ كَانَا مِنْ بَنِي إِسْرَائِيلَ- كَمَا رُوِيَ عَنِ الْحَسَنِ- لَمْ يَكُنِ الَّذِي وُصِفَ مِنْهُمَا بِأَنَّهُ قَتَلَ أَخَاهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ، إِذْ كَانَ الْقَتْلَ فِي بَنِي آدَمَ قَدْ كَانَ قَبْلَ إِسْرَائِيلَ وَوَلَدِهِ.\n\nفَإِنْ قَالَ قَائِلٌ: فَمَا بُرْهَانُكَ عَلَى أَنَّهُمَا وَلَدَا آدَمَ لِصُلْبِهِ، وَإِنْ لَمْ يَكُونَا مِنْ بَنِي إِسْرَائِيلَ؟","ar_html":"يَا أَبَتَاهُ أَبَاكَ، فَرَفَعَ الأَعْمَى يَدَهُ، فَلَطَمَ ابْنَهُ فَمَاتَ ابْنُهُ، فَقَالَ الأَعْمَى: وَيْلٌ لِي! قَتَلْتُ أَبِي بِرَمْيَتِي، وَقَتَلْتُ ابْنِي بِلَطْمَتِي! وَذُكِرَ فِي التَّوْرَاةِ أَنَّ هَابِيلَ قُتِلَ وَلَهُ عِشْرُونَ سَنَةً، وَأَنَّ قَابِيلَ كَانَ لَهُ يَوْمَ قَتَلَهُ خَمْسٌ وَعِشْرُونَ سَنَةً.\n\nوَالصَّحِيحُ مِنَ الْقَوْلِ عِنْدَنَا أَنَّ الَّذِي ذَكَرَ اللَّهُ فِي كِتَابِهِ أَنَّهُ قتل أخاه من ابنى آدم هو ابن آدَمَ لِصُلْبِهِ، لِنَقْلِ الْحُجَّةِ أَنَّ ذَلِكَ كَذَلِكَ، وَأَنَّ \u003cspan class=\"isnad\">هَنَّادَ بْنَ السَّرِيِّ حَدَّثَنَا، قَالَ: حَدَّثَنَا أَبُو مُعَاوِيَةَ وَوَكِيعٌ جَمِيعًا عَنِ الأَعْمَشِ.\n- وَحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا جَرِيرٌ وَحَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا جَرِيرٌ وَأَبُو مُعَاوِيَةَ عَنِ الأَعْمَشِ- عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، قَالَ: [قَالَ النَّبِيُّ ص\u003c/span>: مَا مِنْ نَفْسٍ تُقْتَلُ ظُلْمًا إِلا كَانَ عَلَى ابْنِ آدَمَ الأَوَّلِ كِفْلٌ مِنْهَا،] وَذَلِكَ لأَنَّهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ.\n\n\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ- وَحَدَّثَنَا ابْنُ وَكِيعٍ قَالَ: حَدَّثَنَا أَبِي- جَمِيعًا عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، عن النبي ص\u003c/span> نَحْوَهُ.\n\nفَقَدْ بَيَّنَ هَذَا الْخَبَرُ عَنْ رَسُولِ الله ص صِحَّةَ قَوْلِ مَنْ قَالَ:\nإِنَّ اللَّذَيْنِ قَصَّ اللَّهُ فِي كِتَابِهِ قِصَّتَهُمَا مِنَ ابْنَيْ آدَمَ كَانَا ابْنَيْهِ لِصُلْبِهِ، لأَنَّهُ لا شَكَّ أَنَّهُمَا لَوْ كَانَا مِنْ بَنِي إِسْرَائِيلَ- \u003cspan class=\"isnad\">كَمَا رُوِيَ عَنِ الْحَسَن\u003c/span>ِ- لَمْ يَكُنِ الَّذِي وُصِفَ مِنْهُمَا بِأَنَّهُ قَتَلَ أَخَاهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ، إِذْ كَانَ الْقَتْلَ فِي بَنِي آدَمَ قَدْ كَانَ قَبْلَ إِسْرَائِيلَ وَوَلَدِهِ.\n\nفَإِنْ قَالَ قَائِلٌ: فَمَا بُرْهَانُكَ عَلَى أَنَّهُمَا وَلَدَا آدَمَ لِصُلْبِهِ، وَإِنْ لَمْ يَكُونَا مِنْ بَنِي إِسْرَائِيلَ؟","bs":"\u003cp data-paragraph=\"144.1\">svoga oca!’ Slijepi je podigao ruku i ošamario sina, pa je sin umro. Slijepi je rekao: ‘Teško meni! Ubio sam svoga oca svojim hicem i svoga sina svojim šamarom!’“ Navedeno je u Tevratu da je Habil ubijen kada je imao dvadeset godina, a da je Kabil na dan kada ga je ubio imao dvadeset pet godina.\u003c/p>\u003cp data-paragraph=\"144.2\">Ispravno je, prema našem mišljenju, da je onaj među dvojicom Ademovih sinova za kojeg je Allah u Svojoj Knjizi naveo da je ubio brata bio Ademov neposredni sin. Tako je preneseno predajom koja ima dokaznu snagu, a \u003cspan class=\"isnad\">Hennad ibn es-Serijj pričao nam je, rekavši: pričali su nam Ebu Muavija i Veki‘, obojica od A‘meša. A pričao nam je i Ibn Humejd, koji je rekao: pričao nam je Džerir. Pričao nam je i Ibn Veki‘, koji je rekao: pričali su nam Džerir i Ebu Muavija, od A‘meša — od Abdullaha ibn Murre, od Mesruka, od Abdullaha, koji je rekao: Vjerovjesnik, sallallahu alejhi ve sellem, rekao je:\u003c/span> „Nijedna duša nije nepravedno ubijena a da prvi Ademov sin nema udjela u tome“, zato što je on prvi uspostavio ubijanje.\u003c/p>\u003cp data-paragraph=\"144.3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar, koji je rekao: pričao nam je Abdurrahman ibn Mehdi — a pričao nam je i Ibn Veki‘, koji je rekao: pričao nam je moj otac — obojica od Sufjana, od A‘meša, od Abdullaha ibn Murre, od Mesruka, od Abdullaha, od Vjerovjesnika, sallallahu alejhi ve sellem,\u003c/span> nešto slično tome.\u003c/p>\u003cp data-paragraph=\"144.4\">Ova predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, pokazala je ispravnost mišljenja onoga ko kaže da su njih dvojica, čiju je pripovijest Allah ispričao u Svojoj Knjizi, bili Ademovi neposredni sinovi. Nema sumnje da, kada bi bili od sinova Israilovih — \u003cspan class=\"isnad\">kako je preneseno od Hasena\u003c/span> — onaj za kojeg je navedeno da je ubio brata ne bi bio prvi koji je uspostavio ubijanje, jer je među Ademovim potomcima ubijanja bilo i prije Israila i njegovih potomaka.\u003c/p>\u003cp data-paragraph=\"144.5\">Ako neko kaže: „Koji je tvoj dokaz da su bili Ademovi neposredni sinovi, iako nisu bili od sinova Israilovih?“\u003c/p>","paragraphs":[{"id":"144.1","ar":"يَا أَبَتَاهُ أَبَاكَ، فَرَفَعَ الأَعْمَى يَدَهُ، فَلَطَمَ ابْنَهُ فَمَاتَ ابْنُهُ، فَقَالَ الأَعْمَى: وَيْلٌ لِي! قَتَلْتُ أَبِي بِرَمْيَتِي، وَقَتَلْتُ ابْنِي بِلَطْمَتِي! وَذُكِرَ فِي التَّوْرَاةِ أَنَّ هَابِيلَ قُتِلَ وَلَهُ عِشْرُونَ سَنَةً، وَأَنَّ قَابِيلَ كَانَ لَهُ يَوْمَ قَتَلَهُ خَمْسٌ وَعِشْرُونَ سَنَةً.","ar_html":"يَا أَبَتَاهُ أَبَاكَ، فَرَفَعَ الأَعْمَى يَدَهُ، فَلَطَمَ ابْنَهُ فَمَاتَ ابْنُهُ، فَقَالَ الأَعْمَى: وَيْلٌ لِي! قَتَلْتُ أَبِي بِرَمْيَتِي، وَقَتَلْتُ ابْنِي بِلَطْمَتِي! وَذُكِرَ فِي التَّوْرَاةِ أَنَّ هَابِيلَ قُتِلَ وَلَهُ عِشْرُونَ سَنَةً، وَأَنَّ قَابِيلَ كَانَ لَهُ يَوْمَ قَتَلَهُ خَمْسٌ وَعِشْرُونَ سَنَةً.","ar_isnad_ranges":[],"bs":"svoga oca!’ Slijepi je podigao ruku i ošamario sina, pa je sin umro. Slijepi je rekao: ‘Teško meni! Ubio sam svoga oca svojim hicem i svoga sina svojim šamarom!’“ Navedeno je u Tevratu da je Habil ubijen kada je imao dvadeset godina, a da je Kabil na dan kada ga je ubio imao dvadeset pet godina.","bs_html":"svoga oca!’ Slijepi je podigao ruku i ošamario sina, pa je sin umro. Slijepi je rekao: ‘Teško meni! Ubio sam svoga oca svojim hicem i svoga sina svojim šamarom!’“ Navedeno je u Tevratu da je Habil ubijen kada je imao dvadeset godina, a da je Kabil na dan kada ga je ubio imao dvadeset pet godina.","bs_isnad_count":0},{"id":"144.2","ar":"وَالصَّحِيحُ مِنَ الْقَوْلِ عِنْدَنَا أَنَّ الَّذِي ذَكَرَ اللَّهُ فِي كِتَابِهِ أَنَّهُ قتل أخاه من ابنى آدم هو ابن آدَمَ لِصُلْبِهِ، لِنَقْلِ الْحُجَّةِ أَنَّ ذَلِكَ كَذَلِكَ، وَأَنَّ هَنَّادَ بْنَ السَّرِيِّ حَدَّثَنَا، قَالَ: حَدَّثَنَا أَبُو مُعَاوِيَةَ وَوَكِيعٌ جَمِيعًا عَنِ الأَعْمَشِ.\n- وَحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا جَرِيرٌ وَحَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا جَرِيرٌ وَأَبُو مُعَاوِيَةَ عَنِ الأَعْمَشِ- عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، قَالَ: [قَالَ النَّبِيُّ ص: مَا مِنْ نَفْسٍ تُقْتَلُ ظُلْمًا إِلا كَانَ عَلَى ابْنِ آدَمَ الأَوَّلِ كِفْلٌ مِنْهَا،] وَذَلِكَ لأَنَّهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ.","ar_html":"وَالصَّحِيحُ مِنَ الْقَوْلِ عِنْدَنَا أَنَّ الَّذِي ذَكَرَ اللَّهُ فِي كِتَابِهِ أَنَّهُ قتل أخاه من ابنى آدم هو ابن آدَمَ لِصُلْبِهِ، لِنَقْلِ الْحُجَّةِ أَنَّ ذَلِكَ كَذَلِكَ، وَأَنَّ \u003cspan class=\"isnad\">هَنَّادَ بْنَ السَّرِيِّ حَدَّثَنَا، قَالَ: حَدَّثَنَا أَبُو مُعَاوِيَةَ وَوَكِيعٌ جَمِيعًا عَنِ الأَعْمَشِ.\n- وَحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا جَرِيرٌ وَحَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا جَرِيرٌ وَأَبُو مُعَاوِيَةَ عَنِ الأَعْمَشِ- عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، قَالَ: [قَالَ النَّبِيُّ ص\u003c/span>: مَا مِنْ نَفْسٍ تُقْتَلُ ظُلْمًا إِلا كَانَ عَلَى ابْنِ آدَمَ الأَوَّلِ كِفْلٌ مِنْهَا،] وَذَلِكَ لأَنَّهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ.","ar_isnad_ranges":[[186,540]],"bs":"Ispravno je, prema našem mišljenju, da je onaj među dvojicom Ademovih sinova za kojeg je Allah u Svojoj Knjizi naveo da je ubio brata bio Ademov neposredni sin. Tako je preneseno predajom koja ima dokaznu snagu, a Hennad ibn es-Serijj pričao nam je, rekavši: pričali su nam Ebu Muavija i Veki‘, obojica od A‘meša. A pričao nam je i Ibn Humejd, koji je rekao: pričao nam je Džerir. Pričao nam je i Ibn Veki‘, koji je rekao: pričali su nam Džerir i Ebu Muavija, od A‘meša — od Abdullaha ibn Murre, od Mesruka, od Abdullaha, koji je rekao: Vjerovjesnik, sallallahu alejhi ve sellem, rekao je: „Nijedna duša nije nepravedno ubijena a da prvi Ademov sin nema udjela u tome“, zato što je on prvi uspostavio ubijanje.","bs_html":"Ispravno je, prema našem mišljenju, da je onaj među dvojicom Ademovih sinova za kojeg je Allah u Svojoj Knjizi naveo da je ubio brata bio Ademov neposredni sin. Tako je preneseno predajom koja ima dokaznu snagu, a \u003cspan class=\"isnad\">Hennad ibn es-Serijj pričao nam je, rekavši: pričali su nam Ebu Muavija i Veki‘, obojica od A‘meša. A pričao nam je i Ibn Humejd, koji je rekao: pričao nam je Džerir. Pričao nam je i Ibn Veki‘, koji je rekao: pričali su nam Džerir i Ebu Muavija, od A‘meša — od Abdullaha ibn Murre, od Mesruka, od Abdullaha, koji je rekao: Vjerovjesnik, sallallahu alejhi ve sellem, rekao je:\u003c/span> „Nijedna duša nije nepravedno ubijena a da prvi Ademov sin nema udjela u tome“, zato što je on prvi uspostavio ubijanje.","bs_isnad_count":1},{"id":"144.3","ar":"حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ- وَحَدَّثَنَا ابْنُ وَكِيعٍ قَالَ: حَدَّثَنَا أَبِي- جَمِيعًا عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، عن النبي ص نَحْوَهُ.","ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ- وَحَدَّثَنَا ابْنُ وَكِيعٍ قَالَ: حَدَّثَنَا أَبِي- جَمِيعًا عَنْ سُفْيَانَ، عَنِ الأَعْمَشِ، عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ، عن النبي ص\u003c/span> نَحْوَهُ.","ar_isnad_ranges":[[0,255]],"bs":"Pričao nam je Ibn Beššar, koji je rekao: pričao nam je Abdurrahman ibn Mehdi — a pričao nam je i Ibn Veki‘, koji je rekao: pričao nam je moj otac — obojica od Sufjana, od A‘meša, od Abdullaha ibn Murre, od Mesruka, od Abdullaha, od Vjerovjesnika, sallallahu alejhi ve sellem, nešto slično tome.","bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar, koji je rekao: pričao nam je Abdurrahman ibn Mehdi — a pričao nam je i Ibn Veki‘, koji je rekao: pričao nam je moj otac — obojica od Sufjana, od A‘meša, od Abdullaha ibn Murre, od Mesruka, od Abdullaha, od Vjerovjesnika, sallallahu alejhi ve sellem,\u003c/span> nešto slično tome.","bs_isnad_count":1},{"id":"144.4","ar":"فَقَدْ بَيَّنَ هَذَا الْخَبَرُ عَنْ رَسُولِ الله ص صِحَّةَ قَوْلِ مَنْ قَالَ:\nإِنَّ اللَّذَيْنِ قَصَّ اللَّهُ فِي كِتَابِهِ قِصَّتَهُمَا مِنَ ابْنَيْ آدَمَ كَانَا ابْنَيْهِ لِصُلْبِهِ، لأَنَّهُ لا شَكَّ أَنَّهُمَا لَوْ كَانَا مِنْ بَنِي إِسْرَائِيلَ- كَمَا رُوِيَ عَنِ الْحَسَنِ- لَمْ يَكُنِ الَّذِي وُصِفَ مِنْهُمَا بِأَنَّهُ قَتَلَ أَخَاهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ، إِذْ كَانَ الْقَتْلَ فِي بَنِي آدَمَ قَدْ كَانَ قَبْلَ إِسْرَائِيلَ وَوَلَدِهِ.","ar_html":"فَقَدْ بَيَّنَ هَذَا الْخَبَرُ عَنْ رَسُولِ الله ص صِحَّةَ قَوْلِ مَنْ قَالَ:\nإِنَّ اللَّذَيْنِ قَصَّ اللَّهُ فِي كِتَابِهِ قِصَّتَهُمَا مِنَ ابْنَيْ آدَمَ كَانَا ابْنَيْهِ لِصُلْبِهِ، لأَنَّهُ لا شَكَّ أَنَّهُمَا لَوْ كَانَا مِنْ بَنِي إِسْرَائِيلَ- \u003cspan class=\"isnad\">كَمَا رُوِيَ عَنِ الْحَسَن\u003c/span>ِ- لَمْ يَكُنِ الَّذِي وُصِفَ مِنْهُمَا بِأَنَّهُ قَتَلَ أَخَاهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ، إِذْ كَانَ الْقَتْلَ فِي بَنِي آدَمَ قَدْ كَانَ قَبْلَ إِسْرَائِيلَ وَوَلَدِهِ.","ar_isnad_ranges":[[251,277]],"bs":"Ova predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, pokazala je ispravnost mišljenja onoga ko kaže da su njih dvojica, čiju je pripovijest Allah ispričao u Svojoj Knjizi, bili Ademovi neposredni sinovi. Nema sumnje da, kada bi bili od sinova Israilovih — kako je preneseno od Hasena — onaj za kojeg je navedeno da je ubio brata ne bi bio prvi koji je uspostavio ubijanje, jer je među Ademovim potomcima ubijanja bilo i prije Israila i njegovih potomaka.","bs_html":"Ova predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, pokazala je ispravnost mišljenja onoga ko kaže da su njih dvojica, čiju je pripovijest Allah ispričao u Svojoj Knjizi, bili Ademovi neposredni sinovi. Nema sumnje da, kada bi bili od sinova Israilovih — \u003cspan class=\"isnad\">kako je preneseno od Hasena\u003c/span> — onaj za kojeg je navedeno da je ubio brata ne bi bio prvi koji je uspostavio ubijanje, jer je među Ademovim potomcima ubijanja bilo i prije Israila i njegovih potomaka.","bs_isnad_count":1},{"id":"144.5","ar":"فَإِنْ قَالَ قَائِلٌ: فَمَا بُرْهَانُكَ عَلَى أَنَّهُمَا وَلَدَا آدَمَ لِصُلْبِهِ، وَإِنْ لَمْ يَكُونَا مِنْ بَنِي إِسْرَائِيلَ؟","ar_html":"فَإِنْ قَالَ قَائِلٌ: فَمَا بُرْهَانُكَ عَلَى أَنَّهُمَا وَلَدَا آدَمَ لِصُلْبِهِ، وَإِنْ لَمْ يَكُونَا مِنْ بَنِي إِسْرَائِيلَ؟","ar_isnad_ranges":[],"bs":"Ako neko kaže: „Koji je tvoj dokaz da su bili Ademovi neposredni sinovi, iako nisu bili od sinova Israilovih?“","bs_html":"Ako neko kaže: „Koji je tvoj dokaz da su bili Ademovi neposredni sinovi, iako nisu bili od sinova Israilovih?“","bs_isnad_count":0}],"notes":[]},{"n":145,"ar":"قِيلَ: لا خِلافَ بَيْنَ سَلَفِ عُلَمَاءِ أُمَّتِنَا في ذلك، إذا فَسَدَ قَوْلُ مَنْ قَالَ:\nكَانَا مِنْ بَنِي إِسْرَائِيلَ وَذُكِرَ أَنَّ قَابِيلَ لَمَّا قَتَلَ أَخَاهُ هابيل بكاه آدم ع فَقَالَ- فِيمَا حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنْ غِيَاثِ بْنِ إِبْرَاهِيمَ، عَنْ أَبِي إِسْحَاقَ الْهَمْدَانِيِّ، قَالَ: قَالَ عَلِيُّ بْنُ أَبِي طَالِبٍ كَرَّمَ اللَّهُ وَجْهَهُ: لَمَّا قَتَلَ ابْنُ آدَمَ أَخَاهُ بَكَاهُ آدَمُ، فَقَالَ:\n\nتَغَيَّرَتِ الْبِلادُ ومن عليها ... فوجه الأَرْضِ مُغْبَرٌّ قَبِيحُ\n\nتَغَيَّرَ كُلُّ ذِي طَعْمٍ وَلَوْنٍ ... وَقَلَّ بَشَاشَةُ الْوَجْهِ الْمَلِيحِ\nقَالَ: فَأُجِيبَ آدم ع:\n\nأَبَا هَابِيلَ قَدْ قُتِلا جَمِيعًا ... وَصَارَ الْحَيُّ كَالْمَيْتِ الذَّبِيحِ\n\nوَجَاءَ بِشِرَّةٍ قَدْ كَانَ مِنْهَا ... عَلَى خَوْفٍ فَجَاءَ بِهَا يَصِيحُ\n\nوَذُكِرَ أَنَّ حواء ولدت لادم ع عِشْرِينَ وَمِائَةَ بَطْنٍ، أَوَّلُهُمْ قَابِيلُ وَتَوْءَمَتُهُ قلِيمَا، وَآخِرُهُمْ عَبْدُ الْمُغِيثِ وَتَوْءَمَتُهُ أَمَةُ الْمُغِيثِ.\nوَأَمَّا ابْنُ إِسْحَاقَ فَذُكِرَ عَنْهُ مَا قَدْ ذَكَرْتُ قَبْلُ، وَهُوَ أَنَّ جَمِيعَ مَا وَلَدَتْهُ حَوَّاءُ لآدَمَ لِصُلْبِهِ أَرْبَعُونَ مِنْ ذَكَرٍ وَأُنْثَى فِي عِشْرِينَ بَطْنًا، وَقَالَ: قَدْ بَلَغَنَا أَسْمَاءُ بَعْضِهِمْ وَلَمْ يَبْلُغْنَا بَعْضٌ.\n\nحَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال:\n\nفكان من بلغنا اسمه خمسة عشر رجلا وأربع نسوة، منهم قين وتوءمته، وهابيل وليوذا وأشوث بنت آدم وتوءمها، وشيث وتوءمته، وحزورة وتوءمها، على","ar_html":"قِيلَ: لا خِلافَ بَيْنَ سَلَفِ عُلَمَاءِ أُمَّتِنَا في ذلك، إذا فَسَدَ قَوْلُ مَنْ قَالَ:\nكَانَا مِنْ بَنِي إِسْرَائِيلَ وَذُكِرَ أَنَّ قَابِيلَ لَمَّا قَتَلَ أَخَاهُ هابيل بكاه آدم ع فَقَالَ- فِيمَا \u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنْ غِيَاثِ بْنِ إِبْرَاهِيمَ، عَنْ أَبِي إِسْحَاقَ الْهَمْدَانِيِّ، قَالَ: قَالَ عَلِيُّ بْنُ أَبِي طَالِبٍ كَرَّمَ اللَّهُ وَجْهَه\u003c/span>ُ: لَمَّا قَتَلَ ابْنُ آدَمَ أَخَاهُ بَكَاهُ آدَمُ، فَقَالَ:\n\nتَغَيَّرَتِ الْبِلادُ ومن عليها ... فوجه الأَرْضِ مُغْبَرٌّ قَبِيحُ\n\nتَغَيَّرَ كُلُّ ذِي طَعْمٍ وَلَوْنٍ ... وَقَلَّ بَشَاشَةُ الْوَجْهِ الْمَلِيحِ\n\nقَالَ: فَأُجِيبَ آدم ع:\n\nأَبَا هَابِيلَ قَدْ قُتِلا جَمِيعًا ... وَصَارَ الْحَيُّ كَالْمَيْتِ الذَّبِيحِ\n\nوَجَاءَ بِشِرَّةٍ قَدْ كَانَ مِنْهَا ... عَلَى خَوْفٍ فَجَاءَ بِهَا يَصِيحُ\n\nوَذُكِرَ أَنَّ حواء ولدت لادم ع عِشْرِينَ وَمِائَةَ بَطْنٍ، أَوَّلُهُمْ قَابِيلُ وَتَوْءَمَتُهُ قلِيمَا، وَآخِرُهُمْ عَبْدُ الْمُغِيثِ وَتَوْءَمَتُهُ أَمَةُ الْمُغِيثِ.\n\nوَأَمَّا \u003cspan class=\"isnad\">ابْنُ إِسْحَاقَ فَذُكِرَ عَنْه\u003c/span>ُ مَا قَدْ ذَكَرْتُ قَبْلُ، وَهُوَ أَنَّ جَمِيعَ مَا وَلَدَتْهُ حَوَّاءُ لآدَمَ لِصُلْبِهِ أَرْبَعُونَ مِنْ ذَكَرٍ وَأُنْثَى فِي عِشْرِينَ بَطْنًا، وَقَالَ: قَدْ بَلَغَنَا أَسْمَاءُ بَعْضِهِمْ وَلَمْ يَبْلُغْنَا بَعْضٌ.\n\n\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال\u003c/span>:\n\nفكان من بلغنا اسمه خمسة عشر رجلا وأربع نسوة، منهم قين وتوءمته، وهابيل وليوذا وأشوث بنت آدم وتوءمها، وشيث وتوءمته، وحزورة وتوءمها، على","bs":"\u003cp data-paragraph=\"145.1\">Odgovara se: U tome nema razilaženja među učenim prethodnicima našeg ummeta, kada je već neodrživo mišljenje onoga koji kaže da su bili od sinova Israilovih. Navedeno je da je Adem, alejhis-selam, oplakivao Habila kada ga je Kabil ubio i rekao — prema onome što \u003cspan class=\"isnad\">nam je pričao Ibn Humejd, koji je rekao: pričao nam je Selema, od Gijasa ibn Ibrahima, od Ebu Ishaka el-Hemdanija, koji je rekao: Ali ibn Ebu Talib, Allah mu lice počastio, rekao je:\u003c/span> „Kada je Ademov sin ubio brata, Adem ga je oplakivao i rekao:\u003c/p>\u003cp data-paragraph=\"145.2\">Promijeniše se zemlje i oni na njima — lice zemlje prašnjavo je i ružno.\u003cbr>Promijeni se sve što ima okus i boju — i malo ostade vedrine lijepoga lica.“\u003c/p>\u003cp data-paragraph=\"145.3\">Rekao je: „Ademu, alejhis-selam, odgovoreno je:\u003c/p>\u003cp data-paragraph=\"145.4\">Oče Habilov, obojica su ubijeni — živi je postao poput mrtvoga, zaklanog.\u003cbr>Došao je sa zlom od kojeg je strepio — pa je s njim došao vičući.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: drugi polustih posljednjeg stiha i veza zamjenica nisu sasvim jasni. Slika iz izvora prenesena je bez dopisivanja objašnjenja ili novih stihova.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"145.5\">Navedeno je da je Havva Ademu, alejhis-selam, rodila u stotinu dvadeset poroda. Prvi su bili Kabil i njegova sestra blizanka Kelima, a posljednji Abdulmugis i njegova sestra blizanka Emetulmugis.\u003c/p>\u003cp data-paragraph=\"145.6\">\u003cspan class=\"isnad\">Od Ibn Ishaka navedeno je ono što sam već prije spomenuo:\u003c/span> da je Havva Ademu rodila ukupno četrdeset njegove neposredne djece, muške i ženske, u dvadeset poroda. Rekao je: „Do nas su doprla imena nekih od njih, a nekih nisu.“\u003c/p>\u003cp data-paragraph=\"145.7\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao:\u003c/span> „Među onima čija su nam imena doprla bilo je petnaest muškaraca i četiri žene: Kajn i njegova sestra blizanka, Habil, Lejuza, Ešus, Ademova kćerka, i njen blizanac, Šis i njegova sestra blizanka, te Hazura i njen blizanac, u\u003c/p>","paragraphs":[{"id":"145.1","ar":"قِيلَ: لا خِلافَ بَيْنَ سَلَفِ عُلَمَاءِ أُمَّتِنَا في ذلك، إذا فَسَدَ قَوْلُ مَنْ قَالَ:\nكَانَا مِنْ بَنِي إِسْرَائِيلَ وَذُكِرَ أَنَّ قَابِيلَ لَمَّا قَتَلَ أَخَاهُ هابيل بكاه آدم ع فَقَالَ- فِيمَا حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنْ غِيَاثِ بْنِ إِبْرَاهِيمَ، عَنْ أَبِي إِسْحَاقَ الْهَمْدَانِيِّ، قَالَ: قَالَ عَلِيُّ بْنُ أَبِي طَالِبٍ كَرَّمَ اللَّهُ وَجْهَهُ: لَمَّا قَتَلَ ابْنُ آدَمَ أَخَاهُ بَكَاهُ آدَمُ، فَقَالَ:","ar_html":"قِيلَ: لا خِلافَ بَيْنَ سَلَفِ عُلَمَاءِ أُمَّتِنَا في ذلك، إذا فَسَدَ قَوْلُ مَنْ قَالَ:\nكَانَا مِنْ بَنِي إِسْرَائِيلَ وَذُكِرَ أَنَّ قَابِيلَ لَمَّا قَتَلَ أَخَاهُ هابيل بكاه آدم ع فَقَالَ- فِيمَا \u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا سَلَمَةُ، عَنْ غِيَاثِ بْنِ إِبْرَاهِيمَ، عَنْ أَبِي إِسْحَاقَ الْهَمْدَانِيِّ، قَالَ: قَالَ عَلِيُّ بْنُ أَبِي طَالِبٍ كَرَّمَ اللَّهُ وَجْهَه\u003c/span>ُ: لَمَّا قَتَلَ ابْنُ آدَمَ أَخَاهُ بَكَاهُ آدَمُ، فَقَالَ:","ar_isnad_ranges":[[200,388]],"bs":"Odgovara se: U tome nema razilaženja među učenim prethodnicima našeg ummeta, kada je već neodrživo mišljenje onoga koji kaže da su bili od sinova Israilovih. Navedeno je da je Adem, alejhis-selam, oplakivao Habila kada ga je Kabil ubio i rekao — prema onome što nam je pričao Ibn Humejd, koji je rekao: pričao nam je Selema, od Gijasa ibn Ibrahima, od Ebu Ishaka el-Hemdanija, koji je rekao: Ali ibn Ebu Talib, Allah mu lice počastio, rekao je: „Kada je Ademov sin ubio brata, Adem ga je oplakivao i rekao  وتوءمته، ثم ضرابيس بن آدم وتوءمته، ثم هذر بن آدم وتوءمته، ثم يحود بن آدم وتوءمته، ثم سندل بن آدم وتوءمته، ثم بارق بن آدم وتوءمته، كل رجل منهم تولد معه امرأة في بطنه الذي يحمل به فيه.\n\nوقد زعم أكثر علماء الفرس أن جيومرت هو آدم، وزعم بعضهم أنه ابن آدم لصلبه من حواء.\nوقال فيه غيرهم أقوالا كثيرة، يطول بذكر أقوالهم الكتاب، وتركنا ذكر ذلك إذ كان قصدنا في كتابنا هذا ذكر الملوك وأيامهم، وما قد شرطنا في كتابنا هذا أنا ذاكروه فيه، ولم يكن ذكر اختلاف المختلفين في نسب ملك من جنس ما أنشأنا له صنعة الكتاب، فإن ذكرنا من ذلك شيئا فلتعريف من ذكرنا، ليعرفه من لم يكن به عارفا، فأما ذكر الاختلاف في نسبه فإنه غير المقصود به في كتابنا هذا.\n\nوقد خالف علماء الفرس فيما قالوا من ذلك آخرون من غيرهم ممن زعم أنه آدم، ووافق علماء الفرس على اسمه وخالفه في عينه وصفته، فزعم أن","ar_html":"ثلاثين ومائه سنه من عمره ثم اباد بن آدم وتوءمته، ثم بالغ بن آدم وتوءمته، ثم أثاثي بن آدم وتوءمته، ثم توبه بن آدم وتوءمته، ثم بنان ابن آدم وتوءمته، ثم شبوبة بن آدم وتوءمته، ثم حيان بن آدم وتوءمته، ثم ضرابيس بن آدم وتوءمته، ثم هذر بن آدم وتوءمته، ثم يحود بن آدم وتوءمته، ثم سندل بن آدم وتوءمته، ثم بارق بن آدم وتوءمته، كل رجل منهم تولد معه امرأة في بطنه الذي يحمل به فيه.\n\nوقد زعم أكثر علماء الفرس أن جيومرت هو آدم، وزعم بعضهم أنه ابن آدم لصلبه من حواء.\n\nوقال فيه غيرهم أقوالا كثيرة، يطول بذكر أقوالهم الكتاب، وتركنا ذكر ذلك إذ كان قصدنا في كتابنا هذا ذكر الملوك وأيامهم، وما قد شرطنا في كتابنا هذا أنا ذاكروه فيه، ولم يكن ذكر اختلاف المختلفين في نسب ملك من جنس ما أنشأنا له صنعة الكتاب، فإن ذكرنا من ذلك شيئا فلتعريف من ذكرنا، ليعرفه من لم يكن به عارفا، فأما ذكر الاختلاف في نسبه فإنه غير المقصود به في كتابنا هذا.\n\nوقد خالف علماء الفرس فيما قالوا من ذلك آخرون من غيرهم ممن زعم أنه آدم، ووافق علماء الفرس على اسمه وخالفه في عينه وصفته، فزعم أن","bs":"\u003cp data-paragraph=\"146.1\">stotinu tridesetoj godini njegovog života; zatim Abad, Ademov sin, i njegova sestra blizanka; zatim Balig, Ademov sin, i njegova sestra blizanka; zatim Esasi, Ademov sin, i njegova sestra blizanka; zatim Tevba, Ademov sin, i njegova sestra blizanka; zatim Benan, Ademov sin, i njegova sestra blizanka; zatim Šebuba, Ademov sin, i njegova sestra blizanka; zatim Hajjan, Ademov sin, i njegova sestra blizanka; zatim Darabis, Ademov sin, i njegova sestra blizanka; zatim Hezer, Ademov sin, i njegova sestra blizanka; zatim Jehud, Ademov sin, i njegova sestra blizanka; zatim Sendel, Ademov sin, i njegova sestra blizanka; zatim Barik, Ademov sin, i njegova sestra blizanka. Sa svakim muškarcem među njima rođena je i žena u istom porodu u kojem je on nošen.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: rijetka imena iz ove liste prenesena su približno prema zapisu izvora; izgovor nije svuda označen. Popis i sva ponavljanja srodstva sačuvani su.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"146.2\">Većina perzijskih učenjaka tvrdi da je Džejumert Adem, a neki tvrde da je Ademov neposredni sin od Havve.\u003c/p>\u003cp data-paragraph=\"146.3\">Drugi su o njemu iznijeli mnogo mišljenja koja bi, kada bismo ih naveli, oduljila knjigu. Ostavili smo ih nespomenutim jer je naša namjera u ovoj knjizi navoditi kraljeve i njihova vremena i ono što smo u njoj postavili da ćemo navesti. Navođenje razilaženja o porijeklu nekog kralja ne pripada onome zbog čega smo počeli sastavljati knjigu. Ako nešto od toga spomenemo, to je radi predstavljanja onoga koga spominjemo, da ga upozna onaj ko ga nije poznavao. Razilaženje o njegovom porijeklu nije cilj ove naše knjige.\u003c/p>\u003cp data-paragraph=\"146.4\">Perzijskim učenjacima u onome što su o tome rekli usprotivili su se drugi koji nisu od njih, u vezi s tvrdnjom da je on Adem. Složili su se s perzijskim učenjacima o njegovom imenu, ali su se razlikovali o njegovom identitetu i svojstvima. Tvrdili su da je\u003c/p>","paragraphs":[{"id":"146.1","ar":"ثلاثين ومائه سنه من عمره ثم اباد بن آدم وتوءمته، ثم بالغ بن آدم وتوءمته، ثم أثاثي بن آدم وتوءمته، ثم توبه بن آدم وتوءمته، ثم بنان ابن آدم وتوءمته، ثم شبوبة بن آدم وتوءمته، ثم حيان بن آدم وتوءمته، ثم ضرابيس بن آدم وتو د السلاح، واتخذ الخيل، وأنه تجبر في آخر عمره، وتسمى بآدم، وقال: من سماني بغير هذا الاسم ضربت عنقه، وأنه تزوج ثلاثين امرأة، فكثر منهن نسله، وأن ماري ابنه وماريانة أخته، ممن كان ولد له في آخر عمره، فأعجب بهما وقدمهما، فصار الملوك بذلك السبب من نسلهما، وأن ملكه اتسع وعظم.\nوإنما ذكرت من أمر جيومرت في هذا الموضع ما ذكرت، لأنه لا تدافع بين علماء الأمم أن جيومرت هو أبو الفرس من العجم، وإنما اختلفوا فيه:\nهل هو آدم أبو البشر على ما قاله الذين ذكرنا قولهم أم هو غيره؟ ثم مع ذلك فلأن ملكه وملك أولاده لم يزل منتظما على سياق، متسقا بأرض المشرق وجبالها إلى أن قتل يزدجرد بن شهريار من ولد ولده بمرو- أبعده الله- أيام عثمان بن عفان رضي الله عنه، فتأريخ ما مضى من سني العالم على أعمار ملوكهم أسهل بيانا، وأوضح منارا منه على أعمار ملوك غيرهم من الأمم، إذ لا تعلم أمة من الأمم الذين ينتسبون الى آدم ع دامت لها المملكة، واتصل لهم الملك، وكانت لهم ملوك تجمعهم، ورءوس تحامي عنهم من ناوأهم، وتغالب بهم من عازهم، وتدفع ظالمهم عن مظلومهم، وتحملهم من الأمور على ما فيه حظهم","ar_html":"جيومرت الذى زعمت الفرس انه آدم ع انما هو جامر بن يافث ابن نوح، وأنه كان معمرا سيدا، نزل جبل دنباوند من جبال طبرستان من أرض المشرق، وتملك بها وبفارس، ثم عظم أمره وأمر ولده، حتى ملكوا بابل، وملكوا في بعض الأوقات الأقاليم كلها، وأن جيومرت منع من البلاد ما صار إليه، وابتنى المدن والحصون وعمرها، وأعد السلاح، واتخذ الخيل، وأنه تجبر في آخر عمره، وتسمى بآدم، وقال: من سماني بغير هذا الاسم ضربت عنقه، وأنه تزوج ثلاثين امرأة، فكثر منهن نسله، وأن ماري ابنه وماريانة أخته، ممن كان ولد له في آخر عمره، فأعجب بهما وقدمهما، فصار الملوك بذلك السبب من نسلهما، وأن ملكه اتسع وعظم.\n\nوإنما ذكرت من أمر جيومرت في هذا الموضع ما ذكرت، لأنه لا تدافع بين علماء الأمم أن جيومرت هو أبو الفرس من العجم، وإنما اختلفوا فيه:\nهل هو آدم أبو البشر على ما قاله الذين ذكرنا قولهم أم هو غيره؟ ثم مع ذلك فلأن ملكه وملك أولاده لم يزل منتظما على سياق، متسقا بأرض المشرق وجبالها إلى أن قتل يزدجرد بن شهريار من ولد ولده بمرو- أبعده الله- أيام عثمان بن عفان رضي الله عنه، فتأريخ ما مضى من سني العالم على أعمار ملوكهم أسهل بيانا، وأوضح منارا منه على أعمار ملوك غيرهم من الأمم، إذ لا تعلم أمة من الأمم الذين ينتسبون الى آدم ع دامت لها المملكة، واتصل لهم الملك، وكانت لهم ملوك تجمعهم، ورءوس تحامي عنهم من ناوأهم، وتغالب بهم من عازهم، وتدفع ظالمهم عن مظلومهم، وتحملهم من الأمور على ما فيه حظهم","bs":"\u003cp data-paragraph=\"147.1\">Džejumert, za kojeg Perzijanci tvrde da je Adem, alejhis-selam, zapravo Džamir ibn Jafis ibn Nuh. Bio je dugovječan poglavar. Nastanio se na planini Dunbavend, jednoj od taberistanskih planina na istoku, i zavladao tamo i Perzijom. Zatim je porastao njegov značaj i značaj njegovih potomaka, sve dok nisu zavladali Babilonom i u nekim razdobljima svim oblastima. Džejumert je branio krajeve koje je stekao, gradio i nastanjivao gradove i tvrđave, pripremao oružje i držao konje. Na kraju života osilio se i nazvao sebe Ademom. Rekao je: „Ko me nazove drugim imenom, odrubit ću mu glavu.“ Oženio se trideset žena i od njih imao brojno potomstvo. Njegov sin Mari i njegova sestra Marijana rođeni su mu pred kraj života. Zavolio ih je i dao im prednost, pa su iz tog razloga kraljevi potekli od njihova potomstva. Njegovo se kraljevstvo proširilo i uvećalo.\u003c/p>\u003cp data-paragraph=\"147.2\">O Džejumertu sam na ovome mjestu naveo to što sam naveo zato što među učenjacima različitih naroda nema osporavanja da je Džejumert otac Perzijanaca među nearapskim narodima. Razilaze se samo je li on Adem, otac čovječanstva, kako kažu oni čije smo mišljenje spomenuli, ili neko drugi. Osim toga, njegova vlast i vlast njegovih potomaka neprestano su se nastavljale uređeno i usklađeno na istoku i njegovim planinama, sve dok u Mervu nije ubijen Jezdedžird ibn Šehrijar, potomak njegovih potomaka — Allah ga udaljio — u vrijeme Osmana ibn Affana, radijallahu anhu. Zato je prikazivanje proteklih godina svijeta prema životima njihovih kraljeva jednostavnije i jasnije nego prema životima kraljeva drugih naroda. Nije poznat nijedan drugi narod koji se pripisuje Ademu, alejhis-selam, kojem je kraljevstvo toliko trajalo i vlast se nastavljala, koji je imao kraljeve što su ga okupljali i poglavare koji su ga branili od neprijatelja, borili se pomoću njega protiv suparnika, štitili potlačene među njima od njihovih tlačitelja i vodili ih u onome u čemu je njihova korist\u003c/p>","paragraphs":[{"id":"147.1","ar":"جيومرت الذى زعمت الفرس انه آدم ع انما هو جامر بن يافث ابن نوح، وأنه كان معمرا سيدا، نزل جبل دنباوند من جبال طبرستان من أرض المشرق، وتملك بها وبفارس، ثم عظم أمره وأمر ولده، حتى ملكوا بابل، وملكوا في بعض الأوقات الأقاليم كلها، وأن جيومرت منع من البلاد ما صار إليه، وابتنى المدن والحصون وعمرها، وأعد السلاح، واتخذ الخيل، وأنه تجبر في آخر عمره، وتسمى بآدم، وقال: من سماني بغير هذا الاسم ضربت عنقه، وأنه تزوج ثلاثين امرأة، فكثر منهن نسله، وأن ماري ابنه وماريانة أخته، ممن كان ولد له في آخر عمره، فأعجب بهما وقدمهما، فصار الملوك بذلك السبب من نسلهما، وأن ملكه اتسع وعظم.","ar_html":"جيومرت الذى زعمت الفرس انه آدم ع انما هو جامر بن يافث ابن نوح، وأنه كان معمرا سيدا، نزل جبل دنباوند من جبال طبرستان من أرض المشرق، وتملك بها وبفارس، ثم عظم أمره وأمر ولده، حتى ملكوا بابل، وملكوا في بعض الأوقات الأقاليم كلها، وأن جيومرت منع من البلاد ما صار إليه، وابتنى المدن والحصون وعمرها، وأعد السلاح، واتخذ الخيل، وأنه تجبر في آخر عمره، وتسمى بآدم، وقال: من سماني بغير هذا الاسم ضربت عنقه، وأنه تزوج ثلاثين امرأة، فكثر منهن نسله، وأن ماري ابنه وماريانة أخته، ممن كان ولد له في آخر عمره، فأعجب بهما وقدمهما، فصار الملوك بذلك السبب من نسلهما، وأن ملكه اتسع وعظم.","ar_isnad_ranges":[],"bs":"Džejumert, za kojeg Perzijanci tvrde da je Adem, alejhis-selam, zapravo Džamir ibn Jafis ibn Nuh. Bio je dugovječan poglavar. Nastanio se na planini Dunbavend, jednoj od taberistanskih planina na istoku, i zavladao tamo i Perzijom. Zatim je porastao njegov značaj i značaj njegovih potomaka, sve dok nisu zavladali Babilonom i u nekim razdobljima svim oblastima. Džejumert je branio krajeve koje je stekao, gradio i nastanjivao gradove i tvrđave, pripremao oružje i držao konje. Na kraju života osilio se i nazvao sebe Ademom. Rekao je: „Ko me nazove drugim i  vlast i vlast njegovih potomaka neprestano su se nastavljale uređeno i usklađeno na istoku i njegovim planinama, sve dok u Mervu nije ubijen Jezdedžird ibn Šehrijar, potomak njegovih potomaka — Allah ga udaljio — u vrijeme Osmana ibn Affana, radijallahu anhu. Zato je prikazivanje proteklih godina svijeta prema životima njihovih kraljeva jednostavnije i jasnije nego prema životima kraljeva drugih naroda. Nije poznat nijedan drugi narod koji se pripisuje Ademu, alejhis-selam, kojem je kraljevstvo toliko trajalo i vlast se nastavljala, koji je imao kraljeve što su ga okupljali i poglavare koji su ga branili od neprijatelja, borili se pomoću njega protiv suparnika, štitili potlačene među njima od njihovih tlačitelja i vodili ih u onome u čemu je njihova korist","bs_isnad_count":0}],"notes":[]},{"n":148,"ar":"على اتصال ودوام ونظام، يأخذ ذلك آخرهم عن أولهم، وغابرهم عن سالفهم- سواهم، فالتأريخ على أعمار ملوكهم أصح مخرجا، وأحسن وضوحا.\nوأنا ذاكر ما انتهى إلينا من القول في عمر آدم ع وأعمار من كان بعده من ولده الذين خلفوه في النبوة والملك، على قول من خالف قول الفرس الذين زعموا أنه جيومرت، وعلى قول من قال: إنه هو جيومرت أبو الفرس، وذاكر ما اختلفوا فيه من أمرهم إلى الحال التي اجتمعوا عليها، فاتفقوا على من ملك منهم في زمان بعينه أنه كان هو الملك في ذلك الزمان إِنْ شَاءَ اللَّهُ، وَلا حول وَلا قوة إلا بالله، ثم سائق ذلك كذلك إلى زماننا هذا.\nونرجع الآن إلى الزيادة في الإبانة عن خطإ قول من قال: إن أول ميت كان في أول الارض آدم، وإنكاره الذين قص الله نبأهما في قوله:\n\n«وَاتْلُ عَلَيْهِمْ نَبَأَ ابْنَيْ آدَمَ بِالْحَقِّ إِذْ قَرَّبا قُرْباناً» ، أن يكونا من صلب آدم من أجل ذلك.\nفَحَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الصَّمَدِ بْنُ عَبْدِ الْوَارِثِ، قال: حدثنا عُمَرُ بْنُ إِبْرَاهِيمَ، عَنْ قَتَادَةَ، عَنِ الْحَسَنِ، عن سمره بن جندب، [عن النبي ع قَالَ: كَانَتْ حَوَّاءُ لا يَعِيشُ لَهَا وَلَدٌ، فَنَذَرَتْ لِئَنْ عَاشَ لَهَا وَلَدٌ لَتُسَمِّيَنَّهُ عَبْدَ الْحَارِثِ، فَعَاشَ لَهَا وَلَدٌ فَسَمَّتْهُ عَبْدَ الْحَارِثِ، وانما كان ذلك عن وحى الشيطان] .\nوحدثنا ابن حميد، قال: حدثنا سلمة، عن ابْنِ إِسْحَاقَ، عَنْ دَاوُدَ بْنِ الْحُصَيْنِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: كَانَتْ حَوَّاءُ تَلِدُ لآدَمَ فَتُعَبِّدُهُمُ اللَّهَ عَزَّ وَجَلَّ وَتُسَمِّيهِمْ: عَبْدَ اللَّهِ، وَعُبَيْدَ اللَّهِ، وَنَحْوَ ذَلِكَ،","ar_html":"على اتصال ودوام ونظام، يأخذ ذلك آخرهم عن أولهم، وغابرهم عن سالفهم- سواهم، فالتأريخ على أعمار ملوكهم أصح مخرجا، وأحسن وضوحا.\n\nوأنا ذاكر ما انتهى إلينا من القول في عمر آدم ع وأعمار من كان بعده من ولده الذين خلفوه في النبوة والملك، على قول من خالف قول الفرس الذين زعموا أنه جيومرت، وعلى قول من قال: إنه هو جيومرت أبو الفرس، وذاكر ما اختلفوا فيه من أمرهم إلى الحال التي اجتمعوا عليها، فاتفقوا على من ملك منهم في زمان بعينه أنه كان هو الملك في ذلك الزمان إِنْ شَاءَ اللَّهُ، وَلا حول وَلا قوة إلا بالله، ثم سائق ذلك كذلك إلى زماننا هذا.\n\nونرجع الآن إلى الزيادة في الإبانة عن خطإ قول من قال: إن أول ميت كان في أول الارض آدم، وإنكاره الذين قص الله نبأهما في قوله:\n\n«وَاتْلُ عَلَيْهِمْ نَبَأَ ابْنَيْ آدَمَ بِالْحَقِّ إِذْ قَرَّبا قُرْباناً» ، أن يكونا من صلب آدم من أجل ذلك.\n\nفَ\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا عَبْدُ الصَّمَدِ بْنُ عَبْدِ الْوَارِثِ، قال: حدثنا عُمَرُ بْنُ إِبْرَاهِيمَ، عَنْ قَتَادَةَ، عَنِ الْحَسَنِ، عن سمره بن جندب، [عن النبي ع قَال\u003c/span>َ: كَانَتْ حَوَّاءُ لا يَعِيشُ لَهَا وَلَدٌ، فَنَذَرَتْ لِئَنْ عَاشَ لَهَا وَلَدٌ لَتُسَمِّيَنَّهُ عَبْدَ الْحَارِثِ، فَعَاشَ لَهَا وَلَدٌ فَسَمَّتْهُ عَبْدَ الْحَارِثِ، وانما كان ذلك عن وحى الشيطان] .\n\n\u003cspan class=\"isnad\">وحدثنا ابن حميد، قال: حدثنا سلمة، عن ابْنِ إِسْحَاقَ، عَنْ دَاوُدَ بْنِ الْحُصَيْنِ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ: كَانَتْ حَوَّاءُ تَلِدُ لآدَمَ فَتُعَبِّدُهُمُ اللَّهَ عَزَّ وَجَلَّ وَتُسَمِّيهِمْ: عَبْدَ اللَّهِ، وَعُبَيْدَ اللَّهِ، وَنَحْوَ ذَلِكَ،","bs":"\u003cp data-paragraph=\"148.1\">neprekinuto, trajno i uređeno, tako da posljednji preuzimaju od prvih, a kasniji od ranijih — osim njih. Zato je datiranje prema životima njihovih kraljeva pouzdanije i jasnije.\u003c/p>\u003cp data-paragraph=\"148.2\">Navest ću ono što je do nas došlo o životnom vijeku Adema, alejhis-selam, i životima onih njegovih potomaka poslije njega koji su ga naslijedili u vjerovjesništvu i vlasti, prema mišljenju onoga koji se protivi Perzijancima što tvrde da je on Džejumert i prema mišljenju onoga koji kaže da je on Džejumert, otac Perzijanaca. Navest ću i ono u čemu su se o njima razilazili, sve do stanja u kojem su se složili i usaglasili ko je među njima u određenom vremenu bio kralj, ako Allah htjedne. Nema snage ni moći osim u Allaha. Zatim ću tako nastaviti sve do našeg vremena.\u003c/p>\u003cp data-paragraph=\"148.3\">Sada se vraćamo daljnjem razjašnjenju greške onoga koji kaže da je prvi umrli na početku Zemlje bio Adem i zato poriče da su dvojica o kojima je Allah ispričao vijest u riječima: „I kazuj im istinito vijest o dvojici Ademovih sinova: kada su prinijeli žrtvu“, bili njegovi neposredni sinovi. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Maida, 5:27, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"148.4\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Beššar, koji je rekao: pričao nam je Abdussamed ibn Abdulvaris, koji je rekao: pričao nam je Omer ibn Ibrahim, od Katade, od Hasena, od Semure ibn Džunduba, od Vjerovjesnika, alejhis-selam, koji je rekao:\u003c/span> „Havvi nijedno dijete nije ostajalo živo, pa se zavjetovala da će, ako joj dijete ostane živo, nazvati ga Abdulharis. Jedno joj je dijete ostalo živo i nazvala ga je Abdulharis. To je bilo samo po šejtanovom došaptavanju.“\u003c/p>\u003cp data-paragraph=\"148.5\">\u003cspan class=\"isnad\">Pričao nam je i Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, od Davuda ibn el-Husajna, od Ikrime, od Ibn Abbasa, koji je rekao:\u003c/span> „Havva je Ademu rađala djecu i pripisivala ih robovanju Allahu, Silnom i Uzvišenom, dajući im imena poput Abdullah, Ubejdullah i slična,\u003c/p>","paragraphs":[{"id":"148.1","ar":"على اتصال ودوام ونظام، يأخذ ذلك آخرهم عن أولهم، وغابرهم عن سالفهم- سواهم، فالتأريخ على أعمار ملوكهم أصح مخرجا، وأحسن وضوحا.","ar_html":"على اتصال ودوام ونظام، يأخذ ذلك آخرهم عن أولهم، وغابرهم عن سالفهم- سواهم، فالتأريخ على أعمار ملوكهم أصح مخرجا، وأحسن وضوحا.","ar_isnad_ranges":[],"bs":"neprekinuto, trajno i uređeno, tako da posljednji preuzimaju od prvih, a kasniji od ranijih — osim njih. Zato je datiranje prema životima njihovih kraljeva pouzdanije i jasnije.","bs_html":"neprekinuto, trajno i uređeno, tako da posljednji preuzimaju od prvih, a kasniji od ranijih — osim njih. Zato je datiranje prema životima njihovih kraljeva pouzdanije i jasnije.","bs_isnad_count":0},{"id":"148.2","ar":"وأنا ذاكر ما انتهى إلينا من القول في عمر آدم ع وأعمار من كان بعده من ولده الذين خلفوه في النبوة والملك، على قول من خالف قول الفرس الذين زعموا أنه جيومرت، وعلى قول من قال: إنه هو جيومرت أبو الفرس، وذاكر ما اختلفوا فيه من أمرهم إلى الحال التي اجتمعوا عليها، فاتفقوا على من ملك منهم في زمان بعينه أنه كان هو الملك في ذلك الزمان إِنْ شَاءَ اللَّهُ، وَلا حول وَلا قوة إلا بالله، ثم سائق ذلك كذلك إلى زماننا هذا.","ar_html":"وأنا ذاكر ما انتهى إلينا من القول في عمر آدم ع وأعمار من كان بعده من ولده الذين خلفوه في النبوة والملك، على قول من خالف قول الفرس الذين زعموا أنه جيومرت، وعلى قول من قال: إنه هو جيومرت أبو الفرس، وذاكر ما اختلفوا فيه من أمرهم إلى الحال التي اجتمعوا عليها، فاتفقوا على من ملك منهم في زمان بعينه أنه كان هو الملك في ذلك الزمان إِنْ شَاءَ اللَّهُ، وَلا حول وَلا قوة إلا بالله، ثم سائق ذلك كذلك إلى زماننا هذا.","ar_isnad_ranges":[],"bs":"Navest ću ono što je do nas došlo o životnom vijeku Adema, alejhis-selam, i životima onih njegovih potomaka poslije njega koji su ga naslijedili u vjerovjesništvu i vlasti, prema mišljenju onoga koji se protivi Perzijancima što tvrde da je on Džejumert i prema mišljenju onoga koji kaže da je on Džejumert, otac Perzijanaca. Navest ću i ono u čemu su se o njima razilazili, sve do stanja u kojem su se složili i usaglasili ko je među njim
