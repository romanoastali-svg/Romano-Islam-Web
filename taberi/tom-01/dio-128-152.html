أتي البيت الحرام الذي اهبط","ar_html":"ثم أمر آدم ع- فيما ذكر- أن يأتي البيت الحرام الذي اهبط","ar_isnad_ranges":[],"bs":"Zatim je Ademu, alejhis-selam, prema onome što je navedeno, naređeno da dođe Svetom Hramu koji mu je spušten","bs_html":"Zatim je Ademu, alejhis-selam, prema onome što je navedeno, naređeno da dođe Svetom Hramu koji mu je spušten","bs_isnad_count":0}],"notes":[]},{"n":132,"ar":"له إلى الأرض، فيطوف به كما كان يرى الملائكة تطوف حول عرش الله، وكان ذلك ياقوتة واحدة أو درة واحدة، كما حدثني الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن أبان، أن البيت أهبط ياقوتة واحدة أو درة واحدة، حتى إذا أغرق الله قوم نوح رفعه وبقي أساسه، فبوأه الله عز وجل لإبراهيم فبناه، وقد ذكرت الأخبار الواردة بذلك فيما مضى قبل.\nفذكر ان آدم ع بكى واشتد بكاؤه على خطيئته، وندم عليها، وسأل الله عز وجل قبول توبته، وغفران خطيئته، فقال في مسألته إياه: ما سأل من ذلك، كما حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا ابْنُ عَطِيَّةَ، عَنْ قَيْسٍ، عَنِ ابْنِ أَبِي لَيْلَى، عَنِ الْمِنْهَالِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ: «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ فَتابَ عَلَيْهِ» قَالَ: أَيْ رَبِّ، أَلَمْ تَخْلُقْنِي بِيَدِكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَنْفُخْ فِيَّ مِنْ رُوحِكَ؟\nقَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تُسْكِنِّي جَنَّتَكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَسْبِقْ رَحْمَتُكَ غَضَبَكَ؟ قَالَ: بَلَى، قَالَ: أَرَأَيْتَ إِنْ تُبْتُ وَأَصْلَحْتُ أَرَاجِعِي أَنْتَ إِلَى الْجَنَّةِ؟ قَالَ: بَلَى، قَالَ: فَهُوَ قَوْلُهُ تعالى: «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» .\n\nحَدَّثَنِي بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زريع، عن سعيد، عن قتادة، قوله تعالى «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» ذكر لنا أنه قال:\nيا رب: أرأيت إن أنا تبت وأصلحت! قال: إذا أرجعك إلى الجنة، قال:\n\nوقال الحسن: إنهما قالا: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .\n\nحدثنا أحمد بن إسحاق الأهوازي، قال: حدثنا أبو أحمد، قال: حَدَّثَنَا سفيان وقيس، عن خصيف، عن مجاهد، في قوله عز وجل:","ar_html":"له إلى الأرض، فيطوف به كما كان يرى الملائكة تطوف حول عرش الله، وكان ذلك ياقوتة واحدة أو درة واحدة، كما \u003cspan class=\"isnad\">حدثني الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن أبان\u003c/span>، أن البيت أهبط ياقوتة واحدة أو درة واحدة، حتى إذا أغرق الله قوم نوح رفعه وبقي أساسه، فبوأه الله عز وجل لإبراهيم فبناه، وقد ذكرت الأخبار الواردة بذلك فيما مضى قبل.\n\nفذكر ان آدم ع بكى واشتد بكاؤه على خطيئته، وندم عليها، وسأل الله عز وجل قبول توبته، وغفران خطيئته، فقال في مسألته إياه: ما سأل من ذلك، كما \u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا ابْنُ عَطِيَّةَ، عَنْ قَيْسٍ، عَنِ ابْنِ أَبِي لَيْلَى، عَنِ الْمِنْهَالِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ: «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ فَتابَ عَلَيْهِ» قَالَ: أَيْ رَبِّ، أَلَمْ تَخْلُقْنِي بِيَدِكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَنْفُخْ فِيَّ مِنْ رُوحِكَ؟\nقَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تُسْكِنِّي جَنَّتَكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَسْبِقْ رَحْمَتُكَ غَضَبَكَ؟ قَالَ: بَلَى، قَالَ: أَرَأَيْتَ إِنْ تُبْتُ وَأَصْلَحْتُ أَرَاجِعِي أَنْتَ إِلَى الْجَنَّةِ؟ قَالَ: بَلَى، قَالَ: فَهُوَ قَوْلُهُ تعالى: «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» .\n\n\u003cspan class=\"isnad\">حَدَّثَنِي بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زريع، عن سعيد، عن قتادة\u003c/span>، قوله تعالى «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» ذكر لنا أنه قال:\nيا رب: أرأيت إن أنا تبت وأصلحت! قال: إذا أرجعك إلى الجنة، قال:\n\n\u003cspan class=\"isnad\">وقال الحسن\u003c/span>: إنهما قالا: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .\n\n\u003cspan class=\"isnad\">حدثنا أحمد بن إسحاق الأهوازي، قال: حدثنا أبو أحمد، قال: حَدَّثَنَا سفيان وقيس، عن خصيف، عن مجاهد\u003c/span>، في قوله عز وجل:","bs":"\u003cp data-paragraph=\"132.1\">na Zemlju i da ga obilazi kao što je viđao meleke kako obilaze oko Allahovog Arša. Bio je to jedan rubin ili jedan biser, kako \u003cspan class=\"isnad\">mi je pričao Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Ebana:\u003c/span> „Hram je spušten kao jedan rubin ili jedan biser. Kada je Allah potopio Nuhov narod, podigao ga je, a njegovi temelji ostali su. Allah, Silan i Uzvišen, odredio ih je Ibrahimu, pa ga je izgradio.“ Već sam ranije naveo predaje koje govore o tome.\u003c/p>\u003cp data-paragraph=\"132.2\">Navedeno je da je Adem, alejhis-selam, plakao, gorko oplakivao svoj grijeh, kajao se zbog njega i molio Allaha, Silnog i Uzvišenog, da mu primi pokajanje i oprosti grijeh. U svojoj molbi izgovorio je ono što je tražio, kako \u003cspan class=\"isnad\">nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Ibn Atijja, od Kajsa, od Ibn Ebu Lejle, od Minhala, od Seida ibn Džubejra, od Ibn Abbasa,\u003c/span> o riječima: „Adem je od svoga Gospodara primio riječi, pa mu je On prihvatio pokajanje.“ Rekao je: „‘Gospodaru moj, zar me nisi stvorio Svojom rukom?’ Odgovorio je: ‘Jesam.’ Rekao je: ‘Gospodaru moj, zar u mene nisi udahnuo od Svoga Duha?’ Odgovorio je: ‘Jesam.’ Rekao je: ‘Gospodaru moj, zar me nisi nastanio u Svome Džennetu?’ Odgovorio je: ‘Jesam.’ Rekao je: ‘Gospodaru moj, zar Tvoja milost nije prethodila Tvojoj srdžbi?’ Odgovorio je: ‘Jeste.’ Rekao je: ‘Reci mi, ako se pokajem i popravim, hoćeš li me vratiti u Džennet?’ Odgovorio je: ‘Hoću.’“ Rekao je: „To su Njegove, Uzvišeni je On, riječi: ‘Adem je od svoga Gospodara primio riječi.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"132.3\">\u003cspan class=\"isnad\">Pričao mi je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, od Seida, od Katade,\u003c/span> o riječima Uzvišenog: „Adem je od svoga Gospodara primio riječi.“ „Navedeno nam je da je rekao: ‘Gospodaru moj, reci mi, ako se pokajem i popravim?’ Odgovorio je: ‘Tada ću te vratiti u Džennet.’“ Rekao je: „\u003cspan class=\"isnad\">Hasen je rekao:\u003c/span> ‘Njih dvoje rekli su: Gospodaru naš, sami smo sebi nepravdu učinili. Ako nam ne oprostiš i ne smiluješ nam se, sigurno ćemo biti među gubitnicima.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dio; El-A‘raf, 7:23.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"132.4\">\u003cspan class=\"isnad\">Pričao nam je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričali su nam Sufjan i Kajs, od Husajfa, od Mudžahida,\u003c/span> o riječima Njega, Silnog i Uzvišenog:\u003c/p>","paragraphs":[{"id":"132.1","ar":"له إلى الأرض، فيطوف به كما كان يرى الملائكة تطوف حول عرش الله، وكان ذلك ياقوتة واحدة أو درة واحدة، كما حدثني الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن أبان، أن البيت أهبط ياقوتة واحدة أو درة واحدة، حتى إذا أغرق الله قوم نوح رفعه وبقي أساسه، فبوأه الله عز وجل لإبراهيم فبناه، وقد ذكرت الأخبار الواردة بذلك فيما مضى قبل.","ar_html":"له إلى الأرض، فيطوف به كما كان يرى الملائكة تطوف حول عرش الله، وكان ذلك ياقوتة واحدة أو درة واحدة، كما \u003cspan class=\"isnad\">حدثني الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن أبان\u003c/span>، أن البيت أهبط ياقوتة واحدة أو درة واحدة، حتى إذا أغرق الله قوم نوح رفعه وبقي أساسه، فبوأه الله عز وجل لإبراهيم فبناه، وقد ذكرت الأخبار الواردة بذلك فيما مضى قبل.","ar_isnad_ranges":[[103,173]],"bs":"na Zemlju i da ga obilazi kao što je viđao meleke kako obilaze oko Allahovog Arša. Bio je to jedan rubin ili jedan biser, kako mi je pričao Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Ebana: „Hram je spušten kao jedan rubin ili jedan biser. Kada je Allah potopio Nuhov narod, podigao ga je, a njegovi temelji ostali su. Allah, Silan i Uzvišen, odredio ih je Ibrahimu, pa ga je izgradio.“ Već sam ranije naveo predaje koje govore o tome.","bs_html":"na Zemlju i da ga obilazi kao što je viđao meleke kako obilaze oko Allahovog Arša. Bio je to jedan rubin ili jedan biser, kako \u003cspan class=\"isnad\">mi je pričao Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Ebana:\u003c/span> „Hram je spušten kao jedan rubin ili jedan biser. Kada je Allah potopio Nuhov narod, podigao ga je, a njegovi temelji ostali su. Allah, Silan i Uzvišen, odredio ih je Ibrahimu, pa ga je izgradio.“ Već sam ranije naveo predaje koje govore o tome.","bs_isnad_count":1},{"id":"132.2","ar":"فذكر ان آدم ع بكى واشتد بكاؤه على خطيئته، وندم عليها، وسأل الله عز وجل قبول توبته، وغفران خطيئته، فقال في مسألته إياه: ما سأل من ذلك، كما حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا ابْنُ عَطِيَّةَ، عَنْ قَيْسٍ، عَنِ ابْنِ أَبِي لَيْلَى، عَنِ الْمِنْهَالِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ: «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ فَتابَ عَلَيْهِ» قَالَ: أَيْ رَبِّ، أَلَمْ تَخْلُقْنِي بِيَدِكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَنْفُخْ فِيَّ مِنْ رُوحِكَ؟\nقَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تُسْكِنِّي جَنَّتَكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَسْبِقْ رَحْمَتُكَ غَضَبَكَ؟ قَالَ: بَلَى، قَالَ: أَرَأَيْتَ إِنْ تُبْتُ وَأَصْلَحْتُ أَرَاجِعِي أَنْتَ إِلَى الْجَنَّةِ؟ قَالَ: بَلَى، قَالَ: فَهُوَ قَوْلُهُ تعالى: «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» .","ar_html":"فذكر ان آدم ع بكى واشتد بكاؤه على خطيئته، وندم عليها، وسأل الله عز وجل قبول توبته، وغفران خطيئته، فقال في مسألته إياه: ما سأل من ذلك، كما \u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا ابْنُ عَطِيَّةَ، عَنْ قَيْسٍ، عَنِ ابْنِ أَبِي لَيْلَى، عَنِ الْمِنْهَالِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ: «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ فَتابَ عَلَيْهِ» قَالَ: أَيْ رَبِّ، أَلَمْ تَخْلُقْنِي بِيَدِكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَنْفُخْ فِيَّ مِنْ رُوحِكَ؟\nقَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تُسْكِنِّي جَنَّتَكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَسْبِقْ رَحْمَتُكَ غَضَبَكَ؟ قَالَ: بَلَى، قَالَ: أَرَأَيْتَ إِنْ تُبْتُ وَأَ  Odgovorio je: ‘Jesam.’ Rekao je: ‘Gospodaru moj, zar Tvoja milost nije prethodila Tvojoj srdžbi?’ Odgovorio je: ‘Jeste.’ Rekao je: ‘Reci mi, ako se pokajem i popravim, hoćeš li me vratiti u Džennet?’ Odgovorio je: ‘Hoću.’“ Rekao je: „To su Njegove, Uzvišeni je On, riječi: ‘Adem je od svoga Gospodara primio riječi.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dijelovi.⟧\u003c/span>","bs_isnad_count":1},{"id":"132.3","ar":"حَدَّثَنِي بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زريع، عن سعيد، عن قتادة، قوله تعالى «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» ذكر لنا أنه قال:\nيا رب: أرأيت إن أنا تبت وأصلحت! قال: إذا أرجعك إلى الجنة، قال:\n\nوقال الحسن: إنهما قالا: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .","ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زريع، عن سعيد، عن قتادة\u003c/span>، قوله تعالى «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» ذكر لنا أنه قال:\nيا رب: أرأيت إن أنا تبت وأصلحت! قال: إذا أرجعك إلى الجنة، قال:\n\n\u003cspan class=\"isnad\">وقال الحسن\u003c/span>: إنهما قالا: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .","ar_isnad_ranges":[[0,86],[221,231]],"bs":"Pričao mi je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, od Seida, od Katade, o riječima Uzvišenog: „Adem je od svoga Gospodara primio riječi.“ „Navedeno nam je da je rekao: ‘Gospodaru moj, reci mi, ako se pokajem i popravim?’ Odgovorio je: ‘Tada ću te vratiti u Džennet.’“ Rekao je: „Hasen je rekao: ‘Njih dvoje rekli su: Gospodaru naš, sami smo sebi nepravdu učinili. Ako nam ne oprostiš i ne smiluješ nam se, sigurno ćemo biti među gubitnicima.’“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dio; El-A‘raf, 7:23.⟧","bs_html":"\u003cspan class=\"isnad\">Pričao mi je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, od Seida, od Katade,\u003c/span> o riječima Uzvišenog: „Adem je od svoga Gospodara primio riječi.“ „Navedeno nam je da je rekao: ‘Gospodaru moj, reci mi, ako se pokajem i popravim?’ Odgovorio je: ‘Tada ću te vratiti u Džennet.’“ Rekao je: „\u003cspan class=\"isnad\">Hasen je rekao:\u003c/span> ‘Njih dvoje rekli su: Gospodaru naš, sami smo sebi nepravdu učinili. Ako nam ne oprostiš i ne smiluješ nam se, sigurno ćemo biti među gubitnicima.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dio; El-A‘raf, 7:23.⟧\u003c/span>","bs_isnad_count":2},{"id":"132.4","ar":"حدثنا أحمد بن إسحاق الأهوازي، قال: حدثنا أبو أحمد، قال: حَدَّثَنَا سفيان وقيس، عن خصيف، عن مجاهد، في قوله عز وجل:","ar_html":"\u003cspan class=\"isnad\">حدثنا أحمد بن إسحاق الأهوازي، قال: حدثنا أبو أحمد، قال: حَدَّثَنَا سفيان وقيس، عن خصيف، عن مجاهد\u003c/span>، في قوله عز وجل:","ar_isnad_ranges":[[0,96]],"bs":"Pričao nam je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričali su nam Sufjan i Kajs, od Husajfa, od Mudžahida, o riječima Njega, Silnog i Uzvišenog:","bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričali su nam Sufjan i Kajs, od Husajfa, od Mudžahida,\u003c/span> o riječima Njega, Silnog i Uzvišenog:","bs_isnad_count":1}],"notes":[]},{"n":133,"ar":"«فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» قال: قوله: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .\nحَدَّثَنِي الحارث، قال: حدثنا ابن سعد، قال: أخبرنا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أَخْبَرَنَا أَبِي، عَنْ أَبِي صَالِحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أَنْزَلَ آدَمُ مَعَهُ حِينَ أُهْبِطَ مِنَ الْجَنَّةِ الْحَجَرَ الأَسْوَدَ، وَكَانَ أَشَدَّ بَيَاضًا مِنَ الثَّلْجِ، وَبَكَى آدَمُ وَحَوَّاءُ عَلَى مَا فَاتَهُمَا- يَعْنِي مِنْ نَعِيمِ الْجَنَّةِ- مِائَتَيْ سَنَةٍ، وَلَمْ يَأْكُلا وَلَمْ يَشْرَبَا أَرْبَعِينَ يَوْمًا، ثُمَّ أَكَلا وَشَرِبَا، وَهُمَا يَوْمَئِذٍ عَلَى بُوذَ، الْجَبَلِ الَّذِي أُهْبِطَ عَلَيْهِ آدَمُ وَلَمْ يَقْرَبْ حَوَّاءَ مِائَةَ سَنَةٍ.\nحَدَّثَنَا أبو همام، قال: حدثني أبي، قال: حدثني زياد بن خيثمة، عن أبي يحيى بائع القت، قال: قال لي مجاهد، ونحن جلوس في المسجد: هل ترى هذا؟ قلت: يا أبا الحجاج، الحجر؟ قال: كذلك تقول؟\nقلت: او ليس حجرا! قال: فو الله لحدثني عبد الله بن عباس أنها ياقوتة بيضاء، خرج بها آدم من الجنة، كان يمسح بها دموعه، وأن آدم لم ترقأ دموعه منذ خرج من الجنة حتى رجع إليها ألفي سنة، وما قدر منه إبليس على شيء، فقلت له: يا أبا الحجاج، فمن أي شيء اسود؟ قال: كان الْحُيَّضُ يلمسنه في الجاهلية فخرج آدم ع من الهند يؤم البيت الذي أمره الله عز وجل بالمصير إليه، حتى أتاه، فطاف به، ونسك المناسك، فذكر أنه التقى هو وحواء بعرفات، فتعارفا بها، ثم ازدلف إليها بالمزدلفة، ثم رجع إلى الهند مع حواء، فاتخذا مغارة يأويان إليها في ليلهما ونهارهما، وأرسل الله إليهما ملكا يعلمهما ما يلبسانه ويستتران به، فزعموا أن ذلك كان من جلود الضأن والأنعام والسباع وقال بعضهم: إنما كان ذلك لباس أولادهما، فأما آدم وحواء فإن لباسهما كان ما كانا خصفا على أنفسهما من ورق الجنة ثم إن الله عز ذكره مسح ظهر آدم ع بنعمان من عرفة، وأخرج","ar_html":"«فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» قال: قوله: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .\n\n\u003cspan class=\"isnad\">حَدَّثَنِي الحارث، قال: حدثنا ابن سعد، قال: أخبرنا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أَخْبَرَنَا أَبِي، عَنْ أَبِي صَالِحٍ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ: أَنْزَلَ آدَمُ مَعَهُ حِينَ أُهْبِطَ مِنَ الْجَنَّةِ الْحَجَرَ الأَسْوَدَ، وَكَانَ أَشَدَّ بَيَاضًا مِنَ الثَّلْجِ، وَبَكَى آدَمُ وَحَوَّاءُ عَلَى مَا فَاتَهُمَا- يَعْنِي مِنْ نَعِيمِ الْجَنَّةِ- مِائَتَيْ سَنَةٍ، وَلَمْ يَأْكُلا وَلَمْ يَشْرَبَا أَرْبَعِينَ يَوْمًا، ثُمَّ أَكَلا وَشَرِبَا، وَهُمَا يَوْمَئِذٍ عَلَى بُوذَ، الْجَبَلِ الَّذِي أُهْبِطَ عَلَيْهِ آدَمُ وَلَمْ يَقْرَبْ حَوَّاءَ مِائَةَ سَنَةٍ.\n\n\u003cspan class=\"isnad\">حَدَّثَنَا أبو همام، قال: حدثني أبي، قال: حدثني زياد بن خيثمة، عن أبي يحيى بائع القت، قال: قال لي مجاهد\u003c/span>، ونحن جلوس في المسجد: هل ao: pričao mi je moj otac, koji je rekao: pričao mi je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao,\u003c/span> dok smo sjedili u džamiji: „Vidiš li ovo?“ Upitao sam: „Ebu Hadždžadže, kamen?“ Rekao je: „Tako kažeš?“ Odgovorio sam: „Zar nije kamen?“ Rekao je: „Tako mi Allaha, \u003cspan class=\"isnad\">pričao mi je Abdullah ibn Abbas\u003c/span> da je to bijeli rubin s kojim je Adem izašao iz Dženneta i kojim je brisao suze. Ademove suze nisu prestale teći otkad je izašao iz Dženneta sve dok se nije u njega vratio, dvije hiljade godina, a Iblis nad njim ni u čemu nije imao moći.“ Upitao sam ga: „Ebu Hadždžadže, zbog čega je onda pocrnio?“ Odgovorio je: „U džahilijetu su ga doticale žene s mjesečnicom.“ Adem, alejhis-selam, krenuo je iz Indije prema Hramu kojem mu je Allah, Silan i Uzvišen, naredio da ode. Stigao je do njega, obišao ga i izvršio obrede. Navedeno je da su se on i Havva sreli na Arefatu i tamo se prepoznali, a zatim joj se približio na Muzdelifi. Potom se s Havvom vratio u Indiju i uzeli su pećinu za sklonište tokom svojih noći i dana. Allah im je poslao meleka da ih pouči čime će se odijevati i pokrivati. Tvrde da je to bilo od koža ovaca, stoke i zvijeri. Neki su rekli da je to bila odjeća njihove djece, dok su Adem i Havva nosili ono džennetsko lišće kojim su se pokrili. Zatim je Allah, Silan je spomen Njegov, potrao leđa Adema, alejhis-selam, u Nu‘manu kod Arefe i izveo\u003c/p>","paragraphs":[{"id":"133.1","ar":"«فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» قال: قوله: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .","ar_html":"«فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» قال: قوله: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .","ar_isnad_ranges":[],"bs":"„Adem je od svoga Gospodara primio riječi.“ Rekao je: „To su njegove riječi: ‘Gospodaru naš, sami smo sebi nepravdu učinili. Ako nam ne oprostiš i ne smiluješ nam se, sigurno ćemo biti među gubitnicima.’“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dio; El-A‘raf, 7:23.⟧","bs_html":"„Adem je od svoga Gospodara primio riječi.“ Rekao je: „To su njegove riječi: ‘Gospodaru naš, sami smo sebi nepravdu učinili. Ako nam ne oprostiš i ne smiluješ nam se, sigurno ćemo biti među gubitnicima.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dio; El-A‘raf, 7:23.⟧\u003c/span>","bs_isnad_count":0},{"id":"133.2","ar":"حَدَّثَنِي الحارث، قال: حدثنا ابن سعد، قال: أخبرنا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أَخْبَرَنَا أَبِي، عَنْ أَبِي صَالِحٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أَنْزَلَ آدَمُ مَعَهُ حِينَ أُهْبِطَ مِنَ الْجَنَّةِ الْحَجَرَ الأَسْوَدَ، وَكَانَ أَشَدَّ بَيَاضًا مِنَ الثَّلْجِ، وَبَكَى آدَمُ وَحَوَّاءُ عَلَى مَا فَاتَهُمَا- يَعْنِي مِنْ نَعِيمِ الْجَنَّةِ- مِائَتَيْ سَنَةٍ، وَلَمْ يَأْكُلا وَلَمْ يَشْرَبَا أَرْبَعِينَ يَوْمًا، ثُمَّ أَكَلا وَشَرِبَا، وَهُمَا يَوْمَئِذٍ عَلَى بُوذَ، الْجَبَلِ الَّذِي أُهْبِطَ عَلَيْهِ آدَمُ وَلَمْ يَقْرَبْ حَوَّاءَ مِائَةَ سَنَةٍ.","ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي الحارث، قال: حدثنا ابن سعد، قال: أخبرنا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أَخْبَرَنَا أَبِي، عَنْ أَبِي صَالِحٍ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ: أَنْزَلَ آدَمُ مَعَهُ حِينَ أُهْبِطَ مِنَ الْجَنَّةِ الْحَجَرَ الأَسْوَدَ، وَكَانَ أَشَدَّ بَيَاضًا مِنَ الثَّلْجِ، وَبَكَى آدَمُ وَحَوَّاءُ عَلَى مَا فَاتَهُمَا- يَعْنِي مِنْ نَعِيمِ الْجَنَّةِ- مِائَتَيْ سَنَةٍ، وَلَمْ يَأْكُلا وَلَمْ يَشْرَبَا أَرْبَعِينَ يَوْمًا، ثُمَّ أَكَلا وَشَرِبَا، وَهُمَا يَوْمَئِذٍ عَلَى بُوذَ، الْجَبَلِ الَّذِي أُهْبِطَ عَلَيْهِ آدَمُ وَلَمْ يَقْرَبْ حَوَّاءَ مِائَةَ سَنَةٍ.","ar_isnad_ranges":[[0,146]],"bs":"Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio nas je Hišam ibn Muhammed, koji je rekao: obavijestio nas je moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Kada je spušten iz Dženneta, Adem je sa sobom spustio Crni kamen, koji je bio bjelji od snijega. Adem i Havva dvjesto godina plakali su za onim što su izgubili — misli se na džennetsko uživanje. Četrdeset dana nisu ni jeli ni pili, a zatim su jeli i pili. Tada su bili na Buzu, planini na koju je Adem spušten. Stotinu godina nije se približio Havvi.“","bs_html":"\u003cspan class=\"isnad\">Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio nas je Hišam ibn Muhammed, koji je rekao: obavijestio nas je moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao:\u003c/span> „Kada je spušten iz Dženneta, Adem je sa sobom spustio Crni kamen, koji je bio bjelji od snijega. Adem i Havva dvjesto godina plakali su za onim što su izgubili — misli se na džennetsko uživanje. Četrdeset dana nisu ni jeli ni pili, a zatim su jeli i pili. Tada su bili na Buzu, planini na koju je Adem spušten. Stotinu godina nije se približio Havvi.“","bs_isnad_count":1},{"id":"133.3","ar":"حَدَّثَنَا أبو همام، قال: حدثني أبي، قال: حدثني زياد بن خيثمة، عن أبي يحيى بائع القت، قال: قال لي مجاهد، ونحن جلوس في المسجد: هل ترى هذا؟ قلت: يا أبا الحجاج، الحجر؟ قال: كذلك تقول؟\nقلت: او ليس حجرا! قال: فو الله لحدثني عبد الله بن عباس أنها ياقوتة بيضاء، خرج بها آدم من الجنة، كان يمسح بها دموعه، وأن آدم لم ترقأ دموعه منذ خرج من الجنة حتى رجع إليها ألفي سنة، وما قدر منه إبليس على شيء، فقلت له: يا أبا الحجاج، فمن أي شيء اسود؟ قال: كان الْحُيَّضُ يلمسنه في الجاهلية فخرج آدم ع من الهند يؤم البيت الذي أمره الله عز وجل بالمصير إليه، حتى أتاه، فطاف به، ونسك المناسك، فذكر أنه التقى هو وحواء بعرفات، فتعارفا بها، ثم ازدلف إليها بالمزدلفة، ثم رجع إلى الهند مع حواء، فاتخذا مغارة يأويان إليها في ليلهما ونهارهما، وأرسل الله إليهما ملكا يعلمهما ما يلبسانه ويستتران به، فزعموا أن ذلك كان من جلود الضأن والأنعام والسباع وقال بعضهم: إنما كان ذلك لباس أولادهما، فأما آدم وحواء فإن لباسهما كان ما كانا خصفا على أنفسهما من ورق الجنة ثم إن الله عز ذكره مسح ظهر آدم ع بنعمان من عرفة، وأخرج","ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أبو همام، قال: حدثني أبي، قال: حدثني زياد بن خيثمة، عن أبي ي ifi. Potom se s Havvom vratio u Indiju i uzeli su pećinu za sklonište tokom svojih noći i dana. Allah im je poslao meleka da ih pouči čime će se odijevati i pokrivati. Tvrde da je to bilo od koža ovaca, stoke i zvijeri. Neki su rekli da je to bila odjeća njihove djece, dok su Adem i Havva nosili ono džennetsko lišće kojim su se pokrili. Zatim je Allah, Silan je spomen Njegov, potrao leđa Adema, alejhis-selam, u Nu‘manu kod Arefe i izveo","bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Hemmam, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao,\u003c/span> dok smo sjedili u džamiji: „Vidiš li ovo?“ Upitao sam: „Ebu Hadždžadže, kamen?“ Rekao je: „Tako kažeš?“ Odgovorio sam: „Zar nije kamen?“ Rekao je: „Tako mi Allaha, \u003cspan class=\"isnad\">pričao mi je Abdullah ibn Abbas\u003c/span> da je to bijeli rubin s kojim je Adem izašao iz Dženneta i kojim je brisao suze. Ademove suze nisu prestale teći otkad je izašao iz Dženneta sve dok se nije u njega vratio, dvije hiljade godina, a Iblis nad njim ni u čemu nije imao moći.“ Upitao sam ga: „Ebu Hadždžadže, zbog čega je onda pocrnio?“ Odgovorio je: „U džahilijetu su ga doticale žene s mjesečnicom.“ Adem, alejhis-selam, krenuo je iz Indije prema Hramu kojem mu je Allah, Silan i Uzvišen, naredio da ode. Stigao je do njega, obišao ga i izvršio obrede. Navedeno je da su se on i Havva sreli na Arefatu i tamo se prepoznali, a zatim joj se približio na Muzdelifi. Potom se s Havvom vratio u Indiju i uzeli su pećinu za sklonište tokom svojih noći i dana. Allah im je poslao meleka da ih pouči čime će se odijevati i pokrivati. Tvrde da je to bilo od koža ovaca, stoke i zvijeri. Neki su rekli da je to bila odjeća njihove djece, dok su Adem i Havva nosili ono džennetsko lišće kojim su se pokrili. Zatim je Allah, Silan je spomen Njegov, potrao leđa Adema, alejhis-selam, u Nu‘manu kod Arefe i izveo","bs_isnad_count":2}],"notes":[]},{"n":134,"ar":"ذريته، فنثرهم بين يديه كالذر، فأخذ مواثيقهم، وأشهدهم على أنفسهم:\n\nألست بربكم؟ قالوا: بلى، كما قال عز وجل: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» .\nوَقَدْ حَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدٍ الطُّوسِيُّ، قَالَ: حَدَّثَنَا الْحُسَيْنُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا جَرِيرُ بْنُ حَازِمٍ، عَنْ كُلْثُومِ بْنِ جَبْرٍ، عَنْ سعيد ابن جبير، عن ابن عباس، [عن النبي ص، قَالَ: أَخَذَ اللَّهُ الْمِيثَاقَ مِنْ ظَهْرِ آدَمَ بِنَعْمَانَ- يَعْنِي عَرَفَةَ- فَأَخْرَجَ مِنْ صُلْبِهِ كُلَّ ذُرِّيَّةٍ ذَرَأَهَا، فَنَثَرَهُمْ بَيْنَ يَدَيْهِ كَالذَّرِّ، ثُمَّ كَلَّمَهُمْ قِبَلا، وَقَالَ: «أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى شَهِدْنا أَنْ تَقُولُوا يَوْمَ الْقِيامَةِ» إِلَى قَوْلِهِ: «بِما فَعَلَ الْمُبْطِلُونَ] » .\nحَدَّثَنِي عِمْرَانُ بْنُ مُوسَى الْقَزَّازُ، حَدَّثَنَا عَبْدُ الْوَارِثِ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا كُلْثُومُ بْنُ جَبْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ فِي قَوْلِهِ:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قَالَ: مَسَحَ رَبُّنَا ظَهْرَ آدَمَ، فَخَرَجَتْ كُلُّ نسمة هو خالقها إلى يوم القيامة بنعمان هَذِهِ- وَأَشَارَ بِيَدِهِ- فَأَخَذَ مَوَاثِيقَهُمْ، وَأَشْهَدَهُمْ عَلَى أَنْفُسِهِمْ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى.\nحَدَّثَنَا ابْنُ وَكِيعٍ وَيَعْقُوبُ بْنُ إِبْرَاهِيمَ، قَالا: حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ كُلْثُومِ بْنِ جَبْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ فِي قَوْلِهِ عز وجل:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قَالَ: مَسَحَ ظَهْرَ آدَمَ فَخَرَجَ كُلُّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ بِنَعْمَانَ، هَذَا الَّذِي وَرَاءَ عَرَفَةَ، وَأَخَذَ مِيثَاقَهُمْ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى شَهِدْنَا، وَاللَّفْظُ لِحَدِيثِ يَعْقُوبَ.\n\nحَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، عن عطاء،","ar_html":"ذريته، فنثرهم بين يديه كالذر، فأخذ مواثيقهم، وأشهدهم على أنفسهم:\n\nألست بربكم؟ قالوا: بلى، كما قال عز وجل: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» .\n\nوَقَدْ \u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدٍ الطُّوسِيُّ، قَالَ: حَدَّثَنَا الْحُسَيْنُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا جَرِيرُ بْنُ حَازِمٍ، عَنْ كُلْثُومِ بْنِ جَبْرٍ، عَنْ سعيد ابن جبير، عن ابن عباس، [عن النبي ص، قَال\u003c/span>َ: أَخَذَ اللَّهُ الْمِيثَاقَ مِنْ ظَهْرِ آدَمَ بِنَعْمَانَ- يَعْنِي عَرَفَةَ- فَأَخْرَجَ مِنْ صُلْبِهِ كُلَّ ذُرِّيَّةٍ ذَرَأَهَا، فَنَثَرَهُمْ بَيْنَ يَدَيْهِ كَالذَّرِّ، ثُمَّ كَلَّمَهُمْ قِبَلا، وَقَالَ: «أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى شَهِدْنا أَنْ تَقُولُوا يَوْمَ الْقِيامَةِ» إِلَى قَوْلِهِ: «بِما فَعَلَ الْمُبْطِلُونَ] » .\n\n\u003cspan class=\"isnad\">حَدَّثَنِي عِمْرَانُ بْنُ مُوسَى الْقَزَّازُ، حَدَّثَنَا عَبْدُ الْوَارِثِ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا كُلْثُومُ بْنُ جَبْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ فِي قَوْلِهِ:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قَالَ: مَسَحَ رَبُّنَا ظَهْرَ آدَمَ، فَخَرَجَتْ كُلُّ نسمة هو خالقها إلى يوم القيامة بنعمان هَذِهِ- وَأَشَارَ بِيَدِهِ- فَأَخَذَ مَوَاثِيقَهُمْ، وَأَشْهَدَهُمْ عَلَى أَنْفُسِهِمْ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى.\n\n\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ وَيَعْقُوبُ بْنُ إِبْرَاهِيمَ، قَالا: حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ كُلْثُومِ بْنِ جَبْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ فِي قَوْلِهِ عز وجل:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قَالَ: مَسَحَ ظَهْرَ آدَمَ فَخَرَجَ كُلُّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ بِنَعْمَانَ، هَذَا الَّذِي وَرَاءَ عَرَفَةَ، وَأَخَذَ مِيثَاقَهُمْ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى شَهِدْنَا، وَاللَّفْظُ لِحَدِيثِ يَعْقُوبَ.\n\n\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، عن عطاء\u003c/span>،","bs":"\u003cp data-paragraph=\"134.1\">njegovo potomstvo. Rasuo ih je pred Sobom poput sitnih mrava, uzeo od njih zavjete i učinio ih svjedocima protiv samih sebe: „Zar Ja nisam vaš Gospodar?“ Odgovorili su: „Jesi“, kako je rekao On, Silan i Uzvišen: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"134.2\">\u003cspan class=\"isnad\">Pričao mi je Ahmed ibn Muhammed et-Tusi, koji je rekao: pričao nam je Husejn ibn Muhammed, koji je rekao: pričao nam je Džerir ibn Hazim, od Kulsuma ibn Džebra, od Seida ibn Džubejra, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao:\u003c/span> „Allah je uzeo zavjet iz Ademovih leđa u Nu‘manu — misli se na Arefu. Iz njegovih slabina izveo je sve potomstvo koje je stvorio i rasuo ih pred Sobom poput sitnih mrava. Zatim im je neposredno govorio i rekao: ‘Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi, svjedočimo! Da na Kijametskom danu ne kažete’ — do Njegovih riječi: ‘zbog onoga što su činili oni koji su neistinu slijedili.’“ \u003cspan class=\"translator-note\">⟦Prijevodi navedenog početka i završetka: El-A‘raf, 7:172–173. Izraz „do Njegovih riječi“ pripada izvoru.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"134.3\">\u003cspan class=\"isnad\">Pričao mi je Imran ibn Musa el-Kazzaz: pričao nam je Abdulvaris ibn Seid, koji je rekao: pričao nam je Kulsum ibn Džebr, od Seida ibn Džubejra, od Ibn Abbasa,\u003c/span> o Njegovim riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Naš je Gospodar potrao Ademova leđa, pa je iz njega izašao svaki čovjek kojeg će stvoriti do Kijametskog dana u ovom Nu‘manu“ — i pokazao je rukom. „Uzeo je od njih zavjete i učinio ih svjedocima protiv samih sebe: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"134.4\">\u003cspan class=\"isnad\">Pričali su nam Ibn Veki‘ i Jakub ibn Ibrahim; obojica su rekli: pričao nam je Ibn Ulejja, od Kulsuma ibn Džebra, od Seida ibn Džubejra, od Ibn Abbasa,\u003c/span> o riječima Njega, Silnog i Uzvišenog: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Potrao je Ademova leđa, pa je u Nu‘manu, ovome iza Arefe, izašao svaki čovjek kojeg će stvoriti do Kijametskog dana. Uzeo je od njih zavjet: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi, svjedočimo.’“ Ovo je formulacija Jakubove predaje. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"134.5\">\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Imran ibn Ujejna, od Ataa,\u003c/span>\u003c/p>","paragraphs":[{"id":"134.1","ar":"ذريته، فنثرهم بين يديه كالذر، فأخذ مواثيقهم، وأشهدهم على أنفسهم:\n\nألست بربكم؟ قالوا: بلى، كما قال عز وجل: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» .","ar_html":"ذريته، فنثرهم بين يديه كالذر، فأخذ مواثيقهم، وأشهدهم على أنفسهم:\n\nألست بربكم؟ قالوا: بلى، كما قال عز وجل: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» .","ar_isnad_ranges":[],"bs":"njegovo poto ْلِهِ:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قَالَ: مَسَحَ رَبُّنَا ظَهْرَ آدَمَ، فَخَرَجَتْ كُلُّ نسمة هو خالقها إلى يوم القيامة بنعمان هَذِهِ- وَأَشَارَ بِيَدِهِ- فَأَخَذَ مَوَاثِيقَهُمْ، وَأَشْهَدَهُمْ عَلَى أَنْفُسِهِمْ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى.","ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي عِمْرَانُ بْنُ مُوسَى الْقَزَّازُ، حَدَّثَنَا عَبْدُ الْوَارِثِ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا كُلْثُومُ بْنُ جَبْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ فِي قَوْلِهِ:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قَالَ: مَسَحَ رَبُّنَا ظَهْرَ آدَمَ، فَخَرَجَتْ كُلُّ نسمة هو خالقها إلى يوم القيامة بنعمان هَذِهِ- وَأَشَارَ بِيَدِهِ- فَأَخَذَ مَوَاثِيقَهُمْ، وَأَشْهَدَهُمْ عَلَى أَنْفُسِهِمْ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى.","ar_isnad_ranges":[[0,176]],"bs":"Pričao mi je Imran ibn Musa el-Kazzaz: pričao nam je Abdulvaris ibn Seid, koji je rekao: pričao nam je Kulsum ibn Džebr, od Seida ibn Džubejra, od Ibn Abbasa, o Njegovim riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Naš je Gospodar potrao Ademova leđa, pa je iz njega izašao svaki čovjek kojeg će stvoriti do Kijametskog dana u ovom Nu‘manu“ — i pokazao je rukom. „Uzeo je od njih zavjete i učinio ih svjedocima protiv samih sebe: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧","bs_html":"\u003cspan class=\"isnad\">Pričao mi je Imran ibn Musa el-Kazzaz: pričao nam je Abdulvaris ibn Seid, koji je rekao: pričao nam je Kulsum ibn Džebr, od Seida ibn Džubejra, od Ibn Abbasa,\u003c/span> o Njegovim riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i u o potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Potrao je Ademova leđa, pa je u Nu‘manu, ovome iza Arefe, izašao svaki čovjek kojeg će stvoriti do Kijametskog dana. Uzeo je od njih zavjet: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi, svjedočimo.’“ Ovo je formulacija Jakubove predaje. ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧","bs_html":"\u003cspan class=\"isnad\">Pričali su nam Ibn Veki‘ i Jakub ibn Ibrahim; obojica su rekli: pričao nam je Ibn Ulejja, od Kulsuma ibn Džebra, od Seida ibn Džubejra, od Ibn Abbasa,\u003c/span> o riječima Njega, Silnog i Uzvišenog: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Potrao je Ademova leđa, pa je u Nu‘manu, ovome iza Arefe, izašao svaki čovjek kojeg će stvoriti do Kijametskog dana. Uzeo je od njih zavjet: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi, svjedočimo.’“ Ovo je formulacija Jakubove predaje. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>","bs_isnad_count":1},{"id":"134.5","ar":"حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، عن عطاء،","ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، عن عطاء\u003c/span>،","ar_isnad_ranges":[[0,78]],"bs":"Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Imran ibn Ujejna, od Ataa,","bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Imran ibn Ujejna, od Ataa,\u003c/span>","bs_isnad_count":1}],"notes":[]},{"n":135,"ar":"عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أُهْبِطَ آدَمُ حِينَ أُهْبِطَ فَمَسَحَ اللَّهُ ظَهْرَهُ، فَأَخْرَجَ مِنْهُ كُلَّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ، ثُمَّ قَالَ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى، ثُمَّ تَلَى: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، فَجَفَّ الْقَلَمُ مِنْ يَوْمِئِذٍ بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ.\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ عيسى، عن الأعمش، عن حَبِيبِ بْنِ أَبِي ثَابِتٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ في «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، قَالَ: لَمَّا خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ ع أَخَذَ ذُرِّيَّتَهُ مِنْ ظَهْرِهِ مِثْلَ الذَّرِّ، فَقَبَضَ قَبْضَتَيْنِ، فَقَالَ لأَصْحَابِ الْيَمِينِ: ادْخُلُوا الْجَنَّةَ بِسَلامٍ، وَقَالَ لِلآخَرِينَ: ادْخُلُوا النَّارَ وَلا أُبَالِي.\nحَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعِيدٍ الْجَوْهَرِيُّ، قَالَ: حَدَّثَنَا رَوْحُ بْنُ عُبَادَةَ وَسَعْدُ بْنُ عَبْدِ الْحَمِيدِ بْنِ جَعْفَرٍ، عَنْ مَالِكِ بْنِ أَنَسٍ، عَنْ زَيْدِ بْنِ أَبِي أُنَيْسَةَ، عَنْ عَبْدِ الْحَمِيدِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ زَيْدِ بْنِ الْخَطَّابِ، عَنْ مُسْلِمِ بْنِ يَسَارٍ الْجُهَنِيِّ، [أَنَّ عُمَرَ بْنَ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ سُئِلَ عَنْ هَذِهِ الآية:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، فقال عمر: سمعت رسول الله ص قَالَ: إِنَّ اللَّهَ خَلَقَ آدَمَ ثُمَّ مَسَحَ عَلَى ظَهْرِهِ بِيَمِينِهِ وَاسْتَخْرَجَ مِنْهُ ذُرِّيَّةً، فَقَالَ: خَلَقْتُ هَؤُلاءِ لِلْجَنَّةِ وَبِعَمَلِ أَهْلِ الْجَنَّةِ يَعْمَلُونَ، ثُمَّ مَسَحَ عَلَى ظَهْرِهِ فَاسْتَخْرَجَ مِنْهُ ذُرِّيَّةً فَقَالَ: خَلَقْتُ هَؤُلاءِ لِلنَّارِ وَبِعَمَلِ أَهْلِ النَّارِ يَعْمَلُونَ، فَقَالَ رَجُلٌ: يَا رَسُولَ اللَّهِ، فَفِيمَ الْعَمَلُ؟ قَالَ: إِنَّ اللَّهَ تَبَارَكَ وَتعالى إِذَا خَلَقَ الْعَبْدَ لِلْجَنَّةِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ الْجَنَّةِ، حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ الجنه فيدخله الْجَنَّةِ، وَإِذَا خَلَقَ الْعَبْدَ لِلنَّارِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ النَّارِ حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ النَّارِ فَيُدْخِلُهُ النَّارَ] .\nوَقِيلَ: إِنَّهُ أخذ ذريه آدم ع من ظهره بدحنا","ar_html":"\u003cspan class=\"isnad\">عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ: أُهْبِطَ آدَمُ حِينَ أُهْبِطَ فَمَسَحَ اللَّهُ ظَهْرَهُ، فَأَخْرَجَ مِنْهُ كُلَّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ، ثُمَّ قَالَ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى، ثُمَّ تَلَى: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، فَجَفَّ الْقَلَمُ مِنْ يَوْمِئِذٍ بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ.\n\n\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ عيسى، عن الأعمش، عن حَبِيبِ بْنِ أَبِي ثَابِتٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ في «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، قَالَ: لَمَّا خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ ع أَخَذَ ذُرِّيَّتَهُ مِنْ ظَهْرِهِ مِثْلَ الذَّرِّ، فَقَبَضَ قَبْضَتَيْنِ، فَقَالَ لأَصْحَابِ الْيَمِينِ: ادْخُلُوا الْجَنَّةَ بِسَلامٍ، وَقَالَ لِلآخَرِينَ: ادْخُلُوا النَّارَ وَلا أُبَالِي.\n\n\u003cspan class=\"isnad\">حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعِيدٍ الْجَوْهَرِيُّ، قَالَ: حَدَّثَنَا رَوْحُ بْنُ عُبَادَةَ وَسَعْدُ بْنُ عَبْدِ الْحَمِيدِ بْنِ جَعْفَرٍ، عَنْ مَالِكِ بْنِ أَنَسٍ، عَنْ زَيْدِ بْنِ أَبِي أُنَيْسَةَ، عَنْ عَبْدِ الْحَمِيدِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ زَيْدِ بْنِ الْخَطَّابِ، عَنْ مُسْلِمِ بْنِ يَسَارٍ الْجُهَنِي\u003c/span>ِّ، [أَنَّ عُمَرَ بْنَ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ سُئِلَ عَنْ هَذِهِ الآية:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، \u003cspan class=\"isnad\">فقال عمر: سمعت رسول الله ص قَال\u003c/span>َ: إِنَّ اللَّهَ خَلَقَ آدَمَ ثُمَّ مَسَحَ عَلَى ظَهْرِهِ بِيَمِينِهِ وَاسْتَخْرَجَ مِنْهُ ذُرِّيَّةً، فَقَالَ: خَلَقْتُ هَؤُلاءِ لِلْجَنَّةِ وَبِعَمَلِ أَهْلِ الْجَنَّةِ يَعْمَلُونَ، ثُمَّ مَسَحَ عَلَى ظَهْرِهِ فَاسْتَخْرَجَ مِنْهُ ذُرِّيَّةً فَقَالَ: خَلَقْتُ هَؤُلاءِ لِلنَّارِ وَبِعَمَلِ أَهْلِ النَّارِ يَعْمَلُونَ، فَقَالَ رَجُلٌ: يَا رَسُولَ اللَّهِ، فَفِيمَ الْعَمَلُ؟ قَالَ: إِنَّ اللَّهَ تَبَارَكَ وَتعالى إِذَا خَلَقَ الْعَبْدَ لِلْجَنَّةِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ الْجَنَّةِ، حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ الجنه فيدخله الْجَنَّةِ، وَإِذَا خَلَقَ الْعَبْدَ لِلنَّارِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ النَّارِ حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ النَّارِ فَيُدْخِلُهُ النَّارَ] .\n\nوَقِيلَ: إِنَّهُ أخذ ذريه آدم ع من ظهره بدحنا","bs":"\u003cp data-paragraph=\"135.1\">\u003cspan class=\"isnad\">od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao:\u003c/span> „Kada je Adem spušten, Allah mu je potrao leđa i izveo iz njega svakoga čovjeka kojeg će stvoriti do Kijametskog dana. Zatim je rekao: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’ Potom je proučio: ‘I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.’ Od toga dana pero se osušilo nad onim što će biti do Kijametskog dana.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"135.2\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Jahja ibn Isa, od A‘meša, od Habiba ibn Ebu Sabita, od Seida ibn Džubejra, od Ibn Abbasa,\u003c/span> o riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.“ Rekao je: „Kada je Allah, Silan i Uzvišen, stvorio Adema, alejhis-selam, uzeo je iz njegovih leđa njegovo potomstvo poput sitnih mrava. Zahvatio je dvije pregršti i rekao onima s desne strane: ‘Uđite u Džennet u miru’, a drugima je rekao: ‘Uđite u Vatru i ne marim.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"135.3\">\u003cspan class=\"isnad\">Pričao nam je Ibrahim ibn Seid el-Dževheri, koji je rekao: pričali su nam Revh ibn Ubada i Sa‘d ibn Abdulhamid ibn Džafer, od Malika ibn Enesa, od Zejda ibn Ebu Unejse, od Abdulhamida ibn Abdurrahmana ibn Zejda ibn el-Hattaba, od Muslima ibn Jesara el-Džuhenija,\u003c/span> da je Omer ibn el-Hattab, radijallahu anhu, upitan o ovom ajetu: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.“ \u003cspan class=\"isnad\">Omer je rekao: „Čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže:\u003c/span> ‘Allah je stvorio Adema, zatim mu Svojom desnicom potrao leđa i iz njega izveo potomstvo. Rekao je: Ove sam stvorio za Džennet i oni će činiti djela stanovnika Dženneta. Zatim mu je potrao leđa i iz njega izveo potomstvo. Rekao je: Ove sam stvorio za Vatru i oni će činiti djela stanovnika Vatre.’ Neki je čovjek rekao: ‘Allahov Poslaniče, čemu onda djela?’ Odgovorio je: ‘Kada Allah, Blagoslovljen i Uzvišen, stvori roba za Džennet, upotrijebi ga za djela stanovnika Dženneta sve dok ne umre čineći neko od djela stanovnika Dženneta, pa ga uvede u Džennet. Kada roba stvori za Vatru, upotrijebi ga za djela stanovnika Vatre sve dok ne umre čineći neko od djela stanovnika Vatre, pa ga uvede u Vatru.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"135.4\">Rečeno je da je Ademovo, alejhis-selam, potomstvo iz njegovih leđa izveo u Dehni.\u003c/p>","paragraphs":[{"id":"135.1","ar":"عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: أُهْبِطَ آدَمُ حِينَ أُهْبِطَ فَمَسَحَ اللَّهُ ظَهْرَهُ، فَأَخْرَجَ مِنْهُ كُلَّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ، ثُمَّ قَالَ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى، ثُمَّ تَلَى: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، فَجَفَّ الْقَلَمُ مِنْ يَوْمِئِذٍ بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ.","ar_html":"\u003cspan class=\"isnad\">عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ: أُهْبِطَ آدَمُ حِينَ أُهْبِطَ فَمَسَحَ اللَّهُ ظَهْرَهُ، فَأَخْرَجَ مِنْهُ كُلَّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ، ثُمَّ قَالَ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى، ثُمَّ تَلَى: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، فَجَفَّ الْقَلَمُ مِنْ يَوْمِئِذٍ بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ.","ar_isnad_ranges":[[0,53]],"bs":" ْتُ هَؤُلاءِ لِلْجَنَّةِ وَبِعَمَلِ أَهْلِ الْجَنَّةِ يَعْمَلُونَ، ثُمَّ مَسَحَ عَلَى ظَهْرِهِ فَاسْتَخْرَجَ مِنْهُ ذُرِّيَّةً فَقَالَ: خَلَقْتُ هَؤُلاءِ لِلنَّارِ وَبِعَمَلِ أَهْلِ النَّارِ يَعْمَلُونَ، فَقَالَ رَجُلٌ: يَا رَسُولَ اللَّهِ، فَفِيمَ الْعَمَلُ؟ قَالَ: إِنَّ اللَّهَ تَبَارَكَ وَتعالى إِذَا خَلَقَ الْعَبْدَ لِلْجَنَّةِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ الْجَنَّةِ، حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ الجنه فيدخله الْجَنَّةِ، وَإِذَا خَلَقَ الْعَبْدَ لِلنَّارِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ النَّارِ حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ النَّارِ فَيُدْخِلُهُ النَّارَ] .","ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعِيدٍ الْجَوْهَرِيُّ، قَالَ: حَدَّثَنَا رَوْحُ بْنُ عُبَادَةَ وَسَعْدُ بْنُ عَبْدِ الْحَمِيدِ بْنِ جَعْفَرٍ، عَنْ مَالِكِ بْنِ أَنَسٍ، عَنْ زَيْدِ بْنِ أَبِي أُنَيْسَةَ، عَنْ عَبْدِ الْحَمِيدِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ زَيْدِ بْنِ الْخَطَّابِ، عَنْ مُسْلِمِ بْنِ يَسَارٍ الْجُهَنِي\u003c/span>ِّ، [أَنَّ عُمَرَ بْنَ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ سُئِلَ عَنْ هَذِهِ الآية:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، \u003cspan class=\"isnad\">فقال عمر: سمعت رسول الله ص قَال\u003c/span>َ: إِنَّ اللَّهَ خَلَقَ آدَمَ ثُمَّ مَسَحَ عَلَى ظَهْرِهِ بِيَمِينِهِ وَاسْتَخْرَجَ مِنْهُ ذُرِّيَّةً، فَقَالَ: خَلَقْتُ هَؤُلاءِ لِلْجَنَّةِ وَبِعَمَلِ أَهْلِ الْجَنَّةِ يَعْمَلُونَ، ثُمَّ مَسَحَ عَلَى ظَهْرِهِ فَاسْتَخْرَجَ مِنْهُ ذُرِّيَّةً فَقَالَ: خَلَقْتُ هَؤُلاءِ لِلنَّارِ وَبِعَمَلِ أَهْلِ النَّارِ يَعْمَلُونَ، فَقَالَ رَجُلٌ: يَا رَسُولَ اللَّهِ، فَفِيمَ الْعَمَلُ؟ قَالَ: إِنَّ اللَّهَ تَبَارَكَ وَتعالى إِذَا خَلَقَ الْعَبْدَ لِلْجَنَّةِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ الْجَنَّةِ، حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ الجنه فيدخله الْجَنَّةِ، وَإِذَا خَلَقَ الْعَبْدَ لِلنَّارِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ النَّارِ حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ النَّارِ فَيُدْخِلُهُ النَّارَ] .","ar_isnad_ranges":[[0,315],[473,504]],"bs":"Pričao nam je Ibrahim ibn Seid el-Dževheri, koji je rekao: pričali su nam Revh ibn Ubada i Sa‘d ibn Abdulhamid ibn Džafer, od Malika ibn Enesa, od Zejda ibn Ebu Unejse, od Abdulhamida ibn Abdurrahmana ibn Zejda ibn el-Hattaba, od Muslima ibn Jesara el-Džuhenija, da je Omer ibn el-Hattab, radijallahu anhu, upitan o ovom ajetu: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.“ Omer je rekao: „Čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže: ‘Allah je stvorio Adema, zatim mu Svojom desnicom potrao leđa i iz njega izveo potomstvo. Rekao je: Ove sam stvorio za Džennet i oni će činiti djela stanovnika Dženneta. Zatim mu je potrao leđa i iz njega izveo potomstvo. Rekao je: Ove sam stvorio za Vatru i oni će činiti djela stanovnika Vatre.’ Neki je čovjek rekao: ‘Allahov Poslaniče, čemu onda djela?’ Odgovorio je: ‘Kada Allah, Blagoslovljen i Uzvišen, stvori roba za Džennet, upotrijebi ga za djela stanovnika Dženneta sve dok ne umre čineći neko od djela stanovnika Dženneta, pa ga uvede u Džennet. Kada roba stvori za Vatru, upotrijebi ga za djela stanovnika Vatre sve dok ne umre čineći neko od djela stanovnika Vatre, pa ga uvede u Vatru.’“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧","bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibrahim ibn Seid el-Dževheri, koji je rekao: pričali su nam Revh ibn Ubada i Sa‘d ibn Abdulhamid ibn Džafer, od Malika ibn Enesa, od Zejda ibn Ebu Unejse, od Abdulhamida ibn Abdurrahmana ibn Zejda ibn el-Hattaba, od Muslima ibn Jesara el-Džuhenija,\u003c/span> da je Omer ibn el-Hattab, radijallahu anhu, upitan o ovom ajetu: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.“ \u003cspan class=\"isnad\">Omer je rekao: „Čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže:\u003c/span> ‘Allah je stvorio Adema, zatim mu Svojom desnicom potrao leđa i iz njega izveo potomstvo. Rekao je: Ove sam stvorio za Džennet i oni će činiti djela stanovnika Dženneta. Zatim mu je potrao leđa i iz njega izveo potomstvo. Rekao je: Ove sam stvorio za Vatru i oni će činiti djela stanovnika Vatre.’ Neki je čovjek rekao: ‘Allahov Poslaniče, čemu onda djela?’ Odgovorio je: ‘Kada Allah, Blagoslovljen i Uzvišen, stvori roba za Džennet, upotrijebi ga za djela stanovnika Dženneta sve dok ne umre čineći neko od djela stanovnika Dženneta, pa ga uvede u Džennet. Kada roba stvori za Vatru, upotrijebi ga za djela stanovnika Vatre sve dok ne umre čineći neko od djela stanovnika Vatre, pa ga uvede u Vatru.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>","bs_isnad_count":2},{"id":"135.4","ar":"وَقِيلَ: إِنَّهُ أخذ ذريه آدم ع من ظهره بدحنا","ar_html":"وَقِيلَ: إِنَّهُ أخذ ذريه آدم ع من ظهره بدحنا","ar_isnad_ranges":[],"bs":"Rečeno je da je Ademovo, alejhis-selam, potomstvo iz njegovih leđa izveo u Dehni.","bs_html":"Rečeno je da je Ademovo, alejhis-selam, potomstvo iz njegovih leđa izveo u Dehni.","bs_isnad_count":0}],"notes":[]},{"n":136,"ar":"ذكر من قال ذلك:\nحدثنا ابن حميد، قَالَ: حَدَّثَنَا حَكَّامٌ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ قَيْسٍ، عَنْ عَطَاءٍ، عَنْ سَعِيدٍ، عَنِ ابْنِ عَبَّاسٍ: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» قَالَ: لَمَّا خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ مسح ظهره بدحنا فَأَخْرَجَ مِنْ ظَهْرِهِ كُلَّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ، فَقَالَ:\nأَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى، قَالَ: فَيَرَوْنَ يَوْمَئِذٍ، جَفَّ الْقَلَمُ بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ وَقَالَ بَعْضُهُمْ: أَخْرَجَ اللَّهُ ذُرِّيَّةَ آدَمَ مِنْ صُلْبِهِ فِي السَّمَاءِ قَبْلَ أَنْ يُهْبِطَهُ إِلَى الأَرْضِ، وَبَعْدَ أَنْ أَخْرَجَهُ مِنَ الْجَنَّةِ.\n\nذِكْرُ مَنْ قَالَ ذلك:\nحدثنا ابن وكيع، قال: حدثنا عمرو بن حماد، عن أسباط، عن السدي: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قال: أخرج الله آدم من الجنة ولم يهبطه من السماء، ثم إنه مسح من آدم صفحة ظهره اليمنى، فأخرج منه ذرية كهيئة الذر بيضاء مثل اللؤلؤ، فقال لهم: ادخلوا الجنه برحمتي، ومسح صفحه ظهره اليسرى، فأخرج منه كهيئة الذر سودا، فقال: ادخلوا النار ولا أبالي فذلك حين يقول: أصحاب اليمين وأصحاب الشمال ثم أخذ الميثاق فقال: ألست بربكم؟ قالوا بلى، فأعطاه طائفة طائعين، وطائفة على وجه التقية","ar_html":"ذكر من قال ذلك:\n\n\u003cspan class=\"isnad\">حدثنا ابن حميد، قَالَ: حَدَّثَنَا حَكَّامٌ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ قَيْسٍ، عَنْ عَطَاءٍ، عَنْ سَعِيدٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» قَالَ: لَمَّا خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ مسح ظهره بدحنا فَأَخْرَجَ مِنْ ظَهْرِهِ كُلَّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ، فَقَالَ:\nأَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى، قَالَ: فَيَرَوْنَ يَوْمَئِذٍ، جَفَّ الْقَلَمُ بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ وَقَالَ بَعْضُهُمْ: أَخْرَجَ اللَّهُ ذُرِّيَّةَ آدَمَ مِنْ صُلْبِهِ فِي السَّمَاءِ قَبْلَ أَنْ يُهْبِطَهُ إِلَى الأَرْضِ، وَبَعْدَ أَنْ أَخْرَجَهُ مِنَ الْجَنَّةِ.\n\nذِكْرُ مَنْ قَالَ ذلك:\n\n\u003cspan class=\"isnad\">حدثنا ابن وكيع، قال: حدثنا عمرو بن حماد، عن أسباط، عن السدي\u003c/span>: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قال: أخرج الله آدم من الجنة ولم يهبطه من السماء، ثم إنه مسح من آدم صفحة ظهره اليمنى، فأخرج منه ذرية كهيئة الذر بيضاء مثل اللؤلؤ، فقال لهم: ادخلوا الجنه برحمتي، ومسح صفحه ظهره اليسرى، فأخرج منه كهيئة الذر سودا، فقال: ادخلوا النار ولا أبالي فذلك حين يقول: أصحاب اليمين وأصحاب الشمال ثم أخذ الميثاق فقال: ألست بربكم؟ قالوا بلى، فأعطاه طائفة طائعين، وطائفة على وجه التقية","bs":"\u003cp data-paragraph=\"136.1\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"136.2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Hukkam, koji je rekao: pričao nam je Amr ibn Kajs, od Ataa, od Seida, od Ibn Abbasa,\u003c/span> o riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.“ Rekao je: „Kada je Allah, Silan i Uzvišen, stvorio Adema, potrao mu je leđa u Dehni i iz njegovih leđa izveo svakoga čovjeka kojeg će stvoriti do Kijametskog dana. Rekao je: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’“ Rekao je: „Prema tome, smatraju da se toga dana pero osušilo nad onim što će biti do Kijametskog dana.“ Neki su rekli: „Allah je Ademovo potomstvo izveo iz njegovih slabina na nebu, prije nego što ga je spustio na Zemlju, a nakon što ga je izveo iz Dženneta.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio. Toponim je u izvoru zapisan بدحنا; izgovor „Dehna“ približan je.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"136.3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"136.4\">\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Amr ibn Hammad, od Esbata, od Suddija,\u003c/span> o riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Allah je izveo Adema iz Dženneta, ali ga još nije spustio s neba. Zatim je potrao desnu stranu Ademovih leđa, pa iz njega izveo potomstvo poput sitnih mrava, bijelo poput bisera. Rekao im je: ‘Uđite u Džennet Mojom milošću.’ Potrao je lijevu stranu njegovih leđa, pa iz njega izveo nešto poput sitnih mrava, crno. Rekao je: ‘Uđite u Vatru i ne marim.’ To je ono kada govori o stanovnicima desne i stanovnicima lijeve strane. Zatim je uzeo zavjet i rekao: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’ Jedna skupina dala Mu je zavjet pokorno, a druga iz tekijje — prikrivajući svoj stvarni stav.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"136.1","ar":"ذكر من قال ذلك:","ar_html":"ذكر من قال ذلك:","ar_isnad_ranges":[],"bs":"Spomen onih koji su to rekli:","bs_html":"Spomen onih koji ، فأعطاه طائفة طائعين، وطائفة على وجه التقية","ar_html":"\u003cspan class=\"isnad\">حدثنا ابن وكيع، قال: حدثنا عمرو بن حماد، عن أسباط، عن السدي\u003c/span>: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قال: أخرج الله آدم من الجنة ولم يهبطه من السماء، ثم إنه مسح من آدم صفحة ظهره اليمنى، فأخرج منه ذرية كهيئة الذر بيضاء مثل اللؤلؤ، فقال لهم: ادخلوا الجنه برحمتي، ومسح صفحه ظهره اليسرى، فأخرج منه كهيئة الذر سودا، فقال: ادخلوا النار ولا أبالي فذلك حين يقول: أصحاب اليمين وأصحاب الشمال ثم أخذ الميثاق فقال: ألست بربكم؟ قالوا بلى، فأعطاه طائفة طائعين، وطائفة على وجه التقية","ar_isnad_ranges":[[0,59]],"bs":"Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Amr ibn Hammad, od Esbata, od Suddija, o riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Allah je izveo Adema iz Dženneta, ali ga još nije spustio s neba. Zatim je potrao desnu stranu Ademovih leđa, pa iz njega izveo potomstvo poput sitnih mrava, bijelo poput bisera. Rekao im je: ‘Uđite u Džennet Mojom milošću.’ Potrao je lijevu stranu njegovih leđa, pa iz njega izveo nešto poput sitnih mrava, crno. Rekao je: ‘Uđite u Vatru i ne marim.’ To je ono kada govori o stanovnicima desne i stanovnicima lijeve strane. Zatim je uzeo zavjet i rekao: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’ Jedna skupina dala Mu je zavjet pokorno, a druga iz tekijje — prikrivajući svoj stvarni stav.“ ⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧","bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Amr ibn Hammad, od Esbata, od Suddija,\u003c/span> o riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Allah je izveo Adema iz Dženneta, ali ga još nije spustio s neba. Zatim je potrao desnu stranu Ademovih leđa, pa iz njega izveo potomstvo poput sitnih mrava, bijelo poput bisera. Rekao im je: ‘Uđite u Džennet Mojom milošću.’ Potrao je lijevu stranu njegovih leđa, pa iz njega izveo nešto poput sitnih mrava, crno. Rekao je: ‘Uđite u Vatru i ne marim.’ To je ono kada govori o stanovnicima desne i stanovnicima lijeve strane. Zatim je uzeo zavjet i rekao: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’ Jedna skupina dala Mu je zavjet pokorno, a druga iz tekijje — prikrivajući svoj stvarni stav.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>","bs_isnad_count":1}],"notes":[]},{"n":137,"ar":"ذكر الأحداث التي كانت في عهد آدم ع بعد أن أهبط إلى الأرض\n\nفكان أول ذلك قتل قابيل بن آدم أخاه هابيل، وأهل العلم يختلفون في اسم قابيل، فيقول بعضهم: هو قين بن آدم، ويقول بعضهم: هو قايين ابن آدم ويقول بعضهم: هو قاين ويقول بعضهم: هو قابيل.\n\nواختلفوا أيضا في السبب الذي من أجله قتله:\nفقال بعضهم في ذلك مَا حَدَّثَنِي بِهِ مُوسَى بن هارون الهمداني، قال:\nحدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من أصحاب رسول الله ص، قَالَ: كَانَ لا يُولَدُ لآدَمَ مَوْلُودٌ إِلا وُلِدَ مَعَهُ جَارِيَةٌ، فَكَانَ يُزَوِّجُ غُلامَ هَذَا البطن جاريه هذا البطن الآخر ويزوج جاريه هذا البطن غلام هَذَا الْبَطْنِ الآخَرِ، حَتَّى وُلِدَ لَهُ ابْنَانِ، يُقَالُ لَهُمَا قَابِيلُ وَهَابِيلُ، وَكَانَ قَابِيلُ صَاحِبَ زَرْعٍ، وَكَانَ هَابِيلُ صَاحِبَ ضَرْعٍ، وَكَانَ قَابِيلُ أَكْبَرَهُمَا، وَكَانَتْ لَهُ أُخْتٌ أَحْسَنَ مِنْ أُخْتِ هَابِيلَ، وَإِنَّ هَابِيلَ طَلَبَ أَنْ يَنْكِحَ أُخْتَ قَابِيلَ، فَأَبَى عَلَيْهِ وَقَالَ: هِيَ أُخْتِي وُلِدَتْ مَعِي، وَهِيَ أَحْسَنُ مِنْ أُخْتِكَ، وَأَنَا أَحَقُّ أَنْ أَتَزَوَّجَهَا، فَأَمَرَهُ أَبُوهُ أَنْ يُزَوِّجَهَا هَابِيلَ، فَأَبَى وَإِنَّهُمَا قَرَّبَا قُرْبَانًا إِلَى اللَّهِ أَيُّهُمَا أَحَقُّ بِالْجَارِيَةِ، وَكَانَ","ar_html":"ذكر الأحداث التي كانت في عهد آدم ع بعد أن أهبط إلى الأرض\n\nفكان أول ذلك قتل قابيل بن آدم أخاه هابيل، وأهل العلم يختلفون في اسم قابيل، فيقول بعضهم: هو قين بن آدم، ويقول بعضهم: هو قايين ابن آدم ويقول بعضهم: هو قاين ويقول بعضهم: هو قابيل.\n\nواختلفوا أيضا في السبب الذي من أجله قتله:\nفقال بعضهم في ذلك مَا \u003cspan class=\"isnad\">حَدَّثَنِي بِهِ مُوسَى بن هارون الهمداني، قال:\nحدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من أصحاب رسول الله ص، قَال\u003c/span>َ: كَانَ لا يُولَدُ لآدَمَ مَوْلُودٌ إِلا وُلِدَ مَعَهُ جَارِيَةٌ، فَكَانَ يُزَوِّجُ غُلامَ هَذَا البطن جاريه هذا البطن الآخر ويزوج جاريه هذا البطن غلام هَذَا الْبَطْنِ الآخَرِ، حَتَّى وُلِدَ لَهُ ابْنَانِ، يُقَالُ لَهُمَا قَابِيلُ وَهَابِيلُ، وَكَانَ قَابِيلُ صَاحِبَ زَرْعٍ، وَكَانَ هَابِيلُ صَاحِبَ ضَرْعٍ، وَكَانَ قَابِيلُ أَكْبَرَهُمَا، وَكَانَتْ لَهُ أُخْتٌ أَحْسَنَ مِنْ أُخْتِ هَابِيلَ، وَإِنَّ هَابِيلَ طَلَبَ أَنْ يَنْكِحَ أُخْتَ قَابِيلَ، فَأَبَى عَلَيْهِ وَقَالَ: هِيَ أُخْتِي وُلِدَتْ مَعِي، وَهِيَ أَحْسَنُ مِنْ أُخْتِكَ، وَأَنَا أَحَقُّ أَنْ أَتَزَوَّجَهَا، فَأَمَرَهُ أَبُوهُ أَنْ يُزَوِّجَهَا هَابِيلَ، فَأَبَى وَإِنَّهُمَا قَرَّبَا قُرْبَانًا إِلَى اللَّهِ أَيُّهُمَا أَحَقُّ بِالْجَارِيَةِ، وَكَانَ","bs":"\u003cp data-paragraph=\"137.1\">Spomen događaja iz Ademovog, alejhis-selam, vremena nakon što je spušten na Zemlju\u003c/p>\u003cp data-paragraph=\"137.2\">Prvi od tih događaja bio je kada je Kabil, Ademov sin, ubio svoga brata Habila. Učeni ljudi razilaze se o Kabilovom imenu. Neki kažu da je to Kajn, Ademov sin; neki kažu Kajin, Ademov sin; neki kažu Kain, a neki Kabil. \u003cspan class=\"translator-note\">⟦Arapski oblici imena, navedenim redom: قين، قايين، قاين، قابيل.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"137.3\">Razišli su se i o razlogu zbog kojeg ga je ubio. Neki su o tome rekli ono što \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, koji je rekao:\u003c/span> „Ademu se nije rodio dječak a da se s njim nije rodila i djevojčica. Dječaka iz jednoga poroda ženio je djevojčicom iz drugoga poroda, a djevojčicu iz jednoga poroda udavao za dječaka iz drugoga. Tako su mu rođena dva sina po imenu Kabil i Habil. Kabil je obrađivao zemlju, a Habil držao stoku. Kabil je bio stariji. Imao je sestru ljepšu od Habilove sestre. Habil je zatražio da se oženi Kabilovom sestrom, ali je Kabil odbio i rekao: ‘Ona je moja sestra, rođena sa mnom; ljepša je od tvoje sestre i ja imam više prava da se njome oženim.’ Otac mu je naredio da je uda za Habila, ali je odbio. Njih su dvojica Allahu prinijeli žrtvu da se pokaže koji ima više prava na djevojku. Tada je\u003c/p>","paragraphs":[{"id":"137.1","ar":"ذكر الأحداث التي كانت في عهد آدم ع بعد أن أهبط إلى الأرض","ar_html":"ذكر الأحداث التي كانت في عهد آدم ع بعد أن أهبط إلى الأرض","ar_isnad_ranges":[],"bs":"Spomen događaja iz Ademovog, alejhis-selam, vremena nakon što je spušten na Zemlju","bs_html":"Spomen događaja iz Ademovog, alejhis-selam, vremena nakon što je spušten na Zemlju","bs_isnad_count":0},{"id":"137.2","ar":"فكان أول ذلك قتل قابيل بن آدم أخاه هابيل، وأهل العلم يختلفون في اسم قابيل، فيقول بعضهم: هو قين بن آدم، ويقول بعضهم: هو قايين ابن آدم ويقول بعضهم: هو قاين ويقول بعضهم: هو قابيل.","ar_html":"فكان أول ذلك قتل قابيل بن آدم أخاه هابيل، وأهل العلم يختلفون في اسم قابيل، فيقول بعضهم: هو قين بن آدم، ويقول بعضهم: هو قايين ابن آدم ويقول بعضهم: هو قاين ويقول بعضهم: هو قابيل.","ar_isnad_ranges":[],"bs":"Prvi od tih događaja bio je kada je Kabil, Ademov sin, ubio svoga brata Habila. Učeni ljudi razilaze se o Kabilovom imenu. Neki kažu da je to Kajn, Ademov sin; neki kažu Kajin, Ademov sin; neki kažu Kain, a neki Kabil. ⟦Arapski oblici imena, navedenim redom: قين، قايين، قاين، قابيل.⟧","bs_html":"Prvi od tih događaja bio je kada je Kabil, Ademov sin, ubio svoga brata Habila. Učeni ljudi razilaze se o Kabilovom imenu. Neki kažu da je to Kajn, Ademov sin; neki kažu Kajin, Ademov sin; neki kažu Kain, a neki Kabil. \u003cspan class=\"translator-note\">⟦Arapski oblici imena, navedenim redom: قين، قايين، قاين، قابيل.⟧\u003c/span>","bs_isnad_count":0},{"id":"137.3","ar":"واختلفوا أيضا في السبب الذي من أجله قتله:\nفقال بعضهم في ذلك مَا حَدَّثَنِي بِهِ مُوسَى بن هارون الهمداني، قال:\nحدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من أصحاب رسول الله ص، قَالَ: كَانَ لا يُولَدُ لآدَمَ مَوْلُودٌ إِلا وُلِدَ مَعَهُ جَارِيَةٌ، فَكَانَ يُزَوِّجُ غُلامَ هَذَا البطن جاريه هذا البطن الآخر ويزوج جاريه هذا البطن غلام هَذَا الْبَطْنِ الآخَرِ، حَتَّى وُلِدَ لَهُ ابْنَانِ، يُقَالُ لَهُمَا قَابِيلُ وَهَابِيلُ، وَكَانَ قَابِيلُ صَاحِبَ زَرْعٍ، وَكَانَ هَابِيلُ صَاحِبَ ضَرْعٍ، وَكَانَ قَابِيلُ أَكْبَرَهُمَا، وَكَانَتْ لَهُ أُخْتٌ أَحْسَنَ مِنْ أُخْتِ هَابِيلَ، وَإِنَّ هَابِيلَ طَلَبَ أَنْ يَنْكِحَ أُخْتَ قَابِيلَ، فَأَبَى عَلَيْهِ وَقَالَ: هِيَ أُخْتِي وُلِدَتْ مَعِي، وَهِيَ أَحْسَنُ مِنْ أُخْتِكَ، وَأَنَا أَحَقُّ أَنْ أَتَزَوَّجَهَا، فَأَمَرَهُ أَبُوهُ أَنْ يُزَوِّجَهَا هَابِيلَ، فَأَبَى وَإِنَّهُمَا قَرَّبَا قُرْبَانًا إِلَى اللَّهِ أَيُّهُمَا أَحَقُّ بِالْجَارِيَةِ، وَكَانَ","ar_html":"واختلفوا أيضا في السبب الذي من أجله قتله:\nفقال بعضهم في ذلك مَا \u003cspan class=\"isnad\">حَدَّثَنِي بِهِ مُوسَى بن هارون الهمداني، قال:\nحدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من أصحاب رسول الله ص، قَال\u003c/span>َ: كَانَ لا يُولَدُ لآدَمَ مَوْلُودٌ إِلا وُلِدَ مَعَهُ جَارِيَةٌ، فَكَانَ يُزَوِّجُ غُلامَ هَذَا البطن جاريه هذا البطن الآخر ويزوج جاريه هذا البطن غلام هَذَا الْبَطْنِ الآخَرِ، حَتَّى وُلِدَ لَهُ ابْنَانِ، يُقَالُ لَهُمَا قَابِيلُ وَهَابِيلُ، وَكَانَ قَابِي وسِ الْجِبَالِ، فَأَتَاهُ يَوْمًا مِنَ الأَيَّامِ وَهُوَ يَرْعَى غَنَمَهُ فِي جَبَلٍ وَهُوَ نَائِمٌ، فَرَفَعَ صَخْرَةً فَشَدَخَ بِهَا رَأْسَهُ، فَمَاتَ وَتَرَكَهُ بِالْعَرَاءِ، لا يَعْلَمُ كَيْفَ يُدْفَنُ، فَبَعَثَ اللَّهُ غُرَابَيْنِ أَخَوَيْنِ فَاقْتَتَلا، فَقَتَلَ أَحَدُهُمَا صَاحِبَهُ، فَحَفَرَ لَهُ ثُمَّ حثا عليه، فلما رآه قال: «يا وَيْلَتى أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هذَا الْغُرابِ فَأُوارِيَ سَوْأَةَ أَخِي» ، فَهُوَ قَوْلُهُ عَزَّ وَجَلَّ: «فَبَعَثَ اللَّهُ غُراباً يَبْحَثُ فِي الْأَرْضِ لِيُرِيَهُ كَيْفَ يُوارِي سَوْأَةَ أَخِيهِ» فَرَجَعَ آدَمُ فَوَجَدَ ابْنَهُ قَدْ قَتَلَ أَخَاهُ، فَذَلِكَ حِينَ يَقُولُ اللَّهُ عَزَّ وَجَلَّ: «إِنَّا عَرَضْنَا الْأَمانَةَ عَلَى السَّماواتِ وَالْأَرْضِ وَالْجِبالِ» - إِلَى آخِرِ الآيَةِ- «إِنَّهُ كانَ ظَلُوماً جَهُولًا\n» يَعْنِي قَابِيلَ حِينَ حَمَلَ أَمَانَةَ آدَمَ، ثُمَّ لَمْ يَحْفَظْ لَهُ أَهْلَهُ","ar_html":"آدَمُ يَوْمَئِذٍ قَدْ غَابَ عَنْهُمَا وَأَتَى مَكَّةَ يَنْظُرُ إِلَيْهَا، قَالَ اللَّهُ لآدَمَ: يَا آدَمُ، هَلْ تَعْلَمُ أَنَّ لِي بَيْتًا فِي الأَرْضِ؟ قَالَ: اللَّهُمَّ لا، قَالَ: فَإِنَّ لِي بَيْتًا بِمَكَّةَ فَأْتِهِ، فَقَالَ آدَمُ لِلسَّمَاءِ: احْفَظِي وَلَدَيَّ بِالأَمَانَةِ، فَأَبَتْ، وَقَالَ لِلأَرْضِ فَأَبَتْ، وَقَالَ لِلْجِبَالِ: فَأَبَتْ، فَقَالَ لِقَابِيلَ، فَقَالَ: نَعَمْ، تَذْهَبُ وَتَرْجِعُ وَتَجِدُ أَهْلَكَ كَمَا يَسُرُّكَ فَلَمَّا انْطَلَقَ آدَمُ قَرَّبَا قُرْبَانًا، وَكَانَ قَابِيلُ يَفْخَرُ عَلَيْهِ فَيَقُولُ: أَنَا أَحَقُّ بِهَا مِنْكَ هِيَ أُخْتِي، وَأَنَا أَكْبَرُ مِنْكَ، وَأَنَا وَصِيُّ وَالِدِي، فَلَمَّا قَرَّبَا، قَرَّبَ هَابِيلُ جَذَعَةَ سَمِينَةً، وَقَرَّبَ قَابِيلُ حِزْمَةَ سُنْبُلٍ، فَوَجَدَ فِيهَا سُنْبُلَةً عَظِيمَةً فَفَرَكَهَا فَأَكَلَهَا، فَنَزَلَتِ النَّارُ فَأَكَلَتْ قُرْبَانَ هَابِيلَ، وَتَرَكَتْ قُرْبَانَ قَابِيلَ، فَغَضِبَ وَقَالَ: لأَقْتُلَنَّكَ حَتَّى لا تَنْكِحَ أُخْتِي، فَقَالَ هَابِيلُ:\n«إِنَّما يَتَقَبَّلُ اللَّهُ مِنَ الْمُتَّقِينَ لَئِنْ بَسَطْتَ إِلَيَّ يَدَكَ لِتَقْتُلَنِي مَا أَنَا بِباسِطٍ يَدِيَ إِلَيْكَ لِأَقْتُلَكَ» ، إِلَى قَوْلِهِ: «فَطَوَّعَتْ لَهُ نَفْسُهُ قَتْلَ أَخِيهِ» ، فَطَلَبَهُ لِيَقْتُلَهُ، فَرَاغَ الْغُلامُ مِنْهُ فِي رُءُوسِ الْجِبَالِ، فَأَتَاهُ يَوْمًا مِنَ الأَيَّامِ وَهُوَ يَرْعَى غَنَمَهُ فِي جَبَلٍ وَهُوَ نَائِمٌ، فَرَفَعَ صَخْرَةً فَشَدَخَ بِهَا رَأْسَهُ، فَمَاتَ وَتَرَكَهُ بِالْعَرَاءِ، لا يَعْلَمُ كَيْفَ يُدْفَنُ، فَبَعَثَ اللَّهُ غُرَابَيْنِ أَخَوَيْنِ فَاقْتَتَلا، فَقَتَلَ أَحَدُهُمَا صَاحِبَهُ، فَحَفَرَ لَهُ ثُمَّ حثا عليه، فلما رآه قال: «يا وَيْلَتى أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هذَا الْغُرابِ فَأُوارِيَ سَوْأَةَ أَخِي» ، فَهُوَ قَوْلُهُ عَزَّ وَجَلَّ: «فَبَعَثَ اللَّهُ غُراباً يَبْحَثُ فِي الْأَرْضِ لِيُرِيَهُ كَيْفَ يُوارِي سَوْأَةَ أَخِيهِ» فَرَجَعَ آدَمُ فَوَجَدَ ابْنَهُ قَدْ قَتَلَ أَخَاهُ، فَذَلِكَ حِينَ يَقُولُ اللَّهُ عَزَّ وَجَلَّ: «إِنَّا عَرَضْنَا الْأَمانَةَ عَلَى السَّماواتِ وَالْأَرْضِ وَالْجِبالِ» - إِلَى آخِرِ الآيَةِ- «إِنَّهُ كانَ ظَلُوماً جَهُولًا\n» يَعْنِي قَابِيلَ حِينَ حَمَلَ أَمَانَةَ آدَمَ، ثُمَّ لَمْ يَحْفَظْ لَهُ أَهْلَهُ","bs":"\u003cp data-paragraph=\"138.1\">Adem bio odsutan od njih i otišao u Meku da je vidi. Allah je rekao Ademu: ‘Ademe, znaš li da Ja na Zemlji imam Hram?’ Odgovorio je: ‘Allahu moj, ne znam.’ Rekao je: ‘Imam Hram u Meki, pa mu otiđi.’ Adem je nebu rekao: ‘Čuvaj moju djecu kao povjereni emanet’, ali je odbilo. Rekao je to i Zemlji, pa je odbila, a rekao je i planinama, pa su odbile. Rekao je to Kabilu i on je odgovorio: ‘Hoću. Otići ćeš, vratiti se i zateći svoju porodicu onakvom kakva će te obradovati.’ Kada je Adem otišao, prinijeli su žrtve. Kabil se uznosio nad njim govoreći: ‘Ja imam više prava na nju nego ti. Ona je moja sestra, stariji sam od tebe i ja sam očev oporučeni nasljednik.’ Kada su prinijeli, Habil je prinio debelu mladu ovcu, a Kabil svežanj klasova. U njemu je našao velik klas, protrljao ga i pojeo. Spustila se vatra, pojela Habilovu žrtvu, a ostavila Kabilovu. On se rasrdio i rekao: ‘Ubit ću te da se ne oženiš mojom sestrom.’ Habil je rekao: ‘Allah prima samo od bogobojaznih. Ako pružiš ruku prema meni da me ubiješ, ja neću pružiti svoju ruku prema tebi da te ubijem’ — do Njegovih riječi: ‘Pa mu je njegova duša uljepšala ubistvo brata.’ Tražio ga je da ga ubije, a mladić mu je izmicao po planinskim vrhovima. Jednoga dana došao mu je dok je na planini čuvao ovce i spavao. Podigao je stijenu i njome mu smrskao glavu, pa je umro. Ostavio ga je na otvorenom, ne znajući kako se sahranjuje. Allah je poslao dva gavrana, braću, pa su se potukli. Jedan je ubio drugoga, zatim mu iskopao rupu i na njega nagrnuo zemlju. Kada je to vidio, rekao je: ‘Teško meni! Zar sam nemoćan biti poput ovoga gavrana i zakopati tijelo svoga brata?’ To su riječi Njega, Silnog i Uzvišenog: ‘Pa je Allah poslao gavrana da kopa po zemlji kako bi mu pokazao kako da zakopa tijelo svoga brata.’ Adem se vratio i zatekao da je njegov sin ubio brata. To je ono kada Allah, Silan i Uzvišen, kaže: ‘Mi smo ponudili emanet nebesima, Zemlji i planinama’ — do kraja ajeta: ‘On je, doista, nepravedan i neznalica.’ Time se misli na Kabila, kada je preuzeo Ademov emanet, a zatim mu nije sačuvao porodicu.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Maida, 5:27–28, navedeni dijelovi; 5:30, navedeni dio; 5:31, navedeni dijelovi; El-Ahzab, 33:72, navedeni početak i završetak. Prijelazi „do“ potječu iz izvora. Završno poistovjećivanje s Kabilom pripada navedenoj predaji.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"138.1","ar":"آدَمُ يَوْمَئِذٍ قَدْ غَابَ عَنْهُمَا وَأَتَى مَكَّةَ يَنْظُرُ إِلَيْهَا، قَالَ اللَّهُ لآدَمَ: يَا آدَمُ، هَلْ تَعْلَمُ أَنَّ لِي بَيْتًا فِي الأَرْضِ؟ قَالَ: اللَّهُمَّ لا، قَالَ: فَإِنَّ لِي بَيْتًا بِمَكَّةَ فَأْتِهِ، فَقَالَ آدَمُ لِلسَّمَاءِ: احْفَظِي وَلَدَيَّ بِالأَمَانَةِ، فَأَبَتْ، وَقَالَ لِلأَرْضِ فَأَبَتْ، وَقَالَ لِلْجِبَالِ: فَأَبَتْ، فَقَالَ لِقَابِيلَ، فَقَالَ: نَعَمْ، تَذْهَبُ وَتَرْجِعُ وَتَجِدُ أَهْلَكَ كَمَا يَسُرُّكَ فَلَمَّا انْطَلَقَ آدَمُ قَرَّبَا قُرْبَانًا، وَكَانَ قَابِيلُ يَفْخَرُ عَلَيْهِ فَيَقُولُ: أَنَا أَحَقُّ بِهَا مِنْكَ هِيَ أُخْتِي، وَأَنَا أَكْبَرُ مِنْكَ، وَأَنَا وَصِيُّ وَالِدِي، فَلَمَّا قَرَّبَا، قَرَّبَ هَابِيلُ جَذَعَةَ سَمِينَةً، وَقَرَّبَ قَابِيلُ حِزْمَةَ سُنْبُلٍ، فَوَجَدَ فِيهَا سُنْبُلَةً عَظِيمَةً فَفَرَكَهَا فَأَكَلَهَا، فَنَزَلَتِ النَّارُ فَأَكَلَتْ قُرْبَانَ هَابِيلَ، وَتَرَكَتْ قُرْبَانَ قَابِيلَ، فَغَضِبَ وَقَالَ: لأَقْتُلَنَّكَ حَتَّى لا تَنْكِحَ أُخْتِي، فَقَالَ هَابِيلُ:\n«إِنَّما يَتَقَبَّلُ اللَّهُ مِنَ الْمُتَّقِينَ لَئِنْ بَسَطْتَ إِلَيَّ يَدَكَ لِتَقْتُلَنِي مَا أَنَا بِباسِطٍ يَدِيَ إِلَيْكَ لِأَقْتُلَكَ» ، إِلَى قَوْلِهِ: «فَطَوَّعَتْ لَهُ نَفْسُهُ قَتْلَ أَخِيهِ» ، فَطَلَبَهُ لِيَقْتُلَهُ، فَرَاغَ الْغُلامُ مِنْهُ فِي رُءُوسِ الْجِبَالِ، فَأَتَاهُ يَوْمًا مِنَ الأَيَّامِ وَهُوَ يَرْعَى غَنَمَهُ فِي جَبَلٍ وَهُوَ نَائِمٌ، فَرَفَعَ صَخْرَةً فَشَدَخَ بِهَا رَأْسَهُ، فَمَاتَ وَتَرَكَهُ بِالْعَرَاءِ، لا يَعْلَمُ كَيْفَ يُدْفَنُ، فَبَعَثَ اللَّهُ غُرَابَيْنِ أَخَوَيْنِ فَاقْتَتَلا، فَقَتَلَ أَحَدُهُمَا صَاحِبَهُ، فَحَفَرَ لَهُ ثُمَّ حثا عليه، فلما رآه قال: «يا وَيْلَتى أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هذَا الْغُرابِ فَأُوارِيَ سَوْأَةَ أَخِي» ، فَهُوَ قَوْلُهُ عَزَّ وَجَلَّ: «فَبَعَثَ اللَّهُ غُراباً يَبْحَثُ فِي الْأَرْضِ لِيُرِيَهُ كَيْفَ يُوارِي سَوْأَةَ أَخِيهِ» فَرَجَعَ آدَمُ فَوَجَدَ ابْنَهُ قَدْ قَتَلَ أَخَاهُ، فَذَلِكَ حِينَ يَقُولُ اللَّهُ عَزَّ وَجَلَّ: «إِنَّا عَرَضْنَا الْأَمانَةَ عَلَى السَّماواتِ وَالْأَرْضِ وَالْجِبالِ» - إِلَى آخِرِ الآيَةِ- «إِنَّهُ كانَ ظَلُوماً جَهُولًا\n» يَعْنِي قَابِيلَ حِينَ حَمَلَ أَمَانَةَ آدَمَ، ثُمَّ لَمْ يَحْفَظْ لَهُ أَهْلَهُ","ar_html":"آدَمُ يَوْمَئِذٍ قَدْ غَابَ عَنْهُمَا وَأَتَى مَكَّةَ يَنْظُرُ إِلَيْهَا، قَالَ اللَّهُ لآدَمَ: يَا آدَمُ، هَلْ تَعْلَمُ أَنَّ لِي بَيْتًا فِي الأَرْضِ؟ قَالَ: اللَّهُمَّ لا، قَالَ: فَإِنَّ لِي بَيْتًا بِمَكَّةَ فَأْتِهِ، فَقَالَ آدَمُ لِلسَّمَاءِ: احْفَظِي وَلَدَيَّ بِالأَمَانَةِ، فَأَبَتْ، وَقَالَ لِلأَرْضِ فَأَبَتْ، وَقَالَ لِلْجِبَالِ: فَأَبَتْ، فَقَالَ لِقَابِيلَ، فَقَالَ: نَعَمْ، تَذْهَبُ وَتَرْجِعُ وَتَجِدُ أَهْلَكَ كَمَا يَسُرُّكَ فَلَمَّا انْطَلَقَ آدَمُ قَرَّبَا قُرْبَانًا، وَكَانَ قَابِيلُ يَفْخَرُ عَلَيْ oju porodicu onakvom kakva će te obradovati.’ Kada je Adem otišao, prinijeli su žrtve. Kabil se uznosio nad njim govoreći: ‘Ja imam više prava na nju nego ti. Ona je moja sestra, stariji sam od tebe i ja sam očev oporučeni nasljednik.’ Kada su prinijeli, Habil je prinio debelu mladu ovcu, a Kabil svežanj klasova. U njemu je našao velik klas, protrljao ga i pojeo. Spustila se vatra, pojela Habilovu žrtvu, a ostavila Kabilovu. On se rasrdio i rekao: ‘Ubit ću te da se ne oženiš mojom sestrom.’ Habil je rekao: ‘Allah prima samo od bogobojaznih. Ako pružiš ruku prema meni da me ubiješ, ja neću pružiti svoju ruku prema tebi da te ubijem’ — do Njegovih riječi: ‘Pa mu je njegova duša uljepšala ubistvo brata.’ Tražio ga je da ga ubije, a mladić mu je izmicao po planinskim vrhovima. Jednoga dana došao mu je dok je na planini čuvao ovce i spavao. Podigao je stijenu i njome mu smrskao glavu, pa je umro. Ostavio ga je na otvorenom, ne znajući kako se sahranjuje. Allah je poslao dva gavrana, braću, pa su se potukli. Jedan je ubio drugoga, zatim mu iskopao rupu i na njega nagrnuo zemlju. Kada je to vidio, rekao je: ‘Teško meni! Zar sam nemoćan biti poput ovoga gavrana i zakopati tijelo svoga brata?’ To su riječi Njega, Silnog i Uzvišenog: ‘Pa je Allah poslao gavrana da kopa po zemlji kako bi mu pokazao kako da zakopa tijelo svoga brata.’ Adem se vratio i zatekao da je njegov sin ubio brata. To je ono kada Allah, Silan i Uzvišen, kaže: ‘Mi smo ponudili emanet nebesima, Zemlji i planinama’ — do kraja ajeta: ‘On je, doista, nepravedan i neznalica.’ Time se misli na Kabila, kada je preuzeo Ademov emanet, a zatim mu nije sačuvao porodicu.“ ⟦Prijevodi kur’anskih navoda: El-Maida, 5:27–28, navedeni dijelovi; 5:30, navedeni dio; 5:31, navedeni dijelovi; El-Ahzab, 33:72, navedeni početak i završetak. Prijelazi „do“ potječu iz izvora. Završno poistovjećivanje s Kabilom pripada navedenoj predaji.⟧","bs_html":"Adem bio odsutan od njih i otišao u Meku da je vidi. Allah je rekao Ademu: ‘Ademe,
