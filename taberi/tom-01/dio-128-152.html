<!doctype html><html lang="bs"><head><meta charset="utf-8"><title>Taberi · tom 1 · 128–152</title></head><body><script id="partData" type="application/json">{"id":"01-006","start":128,"end":152,"pages":[{"n":128,"html":"\u003csection class=\"page\" data-page=\"128\" id=\"stranica-128\">\u003ch2>Stranica 128\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 128\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"128.1\" id=\"ar-odlomak-128-1\">حِينَ أُهْبِطَ عَلَى الْجَبَلِ إِلَى قَضِيبٍ مِنْ حَدِيدٍ نَابِتٍ عَلَى الْجَبَلِ، فَقَالَ: هَذَا مِنْ هَذَا، فَجَعَلَ يَكْسِرُ أَشْجَارًا قَدْ عَتِقَتْ وَيَبِسَتْ بِالمِطْرَقَةِ، ثُمَّ أَوْقَدَ عَلَى ذَلِكَ الْغُصْنُ حَتَّى ذَابَ، فَكَانَ أَوَّلُ شَيْءٍ ضَرَبَهُ مُدْيَةً، فَكَانَ يَعْمَلُ بِهَا، ثُمَّ ضَرَبَ التَّنُّورَ، وَهُوَ الَّذِي وَرِثَهُ نُوحٌ، وَهُوَ الَّذِي فَارَ بِالْعَذَابِ بِالْهِنْدِ.\u003c/p>\u003cp data-pair=\"128.2\" id=\"ar-odlomak-128-2\">وَكَانَ آدَمُ حِينَ هَبَطَ يَمْسَحُ رَأْسَهُ السَّمَاءُ، فَمِنْ ثَمَّ صَلِعَ، وَأَوْرَثَ وَلَدَهُ الصَّلَعَ وَنَفَرَتْ مِنْ طُولِهِ دَوَابُّ الْبَرِّ، فَصَارَتْ وَحْشًا مِنْ يومئذ، وكان آدم ع وَهُوَ عَلَى ذَلِكَ الْجَبَلِ قَائِمٌ يَسْمَعُ أَصْوَاتَ الْمَلائِكَةِ، وَيَجِدُ رِيحَ الْجَنَّةِ، فَحُطَّ مِنْ طُولِهِ ذَلِكَ إِلَى سِتِّينَ ذِرَاعًا، فَكَانَ ذَلِكَ طُولُهُ إِلَى أَنْ مَاتَ وَلَمْ يُجْمَعْ حُسْنُ آدَمَ ع لأحد من ولده الا ليوسف ع.\u003c/p>\u003cp data-pair=\"128.3\" id=\"ar-odlomak-128-3\">وَقِيلَ: إِنَّ مِنَ الثِّمَارِ الَّتِي زَوَّدَ اللَّهُ عز وجل آدم ع حين اهبط إِلَى الأَرْضِ ثَلاثِينَ نَوْعًا، عَشَرَةً مِنْهَا فِي الْقُشُورِ وَعَشَرَةً لَهَا نَوَى، وَعَشَرَةً لا قُشُورَ لَهَا وَلا نَوَى فَأَمَّا الَّتِي فِي الْقُشُورِ مِنْهَا فَالْجَوْزُ، وَاللَّوْزُ، وَالْفُسْتُقُ، وَالْبُنْدُقُ، وَالْخَشْخَاشُ، وَالْبَلُّوطُ، والشاهبلوط، وَالرَّانِجُ، وَالرُّمَّانُ، وَالْمَوْزُ وَأَمَّا الَّتِي لَهَا نَوَى مِنْهَا فَالْخَوْخُ، وَالْمِشْمِشُ، وَالإِجَّاصُ، وَالرُّطَبُ، وَالْغُبَيْرَاءُ، وَالنَّبَقُ، وَالزُّعْرُورُ، وَالْعِنَّابُ، وَالْمُقْلُ، وَالشَّاهَلُوجُ وَأَمَّا الَّتِي لا قُشُورَ لَهَا وَلا نَوَى فَالتُّفَّاحُ، وَالسَّفَرْجَلُ، وَالْكُمَّثْرَى، وَالْعِنَبُ، وَالتُّوتُ، وَالتِّينُ، وَالأُتْرُجُّ، وَالْخُرْنُوبُ، وَالْخِيارُ، وَالْبِطِّيخُ.\u003c/p>\u003cp data-pair=\"128.4\" id=\"ar-odlomak-128-4\">وَقِيلَ: كَانَ مِمَّا أَخْرَجَ آدَمُ مَعَهُ مِنَ الْجَنَّةِ صُرَّةٌ مِنْ حِنْطَةٍ، وَقِيلَ: إِنَّ الْحِنْطَةَ انما جاءه بها جبرئيل ع بَعْدَ أَنْ جَاعَ آدَمُ، وَاسْتَطْعَمَ رَبَّهُ، فَبَعَثَ الله اليه مع جبرئيل ع بِسَبْعِ حَبَّاتٍ مِنْ حِنْطَةٍ، فَوَضَعَهَا فِي يَدِ آدم ع، فقال آدم لجبرئيل: ما هذا؟ فقال له جبرئيل: هَذَا الَّذِي أَخْرَجَكَ مِنَ الْجَنَّةِ، وَكَانَ وَزْنُ الحبه منها مائه الف درهم وثمانمائه دِرْهَمٍ، فَقَالَ آدَمُ:\nمَا أَصْنَعُ بِهَذَا؟ قَالَ: انْثُرْهُ فِي الأَرْضِ فَفَعَلَ، فَأَنْبَتَهُ اللَّهُ عَزَّ وَجَلَّ مِنْ سَاعَتِهِ، فَجَرَتْ سُنَّةٌ فِي وَلَدِهِ الْبَذْرُ فِي الأَرْضِ، ثُمَّ أَمَرَهُ فَحَصَدَهُ، ثُمَّ أَمَرَهُ فَجَمَعَهُ وَفَرَكَهُ بِيَدِهِ، ثُمَّ أَمَرَهُ أَنْ يُذْرِيَهُ، ثُمَّ أَتَاهُ بِحَجَرَيْنِ فَوَضَعَ أَحَدَهُمَا عَلَى الآخر\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 128\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"128.1\" id=\"odlomak-128-1\">željeznu šipku koja je izrastala na planini i rekao: ‘Ovo je od ovoga.’ Čekićem je počeo lomiti stara i osušena stabla, zatim je nad tom granom raspalio vatru dok se nije istopila. Prvo što je iskovao bio je nož kojim je radio. Zatim je iskovao peć, koju je naslijedio Nuh, i to je ona iz koje je u Indiji izbio talas kazne.\u003c/p>\u003cp data-pair=\"128.2\" id=\"odlomak-128-2\">Kada je Adem spušten, nebo mu je dodirivalo glavu. Zato je oćelavio i svojim potomcima prenio ćelavost. Zemaljske životinje prepale su se njegove visine, pa su od toga dana postale divlje. Dok je Adem, alejhis-selam, stajao na toj planini, slušao je glasove meleka i osjećao džennetski miris. Zatim je njegova visina smanjena na šezdeset lakata i takva je ostala do njegove smrti. Ademova, alejhis-selam, ljepota nije u cijelosti objedinjena ni u jednom njegovom potomku osim u Jusufu, alejhis-selam.\u003c/p>\u003cp data-pair=\"128.3\" id=\"odlomak-128-3\">Rečeno je da je među plodovima kojima je Allah, Silan i Uzvišen, opskrbio Adema, alejhis-selam, kada je spušten na Zemlju, bilo trideset vrsta: deset u ljuskama, deset s košticama i deset bez ljuske i koštice. U ljuskama su: orah, badem, pistacija, lješnjak, mak, žir, pitomi kesten, randž, nar i banana. S košticama su: breskva, kajsija, šljiva, svježa datula, gubejra, nebek, glog, unab, mukl i šahludž. Bez ljuske i koštice su: jabuka, dunja, kruška, grožđe, dud, smokva, četrun, rogač, krastavac i lubenica. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: klasifikacija i svih trideset naziva sačuvani su prema izvoru. Nazivi الرانج، الغبيراء، النبق، العناب، المقل، الشاهلوج preneseni su kao randž, gubejra, nebek, unab, mukl i šahludž; njihova precizna botanička identifikacija nije ovdje potvrđena.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"128.4\" id=\"odlomak-128-4\">Rečeno je da je Adem sa sobom iz Dženneta iznio i vrećicu pšenice. Rečeno je i da mu je pšenicu donio Džibril, alejhis-selam, nakon što je Adem ogladnio i zatražio hranu od svoga Gospodara. Allah mu je preko Džibrila, alejhis-selam, poslao sedam zrna pšenice, pa ih je stavio u Ademovu, alejhis-selam, ruku. Adem je upitao Džibrila: ‘Šta je ovo?’ Džibril mu je odgovorio: ‘Ovo je ono što te izvelo iz Dženneta.’ Težina jednoga zrna bila je stotinu hiljada i osam stotina dirhema. Adem je rekao: ‘Šta da radim s ovim?’ Odgovorio je: ‘Posij to po zemlji.’ Učinio je to, pa je Allah, Silan i Uzvišen, dao da nikne istoga časa. Tako je sijanje po zemlji postalo ustaljena praksa među njegovim potomcima. Zatim mu je naredio da požanje, pa je požnjeo. Potom mu je naredio da sakupi i protrlja rukama, zatim da ovije. Onda mu je donio dva kamena i položio jedan na drugi,\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":129,"html":"\u003csection class=\"page\" data-page=\"129\" id=\"stranica-129\">\u003ch2>Stranica 129\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 129\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"129.1\" id=\"ar-odlomak-129-1\">فَطَحَنَهُ، ثُمَّ أَمَرَهُ أَنْ يَعْجِنَهُ، ثُمَّ أَمَرَهُ ان يخبزه مله، وجمع له جبرئيل ع الْحَجَرَ وَالْحَدِيدَ فَقَدَحَهُ، فَخَرَجَتْ مِنْهُ النَّارُ، فَهُوَ أول من خبز الملة.\u003c/p>\u003cp data-pair=\"129.2\" id=\"ar-odlomak-129-2\">وهذا القول الَّذِي حَكَيْنَاهُ عَنْ قَائِلِ هَذَا الْقَوْلِ، خِلافُ مَا جَاءَتْ بِهِ الرِّوَايَاتُ عَنْ سَلَفِ أُمَّةِ نبينا ص، وَذَلِكَ أَنَّ الْمُثَنَّى بْنَ إِبْرَاهِيمَ \u003cspan class=\"isnad\">حَدَّثَنِي أَنَّ إِسْحَاقَ حَدَّثَهُ، قَالَ: حَدَّثَنَا عَبْدُ الرَّزَّاقِ، قَالَ: أَخْبَرَنَا سُفْيَانُ بْنُ عُيَيْنَةَ وَابْنُ الْمُبَارَكِ، عَنِ الْحَسَنِ بْنِ عُمَارَةَ، عَنِ الْمِنْهَالِ بْنِ عَمْرٍو، وعن سعيد ابن جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>كَانَتِ الشَّجَرَةَ الَّتِي نَهَى اللَّهُ عَنْهَا آدَمَ وَزَوْجَتَهُ السُّنْبُلَةُ، فَلَمَّا أَكَلا مِنْهَا بَدَتْ لَهُمَا سَوْءَاتُهُمَا، وَكَانَ الَّذِي وَارَى عَنْهُمَا مِنْ سَوْءَاتِهِمَا أَظْفَارُهُمَا، وَطَفِقَا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ، وَرَقِ التِّينِ يُلْصِقَانِ بَعْضَهَا إِلَى بَعْضٍ، فَانْطَلَقَ آدَمُ مُوَلِّيًا فِي الْجَنَّةِ، فَأَخَذَتْ بِرَأْسِهِ شَجَرَةٌ مِنَ الْجَنَّةِ فَنَادَاهُ: يَا آدَمُ، أَمِنِّي تَفِرُّ؟ قَالَ: لا، ولكنى استحيتك يَا رَبِّ، قَالَ: أَمَا كَانَ لَكَ فِيمَا مَنَحْتُكَ مِنَ الْجَنَّةِ وَأَبَحْتُكَ مِنْهَا مَنْدُوحَةٌ عَمَّا حَرَّمْتُ عَلَيْكَ! قَالَ: بَلَى يَا رَبِّ، وَلَكِنْ وَعِزَّتِكَ مَا حَسِبْتُ أَنَّ أَحَدًا يَحْلِفُ بِكَ كَاذِبًا، قَالَ- وَهُوَ قَوْلُ اللَّهِ تَبَارَكَ وَتَعَالَى: «وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» - قَالَ: فَبِعِزَّتِي لأُهْبِطَنَّكَ إِلَى الأَرْضِ، فَلا تَنَالُ الْعَيْشَ إِلا كَدًّا.\u003c/p>\u003cp data-pair=\"129.3\" id=\"ar-odlomak-129-3\">قَالَ: فَأُهْبِطَ مِنَ الْجَنَّةِ، وَكَانَا يَأْكُلانِ فِيهَا رَغَدًا، فَأُهْبِطَ إِلَى غَيْرِ رَغَدٍ مِنْ طَعَامٍ وَشَرَابٍ، فَعُلِّمَ صَنْعَةَ الْحَدِيدِ، وَأُمِرَ بِالْحَرْثِ فَحَرَثَ وَزَرَعَ ثُمَّ سَقَى، حَتَّى إِذَا بَلَغَ حَصَدَهُ، ثُمَّ دَاسَهُ، ثُمَّ ذَرَاهُ، ثُمَّ طَحَنَهُ، ثُمَّ عَجَنَهُ، ثُمَّ خَبَزَهُ، ثُمَّ اكله، فلم يبلغه حَتَّى بَلَغَ مِنْهُ مَا شَاءَ اللَّهُ أَنْ يبلغ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 129\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"129.1\" id=\"odlomak-129-1\">pa je samljeo. Zatim mu je naredio da zamijesi i da ispeče hljeb u žaru. Džibril, alejhis-selam, sakupio mu je kamen i željezo, kresnuo ih i iz njih je izašla vatra. Tako je on bio prvi koji je pekao hljeb u žaru.“\u003c/p>\u003cp data-pair=\"129.2\" id=\"odlomak-129-2\">Ovo mišljenje koje smo prenijeli od onoga koji ga zastupa suprotno je onome što su donijele predaje od prethodnika iz ummeta našeg Vjerovjesnika, sallallahu alejhi ve sellem. Naime, \u003cspan class=\"isnad\">Musenna ibn Ibrahim pričao mi je da mu je Ishak pričao, rekavši: pričao nam je Abdurrezzak, koji je rekao: obavijestili su nas Sufjan ibn Ujejna i Ibn el-Mubarek, od Hasena ibn Umare, od Minhala ibn Amra i od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: \u003c/span>„Drvo koje je Allah zabranio Ademu i njegovoj supruzi bio je klas. Kada su jeli s njega, otkrila su im se stidna mjesta. Ono što im je skrivalo stidna mjesta bili su njihovi nokti. Počeli su po sebi spajati džennetsko lišće, lišće smokve, lijepeći jedne listove uz druge. Adem je okrenuo leđa i krenuo po Džennetu, pa mu je jedno džennetsko drvo zahvatilo glavu. Dozvao ga je: ‘Ademe, zar bježiš od Mene?’ Odgovorio je: ‘Ne, nego sam Te se postidio, Gospodaru moj.’ Rekao je: ‘Zar ti u onome što sam ti podario od Dženneta i dopustio ti u njemu nije bilo dovoljno prostora da se kloniš onoga što sam ti zabranio?’ Odgovorio je: ‘Jeste, Gospodaru moj, ali tako mi Tvoje moći, nisam mislio da bi se iko mogao Tobom lažno zakleti.’“ Rekao je — a to su riječi Allaha, Blagoslovljenog i Uzvišenog: „I zakleo im se: Ja sam vam, doista, iskren savjetnik.“ Rekao je: „Tako Mi Moje moći, sigurno ću te spustiti na Zemlju, pa do životne opskrbe nećeš dolaziti osim mukotrpnim radom.“\u003c/p>\u003cp data-pair=\"129.3\" id=\"odlomak-129-3\">Rekao je: „Spušten je iz Dženneta, a njih dvoje u njemu su jeli obilno. Spušten je tamo gdje hrana i piće nisu bili obilno dostupni. Poučen je obradi željeza i naređeno mu je da ore, pa je orao i sijao, zatim zalijevao. Kada je sazrelo, požnjeo je, potom ovršio, ovijao, samljeo, zamijesio, ispekao i zatim jeo. Do toga nije stigao dok ga nije zadesilo onoliko napora koliko je Allah htio da ga zadesi.“ \u003cspan class=\"translator-note\">⟦Prijevod izričitog kur’anskog navoda u prethodnom odlomku: El-A‘raf, 7:21.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":130,"html":"\u003csection class=\"page\" data-page=\"130\" id=\"stranica-130\">\u003ch2>Stranica 130\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 130\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"130.1\" id=\"ar-odlomak-130-1\">\u003cspan class=\"isnad\">حدثنا ابن حميد، قال: حدثنا يعقوب، عن جعفر، عن سعيد، قال: \u003c/span>أهبط إلى آدم ثور احمر، فكان يحدث عليه، ويمسح العرق عن جبينه، فهو الذي قال الله عز وجل: «فَلا يُخْرِجَنَّكُما مِنَ الْجَنَّةِ فَتَشْقى» ، فكان ذلك شقاؤه.\u003c/p>\u003cp data-pair=\"130.2\" id=\"ar-odlomak-130-2\">فهذا الذي قاله هؤلاء هو أولى بالصواب، وأشبه بما دل عليه كتاب ربنا عز وجل، وذلك أن الله عز ذكره لما تقدم إلى آدم وزوجته حواء بالنهي عن طاعة عدوهما، قال لآدم: «يَا آدَمُ إِنَّ هَذَا عَدُوٌّ لَكَ وَلِزَوْجِكَ فَلا يُخْرِجَنَّكُما مِنَ الْجَنَّةِ فَتَشْقى إِنَّ لَكَ أَلَّا تَجُوعَ فِيها وَلا تَعْرى.\nوَأَنَّكَ لا تَظْمَؤُا فِيها وَلا تَضْحى» ، فكان معلوما أن الشقاء الذي أعلمه أنه يكون إن أطاع عدوه إبليس، هو مشقة الوصول إلى ما يزيل الجوع والعري عنه، وذلك هي الأسباب التي بها يصل أولاده إلى الغذاء، من حراثة وبذر وعلاج وسقي، وغير ذلك من الأسباب الشاقة المؤلمة ولو كان جبرئيل أتاه بالغذاء الذي يصل إليه ببذره دون سائر المؤن غيره، لم يكن هناك من الشقاء الذي توعده به ربه على طاعة الشيطان ومعصية الرحمن كبير خطب، ولكن الأمر كان- والله أعلم- على ما روينا عن ابْنِ عَبَّاسٍ وغيره.\u003c/p>\u003cp data-pair=\"130.3\" id=\"ar-odlomak-130-3\">وقد قيل: إن آدم ع نزل معه السندان، والكلبتان، والميقعة، والمطرقة.\u003c/p>\u003cp data-pair=\"130.4\" id=\"ar-odlomak-130-4\">ذِكْرُ من قال ذلك:\u003c/p>\u003cp data-pair=\"130.5\" id=\"ar-odlomak-130-5\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ وَاضِحٍ، قَالَ: حَدَّثَنَا الحسين، عَنْ عَلْبَاءَ بْنِ أَحْمَرَ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ قَالَ: \u003c/span>ثَلاثَةُ أَشْيَاءٍ نَزَلَتْ مَعَ آدم ع: السِّنْدَانُ، وَالْكَلْبَتَانِ، وَالْمِيقَعَةُ، وَالْمِطْرَقَةُ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 130\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"130.1\" id=\"odlomak-130-1\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jakub, od Džafera, od Seida, koji je rekao: \u003c/span>„Ademu je spušten crveni bik, pa je njime [orao — nesigurno čitanje] i brisao znoj sa čela. To je ono što je Allah, Silan i Uzvišen, rekao: ‘Neka vas zato ne izvede iz Dženneta, pa da se mučiš.’ To je bila njegova muka.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Ta-Ha, 20:117, navedeni dio. Napomena prevodioca: izvor ima فكان يحدث عليه, nejasnu formulaciju koja nije doslovan izraz za oranje. Predloženo čitanje zasniva se na kontekstu i zahtijeva provjeru štampanog izdanja.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"130.2\" id=\"odlomak-130-2\">Ono što su ovi rekli preče je smatrati ispravnim i bliže je onome na šta ukazuje Knjiga našeg Gospodara, Silnog i Uzvišenog. Kada je Allah, Silan je spomen Njegov, unaprijed zabranio Ademu i njegovoj supruzi Havvi da se pokore svome neprijatelju, rekao je Ademu: „Ademe, ovo je neprijatelj tebi i tvojoj supruzi. Neka vas zato ne izvede iz Dženneta, pa da se mučiš! U njemu nećeš ni gladovati ni go biti. U njemu nećeš ni žednjeti ni Sunčevoj žezi biti izložen.“ Zato je bilo poznato da je muka o kojoj ga je obavijestio da će ga snaći ako se pokori svome neprijatelju Iblisu teškoća dolaska do onoga što će s njega ukloniti glad i golotinju. To su načini pomoću kojih njegovi potomci dolaze do hrane: oranje, sijanje, trud, zalijevanje i druga teška i bolna sredstva. Da mu je Džibril donosio hranu do koje bi došao samo sijanjem, bez svih ostalih napora, ne bi bilo velike teškoće u muci kojom mu je Gospodar zaprijetio zbog pokornosti šejtanu i nepokornosti Milostivom. Međutim, stvar je bila — a Allah najbolje zna — onakva kakvu smo prenijeli od Ibn Abbasa i drugih. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: Ta-Ha, 20:117–119.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"130.3\" id=\"odlomak-130-3\">Rečeno je da su s Ademom, alejhis-selam, spušteni nakovanj, kliješta, udarač i čekić.\u003c/p>\u003cp data-pair=\"130.4\" id=\"odlomak-130-4\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"130.5\" id=\"odlomak-130-5\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Jahja ibn Vadih, koji je rekao: pričao nam je Husejn, od Albaa ibn Ahmera, od Ikrime, od Ibn Abbasa, koji je rekao: \u003c/span>„Tri stvari spuštene su s Ademom, alejhis-selam: nakovanj, kliješta, udarač i čekić.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izvor kaže „tri stvari“, a navodi četiri naziva: السندان، الكلبتان، الميقعة، المطرقة. Broj i svi nazivi ostavljeni su kako stoje; „udarač“ prenosi الميقعة, naziv alata koji se upotrebljava i u značenju čekića.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":131,"html":"\u003csection class=\"page\" data-page=\"131\" id=\"stranica-131\">\u003ch2>Stranica 131\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 131\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"131.1\" id=\"ar-odlomak-131-1\">ثُمَّ إِنَّ اللَّهَ عَزَّ ذِكْرُهُ فِيمَا ذُكِرَ أَنْزَلَ آدَمَ مِنَ الْجَبَلِ الَّذِي أَهْبَطَهُ عَلَيْهِ إِلَى سَفْحِهِ، وَمَلَّكَهُ الأَرْضَ كُلَّهَا، وَجَمِيعَ مَا عَلَيْهَا مِنَ الْجِنِّ وَالْبَهَائِمِ وَالدَّوَابِّ وَالْوَحْشِ وَالطَّيْرِ وغير ذلك، وان آدم ع لَمَّا نَزَلَ مِنْ رَأْسِ ذَلِكَ الْجَبَلِ، وَفَقَدَ كَلامَ أَهْلِ السَّمَاءِ، وَغَابَتْ عَنْهُ أَصْوَاتُ الْمَلائِكَةِ، وَنَظَرَ إِلَى سِعَةِ الأَرْضِ وَبَسْطَتِهَا، وَلَمْ يَرَ فِيهَا أَحَدًا غَيْرَهُ، اسْتَوْحَشَ فَقَالَ: يَا رَبِّ، أَمَا لأَرْضِكَ هَذِهِ عَامِرٌ يُسَبِّحُكَ غَيْرِي! فأجيب بما \u003cspan class=\"isnad\">حَدَّثَنِي المثنى بن إبراهيم، قال: أخبرنا إسحاق بن الحجاج، قال: حدثنا إسماعيل بن عبد الكريم، قال: حدثنى عبد الصمد ابن معقل، أنه سمع وهبا يقول\u003c/span>: إن آدم لما أهبط إلى الأرض فرأى سعتها ولم ير فيها أحدا غيره قال: يا رب، أما لأرضك هذه عامر يسبح بحمدك ويقدس لك غيري! قال الله: إني سأجعل فيها من ولدك من يسبح بحمدي ويقدسني، وسأجعل فيها بيوتا ترفع لذكري، ويسبح فيها خلقي، ويذكر فيها اسمي، وسأجعل من تلك البيوت بيتا أخصه بكرامتي، وأوثره باسمي، وأسميه بيتي، أنطقه بعظمتي، وعليه وضعت جلالي ثم أنا مع ذلك في كل شيء ومع كل شيء، أجعل ذلك البيت حرما آمنا يحرم بحرمته من حوله ومن تحته ومن فوقه، فمن حرمه بحرمتي استوجب بذلك كرامتي، ومن أخاف أهله فيه فقد أخفر ذمتي، وأباح حرمتي أجعله أول بيت وضع للناس ببطن مكة مباركا، يأتونه شعثا غبرا على كل ضامر، من كل فج عميق، يرجون بالتلبية رجيجا، ويثجون بالبكاء ثجيجا، ويعجون بالتكبير عجيجا، فمن اعتمده ولا يريد غيره فقد وفد إليَّ وزارني وضافني، وحق على الكريم أن يكرم وفده وأضيافه، وأن يسعف كلا بحاجته تعمره يا آدم ما كنت حيا، ثم تعمره الأمم والقرون والأنبياء من ولدك أمة بعد أمة، وقرنا بعد قرن.\u003c/p>\u003cp data-pair=\"131.2\" id=\"ar-odlomak-131-2\">ثم أمر آدم ع- فيما ذكر- أن يأتي البيت الحرام الذي اهبط\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 131\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"131.1\" id=\"odlomak-131-1\">Zatim je Allah, Silan je spomen Njegov, prema onome što je navedeno, spustio Adema s planine na koju ga je bio spustio do njenog podnožja i dao mu vlast nad cijelom Zemljom i svim što je na njoj: džinima, stokom, životinjama, zvijerima, pticama i drugim. Kada je Adem, alejhis-selam, sišao s vrha te planine, ostao bez govora stanovnika neba, prestao čuti glasove meleka i pogledao prostranost i širinu Zemlje, a na njoj nije vidio nikoga osim sebe, osjetio je osamljenost i rekao: „Gospodaru moj, zar na ovoj Tvojoj Zemlji nema nikoga osim mene ko Te slavi?“ Odgovoreno mu je onim što \u003cspan class=\"isnad\">mi je pričao Musenna ibn Ibrahim, koji je rekao: obavijestio nas je Ishak ibn el-Hadždžadž, koji je rekao: pričao nam je Ismail ibn Abdulkerim, koji je rekao: pričao mi je Abdussamed ibn Ma‘kil, da je čuo Vehba kako govori:\u003c/span> „Kada je Adem spušten na Zemlju, vidio njenu prostranost i nije vidio nikoga osim sebe, rekao je: ‘Gospodaru moj, zar na ovoj Tvojoj Zemlji nema nikoga osim mene ko Te s hvalom slavi i svetost Ti iskazuje?’ Allah je rekao: ‘Na njoj ću učiniti od tvojih potomaka one koji će Me s hvalom slaviti i svetost Mi iskazivati. Na njoj ću učiniti domove koji će biti podignuti radi Moga spominjanja, u kojima će Me Moja stvorenja slaviti i spominjati Moje ime. Jedan od tih domova posebno ću počastiti, izdvojiti Svojim imenom i nazvati Svojim Hramom. Dat ću mu da govori o Mojoj veličini i na njega položiti Svoje veličanstvo. Uz sve to, Ja sam u svemu i sa svime. Taj ću Hram učiniti sigurnim svetim prostorom, čijom će svetošću biti sveto ono oko njega, ispod njega i iznad njega. Ko ga bude poštovao kao svetoga zbog Moje svetosti, time će zavrijediti Moju počast. Ko u njemu bude zastrašivao njegove stanovnike, prekršit će Moju zaštitu i povrijediti Moju svetost. Učinit ću ga prvim Hramom postavljenim ljudima u unutrašnjosti Meke, blagoslovljenim. Dolazit će mu raščupani i prašnjavi, na svakoj iscrpljenoj devi, iz svakog dalekog klanca; glasno će izgovarati telbiju, obilno plakati i snažno uzvikivati tekbir. Ko se njemu uputi, ne želeći ništa drugo, došao je Meni, posjetio Me i bio Moj gost. Plemenitome priliči da počasti svoje izaslanike i goste i svakome udovolji njegovoj potrebi. Ti ćeš ga, Ademe, posjećivati i održavati dok si živ, a zatim će ga posjećivati i održavati narodi, naraštaji i vjerovjesnici od tvojih potomaka, narod za narodom i naraštaj za naraštajem.’“\u003c/p>\u003cp data-pair=\"131.2\" id=\"odlomak-131-2\">Zatim je Ademu, alejhis-selam, prema onome što je navedeno, naređeno da dođe Svetom Hramu koji mu je spušten\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":132,"html":"\u003csection class=\"page\" data-page=\"132\" id=\"stranica-132\">\u003ch2>Stranica 132\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 132\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"132.1\" id=\"ar-odlomak-132-1\">له إلى الأرض، فيطوف به كما كان يرى الملائكة تطوف حول عرش الله، وكان ذلك ياقوتة واحدة أو درة واحدة، كما \u003cspan class=\"isnad\">حدثني الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن أبان\u003c/span>، أن البيت أهبط ياقوتة واحدة أو درة واحدة، حتى إذا أغرق الله قوم نوح رفعه وبقي أساسه، فبوأه الله عز وجل لإبراهيم فبناه، وقد ذكرت الأخبار الواردة بذلك فيما مضى قبل.\u003c/p>\u003cp data-pair=\"132.2\" id=\"ar-odlomak-132-2\">فذكر ان آدم ع بكى واشتد بكاؤه على خطيئته، وندم عليها، وسأل الله عز وجل قبول توبته، وغفران خطيئته، فقال في مسألته إياه: ما سأل من ذلك، كما \u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا ابْنُ عَطِيَّةَ، عَنْ قَيْسٍ، عَنِ ابْنِ أَبِي لَيْلَى، عَنِ الْمِنْهَالِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ: «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ فَتابَ عَلَيْهِ» قَالَ: أَيْ رَبِّ، أَلَمْ تَخْلُقْنِي بِيَدِكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَنْفُخْ فِيَّ مِنْ رُوحِكَ؟\nقَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تُسْكِنِّي جَنَّتَكَ؟ قَالَ: بَلَى، قَالَ: أَيْ رَبِّ، أَلَمْ تَسْبِقْ رَحْمَتُكَ غَضَبَكَ؟ قَالَ: بَلَى، قَالَ: أَرَأَيْتَ إِنْ تُبْتُ وَأَصْلَحْتُ أَرَاجِعِي أَنْتَ إِلَى الْجَنَّةِ؟ قَالَ: بَلَى، قَالَ: فَهُوَ قَوْلُهُ تعالى: «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» .\u003c/p>\u003cp data-pair=\"132.3\" id=\"ar-odlomak-132-3\">\u003cspan class=\"isnad\">حَدَّثَنِي بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زريع، عن سعيد، عن قتادة\u003c/span>، قوله تعالى «فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» ذكر لنا أنه قال:\nيا رب: أرأيت إن أنا تبت وأصلحت! قال: إذا أرجعك إلى الجنة، قال:\n\n\u003cspan class=\"isnad\">وقال الحسن\u003c/span>: إنهما قالا: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .\u003c/p>\u003cp data-pair=\"132.4\" id=\"ar-odlomak-132-4\">\u003cspan class=\"isnad\">حدثنا أحمد بن إسحاق الأهوازي، قال: حدثنا أبو أحمد، قال: حَدَّثَنَا سفيان وقيس، عن خصيف، عن مجاهد\u003c/span>، في قوله عز وجل:\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 132\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"132.1\" id=\"odlomak-132-1\">na Zemlju i da ga obilazi kao što je viđao meleke kako obilaze oko Allahovog Arša. Bio je to jedan rubin ili jedan biser, kako \u003cspan class=\"isnad\">mi je pričao Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Ebana:\u003c/span> „Hram je spušten kao jedan rubin ili jedan biser. Kada je Allah potopio Nuhov narod, podigao ga je, a njegovi temelji ostali su. Allah, Silan i Uzvišen, odredio ih je Ibrahimu, pa ga je izgradio.“ Već sam ranije naveo predaje koje govore o tome.\u003c/p>\u003cp data-pair=\"132.2\" id=\"odlomak-132-2\">Navedeno je da je Adem, alejhis-selam, plakao, gorko oplakivao svoj grijeh, kajao se zbog njega i molio Allaha, Silnog i Uzvišenog, da mu primi pokajanje i oprosti grijeh. U svojoj molbi izgovorio je ono što je tražio, kako \u003cspan class=\"isnad\">nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Ibn Atijja, od Kajsa, od Ibn Ebu Lejle, od Minhala, od Seida ibn Džubejra, od Ibn Abbasa,\u003c/span> o riječima: „Adem je od svoga Gospodara primio riječi, pa mu je On prihvatio pokajanje.“ Rekao je: „‘Gospodaru moj, zar me nisi stvorio Svojom rukom?’ Odgovorio je: ‘Jesam.’ Rekao je: ‘Gospodaru moj, zar u mene nisi udahnuo od Svoga Duha?’ Odgovorio je: ‘Jesam.’ Rekao je: ‘Gospodaru moj, zar me nisi nastanio u Svome Džennetu?’ Odgovorio je: ‘Jesam.’ Rekao je: ‘Gospodaru moj, zar Tvoja milost nije prethodila Tvojoj srdžbi?’ Odgovorio je: ‘Jeste.’ Rekao je: ‘Reci mi, ako se pokajem i popravim, hoćeš li me vratiti u Džennet?’ Odgovorio je: ‘Hoću.’“ Rekao je: „To su Njegove, Uzvišeni je On, riječi: ‘Adem je od svoga Gospodara primio riječi.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"132.3\" id=\"odlomak-132-3\">\u003cspan class=\"isnad\">Pričao mi je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, od Seida, od Katade,\u003c/span> o riječima Uzvišenog: „Adem je od svoga Gospodara primio riječi.“ „Navedeno nam je da je rekao: ‘Gospodaru moj, reci mi, ako se pokajem i popravim?’ Odgovorio je: ‘Tada ću te vratiti u Džennet.’“ Rekao je: „\u003cspan class=\"isnad\">Hasen je rekao:\u003c/span> ‘Njih dvoje rekli su: Gospodaru naš, sami smo sebi nepravdu učinili. Ako nam ne oprostiš i ne smiluješ nam se, sigurno ćemo biti među gubitnicima.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dio; El-A‘raf, 7:23.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"132.4\" id=\"odlomak-132-4\">\u003cspan class=\"isnad\">Pričao nam je Ahmed ibn Ishak el-Ahvazi, koji je rekao: pričao nam je Ebu Ahmed, koji je rekao: pričali su nam Sufjan i Kajs, od Husajfa, od Mudžahida,\u003c/span> o riječima Njega, Silnog i Uzvišenog:\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":133,"html":"\u003csection class=\"page\" data-page=\"133\" id=\"stranica-133\">\u003ch2>Stranica 133\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 133\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"133.1\" id=\"ar-odlomak-133-1\">«فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِماتٍ» قال: قوله: «رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ» .\u003c/p>\u003cp data-pair=\"133.2\" id=\"ar-odlomak-133-2\">\u003cspan class=\"isnad\">حَدَّثَنِي الحارث، قال: حدثنا ابن سعد، قال: أخبرنا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أَخْبَرَنَا أَبِي، عَنْ أَبِي صَالِحٍ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ: أَنْزَلَ آدَمُ مَعَهُ حِينَ أُهْبِطَ مِنَ الْجَنَّةِ الْحَجَرَ الأَسْوَدَ، وَكَانَ أَشَدَّ بَيَاضًا مِنَ الثَّلْجِ، وَبَكَى آدَمُ وَحَوَّاءُ عَلَى مَا فَاتَهُمَا- يَعْنِي مِنْ نَعِيمِ الْجَنَّةِ- مِائَتَيْ سَنَةٍ، وَلَمْ يَأْكُلا وَلَمْ يَشْرَبَا أَرْبَعِينَ يَوْمًا، ثُمَّ أَكَلا وَشَرِبَا، وَهُمَا يَوْمَئِذٍ عَلَى بُوذَ، الْجَبَلِ الَّذِي أُهْبِطَ عَلَيْهِ آدَمُ وَلَمْ يَقْرَبْ حَوَّاءَ مِائَةَ سَنَةٍ.\u003c/p>\u003cp data-pair=\"133.3\" id=\"ar-odlomak-133-3\">\u003cspan class=\"isnad\">حَدَّثَنَا أبو همام، قال: حدثني أبي، قال: حدثني زياد بن خيثمة، عن أبي يحيى بائع القت، قال: قال لي مجاهد\u003c/span>، ونحن جلوس في المسجد: هل ترى هذا؟ قلت: يا أبا الحجاج، الحجر؟ قال: كذلك تقول؟\nقلت: او ليس حجرا! قال: فو الله \u003cspan class=\"isnad\">لحدثني عبد الله بن عباس\u003c/span> أنها ياقوتة بيضاء، خرج بها آدم من الجنة، كان يمسح بها دموعه، وأن آدم لم ترقأ دموعه منذ خرج من الجنة حتى رجع إليها ألفي سنة، وما قدر منه إبليس على شيء، فقلت له: يا أبا الحجاج، فمن أي شيء اسود؟ قال: كان الْحُيَّضُ يلمسنه في الجاهلية فخرج آدم ع من الهند يؤم البيت الذي أمره الله عز وجل بالمصير إليه، حتى أتاه، فطاف به، ونسك المناسك، فذكر أنه التقى هو وحواء بعرفات، فتعارفا بها، ثم ازدلف إليها بالمزدلفة، ثم رجع إلى الهند مع حواء، فاتخذا مغارة يأويان إليها في ليلهما ونهارهما، وأرسل الله إليهما ملكا يعلمهما ما يلبسانه ويستتران به، فزعموا أن ذلك كان من جلود الضأن والأنعام والسباع وقال بعضهم: إنما كان ذلك لباس أولادهما، فأما آدم وحواء فإن لباسهما كان ما كانا خصفا على أنفسهما من ورق الجنة ثم إن الله عز ذكره مسح ظهر آدم ع بنعمان من عرفة، وأخرج\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 133\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"133.1\" id=\"odlomak-133-1\">„Adem je od svoga Gospodara primio riječi.“ Rekao je: „To su njegove riječi: ‘Gospodaru naš, sami smo sebi nepravdu učinili. Ako nam ne oprostiš i ne smiluješ nam se, sigurno ćemo biti među gubitnicima.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:37, navedeni dio; El-A‘raf, 7:23.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"133.2\" id=\"odlomak-133-2\">\u003cspan class=\"isnad\">Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio nas je Hišam ibn Muhammed, koji je rekao: obavijestio nas je moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao:\u003c/span> „Kada je spušten iz Dženneta, Adem je sa sobom spustio Crni kamen, koji je bio bjelji od snijega. Adem i Havva dvjesto godina plakali su za onim što su izgubili — misli se na džennetsko uživanje. Četrdeset dana nisu ni jeli ni pili, a zatim su jeli i pili. Tada su bili na Buzu, planini na koju je Adem spušten. Stotinu godina nije se približio Havvi.“\u003c/p>\u003cp data-pair=\"133.3\" id=\"odlomak-133-3\">\u003cspan class=\"isnad\">Pričao nam je Ebu Hemmam, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao,\u003c/span> dok smo sjedili u džamiji: „Vidiš li ovo?“ Upitao sam: „Ebu Hadždžadže, kamen?“ Rekao je: „Tako kažeš?“ Odgovorio sam: „Zar nije kamen?“ Rekao je: „Tako mi Allaha, \u003cspan class=\"isnad\">pričao mi je Abdullah ibn Abbas\u003c/span> da je to bijeli rubin s kojim je Adem izašao iz Dženneta i kojim je brisao suze. Ademove suze nisu prestale teći otkad je izašao iz Dženneta sve dok se nije u njega vratio, dvije hiljade godina, a Iblis nad njim ni u čemu nije imao moći.“ Upitao sam ga: „Ebu Hadždžadže, zbog čega je onda pocrnio?“ Odgovorio je: „U džahilijetu su ga doticale žene s mjesečnicom.“ Adem, alejhis-selam, krenuo je iz Indije prema Hramu kojem mu je Allah, Silan i Uzvišen, naredio da ode. Stigao je do njega, obišao ga i izvršio obrede. Navedeno je da su se on i Havva sreli na Arefatu i tamo se prepoznali, a zatim joj se približio na Muzdelifi. Potom se s Havvom vratio u Indiju i uzeli su pećinu za sklonište tokom svojih noći i dana. Allah im je poslao meleka da ih pouči čime će se odijevati i pokrivati. Tvrde da je to bilo od koža ovaca, stoke i zvijeri. Neki su rekli da je to bila odjeća njihove djece, dok su Adem i Havva nosili ono džennetsko lišće kojim su se pokrili. Zatim je Allah, Silan je spomen Njegov, potrao leđa Adema, alejhis-selam, u Nu‘manu kod Arefe i izveo\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":134,"html":"\u003csection class=\"page\" data-page=\"134\" id=\"stranica-134\">\u003ch2>Stranica 134\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 134\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"134.1\" id=\"ar-odlomak-134-1\">ذريته، فنثرهم بين يديه كالذر، فأخذ مواثيقهم، وأشهدهم على أنفسهم:\n\nألست بربكم؟ قالوا: بلى، كما قال عز وجل: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» .\u003c/p>\u003cp data-pair=\"134.2\" id=\"ar-odlomak-134-2\">وَقَدْ \u003cspan class=\"isnad\">حَدَّثَنِي أَحْمَدُ بْنُ مُحَمَّدٍ الطُّوسِيُّ، قَالَ: حَدَّثَنَا الْحُسَيْنُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا جَرِيرُ بْنُ حَازِمٍ، عَنْ كُلْثُومِ بْنِ جَبْرٍ، عَنْ سعيد ابن جبير، عن ابن عباس، [عن النبي ص، قَال\u003c/span>َ: أَخَذَ اللَّهُ الْمِيثَاقَ مِنْ ظَهْرِ آدَمَ بِنَعْمَانَ- يَعْنِي عَرَفَةَ- فَأَخْرَجَ مِنْ صُلْبِهِ كُلَّ ذُرِّيَّةٍ ذَرَأَهَا، فَنَثَرَهُمْ بَيْنَ يَدَيْهِ كَالذَّرِّ، ثُمَّ كَلَّمَهُمْ قِبَلا، وَقَالَ: «أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى شَهِدْنا أَنْ تَقُولُوا يَوْمَ الْقِيامَةِ» إِلَى قَوْلِهِ: «بِما فَعَلَ الْمُبْطِلُونَ] » .\u003c/p>\u003cp data-pair=\"134.3\" id=\"ar-odlomak-134-3\">\u003cspan class=\"isnad\">حَدَّثَنِي عِمْرَانُ بْنُ مُوسَى الْقَزَّازُ، حَدَّثَنَا عَبْدُ الْوَارِثِ بْنُ سَعِيدٍ، قَالَ: حَدَّثَنَا كُلْثُومُ بْنُ جَبْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ فِي قَوْلِهِ:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قَالَ: مَسَحَ رَبُّنَا ظَهْرَ آدَمَ، فَخَرَجَتْ كُلُّ نسمة هو خالقها إلى يوم القيامة بنعمان هَذِهِ- وَأَشَارَ بِيَدِهِ- فَأَخَذَ مَوَاثِيقَهُمْ، وَأَشْهَدَهُمْ عَلَى أَنْفُسِهِمْ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى.\u003c/p>\u003cp data-pair=\"134.4\" id=\"ar-odlomak-134-4\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ وَيَعْقُوبُ بْنُ إِبْرَاهِيمَ، قَالا: حَدَّثَنَا ابْنُ عُلَيَّةَ، عَنْ كُلْثُومِ بْنِ جَبْرٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ فِي قَوْلِهِ عز وجل:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قَالَ: مَسَحَ ظَهْرَ آدَمَ فَخَرَجَ كُلُّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ بِنَعْمَانَ، هَذَا الَّذِي وَرَاءَ عَرَفَةَ، وَأَخَذَ مِيثَاقَهُمْ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى شَهِدْنَا، وَاللَّفْظُ لِحَدِيثِ يَعْقُوبَ.\u003c/p>\u003cp data-pair=\"134.5\" id=\"ar-odlomak-134-5\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ وَكِيعٍ، قَالَ: حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، عن عطاء\u003c/span>،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 134\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"134.1\" id=\"odlomak-134-1\">njegovo potomstvo. Rasuo ih je pred Sobom poput sitnih mrava, uzeo od njih zavjete i učinio ih svjedocima protiv samih sebe: „Zar Ja nisam vaš Gospodar?“ Odgovorili su: „Jesi“, kako je rekao On, Silan i Uzvišen: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"134.2\" id=\"odlomak-134-2\">\u003cspan class=\"isnad\">Pričao mi je Ahmed ibn Muhammed et-Tusi, koji je rekao: pričao nam je Husejn ibn Muhammed, koji je rekao: pričao nam je Džerir ibn Hazim, od Kulsuma ibn Džebra, od Seida ibn Džubejra, od Ibn Abbasa, od Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao:\u003c/span> „Allah je uzeo zavjet iz Ademovih leđa u Nu‘manu — misli se na Arefu. Iz njegovih slabina izveo je sve potomstvo koje je stvorio i rasuo ih pred Sobom poput sitnih mrava. Zatim im je neposredno govorio i rekao: ‘Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi, svjedočimo! Da na Kijametskom danu ne kažete’ — do Njegovih riječi: ‘zbog onoga što su činili oni koji su neistinu slijedili.’“ \u003cspan class=\"translator-note\">⟦Prijevodi navedenog početka i završetka: El-A‘raf, 7:172–173. Izraz „do Njegovih riječi“ pripada izvoru.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"134.3\" id=\"odlomak-134-3\">\u003cspan class=\"isnad\">Pričao mi je Imran ibn Musa el-Kazzaz: pričao nam je Abdulvaris ibn Seid, koji je rekao: pričao nam je Kulsum ibn Džebr, od Seida ibn Džubejra, od Ibn Abbasa,\u003c/span> o Njegovim riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Naš je Gospodar potrao Ademova leđa, pa je iz njega izašao svaki čovjek kojeg će stvoriti do Kijametskog dana u ovom Nu‘manu“ — i pokazao je rukom. „Uzeo je od njih zavjete i učinio ih svjedocima protiv samih sebe: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"134.4\" id=\"odlomak-134-4\">\u003cspan class=\"isnad\">Pričali su nam Ibn Veki‘ i Jakub ibn Ibrahim; obojica su rekli: pričao nam je Ibn Ulejja, od Kulsuma ibn Džebra, od Seida ibn Džubejra, od Ibn Abbasa,\u003c/span> o riječima Njega, Silnog i Uzvišenog: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Potrao je Ademova leđa, pa je u Nu‘manu, ovome iza Arefe, izašao svaki čovjek kojeg će stvoriti do Kijametskog dana. Uzeo je od njih zavjet: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi, svjedočimo.’“ Ovo je formulacija Jakubove predaje. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"134.5\" id=\"odlomak-134-5\">\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Imran ibn Ujejna, od Ataa,\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":135,"html":"\u003csection class=\"page\" data-page=\"135\" id=\"stranica-135\">\u003ch2>Stranica 135\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 135\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"135.1\" id=\"ar-odlomak-135-1\">\u003cspan class=\"isnad\">عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ: أُهْبِطَ آدَمُ حِينَ أُهْبِطَ فَمَسَحَ اللَّهُ ظَهْرَهُ، فَأَخْرَجَ مِنْهُ كُلَّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ، ثُمَّ قَالَ: أَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى، ثُمَّ تَلَى: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، فَجَفَّ الْقَلَمُ مِنْ يَوْمِئِذٍ بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ.\u003c/p>\u003cp data-pair=\"135.2\" id=\"ar-odlomak-135-2\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا يَحْيَى بْنُ عيسى، عن الأعمش، عن حَبِيبِ بْنِ أَبِي ثَابِتٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ في «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، قَالَ: لَمَّا خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ ع أَخَذَ ذُرِّيَّتَهُ مِنْ ظَهْرِهِ مِثْلَ الذَّرِّ، فَقَبَضَ قَبْضَتَيْنِ، فَقَالَ لأَصْحَابِ الْيَمِينِ: ادْخُلُوا الْجَنَّةَ بِسَلامٍ، وَقَالَ لِلآخَرِينَ: ادْخُلُوا النَّارَ وَلا أُبَالِي.\u003c/p>\u003cp data-pair=\"135.3\" id=\"ar-odlomak-135-3\">\u003cspan class=\"isnad\">حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعِيدٍ الْجَوْهَرِيُّ، قَالَ: حَدَّثَنَا رَوْحُ بْنُ عُبَادَةَ وَسَعْدُ بْنُ عَبْدِ الْحَمِيدِ بْنِ جَعْفَرٍ، عَنْ مَالِكِ بْنِ أَنَسٍ، عَنْ زَيْدِ بْنِ أَبِي أُنَيْسَةَ، عَنْ عَبْدِ الْحَمِيدِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ زَيْدِ بْنِ الْخَطَّابِ، عَنْ مُسْلِمِ بْنِ يَسَارٍ الْجُهَنِي\u003c/span>ِّ، [أَنَّ عُمَرَ بْنَ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ سُئِلَ عَنْ هَذِهِ الآية:\n«وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» ، \u003cspan class=\"isnad\">فقال عمر: سمعت رسول الله ص قَال\u003c/span>َ: إِنَّ اللَّهَ خَلَقَ آدَمَ ثُمَّ مَسَحَ عَلَى ظَهْرِهِ بِيَمِينِهِ وَاسْتَخْرَجَ مِنْهُ ذُرِّيَّةً، فَقَالَ: خَلَقْتُ هَؤُلاءِ لِلْجَنَّةِ وَبِعَمَلِ أَهْلِ الْجَنَّةِ يَعْمَلُونَ، ثُمَّ مَسَحَ عَلَى ظَهْرِهِ فَاسْتَخْرَجَ مِنْهُ ذُرِّيَّةً فَقَالَ: خَلَقْتُ هَؤُلاءِ لِلنَّارِ وَبِعَمَلِ أَهْلِ النَّارِ يَعْمَلُونَ، فَقَالَ رَجُلٌ: يَا رَسُولَ اللَّهِ، فَفِيمَ الْعَمَلُ؟ قَالَ: إِنَّ اللَّهَ تَبَارَكَ وَتعالى إِذَا خَلَقَ الْعَبْدَ لِلْجَنَّةِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ الْجَنَّةِ، حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ الجنه فيدخله الْجَنَّةِ، وَإِذَا خَلَقَ الْعَبْدَ لِلنَّارِ اسْتَعْمَلَهُ بِعَمَلِ أَهْلِ النَّارِ حَتَّى يَمُوتَ عَلَى عَمَلٍ مِنْ عَمَلِ أَهْلِ النَّارِ فَيُدْخِلُهُ النَّارَ] .\u003c/p>\u003cp data-pair=\"135.4\" id=\"ar-odlomak-135-4\">وَقِيلَ: إِنَّهُ أخذ ذريه آدم ع من ظهره بدحنا\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 135\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"135.1\" id=\"odlomak-135-1\">\u003cspan class=\"isnad\">od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao:\u003c/span> „Kada je Adem spušten, Allah mu je potrao leđa i izveo iz njega svakoga čovjeka kojeg će stvoriti do Kijametskog dana. Zatim je rekao: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’ Potom je proučio: ‘I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.’ Od toga dana pero se osušilo nad onim što će biti do Kijametskog dana.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"135.2\" id=\"odlomak-135-2\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Jahja ibn Isa, od A‘meša, od Habiba ibn Ebu Sabita, od Seida ibn Džubejra, od Ibn Abbasa,\u003c/span> o riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.“ Rekao je: „Kada je Allah, Silan i Uzvišen, stvorio Adema, alejhis-selam, uzeo je iz njegovih leđa njegovo potomstvo poput sitnih mrava. Zahvatio je dvije pregršti i rekao onima s desne strane: ‘Uđite u Džennet u miru’, a drugima je rekao: ‘Uđite u Vatru i ne marim.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"135.3\" id=\"odlomak-135-3\">\u003cspan class=\"isnad\">Pričao nam je Ibrahim ibn Seid el-Dževheri, koji je rekao: pričali su nam Revh ibn Ubada i Sa‘d ibn Abdulhamid ibn Džafer, od Malika ibn Enesa, od Zejda ibn Ebu Unejse, od Abdulhamida ibn Abdurrahmana ibn Zejda ibn el-Hattaba, od Muslima ibn Jesara el-Džuhenija,\u003c/span> da je Omer ibn el-Hattab, radijallahu anhu, upitan o ovom ajetu: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.“ \u003cspan class=\"isnad\">Omer je rekao: „Čuo sam Allahovog Poslanika, sallallahu alejhi ve sellem, kako kaže:\u003c/span> ‘Allah je stvorio Adema, zatim mu Svojom desnicom potrao leđa i iz njega izveo potomstvo. Rekao je: Ove sam stvorio za Džennet i oni će činiti djela stanovnika Dženneta. Zatim mu je potrao leđa i iz njega izveo potomstvo. Rekao je: Ove sam stvorio za Vatru i oni će činiti djela stanovnika Vatre.’ Neki je čovjek rekao: ‘Allahov Poslaniče, čemu onda djela?’ Odgovorio je: ‘Kada Allah, Blagoslovljen i Uzvišen, stvori roba za Džennet, upotrijebi ga za djela stanovnika Dženneta sve dok ne umre čineći neko od djela stanovnika Dženneta, pa ga uvede u Džennet. Kada roba stvori za Vatru, upotrijebi ga za djela stanovnika Vatre sve dok ne umre čineći neko od djela stanovnika Vatre, pa ga uvede u Vatru.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"135.4\" id=\"odlomak-135-4\">Rečeno je da je Ademovo, alejhis-selam, potomstvo iz njegovih leđa izveo u Dehni.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":136,"html":"\u003csection class=\"page\" data-page=\"136\" id=\"stranica-136\">\u003ch2>Stranica 136\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 136\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"136.1\" id=\"ar-odlomak-136-1\">ذكر من قال ذلك:\u003c/p>\u003cp data-pair=\"136.2\" id=\"ar-odlomak-136-2\">\u003cspan class=\"isnad\">حدثنا ابن حميد، قَالَ: حَدَّثَنَا حَكَّامٌ، قَالَ: حَدَّثَنَا عَمْرُو بْنُ قَيْسٍ، عَنْ عَطَاءٍ، عَنْ سَعِيدٍ، عَنِ ابْنِ عَبَّاس\u003c/span>ٍ: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ» قَالَ: لَمَّا خَلَقَ اللَّهُ عَزَّ وَجَلَّ آدَمَ مسح ظهره بدحنا فَأَخْرَجَ مِنْ ظَهْرِهِ كُلَّ نَسَمَةٍ هُوَ خَالِقُهَا إِلَى يَوْمِ الْقِيَامَةِ، فَقَالَ:\nأَلَسْتُ بِرَبِّكُمْ؟ قَالُوا: بَلَى، قَالَ: فَيَرَوْنَ يَوْمَئِذٍ، جَفَّ الْقَلَمُ بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ وَقَالَ بَعْضُهُمْ: أَخْرَجَ اللَّهُ ذُرِّيَّةَ آدَمَ مِنْ صُلْبِهِ فِي السَّمَاءِ قَبْلَ أَنْ يُهْبِطَهُ إِلَى الأَرْضِ، وَبَعْدَ أَنْ أَخْرَجَهُ مِنَ الْجَنَّةِ.\u003c/p>\u003cp data-pair=\"136.3\" id=\"ar-odlomak-136-3\">ذِكْرُ مَنْ قَالَ ذلك:\u003c/p>\u003cp data-pair=\"136.4\" id=\"ar-odlomak-136-4\">\u003cspan class=\"isnad\">حدثنا ابن وكيع، قال: حدثنا عمرو بن حماد، عن أسباط، عن السدي\u003c/span>: «وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قالُوا بَلى» ، قال: أخرج الله آدم من الجنة ولم يهبطه من السماء، ثم إنه مسح من آدم صفحة ظهره اليمنى، فأخرج منه ذرية كهيئة الذر بيضاء مثل اللؤلؤ، فقال لهم: ادخلوا الجنه برحمتي، ومسح صفحه ظهره اليسرى، فأخرج منه كهيئة الذر سودا، فقال: ادخلوا النار ولا أبالي فذلك حين يقول: أصحاب اليمين وأصحاب الشمال ثم أخذ الميثاق فقال: ألست بربكم؟ قالوا بلى، فأعطاه طائفة طائعين، وطائفة على وجه التقية\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 136\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"136.1\" id=\"odlomak-136-1\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"136.2\" id=\"odlomak-136-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Hukkam, koji je rekao: pričao nam je Amr ibn Kajs, od Ataa, od Seida, od Ibn Abbasa,\u003c/span> o riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo.“ Rekao je: „Kada je Allah, Silan i Uzvišen, stvorio Adema, potrao mu je leđa u Dehni i iz njegovih leđa izveo svakoga čovjeka kojeg će stvoriti do Kijametskog dana. Rekao je: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’“ Rekao je: „Prema tome, smatraju da se toga dana pero osušilo nad onim što će biti do Kijametskog dana.“ Neki su rekli: „Allah je Ademovo potomstvo izveo iz njegovih slabina na nebu, prije nego što ga je spustio na Zemlju, a nakon što ga je izveo iz Dženneta.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio. Toponim je u izvoru zapisan بدحنا; izgovor „Dehna“ približan je.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"136.3\" id=\"odlomak-136-3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"136.4\" id=\"odlomak-136-4\">\u003cspan class=\"isnad\">Pričao nam je Ibn Veki‘, koji je rekao: pričao nam je Amr ibn Hammad, od Esbata, od Suddija,\u003c/span> o riječima: „I kada je tvoj Gospodar iz leđa Ademovih potomaka izveo njihovo potomstvo i učinio ih svjedocima protiv samih sebe: Zar Ja nisam vaš Gospodar? Odgovorili su: Jesi.“ Rekao je: „Allah je izveo Adema iz Dženneta, ali ga još nije spustio s neba. Zatim je potrao desnu stranu Ademovih leđa, pa iz njega izveo potomstvo poput sitnih mrava, bijelo poput bisera. Rekao im je: ‘Uđite u Džennet Mojom milošću.’ Potrao je lijevu stranu njegovih leđa, pa iz njega izveo nešto poput sitnih mrava, crno. Rekao je: ‘Uđite u Vatru i ne marim.’ To je ono kada govori o stanovnicima desne i stanovnicima lijeve strane. Zatim je uzeo zavjet i rekao: ‘Zar Ja nisam vaš Gospodar?’ Odgovorili su: ‘Jesi.’ Jedna skupina dala Mu je zavjet pokorno, a druga iz tekijje — prikrivajući svoj stvarni stav.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-A‘raf, 7:172, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":137,"html":"\u003csection class=\"page\" data-page=\"137\" id=\"stranica-137\">\u003ch2>Stranica 137\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 137\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"137.1\" id=\"ar-odlomak-137-1\">ذكر الأحداث التي كانت في عهد آدم ع بعد أن أهبط إلى الأرض\u003c/p>\u003cp data-pair=\"137.2\" id=\"ar-odlomak-137-2\">فكان أول ذلك قتل قابيل بن آدم أخاه هابيل، وأهل العلم يختلفون في اسم قابيل، فيقول بعضهم: هو قين بن آدم، ويقول بعضهم: هو قايين ابن آدم ويقول بعضهم: هو قاين ويقول بعضهم: هو قابيل.\u003c/p>\u003cp data-pair=\"137.3\" id=\"ar-odlomak-137-3\">واختلفوا أيضا في السبب الذي من أجله قتله:\nفقال بعضهم في ذلك مَا \u003cspan class=\"isnad\">حَدَّثَنِي بِهِ مُوسَى بن هارون الهمداني، قال:\nحدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من أصحاب رسول الله ص، قَال\u003c/span>َ: كَانَ لا يُولَدُ لآدَمَ مَوْلُودٌ إِلا وُلِدَ مَعَهُ جَارِيَةٌ، فَكَانَ يُزَوِّجُ غُلامَ هَذَا البطن جاريه هذا البطن الآخر ويزوج جاريه هذا البطن غلام هَذَا الْبَطْنِ الآخَرِ، حَتَّى وُلِدَ لَهُ ابْنَانِ، يُقَالُ لَهُمَا قَابِيلُ وَهَابِيلُ، وَكَانَ قَابِيلُ صَاحِبَ زَرْعٍ، وَكَانَ هَابِيلُ صَاحِبَ ضَرْعٍ، وَكَانَ قَابِيلُ أَكْبَرَهُمَا، وَكَانَتْ لَهُ أُخْتٌ أَحْسَنَ مِنْ أُخْتِ هَابِيلَ، وَإِنَّ هَابِيلَ طَلَبَ أَنْ يَنْكِحَ أُخْتَ قَابِيلَ، فَأَبَى عَلَيْهِ وَقَالَ: هِيَ أُخْتِي وُلِدَتْ مَعِي، وَهِيَ أَحْسَنُ مِنْ أُخْتِكَ، وَأَنَا أَحَقُّ أَنْ أَتَزَوَّجَهَا، فَأَمَرَهُ أَبُوهُ أَنْ يُزَوِّجَهَا هَابِيلَ، فَأَبَى وَإِنَّهُمَا قَرَّبَا قُرْبَانًا إِلَى اللَّهِ أَيُّهُمَا أَحَقُّ بِالْجَارِيَةِ، وَكَانَ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 137\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"137.1\" id=\"odlomak-137-1\">Spomen događaja iz Ademovog, alejhis-selam, vremena nakon što je spušten na Zemlju\u003c/p>\u003cp data-pair=\"137.2\" id=\"odlomak-137-2\">Prvi od tih događaja bio je kada je Kabil, Ademov sin, ubio svoga brata Habila. Učeni ljudi razilaze se o Kabilovom imenu. Neki kažu da je to Kajn, Ademov sin; neki kažu Kajin, Ademov sin; neki kažu Kain, a neki Kabil. \u003cspan class=\"translator-note\">⟦Arapski oblici imena, navedenim redom: قين، قايين، قاين، قابيل.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"137.3\" id=\"odlomak-137-3\">Razišli su se i o razlogu zbog kojeg ga je ubio. Neki su o tome rekli ono što \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, koji je rekao:\u003c/span> „Ademu se nije rodio dječak a da se s njim nije rodila i djevojčica. Dječaka iz jednoga poroda ženio je djevojčicom iz drugoga poroda, a djevojčicu iz jednoga poroda udavao za dječaka iz drugoga. Tako su mu rođena dva sina po imenu Kabil i Habil. Kabil je obrađivao zemlju, a Habil držao stoku. Kabil je bio stariji. Imao je sestru ljepšu od Habilove sestre. Habil je zatražio da se oženi Kabilovom sestrom, ali je Kabil odbio i rekao: ‘Ona je moja sestra, rođena sa mnom; ljepša je od tvoje sestre i ja imam više prava da se njome oženim.’ Otac mu je naredio da je uda za Habila, ali je odbio. Njih su dvojica Allahu prinijeli žrtvu da se pokaže koji ima više prava na djevojku. Tada je\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":138,"html":"\u003csection class=\"page\" data-page=\"138\" id=\"stranica-138\">\u003ch2>Stranica 138\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 138\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"138.1\" id=\"ar-odlomak-138-1\">آدَمُ يَوْمَئِذٍ قَدْ غَابَ عَنْهُمَا وَأَتَى مَكَّةَ يَنْظُرُ إِلَيْهَا، قَالَ اللَّهُ لآدَمَ: يَا آدَمُ، هَلْ تَعْلَمُ أَنَّ لِي بَيْتًا فِي الأَرْضِ؟ قَالَ: اللَّهُمَّ لا، قَالَ: فَإِنَّ لِي بَيْتًا بِمَكَّةَ فَأْتِهِ، فَقَالَ آدَمُ لِلسَّمَاءِ: احْفَظِي وَلَدَيَّ بِالأَمَانَةِ، فَأَبَتْ، وَقَالَ لِلأَرْضِ فَأَبَتْ، وَقَالَ لِلْجِبَالِ: فَأَبَتْ، فَقَالَ لِقَابِيلَ، فَقَالَ: نَعَمْ، تَذْهَبُ وَتَرْجِعُ وَتَجِدُ أَهْلَكَ كَمَا يَسُرُّكَ فَلَمَّا انْطَلَقَ آدَمُ قَرَّبَا قُرْبَانًا، وَكَانَ قَابِيلُ يَفْخَرُ عَلَيْهِ فَيَقُولُ: أَنَا أَحَقُّ بِهَا مِنْكَ هِيَ أُخْتِي، وَأَنَا أَكْبَرُ مِنْكَ، وَأَنَا وَصِيُّ وَالِدِي، فَلَمَّا قَرَّبَا، قَرَّبَ هَابِيلُ جَذَعَةَ سَمِينَةً، وَقَرَّبَ قَابِيلُ حِزْمَةَ سُنْبُلٍ، فَوَجَدَ فِيهَا سُنْبُلَةً عَظِيمَةً فَفَرَكَهَا فَأَكَلَهَا، فَنَزَلَتِ النَّارُ فَأَكَلَتْ قُرْبَانَ هَابِيلَ، وَتَرَكَتْ قُرْبَانَ قَابِيلَ، فَغَضِبَ وَقَالَ: لأَقْتُلَنَّكَ حَتَّى لا تَنْكِحَ أُخْتِي، فَقَالَ هَابِيلُ:\n«إِنَّما يَتَقَبَّلُ اللَّهُ مِنَ الْمُتَّقِينَ لَئِنْ بَسَطْتَ إِلَيَّ يَدَكَ لِتَقْتُلَنِي مَا أَنَا بِباسِطٍ يَدِيَ إِلَيْكَ لِأَقْتُلَكَ» ، إِلَى قَوْلِهِ: «فَطَوَّعَتْ لَهُ نَفْسُهُ قَتْلَ أَخِيهِ» ، فَطَلَبَهُ لِيَقْتُلَهُ، فَرَاغَ الْغُلامُ مِنْهُ فِي رُءُوسِ الْجِبَالِ، فَأَتَاهُ يَوْمًا مِنَ الأَيَّامِ وَهُوَ يَرْعَى غَنَمَهُ فِي جَبَلٍ وَهُوَ نَائِمٌ، فَرَفَعَ صَخْرَةً فَشَدَخَ بِهَا رَأْسَهُ، فَمَاتَ وَتَرَكَهُ بِالْعَرَاءِ، لا يَعْلَمُ كَيْفَ يُدْفَنُ، فَبَعَثَ اللَّهُ غُرَابَيْنِ أَخَوَيْنِ فَاقْتَتَلا، فَقَتَلَ أَحَدُهُمَا صَاحِبَهُ، فَحَفَرَ لَهُ ثُمَّ حثا عليه، فلما رآه قال: «يا وَيْلَتى أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هذَا الْغُرابِ فَأُوارِيَ سَوْأَةَ أَخِي» ، فَهُوَ قَوْلُهُ عَزَّ وَجَلَّ: «فَبَعَثَ اللَّهُ غُراباً يَبْحَثُ فِي الْأَرْضِ لِيُرِيَهُ كَيْفَ يُوارِي سَوْأَةَ أَخِيهِ» فَرَجَعَ آدَمُ فَوَجَدَ ابْنَهُ قَدْ قَتَلَ أَخَاهُ، فَذَلِكَ حِينَ يَقُولُ اللَّهُ عَزَّ وَجَلَّ: «إِنَّا عَرَضْنَا الْأَمانَةَ عَلَى السَّماواتِ وَالْأَرْضِ وَالْجِبالِ» - إِلَى آخِرِ الآيَةِ- «إِنَّهُ كانَ ظَلُوماً جَهُولًا\n» يَعْنِي قَابِيلَ حِينَ حَمَلَ أَمَانَةَ آدَمَ، ثُمَّ لَمْ يَحْفَظْ لَهُ أَهْلَهُ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 138\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"138.1\" id=\"odlomak-138-1\">Adem bio odsutan od njih i otišao u Meku da je vidi. Allah je rekao Ademu: ‘Ademe, znaš li da Ja na Zemlji imam Hram?’ Odgovorio je: ‘Allahu moj, ne znam.’ Rekao je: ‘Imam Hram u Meki, pa mu otiđi.’ Adem je nebu rekao: ‘Čuvaj moju djecu kao povjereni emanet’, ali je odbilo. Rekao je to i Zemlji, pa je odbila, a rekao je i planinama, pa su odbile. Rekao je to Kabilu i on je odgovorio: ‘Hoću. Otići ćeš, vratiti se i zateći svoju porodicu onakvom kakva će te obradovati.’ Kada je Adem otišao, prinijeli su žrtve. Kabil se uznosio nad njim govoreći: ‘Ja imam više prava na nju nego ti. Ona je moja sestra, stariji sam od tebe i ja sam očev oporučeni nasljednik.’ Kada su prinijeli, Habil je prinio debelu mladu ovcu, a Kabil svežanj klasova. U njemu je našao velik klas, protrljao ga i pojeo. Spustila se vatra, pojela Habilovu žrtvu, a ostavila Kabilovu. On se rasrdio i rekao: ‘Ubit ću te da se ne oženiš mojom sestrom.’ Habil je rekao: ‘Allah prima samo od bogobojaznih. Ako pružiš ruku prema meni da me ubiješ, ja neću pružiti svoju ruku prema tebi da te ubijem’ — do Njegovih riječi: ‘Pa mu je njegova duša uljepšala ubistvo brata.’ Tražio ga je da ga ubije, a mladić mu je izmicao po planinskim vrhovima. Jednoga dana došao mu je dok je na planini čuvao ovce i spavao. Podigao je stijenu i njome mu smrskao glavu, pa je umro. Ostavio ga je na otvorenom, ne znajući kako se sahranjuje. Allah je poslao dva gavrana, braću, pa su se potukli. Jedan je ubio drugoga, zatim mu iskopao rupu i na njega nagrnuo zemlju. Kada je to vidio, rekao je: ‘Teško meni! Zar sam nemoćan biti poput ovoga gavrana i zakopati tijelo svoga brata?’ To su riječi Njega, Silnog i Uzvišenog: ‘Pa je Allah poslao gavrana da kopa po zemlji kako bi mu pokazao kako da zakopa tijelo svoga brata.’ Adem se vratio i zatekao da je njegov sin ubio brata. To je ono kada Allah, Silan i Uzvišen, kaže: ‘Mi smo ponudili emanet nebesima, Zemlji i planinama’ — do kraja ajeta: ‘On je, doista, nepravedan i neznalica.’ Time se misli na Kabila, kada je preuzeo Ademov emanet, a zatim mu nije sačuvao porodicu.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Maida, 5:27–28, navedeni dijelovi; 5:30, navedeni dio; 5:31, navedeni dijelovi; El-Ahzab, 33:72, navedeni početak i završetak. Prijelazi „do“ potječu iz izvora. Završno poistovjećivanje s Kabilom pripada navedenoj predaji.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":139,"html":"\u003csection class=\"page\" data-page=\"139\" id=\"stranica-139\">\u003ch2>Stranica 139\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 139\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"139.1\" id=\"ar-odlomak-139-1\">وَقَالَ آخَرُونَ: كَانَ السَّبَبُ فِي ذَلِكَ أَنَّ آدَمَ كَانَ يُولَدُ لَهُ مِنْ حَوَّاءَ فِي كُلِّ بَطْنٍ ذَكَرٌ وَأُنْثَى، فَإِذَا بَلَغَ الذَّكَرُ منهما زوج منه ولده الأُنْثَى الَّتِي وُلِدَتْ مَعَ أَخِيهِ الَّذِي وُلِدَ فِي الْبَطْنِ الآخَرِ، قَبْلَهُ أَوْ بَعْدَهُ.\nفَرَغِبَ قَابِيلُ بِتَوْءَمَتِهِ عَنْ هَابِيلَ.\u003c/p>\u003cp data-pair=\"139.2\" id=\"ar-odlomak-139-2\">كَمَا \u003cspan class=\"isnad\">حَدَّثَنِي الْقَاسِمُ بن الحسن، قال: حدثنا الحسين، قال:\nحدثني حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: أَخْبَرَنِي عَبْدُ اللَّهِ بْنُ عُثْمَانَ بْنِ خُثَيْمٍ، قَال\u003c/span>َ: أَقْبَلْتُ مَعَ سَعِيدِ بْنِ جُبَيْرٍ أَرْمِي الْجَمْرَةَ، وَهُوَ متقنع متوكى عَلَى يَدِي، حَتَّى إِذَا وَازَيْنَا بِمَنْزِلِ سَمُرَةَ الصَّوَّافِ، وَقَفَ \u003cspan class=\"isnad\">يُحَدِّثُنِي عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ: نُهِيَ أَنْ تَنْكِحَ الْمَرْأَةُ أَخَاهَا تَوْءَمَهَا، وَيَنْكِحُهَا غَيْرُهُ مِنْ إِخْوَتِهَا، وَكَانَ يُولَدُ فِي كُلِّ بَطْنٍ رَجُلٌ وَامْرَأَةٌ، فَوُلِدَتِ امْرَأَةٌ وَسِيمَةٌ وَوُلِدَتِ امْرَأَةٌ قَبِيحَةٌ، فَقَالَ أَخُو الدَّمِيمَةِ: أَنْكِحْنِي أُخْتَكَ وَأُنْكِحَكَ أُخْتِي، قَالَ: لا، أَنَا أَحَقُّ بِأُخْتِي، فَقَرَّبَا قُرْبَانًا فَتُقُبِّلَ مِنْ صَاحِبِ الْكَبْشِ، وَلَمْ يُتَقَبَّلْ مِنْ صَاحِبِ الزَّرْعِ، فَقَتَلَهُ، فَلَمْ يَزَلْ ذَلِكَ الْكَبْشُ مَحْبُوسًا عِنْدَ اللَّهِ عَزَّ وَجَلَّ حَتَّى أَخْرَجَهُ فِي فِدَاءِ إِسْحَاقَ، فَذَبَحَهُ عَلَى هَذَا الصَّفَا، فِي ثَبِيرٍ، عِنْدَ مَنْزِلِ سَمُرَةَ الصَّوَّافِ، وَهُوَ عَلَى يَمِينِكَ حِينَ تَرْمِي الْجِمَارَ.\u003c/p>\u003cp data-pair=\"139.3\" id=\"ar-odlomak-139-3\">\u003cspan class=\"isnad\">حدثنا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ بَعْضِ أَهْلِ العلم من أهل الكتاب الأول\u003c/span>، أن آدم ع كان يغشى حواء في الجنة قبل أن تصيب الخطيئة، فحملت له بقين بن آدم وتوءمته، فلم تجد عليهما وحما ولا وصبا، ولم تجد عليهما طلقا حين ولدتهما، ولم تر معهما دما لطهر الجنة، فلما أكلا من الشجرة وأصابا المعصية، وهبطا إلى الأرض واطمأنا بها تغشاها، فحملت بهابيل وتوءمته، فوجدت عليهما الوحم والوصب، ووجدت حين ولدتهما الطلق ورأت معهما الدم، وكانت حواء-\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 139\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"139.1\" id=\"odlomak-139-1\">Drugi su rekli da je razlog bio sljedeći: Ademu bi Havva pri svakom porodu rodila dječaka i djevojčicu. Kada bi dječak odrastao, ženio bi ga svojom kćerkom rođenom s njegovim bratom u drugom porodu, prije ili poslije njega. Kabil nije htio dati svoju sestru blizanku Habilu.\u003c/p>\u003cp data-pair=\"139.2\" id=\"odlomak-139-2\">Kako \u003cspan class=\"isnad\">mi je pričao Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn, koji je rekao: pričao mi je Hadždžadž, od Ibn Džurejdža, koji je rekao: obavijestio me Abdullah ibn Osman ibn Husejm, koji je rekao:\u003c/span> „Pošao sam sa Seidom ibn Džubejrom da bacam kamenčiće na Džemru. Bio je pokrivene glave i oslanjao se na moju ruku. Kada smo se našli naspram kuće Semure es-Savvafa, zastao je i \u003cspan class=\"isnad\">kazivao mi od Ibn Abbasa, koji je rekao:\u003c/span> ‘Ženi je bilo zabranjeno da se uda za svoga brata blizanca, ali njome se mogao oženiti drugi njen brat. U svakom porodu rađali su se muškarac i žena. Rođena je jedna lijepa žena i jedna ružna. Brat ružne rekao je: Udaj svoju sestru za mene, a ja ću svoju udati za tebe. Odgovorio je: Ne, ja imam više prava na svoju sestru. Prinijeli su žrtve, pa je primljena od onoga koji je prinio ovna, a nije primljena od onoga koji je prinio usjev. Zato ga je ubio. Taj je ovan ostao zadržan kod Allaha, Silnog i Uzvišenog, sve dok ga nije izveo kao otkup za Ishaka. Zaklao ga je na ovoj stijeni u Sebiru, kod kuće Semure es-Savvafa, s tvoje desne strane kada bacaš kamenčiće.’“\u003c/p>\u003cp data-pair=\"139.3\" id=\"odlomak-139-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Muhammed ibn Ishak, od nekih učenih među sljedbenicima Prve knjige,\u003c/span> da je Adem, alejhis-selam, imao odnos s Havvom u Džennetu prije nego što je počinila grijeh. Zanijela mu je Kajna, Ademovog sina, i njegovu sestru blizanku. S njima nije osjećala ni trudničku mučninu ni tegobu, pri njihovom rođenju nije osjećala trudove i s njima nije vidjela krvi zbog čistoće Dženneta. Kada su jeli s drveta, počinili grijeh, spušteni na Zemlju i nastanili se na njoj, imao je odnos s njom. Zanijela je Habila i njegovu sestru blizanku. S njima je osjećala trudničku mučninu i tegobu, pri njihovom rođenju osjećala trudove i vidjela krv. Havva je —\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":140,"html":"\u003csection class=\"page\" data-page=\"140\" id=\"stranica-140\">\u003ch2>Stranica 140\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 140\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"140.1\" id=\"ar-odlomak-140-1\">فيما يذكرون- لا تحمل إلا توءما ذكرا وأنثى، فولدت حواء لآدم أربعين ولدا لصلبه من ذكر وأنثى في عشرين بطنا، وكان الرجل منهم أي أخواته شاء تزوج إلا توءمته التي تولد معه، فإنها لا تحل له، وذلك أنه لم يكن نساء يومئذ إلا أخواتهم وأمهم حواء.\u003c/p>\u003cp data-pair=\"140.2\" id=\"ar-odlomak-140-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن محمد بن إسحاق، عن بعض أهل العلم بالكتاب الأول\u003c/span> أن آدم أمر ابنه قينا أن ينكح توءمته هابيل، وأمر هابيل أن ينكح أخته توءمته قينا، فسلم لذلك هابيل ورضي، وأبى ذلك قين وكره تكرما عن أخت هابيل، ورغب بأخته عن هابيل، وقال، نحن ولادة الجنة، وهما من ولادة الأرض، وأنا أحق بأختي- ويقول بعض أهل العلم من أهل الكتاب الأول: بل كانت أخت قين من أحسن الناس، فضن بها عن أخيه، وأرادها لنفسه- والله أعلم أي ذلك كان- فقال له أبوه: يا بني إنها لا تحل لك، فأبى قين أن يقبل ذلك من قول أبيه، فقال له أبوه: يا بني، فقرب قربانا، ويقرب أخوك هابيل قربانا، فأيكما قبل الله قربانه فهو أحق بها، وكان قين على بذر الأرض، وكان هابيل على رعاية الماشية، فقرب قين قمحا، وقرب هابيل أبكارا من أبكار غنمه- وبعضهم يقول:\nقرب بقره- فأرسل الله جل وعز نارا بيضاء، فأكلت قربان هابيل وتركت قربان قين وبذلك كان يقبل القربان إذا قبله الله عز وجل، فلما قبل الله قربان هابيل- وكان في ذلك القضاء له بأخت قين- غضب قين، وغلب عليه الكبر واستحوذ عليه الشيطان، فاتبع أخاه هابيل، وهو في ماشيته فقتله، فهما اللذان قص الله خبرهما في القرآن على محمد ص، فقال:\n\n«وَاتْلُ عَلَيْهِمْ» يعني أهل الكتاب «نَبَأَ ابْنَيْ آدَمَ بِالْحَقِّ إِذْ قَرَّبا قُرْباناً\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 140\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"140.1\" id=\"odlomak-140-1\">prema onome što navode — nosila samo blizance, muškarca i ženu. Havva je Ademu u dvadeset poroda rodila četrdeset njegove rođene djece, muške i ženske. Muškarac među njima mogao se oženiti kojom god je sestrom htio, osim svojom sestrom blizankom koja je s njim rođena; ona mu nije bila dopuštena. Tada nije bilo drugih žena osim njihovih sestara i njihove majke Havve.\u003c/p>\u003cp data-pair=\"140.2\" id=\"odlomak-140-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, od nekih poznavalaca Prve knjige,\u003c/span> da je Adem naredio svome sinu Kajnu da svoju sestru blizanku uda za Habila, a Habilu da svoju sestru blizanku uda za Kajna. Habil se tome pokorio i prihvatio, dok je Kajn to odbio i nije htio, smatrajući sebe odviše uglednim za Habilovu sestru i svoju sestru previše vrijednom za Habila. Rekao je: „Mi smo rođeni u Džennetu, a njih dvoje rođeni su na Zemlji. Ja imam više prava na svoju sestru.“ Neki od učenih sljedbenika Prve knjige govore: „Naprotiv, Kajnova sestra bila je među najljepšim ljudima, pa ju je ljubomorno čuvao od brata i želio je za sebe.“ A Allah najbolje zna šta je od toga bilo. Otac mu je rekao: „Sine moj, ona ti nije dopuštena.“ Kajn je odbio prihvatiti te očeve riječi. Otac mu je rekao: „Sine moj, prinesi žrtvu, a neka i tvoj brat Habil prinese žrtvu. Od kojega Allah primi žrtvu, taj ima više prava na nju.“ Kajn se bavio sijanjem zemlje, a Habil čuvanjem stoke. Kajn je prinio pšenicu, a Habil prvorođenu mladunčad svojih ovaca. Neki kažu da je prinio kravu. Allah, Slavljen i Silan, poslao je bijelu vatru. Pojela je Habilovu žrtvu, a ostavila Kajnovu. Tako je žrtva bila primana kada bi je Allah, Silan i Uzvišen, prihvatio. Kada je Allah prihvatio Habilovu žrtvu — a time je presuđeno da mu pripadne Kajnova sestra — Kajn se rasrdio, obuzela ga je oholost i šejtan je ovladao njime. Slijedio je svoga brata Habila dok je bio uz stoku i ubio ga. To su njih dvojica čiju je vijest Allah u Kur’anu ispričao Muhammedu, sallallahu alejhi ve sellem, rekavši: „I kazuj im“ — misli se sljedbenicima Knjige — „istinito vijest o dvojici Ademovih sinova: kada su prinijeli žrtvu, \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Maida, 5:27, navedeni početak, s nastavkom na sljedećoj stranici.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":141,"html":"\u003csection class=\"page\" data-page=\"141\" id=\"stranica-141\">\u003ch2>Stranica 141\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 141\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"141.1\" id=\"ar-odlomak-141-1\">فَتُقُبِّلَ مِنْ أَحَدِهِما» إلى آخر القصة، قال: فلما قتله سقط في يديه، ولم يدر كيف يواريه، وذلك أنه كان- فيما يزعمون- أول قتيل من بني آدم:\n«فَبَعَثَ اللَّهُ غُراباً يَبْحَثُ فِي الْأَرْضِ لِيُرِيَهُ كَيْفَ يُوارِي سَوْأَةَ أَخِيهِ قالَ يا وَيْلَتى أَعَجَزْتُ أَنْ أَكُونَ مِثْلَ هذَا الْغُرابِ فَأُوارِيَ سَوْأَةَ أَخِي» .\nإلى قوله: «ثُمَّ إِنَّ كَثِيراً مِنْهُمْ بَعْدَ ذلِكَ فِي الْأَرْضِ لَمُسْرِفُونَ» قال: ويزعم أهل التوراة أن قينا حين قتل أخاه هابيل، قال الله له: أين أخوك هابيل؟ قال: ما أدري، ما كنت عليه رقيبا، فقال الله له: إن صوت دم أخيك ليناديني من الأرض! الآن أنت ملعون من الأرض التي فتحت فاها، فتلقت دم أخيك من يدك، فإذا أنت عملت في الأرض، فإنها لا تعود تعطيك حرثها حتى تكون فزعا تائها في الأرض، فقال قين: عظمت خطيئتي من أن تغفرها، قد اخرجتنى اليوم عن وجه الارض واتوارى من قدامك، وأكون فزعا تائها في الأرض، وكل من لقيني، قتلني فقال الله عز وجل: ليس ذلك كذلك، فلا يكون كل من قتل قتيلا يجزى بواحد سبعة، ولكن من قتل قينا يجزي سبعة، وجعل الله في قين آية لئلا يقتله كل من وجده، وخرج قين من قدام الله عز وجل من شرقي عدن الجنة.\u003c/p>\u003cp data-pair=\"141.2\" id=\"ar-odlomak-141-2\">وقال آخرون في ذلك: إنما كان قتل القاتل منهما أخاه أن الله عز وجل أمرهما بتقريب قربان، فتقبل قربان أحدهما، ولم يتقبل من الآخر، فبغاه الذي لم يتقبل قربانه فقتله.\u003c/p>\u003cp data-pair=\"141.3\" id=\"ar-odlomak-141-3\">ذكر من قال ذلك:\u003c/p>\u003cp data-pair=\"141.4\" id=\"ar-odlomak-141-4\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، قال: حَدَّثَنَا مُحَمَّدُ بْنُ جعفر، قال: حدثنا\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 141\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"141.1\" id=\"odlomak-141-1\">pa je od jednoga primljena“ — do kraja pripovijesti. Rekao je: „Kada ga je ubio, obuzelo ga je kajanje i nije znao kako da ga zakopa. Prema onome što tvrde, on je bio prvi ubijeni među Ademovim potomcima. ‘Pa je Allah poslao gavrana da kopa po zemlji kako bi mu pokazao kako da zakopa tijelo svoga brata. Rekao je: Teško meni! Zar sam nemoćan biti poput ovoga gavrana i zakopati tijelo svoga brata?’ — do Njegovih riječi: ‘Zatim su mnogi od njih i nakon toga na Zemlji, doista, pretjerivali.’“ Rekao je: „Sljedbenici Tevrata tvrde da je, kada je Kajn ubio svoga brata Habila, Allah njemu rekao: ‘Gdje je tvoj brat Habil?’ Odgovorio je: ‘Ne znam; nisam bio njegov čuvar.’ Allah mu je rekao: ‘Glas krvi tvoga brata doziva Me iz zemlje! Sada si proklet od zemlje koja je otvorila svoja usta i primila krv tvoga brata iz tvoje ruke. Kada budeš radio na zemlji, ona ti više neće davati svoj urod; bit ćeš prestrašen i lutati Zemljom.’ Kajn je rekao: ‘Moj je grijeh prevelik da bi mi ga oprostio. Danas si me protjerao s lica zemlje i sakrit ću se ispred Tebe; bit ću prestrašen i lutati Zemljom, a svako ko me sretne ubit će me.’ Allah, Silan i Uzvišen, rekao je: ‘Nije tako. Neće svako ko nekoga ubije za jednoga biti kažnjen sedmerostruko; nego će onaj ko ubije Kajna biti kažnjen sedmerostruko.’ Allah je na Kajnu postavio znak kako ga ne bi ubio svako ko ga nađe. Kajn je otišao ispred Allaha, Silnog i Uzvišenog, istočno od Edena, Dženneta.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Maida, 5:27, nastavak; 5:31, navedeni dio; 5:32, završni dio. Izrazi „do kraja pripovijesti“ i „do Njegovih riječi“ nalaze se u izvoru. Kazivanje koje slijedi o Kajnovom razgovoru pripisano je sljedbenicima Tevrata.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"141.2\" id=\"odlomak-141-2\">Drugi su o tome rekli: „Razlog zbog kojeg je jedan od njih ubio svoga brata bio je samo to što im je Allah, Silan i Uzvišen, naredio da prinesu žrtve. Žrtva jednoga primljena je, a drugoga nije, pa je onaj čija žrtva nije primljena nepravedno nasrnuo na njega i ubio ga.“\u003c/p>\u003cp data-pair=\"141.3\" id=\"odlomak-141-3\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"141.4\" id=\"odlomak-141-4\">\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar, koji je rekao: pričao nam je Muhammed ibn Džafer, koji je rekao: pričao nam je\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":142,"html":"\u003csection class=\"page\" data-page=\"142\" id=\"stranica-142\">\u003ch2>Stranica 142\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 142\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"142.1\" id=\"ar-odlomak-142-1\">\u003cspan class=\"isnad\">عَوْفٌ، عَنْ أَبِي الْمُغِيرَةِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو، قَال\u003c/span>َ: إِنَّ ابْنَيْ آدَمَ اللَّذَيْنِ قَرَّبَا قُرْبَانًا فَتُقُبِّلَ مِنْ أَحَدِهِمَا وَلَمْ يُتَقَبَّل مِنَ الآخَرِ كَانَ أَحَدُهُمَا صَاحِبَ حَرْثٍ، وَالآخَرُ صَاحِبَ غَنَمٍ، وَأَنَّهُمَا أُمِرَا أَنْ يُقَرِّبَا قُرْبَانًا، وَأَنَّ صَاحِبَ الْغَنَمِ قَرَّبَ أَكْرَمَ غَنَمِهِ وَأَسْمَنَهَا وَأَحْسَنَهَا، طَيِّبَةً بِهَا نَفْسُهُ، وَأَنَّ صَاحِبَ الْحَرْثِ قرب، شر حرثه: الكوزر وَالزِّوَانَ، غَيْرَ طَيِّبَةٍ بِهَا نَفْسُهُ، وَأَنَّ اللَّهَ عَزَّ وَجَلَّ تَقَبَّلَ قُرْبَانَ صَاحِبِ الْغَنَمِ، وَلَمْ يَتَقَبَّلْ قُرْبَانَ صَاحِبِ الْحَرْثِ، وَكَانَ مِنْ قِصَّتِهِمَا مَا قَصَّ اللَّهُ فِي كِتَابِهِ وَقَالَ: أَيْمِ اللَّهِ، إِنْ كَانَ الْمَقْتُولُ لأَشَدَّ الرَّجُلَيْنِ، وَلَكِنْ مَنَعَهُ التَّحَرُّجُ أَنْ يَنْبَسِطَ إِلَى أَخِيهِ.\u003c/p>\u003cp data-pair=\"142.2\" id=\"ar-odlomak-142-2\">وَقَالَ آخَرُونَ بِمَا \u003cspan class=\"isnad\">حَدَّثَنِي بِهِ مُحَمَّدُ بْنُ سَعْدٍ، قَالَ: حَدَّثَنِي أَبِي، قَالَ: حَدَّثَنِي عَمِّي، قَالَ: حَدَّثَنِي أَبِي، عَنْ أَبِيهِ، عَنِ ابْنِ عَبَّاسٍ، قَال\u003c/span>َ:\nكَانَ مِنْ شَأْنِهِمَا أَنَّهُ لَمْ يَكُنْ مِسْكِينٌ يُتَصَدَّقُ عَلَيْهِ، وَإِنَّمَا كَانَ الْقُرْبَانُ يُقَرِّبُهُ الرَّجُلُ، فَبَيْنَا ابْنَا آدَمَ قَاعِدَانِ إِذْ قَالا: لَوْ قَرَّبْنَا قُرْبَانًا! وَكَانَ الرَّجُلُ إِذَا قَرَّبَ قُرْبَانًا فَرَضِيَهُ اللَّهُ عَزَّ وَجَلَّ أَرْسَلَ إِلَيْهِ نَارًا فَأَكَلَتْهُ، وَإِنْ لَمْ يَكُنْ رَضِيَهُ اللَّهُ خَبَتِ النَّارُ، فَقَرَّبَا قُرْبَانًا، وَكَانَ أَحَدُهُمَا رَاعِيًا وَالآخَرُ حَرَّاثًا، وَإِنَّ صَاحِبَ الْغَنَمِ قَرَّبَ خَيْرَ غَنَمِهِ وَأَسْمَنَهَا، وَقَرْبَ الآخَرُ بَعْضَ زَرْعِهِ، فَجَاءَتِ النار فنزلت بينهما فَأَكَلَتِ الشَّاةَ وَتَرَكَتِ الزَّرْعَ، وَإِنَّ ابْنَ آدَمَ قَالَ لأَخِيهِ: أَتَمْشِي فِي النَّاسِ، وَقَدْ عَلِمُوا أَنَّكَ قَرَّبْتَ قُرْبَانًا فَتُقُبِّلَ مِنْكَ وَرُدَّ عَلَيَّ قُرْبَانِي! فَلا وَاللَّهِ لا يَنْظُرُ النَّاسُ إِلَيَّ وَإِلَيْكَ وَأَنْتَ خَيْرٌ مِنِّي، فَقَالَ: لأَقْتُلَنَّكَ، فَقَالَ لَهُ أَخُوهُ:\nمَا ذَنْبِي! إِنَّما يَتَقَبَّلُ اللَّهُ مِنَ الْمُتَّقِينَ.\u003c/p>\u003cp data-pair=\"142.3\" id=\"ar-odlomak-142-3\">وَقَالَ آخَرُونَ: لَمْ تَكُنْ قِصَّةُ هَذَيْنِ الرَّجُلَيْنِ فِي عَهْدِ آدَمَ، وَلا كَانَ القربان\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 142\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"142.1\" id=\"odlomak-142-1\">\u003cspan class=\"isnad\">Avf, od Ebu Mugire, od Abdullaha ibn Amra, koji je rekao:\u003c/span> „Dvojica Ademovih sinova koji su prinijeli žrtve, pa je od jednoga primljena, a od drugoga nije, bili su jedan obrađivač zemlje, a drugi vlasnik ovaca. Naređeno im je da prinesu žrtve. Vlasnik ovaca prinio je svoju najvredniju, najdeblju i najljepšu ovcu, drage volje. Obrađivač zemlje prinio je najgori dio svoga usjeva: kevzer i zivan, ne čineći to drage volje. Allah, Silan i Uzvišen, primio je žrtvu vlasnika ovaca, a nije primio žrtvu obrađivača zemlje. O njima se dogodilo ono što je Allah ispričao u Svojoj Knjizi.“ Rekao je: „Tako mi Allaha, ubijeni je bio snažniji od njih dvojice, ali ga je strah od grijeha spriječio da digne ruku na svoga brata.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: الكوزر والزوان preneseno je približno kao „kevzer i zivan“; tačna identifikacija tih naziva u ovom navodu nije potvrđena.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"142.2\" id=\"odlomak-142-2\">Drugi su rekli ono što \u003cspan class=\"isnad\">mi je pričao Muhammed ibn Sa‘d, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je moj amidža, koji je rekao: pričao mi je moj otac, od svoga oca, od Ibn Abbasa, koji je rekao:\u003c/span> „Njihov slučaj bio je ovakav: nije bilo siromaha kome bi se dala sadaka, nego je čovjek prinosio žrtvu. Dok su dvojica Ademovih sinova sjedila, rekli su: ‘Kada bismo prinijeli žrtvu!’ Kada bi čovjek prinio žrtvu i Allah, Silan i Uzvišen, bio zadovoljan njome, poslao bi joj vatru koja bi je pojela; ako Allah nije bio njome zadovoljan, vatra bi se ugasila. Prinijeli su žrtve. Jedan je bio pastir, a drugi zemljoradnik. Vlasnik ovaca prinio je svoju najbolju i najdeblju ovcu, a drugi nešto od svoga usjeva. Vatra je došla, spustila se između njih, pojela ovcu i ostavila usjev. Ademov sin rekao je svome bratu: ‘Zar ćeš hodati među ljudima dok oni znaju da si prinio žrtvu i da je od tebe primljena, a moja je odbijena? Ne, tako mi Allaha, ljudi neće gledati mene i tebe, a da si ti bolji od mene!’ Rekao je: ‘Ubit ću te!’ Brat mu je rekao: ‘Šta sam ja skrivio? Allah prima samo od bogobojaznih.’“ \u003cspan class=\"translator-note\">⟦Završna rečenica „Allah prima samo od bogobojaznih“ odgovara riječima iz El-Maida, 5:27.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"142.3\" id=\"odlomak-142-3\">Drugi su rekli: „Događaj ove dvojice nije bio u Ademovo doba niti je žrtva prinesena\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":143,"html":"\u003csection class=\"page\" data-page=\"143\" id=\"stranica-143\">\u003ch2>Stranica 143\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 143\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"143.1\" id=\"ar-odlomak-143-1\">فِي عَصْرِهِ، وَقَالُوا: إِنَّمَا كَانَ هَذَانِ رَجُلَيْنِ مِنْ بَنِي إِسْرَائِيلَ، وَقَالُوا: إِنَّ أَوَّلَ مَيِّتٍ مات في الارض آدم ع، لَمْ يَمُتْ قَبْلَهُ أَحَدٌ.\u003c/p>\u003cp data-pair=\"143.2\" id=\"ar-odlomak-143-2\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"143.3\" id=\"ar-odlomak-143-3\">\u003cspan class=\"isnad\">حَدَّثَنَا سفيان بن وكيع، قال: حَدَّثَنَا سهل بن يوسف، عن عمرو، عن الحسن، قال\u003c/span>: كان الرجلان اللذان في القرآن قال الله عز وجل فيهما: «وَاتْلُ عَلَيْهِمْ نَبَأَ ابْنَيْ آدَمَ بِالْحَقِّ» من بني إسرائيل، ولم يكونا ابني آدم لصلبه، وإنما كان القربان في بني إسرائيل، وكان آدم أول من مات.\u003c/p>\u003cp data-pair=\"143.4\" id=\"ar-odlomak-143-4\">وقال بعضهم: إن آدم غشي حواء بعد مهبطهما إلى الأرض بمائة سنة، فولدت له قابيل وتوءمته قليما في بطن واحد، ثم هابيل وتوءمته في بطن واحد، فلما شبوا أراد آدم ع أن يزوج أخت قابيل التي ولدت معه في بطن واحد من هابيل، فامتنع من ذلك قابيل، وقربا بهذا السبب قربانا فتقبل قربان هابيل، ولم يتقبل قربان قابيل، فحسده قابيل، فقتله عند عقبه حرى ثم نزل قابيل من الجبل، آخذا بيد أخته قليما، فهرب بها إلى عدن من أرض اليمن.\u003c/p>\u003cp data-pair=\"143.5\" id=\"ar-odlomak-143-5\">\u003cspan class=\"isnad\">حَدَّثَنِي بِذَلِكَ الْحَارِثُ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنِي هِشَامٌ، قَالَ: أَخْبَرَنِي أبي، عن أبي صالح، عن ابن عباس، قَال\u003c/span>َ: لَمَّا قَتَلَ قَابِيلُ أَخَاهُ هَابِيلَ أَخَذَ بِيَدِ أُخْتِهِ ثُمَّ هَبَطَ بِهَا مِنْ جَبَلِ بُوذَ إِلَى الْحَضِيضِ، فَقَالَ آدَمُ لِقَابِيلَ: اذْهَبْ فَلا تَزَالُ مَرْعُوبًا لا تَأْمَنُ مَنْ تَرَاهُ، فَكَانَ لا يَمُرُّ بِهِ أَحَدٌ مِنْ وَلَدِهِ إِلا رَمَاهُ، فَأَقْبَلَ ابْنٌ لِقَابِيلَ أَعْمَى، وَمَعَهُ ابْنٌ لَهُ، فَقَالَ لِلأَعْمَى ابْنُهُ:\nهَذَا أَبُوكَ قَابِيلُ، فَرَمَى الأَعْمَى أَبَاهُ قَابِيلَ فَقَتَلَهُ، فَقَالَ ابْنُ الأَعْمَى: قَتَلْتَ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 143\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"143.1\" id=\"odlomak-143-1\">u njegovo vrijeme. Bili su to samo dvojica ljudi među sinovima Israilovim.“ Rekli su: „Prvi koji je umro na Zemlji bio je Adem, alejhis-selam; prije njega niko nije umro.“\u003c/p>\u003cp data-pair=\"143.2\" id=\"odlomak-143-2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"143.3\" id=\"odlomak-143-3\">\u003cspan class=\"isnad\">Pričao nam je Sufjan ibn Veki‘, koji je rekao: pričao nam je Sehl ibn Jusuf, od Amra, od Hasena, koji je r
