ميمون، عن ابن أبي نجيح، عن مجاهد، في قول الله عز وجل:\n\n«اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، قال: آدم وحواء وإبليس والحية","bs_tekst":"Pričao mi je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa ibn Mejmun, od Ibn Ebu Nedžiha, od Mudžahida, o riječima Allaha, Silnog i Uzvišenog: „Siđite; jedni drugima bit ćete neprijatelji.“ Rekao je: „Adem, Havva, Iblis i zmija.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:36, i El-A‘raf, 7:24, navedeni dio.⟧"},{"stranica":113,"ar_tekst":"القول في قدر مكث آدم في الجنة ووقت خلق الله عز وجل إياه ووقت إهباطه إياه من السماء إلى الأرض","bs_tekst":"Rasprava o tome koliko je Adem boravio u Džennetu, kada ga je Allah, Silan i Uzvišen, stvorio i kada ga je s neba spustio na Zemlju"},{"stranica":113,"ar_tekst":"قد تظاهرت الاخبار عن رسول الله ص بان الله عز وجل خلق آدم ع يوم الجمعة، وأنه أخرجه فيه من الجنة، وأهبطه إلى الأرض فيه، وأنه فيه تاب عليه، وفيه قبضه.","bs_tekst":"Brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, međusobno se potvrđuju da je Allah, Silan i Uzvišen, stvorio Adema, alejhis-selam, u petak; da ga je toga dana izveo iz Dženneta i spustio na Zemlju; da mu je toga dana prihvatio pokajanje i toga dana uzeo njegov život."},{"stranica":113,"ar_tekst":"ذكر الأخبار عن رسول الله ص بذلك:","bs_tekst":"Spomen predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, o tome:"},{"stranica":113,"ar_tekst":"حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا عَلِيُّ بْنُ مَعْبَدٍ، قَالَ: حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ عَمْرٍو، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عن عمرو بن شرحبيل عن سَعِيدِ بْنِ سَعْدِ بْنِ عُبَادَةَ، عَنْ سَعْدِ بن عباده، [عن رسول الله ص، قَالَ: إِنَّ فِي الْجُمُعَةِ خَمْسَ خِلالٍ: فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُهْبِطَ إِلَى الأَرْضِ، وَفِيهِ تَوَفَّى اللَّهُ آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ الْعَبْدُ فِيهَا رَبَّهُ شَيْئًا إِلا أَعْطَاهُ اللَّهُ إِيَّاهُ، مَا لَمْ يَسْأَلْ إِثْمًا أَوْ قَطِيعَةً، وَفِيهِ: تَقُومُ السَّاعَةُ، وَمَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا جَبَلٍ وَلا أَرْضٍ وَلا رِيحٍ، إِلا مُشْفِقٌ مِنْ يَوْمِ الْجُمُعَةِ] .","bs_tekst":"Pričao mi je Abdurrahman ibn Abdullah ibn Abdulhakem, koji je rekao: pričao nam je Ali ibn Ma‘bed, koji je rekao: pričao nam je Ubejdullah ibn Amr, od Abdullaha ibn Muhammeda ibn Akila, od Amra ibn Šurahbila, od Seida ibn Sa‘da ibn Ubade, od Sa‘da ibn Ubade, od Allahovog Poslanika, sallallahu alejhi ve sellem, koji je rekao: „Petak ima pet svojstava: u njemu je stvoren Adem, u njemu je spušten na Zemlju, u njemu je Allah usmrtio Adema, u njemu postoji čas u kojem rob ne traži od svoga Gospodara ništa a da mu Allah to ne dadne, sve dok ne traži grijeh ili prekidanje veza; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni planine, ni zemlje, ni vjetra a da ne strepi od petka.“"},{"stranica":113,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ بَشَّارٍ وَمُحَمَّدُ بْنُ مَعْمَرٍ، قَالا: حَدَّثَنَا أَبُو عَامِرٍ، حَدَّثَنَا زُهَيْرُ بْنُ مُحَمَّدٍ، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ يَزِيدَ الأَنْصَارِيِّ، عَنْ أَبِي لُبَابَةَ بْنِ عَبْدِ الْمُنْذِرِ، [أَنَّ النَّبِيَّ ص قَالَ: سَيِّدُ الأَيَّامِ يَوْمُ الْجُمُعَةِ، وَأَعْظَمُهَا وَأَعْظَمُ عِنْدَ اللَّهِ مِنْ يَوْمِ الْفِطْرِ وَيَوْمِ النَّحْرِ، وَفِيهِ خَمْسُ خِلالٍ: خَلَقَ اللَّهُ تَعَالَى فِيهِ آدَمَ، وَأَهْبَطَهُ فِيهِ إِلَى الأَرْضِ، وَفِيهِ تَوَفَّى اللَّهُ تَعَالَى آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ اللَّهَ الْعَبْدُ شَيْئًا إِلا أَعْطَاهُ إِيَّاهُ مَا لَمْ يَكُنْ حَرَامًا وَفِيهِ تَقُومُ السَّاعَةُ، مَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا أَرْضٍ وَلا جِبَالٍ وَلا رِيَاحٍ وَلا بَحْرٍ إِلا وَهُوَ مُشْفِقٌ مِنْ يَوْمِ الْجُمُعَةِ، أَنْ تَقُومَ فِيهِ السَّاعَةُ] .","bs_tekst":"Pričali su mi Muhammed ibn Beššar i Muhammed ibn Ma‘mer; obojica su rekli: pričao nam je Ebu Amir: pričao nam je Zuhejr ibn Muhammed, od Abdullaha ibn Muhammeda ibn Akila, od Abdurrahmana ibn Jezida el-Ensarija, od Ebu Lubabe ibn Abdulmunzira, da je Vjerovjesnik, sallallahu alejhi ve sellem, rekao: „Prvak dana je petak i on je najveći među njima; kod Allaha je veći od dana Ramazanskog bajrama i dana klanja kurbana. Ima pet svojstava: Uzvišeni Allah u njemu je stvorio Adema, u njemu ga je spustio na Zemlju, u njemu je Uzvišeni Allah usmrtio Adema, u njemu postoji čas u kojem rob ništa ne traži od Allaha a da mu On to ne dadne, sve dok to nije zabranjeno; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni zemlje, ni planina, ni vjetrova, ni mora a da ne strepi od petka, da u njemu ne nastupi Čas.“"},{"stranica":113,"ar_tekst":"وَاللَّفْظُ لِحَدِيثِ ابْنِ بَشَّارٍ","bs_tekst":"Ovo je formulacija predaje Ibn Beššara."},{"stranica":114,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ مَعْمَرٍ، قَالَ: حَدَّثَنَا أَبُو عامر، قال: حدثنا زهير ابن مُحَمَّدٍ، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عَنْ عَمْرِو بْنِ شُرَحْبِيلَ بْنِ سَعِيدِ بْنِ سَعْدِ بْنِ عُبَادَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنْ سَعْدِ بْنِ عُبَادَةَ، [أَنَّ رَجُلا اتى النبي ص، فَقَالَ: يَا رَسُولَ اللَّهِ، أَخْبِرْنَا عَنْ يَوْمِ الْجُمُعَةِ، مَاذَا فِيهِ مِنَ الْخَيْرِ؟ فَقَالَ: فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُهْبِطَ آدَمُ، وَفِيهِ تَوَفَّى آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ الْعَبْدُ فِيهَا شَيْئًا إِلا أَعْطَاهُ اللَّهُ إِيَّاهُ، مَا لَمْ يَسْأَلْ مَأْثَمًا أَوْ قَطِيعَةً، وَفِيهِ تَقُومُ السَّاعَةُ، مَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا أَرْضٍ وَلا جِبَالٍ وَلا رِيحٍ إِلا هُنَّ يُشْفِقْنَ مِنْ يَوْمِ الْجُمُعَةِ] .","bs_tekst":"Pričao nam je Muhammed ibn Ma‘mer, koji je rekao: pričao nam je Ebu Amir, koji je rekao: pričao nam je Zuhejr ibn Muhammed, od Abdullaha ibn Muhammeda ibn Akila, od Amra ibn Šurahbila ibn Seida ibn Sa‘da ibn Ubade, od njegovog oca, od njegovog djeda, od Sa‘da ibn Ubade, da je neki čovjek došao Vjerovjesniku, sallallahu alejhi ve sellem, i rekao: „Allahov Poslaniče, obavijesti nas o petku: kakvo dobro ima u njemu?“ Odgovorio je: „U njemu je stvoren Adem, u njemu je Adem spušten, u njemu je usmrtio Adema, u njemu postoji čas u kojem rob ništa ne zatraži a da mu Allah to ne dadne, sve dok ne traži grijeh ili prekidanje veza; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni zemlje, ni planina, ni vjetra a da ne strepe od petka.“"},{"stranica":114,"ar_tekst":"حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا أَبُو زُرْعَةَ، قَالَ: أَخْبَرَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، عَنْ عَبْدِ الرَّحْمَنِ الأَعْرَجِ، أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ يَقُولُ: [قَالَ رَسُولُ اللَّهِ ص: خَيْرُ يَوْمٍ طَلَعَتِ الشَّمْسُ عَلَيْهِ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُدْخِلَ الْجَنَّةُ وَأُخْرِجَ مِنْهَا] .","bs_tekst":"Pričao mi je Abdurrahman ibn Abdullah ibn Abdulhakem, koji je rekao: pričao nam je Ebu Zur‘a, koji je rekao: obavijestio me Junus, od Ibn Šihaba, od Abdurrahmana el-A‘redža, da je čuo Ebu Hurejru kako govori: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Najbolji dan nad kojim je Sunce izašlo jeste petak. U njemu je stvoren Adem i u njemu je uveden u Džennet i izveden iz njega.’“"},{"stranica":114,"ar_tekst":"حَدَّثَنِي بَحْرُ بْنُ نَصْرٍ، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: أَخْبَرَنِي ابْنُ أَبِي الزِّنَادِ، عَنْ أَبِيهِ، عَنْ مُوسَى بْنِ أَبِي عُثْمَانَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رَسُولُ اللَّهِ ص: سَيِّدُ الأَيَّامِ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُدْخِلَ الْجَنَّةَ، وَفِيهِ أُخْرِجَ مِنْهَا، وَلا تَقُومُ السَّاعَةُ إِلا يَوْمَ الْجُمَعَةِ] .","bs_tekst":"Pričao mi je Bahr ibn Nasr, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: obavijestio me Ibn Ebu Zinad, od svoga oca, od Muse ibn Ebu Osmana, od Ebu Hurejre, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Prvak dana je petak. U njemu je stvoren Adem, u njemu je uveden u Džennet, u njemu je izveden iz njega, a Čas će nastupiti samo u petak.’“"},{"stranica":114,"ar_tekst":"حَدَّثَنَا الرَّبِيعُ بْنُ سُلَيْمَانَ، قَالَ: حَدَّثَنَا شُعَيْبُ بْنُ اللَّيْثِ، قَالَ: حَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ جَعْفَرِ بْنِ رَبِيعَةَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ هُرْمُزَ، أَنَّهُ قَالَ: سَمِعْتُ أَبَا هُرَيْرَةَ يَقُولُ: [قَالَ رسول الله ص: لَمْ تَطْلُعِ الشَّمْسُ عَلَى يَوْمٍ مِثْلَ يَوْمِ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُخْرِجَ مِنَ الْجَنَّةِ، وَفِيهِ أُعِيدَ فِيهَا] .","bs_tekst":"Pričao nam je Rebi‘ ibn Sulejman, koji je rekao: pričao nam je Šuajb ibn el-Lejs, koji je rekao: pričao nam je Lejs ibn Sa‘d, od Džafera ibn Rebie, od Abdurrahmana ibn Hurmuza, da je rekao: čuo sam Ebu Hurejru kako govori: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Sunce nije izašlo nad danom poput petka. U njemu je stvoren Adem, u njemu je izveden iz Dženneta i u njemu je vraćen u njega.’“"},{"stranica":114,"ar_tekst":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا جَرِيرٌ، عَنْ مَنْصُورٍ وَمُغِيرَةُ، عَنْ زِيَادِ بْنِ كُلَيْبٍ أَبِي مَعْشَرٍ، عَنْ إِبْرَاهِيمَ، عَنِ الْقَرْثَعِ الضَّبِّيِّ- وَكَانَ الْقَرْثَعُ","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Džerir, od Mensura i Mugire, od Zijada ibn Kulejba Ebu Ma‘šera, od Ibrahima, od Karsea ed-Dabbija — a Karse je bio"},{"stranica":115,"ar_tekst":"مِنَ الْقُرَّاءِ الأَوَّلِينَ- قَالَ: [قَالَ سَلْمَانُ: قَالَ لي رسول الله ص:\n\nيَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ قُلْتُ: اللَّهُ وَرَسُولُهُ أَعْلَمُ، يَقُولُهَا ثَلاثًا:\nيَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ فِيهِ جُمِّعَ أَبُوكَ، أَوْ أَبُوكُمْ] .","bs_tekst":"jedan od prvih učača Kur’ana — koji je rekao: „Selman je rekao: ‘Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: Selmane, znaš li šta je petak? Odgovorio sam: Allah i Njegov Poslanik najbolje znaju.’ To je izgovorio tri puta: ‘Selmane, znaš li šta je petak? U njemu je sastavljen tvoj otac — ili vaš otac.’“"},{"stranica":115,"ar_tekst":"حَدَّثَنِي مُحَمَّدُ بْنُ عُمَارَةَ الأَسَدِيُّ، قَالَ: حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى قَالَ: أَخْبَرَنَا شَيْبَانُ، عَنْ يَحْيَى، عَنْ أَبِي سَلَمَةَ، أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ يُحَدِّثُ أَنَّهُ سَمِعَ كَعْبًا يَقُولُ: خَيْرُ يَوْمٍ طَلَعَتْ فِيهِ الشَّمْسُ يوم الجمعه، فيه خلق آدم ع، وَفِيهِ دَخَلَ الْجَنَّةَ، وَفِيهِ أُخْرِجَ مِنْهَا، وَفِيهِ تَقُومُ السَّاعَةُ.","bs_tekst":"Pričao mi je Muhammed ibn Umara el-Esedi, koji je rekao: pričao nam je Ubejdullah ibn Musa, koji je rekao: obavijestio nas je Šejban, od Jahjaa, od Ebu Seleme, da je čuo Ebu Hurejru kako kazuje da je čuo Ka‘ba kako govori: „Najbolji dan u kojem je Sunce izašlo jeste petak. U njemu je stvoren Adem, alejhis-selam, u njemu je ušao u Džennet, u njemu je izveden iz njega i u njemu će nastupiti Čas.“"},{"stranica":115,"ar_tekst":"حَدَّثَنِي الْحُسَيْنُ بْنُ يَزِيدَ الآدَمِيُّ، قَالَ: حَدَّثَنَا روح بن عبادة، قَالَ: حَدَّثَنَا زكرياء بن إسحاق، عن عمرو بن دينار، عَنْ عُبَيْدِ بْنِ عُمَيْرٍ، قَالَ: إِنَّ أَوَّلَ يَوْمٍ طَلَعَتْ فِيهِ شَمْسُهُ يَوْمُ الْجُمُعَةِ، وَهُوَ أَفْضَلُ الأَيَّامِ: فِيهِ خَلَقَ اللَّهُ تَعَالَى ذِكْرُهُ آدَمَ، خَلَقَهُ عَلَى مِثْلِ صُورَتِهِ، فَلَمَّا فَرَغَ عَطَسَ آدَمُ فَأَلْقَى اللَّهُ تعالى عَلَيْهِ الْحَمْدَ، فَقَالَ اللَّهُ: يَرْحَمُكَ رَبُّكَ.","bs_tekst":"Pričao mi je Husejn ibn Jezid el-Ademi, koji je rekao: pričao nam je Revh ibn Ubada, koji je rekao: pričao nam je Zekerijja ibn Ishak, od Amra ibn Dinara, od Ubejda ibn Umejra, koji je rekao: „Prvi dan u kojem je Sunce izašlo bio je petak, a on je najbolji dan. U njemu je Allah, Uzvišen je spomen Njegov, stvorio Adema; stvorio ga je nalik njegovom liku. Kada je dovršio, Adem je kihnuo, pa mu je Uzvišeni Allah nadahnuo hvalu. Allah je rekao: ‘Smilovao ti se tvoj Gospodar.’“ ⟦Napomena prevodioca: u izrazu خلقه على مثل صورته nije izričito navedeno na koga se odnosi zamjenica „njegovom“; taj odnos nije ovdje razriješen dodavanjem tumačenja.⟧"},{"stranica":115,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، عَنْ أَبِي كُدَيْنَةَ، عَنْ مُغِيرَةَ، عَنْ زِيَادٍ، عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، عَنِ الْقَرْثَعِ، [عَنْ سَلْمَانَ، قَالَ: قال رسول الله ص: أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟\n\nهُوَ يَوْمٌ جُمِّعَ فيه ابوك، او أبوكم آدم ع] .","bs_tekst":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Ishak ibn Mensur, od Ebu Kudejne, od Mugire, od Zijada, od Ibrahima, od Alkame, od Karsea, od Selmana, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Znaš li šta je petak? To je dan u kojem je sastavljen tvoj otac — ili vaš otac — Adem, alejhis-selam.’“"},{"stranica":115,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، عَنْ أَبِي الأَحْوَصِ، عَنْ مُغِيرَةَ، عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، قَالَ: [قَالَ سَلْمَانُ قَالَ لي رسول الله ص: يَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ مَرَّتَيْنِ أَوْ ثَلاثًا، قَالَ: هُوَ الْيَوْمُ الَّذِي جُمِّعَ فِيهِ أَبُوكُمْ آدَمُ، أَوْ جُمِّعَ فِيهِ أَبُوكُمْ] .","bs_tekst":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, od Ebu Ahvesa, od Mugire, od Ibrahima, od Alkame, koji je rekao: „Selman je rekao: ‘Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: Selmane, znaš li šta je petak? — dva ili tri puta.’“ Rekao je: „To je dan u kojem je sastavljen vaš otac Adem — ili: u kojem je sastavljen vaš otac.“"},{"stranica":115,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا حَسَنُ بْنُ عَطِيَّةَ، قَالَ: حَدَّثَنَا قَيْسٌ، عَنِ الأَعْمَشِ، عَنْ إِبْرَاهِيمَ عَنِ الْقَرْثَعِ، [عَنْ سَلْمَانَ، قَالَ: قَالَ","bs_tekst":"Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Hasen ibn Atijja, koji je rekao: pričao nam je Kajs, od A‘meša, od Ibrahima, od Karsea, od Selmana, koji je rekao: „Rekao je"},{"stranica":116,"ar_tekst":"رسول الله ص: اتدرى ما الْجُمُعَةِ؟ أَوْ قَالَ: كَذَا، فِيهَا جُمِّعَ أَبُوكُمْ آدَمُ] .","bs_tekst":"Allahov Poslanik, sallallahu alejhi ve sellem: ‘Znaš li šta je petak?’ — ili je rekao tako nešto — ‘U njemu je sastavljen vaš otac Adem.’“"},{"stranica":116,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ عَلِيِّ بْنِ الْحَسَنِ بْنِ شَقِيقٍ، قَالَ: سَمِعْتُ أَبِي يَقُولُ:\nأَخْبَرَنَا أَبُو حَمْزَةَ، عَنْ مَنْصُورٍ، عَنْ إِبْرَاهِيمَ، عَنِ الْقَرْثَعِ، [عَنْ سَلْمَانَ، قَالَ: قَالَ لِي رَسُولُ الله ص: أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ قُلْتُ: لا، قَالَ: فِيهِ جُمِّعَ أَبُوكَ]","bs_tekst":"Pričao nam je Muhammed ibn Ali ibn el-Hasen ibn Šekik, koji je rekao: čuo sam svoga oca kako govori: obavijestio nas je Ebu Hamza, od Mensura, od Ibrahima, od Karsea, od Selmana, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: ‘Znaš li šta je petak?’ Odgovorio sam: ‘Ne.’ Rekao je: ‘U njemu je sastavljen tvoj otac.’“"},{"stranica":117,"ar_tekst":"ذكر الوقت الذى فيه خلق آدم ع من يوم الجمعة والوقت الذي أهبط إلى الأرض","bs_tekst":"Spomen vremena u kojem je Adem, alejhis-selam, stvoren u petak i vremena kada je spušten na Zemlju"},{"stranica":117,"ar_tekst":"اخْتُلِفَ فِي ذَلِكَ، فَرُوِيَ عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ وَغَيْرِهِ فِي ذَلِكَ مَا حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا ابْنُ إِدْرِيسَ، قَالَ: أَخْبَرَنَا مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رَسُولُ الله ص:\nخَيْرُ يَوْمٍ طَلَعَتْ فِيهِ الشَّمْسُ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُسْكِنَ الْجَنَّةَ، وَفِيهِ اهبط، وفيه تقوم الساعة، وفيه ساعه- يقللها- لا يُوَافِقُهَا عَبْدٌ مُسْلِمٌ يَسْأَلُ اللَّهَ تعالى فيها خيرا الا آتاه الله إِيَّاهُ،] فَقَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: قَدْ عَلِمْتُ أَيُّ سَاعَةٍ هِيَ، هِيَ آخِرُ سَاعَاتِ النَّهَارِ مِنْ يَوْمِ الْجُمُعَةِ، قَالَ اللَّهُ عَزَّ وَجَلَّ:\n\n«خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ سَأُرِيكُمْ آياتِي فَلا تَسْتَعْجِلُونِ» .","bs_tekst":"O tome postoji razilaženje. Od Abdullaha ibn Selama i drugih preneseno je ono što nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Ibn Idris, koji je rekao: obavijestio nas je Muhammed ibn Amr, od Ebu Seleme, od Ebu Hurejre, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Najbolji dan u kojem je Sunce izašlo jeste petak. U njemu je stvoren Adem, u njemu je nastanjen u Džennetu, u njemu je spušten i u njemu će nastupiti Čas. U njemu postoji čas’ — navodio ga je kao kratak — ‘koji muslimanski rob ne pogodi moleći u njemu Uzvišenog Allaha za dobro a da mu Allah to ne dadne.’“ Abdullah ibn Selam rekao je: „Znam koji je to čas. To je posljednji od dnevnih sati petka.“ Allah, Silan i Uzvišen, rekao je: „Čovjek je stvoren od žurbe. Pokazat ću vam Svoje znakove, pa Me ne požurujte.“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:37.⟧"},{"stranica":117,"ar_tekst":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا الْمُحَارِبِيُّ وَعَبْدَةُ بْنُ سُلَيْمَانَ وَأَسَدُ بْنُ عَمْرٍو، عَنْ مُحَمَّدِ بْنِ عَمْرٍو، قَالَ: حَدَّثَنَا أَبُو سَلَمَةَ، عَنْ ابى هريرة، عن النبي ص نَحْوَهُ، وَذَكَرَ فِيهِ كَلامَ عَبْدِ اللَّهِ بْنِ سَلامٍ بِنَحْوِهِ.","bs_tekst":"Pričao nam je Ebu Kurejb, koji je rekao: pričali su nam Muharibi, Abde ibn Sulejman i Esed ibn Amr, od Muhammeda ibn Amra, koji je rekao: pričao nam je Ebu Selema, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, nešto slično tome. U tome je naveo i riječi Abdullaha ibn Selama, slično navedenom."},{"stranica":117,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، قَالَ: حدثنا أبو عاصم، قال: حدثنا عيسى، عن ابن أبي نجيح، عن مجاهد في قوله عز وجل: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: قَوْلُ آدَمَ حِينَ خُلِقَ بَعْدَ كُلِّ شيء آخر النهار من يوم الجمعه، خُلِقَ الْخَلْقُ، فَلَمَّا أَحْيَا الرُّوحُ عَيْنَيْهِ وَلِسَانَهُ وَرَأْسَهُ وَلَمْ يَبْلُغْ أَسْفَلَهُ، قَالَ: يَا رَبِّ اسْتَعْجِلْ بِخَلْقِي قَبْلَ غُرُوبِ الشَّمْسِ","bs_tekst":"Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa, od Ibn Ebu Nedžiha, od Mudžahida, o riječima Njega, Silnog i Uzvišenog: „Čovjek je stvoren od žurbe.“ Rekao je: „To su Ademove riječi kada je, nakon svega ostalog, stvoren pri kraju dana petka. Stvorenja su bila stvorena, pa kada je duh oživio njegove oči, jezik i glavu, a nije još stigao do njegovog donjeg dijela, rekao je: ‘Gospodaru moj, požuri s mojim stvaranjem prije nego što Sunce zađe.’“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧"},{"stranica":118,"ar_tekst":"حدثني الحارث، قال: حدثنا الحسن، قال: حدثنا ورقاء، عن ابن أبي نجيح، عن مجاهد مثله.","bs_tekst":"Pričao mi je Haris, koji je rekao: pričao nam je Hasen, koji je rekao: pričao nam je Verka, od Ibn Ebu Nedžiha, od Mudžahida, isto to."},{"stranica":118,"ar_tekst":"حَدَّثَنَا الْقَاسِمُ، قَالَ: حَدَّثَنَا الْحُسَيْنُ، قَالَ: حَدَّثَنَا حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: قَالَ مُجَاهِدٌ: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: آدَمُ حِينَ خُلِقَ بعد كل شيء، ثم ذكره نحوه، غير أنه قال في حديثه: استعجل بخلقي، قد غربت الشمس.","bs_tekst":"Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao nam je Hadždžadž, od Ibn Džurejdža, koji je rekao: Mudžahid je rekao, o riječima: „Čovjek je stvoren od žurbe“: „Adem, kada je stvoren nakon svega ostalog.“ Zatim je naveo nešto slično tome, osim što je u svojoj predaji rekao: „Požuri s mojim stvaranjem; Sunce je već zašlo.“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧"},{"stranica":118,"ar_tekst":"حَدَّثَنِي يونس، قال: أخبرنا ابن وهب، قال: قال ابن زيد في قوله:\n\n«خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قال: على عجل خلق آدم آخر ذلك اليوم من ذينك اليومين- يريد يوم الجمعة- وخلقه على عجلة وجعله عجولا.","bs_tekst":"Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, o riječima: „Čovjek je stvoren od žurbe“: „U žurbi je Adem stvoren, na kraju toga dana od ona dva dana“ — misli na petak — „stvorio ga je u žurbi i učinio ga žurnim.“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧"},{"stranica":118,"ar_tekst":"وقد زعم بعضهم أن الله عز وجل أسكن آدم وزوجته الفردوس لساعتين مضتا من نهار يوم الجمعة، وقيل لثلاث ساعات مضين منه، وأهبطه إلى الأرض لسبع ساعات مضين من ذلك اليوم، فكان مقدار مكثهما في الجنة خمس ساعات منه وقيل: كان ذلك ثلاث ساعات وقال بعضهم: اخرج آدم ع من الجنه الساعة التاسعة أو العاشرة ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Neki su tvrdili da je Allah, Silan i Uzvišen, nastanio Adema i njegovu suprugu u Firdevsu nakon što su prošla dva dnevna sata petka; rečeno je i nakon što su prošla tri sata. Spustio ga je na Zemlju nakon što je prošlo sedam sati toga dana. Prema tome, njihov boravak u Džennetu trajao je pet njegovih sati; rečeno je i tri sata. Neki su rekli da je Adem, alejhis-selam, izveden iz Dženneta u devetom ili desetom satu. Spomen onih koji su to rekli:"},{"stranica":118,"ar_tekst":"قال أبو جعفر: قرأت على عبدان بن محمد المروزي، قال: حَدَّثَنَا عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع، عن أنس عن أبي العالية، قال: أخرج آدم من الجنة للساعة التاسعة أو العاشرة، فقال لي: نعم، لخمسة أيام مضين من نيسان.","bs_tekst":"Ebu Džafer kaže: Čitao sam Abdanu ibn Muhammedu el-Merveziju, koji je rekao: pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, od Enesa, od Ebu Alije, koji je rekao: „Adem je izveden iz Dženneta u devetom ili desetom satu.“ Pa mi je rekao: „Da, nakon što je prošlo pet dana nisana.“ ⟦Napomena prevodioca: u izvoru stoji عن الربيع، عن أنس kao dva uzastopna imena, pa nisu prešutno spojena u ime Rebi‘ ibn Enes. „Nisan“ je naziv mjeseca naveden u predaji.⟧"},{"stranica":118,"ar_tekst":"فإن كان قائل هذا القول أراد الله أن تبارك وتعالى أسكن آدم وزوجته الفردوس لساعتين مضتا من نهار يوم الجمعة من أيام أهل الدنيا التي هي على","bs_tekst":"Ako je onaj koji ovo kaže htio reći da je Allah, Blagoslovljen i Uzvišen, nastanio Adema i njegovu suprugu u Firdevsu nakon što su prošla dva dnevna sata petka od dana ovoga svijeta, koji su"},{"stranica":119,"ar_tekst":"ما هي به اليوم، فلم يبعد قوله من الصواب في ذلك، لأن الأخبار إذا كانت واردة عن السلف من أهل العلم، بأن آدم خلق في آخر ساعة من اليوم السادس من الأيام التي مقدار اليوم الواحد منها ألف سنة من سنيننا فمعلوم أن الساعة الواحدة من ساعات ذلك اليوم ثلاثة وثمانون عاما من أعوامنا، وقد ذكرنا أن آدم بعد أن خمر ربنا عز وجل طينته بقي قبل أن ينفخ فيه الروح أربعين عاما، وذلك لا شك أنه عنى به من أعوامنا وسنيننا، ثم من بعد أن نفخ فيه الروح إلى أن تناهى أمره، وأسكن الفردوس، وأهبط إلى الأرض- غير مستنكر أن يكون كان مقداره من سنيننا قدر خمس وثلاثين سنة","bs_tekst":"onakvi kakvi su i danas, onda njegovo mišljenje o tome nije daleko od ispravnog. Ako predaje učenih prethodnika govore da je Adem stvoren u posljednjem satu šestog dana, od dana u kojima jedan dan traje hiljadu naših godina, onda je poznato da jedan sat toga dana traje osamdeset tri naše godine. Već smo spomenuli da je Adem, nakon što je naš Gospodar, Silan i Uzvišen, umijesio njegovu glinu, ostao četrdeset godina prije nego što je u njega udahnuo duh. Nema sumnje da se time mislilo na naše godine. Zatim, od udahnuća duha u njega dok nije dovršeno njegovo stanje, nastanjen u Firdevsu i spušten na Zemlju, nije neobično da je prošlo trideset pet naših godina."},{"stranica":119,"ar_tekst":"فإن كان أراد أنه أسكن الفردوس لساعتين مضتا من نهار يوم الجمعة من الأيام التي مقدار اليوم الواحد منها ألف سنة من سنيننا، فقد قال غير الحق، وذلك أن جميع من حفظ له قول في ذلك من أهل العلم، فإنه كان يقول إن آدم نفخ فيه الروح في آخر النهار من يوم الجمعة قبل غروب الشمس من ذلك اليوم ثم الاخبار عن رسول الله ص متظاهرة بأن الله تبارك وتعالى أسكنه الجنة فيه، وفيه أهبطه إلى الأرض فإن كان ذلك صحيحا، فمعلوم أن آخر ساعة من نهار يوم من أيام الآخرة ومن الأيام التي اليوم الواحد منها مقداره ألف سنة من سنيننا، إنما هي ساعة بعد مضي إحدى عشرة ساعة، وذلك ساعة من اثنتي عشرة ساعة، وهي ثلاث وثمانون سنة وأربعة أشهر من سنيننا، فآدم صلوات الله عليه إذ كان الأمر كذلك، إنما خلق لمضي إحدى عشرة ساعة من نهار يوم الجمعة من الأيام التي اليوم الواحد منها ألف سنة من سنيننا، فمكث جسدا ملقى لم ينفخ فيه الروح أربعين عاما من أعوامنا ثم نفخ فيه الروح فكان مكثه في السماء بعد ذلك ومقامه في الجنة، إلى أن أصاب الخطيئة وأهبط إلى الأرض ثلاثا وأربعين سنة من سنيننا وأربعة أشهر، وذلك ساعة من ساعات يوم من الأيام الستة التي خلق الله تعالى فيها الخلق","bs_tekst":"Ako je, međutim, mislio da je nastanjen u Firdevsu nakon što su prošla dva dnevna sata petka od dana u kojima jedan dan traje hiljadu naših godina, onda nije rekao istinu. Svi učeni ljudi čije je mišljenje o tome sačuvano govorili su da je u Adema udahnut duh pri kraju dana petka, prije zalaska Sunca toga dana. Potom brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, međusobno potvrđuju da ga je Allah, Blagoslovljen i Uzvišen, toga dana nastanio u Džennetu i toga dana spustio na Zemlju. Ako je to tačno, onda je poznato da je posljednji dnevni sat jednoga od dana budućeg svijeta, dana u kojima jedan dan traje hiljadu naših godina, sat nakon što je već prošlo jedanaest sati: jedan od dvanaest sati. To su osamdeset tri godine i četiri mjeseca od naših godina. Ako je stvar tako stajala, Adem, neka su Allahovi blagoslovi na njemu, stvoren je nakon što je prošlo jedanaest dnevnih sati petka, od dana u kojima jedan dan traje hiljadu naših godina. Ostao je kao položeno tijelo, bez udahnutog duha, četrdeset naših godina. Zatim je u njega udahnut duh, pa je njegov boravak na nebu i u Džennetu, sve dok nije počinio grijeh i spušten na Zemlju, trajao četrdeset tri naše godine i četiri mjeseca. To je jedan od sati jednoga od šest dana u kojima je Uzvišeni Allah stvorio stvorenja. ⟦Napomena prevodioca: broj „trideset pet godina“ u prvom dijelu i kasniji proračun „četrdeset tri godine i četiri mjeseca“ preneseni su kako stoje u izvoru; nisu računskim putem usaglašavani.⟧"},{"stranica":120,"ar_tekst":"وَقَدْ حَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ سَعْدٍ، قَالَ:\nحَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أخبرني أبي، عن أبي صالح، عَنِ ابْنِ عَبَّاسٍ، قَالَ: خَرَجَ آدَمُ مِنَ الْجَنَّةِ بَيْنَ الصَّلاتَيْنِ: صَلاةِ الظُّهْرِ وَصَلاةِ الْعَصْرِ، فَأُنْزِلَ إِلَى الأَرْضِ وَكَانَ مُكْثُهُ فِي الْجَنَّةِ نصف يوم يوم من ايام الآخرة، وهو خمسمائة سَنَةٍ، مِنْ يَوْمٍ كَانَ مِقْدَارُهُ اثْنَتَيْ عَشْرَةَ سَاعَةً، وَالْيَوْمُ أَلْفُ سَنَةٍ مِمَّا يَعُدُّ أَهْلُ الدُّنْيَا، وَهَذَا أَيْضًا قَوْلٌ خِلافُ مَا وَرَدَتْ به الاخبار عن رسول الله ص، وَعَنِ السَّلَفِ مِنْ عُلَمَائِنَا.","bs_tekst":"Pričao mi je Haris ibn Muhammed, koji je rekao: pričao nam je Muhammed ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Adem je izašao iz Dženneta između dva namaza: podne-namaza i ikindije. Spušten je na Zemlju, a u Džennetu je boravio pola dana, jednog od dana budućeg svijeta. To je pet stotina godina, od dana koji traje dvanaest sati, a dan je hiljadu godina kakve stanovnici ovoga svijeta broje.“ I ovo mišljenje suprotno je onome što je došlo u predajama od Allahovog Poslanika, sallallahu alejhi ve sellem, i od učenih prethodnika među našim učenjacima."},{"stranica":121,"ar_tekst":"القول في الموضع الذي أهبط آدم وحواء إليه من الأرض حين أهبطا إليها","bs_tekst":"Rasprava o mjestu na Zemlji na koje su Adem i Havva spušteni kada su spušteni na nju"},{"stranica":121,"ar_tekst":"ثم إن الله عز وجل أهبط آدم قبل غروب الشمس من اليوم الذي خلقه فيه- وذلك يوم الجمعة- من السماء مع زوجته، وأنزل آدم- فيما قال علماء سلف أمة نبينا ص- بالهند.","bs_tekst":"Zatim je Allah, Silan i Uzvišen, prije zalaska Sunca onoga dana kada ga je stvorio — a to je bio petak — spustio Adema s neba zajedno s njegovom suprugom. Prema riječima učenih prethodnika iz ummeta našeg Vjerovjesnika, sallallahu alejhi ve sellem, Adema je spustio u Indiju."},{"stranica":121,"ar_tekst":"ذكر من حضرنا ذكره ممن قال ذلك منهم:","bs_tekst":"Spomen onih koji su to rekli, a kojih se sada sjećamo:"},{"stranica":121,"ar_tekst":"٢٢٠- حَدَّثَنَا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال:\n\nأخبرنا معمر، عن قتادة، قال: أهبط الله عز وجل آدم إلى الأرض، وكان مهبطه بأرض الهند.","bs_tekst":"220 — Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, koji je rekao: „Allah, Silan i Uzvišen, spustio je Adema na Zemlju, a njegovo mjesto spuštanja bilo je u zemlji Indiji.“"},{"stranica":121,"ar_tekst":"حَدَّثَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ: حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، قَالَ: أَخْبَرَنَا عَطَاءُ بْنُ السَّائِبِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: إِنَّ أَوَّلَ مَا أَهْبَطَ اللَّهُ تَعَالَى آدَمَ أهبطه بدهنا أَرْضِ الْهِنْدِ.","bs_tekst":"Pričao nam je Amr ibn Ali, koji je rekao: pričao nam je Imran ibn Ujejna, koji je rekao: obavijestio nas je Ata ibn es-Saib, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Kada je Uzvišeni Allah prvi put spustio Adema, spustio ga je u Dehnu, u zemlji Indiji.“ ⟦Napomena prevodioca: toponim je u izvoru zapisan بدهنا, bez oznaka koje bi sigurno odredile izgovor.⟧"},{"stranica":121,"ar_tekst":"حدثت عن عمار، قال: حَدَّثَنَا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أنس، عن أبي العالية، قال: أهبط آدم إلى الهند.","bs_tekst":"Preneseno mi je od Ammara, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, od Ebu Alije, koji je rekao: „Adem je spušten u Indiju.“"},{"stranica":121,"ar_tekst":"حَدَّثَنِي ابْنُ سِنَانٍ، قَالَ: حَدَّثَنَا الْحَجَّاجُ، قَالَ: حَدَّثَنَا حَمَّادُ بن سلمة، عن عَلِيُّ بْنُ زَيْدٍ، عَنْ يُوسُفَ بْنِ مِهْرَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\n[قال على بن ابى طالب ع: أَطْيَبُ أَرْضٍ فِي الأَرْضِ رِيحًا أَرْضُ الْهِنْدِ، أُهْبِطَ بِهَا آدَمُ، فَعَلِقَ شَجَرُهَا مِنْ رِيحِ الْجَنَّةِ] .","bs_tekst":"Pričao mi je Ibn Sinan, koji je rekao: pričao nam je Hadždžadž, koji je rekao: pričao nam je Hammad ibn Selema, od Alija ibn Zejda, od Jusufa ibn Mihrana, od Ibn Abbasa, koji je rekao: „Ali ibn Ebu Talib, alejhis-selam, rekao je: ‘Zemlja najljepšeg mirisa na Zemlji jeste Indija. U nju je spušten Adem, pa je njeno drveće upilo džennetski miris.’“"},{"stranica":121,"ar_tekst":"حَدَّثَنِي الْحَارِثُ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: حَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، عَنْ أَبِيهِ، عن أبي صالح، عن ابن عباس، قال: أُهْبِطَ آدَمُ بِالْهِنْدِ، وَحَوَّاءُ بِجِدَّةَ، فَجَاءَ فِي طَلَبِهَا حَتَّى اجْتَمَعَا، فَازْدَلَفَتْ إِلَيْهِ حَوَّاءُ، فَلِذَلِكَ","bs_tekst":"Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, od svoga oca, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Adem je spušten u Indiju, a Havva u Džiddu. Krenuo ju je tražiti, sve dok se nisu sastali. Havva mu se približila, pa je zato"},{"stranica":122,"ar_tekst":"سُمِّيَتِ الْمُزْدَلِفَةَ، وَتَعَارَفَا بِعَرَفَاتٍ، فَلِذَلِكَ سُمِّيَتْ عَرَفَاتٍ، وَاجْتَمَعَا بِجَمْعٍ فَلِذَلِكَ سُمِّيَتْ جَمْعًا قَالَ: وَأُهْبِطَ آدَمُ عَلَى جَبَلٍ بِالْهِنْدِ يُقَالُ لَهُ بُوذُ.","bs_tekst":"nazvana Muzdelifa. Prepoznali su se na Arefatu, pa je zato nazvan Arefatom. Sastali su se u Džem‘u, pa je zato nazvan Džem‘om.“ Rekao je: „Adem je spušten na planinu u Indiji koja se zove Buz.“ ⟦Napomena prevodioca: ime planine u izvoru glasi بوذ; izgovor je prenesen približno.⟧"},{"stranica":122,"ar_tekst":"حدثنا أبو همام، قال: حدثني أبي، قال: حَدَّثَنَا زِيَادُ بْنُ خَيْثَمَةَ، عَنْ أَبِي يَحْيَى بَائِعِ الْقَتِّ، قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبَّاسٍ أَنَّ آدَمَ نَزَلَ حِينَ نَزَلَ بِالْهِنْدِ.","bs_tekst":"Pričao nam je Ebu Hemmam, koji je rekao: pričao mi je moj otac, koji je rekao: pričao nam je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao nam je Abdullah ibn Abbas da je Adem, kada je spušten, spušten u Indiju.“"},{"stranica":122,"ar_tekst":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال: وأما أهل التوراة فإنهم قالوا: أهبط آدم بالهند على جبل يقال له واسم، عند وإذ يقال له بهيل بين الدهنج والمندل: بلدين بأرض الهند قالوا:\n\nوأهبطت حواء بجدة من أرض مكة.","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Sljedbenici Tevrata kazali su: Adem je spušten u Indiju, na planinu koja se zove Vasim, kod doline koja se naziva Behil, između Dehendža i Mendela, dvaju mjesta u zemlji Indiji. Rekli su: Havva je spuštena u Džiddu, u mekanskom kraju.“ ⟦Napomena prevodioca: imena واسم، بهيل، الدهنج، المندل prenesena su približno, jer nemaju sigurno označen izgovor. Izvor između prvih dvaju imena ima عند وإذ, što je nejasan zapis; „kod doline“ kontekstualno je čitanje koje treba provjeriti u štampanom izdanju.⟧"},{"stranica":122,"ar_tekst":"وقال آخرون: بل أهبط آدم بسرنديب، على جبل يدعى بوذ، وحواء بجدة من أرض مكة، وإبليس بميسان، والحية بأصبهان وقد قيل: أهبطت الحية بالبرية، وإبليس بساحل بحر الأيلة.","bs_tekst":"Drugi su rekli: „Naprotiv, Adem je spušten na Serendib, na planinu koja se zove Buz, Havva u Džiddu u mekanskom kraju, Iblis u Mejsan, a zmija u Isfahan.“ Rečeno je i da je zmija spuštena u pustinju, a Iblis na obalu mora Ejle."},{"stranica":122,"ar_tekst":"وهذا مما لا يوصل إلى علم صحته إلا بخبر يجيء مجيء الحجة، ولا يعلم خبر في ذلك ورد كذلك، غير ما ورد من خبر هبوط آدم بأرض الهند، فإن ذلك مما لا يدفع صحته علماء الإسلام وأهل التوراة والإنجيل، والحجة قد ثبتت بأخبار بعض هؤلاء وذكر أن الجبل الذي اهبط عليه آدم ع ذروته من أقرب ذرا جبال الأرض إلى السماء، وأن آدم حين أهبط عليه كانت رجلاه عليه ورأسه في السماء يسمع دعاء الملائكة وتسبيحهم، فكان آدم يأنس بذلك، وكانت","bs_tekst":"Ovo pripada onome čija se tačnost ne može spoznati osim predajom koja ima dokaznu snagu. Nije poznata takva predaja o tome, osim predaje o Ademovom spuštanju u Indiju. Njenu tačnost ne odbacuju islamski učenjaci niti sljedbenici Tevrata i Indžila, a dokaz je uspostavljen izvješćima nekih od njih. Navedeno je da je vrh planine na koju je Adem, alejhis-selam, spušten jedan od zemaljskih planinskih vrhova najbližih nebu. Kada je Adem spušten na nju, njegove su noge bile na njoj, a glava na nebu; čuo je dove i slavljenje meleka i to mu je pružalo prisnost. Meleki su ga se"},{"stranica":123,"ar_tekst":"الملائكة تهابه، فنقص من طول آدم لذلك.","bs_tekst":"bojali, pa je zbog toga Ademova visina smanjena."},{"stranica":123,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":123,"ar_tekst":"حَدَّثَنَا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا هشام بن حسان، عن سوار ختن عطاء، عن عطاء بن أبي رباح، قال: لما أهبط الله عز وجل آدم من الجنة كان رجلاه في الأرض، ورأسه في السماء، يسمع كلام أهل السماء ودعاءهم، يأنس إليهم، فهابته الملائكة حتى شكت إلى الله تعالى في دعائها وفي صلاتها، فخفضه الى الارض، فلما فقد ما كان يسمع منهم استوحش حتى شكا ذلك إلى الله عز وجل في دعائه وفي صلاته، فوجه إلى مكة فصار موضع قدمه قرية، وخطوته مفازة، حتى انتهى إلى مكة، وأنزل الله تعالى ياقوتة من ياقوت الجنة، فكانت على موضع البيت الآن، فلم يزل يطوف به حتى أنزل الله تعالى الطوفان، فرفعت تلك الياقوتة حتى بعث الله تعالى ابراهيم الخليل ع فبناه، فذلك قوله تعالى:\n«وَإِذْ بَوَّأْنا لِإِبْراهِيمَ مَكانَ الْبَيْتِ» .","bs_tekst":"Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Hišam ibn Hassan, od Sevvara, Ataovog zeta, od Ataa ibn Ebu Rebaha, koji je rekao: „Kada je Allah, Silan i Uzvišen, spustio Adema iz Dženneta, noge su mu bile na Zemlji, a glava na nebu. Slušao je govor stanovnika neba i njihove dove i osjećao prisnost prema njima. Meleki su ga se bojali toliko da su se Uzvišenom Allahu požalili u svojim dovama i namazima, pa ga je spustio na Zemlju. Kada više nije čuo ono što je od njih slušao, osjetio je osamljenost, pa se Allahu, Silnom i Uzvišenom, požalio u svojoj dovi i namazu. Usmjeren je prema Meki. Mjesto svakog njegovog stopala postalo je naselje, a prostor njegova koraka pustara, sve dok nije stigao u Meku. Uzvišeni Allah spustio je rubin od džennetskih rubina, pa je bio na mjestu na kojem je sada Hram. Neprestano ga je obilazio, sve dok Uzvišeni Allah nije poslao Potop. Tada je taj rubin podignut, sve dok Uzvišeni Allah nije poslao Ibrahima, prisnog prijatelja, alejhis-selam, pa ga je on izgradio. To su Njegove, Uzvišeni je On, riječi: ‘I kada smo Ibrahimu odredili mjesto Hrama.’“ ⟦Prijevod kur’anskog navoda: El-Hadždž, 22:26, navedeni dio.⟧"},{"stranica":123,"ar_tekst":"حدثنا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن قتادة، قال: وضع الله تعالى البيت مع آدم، فكان رأسه في السماء ورجلاه في الأرض، فكانت الملائكة تهابه، فنقص إلى ستين ذراعا، فحزن آدم إذ فقد أصوات الملائكة وتسبيحهم، فشكا ذلك إلى الله، فقال الله: يا آدم، إني أهبطت لك بيتا تطوف به كما يطاف حول عرشي، وتصلي عنده كما يصلى عند عرشي فانطلق اليه آدم ع، فخرج ومد له في خطوه، فكان بين كل خطوة مفازة، فلم تزل تلك المفاوز بعد ذلك، فاتى آدم ع البيت، فطاف به ومن بعده من الأنبياء","bs_tekst":"Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, koji je rekao: „Uzvišeni Allah postavio je Hram zajedno s Ademom. Njegova glava bila je na nebu, a noge na Zemlji. Meleki su ga se bojali, pa je smanjen na šezdeset lakata. Adem se rastužio kada više nije čuo glasove meleka i njihovo slavljenje, pa se požalio Allahu. Allah je rekao: ‘Ademe, spustio sam ti Hram koji ćeš obilaziti kao što se obilazi oko Moga Arša i kod kojeg ćeš klanjati kao što se klanja kod Moga Arša.’ Adem, alejhis-selam, krenuo je prema njemu. Izašao je, a njegov korak učinjen je dugim; između svaka dva koraka bila je pustara. Te su pustare ostale i poslije toga. Adem, alejhis-selam, došao je Hramu i obilazio ga, kao i vjerovjesnici poslije njega.“"},{"stranica":124,"ar_tekst":"حدثني الحارث، قال: حدثنا ابن سعد، قال: حَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أَخْبَرَنِي أَبِي، عن أبي صالح، عن ابن عباس، قال: لما حط من طول آدم ع إِلَى سِتِّينَ ذِرَاعًا أَنْشَأَ يَقُولُ: رَبِّ، كُنْتُ جَارَكَ فِي دَارِكَ، لَيْسَ لِي رَبٌّ غَيْرُكَ، وَلا رَقِيبٌ دُونَكَ، آكُلُ فِيهَا رَغَدًا، وَأَسْكُنُ حَيْثُ أَحْبَبْتُ، فَأَهْبَطْتَنِي إِلَى هَذَا الْجَبَلِ الْمُقَدَّسِ، فَكُنْتُ أَسْمَعُ أَصْوَاتَ الْمَلائِكَةِ، وَأَرَاهُمْ كَيْفَ يَحُفُّونَ بِعَرْشِكَ، وَأَجِدُ رِيحَ الْجَنَّةِ وَطِيبَهَا، ثُمَّ أَهْبَطْتَنِي إِلَى الأَرْضِ، وَحَطَطْتَنِي إِلَى سِتِّينَ ذِرَاعًا، فَقَدِ انْقَطَعَ عَنِّي الصَّوْتُ وَالنَّظَرُ، وَذَهَبَ عَنِّي رِيحَ الْجَنَّةِ فَأَجَابَهُ اللَّهُ عَزَّ وَجَلَّ: لِمَعْصِيَتِكَ يَا آدَمُ فَعَلْتُ ذَلِكَ بِكَ","bs_tekst":"Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Kada je Ademova, alejhis-selam, visina smanjena na šezdeset lakata, počeo je govoriti: ‘Gospodaru moj, bio sam Tvoj susjed u Tvome domu. Nisam imao drugog gospodara osim Tebe niti nadzornika mimo Tebe. Jeo sam u njemu obilno i nastanjivao se gdje sam želio. Spustio si me na ovu svetu planinu, pa sam slušao glasove meleka, gledao kako okružuju Tvoj Arš i osjećao džennetski miris i njegovu ljepotu. Zatim si me spustio na Zemlju i smanjio me na šezdeset lakata. Više ne čujem glasove i ne vidim ih, a džennetski miris nestao je od mene.’ Allah, Silan i Uzvišen, odgovorio mu je: ‘Zbog tvoje nepokornosti, Ademe, učinio sam ti to.’"},{"stranica":124,"ar_tekst":"فَلَمَّا رَأَى اللَّهُ تَعَالَى عُرْيَ آدَمَ وَحَوَّاءَ أَمَرَهُ أَنْ يَذْبَحَ كَبْشًا مِنَ الضَّأْنِ مِنَ الثَّمَانِيَةِ الأَزْوَاجِ الَّتِي أَنْزَلَ مِنَ الْجَنَّةِ، فَأَخَذَ كَبْشًا فَذَبَحَهُ، ثُمَّ أَخَذَ صُوفَهُ فَغَزَلَتْهُ حَوَّاءُ، وَنَسَجَهُ هُوَ وَحَوَّاءُ، فَنَسَجَ آدَمُ جُبَّةً لِنَفْسِهِ، وَجَعَلَ لِحَوَّاءَ دِرْعًا وخمارا، فلبسا ذلك، واوحى اللَّهُ تَعَالَى إِلَى آدَمَ أَنْ لِي حَرَمًا بِحِيَالِ عَرْشِي، فَانْطَلِقْ فَابْنِ لِي فِيهِ بَيْتًا، ثم حف به كما رايت ملائكى يَحُفُّونَ بِعَرْشِي، فَهُنَالِكَ أَسْتَجِيبُ لَكَ وَلِوَلَدِكَ، مَنْ كَانَ مِنْهُمْ فِي طَاعَتِي، فَقَالَ آدَمُ: أَيْ رَبِّ، فَكَيْفَ لِي بِذَلِكَ، لَسْتُ أَقْوَى عَلَيْهِ وَلا أَهْتَدِي لَهُ! فَقَيَّضَ اللَّهُ لَهُ مَلَكًا، فَانْطَلَقَ بِهِ نَحْوَ مَكَّةَ، فَكَانَ آدَمُ إِذَا مَرَّ بِرَوْضَةٍ وَمَكَانٍ يُعْجِبُهُ قَالَ لِلْمَلَكِ: انْزِلْ بنا هاهنا، فَيَقُولُ لَهُ الْمَلَكُ: مَكَانَكَ، حَتَّى قَدِمَ مَكَّةَ، فَكَانَ كُلُّ مَكَانٍ نَزَلَ بِهِ صَارَ عُمْرَانًا، وَكُلُّ مَكَانٍ تَعَدَّاهُ صَارَ مَفَاوِزَ وَقِفَارًا، فَبَنَى الْبَيْتَ مِنْ خَمْسَةِ أَجْبُلٍ: مِنْ طُورِ سَيْنَاءَ وَطُورِ زَيْتُونٍ وَلِبْنَانَ وَالْجُودِيِّ، وَبَنَى قَوَاعِدَهُ مِنْ حِرَاءَ، فَلَمَّا فَرَغَ مِنْ بِنَائِهِ خَرَجَ بِهِ الْمَلَكُ إِلَى عَرَفَاتٍ، فَأَرَاهُ الْمَنَاسِكَ كُلَّهَا الَّتِي تَفْعَلُهَا النَّاسُ الْيَوْمَ، ثُمَّ قَدِمَ بِهِ مَكَّةَ، فَطَافَ بِالْبَيْتِ أُسْبُوعًا، ثُمَّ رَجَعَ إِلَى أَرْضِ الْهِنْدِ، فَمَاتَ عَلَى بُوذَ","bs_tekst":"Kada je Uzvišeni Allah vidio Ademovu i Havvinu golotinju, naredio mu je da zakolje ovna među ovcama iz osam parova koje je spustio iz Dženneta. Uzeo je ovna i zaklao ga, zatim uzeo njegovu vunu. Havva ju je isprela, a on i Havva istkali su je. Adem je sebi istkao džubu, a Havvi načinio haljinu i pokrivalo za glavu. To su obukli. Uzvišeni Allah objavio je Ademu: ‘Imam sveti prostor naspram Svoga Arša. Idi i izgradi Mi u njemu Hram. Zatim ga obilazi kao što si vidio Moje meleke kako okružuju Moj Arš. Tamo ću se odazivati tebi i onima od tvojih potomaka koji Mi budu pokorni.’ Adem je rekao: ‘Gospodaru moj, kako da to učinim? Nemam snage za to niti znam put do toga!’ Allah mu je dodijelio meleka koji je s njim krenuo prema Meki. Kada bi Adem prošao pored vrta ili mjesta koje bi mu se svidjelo, rekao bi meleku: ‘Spusti nas ovdje.’ Melek bi mu govorio: ‘Ostani na svome mjestu’, sve dok nije stigao u Meku. Svako mjesto na kojem se zaustavio postalo je nastanjeno, a svako koje je prošao postalo je pustara i golet. Hram je izgradio od pet planina: od Turi-Sinaa, Turi-Zejtuna, Libana i Džudijja, a temelje mu je izgradio od Hire. Kada je završio gradnju, melek je s njim otišao na Arefat i pokazao mu sve obrede koje ljudi danas obavljaju. Potom ga je doveo u Meku, pa je sedam puta obišao Hram. Zatim se vratio u Indiju i umro na Buzu.“"},{"stranica":125,"ar_tekst":"حدثنا أبو همام، قال: حدثني أبي، قال: حدثني زياد بن خيثمة، عن أبي يحيى بَائِعِ الْقَتِّ، قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حدثنى عبد الله ابن عباس ان آدم ع نَزَلَ حِينَ نَزَلَ بِالْهِنْدِ، وَلَقَدْ حَجَّ مِنْهَا أَرْبَعِينَ حِجَّةً عَلَى رِجْلَيْهِ، فَقُلْتُ لَهُ: يَا أَبَا الْحَجَّاجِ، أَلا كَانَ يَرْكَبُ؟ قَالَ: فَأَيُّ شيء كان يحمله! فو الله إِنَّ خَطْوَهُ مَسِيرَةُ ثَلاثَةِ أَيَّامٍ، وَإِنْ كَانَ رَأْسُهُ لَيَبْلُغُ السَّمَاءَ، فَاشْتَكَتِ الْمَلائِكَةُ نَفَسَهُ، فَهَمَزَهُ الرَّحْمَنُ هَمْزَةً، فَتَطَأْطَأَ مِقْدَارَ أَرْبَعِينَ سَنَةً.","bs_tekst":"Pričao nam je Ebu Hemmam, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao mi je Abdullah ibn Abbas da je Adem, alejhis-selam, kada je spušten, spušten u Indiju. Odatle je četrdeset puta pješice obavio hadž.“ Upitao sam ga: „Ebu Hadždžadže, zar nije mogao jahati?“ Odgovorio je: „A šta bi ga moglo nositi! Tako mi Allaha, njegov je korak bio tri dana puta, a glava mu je dosezala nebo. Meleki su se požalili na njegov dah, pa ga je Milostivi jednim pritiskom pritisnuo i on se spustio za mjeru četrdeset godina.“ ⟦Napomena prevodioca: izraz مقدار أربعين سنة („mjera četrdeset godina“) sačuvan je kao u izvoru; nije pretvoren u pretpostavljenu mjeru visine.⟧"},{"stranica":125,"ar_tekst":"حَدَّثَنِي صَالِحُ بْنُ حَرْبٍ أَبُو مَعْمَرٍ مَوْلَى بَنِي هَاشِمٍ، قَالَ: حَدَّثَنَا ثُمَامَةُ بْنُ عُبَيْدَةَ السُّلَمِيُّ، قَالَ: أَخْبَرَنَا أَبُو الزُّبَيْرِ، قَالَ: قَالَ نَافِعٌ:\n\nسَمِعْتُ ابْنَ عُمَرَ، يَقُولُ: إِنَّ اللَّهَ تَعَالَى اوحى الى آدم ع وَهُوَ بِبِلادِ الْهِنْدِ:\nأَنْ حُجَّ هَذَا الْبَيْتَ فَحَجَّ آدَمُ مِنْ بِلادِ الْهِنْدِ، فَكَانَ كُلَّمَا وَضَعَ قَدَمَهُ صَارَ قَرْيَةً، وَمَا بَيْنَ خُطْوَتَيْهِ مَفَازَةً، حَتَّى انْتَهَى إِلَى الْبَيْتِ فَطَافَ بِهِ، وَقَضَى الْمَنَاسِكَ كُلَّهَا، ثُمَّ أَرَادَ الرُّجُوعَ إِلَى بِلادِ الْهِنْدِ فَمَضَى، حَتَّى إِذَا كَانَ بِمَأْزِمَيْ عَرَفَاتٍ، تَلَقَّتْهُ الْمَلائِكَةُ، فَقَالُوا: بِرَّ حَجَّكَ يَا آدَمُ! فَدَخَلَهُ مِنْ ذَلِكَ عُجْبٌ، فَلَمَّا رَأَتِ الْمَلائِكَةُ ذَلِكَ مِنْهُ قَالُوا: يَا آدَمُ، إِنَّا قَدْ حَجَجْنَا هَذَا الْبَيْتَ قَبْلَ أَنْ تُخْلَقَ بِأَلْفَيْ سَنَةٍ، قَالَ: فَتَقَاصَرَتْ إِلَى آدَمَ نَفْسُهُ.","bs_tekst":"Pričao mi je Salih ibn Harb Ebu Ma‘mer, oslobođenik Benu Hašima, koji je rekao: pričao nam je Sumama ibn Ubejda es-Sulemi, koji je rekao: obavijestio nas je Ebu Zubejr, koji je rekao: Nafi‘ je rekao: čuo sam Ibn Omera kako govori: „Uzvišeni Allah objavio je Ademu, alejhis-selam, dok je bio u Indiji: ‘Obavi hadž ovome Hramu.’ Adem je iz Indije krenuo na hadž. Gdje god bi spustio stopalo, nastalo bi naselje, a između njegova dva koraka bila je pustara, sve dok nije stigao do Hrama. Obišao ga je i izvršio sve obrede, a zatim se htio vratiti u Indiju. Krenuo je i, kada je bio kod dvaju klanaca Arefata, sreli su ga meleki i rekli: ‘Neka ti hadž bude primljen, Ademe!’ To je u njemu izazvalo samodopadnost. Kada su meleki to kod njega vidjeli, rekli su: ‘Ademe, mi smo obavljali hadž ovome Hramu dvije hiljade godina prije nego što si stvoren.’“ Rekao je: „Tada se Adem u sebi osjetio malenim.“"},{"stranica":125,"ar_tekst":"وذكر ان آدم ع أُهْبِطَ إِلَى الأَرْضِ، وَعَلَى رَأْسِهِ إِكْلِيلٌ مِنْ شَجَرِ الْجَنَّةِ، فَلَمَّا صَارَ إِلَى الأَرْضِ، وَيَبِسَ الإِكْلِيلُ، تَحَاتَّ وَرَقُهُ فَنَبَتَ مِنْهُ أَنْوَاعُ الطِّيبِ.","bs_tekst":"Navedeno je da je Adem, alejhis-selam, spušten na Zemlju s vijencem od džennetskog drveća na glavi. Kada je stigao na Zemlju i vijenac se osušio, njegovo je lišće opalo, pa su iz njega nikle različite vrste mirisnog bilja."},{"stranica":125,"ar_tekst":"وَقَالَ بَعْضُهُمْ: بَلْ كَانَ ذَلِكَ مَا أَخْبَرَ اللَّهُ عَنْهُمَا، أَنَّهُمَا جَعَلا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ، فَلَمَّا يَبِسَ ذَلِكَ الْوَرَقُ الَّذِي خَصَفَاهُ عَلَيْهِمَا تَحَاتَّ فَنَبَتَ مِنْ ذَلِكَ الْوَرَقِ انواع الطيب والله اعلم","bs_tekst":"Neki su rekli: „Naprotiv, to je bilo ono o čemu ih Allah obavještava: počeli su po sebi spajati džennetsko lišće. Kada se lišće kojim su se pokrili osušilo i opalo, iz njega su nikle različite vrste mirisnog bilja.“ A Allah najbolje zna."},{"stranica":126,"ar_tekst":"وقال آخرون: بل لَمَّا عَلِمَ آدَمُ أَنَّ اللَّهَ عَزَّ وَجَلَّ مُهْبِطُهُ إِلَى الأَرْضِ، جَعَلَ لا يَمُرُّ بِشَجَرَةٍ مِنْ شَجَرِ الْجَنَّةِ إِلَّا أَخَذَ غُصْنًا مِنْ أَغْصَانِهَا، فَهَبَطَ إِلَى الأَرْضِ وَتِلْكَ الأَغْصَانُ مَعَهُ، فَلَمَّا يَبِسَ وَرَقُهَا تَحَاتَّ، فَكَانَ ذَلِكَ أَصْلُ الطِّيبِ.","bs_tekst":"Drugi su rekli: „Naprotiv, kada je Adem saznao da će ga Allah, Silan i Uzvišen, spustiti na Zemlju, nije prolazio pored ijednog džennetskog drveta a da nije uzeo jednu njegovu granu. Spustio se na Zemlju noseći te grane sa sobom. Kada se njihovo lišće osušilo i opalo, ono je postalo porijeklo mirisnog bilja.“"},{"stranica":126,"ar_tekst":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_tekst":"Spomen onih koji su to rekli:"},{"stranica":126,"ar_tekst":"٢٣٢- حَدَّثَنَا أَبُو هَمَّامٍ، قَالَ: حَدَّثَنَا أَبِي، قَالَ: حَدَّثَنَا زِيَادُ بن خيثمة، عن أبي يحيى بائع القت قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حَدَّثَنِي عَبْدُ الله ابن عَبَّاسٍ، أَنَّ آدَمَ حِينَ خَرَجَ مِنَ الْجَنَّةِ كَانَ لا يَمُرُّ بِشَيْءٍ إِلا عَبَثَ بِهِ، فَقِيلَ لِلْمَلائِكَةِ: دَعُوهُ فَلْيَتَزَوَّدْ مِنْهَا مَا شَاءَ، فَنَزَلَ حِينَ نَزَلَ بِالْهِنْدِ، وَإِنَّ هَذَا الطِّيبَ الَّذِي يُجَاءُ بِهِ مِنَ الْهِنْدِ مِمَّا خَرَجَ بِهِ آدَمُ مِنَ الْجَنَّةِ","bs_tekst":"232 — Pričao nam je Ebu Hemmam, koji je rekao: pričao nam je moj otac, koji je rekao: pričao nam je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao mi je Abdullah ibn Abbas da Adem, kada je izlazio iz Dženneta, nije prolazio pored nečega a da to nije dodirivao i po tome prebirao. Melekima je rečeno: ‘Pustite ga neka se iz njega opskrbi čime god želi.’ Kada je spušten, spušten je u Indiju. Ovi mirisi koji se donose iz Indije pripadaju onome što je Adem iznio sa sobom iz Dženneta.“"},{"stranica":126,"ar_tekst":"ذكر من قال: كان على راس آدم ع حين أهبط من الجنة إكليل من شجر الجنة:","bs_tekst":"Spomen onih koji su rekli da je Adem, alejhis-selam, kada je spušten iz Dženneta, na glavi imao vijenac od džennetskog drveća:"},{"stranica":126,"ar_tekst":"حدثت عن عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أنس، عن أبي العالية، قال: خرج آدم من الجنة، فخرج منها ومعه عصا من شجر الجنة، وعلى رأسه تاج أو إكليل من شجر الجنة، قال: فأهبط إلى الهند، ومنه كل طيب بالهند.","bs_tekst":"Preneseno mi je od Ammara ibn el-Hasena, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, od Ebu Alije, koji je rekao: „Adem je izašao iz Dženneta noseći štap od džennetskog drveta, a na glavi krunu ili vijenac od džennetskog drveća.“ Rekao je: „Spušten je u Indiju i od njega potječe sve mirisno u Indiji.“"},{"stranica":126,"ar_tekst":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال:\n\nهبط آدم عليه- يعني على الجبل الذي هبط عليه- ومعه ورق من ورق الجنة، فبثه في ذلك الجبل، فمنه كان أصل الطيب كله، وكل فاكهة لا توجد إلا بأرض الهند","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Adem se spustio na nju“ — misli na planinu na koju se spustio — „noseći džennetsko lišće. Rasuo ga je po toj planini, pa od njega potječu sve mirisne tvari i svaki plod koji se nalazi samo u Indiji.“"},{"stranica":127,"ar_tekst":"وقال آخرون: بل زوده الله من ثمار الجنة، فثمارنا هذه من تلك الثمار ذِكْرُ من قال ذلك:","bs_tekst":"Drugi su rekli: „Naprotiv, Allah ga je opskrbio džennetskim plodovima, pa su ovi naši plodovi od tih plodova.“ Spomen onih koji su to rekli:"},{"stranica":127,"ar_tekst":"حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ وعبد الوهاب ومحمد بن جعفر، عن عوف، عن قسامة بن زهير، عن الأشعري، قال:\nإن الله تبارك وتعالى لما اخرج آدم من الجنة زوده من ثمار الجنة، وعلمه صنعة كل شيء، فثماركم هذه من ثمار الجنة، غير أن هذه تتغير وتلك لا تتغير.","bs_tekst":"Pričao nam je Ibn Beššar, koji je rekao: pričali su nam Ibn Ebu Adijj, Abdulvehhab i Muhammed ibn Džafer, od Avfa, od Kasame ibn Zuhejra, od Eš‘arija, koji je rekao: „Kada je Allah, Blagoslovljen i Uzvišen, izveo Adema iz Dženneta, opskrbio ga je džennetskim plodovima i poučio ga izradi svega. Ovi vaši plodovi od džennetskih su plodova, osim što se ovi mijenjaju, a oni se ne mijenjaju.“"},{"stranica":127,"ar_tekst":"وقال آخرون: إنما علق بأشجار الهند طيب ريح آدم ع.","bs_tekst":"Drugi su rekli: „Miris Ademov, alejhis-selam, jednostavno se primio na indijskom drveću.“"},{"stranica":127,"ar_tekst":"ذكر من قال إنما صار الطيب بالهند لأن آدم حين أهبط إليها علق بأشجارها طيب ريحه:","bs_tekst":"Spomen onih koji su rekli da su mirisi u Indiji nastali zato što se, kada je Adem u nju spušten, njegov lijepi miris primio na njenom drveću:"},{"stranica":127,"ar_tekst":"حَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنَا هِشَامُ بْنُ محمد، قال: أخبرني أبي، عن أبي صالح، عن ابن عباس، قال: نزل آدم ع مَعَهُ رِيحُ الْجَنَّةِ، فَعَلِقَ بِشَجَرِهَا وَأَوْدِيَتِهَا وَامْتَلأَ ما هنالك طِيبًا، فَمِنْ ثَمَّ يُؤْتَى بِالطِّيبِ مِنْ رِيحِ الْجَنَّةِ.","bs_tekst":"Pričao mi je Haris ibn Muhammed, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio nas je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Adem, alejhis-selam, spustio se noseći džennetski miris. On se primio na njenom drveću i dolinama, pa se sve tamo ispunilo lijepim mirisom. Zato se odatle donose mirisi koji potječu od džennetskog mirisa.“"},{"stranica":127,"ar_tekst":"وَقَالُوا: أُنْزِلَ مَعَهُ مِنْ طِيبِ الْجَنَّةِ.","bs_tekst":"Rekli su: „S njim je spušteno i nešto od džennetskih mirisa.“"},{"stranica":127,"ar_tekst":"وَقَالَ: أُنْزِلَ مَعَهُ الْحَجَرُ الأَسْوَدُ، وَكَانَ أَشَدَّ بَيَاضًا مِنَ الثَّلْجِ، وَعَصَا مُوسَى، وَكَانَتْ مِنْ آسِ الْجَنَّةِ، طُولُهَا عَشَرَةُ أَذْرُعٍ عَلَى طُولِ مُوسَى، ومر ولبان، ثُمَّ أُنْزِلَ عَلَيْهِ بَعْدَ ذَلِكَ العَلاةُ وَالمِطْرَقَةُ وَالْكَلْبَتَانِ، فَنَظَرَ آدَمُ","bs_tekst":"Rekao je: „S njim je spušten Crni kamen, koji je bio bjelji od snijega, i Musaov štap, koji je bio od džennetske mirte, dug deset lakata, prema Musaovoj visini, te mirra i tamjan. Zatim su mu poslije toga spušteni nakovanj, čekić i kliješta. Kada je spušten na planinu, Adem je pogledao"}]</script><script>if(parent!==window){parent.postMessage({type:'ri-taberi-part',payload:JSON.parse(document.getElementById('partData').textContent),database:JSON.parse(document.getElementById('databaseData').textContent)},'*');}</script></body></html>
