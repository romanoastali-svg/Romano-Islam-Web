lili u svojim dovama i namazima, pa ga je spustio na Zemlju. Kada više nije čuo ono što je od njih slušao, osjetio je osamljenost, pa se Allahu, Silnom i Uzvišenom, požalio u svojoj dovi i namazu. Usmjeren je prema Meki. Mjesto svakog njegovog stopala postalo je naselje, a prostor njegova koraka pustara, sve dok nije stigao u Meku. Uzvišeni Allah spustio je rubin od džennetskih rubina, pa je bio na mjestu na kojem je sada Hram. Neprestano ga je obilazio, sve dok Uzvišeni Allah nije poslao Potop. Tada je taj rubin podignut, sve dok Uzvišeni Allah nije poslao Ibrahima, prisnog prijatelja, alejhis-selam, pa ga je on izgradio. To su Njegove, Uzvišeni je On, riječi: ‘I kada smo Ibrahimu odredili mjesto Hrama.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Hadždž, 22:26, navedeni dio.⟧\u003c/span>"},{"id":"123.4","ar":"حدثنا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن قتادة، قال: وضع الله تعالى البيت مع آدم، فكان رأسه في السماء ورجلاه في الأرض، فكانت الملائكة تهابه، فنقص إلى ستين ذراعا، فحزن آدم إذ فقد أصوات الملائكة وتسبيحهم، فشكا ذلك إلى الله، فقال الله: يا آدم، إني أهبطت لك بيتا تطوف به كما يطاف حول عرشي، وتصلي عنده كما يصلى عند عرشي فانطلق اليه آدم ع، فخرج ومد له في خطوه، فكان بين كل خطوة مفازة، فلم تزل تلك المفاوز بعد ذلك، فاتى آدم ع البيت، فطاف به ومن بعده من الأنبياء","bs":"Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, koji je rekao: „Uzvišeni Allah postavio je Hram zajedno s Ademom. Njegova glava bila je na nebu, a noge na Zemlji. Meleki su ga se bojali, pa je smanjen na šezdeset lakata. Adem se rastužio kada više nije čuo glasove meleka i njihovo slavljenje, pa se požalio Allahu. Allah je rekao: ‘Ademe, spustio sam ti Hram koji ćeš obilaziti kao što se obilazi oko Moga Arša i kod kojeg ćeš klanjati kao što se klanja kod Moga Arša.’ Adem, alejhis-selam, krenuo je prema njemu. Izašao je, a njegov korak učinjen je dugim; između svaka dva koraka bila je pustara. Te su pustare ostale i poslije toga. Adem, alejhis-selam, došao je Hramu i obilazio ga, kao i vjerovjesnici poslije njega.“","ar_ranges":[[0,78]],"ar_html":"\u003cspan class=\"isnad\">حدثنا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن قتادة، قال: \u003c/span>وضع الله تعالى البيت مع آدم، فكان رأسه في السماء ورجلاه في الأرض، فكانت الملائكة تهابه، فنقص إلى ستين ذراعا، فحزن آدم إذ فقد أصوات الملائكة وتسبيحهم، فشكا ذلك إلى الله، فقال الله: يا آدم، إني أهبطت لك بيتا تطوف به كما يطاف حول عرشي، وتصلي عنده كما يصلى عند عرشي فانطلق اليه آدم ع، فخرج ومد له في خطوه، فكان بين كل خطوة مفازة، فلم تزل تلك المفاوز بعد ذلك، فاتى آدم ع البيت، فطاف به ومن بعده من الأنبياء","bs_ranges":[[0,146]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, koji je rekao: \u003c/span>„Uzvišeni Allah postavio je Hram zajedno s Ademom. Njegova glava bila je na nebu, a noge na Zemlji. Meleki su ga se bojali, pa je smanjen na šezdeset lakata. Adem se rastužio kada više nije čuo glasove meleka i njihovo slavljenje, pa se požalio Allahu. Allah je rekao: ‘Ademe, spustio sam ti Hram koji ćeš obilaziti kao što se obilazi oko Moga Arša i kod kojeg ćeš klanjati kao što se klanja kod Moga Arša.’ Adem, alejhis-selam, krenuo je prema njemu. Izašao je, a njegov korak učinjen je dugim; između svaka dva koraka bila je pustara. Te su pustare ostale i poslije toga. Adem, alejhis-selam, došao je Hramu i obilazio ga, kao i vjerovjesnici poslije njega.“"}],"notes":[]},{"n":124,"ar":"حدثني الحارث، قال: حدثنا ابن سعد، قال: حَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أَخْبَرَنِي أَبِي، عن أبي صالح، عن ابن عباس، قال: لما حط من طول آدم ع إِلَى سِتِّينَ ذِرَاعًا أَنْشَأَ يَقُولُ: رَبِّ، كُنْتُ جَارَكَ فِي دَارِكَ، لَيْسَ لِي رَبٌّ غَيْرُكَ، وَلا رَقِيبٌ دُونَكَ، آكُلُ فِيهَا رَغَدًا، وَأَسْكُنُ حَيْثُ أَحْبَبْتُ، فَأَهْبَطْتَنِي إِلَى هَذَا الْجَبَلِ الْمُقَدَّسِ، فَكُنْتُ أَسْمَعُ أَصْوَاتَ الْمَلائِكَةِ، وَأَرَاهُمْ كَيْفَ يَحُفُّونَ بِعَرْشِكَ، وَأَجِدُ رِيحَ الْجَنَّةِ وَطِيبَهَا، ثُمَّ أَهْبَطْتَنِي إِلَى الأَرْضِ، وَحَطَطْتَنِي إِلَى سِتِّينَ ذِرَاعًا، فَقَدِ انْقَطَعَ عَنِّي الصَّوْتُ وَالنَّظَرُ، وَذَهَبَ عَنِّي رِيحَ الْجَنَّةِ فَأَجَابَهُ اللَّهُ عَزَّ وَجَلَّ: لِمَعْصِيَتِكَ يَا آدَمُ فَعَلْتُ ذَلِكَ بِكَ فَلَمَّا رَأَى اللَّهُ تَعَالَى عُرْيَ آدَمَ وَحَوَّاءَ أَمَرَهُ أَنْ يَذْبَحَ كَبْشًا مِنَ الضَّأْنِ مِنَ الثَّمَانِيَةِ الأَزْوَاجِ الَّتِي أَنْزَلَ مِنَ الْجَنَّةِ، فَأَخَذَ كَبْشًا فَذَبَحَهُ، ثُمَّ أَخَذَ صُوفَهُ فَغَزَلَتْهُ حَوَّاءُ، وَنَسَجَهُ هُوَ وَحَوَّاءُ، فَنَسَجَ آدَمُ جُبَّةً لِنَفْسِهِ، وَجَعَلَ لِحَوَّاءَ دِرْعًا وخمارا، فلبسا ذلك، واوحى اللَّهُ تَعَالَى إِلَى آدَمَ أَنْ لِي حَرَمًا بِحِيَالِ عَرْشِي، فَانْطَلِقْ فَابْنِ لِي فِيهِ بَيْتًا، ثم حف به كما رايت ملائكى يَحُفُّونَ بِعَرْشِي، فَهُنَالِكَ أَسْتَجِيبُ لَكَ وَلِوَلَدِكَ، مَنْ كَانَ مِنْهُمْ فِي طَاعَتِي، فَقَالَ آدَمُ: أَيْ رَبِّ، فَكَيْفَ لِي بِذَلِكَ، لَسْتُ أَقْوَى عَلَيْهِ وَلا أَهْتَدِي لَهُ! فَقَيَّضَ اللَّهُ لَهُ مَلَكًا، فَانْطَلَقَ بِهِ نَحْوَ مَكَّةَ، فَكَانَ آدَمُ إِذَا مَرَّ بِرَوْضَةٍ وَمَكَانٍ يُعْجِبُهُ قَالَ لِلْمَلَكِ: انْزِلْ بنا هاهنا، فَيَقُولُ لَهُ الْمَلَكُ: مَكَانَكَ، حَتَّى قَدِمَ مَكَّةَ، فَكَانَ كُلُّ مَكَانٍ نَزَلَ بِهِ صَارَ عُمْرَانًا، وَكُلُّ مَكَانٍ تَعَدَّاهُ صَارَ مَفَاوِزَ وَقِفَارًا، فَبَنَى الْبَيْتَ مِنْ خَمْسَةِ أَجْبُلٍ: مِنْ طُورِ سَيْنَاءَ وَطُورِ زَيْتُونٍ وَلِبْنَانَ وَالْجُودِيِّ، وَبَنَى قَوَاعِدَهُ مِنْ حِرَاءَ، فَلَمَّا فَرَغَ مِنْ بِنَائِهِ خَرَجَ بِهِ الْمَلَكُ إِلَى عَرَفَاتٍ، فَأَرَاهُ الْمَنَاسِكَ كُلَّهَا الَّتِي تَفْعَلُهَا النَّاسُ الْيَوْمَ، ثُمَّ قَدِمَ بِهِ مَكَّةَ، فَطَافَ بِالْبَيْتِ أُسْبُوعًا، ثُمَّ رَجَعَ إِلَى أَرْضِ الْهِنْدِ، فَمَاتَ عَلَى بُوذَ","bs":"\u003cp data-paragraph=\"124.1\">Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Kada je Ademova, alejhis-selam, visina smanjena na šezdeset lakata, počeo je govoriti: ‘Gospodaru moj, bio sam Tvoj susjed u Tvome domu. Nisam imao drugog gospodara osim Tebe niti nadzornika mimo Tebe. Jeo sam u njemu obilno i nastanjivao se gdje sam želio. Spustio si me na ovu svetu planinu, pa sam slušao glasove meleka, gledao kako okružuju Tvoj Arš i osjećao džennetski miris i njegovu ljepotu. Zatim si me spustio na Zemlju i smanjio me na šezdeset lakata. Više ne čujem glasove i ne vidim ih, a džennetski miris nestao je od mene.’ Allah, Silan i Uzvišen, odgovorio mu je: ‘Zbog tvoje nepokornosti, Ademe, učinio sam ti to.’\u003c/p>\u003cp data-paragraph=\"124.2\">Kada je Uzvišeni Allah vidio Ademovu i Havvinu golotinju, naredio mu je da zakolje ovna među ovcama iz osam parova koje je spustio iz Dženneta. Uzeo je ovna i zaklao ga, zatim uzeo njegovu vunu. Havva ju je isprela, a on i Havva istkali su je. Adem je sebi istkao džubu, a Havvi načinio haljinu i pokrivalo za glavu. To su obukli. Uzvišeni Allah objavio je Ademu: ‘Imam sveti prostor naspram Svoga Arša. Idi i izgradi Mi u njemu Hram. Zatim ga obilazi kao što si vidio Moje meleke kako okružuju Moj Arš. Tamo ću se odazivati tebi i onima od tvojih potomaka koji Mi budu pokorni.’ Adem je rekao: ‘Gospodaru moj, kako da to učinim? Nemam snage za to niti znam put do toga!’ Allah mu je dodijelio meleka koji je s njim krenuo prema Meki. Kada bi Adem prošao pored vrta ili mjesta koje bi mu se svidjelo, rekao bi meleku: ‘Spusti nas ovdje.’ Melek bi mu govorio: ‘Ostani na svome mjestu’, sve dok nije stigao u Meku. Svako mjesto na kojem se zaustavio postalo je nastanjeno, a svako koje je prošao postalo je pustara i golet. Hram je izgradio od pet planina: od Turi-Sinaa, Turi-Zejtuna, Libana i Džudijja, a temelje mu je izgradio od Hire. Kada je završio gradnju, melek je s njim otišao na Arefat i pokazao mu sve obrede koje ljudi danas obavljaju. Potom ga je doveo u Meku, pa je sedam puta obišao Hram. Zatim se vratio u Indiju i umro na Buzu.“\u003c/p>","paragraphs":[{"id":"124.1","ar":"حدثني الحارث، قال: حدثنا ابن سعد، قال: حَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أَخْبَرَنِي أَبِي، عن أبي صالح، عن ابن عباس، قال: لما حط من طول آدم ع إِلَى سِتِّينَ ذِرَاعًا أَنْشَأَ يَقُولُ: رَبِّ، كُنْتُ جَارَكَ فِي دَارِكَ، لَيْسَ لِي رَبٌّ غَيْرُكَ، وَلا رَقِيبٌ دُونَكَ، آكُلُ فِيهَا رَغَدًا، وَأَسْكُنُ حَيْثُ أَحْبَبْتُ، فَأَهْبَطْتَنِي إِلَى هَذَا الْجَبَلِ الْمُقَدَّسِ، فَكُنْتُ أَسْمَعُ أَصْوَاتَ الْمَلائِكَةِ، وَأَرَاهُمْ كَيْفَ يَحُفُّونَ بِعَرْشِكَ، وَأَجِدُ رِيحَ الْجَنَّةِ وَطِيبَهَا، ثُمَّ أَهْبَطْتَنِي إِلَى الأَرْضِ، وَحَطَطْتَنِي إِلَى سِتِّينَ ذِرَاعًا، فَقَدِ انْقَطَعَ عَنِّي الصَّوْتُ وَالنَّظَرُ، وَذَهَبَ عَنِّي رِيحَ الْجَنَّةِ فَأَجَابَهُ اللَّهُ عَزَّ وَجَلَّ: لِمَعْصِيَتِكَ يَا آدَمُ فَعَلْتُ ذَلِكَ بِكَ","bs":"Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Kada je Ademova, alejhis-selam, visina smanjena na šezdeset lakata, počeo je govoriti: ‘Gospodaru moj, bio sam Tvoj susjed u Tvome domu. Nisam imao drugog gospodara osim Tebe niti nadzornika mimo Tebe. Jeo sam u njemu obilno i nastanjivao se gdje sam želio. Spustio si me na ovu svetu planinu, pa sam slušao glasove meleka, gledao kako okružuju Tvoj Arš i osjećao džennetski miris i njegovu ljepotu. Zatim si me spustio na Zemlju i smanjio me na šezdeset lakata. Više ne čujem glasove i ne vidim ih, a džennetski miris nestao je od mene.’ Allah, Silan i Uzvišen, odgovorio mu je: ‘Zbog tvoje nepokornosti, Ademe, učinio sam ti to.’","ar_ranges":[[0,131]],"ar_html":"\u003cspan class=\"isnad\">حدثني الحارث، قال: حدثنا ابن سعد، قال: حَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أَخْبَرَنِي أَبِي، عن أبي صالح، عن ابن عباس، قال: \u003c/span>لما حط من طول آدم ع إِلَى سِتِّينَ ذِرَاعًا أَنْشَأَ يَقُولُ: رَبِّ، كُنْتُ جَارَكَ فِي دَارِكَ، لَيْسَ لِي رَبٌّ غَيْرُكَ، وَلا رَقِيبٌ دُونَكَ، آكُلُ فِيهَا رَغَدًا، وَأَسْكُنُ حَيْثُ أَحْبَبْتُ، فَأَهْبَطْتَنِي إِلَى هَذَا الْجَبَلِ الْمُقَدَّسِ، فَكُنْتُ أَسْمَعُ أَصْوَاتَ الْمَلائِكَةِ، وَأَرَاهُمْ كَيْفَ يَحُفُّونَ بِعَرْشِكَ، وَأَجِدُ رِيحَ الْجَنَّةِ وَطِيبَهَا، ثُمَّ أَهْبَطْتَنِي إِلَى الأَرْضِ، وَحَطَطْتَنِي إِلَى سِتِّينَ ذِرَاعًا، فَقَدِ انْقَطَعَ عَنِّي الصَّوْتُ وَالنَّظَرُ، وَذَهَبَ عَنِّي رِيحَ الْجَنَّةِ فَأَجَابَهُ اللَّهُ عَزَّ وَجَلَّ: لِمَعْصِيَتِكَ يَا آدَمُ فَعَلْتُ ذَلِكَ بِكَ","bs_ranges":[[0,193]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: \u003c/span>„Kada je Ademova, alejhis-selam, visina smanjena na šezdeset lakata, počeo je govoriti: ‘Gospodaru moj, bio sam Tvoj susjed u Tvome domu. Nisam imao drugog gospodara osim Tebe niti nadzornika mimo Tebe. Jeo sam u njemu obilno i nastanjivao se gdje sam želio. Spustio si me na ovu svetu planinu, pa sam slušao glasove meleka, gledao kako okružuju Tvoj Arš i osjećao džennetski miris i njegovu ljepotu. Zatim si me spustio na Zemlju i smanjio me na šezdeset lakata. Više ne čujem glasove i ne vidim ih, a džennetski miris nestao je od mene.’ Allah, Silan i Uzvišen, odgovorio mu je: ‘Zbog tvoje nepokornosti, Ademe, učinio sam ti to.’"},{"id":"124.2","ar":"فَلَمَّا رَأَى اللَّهُ تَعَالَى عُرْيَ آدَمَ وَحَوَّاءَ أَمَرَهُ أَنْ يَذْبَحَ كَبْشًا مِنَ الضَّأْنِ مِنَ الثَّمَانِيَةِ الأَزْوَاجِ الَّتِي أَنْزَلَ مِنَ الْجَنَّةِ، فَأَخَذَ كَبْشًا فَذَبَحَهُ، ثُمَّ أَخَذَ صُوفَهُ فَغَزَلَتْهُ حَوَّاءُ، وَنَسَجَهُ هُوَ وَحَوَّاءُ، فَنَسَجَ آدَمُ جُبَّةً لِنَفْسِهِ، وَجَعَلَ لِحَوَّاءَ دِرْعًا وخمارا، فلبسا ذلك، واوحى اللَّهُ تَعَالَى إِلَى آدَمَ أَنْ لِي حَرَمًا بِحِيَالِ عَرْشِي، فَانْطَلِقْ فَابْنِ لِي فِيهِ بَيْتًا، ثم حف به كما رايت ملائكى يَحُفُّونَ بِعَرْشِي، فَهُنَالِكَ أَسْتَجِيبُ لَكَ وَلِوَلَدِكَ، مَنْ كَانَ مِنْهُمْ فِي طَاعَتِي، فَقَالَ آدَمُ: أَيْ رَبِّ، فَكَيْفَ لِي بِذَلِكَ، لَسْتُ أَقْوَى عَلَيْهِ وَلا أَهْتَدِي لَهُ! فَقَيَّضَ اللَّهُ لَهُ مَلَكًا، فَانْطَلَقَ بِهِ نَحْوَ مَكَّةَ، فَكَانَ آدَمُ إِذَا مَرَّ بِرَوْضَةٍ وَمَكَانٍ يُعْجِبُهُ قَالَ لِلْمَلَكِ: انْزِلْ بنا هاهنا، فَيَقُولُ لَهُ الْمَلَكُ: مَكَانَكَ، حَتَّى قَدِمَ مَكَّةَ، فَكَانَ كُلُّ مَكَانٍ نَزَلَ بِهِ صَارَ عُمْرَانًا، وَكُلُّ مَكَانٍ تَعَدَّاهُ صَارَ مَفَاوِزَ وَقِفَارًا، فَبَنَى الْبَيْتَ مِنْ خَمْسَةِ أَجْبُلٍ: مِنْ طُورِ سَيْنَاءَ وَطُورِ زَيْتُونٍ وَلِبْنَانَ وَالْجُودِيِّ، وَبَنَى قَوَاعِدَهُ مِنْ حِرَاءَ، فَلَمَّا فَرَغَ مِنْ بِنَائِهِ خَرَجَ بِهِ الْمَلَكُ إِلَى عَرَفَاتٍ، فَأَرَاهُ الْمَنَاسِكَ كُلَّهَا الَّتِي تَفْعَلُهَا النَّاسُ الْيَوْمَ، ثُمَّ قَدِمَ بِهِ مَكَّةَ، فَطَافَ بِالْبَيْتِ أُسْبُوعًا، ثُمَّ رَجَعَ إِلَى أَرْضِ الْهِنْدِ، فَمَاتَ عَلَى بُوذَ","bs":"Kada je Uzvišeni Allah vidio Ademovu i Havvinu golotinju, naredio mu je da zakolje ovna među ovcama iz osam parova koje je spustio iz Dženneta. Uzeo je ovna i zaklao ga, zatim uzeo njegovu vunu. Havva ju je isprela, a on i Havva istkali su je. Adem je sebi istkao džubu, a Havvi načinio haljinu i pokrivalo za glavu. To su obukli. Uzvišeni Allah objavio je Ademu: ‘Imam sveti prostor naspram Svoga Arša. Idi i izgradi Mi u njemu Hram. Zatim ga obilazi kao što si vidio Moje meleke kako okružuju Moj Arš. Tamo ću se odazivati tebi i onima od tvojih potomaka koji Mi budu pokorni.’ Adem je rekao: ‘Gospodaru moj, kako da to učinim? Nemam snage za to niti znam put do toga!’ Allah mu je dodijelio meleka koji je s njim krenuo prema Meki. Kada bi Adem prošao pored vrta ili mjesta koje bi mu se svidjelo, rekao bi meleku: ‘Spusti nas ovdje.’ Melek bi mu govorio: ‘Ostani na svome mjestu’, sve dok nije stigao u Meku. Svako mjesto na kojem se zaustavio postalo je nastanjeno, a svako koje je prošao postalo je pustara i golet. Hram je izgradio od pet planina: od Turi-Sinaa, Turi-Zejtuna, Libana i Džudijja, a temelje mu je izgradio od Hire. Kada je završio gradnju, melek je s njim otišao na Arefat i pokazao mu sve obrede koje ljudi danas obavljaju. Potom ga je doveo u Meku, pa je sedam puta obišao Hram. Zatim se vratio u Indiju i umro na Buzu.“","ar_ranges":[],"ar_html":"فَلَمَّا رَأَى اللَّهُ تَعَالَى عُرْيَ آدَمَ وَحَوَّاءَ أَمَرَهُ أَنْ يَذْبَحَ كَبْشًا مِنَ الضَّأْنِ مِنَ الثَّمَانِيَةِ الأَزْوَاجِ الَّتِي أَنْزَلَ مِنَ الْجَنَّةِ، فَأَخَذَ كَبْشًا فَذَبَحَهُ، ثُمَّ أَخَذَ صُوفَهُ فَغَزَلَتْهُ حَوَّاءُ، وَنَسَجَهُ هُوَ وَحَوَّاءُ، فَنَسَجَ آدَمُ جُبَّةً لِنَفْسِهِ، وَجَعَلَ لِحَوَّاءَ دِرْعًا وخمارا، فلبسا ذلك، واوحى اللَّهُ تَعَالَى إِلَى آدَمَ أَنْ لِي حَرَمًا بِحِيَالِ عَرْشِي، فَانْطَلِقْ فَابْنِ لِي فِيهِ بَيْتًا، ثم حف به كما رايت ملائكى يَحُفُّونَ بِعَرْشِي، فَهُنَالِكَ أَسْتَجِيبُ لَكَ وَلِوَلَدِكَ، مَنْ كَانَ مِنْهُمْ فِي طَاعَتِي، فَقَالَ آدَمُ: أَيْ رَبِّ، فَكَيْفَ لِي بِذَلِكَ، لَسْتُ أَقْوَى عَلَيْهِ وَلا أَهْتَدِي لَهُ! فَقَيَّضَ اللَّهُ لَهُ مَلَكًا، فَانْطَلَقَ بِهِ نَحْوَ مَكَّةَ، فَكَانَ آدَمُ إِذَا مَرَّ بِرَوْضَةٍ وَمَكَانٍ يُعْجِبُهُ قَالَ لِلْمَلَكِ: انْزِلْ بنا هاهنا، فَيَقُولُ لَهُ الْمَلَكُ: مَكَانَكَ، حَتَّى قَدِمَ مَكَّةَ، فَكَانَ كُلُّ مَكَانٍ نَزَلَ بِهِ صَارَ عُمْرَانًا، وَكُلُّ مَكَانٍ تَعَدَّاهُ صَارَ مَفَاوِزَ وَقِفَارًا، فَبَنَى الْبَيْتَ مِنْ خَمْسَةِ أَجْبُلٍ: مِنْ طُورِ سَيْنَاءَ وَطُورِ زَيْتُونٍ وَلِبْنَانَ وَالْجُودِيِّ، وَبَنَى قَوَاعِدَهُ مِنْ حِرَاءَ، فَلَمَّا فَرَغَ مِنْ بِنَائِهِ خَرَجَ بِهِ الْمَلَكُ إِلَى عَرَفَاتٍ، فَأَرَاهُ الْمَنَاسِكَ كُلَّهَا الَّتِي تَفْعَلُهَا النَّاسُ الْيَوْمَ، ثُمَّ قَدِمَ بِهِ مَكَّةَ، فَطَافَ بِالْبَيْتِ أُسْبُوعًا، ثُمَّ رَجَعَ إِلَى أَرْضِ الْهِنْدِ، فَمَاتَ عَلَى بُوذَ","bs_ranges":[],"bs_html":"Kada je Uzvišeni Allah vidio Ademovu i Havvinu golotinju, naredio mu je da zakolje ovna među ovcama iz osam parova koje je spustio iz Dženneta. Uzeo je ovna i zaklao ga, zatim uzeo njegovu vunu. Havva ju je isprela, a on i Havva istkali su je. Adem je sebi istkao džubu, a Havvi načinio haljinu i pokrivalo za glavu. To su obukli. Uzvišeni Allah objavio je Ademu: ‘Imam sveti prostor naspram Svoga Arša. Idi i izgradi Mi u njemu Hram. Zatim ga obilazi kao što si vidio Moje meleke kako okružuju Moj Arš. Tamo ću se odazivati tebi i onima od tvojih potomaka koji Mi budu pokorni.’ Adem je rekao: ‘Gospodaru moj, kako da to učinim? Nemam snage za to niti znam put do toga!’ Allah mu je dodijelio meleka koji je s njim krenuo prema Meki. Kada bi Adem prošao pored vrta ili mjesta koje bi mu se svidjelo, rekao bi meleku: ‘Spusti nas ovdje.’ Melek bi mu govorio: ‘Ostani na svome mjestu’, sve dok nije stigao u Meku. Svako mjesto na kojem se zaustavio postalo je nastanjeno, a svako koje je prošao postalo je pustara i golet. Hram je izgradio od pet planina: od Turi-Sinaa, Turi-Zejtuna, Libana i Džudijja, a temelje mu je izgradio od Hire. Kada je završio gradnju, melek je s njim otišao na Arefat i pokazao mu sve obrede koje ljudi danas obavljaju. Potom ga je doveo u Meku, pa je sedam puta obišao Hram. Zatim se vratio u Indiju i umro na Buzu.“"}],"notes":[]},{"n":125,"ar":"حدثنا أبو همام، قال: حدثني أبي، قال: حدثني زياد بن خيثمة، عن أبي يحيى بَائِعِ الْقَتِّ، قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حدثنى عبد الله ابن عباس ان آدم ع نَزَلَ حِينَ نَزَلَ بِالْهِنْدِ، وَلَقَدْ حَجَّ مِنْهَا أَرْبَعِينَ حِجَّةً عَلَى رِجْلَيْهِ، فَقُلْتُ لَهُ: يَا أَبَا الْحَجَّاجِ، أَلا كَانَ يَرْكَبُ؟ قَالَ: فَأَيُّ شيء كان يحمله! فو الله إِنَّ خَطْوَهُ مَسِيرَةُ ثَلاثَةِ أَيَّامٍ، وَإِنْ كَانَ رَأْسُهُ لَيَبْلُغُ السَّمَاءَ، فَاشْتَكَتِ الْمَلائِكَةُ نَفَسَهُ، فَهَمَزَهُ الرَّحْمَنُ هَمْزَةً، فَتَطَأْطَأَ مِقْدَارَ أَرْبَعِينَ سَنَةً.\nحَدَّثَنِي صَالِحُ بْنُ حَرْبٍ أَبُو مَعْمَرٍ مَوْلَى بَنِي هَاشِمٍ، قَالَ: حَدَّثَنَا ثُمَامَةُ بْنُ عُبَيْدَةَ السُّلَمِيُّ، قَالَ: أَخْبَرَنَا أَبُو الزُّبَيْرِ، قَالَ: قَالَ نَافِعٌ:\n\nسَمِعْتُ ابْنَ عُمَرَ، يَقُولُ: إِنَّ اللَّهَ تَعَالَى اوحى الى آدم ع وَهُوَ بِبِلادِ الْهِنْدِ:\nأَنْ حُجَّ هَذَا الْبَيْتَ فَحَجَّ آدَمُ مِنْ بِلادِ الْهِنْدِ، فَكَانَ كُلَّمَا وَضَعَ قَدَمَهُ صَارَ قَرْيَةً، وَمَا بَيْنَ خُطْوَتَيْهِ مَفَازَةً، حَتَّى انْتَهَى إِلَى الْبَيْتِ فَطَافَ بِهِ، وَقَضَى الْمَنَاسِكَ كُلَّهَا، ثُمَّ أَرَادَ الرُّجُوعَ إِلَى بِلادِ الْهِنْدِ فَمَضَى، حَتَّى إِذَا كَانَ بِمَأْزِمَيْ عَرَفَاتٍ، تَلَقَّتْهُ الْمَلائِكَةُ، فَقَالُوا: بِرَّ حَجَّكَ يَا آدَمُ! فَدَخَلَهُ مِنْ ذَلِكَ عُجْبٌ، فَلَمَّا رَأَتِ الْمَلائِكَةُ ذَلِكَ مِنْهُ قَالُوا: يَا آدَمُ، إِنَّا قَدْ حَجَجْنَا هَذَا الْبَيْتَ قَبْلَ أَنْ تُخْلَقَ بِأَلْفَيْ سَنَةٍ، قَالَ: فَتَقَاصَرَتْ إِلَى آدَمَ نَفْسُهُ.\nوذكر ان آدم ع أُهْبِطَ إِلَى الأَرْضِ، وَعَلَى رَأْسِهِ إِكْلِيلٌ مِنْ شَجَرِ الْجَنَّةِ، فَلَمَّا صَارَ إِلَى الأَرْضِ، وَيَبِسَ الإِكْلِيلُ، تَحَاتَّ وَرَقُهُ فَنَبَتَ مِنْهُ أَنْوَاعُ الطِّيبِ.\n\nوَقَالَ بَعْضُهُمْ: بَلْ كَانَ ذَلِكَ مَا أَخْبَرَ اللَّهُ عَنْهُمَا، أَنَّهُمَا جَعَلا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ، فَلَمَّا يَبِسَ ذَلِكَ الْوَرَقُ الَّذِي خَصَفَاهُ عَلَيْهِمَا تَحَاتَّ فَنَبَتَ مِنْ ذَلِكَ الْوَرَقِ انواع الطيب والله اعلم","bs":"\u003cp data-paragraph=\"125.1\">Pričao nam je Ebu Hemmam, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao mi je Abdullah ibn Abbas da je Adem, alejhis-selam, kada je spušten, spušten u Indiju. Odatle je četrdeset puta pješice obavio hadž.“ Upitao sam ga: „Ebu Hadždžadže, zar nije mogao jahati?“ Odgovorio je: „A šta bi ga moglo nositi! Tako mi Allaha, njegov je korak bio tri dana puta, a glava mu je dosezala nebo. Meleki su se požalili na njegov dah, pa ga je Milostivi jednim pritiskom pritisnuo i on se spustio za mjeru četrdeset godina.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izraz مقدار أربعين سنة („mjera četrdeset godina“) sačuvan je kao u izvoru; nije pretvoren u pretpostavljenu mjeru visine.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"125.2\">Pričao mi je Salih ibn Harb Ebu Ma‘mer, oslobođenik Benu Hašima, koji je rekao: pričao nam je Sumama ibn Ubejda es-Sulemi, koji je rekao: obavijestio nas je Ebu Zubejr, koji je rekao: Nafi‘ je rekao: čuo sam Ibn Omera kako govori: „Uzvišeni Allah objavio je Ademu, alejhis-selam, dok je bio u Indiji: ‘Obavi hadž ovome Hramu.’ Adem je iz Indije krenuo na hadž. Gdje god bi spustio stopalo, nastalo bi naselje, a između njegova dva koraka bila je pustara, sve dok nije stigao do Hrama. Obišao ga je i izvršio sve obrede, a zatim se htio vratiti u Indiju. Krenuo je i, kada je bio kod dvaju klanaca Arefata, sreli su ga meleki i rekli: ‘Neka ti hadž bude primljen, Ademe!’ To je u njemu izazvalo samodopadnost. Kada su meleki to kod njega vidjeli, rekli su: ‘Ademe, mi smo obavljali hadž ovome Hramu dvije hiljade godina prije nego što si stvoren.’“ Rekao je: „Tada se Adem u sebi osjetio malenim.“\u003c/p>\u003cp data-paragraph=\"125.3\">Navedeno je da je Adem, alejhis-selam, spušten na Zemlju s vijencem od džennetskog drveća na glavi. Kada je stigao na Zemlju i vijenac se osušio, njegovo je lišće opalo, pa su iz njega nikle različite vrste mirisnog bilja.\u003c/p>\u003cp data-paragraph=\"125.4\">Neki su rekli: „Naprotiv, to je bilo ono o čemu ih Allah obavještava: počeli su po sebi spajati džennetsko lišće. Kada se lišće kojim su se pokrili osušilo i opalo, iz njega su nikle različite vrste mirisnog bilja.“ A Allah najbolje zna.\u003c/p>","paragraphs":[{"id":"125.1","ar":"حدثنا أبو همام، قال: حدثني أبي، قال: حدثني زياد بن خيثمة، عن أبي يحيى بَائِعِ الْقَتِّ، قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حدثنى عبد الله ابن عباس ان آدم ع نَزَلَ حِينَ نَزَلَ بِالْهِنْدِ، وَلَقَدْ حَجَّ مِنْهَا أَرْبَعِينَ حِجَّةً عَلَى رِجْلَيْهِ، فَقُلْتُ لَهُ: يَا أَبَا الْحَجَّاجِ، أَلا كَانَ يَرْكَبُ؟ قَالَ: فَأَيُّ شيء كان يحمله! فو الله إِنَّ خَطْوَهُ مَسِيرَةُ ثَلاثَةِ أَيَّامٍ، وَإِنْ كَانَ رَأْسُهُ لَيَبْلُغُ السَّمَاءَ، فَاشْتَكَتِ الْمَلائِكَةُ نَفَسَهُ، فَهَمَزَهُ الرَّحْمَنُ هَمْزَةً، فَتَطَأْطَأَ مِقْدَارَ أَرْبَعِينَ سَنَةً.","bs":"Pričao nam je Ebu Hemmam, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao mi je Abdullah ibn Abbas da je Adem, alejhis-selam, kada je spušten, spušten u Indiju. Odatle je četrdeset puta pješice obavio hadž.“ Upitao sam ga: „Ebu Hadždžadže, zar nije mogao jahati?“ Odgovorio je: „A šta bi ga moglo nositi! Tako mi Allaha, njegov je korak bio tri dana puta, a glava mu je dosezala nebo. Meleki su se požalili na njegov dah, pa ga je Milostivi jednim pritiskom pritisnuo i on se spustio za mjeru četrdeset godina.“ ⟦Napomena prevodioca: izraz مقدار أربعين سنة („mjera četrdeset godina“) sačuvan je kao u izvoru; nije pretvoren u pretpostavljenu mjeru visine.⟧","ar_ranges":[[0,147]],"ar_html":"\u003cspan class=\"isnad\">حدثنا أبو همام، قال: حدثني أبي، قال: حدثني زياد بن خيثمة، عن أبي يحيى بَائِعِ الْقَتِّ، قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حدثنى عبد الله ابن عباس \u003c/span>ان آدم ع نَزَلَ حِينَ نَزَلَ بِالْهِنْدِ، وَلَقَدْ حَجَّ مِنْهَا أَرْبَعِينَ حِجَّةً عَلَى رِجْلَيْهِ، فَقُلْتُ لَهُ: يَا أَبَا الْحَجَّاجِ، أَلا كَانَ يَرْكَبُ؟ قَالَ: فَأَيُّ شيء كان يحمله! فو الله إِنَّ خَطْوَهُ مَسِيرَةُ ثَلاثَةِ أَيَّامٍ، وَإِنْ كَانَ رَأْسُهُ لَيَبْلُغُ السَّمَاءَ، فَاشْتَكَتِ الْمَلائِكَةُ نَفَسَهُ، فَهَمَزَهُ الرَّحْمَنُ هَمْزَةً، فَتَطَأْطَأَ مِقْدَارَ أَرْبَعِينَ سَنَةً.","bs_ranges":[[0,212]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Hemmam, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao mi je Abdullah ibn Abbas \u003c/span>da je Adem, alejhis-selam, kada je spušten, spušten u Indiju. Odatle je četrdeset puta pješice obavio hadž.“ Upitao sam ga: „Ebu Hadždžadže, zar nije mogao jahati?“ Odgovorio je: „A šta bi ga moglo nositi! Tako mi Allaha, njegov je korak bio tri dana puta, a glava mu je dosezala nebo. Meleki su se požalili na njegov dah, pa ga je Milostivi jednim pritiskom pritisnuo i on se spustio za mjeru četrdeset godina.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izraz مقدار أربعين سنة („mjera četrdeset godina“) sačuvan je kao u izvoru; nije pretvoren u pretpostavljenu mjeru visine.⟧\u003c/span>"},{"id":"125.2","ar":"حَدَّثَنِي صَالِحُ بْنُ حَرْبٍ أَبُو مَعْمَرٍ مَوْلَى بَنِي هَاشِمٍ، قَالَ: حَدَّثَنَا ثُمَامَةُ بْنُ عُبَيْدَةَ السُّلَمِيُّ، قَالَ: أَخْبَرَنَا أَبُو الزُّبَيْرِ، قَالَ: قَالَ نَافِعٌ:\n\nسَمِعْتُ ابْنَ عُمَرَ، يَقُولُ: إِنَّ اللَّهَ تَعَالَى اوحى الى آدم ع وَهُوَ بِبِلادِ الْهِنْدِ:\nأَنْ حُجَّ هَذَا الْبَيْتَ فَحَجَّ آدَمُ مِنْ بِلادِ الْهِنْدِ، فَكَانَ كُلَّمَا وَضَعَ قَدَمَهُ صَارَ قَرْيَةً، وَمَا بَيْنَ خُطْوَتَيْهِ مَفَازَةً، حَتَّى انْتَهَى إِلَى الْبَيْتِ فَطَافَ بِهِ، وَقَضَى الْمَنَاسِكَ كُلَّهَا، ثُمَّ أَرَادَ الرُّجُوعَ إِلَى بِلادِ الْهِنْدِ فَمَضَى، حَتَّى إِذَا كَانَ بِمَأْزِمَيْ عَرَفَاتٍ، تَلَقَّتْهُ الْمَلائِكَةُ، فَقَالُوا: بِرَّ حَجَّكَ يَا آدَمُ! فَدَخَلَهُ مِنْ ذَلِكَ عُجْبٌ، فَلَمَّا رَأَتِ الْمَلائِكَةُ ذَلِكَ مِنْهُ قَالُوا: يَا آدَمُ، إِنَّا قَدْ حَجَجْنَا هَذَا الْبَيْتَ قَبْلَ أَنْ تُخْلَقَ بِأَلْفَيْ سَنَةٍ، قَالَ: فَتَقَاصَرَتْ إِلَى آدَمَ نَفْسُهُ.","bs":"Pričao mi je Salih ibn Harb Ebu Ma‘mer, oslobođenik Benu Hašima, koji je rekao: pričao nam je Sumama ibn Ubejda es-Sulemi, koji je rekao: obavijestio nas je Ebu Zubejr, koji je rekao: Nafi‘ je rekao: čuo sam Ibn Omera kako govori: „Uzvišeni Allah objavio je Ademu, alejhis-selam, dok je bio u Indiji: ‘Obavi hadž ovome Hramu.’ Adem je iz Indije krenuo na hadž. Gdje god bi spustio stopalo, nastalo bi naselje, a između njegova dva koraka bila je pustara, sve dok nije stigao do Hrama. Obišao ga je i izvršio sve obrede, a zatim se htio vratiti u Indiju. Krenuo je i, kada je bio kod dvaju klanaca Arefata, sreli su ga meleki i rekli: ‘Neka ti hadž bude primljen, Ademe!’ To je u njemu izazvalo samodopadnost. Kada su meleki to kod njega vidjeli, rekli su: ‘Ademe, mi smo obavljali hadž ovome Hramu dvije hiljade godina prije nego što si stvoren.’“ Rekao je: „Tada se Adem u sebi osjetio malenim.“","ar_ranges":[[0,220]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي صَالِحُ بْنُ حَرْبٍ أَبُو مَعْ تَحَاتَّ وَرَقُهُ فَنَبَتَ مِنْهُ أَنْوَاعُ الطِّيبِ.","bs":"Navedeno je da je Adem, alejhis-selam, spušten na Zemlju s vijencem od džennetskog drveća na glavi. Kada je stigao na Zemlju i vijenac se osušio, njegovo je lišće opalo, pa su iz njega nikle različite vrste mirisnog bilja.","ar_ranges":[],"ar_html":"وذكر ان آدم ع أُهْبِطَ إِلَى الأَرْضِ، وَعَلَى رَأْسِهِ إِكْلِيلٌ مِنْ شَجَرِ الْجَنَّةِ، فَلَمَّا صَارَ إِلَى الأَرْضِ، وَيَبِسَ الإِكْلِيلُ، تَحَاتَّ وَرَقُهُ فَنَبَتَ مِنْهُ أَنْوَاعُ الطِّيبِ.","bs_ranges":[],"bs_html":"Navedeno je da je Adem, alejhis-selam, spušten na Zemlju s vijencem od džennetskog drveća na glavi. Kada je stigao na Zemlju i vijenac se osušio, njegovo je lišće opalo, pa su iz njega nikle različite vrste mirisnog bilja."},{"id":"125.4","ar":"وَقَالَ بَعْضُهُمْ: بَلْ كَانَ ذَلِكَ مَا أَخْبَرَ اللَّهُ عَنْهُمَا، أَنَّهُمَا جَعَلا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ، فَلَمَّا يَبِسَ ذَلِكَ الْوَرَقُ الَّذِي خَصَفَاهُ عَلَيْهِمَا تَحَاتَّ فَنَبَتَ مِنْ ذَلِكَ الْوَرَقِ انواع الطيب والله اعلم","bs":"Neki su rekli: „Naprotiv, to je bilo ono o čemu ih Allah obavještava: počeli su po sebi spajati džennetsko lišće. Kada se lišće kojim su se pokrili osušilo i opalo, iz njega su nikle različite vrste mirisnog bilja.“ A Allah najbolje zna.","ar_ranges":[],"ar_html":"وَقَالَ بَعْضُهُمْ: بَلْ كَانَ ذَلِكَ مَا أَخْبَرَ اللَّهُ عَنْهُمَا، أَنَّهُمَا جَعَلا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ، فَلَمَّا يَبِسَ ذَلِكَ الْوَرَقُ الَّذِي خَصَفَاهُ عَلَيْهِمَا تَحَاتَّ فَنَبَتَ مِنْ ذَلِكَ الْوَرَقِ انواع الطيب والله اعلم","bs_ranges":[],"bs_html":"Neki su rekli: „Naprotiv, to je bilo ono o čemu ih Allah obavještava: počeli su po sebi spajati džennetsko lišće. Kada se lišće kojim su se pokrili osušilo i opalo, iz njega su nikle različite vrste mirisnog bilja.“ A Allah najbolje zna."}],"notes":[]},{"n":126,"ar":"وقال آخرون: بل لَمَّا عَلِمَ آدَمُ أَنَّ اللَّهَ عَزَّ وَجَلَّ مُهْبِطُهُ إِلَى الأَرْضِ، جَعَلَ لا يَمُرُّ بِشَجَرَةٍ مِنْ شَجَرِ الْجَنَّةِ إِلَّا أَخَذَ غُصْنًا مِنْ أَغْصَانِهَا، فَهَبَطَ إِلَى الأَرْضِ وَتِلْكَ الأَغْصَانُ مَعَهُ، فَلَمَّا يَبِسَ وَرَقُهَا تَحَاتَّ، فَكَانَ ذَلِكَ أَصْلُ الطِّيبِ.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\n٢٣٢- حَدَّثَنَا أَبُو هَمَّامٍ، قَالَ: حَدَّثَنَا أَبِي، قَالَ: حَدَّثَنَا زِيَادُ بن خيثمة، عن أبي يحيى بائع القت قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حَدَّثَنِي عَبْدُ الله ابن عَبَّاسٍ، أَنَّ آدَمَ حِينَ خَرَجَ مِنَ الْجَنَّةِ كَانَ لا يَمُرُّ بِشَيْءٍ إِلا عَبَثَ بِهِ، فَقِيلَ لِلْمَلائِكَةِ: دَعُوهُ فَلْيَتَزَوَّدْ مِنْهَا مَا شَاءَ، فَنَزَلَ حِينَ نَزَلَ بِالْهِنْدِ، وَإِنَّ هَذَا الطِّيبَ الَّذِي يُجَاءُ بِهِ مِنَ الْهِنْدِ مِمَّا خَرَجَ بِهِ آدَمُ مِنَ الْجَنَّةِ ذكر من قال: كان على راس آدم ع حين أهبط من الجنة إكليل من شجر الجنة:\nحدثت عن عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أنس، عن أبي العالية، قال: خرج آدم من الجنة، فخرج منها ومعه عصا من شجر الجنة، وعلى رأسه تاج أو إكليل من شجر الجنة، قال: فأهبط إلى الهند، ومنه كل طيب بالهند.\n\nحَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال:\n\nهبط آدم عليه- يعني على الجبل الذي هبط عليه- ومعه ورق من ورق الجنة، فبثه في ذلك الجبل، فمنه كان أصل الطيب كله، وكل فاكهة لا توجد إلا بأرض الهند","bs":"\u003cp data-paragraph=\"126.1\">Drugi su rekli: „Naprotiv, kada je Adem saznao da će ga Allah, Silan i Uzvišen, spustiti na Zemlju, nije prolazio pored ijednog džennetskog drveta a da nije uzeo jednu njegovu granu. Spustio se na Zemlju noseći te grane sa sobom. Kada se njihovo lišće osušilo i opalo, ono je postalo porijeklo mirisnog bilja.“\u003c/p>\u003cp data-paragraph=\"126.2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"126.3\">232 — Pričao nam je Ebu Hemmam, koji je rekao: pričao nam je moj otac, koji je rekao: pričao nam je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao mi je Abdullah ibn Abbas da Adem, kada je izlazio iz Dženneta, nije prolazio pored nečega a da to nije dodirivao i po tome prebirao. Melekima je rečeno: ‘Pustite ga neka se iz njega opskrbi čime god želi.’ Kada je spušten, spušten je u Indiju. Ovi mirisi koji se donose iz Indije pripadaju onome što je Adem iznio sa sobom iz Dženneta.“\u003c/p>\u003cp data-paragraph=\"126.4\">Spomen onih koji su rekli da je Adem, alejhis-selam, kada je spušten iz Dženneta, na glavi imao vijenac od džennetskog drveća:\u003c/p>\u003cp data-paragraph=\"126.5\">Preneseno mi je od Ammara ibn el-Hasena, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, od Ebu Alije, koji je rekao: „Adem je izašao iz Dženneta noseći štap od džennetskog drveta, a na glavi krunu ili vijenac od džennetskog drveća.“ Rekao je: „Spušten je u Indiju i od njega potječe sve mirisno u Indiji.“\u003c/p>\u003cp data-paragraph=\"126.6\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Adem se spustio na nju“ — misli na planinu na koju se spustio — „noseći džennetsko lišće. Rasuo ga je po toj planini, pa od njega potječu sve mirisne tvari i svaki plod koji se nalazi samo u Indiji.“\u003c/p>","paragraphs":[{"id":"126.1","ar":"وقال آخرون: بل لَمَّا عَلِمَ آدَمُ أَنَّ اللَّهَ عَزَّ وَجَلَّ مُهْبِطُهُ إِلَى الأَرْضِ، جَعَلَ لا يَمُرُّ بِشَجَرَةٍ مِنْ شَجَرِ الْجَنَّةِ إِلَّا أَخَذَ غُصْنًا مِنْ أَغْصَانِهَا، فَهَبَطَ إِلَى الأَرْضِ وَتِلْكَ الأَغْصَانُ مَعَهُ، فَلَمَّا يَبِسَ وَرَقُهَا تَحَاتَّ، فَكَانَ ذَلِكَ أَصْلُ الطِّيبِ.","bs":"Drugi su rekli: „Naprotiv, kada je Adem saznao da će ga Allah, Silan i Uzvišen, spustiti na Zemlju, nije prolazio pored ijednog džennetskog drveta a da nije uzeo jednu njegovu granu. Spustio se na Zemlju noseći te grane sa sobom. Kada se njihovo lišće osušilo i opalo, ono je postalo porijeklo mirisnog bilja.“","ar_ranges":[],"ar_html":"وقال آخرون: بل لَمَّا عَلِمَ آدَمُ أَنَّ اللَّهَ عَزَّ وَجَلَّ مُهْبِطُهُ إِلَى الأَرْضِ، جَعَلَ لا يَمُرُّ بِشَجَرَةٍ مِنْ شَجَرِ الْجَنَّةِ إِلَّا أَخَذَ غُصْنًا مِنْ أَغْصَانِهَا، فَهَبَطَ إِلَى الأَرْضِ وَتِلْكَ الأَغْصَانُ مَعَهُ، فَلَمَّا يَبِسَ وَرَقُهَا تَحَاتَّ، فَكَانَ ذَلِكَ أَصْلُ الطِّيبِ.","bs_ranges":[],"bs_html":"Drugi su rekli: „Naprotiv, kada je Adem saznao da će ga Allah, Silan i Uzvišen, spustiti na Zemlju, nije prolazio pored ijednog džennetskog drveta a da nije uzeo jednu njegovu granu. Spustio se na Zemlju noseći te grane sa sobom. Kada se njihovo lišće osušilo i opalo, ono je postalo porijeklo mirisnog bilja.“"},{"id":"126.2","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"126.3","ar":"٢٣٢- حَدَّثَنَا أَبُو هَمَّامٍ، قَالَ: حَدَّثَنَا أَبِي، قَالَ: حَدَّثَنَا زِيَادُ بن خيثمة، عن أبي يحيى بائع القت قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حَدَّثَنِي عَبْدُ الله ابن عَبَّاسٍ، أَنَّ آدَمَ حِينَ خَرَجَ مِنَ الْجَنَّةِ كَانَ لا يَمُرُّ بِشَيْءٍ إِلا عَبَثَ بِهِ، فَقِيلَ لِلْمَلائِكَةِ: دَعُوهُ فَلْيَتَزَوَّدْ مِنْهَا مَا شَاءَ، فَنَزَلَ حِينَ نَزَلَ بِالْهِنْدِ، وَإِنَّ هَذَا الطِّيبَ الَّذِي يُجَاءُ بِهِ مِنَ الْهِنْدِ مِمَّا خَرَجَ بِهِ آدَمُ مِنَ الْجَنَّةِ","bs":"232 — Pričao nam je Ebu Hemmam, koji je rekao: pričao nam je moj otac, koji je rekao: pričao nam je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao mi je Abdullah ibn Abbas da Adem, kada je izlazio iz Dženneta, nije prolazio pored nečega a da to nije dodirivao i po tome prebirao. Melekima je rečeno: ‘Pustite ga neka se iz njega opskrbi čime god želi.’ Kada je spušten, spušten je u Indiju. Ovi mirisi koji se donose iz Indije pripadaju onome što je Adem iznio sa sobom iz Dženneta.“","ar_ranges":[[5,187]],"ar_html":"٢٣٢- \u003cspan class=\"isnad\">حَدَّثَنَا أَبُو هَمَّامٍ، قَالَ: حَدَّثَنَا أَبِي، قَالَ: حَدَّثَنَا زِيَادُ بن خيثمة، عن أبي يحيى بائع القت قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حَدَّثَنِي عَبْدُ الله ابن عَبَّاسٍ، \u003c/span>أَنَّ آدَمَ حِينَ خَرَجَ مِنَ الْجَنَّةِ كَانَ لا يَمُرُّ بِشَيْءٍ إِلا عَبَثَ بِهِ، فَقِيلَ لِلْمَلائِكَةِ: دَعُوهُ فَلْيَتَزَوَّدْ مِنْهَا مَا شَاءَ، فَنَزَلَ حِينَ نَزَلَ بِالْهِنْدِ، وَإِنَّ هَذَا الطِّيبَ الَّذِي يُجَاءُ بِهِ مِنَ الْهِنْدِ مِمَّا خَرَجَ بِهِ آدَمُ مِنَ الْجَنَّةِ","bs_ranges":[[6,220]],"bs_html":"232 — \u003cspan class=\"isnad\">Pričao nam je Ebu Hemmam, koji je rekao: pričao nam je moj otac, koji je rekao: pričao nam je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao mi je Abdullah ibn Abbas \u003c/span>da Adem, kada je izlazio iz Dženneta, nije prolazio pored nečega a da to nije dodirivao i po tome prebirao. Melekima je rečeno: ‘Pustite ga neka se iz njega opskrbi čime god želi.’ Kada je spušten, spušten je u Indiju. Ovi mirisi koji se donose iz Indije pripadaju onome što je Adem iznio sa sobom iz Dženneta.“"},{"id":"126.4","ar":"ذكر من قال: كان على راس آدم ع حين أهبط من الجنة إكليل من شجر الجنة:","bs":"Spomen onih koji su rekli da je Adem, alejhis-selam, kada je spušten iz Dženneta, na glavi imao vijenac od džennetskog drveća:","ar_ranges":[],"ar_html":"ذكر من قال: كان على راس آدم ع حين أهبط من الجنة إكليل من شجر الجنة:","bs_ranges":[],"bs_html":"Spomen onih koji su rekli da je Adem, alejhis-selam, kada je spušten iz Dženneta, na glavi imao vijenac od džennetskog drveća:"},{"id":"126.5","ar":"حدثت عن عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أنس، عن أبي العالية، قال: خرج آدم من الجنة، فخرج منها ومعه عصا من شجر الجنة، وعلى رأسه تاج أو إكليل من شجر الجنة، قال: فأهبط إلى الهند، ومنه كل طيب بالهند.","bs":"Preneseno mi je od Ammara ibn el-Hasena, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, od Ebu Alije, koji je rekao: „Adem je izašao iz Dženneta noseći štap od džennetskog drveta, a na glavi krunu ili vijenac od džennetskog drveća.“ Rekao je: „Spušten je u Indiju i od njega potječe sve mirisno u Indiji.“","ar_ranges":[[0,104]],"ar_html":"\u003cspan class=\"isnad\">حدثت عن عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أنس، عن أبي العالية، قال: \u003c/span>خرج آدم من الجنة، فخرج منها ومعه عصا من شجر الجنة، وعلى رأسه تاج أو إكليل من شجر الجنة، قال: فأهبط إلى الهند، ومنه كل طيب بالهند.","bs_ranges":[[0,158]],"bs_html":"\u003cspan class=\"isnad\">Preneseno mi je od Ammara ibn el-Hasena, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, od Ebu Alije, koji je rekao: \u003c/span>„Adem je izašao iz Dženneta noseći štap od džennetskog drveta, a na glavi krunu ili vijenac od džennetskog drveća.“ Rekao je: „Spušten je u Indiju i od njega potječe sve mirisno u Indiji.“"},{"id":"126.6","ar":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال:\n\nهبط آدم عليه- يعني على الجبل الذي هبط عليه- ومعه ورق من ورق الجنة، فبثه في ذلك الجبل، فمنه كان أصل الطيب كله، وكل فاكهة لا توجد إلا بأرض الهند","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Adem se spustio na nju“ — misli na planinu na koju se spustio — „noseći džennetsko lišće. Rasuo ga je po toj planini, pa od njega potječu sve mirisne tvari i svaki plod koji se nalazi samo u Indiji.“","ar_ranges":[[0,63]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال:\n\n\u003c/span>هبط آدم عليه- يعني على الجبل الذي هبط عليه- ومعه ورق من ورق الجنة، فبثه في ذلك الجبل، فمنه كان أصل الطيب كله، وكل فاكهة لا توجد إلا بأرض الهند","bs_ranges":[[0,93]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: \u003c/span>„Adem se spustio na nju“ — misli na planinu na koju se spustio — „noseći džennetsko lišće. Rasuo ga je po toj planini, pa od njega potječu sve mirisne tvari i svaki plod koji se nalazi samo u Indiji.“"}],"notes":[]},{"n":127,"ar":"وقال آخرون: بل زوده الله من ثمار الجنة، فثمارنا هذه من تلك الثمار ذِكْرُ من قال ذلك:\n\nحَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ وعبد الوهاب ومحمد بن جعفر، عن عوف، عن قسامة بن زهير، عن الأشعري، قال:\nإن الله تبارك وتعالى لما اخرج آدم من الجنة زوده من ثمار الجنة، وعلمه صنعة كل شيء، فثماركم هذه من ثمار الجنة، غير أن هذه تتغير وتلك لا تتغير.\n\nوقال آخرون: إنما علق بأشجار الهند طيب ريح آدم ع.\n\nذكر من قال إنما صار الطيب بالهند لأن آدم حين أهبط إليها علق بأشجارها طيب ريحه:\nحَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنَا هِشَامُ بْنُ محمد، قال: أخبرني أبي، عن أبي صالح، عن ابن عباس، قال: نزل آدم ع مَعَهُ رِيحُ الْجَنَّةِ، فَعَلِقَ بِشَجَرِهَا وَأَوْدِيَتِهَا وَامْتَلأَ ما هنالك طِيبًا، فَمِنْ ثَمَّ يُؤْتَى بِالطِّيبِ مِنْ رِيحِ الْجَنَّةِ.\n\nوَقَالُوا: أُنْزِلَ مَعَهُ مِنْ طِيبِ الْجَنَّةِ.\nوَقَالَ: أُنْزِلَ مَعَهُ الْحَجَرُ الأَسْوَدُ، وَكَانَ أَشَدَّ بَيَاضًا مِنَ الثَّلْجِ، وَعَصَا مُوسَى، وَكَانَتْ مِنْ آسِ الْجَنَّةِ، طُولُهَا عَشَرَةُ أَذْرُعٍ عَلَى طُولِ مُوسَى، ومر ولبان، ثُمَّ أُنْزِلَ عَلَيْهِ بَعْدَ ذَلِكَ العَلاةُ وَالمِطْرَقَةُ وَالْكَلْبَتَانِ، فَنَظَرَ آدَمُ","bs":"\u003cp data-paragraph=\"127.1\">Drugi su rekli: „Naprotiv, Allah ga je opskrbio džennetskim plodovima, pa su ovi naši plodovi od tih plodova.“ Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"127.2\">Pričao nam je Ibn Beššar, koji je rekao: pričali su nam Ibn Ebu Adijj, Abdulvehhab i Muhammed ibn Džafer, od Avfa, od Kasame ibn Zuhejra, od Eš‘arija, koji je rekao: „Kada je Allah, Blagoslovljen i Uzvišen, izveo Adema iz Dženneta, opskrbio ga je džennetskim plodovima i poučio ga izradi svega. Ovi vaši plodovi od džennetskih su plodova, osim što se ovi mijenjaju, a oni se ne mijenjaju.“\u003c/p>\u003cp data-paragraph=\"127.3\">Drugi su rekli: „Miris Ademov, alejhis-selam, jednostavno se primio na indijskom drveću.“\u003c/p>\u003cp data-paragraph=\"127.4\">Spomen onih koji su rekli da su mirisi u Indiji nastali zato što se, kada je Adem u nju spušten, njegov lijepi miris primio na njenom drveću:\u003c/p>\u003cp data-paragraph=\"127.5\">Pričao mi je Haris ibn Muhammed, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio nas je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Adem, alejhis-selam, spustio se noseći džennetski miris. On se primio na njenom drveću i dolinama, pa se sve tamo ispunilo lijepim mirisom. Zato se odatle donose mirisi koji potječu od džennetskog mirisa.“\u003c/p>\u003cp data-paragraph=\"127.6\">Rekli su: „S njim je spušteno i nešto od džennetskih mirisa.“\u003c/p>\u003cp data-paragraph=\"127.7\">Rekao je: „S njim je spušten Crni kamen, koji je bio bjelji od snijega, i Musaov štap, koji je bio od džennetske mirte, dug deset lakata, prema Musaovoj visini, te mirra i tamjan. Zatim su mu poslije toga spušteni nakovanj, čekić i kliješta. Kada je spušten na planinu, Adem je pogledao\u003c/p>","paragraphs":[{"id":"127.1","ar":"وقال آخرون: بل زوده الله من ثمار الجنة، فثمارنا هذه من تلك الثمار ذِكْرُ من قال ذلك:","bs":"Drugi su rekli: „Naprotiv, Allah ga je opskrbio džennetskim plodovima, pa su ovi naši plodovi od tih plodova.“ Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"وقال آخرون: بل زوده الله من ثمار الجنة، فثمارنا هذه من تلك الثمار ذِكْرُ من قال ذلك:","bs_ranges":[],"bs_html":"Drugi su rekli: „Naprotiv, Allah ga je opskrbio džennetskim plodovima, pa su ovi naši plodovi od tih plodova.“ Spomen onih koji su to rekli:"},{"id":"127.2","ar":"حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ وعبد الوهاب ومحمد بن جعفر، عن عوف، عن قسامة بن زهير، عن الأشعري، قال:\nإن الله تبارك وتعالى لما اخرج آدم من الجنة زوده من ثمار الجنة، وعلمه صنعة كل شيء، فثماركم هذه من ثمار الجنة، غير أن هذه تتغير وتلك لا تتغير.","bs":"Pričao nam je Ibn Beššar, koji je rekao: pričali su nam Ibn Ebu Adijj, Abdulvehhab i Muhammed ibn Džafer, od Avfa, od Kasame ibn Zuhejra, od Eš‘arija, koji je rekao: „Kada je Allah, Blagoslovljen i Uzvišen, izveo Adema iz Dženneta, opskrbio ga je džennetskim plodovima i poučio ga izradi svega. Ovi vaši plodovi od džennetskih su plodova, osim što se ovi mijenjaju, a oni se ne mijenjaju.“","ar_ranges":[[0,135]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ وعبد الوهاب ومحمد بن جعفر، عن عوف، عن قسامة بن زهير، عن الأشعري، قال:\n\u003c/span>إن الله تبارك وتعالى لما اخرج آدم من الجنة زوده من ثمار الجنة، وعلمه صنعة كل شيء، فثماركم هذه من ثمار الجنة، غير أن هذه تتغير وتلك لا تتغير.","bs_ranges":[[0,166]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar, koji je rekao: pričali su nam Ibn Ebu Adijj, Abdulvehhab i Muhammed ibn Džafer, od Avfa, od Kasame ibn Zuhejra, od Eš‘arija, koji je rekao: \u003c/span>„Kada je Allah, Blagoslovljen i Uzvišen, izveo Adema iz Dženneta, opskrbio ga je džennetskim plodovima i poučio ga izradi svega. Ovi vaši plodovi od džennetskih su plodova, osim što se ovi mijenjaju, a oni se ne mijenjaju.“"},{"id":"127.3","ar":"وقال آخرون: إنما علق بأشجار الهند طيب ريح آدم ع.","bs":"Drugi su rekli: „Miris Ademov, alejhis-selam, jednostavno se primio na indijskom drveću.“","ar_ranges":[],"ar_html":"وقال آخرون: إنما علق بأشجار الهند طيب ريح آدم ع.","bs_ranges":[],"bs_html":"Drugi su rekli: „Miris Ademov, alejhis-selam, jednostavno se primio na indijskom drveću.“"},{"id":"127.4","ar":"ذكر من قال إنما صار الطيب بالهند لأن آدم حين أهبط إليها علق بأشجارها طيب ريحه:","bs":"Spomen onih koji su rekli da su mirisi u Indiji nastali zato što se, kada je Adem u nju spušten, njegov lijepi miris primio na njenom drveću:","ar_ranges":[],"ar_html":"ذكر من قال إنما صار الطيب بالهند لأن آدم حين أهبط إليها علق بأشجارها طيب ريحه:","bs_ranges":[],"bs_html":"Spomen onih koji su rekli da su mirisi u Indiji nastali zato što se, kada je Adem u nju spušten, njegov lijepi miris primio na njenom drveću:"},{"id":"127.5","ar":"حَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنَا هِشَامُ بْنُ محمد، قال: أخبرني أبي، عن أبي صالح، عن ابن عباس، قال: نزل آدم ع مَعَهُ رِيحُ الْجَنَّةِ، فَعَلِقَ بِشَجَرِهَا وَأَوْدِيَتِهَا وَامْتَلأَ ما هنالك طِيبًا، فَمِنْ ثَمَّ يُؤْتَى بِالطِّيبِ مِنْ رِيحِ الْجَنَّةِ.","bs":"Pričao mi je Haris ibn Muhammed, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio nas je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Adem, alejhis-selam, spustio se noseći džennetski miris. On se primio na njenom drveću i dolinama, pa se sve tamo ispunilo lijepim mirisom. Zato se odatle donose mirisi koji potječu od džennetskog mirisa.“","ar_ranges":[[0,156]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنَا هِشَامُ بْنُ محمد، قال: أخبرني أبي، عن أبي صالح، عن ابن عباس، قال: \u003c/span>نزل آدم ع مَعَهُ رِيحُ الْجَنَّةِ، فَعَلِقَ بِشَجَرِهَا وَأَوْدِيَتِهَا وَامْتَلأَ ما هنالك طِيبًا، فَمِنْ ثَمَّ يُؤْتَى بِالطِّيبِ مِنْ رِيحِ الْجَنَّةِ.","bs_ranges":[[0,211]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Haris ibn Muhammed, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio nas je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: \u003c/span>„Adem, alejhis-selam, spustio se noseći džennetski miris. On se primio na njenom drveću i dolinama, pa se sve tamo ispunilo lijepim mirisom. Zato se odatle donose mirisi koji potječu od džennetskog mirisa.“"},{"id":"127.6","ar":"وَقَالُوا: أُنْزِلَ مَعَهُ مِنْ طِيبِ الْجَنَّةِ.","bs":"Rekli su: „S njim je spušteno i nešto od džennetskih mirisa.“","ar_ranges":[],"ar_html":"وَقَالُوا: أُنْزِلَ مَعَهُ مِنْ طِيبِ الْجَنَّةِ.","bs_ranges":[],"bs_html":"Rekli su: „S njim je spušteno i nešto od džennetskih mirisa.“"},{"id":"127.7","ar":"وَقَالَ: أُنْزِلَ مَعَهُ الْحَجَرُ الأَسْوَدُ، وَكَانَ أَشَدَّ بَيَاضًا مِنَ الثَّلْجِ، وَعَصَا مُوسَى، وَكَانَتْ مِنْ آسِ الْجَنَّةِ، طُولُهَا عَشَرَةُ أَذْرُعٍ عَلَى طُولِ مُوسَى، ومر ولبان، ثُمَّ أُنْزِلَ عَلَيْهِ بَعْدَ ذَلِكَ العَلاةُ وَالمِطْرَقَةُ وَالْكَلْبَتَانِ، فَنَظَرَ آدَمُ","bs":"Rekao je: „S njim je spušten Crni kamen, koji je bio bjelji od snijega, i Musaov štap, koji je bio od džennetske mirte, dug deset lakata, prema Musaovoj visini, te mirra i tamjan. Zatim su mu poslije toga spušteni nakovanj, čekić i kliješta. Kada je spušten na planinu, Adem je pogledao","ar_ranges":[],"ar_html":"وَقَالَ: أُنْزِلَ مَعَهُ الْحَجَرُ الأَسْوَدُ، وَكَانَ أَشَدَّ بَيَاضًا مِنَ الثَّلْجِ، وَعَصَا مُوسَى، وَكَانَتْ مِنْ آسِ الْجَنَّةِ، طُولُهَا عَشَرَةُ أَذْرُعٍ عَلَى طُولِ مُوسَى، ومر ولبان، ثُمَّ أُنْزِلَ عَلَيْهِ بَعْدَ ذَلِكَ العَلاةُ وَالمِطْرَقَةُ وَالْكَلْبَتَانِ، فَنَظَرَ آدَمُ","bs_ranges":[],"bs_html":"Rekao je: „S njim je spušten Crni kamen, koji je bio bjelji od snijega, i Musaov štap, koji je bio od džennetske mirte, dug deset lakata, prema Musaovoj visini, te mirra i tamjan. Zatim su mu poslije toga spušteni nakovanj, čekić i kliješta. Kada je spušten na planinu, Adem je pogledao"}],"notes":[]}]}</script><script id="databaseData" type="application/json">[{"stranica":103,"ar_tekst":"لِلْمَلائِكَةِ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» إِلَى «وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، فَكَانَ الَّذِي أَبْدَوْا حِينَ قالُوا: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وَكَانَ الَّذِي كَتَمُوا بَيْنَهُمْ قَوْلُهُمْ: لَنْ يَخْلُقَ رَبُّنَا خَلْقًا إِلا كُنَّا نَحْنُ أَعْلَمُ مِنْهُ وَأَكْرَمُ، فَعَرَفُوا أَنَّ اللَّهَ عَزَّ وَجَلَّ فَضَّلَ عَلَيْهِمْ آدَمَ فِي الْعِلْمِ وَالْكَرَمِ.","bs_tekst":"melekima: ‘Obavijestite Me o imenima ovih, ako istinu govorite’ — do: ‘I znam ono što pokazujete i ono što ste krili.’ Ono što su pokazali bilo je kada su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ A ono što su među sobom krili bile su njihove riječi: ‘Naš Gospodar neće stvoriti nijedno stvorenje a da mi ne budemo učeniji i ugledniji od njega.’ Tada su spoznali da je Allah, Silan i Uzvišen, odlikovao Adema nad njima u znanju i uglednosti.“ ⟦Prijevodi navedenih dijelova: El-Bekara, 2:31–33 i 2:30. Prijelaz „do“ nalazi se u izvornom tekstu.⟧"},{"stranica":103,"ar_tekst":"فَلَمَّا ظَهَرَ لِلْمَلائِكَةِ مِنَ اسْتِكْبَارِ إِبْلِيسَ مَا ظَهَرَ، وَمِنْ خِلافِهِ أَمْرَ رَبِّهِ مَا كَانَ مُسْتَتِرًا عَنْهُمْ مِنْ ذَلِكَ، عَاتَبَهُ رَبُّهُ عَلَى مَا أَظْهَرَ مِنْ مَعْصِيَتِهِ إِيَّاهُ بِتَرْكِهِ السُّجُودَ لآدَمَ، فَأَصَرَّ عَلَى مَعْصِيَتِهِ، وَأَقَامَ عَلَى غَيِّهِ وَطُغْيَانِهِ- لَعَنَهُ اللَّهُ- فَأَخْرَجَهُ مِنَ الْجَنَّةِ، وَطَرَدَهُ مِنْهَا، وَسَلَبَهُ مَا كَانَ آتَاهُ مِنْ مُلْكِ السَّمَاءِ الدُّنْيَا وَالأَرْضِ، وَعَزَلَهُ عن خزن الجنه فقال له جَلَّ جَلالُهُ: «فَاخْرُجْ مِنْها» ، يَعْنِي مِنَ الْجَنَّةِ «فَإِنَّكَ رَجِيمٌ وَإِنَّ عَلَيْكَ اللَّعْنَةَ إِلى يَوْمِ الدِّينِ» ، وَهُوَ بَعْدُ فِي السَّمَاءِ لَمْ يَهْبِطْ إِلَى الارض.","bs_tekst":"Kada su meleki vidjeli Iblisovu oholost i njegovo protivljenje naredbi svoga Gospodara, koje im je prije toga bilo skriveno, njegov Gospodar ukorio ga je zbog nepokornosti koju je pokazao odbijanjem sedžde Ademu. On je ustrajao u svojoj nepokornosti i ostao pri zabludi i osionosti — Allah ga prokleo. Zato ga je izveo iz Dženneta, protjerao iz njega, oduzeo mu vlast nad najbližim nebom i Zemljom koju mu je bio dao i razriješio ga čuvanja Dženneta. On, Uzvišeno je Njegovo veličanstvo, rekao mu je: „Zato izađi iz njega“ — misli se iz Dženneta — „jer si proklet. I na tebi je prokletstvo do Dana obračuna.“ Još je bio na nebu i nije bio spušten na Zemlju. ⟦Prijevod kur’anskog navoda: El-Hidžr, 15:34–35, navedeni dijelovi.⟧"},{"stranica":103,"ar_tekst":"واسكن اللَّهُ عَزَّ وَجَلَّ حِينَئِذٍ آدَمَ جَنَّتَهُ، كَمَا حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب رسول الله ص: فَأُخْرِجَ إِبْلِيسُ مِنَ الْجَنَّةِ حِينَ لُعِنَ وَأُسْكِنَ آدَمُ الْجَنَّةَ، فَكَانَ يَمْشِي فِيهَا وَحْشِيًّا لَيْسَ لَهُ زَوْجٌ يَسْكُنُ إِلَيْهَا، فَنَامَ نَوْمَةً فَاسْتَيْقَظَ، فَإِذَا عِنْدَ رَأْسِهِ امْرَأَةٌ قَاعِدَةٌ خَلَقَهَا اللَّهُ مِنْ ضِلْعِهِ، فَسَأَلَهَا: مَا أَنْتِ؟ قَالَتِ: امْرَأَةٌ، قَالَ: وَلِمَ خُلِقْتِ؟ قَالَتْ:","bs_tekst":"Allah, Silan i Uzvišen, tada je nastanio Adema u Svome Džennetu, kako mi je pričao Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem: „Iblis je izveden iz Dženneta kada je proklet, a Adem je nastanjen u Džennetu. Hodao je njime osamljen, bez supruge uz koju bi našao smiraj. Jednom je zaspao i probudio se, a kod njegove glave sjedila je žena koju je Allah stvorio od njegovog rebra. Upitao ju je: ‘Šta si ti?’ Odgovorila je: ‘Žena.’ Upitao je: ‘A zašto si stvorena?’ Odgovorila je:"},{"stranica":104,"ar_tekst":"لِتَسْكُنَ إِلَيَّ، قَالَتْ لَهُ الْمَلائِكَةُ يَنْظُرُونَ مَا بَلَغَ عِلْمُهُ: مَا اسْمُهَا يَا آدَمُ؟\n\nقَالَ: حَوَّاءُ، قَالُوا: لِمَ سُمِّيَتْ حَوَّاءَ؟ قَالَ: لأَنَّهَا خُلِقَتْ مِنْ شَيْءٍ حَيٍّ، فَقَالَ اللَّهُ تَعَالَى: «يا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما» .","bs_tekst":"‘Da uz mene nađeš smiraj.’ Meleki su ga, provjeravajući dokle doseže njegovo znanje, upitali: ‘Kako joj je ime, Ademe?’ Odgovorio je: ‘Havva.’ Pitali su: ‘Zašto je nazvana Havvom?’ Odgovorio je: ‘Zato što je stvorena od nečega živog.’ Uzvišeni Allah rekao je: ‘Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete.’“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:35, navedeni dio.⟧"},{"stranica":104,"ar_tekst":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال: لما فرغ الله تعالى من معاتبه ابليس اقبل على آدم ع وقد علمه الأسماء كلها، فقال: «يَا آدَمُ أَنْبِئْهُمْ بِأَسْمائِهِمْ» إِلَى «وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، قال: ثم ألقى السنة على آدم- فيما بلغنا عن أهل الكتاب من أهل التوراة وغيرهم من أهل العلم- عن عبد الله بن العباس وغيره، ثم أخذ ضلعا من أضلاعه من شقه الأيسر، ولأم مكانها لحما، وآدم ع نائم لم يهب من نومته، حتى خلق الله تعالى من ضلعه تلك زوجه حواء، فسواها امراه ليسكن إليها، فلما كشف عنه السنة وهب من نومته رآها إلى جنبه، فقال- فيما يزعمون والله أعلم: لحمي ودمي وزوجتي، فسكن إليها، فلما زوجه الله عز وجل وجعل له سكنا من نفسه، قال له قبلا: «يا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» .","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Kada je Uzvišeni Allah završio s ukoravanjem Iblisa, okrenuo se Ademu, alejhis-selam, kojeg je već poučio svim imenima, i rekao: ‘Ademe, obavijesti ih o njihovim imenima’ — do: ‘I znam ono što pokazujete i ono što ste krili.’“ Rekao je: „Zatim je na Adema spustio drijemež — prema onome što je do nas doprlo od sljedbenika Knjige, sljedbenika Tevrata i drugih učenih ljudi, od Abdullaha ibn Abbasa i drugih. Potom je uzeo jedno rebro s njegove lijeve strane i njegovo mjesto ispunio mesom, dok je Adem, alejhis-selam, spavao i nije se budio iz svoga sna. Uzvišeni Allah od toga njegovog rebra stvorio je njegovu suprugu Havvu, oblikovao je kao ženu da uz nju nađe smiraj. Kada je s njega uklonio drijemež i kada se probudio, vidio ju je uz sebe, pa je rekao — prema onome što tvrde, a Allah najbolje zna: ‘Moje meso, moja krv i moja supruga.’ Uz nju je našao smiraj. Kada ga je Allah, Silan i Uzvišen, oženio i od njega samoga načinio mu onu uz koju će naći smiraj, rekao mu je neposredno: ‘Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika.’“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:33, navedeni početak i završetak, s izvornim prijelazom „do“; El-Bekara, 2:35, navedeni dio.⟧"},{"stranica":104,"ar_tekst":"حَدَّثَنَا مُحَمَّدُ بْنُ عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى، عن ابن أبي نجيح، عن مجاهد فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَخَلَقَ مِنْها","bs_tekst":"Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa, od Ibn Ebu Nedžiha, od Mudžahida, o riječima Njega, Silnog i Uzvišenog: „I od nje je stvorio"},{"stranica":105,"ar_tekst":"زَوْجَها» قال: حواء من قصيرى آدم، وهو ناعم فَاسْتَيْقَظَ فَقَالَ:\n\nأثا بِالنَّبَطِيَّةِ، امْرَأَةٌ.","bs_tekst":"njenu suprugu.“ Rekao je: „Havvu od Ademovog krajnjeg rebra, dok je on bio u ugodi. Kada se probudio, rekao je: ‘Asa’ — na nabatejskom: žena.“ ⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: En-Nisa, 4:1, navedeni dio. Napomena prevodioca: izvor ima قصيرى آدم („Ademovo krajnje rebro“) i وهو ناعم („u ugodi“; na‘im), gdje se možda mislilo na نائم („spava“). Ta pretpostavka nije prešutno unesena u tekst. Za قصيرى u jezičkim opisima postoji više određenja položaja rebra (Ibn Manzur, Lisanul-arab, odrednica قصر); ovdje je preneseno „krajnje rebro“. Nabatejski izraz zapisan je أثا, bez oznaka za siguran izgovor; prenesen je približno kao „Asa“.⟧"},{"stranica":105,"ar_tekst":"حَدَّثَنَا المثنى، قال: حدثنا أبو حذيفة، قال: حدثنا شبل، عن ابن أبي نجيح، عن مجاهد مثله.","bs_tekst":"Pričao nam je Musenna, koji je rekao: pričao nam je Ebu Huzejfa, koji je rekao: pričao nam je Šibl, od Ibn Ebu Nedžiha, od Mudžahida, isto to."},{"stranica":105,"ar_tekst":"حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ: حَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ: «وَخَلَقَ مِنْها زَوْجَها» ، يَعْنِي حَوَّاءَ، خُلِقَتْ مِنْ آدَمَ مِنْ ضِلْعٍ مِنْ أَضْلاعِهِ","bs_tekst":"Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, o riječima: „I od nje je stvorio njenu suprugu“ — misli se na Havvu — stvorena je od Adema, od jednog njegovog rebra. ⟦Prijevod kur’anskog navoda: En-Nisa, 4:1, navedeni dio.⟧"},{"stranica":106,"ar_tekst":"[القول في ذكر امتحان الله تعالى أبانا آدم ع]","bs_tekst":"Rasprava o iskušavanju našeg oca Adema, alejhis-selam, od Uzvišenog Allaha"},{"stranica":106,"ar_tekst":"وابتلائه إياه بما امتحنه به من طاعته، وذكر ركوب آدم معصية ربه بعد الذي كان أعطاه من كرامته وشريف المنزلة عنده، ومكنه في جنته من رغد العيش وهنيئه، وما أزال ذلك عنه، فصار من نعيم الجنة ولذيذ رغد العيش إلى نكد عيش أهل الأرض وعلاج الحراثة والعمل بالمساحي والزراعة فيها.","bs_tekst":"I o tome kako ga je iskušao pokornošću, te o Ademovom činjenju grijeha prema svome Gospodaru nakon što mu je dao počast i uzvišen položaj kod Sebe, omogućio mu u Svome Džennetu obilan i ugodan život, i o onome što mu je to uklonilo. Tako je iz džennetskog uživanja i slasti obilnog života prešao u tegoban život stanovnika Zemlje, bavljenje oranjem, rad motikama i obrađivanje zemlje."},{"stranica":106,"ar_tekst":"فلما أسكن الله عز وجل آدم ع وزوجه اطلق لهما ان يأكلا كل ما شاء أكله من كل ما فيها من ثمارها، غير ثمر شجرة واحدة ابتلاء منه لهما بذلك، وليمضي قضاء الله فيهما وفي ذريتهما، كما قال عز وجل:\n«وَقُلْنا يَا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، فوسوس لهما الشيطان حتى زين لهما أكل ما نهاهما ربهما عن أكله من ثمر تلك الشجرة، وحسن لهما معصية الله في ذلك، حتى أكلا منها، فبدت لهما من سوآتهما ما كان موارى عنهما منها فكان وصول عدو الله إبليس إلى تزيين ذلك لهما ما ذكر في الخبر الذي حَدَّثَنِي موسى بن هارون الهمداني، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الْهَمْدَانِيِّ، عَنِ ابْنِ مَسْعُودٍ- وَعَنْ أُنَاسٍ مِنْ اصحاب النبي ص، قَالَ: لَمَّا قَالَ اللَّهُ عَزَّ وَجَلَّ لآدَمَ:\n«اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، أَرَادَ إِبْلِيسُ أَنْ يَدْخُلَ عَلَيْهِمَا الجنه","bs_tekst":"Kada je Allah, Silan i Uzvišen, nastanio Adema, alejhis-selam, i njegovu suprugu, dopustio im je da jedu šta god žele od svih plodova u Džennetu, osim ploda jednoga drveta, iskušavajući ih time i da se ostvari Allahova odredba o njima i njihovim potomcima, kako je rekao On, Silan i Uzvišen: „I rekli smo: Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika.“ Šejtan im je došaptavao dok im nije uljepšao jedenje ploda toga drveta koje im je njihov Gospodar zabranio i prikazao im nepokornost Allahu u tome kao nešto lijepo. Na kraju su jeli s njega, pa im se otkrilo od njihovih stidnih mjesta ono što im je bilo skriveno. Kako je Allahov neprijatelj Iblis uspio da im to uljepša navedeno je u predaji koju mi je pričao Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao: „Kada je Allah, Silan i Uzvišen, rekao Ademu: ‘Nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika’, Iblis je htio ući k njima u Džennet, ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:35, cijeli ajet i njegov ponovljeni dio.⟧"},{"stranica":107,"ar_tekst":"فمنعه الْخَزَنَةُ، فَأَتَى الْحَيَّةَ، وَهِيَ دَابَّةٌ لَهَا أَرْبَعُ قَوَائِمَ، كَأَنَّهَا الْبَعِيرُ، وَهِيَ كَأَحْسَنِ الدَّوَابِّ فَكَلَّمَهَا أَنْ تُدْخِلَهُ فِي فَمِهَا حَتَّى تَدْخُلَ بِهِ إِلَى آدَمَ، فَأَدْخَلَتْهُ فِي فَمِهَا، فَمَرَّتِ الْحَيَّةُ على الخزنه فدخلت وَهُمْ لا يَعْلَمُونَ، لِمَا أَرَادَ اللَّهُ عَزَّ وَجَلَّ مِنَ الأَمْرِ، فَكَلَّمَهُ مِنْ فَمِهَا وَلَمْ يُبَالِ كَلامَهُ، فَخَرَجَ إِلَيْهِ فَقَالَ: «يَا آدَمُ هَلْ أَدُلُّكَ عَلى شَجَرَةِ الْخُلْدِ وَمُلْكٍ لا يَبْلى» ، يَقُولُ: هَلْ أَدُلُّكَ عَلَى شَجَرَةٍ إِنْ أَكَلْتَ مِنْهَا كُنْتَ مَلِكًا مِثْلَ اللَّهِ تَبَارَكَ وَتَعَالَى أَوْ تَكُونَا مِنَ الْخَالِدِينَ فَلا تَمُوتَانِ أَبَدًا وَحَلَفَ لَهُمَا بِاللَّهِ إِنِّي لَكُمَا لَمِنَ النَّاصِحِينَ، وَإِنَّمَا أَرَادَ بِذَلِكَ أَنْ يُبْدِيَ لَهُمَا مَا تَوَارَى عَنْهُمَا مِنْ سَوْءَاتِهِمَا بِهَتْكِ لِبَاسِهِمَا، وَكَانَ قَدْ عَلِمَ أَنَّ لَهُمَا سَوْءَةً لِمَا كَانَ يَقْرَأُ مِنْ كُتُبِ الْمَلائِكَةِ، وَلَمْ يَكُنْ آدَمُ يَعْلَمُ ذَلِكَ، وَكَانَ لِبَاسُهُمَا الظُّفُرَ، فَأَبَى آدَمُ أَنْ يَأْكُلَ مِنْهَا، فَتَقَدَّمَتْ حَوَّاءُ فَأَكَلَتْ، ثُمَّ قَالَتْ: يَا آدَمُ كُلْ، فَإِنِّي قَدْ أَكَلْتُ، فلم يضرني، فلما اكل بدت لَهُما سَوْآتُهُما، وَطَفِقا يَخْصِفانِ عَلَيْهِما مِنْ وَرَقِ الْجَنَّةِ» .","bs_tekst":"ali su ga čuvari spriječili. Došao je zmiji, životinji s četiri noge, nalik devi, jednoj od najljepših životinja, i zamolio je da ga stavi u svoja usta kako bi s njim ušla kod Adema. Stavila ga je u usta, prošla pored čuvara i ušla, a oni nisu znali, zbog onoga što je Allah, Silan i Uzvišen, htio da se dogodi. Govorio je Ademu iz njenih usta, ali on nije mario za njegove riječi. Zatim mu je izašao i rekao: ‘Ademe, hoćeš li da te uputim na drvo vječnosti i vlast koja ne propada?’ To znači: ‘Hoćeš li da te uputim na drvo s kojeg ćeš, ako budeš jeo, postati vladar poput Allaha, Blagoslovljenog i Uzvišenog, ili ćete postati vječni i nikada nećete umrijeti?’ Zakleo im se Allahom: ‘Ja sam vam, doista, iskren savjetnik.’ Time je samo htio otkriti njihova stidna mjesta koja su im bila skrivena, razotkrivši njihovu odjeću. Već je znao da imaju stidna mjesta, iz onoga što je čitao u knjigama meleka, dok Adem to nije znao. Njihova odjeća bila je nokat. Adem je odbio jesti s drveta, pa je Havva prva pristupila i jela. Zatim je rekla: ‘Ademe, jedi! Ja sam već jela i nije mi naškodilo.’ Kada je on jeo, otkrila su im se stidna mjesta i počeli su po sebi spajati džennetsko lišće.“ ⟦Prijevod izričitog kur’anskog pitanja: Ta-Ha, 20:120, navedeni dio. Zakletva je prenesena prema El-A‘raf, 7:21. Završetak o pokrivanju lišćem odgovara El-A‘raf, 7:22, i Ta-Ha, 20:121. Riječi o „vladaru poput Allaha“ i odjeći od nokta pripadaju ovoj predaji.⟧"},{"stranica":107,"ar_tekst":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، عن ليث ابن أَبِي سُلَيْمٍ، عَنْ طَاوُسٍ الْيَمَانِيِّ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ عَدُوَّ اللَّهِ إِبْلِيسَ عَرَضَ نَفْسَهُ عَلَى دَوَابِّ الأَرْضِ: أَيِّهَا تَحْمِلُهُ حَتَّى تدخل بِهِ الْجَنَّةَ حَتَّى يُكَلِّمَ آدَمَ وَزَوْجَهُ، فَكُلُّ الدَّوَابِّ أَبَى ذَلِكَ عَلَيْهِ، حَتَّى كَلَّمَ الْحَيَّةَ، فَقَالَ لَهَا: أَمْنَعُكِ مِنْ بَنِي آدَمَ، فَأَنْتِ فِي ذِمَّتِي إِنْ أَنْتِ أَدْخَلْتِنِي الْجَنَّةَ، فَجَعَلَتْهُ بَيْنَ نَابَيْنِ مِنْ أَنْيَابِهَا ثُمَّ دَخَلَتْ بِهِ، فَكَلَّمَهُمَا مِنْ فَمِهَا وَكَانَتْ كَاسِيَةً تَمْشِي عَلَى أَرْبَعِ قَوَائِمَ، فَأَعْرَاهَا اللَّهُ تَعَالَى وَجَعَلَهَا تَمْشِي عَلَى بَطْنِهَا، قَالَ: يَقُولُ ابْنُ عَبَّاسٍ:\nاقْتُلُوهَا حَيْثُ وَجَدْتُمُوهَا، وَاخْفِرُوا ذِمَّةَ عَدُوِّ اللَّهِ فِيهَا","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, od Lejsa ibn Ebu Sulejma, od Tavusa el-Jemanija, od Ibn Abbasa, koji je rekao: „Allahov neprijatelj Iblis nudio se zemaljskim životinjama: koja bi ga ponijela i unijela u Džennet kako bi govorio Ademu i njegovoj supruzi. Sve životinje odbile su to, sve dok se nije obratio zmiji. Rekao joj je: ‘Zaštitit ću te od Ademovih potomaka. Bit ćeš pod mojom zaštitom ako me uneseš u Džennet.’ Stavila ga je između dvaju svojih očnjaka i ušla s njim. Govorio im je iz njenih usta. Ona je bila pokrivena i hodala na četiri noge, pa ju je Uzvišeni Allah ogolio i učinio da se kreće na trbuhu.“ Rekao je: Ibn Abbas govorio je: „Ubijajte je gdje god je nađete i prekršite zaštitu koju joj je dao Allahov neprijatelj.“"},{"stranica":108,"ar_tekst":"حدثنا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا عمر بن عبد الرحمن بن مهرب، قال: سمعت وهب بن منبه يقول:\nلما أسكن الله تعالى آدم وزوجته الجنة، ونهاه عن الشجرة، وكانت شجرة غصونها متشعب بعضها في بعض، وكان لها ثمر تأكله الملائكة لخلدهم، وهي الثمرة التي نهى الله عنها آدم وزوجته، فلما أراد إبليس أن يستزلهما دخل في جوف الحية، وكان للحية أربع قوائم، كأنها بختية من أحسن دابة خلقها الله تعالى، فلما دخلت الحيه الجنة خرج من جوفها إبليس، فأخذ من الشجرة التي نهى الله عنها آدم وزوجته، فجاء بها إلى حواء، فقال:\nانظري إلى هذه الشجرة، ما أطيب ريحها، وأطيب طعمها، وأحسن لونها! فأخذت حواء فأكلت منها، ثم ذهبت بها إلى آدم، فقالت: أنظر إلى هذه الشجرة ما أطيب ريحها، وأطيب طعمها، وأحسن لونها! فأكل منها آدم، فبدت لهما سوآتهما، فدخل آدم في جوف الشجرة، فناداه ربه: يا آدم، أين أنت؟ قال: أنا هذا يا رب، قال: ألا تخرج؟ قال: أستحي منك يا رب، قال: ملعونة الأرض التي خلقت منها لعنة حتى يتحول ثمارها شوكا! قال: ولم يكن في الجنة ولا في الأرض شجرة كانت أفضل من الطلح والسدر.","bs_tekst":"Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Omer ibn Abdurrahman ibn Mehreb, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: „Kada je Uzvišeni Allah nastanio Adema i njegovu suprugu u Džennetu i zabranio mu drvo — bilo je to drvo isprepletenih grana, s plodom koji su meleki jeli radi svoje vječnosti, a to je plod koji je Allah zabranio Ademu i njegovoj supruzi — Iblis ih je htio navesti da posrnu. Ušao je u utrobu zmije. Zmija je imala četiri noge, bila je poput dvogrbe deve, jedna od najljepših životinja koje je Uzvišeni Allah stvorio. Kada je zmija ušla u Džennet, Iblis je izašao iz njene utrobe i uzeo s drveta koje je Allah zabranio Ademu i njegovoj supruzi. Donio je to Havvi i rekao: ‘Pogledaj ovo drvo! Kako lijepo miriše, kako je lijepog okusa i lijepe boje!’ Havva je uzela i jela s njega, zatim to odnijela Ademu i rekla: ‘Pogledaj ovo drvo! Kako lijepo miriše, kako je lijepog okusa i lijepe boje!’ Adem je jeo s njega, pa su im se otkrila stidna mjesta. Adem je ušao u unutrašnjost drveta, a njegov Gospodar ga je dozvao: ‘Ademe, gdje si?’ Odgovorio je: ‘Evo me, Gospodaru moj.’ Rekao je: ‘Zar nećeš izaći?’ Odgovorio je: ‘Stidim Te se, Gospodaru moj.’ Rekao je: ‘Prokleta neka je zemlja od koje si stvoren, takvim prokletstvom da joj se plodovi pretvore u trnje!’“ Rekao je: „Ni u Džennetu ni na Zemlji nije bilo boljeg drveta od talha i sidra.“"},{"stranica":108,"ar_tekst":"ثم قال: يا حواء، أنت التي غررت عبدي، فإنك لا تحملين حملا إلا حملته كرها، فإذا أردت أن تضعي ما في بطنك أشرفت على الموت مرارا وقال للحية: أنت التي دخل الملعون في بطنك حتى غر عبدي، ملعونة أنت لعنة حتى تتحول قوائمك في بطنك، ولا يكن لك رزق إلا التراب، أنت عدوة بني آدم وهم أعداؤك، حيث لقيت أحدا منهم أخذت بعقبه، وحيث لقيك شدخ رأسك","bs_tekst":"„Zatim je rekao: ‘Havva, ti si obmanula Moga roba. Nijednu trudnoću nećeš nositi osim s teškoćom; a kada budeš trebala roditi ono što je u tvojoj utrobi, više puta približit ćeš se smrti.’ Zmiji je rekao: ‘Ti si ona u čiju je utrobu ušao prokletnik i obmanuo Moga roba. Prokleta si takvim prokletstvom da se tvoje noge povuku u tvoj trbuh i da ti opskrba bude samo zemlja. Ti si neprijateljica Ademovih potomaka, a oni su tvoji neprijatelji. Gdje god sretneš nekoga od njih, uhvatit ćeš ga za petu, a gdje god on sretne tebe, smrskat će ti glavu.’“ ⟦Napomena prevodioca: talh (الطلح) i sidr (السدر) nazivi su drveća u predaji; ovdje im nije nametnuta određena botanička identifikacija.⟧"},{"stranica":109,"ar_tekst":"قيل لوهب: وما كانت الملائكة تأكل؟ قال: يفعل الله ما يشاء.","bs_tekst":"Vehb je upitan: „A šta su meleki jeli?“ Odgovorio je: „Allah čini šta hoće.“"},{"stranica":109,"ar_tekst":"حَدَّثَنَا القاسم بن الحسن، قال: حدثنا الحسين بن داود، قال: حدثني حجاج، عن أبي معشر، عن محمد بن قيس، قال: نهى الله تعالى آدم وحواء أن يأكلا من شجرة واحدة في الجنة، ويأكلا منها رغدا حيث شاءا، فجاء الشيطان فدخل في جوف الحية، فكلم حواء، ووسوس إلى آدم فقال: «مَا نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» قال: فقطعت حواء الشجرة فدميت الشجرة، وسقط عنهما رياشهما الذي كان عليهما، «وَطَفِقا يَخْصِفانِ عَلَيْهِما مِنْ وَرَقِ الْجَنَّةِ وَناداهُما رَبُّهُما أَلَمْ أَنْهَكُما عَنْ تِلْكُمَا الشَّجَرَةِ وَأَقُلْ لَكُما إِنَّ الشَّيْطانَ لَكُما عَدُوٌّ مُبِينٌ» لم أكلتها وقد نهيتك عنها؟ قال: يا رب أطعمتني حواء، قال لحواء: لم أطعمته؟ قالت:\nأمرتني الحية، قال للحية: لم أمرتها؟ قالت: أمرني إبليس، قال: ملعون مدحور! أما أنت يا حواء، فكما أدميت الشجرة تدمين في كل هلال، وأما أنت يا حية، فأقطع قوائمك فتمشين جريا على وجهك، وسيشدخ رأسك من لقيك بالحجر، اهبطوا بعضكم لبعض عدو.","bs_tekst":"Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Ebu Ma‘šera, od Muhammeda ibn Kajsa, koji je rekao: „Uzvišeni Allah zabranio je Ademu i Havvi da jedu s jednog drveta u Džennetu, a inače su iz njega mogli jesti obilno odakle god su željeli. Šejtan je došao, ušao u utrobu zmije, govorio Havvi i došaptavao Ademu: ‘Vaš Gospodar zabranio vam je ovo drvo samo zato da ne postanete dva meleka ili da ne postanete vječni. I zakleo im se: Ja sam vam, doista, iskren savjetnik.’“ Rekao je: „Havva je zarezala drvo, pa je drvo prokrvarilo, a s njih je spala raskošna odjeća koju su nosili. ‘I počeli su po sebi spajati džennetsko lišće. Njihov ih Gospodar dozva: Zar vam nisam zabranio to drvo i rekao vam da vam je šejtan otvoreni neprijatelj?’ ‘Zašto si jeo s njega kada sam ti ga zabranio?’ Odgovorio je: ‘Gospodaru moj, Havva me nahranila.’ Rekao je Havvi: ‘Zašto si ga nahranila?’ Odgovorila je: ‘Zmija mi je naredila.’ Rekao je zmiji: ‘Zašto si joj naredila?’ Odgovorila je: ‘Iblis mi je naredio.’ Rekao je: ‘Proklet i odbačen! A ti, Havva, kao što si raskrvarila drvo, krvarit ćeš pri svakom mlađaku. A tebi, zmijo, odsjeći ću noge, pa ćeš se brzo kretati na svome licu. Ko god te sretne smrskat će ti glavu kamenom. Siđite; jedni drugima bit ćete neprijatelji.’“ ⟦Prijevodi izričitih kur’anskih navoda: El-A‘raf, 7:20–22, navedeni dijelovi. Završna naredba prenosi izraz iz El-Bekara, 2:36, i El-A‘raf, 7:24.⟧"},{"stranica":109,"ar_tekst":"حدثت عن عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع، قال: حَدَّثَنِي محدث أن الشيطان دخل الجنة في صورة دابة ذات قوائم، فكان يرى أنه البعير، قال: فلعن فسقطت قوائمه فصار حية.","bs_tekst":"Preneseno mi je od Ammara ibn el-Hasena, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, koji je rekao: „Pričao mi je jedan pripovjedač da je šejtan ušao u Džennet u liku četveronožne životinje. Smatralo se da je to bila deva.“ Rekao je: „Proklet je, pa su mu otpale noge i postao je zmija.“"},{"stranica":109,"ar_tekst":"حدثت عن عمار، قال: حَدَّثَنَا عبد الله بن أبي جعفر، عن","bs_tekst":"Preneseno mi je od Ammara, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od"},{"stranica":110,"ar_tekst":"أبيه، عن الربيع قال: وحدثني أبو العالية، قال: إن من الإبل ما كان أولها من الجن قال: فأبيحت له الجنة كلها- يعنى آدم- الا الشجرة، وقيل لهما: «لا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، قال: فأتى الشيطان حواء فبدأ بها، فقال: نهيتما عن شيء؟ قالت: نعم، عن هذه الشجرة، فقال:\n«ما نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ» قال: فبدت حواء فأكلت منها، ثم أمرت آدم فأكل منها قال: وكانت شجرة، من أكل منها أحدث، قال: ولا ينبغي أن يكون في الجنة حدث، قال: «فَأَزَلَّهُمَا الشَّيْطانُ عَنْها فَأَخْرَجَهُما مِمَّا كَانَا فِيهِ» ، قال: فأخرج آدم من الجنة.","bs_tekst":"svoga oca, od Rebie, koji je rekao: „Pričao mi je i Ebu Alija, koji je rekao: ‘Nekim je devama početak bio među džinima.’“ Rekao je: „Dopušten mu je cijeli Džennet — misli se Ademu — osim drveta. Njima dvoma rečeno je: ‘Ne približavajte se ovom drvetu, pa da budete od nepravednika.’“ Rekao je: „Šejtan je došao Havvi, počevši od nje, i rekao: ‘Je li vam nešto zabranjeno?’ Odgovorila je: ‘Jeste, ovo drvo.’ Rekao je: ‘Vaš Gospodar zabranio vam je ovo drvo samo zato da ne postanete dva meleka ili da ne postanete vječni.’“ Rekao je: „Havva je prva pristupila i jela s njega, zatim je naredila Ademu pa je i on jeo.“ Rekao je: „Bilo je to drvo s kojeg bi onaj ko jede obavio nuždu.“ Rekao je: „A u Džennetu ne priliči da se obavlja nužda.“ Rekao je: „‘Šejtan ih je naveo da zbog njega posrnu i izveo ih iz onoga u čemu su bili.’“ Rekao je: „Adem je izveden iz Dženneta.“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:35, navedeni dio; El-A‘raf, 7:20, navedeni dio; El-Bekara, 2:36, navedeni dio.⟧"},{"stranica":110,"ar_tekst":"حَدَّثَنَا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ بَعْضِ أَهْلِ العلم أن آدم ع حين دخل الجنة ورأى ما فيها من الكرامة، وما أعطاه الله منها، قال: لو أنا خلدنا! فاغتمز فيها منه الشيطان لما سمعها منه، فأتاه من قبل الخلد.","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Muhammed ibn Ishak, od nekih učenih ljudi, da je Adem, alejhis-selam, kada je ušao u Džennet i vidio počasti u njemu i ono što mu je Allah od njega dao, rekao: „Kada bismo samo ostali vječno!“ Kada je šejtan to od njega čuo, našao je u tome njegovu slabu tačku i prišao mu s pitanjem vječnosti."},{"stranica":110,"ar_tekst":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال:\n\nحدثت أن أول ما ابتدأهما به من كيده إياهما أنه ناح عليهما نياحة أحزنتهما حين سمعاها، فقالا له: ما يبكيك؟ قال: أبكي عليكما،","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Preneseno mi je da je prva njegova spletka njima dvoma bila da je nad njima počeo naricati naricanjem koje ih je rastužilo kada su ga čuli. Pitali su ga: ‘Zašto plačeš?’ Odgovorio je: ‘Plačem zbog vas;"},{"stranica":111,"ar_tekst":"تموتان فتفارقان ما أنتما فيه من النعمة والكرامة فوقع ذلك في أنفسهما، ثم أتاهما فوسوس إليهما، فقال: يا آدم هل أدلك على شجرة الخلد وملك لا يبلى؟ وقال: «ما نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» ، أي تكونان ملكين أو تخلدان، أي إن لم تكونا ملكين في نعمة الجنة فلا تموتان يقول الله عز وجل: «فَدَلَّاهُما بِغُرُورٍ» .","bs_tekst":"umrijet ćete i napustiti blagodati i počasti u kojima ste.’ To im je ostalo u duši. Zatim im je došao i došaptavao: ‘Ademe, hoćeš li da te uputim na drvo vječnosti i vlast koja ne propada?’ Rekao je i: ‘Vaš Gospodar zabranio vam je ovo drvo samo zato da ne postanete dva meleka ili da ne postanete vječni. I zakleo im se: Ja sam vam, doista, iskren savjetnik.’ To jest: postat ćete dva meleka ili ćete ostati vječno; odnosno, ako i ne postanete dva meleka u džennetskim blagodatima, nećete umrijeti. Allah, Silan i Uzvišen, kaže: ‘Pa ih je obmanom spustio.’“ ⟦Prijevodi kur’anskih riječi unutar predaje: Ta-Ha, 20:120, navedeni dio; El-A‘raf, 7:20–22, navedeni dijelovi.⟧"},{"stranica":111,"ar_tekst":"حدثني يونس، قال أخبرنا ابن وهب، قال: قال ابن زيد في قوله سبحانه وتعالى: «فَوَسْوَسَ» : وسوس الشيطان إلى حواء في الشجرة حتى اتى بها إليها، ثم حسنتها في عين آدم، قال: فدعاها آدم لحاجته، قالت:\nلا: الا ان تأتي هاهنا، فلما أتى قالت: لا، إلا أن تأكل من هذه الشجرة، قال: فأكلا منها، فبدت لهما سوءاتهما قال: وذهب آدم هاربا في الجنة، فناداه ربه: يا آدم، أمني تفر؟ قال: لا يا رب، ولكن حياء منك، قال: يا آدم، انى اتيت؟ قال: من قبل حواء يا رب، فقال الله عز وجل: فإن لها علي أن أدميها في كل شهر مرة، كما أدمت هذه الشجرة، وأن أجعلها سفيهة، وقد كنت خلقتها حليمة، وأن أجعلها تحمل كرها وتضع كرها، وقد كنت جعلتها تحمل يسرا وتضع يسرا قال ابن زيد: ولولا البلية التي أصابت حواء لكان نساء أهل الدنيا لا يحضن، ولكن حليمات، ولكن يحملن يسرا،.\nويضعن يسرا.","bs_tekst":"Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, o riječima Njega, Slavljenog i Uzvišenog: „Pa je došaptavao“: „Šejtan je došaptavao Havvi o drvetu, sve dok joj ga nije donio. Zatim ga je ona uljepšala u Ademovim očima.“ Rekao je: „Adem ju je pozvao radi svoje potrebe, a ona je rekla: ‘Ne, osim ako dođeš ovamo.’ Kada je došao, rekla je: ‘Ne, osim ako jedeš s ovoga drveta.’“ Rekao je: „Oboje su jeli s njega, pa su im se otkrila stidna mjesta.“ Rekao je: „Adem je potrčao bježeći po Džennetu. Njegov Gospodar dozvao ga je: ‘Ademe, zar bježiš od Mene?’ Odgovorio je: ‘Ne, Gospodaru moj, nego zbog stida pred Tobom.’ Rekao je: ‘Ademe, s koje si strane doveden u to?’ Odgovorio je: ‘S Havvine strane, Gospodaru moj.’ Allah, Silan i Uzvišen, rekao je: ‘Ona će zato od Mene imati da jednom svakog mjeseca prokrvari, kao što je raskrvarila ovo drvo, i da je učinim lakomislenom, a stvorio sam je razboritom; da nosi trudnoću s teškoćom i rađa s teškoćom, a bio sam joj dao da trudnoću nosi lahko i rađa lahko.’“ Ibn Zejd je rekao: „Da nije iskušenja koje je zadesilo Havvu, žene ovoga svijeta ne bi imale mjesečnicu; bile bi razborite, lahko bi nosile trudnoću i lahko rađale.“ ⟦„Pa je došaptavao“ prijevod je početka izraza فوسوس u El-A‘raf, 7:20, i Ta-Ha, 20:120. Preostale tvrdnje u ovom odlomku prenose sadržaj Ibn Zejdove predaje.⟧"},{"stranica":111,"ar_tekst":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ يَزِيدَ بْنِ عَبْدِ الله بن قسيط، عن سعيد بن المسيب، قال: سمعته يحلف بالله ما يستثني: ما أكل آدم من الشجرة وهو يعقل، ولكن حواء سقته","bs_tekst":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, od Jezida ibn Abdullaha ibn Kusajta, od Seida ibn el-Musejjeba, koji je rekao: „Čuo sam ga kako se zaklinje Allahom, bez izuzetka: ‘Adem nije jeo s drveta dok je bio pri razumu, nego ga je Havva napojila"},{"stranica":112,"ar_tekst":"الخمر حتى إذا سكر قادته إليها، فأكل منها فلما واقع آدم وحواء الخطيئة، أخرجهما الله تعالى من الجنه وسلبهما ما كانا فيه من النعمة والكرامة، وأهبطهما وعدوهما إبليس والحية إلى الأرض، فقال لهم ربهم: اهبطوا بعضكم لبعض عدو.","bs_tekst":"vinom. Kada se opio, odvela ga je do drveta i jeo je s njega.’“ Kada su Adem i Havva počinili grijeh, Uzvišeni Allah izveo ih je iz Dženneta, oduzeo im blagodat i počast u kojima su bili i spustio njih dvoje, njihovog neprijatelja Iblisa i zmiju na Zemlju. Njihov Gospodar rekao im je: „Siđite; jedni drugima bit ćete neprijatelji.“"},{"stranica":112,"ar_tekst":"وكالذي قلنا في ذلك قال السلف من أهل العلم.","bs_tekst":"Isto kao što smo mi o tome rekli govorili su učeni prethodnici."},{"stranica":112,"ar_tekst":"حَدَّثَنِي يُونُسُ، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: حَدَّثَنَا عَبْدُ الرحمن ابن مَهْدِيٍّ، عَنْ إِسْرَائِيلَ، عَنْ إِسْمَاعِيلَ السُّدِّيِّ، قَالَ: حَدَّثَنِي مَنْ سَمِعَ ابْنَ عَبَّاسٍ يَقُولُ: «اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، قَالَ: آدَمُ وَحَوَّاءُ وَإِبْلِيسُ وَالْحَيَّةُ.","bs_tekst":"Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: pričao nam je Abdurrahman ibn Mehdi, od Israila, od Ismaila es-Suddija, koji je rekao: pričao mi je onaj ko je čuo Ibn Abbasa kako, o riječima: „Siđite; jedni drugima bit ćete neprijatelji“, govori: „Adem, Havva, Iblis i zmija.“ ⟦Prijevod kur’anskog navoda: izraz se nalazi u El-Bekara, 2:36, i El-A‘raf, 7:24.⟧"},{"stranica":112,"ar_tekst":"حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، وَمُوسَى بْنُ هَارُونَ، قَالا: حَدَّثَنَا عمرو ابن حَمَّادٍ، عَنْ أَسْبَاطٍ، عَنِ السُّدِّيِّ- فِي خَبَرٍ ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابْنِ مَسْعُودٍ- وَعَنْ نَاسٍ مِنْ أَصْحَابِ رَسُولِ الله ص: «اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، فَلَعَنَ الْحَيَّةَ فَقَطَعَ قَوَائِمَهَا، وَتَرَكَهَا تَمْشِي عَلَى بَطْنِهَا، وَجَعَلَ رِزْقَهَا مِنَ التُّرَابِ، وَأَهْبَطَ إِلَى الأَرْضِ آدَمَ وَحَوَّاءَ وَإِبْلِيسَ وَالْحَيَّةَ.","bs_tekst":"Pričali su nam Sufjan ibn Veki‘ i Musa ibn Harun; obojica su rekli: pričao nam je Amr ibn Hammad, od Esbata, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, o riječima: „Siđite; jedni drugima bit ćete neprijatelji.“ „Prokleo je zmiju, odsjekao joj noge, ostavio je da se kreće na trbuhu i dao joj da joj opskrba bude zemlja. Na Zemlju je spustio Adema, Havvu, Iblisa i zmiju.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:36, i El-A‘raf, 7:24, navedeni dio.⟧"},{"stranica":112,"ar_tekst":"حَدَّثَنِي محمد بن عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى بن
