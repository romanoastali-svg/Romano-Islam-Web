<!doctype html><html lang="bs"><head><meta charset="utf-8"><title>Taberi · tom 1 · 103–127</title></head><body><script id="partData" type="application/json">{"id":"01-005","start":103,"end":127,"pages":[{"n":103,"html":"\u003csection class=\"page\" data-page=\"103\" id=\"stranica-103\">\u003ch2>Stranica 103\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 103\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"103.1\" id=\"ar-odlomak-103-1\">لِلْمَلائِكَةِ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» إِلَى «وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، فَكَانَ الَّذِي أَبْدَوْا حِينَ قالُوا: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وَكَانَ الَّذِي كَتَمُوا بَيْنَهُمْ قَوْلُهُمْ: لَنْ يَخْلُقَ رَبُّنَا خَلْقًا إِلا كُنَّا نَحْنُ أَعْلَمُ مِنْهُ وَأَكْرَمُ، فَعَرَفُوا أَنَّ اللَّهَ عَزَّ وَجَلَّ فَضَّلَ عَلَيْهِمْ آدَمَ فِي الْعِلْمِ وَالْكَرَمِ.\u003c/p>\u003cp data-pair=\"103.2\" id=\"ar-odlomak-103-2\">فَلَمَّا ظَهَرَ لِلْمَلائِكَةِ مِنَ اسْتِكْبَارِ إِبْلِيسَ مَا ظَهَرَ، وَمِنْ خِلافِهِ أَمْرَ رَبِّهِ مَا كَانَ مُسْتَتِرًا عَنْهُمْ مِنْ ذَلِكَ، عَاتَبَهُ رَبُّهُ عَلَى مَا أَظْهَرَ مِنْ مَعْصِيَتِهِ إِيَّاهُ بِتَرْكِهِ السُّجُودَ لآدَمَ، فَأَصَرَّ عَلَى مَعْصِيَتِهِ، وَأَقَامَ عَلَى غَيِّهِ وَطُغْيَانِهِ- لَعَنَهُ اللَّهُ- فَأَخْرَجَهُ مِنَ الْجَنَّةِ، وَطَرَدَهُ مِنْهَا، وَسَلَبَهُ مَا كَانَ آتَاهُ مِنْ مُلْكِ السَّمَاءِ الدُّنْيَا وَالأَرْضِ، وَعَزَلَهُ عن خزن الجنه فقال له جَلَّ جَلالُهُ: «فَاخْرُجْ مِنْها» ، يَعْنِي مِنَ الْجَنَّةِ «فَإِنَّكَ رَجِيمٌ وَإِنَّ عَلَيْكَ اللَّعْنَةَ إِلى يَوْمِ الدِّينِ» ، وَهُوَ بَعْدُ فِي السَّمَاءِ لَمْ يَهْبِطْ إِلَى الارض.\u003c/p>\u003cp data-pair=\"103.3\" id=\"ar-odlomak-103-3\">واسكن اللَّهُ عَزَّ وَجَلَّ حِينَئِذٍ آدَمَ جَنَّتَهُ، كَمَا \u003cspan class=\"isnad\">حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب رسول الله ص: \u003c/span>فَأُخْرِجَ إِبْلِيسُ مِنَ الْجَنَّةِ حِينَ لُعِنَ وَأُسْكِنَ آدَمُ الْجَنَّةَ، فَكَانَ يَمْشِي فِيهَا وَحْشِيًّا لَيْسَ لَهُ زَوْجٌ يَسْكُنُ إِلَيْهَا، فَنَامَ نَوْمَةً فَاسْتَيْقَظَ، فَإِذَا عِنْدَ رَأْسِهِ امْرَأَةٌ قَاعِدَةٌ خَلَقَهَا اللَّهُ مِنْ ضِلْعِهِ، فَسَأَلَهَا: مَا أَنْتِ؟ قَالَتِ: امْرَأَةٌ، قَالَ: وَلِمَ خُلِقْتِ؟ قَالَتْ:\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 103\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"103.1\" id=\"odlomak-103-1\">melekima: ‘Obavijestite Me o imenima ovih, ako istinu govorite’ — do: ‘I znam ono što pokazujete i ono što ste krili.’ Ono što su pokazali bilo je kada su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ A ono što su među sobom krili bile su njihove riječi: ‘Naš Gospodar neće stvoriti nijedno stvorenje a da mi ne budemo učeniji i ugledniji od njega.’ Tada su spoznali da je Allah, Silan i Uzvišen, odlikovao Adema nad njima u znanju i uglednosti.“ \u003cspan class=\"translator-note\">⟦Prijevodi navedenih dijelova: El-Bekara, 2:31–33 i 2:30. Prijelaz „do“ nalazi se u izvornom tekstu.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"103.2\" id=\"odlomak-103-2\">Kada su meleki vidjeli Iblisovu oholost i njegovo protivljenje naredbi svoga Gospodara, koje im je prije toga bilo skriveno, njegov Gospodar ukorio ga je zbog nepokornosti koju je pokazao odbijanjem sedžde Ademu. On je ustrajao u svojoj nepokornosti i ostao pri zabludi i osionosti — Allah ga prokleo. Zato ga je izveo iz Dženneta, protjerao iz njega, oduzeo mu vlast nad najbližim nebom i Zemljom koju mu je bio dao i razriješio ga čuvanja Dženneta. On, Uzvišeno je Njegovo veličanstvo, rekao mu je: „Zato izađi iz njega“ — misli se iz Dženneta — „jer si proklet. I na tebi je prokletstvo do Dana obračuna.“ Još je bio na nebu i nije bio spušten na Zemlju. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Hidžr, 15:34–35, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"103.3\" id=\"odlomak-103-3\">Allah, Silan i Uzvišen, tada je nastanio Adema u Svome Džennetu, kako \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem: \u003c/span>„Iblis je izveden iz Dženneta kada je proklet, a Adem je nastanjen u Džennetu. Hodao je njime osamljen, bez supruge uz koju bi našao smiraj. Jednom je zaspao i probudio se, a kod njegove glave sjedila je žena koju je Allah stvorio od njegovog rebra. Upitao ju je: ‘Šta si ti?’ Odgovorila je: ‘Žena.’ Upitao je: ‘A zašto si stvorena?’ Odgovorila je:\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":104,"html":"\u003csection class=\"page\" data-page=\"104\" id=\"stranica-104\">\u003ch2>Stranica 104\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 104\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"104.1\" id=\"ar-odlomak-104-1\">لِتَسْكُنَ إِلَيَّ، قَالَتْ لَهُ الْمَلائِكَةُ يَنْظُرُونَ مَا بَلَغَ عِلْمُهُ: مَا اسْمُهَا يَا آدَمُ؟\n\nقَالَ: حَوَّاءُ، قَالُوا: لِمَ سُمِّيَتْ حَوَّاءَ؟ قَالَ: لأَنَّهَا خُلِقَتْ مِنْ شَيْءٍ حَيٍّ، فَقَالَ اللَّهُ تَعَالَى: «يا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما» .\u003c/p>\u003cp data-pair=\"104.2\" id=\"ar-odlomak-104-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال: \u003c/span>لما فرغ الله تعالى من معاتبه ابليس اقبل على آدم ع وقد علمه الأسماء كلها، فقال: «يَا آدَمُ أَنْبِئْهُمْ بِأَسْمائِهِمْ» إِلَى «وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، قال: ثم ألقى السنة على آدم- فيما بلغنا عن أهل الكتاب من أهل التوراة وغيرهم من أهل العلم- عن عبد الله بن العباس وغيره، ثم أخذ ضلعا من أضلاعه من شقه الأيسر، ولأم مكانها لحما، وآدم ع نائم لم يهب من نومته، حتى خلق الله تعالى من ضلعه تلك زوجه حواء، فسواها امراه ليسكن إليها، فلما كشف عنه السنة وهب من نومته رآها إلى جنبه، فقال- فيما يزعمون والله أعلم: لحمي ودمي وزوجتي، فسكن إليها، فلما زوجه الله عز وجل وجعل له سكنا من نفسه، قال له قبلا: «يا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» .\u003c/p>\u003cp data-pair=\"104.3\" id=\"ar-odlomak-104-3\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى، عن ابن أبي نجيح، عن مجاهد \u003c/span>فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَخَلَقَ مِنْها\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 104\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"104.1\" id=\"odlomak-104-1\">‘Da uz mene nađeš smiraj.’ Meleki su ga, provjeravajući dokle doseže njegovo znanje, upitali: ‘Kako joj je ime, Ademe?’ Odgovorio je: ‘Havva.’ Pitali su: ‘Zašto je nazvana Havvom?’ Odgovorio je: ‘Zato što je stvorena od nečega živog.’ Uzvišeni Allah rekao je: ‘Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:35, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"104.2\" id=\"odlomak-104-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: \u003c/span>„Kada je Uzvišeni Allah završio s ukoravanjem Iblisa, okrenuo se Ademu, alejhis-selam, kojeg je već poučio svim imenima, i rekao: ‘Ademe, obavijesti ih o njihovim imenima’ — do: ‘I znam ono što pokazujete i ono što ste krili.’“ Rekao je: „Zatim je na Adema spustio drijemež — prema onome što je do nas doprlo od sljedbenika Knjige, sljedbenika Tevrata i drugih učenih ljudi, od Abdullaha ibn Abbasa i drugih. Potom je uzeo jedno rebro s njegove lijeve strane i njegovo mjesto ispunio mesom, dok je Adem, alejhis-selam, spavao i nije se budio iz svoga sna. Uzvišeni Allah od toga njegovog rebra stvorio je njegovu suprugu Havvu, oblikovao je kao ženu da uz nju nađe smiraj. Kada je s njega uklonio drijemež i kada se probudio, vidio ju je uz sebe, pa je rekao — prema onome što tvrde, a Allah najbolje zna: ‘Moje meso, moja krv i moja supruga.’ Uz nju je našao smiraj. Kada ga je Allah, Silan i Uzvišen, oženio i od njega samoga načinio mu onu uz koju će naći smiraj, rekao mu je neposredno: ‘Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:33, navedeni početak i završetak, s izvornim prijelazom „do“; El-Bekara, 2:35, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"104.3\" id=\"odlomak-104-3\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa, od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „I od nje je stvorio\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":105,"html":"\u003csection class=\"page\" data-page=\"105\" id=\"stranica-105\">\u003ch2>Stranica 105\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 105\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"105.1\" id=\"ar-odlomak-105-1\">زَوْجَها» قال: حواء من قصيرى آدم، وهو ناعم فَاسْتَيْقَظَ فَقَالَ:\n\nأثا بِالنَّبَطِيَّةِ، امْرَأَةٌ.\u003c/p>\u003cp data-pair=\"105.2\" id=\"ar-odlomak-105-2\">\u003cspan class=\"isnad\">حَدَّثَنَا المثنى، قال: حدثنا أبو حذيفة، قال: حدثنا شبل، عن ابن أبي نجيح، عن مجاهد \u003c/span>مثله.\u003c/p>\u003cp data-pair=\"105.3\" id=\"ar-odlomak-105-3\">\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ: حَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ: \u003c/span>«وَخَلَقَ مِنْها زَوْجَها» ، يَعْنِي حَوَّاءَ، خُلِقَتْ مِنْ آدَمَ مِنْ ضِلْعٍ مِنْ أَضْلاعِهِ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 105\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"105.1\" id=\"odlomak-105-1\">njenu suprugu.“ Rekao je: „Havvu od Ademovog krajnjeg rebra, dok je on bio u ugodi. Kada se probudio, rekao je: ‘Asa’ — na nabatejskom: žena.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: En-Nisa, 4:1, navedeni dio. Napomena prevodioca: izvor ima قصيرى آدم („Ademovo krajnje rebro“) i وهو ناعم („u ugodi“; na‘im), gdje se možda mislilo na نائم („spava“). Ta pretpostavka nije prešutno unesena u tekst. Za قصيرى u jezičkim opisima postoji više određenja položaja rebra (Ibn Manzur, Lisanul-arab, odrednica قصر); ovdje je preneseno „krajnje rebro“. Nabatejski izraz zapisan je أثا, bez oznaka za siguran izgovor; prenesen je približno kao „Asa“.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"105.2\" id=\"odlomak-105-2\">\u003cspan class=\"isnad\">Pričao nam je Musenna, koji je rekao: pričao nam je Ebu Huzejfa, koji je rekao: pričao nam je Šibl, od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>isto to.\u003c/p>\u003cp data-pair=\"105.3\" id=\"odlomak-105-3\">\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, \u003c/span>o riječima: „I od nje je stvorio njenu suprugu“ — misli se na Havvu — stvorena je od Adema, od jednog njegovog rebra. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Nisa, 4:1, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":106,"html":"\u003csection class=\"page\" data-page=\"106\" id=\"stranica-106\">\u003ch2>Stranica 106\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 106\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"106.1\" id=\"ar-odlomak-106-1\">[القول في ذكر امتحان الله تعالى أبانا آدم ع]\u003c/p>\u003cp data-pair=\"106.2\" id=\"ar-odlomak-106-2\">وابتلائه إياه بما امتحنه به من طاعته، وذكر ركوب آدم معصية ربه بعد الذي كان أعطاه من كرامته وشريف المنزلة عنده، ومكنه في جنته من رغد العيش وهنيئه، وما أزال ذلك عنه، فصار من نعيم الجنة ولذيذ رغد العيش إلى نكد عيش أهل الأرض وعلاج الحراثة والعمل بالمساحي والزراعة فيها.\u003c/p>\u003cp data-pair=\"106.3\" id=\"ar-odlomak-106-3\">فلما أسكن الله عز وجل آدم ع وزوجه اطلق لهما ان يأكلا كل ما شاء أكله من كل ما فيها من ثمارها، غير ثمر شجرة واحدة ابتلاء منه لهما بذلك، وليمضي قضاء الله فيهما وفي ذريتهما، كما قال عز وجل:\n«وَقُلْنا يَا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، فوسوس لهما الشيطان حتى زين لهما أكل ما نهاهما ربهما عن أكله من ثمر تلك الشجرة، وحسن لهما معصية الله في ذلك، حتى أكلا منها، فبدت لهما من سوآتهما ما كان موارى عنهما منها فكان وصول عدو الله إبليس إلى تزيين ذلك لهما ما ذكر في الخبر الذي \u003cspan class=\"isnad\">حَدَّثَنِي موسى بن هارون الهمداني، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الْهَمْدَانِيِّ، عَنِ ابْنِ مَسْعُودٍ- وَعَنْ أُنَاسٍ مِنْ اصحاب النبي ص، قَالَ: \u003c/span>لَمَّا قَالَ اللَّهُ عَزَّ وَجَلَّ لآدَمَ:\n«اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، أَرَادَ إِبْلِيسُ أَنْ يَدْخُلَ عَلَيْهِمَا الجنه\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 106\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"106.1\" id=\"odlomak-106-1\">Rasprava o iskušavanju našeg oca Adema, alejhis-selam, od Uzvišenog Allaha\u003c/p>\u003cp data-pair=\"106.2\" id=\"odlomak-106-2\">I o tome kako ga je iskušao pokornošću, te o Ademovom činjenju grijeha prema svome Gospodaru nakon što mu je dao počast i uzvišen položaj kod Sebe, omogućio mu u Svome Džennetu obilan i ugodan život, i o onome što mu je to uklonilo. Tako je iz džennetskog uživanja i slasti obilnog života prešao u tegoban život stanovnika Zemlje, bavljenje oranjem, rad motikama i obrađivanje zemlje.\u003c/p>\u003cp data-pair=\"106.3\" id=\"odlomak-106-3\">Kada je Allah, Silan i Uzvišen, nastanio Adema, alejhis-selam, i njegovu suprugu, dopustio im je da jedu šta god žele od svih plodova u Džennetu, osim ploda jednoga drveta, iskušavajući ih time i da se ostvari Allahova odredba o njima i njihovim potomcima, kako je rekao On, Silan i Uzvišen: „I rekli smo: Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika.“ Šejtan im je došaptavao dok im nije uljepšao jedenje ploda toga drveta koje im je njihov Gospodar zabranio i prikazao im nepokornost Allahu u tome kao nešto lijepo. Na kraju su jeli s njega, pa im se otkrilo od njihovih stidnih mjesta ono što im je bilo skriveno. Kako je Allahov neprijatelj Iblis uspio da im to uljepša navedeno je u predaji koju \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao: \u003c/span>„Kada je Allah, Silan i Uzvišen, rekao Ademu: ‘Nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika’, Iblis je htio ući k njima u Džennet, \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:35, cijeli ajet i njegov ponovljeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":107,"html":"\u003csection class=\"page\" data-page=\"107\" id=\"stranica-107\">\u003ch2>Stranica 107\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 107\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"107.1\" id=\"ar-odlomak-107-1\">فمنعه الْخَزَنَةُ، فَأَتَى الْحَيَّةَ، وَهِيَ دَابَّةٌ لَهَا أَرْبَعُ قَوَائِمَ، كَأَنَّهَا الْبَعِيرُ، وَهِيَ كَأَحْسَنِ الدَّوَابِّ فَكَلَّمَهَا أَنْ تُدْخِلَهُ فِي فَمِهَا حَتَّى تَدْخُلَ بِهِ إِلَى آدَمَ، فَأَدْخَلَتْهُ فِي فَمِهَا، فَمَرَّتِ الْحَيَّةُ على الخزنه فدخلت وَهُمْ لا يَعْلَمُونَ، لِمَا أَرَادَ اللَّهُ عَزَّ وَجَلَّ مِنَ الأَمْرِ، فَكَلَّمَهُ مِنْ فَمِهَا وَلَمْ يُبَالِ كَلامَهُ، فَخَرَجَ إِلَيْهِ فَقَالَ: «يَا آدَمُ هَلْ أَدُلُّكَ عَلى شَجَرَةِ الْخُلْدِ وَمُلْكٍ لا يَبْلى» ، يَقُولُ: هَلْ أَدُلُّكَ عَلَى شَجَرَةٍ إِنْ أَكَلْتَ مِنْهَا كُنْتَ مَلِكًا مِثْلَ اللَّهِ تَبَارَكَ وَتَعَالَى أَوْ تَكُونَا مِنَ الْخَالِدِينَ فَلا تَمُوتَانِ أَبَدًا وَحَلَفَ لَهُمَا بِاللَّهِ إِنِّي لَكُمَا لَمِنَ النَّاصِحِينَ، وَإِنَّمَا أَرَادَ بِذَلِكَ أَنْ يُبْدِيَ لَهُمَا مَا تَوَارَى عَنْهُمَا مِنْ سَوْءَاتِهِمَا بِهَتْكِ لِبَاسِهِمَا، وَكَانَ قَدْ عَلِمَ أَنَّ لَهُمَا سَوْءَةً لِمَا كَانَ يَقْرَأُ مِنْ كُتُبِ الْمَلائِكَةِ، وَلَمْ يَكُنْ آدَمُ يَعْلَمُ ذَلِكَ، وَكَانَ لِبَاسُهُمَا الظُّفُرَ، فَأَبَى آدَمُ أَنْ يَأْكُلَ مِنْهَا، فَتَقَدَّمَتْ حَوَّاءُ فَأَكَلَتْ، ثُمَّ قَالَتْ: يَا آدَمُ كُلْ، فَإِنِّي قَدْ أَكَلْتُ، فلم يضرني، فلما اكل بدت لَهُما سَوْآتُهُما، وَطَفِقا يَخْصِفانِ عَلَيْهِما مِنْ وَرَقِ الْجَنَّةِ» .\u003c/p>\u003cp data-pair=\"107.2\" id=\"ar-odlomak-107-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، عن ليث ابن أَبِي سُلَيْمٍ، عَنْ طَاوُسٍ الْيَمَانِيِّ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ عَدُوَّ اللَّهِ إِبْلِيسَ عَرَضَ نَفْسَهُ عَلَى دَوَابِّ الأَرْضِ: أَيِّهَا تَحْمِلُهُ حَتَّى تدخل بِهِ الْجَنَّةَ حَتَّى يُكَلِّمَ آدَمَ وَزَوْجَهُ، فَكُلُّ الدَّوَابِّ أَبَى ذَلِكَ عَلَيْهِ، حَتَّى كَلَّمَ الْحَيَّةَ، فَقَالَ لَهَا: أَمْنَعُكِ مِنْ بَنِي آدَمَ، فَأَنْتِ فِي ذِمَّتِي إِنْ أَنْتِ أَدْخَلْتِنِي الْجَنَّةَ، فَجَعَلَتْهُ بَيْنَ نَابَيْنِ مِنْ أَنْيَابِهَا ثُمَّ دَخَلَتْ بِهِ، فَكَلَّمَهُمَا مِنْ فَمِهَا وَكَانَتْ كَاسِيَةً تَمْشِي عَلَى أَرْبَعِ قَوَائِمَ، فَأَعْرَاهَا اللَّهُ تَعَالَى وَجَعَلَهَا تَمْشِي عَلَى بَطْنِهَا، قَالَ: يَقُولُ ابْنُ عَبَّاسٍ:\nاقْتُلُوهَا حَيْثُ وَجَدْتُمُوهَا، وَاخْفِرُوا ذِمَّةَ عَدُوِّ اللَّهِ فِيهَا\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 107\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"107.1\" id=\"odlomak-107-1\">ali su ga čuvari spriječili. Došao je zmiji, životinji s četiri noge, nalik devi, jednoj od najljepših životinja, i zamolio je da ga stavi u svoja usta kako bi s njim ušla kod Adema. Stavila ga je u usta, prošla pored čuvara i ušla, a oni nisu znali, zbog onoga što je Allah, Silan i Uzvišen, htio da se dogodi. Govorio je Ademu iz njenih usta, ali on nije mario za njegove riječi. Zatim mu je izašao i rekao: ‘Ademe, hoćeš li da te uputim na drvo vječnosti i vlast koja ne propada?’ To znači: ‘Hoćeš li da te uputim na drvo s kojeg ćeš, ako budeš jeo, postati vladar poput Allaha, Blagoslovljenog i Uzvišenog, ili ćete postati vječni i nikada nećete umrijeti?’ Zakleo im se Allahom: ‘Ja sam vam, doista, iskren savjetnik.’ Time je samo htio otkriti njihova stidna mjesta koja su im bila skrivena, razotkrivši njihovu odjeću. Već je znao da imaju stidna mjesta, iz onoga što je čitao u knjigama meleka, dok Adem to nije znao. Njihova odjeća bila je nokat. Adem je odbio jesti s drveta, pa je Havva prva pristupila i jela. Zatim je rekla: ‘Ademe, jedi! Ja sam već jela i nije mi naškodilo.’ Kada je on jeo, otkrila su im se stidna mjesta i počeli su po sebi spajati džennetsko lišće.“ \u003cspan class=\"translator-note\">⟦Prijevod izričitog kur’anskog pitanja: Ta-Ha, 20:120, navedeni dio. Zakletva je prenesena prema El-A‘raf, 7:21. Završetak o pokrivanju lišćem odgovara El-A‘raf, 7:22, i Ta-Ha, 20:121. Riječi o „vladaru poput Allaha“ i odjeći od nokta pripadaju ovoj predaji.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"107.2\" id=\"odlomak-107-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, od Lejsa ibn Ebu Sulejma, od Tavusa el-Jemanija, od Ibn Abbasa, koji je rekao: \u003c/span>„Allahov neprijatelj Iblis nudio se zemaljskim životinjama: koja bi ga ponijela i unijela u Džennet kako bi govorio Ademu i njegovoj supruzi. Sve životinje odbile su to, sve dok se nije obratio zmiji. Rekao joj je: ‘Zaštitit ću te od Ademovih potomaka. Bit ćeš pod mojom zaštitom ako me uneseš u Džennet.’ Stavila ga je između dvaju svojih očnjaka i ušla s njim. Govorio im je iz njenih usta. Ona je bila pokrivena i hodala na četiri noge, pa ju je Uzvišeni Allah ogolio i učinio da se kreće na trbuhu.“ Rekao je: Ibn Abbas govorio je: „Ubijajte je gdje god je nađete i prekršite zaštitu koju joj je dao Allahov neprijatelj.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":108,"html":"\u003csection class=\"page\" data-page=\"108\" id=\"stranica-108\">\u003ch2>Stranica 108\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 108\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"108.1\" id=\"ar-odlomak-108-1\">\u003cspan class=\"isnad\">حدثنا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا عمر بن عبد الرحمن بن مهرب، قال: سمعت وهب بن منبه يقول:\n\u003c/span>لما أسكن الله تعالى آدم وزوجته الجنة، ونهاه عن الشجرة، وكانت شجرة غصونها متشعب بعضها في بعض، وكان لها ثمر تأكله الملائكة لخلدهم، وهي الثمرة التي نهى الله عنها آدم وزوجته، فلما أراد إبليس أن يستزلهما دخل في جوف الحية، وكان للحية أربع قوائم، كأنها بختية من أحسن دابة خلقها الله تعالى، فلما دخلت الحيه الجنة خرج من جوفها إبليس، فأخذ من الشجرة التي نهى الله عنها آدم وزوجته، فجاء بها إلى حواء، فقال:\nانظري إلى هذه الشجرة، ما أطيب ريحها، وأطيب طعمها، وأحسن لونها! فأخذت حواء فأكلت منها، ثم ذهبت بها إلى آدم، فقالت: أنظر إلى هذه الشجرة ما أطيب ريحها، وأطيب طعمها، وأحسن لونها! فأكل منها آدم، فبدت لهما سوآتهما، فدخل آدم في جوف الشجرة، فناداه ربه: يا آدم، أين أنت؟ قال: أنا هذا يا رب، قال: ألا تخرج؟ قال: أستحي منك يا رب، قال: ملعونة الأرض التي خلقت منها لعنة حتى يتحول ثمارها شوكا! قال: ولم يكن في الجنة ولا في الأرض شجرة كانت أفضل من الطلح والسدر.\u003c/p>\u003cp data-pair=\"108.2\" id=\"ar-odlomak-108-2\">ثم قال: يا حواء، أنت التي غررت عبدي، فإنك لا تحملين حملا إلا حملته كرها، فإذا أردت أن تضعي ما في بطنك أشرفت على الموت مرارا وقال للحية: أنت التي دخل الملعون في بطنك حتى غر عبدي، ملعونة أنت لعنة حتى تتحول قوائمك في بطنك، ولا يكن لك رزق إلا التراب، أنت عدوة بني آدم وهم أعداؤك، حيث لقيت أحدا منهم أخذت بعقبه، وحيث لقيك شدخ رأسك\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 108\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"108.1\" id=\"odlomak-108-1\">\u003cspan class=\"isnad\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Omer ibn Abdurrahman ibn Mehreb, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: \u003c/span>„Kada je Uzvišeni Allah nastanio Adema i njegovu suprugu u Džennetu i zabranio mu drvo — bilo je to drvo isprepletenih grana, s plodom koji su meleki jeli radi svoje vječnosti, a to je plod koji je Allah zabranio Ademu i njegovoj supruzi — Iblis ih je htio navesti da posrnu. Ušao je u utrobu zmije. Zmija je imala četiri noge, bila je poput dvogrbe deve, jedna od najljepših životinja koje je Uzvišeni Allah stvorio. Kada je zmija ušla u Džennet, Iblis je izašao iz njene utrobe i uzeo s drveta koje je Allah zabranio Ademu i njegovoj supruzi. Donio je to Havvi i rekao: ‘Pogledaj ovo drvo! Kako lijepo miriše, kako je lijepog okusa i lijepe boje!’ Havva je uzela i jela s njega, zatim to odnijela Ademu i rekla: ‘Pogledaj ovo drvo! Kako lijepo miriše, kako je lijepog okusa i lijepe boje!’ Adem je jeo s njega, pa su im se otkrila stidna mjesta. Adem je ušao u unutrašnjost drveta, a njegov Gospodar ga je dozvao: ‘Ademe, gdje si?’ Odgovorio je: ‘Evo me, Gospodaru moj.’ Rekao je: ‘Zar nećeš izaći?’ Odgovorio je: ‘Stidim Te se, Gospodaru moj.’ Rekao je: ‘Prokleta neka je zemlja od koje si stvoren, takvim prokletstvom da joj se plodovi pretvore u trnje!’“ Rekao je: „Ni u Džennetu ni na Zemlji nije bilo boljeg drveta od talha i sidra.“\u003c/p>\u003cp data-pair=\"108.2\" id=\"odlomak-108-2\">„Zatim je rekao: ‘Havva, ti si obmanula Moga roba. Nijednu trudnoću nećeš nositi osim s teškoćom; a kada budeš trebala roditi ono što je u tvojoj utrobi, više puta približit ćeš se smrti.’ Zmiji je rekao: ‘Ti si ona u čiju je utrobu ušao prokletnik i obmanuo Moga roba. Prokleta si takvim prokletstvom da se tvoje noge povuku u tvoj trbuh i da ti opskrba bude samo zemlja. Ti si neprijateljica Ademovih potomaka, a oni su tvoji neprijatelji. Gdje god sretneš nekoga od njih, uhvatit ćeš ga za petu, a gdje god on sretne tebe, smrskat će ti glavu.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: talh (الطلح) i sidr (السدر) nazivi su drveća u predaji; ovdje im nije nametnuta određena botanička identifikacija.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":109,"html":"\u003csection class=\"page\" data-page=\"109\" id=\"stranica-109\">\u003ch2>Stranica 109\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 109\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"109.1\" id=\"ar-odlomak-109-1\">قيل لوهب: وما كانت الملائكة تأكل؟ قال: يفعل الله ما يشاء.\u003c/p>\u003cp data-pair=\"109.2\" id=\"ar-odlomak-109-2\">\u003cspan class=\"isnad\">حَدَّثَنَا القاسم بن الحسن، قال: حدثنا الحسين بن داود، قال: حدثني حجاج، عن أبي معشر، عن محمد بن قيس، قال: \u003c/span>نهى الله تعالى آدم وحواء أن يأكلا من شجرة واحدة في الجنة، ويأكلا منها رغدا حيث شاءا، فجاء الشيطان فدخل في جوف الحية، فكلم حواء، ووسوس إلى آدم فقال: «مَا نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» قال: فقطعت حواء الشجرة فدميت الشجرة، وسقط عنهما رياشهما الذي كان عليهما، «وَطَفِقا يَخْصِفانِ عَلَيْهِما مِنْ وَرَقِ الْجَنَّةِ وَناداهُما رَبُّهُما أَلَمْ أَنْهَكُما عَنْ تِلْكُمَا الشَّجَرَةِ وَأَقُلْ لَكُما إِنَّ الشَّيْطانَ لَكُما عَدُوٌّ مُبِينٌ» لم أكلتها وقد نهيتك عنها؟ قال: يا رب أطعمتني حواء، قال لحواء: لم أطعمته؟ قالت:\nأمرتني الحية، قال للحية: لم أمرتها؟ قالت: أمرني إبليس، قال: ملعون مدحور! أما أنت يا حواء، فكما أدميت الشجرة تدمين في كل هلال، وأما أنت يا حية، فأقطع قوائمك فتمشين جريا على وجهك، وسيشدخ رأسك من لقيك بالحجر، اهبطوا بعضكم لبعض عدو.\u003c/p>\u003cp data-pair=\"109.3\" id=\"ar-odlomak-109-3\">\u003cspan class=\"isnad\">حدثت عن عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع، قال: حَدَّثَنِي محدث أن الشيطان دخل الجنة في صورة دابة ذات قوائم، فكان يرى أنه البعير، قال: \u003c/span>فلعن فسقطت قوائمه فصار حية.\u003c/p>\u003cp data-pair=\"109.4\" id=\"ar-odlomak-109-4\">\u003cspan class=\"isnad\">حدثت عن عمار، قال: حَدَّثَنَا عبد الله بن أبي جعفر، عن\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 109\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"109.1\" id=\"odlomak-109-1\">Vehb je upitan: „A šta su meleki jeli?“ Odgovorio je: „Allah čini šta hoće.“\u003c/p>\u003cp data-pair=\"109.2\" id=\"odlomak-109-2\">\u003cspan class=\"isnad\">Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Ebu Ma‘šera, od Muhammeda ibn Kajsa, koji je rekao: \u003c/span>„Uzvišeni Allah zabranio je Ademu i Havvi da jedu s jednog drveta u Džennetu, a inače su iz njega mogli jesti obilno odakle god su željeli. Šejtan je došao, ušao u utrobu zmije, govorio Havvi i došaptavao Ademu: ‘Vaš Gospodar zabranio vam je ovo drvo samo zato da ne postanete dva meleka ili da ne postanete vječni. I zakleo im se: Ja sam vam, doista, iskren savjetnik.’“ Rekao je: „Havva je zarezala drvo, pa je drvo prokrvarilo, a s njih je spala raskošna odjeća koju su nosili. ‘I počeli su po sebi spajati džennetsko lišće. Njihov ih Gospodar dozva: Zar vam nisam zabranio to drvo i rekao vam da vam je šejtan otvoreni neprijatelj?’ ‘Zašto si jeo s njega kada sam ti ga zabranio?’ Odgovorio je: ‘Gospodaru moj, Havva me nahranila.’ Rekao je Havvi: ‘Zašto si ga nahranila?’ Odgovorila je: ‘Zmija mi je naredila.’ Rekao je zmiji: ‘Zašto si joj naredila?’ Odgovorila je: ‘Iblis mi je naredio.’ Rekao je: ‘Proklet i odbačen! A ti, Havva, kao što si raskrvarila drvo, krvarit ćeš pri svakom mlađaku. A tebi, zmijo, odsjeći ću noge, pa ćeš se brzo kretati na svome licu. Ko god te sretne smrskat će ti glavu kamenom. Siđite; jedni drugima bit ćete neprijatelji.’“ \u003cspan class=\"translator-note\">⟦Prijevodi izričitih kur’anskih navoda: El-A‘raf, 7:20–22, navedeni dijelovi. Završna naredba prenosi izraz iz El-Bekara, 2:36, i El-A‘raf, 7:24.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"109.3\" id=\"odlomak-109-3\">\u003cspan class=\"isnad\">Preneseno mi je od Ammara ibn el-Hasena, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, koji je rekao: \u003c/span>„\u003cspan class=\"isnad\">Pričao mi je jedan pripovjedač \u003c/span>da je šejtan ušao u Džennet u liku četveronožne životinje. Smatralo se da je to bila deva.“ Rekao je: „Proklet je, pa su mu otpale noge i postao je zmija.“\u003c/p>\u003cp data-pair=\"109.4\" id=\"odlomak-109-4\">\u003cspan class=\"isnad\">Preneseno mi je od Ammara, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":110,"html":"\u003csection class=\"page\" data-page=\"110\" id=\"stranica-110\">\u003ch2>Stranica 110\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 110\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"110.1\" id=\"ar-odlomak-110-1\">\u003cspan class=\"isnad\">أبيه، عن الربيع قال: وحدثني أبو العالية، قال: \u003c/span>إن من الإبل ما كان أولها من الجن قال: فأبيحت له الجنة كلها- يعنى آدم- الا الشجرة، وقيل لهما: «لا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، قال: فأتى الشيطان حواء فبدأ بها، فقال: نهيتما عن شيء؟ قالت: نعم، عن هذه الشجرة، فقال:\n«ما نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ» قال: فبدت حواء فأكلت منها، ثم أمرت آدم فأكل منها قال: وكانت شجرة، من أكل منها أحدث، قال: ولا ينبغي أن يكون في الجنة حدث، قال: «فَأَزَلَّهُمَا الشَّيْطانُ عَنْها فَأَخْرَجَهُما مِمَّا كَانَا فِيهِ» ، قال: فأخرج آدم من الجنة.\u003c/p>\u003cp data-pair=\"110.2\" id=\"ar-odlomak-110-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ بَعْضِ أَهْلِ العلم \u003c/span>أن آدم ع حين دخل الجنة ورأى ما فيها من الكرامة، وما أعطاه الله منها، قال: لو أنا خلدنا! فاغتمز فيها منه الشيطان لما سمعها منه، فأتاه من قبل الخلد.\u003c/p>\u003cp data-pair=\"110.3\" id=\"ar-odlomak-110-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال:\n\nحدثت أن أول ما ابتدأهما به من كيده إياهما أنه ناح عليهما نياحة أحزنتهما حين سمعاها، فقالا له: \u003c/span>ما يبكيك؟ قال: أبكي عليكما،\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 110\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"110.1\" id=\"odlomak-110-1\">\u003cspan class=\"isnad\">svoga oca, od Rebie, koji je rekao: „Pričao mi je i Ebu Alija, koji je rekao: \u003c/span>‘Nekim je devama početak bio među džinima.’“ Rekao je: „Dopušten mu je cijeli Džennet — misli se Ademu — osim drveta. Njima dvoma rečeno je: ‘Ne približavajte se ovom drvetu, pa da budete od nepravednika.’“ Rekao je: „Šejtan je došao Havvi, počevši od nje, i rekao: ‘Je li vam nešto zabranjeno?’ Odgovorila je: ‘Jeste, ovo drvo.’ Rekao je: ‘Vaš Gospodar zabranio vam je ovo drvo samo zato da ne postanete dva meleka ili da ne postanete vječni.’“ Rekao je: „Havva je prva pristupila i jela s njega, zatim je naredila Ademu pa je i on jeo.“ Rekao je: „Bilo je to drvo s kojeg bi onaj ko jede obavio nuždu.“ Rekao je: „A u Džennetu ne priliči da se obavlja nužda.“ Rekao je: „‘Šejtan ih je naveo da zbog njega posrnu i izveo ih iz onoga u čemu su bili.’“ Rekao je: „Adem je izveden iz Dženneta.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:35, navedeni dio; El-A‘raf, 7:20, navedeni dio; El-Bekara, 2:36, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"110.2\" id=\"odlomak-110-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Muhammed ibn Ishak, od nekih učenih ljudi, \u003c/span>da je Adem, alejhis-selam, kada je ušao u Džennet i vidio počasti u njemu i ono što mu je Allah od njega dao, rekao: „Kada bismo samo ostali vječno!“ Kada je šejtan to od njega čuo, našao je u tome njegovu slabu tačku i prišao mu s pitanjem vječnosti.\u003c/p>\u003cp data-pair=\"110.3\" id=\"odlomak-110-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: \u003c/span>„Preneseno mi je da je prva njegova spletka njima dvoma bila da je nad njima počeo naricati naricanjem koje ih je rastužilo kada su ga čuli. Pitali su ga: ‘Zašto plačeš?’ Odgovorio je: ‘Plačem zbog vas;\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":111,"html":"\u003csection class=\"page\" data-page=\"111\" id=\"stranica-111\">\u003ch2>Stranica 111\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 111\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"111.1\" id=\"ar-odlomak-111-1\">تموتان فتفارقان ما أنتما فيه من النعمة والكرامة فوقع ذلك في أنفسهما، ثم أتاهما فوسوس إليهما، فقال: يا آدم هل أدلك على شجرة الخلد وملك لا يبلى؟ وقال: «ما نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» ، أي تكونان ملكين أو تخلدان، أي إن لم تكونا ملكين في نعمة الجنة فلا تموتان يقول الله عز وجل: «فَدَلَّاهُما بِغُرُورٍ» .\u003c/p>\u003cp data-pair=\"111.2\" id=\"ar-odlomak-111-2\">\u003cspan class=\"isnad\">حدثني يونس، قال أخبرنا ابن وهب، قال: قال ابن زيد \u003c/span>في قوله سبحانه وتعالى: «فَوَسْوَسَ» : وسوس الشيطان إلى حواء في الشجرة حتى اتى بها إليها، ثم حسنتها في عين آدم، قال: فدعاها آدم لحاجته، قالت:\nلا: الا ان تأتي هاهنا، فلما أتى قالت: لا، إلا أن تأكل من هذه الشجرة، قال: فأكلا منها، فبدت لهما سوءاتهما قال: وذهب آدم هاربا في الجنة، فناداه ربه: يا آدم، أمني تفر؟ قال: لا يا رب، ولكن حياء منك، قال: يا آدم، انى اتيت؟ قال: من قبل حواء يا رب، فقال الله عز وجل: فإن لها علي أن أدميها في كل شهر مرة، كما أدمت هذه الشجرة، وأن أجعلها سفيهة، وقد كنت خلقتها حليمة، وأن أجعلها تحمل كرها وتضع كرها، وقد كنت جعلتها تحمل يسرا وتضع يسرا قال ابن زيد: ولولا البلية التي أصابت حواء لكان نساء أهل الدنيا لا يحضن، ولكن حليمات، ولكن يحملن يسرا،.\nويضعن يسرا.\u003c/p>\u003cp data-pair=\"111.3\" id=\"ar-odlomak-111-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ يَزِيدَ بْنِ عَبْدِ الله بن قسيط، عن سعيد بن المسيب، قال: سمعته يحلف بالله ما يستثني: \u003c/span>ما أكل آدم من الشجرة وهو يعقل، ولكن حواء سقته\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 111\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"111.1\" id=\"odlomak-111-1\">umrijet ćete i napustiti blagodati i počasti u kojima ste.’ To im je ostalo u duši. Zatim im je došao i došaptavao: ‘Ademe, hoćeš li da te uputim na drvo vječnosti i vlast koja ne propada?’ Rekao je i: ‘Vaš Gospodar zabranio vam je ovo drvo samo zato da ne postanete dva meleka ili da ne postanete vječni. I zakleo im se: Ja sam vam, doista, iskren savjetnik.’ To jest: postat ćete dva meleka ili ćete ostati vječno; odnosno, ako i ne postanete dva meleka u džennetskim blagodatima, nećete umrijeti. Allah, Silan i Uzvišen, kaže: ‘Pa ih je obmanom spustio.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih riječi unutar predaje: Ta-Ha, 20:120, navedeni dio; El-A‘raf, 7:20–22, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"111.2\" id=\"odlomak-111-2\">\u003cspan class=\"isnad\">Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, \u003c/span>o riječima Njega, Slavljenog i Uzvišenog: „Pa je došaptavao“: „Šejtan je došaptavao Havvi o drvetu, sve dok joj ga nije donio. Zatim ga je ona uljepšala u Ademovim očima.“ Rekao je: „Adem ju je pozvao radi svoje potrebe, a ona je rekla: ‘Ne, osim ako dođeš ovamo.’ Kada je došao, rekla je: ‘Ne, osim ako jedeš s ovoga drveta.’“ Rekao je: „Oboje su jeli s njega, pa su im se otkrila stidna mjesta.“ Rekao je: „Adem je potrčao bježeći po Džennetu. Njegov Gospodar dozvao ga je: ‘Ademe, zar bježiš od Mene?’ Odgovorio je: ‘Ne, Gospodaru moj, nego zbog stida pred Tobom.’ Rekao je: ‘Ademe, s koje si strane doveden u to?’ Odgovorio je: ‘S Havvine strane, Gospodaru moj.’ Allah, Silan i Uzvišen, rekao je: ‘Ona će zato od Mene imati da jednom svakog mjeseca prokrvari, kao što je raskrvarila ovo drvo, i da je učinim lakomislenom, a stvorio sam je razboritom; da nosi trudnoću s teškoćom i rađa s teškoćom, a bio sam joj dao da trudnoću nosi lahko i rađa lahko.’“ Ibn Zejd je rekao: „Da nije iskušenja koje je zadesilo Havvu, žene ovoga svijeta ne bi imale mjesečnicu; bile bi razborite, lahko bi nosile trudnoću i lahko rađale.“ \u003cspan class=\"translator-note\">⟦„Pa je došaptavao“ prijevod je početka izraza فوسوس u El-A‘raf, 7:20, i Ta-Ha, 20:120. Preostale tvrdnje u ovom odlomku prenose sadržaj Ibn Zejdove predaje.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"111.3\" id=\"odlomak-111-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, od Jezida ibn Abdullaha ibn Kusajta, od Seida ibn el-Musejjeba, koji je rekao: \u003c/span>„Čuo sam ga kako se zaklinje Allahom, bez izuzetka: ‘Adem nije jeo s drveta dok je bio pri razumu, nego ga je Havva napojila\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":112,"html":"\u003csection class=\"page\" data-page=\"112\" id=\"stranica-112\">\u003ch2>Stranica 112\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 112\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"112.1\" id=\"ar-odlomak-112-1\">الخمر حتى إذا سكر قادته إليها، فأكل منها فلما واقع آدم وحواء الخطيئة، أخرجهما الله تعالى من الجنه وسلبهما ما كانا فيه من النعمة والكرامة، وأهبطهما وعدوهما إبليس والحية إلى الأرض، فقال لهم ربهم: اهبطوا بعضكم لبعض عدو.\u003c/p>\u003cp data-pair=\"112.2\" id=\"ar-odlomak-112-2\">وكالذي قلنا في ذلك قال السلف من أهل العلم.\u003c/p>\u003cp data-pair=\"112.3\" id=\"ar-odlomak-112-3\">\u003cspan class=\"isnad\">حَدَّثَنِي يُونُسُ، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: حَدَّثَنَا عَبْدُ الرحمن ابن مَهْدِيٍّ، عَنْ إِسْرَائِيلَ، عَنْ إِسْمَاعِيلَ السُّدِّيِّ، قَالَ: حَدَّثَنِي مَنْ سَمِعَ ابْنَ عَبَّاسٍ يَقُولُ: \u003c/span>«اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، قَالَ: آدَمُ وَحَوَّاءُ وَإِبْلِيسُ وَالْحَيَّةُ.\u003c/p>\u003cp data-pair=\"112.4\" id=\"ar-odlomak-112-4\">\u003cspan class=\"isnad\">حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، وَمُوسَى بْنُ هَارُونَ، قَالا: حَدَّثَنَا عمرو ابن حَمَّادٍ، عَنْ أَسْبَاطٍ، عَنِ السُّدِّيِّ- فِي خَبَرٍ ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابْنِ مَسْعُودٍ- وَعَنْ نَاسٍ مِنْ أَصْحَابِ رَسُولِ الله ص: \u003c/span>«اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، فَلَعَنَ الْحَيَّةَ فَقَطَعَ قَوَائِمَهَا، وَتَرَكَهَا تَمْشِي عَلَى بَطْنِهَا، وَجَعَلَ رِزْقَهَا مِنَ التُّرَابِ، وَأَهْبَطَ إِلَى الأَرْضِ آدَمَ وَحَوَّاءَ وَإِبْلِيسَ وَالْحَيَّةَ.\u003c/p>\u003cp data-pair=\"112.5\" id=\"ar-odlomak-112-5\">\u003cspan class=\"isnad\">حَدَّثَنِي محمد بن عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى بن ميمون، عن ابن أبي نجيح، عن مجاهد، \u003c/span>في قول الله عز وجل:\n\n«اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، قال: آدم وحواء وإبليس والحية\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 112\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"112.1\" id=\"odlomak-112-1\">vinom. Kada se opio, odvela ga je do drveta i jeo je s njega.’“ Kada su Adem i Havva počinili grijeh, Uzvišeni Allah izveo ih je iz Dženneta, oduzeo im blagodat i počast u kojima su bili i spustio njih dvoje, njihovog neprijatelja Iblisa i zmiju na Zemlju. Njihov Gospodar rekao im je: „Siđite; jedni drugima bit ćete neprijatelji.“\u003c/p>\u003cp data-pair=\"112.2\" id=\"odlomak-112-2\">Isto kao što smo mi o tome rekli govorili su učeni prethodnici.\u003c/p>\u003cp data-pair=\"112.3\" id=\"odlomak-112-3\">\u003cspan class=\"isnad\">Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: pričao nam je Abdurrahman ibn Mehdi, od Israila, od Ismaila es-Suddija, koji je rekao: pričao mi je onaj ko je čuo Ibn Abbasa kako, \u003c/span>o riječima: „Siđite; jedni drugima bit ćete neprijatelji“, govori: „Adem, Havva, Iblis i zmija.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: izraz se nalazi u El-Bekara, 2:36, i El-A‘raf, 7:24.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"112.4\" id=\"odlomak-112-4\">\u003cspan class=\"isnad\">Pričali su nam Sufjan ibn Veki‘ i Musa ibn Harun; obojica su rekli: pričao nam je Amr ibn Hammad, od Esbata, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, \u003c/span>o riječima: „Siđite; jedni drugima bit ćete neprijatelji.“ „Prokleo je zmiju, odsjekao joj noge, ostavio je da se kreće na trbuhu i dao joj da joj opskrba bude zemlja. Na Zemlju je spustio Adema, Havvu, Iblisa i zmiju.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:36, i El-A‘raf, 7:24, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"112.5\" id=\"odlomak-112-5\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa ibn Mejmun, od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>o riječima Allaha, Silnog i Uzvišenog: „Siđite; jedni drugima bit ćete neprijatelji.“ Rekao je: „Adem, Havva, Iblis i zmija.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:36, i El-A‘raf, 7:24, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":113,"html":"\u003csection class=\"page\" data-page=\"113\" id=\"stranica-113\">\u003ch2>Stranica 113\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 113\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"113.1\" id=\"ar-odlomak-113-1\">القول في قدر مكث آدم في الجنة ووقت خلق الله عز وجل إياه ووقت إهباطه إياه من السماء إلى الأرض\u003c/p>\u003cp data-pair=\"113.2\" id=\"ar-odlomak-113-2\">قد تظاهرت الاخبار عن رسول الله ص بان الله عز وجل خلق آدم ع يوم الجمعة، وأنه أخرجه فيه من الجنة، وأهبطه إلى الأرض فيه، وأنه فيه تاب عليه، وفيه قبضه.\u003c/p>\u003cp data-pair=\"113.3\" id=\"ar-odlomak-113-3\">ذكر الأخبار عن رسول الله ص بذلك:\u003c/p>\u003cp data-pair=\"113.4\" id=\"ar-odlomak-113-4\">\u003cspan class=\"isnad\">حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا عَلِيُّ بْنُ مَعْبَدٍ، قَالَ: حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ عَمْرٍو، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عن عمرو بن شرحبيل عن سَعِيدِ بْنِ سَعْدِ بْنِ عُبَادَةَ، عَنْ سَعْدِ بن عباده، [عن رسول الله ص، قَالَ: \u003c/span>إِنَّ فِي الْجُمُعَةِ خَمْسَ خِلالٍ: فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُهْبِطَ إِلَى الأَرْضِ، وَفِيهِ تَوَفَّى اللَّهُ آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ الْعَبْدُ فِيهَا رَبَّهُ شَيْئًا إِلا أَعْطَاهُ اللَّهُ إِيَّاهُ، مَا لَمْ يَسْأَلْ إِثْمًا أَوْ قَطِيعَةً، وَفِيهِ: تَقُومُ السَّاعَةُ، وَمَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا جَبَلٍ وَلا أَرْضٍ وَلا رِيحٍ، إِلا مُشْفِقٌ مِنْ يَوْمِ الْجُمُعَةِ] .\u003c/p>\u003cp data-pair=\"113.5\" id=\"ar-odlomak-113-5\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ بَشَّارٍ وَمُحَمَّدُ بْنُ مَعْمَرٍ، قَالا: حَدَّثَنَا أَبُو عَامِرٍ، حَدَّثَنَا زُهَيْرُ بْنُ مُحَمَّدٍ، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ يَزِيدَ الأَنْصَارِيِّ، عَنْ أَبِي لُبَابَةَ بْنِ عَبْدِ الْمُنْذِرِ، [\u003c/span>أَنَّ النَّبِيَّ ص قَالَ: سَيِّدُ الأَيَّامِ يَوْمُ الْجُمُعَةِ، وَأَعْظَمُهَا وَأَعْظَمُ عِنْدَ اللَّهِ مِنْ يَوْمِ الْفِطْرِ وَيَوْمِ النَّحْرِ، وَفِيهِ خَمْسُ خِلالٍ: خَلَقَ اللَّهُ تَعَالَى فِيهِ آدَمَ، وَأَهْبَطَهُ فِيهِ إِلَى الأَرْضِ، وَفِيهِ تَوَفَّى اللَّهُ تَعَالَى آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ اللَّهَ الْعَبْدُ شَيْئًا إِلا أَعْطَاهُ إِيَّاهُ مَا لَمْ يَكُنْ حَرَامًا وَفِيهِ تَقُومُ السَّاعَةُ، مَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا أَرْضٍ وَلا جِبَالٍ وَلا رِيَاحٍ وَلا بَحْرٍ إِلا وَهُوَ مُشْفِقٌ مِنْ يَوْمِ الْجُمُعَةِ، أَنْ تَقُومَ فِيهِ السَّاعَةُ] .\u003c/p>\u003cp data-pair=\"113.6\" id=\"ar-odlomak-113-6\">وَاللَّفْظُ لِحَدِيثِ ابْنِ بَشَّارٍ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 113\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"113.1\" id=\"odlomak-113-1\">Rasprava o tome koliko je Adem boravio u Džennetu, kada ga je Allah, Silan i Uzvišen, stvorio i kada ga je s neba spustio na Zemlju\u003c/p>\u003cp data-pair=\"113.2\" id=\"odlomak-113-2\">Brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, međusobno se potvrđuju da je Allah, Silan i Uzvišen, stvorio Adema, alejhis-selam, u petak; da ga je toga dana izveo iz Dženneta i spustio na Zemlju; da mu je toga dana prihvatio pokajanje i toga dana uzeo njegov život.\u003c/p>\u003cp data-pair=\"113.3\" id=\"odlomak-113-3\">Spomen predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, o tome:\u003c/p>\u003cp data-pair=\"113.4\" id=\"odlomak-113-4\">\u003cspan class=\"isnad\">Pričao mi je Abdurrahman ibn Abdullah ibn Abdulhakem, koji je rekao: pričao nam je Ali ibn Ma‘bed, koji je rekao: pričao nam je Ubejdullah ibn Amr, od Abdullaha ibn Muhammeda ibn Akila, od Amra ibn Šurahbila, od Seida ibn Sa‘da ibn Ubade, od Sa‘da ibn Ubade, od Allahovog Poslanika, sallallahu alejhi ve sellem, koji je rekao: \u003c/span>„Petak ima pet svojstava: u njemu je stvoren Adem, u njemu je spušten na Zemlju, u njemu je Allah usmrtio Adema, u njemu postoji čas u kojem rob ne traži od svoga Gospodara ništa a da mu Allah to ne dadne, sve dok ne traži grijeh ili prekidanje veza; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni planine, ni zemlje, ni vjetra a da ne strepi od petka.“\u003c/p>\u003cp data-pair=\"113.5\" id=\"odlomak-113-5\">\u003cspan class=\"isnad\">Pričali su mi Muhammed ibn Beššar i Muhammed ibn Ma‘mer; obojica su rekli: pričao nam je Ebu Amir: pričao nam je Zuhejr ibn Muhammed, od Abdullaha ibn Muhammeda ibn Akila, od Abdurrahmana ibn Jezida el-Ensarija, od Ebu Lubabe ibn Abdulmunzira, \u003c/span>da je Vjerovjesnik, sallallahu alejhi ve sellem, rekao: „Prvak dana je petak i on je najveći među njima; kod Allaha je veći od dana Ramazanskog bajrama i dana klanja kurbana. Ima pet svojstava: Uzvišeni Allah u njemu je stvorio Adema, u njemu ga je spustio na Zemlju, u njemu je Uzvišeni Allah usmrtio Adema, u njemu postoji čas u kojem rob ništa ne traži od Allaha a da mu On to ne dadne, sve dok to nije zabranjeno; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni zemlje, ni planina, ni vjetrova, ni mora a da ne strepi od petka, da u njemu ne nastupi Čas.“\u003c/p>\u003cp data-pair=\"113.6\" id=\"odlomak-113-6\">Ovo je formulacija predaje Ibn Beššara.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":114,"html":"\u003csection class=\"page\" data-page=\"114\" id=\"stranica-114\">\u003ch2>Stranica 114\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 114\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"114.1\" id=\"ar-odlomak-114-1\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ مَعْمَرٍ، قَالَ: حَدَّثَنَا أَبُو عامر، قال: حدثنا زهير ابن مُحَمَّدٍ، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عَنْ عَمْرِو بْنِ شُرَحْبِيلَ بْنِ سَعِيدِ بْنِ سَعْدِ بْنِ عُبَادَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنْ سَعْدِ بْنِ عُبَادَةَ، [أَنَّ رَجُلا اتى النبي ص، فَقَالَ: \u003c/span>يَا رَسُولَ اللَّهِ، أَخْبِرْنَا عَنْ يَوْمِ الْجُمُعَةِ، مَاذَا فِيهِ مِنَ الْخَيْرِ؟ فَقَالَ: فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُهْبِطَ آدَمُ، وَفِيهِ تَوَفَّى آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ الْعَبْدُ فِيهَا شَيْئًا إِلا أَعْطَاهُ اللَّهُ إِيَّاهُ، مَا لَمْ يَسْأَلْ مَأْثَمًا أَوْ قَطِيعَةً، وَفِيهِ تَقُومُ السَّاعَةُ، مَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا أَرْضٍ وَلا جِبَالٍ وَلا رِيحٍ إِلا هُنَّ يُشْفِقْنَ مِنْ يَوْمِ الْجُمُعَةِ] .\u003c/p>\u003cp data-pair=\"114.2\" id=\"ar-odlomak-114-2\">\u003cspan class=\"isnad\">حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا أَبُو زُرْعَةَ، قَالَ: أَخْبَرَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، عَنْ عَبْدِ الرَّحْمَنِ الأَعْرَجِ، أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ يَقُولُ: [قَالَ رَسُولُ اللَّهِ ص: \u003c/span>خَيْرُ يَوْمٍ طَلَعَتِ الشَّمْسُ عَلَيْهِ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُدْخِلَ الْجَنَّةُ وَأُخْرِجَ مِنْهَا] .\u003c/p>\u003cp data-pair=\"114.3\" id=\"ar-odlomak-114-3\">\u003cspan class=\"isnad\">حَدَّثَنِي بَحْرُ بْنُ نَصْرٍ، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: أَخْبَرَنِي ابْنُ أَبِي الزِّنَادِ، عَنْ أَبِيهِ، عَنْ مُوسَى بْنِ أَبِي عُثْمَانَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رَسُولُ اللَّهِ ص: \u003c/span>سَيِّدُ الأَيَّامِ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُدْخِلَ الْجَنَّةَ، وَفِيهِ أُخْرِجَ مِنْهَا، وَلا تَقُومُ السَّاعَةُ إِلا يَوْمَ الْجُمَعَةِ] .\u003c/p>\u003cp data-pair=\"114.4\" id=\"ar-odlomak-114-4\">\u003cspan class=\"isnad\">حَدَّثَنَا الرَّبِيعُ بْنُ سُلَيْمَانَ، قَالَ: حَدَّثَنَا شُعَيْبُ بْنُ اللَّيْثِ، قَالَ: حَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ جَعْفَرِ بْنِ رَبِيعَةَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ هُرْمُزَ، \u003c/span>أَنَّهُ قَالَ: سَمِعْتُ أَبَا هُرَيْرَةَ يَقُولُ: [قَالَ رسول الله ص: لَمْ تَطْلُعِ الشَّمْسُ عَلَى يَوْمٍ مِثْلَ يَوْمِ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُخْرِجَ مِنَ الْجَنَّةِ، وَفِيهِ أُعِيدَ فِيهَا] .\u003c/p>\u003cp data-pair=\"114.5\" id=\"ar-odlomak-114-5\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا جَرِيرٌ، عَنْ مَنْصُورٍ وَمُغِيرَةُ، عَنْ زِيَادِ بْنِ كُلَيْبٍ أَبِي مَعْشَرٍ، عَنْ إِبْرَاهِيمَ، عَنِ الْقَرْثَعِ الضَّبِّيِّ- وَكَانَ الْقَرْثَعُ\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 114\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"114.1\" id=\"odlomak-114-1\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Ma‘mer, koji je rekao: pričao nam je Ebu Amir, koji je rekao: pričao nam je Zuhejr ibn Muhammed, od Abdullaha ibn Muhammeda ibn Akila, od Amra ibn Šurahbila ibn Seida ibn Sa‘da ibn Ubade, od njegovog oca, od njegovog djeda, od Sa‘da ibn Ubade, \u003c/span>da je neki čovjek došao Vjerovjesniku, sallallahu alejhi ve sellem, i rekao: „Allahov Poslaniče, obavijesti nas o petku: kakvo dobro ima u njemu?“ Odgovorio je: „U njemu je stvoren Adem, u njemu je Adem spušten, u njemu je usmrtio Adema, u njemu postoji čas u kojem rob ništa ne zatraži a da mu Allah to ne dadne, sve dok ne traži grijeh ili prekidanje veza; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni zemlje, ni planina, ni vjetra a da ne strepe od petka.“\u003c/p>\u003cp data-pair=\"114.2\" id=\"odlomak-114-2\">\u003cspan class=\"isnad\">Pričao mi je Abdurrahman ibn Abdullah ibn Abdulhakem, koji je rekao: pričao nam je Ebu Zur‘a, koji je rekao: obavijestio me Junus, od Ibn Šihaba, od Abdurrahmana el-A‘redža, da je čuo Ebu Hurejru kako govori: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Najbolji dan nad kojim je Sunce izašlo jeste petak. U njemu je stvoren Adem i u njemu je uveden u Džennet i izveden iz njega.’“\u003c/p>\u003cp data-pair=\"114.3\" id=\"odlomak-114-3\">\u003cspan class=\"isnad\">Pričao mi je Bahr ibn Nasr, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: obavijestio me Ibn Ebu Zinad, od svoga oca, od Muse ibn Ebu Osmana, od Ebu Hurejre, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Prvak dana je petak. U njemu je stvoren Adem, u njemu je uveden u Džennet, u njemu je izveden iz njega, a Čas će nastupiti samo u petak.’“\u003c/p>\u003cp data-pair=\"114.4\" id=\"odlomak-114-4\">\u003cspan class=\"isnad\">Pričao nam je Rebi‘ ibn Sulejman, koji je rekao: pričao nam je Šuajb ibn el-Lejs, koji je rekao: pričao nam je Lejs ibn Sa‘d, od Džafera ibn Rebie, od Abdurrahmana ibn Hurmuza, da je rekao: čuo sam Ebu Hurejru kako govori: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Sunce nije izašlo nad danom poput petka. U njemu je stvoren Adem, u njemu je izveden iz Dženneta i u njemu je vraćen u njega.’“\u003c/p>\u003cp data-pair=\"114.5\" id=\"odlomak-114-5\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Džerir, od Mensura i Mugire, od Zijada ibn Kulejba Ebu Ma‘šera, od Ibrahima, od Karsea ed-Dabbija — a Karse je bio\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":115,"html":"\u003csection class=\"page\" data-page=\"115\" id=\"stranica-115\">\u003ch2>Stranica 115\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 115\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"115.1\" id=\"ar-odlomak-115-1\">\u003cspan class=\"isnad\">مِنَ الْقُرَّاءِ الأَوَّلِينَ- قَالَ: \u003c/span>[قَالَ سَلْمَانُ: قَالَ لي رسول الله ص:\n\nيَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ قُلْتُ: اللَّهُ وَرَسُولُهُ أَعْلَمُ، يَقُولُهَا ثَلاثًا:\nيَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ فِيهِ جُمِّعَ أَبُوكَ، أَوْ أَبُوكُمْ] .\u003c/p>\u003cp data-pair=\"115.2\" id=\"ar-odlomak-115-2\">\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ عُمَارَةَ الأَسَدِيُّ، قَالَ: حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى قَالَ: أَخْبَرَنَا شَيْبَانُ، عَنْ يَحْيَى، عَنْ أَبِي سَلَمَةَ، أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ يُحَدِّثُ أَنَّهُ سَمِعَ كَعْبًا يَقُولُ: \u003c/span>خَيْرُ يَوْمٍ طَلَعَتْ فِيهِ الشَّمْسُ يوم الجمعه، فيه خلق آدم ع، وَفِيهِ دَخَلَ الْجَنَّةَ، وَفِيهِ أُخْرِجَ مِنْهَا، وَفِيهِ تَقُومُ السَّاعَةُ.\u003c/p>\u003cp data-pair=\"115.3\" id=\"ar-odlomak-115-3\">\u003cspan class=\"isnad\">حَدَّثَنِي الْحُسَيْنُ بْنُ يَزِيدَ الآدَمِيُّ، قَالَ: حَدَّثَنَا روح بن عبادة، قَالَ: حَدَّثَنَا زكرياء بن إسحاق، عن عمرو بن دينار، عَنْ عُبَيْدِ بْنِ عُمَيْرٍ، قَالَ: \u003c/span>إِنَّ أَوَّلَ يَوْمٍ طَلَعَتْ فِيهِ شَمْسُهُ يَوْمُ الْجُمُعَةِ، وَهُوَ أَفْضَلُ الأَيَّامِ: فِيهِ خَلَقَ اللَّهُ تَعَالَى ذِكْرُهُ آدَمَ، خَلَقَهُ عَلَى مِثْلِ صُورَتِهِ، فَلَمَّا فَرَغَ عَطَسَ آدَمُ فَأَلْقَى اللَّهُ تعالى عَلَيْهِ الْحَمْدَ، فَقَالَ اللَّهُ: يَرْحَمُكَ رَبُّكَ.\u003c/p>\u003cp data-pair=\"115.4\" id=\"ar-odlomak-115-4\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، عَنْ أَبِي كُدَيْنَةَ، عَنْ مُغِيرَةَ، عَنْ زِيَادٍ، عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، عَنِ الْقَرْثَعِ، [عَنْ سَلْمَانَ، قَالَ: قال رسول الله ص: \u003c/span>أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟\n\nهُوَ يَوْمٌ جُمِّعَ فيه ابوك، او أبوكم آدم ع] .\u003c/p>\u003cp data-pair=\"115.5\" id=\"ar-odlomak-115-5\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، عَنْ أَبِي الأَحْوَصِ، عَنْ مُغِيرَةَ، عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، قَالَ: [قَالَ سَلْمَانُ قَالَ لي رسول الله ص: \u003c/span>يَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ مَرَّتَيْنِ أَوْ ثَلاثًا، قَالَ: هُوَ الْيَوْمُ الَّذِي جُمِّعَ فِيهِ أَبُوكُمْ آدَمُ، أَوْ جُمِّعَ فِيهِ أَبُوكُمْ] .\u003c/p>\u003cp data-pair=\"115.6\" id=\"ar-odlomak-115-6\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا حَسَنُ بْنُ عَطِيَّةَ، قَالَ: حَدَّثَنَا قَيْسٌ، عَنِ الأَعْمَشِ، عَنْ إِبْرَاهِيمَ عَنِ الْقَرْثَعِ، [عَنْ سَلْمَانَ، قَالَ: قَالَ\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 115\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"115.1\" id=\"odlomak-115-1\">\u003cspan class=\"isnad\">jedan od prvih učača Kur’ana — koji je rekao: \u003c/span>„Selman je rekao: ‘Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: Selmane, znaš li šta je petak? Odgovorio sam: Allah i Njegov Poslanik najbolje znaju.’ To je izgovorio tri puta: ‘Selmane, znaš li šta je petak? U njemu je sastavljen tvoj otac — ili vaš otac.’“\u003c/p>\u003cp data-pair=\"115.2\" id=\"odlomak-115-2\">\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Umara el-Esedi, koji je rekao: pričao nam je Ubejdullah ibn Musa, koji je rekao: obavijestio nas je Šejban, od Jahjaa, od Ebu Seleme, da je čuo Ebu Hurejru kako kazuje da je čuo Ka‘ba kako govori: \u003c/span>„Najbolji dan u kojem je Sunce izašlo jeste petak. U njemu je stvoren Adem, alejhis-selam, u njemu je ušao u Džennet, u njemu je izveden iz njega i u njemu će nastupiti Čas.“\u003c/p>\u003cp data-pair=\"115.3\" id=\"odlomak-115-3\">\u003cspan class=\"isnad\">Pričao mi je Husejn ibn Jezid el-Ademi, koji je rekao: pričao nam je Revh ibn Ubada, koji je rekao: pričao nam je Zekerijja ibn Ishak, od Amra ibn Dinara, od Ubejda ibn Umejra, koji je rekao: \u003c/span>„Prvi dan u kojem je Sunce izašlo bio je petak, a on je najbolji dan. U njemu je Allah, Uzvišen je spomen Njegov, stvorio Adema; stvorio ga je nalik njegovom liku. Kada je dovršio, Adem je kihnuo, pa mu je Uzvišeni Allah nadahnuo hvalu. Allah je rekao: ‘Smilovao ti se tvoj Gospodar.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u izrazu خلقه على مثل صورته nije izričito navedeno na koga se odnosi zamjenica „njegovom“; taj odnos nije ovdje razriješen dodavanjem tumačenja.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"115.4\" id=\"odlomak-115-4\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Ishak ibn Mensur, od Ebu Kudejne, od Mugire, od Zijada, od Ibrahima, od Alkame, od Karsea, od Selmana, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Znaš li šta je petak? To je dan u kojem je sastavljen tvoj otac — ili vaš otac — Adem, alejhis-selam.’“\u003c/p>\u003cp data-pair=\"115.5\" id=\"odlomak-115-5\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, od Ebu Ahvesa, od Mugire, od Ibrahima, od Alkame, koji je rekao: \u003c/span>„Selman je rekao: ‘Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: Selmane, znaš li šta je petak? — dva ili tri puta.’“ Rekao je: „To je dan u kojem je sastavljen vaš otac Adem — ili: u kojem je sastavljen vaš otac.“\u003c/p>\u003cp data-pair=\"115.6\" id=\"odlomak-115-6\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Hasen ibn Atijja, koji je rekao: pričao nam je Kajs, od A‘meša, od Ibrahima, od Karsea, od Selmana, koji je rekao: \u003c/span>„Rekao je\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":116,"html":"\u003csection class=\"page\" data-page=\"116\" id=\"stranica-116\">\u003ch2>Stranica 116\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 116\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"116.1\" id=\"ar-odlomak-116-1\">رسول الله ص: اتدرى ما الْجُمُعَةِ؟ أَوْ قَالَ: كَذَا، فِيهَا جُمِّعَ أَبُوكُمْ آدَمُ] .\u003c/p>\u003cp data-pair=\"116.2\" id=\"ar-odlomak-116-2\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَلِيِّ بْنِ الْحَسَنِ بْنِ شَقِيقٍ، قَالَ: سَمِعْتُ أَبِي يَقُولُ:\nأَخْبَرَنَا أَبُو حَمْزَةَ، عَنْ مَنْصُورٍ، عَنْ إِبْرَاهِيمَ، عَنِ الْقَرْثَعِ، [عَنْ سَلْمَانَ، قَالَ: قَالَ لِي رَسُولُ الله ص: \u003c/span>أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ قُلْتُ: لا، قَالَ: فِيهِ جُمِّعَ أَبُوكَ]\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 116\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"116.1\" id=\"odlomak-116-1\">Allahov Poslanik, sallallahu alejhi ve sellem: ‘Znaš li šta je petak?’ — ili je rekao tako nešto — ‘U njemu je sastavljen vaš otac Adem.’“\u003c/p>\u003cp data-pair=\"116.2\" id=\"odlomak-116-2\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Ali ibn el-Hasen ibn Šekik, koji je rekao: čuo sam svoga oca kako govori: obavijestio nas je Ebu Hamza, od Mensura, od Ibrahima, od Karsea, od Selmana, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: ‘Znaš li šta je petak?’ Odgovorio sam: ‘Ne.’ Rekao je: ‘U njemu je sastavljen tvoj otac.’“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":117,"html":"\u003csection class=\"page\" data-page=\"117\" id=\"stranica-117\">\u003ch2>Stranica 117\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 117\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"117.1\" id=\"ar-odlomak-117-1\">ذكر الوقت الذى فيه خلق آدم ع من يوم الجمعة والوقت الذي أهبط إلى الأرض\u003c/p>\u003cp data-pair=\"117.2\" id=\"ar-odlomak-117-2\">اخْتُلِفَ فِي ذَلِكَ، فَرُوِيَ عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ وَغَيْرِهِ فِي ذَلِكَ مَا \u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا ابْنُ إِدْرِيسَ، قَالَ: أَخْبَرَنَا مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رَسُولُ الله ص:\n\u003c/span>خَيْرُ يَوْمٍ طَلَعَتْ فِيهِ الشَّمْسُ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُسْكِنَ الْجَنَّةَ، وَفِيهِ اهبط، وفيه تقوم الساعة، وفيه ساعه- يقللها- لا يُوَافِقُهَا عَبْدٌ مُسْلِمٌ يَسْأَلُ اللَّهَ تعالى فيها خيرا الا آتاه الله إِيَّاهُ،] فَقَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: قَدْ عَلِمْتُ أَيُّ سَاعَةٍ هِيَ، هِيَ آخِرُ سَاعَاتِ النَّهَارِ مِنْ يَوْمِ الْجُمُعَةِ، قَالَ اللَّهُ عَزَّ وَجَلَّ:\n\n«خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ سَأُرِيكُمْ آياتِي فَلا تَسْتَعْجِلُونِ» .\u003c/p>\u003cp data-pair=\"117.3\" id=\"ar-odlomak-117-3\">\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا الْمُحَارِبِيُّ وَعَبْدَةُ بْنُ سُلَيْمَانَ وَأَسَدُ بْنُ عَمْرٍو، عَنْ مُحَمَّدِ بْنِ عَمْرٍو، قَالَ: حَدَّثَنَا أَبُو سَلَمَةَ، عَنْ ابى هريرة، عن النبي ص \u003c/span>نَحْوَهُ، وَذَكَرَ فِيهِ كَلامَ عَبْدِ اللَّهِ بْنِ سَلامٍ بِنَحْوِهِ.\u003c/p>\u003cp data-pair=\"117.4\" id=\"ar-odlomak-117-4\">\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، قَالَ: حدثنا أبو عاصم، قال: حدثنا عيسى، عن ابن أبي نجيح، عن مجاهد \u003c/span>في قوله عز وجل: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: قَوْلُ آدَمَ حِينَ خُلِقَ بَعْدَ كُلِّ شيء آخر النهار من يوم الجمعه، خُلِقَ الْخَلْقُ، فَلَمَّا أَحْيَا الرُّوحُ عَيْنَيْهِ وَلِسَانَهُ وَرَأْسَهُ وَلَمْ يَبْلُغْ أَسْفَلَهُ، قَالَ: يَا رَبِّ اسْتَعْجِلْ بِخَلْقِي قَبْلَ غُرُوبِ الشَّمْسِ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 117\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"117.1\" id=\"odlomak-117-1\">Spomen vremena u kojem je Adem, alejhis-selam, stvoren u petak i vremena kada je spušten na Zemlju\u003c/p>\u003cp data-pair=\"117.2\" id=\"odlomak-117-2\">O tome postoji razilaženje. Od Abdullaha ibn Selama i drugih preneseno je ono što \u003cspan class=\"isnad\">nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Ibn Idris, koji je rekao: obavijestio nas je Muhammed ibn Amr, od Ebu Seleme, od Ebu Hurejre, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Najbolji dan u kojem je Sunce izašlo jeste petak. U njemu je stvoren Adem, u njemu je nastanjen u Džennetu, u njemu je spušten i u njemu će nastupiti Čas. U njemu postoji čas’ — navodio ga je kao kratak — ‘koji muslimanski rob ne pogodi moleći u njemu Uzvišenog Allaha za dobro a da mu Allah to ne dadne.’“ Abdullah ibn Selam rekao je: „Znam koji je to čas. To je posljednji od dnevnih sati petka.“ Allah, Silan i Uzvišen, rekao je: „Čovjek je stvoren od žurbe. Pokazat ću vam Svoje znakove, pa Me ne požurujte.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"117.3\" id=\"odlomak-117-3\">\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričali su nam Muharibi, Abde ibn Sulejman i Esed ibn Amr, od Muhammeda ibn Amra, koji je rekao: pričao nam je Ebu Selema, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, \u003c/span>nešto slično tome. U tome je naveo i riječi Abdullaha ibn Selama, slično navedenom.\u003c/p>\u003cp data-pair=\"117.4\" id=\"odlomak-117-4\">\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa, od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „Čovjek je stvoren od žurbe.“ Rekao je: „To su Ademove riječi kada je, nakon svega ostalog, stvoren pri kraju dana petka. Stvorenja su bila stvorena, pa kada je duh oživio njegove oči, jezik i glavu, a nije još stigao do njegovog donjeg dijela, rekao je: ‘Gospodaru moj, požuri s mojim stvaranjem prije nego što Sunce zađe.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":118,"html":"\u003csection class=\"page\" data-page=\"118\" id=\"stranica-118\">\u003ch2>Stranica 118\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 118\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"118.1\" id=\"ar-odlomak-118-1\">\u003cspan class=\"isnad\">حدثني الحارث، قال: حدثنا الحسن، قال: حدثنا ورقاء، عن ابن أبي نجيح، عن مجاهد \u003c/span>مثله.\u003c/p>\u003cp data-pair=\"118.2\" id=\"ar-odlomak-118-2\">\u003cspan class=\"isnad\">حَدَّثَنَا الْقَاسِمُ، قَالَ: حَدَّثَنَا الْحُسَيْنُ، قَالَ: حَدَّثَنَا حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: قَالَ مُجَاهِدٌ: \u003c/span>«خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: آدَمُ حِينَ خُلِقَ بعد كل شيء، ثم ذكره نحوه، غير أنه قال في حديثه: استعجل بخلقي، قد غربت الشمس.\u003c/p>\u003cp data-pair=\"118.3\" id=\"ar-odlomak-118-3\">\u003cspan class=\"isnad\">حَدَّثَنِي يونس، قال: أخبرنا ابن وهب، قال: قال ابن زيد \u003c/span>في قوله:\n\n«خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قال: على عجل خلق آدم آخر ذلك اليوم من ذينك اليومين- يريد يوم الجمعة- وخلقه على عجلة وجعله عجولا.\u003c/p>\u003cp data-pair=\"118.4\" id=\"ar-odlomak-118-4\">وقد زعم بعضهم أن الله عز وجل أسكن آدم وزوجته الفردوس لساعتين مضتا من نهار يوم الجمعة، وقيل لثلاث ساعات مضين منه، وأهبطه إلى الأرض لسبع ساعات مضين من ذلك اليوم، فكان مقدار مكثهما في الجنة خمس ساعات منه وقيل: كان ذلك ثلاث ساعات وقال بعضهم: اخرج آدم ع من الجنه الساعة التاسعة أو العاشرة ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"118.5\" id=\"ar-odlomak-118-5\">قال أبو جعفر: قرأت على عبدان بن محمد المروزي، قال: \u003cspan class=\"isnad\">حَدَّثَنَا عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع، عن أنس عن أبي العالية، قال: \u003c/span>أخرج آدم من الجنة للساعة التاسعة أو العاشرة، فقال لي: نعم، لخمسة أيام مضين من نيسان.\u003c/p>\u003cp data-pair=\"118.6\" id=\"ar-odlomak-118-6\">فإن كان قائل هذا القول أراد الله أن تبارك وتعالى أسكن آدم وزوجته الفردوس لساعتين مضتا من نهار يوم الجمعة من أيام أهل الدنيا التي هي على\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 118\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"118.1\" id=\"odlomak-118-1\">\u003cspan class=\"isnad\">Pričao mi je Haris, koji je rekao: pričao nam je Hasen, koji je rekao: pričao nam je Verka, od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>isto to.\u003c/p>\u003cp data-pair=\"118.2\" id=\"odlomak-118-2\">\u003cspan class=\"isnad\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao nam je Hadždžadž, od Ibn Džurejdža, koji je rekao: Mudžahid je rekao, \u003c/span>o riječima: „Čovjek je stvoren od žurbe“: „Adem, kada je stvoren nakon svega ostalog.“ Zatim je naveo nešto slično tome, osim što je u svojoj predaji rekao: „Požuri s mojim stvaranjem; Sunce je već zašlo.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"118.3\" id=\"odlomak-118-3\">\u003cspan class=\"isnad\">Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, \u003c/span>o riječima: „Čovjek je stvoren od žurbe“: „U žurbi je Adem stvoren, na kraju toga dana od ona dva dana“ — misli na petak — „stvorio ga je u žurbi i učinio ga žurnim.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"118.4\" id=\"odlomak-118-4\">Neki su tvrdili da je Allah, Silan i Uzvišen, nastanio Adema i njegovu suprugu u Firdevsu nakon što su prošla dva dnevna sata petka; rečeno je i nakon što su prošla tri sata. Spustio ga je na Zemlju nakon što je prošlo sedam sati toga dana. Prema tome, njihov boravak u Džennetu trajao je pet njegovih sati; rečeno je i tri sata. Neki su rekli da je Adem, alejhis-selam, izveden iz Dženneta u devetom ili desetom satu. Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"118.5\" id=\"odlomak-118-5\">Ebu Džafer kaže: Čitao sam Abdanu ibn Muhammedu el-Merveziju, koji je rekao: \u003cspan class=\"isnad\">pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, od Enesa, od Ebu Alije, koji je rekao: \u003c/span>„Adem je izveden iz Dženneta u devetom ili desetom satu.“ Pa mi je rekao: „Da, nakon što je prošlo pet dana nisana.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u izvoru stoji عن الربيع، عن أنس kao dva uzastopna imena, pa nisu prešutno spojena u ime Rebi‘ ibn Enes. „Nisan“ je naziv mjeseca naveden u predaji.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"118.6\" id=\"odlomak-118-6\">Ako je onaj koji ovo kaže htio reći da je Allah, Blagoslovljen i Uzvišen, nastanio Adema i njegovu suprugu u Firdevsu nakon što su prošla dva dnevna sata petka od dana ovoga svijeta, koji su\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":119,"html":"\u003csection class=\"page\" data-page=\"119\" id=\"stranica-119\">\u003ch2>Stranica 119\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 119\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"119.1\" id=\"ar-odlomak-119-1\">ما هي به اليوم، فلم يبعد قوله من الصواب في ذلك، لأن الأخبار إذا كانت واردة عن السلف من أهل العلم، بأن آدم خلق في آخر ساعة من اليوم السادس من الأيام التي مقدار اليوم الواحد منها ألف سنة من سنيننا فمعلوم أن الساعة الواحدة من ساعات ذلك اليوم ثلاثة وثمانون عاما من أعوامنا، وقد ذكرنا أن آدم بعد أن خمر ربنا عز وجل طينته بقي قبل أن ينفخ فيه الروح أربعين عاما، وذلك لا شك أنه عنى به من أعوامنا وسنيننا، ثم من بعد أن نفخ فيه الروح إلى أن تناهى أمره، وأسكن الفردوس، وأهبط إلى الأرض- غير مستنكر أن يكون كان مقداره من سنيننا قدر خمس وثلاثين سنة\u003c/p>\u003cp data-pair=\"119.2\" id=\"ar-odlomak-119-2\">فإن كان أراد أنه أسكن الفردوس لساعتين مضتا من نهار يوم الجمعة من الأيام التي مقدار اليوم الواحد منها ألف سنة من سنيننا، فقد قال غير الحق، وذلك أن جميع من حفظ له قول في ذلك من أهل العلم، فإنه كان يقول إن آدم نفخ فيه الروح في آخر النهار من يوم الجمعة قبل غروب الشمس من ذلك اليوم ثم الاخبار عن رسول الله ص متظاهرة بأن الله تبارك وتعالى أسكنه الجنة فيه، وفيه أهبطه إلى الأرض فإن كان ذلك صحيحا، فمعلوم أن آخر ساعة من نهار يوم من أيام الآخرة ومن الأيام التي اليوم الواحد منها مقداره ألف سنة من سنيننا، إنما هي ساعة بعد مضي إحدى عشرة ساعة، وذلك ساعة من اثنتي عشرة ساعة، وهي ثلاث وثمانون سنة وأربعة أشهر من سنيننا، فآدم صلوات الله عليه إذ كان الأمر كذلك، إنما خلق لمضي إحدى عشرة ساعة من نهار يوم الجمعة من الأيام التي اليوم الواحد منها ألف سنة من سنيننا، فمكث جسدا ملقى لم ينفخ فيه الروح أربعين عاما من أعوامنا ثم نفخ فيه الروح فكان مكثه في السماء بعد ذلك ومقامه في الجنة، إلى أن أصاب الخطيئة وأهبط إلى الأرض ثلاثا وأربعين سنة من سنيننا وأربعة أشهر، وذلك ساعة من ساعات يوم من الأيام الستة التي خلق الله تعالى فيها الخلق\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 119\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"119.1\" id=\"odlomak-119-1\">onakvi kakvi su i danas, onda njegovo mišljenje o tome nije daleko od ispravnog. Ako predaje učenih prethodnika govore da je Adem stvoren u posljednjem satu šestog dana, od dana u kojima jedan dan traje hiljadu naših godina, onda je poznato da jedan sat toga dana traje osamdeset tri naše godine. Već smo spomenuli da je Adem, nakon što je naš Gospodar, Silan i Uzvišen, umijesio njegovu glinu, ostao četrdeset godina prije nego što je u njega udahnuo duh. Nema sumnje da se time mislilo na naše godine. Zatim, od udahnuća duha u njega dok nije dovršeno njegovo stanje, nastanjen u Firdevsu i spušten na Zemlju, nije neobično da je prošlo trideset pet naših godina.\u003c/p>\u003cp data-pair=\"119.2\" id=\"odlomak-119-2\">Ako je, međutim, mislio da je nastanjen u Firdevsu nakon što su prošla dva dnevna sata petka od dana u kojima jedan dan traje hiljadu naših godina, onda nije rekao istinu. Svi učeni ljudi čije je mišljenje o tome sačuvano govorili su da je u Adema udahnut duh pri kraju dana petka, prije zalaska Sunca toga dana. Potom brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, međusobno potvrđuju da ga je Allah, Blagoslovljen i Uzvišen, toga dana nastanio u Džennetu i toga dana spustio na Zemlju. Ako je to tačno, onda je poznato da je posljednji dnevni sat jednoga od dana budućeg svijeta, dana u kojima jedan dan traje hiljadu naših godina, sat nakon što je već prošlo jedanaest sati: jedan od dvanaest sati. To su osamdeset tri godine i četiri mjeseca od naših godina. Ako je stvar tako stajala, Adem, neka su Allahovi blagoslovi na njemu, stvoren je nakon što je prošlo jedanaest dnevnih sati petka, od dana u kojima jedan dan traje hiljadu naših godina. Ostao je kao položeno tijelo, bez udahnutog duha, četrdeset naših godina. Zatim je u njega udahnut duh, pa je njegov boravak na nebu i u Džennetu, sve dok nije počinio grijeh i spušten na Zemlju, trajao četrdeset tri naše godine i četiri mjeseca. To je jedan od sati jednoga od šest dana u kojima je Uzvišeni Allah stvorio stvorenja. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: broj „trideset pet godina“ u prvom dijelu i kasniji proračun „četrdeset tri godine i četiri mjeseca“ preneseni su kako stoje u izvoru; nisu računskim putem usaglašavani.⟧\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":120,"html":"\u003csection class=\"page\" data-page=\"120\" id=\"stranica-120\">\u003ch2>Stranica 120\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 120\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"120.1\" id=\"ar-odlomak-120-1\">وَقَدْ \u003cspan class=\"isnad\">حَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ سَعْدٍ، قَالَ:\nحَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أخبرني أبي، عن أبي صالح، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>خَرَجَ آدَمُ مِنَ الْجَنَّةِ بَيْنَ الصَّلاتَيْنِ: صَلاةِ الظُّهْرِ وَصَلاةِ الْعَصْرِ، فَأُنْزِلَ إِلَى الأَرْضِ وَكَانَ مُكْثُهُ فِي الْجَنَّةِ نصف يوم يوم من ايام الآخرة، وهو خمسمائة سَنَةٍ، مِنْ يَوْمٍ كَانَ مِقْدَارُهُ اثْنَتَيْ عَشْرَةَ سَاعَةً، وَالْيَوْمُ أَلْفُ سَنَةٍ مِمَّا يَعُدُّ أَهْلُ الدُّنْيَا، وَهَذَا أَيْضًا قَوْلٌ خِلافُ مَا وَرَدَتْ به الاخبار عن رسول الله ص، وَعَنِ السَّلَفِ مِنْ عُلَمَائِنَا.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 120\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"120.1\" id=\"odlomak-120-1\">\u003cspan class=\"isnad\">Pričao mi je Haris ibn Muhammed, koji je rekao: pričao nam je Muhammed ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: \u003c/span>„Adem je izašao iz Dženneta između dva namaza: podne-namaza i ikindije. Spušten je na Zemlju, a u Džennetu je boravio pola dana, jednog od dana budućeg svijeta. To je pet stotina godina, od dana koji traje dvanaest sati, a dan je hiljadu godina kakve stanovnici ovoga svijeta broje.“ I ovo mišljenje suprotno je onome što je došlo u predajama od Allahovog Poslanika, sallallahu alejhi ve sellem, i od učenih prethodnika među našim učenjacima.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":121,"html":"\u003csection class=\"page\" data-page=\"121\" id=\"stranica-121\">\u003ch2>Stranica 121\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 121\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"121.1\" id=\"ar-odlomak-121-1\">القول في الموضع الذي أهبط آدم وحواء إليه من الأرض حين أهبطا إليها\u003c/p>\u003cp data-pair=\"121.2\" id=\"ar-odlomak-121-2\">ثم إن الله عز وجل أهبط آدم قبل غروب الشمس من اليوم الذي خلقه فيه- وذلك يوم الجمعة- من السماء مع زوجته، وأنزل آدم- فيما قال علماء س
