لف أمة نبينا ص- بالهند.\u003c/p>\u003cp data-pair=\"121.3\" id=\"ar-odlomak-121-3\">ذكر من حضرنا ذكره ممن قال ذلك منهم:\u003c/p>\u003cp data-pair=\"121.4\" id=\"ar-odlomak-121-4\">٢٢٠- \u003cspan class=\"isnad\">حَدَّثَنَا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال:\n\nأخبرنا معمر، عن قتادة، قال: \u003c/span>أهبط الله عز وجل آدم إلى الأرض، وكان مهبطه بأرض الهند.\u003c/p>\u003cp data-pair=\"121.5\" id=\"ar-odlomak-121-5\">\u003cspan class=\"isnad\">حَدَّثَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ: حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، قَالَ: أَخْبَرَنَا عَطَاءُ بْنُ السَّائِبِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: \u003c/span>إِنَّ أَوَّلَ مَا أَهْبَطَ اللَّهُ تَعَالَى آدَمَ أهبطه بدهنا أَرْضِ الْهِنْدِ.\u003c/p>\u003cp data-pair=\"121.6\" id=\"ar-odlomak-121-6\">\u003cspan class=\"isnad\">حدثت عن عمار، قال: حَدَّثَنَا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أنس، عن أبي العالية، قال: \u003c/span>أهبط آدم إلى الهند.\u003c/p>\u003cp data-pair=\"121.7\" id=\"ar-odlomak-121-7\">\u003cspan class=\"isnad\">حَدَّثَنِي ابْنُ سِنَانٍ، قَالَ: حَدَّثَنَا الْحَجَّاجُ، قَالَ: حَدَّثَنَا حَمَّادُ بن سلمة، عن عَلِيُّ بْنُ زَيْدٍ، عَنْ يُوسُفَ بْنِ مِهْرَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\n[قال على بن ابى طالب ع: \u003c/span>أَطْيَبُ أَرْضٍ فِي الأَرْضِ رِيحًا أَرْضُ الْهِنْدِ، أُهْبِطَ بِهَا آدَمُ، فَعَلِقَ شَجَرُهَا مِنْ رِيحِ الْجَنَّةِ] .\u003c/p>\u003cp data-pair=\"121.8\" id=\"ar-odlomak-121-8\">\u003cspan class=\"isnad\">حَدَّثَنِي الْحَارِثُ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: حَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، عَنْ أَبِيهِ، عن أبي صالح، عن ابن عباس، قال: \u003c/span>أُهْبِطَ آدَمُ بِالْهِنْدِ، وَحَوَّاءُ بِجِدَّةَ، فَجَاءَ فِي طَلَبِهَا حَتَّى اجْتَمَعَا، فَازْدَلَفَتْ إِلَيْهِ حَوَّاءُ، فَلِذَلِكَ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 121\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"121.1\" id=\"odlomak-121-1\">Rasprava o mjestu na Zemlji na koje su Adem i Havva spušteni kada su spušteni na nju\u003c/p>\u003cp data-pair=\"121.2\" id=\"odlomak-121-2\">Zatim je Allah, Silan i Uzvišen, prije zalaska Sunca onoga dana kada ga je stvorio — a to je bio petak — spustio Adema s neba zajedno s njegovom suprugom. Prema riječima učenih prethodnika iz ummeta našeg Vjerovjesnika, sallallahu alejhi ve sellem, Adema je spustio u Indiju.\u003c/p>\u003cp data-pair=\"121.3\" id=\"odlomak-121-3\">Spomen onih koji su to rekli, a kojih se sada sjećamo:\u003c/p>\u003cp data-pair=\"121.4\" id=\"odlomak-121-4\">220 — \u003cspan class=\"isnad\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, koji je rekao: \u003c/span>„Allah, Silan i Uzvišen, spustio je Adema na Zemlju, a njegovo mjesto spuštanja bilo je u zemlji Indiji.“\u003c/p>\u003cp data-pair=\"121.5\" id=\"odlomak-121-5\">\u003cspan class=\"isnad\">Pričao nam je Amr ibn Ali, koji je rekao: pričao nam je Imran ibn Ujejna, koji je rekao: obavijestio nas je Ata ibn es-Saib, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: \u003c/span>„Kada je Uzvišeni Allah prvi put spustio Adema, spustio ga je u Dehnu, u zemlji Indiji.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: toponim je u izvoru zapisan بدهنا, bez oznaka koje bi sigurno odredile izgovor.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"121.6\" id=\"odlomak-121-6\">\u003cspan class=\"isnad\">Preneseno mi je od Ammara, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, od Ebu Alije, koji je rekao: \u003c/span>„Adem je spušten u Indiju.“\u003c/p>\u003cp data-pair=\"121.7\" id=\"odlomak-121-7\">\u003cspan class=\"isnad\">Pričao mi je Ibn Sinan, koji je rekao: pričao nam je Hadždžadž, koji je rekao: pričao nam je Hammad ibn Selema, od Alija ibn Zejda, od Jusufa ibn Mihrana, od Ibn Abbasa, koji je rekao: \u003c/span>„Ali ibn Ebu Talib, alejhis-selam, rekao je: ‘Zemlja najljepšeg mirisa na Zemlji jeste Indija. U nju je spušten Adem, pa je njeno drveće upilo džennetski miris.’“\u003c/p>\u003cp data-pair=\"121.8\" id=\"odlomak-121-8\">\u003cspan class=\"isnad\">Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, od svoga oca, od Ebu Saliha, od Ibn Abbasa, koji je rekao: \u003c/span>„Adem je spušten u Indiju, a Havva u Džiddu. Krenuo ju je tražiti, sve dok se nisu sastali. Havva mu se približila, pa je zato\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":122,"html":"\u003csection class=\"page\" data-page=\"122\" id=\"stranica-122\">\u003ch2>Stranica 122\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 122\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"122.1\" id=\"ar-odlomak-122-1\">سُمِّيَتِ الْمُزْدَلِفَةَ، وَتَعَارَفَا بِعَرَفَاتٍ، فَلِذَلِكَ سُمِّيَتْ عَرَفَاتٍ، وَاجْتَمَعَا بِجَمْعٍ فَلِذَلِكَ سُمِّيَتْ جَمْعًا قَالَ: وَأُهْبِطَ آدَمُ عَلَى جَبَلٍ بِالْهِنْدِ يُقَالُ لَهُ بُوذُ.\u003c/p>\u003cp data-pair=\"122.2\" id=\"ar-odlomak-122-2\">\u003cspan class=\"isnad\">حدثنا أبو همام، قال: حدثني أبي، قال: حَدَّثَنَا زِيَادُ بْنُ خَيْثَمَةَ، عَنْ أَبِي يَحْيَى بَائِعِ الْقَتِّ، قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبَّاسٍ \u003c/span>أَنَّ آدَمَ نَزَلَ حِينَ نَزَلَ بِالْهِنْدِ.\u003c/p>\u003cp data-pair=\"122.3\" id=\"ar-odlomak-122-3\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال: \u003c/span>وأما أهل التوراة فإنهم قالوا: أهبط آدم بالهند على جبل يقال له واسم، عند وإذ يقال له بهيل بين الدهنج والمندل: بلدين بأرض الهند قالوا:\n\nوأهبطت حواء بجدة من أرض مكة.\u003c/p>\u003cp data-pair=\"122.4\" id=\"ar-odlomak-122-4\">وقال آخرون: بل أهبط آدم بسرنديب، على جبل يدعى بوذ، وحواء بجدة من أرض مكة، وإبليس بميسان، والحية بأصبهان وقد قيل: أهبطت الحية بالبرية، وإبليس بساحل بحر الأيلة.\u003c/p>\u003cp data-pair=\"122.5\" id=\"ar-odlomak-122-5\">وهذا مما لا يوصل إلى علم صحته إلا بخبر يجيء مجيء الحجة، ولا يعلم خبر في ذلك ورد كذلك، غير ما ورد من خبر هبوط آدم بأرض الهند، فإن ذلك مما لا يدفع صحته علماء الإسلام وأهل التوراة والإنجيل، والحجة قد ثبتت بأخبار بعض هؤلاء وذكر أن الجبل الذي اهبط عليه آدم ع ذروته من أقرب ذرا جبال الأرض إلى السماء، وأن آدم حين أهبط عليه كانت رجلاه عليه ورأسه في السماء يسمع دعاء الملائكة وتسبيحهم، فكان آدم يأنس بذلك، وكانت\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 122\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"122.1\" id=\"odlomak-122-1\">nazvana Muzdelifa. Prepoznali su se na Arefatu, pa je zato nazvan Arefatom. Sastali su se u Džem‘u, pa je zato nazvan Džem‘om.“ Rekao je: „Adem je spušten na planinu u Indiji koja se zove Buz.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: ime planine u izvoru glasi بوذ; izgovor je prenesen približno.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"122.2\" id=\"odlomak-122-2\">\u003cspan class=\"isnad\">Pričao nam je Ebu Hemmam, koji je rekao: pričao mi je moj otac, koji je rekao: pričao nam je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao nam je Abdullah ibn Abbas \u003c/span>da je Adem, kada je spušten, spušten u Indiju.“\u003c/p>\u003cp data-pair=\"122.3\" id=\"odlomak-122-3\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: \u003c/span>„Sljedbenici Tevrata kazali su: Adem je spušten u Indiju, na planinu koja se zove Vasim, kod doline koja se naziva Behil, između Dehendža i Mendela, dvaju mjesta u zemlji Indiji. Rekli su: Havva je spuštena u Džiddu, u mekanskom kraju.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: imena واسم، بهيل، الدهنج، المندل prenesena su približno, jer nemaju sigurno označen izgovor. Izvor između prvih dvaju imena ima عند وإذ, što je nejasan zapis; „kod doline“ kontekstualno je čitanje koje treba provjeriti u štampanom izdanju.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"122.4\" id=\"odlomak-122-4\">Drugi su rekli: „Naprotiv, Adem je spušten na Serendib, na planinu koja se zove Buz, Havva u Džiddu u mekanskom kraju, Iblis u Mejsan, a zmija u Isfahan.“ Rečeno je i da je zmija spuštena u pustinju, a Iblis na obalu mora Ejle.\u003c/p>\u003cp data-pair=\"122.5\" id=\"odlomak-122-5\">Ovo pripada onome čija se tačnost ne može spoznati osim predajom koja ima dokaznu snagu. Nije poznata takva predaja o tome, osim predaje o Ademovom spuštanju u Indiju. Njenu tačnost ne odbacuju islamski učenjaci niti sljedbenici Tevrata i Indžila, a dokaz je uspostavljen izvješćima nekih od njih. Navedeno je da je vrh planine na koju je Adem, alejhis-selam, spušten jedan od zemaljskih planinskih vrhova najbližih nebu. Kada je Adem spušten na nju, njegove su noge bile na njoj, a glava na nebu; čuo je dove i slavljenje meleka i to mu je pružalo prisnost. Meleki su ga se\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":123,"html":"\u003csection class=\"page\" data-page=\"123\" id=\"stranica-123\">\u003ch2>Stranica 123\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 123\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"123.1\" id=\"ar-odlomak-123-1\">الملائكة تهابه، فنقص من طول آدم لذلك.\u003c/p>\u003cp data-pair=\"123.2\" id=\"ar-odlomak-123-2\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"123.3\" id=\"ar-odlomak-123-3\">\u003cspan class=\"isnad\">حَدَّثَنَا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا هشام بن حسان، عن سوار ختن عطاء، عن عطاء بن أبي رباح، قال: \u003c/span>لما أهبط الله عز وجل آدم من الجنة كان رجلاه في الأرض، ورأسه في السماء، يسمع كلام أهل السماء ودعاءهم، يأنس إليهم، فهابته الملائكة حتى شكت إلى الله تعالى في دعائها وفي صلاتها، فخفضه الى الارض، فلما فقد ما كان يسمع منهم استوحش حتى شكا ذلك إلى الله عز وجل في دعائه وفي صلاته، فوجه إلى مكة فصار موضع قدمه قرية، وخطوته مفازة، حتى انتهى إلى مكة، وأنزل الله تعالى ياقوتة من ياقوت الجنة، فكانت على موضع البيت الآن، فلم يزل يطوف به حتى أنزل الله تعالى الطوفان، فرفعت تلك الياقوتة حتى بعث الله تعالى ابراهيم الخليل ع فبناه، فذلك قوله تعالى:\n«وَإِذْ بَوَّأْنا لِإِبْراهِيمَ مَكانَ الْبَيْتِ» .\u003c/p>\u003cp data-pair=\"123.4\" id=\"ar-odlomak-123-4\">\u003cspan class=\"isnad\">حدثنا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن قتادة، قال: \u003c/span>وضع الله تعالى البيت مع آدم، فكان رأسه في السماء ورجلاه في الأرض، فكانت الملائكة تهابه، فنقص إلى ستين ذراعا، فحزن آدم إذ فقد أصوات الملائكة وتسبيحهم، فشكا ذلك إلى الله، فقال الله: يا آدم، إني أهبطت لك بيتا تطوف به كما يطاف حول عرشي، وتصلي عنده كما يصلى عند عرشي فانطلق اليه آدم ع، فخرج ومد له في خطوه، فكان بين كل خطوة مفازة، فلم تزل تلك المفاوز بعد ذلك، فاتى آدم ع البيت، فطاف به ومن بعده من الأنبياء\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 123\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"123.1\" id=\"odlomak-123-1\">bojali, pa je zbog toga Ademova visina smanjena.\u003c/p>\u003cp data-pair=\"123.2\" id=\"odlomak-123-2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"123.3\" id=\"odlomak-123-3\">\u003cspan class=\"isnad\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Hišam ibn Hassan, od Sevvara, Ataovog zeta, od Ataa ibn Ebu Rebaha, koji je rekao: \u003c/span>„Kada je Allah, Silan i Uzvišen, spustio Adema iz Dženneta, noge su mu bile na Zemlji, a glava na nebu. Slušao je govor stanovnika neba i njihove dove i osjećao prisnost prema njima. Meleki su ga se bojali toliko da su se Uzvišenom Allahu požalili u svojim dovama i namazima, pa ga je spustio na Zemlju. Kada više nije čuo ono što je od njih slušao, osjetio je osamljenost, pa se Allahu, Silnom i Uzvišenom, požalio u svojoj dovi i namazu. Usmjeren je prema Meki. Mjesto svakog njegovog stopala postalo je naselje, a prostor njegova koraka pustara, sve dok nije stigao u Meku. Uzvišeni Allah spustio je rubin od džennetskih rubina, pa je bio na mjestu na kojem je sada Hram. Neprestano ga je obilazio, sve dok Uzvišeni Allah nije poslao Potop. Tada je taj rubin podignut, sve dok Uzvišeni Allah nije poslao Ibrahima, prisnog prijatelja, alejhis-selam, pa ga je on izgradio. To su Njegove, Uzvišeni je On, riječi: ‘I kada smo Ibrahimu odredili mjesto Hrama.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Hadždž, 22:26, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"123.4\" id=\"odlomak-123-4\">\u003cspan class=\"isnad\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, koji je rekao: \u003c/span>„Uzvišeni Allah postavio je Hram zajedno s Ademom. Njegova glava bila je na nebu, a noge na Zemlji. Meleki su ga se bojali, pa je smanjen na šezdeset lakata. Adem se rastužio kada više nije čuo glasove meleka i njihovo slavljenje, pa se požalio Allahu. Allah je rekao: ‘Ademe, spustio sam ti Hram koji ćeš obilaziti kao što se obilazi oko Moga Arša i kod kojeg ćeš klanjati kao što se klanja kod Moga Arša.’ Adem, alejhis-selam, krenuo je prema njemu. Izašao je, a njegov korak učinjen je dugim; između svaka dva koraka bila je pustara. Te su pustare ostale i poslije toga. Adem, alejhis-selam, došao je Hramu i obilazio ga, kao i vjerovjesnici poslije njega.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":124,"html":"\u003csection class=\"page\" data-page=\"124\" id=\"stranica-124\">\u003ch2>Stranica 124\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 124\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"124.1\" id=\"ar-odlomak-124-1\">\u003cspan class=\"isnad\">حدثني الحارث، قال: حدثنا ابن سعد، قال: حَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أَخْبَرَنِي أَبِي، عن أبي صالح، عن ابن عباس، قال: \u003c/span>لما حط من طول آدم ع إِلَى سِتِّينَ ذِرَاعًا أَنْشَأَ يَقُولُ: رَبِّ، كُنْتُ جَارَكَ فِي دَارِكَ، لَيْسَ لِي رَبٌّ غَيْرُكَ، وَلا رَقِيبٌ دُونَكَ، آكُلُ فِيهَا رَغَدًا، وَأَسْكُنُ حَيْثُ أَحْبَبْتُ، فَأَهْبَطْتَنِي إِلَى هَذَا الْجَبَلِ الْمُقَدَّسِ، فَكُنْتُ أَسْمَعُ أَصْوَاتَ الْمَلائِكَةِ، وَأَرَاهُمْ كَيْفَ يَحُفُّونَ بِعَرْشِكَ، وَأَجِدُ رِيحَ الْجَنَّةِ وَطِيبَهَا، ثُمَّ أَهْبَطْتَنِي إِلَى الأَرْضِ، وَحَطَطْتَنِي إِلَى سِتِّينَ ذِرَاعًا، فَقَدِ انْقَطَعَ عَنِّي الصَّوْتُ وَالنَّظَرُ، وَذَهَبَ عَنِّي رِيحَ الْجَنَّةِ فَأَجَابَهُ اللَّهُ عَزَّ وَجَلَّ: لِمَعْصِيَتِكَ يَا آدَمُ فَعَلْتُ ذَلِكَ بِكَ\u003c/p>\u003cp data-pair=\"124.2\" id=\"ar-odlomak-124-2\">فَلَمَّا رَأَى اللَّهُ تَعَالَى عُرْيَ آدَمَ وَحَوَّاءَ أَمَرَهُ أَنْ يَذْبَحَ كَبْشًا مِنَ الضَّأْنِ مِنَ الثَّمَانِيَةِ الأَزْوَاجِ الَّتِي أَنْزَلَ مِنَ الْجَنَّةِ، فَأَخَذَ كَبْشًا فَذَبَحَهُ، ثُمَّ أَخَذَ صُوفَهُ فَغَزَلَتْهُ حَوَّاءُ، وَنَسَجَهُ هُوَ وَحَوَّاءُ، فَنَسَجَ آدَمُ جُبَّةً لِنَفْسِهِ، وَجَعَلَ لِحَوَّاءَ دِرْعًا وخمارا، فلبسا ذلك، واوحى اللَّهُ تَعَالَى إِلَى آدَمَ أَنْ لِي حَرَمًا بِحِيَالِ عَرْشِي، فَانْطَلِقْ فَابْنِ لِي فِيهِ بَيْتًا، ثم حف به كما رايت ملائكى يَحُفُّونَ بِعَرْشِي، فَهُنَالِكَ أَسْتَجِيبُ لَكَ وَلِوَلَدِكَ، مَنْ كَانَ مِنْهُمْ فِي طَاعَتِي، فَقَالَ آدَمُ: أَيْ رَبِّ، فَكَيْفَ لِي بِذَلِكَ، لَسْتُ أَقْوَى عَلَيْهِ وَلا أَهْتَدِي لَهُ! فَقَيَّضَ اللَّهُ لَهُ مَلَكًا، فَانْطَلَقَ بِهِ نَحْوَ مَكَّةَ، فَكَانَ آدَمُ إِذَا مَرَّ بِرَوْضَةٍ وَمَكَانٍ يُعْجِبُهُ قَالَ لِلْمَلَكِ: انْزِلْ بنا هاهنا، فَيَقُولُ لَهُ الْمَلَكُ: مَكَانَكَ، حَتَّى قَدِمَ مَكَّةَ، فَكَانَ كُلُّ مَكَانٍ نَزَلَ بِهِ صَارَ عُمْرَانًا، وَكُلُّ مَكَانٍ تَعَدَّاهُ صَارَ مَفَاوِزَ وَقِفَارًا، فَبَنَى الْبَيْتَ مِنْ خَمْسَةِ أَجْبُلٍ: مِنْ طُورِ سَيْنَاءَ وَطُورِ زَيْتُونٍ وَلِبْنَانَ وَالْجُودِيِّ، وَبَنَى قَوَاعِدَهُ مِنْ حِرَاءَ، فَلَمَّا فَرَغَ مِنْ بِنَائِهِ خَرَجَ بِهِ الْمَلَكُ إِلَى عَرَفَاتٍ، فَأَرَاهُ الْمَنَاسِكَ كُلَّهَا الَّتِي تَفْعَلُهَا النَّاسُ الْيَوْمَ، ثُمَّ قَدِمَ بِهِ مَكَّةَ، فَطَافَ بِالْبَيْتِ أُسْبُوعًا، ثُمَّ رَجَعَ إِلَى أَرْضِ الْهِنْدِ، فَمَاتَ عَلَى بُوذَ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 124\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"124.1\" id=\"odlomak-124-1\">\u003cspan class=\"isnad\">Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: \u003c/span>„Kada je Ademova, alejhis-selam, visina smanjena na šezdeset lakata, počeo je govoriti: ‘Gospodaru moj, bio sam Tvoj susjed u Tvome domu. Nisam imao drugog gospodara osim Tebe niti nadzornika mimo Tebe. Jeo sam u njemu obilno i nastanjivao se gdje sam želio. Spustio si me na ovu svetu planinu, pa sam slušao glasove meleka, gledao kako okružuju Tvoj Arš i osjećao džennetski miris i njegovu ljepotu. Zatim si me spustio na Zemlju i smanjio me na šezdeset lakata. Više ne čujem glasove i ne vidim ih, a džennetski miris nestao je od mene.’ Allah, Silan i Uzvišen, odgovorio mu je: ‘Zbog tvoje nepokornosti, Ademe, učinio sam ti to.’\u003c/p>\u003cp data-pair=\"124.2\" id=\"odlomak-124-2\">Kada je Uzvišeni Allah vidio Ademovu i Havvinu golotinju, naredio mu je da zakolje ovna među ovcama iz osam parova koje je spustio iz Dženneta. Uzeo je ovna i zaklao ga, zatim uzeo njegovu vunu. Havva ju je isprela, a on i Havva istkali su je. Adem je sebi istkao džubu, a Havvi načinio haljinu i pokrivalo za glavu. To su obukli. Uzvišeni Allah objavio je Ademu: ‘Imam sveti prostor naspram Svoga Arša. Idi i izgradi Mi u njemu Hram. Zatim ga obilazi kao što si vidio Moje meleke kako okružuju Moj Arš. Tamo ću se odazivati tebi i onima od tvojih potomaka koji Mi budu pokorni.’ Adem je rekao: ‘Gospodaru moj, kako da to učinim? Nemam snage za to niti znam put do toga!’ Allah mu je dodijelio meleka koji je s njim krenuo prema Meki. Kada bi Adem prošao pored vrta ili mjesta koje bi mu se svidjelo, rekao bi meleku: ‘Spusti nas ovdje.’ Melek bi mu govorio: ‘Ostani na svome mjestu’, sve dok nije stigao u Meku. Svako mjesto na kojem se zaustavio postalo je nastanjeno, a svako koje je prošao postalo je pustara i golet. Hram je izgradio od pet planina: od Turi-Sinaa, Turi-Zejtuna, Libana i Džudijja, a temelje mu je izgradio od Hire. Kada je završio gradnju, melek je s njim otišao na Arefat i pokazao mu sve obrede koje ljudi danas obavljaju. Potom ga je doveo u Meku, pa je sedam puta obišao Hram. Zatim se vratio u Indiju i umro na Buzu.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":125,"html":"\u003csection class=\"page\" data-page=\"125\" id=\"stranica-125\">\u003ch2>Stranica 125\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 125\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"125.1\" id=\"ar-odlomak-125-1\">\u003cspan class=\"isnad\">حدثنا أبو همام، قال: حدثني أبي، قال: حدثني زياد بن خيثمة، عن أبي يحيى بَائِعِ الْقَتِّ، قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حدثنى عبد الله ابن عباس \u003c/span>ان آدم ع نَزَلَ حِينَ نَزَلَ بِالْهِنْدِ، وَلَقَدْ حَجَّ مِنْهَا أَرْبَعِينَ حِجَّةً عَلَى رِجْلَيْهِ، فَقُلْتُ لَهُ: يَا أَبَا الْحَجَّاجِ، أَلا كَانَ يَرْكَبُ؟ قَالَ: فَأَيُّ شيء كان يحمله! فو الله إِنَّ خَطْوَهُ مَسِيرَةُ ثَلاثَةِ أَيَّامٍ، وَإِنْ كَانَ رَأْسُهُ لَيَبْلُغُ السَّمَاءَ، فَاشْتَكَتِ الْمَلائِكَةُ نَفَسَهُ، فَهَمَزَهُ الرَّحْمَنُ هَمْزَةً، فَتَطَأْطَأَ مِقْدَارَ أَرْبَعِينَ سَنَةً.\u003c/p>\u003cp data-pair=\"125.2\" id=\"ar-odlomak-125-2\">\u003cspan class=\"isnad\">حَدَّثَنِي صَالِحُ بْنُ حَرْبٍ أَبُو مَعْمَرٍ مَوْلَى بَنِي هَاشِمٍ، قَالَ: حَدَّثَنَا ثُمَامَةُ بْنُ عُبَيْدَةَ السُّلَمِيُّ، قَالَ: أَخْبَرَنَا أَبُو الزُّبَيْرِ، قَالَ: قَالَ نَافِعٌ:\n\nسَمِعْتُ ابْنَ عُمَرَ، يَقُولُ: \u003c/span>إِنَّ اللَّهَ تَعَالَى اوحى الى آدم ع وَهُوَ بِبِلادِ الْهِنْدِ:\nأَنْ حُجَّ هَذَا الْبَيْتَ فَحَجَّ آدَمُ مِنْ بِلادِ الْهِنْدِ، فَكَانَ كُلَّمَا وَضَعَ قَدَمَهُ صَارَ قَرْيَةً، وَمَا بَيْنَ خُطْوَتَيْهِ مَفَازَةً، حَتَّى انْتَهَى إِلَى الْبَيْتِ فَطَافَ بِهِ، وَقَضَى الْمَنَاسِكَ كُلَّهَا، ثُمَّ أَرَادَ الرُّجُوعَ إِلَى بِلادِ الْهِنْدِ فَمَضَى، حَتَّى إِذَا كَانَ بِمَأْزِمَيْ عَرَفَاتٍ، تَلَقَّتْهُ الْمَلائِكَةُ، فَقَالُوا: بِرَّ حَجَّكَ يَا آدَمُ! فَدَخَلَهُ مِنْ ذَلِكَ عُجْبٌ، فَلَمَّا رَأَتِ الْمَلائِكَةُ ذَلِكَ مِنْهُ قَالُوا: يَا آدَمُ، إِنَّا قَدْ حَجَجْنَا هَذَا الْبَيْتَ قَبْلَ أَنْ تُخْلَقَ بِأَلْفَيْ سَنَةٍ، قَالَ: فَتَقَاصَرَتْ إِلَى آدَمَ نَفْسُهُ.\u003c/p>\u003cp data-pair=\"125.3\" id=\"ar-odlomak-125-3\">وذكر ان آدم ع أُهْبِطَ إِلَى الأَرْضِ، وَعَلَى رَأْسِهِ إِكْلِيلٌ مِنْ شَجَرِ الْجَنَّةِ، فَلَمَّا صَارَ إِلَى الأَرْضِ، وَيَبِسَ الإِكْلِيلُ، تَحَاتَّ وَرَقُهُ فَنَبَتَ مِنْهُ أَنْوَاعُ الطِّيبِ.\u003c/p>\u003cp data-pair=\"125.4\" id=\"ar-odlomak-125-4\">وَقَالَ بَعْضُهُمْ: بَلْ كَانَ ذَلِكَ مَا أَخْبَرَ اللَّهُ عَنْهُمَا، أَنَّهُمَا جَعَلا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ، فَلَمَّا يَبِسَ ذَلِكَ الْوَرَقُ الَّذِي خَصَفَاهُ عَلَيْهِمَا تَحَاتَّ فَنَبَتَ مِنْ ذَلِكَ الْوَرَقِ انواع الطيب والله اعلم\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 125\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"125.1\" id=\"odlomak-125-1\">\u003cspan class=\"isnad\">Pričao nam je Ebu Hemmam, koji je rekao: pričao mi je moj otac, koji je rekao: pričao mi je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao mi je Abdullah ibn Abbas \u003c/span>da je Adem, alejhis-selam, kada je spušten, spušten u Indiju. Odatle je četrdeset puta pješice obavio hadž.“ Upitao sam ga: „Ebu Hadždžadže, zar nije mogao jahati?“ Odgovorio je: „A šta bi ga moglo nositi! Tako mi Allaha, njegov je korak bio tri dana puta, a glava mu je dosezala nebo. Meleki su se požalili na njegov dah, pa ga je Milostivi jednim pritiskom pritisnuo i on se spustio za mjeru četrdeset godina.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: izraz مقدار أربعين سنة („mjera četrdeset godina“) sačuvan je kao u izvoru; nije pretvoren u pretpostavljenu mjeru visine.⟧\u003c/span>\u003c/p>\u003cp data-pair=\"125.2\" id=\"odlomak-125-2\">\u003cspan class=\"isnad\">Pričao mi je Salih ibn Harb Ebu Ma‘mer, oslobođenik Benu Hašima, koji je rekao: pričao nam je Sumama ibn Ubejda es-Sulemi, koji je rekao: obavijestio nas je Ebu Zubejr, koji je rekao: Nafi‘ je rekao: čuo sam Ibn Omera kako govori: \u003c/span>„Uzvišeni Allah objavio je Ademu, alejhis-selam, dok je bio u Indiji: ‘Obavi hadž ovome Hramu.’ Adem je iz Indije krenuo na hadž. Gdje god bi spustio stopalo, nastalo bi naselje, a između njegova dva koraka bila je pustara, sve dok nije stigao do Hrama. Obišao ga je i izvršio sve obrede, a zatim se htio vratiti u Indiju. Krenuo je i, kada je bio kod dvaju klanaca Arefata, sreli su ga meleki i rekli: ‘Neka ti hadž bude primljen, Ademe!’ To je u njemu izazvalo samodopadnost. Kada su meleki to kod njega vidjeli, rekli su: ‘Ademe, mi smo obavljali hadž ovome Hramu dvije hiljade godina prije nego što si stvoren.’“ Rekao je: „Tada se Adem u sebi osjetio malenim.“\u003c/p>\u003cp data-pair=\"125.3\" id=\"odlomak-125-3\">Navedeno je da je Adem, alejhis-selam, spušten na Zemlju s vijencem od džennetskog drveća na glavi. Kada je stigao na Zemlju i vijenac se osušio, njegovo je lišće opalo, pa su iz njega nikle različite vrste mirisnog bilja.\u003c/p>\u003cp data-pair=\"125.4\" id=\"odlomak-125-4\">Neki su rekli: „Naprotiv, to je bilo ono o čemu ih Allah obavještava: počeli su po sebi spajati džennetsko lišće. Kada se lišće kojim su se pokrili osušilo i opalo, iz njega su nikle različite vrste mirisnog bilja.“ A Allah najbolje zna.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":126,"html":"\u003csection class=\"page\" data-page=\"126\" id=\"stranica-126\">\u003ch2>Stranica 126\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 126\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"126.1\" id=\"ar-odlomak-126-1\">وقال آخرون: بل لَمَّا عَلِمَ آدَمُ أَنَّ اللَّهَ عَزَّ وَجَلَّ مُهْبِطُهُ إِلَى الأَرْضِ، جَعَلَ لا يَمُرُّ بِشَجَرَةٍ مِنْ شَجَرِ الْجَنَّةِ إِلَّا أَخَذَ غُصْنًا مِنْ أَغْصَانِهَا، فَهَبَطَ إِلَى الأَرْضِ وَتِلْكَ الأَغْصَانُ مَعَهُ، فَلَمَّا يَبِسَ وَرَقُهَا تَحَاتَّ، فَكَانَ ذَلِكَ أَصْلُ الطِّيبِ.\u003c/p>\u003cp data-pair=\"126.2\" id=\"ar-odlomak-126-2\">ذِكْرُ مَنْ قَالَ ذَلِكَ:\u003c/p>\u003cp data-pair=\"126.3\" id=\"ar-odlomak-126-3\">٢٣٢- \u003cspan class=\"isnad\">حَدَّثَنَا أَبُو هَمَّامٍ، قَالَ: حَدَّثَنَا أَبِي، قَالَ: حَدَّثَنَا زِيَادُ بن خيثمة، عن أبي يحيى بائع القت قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حَدَّثَنِي عَبْدُ الله ابن عَبَّاسٍ، \u003c/span>أَنَّ آدَمَ حِينَ خَرَجَ مِنَ الْجَنَّةِ كَانَ لا يَمُرُّ بِشَيْءٍ إِلا عَبَثَ بِهِ، فَقِيلَ لِلْمَلائِكَةِ: دَعُوهُ فَلْيَتَزَوَّدْ مِنْهَا مَا شَاءَ، فَنَزَلَ حِينَ نَزَلَ بِالْهِنْدِ، وَإِنَّ هَذَا الطِّيبَ الَّذِي يُجَاءُ بِهِ مِنَ الْهِنْدِ مِمَّا خَرَجَ بِهِ آدَمُ مِنَ الْجَنَّةِ\u003c/p>\u003cp data-pair=\"126.4\" id=\"ar-odlomak-126-4\">ذكر من قال: كان على راس آدم ع حين أهبط من الجنة إكليل من شجر الجنة:\u003c/p>\u003cp data-pair=\"126.5\" id=\"ar-odlomak-126-5\">\u003cspan class=\"isnad\">حدثت عن عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أنس، عن أبي العالية، قال: \u003c/span>خرج آدم من الجنة، فخرج منها ومعه عصا من شجر الجنة، وعلى رأسه تاج أو إكليل من شجر الجنة، قال: فأهبط إلى الهند، ومنه كل طيب بالهند.\u003c/p>\u003cp data-pair=\"126.6\" id=\"ar-odlomak-126-6\">\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال:\n\n\u003c/span>هبط آدم عليه- يعني على الجبل الذي هبط عليه- ومعه ورق من ورق الجنة، فبثه في ذلك الجبل، فمنه كان أصل الطيب كله، وكل فاكهة لا توجد إلا بأرض الهند\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 126\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"126.1\" id=\"odlomak-126-1\">Drugi su rekli: „Naprotiv, kada je Adem saznao da će ga Allah, Silan i Uzvišen, spustiti na Zemlju, nije prolazio pored ijednog džennetskog drveta a da nije uzeo jednu njegovu granu. Spustio se na Zemlju noseći te grane sa sobom. Kada se njihovo lišće osušilo i opalo, ono je postalo porijeklo mirisnog bilja.“\u003c/p>\u003cp data-pair=\"126.2\" id=\"odlomak-126-2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"126.3\" id=\"odlomak-126-3\">232 — \u003cspan class=\"isnad\">Pričao nam je Ebu Hemmam, koji je rekao: pričao nam je moj otac, koji je rekao: pričao nam je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao mi je Abdullah ibn Abbas \u003c/span>da Adem, kada je izlazio iz Dženneta, nije prolazio pored nečega a da to nije dodirivao i po tome prebirao. Melekima je rečeno: ‘Pustite ga neka se iz njega opskrbi čime god želi.’ Kada je spušten, spušten je u Indiju. Ovi mirisi koji se donose iz Indije pripadaju onome što je Adem iznio sa sobom iz Dženneta.“\u003c/p>\u003cp data-pair=\"126.4\" id=\"odlomak-126-4\">Spomen onih koji su rekli da je Adem, alejhis-selam, kada je spušten iz Dženneta, na glavi imao vijenac od džennetskog drveća:\u003c/p>\u003cp data-pair=\"126.5\" id=\"odlomak-126-5\">\u003cspan class=\"isnad\">Preneseno mi je od Ammara ibn el-Hasena, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, od Ebu Alije, koji je rekao: \u003c/span>„Adem je izašao iz Dženneta noseći štap od džennetskog drveta, a na glavi krunu ili vijenac od džennetskog drveća.“ Rekao je: „Spušten je u Indiju i od njega potječe sve mirisno u Indiji.“\u003c/p>\u003cp data-pair=\"126.6\" id=\"odlomak-126-6\">\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: \u003c/span>„Adem se spustio na nju“ — misli na planinu na koju se spustio — „noseći džennetsko lišće. Rasuo ga je po toj planini, pa od njega potječu sve mirisne tvari i svaki plod koji se nalazi samo u Indiji.“\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"},{"n":127,"html":"\u003csection class=\"page\" data-page=\"127\" id=\"stranica-127\">\u003ch2>Stranica 127\u003c/h2>\u003cdiv class=\"split\">\u003csection class=\"column\">\u003ch3>Arapski izvornik\u003c/h3>\u003cdiv aria-label=\"Arapski tekst, stranica 127\" class=\"pane ar\" dir=\"rtl\" lang=\"ar\" tabindex=\"0\">\u003cp data-pair=\"127.1\" id=\"ar-odlomak-127-1\">وقال آخرون: بل زوده الله من ثمار الجنة، فثمارنا هذه من تلك الثمار ذِكْرُ من قال ذلك:\u003c/p>\u003cp data-pair=\"127.2\" id=\"ar-odlomak-127-2\">\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ بَشَّارٍ، قَالَ: حَدَّثَنَا ابْنُ أَبِي عَدِيٍّ وعبد الوهاب ومحمد بن جعفر، عن عوف، عن قسامة بن زهير، عن الأشعري، قال:\n\u003c/span>إن الله تبارك وتعالى لما اخرج آدم من الجنة زوده من ثمار الجنة، وعلمه صنعة كل شيء، فثماركم هذه من ثمار الجنة، غير أن هذه تتغير وتلك لا تتغير.\u003c/p>\u003cp data-pair=\"127.3\" id=\"ar-odlomak-127-3\">وقال آخرون: إنما علق بأشجار الهند طيب ريح آدم ع.\u003c/p>\u003cp data-pair=\"127.4\" id=\"ar-odlomak-127-4\">ذكر من قال إنما صار الطيب بالهند لأن آدم حين أهبط إليها علق بأشجارها طيب ريحه:\u003c/p>\u003cp data-pair=\"127.5\" id=\"ar-odlomak-127-5\">\u003cspan class=\"isnad\">حَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: أَخْبَرَنَا هِشَامُ بْنُ محمد، قال: أخبرني أبي، عن أبي صالح، عن ابن عباس، قال: \u003c/span>نزل آدم ع مَعَهُ رِيحُ الْجَنَّةِ، فَعَلِقَ بِشَجَرِهَا وَأَوْدِيَتِهَا وَامْتَلأَ ما هنالك طِيبًا، فَمِنْ ثَمَّ يُؤْتَى بِالطِّيبِ مِنْ رِيحِ الْجَنَّةِ.\u003c/p>\u003cp data-pair=\"127.6\" id=\"ar-odlomak-127-6\">وَقَالُوا: أُنْزِلَ مَعَهُ مِنْ طِيبِ الْجَنَّةِ.\u003c/p>\u003cp data-pair=\"127.7\" id=\"ar-odlomak-127-7\">وَقَالَ: أُنْزِلَ مَعَهُ الْحَجَرُ الأَسْوَدُ، وَكَانَ أَشَدَّ بَيَاضًا مِنَ الثَّلْجِ، وَعَصَا مُوسَى، وَكَانَتْ مِنْ آسِ الْجَنَّةِ، طُولُهَا عَشَرَةُ أَذْرُعٍ عَلَى طُولِ مُوسَى، ومر ولبان، ثُمَّ أُنْزِلَ عَلَيْهِ بَعْدَ ذَلِكَ العَلاةُ وَالمِطْرَقَةُ وَالْكَلْبَتَانِ، فَنَظَرَ آدَمُ\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"column\">\u003ch3>Bosanski prijevod\u003c/h3>\u003cdiv aria-label=\"Bosanski prijevod, stranica 127\" class=\"pane bs\" dir=\"ltr\" lang=\"bs\" tabindex=\"0\">\u003cp data-pair=\"127.1\" id=\"odlomak-127-1\">Drugi su rekli: „Naprotiv, Allah ga je opskrbio džennetskim plodovima, pa su ovi naši plodovi od tih plodova.“ Spomen onih koji su to rekli:\u003c/p>\u003cp data-pair=\"127.2\" id=\"odlomak-127-2\">\u003cspan class=\"isnad\">Pričao nam je Ibn Beššar, koji je rekao: pričali su nam Ibn Ebu Adijj, Abdulvehhab i Muhammed ibn Džafer, od Avfa, od Kasame ibn Zuhejra, od Eš‘arija, koji je rekao: \u003c/span>„Kada je Allah, Blagoslovljen i Uzvišen, izveo Adema iz Dženneta, opskrbio ga je džennetskim plodovima i poučio ga izradi svega. Ovi vaši plodovi od džennetskih su plodova, osim što se ovi mijenjaju, a oni se ne mijenjaju.“\u003c/p>\u003cp data-pair=\"127.3\" id=\"odlomak-127-3\">Drugi su rekli: „Miris Ademov, alejhis-selam, jednostavno se primio na indijskom drveću.“\u003c/p>\u003cp data-pair=\"127.4\" id=\"odlomak-127-4\">Spomen onih koji su rekli da su mirisi u Indiji nastali zato što se, kada je Adem u nju spušten, njegov lijepi miris primio na njenom drveću:\u003c/p>\u003cp data-pair=\"127.5\" id=\"odlomak-127-5\">\u003cspan class=\"isnad\">Pričao mi je Haris ibn Muhammed, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: obavijestio nas je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: \u003c/span>„Adem, alejhis-selam, spustio se noseći džennetski miris. On se primio na njenom drveću i dolinama, pa se sve tamo ispunilo lijepim mirisom. Zato se odatle donose mirisi koji potječu od džennetskog mirisa.“\u003c/p>\u003cp data-pair=\"127.6\" id=\"odlomak-127-6\">Rekli su: „S njim je spušteno i nešto od džennetskih mirisa.“\u003c/p>\u003cp data-pair=\"127.7\" id=\"odlomak-127-7\">Rekao je: „S njim je spušten Crni kamen, koji je bio bjelji od snijega, i Musaov štap, koji je bio od džennetske mirte, dug deset lakata, prema Musaovoj visini, te mirra i tamjan. Zatim su mu poslije toga spušteni nakovanj, čekić i kliješta. Kada je spušten na planinu, Adem je pogledao\u003c/p>\u003c/div>\u003c/section>\u003c/div>\u003c/section>"}],"book":[{"n":103,"ar":"لِلْمَلائِكَةِ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» إِلَى «وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، فَكَانَ الَّذِي أَبْدَوْا حِينَ قالُوا: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وَكَانَ الَّذِي كَتَمُوا بَيْنَهُمْ قَوْلُهُمْ: لَنْ يَخْلُقَ رَبُّنَا خَلْقًا إِلا كُنَّا نَحْنُ أَعْلَمُ مِنْهُ وَأَكْرَمُ، فَعَرَفُوا أَنَّ اللَّهَ عَزَّ وَجَلَّ فَضَّلَ عَلَيْهِمْ آدَمَ فِي الْعِلْمِ وَالْكَرَمِ.\nفَلَمَّا ظَهَرَ لِلْمَلائِكَةِ مِنَ اسْتِكْبَارِ إِبْلِيسَ مَا ظَهَرَ، وَمِنْ خِلافِهِ أَمْرَ رَبِّهِ مَا كَانَ مُسْتَتِرًا عَنْهُمْ مِنْ ذَلِكَ، عَاتَبَهُ رَبُّهُ عَلَى مَا أَظْهَرَ مِنْ مَعْصِيَتِهِ إِيَّاهُ بِتَرْكِهِ السُّجُودَ لآدَمَ، فَأَصَرَّ عَلَى مَعْصِيَتِهِ، وَأَقَامَ عَلَى غَيِّهِ وَطُغْيَانِهِ- لَعَنَهُ اللَّهُ- فَأَخْرَجَهُ مِنَ الْجَنَّةِ، وَطَرَدَهُ مِنْهَا، وَسَلَبَهُ مَا كَانَ آتَاهُ مِنْ مُلْكِ السَّمَاءِ الدُّنْيَا وَالأَرْضِ، وَعَزَلَهُ عن خزن الجنه فقال له جَلَّ جَلالُهُ: «فَاخْرُجْ مِنْها» ، يَعْنِي مِنَ الْجَنَّةِ «فَإِنَّكَ رَجِيمٌ وَإِنَّ عَلَيْكَ اللَّعْنَةَ إِلى يَوْمِ الدِّينِ» ، وَهُوَ بَعْدُ فِي السَّمَاءِ لَمْ يَهْبِطْ إِلَى الارض.\nواسكن اللَّهُ عَزَّ وَجَلَّ حِينَئِذٍ آدَمَ جَنَّتَهُ، كَمَا حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب رسول الله ص: فَأُخْرِجَ إِبْلِيسُ مِنَ الْجَنَّةِ حِينَ لُعِنَ وَأُسْكِنَ آدَمُ الْجَنَّةَ، فَكَانَ يَمْشِي فِيهَا وَحْشِيًّا لَيْسَ لَهُ زَوْجٌ يَسْكُنُ إِلَيْهَا، فَنَامَ نَوْمَةً فَاسْتَيْقَظَ، فَإِذَا عِنْدَ رَأْسِهِ امْرَأَةٌ قَاعِدَةٌ خَلَقَهَا اللَّهُ مِنْ ضِلْعِهِ، فَسَأَلَهَا: مَا أَنْتِ؟ قَالَتِ: امْرَأَةٌ، قَالَ: وَلِمَ خُلِقْتِ؟ قَالَتْ:","bs":"\u003cp data-paragraph=\"103.1\">melekima: ‘Obavijestite Me o imenima ovih, ako istinu govorite’ — do: ‘I znam ono što pokazujete i ono što ste krili.’ Ono što su pokazali bilo je kada su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ A ono što su među sobom krili bile su njihove riječi: ‘Naš Gospodar neće stvoriti nijedno stvorenje a da mi ne budemo učeniji i ugledniji od njega.’ Tada su spoznali da je Allah, Silan i Uzvišen, odlikovao Adema nad njima u znanju i uglednosti.“ \u003cspan class=\"translator-note\">⟦Prijevodi navedenih dijelova: El-Bekara, 2:31–33 i 2:30. Prijelaz „do“ nalazi se u izvornom tekstu.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"103.2\">Kada su meleki vidjeli Iblisovu oholost i njegovo protivljenje naredbi svoga Gospodara, koje im je prije toga bilo skriveno, njegov Gospodar ukorio ga je zbog nepokornosti koju je pokazao odbijanjem sedžde Ademu. On je ustrajao u svojoj nepokornosti i ostao pri zabludi i osionosti — Allah ga prokleo. Zato ga je izveo iz Dženneta, protjerao iz njega, oduzeo mu vlast nad najbližim nebom i Zemljom koju mu je bio dao i razriješio ga čuvanja Dženneta. On, Uzvišeno je Njegovo veličanstvo, rekao mu je: „Zato izađi iz njega“ — misli se iz Dženneta — „jer si proklet. I na tebi je prokletstvo do Dana obračuna.“ Još je bio na nebu i nije bio spušten na Zemlju. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Hidžr, 15:34–35, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"103.3\">Allah, Silan i Uzvišen, tada je nastanio Adema u Svome Džennetu, kako mi je pričao Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem: „Iblis je izveden iz Dženneta kada je proklet, a Adem je nastanjen u Džennetu. Hodao je njime osamljen, bez supruge uz koju bi našao smiraj. Jednom je zaspao i probudio se, a kod njegove glave sjedila je žena koju je Allah stvorio od njegovog rebra. Upitao ju je: ‘Šta si ti?’ Odgovorila je: ‘Žena.’ Upitao je: ‘A zašto si stvorena?’ Odgovorila je:\u003c/p>","paragraphs":[{"id":"103.1","ar":"لِلْمَلائِكَةِ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» إِلَى «وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، فَكَانَ الَّذِي أَبْدَوْا حِينَ قالُوا: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وَكَانَ الَّذِي كَتَمُوا بَيْنَهُمْ قَوْلُهُمْ: لَنْ يَخْلُقَ رَبُّنَا خَلْقًا إِلا كُنَّا نَحْنُ أَعْلَمُ مِنْهُ وَأَكْرَمُ، فَعَرَفُوا أَنَّ اللَّهَ عَزَّ وَجَلَّ فَضَّلَ عَلَيْهِمْ آدَمَ فِي الْعِلْمِ وَالْكَرَمِ.","bs":"melekima: ‘Obavijestite Me o imenima ovih, ako istinu govorite’ — do: ‘I znam ono što pokazujete i ono što ste krili.’ Ono što su pokazali bilo je kada su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ A ono što su među sobom krili bile su njihove riječi: ‘Naš Gospodar neće stvoriti nijedno stvorenje a da mi ne budemo učeniji i ugledniji od njega.’ Tada su spoznali da je Allah, Silan i Uzvišen, odlikovao Adema nad njima u znanju i uglednosti.“ ⟦Prijevodi navedenih dijelova: El-Bekara, 2:31–33 i 2:30. Prijelaz „do“ nalazi se u izvornom tekstu.⟧","ar_ranges":[],"ar_html":"لِلْمَلائِكَةِ: «أَنْبِئُونِي بِأَسْماءِ هؤُلاءِ إِنْ كُنْتُمْ صادِقِينَ» إِلَى «وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، فَكَانَ الَّذِي أَبْدَوْا حِينَ قالُوا: «أَتَجْعَلُ فِيها مَنْ يُفْسِدُ فِيها وَيَسْفِكُ الدِّماءَ» ، وَكَانَ الَّذِي كَتَمُوا بَيْنَهُمْ قَوْلُهُمْ: لَنْ يَخْلُقَ رَبُّنَا خَلْقًا إِلا كُنَّا نَحْنُ أَعْلَمُ مِنْهُ وَأَكْرَمُ، فَعَرَفُوا أَنَّ اللَّهَ عَزَّ وَجَلَّ فَضَّلَ عَلَيْهِمْ آدَمَ فِي الْعِلْمِ وَالْكَرَمِ.","bs_ranges":[],"bs_html":"melekima: ‘Obavijestite Me o imenima ovih, ako istinu govorite’ — do: ‘I znam ono što pokazujete i ono što ste krili.’ Ono što su pokazali bilo je kada su rekli: ‘Zar ćeš na njoj postaviti onoga ko će na njoj nered činiti i krv prolijevati?’ A ono što su među sobom krili bile su njihove riječi: ‘Naš Gospodar neće stvoriti nijedno stvorenje a da mi ne budemo učeniji i ugledniji od njega.’ Tada su spoznali da je Allah, Silan i Uzvišen, odlikovao Adema nad njima u znanju i uglednosti.“ \u003cspan class=\"translator-note\">⟦Prijevodi navedenih dijelova: El-Bekara, 2:31–33 i 2:30. Prijelaz „do“ nalazi se u izvornom tekstu.⟧\u003c/span>"},{"id":"103.2","ar":"فَلَمَّا ظَهَرَ لِلْمَلائِكَةِ مِنَ اسْتِكْبَارِ إِبْلِيسَ مَا ظَهَرَ، وَمِنْ خِلافِهِ أَمْرَ رَبِّهِ مَا كَانَ مُسْتَتِرًا عَنْهُمْ مِنْ ذَلِكَ، عَاتَبَهُ رَبُّهُ عَلَى مَا أَظْهَرَ مِنْ مَعْصِيَتِهِ إِيَّاهُ بِتَرْكِهِ السُّجُودَ لآدَمَ، فَأَصَرَّ عَلَى مَعْصِيَتِهِ، وَأَقَامَ عَلَى غَيِّهِ وَطُغْيَانِهِ- لَعَنَهُ اللَّهُ- فَأَخْرَجَهُ مِنَ الْجَنَّةِ، وَطَرَدَهُ مِنْهَا، وَسَلَبَهُ مَا كَانَ آتَاهُ مِنْ مُلْكِ السَّمَاءِ الدُّنْيَا وَالأَرْضِ، وَعَزَلَهُ عن خزن الجنه فقال له جَلَّ جَلالُهُ: «فَاخْرُجْ مِنْها» ، يَعْنِي مِنَ الْجَنَّةِ «فَإِنَّكَ رَجِيمٌ وَإِنَّ عَلَيْكَ اللَّعْنَةَ إِلى يَوْمِ الدِّينِ» ، وَهُوَ بَعْدُ فِي السَّمَاءِ لَمْ يَهْبِطْ إِلَى الارض.","bs":"Kada su meleki vidjeli Iblisovu oholost i njegovo protivljenje naredbi svoga Gospodara, koje im je prije toga bilo skriveno, njegov Gospodar ukorio ga je zbog nepokornosti koju je pokazao odbijanjem sedžde Ademu. On je ustrajao u svojoj nepokornosti i ostao pri zabludi i osionosti — Allah ga prokleo. Zato ga je izveo iz Dženneta, protjerao iz njega, oduzeo mu vlast nad najbližim nebom i Zemljom koju mu je bio dao i razriješio ga čuvanja Dženneta. On, Uzvišeno je Njegovo veličanstvo, rekao mu je: „Zato izađi iz njega“ — misli se iz Dženneta — „jer si proklet. I na tebi je prokletstvo do Dana obračuna.“ Još je bio na nebu i nije bio spušten na Zemlju. ⟦Prijevod kur’anskog navoda: El-Hidžr, 15:34–35, navedeni dijelovi.⟧","ar_ranges":[],"ar_html":"فَلَمَّا ظَهَرَ لِلْمَلائِكَةِ مِنَ اسْتِكْبَارِ إِبْلِيسَ مَا ظَهَرَ، وَمِنْ خِلافِهِ أَمْرَ رَبِّهِ مَا كَانَ مُسْتَتِرًا عَنْهُمْ مِنْ ذَلِكَ، عَاتَبَهُ رَبُّهُ عَلَى مَا أَظْهَرَ مِنْ مَعْصِيَتِهِ إِيَّاهُ بِتَرْكِهِ السُّجُودَ لآدَمَ، فَأَصَرَّ عَلَى مَعْصِيَتِهِ، وَأَقَامَ عَلَى غَيِّهِ وَطُغْيَانِهِ- لَعَنَهُ اللَّهُ- فَأَخْرَجَهُ مِنَ الْجَنَّةِ، وَطَرَدَهُ مِنْهَا، وَسَلَبَهُ مَا كَانَ آتَاهُ مِنْ مُلْكِ السَّمَاءِ الدُّنْيَا وَالأَرْضِ، وَعَزَلَهُ عن خزن الجنه فقال له جَلَّ جَلالُهُ: «فَاخْرُجْ مِنْها» ، يَعْنِي مِنَ الْجَنَّةِ «فَإِنَّكَ رَجِيمٌ وَإِنَّ عَلَيْكَ اللَّعْنَةَ إِلى يَوْمِ الدِّينِ» ، وَهُوَ بَعْدُ فِي السَّمَاءِ لَمْ يَهْبِطْ إِلَى الارض.","bs_ranges":[],"bs_html":"Kada su meleki vidjeli Iblisovu oholost i njegovo protivljenje naredbi svoga Gospodara, koje im je prije toga bilo skriveno, njegov Gospodar ukorio ga je zbog nepokornosti koju je pokazao odbijanjem sedžde Ademu. On je ustrajao u svojoj nepokornosti i ostao pri zabludi i osionosti — Allah ga prokleo. Zato ga je izveo iz Dženneta, protjerao iz njega, oduzeo mu vlast nad najbližim nebom i Zemljom koju mu je bio dao i razriješio ga čuvanja Dženneta. On, Uzvišeno je Njegovo veličanstvo, rekao mu je: „Zato izađi iz njega“ — misli se iz Dženneta — „jer si proklet. I na tebi je prokletstvo do Dana obračuna.“ Još je bio na nebu i nije bio spušten na Zemlju. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Hidžr, 15:34–35, navedeni dijelovi.⟧\u003c/span>"},{"id":"103.3","ar":"واسكن اللَّهُ عَزَّ وَجَلَّ حِينَئِذٍ آدَمَ جَنَّتَهُ، كَمَا حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب رسول الله ص: فَأُخْرِجَ إِبْلِيسُ مِنَ الْجَنَّةِ حِينَ لُعِنَ وَأُسْكِنَ آدَمُ الْجَنَّةَ، فَكَانَ يَمْشِي فِيهَا وَحْشِيًّا لَيْسَ لَهُ زَوْجٌ يَسْكُنُ إِلَيْهَا، فَنَامَ نَوْمَةً فَاسْتَيْقَظَ، فَإِذَا عِنْدَ رَأْسِهِ امْرَأَةٌ قَاعِدَةٌ خَلَقَهَا اللَّهُ مِنْ ضِلْعِهِ، فَسَأَلَهَا: مَا أَنْتِ؟ قَالَتِ: امْرَأَةٌ، قَالَ: وَلِمَ خُلِقْتِ؟ قَالَتْ:","bs":"Allah, Silan i Uzvišen, tada je nastanio Adema u Svome Džennetu, kako mi je pričao Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem: „Iblis je izveden iz Dženneta kada je proklet, a Adem je nastanjen u Džennetu. Hodao je njime osamljen, bez supruge uz koju bi našao smiraj. Jednom je zaspao i probudio se, a kod njegove glave sjedila je žena koju je Allah stvorio od njegovog rebra. Upitao ju je: ‘Šta si ti?’ Odgovorila je: ‘Žena.’ Upitao je: ‘A zašto si stvorena?’ Odgovorila je:","ar_ranges":[[61,248]],"ar_html":"واسكن اللَّهُ عَزَّ وَجَلَّ حِينَئِذٍ آدَمَ جَنَّتَهُ، كَمَا \u003cspan class=\"isnad\">حدثني موسى بن هارون، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني عن ابن مسعود- وعن ناس من اصحاب رسول الله ص: \u003c/span>فَأُخْرِجَ إِبْلِيسُ مِنَ الْجَنَّةِ حِينَ لُعِنَ وَأُسْكِنَ آدَمُ الْجَنَّةَ، فَكَانَ يَمْشِي فِيهَا وَحْشِيًّا لَيْسَ لَهُ زَوْجٌ يَسْكُنُ إِلَيْهَا، فَنَامَ نَوْمَةً فَاسْتَيْقَظَ، فَإِذَا عِنْدَ رَأْسِهِ امْرَأَةٌ قَاعِدَةٌ خَلَقَهَا اللَّهُ مِنْ ضِلْعِهِ، فَسَأَلَهَا: مَا أَنْتِ؟ قَالَتِ: امْرَأَةٌ، قَالَ: وَلِمَ خُلِقْتِ؟ قَالَتْ:","bs_ranges":[[70,376]],"bs_html":"Allah, Silan i Uzvišen, tada je nastanio Adema u Svome Džennetu, kako \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem: \u003c/span>„Iblis je izveden iz Dženneta kada je proklet, a Adem je nastanjen u Džennetu. Hodao je njime osamljen, bez supruge uz koju bi našao smiraj. Jednom je zaspao i probudio se, a kod njegove glave sjedila je žena koju je Allah stvorio od njegovog rebra. Upitao ju je: ‘Šta si ti?’ Odgovorila je: ‘Žena.’ Upitao je: ‘A zašto si stvorena?’ Odgovorila je:"}],"notes":[]},{"n":104,"ar":"لِتَسْكُنَ إِلَيَّ، قَالَتْ لَهُ الْمَلائِكَةُ يَنْظُرُونَ مَا بَلَغَ عِلْمُهُ: مَا اسْمُهَا يَا آدَمُ؟\n\nقَالَ: حَوَّاءُ، قَالُوا: لِمَ سُمِّيَتْ حَوَّاءَ؟ قَالَ: لأَنَّهَا خُلِقَتْ مِنْ شَيْءٍ حَيٍّ، فَقَالَ اللَّهُ تَعَالَى: «يا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما» .\nحَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال: لما فرغ الله تعالى من معاتبه ابليس اقبل على آدم ع وقد علمه الأسماء كلها، فقال: «يَا آدَمُ أَنْبِئْهُمْ بِأَسْمائِهِمْ» إِلَى «وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، قال: ثم ألقى السنة على آدم- فيما بلغنا عن أهل الكتاب من أهل التوراة وغيرهم من أهل العلم- عن عبد الله بن العباس وغيره، ثم أخذ ضلعا من أضلاعه من شقه الأيسر، ولأم مكانها لحما، وآدم ع نائم لم يهب من نومته، حتى خلق الله تعالى من ضلعه تلك زوجه حواء، فسواها امراه ليسكن إليها، فلما كشف عنه السنة وهب من نومته رآها إلى جنبه، فقال- فيما يزعمون والله أعلم: لحمي ودمي وزوجتي، فسكن إليها، فلما زوجه الله عز وجل وجعل له سكنا من نفسه، قال له قبلا: «يا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» .\nحَدَّثَنَا مُحَمَّدُ بْنُ عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى، عن ابن أبي نجيح، عن مجاهد فِي قَوْلِهِ عَزَّ وَجَلَّ: «وَخَلَقَ مِنْها","bs":"\u003cp data-paragraph=\"104.1\">‘Da uz mene nađeš smiraj.’ Meleki su ga, provjeravajući dokle doseže njegovo znanje, upitali: ‘Kako joj je ime, Ademe?’ Odgovorio je: ‘Havva.’ Pitali su: ‘Zašto je nazvana Havvom?’ Odgovorio je: ‘Zato što je stvorena od nečega živog.’ Uzvišeni Allah rekao je: ‘Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:35, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"104.2\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Kada je Uzvišeni Allah završio s ukoravanjem Iblisa, okrenuo se Ademu, alejhis-selam, kojeg je već poučio svim imenima, i rekao: ‘Ademe, obavijesti ih o njihovim imenima’ — do: ‘I znam ono što pokazujete i ono što ste krili.’“ Rekao je: „Zatim je na Adema spustio drijemež — prema onome što je do nas doprlo od sljedbenika Knjige, sljedbenika Tevrata i drugih učenih ljudi, od Abdullaha ibn Abbasa i drugih. Potom je uzeo jedno rebro s njegove lijeve strane i njegovo mjesto ispunio mesom, dok je Adem, alejhis-selam, spavao i nije se budio iz svoga sna. Uzvišeni Allah od toga njegovog rebra stvorio je njegovu suprugu Havvu, oblikovao je kao ženu da uz nju nađe smiraj. Kada je s njega uklonio drijemež i kada se probudio, vidio ju je uz sebe, pa je rekao — prema onome što tvrde, a Allah najbolje zna: ‘Moje meso, moja krv i moja supruga.’ Uz nju je našao smiraj. Kada ga je Allah, Silan i Uzvišen, oženio i od njega samoga načinio mu onu uz koju će naći smiraj, rekao mu je neposredno: ‘Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:33, navedeni početak i završetak, s izvornim prijelazom „do“; El-Bekara, 2:35, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"104.3\">Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa, od Ibn Ebu Nedžiha, od Mudžahida, o riječima Njega, Silnog i Uzvišenog: „I od nje je stvorio\u003c/p>","paragraphs":[{"id":"104.1","ar":"لِتَسْكُنَ إِلَيَّ، قَالَتْ لَهُ الْمَلائِكَةُ يَنْظُرُونَ مَا بَلَغَ عِلْمُهُ: مَا اسْمُهَا يَا آدَمُ؟\n\nقَالَ: حَوَّاءُ، قَالُوا: لِمَ سُمِّيَتْ حَوَّاءَ؟ قَالَ: لأَنَّهَا خُلِقَتْ مِنْ شَيْءٍ حَيٍّ، فَقَالَ اللَّهُ تَعَالَى: «يا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما» .","bs":"‘Da uz mene nađeš smiraj.’ Meleki su ga, provjeravajući dokle doseže njegovo znanje, upitali: ‘Kako joj je ime, Ademe?’ Odgovorio je: ‘Havva.’ Pitali su: ‘Zašto je nazvana Havvom?’ Odgovorio je: ‘Zato što je stvorena od nečega živog.’ Uzvišeni Allah rekao je: ‘Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete.’“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:35, navedeni dio.⟧","ar_ranges":[],"ar_html":"لِتَسْكُنَ إِلَيَّ، قَالَتْ لَهُ الْمَلائِكَةُ يَنْظُرُونَ مَا بَلَغَ عِلْمُهُ: مَا اسْمُهَا يَا آدَمُ؟\n\nقَالَ: حَوَّاءُ، قَالُوا: لِمَ سُمِّيَتْ حَوَّاءَ؟ قَالَ: لأَنَّهَا خُلِقَتْ مِنْ شَيْءٍ حَيٍّ، فَقَالَ اللَّهُ تَعَالَى: «يا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما» .","bs_ranges":[],"bs_html":"‘Da uz mene nađeš smiraj.’ Meleki su ga, provjeravajući dokle doseže njegovo znanje, upitali: ‘Kako joj je ime, Ademe?’ Odgovorio je: ‘Havva.’ Pitali su: ‘Zašto je nazvana Havvom?’ Odgovorio je: ‘Zato što je stvorena od nečega živog.’ Uzvišeni Allah rekao je: ‘Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:35, navedeni dio.⟧\u003c/span>"},{"id":"104.2","ar":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال: لما فرغ الله تعالى من معاتبه ابليس اقبل على آدم ع وقد علمه الأسماء كلها، فقال: «يَا آدَمُ أَنْبِئْهُمْ بِأَسْمائِهِمْ» إِلَى «وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، قال: ثم ألقى السنة على آدم- فيما بلغنا عن أهل الكتاب من أهل التوراة وغيرهم من أهل العلم- عن عبد الله بن العباس وغيره، ثم أخذ ضلعا من أضلاعه من شقه الأيسر، ولأم مكانها لحما، وآدم ع نائم لم يهب من نومته، حتى خلق الله تعالى من ضلعه تلك زوجه حواء، فسواها امراه ليسكن إليها، فلما كشف عنه السنة وهب من نومته رآها إلى جنبه، فقال- فيما يزعمون والله أعلم: لحمي ودمي وزوجتي، فسكن إليها، فلما زوجه الله عز وجل وجعل له سكنا من نفسه، قال له قبلا: «يا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» .","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Kada je Uzvišeni Allah završio s ukoravanjem Iblisa, okrenuo se Ademu, alejhis-selam, kojeg je već poučio svim imenima, i rekao: ‘Ademe, obavijesti ih o njihovim imenima’ — do: ‘I znam ono što pokazujete i ono što ste krili.’“ Rekao je: „Zatim je na Adema spustio drijemež — prema onome što je do nas doprlo od sljedbenika Knjige, sljedbenika Tevrata i drugih učenih ljudi, od Abdullaha ibn Abbasa i drugih. Potom je uzeo jedno rebro s njegove lijeve strane i njegovo mjesto ispunio mesom, dok je Adem, alejhis-selam, spavao i nije se budio iz svoga sna. Uzvišeni Allah od toga njegovog rebra stvorio je njegovu suprugu Havvu, oblikovao je kao ženu da uz nju nađe smiraj. Kada je s njega uklonio drijemež i kada se probudio, vidio ju je uz sebe, pa je rekao — prema onome što tvrde, a Allah najbolje zna: ‘Moje meso, moja krv i moja supruga.’ Uz nju je našao smiraj. Kada ga je Allah, Silan i Uzvišen, oženio i od njega samoga načinio mu onu uz koju će naći smiraj, rekao mu je neposredno: ‘Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika.’“ ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:33, navedeni početak i završetak, s izvornim prijelazom „do“; El-Bekara, 2:35, navedeni dio.⟧","ar_ranges":[[0,62]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال: \u003c/span>لما فرغ الله تعالى من معاتبه ابليس اقبل على آدم ع وقد علمه الأسماء كلها، فقال: «يَا آدَمُ أَنْبِئْهُمْ بِأَسْمائِهِمْ» إِلَى «وَأَعْلَمُ مَا تُبْدُونَ وَما كُنْتُمْ تَكْتُمُونَ» ، قال: ثم ألقى السنة على آدم- فيما بلغنا عن أهل الكتاب من أهل التوراة وغيرهم من أهل العلم- عن عبد الله بن العباس وغيره، ثم أخذ ضلعا من أضلاعه من شقه الأيسر، ولأم مكانها لحما، وآدم ع نائم لم يهب من نومته، حتى خلق الله تعالى من ضلعه تلك زوجه حواء، فسواها امراه ليسكن إليها، فلما كشف عنه السنة وهب من نومته رآها إلى جنبه، فقال- فيما يزعمون والله أعلم: لحمي ودمي وزوجتي، فسكن إليها، فلما زوجه الله عز وجل وجعل له سكنا من نفسه، قال له قبلا: «يا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» .","bs_ranges":[[0,93]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: \u003c/span>„Kada je Uzvišeni Allah završio s ukoravanjem Iblisa, okrenuo se Ademu, alejhis-selam, kojeg je već poučio svim imenima, i rekao: ‘Ademe, obavijesti ih o njihovim imenima’ — do: ‘I znam ono što pokazujete i ono što ste krili.’“ Rekao je: „Zatim je na Adema spustio drijemež — prema onome što je do nas doprlo od sljedbenika Knjige, sljedbenika Tevrata i drugih učenih ljudi, od Abdullaha ibn Abbasa i drugih. Potom je uzeo jedno rebro s njegove lijeve strane i njegovo mjesto ispunio mesom, dok je Adem, alejhis-selam, spavao i nije se budio iz svoga sna. Uzvišeni Allah od toga njegovog rebra stvorio je njegovu suprugu Havvu, oblikovao je k  data-paragraph=\"105.1\">njenu suprugu.“ Rekao je: „Havvu od Ademovog krajnjeg rebra, dok je on bio u ugodi. Kada se probudio, rekao je: ‘Asa’ — na nabatejskom: žena.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: En-Nisa, 4:1, navedeni dio. Napomena prevodioca: izvor ima قصيرى آدم („Ademovo krajnje rebro“) i وهو ناعم („u ugodi“; na‘im), gdje se možda mislilo na نائم („spava“). Ta pretpostavka nije prešutno unesena u tekst. Za قصيرى u jezičkim opisima postoji više određenja položaja rebra (Ibn Manzur, Lisanul-arab, odrednica قصر); ovdje je preneseno „krajnje rebro“. Nabatejski izraz zapisan je أثا, bez oznaka za siguran izgovor; prenesen je približno kao „Asa“.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"105.2\">Pričao nam je Musenna, koji je rekao: pričao nam je Ebu Huzejfa, koji je rekao: pričao nam je Šibl, od Ibn Ebu Nedžiha, od Mudžahida, isto to.\u003c/p>\u003cp data-paragraph=\"105.3\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, o riječima: „I od nje je stvorio njenu suprugu“ — misli se na Havvu — stvorena je od Adema, od jednog njegovog rebra. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Nisa, 4:1, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"105.1","ar":"زَوْجَها» قال: حواء من قصيرى آدم، وهو ناعم فَاسْتَيْقَظَ فَقَالَ:\n\nأثا بِالنَّبَطِيَّةِ، امْرَأَةٌ.","bs":"njenu suprugu.“ Rekao je: „Havvu od Ademovog krajnjeg rebra, dok je on bio u ugodi. Kada se probudio, rekao je: ‘Asa’ — na nabatejskom: žena.“ ⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: En-Nisa, 4:1, navedeni dio. Napomena prevodioca: izvor ima قصيرى آدم („Ademovo krajnje rebro“) i وهو ناعم („u ugodi“; na‘im), gdje se možda mislilo na نائم („spava“). Ta pretpostavka nije prešutno unesena u tekst. Za قصيرى u jezičkim opisima postoji više određenja položaja rebra (Ibn Manzur, Lisanul-arab, odrednica قصر); ovdje je preneseno „krajnje rebro“. Nabatejski izraz zapisan je أثا, bez oznaka za siguran izgovor; prenesen je približno kao „Asa“.⟧","ar_ranges":[],"ar_html":"زَوْجَها» قال: حواء من قصيرى آدم، وهو ناعم فَاسْتَيْقَظَ فَقَالَ:\n\nأثا بِالنَّبَطِيَّةِ، امْرَأَةٌ.","bs_ranges":[],"bs_html":"njenu suprugu.“ Rekao je: „Havvu od Ademovog krajnjeg rebra, dok je on bio u ugodi. Kada se probudio, rekao je: ‘Asa’ — na nabatejskom: žena.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda započetog na prethodnoj stranici: En-Nisa, 4:1, navedeni dio. Napomena prevodioca: izvor ima قصيرى آدم („Ademovo krajnje rebro“) i وهو ناعم („u ugodi“; na‘im), gdje se možda mislilo na نائم („spava“). Ta pretpostavka nije prešutno unesena u tekst. Za قصيرى u jezičkim opisima postoji više određenja položaja rebra (Ibn Manzur, Lisanul-arab, odrednica قصر); ovdje je preneseno „krajnje rebro“. Nabatejski izraz zapisan je أثا, bez oznaka za siguran izgovor; prenesen je približno kao „Asa“.⟧\u003c/span>"},{"id":"105.2","ar":"حَدَّثَنَا المثنى، قال: حدثنا أبو حذيفة، قال: حدثنا شبل، عن ابن أبي نجيح، عن مجاهد مثله.","bs":"Pričao nam je Musenna, koji je rekao: pričao nam je Ebu Huzejfa, koji je rekao: pričao nam je Šibl, od Ibn Ebu Nedžiha, od Mudžahida, isto to.","ar_ranges":[[0,83]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا المثنى، قال: حدثنا أبو حذيفة، قال: حدثنا شبل، عن ابن أبي نجيح، عن مجاهد \u003c/span>مثله.","bs_ranges":[[0,134]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Musenna, koji je rekao: pričao nam je Ebu Huzejfa, koji je rekao: pričao nam je Šibl, od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>isto to."},{"id":"105.3","ar":"حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ: حَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ: «وَخَلَقَ مِنْها زَوْجَها» ، يَعْنِي حَوَّاءَ، خُلِقَتْ مِنْ آدَمَ مِنْ ضِلْعٍ مِنْ أَضْلاعِهِ","bs":"Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, o riječima: „I od nje je stvorio njenu suprugu“ — misli se na Havvu — stvorena je od Adema, od jednog njegovog rebra. ⟦Prijevod kur’anskog navoda: En-Nisa, 4:1, navedeni dio.⟧","ar_ranges":[[0,116]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا بِشْرُ بْنُ مُعَاذٍ، قَالَ: حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، قَالَ: حَدَّثَنَا سَعِيدٌ، عَنْ قَتَادَةَ: \u003c/span>«وَخَلَقَ مِنْها زَوْجَها» ، يَعْنِي حَوَّاءَ، خُلِقَتْ مِنْ آدَمَ مِنْ ضِلْعٍ مِنْ أَضْلاعِهِ","bs_ranges":[[0,122]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Bišr ibn Muaz, koji je rekao: pričao nam je Jezid ibn Zurej‘, koji je rekao: pričao nam je Seid, od Katade, \u003c/span>o riječima: „I od nje je stvorio njenu suprugu“ — misli se na Havvu — stvorena je od Adema, od jednog njegovog rebra. \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: En-Nisa, 4:1, navedeni dio.⟧\u003c/span>"}],"notes":[]},{"n":106,"ar":"[القول في ذكر امتحان الله تعالى أبانا آدم ع]\nوابتلائه إياه بما امتحنه به من طاعته، وذكر ركوب آدم معصية ربه بعد الذي كان أعطاه من كرامته وشريف المنزلة عنده، ومكنه في جنته من رغد العيش وهنيئه، وما أزال ذلك عنه، فصار من نعيم الجنة ولذيذ رغد العيش إلى نكد عيش أهل الأرض وعلاج الحراثة والعمل بالمساحي والزراعة فيها.\n\nفلما أسكن الله عز وجل آدم ع وزوجه اطلق لهما ان يأكلا كل ما شاء أكله من كل ما فيها من ثمارها، غير ثمر شجرة واحدة ابتلاء منه لهما بذلك، وليمضي قضاء الله فيهما وفي ذريتهما، كما قال عز وجل:\n«وَقُلْنا يَا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، فوسوس لهما الشيطان حتى زين لهما أكل ما نهاهما ربهما عن أكله من ثمر تلك الشجرة، وحسن لهما معصية الله في ذلك، حتى أكلا منها، فبدت لهما من سوآتهما ما كان موارى عنهما منها فكان وصول عدو الله إبليس إلى تزيين ذلك لهما ما ذكر في الخبر الذي حَدَّثَنِي موسى بن هارون الهمداني، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الْهَمْدَانِيِّ، عَنِ ابْنِ مَسْعُودٍ- وَعَنْ أُنَاسٍ مِنْ اصحاب النبي ص، قَالَ: لَمَّا قَالَ اللَّهُ عَزَّ وَجَلَّ لآدَمَ:\n«اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، أَرَادَ إِبْلِيسُ أَنْ يَدْخُلَ عَلَيْهِمَا الجنه","bs":"\u003cp data-paragraph=\"106.1\">Rasprava o iskušavanju našeg oca Adema, alejhis-selam, od Uzvišenog Allaha\u003c/p>\u003cp data-paragraph=\"106.2\">I o tome kako ga je iskušao pokornošću, te o Ademovom činjenju grijeha prema svome Gospodaru nakon što mu je dao počast i uzvišen položaj kod Sebe, omogućio mu u Svome Džennetu obilan i ugodan život, i o onome što mu je to uklonilo. Tako je iz džennetskog uživanja i slasti obilnog života prešao u tegoban život stanovnika Zemlje, bavljenje oranjem, rad motikama i obrađivanje zemlje.\u003c/p>\u003cp data-paragraph=\"106.3\">Kada je Allah, Silan i Uzvišen, nastanio Adema, alejhis-selam, i njegovu suprugu, dopustio im je da jedu šta god žele od svih plodova u Džennetu, osim ploda jednoga drveta, iskušavajući ih time i da se ostvari Allahova odredba o njima i njihovim potomcima, kako je rekao On, Silan i Uzvišen: „I rekli smo: Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika.“ Šejtan im je došaptavao dok im nije uljepšao jedenje ploda toga drveta koje im je njihov Gospodar zabranio i prikazao im nepokornost Allahu u tome kao nešto lijepo. Na kraju su jeli s njega, pa im se otkrilo od njihovih stidnih mjesta ono što im je bilo skriveno. Kako je Allahov neprijatelj Iblis uspio da im to uljepša navedeno je u predaji koju mi je pričao Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao: „Kada je Allah, Silan i Uzvišen, rekao Ademu: ‘Nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika’, Iblis je htio ući k njima u Džennet, \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:35, cijeli ajet i njegov ponovljeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"106.1","ar":"[القول في ذكر امتحان الله تعالى أبانا آدم ع]","bs":"Rasprava o iskušavanju našeg oca Adema, alejhis-selam, od Uzvišenog Allaha","ar_ranges":[],"ar_html":"[القول في ذكر امتحان الله تعالى أبانا آدم ع]","bs_ranges":[],"bs_html":"Rasprava o iskušavanju našeg oca Adema, alejhis-selam, od Uzvišenog Allaha"},{"id":"106.2","ar":"وابتلائه إياه بما امتحنه به من طاعته، وذكر ركوب آدم معصية ربه بعد الذي كان أعطاه من كرامته وشريف المنزلة عنده، ومكنه في جنته من رغد العيش وهنيئه، وما أزال ذلك عنه، فصار من نعيم الجنة ولذيذ رغد العيش إلى نكد عيش أهل الأرض وعلاج الحراثة والعمل بالمساحي والزراعة فيها.","bs":"I o tome kako ga je iskušao pokornošću, te o Ademovom činjenju grijeha prema svome Gospodaru nakon što mu je dao počast i uzvišen položaj kod Sebe, omogućio mu u Svome Džennetu obilan i ugodan život, i o onome što mu je to uklonilo. Tako je iz džennetskog uživanja i slasti obilnog života prešao u tegoban život stanovnika Zemlje, bavljenje oranjem, rad motikama i obrađivanje zemlje.","ar_ranges":[],"ar_html":"وابتلائه إياه بما امتحنه به من طاعته، وذكر ركوب آدم معصية ربه بعد الذي كان أعطاه من كرامته وشريف المنزلة عنده، ومكنه في جنته من رغد العيش وهنيئه، وما أزال ذلك عنه، فصار من نعيم الجنة ولذيذ رغد العيش إلى نكد عيش أهل الأرض وعلاج الحراثة والعمل بالمساحي والزراعة فيها.","bs_ranges":[],"bs_html":"I o tome kako ga je iskušao pokornošću, te o Ademovom činjenju grijeha prema svome Gospodaru nakon što mu je dao počast i uzvišen položaj kod Sebe, omogućio mu u Svome Džennetu obilan i ugodan život, i o onome što mu je to uklonilo. Tako je iz džennetskog uživanja i slasti obilnog života prešao u tegoban život stanovnika Zemlje, bavljenje oranjem, rad motikama i obrađivanje zemlje."},{"id":"106.3","ar":"فلما أسكن الله عز وجل آدم ع وزوجه اطلق لهما ان يأكلا كل ما شاء أكله من كل ما فيها من ثمارها، غير ثمر شجرة واحدة ابتلاء منه لهما بذلك، وليمضي قضاء الله فيهما وفي ذريتهما، كما قال عز وجل:\n«وَقُلْنا يَا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، فوسوس لهما الشيطان حتى زين لهما أكل ما نهاهما ربهما عن أكله من ثمر تلك الشجرة، وحسن لهما معصية الله في ذلك، حتى أكلا منها، فبدت لهما من سوآتهما ما كان موارى عنهما منها فكان وصول عدو الله إبليس إلى تزيين ذلك لهما ما ذكر في الخبر الذي حَدَّثَنِي موسى بن هارون الهمداني، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الْهَمْدَانِيِّ، عَنِ ابْنِ مَسْعُودٍ- وَعَنْ أُنَاسٍ مِنْ اصحاب النبي ص، قَالَ: لَمَّا قَالَ اللَّهُ عَزَّ وَجَلَّ لآدَمَ:\n«اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، أَرَادَ إِبْلِيسُ أَنْ يَدْخُلَ عَلَيْهِمَا الجنه","bs":"Kada je Allah, Silan i Uzvišen, nastanio Adema, alejhis-selam, i njegovu suprugu, dopustio im je da jedu šta god žele od svih plodova u Džennetu, osim ploda jednoga drveta, iskušavajući ih time i da se ostvari Allahova odredba o njima i njihovim potomcima, kako je rekao On, Silan i Uzvišen: „I rekli smo: Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika.“ Šejtan im je došaptavao dok im nije uljepšao jedenje ploda toga drveta koje im je njihov Gospodar zabranio i prikazao im nepokornost Allahu u tome kao nešto lijepo. Na kraju su jeli s njega, pa im se otkrilo od njihovih stidnih mjesta ono što im je bilo skriveno. Kako je Allahov neprijatelj Iblis uspio da im to uljepša navedeno je u predaji koju mi je pričao Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao: „Kada je Allah, Silan i Uzvišen, rekao Ademu: ‘Nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika’, Iblis je htio ući k njima u Džennet, ⟦Prijevodi kur’anskih navoda: El-Bekara, 2:35, cijeli ajet i njegov ponovljeni dio.⟧","ar_ranges":[[578,807]],"ar_html":"فلما أسكن الله عز وجل آدم ع وزوجه اطلق لهما ان يأكلا كل ما شاء أكله من كل ما فيها من ثمارها، غير ثمر شجرة واحدة ابتلاء منه لهما بذلك، وليمضي قضاء الله فيهما وفي ذريتهما، كما قال عز وجل:\n«وَقُلْنا يَا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، فوسوس لهما الشيطان حتى زين لهما أكل ما نهاهما ربهما عن أكله من ثمر تلك الشجرة، وحسن لهما معصية الله في ذلك، حتى أكلا منها، فبدت لهما من سوآتهما ما كان موارى عنهما منها فكان وصول عدو الله إبليس إلى تزيين ذلك لهما ما ذكر في الخبر الذي \u003cspan class=\"isnad\">حَدَّثَنِي موسى بن هارون الهمداني، قال: حدثنا عمرو بن حماد، قال: حدثنا أسباط، عن السدي- في خبر ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الْهَمْدَانِيِّ، عَنِ ابْنِ مَسْعُودٍ- وَعَنْ أُنَاسٍ مِنْ اصحاب النبي ص، قَالَ: \u003c/span>لَمَّا قَالَ اللَّهُ عَزَّ وَجَلَّ لآدَمَ:\n«اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلا مِنْها رَغَداً حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، أَرَادَ إِبْلِيسُ أَنْ يَدْخُلَ عَلَيْهِمَا الجنه","bs_ranges":[[815,1141]],"bs_html":"Kada je Allah, Silan i Uzvišen, nastanio Adema, alejhis-selam, i njegovu suprugu, dopustio im je da jedu šta god žele od svih plodova u Džennetu, osim ploda jednoga drveta, iskušavajući ih time i da se ostvari Allahova odredba o njima i njihovim potomcima, kako je rekao On, Silan i Uzvišen: „I rekli smo: Ademe, nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika.“ Šejtan im je došaptavao dok im nije uljepšao jedenje ploda toga drveta koje im je njihov Gospodar zabranio i prikazao im nepokornost Allahu u tome kao nešto lijepo. Na kraju su jeli s njega, pa im se otkrilo od njihovih stidnih mjesta ono što im je bilo skriveno. Kako je Allahov neprijatelj Iblis uspio da im to uljepša navedeno je u predaji koju \u003cspan class=\"isnad\">mi je pričao Musa ibn Harun el-Hemdani, koji je rekao: pričao nam je Amr ibn Hammad, koji je rekao: pričao nam je Esbat, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Vjerovjesnika, sallallahu alejhi ve sellem, koji je rekao: \u003c/span>„Kada je Allah, Silan i Uzvišen, rekao Ademu: ‘Nastani se ti i tvoja supruga u Džennetu i jedite iz njega obilno, odakle god hoćete, ali se ne približavajte ovom drvetu, pa da budete od nepravednika’, Iblis je htio ući k njima u Džennet, \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:35, cijeli ajet i njegov ponovljeni dio.⟧\u003c/span>"}],"notes":[]},{"n":107,"ar":"فمنعه الْخَزَنَةُ، فَأَتَى الْحَيَّةَ، وَهِيَ دَابَّةٌ لَهَا أَرْبَعُ قَوَائِمَ، كَأَنَّهَا الْبَعِيرُ، وَهِيَ كَأَحْسَنِ الدَّوَابِّ فَكَلَّمَهَا أَنْ تُدْخِلَهُ فِي فَمِهَا حَتَّى تَدْخُلَ بِهِ إِلَى آدَمَ، فَأَدْخَلَتْهُ فِي فَمِهَا، فَمَرَّتِ الْحَيَّةُ على الخزنه فدخلت وَهُمْ لا يَعْلَمُونَ، لِمَا أَرَادَ اللَّهُ عَزَّ وَجَلَّ مِنَ الأَمْرِ، فَكَلَّمَهُ مِنْ فَمِهَا وَلَمْ يُبَالِ كَلامَهُ، فَخَرَجَ إِلَيْهِ فَقَالَ: «يَا آدَمُ هَلْ أَدُلُّكَ عَلى شَجَرَةِ الْخُلْدِ وَمُلْكٍ لا يَبْلى» ، يَقُولُ: هَلْ أَدُلُّكَ عَلَى شَجَرَةٍ إِنْ أَكَلْتَ مِنْهَا كُنْتَ مَلِكًا مِثْلَ اللَّهِ تَبَارَكَ وَتَعَالَى أَوْ تَكُونَا مِنَ الْخَالِدِينَ فَلا تَمُوتَانِ أَبَدًا وَحَلَفَ لَهُمَا بِاللَّهِ إِنِّي لَكُمَا لَمِنَ النَّاصِحِينَ، وَإِنَّمَا أَرَادَ بِذَلِكَ أَنْ يُبْدِيَ لَهُمَا مَا تَوَارَى عَنْهُمَا مِنْ سَوْءَاتِهِمَا بِهَتْكِ لِبَاسِهِمَا، وَكَانَ قَدْ عَلِمَ أَنَّ لَهُمَا سَوْءَةً لِمَا كَانَ يَقْرَأُ مِنْ كُتُبِ الْمَلائِكَةِ، وَلَمْ يَكُنْ آدَمُ يَعْلَمُ ذَلِكَ، وَكَانَ لِبَاسُهُمَا الظُّفُرَ، فَأَبَى آدَمُ أَنْ يَأْكُلَ مِنْهَا، فَتَقَدَّمَتْ حَوَّاءُ فَأَكَلَتْ، ثُمَّ قَالَتْ: يَا آدَمُ كُلْ، فَإِنِّي قَدْ أَكَلْتُ، فلم يضرني، فلما اكل بدت لَهُما سَوْآتُهُما، وَطَفِقا يَخْصِفانِ عَلَيْهِما مِنْ وَرَقِ الْجَنَّةِ» .\nحَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، عن ليث ابن أَبِي سُلَيْمٍ، عَنْ طَاوُسٍ الْيَمَانِيِّ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: إِنَّ عَدُوَّ اللَّهِ إِبْلِيسَ عَرَضَ نَفْسَهُ عَلَى دَوَابِّ الأَرْضِ: أَيِّهَا تَحْمِلُهُ حَتَّى تدخل بِهِ الْجَنَّةَ حَتَّى يُكَلِّمَ آدَمَ وَزَوْجَهُ، فَكُلُّ الدَّوَابِّ أَبَى ذَلِكَ عَلَيْهِ، حَتَّى كَلَّمَ الْحَيَّةَ، فَقَالَ لَهَا: أَمْنَعُكِ مِنْ بَنِي آدَمَ، فَأَنْتِ فِي ذِمَّتِي إِنْ أَنْتِ أَدْخَلْتِنِي الْجَنَّةَ، فَجَعَلَتْهُ بَيْنَ نَابَيْنِ مِنْ أَنْيَابِهَا ثُمَّ دَخَلَتْ بِهِ، فَكَلَّمَهُمَا مِنْ فَمِهَا وَكَانَتْ كَاسِيَةً تَمْشِي عَلَى أَرْبَعِ قَوَائِمَ، فَأَعْرَاهَا اللَّهُ تَعَالَى وَجَعَلَهَا تَمْشِي عَلَى بَطْنِهَا، قَالَ: يَقُولُ ابْنُ عَبَّاسٍ:\nاقْتُلُوهَا حَيْثُ وَجَدْتُمُوهَا، وَاخْفِرُوا ذِمَّةَ عَدُوِّ اللَّهِ فِيهَا","bs":"\u003cp data-paragraph=\"107.1\">ali su ga čuvari spriječili. Došao je zmiji, životinji s četiri noge, nalik devi, jednoj od najljepših životinja, i zamolio je da ga stavi u svoja usta kako bi s njim ušla kod Adema. Stavila ga je u usta, prošla pored čuvara i ušla, a oni nisu znali, zbog onoga što je Allah, Silan i Uzvišen, htio da se dogodi. Govorio je Ademu iz njenih usta, ali on nije mario za njegove riječi. Zatim mu je izašao i rekao: ‘Ademe, hoćeš li da te uputim na drvo vječnosti i vlast koja ne propada?’ To znači: ‘Hoćeš li da te uputim na drvo s kojeg ćeš, ako budeš jeo, postati vladar poput Allaha, Blagoslovljenog i Uzvišenog, ili ćete postati vječni i nikada nećete umrijeti?’ Zakleo im se Allahom: ‘Ja sam vam, doista, iskren savjetnik.’ Time je samo htio otkriti njihova stidna mjesta koja su im bila skrivena, razotkrivši njihovu odjeću. Već je znao da imaju stidna mjesta, iz onoga što je čitao u knjigama meleka, dok Adem to nije znao. Njihova odjeća bila je nokat. Adem je odbio jesti s drveta, pa je Havva prva pristupila i jela. Zatim je rekla: ‘Ademe, jedi! Ja sam već jela i nije mi naškodilo.’ Kada je on jeo, otkrila su im se stidna mjesta i počeli su po sebi spajati džennetsko lišće.“ \u003cspan class=\"translator-note\">⟦Prijevod izričitog kur’anskog pitanja: Ta-Ha, 20:120, navedeni dio. Zakletva je prenesena prema El-A‘raf, 7:21. Završetak o pokrivanju lišćem odgovara El-A‘raf, 7:22, i Ta-Ha, 20:121. Riječi o „vladaru poput Allaha“ i odjeći od nokta pripadaju ovoj predaji.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"107.2\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, od Lejsa ibn Ebu Sulejma, od Tavusa el-Jemanija, od Ibn Abbasa, koji je rekao: „Allahov neprijatelj Iblis nudio se zemaljskim životinjama: koja bi ga ponijela i unijela u Džennet kako bi govorio Ademu i njegovoj supruzi. Sve životinje odbile su to, sve dok se nije obratio zmiji. Rekao joj je: ‘Zaštitit ću te od Ademovih potomaka. Bit ćeš pod mojom zaštitom ako me uneseš u Džennet.’ Stavila ga je između dvaju svojih očnjaka i ušla s njim. Govorio im je iz njenih usta. Ona je bila pokrivena i hodala na četiri noge, pa ju je Uzvišeni Allah ogolio i učinio da se kreće na trbuhu.“ Rekao je: Ibn Abbas govorio je: „Ubijajte je gdje god je nađete i prekršite zaštitu koju joj je dao Allahov neprijatelj.“\u003c/p>","paragraphs":[{"id":"107.1","ar":"فمنعه الْخَزَنَةُ، فَأَتَى الْحَيَّةَ، وَهِيَ دَابَّةٌ لَهَا أَرْبَعُ قَوَائِمَ، كَأَنَّهَا الْبَعِيرُ، وَهِيَ كَأَحْسَنِ الدَّوَابِّ فَكَلَّمَهَا أَنْ تُدْخِلَهُ فِي فَمِهَا حَتَّى تَدْخُلَ بِهِ إِلَى آدَمَ، فَأَدْخَلَتْهُ فِي فَمِهَا، فَمَرَّتِ الْحَيَّةُ على الخزنه فدخلت وَهُمْ لا يَعْلَمُونَ، لِمَا أَرَادَ اللَّهُ عَزَّ وَجَلَّ مِنَ الأَمْرِ، فَكَلَّمَهُ مِنْ فَمِهَا وَلَمْ يُبَالِ كَلامَهُ، فَخَرَجَ إِلَيْهِ فَقَالَ: «يَا آدَمُ هَلْ أَدُلُّكَ عَلى شَجَرَةِ الْخُلْدِ وَمُلْكٍ لا يَبْلى» ، يَقُولُ: هَلْ أَدُلُّكَ عَلَى شَجَرَةٍ إِنْ أَكَلْتَ مِنْهَا كُنْتَ مَلِكًا مِثْلَ اللَّهِ تَبَارَكَ وَتَعَالَى أَوْ تَكُونَا مِنَ الْخَالِدِينَ فَلا تَمُوتَانِ أَبَدًا وَحَلَفَ لَهُمَا بِاللَّهِ إِنِّي لَكُمَا لَمِنَ النَّاصِحِينَ، وَإِنَّمَا أَرَادَ بِذَلِكَ أَنْ يُبْدِيَ لَهُمَا مَا تَوَارَى عَنْهُمَا مِنْ سَوْءَاتِهِمَا بِهَتْكِ لِبَاسِهِمَا، وَكَانَ قَدْ عَلِمَ أَنَّ لَهُمَا سَوْءَةً لِمَا كَانَ يَقْرَأُ مِنْ كُتُبِ الْمَلائِكَةِ، وَلَمْ يَكُنْ آدَمُ يَعْلَمُ ذَلِكَ، وَكَانَ لِبَاسُهُمَا الظُّفُرَ، فَأَبَى آدَمُ أَنْ يَأْكُلَ مِنْهَا، فَتَقَدَّمَتْ حَوَّاءُ فَأَكَلَتْ، ثُمَّ قَالَتْ: يَا آدَمُ كُلْ، فَإِنِّي قَدْ أَكَلْتُ، فلم يضرني، فلما اكل بدت لَهُما سَوْآتُهُما، وَطَفِقا يَخْصِفانِ عَلَيْهِما مِنْ وَرَقِ الْجَنَّةِ» .","bs":"ali su ga čuvari spriječili. Došao je zmiji, životinji s četiri noge, nalik devi, jednoj od najljepših životinja, i zamolio je da ga stavi u svoja usta kako bi s njim ušla kod Adema. Stavila ga je u usta, prošla pored čuvara i ušla, a oni nisu znali, zbog onoga što je Allah, Silan i Uzvišen, htio da se dogodi. Govorio je Ademu iz njenih usta, ali on nije mario za njegove riječi. Zatim mu je izašao i rekao: ‘Ademe, hoćeš li da te uputim na drvo vječnosti i vlast koja ne propada?’ To znači: ‘Hoćeš li da te uputim na drvo s kojeg ćeš, ako budeš jeo, postati vladar poput Allaha, Blagoslovljenog i Uzvišenog, ili ćete postati vječni i nikada nećete umrijeti?’ Zakleo im se Allahom: ‘Ja sam vam, doista, iskren savjetnik.’ Time je samo htio otkriti njihova stidna mjesta koja su im bila skrivena, razotkrivši njihovu odjeću. Već je znao da imaju stidna mjesta, iz onoga što je čitao u knjigama meleka, dok Adem to nije znao. Njihova odjeća bila je nokat. Adem je odbio
