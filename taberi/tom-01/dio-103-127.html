قْتُلُوهَا حَيْثُ وَجَدْتُمُوهَا، وَاخْفِرُوا ذِمَّةَ عَدُوِّ اللَّهِ فِيهَا","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, od Lejsa ibn Ebu Sulejma, od Tavusa el-Jemanija, od Ibn Abbasa, koji je rekao: „Allahov neprijatelj Iblis nudio se zemaljskim životinjama: koja bi ga ponijela i unijela u Džennet kako bi govorio Ademu i njegovoj supruzi. Sve životinje odbile su to, sve dok se nije obratio zmiji. Rekao joj je: ‘Zaštitit ću te od Ademovih potomaka. Bit ćeš pod mojom zaštitom ako me uneseš u Džennet.’ Stavila ga je između dvaju svojih očnjaka i ušla s njim. Govorio im je iz njenih usta. Ona je bila pokrivena i hodala na četiri noge, pa ju je Uzvišeni Allah ogolio i učinio da se kreće na trbuhu.“ Rekao je: Ibn Abbas govorio je: „Ubijajte je gdje god je nađete i prekršite zaštitu koju joj je dao Allahov neprijatelj.“","ar_ranges":[[0,140]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، عن ليث ابن أَبِي سُلَيْمٍ، عَنْ طَاوُسٍ الْيَمَانِيِّ، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>إِنَّ عَدُوَّ اللَّهِ إِبْلِيسَ عَرَضَ نَفْسَهُ عَلَى دَوَابِّ الأَرْضِ: أَيِّهَا تَحْمِلُهُ حَتَّى تدخل بِهِ الْجَنَّةَ حَتَّى يُكَلِّمَ آدَمَ وَزَوْجَهُ، فَكُلُّ الدَّوَابِّ أَبَى ذَلِكَ عَلَيْهِ، حَتَّى كَلَّمَ الْحَيَّةَ، فَقَالَ لَهَا: أَمْنَعُكِ مِنْ بَنِي آدَمَ، فَأَنْتِ فِي ذِمَّتِي إِنْ أَنْتِ أَدْخَلْتِنِي الْجَنَّةَ، فَجَعَلَتْهُ بَيْنَ نَابَيْنِ مِنْ أَنْيَابِهَا ثُمَّ دَخَلَتْ بِهِ، فَكَلَّمَهُمَا مِنْ فَمِهَا وَكَانَتْ كَاسِيَةً تَمْشِي عَلَى أَرْبَعِ قَوَائِمَ، فَأَعْرَاهَا اللَّهُ تَعَالَى وَجَعَلَهَا تَمْشِي عَلَى بَطْنِهَا، قَالَ: يَقُولُ ابْنُ عَبَّاسٍ:\nاقْتُلُوهَا حَيْثُ وَجَدْتُمُوهَا، وَاخْفِرُوا ذِمَّةَ عَدُوِّ اللَّهِ فِيهَا","bs_ranges":[[0,157]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, od Lejsa ibn Ebu Sulejma, od Tavusa el-Jemanija, od Ibn Abbasa, koji je rekao: \u003c/span>„Allahov neprijatelj Iblis nudio se zemaljskim životinjama: koja bi ga ponijela i unijela u Džennet kako bi govorio Ademu i njegovoj supruzi. Sve životinje odbile su to, sve dok se nije obratio zmiji. Rekao joj je: ‘Zaštitit ću te od Ademovih potomaka. Bit ćeš pod mojom zaštitom ako me uneseš u Džennet.’ Stavila ga je između dvaju svojih očnjaka i ušla s njim. Govorio im je iz njenih usta. Ona je bila pokrivena i hodala na četiri noge, pa ju je Uzvišeni Allah ogolio i učinio da se kreće na trbuhu.“ Rekao je: Ibn Abbas govorio je: „Ubijajte je gdje god je nađete i prekršite zaštitu koju joj je dao Allahov neprijatelj.“"}],"notes":[]},{"n":108,"ar":"حدثنا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا عمر بن عبد الرحمن بن مهرب، قال: سمعت وهب بن منبه يقول:\nلما أسكن الله تعالى آدم وزوجته الجنة، ونهاه عن الشجرة، وكانت شجرة غصونها متشعب بعضها في بعض، وكان لها ثمر تأكله الملائكة لخلدهم، وهي الثمرة التي نهى الله عنها آدم وزوجته، فلما أراد إبليس أن يستزلهما دخل في جوف الحية، وكان للحية أربع قوائم، كأنها بختية من أحسن دابة خلقها الله تعالى، فلما دخلت الحيه الجنة خرج من جوفها إبليس، فأخذ من الشجرة التي نهى الله عنها آدم وزوجته، فجاء بها إلى حواء، فقال:\nانظري إلى هذه الشجرة، ما أطيب ريحها، وأطيب طعمها، وأحسن لونها! فأخذت حواء فأكلت منها، ثم ذهبت بها إلى آدم، فقالت: أنظر إلى هذه الشجرة ما أطيب ريحها، وأطيب طعمها، وأحسن لونها! فأكل منها آدم، فبدت لهما سوآتهما، فدخل آدم في جوف الشجرة، فناداه ربه: يا آدم، أين أنت؟ قال: أنا هذا يا رب، قال: ألا تخرج؟ قال: أستحي منك يا رب، قال: ملعونة الأرض التي خلقت منها لعنة حتى يتحول ثمارها شوكا! قال: ولم يكن في الجنة ولا في الأرض شجرة كانت أفضل من الطلح والسدر.\nثم قال: يا حواء، أنت التي غررت عبدي، فإنك لا تحملين حملا إلا حملته كرها، فإذا أردت أن تضعي ما في بطنك أشرفت على الموت مرارا وقال للحية: أنت التي دخل الملعون في بطنك حتى غر عبدي، ملعونة أنت لعنة حتى تتحول قوائمك في بطنك، ولا يكن لك رزق إلا التراب، أنت عدوة بني آدم وهم أعداؤك، حيث لقيت أحدا منهم أخذت بعقبه، وحيث لقيك شدخ رأسك","bs":"\u003cp data-paragraph=\"108.1\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Omer ibn Abdurrahman ibn Mehreb, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: „Kada je Uzvišeni Allah nastanio Adema i njegovu suprugu u Džennetu i zabranio mu drvo — bilo je to drvo isprepletenih grana, s plodom koji su meleki jeli radi svoje vječnosti, a to je plod koji je Allah zabranio Ademu i njegovoj supruzi — Iblis ih je htio navesti da posrnu. Ušao je u utrobu zmije. Zmija je imala četiri noge, bila je poput dvogrbe deve, jedna od najljepših životinja koje je Uzvišeni Allah stvorio. Kada je zmija ušla u Džennet, Iblis je izašao iz njene utrobe i uzeo s drveta koje je Allah zabranio Ademu i njegovoj supruzi. Donio je to Havvi i rekao: ‘Pogledaj ovo drvo! Kako lijepo miriše, kako je lijepog okusa i lijepe boje!’ Havva je uzela i jela s njega, zatim to odnijela Ademu i rekla: ‘Pogledaj ovo drvo! Kako lijepo miriše, kako je lijepog okusa i lijepe boje!’ Adem je jeo s njega, pa su im se otkrila stidna mjesta. Adem je ušao u unutrašnjost drveta, a njegov Gospodar ga je dozvao: ‘Ademe, gdje si?’ Odgovorio je: ‘Evo me, Gospodaru moj.’ Rekao je: ‘Zar nećeš izaći?’ Odgovorio je: ‘Stidim Te se, Gospodaru moj.’ Rekao je: ‘Prokleta neka je zemlja od koje si stvoren, takvim prokletstvom da joj se plodovi pretvore u trnje!’“ Rekao je: „Ni u Džennetu ni na Zemlji nije bilo boljeg drveta od talha i sidra.“\u003c/p>\u003cp data-paragraph=\"108.2\">„Zatim je rekao: ‘Havva, ti si obmanula Moga roba. Nijednu trudnoću nećeš nositi osim s teškoćom; a kada budeš trebala roditi ono što je u tvojoj utrobi, više puta približit ćeš se smrti.’ Zmiji je rekao: ‘Ti si ona u čiju je utrobu ušao prokletnik i obmanuo Moga roba. Prokleta si takvim prokletstvom da se tvoje noge povuku u tvoj trbuh i da ti opskrba bude samo zemlja. Ti si neprijateljica Ademovih potomaka, a oni su tvoji neprijatelji. Gdje god sretneš nekoga od njih, uhvatit ćeš ga za petu, a gdje god on sretne tebe, smrskat će ti glavu.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: talh (الطلح) i sidr (السدر) nazivi su drveća u predaji; ovdje im nije nametnuta određena botanička identifikacija.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"108.1","ar":"حدثنا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا عمر بن عبد الرحمن بن مهرب، قال: سمعت وهب بن منبه يقول:\nلما أسكن الله تعالى آدم وزوجته الجنة، ونهاه عن الشجرة، وكانت شجرة غصونها متشعب بعضها في بعض، وكان لها ثمر تأكله الملائكة لخلدهم، وهي الثمرة التي نهى الله عنها آدم وزوجته، فلما أراد إبليس أن يستزلهما دخل في جوف الحية، وكان للحية أربع قوائم، كأنها بختية من أحسن دابة خلقها الله تعالى، فلما دخلت الحيه الجنة خرج من جوفها إبليس، فأخذ من الشجرة التي نهى الله عنها آدم وزوجته، فجاء بها إلى حواء، فقال:\nانظري إلى هذه الشجرة، ما أطيب ريحها، وأطيب طعمها، وأحسن لونها! فأخذت حواء فأكلت منها، ثم ذهبت بها إلى آدم، فقالت: أنظر إلى هذه الشجرة ما أطيب ريحها، وأطيب طعمها، وأحسن لونها! فأكل منها آدم، فبدت لهما سوآتهما، فدخل آدم في جوف الشجرة، فناداه ربه: يا آدم، أين أنت؟ قال: أنا هذا يا رب، قال: ألا تخرج؟ قال: أستحي منك يا رب، قال: ملعونة الأرض التي خلقت منها لعنة حتى يتحول ثمارها شوكا! قال: ولم يكن في الجنة ولا في الأرض شجرة كانت أفضل من الطلح والسدر.","bs":"Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Omer ibn Abdurrahman ibn Mehreb, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: „Kada je Uzvišeni Allah nastanio Adema i njegovu suprugu u Džennetu i zabranio mu drvo — bilo je to drvo isprepletenih grana, s plodom koji su meleki jeli radi svoje vječnosti, a to je plod koji je Allah zabranio Ademu i njegovoj supruzi — Iblis ih je htio navesti da posrnu. Ušao je u utrobu zmije. Zmija je imala četiri noge, bila je poput dvogrbe deve, jedna od najljepših životinja koje je Uzvišeni Allah stvorio. Kada je zmija ušla u Džennet, Iblis je izašao iz njene utrobe i uzeo s drveta koje je Allah zabranio Ademu i njegovoj supruzi. Donio je to Havvi i rekao: ‘Pogledaj ovo drvo! Kako lijepo miriše, kako je lijepog okusa i lijepe boje!’ Havva je uzela i jela s njega, zatim to odnijela Ademu i rekla: ‘Pogledaj ovo drvo! Kako lijepo miriše, kako je lijepog okusa i lijepe boje!’ Adem je jeo s njega, pa su im se otkrila stidna mjesta. Adem je ušao u unutrašnjost drveta, a njegov Gospodar ga je dozvao: ‘Ademe, gdje si?’ Odgovorio je: ‘Evo me, Gospodaru moj.’ Rekao je: ‘Zar nećeš izaći?’ Odgovorio je: ‘Stidim Te se, Gospodaru moj.’ Rekao je: ‘Prokleta neka je zemlja od koje si stvoren, takvim prokletstvom da joj se plodovi pretvore u trnje!’“ Rekao je: „Ni u Džennetu ni na Zemlji nije bilo boljeg drveta od talha i sidra.“","ar_ranges":[[0,112]],"ar_html":"\u003cspan class=\"isnad\">حدثنا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا عمر بن عبد الرحمن بن مهرب، قال: سمعت وهب بن منبه يقول:\n\u003c/span>لما أسكن الله تعالى آدم وزوجته الجنة، ونهاه عن الشجرة، وكانت شجرة غصونها متشعب بعضها في بعض، وكان لها ثمر تأكله الملائكة لخلدهم، وهي الثمرة التي نهى الله عنها آدم وزوجته، فلما أراد إبليس أن يستزلهما دخل في جوف الحية، وكان للحية أربع قوائم، كأنها بختية من أحسن دابة خلقها الله تعالى، فلما دخلت الحيه الجنة خرج من جوفها إبليس، فأخذ من الشجرة التي نهى الله عنها آدم وزوجته، فجاء بها إلى حواء، فقال:\nانظري إلى هذه الشجرة، ما أطيب ريحها، وأطيب طعمها، وأحسن لونها! فأخذت حواء فأكلت منها، ثم ذهبت بها إلى آدم، فقالت: أنظر إلى هذه الشجرة ما أطيب ريحها، وأطيب طعمها، وأحسن لونها! فأكل منها آدم، فبدت لهما سوآتهما، فدخل آدم في جوف الشجرة، فناداه ربه: يا آدم، أين أنت؟ قال: أنا هذا يا رب، قال: ألا تخرج؟ قال: أستحي منك يا رب، قال: ملعونة الأرض التي خلقت منها لعنة حتى يتحول ثمارها شوكا! قال: ولم يكن في الجنة ولا في الأرض شجرة كانت أفضل من الطلح والسدر.","bs_ranges":[[0,201]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Omer ibn Abdurrahman ibn Mehreb, koji je rekao: čuo sam Vehba ibn Munebbiha kako govori: \u003c/span>„Kada je Uzvišeni Allah nastanio Adema i njegovu suprugu u Džennetu i zabranio َا الشَّجَرَةِ وَأَقُلْ لَكُما إِنَّ الشَّيْطانَ لَكُما عَدُوٌّ مُبِينٌ» لم أكلتها وقد نهيتك عنها؟ قال: يا رب أطعمتني حواء، قال لحواء: لم أطعمته؟ قالت:\nأمرتني الحية، قال للحية: لم أمرتها؟ قالت: أمرني إبليس، قال: ملعون مدحور! أما أنت يا حواء، فكما أدميت الشجرة تدمين في كل هلال، وأما أنت يا حية، فأقطع قوائمك فتمشين جريا على وجهك، وسيشدخ رأسك من لقيك بالحجر، اهبطوا بعضكم لبعض عدو.\n\nحدثت عن عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع، قال: حَدَّثَنِي محدث أن الشيطان دخل الجنة في صورة دابة ذات قوائم، فكان يرى أنه البعير، قال: فلعن فسقطت قوائمه فصار حية.\n\nحدثت عن عمار، قال: حَدَّثَنَا عبد الله بن أبي جعفر، عن","bs":"\u003cp data-paragraph=\"109.1\">Vehb je upitan: „A šta su meleki jeli?“ Odgovorio je: „Allah čini šta hoće.“\u003c/p>\u003cp data-paragraph=\"109.2\">Pričao nam je Kasim ibn el-Hasen, koji je rekao: pričao nam je Husejn ibn Davud, koji je rekao: pričao mi je Hadždžadž, od Ebu Ma‘šera, od Muhammeda ibn Kajsa, koji je rekao: „Uzvišeni Allah zabranio je Ademu i Havvi da jedu s jednog drveta u Džennetu, a inače su iz njega mogli jesti obilno odakle god su željeli. Šejtan je došao, ušao u utrobu zmije, govorio Havvi i došaptavao Ademu: ‘Vaš Gospodar zabranio vam je ovo drvo samo zato da ne postanete dva meleka ili da ne postanete vječni. I zakleo im se: Ja sam vam, doista, iskren savjetnik.’“ Rekao je: „Havva je zarezala drvo, pa je drvo prokrvarilo, a s njih je spala raskošna odjeća koju su nosili. ‘I počeli su po sebi spajati džennetsko lišće. Njihov ih Gospodar dozva: Zar vam nisam zabranio to drvo i rekao vam da vam je šejtan otvoreni neprijatelj?’ ‘Zašto si jeo s njega kada sam ti ga zabranio?’ Odgovorio je: ‘Gospodaru moj, Havva me nahranila.’ Rekao je Havvi: ‘Zašto si ga nahranila?’ Odgovorila je: ‘Zmija mi je naredila.’ Rekao je zmiji: ‘Zašto si joj naredila?’ Odgovorila je: ‘Iblis mi je naredio.’ Rekao je: ‘Proklet i odbačen! A ti, Havva, kao što si raskrvarila drvo, krvarit ćeš pri svakom mlađaku. A tebi, zmijo, odsjeći ću noge, pa ćeš se brzo kretati na svome licu. Ko god te sretne smrskat će ti glavu kamenom. Siđite; jedni drugima bit ćete neprijatelji.’“ \u003cspan class=\"translator-note\">⟦Prijevodi izričitih kur’anskih navoda: El-A‘raf, 7:20–22, navedeni dijelovi. Završna naredba prenosi izraz iz El-Bekara, 2:36, i El-A‘raf, 7:24.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"109.3\">Preneseno mi je od Ammara ibn el-Hasena, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, koji je rekao: „Pričao mi je jedan pripovjedač da je šejtan ušao u Džennet u liku četveronožne životinje. Smatralo se da je to bila deva.“ Rekao je: „Proklet je, pa su mu otpale noge i postao je zmija.“\u003c/p>\u003cp data-paragraph=\"109.4\">Preneseno mi je od Ammara, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od\u003c/p>","paragraphs":[{"id":"109.1","ar":"قيل لوهب: وما كانت الملائكة تأكل؟ قال: يفعل الله ما يشاء.","bs":"Vehb je upitan: „A šta su meleki jeli?“ Odgovorio je: „Allah čini šta hoće.“","ar_ranges":[],"ar_html":"قيل لوهب: وما كانت الملائكة تأكل؟ قال: يفعل الله ما يشاء.","bs_ranges":[],"bs_html":"Vehb je upitan: „A šta su meleki jeli?“ Odgovorio je: „Allah čini šta hoće.“"},{"id":"109.2","ar":"حَدَّثَنَا القاسم بن الحسن، قال: حدثنا الحسين بن داود، قال: حدثني حجاج، عن أبي معشر، عن محمد بن قيس، قال: نهى الله تعالى آدم وحواء أن يأكلا من شجرة واحدة في الجنة، ويأكلا منها رغدا حيث شاءا، فجاء الشيطان فدخل في جوف الحية، فكلم حواء، ووسوس إلى آدم فقال: «مَا نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» قال: فقطعت حواء الشجرة فدميت الشجرة، وسقط عنهما رياشهما الذي كان عليهما، «وَطَفِقا يَخْصِفانِ عَلَيْهِما مِنْ وَرَقِ الْجَنَّةِ وَناداهُما رَبُّهُما أَلَمْ أَنْهَكُما عَنْ تِلْكُمَا الشَّجَرَةِ وَأَقُلْ لَكُما إِنَّ الشَّيْطانَ لَكُما عَدُوٌّ مُبِينٌ» لم أكلتها وقد نهيتك عنها؟ قال: يا رب أطعمتني حواء، قال لحواء: لم أطعمته؟ قالت:\nأمرتني الحية، قال للحية: لم أمرتها؟ قالت: ge, pa ćeš se brzo kretati na svome licu. Ko god te sretne smrskat će ti glavu kamenom. Siđite; jedni drugima bit ćete neprijatelji.’“ \u003cspan class=\"translator-note\">⟦Prijevodi izričitih kur’anskih navoda: El-A‘raf, 7:20–22, navedeni dijelovi. Završna naredba prenosi izraz iz El-Bekara, 2:36, i El-A‘raf, 7:24.⟧\u003c/span>"},{"id":"109.3","ar":"حدثت عن عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع، قال: حَدَّثَنِي محدث أن الشيطان دخل الجنة في صورة دابة ذات قوائم، فكان يرى أنه البعير، قال: فلعن فسقطت قوائمه فصار حية.","bs":"Preneseno mi je od Ammara ibn el-Hasena, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, koji je rekao: „Pričao mi je jedan pripovjedač da je šejtan ušao u Džennet u liku četveronožne životinje. Smatralo se da je to bila deva.“ Rekao je: „Proklet je, pa su mu otpale noge i postao je zmija.“","ar_ranges":[[0,168]],"ar_html":"\u003cspan class=\"isnad\">حدثت عن عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع، قال: حَدَّثَنِي محدث أن الشيطان دخل الجنة في صورة دابة ذات قوائم، فكان يرى أنه البعير، قال: \u003c/span>فلعن فسقطت قوائمه فصار حية.","bs_ranges":[[0,134],[135,166]],"bs_html":"\u003cspan class=\"isnad\">Preneseno mi je od Ammara ibn el-Hasena, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, koji je rekao: \u003c/span>„\u003cspan class=\"isnad\">Pričao mi je jedan pripovjedač \u003c/span>da je šejtan ušao u Džennet u liku četveronožne životinje. Smatralo se da je to bila deva.“ Rekao je: „Proklet je, pa su mu otpale noge i postao je zmija.“"},{"id":"109.4","ar":"حدثت عن عمار، قال: حَدَّثَنَا عبد الله بن أبي جعفر، عن","bs":"Preneseno mi je od Ammara, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od","ar_ranges":[[0,54]],"ar_html":"\u003cspan class=\"isnad\">حدثت عن عمار، قال: حَدَّثَنَا عبد الله بن أبي جعفر، عن\u003c/span>","bs_ranges":[[0,83]],"bs_html":"\u003cspan class=\"isnad\">Preneseno mi je od Ammara, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od\u003c/span>"}],"notes":[]},{"n":110,"ar":"أبيه، عن الربيع قال: وحدثني أبو العالية، قال: إن من الإبل ما كان أولها من الجن قال: فأبيحت له الجنة كلها- يعنى آدم- الا الشجرة، وقيل لهما: «لا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، قال: فأتى الشيطان حواء فبدأ بها، فقال: نهيتما عن شيء؟ قالت: نعم، عن هذه الشجرة، فقال:\n«ما نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ» قال: فبدت حواء فأكلت منها، ثم أمرت آدم فأكل منها قال: وكانت شجرة، من أكل منها أحدث، قال: ولا ينبغي أن يكون في الجنة حدث، قال: «فَأَزَلَّهُمَا الشَّيْطانُ عَنْها فَأَخْرَجَهُما مِمَّا كَانَا فِيهِ» ، قال: فأخرج آدم من الجنة.\nحَدَّثَنَا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ بَعْضِ أَهْلِ العلم أن آدم ع حين دخل الجنة ورأى ما فيها من الكرامة، وما أعطاه الله منها، قال: لو أنا خلدنا! فاغتمز فيها منه الشيطان لما سمعها منه، فأتاه من قبل الخلد.\n\nحَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال:\n\nحدثت أن أول ما ابتدأهما به من كيده إياهما أنه ناح عليهما نياحة أحزنتهما حين سمعاها، فقالا له: ما يبكيك؟ قال: أبكي عليكما،","bs":"\u003cp data-paragraph=\"110.1\">svoga oca, od Rebie, koji je rekao: „Pričao mi je i Ebu Alija, koji je rekao: ‘Nekim je devama početak bio među džinima.’“ Rekao je: „Dopušten mu je cijeli Džennet — misli se Ademu — osim drveta. Njima dvoma rečeno je: ‘Ne približavajte se ovom drvetu, pa da budete od nepravednika.’“ Rekao je: „Šejtan je došao Havvi, počevši od nje, i rekao: ‘Je li vam nešto zabranjeno?’ Odgovorila je: ‘Jeste, ovo drvo.’ Rekao je: ‘Vaš Gospodar zabranio vam je ovo drvo samo zato da ne postanete dva meleka ili da ne postanete vječni.’“ Rekao je: „Havva je prva pristupila i jela s njega, zatim je naredila Ademu pa je i on jeo.“ Rekao je: „Bilo je to drvo s kojeg bi onaj ko jede obavio nuždu.“ Rekao je: „A u Džennetu ne priliči da se obavlja nužda.“ Rekao je: „‘Šejtan ih je naveo da zbog njega posrnu i izveo ih iz onoga u čemu su bili.’“ Rekao je: „Adem je izveden iz Dženneta.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:35, navedeni dio; El-A‘raf, 7:20, navedeni dio; El-Bekara, 2:36, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"110.2\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Muhammed ibn Ishak, od nekih učenih ljudi, da je Adem, alejhis-selam, kada je ušao u Džennet i vidio počasti u njemu i ono što mu je Allah od njega dao, rekao: „Kada bismo samo ostali vječno!“ Kada je šejtan to od njega čuo, našao je u tome njegovu slabu tačku i prišao mu s pitanjem vječnosti.\u003c/p>\u003cp data-paragraph=\"110.3\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Preneseno mi je da je prva njegova spletka njima dvoma bila da je nad njima počeo naricati naricanjem koje ih je rastužilo kada su ga čuli. Pitali su ga: ‘Zašto plačeš?’ Odgovorio je: ‘Plačem zbog vas;\u003c/p>","paragraphs":[{"id":"110.1","ar":"أبيه، عن الربيع قال: وحدثني أبو العالية، قال: إن من الإبل ما كان أولها من الجن قال: فأبيحت له الجنة كلها- يعنى آدم- الا الشجرة، وقيل لهما: «لا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظَّالِمِينَ» ، قال: فأتى الشيطان حواء فبدأ بها، فقال: نهيتما عن شيء؟ قالت: نعم، عن هذه الشجرة، فقال:\n«ما نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ» قال: فبدت حواء فأكلت منها، ثم أمرت آدم فأكل منها قال: وكانت شجرة، من أكل منها أحدث، قال: ولا ينبغي أن يكون في الجنة حدث، قال: «فَأَزَلَّهُمَا الشَّيْطانُ عَنْها فَأَخْرَجَهُما مِمَّا كَانَا فِيهِ» ، قال: فأخرج آدم من الجنة.","bs":"svoga oca, od Rebie, koji je rekao: „Pričao mi je i Ebu Alija, koji je rekao: ‘Nekim je devama početak bio među džinima.’“ Rekao je: „Dopušten mu je cijeli Džennet — misli se Ademu — osim drveta. Njima dvoma rečeno je: ‘Ne približavajte se ovom drvetu, pa da budete od nepravednika.’“ Rekao je: „Šejtan je došao Havvi, počevši od nje, i rekao je naredila Ademu pa je i on jeo.“ Rekao je: „Bilo je to drvo s kojeg bi onaj ko jede obavio nuždu.“ Rekao je: „A u Džennetu ne priliči da se obavlja nužda.“ Rekao je: „‘Šejtan ih je naveo da zbog njega posrnu i izveo ih iz onoga u čemu su bili.’“ Rekao je: „Adem je izveden iz Dženneta.“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih navoda: El-Bekara, 2:35, navedeni dio; El-A‘raf, 7:20, navedeni dio; El-Bekara, 2:36, navedeni dio.⟧\u003c/span>"},{"id":"110.2","ar":"حَدَّثَنَا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ بَعْضِ أَهْلِ العلم أن آدم ع حين دخل الجنة ورأى ما فيها من الكرامة، وما أعطاه الله منها، قال: لو أنا خلدنا! فاغتمز فيها منه الشيطان لما سمعها منه، فأتاه من قبل الخلد.","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Muhammed ibn Ishak, od nekih učenih ljudi, da je Adem, alejhis-selam, kada je ušao u Džennet i vidio počasti u njemu i ono što mu je Allah od njega dao, rekao: „Kada bismo samo ostali vječno!“ Kada je šejtan to od njega čuo, našao je u tome njegovu slabu tačku i prišao mu s pitanjem vječnosti.","ar_ranges":[[0,105]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حدثنا سلمة، قال: حَدَّثَنَا مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ بَعْضِ أَهْلِ العلم \u003c/span>أن آدم ع حين دخل الجنة ورأى ما فيها من الكرامة، وما أعطاه الله منها، قال: لو أنا خلدنا! فاغتمز فيها منه الشيطان لما سمعها منه، فأتاه من قبل الخلد.","bs_ranges":[[0,135]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, koji je rekao: pričao nam je Muhammed ibn Ishak, od nekih učenih ljudi, \u003c/span>da je Adem, alejhis-selam, kada je ušao u Džennet i vidio počasti u njemu i ono što mu je Allah od njega dao, rekao: „Kada bismo samo ostali vječno!“ Kada je šejtan to od njega čuo, našao je u tome njegovu slabu tačku i prišao mu s pitanjem vječnosti."},{"id":"110.3","ar":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال:\n\nحدثت أن أول ما ابتدأهما به من كيده إياهما أنه ناح عليهما نياحة أحزنتهما حين سمعاها، فقالا له: ما يبكيك؟ قال: أبكي عليكما،","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Preneseno mi je da je prva njegova spletka njima dvoma bila da je nad njima počeo naricati naricanjem koje ih je rastužilo kada su ga čuli. Pitali su ga: ‘Zašto plačeš?’ Odgovorio je: ‘Plačem zbog vas;","ar_ranges":[[0,157]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال:\n\nحدثت أن أول ما ابتدأهما به من كيده إياهما أنه ناح عليهما نياحة أحزنتهما حين سمعاها، فقالا له: \u003c/span>ما يبكيك؟ قال: أبكي عليكما،","bs_ranges":[[0,93]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: \u003c/span>„Preneseno mi je da je prva njegova spletka njima dvoma bila da je nad njima počeo naricati naricanjem koje ih je rastužilo kada su ga čuli. Pitali su ga: ‘Zašto plačeš?’ Odgovorio je: ‘Plačem zbog vas;"}],"notes":[]},{"n":111,"ar":"تموتان فتفارقان ما أنتما فيه من النعمة والكرامة فوقع ذلك في أنفسهما، ثم أتاهما فوسوس إليهما، فقال: يا آدم هل أدلك على شجرة الخلد وملك لا يبلى؟ وقال: «ما نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» ، أي تكونان ملكين أو تخلدان، أي إن لم تكونا ملكين في نعمة الجنة فلا تموتان يقول الله عز وجل: «فَدَلَّاهُما بِغُرُورٍ» .\nحدثني يونس، قال أخبرنا ابن وهب، قال: قال ابن زيد في قوله سبحانه وتعالى: «فَوَسْوَسَ» : وسوس الشيطان إلى حواء في الشجرة حتى اتى بها إليها، ثم حسنتها في عين آدم، قال: فدعاها آدم لحاجته، قالت:\nلا: الا ان تأتي هاهنا، فلما أتى قالت: لا، إلا أن تأكل من هذه الشجرة، قال: فأكلا منها، فبدت لهما سوءاتهما قال: وذهب آدم هاربا في الجنة، فناداه ربه: يا آدم، أمني تفر؟ قال: لا يا رب، ولكن حياء منك، قال: يا آدم، انى اتيت؟ قال: من قبل حواء يا رب، فقال الله عز وجل: فإن لها علي أن أدميها في كل شهر مرة، كما أدمت هذه الشجرة، وأن أجعلها سفيهة، وقد كنت خلقتها حليمة، وأن أجعلها تحمل كرها وتضع كرها، وقد كنت جعلتها تحمل يسرا وتضع يسرا قال ابن زيد: ولولا البلية التي أصابت حواء لكان نساء أهل الدنيا لا يحضن، ولكن حليمات، ولكن يحملن يسرا،.\nويضعن يسرا.\n\nحَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ يَزِيدَ بْنِ عَبْدِ الله بن قسيط، عن سعيد بن المسيب، قال: سمعته يحلف بالله ما يستثني: ما أكل آدم من الشجرة وهو يعقل، ولكن حواء سقته","bs":"\u003cp data-paragraph=\"111.1\">umrijet ćete i napustiti blagodati i počasti u kojima ste.’ To im je ostalo u duši. Zatim im je došao i došaptavao: ‘Ademe, hoćeš li da te uputim na drvo vječnosti i vlast koja ne propada?’ Rekao je i: ‘Vaš Gospodar zabranio vam je ovo drvo samo zato da ne postanete dva meleka ili da ne postanete vječni. I zakleo im se: Ja sam vam, doista, iskren savjetnik.’ To jest: postat ćete dva meleka ili ćete ostati vječno; odnosno, ako i ne postanete dva meleka u džennetskim blagodatima, nećete umrijeti. Allah, Silan i Uzvišen, kaže: ‘Pa ih je obmanom spustio.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih riječi unutar predaje: Ta-Ha, 20:120, navedeni dio; El-A‘raf, 7:20–22, navedeni dijelovi.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"111.2\">Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, o riječima Njega, Slavljenog i Uzvišenog: „Pa je došaptavao“: „Šejtan je došaptavao Havvi o drvetu, sve dok joj ga nije donio. Zatim ga je ona uljepšala u Ademovim očima.“ Rekao je: „Adem ju je pozvao radi svoje potrebe, a ona je rekla: ‘Ne, osim ako dođeš ovamo.’ Kada je došao, rekla je: ‘Ne, osim ako jedeš s ovoga drveta.’“ Rekao je: „Oboje su jeli s njega, pa su im se otkrila stidna mjesta.“ Rekao je: „Adem je potrčao bježeći po Džennetu. Njegov Gospodar dozvao ga je: ‘Ademe, zar bježiš od Mene?’ Odgovorio je: ‘Ne, Gospodaru moj, nego zbog stida pred Tobom.’ Rekao je: ‘Ademe, s koje si strane doveden u to?’ Odgovorio je: ‘S Havvine strane, Gospodaru moj.’ Allah, Silan i Uzvišen, rekao je: ‘Ona će zato od Mene imati da jednom svakog mjeseca prokrvari, kao što je raskrvarila ovo drvo, i da je učinim lakomislenom, a stvorio sam je razboritom; da nosi trudnoću s teškoćom i rađa s teškoćom, a bio sam joj dao da trudnoću nosi lahko i rađa lahko.’“ Ibn Zejd je rekao: „Da nije iskušenja koje je zadesilo Havvu, žene ovoga svijeta ne bi imale mjesečnicu; bile bi razborite, lahko bi nosile trudnoću i lahko rađale.“ \u003cspan class=\"translator-note\">⟦„Pa je došaptavao“ prijevod je početka izraza فوسوس u El-A‘raf, 7:20, i Ta-Ha, 20:120. Preostale tvrdnje u ovom odlomku prenose sadržaj Ibn Zejdove predaje.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"111.3\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, od Jezida ibn Abdullaha ibn Kusajta, od Seida ibn el-Musejjeba, koji je rekao: „Čuo sam ga kako se zaklinje Allahom, bez izuzetka: ‘Adem nije jeo s drveta dok je bio pri razumu, nego ga je Havva napojila\u003c/p>","paragraphs":[{"id":"111.1","ar":"تموتان فتفارقان ما أنتما فيه من النعمة والكرامة فوقع ذلك في أنفسهما، ثم أتاهما فوسوس إليهما، فقال: يا آدم هل أدلك على شجرة الخلد وملك لا يبلى؟ وقال: «ما نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» ، أي تكونان ملكين أو تخلدان، أي إن لم تكونا ملكين في نعمة الجنة فلا تموتان يقول الله عز وجل: «فَدَلَّاهُما بِغُرُورٍ» .","bs":"umrijet ćete i napustiti blagodati i počasti u kojima ste.’ To im je ostalo u duši. Zatim im je došao i došaptavao: ‘Ademe, hoćeš li da te uputim na drvo vječnosti i vlast koja ne propada?’ Rekao je i: ‘Vaš Gospodar zabranio vam je ovo drvo samo zato da ne postanete dva meleka ili da ne postanete vječni. I zakleo im se: Ja sam vam, doista, iskren savjetnik.’ To jest: postat ćete dva meleka ili ćete ostati vječno; odnosno, ako i ne postanete dva meleka u džennetskim blagodatima, nećete umrijeti. Allah, Silan i Uzvišen, kaže: ‘Pa ih je obmanom spustio.’“ ⟦Prijevodi kur’anskih riječi unutar predaje: Ta-Ha, 20:120, navedeni dio; El-A‘raf, 7:20–22, navedeni dijelovi.⟧","ar_ranges":[],"ar_html":"تموتان فتفارقان ما أنتما فيه من النعمة والكرامة فوقع ذلك في أنفسهما، ثم أتاهما فوسوس إليهما، فقال: يا آدم هل أدلك على شجرة الخلد وملك لا يبلى؟ وقال: «ما نَهاكُما رَبُّكُما عَنْ هذِهِ الشَّجَرَةِ إِلَّا أَنْ تَكُونا مَلَكَيْنِ أَوْ تَكُونا مِنَ الْخالِدِينَ وَقاسَمَهُما إِنِّي لَكُما لَمِنَ النَّاصِحِينَ» ، أي تكونان ملكين أو تخلدان، أي إن لم تكونا ملكين في نعمة الجنة فلا تموتان يقول الله عز وجل: «فَدَلَّاهُما بِغُرُورٍ» .","bs_ranges":[],"bs_html":"umrijet ćete i napustiti blagodati i počasti u kojima ste.’ To im je ostalo u duši. Zatim im je došao i došaptavao: ‘Ademe, hoćeš li da te uputim na drvo vječnosti i vlast koja ne propada?’ Rekao je i: ‘Vaš Gospodar zabranio vam je ovo drvo samo zato da ne postanete dva meleka ili da ne postanete vječni. I zakleo im se: Ja sam vam, doista, iskren savjetnik.’ To jest: postat ćete dva meleka ili ćete ostati vječno; odnosno, ako i ne postanete dva meleka u džennetskim blagodatima, nećete umrijeti. Allah, Silan i Uzvišen, kaže: ‘Pa ih je obmanom spustio.’“ \u003cspan class=\"translator-note\">⟦Prijevodi kur’anskih riječi unutar predaje: Ta-Ha, 20:120, navedeni dio; El-A‘raf, 7:20–22, navedeni dijelovi.⟧\u003c/span>"},{"id":"111.2","ar":"حدثني يونس، قال أخبرنا ابن وهب، قال: قال ابن زيد في قوله سبحانه وتعالى: «فَوَسْوَسَ» : وسوس الشيطان إلى حواء في الشجرة حتى اتى بها إليها، ثم حسنتها في عين آدم، قال: فدعاها آدم لحاجته، قالت:\nلا: الا ان تأتي هاهنا، فلما أتى قالت: لا، إلا أن تأكل من هذه الشجرة، قال: فأكلا منها، فبدت لهما سوءاتهما قال: وذهب آدم هاربا في الجنة، فناداه ربه: يا آدم، أمني تفر؟ قال: لا يا رب، ولكن حياء منك، قال: يا آدم، انى اتيت؟ قال: من قبل حواء يا رب، فقال الله عز وجل: فإن لها علي أن أدميها في كل شهر مرة، كما أدمت هذه الشجرة، وأن أجعلها سفيهة، وقد كنت خلقتها حليمة، وأن أجعلها تحمل كرها وتضع كرها، وقد كنت جعلتها تحمل يسرا وتضع يسرا قال ابن زيد: ولولا البلية التي أصابت حواء لكان نساء أهل الدنيا لا يحضن، ولكن حليمات، ولكن يحملن يسرا،.\nويضعن يسرا.","bs":"Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, o riječima Njega, Slavljenog i Uzvišenog: „Pa je došaptavao“: „Šejtan je došaptavao Havvi o drvetu, sve dok joj ga nije donio. Zatim ga je ona uljepšala u Ademovim očima.“ Rekao je: „Adem ju je pozvao radi svoje potrebe, a ona je rekla: ‘Ne, osim ako dođeš ovamo.’ Kada je došao, rekla je: ‘Ne, osim ako jedeš s ovoga drveta.’“ Rekao je: „Oboje su jeli s njega, pa su im se otkrila stidna mjesta.“ Rekao je: „Adem je potrčao bježeći po Džennetu. Njegov Gospodar dozvao ga je: ‘Ademe, zar bježiš od Mene?’ Odgovorio je: ‘Ne, Gospodaru moj, nego zbog stida pred Tobom.’ Rekao je: ‘Ademe, s koje si strane doveden u to?’ Odgovorio je: ‘S Havvine strane, Gospodaru moj.’ Allah, Silan i Uzvišen, rekao je: ‘Ona će zato od Mene imati da jednom svakog mjeseca prokrvari, kao što je raskrvarila ovo drvo, i da je učinim lakomislenom, a stvorio sam je razboritom; da nosi trudnoću s teškoćom i rađa s teškoćom, a bio sam joj dao da trudnoću nosi lahko i rađa lahko.’“ Ibn Zejd je rekao: „Da nije iskušenja koje je zadesilo Havvu, žene ovoga svijeta ne bi imale mjesečnicu; bile bi razborite, lahko bi nosile trudnoću i lahko rađale.“ ⟦„Pa je došaptavao“ prijevod je početka izraza فوسوس u El-A‘raf, 7:20, i Ta-Ha, 20:120. Preostale tvrdnje u ovom odlomku prenose sadržaj Ibn Zejdove predaje.⟧","ar_ranges":[[0,49]],"ar_html":"\u003cspan class=\"isnad\">حدثني يونس، قال أخبرنا ابن وهب، قال: قال ابن زيد \u003c/span>في قوله سبحانه وتعالى: «فَوَسْوَسَ» : وسوس الشيطان إلى حواء في الشجرة حتى اتى بها إليها، ثم حسنتها في عين آدم، قال: فدعاها آدم لحاجته، قالت:\nلا: الا ان تأتي هاهنا، فلما أتى قالت: لا، إلا أن تأكل من هذه الشجرة، قال: فأكلا منها، فبدت لهما سوءاتهما قال: وذهب آدم هاربا في الجنة، فناداه ربه: يا آدم، أمني تفر؟ قال: لا يا رب، ولكن حياء منك، قال: يا آدم، انى اتيت؟ قال: من قبل حواء يا رب، فقال الله عز وجل: فإن لها علي أن أدميها في كل شهر مرة، كما أدمت هذه الشجرة، وأن أجعلها سفيهة، وقد كنت خلقتها حليمة، وأن أجعلها تحمل كرها وتضع كرها، وقد كنت جعلتها تحمل يسرا وتضع يسرا قال ابن زيد: ولولا البلية التي أصابت حواء لكان نساء أهل الدنيا لا يحضن، ولكن حليمات، ولكن يحملن يسرا،.\nويضعن يسرا.","bs_ranges":[[0,98]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, \u003c/span>o riječima Njega, Slavljenog i Uzvišenog: „Pa je došaptavao“: „Šejtan je došaptavao Havvi o drvetu, sve dok joj ga nije donio. Zatim ga je ona uljepšala u Ademovim očima.“ Rekao je: „Adem ju je pozvao radi svoje potrebe, a ona je rekla: ‘Ne, osim ako dođeš ovamo.’ Kada je došao, rekla je: ‘Ne, osim ako jedeš s ovoga drveta.’“ Rekao je: „Oboje su jeli s njega, pa su im se otkrila stidna mjesta.“ Rekao je: „Adem je potrčao bježeći po Džennetu. Njegov Gospodar dozvao ga je: ‘Ademe, zar bježiš od Mene?’ Odgovorio je: ‘Ne, Gospodaru moj, nego zbog stida pred Tobom.’ Rekao je: ‘Ademe, s koje si strane doveden u to?’ Odgovorio je: ‘S Havvine strane, Gospodaru moj.’ Allah, Silan i Uzvišen, rekao je: ‘Ona će zato od Mene imati da jednom svakog mjeseca prokrvari, kao što je raskrvarila ovo drvo, i da je učinim lakomislenom, a stvorio sam je razboritom; da nosi trudnoću s teškoćom i rađa s teškoćom, a bio sam joj dao da trudnoću nosi lahko i rađa lahko.’“ Ibn Zejd je rekao: „Da nije iskušenja koje je zadesilo Havvu, žene ovoga svijeta ne bi imale mjesečnicu; bile bi razborite, lahko bi nosile trudnoću i lahko rađale.“ \u003cspan class=\"translator-note\">⟦„Pa je došaptavao“ prijevod je početka izraza فوسوس u El-A‘raf, 7:20, i Ta-Ha, 20:120. Preostale tvrdnje u ovom odlomku prenose sadržaj Ibn Zejdove predaje.⟧\u003c/span>"},{"id":"111.3","ar":"حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ يَزِيدَ بْنِ عَبْدِ الله بن قسيط، عن سعيد بن المسيب، قال: سمعته يحلف بالله ما يستثني: ما أكل آدم من الشجرة وهو يعقل، ولكن حواء سقته","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, od Jezida ibn Abdullaha ibn Kusajta, od Seida ibn el-Musejjeba, koji je rekao: „Čuo sam ga kako se zaklinje Allahom, bez izuzetka: ‘Adem nije jeo s drveta dok je bio pri razumu, nego ga je Havva napojila","ar_ranges":[[0,163]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن مُحَمَّدُ بْنُ إِسْحَاقَ، عَنْ يَزِيدَ بْنِ عَبْدِ الله بن قسيط، عن سعيد بن المسيب، قال: سمعته يحلف بالله ما يستثني: \u003c/span>ما أكل آدم من الشجرة وهو يعقل، ولكن حواء سقته","bs_ranges":[[0,167]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Muhammeda ibn Ishaka, od Jezida ibn Abdullaha ibn Kusajta, od Seida ibn el-Musejjeba, koji je rekao: \u003c/span>„Čuo sam ga kako se zaklinje Allahom, bez izuzetka: ‘Adem nije jeo s drveta dok je bio pri razumu, nego ga je Havva napojila"}],"notes":[]},{"n":112,"ar":"الخمر حتى إذا سكر قادته إليها، فأكل منها فلما واقع آدم وحواء الخطيئة، أخرجهما الله تعالى من الجنه وسلبهما ما كانا فيه من النعمة والكرامة، وأهبطهما وعدوهما إبليس والحية إلى الأرض، فقال لهم ربهم: اهبطوا بعضكم لبعض عدو.\n\nوكالذي قلنا في ذلك قال السلف من أهل العلم.\nحَدَّثَنِي يُونُسُ، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: حَدَّثَنَا عَبْدُ الرحمن ابن مَهْدِيٍّ، عَنْ إِسْرَائِيلَ، عَنْ إِسْمَاعِيلَ السُّدِّيِّ، قَالَ: حَدَّثَنِي مَنْ سَمِعَ ابْنَ عَبَّاسٍ يَقُولُ: «اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، قَالَ: آدَمُ وَحَوَّاءُ وَإِبْلِيسُ وَالْحَيَّةُ.\nحَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، وَمُوسَى بْنُ هَارُونَ، قَالا: حَدَّثَنَا عمرو ابن حَمَّادٍ، عَنْ أَسْبَاطٍ، عَنِ السُّدِّيِّ- فِي خَبَرٍ ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابْنِ مَسْعُودٍ- وَعَنْ نَاسٍ مِنْ أَصْحَابِ رَسُولِ الله ص: «اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، فَلَعَنَ الْحَيَّةَ فَقَطَعَ قَوَائِمَهَا، وَتَرَكَهَا تَمْشِي عَلَى بَطْنِهَا، وَجَعَلَ رِزْقَهَا مِنَ التُّرَابِ، وَأَهْبَطَ إِلَى الأَرْضِ آدَمَ وَحَوَّاءَ وَإِبْلِيسَ وَالْحَيَّةَ.\nحَدَّثَنِي محمد بن عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى بن ميمون، عن ابن أبي نجيح، عن مجاهد، في قول الله عز وجل:\n\n«اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، قال: آدم وحواء وإبليس والحية","bs":"\u003cp data-paragraph=\"112.1\">vinom. Kada se opio, odvela ga je do drveta i jeo je s njega.’“ Kada su Adem i Havva počinili grijeh, Uzvišeni Allah izveo ih je iz Dženneta, oduzeo im blagodat i počast u kojima su bili i spustio njih dvoje, njihovog neprijatelja Iblisa i zmiju na Zemlju. Njihov Gospodar rekao im je: „Siđite; jedni drugima bit ćete neprijatelji.“\u003c/p>\u003cp data-paragraph=\"112.2\">Isto kao što smo mi o tome rekli govorili su učeni prethodnici.\u003c/p>\u003cp data-paragraph=\"112.3\">Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: pričao nam je Abdurrahman ibn Mehdi, od Israila, od Ismaila es-Suddija, koji je rekao: pričao mi je onaj ko je čuo Ibn Abbasa kako, o riječima: „Siđite; jedni drugima bit ćete neprijatelji“, govori: „Adem, Havva, Iblis i zmija.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: izraz se nalazi u El-Bekara, 2:36, i El-A‘raf, 7:24.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"112.4\">Pričali su nam Sufjan ibn Veki‘ i Musa ibn Harun; obojica su rekli: pričao nam je Amr ibn Hammad, od Esbata, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, o riječima: „Siđite; jedni drugima bit ćete neprijatelji.“ „Prokleo je zmiju, odsjekao joj noge, ostavio je da se kreće na trbuhu i dao joj da joj opskrba bude zemlja. Na Zemlju je spustio Adema, Havvu, Iblisa i zmiju.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:36, i El-A‘raf, 7:24, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"112.5\">Pričao mi je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa ibn Mejmun, od Ibn Ebu Nedžiha, od Mudžahida, o riječima Allaha, Silnog i Uzvišenog: „Siđite; jedni drugima bit ćete neprijatelji.“ Rekao je: „Adem, Havva, Iblis i zmija.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:36, i El-A‘raf, 7:24, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"112.1","ar":"الخمر حتى إذا سكر قادته إليها، فأكل منها فلما واقع آدم وحواء الخطيئة، أخرجهما الله تعالى من الجنه وسلبهما ما كانا فيه من النعمة والكرامة، وأهبطهما وعدوهما إبليس والحية إلى الأرض، فقال لهم ربهم: اهبطوا بعضكم لبعض عدو.","bs":"vinom. Kada se opio, odvela ga je do drveta i jeo je s njega.’“ Kada su Adem i Havva počinili grijeh, Uzvišeni Allah izveo ih je iz Dženneta, oduzeo im blagodat i počast u kojima su bili i spustio njih dvoje, njihovog neprijatelja Iblisa i zmiju na Zemlju. Njihov Gospodar rekao im je: „Siđite; jedni drugima bit ćete neprijatelji.“","ar_ranges":[],"ar_html":"الخمر حتى إذا سكر قادته إليها، فأكل منها فلما واقع آدم وحواء الخطيئة، أخرجهما الله تعالى من الجنه وسلبهما ما كانا فيه من النعمة والكرامة، وأهبطهما وعدوهما إبليس والحية إلى الأرض، فقال لهم ربهم: اهبطوا بعضكم لبعض عدو.","bs_ranges":[],"bs_html":"vinom. Kada se opio, odvela ga je do drveta i jeo je s njega.’“ Kada su Adem i Havva počinili grijeh, Uzvišeni Allah izveo ih je iz Dženneta, oduzeo im blagodat i počast u kojima su bili i spustio njih dvoje, njihovog neprijatelja Iblisa i zmiju na Zemlju. Njihov Gospodar rekao im je: „Siđite; jedni drugima bit ćete neprijatelji.“"},{"id":"112.2","ar":"وكالذي قلنا في ذلك قال السلف من أهل العلم.","bs":"Isto kao što smo mi o tome rekli govorili su učeni prethodnici.","ar_ranges":[],"ar_html":"وكالذي قلنا في ذلك قال السلف من أهل العلم.","bs_ranges":[],"bs_html":"Isto kao što smo mi o tome rekli govorili su učeni prethodnici."},{"id":"112.3","ar":"حَدَّثَنِي يُونُسُ، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: حَدَّثَنَا عَبْدُ الرحمن ابن مَهْدِيٍّ، عَنْ إِسْرَائِيلَ، عَنْ إِسْمَاعِيلَ السُّدِّيِّ، قَالَ: حَدَّثَنِي مَنْ سَمِعَ ابْنَ عَبَّاسٍ يَقُولُ: «اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، قَالَ: آدَمُ وَحَوَّاءُ وَإِبْلِيسُ وَالْحَيَّةُ.","bs":"Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: pričao nam je Abdurrahman ibn Mehdi, od Israila, od Ismaila es-Suddija, koji je rekao: pričao mi je onaj ko je čuo Ibn Abbasa kako, o riječima: „Siđite; jedni drugima bit ćete neprijatelji“, govori: „Adem, Havva, Iblis i zmija.“ ⟦Prijevod kur’anskog navoda: izraz se nalazi u El-Bekara, 2:36, i El-A‘raf, 7:24.⟧","ar_ranges":[[0,204]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي يُونُسُ، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: حَدَّثَنَا عَبْدُ الرحمن ابن مَهْدِيٍّ، عَنْ إِسْرَائِيلَ، عَنْ إِسْمَاعِيلَ السُّدِّيِّ، قَالَ: حَدَّثَنِي مَنْ سَمِعَ ابْنَ عَبَّاسٍ يَقُولُ: \u003c/span>«اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، قَالَ: آدَمُ وَحَوَّاءُ وَإِبْلِيسُ وَالْحَيَّةُ.","bs_ranges":[[0,211]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: pričao nam je Abdurrahman ibn Mehdi, od Israila, od Ismaila es-Suddija, koji je rekao: pričao mi je onaj ko je čuo Ibn Abbasa kako, \u003c/span>o riječima: „Siđite; jedni drugima bit ćete neprijatelji“, govori: „Adem, Havva, Iblis i zmija.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: izraz se nalazi u El-Bekara, 2:36, i El-A‘raf, 7:24.⟧\u003c/span>"},{"id":"112.4","ar":"حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، وَمُوسَى بْنُ هَارُونَ، قَالا: حَدَّثَنَا عمرو ابن حَمَّادٍ، عَنْ أَسْبَاطٍ، عَنِ السُّدِّيِّ- فِي خَبَرٍ ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابْنِ مَسْعُودٍ- وَعَنْ نَاسٍ مِنْ أَصْحَابِ رَسُولِ الله ص: «اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، فَلَعَنَ الْحَيَّةَ فَقَطَعَ قَوَائِمَهَا، وَتَرَكَهَا تَمْشِي عَلَى بَطْنِهَا، وَجَعَلَ رِزْقَهَا مِنَ التُّرَابِ، وَأَهْبَطَ إِلَى الأَرْضِ آدَمَ وَحَوَّاءَ وَإِبْلِيسَ وَالْحَيَّةَ.","bs":"Pričali su nam Sufjan ibn Veki‘ i Musa ibn Harun; obojica su rekli: pričao nam je Amr ibn Hammad, od Esbata, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, o riječima: „Siđite; jedni drugima bit ćete neprijatelji.“ „Prokleo je zmiju, odsjekao joj noge, ostavio je da se kreće na trbuhu i dao joj da joj opskrba bude zemlja. Na Zemlju je spustio Adema, Havvu, Iblisa i zmiju.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:36, i El-A‘raf, 7:24, navedeni dio.⟧","ar_ranges":[[0,268]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا سُفْيَانُ بْنُ وَكِيعٍ، وَمُوسَى بْنُ هَارُونَ، قَالا: حَدَّثَنَا عمرو ابن حَمَّادٍ، عَنْ أَسْبَاطٍ، عَنِ السُّدِّيِّ- فِي خَبَرٍ ذكره- عن أبي مالك وعن أبي صالح، عن ابن عباس- وعن مرة الهمداني، عن ابْنِ مَسْعُودٍ- وَعَنْ نَاسٍ مِنْ أَصْحَابِ رَسُولِ الله ص: \u003c/span>«اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، فَلَعَنَ الْحَيَّةَ فَقَطَعَ قَوَائِمَهَا، وَتَرَكَهَا تَمْشِي عَلَى بَطْنِهَا، وَجَعَلَ رِزْقَهَا مِنَ التُّرَابِ، وَأَهْبَطَ إِلَى الأَرْضِ آدَمَ وَحَوَّاءَ وَإِبْلِيسَ وَالْحَيَّةَ.","bs_ranges":[[0,305]],"bs_html":"\u003cspan class=\"isnad\">Pričali su nam Sufjan ibn Veki‘ i Musa ibn Harun; obojica su rekli: pričao nam je Amr ibn Hammad, od Esbata, od Suddija — u izvješću koje je naveo — od Ebu Malika i od Ebu Saliha, od Ibn Abbasa — i od Murre el-Hemdanija, od Ibn Mesuda — i od nekih ashaba Allahovog Poslanika, sallallahu alejhi ve sellem, \u003c/span>o riječima: „Siđite; jedni drugima bit ćete neprijatelji.“ „Prokleo je zmiju, odsjekao joj noge, ostavio je da se kreće na trbuhu i dao joj da joj opskrba bude zemlja. Na Zemlju je spustio Adema, Havvu, Iblisa i zmiju.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:36, i El-A‘raf, 7:24, navedeni dio.⟧\u003c/span>"},{"id":"112.5","ar":"حَدَّثَنِي محمد بن عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى بن ميمون، عن ابن أبي نجيح، عن مجاهد، في قول الله عز وجل:\n\n«اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، قال: آدم وحواء وإبليس والحية","bs":"Pričao mi je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa ibn Mejmun, od Ibn Ebu Nedžiha, od Mudžahida, o riječima Allaha, Silnog i Uzvišenog: „Siđite; jedni drugima bit ćete neprijatelji.“ Rekao je: „Adem, Havva, Iblis i zmija.“ ⟦Prijevod kur’anskog navoda: El-Bekara, 2:36, i El-A‘raf, 7:24, navedeni dio.⟧","ar_ranges":[[0,99]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي محمد بن عمرو، قال: حدثنا أبو عاصم، قال: حدثنا عيسى بن ميمون، عن ابن أبي نجيح، عن مجاهد، \u003c/span>في قول الله عز وجل:\n\n«اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ» ، قال: آدم وحواء وإبليس والحية","bs_ranges":[[0,149]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa ibn Mejmun, od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>o riječima Allaha, Silnog i Uzvišenog: „Siđite; jedni drugima bit ćete neprijatelji.“ Rekao je: „Adem, Havva, Iblis i zmija.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Bekara, 2:36, i El-A‘raf, 7:24, navedeni dio.⟧\u003c/span>"}],"notes":[]},{"n":113,"ar":"القول في قدر مكث آدم في الجنة ووقت خلق الله عز وجل إياه ووقت إهباطه إياه من السماء إلى الأرض\n\nقد تظاهرت الاخبار عن رسول الله ص بان الله عز وجل خلق آدم ع يوم الجمعة، وأنه أخرجه فيه من الجنة، وأهبطه إلى الأرض فيه، وأنه فيه تاب عليه، وفيه قبضه.\nذكر الأخبار عن رسول الله ص بذلك:\nحَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا عَلِيُّ بْنُ مَعْبَدٍ، قَالَ: حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ عَمْرٍو، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عن عمرو بن شرحبيل عن سَعِيدِ بْنِ سَعْدِ بْنِ عُبَادَةَ، عَنْ سَعْدِ بن عباده، [عن رسول الله ص، قَالَ: إِنَّ فِي الْجُمُعَةِ خَمْسَ خِلالٍ: فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُهْبِطَ إِلَى الأَرْضِ، وَفِيهِ تَوَفَّى اللَّهُ آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ الْعَبْدُ فِيهَا رَبَّهُ شَيْئًا إِلا أَعْطَاهُ اللَّهُ إِيَّاهُ، مَا لَمْ يَسْأَلْ إِثْمًا أَوْ قَطِيعَةً، وَفِيهِ: تَقُومُ السَّاعَةُ، وَمَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا جَبَلٍ وَلا أَرْضٍ وَلا رِيحٍ، إِلا مُشْفِقٌ مِنْ يَوْمِ الْجُمُعَةِ] .\nحَدَّثَنِي مُحَمَّدُ بْنُ بَشَّارٍ وَمُحَمَّدُ بْنُ مَعْمَرٍ، قَالا: حَدَّثَنَا أَبُو عَامِرٍ، حَدَّثَنَا زُهَيْرُ بْنُ مُحَمَّدٍ، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ يَزِيدَ الأَنْصَارِيِّ، عَنْ أَبِي لُبَابَةَ بْنِ عَبْدِ الْمُنْذِرِ، [أَنَّ النَّبِيَّ ص قَالَ: سَيِّدُ الأَيَّامِ يَوْمُ الْجُمُعَةِ، وَأَعْظَمُهَا وَأَعْظَمُ عِنْدَ اللَّهِ مِنْ يَوْمِ الْفِطْرِ وَيَوْمِ النَّحْرِ، وَفِيهِ خَمْسُ خِلالٍ: خَلَقَ اللَّهُ تَعَالَى فِيهِ آدَمَ، وَأَهْبَطَهُ فِيهِ إِلَى الأَرْضِ، وَفِيهِ تَوَفَّى اللَّهُ تَعَالَى آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ اللَّهَ الْعَبْدُ شَيْئًا إِلا أَعْطَاهُ إِيَّاهُ مَا لَمْ يَكُنْ حَرَامًا وَفِيهِ تَقُومُ السَّاعَةُ، مَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا أَرْضٍ وَلا جِبَالٍ وَلا رِيَاحٍ وَلا بَحْرٍ إِلا وَهُوَ مُشْفِقٌ مِنْ يَوْمِ الْجُمُعَةِ، أَنْ تَقُومَ فِيهِ السَّاعَةُ] .\nوَاللَّفْظُ لِحَدِيثِ ابْنِ بَشَّارٍ","bs":"\u003cp data-paragraph=\"113.1\">Rasprava o tome koliko je Adem boravio u Džennetu, kada ga je Allah, Silan i Uzvišen, stvorio i kada ga je s neba spustio na Zemlju\u003c/p>\u003cp data-paragraph=\"113.2\">Brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, međusobno se potvrđuju da je Allah, Silan i Uzvišen, stvorio Adema, alejhis-selam, u petak; da ga je toga dana izveo iz Dženneta i spustio na Zemlju; da mu je toga dana prihvatio pokajanje i toga dana uzeo njegov život.\u003c/p>\u003cp data-paragraph=\"113.3\">Spomen predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, o tome:\u003c/p>\u003cp data-paragraph=\"113.4\">Pričao mi je Abdurrahman ibn Abdullah ibn Abdulhakem, koji je rekao: pričao nam je Ali ibn Ma‘bed, koji je rekao: pričao nam je Ubejdullah ibn Amr, od Abdullaha ibn Muhammeda ibn Akila, od Amra ibn Šurahbila, od Seida ibn Sa‘da ibn Ubade, od Sa‘da ibn Ubade, od Allahovog Poslanika, sallallahu alejhi ve sellem, koji je rekao: „Petak ima pet svojstava: u njemu je stvoren Adem, u njemu je spušten na Zemlju, u njemu je Allah usmrtio Adema, u njemu postoji čas u kojem rob ne traži od svoga Gospodara ništa a da mu Allah to ne dadne, sve dok ne traži grijeh ili prekidanje veza; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni planine, ni zemlje, ni vjetra a da ne strepi od petka.“\u003c/p>\u003cp data-paragraph=\"113.5\">Pričali su mi Muhammed ibn Beššar i Muhammed ibn Ma‘mer; obojica su rekli: pričao nam je Ebu Amir: pričao nam je Zuhejr ibn Muhammed, od Abdullaha ibn Muhammeda ibn Akila, od Abdurrahmana ibn Jezida el-Ensarija, od Ebu Lubabe ibn Abdulmunzira, da je Vjerovjesnik, sallallahu alejhi ve sellem, rekao: „Prvak dana je petak i on je najveći među njima; kod Allaha je veći od dana Ramazanskog bajrama i dana klanja kurbana. Ima pet svojstava: Uzvišeni Allah u njemu je stvorio Adema, u njemu ga je spustio na Zemlju, u njemu je Uzvišeni Allah usmrtio Adema, u njemu postoji čas u kojem rob ništa ne traži od Allaha a da mu On to ne dadne, sve dok to nije zabranjeno; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni zemlje, ni planina, ni vjetrova, ni mora a da ne strepi od petka, da u njemu ne nastupi Čas.“\u003c/p>\u003cp data-paragraph=\"113.6\">Ovo je formulacija predaje Ibn Beššara.\u003c/p>","paragraphs":[{"id":"113.1","ar":"القول في قدر مكث آدم في الجنة ووقت خلق الله عز وجل إياه ووقت إهباطه إياه من السماء إلى الأرض","bs":"Rasprava o tome koliko je Adem boravio u Džennetu, kada ga je Allah, Silan i Uzvišen, stvorio i kada ga je s neba spustio na Zemlju","ar_ranges":[],"ar_html":"القول في قدر مكث آدم في الجنة ووقت خلق الله عز وجل إياه ووقت إهباطه إياه من السماء إلى الأرض","bs_ranges":[],"bs_html":"Rasprava o tome koliko je Adem boravio u Džennetu, kada ga je Allah, Silan i Uzvišen, stvorio i kada ga je s neba spustio na Zemlju"},{"id":"113.2","ar":"قد تظاهرت الاخبار عن رسول الله ص بان الله عز وجل خلق آدم ع يوم الجمعة، وأنه أخرجه فيه من الجنة، وأهبطه إلى الأرض فيه، وأنه فيه تاب عليه، وفيه قبضه.","bs":"Brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, međusobno se potvrđuju da je Allah, Silan i Uzvišen, stvorio Adema, alejhis-selam, u petak; da ga je toga dana izveo iz Dženneta i spustio na Zemlju; da mu je toga dana prihvatio pokajanje i toga dana uzeo njegov život.","ar_ranges":[],"ar_html":"قد تظاهرت الاخبار عن رسول الله ص بان الله عز وجل خلق آدم ع يوم الجمعة، وأنه أخرجه فيه من الجنة، وأهبطه إلى الأرض فيه، وأنه فيه تاب عليه، وفيه قبضه.","bs_ranges":[],"bs_html":"Brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, međusobno se potvrđuju da je Allah, Silan i Uzvišen, stvorio Adema, alejhis-selam, u petak; da ga je toga dana izveo iz Dženneta i spustio na Zemlju; da mu je toga dana prihvatio pokajanje i toga dana uzeo njegov život."},{"id":"113.3","ar":"ذكر الأخبار عن رسول الله ص بذلك:","bs":"Spomen predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, o tome:","ar_ranges":[],"ar_html":"ذكر الأخبار عن رسول الله ص بذلك:","bs_ranges":[],"bs_html":"Spomen predaja od Allahovog Poslanika, sallallahu alejhi ve sellem, o tome:"},{"id":"113.4","ar":"حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا عَلِيُّ بْنُ مَعْبَدٍ، قَالَ: حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ عَمْرٍو، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عن عمرو بن شرحبيل عن سَعِيدِ بْنِ سَعْدِ بْنِ عُبَادَةَ، عَنْ سَعْدِ بن عباده، [عن رسول الله ص، قَالَ: إِنَّ فِي الْجُمُعَةِ خَمْسَ خِلالٍ: فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُهْبِطَ إِلَى الأَرْضِ، وَفِيهِ تَوَفَّى اللَّهُ آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ الْعَبْدُ فِيهَا رَبَّهُ شَيْئًا إِلا أَعْطَاهُ اللَّهُ إِيَّاهُ، مَا لَمْ يَسْأَلْ إِثْمًا أَوْ قَطِيعَةً، وَفِيهِ: تَقُومُ السَّاعَةُ، وَمَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا جَبَلٍ وَلا أَرْضٍ وَلا رِيحٍ، إِلا مُشْفِقٌ مِنْ يَوْمِ الْجُمُعَةِ] .","bs":"Pričao mi je Abdurrahman ibn Abdullah ibn Abdulhakem, koji je rekao: pričao nam je Ali ibn Ma‘bed, koji je rekao: pričao nam je Ubejdullah ibn Amr, od Abdullaha ibn Muhammeda ibn Akila, od Amra ibn Šurahbila, od Seida ibn Sa‘da ibn Ubade, od Sa‘da ibn Ubade, od Allahovog Poslanika, sallallahu alejhi ve sellem, koji je rekao: „Petak ima pet svojstava: u njemu je stvoren Adem, u njemu je spušten na Zemlju, u njemu je Allah usmrtio Adema, u njemu postoji čas u kojem rob ne traži od svoga Gospodara ništa a da mu Allah to ne dadne, sve dok ne traži grijeh ili prekidanje veza; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni planine, ni zemlje, ni vjetra a da ne strepi od petka.“","ar_ranges":[[0,316]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا عَلِيُّ بْنُ مَعْبَدٍ، قَالَ: حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ عَمْرٍو، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عن عمرو بن شرحبيل عن سَعِيدِ بْنِ سَعْدِ بْنِ عُبَادَةَ، عَنْ سَعْدِ بن عباده، [عن رسول الله ص، قَالَ: \u003c/span>إِنَّ فِي الْجُمُعَةِ خَمْسَ خِلالٍ: فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُهْبِطَ إِلَى الأَرْضِ، وَفِيهِ تَوَفَّى اللَّهُ آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ الْعَبْدُ فِيهَا رَبَّهُ شَيْئًا إِلا أَعْطَاهُ اللَّهُ إِيَّاهُ، مَا لَمْ يَسْأَلْ إِثْمًا أَوْ قَطِيعَةً، وَفِيهِ: تَقُومُ السَّاعَةُ، وَمَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا جَبَلٍ وَلا أَرْضٍ وَلا رِيحٍ، إِلا مُشْفِقٌ مِنْ يَوْمِ الْجُمُعَةِ] .","bs_ranges":[[0,327]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Abdurrahman ibn Abdullah ibn Abdulhakem, koji je rekao: pričao nam je Ali ibn Ma‘bed, koji je rekao: pričao nam je Ubejdullah ibn Amr, od Abdullaha ibn Muhammeda ibn Akila, od Amra ibn Šurahbila, od Seida ibn Sa‘da ibn Ubade, od Sa‘da ibn Ubade, od Allahovog Poslanika, sallallahu alejhi ve sellem, koji je rekao: \u003c/span>„Petak ima pet svojstava: u njemu je stvoren Adem, u njemu je spušten na Zemlju, u njemu je Allah usmrtio Adema, u njemu postoji čas u kojem rob ne traži od svoga Gospodara ništa a da mu Allah to ne dadne, sve dok ne traži grijeh ili prekidanje veza; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni planine, ni zemlje, ni vjetra a da ne strepi od petka.“"},{"id":"113.5","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ بَشَّارٍ وَمُحَمَّدُ بْنُ مَعْمَرٍ، قَالا: حَدَّثَنَا أَبُو عَامِرٍ، حَدَّثَنَا زُهَيْرُ بْنُ مُحَمَّدٍ، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ يَزِيدَ الأَنْصَارِيِّ، عَنْ أَبِي لُبَابَةَ بْنِ عَبْدِ الْمُنْذِرِ، [أَنَّ النَّبِيَّ ص قَالَ: سَيِّدُ الأَيَّامِ يَوْمُ الْجُمُعَةِ، وَأَعْظَمُهَا وَأَعْظَمُ عِنْدَ اللَّهِ مِنْ يَوْمِ الْفِطْرِ وَيَوْمِ النَّحْرِ، وَفِيهِ خَمْسُ خِلالٍ: خَلَقَ اللَّهُ تَعَالَى فِيهِ آدَمَ، وَأَهْبَطَهُ فِيهِ إِلَى الأَرْضِ، وَفِيهِ تَوَفَّى اللَّهُ تَعَالَى آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ اللَّهَ الْعَبْدُ شَيْئًا إِلا أَعْطَاهُ إِيَّاهُ مَا لَمْ يَكُنْ حَرَامًا وَفِيهِ تَقُومُ السَّاعَةُ، مَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا أَرْضٍ وَلا جِبَالٍ وَلا رِيَاحٍ وَلا بَحْرٍ إِلا وَهُوَ مُشْفِقٌ مِنْ يَوْمِ الْجُمُعَةِ، أَنْ تَقُومَ فِيهِ السَّاعَةُ] .","bs":"Pričali su mi Muhammed ibn Beššar i Muhammed ibn Ma‘mer; obojica su rekli: pričao nam je Ebu Amir: pričao nam je Zuhejr ibn Muhammed, od Abdullaha ibn Muhammeda ibn Akila, od Abdurrahmana ibn Jezida el-Ensarija, od Ebu Lubabe ibn Abdulmunzira, da je Vjerovjesnik, sallallahu alejhi ve sellem, rekao: „Prvak dana je petak i on je najveći među njima; kod Allaha je veći od dana Ramazanskog bajrama i dana klanja kurbana. Ima pet svojstava: Uzvišeni Allah u njemu je stvorio Adema, u njemu ga je spustio na Zemlju, u njemu je Uzvišeni Allah usmrtio Adema, u njemu postoji čas u kojem rob ništa ne traži od Allaha a da mu On to ne dadne, sve dok to nije zabranjeno; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni zemlje, ni planina, ni vjetrova, ni mora a da ne strepi od petka, da u njemu ne nastupi Čas.“","ar_ranges":[[0,281]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي مُحَمَّدُ بْنُ بَشَّارٍ وَمُحَمَّدُ بْنُ مَعْمَرٍ، قَالا: حَدَّثَنَا أَبُو عَامِرٍ، حَدَّثَنَا زُهَيْرُ بْنُ مُحَمَّدٍ، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ يَزِيدَ الأَنْصَارِيِّ، عَنْ أَبِي لُبَابَةَ بْنِ عَبْدِ الْمُنْذِرِ، [\u003c/span>أَنَّ النَّبِيَّ ص قَالَ: سَيِّدُ الأَيَّامِ يَوْمُ الْجُمُعَةِ، وَأَعْظَمُهَا وَأَعْظَمُ عِنْدَ اللَّهِ مِنْ يَوْمِ الْفِطْرِ وَيَوْمِ النَّحْرِ، وَفِيهِ خَمْسُ خِلالٍ: خَلَقَ اللَّهُ تَعَالَى فِيهِ آدَمَ، وَأَهْبَطَهُ فِيهِ إِلَى الأَرْضِ، وَفِيهِ تَوَفَّى اللَّهُ تَعَالَى آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ اللَّهَ الْعَبْدُ شَيْئًا إِلا أَعْطَاهُ إِيَّاهُ مَا لَمْ يَكُنْ حَرَامًا وَفِيهِ تَقُومُ السَّاعَةُ، مَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا أَرْضٍ وَلا جِبَالٍ وَلا رِيَاحٍ وَلا بَحْرٍ إِلا وَهُوَ مُشْفِقٌ مِنْ يَوْمِ الْجُمُعَةِ، أَنْ تَقُومَ فِيهِ السَّاعَةُ] .","bs_ranges":[[0,244]],"bs_html":"\u003cspan class=\"isnad\">Pričali su mi Muhammed ibn Beššar i Muhammed ibn Ma‘mer; obojica su rekli: pričao nam je Ebu Amir: pričao nam je Zuhejr ibn Muhammed, od Abdullaha ibn Muhammeda ibn Akila, od Abdurrahmana ibn Jezida el-Ensarija, od Ebu Lubabe ibn Abdulmunzira, \u003c/span>da je Vjerovjesnik, sallallahu alejhi ve sellem, rekao: „Prvak dana je petak i on je najveći među njima; kod Allaha je veći od dana Ramazanskog bajrama i dana klanja kurbana. Ima pet svojstava: Uzvišeni Allah u njemu je stvorio Adema, u njemu ga je spustio na Zemlju, u njemu je Uzvišeni Allah usmrtio Adema, u njemu postoji čas u kojem rob ništa ne traži od Allaha a da mu On to ne dadne, sve dok to nije zabranjeno; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni zemlje, ni planina, ni vjetrova, ni mora a da ne strepi od petka, da u njemu ne nastupi Čas.“"},{"id":"113.6","ar":"وَاللَّفْظُ لِحَدِيثِ ابْنِ بَشَّارٍ","bs":"Ovo je formulacija predaje Ibn Beššara.","ar_ranges":[],"ar_html":"وَاللَّفْظُ لِحَدِيثِ ابْنِ بَشَّارٍ","bs_ranges":[],"bs_html":"Ovo je formulacija predaje Ibn Beššara."}],"notes":[]},{"n":114,"ar":"حَدَّثَنَا مُحَمَّدُ بْنُ مَعْمَرٍ، قَالَ: حَدَّثَنَا أَبُو عامر، قال: حدثنا زهير ابن مُحَمَّدٍ، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عَنْ عَمْرِو بْنِ شُرَحْبِيلَ بْنِ سَعِيدِ بْنِ سَعْدِ بْنِ عُبَادَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنْ سَعْدِ بْنِ عُبَادَةَ، [أَنَّ رَجُلا اتى النبي ص، فَقَالَ: يَا رَسُولَ اللَّهِ، أَخْبِرْنَا عَنْ يَوْمِ الْجُمُعَةِ، مَاذَا فِيهِ مِنَ الْخَيْرِ؟ فَقَالَ: فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُهْبِطَ آدَمُ، وَفِيهِ تَوَفَّى آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ الْعَبْدُ فِيهَا شَيْئًا إِلا أَعْطَاهُ اللَّهُ إِيَّاهُ، مَا لَمْ يَسْأَلْ مَأْثَمًا أَوْ قَطِيعَةً، وَفِيهِ تَقُومُ السَّاعَةُ، مَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا أَرْضٍ وَلا جِبَالٍ وَلا رِيحٍ إِلا هُنَّ يُشْفِقْنَ مِنْ يَوْمِ الْجُمُعَةِ] .\nحَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا أَبُو زُرْعَةَ، قَالَ: أَخْبَرَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، عَنْ عَبْدِ الرَّحْمَنِ الأَعْرَجِ، أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ يَقُولُ: [قَالَ رَسُولُ اللَّهِ ص: خَيْرُ يَوْمٍ طَلَعَتِ الشَّمْسُ عَلَيْهِ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُدْخِلَ الْجَنَّةُ وَأُخْرِجَ مِنْهَا] .\nحَدَّثَنِي بَحْرُ بْنُ نَصْرٍ، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: أَخْبَرَنِي ابْنُ أَبِي الزِّنَادِ، عَنْ أَبِيهِ، عَنْ مُوسَى بْنِ أَبِي عُثْمَانَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رَسُولُ اللَّهِ ص: سَيِّدُ الأَيَّامِ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُدْخِلَ الْجَنَّةَ، وَفِيهِ أُخْرِجَ مِنْهَا، وَلا تَقُومُ السَّاعَةُ إِلا يَوْمَ الْجُمَعَةِ] .\nحَدَّثَنَا الرَّبِيعُ بْنُ سُلَيْمَانَ، قَالَ: حَدَّثَنَا شُعَيْبُ بْنُ اللَّيْثِ، قَالَ: حَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ جَعْفَرِ بْنِ رَبِيعَةَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ هُرْمُزَ، أَنَّهُ قَالَ: سَمِعْتُ أَبَا هُرَيْرَةَ يَقُولُ: [قَالَ رسول الله ص: لَمْ تَطْلُعِ الشَّمْسُ عَلَى يَوْمٍ مِثْلَ يَوْمِ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُخْرِجَ مِنَ الْجَنَّةِ، وَفِيهِ أُعِيدَ فِيهَا] .\nحَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا جَرِيرٌ، عَنْ مَنْصُورٍ وَمُغِيرَةُ، عَنْ زِيَادِ بْنِ كُلَيْبٍ أَبِي مَعْشَرٍ، عَنْ إِبْرَاهِيمَ، عَنِ الْقَرْثَعِ الضَّبِّيِّ- وَكَانَ الْقَرْثَعُ","bs":"\u003cp data-paragraph=\"114.1\">Pričao nam je Muhammed ibn Ma‘mer, koji je rekao: pričao nam je Ebu Amir, koji je rekao: pričao nam je Zuhejr ibn Muhammed, od Abdullaha ibn Muhammeda ibn Akila, od Amra ibn Šurahbila ibn Seida ibn Sa‘da ibn Ubade, od njegovog oca, od njegovog djeda, od Sa‘da ibn Ubade, da je neki čovjek došao Vjerovjesniku, sallallahu alejhi ve sellem, i rekao: „Allahov Poslaniče, obavijesti nas o petku: kakvo dobro ima u njemu?“ Odgovorio je: „U njemu je stvoren Adem, u njemu je Adem spušten, u njemu je usmrtio Adema, u njemu postoji čas u kojem rob ništa ne zatraži a da mu Allah to ne dadne, sve dok ne traži grijeh ili prekidanje veza; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni zemlje, ni planina, ni vjetra a da ne strepe od petka.“\u003c/p>\u003cp data-paragraph=\"114.2\">Pričao mi je Abdurrahman ibn Abdullah ibn Abdulhakem, koji je rekao: pričao nam je Ebu Zur‘a, koji je rekao: obavijestio me Junus, od Ibn Šihaba, od Abdurrahmana el-A‘redža, da je čuo Ebu Hurejru kako govori: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Najbolji dan nad kojim je Sunce izašlo jeste petak. U njemu je stvoren Adem i u njemu je uveden u Džennet i izveden iz njega.’“\u003c/p>\u003cp data-paragraph=\"114.3\">Pričao mi je Bahr ibn Nasr, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: obavijestio me Ibn Ebu Zinad, od svoga oca, od Muse ibn Ebu Osmana, od Ebu Hurejre, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Prvak dana je petak. U njemu je stvoren Adem, u njemu je uveden u Džennet, u njemu je izveden iz njega, a Čas će nastupiti samo u petak.’“\u003c/p>\u003cp data-paragraph=\"114.4\">Pričao nam je Rebi‘ ibn Sulejman, koji je rekao: pričao nam je Šuajb ibn el-Lejs, koji je rekao: pričao nam je Lejs ibn Sa‘d, od Džafera ibn Rebie, od Abdurrahmana ibn Hurmuza, da je rekao: čuo sam Ebu Hurejru kako govori: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Sunce nije izašlo nad danom poput petka. U njemu je stvoren Adem, u njemu je izveden iz Dženneta i u njemu je vraćen u njega.’“\u003c/p>\u003cp data-paragraph=\"114.5\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Džerir, od Mensura i Mugire, od Zijada ibn Kulejba Ebu Ma‘šera, od Ibrahima, od Karsea ed-Dabbija — a Karse je bio\u003c/p>","paragraphs":[{"id":"114.1","ar":"حَدَّثَنَا مُحَمَّدُ بْنُ مَعْمَرٍ، قَالَ: حَدَّثَنَا أَبُو عامر، قال: حدثنا زهير ابن مُحَمَّدٍ، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عَنْ عَمْرِو بْنِ شُرَحْبِيلَ بْنِ سَعِيدِ بْنِ سَعْدِ بْنِ عُبَادَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنْ سَعْدِ بْنِ عُبَادَةَ، [أَنَّ رَجُلا اتى النبي ص، فَقَالَ: يَا رَسُولَ اللَّهِ، أَخْبِرْنَا عَنْ يَوْمِ الْجُمُعَةِ، مَاذَا فِيهِ مِنَ الْخَيْرِ؟ فَقَالَ: فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُهْبِطَ آدَمُ، وَفِيهِ تَوَفَّى آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ الْعَبْدُ فِيهَا شَيْئًا إِلا أَعْطَاهُ اللَّهُ إِيَّاهُ، مَا لَمْ يَسْأَلْ مَأْثَمًا أَوْ قَطِيعَةً، وَفِيهِ تَقُومُ السَّاعَةُ، مَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا أَرْضٍ وَلا جِبَالٍ وَلا رِيحٍ إِلا هُنَّ يُشْفِقْنَ مِنْ يَوْمِ الْجُمُعَةِ] .","bs":"Pričao nam je Muhammed ibn Ma‘mer, koji je rekao: pričao nam je Ebu Amir, koji je rekao: pričao nam je Zuhejr ibn Muhammed, od Abdullaha ibn Muhammeda ibn Akila, od Amra ibn Šurahbila ibn Seida ibn Sa‘da ibn Ubade, od njegovog oca, od njegovog djeda, od Sa‘da ibn Ubade, da je neki čovjek došao Vjerovjesniku, sallallahu alejhi ve sellem, i rekao: „Allahov Poslaniče, obavijesti nas o petku: kakvo dobro ima u njemu?“ Odgovorio je: „U njemu je stvoren Adem, u njemu je Adem spušten, u njemu je usmrtio Adema, u njemu postoji čas u kojem rob ništa ne zatraži a da mu Allah to ne dadne, sve dok ne traži grijeh ili prekidanje veza; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni zemlje, ni planina, ni vjetra a da ne strepe od petka.“","ar_ranges":[[0,310]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ مَعْمَرٍ، قَالَ: حَدَّثَنَا أَبُو عامر، قال: حدثنا زهير ابن مُحَمَّدٍ، عَنْ عَبْدِ اللَّهِ بْنِ مُحَمَّدِ بْنِ عُقَيْلٍ، عَنْ عَمْرِو بْنِ شُرَحْبِيلَ بْنِ سَعِيدِ بْنِ سَعْدِ بْنِ عُبَادَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَنْ سَعْدِ بْنِ عُبَادَةَ، [أَنَّ رَجُلا اتى النبي ص، فَقَالَ: \u003c/span>يَا رَسُولَ اللَّهِ، أَخْبِرْنَا عَنْ يَوْمِ الْجُمُعَةِ، مَاذَا فِيهِ مِنَ الْخَيْرِ؟ فَقَالَ: فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُهْبِطَ آدَمُ، وَفِيهِ تَوَفَّى آدَمَ، وَفِيهِ سَاعَةٌ لا يَسْأَلُ الْعَبْدُ فِيهَا شَيْئًا إِلا أَعْطَاهُ اللَّهُ إِيَّاهُ، مَا لَمْ يَسْأَلْ مَأْثَمًا أَوْ قَطِيعَةً، وَفِيهِ تَقُومُ السَّاعَةُ، مَا مِنْ مَلَكٍ مُقَرَّبٍ وَلا سَمَاءٍ وَلا أَرْضٍ وَلا جِبَالٍ وَلا رِيحٍ إِلا هُنَّ يُشْفِقْنَ مِنْ يَوْمِ الْجُمُعَةِ] .","bs_ranges":[[0,271]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Ma‘mer, koji je rekao: pričao nam je Ebu Amir, koji je rekao: pričao nam je Zuhejr ibn Muhammed, od Abdullaha ibn Muhammeda ibn Akila, od Amra ibn Šurahbila ibn Seida ibn Sa‘da ibn Ubade, od njegovog oca, od njegovog djeda, od Sa‘da ibn Ubade, \u003c/span>da je neki čovjek došao Vjerovjesniku, sallallahu alejhi ve sellem, i rekao: „Allahov Poslaniče, obavijesti nas o petku: kakvo dobro ima u njemu?“ Odgovorio je: „U njemu je stvoren Adem, u njemu je Adem spušten, u njemu je usmrtio Adema, u njemu postoji čas u kojem rob ništa ne zatraži a da mu Allah to ne dadne, sve dok ne traži grijeh ili prekidanje veza; i u njemu će nastupiti Čas. Nema ni bliskog meleka, ni neba, ni zemlje, ni planina, ni vjetra a da ne strepe od petka.“"},{"id":"114.2","ar":"حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا أَبُو زُرْعَةَ، قَالَ: أَخْبَرَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، عَنْ عَبْدِ الرَّحْمَنِ الأَعْرَجِ، أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ يَقُولُ: [قَالَ رَسُولُ اللَّهِ ص: خَيْرُ يَوْمٍ طَلَعَتِ الشَّمْسُ عَلَيْهِ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُدْخِلَ الْجَنَّةُ وَأُخْرِجَ مِنْهَا] .","bs":"Pričao mi je Abdurrahman ibn Abdullah ibn Abdulhakem, koji je rekao: pričao nam je Ebu Zur‘a, koji je rekao: obavijestio me Junus, od Ibn Šihaba, od Abdurrahmana el-A‘redža, da je čuo Ebu Hurejru kako govori: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Najbolji dan nad kojim je Sunce izašlo jeste petak. U njemu je stvoren Adem i u njemu je uveden u Džennet i izveden iz njega.’“","ar_ranges":[[0,258]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ عَبْدِ الْحَكَمِ، قَالَ: حَدَّثَنَا أَبُو زُرْعَةَ، قَالَ: أَخْبَرَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، عَنْ عَبْدِ الرَّحْمَنِ الأَعْرَجِ، أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ يَقُولُ: [قَالَ رَسُولُ اللَّهِ ص: \u003c/span>خَيْرُ يَوْمٍ طَلَعَتِ الشَّمْسُ عَلَيْهِ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُدْخِلَ الْجَنَّةُ وَأُخْرِجَ مِنْهَا] .","bs_ranges":[[0,209]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Abdurrahman ibn Abdullah ibn Abdulhakem, koji je rekao: pričao nam je Ebu Zur‘a, koji je rekao: obavijestio me Junus, od Ibn Šihaba, od Abdurrahmana el-A‘redža, da je čuo Ebu Hurejru kako govori: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Najbolji dan nad kojim je Sunce izašlo jeste petak. U njemu je stvoren Adem i u njemu je uveden u Džennet i izveden iz njega.’“"},{"id":"114.3","ar":"حَدَّثَنِي بَحْرُ بْنُ نَصْرٍ، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: أَخْبَرَنِي ابْنُ أَبِي الزِّنَادِ، عَنْ أَبِيهِ، عَنْ مُوسَى بْنِ أَبِي عُثْمَانَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رَسُولُ اللَّهِ ص: سَيِّدُ الأَيَّامِ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُدْخِلَ الْجَنَّةَ، وَفِيهِ أُخْرِجَ مِنْهَا، وَلا تَقُومُ السَّاعَةُ إِلا يَوْمَ الْجُمَعَةِ] .","bs":"Pričao mi je Bahr ibn Nasr, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: obavijestio me Ibn Ebu Zinad, od svoga oca, od Muse ibn Ebu Osmana, od Ebu Hurejre, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Prvak dana je petak. U njemu je stvoren Adem, u njemu je uveden u Džennet, u njemu je izveden iz njega, a Čas će nastupiti samo u petak.’“","ar_ranges":[[0,211]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي بَحْرُ بْنُ نَصْرٍ، قَالَ: أَخْبَرَنَا ابْنُ وَهْبٍ، قَالَ: أَخْبَرَنِي ابْنُ أَبِي الزِّنَادِ، عَنْ أَبِيهِ، عَنْ مُوسَى بْنِ أَبِي عُثْمَانَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رَسُولُ اللَّهِ ص: \u003c/span>سَيِّدُ الأَيَّامِ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُدْخِلَ الْجَنَّةَ، وَفِيهِ أُخْرِجَ مِنْهَا، وَلا تَقُومُ السَّاعَةُ إِلا يَوْمَ الْجُمَعَةِ] .","bs_ranges":[[0,186]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Bahr ibn Nasr, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: obavijestio me Ibn Ebu Zinad, od svoga oca, od Muse ibn Ebu Osmana, od Ebu Hurejre, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Prvak dana je petak. U njemu je stvoren Adem, u njemu je uveden u Džennet, u njemu je izveden iz njega, a Čas će nastupiti samo u petak.’“"},{"id":"114.4","ar":"حَدَّثَنَا الرَّبِيعُ بْنُ سُلَيْمَانَ، قَالَ: حَدَّثَنَا شُعَيْبُ بْنُ اللَّيْثِ، قَالَ: حَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ جَعْفَرِ بْنِ رَبِيعَةَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ هُرْمُزَ، أَنَّهُ قَالَ: سَمِعْتُ أَبَا هُرَيْرَةَ يَقُولُ: [قَالَ رسول الله ص: لَمْ تَطْلُعِ الشَّمْسُ عَلَى يَوْمٍ مِثْلَ يَوْمِ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُخْرِجَ مِنَ الْجَنَّةِ، وَفِيهِ أُعِيدَ فِيهَا] .","bs":"Pričao nam je Rebi‘ ibn Sulejman, koji je rekao: pričao nam je Šuajb ibn el-Lejs, koji je rekao: pričao nam je Lejs ibn Sa‘d, od Džafera ibn Rebie, od Abdurrahmana ibn Hurmuza, da je rekao: čuo sam Ebu Hurejru kako govori: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Sunce nije izašlo nad danom poput petka. U njemu je stvoren Adem, u njemu je izveden iz Dženneta i u njemu je vraćen u njega.’“","ar_ranges":[[0,193]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا الرَّبِيعُ بْنُ سُلَيْمَانَ، قَالَ: حَدَّثَنَا شُعَيْبُ بْنُ اللَّيْثِ، قَالَ: حَدَّثَنَا اللَّيْثُ بْنُ سَعْدٍ، عَنْ جَعْفَرِ بْنِ رَبِيعَةَ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ هُرْمُزَ، \u003c/span>أَنَّهُ قَالَ: سَمِعْتُ أَبَا هُرَيْرَةَ يَقُولُ: [قَالَ رسول الله ص: لَمْ تَطْلُعِ الشَّمْسُ عَلَى يَوْمٍ مِثْلَ يَوْمِ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُخْرِجَ مِنَ الْجَنَّةِ، وَفِيهِ أُعِيدَ فِيهَا] .","bs_ranges":[[0,223]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Rebi‘ ibn Sulejman, koji je rekao: pričao nam je Šuajb ibn el-Lejs, koji je rekao: pričao nam je Lejs ibn Sa‘d, od Džafera ibn Rebie, od Abdurrahmana ibn Hurmuza, da je rekao: čuo sam Ebu Hurejru kako govori: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Sunce nije izašlo nad danom poput petka. U njemu je stvoren Adem, u njemu je izveden iz Dženneta i u njemu je vraćen u njega.’“"},{"id":"114.5","ar":"حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا جَرِيرٌ، عَنْ مَنْصُورٍ وَمُغِيرَةُ، عَنْ زِيَادِ بْنِ كُلَيْبٍ أَبِي مَعْشَرٍ، عَنْ إِبْرَاهِيمَ، عَنِ الْقَرْثَعِ الضَّبِّيِّ- وَكَانَ الْقَرْثَعُ","bs":"Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Džerir, od Mensura i Mugire, od Zijada ibn Kulejba Ebu Ma‘šera, od Ibrahima, od Karsea ed-Dabbija — a Karse je bio","ar_ranges":[[0,193]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا ابْنُ حُمَيْدٍ، قَالَ: حَدَّثَنَا جَرِيرٌ، عَنْ مَنْصُورٍ وَمُغِيرَةُ، عَنْ زِيَادِ بْنِ كُلَيْبٍ أَبِي مَعْشَرٍ، عَنْ إِبْرَاهِيمَ، عَنِ الْقَرْثَعِ الضَّبِّيِّ- وَكَانَ الْقَرْثَعُ\u003c/span>","bs_ranges":[[0,169]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Džerir, od Mensura i Mugire, od Zijada ibn Kulejba Ebu Ma‘šera, od Ibrahima, od Karsea ed-Dabbija — a Karse je bio\u003c/span>"}],"notes":[]},{"n":115,"ar":"مِنَ الْقُرَّاءِ الأَوَّلِينَ- قَالَ: [قَالَ سَلْمَانُ: قَالَ لي رسول الله ص:\n\nيَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ قُلْتُ: اللَّهُ وَرَسُولُهُ أَعْلَمُ، يَقُولُهَا ثَلاثًا:\nيَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ فِيهِ جُمِّعَ أَبُوكَ، أَوْ أَبُوكُمْ] .\n\nحَدَّثَنِي مُحَمَّدُ بْنُ عُمَارَةَ الأَسَدِيُّ، قَالَ: حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى قَالَ: أَخْبَرَنَا شَيْبَانُ، عَنْ يَحْيَى، عَنْ أَبِي سَلَمَةَ، أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ يُحَدِّثُ أَنَّهُ سَمِعَ كَعْبًا يَقُولُ: خَيْرُ يَوْمٍ طَلَعَتْ فِيهِ الشَّمْسُ يوم الجمعه، فيه خلق آدم ع، وَفِيهِ دَخَلَ الْجَنَّةَ، وَفِيهِ أُخْرِجَ مِنْهَا، وَفِيهِ تَقُومُ السَّاعَةُ.\nحَدَّثَنِي الْحُسَيْنُ بْنُ يَزِيدَ الآدَمِيُّ، قَالَ: حَدَّثَنَا روح بن عبادة، قَالَ: حَدَّثَنَا زكرياء بن إسحاق، عن عمرو بن دينار، عَنْ عُبَيْدِ بْنِ عُمَيْرٍ، قَالَ: إِنَّ أَوَّلَ يَوْمٍ طَلَعَتْ فِيهِ شَمْسُهُ يَوْمُ الْجُمُعَةِ، وَهُوَ أَفْضَلُ الأَيَّامِ: فِيهِ خَلَقَ اللَّهُ تَعَالَى ذِكْرُهُ آدَمَ، خَلَقَهُ عَلَى مِثْلِ صُورَتِهِ، فَلَمَّا فَرَغَ عَطَسَ آدَمُ فَأَلْقَى اللَّهُ تعالى عَلَيْهِ الْحَمْدَ، فَقَالَ اللَّهُ: يَرْحَمُكَ رَبُّكَ.\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا إِسْحَاقُ بْنُ مَنْصُورٍ، عَنْ أَبِي كُدَيْنَةَ، عَنْ مُغِيرَةَ، عَنْ زِيَادٍ، عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، عَنِ الْقَرْثَعِ، [عَنْ سَلْمَانَ، قَالَ: قال رسول الله ص: أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟\n\nهُوَ يَوْمٌ جُمِّعَ فيه ابوك، او أبوكم آدم ع] .\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا عُثْمَانُ بْنُ سَعِيدٍ، عَنْ أَبِي الأَحْوَصِ، عَنْ مُغِيرَةَ، عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، قَالَ: [قَالَ سَلْمَانُ قَالَ لي رسول الله ص: يَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ مَرَّتَيْنِ أَوْ ثَلاثًا، قَالَ: هُوَ الْيَوْمُ الَّذِي جُمِّعَ فِيهِ أَبُوكُمْ آدَمُ، أَوْ جُمِّعَ فِيهِ أَبُوكُمْ] .\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا حَسَنُ بْنُ عَطِيَّةَ، قَالَ: حَدَّثَنَا قَيْسٌ، عَنِ الأَعْمَشِ، عَنْ إِبْرَاهِيمَ عَنِ الْقَرْثَعِ، [عَنْ سَلْمَانَ، قَالَ: قَالَ","bs":"\u003cp data-paragraph=\"115.1\">jedan od prvih učača Kur’ana — koji je rekao: „Selman je rekao: ‘Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: Selmane, znaš li šta je petak? Odgovorio sam: Allah i Njegov Poslanik najbolje znaju.’ To je izgovorio tri puta: ‘Selmane, znaš li šta je petak? U njemu je sastavljen tvoj otac — ili vaš otac.’“\u003c/p>\u003cp data-paragraph=\"115.2\">Pričao mi je Muhammed ibn Umara el-Esedi, koji je rekao: pričao nam je Ubejdullah ibn Musa, koji je rekao: obavijestio nas je Šejban, od Jahjaa, od Ebu Seleme, da je čuo Ebu Hurejru kako kazuje da je čuo Ka‘ba kako govori: „Najbolji dan u kojem je Sunce izašlo jeste petak. U njemu je stvoren Adem, alejhis-selam, u njemu je ušao u Džennet, u njemu je izveden iz njega i u njemu će nastupiti Čas.“\u003c/p>\u003cp data-paragraph=\"115.3\">Pričao mi je Husejn ibn Jezid el-Ademi, koji je rekao: pričao nam je Revh ibn Ubada, koji je rekao: pričao nam je Zekerijja ibn Ishak, od Amra ibn Dinara, od Ubejda ibn Umejra, koji je rekao: „Prvi dan u kojem je Sunce izašlo bio je petak, a on je najbolji dan. U njemu je Allah, Uzvišen je spomen Njegov, stvorio Adema; stvorio ga je nalik njegovom liku. Kada je dovršio, Adem je kihnuo, pa mu je Uzvišeni Allah nadahnuo hvalu. Allah je rekao: ‘Smilovao ti se tvoj Gospodar.’“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u izrazu خلقه على مثل صورته nije izričito navedeno na koga se odnosi zamjenica „njegovom“; taj odnos nije ovdje razriješen dodavanjem tumačenja.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"115.4\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Ishak ibn Mensur, od Ebu Kudejne, od Mugire, od Zijada, od Ibrahima, od Alkame, od Karsea, od Selmana, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Znaš li šta je petak? To je dan u kojem je sastavljen tvoj otac — ili vaš otac — Adem, alejhis-selam.’“\u003c/p>\u003cp data-paragraph=\"115.5\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Osman ibn Seid, od Ebu Ahvesa, od Mugire, od Ibrahima, od Alkame, koji je rekao: „Selman je rekao: ‘Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: Selmane, znaš li šta je petak? — dva ili tri puta.’“ Rekao je: „To je dan u kojem je sastavljen vaš otac Adem — ili: u kojem je sastavljen vaš otac.“\u003c/p>\u003cp data-paragraph=\"115.6\">Pričao nam je Ebu Kurejb, koji je rekao: pričao nam je Hasen ibn Atijja, koji je rekao: pričao nam je Kajs, od A‘meša, od Ibrahima, od Karsea, od Selmana, koji je rekao: „Rekao je\u003c/p>","paragraphs":[{"id":"115.1","ar":"مِنَ الْقُرَّاءِ الأَوَّلِينَ- قَالَ: [قَالَ سَلْمَانُ: قَالَ لي رسول الله ص:\n\nيَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ قُلْتُ: اللَّهُ وَرَسُولُهُ أَعْلَمُ، يَقُولُهَا ثَلاثًا:\nيَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ فِيهِ جُمِّعَ أَبُوكَ، أَوْ أَبُوكُمْ] .","bs":"jedan od prvih učača Kur’ana — koji je rekao: „Selman je rekao: ‘Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: Selmane, znaš li šta je petak? Odgovorio sam: Allah i Njegov Poslanik najbolje znaju.’ To je izgovorio tri puta: ‘Selmane, znaš li šta je petak? U njemu je sastavljen tvoj otac — ili vaš otac.’“","ar_ranges":[[0,38]],"ar_html":"\u003cspan class=\"isnad\">مِنَ الْقُرَّاءِ الأَوَّلِينَ- قَالَ: \u003c/span>[قَالَ سَلْمَانُ: قَالَ لي رسول الله ص:\n\nيَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ قُلْتُ: اللَّهُ وَرَسُولُهُ أَعْلَمُ، يَقُولُهَا ثَلاثًا:\nيَا سَلْمَانُ، أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ فِيهِ جُمِّعَ أَبُوكَ، أَوْ أَبُوكُمْ] .","bs_ranges":[[0,46]],"bs_html":"\u003cspan class=\"isnad\">jedan od prvih učača Kur’ana — koji je rekao: \u003c/span>„Selman je rekao: ‘Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: Selmane, znaš li šta je petak? Odgovorio sam: Allah i Njegov Poslanik najbolje znaju.’ To je izgovorio tri puta: ‘Selmane, znaš li šta je petak? U njemu je sastavljen tvoj otac — ili vaš otac.’“"},{"id":"115.2","ar":"حَدَّثَنِي مُحَمَّدُ بْنُ عُمَارَةَ الأَسَدِيُّ، قَالَ: حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُوسَى قَالَ: أَخْبَرَنَا شَيْبَانُ، عَنْ يَحْيَى، عَنْ أَبِي سَلَمَةَ، أَنَّهُ سَمِعَ أ
