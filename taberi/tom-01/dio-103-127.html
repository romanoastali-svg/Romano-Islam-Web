ا، فِيهَا جُمِّعَ أَبُوكُمْ آدَمُ] .\n\nحَدَّثَنَا مُحَمَّدُ بْنُ عَلِيِّ بْنِ الْحَسَنِ بْنِ شَقِيقٍ، قَالَ: سَمِعْتُ أَبِي يَقُولُ:\nأَخْبَرَنَا أَبُو حَمْزَةَ، عَنْ مَنْصُورٍ، عَنْ إِبْرَاهِيمَ، عَنِ الْقَرْثَعِ، [عَنْ سَلْمَانَ، قَالَ: قَالَ لِي رَسُولُ الله ص: أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ قُلْتُ: لا، قَالَ: فِيهِ جُمِّعَ أَبُوكَ]","bs":"\u003cp data-paragraph=\"116.1\">Allahov Poslanik, sallallahu alejhi ve sellem: ‘Znaš li šta je petak?’ — ili je rekao tako nešto — ‘U njemu je sastavljen vaš otac Adem.’“\u003c/p>\u003cp data-paragraph=\"116.2\">Pričao nam je Muhammed ibn Ali ibn el-Hasen ibn Šekik, koji je rekao: čuo sam svoga oca kako govori: obavijestio nas je Ebu Hamza, od Mensura, od Ibrahima, od Karsea, od Selmana, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: ‘Znaš li šta je petak?’ Odgovorio sam: ‘Ne.’ Rekao je: ‘U njemu je sastavljen tvoj otac.’“\u003c/p>","paragraphs":[{"id":"116.1","ar":"رسول الله ص: اتدرى ما الْجُمُعَةِ؟ أَوْ قَالَ: كَذَا، فِيهَا جُمِّعَ أَبُوكُمْ آدَمُ] .","bs":"Allahov Poslanik, sallallahu alejhi ve sellem: ‘Znaš li šta je petak?’ — ili je rekao tako nešto — ‘U njemu je sastavljen vaš otac Adem.’“","ar_ranges":[],"ar_html":"رسول الله ص: اتدرى ما الْجُمُعَةِ؟ أَوْ قَالَ: كَذَا، فِيهَا جُمِّعَ أَبُوكُمْ آدَمُ] .","bs_ranges":[],"bs_html":"Allahov Poslanik, sallallahu alejhi ve sellem: ‘Znaš li šta je petak?’ — ili je rekao tako nešto — ‘U njemu je sastavljen vaš otac Adem.’“"},{"id":"116.2","ar":"حَدَّثَنَا مُحَمَّدُ بْنُ عَلِيِّ بْنِ الْحَسَنِ بْنِ شَقِيقٍ، قَالَ: سَمِعْتُ أَبِي يَقُولُ:\nأَخْبَرَنَا أَبُو حَمْزَةَ، عَنْ مَنْصُورٍ، عَنْ إِبْرَاهِيمَ، عَنِ الْقَرْثَعِ، [عَنْ سَلْمَانَ، قَالَ: قَالَ لِي رَسُولُ الله ص: أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ قُلْتُ: لا، قَالَ: فِيهِ جُمِّعَ أَبُوكَ]","bs":"Pričao nam je Muhammed ibn Ali ibn el-Hasen ibn Šekik, koji je rekao: čuo sam svoga oca kako govori: obavijestio nas je Ebu Hamza, od Mensura, od Ibrahima, od Karsea, od Selmana, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: ‘Znaš li šta je petak?’ Odgovorio sam: ‘Ne.’ Rekao je: ‘U njemu je sastavljen tvoj otac.’“","ar_ranges":[[0,225]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَلِيِّ بْنِ الْحَسَنِ بْنِ شَقِيقٍ، قَالَ: سَمِعْتُ أَبِي يَقُولُ:\nأَخْبَرَنَا أَبُو حَمْزَةَ، عَنْ مَنْصُورٍ، عَنْ إِبْرَاهِيمَ، عَنِ الْقَرْثَعِ، [عَنْ سَلْمَانَ، قَالَ: قَالَ لِي رَسُولُ الله ص: \u003c/span>أَتَدْرِي مَا يَوْمُ الْجُمُعَةِ؟ قُلْتُ: لا، قَالَ: فِيهِ جُمِّعَ أَبُوكَ]","bs_ranges":[[0,194]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Ali ibn el-Hasen ibn Šekik, koji je rekao: čuo sam svoga oca kako govori: obavijestio nas je Ebu Hamza, od Mensura, od Ibrahima, od Karsea, od Selmana, koji je rekao: \u003c/span>„Allahov Poslanik, sallallahu alejhi ve sellem, rekao mi je: ‘Znaš li šta je petak?’ Odgovorio sam: ‘Ne.’ Rekao je: ‘U njemu je sastavljen tvoj otac.’“"}],"notes":[]},{"n":117,"ar":"ذكر الوقت الذى فيه خلق آدم ع من يوم الجمعة والوقت الذي أهبط إلى الأرض\nاخْتُلِفَ فِي ذَلِكَ، فَرُوِيَ عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ وَغَيْرِهِ فِي ذَلِكَ مَا حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا ابْنُ إِدْرِيسَ، قَالَ: أَخْبَرَنَا مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رَسُولُ الله ص:\nخَيْرُ يَوْمٍ طَلَعَتْ فِيهِ الشَّمْسُ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُسْكِنَ الْجَنَّةَ، وَفِيهِ اهبط، وفيه تقوم الساعة، وفيه ساعه- يقللها- لا يُوَافِقُهَا عَبْدٌ مُسْلِمٌ يَسْأَلُ اللَّهَ تعالى فيها خيرا الا آتاه الله إِيَّاهُ،] فَقَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: قَدْ عَلِمْتُ أَيُّ سَاعَةٍ هِيَ، هِيَ آخِرُ سَاعَاتِ النَّهَارِ مِنْ يَوْمِ الْجُمُعَةِ، قَالَ اللَّهُ عَزَّ وَجَلَّ:\n\n«خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ سَأُرِيكُمْ آياتِي فَلا تَسْتَعْجِلُونِ» .\nحَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا الْمُحَارِبِيُّ وَعَبْدَةُ بْنُ سُلَيْمَانَ وَأَسَدُ بْنُ عَمْرٍو، عَنْ مُحَمَّدِ بْنِ عَمْرٍو، قَالَ: حَدَّثَنَا أَبُو سَلَمَةَ، عَنْ ابى هريرة، عن النبي ص نَحْوَهُ، وَذَكَرَ فِيهِ كَلامَ عَبْدِ اللَّهِ بْنِ سَلامٍ بِنَحْوِهِ.\nحَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، قَالَ: حدثنا أبو عاصم، قال: حدثنا عيسى، عن ابن أبي نجيح، عن مجاهد في قوله عز وجل: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: قَوْلُ آدَمَ حِينَ خُلِقَ بَعْدَ كُلِّ شيء آخر النهار من يوم الجمعه، خُلِقَ الْخَلْقُ، فَلَمَّا أَحْيَا الرُّوحُ عَيْنَيْهِ وَلِسَانَهُ وَرَأْسَهُ وَلَمْ يَبْلُغْ أَسْفَلَهُ، قَالَ: يَا رَبِّ اسْتَعْجِلْ بِخَلْقِي قَبْلَ غُرُوبِ الشَّمْسِ","bs":"\u003cp data-paragraph=\"117.1\">Spomen vremena u kojem je Adem, alejhis-selam, stvoren u petak i vremena kada je spušten na Zemlju\u003c/p>\u003cp data-paragraph=\"117.2\">O tome postoji razilaženje. Od Abdullaha ibn Selama i drugih preneseno je ono što nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Ibn Idris, koji je rekao: obavijestio nas je Muhammed ibn Amr, od Ebu Seleme, od Ebu Hurejre, koji je rekao: „Allahov Poslanik, sallallahu alejhi ve sellem, rekao je: ‘Najbolji dan u kojem je Sunce izašlo jeste petak. U njemu je stvoren Adem, u njemu je nastanjen u Džennetu, u njemu je spušten i u njemu će nastupiti Čas. U njemu postoji čas’ — navodio ga je kao kratak — ‘koji muslimanski rob ne pogodi moleći u njemu Uzvišenog Allaha za dobro a da mu Allah to ne dadne.’“ Abdullah ibn Selam rekao je: „Znam koji je to čas. To je posljednji od dnevnih sati petka.“ Allah, Silan i Uzvišen, rekao je: „Čovjek je stvoren od žurbe. Pokazat ću vam Svoje znakove, pa Me ne požurujte.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"117.3\">Pričao nam je Ebu Kurejb, koji je rekao: pričali su nam Muharibi, Abde ibn Sulejman i Esed ibn Amr, od Muhammeda ibn Amra, koji je rekao: pričao nam je Ebu Selema, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, nešto slično tome. U tome je naveo i riječi Abdullaha ibn Selama, slično navedenom.\u003c/p>\u003cp data-paragraph=\"117.4\">Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa, od Ibn Ebu Nedžiha, od Mudžahida, o riječima Njega, Silnog i Uzvišenog: „Čovjek je stvoren od žurbe.“ Rekao je: „To su Ademove riječi kada je, nakon svega ostalog, stvoren pri kraju dana petka. Stvorenja su bila stvorena, pa kada je duh oživio njegove oči, jezik i glavu, a nije još stigao do njegovog donjeg dijela, rekao je: ‘Gospodaru moj, požuri s mojim stvaranjem prije nego što Sunce zađe.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"117.1","ar":"ذكر الوقت الذى فيه خلق آدم ع من يوم الجمعة والوقت الذي أهبط إلى الأرض","bs":"Spomen vremena u kojem je Adem, alejhis-selam, stvoren u petak i vremena kada je spušten na Zemlju","ar_ranges":[],"ar_html":"ذكر الوقت الذى فيه خلق آدم ع من يوم الجمعة والوقت الذي أهبط إلى الأرض","bs_ranges":[],"bs_html":"Spomen vremena u kojem je Adem, alejhis-selam, stvoren u petak i vremena kada je spušten na Zemlju"},{"id":"117.2","ar":"اخْتُلِفَ فِي ذَلِكَ، فَرُوِيَ عَنْ عَبْدِ اللَّهِ بْنِ سَلامٍ وَغَيْرِهِ فِي ذَلِكَ مَا حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا ابْنُ إِدْرِيسَ، قَالَ: أَخْبَرَنَا مُحَمَّدُ بْنُ عَمْرٍو، عَنْ أَبِي سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ: [قَالَ رَسُولُ الله ص:\nخَيْرُ يَوْمٍ طَلَعَتْ فِيهِ الشَّمْسُ يَوْمُ الْجُمُعَةِ، فِيهِ خُلِقَ آدَمُ، وَفِيهِ أُسْكِنَ الْجَنَّةَ، وَفِيهِ اهبط، وفيه تقوم الساعة، وفيه ساعه- يقللها- لا يُوَافِقُهَا عَبْدٌ مُسْلِمٌ يَسْأَلُ اللَّهَ تعالى فيها خيرا الا آتاه الله إِيَّاهُ،] فَقَالَ عَبْدُ اللَّهِ بْنُ سَلامٍ: قَدْ عَلِمْتُ أَيُّ سَاعَةٍ هِيَ، هِيَ آخِرُ سَاعَاتِ النَّهَارِ مِنْ يَوْمِ الْجُمُعَةِ، قَالَ اللَّهُ عَزَّ وَجَلَّ:\n\n«خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ سَأُرِيكُمْ آياتِي فَلا تَسْتَعْجِلُونِ» .","bs":"O tome postoji razilaženje. Od Abdullaha ibn Selama i drugih preneseno je ono što nam je pričao Ebu Kurejb, koji je rekao: pričao nam je Ibn Idris, koji je rekao: obavijestio nas je Muhammed ibn Amr, od Ebu Selem stupiti Čas. U njemu postoji čas’ — navodio ga je kao kratak — ‘koji muslimanski rob ne pogodi moleći u njemu Uzvišenog Allaha za dobro a da mu Allah to ne dadne.’“ Abdullah ibn Selam rekao je: „Znam koji je to čas. To je posljednji od dnevnih sati petka.“ Allah, Silan i Uzvišen, rekao je: „Čovjek je stvoren od žurbe. Pokazat ću vam Svoje znakove, pa Me ne požurujte.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37.⟧\u003c/span>"},{"id":"117.3","ar":"حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا الْمُحَارِبِيُّ وَعَبْدَةُ بْنُ سُلَيْمَانَ وَأَسَدُ بْنُ عَمْرٍو، عَنْ مُحَمَّدِ بْنِ عَمْرٍو، قَالَ: حَدَّثَنَا أَبُو سَلَمَةَ، عَنْ ابى هريرة، عن النبي ص نَحْوَهُ، وَذَكَرَ فِيهِ كَلامَ عَبْدِ اللَّهِ بْنِ سَلامٍ بِنَحْوِهِ.","bs":"Pričao nam je Ebu Kurejb, koji je rekao: pričali su nam Muharibi, Abde ibn Sulejman i Esed ibn Amr, od Muhammeda ibn Amra, koji je rekao: pričao nam je Ebu Selema, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, nešto slično tome. U tome je naveo i riječi Abdullaha ibn Selama, slično navedenom.","ar_ranges":[[0,202]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا أَبُو كُرَيْبٍ، قَالَ: حَدَّثَنَا الْمُحَارِبِيُّ وَعَبْدَةُ بْنُ سُلَيْمَانَ وَأَسَدُ بْنُ عَمْرٍو، عَنْ مُحَمَّدِ بْنِ عَمْرٍو، قَالَ: حَدَّثَنَا أَبُو سَلَمَةَ، عَنْ ابى هريرة، عن النبي ص \u003c/span>نَحْوَهُ، وَذَكَرَ فِيهِ كَلامَ عَبْدِ اللَّهِ بْنِ سَلامٍ بِنَحْوِهِ.","bs_ranges":[[0,227]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Ebu Kurejb, koji je rekao: pričali su nam Muharibi, Abde ibn Sulejman i Esed ibn Amr, od Muhammeda ibn Amra, koji je rekao: pričao nam je Ebu Selema, od Ebu Hurejre, od Vjerovjesnika, sallallahu alejhi ve sellem, \u003c/span>nešto slično tome. U tome je naveo i riječi Abdullaha ibn Selama, slično navedenom."},{"id":"117.4","ar":"حَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، قَالَ: حدثنا أبو عاصم، قال: حدثنا عيسى، عن ابن أبي نجيح، عن مجاهد في قوله عز وجل: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: قَوْلُ آدَمَ حِينَ خُلِقَ بَعْدَ كُلِّ شيء آخر النهار من يوم الجمعه، خُلِقَ الْخَلْقُ، فَلَمَّا أَحْيَا الرُّوحُ عَيْنَيْهِ وَلِسَانَهُ وَرَأْسَهُ وَلَمْ يَبْلُغْ أَسْفَلَهُ، قَالَ: يَا رَبِّ اسْتَعْجِلْ بِخَلْقِي قَبْلَ غُرُوبِ الشَّمْسِ","bs":"Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa, od Ibn Ebu Nedžiha, od Mudžahida, o riječima Njega, Silnog i Uzvišenog: „Čovjek je stvoren od žurbe.“ Rekao je: „To su Ademove riječi kada je, nakon svega ostalog, stvoren pri kraju dana petka. Stvorenja su bila stvorena, pa kada je duh oživio njegove oči, jezik i glavu, a nije još stigao do njegovog donjeg dijela, rekao je: ‘Gospodaru moj, požuri s mojim stvaranjem prije nego što Sunce zađe.’“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧","ar_ranges":[[0,101]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا مُحَمَّدُ بْنُ عَمْرٍو، قَالَ: حدثنا أبو عاصم، قال: حدثنا عيسى، عن ابن أبي نجيح، عن مجاهد \u003c/span>في قوله عز وجل: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: قَوْلُ آدَمَ حِينَ خُلِقَ بَعْدَ كُلِّ شيء آخر النهار من يوم الجمعه، خُلِقَ الْخَلْقُ، فَلَمَّا أَحْيَا الرُّوحُ عَيْنَيْهِ وَلِسَانَهُ وَرَأْسَهُ وَلَمْ يَبْلُغْ أَسْفَلَهُ، قَالَ: يَا رَبِّ اسْتَعْجِلْ بِخَلْقِي قَبْلَ غُرُوبِ الشَّمْسِ","bs_ranges":[[0,139]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Muhammed ibn Amr, koji je rekao: pričao nam je Ebu Asim, koji je rekao: pričao nam je Isa, od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>o riječima Njega, Silnog i Uzvišenog: „Čovjek je stvoren od žurbe.“ Rekao je: „To su Ademove riječi kada je, nakon svega ostalog, stvoren pri kraju dana petka. Stvorenja su bila stvorena, pa kada je duh oživio njegove oči, jezik i glavu, a nije još stigao do njegovog donjeg dijela, rekao je: ‘Gospodaru moj, požuri s mojim stvaranjem prije nego što Sunce zađe.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧\u003c/span>"}],"notes":[]},{"n":118,"ar":"حدثني الحارث، قال: حدثنا الحسن، قال: حدثنا ورقاء، عن ابن أبي نجيح، عن مجاهد مثله.\nحَدَّثَنَا الْقَاسِمُ، قَالَ: حَدَّثَنَا الْحُسَيْنُ، قَالَ: حَدَّثَنَا حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: قَالَ مُجَاهِدٌ: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: آدَمُ حِينَ خُلِقَ بعد كل شيء، ثم ذكره نحوه، غير أنه قال في حديثه: استعجل بخلقي، قد غربت الشمس.\n\nحَدَّثَنِي يونس، قال: أخبرنا ابن وهب، قال: قال ابن زيد في قوله:\n\n«خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قال: على عجل خلق آدم آخر ذلك اليوم من ذينك اليومين- يريد يوم الجمعة- وخلقه على عجلة وجعله عجولا.\nوقد زعم بعضهم أن الله عز وجل أسكن آدم وزوجته الفردوس لساعتين مضتا من نهار يوم الجمعة، وقيل لثلاث ساعات مضين منه، وأهبطه إلى الأرض لسبع ساعات مضين من ذلك اليوم، فكان مقدار مكثهما في الجنة خمس ساعات منه وقيل: كان ذلك ثلاث ساعات وقال بعضهم: اخرج آدم ع من الجنه الساعة التاسعة أو العاشرة ذِكْرُ مَنْ قَالَ ذَلِكَ:\nقال أبو جعفر: قرأت على عبدان بن محمد المروزي، قال: حَدَّثَنَا عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع، عن أنس عن أبي العالية، قال: أخرج آدم من الجنة للساعة التاسعة أو العاشرة، فقال لي: نعم، لخمسة أيام مضين من نيسان.\n\nفإن كان قائل هذا القول أراد الله أن تبارك وتعالى أسكن آدم وزوجته الفردوس لساعتين مضتا من نهار يوم الجمعة من أيام أهل الدنيا التي هي على","bs":"\u003cp data-paragraph=\"118.1\">Pričao mi je Haris, koji je rekao: pričao nam je Hasen, koji je rekao: pričao nam je Verka, od Ibn Ebu Nedžiha, od Mudžahida, isto to.\u003c/p>\u003cp data-paragraph=\"118.2\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao nam je Hadždžadž, od Ibn Džurejdža, koji je rekao: Mudžahid je rekao, o riječima: „Čovjek je stvoren od žurbe“: „Adem, kada je stvoren nakon svega ostalog.“ Zatim je naveo nešto slično tome, osim što je u svojoj predaji rekao: „Požuri s mojim stvaranjem; Sunce je već zašlo.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"118.3\">Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, o riječima: „Čovjek je stvoren od žurbe“: „U žurbi je Adem stvoren, na kraju toga dana od ona dva dana“ — misli na petak — „stvorio ga je u žurbi i učinio ga žurnim.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"118.4\">Neki su tvrdili da je Allah, Silan i Uzvišen, nastanio Adema i njegovu suprugu u Firdevsu nakon što su prošla dva dnevna sata petka; rečeno je i nakon što su prošla tri sata. Spustio ga je na Zemlju nakon što je prošlo sedam sati toga dana. Prema tome, njihov boravak u Džennetu trajao je pet njegovih sati; rečeno je i tri sata. Neki su rekli da je Adem, alejhis-selam, izveden iz Dženneta u devetom ili desetom satu. Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"118.5\">Ebu Džafer kaže: Čitao sam Abdanu ibn Muhammedu el-Merveziju, koji je rekao: pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, od Enesa, od Ebu Alije, koji je rekao: „Adem je izveden iz Dženneta u devetom ili desetom satu.“ Pa mi je rekao: „Da, nakon što je prošlo pet dana nisana.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u izvoru stoji عن الربيع، عن أنس kao dva uzastopna imena, pa nisu prešutno spojena u ime Rebi‘ ibn Enes. „Nisan“ je naziv mjeseca naveden u predaji.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"118.6\">Ako je onaj koji ovo kaže htio reći da je Allah, Blagoslovljen i Uzvišen, nastanio Adema i njegovu suprugu u Firdevsu nakon što su prošla dva dnevna sata petka od dana ovoga svijeta, koji su\u003c/p>","paragraphs":[{"id":"118.1","ar":"حدثني الحارث، قال: حدثنا الحسن، قال: حدثنا ورقاء، عن ابن أبي نجيح، عن مجاهد مثله.","bs":"Pričao mi je Haris, koji je rekao: pričao nam je Hasen, koji je rekao: pričao nam je Verka, od Ibn Ebu Nedžiha, od Mudžahida, isto to.","ar_ranges":[[0,76]],"ar_html":"\u003cspan class=\"isnad\">حدثني الحارث، قال: حدثنا الحسن، قال: حدثنا ورقاء، عن ابن أبي نجيح، عن مجاهد \u003c/span>مثله.","bs_ranges":[[0,126]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Haris, koji je rekao: pričao nam je Hasen, koji je rekao: pričao nam je Verka, od Ibn Ebu Nedžiha, od Mudžahida, \u003c/span>isto to."},{"id":"118.2","ar":"حَدَّثَنَا الْقَاسِمُ، قَالَ: حَدَّثَنَا الْحُسَيْنُ، قَالَ: حَدَّثَنَا حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: قَالَ مُجَاهِدٌ: «خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: آدَمُ حِينَ خُلِقَ بعد كل شيء، ثم ذكره نحوه، غير أنه قال في حديثه: استعجل بخلقي، قد غربت الشمس.","bs":"Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao nam je Hadždžadž, od Ibn Džurejdža, koji je rekao: Mudžahid je rekao, o riječima: „Čovjek je stvoren od žurbe“: „Adem, kada je stvoren nakon svega ostalog.“ Zatim je naveo nešto slično tome, osim što je u svojoj predaji rekao: „Požuri s mojim stvaranjem; Sunce je već zašlo.“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧","ar_ranges":[[0,127]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا الْقَاسِمُ، قَالَ: حَدَّثَنَا الْحُسَيْنُ، قَالَ: حَدَّثَنَا حَجَّاجٌ، عَنِ ابْنِ جُرَيْجٍ، قَالَ: قَالَ مُجَاهِدٌ: \u003c/span>«خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قَالَ: آدَمُ حِينَ خُلِقَ بعد كل شيء، ثم ذكره نحوه، غير أنه قال في حديثه: استعجل بخلقي، قد غربت الشمس.","bs_ranges":[[0,150]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Kasim, koji je rekao: pričao nam je Husejn, koji je rekao: pričao nam je Hadždžadž, od Ibn Džurejdža, koji je rekao: Mudžahid je rekao, \u003c/span>o riječima: „Čovjek je stvoren od žurbe“: „Adem, kada je stvoren nakon svega ostalog.“ Zatim je naveo nešto slično tome, osim što je u svojoj predaji rekao: „Požuri s mojim stvaranjem; Sunce je već zašlo.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧\u003c/span>"},{"id":"118.3","ar":"حَدَّثَنِي يونس، قال: أخبرنا ابن وهب، قال: قال ابن زيد في قوله:\n\n«خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قال: على عجل خلق آدم آخر ذلك اليوم من ذينك اليومين- يريد يوم الجمعة- وخلقه على عجلة وجعله عجولا.","bs":"Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, o riječima: „Čovjek je stvoren od žurbe“: „U žurbi je Adem stvoren, na kraju toga dana od ona dva dana“ — misli na petak — „stvorio ga je u žurbi i učinio ga žurnim.“ ⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧","ar_ranges":[[0,55]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي يونس، قال: أخبرنا ابن وهب، قال: قال ابن زيد \u003c/span>في قوله:\n\n«خُلِقَ الْإِنْسانُ مِنْ عَجَلٍ» ، قال: على عجل خلق آدم آخر ذلك اليوم من ذينك اليومين- يريد يوم الجمعة- وخلقه على عجلة وجعله عجولا.","bs_ranges":[[0,98]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Junus, koji je rekao: obavijestio nas je Ibn Vehb, koji je rekao: Ibn Zejd rekao je, \u003c/span>o riječima: „Čovjek je stvoren od žurbe“: „U žurbi je Adem stvoren, na kraju toga dana od ona dva dana“ — misli na petak — „stvorio ga je u žurbi i učinio ga žurnim.“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Enbija, 21:37, navedeni dio.⟧\u003c/span>"},{"id":"118.4","ar":"وقد زعم بعضهم أن الله عز وجل أسكن آدم وزوجته الفردوس لساعتين مضتا من نهار يوم الجمعة، وقيل لثلاث ساعات مضين منه، وأهبطه إلى الأرض لسبع ساعات مضين من ذلك اليوم، فكان مقدار مكثهما في الجنة خمس ساعات منه وقيل: كان ذلك ثلاث ساعات وقال بعضهم: اخرج آدم ع من الجنه الساعة التاسعة أو العاشرة ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Neki su tvrdili da je Allah, Silan i Uzvišen, nastanio Adema i njegovu suprugu u Firdevsu nakon što su prošla dva dnevna sata petka; rečeno je i nakon što su prošla tri sata. Spustio ga je na Zemlju nakon što je prošlo sedam sati toga dana. Prema tome, njihov boravak u Džennetu trajao je pet njegovih sati; rečeno je i tri sata. Neki su rekli da je Adem, alejhis-selam, izveden iz Dženneta u devetom ili desetom satu. Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"وقد زعم بعضهم أن الله عز وجل أسكن آدم وزوجته الفردوس لساعتين مضتا من نهار يوم الجمعة، وقيل لثلاث ساعات مضين منه، وأهبطه إلى الأرض لسبع ساعات مضين من ذلك اليوم، فكان مقدار مكثهما في الجنة خمس ساعات منه وقيل: كان ذلك ثلاث ساعات وقال بعضهم: اخرج آدم ع من الجنه الساعة التاسعة أو العاشرة ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Neki su tvrdili da je Allah, Silan i Uzvišen, nastanio Adema i njegovu suprugu u Firdevsu nakon što su prošla dva dnevna sata petka; rečeno je i nakon što su prošla tri sata. Spustio ga je na Zemlju nakon što je prošlo sedam sati toga dana. Prema tome, njihov boravak u Džennetu trajao je pet njegovih sati; rečeno je i tri sata. Neki su rekli da je Adem, alejhis-selam, izveden iz Dženneta u devetom ili desetom satu. Spomen onih koji su to rekli:"},{"id":"118.5","ar":"قال أبو جعفر: قرأت على عبدان بن محمد المروزي، قال: حَدَّثَنَا عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع، عن أنس عن أبي العالية، قال: أخرج آدم من الجنة للساعة التاسعة أو العاشرة، فقال لي: نعم، لخمسة أيام مضين من نيسان.","bs":"Ebu Džafer kaže: Čitao sam Abdanu ibn Muhammedu el-Merveziju, koji je rekao: pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, od Enesa, od Ebu Alije, koji je rekao: „Adem je izveden iz Dženneta u devetom ili desetom satu.“ Pa mi je rekao: „Da, nakon što je prošlo pet dana nisana.“ ⟦Napomena prevodioca: u izvoru stoji عن الربيع، عن أنس kao dva uzastopna imena, pa nisu prešutno spojena u ime Rebi‘ ibn Enes. „Nisan“ je naziv mjeseca naveden u predaji.⟧","ar_ranges":[[51,158]],"ar_html":"قال أبو جعفر: قرأت على عبدان بن محمد المروزي، قال: \u003cspan class=\"isnad\">حَدَّثَنَا عمار بن الحسن، قال: حدثنا عبد الله بن أبي جعفر، عن أبيه، عن الربيع، عن أنس عن أبي العالية، قال: \u003c/span>أخرج آدم من الجنة للساعة التاسعة أو العاشرة، فقال لي: نعم، لخمسة أيام مضين من نيسان.","bs_ranges":[[77,228]],"bs_html":"Ebu Džafer kaže: Čitao sam Abdanu ibn Muhammedu el-Merveziju, koji je rekao: \u003cspan class=\"isnad\">pričao nam je Ammar ibn el-Hasen, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie, od Enesa, od Ebu Alije, koji je rekao: \u003c/span>„Adem je izveden iz Dženneta u devetom ili desetom satu.“ Pa mi je rekao: „Da, nakon što je prošlo pet dana nisana.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: u izvoru stoji عن الربيع، عن أنس kao dva uzastopna imena, pa nisu prešutno spojena u ime Rebi‘ ibn Enes. „Nisan“ je naziv mjeseca naveden u predaji.⟧\u003c/span>"},{"id":"118.6","ar":"فإن كان قائل هذا القول أراد الله أن تبارك وتعالى أسكن آدم وزوجته الفردوس لساعتين مضتا من نهار يوم الجمعة من أيام أهل الدنيا التي هي على","bs":"Ako je onaj koji ovo kaže htio reći da je Allah, Blagoslovljen i Uzvišen, nastanio Adema i njegovu suprugu u Firdevsu nakon što su prošla dva dnevna sata petka od dana ovoga svijeta, koji su","ar_ranges":[],"ar_html":"فإن كان قائل هذا القول أراد الله أن تبارك وتعالى أسكن آدم وزوجته الفردوس لساعتين مضتا من نهار يوم الجمعة من أيام أهل الدنيا التي هي على","bs_ranges":[],"bs_html":"Ako je onaj koji ovo kaže htio reći da je Allah, Blagoslovljen i Uzvišen, nastanio Adema i njegovu suprugu u Firdevsu nakon što su prošla dva dnevna sata petka od dana ovoga svijeta, koji su"}],"notes":[]},{"n":119,"ar":"ما هي به اليوم، فلم يبعد قوله من الصواب في ذلك، لأن الأخبار إذا كانت واردة عن السلف من أهل العلم، بأن آدم خلق في آخر ساعة من اليوم السادس من الأيام التي مقدار اليوم الواحد منها ألف سنة من سنيننا فمعلوم أن الساعة الواحدة من ساعات ذلك اليوم ثلاثة وثمانون عاما من أعوامنا، وقد ذكرنا أن آدم بعد أن خمر ربنا عز وجل طينته بقي قبل أن ينفخ فيه الروح أربعين عاما، وذلك لا شك أنه عنى به من أعوامنا وسنيننا، ثم من بعد أن نفخ فيه الروح إلى أن تناهى أمره، وأسكن الفردوس، وأهبط إلى الأرض- غير مستنكر أن يكون كان مقداره من سنيننا قدر خمس وثلاثين سنة فإن كان أراد أنه أسكن الفردوس لساعتين مضتا من نهار يوم الجمعة من الأيام التي مقدار اليوم الواحد منها ألف سنة من سنيننا، فقد قال غير الحق، وذلك أن جميع من حفظ له قول في ذلك من أهل العلم، فإنه كان يقول إن آدم نفخ فيه الروح في آخر النهار من يوم الجمعة قبل غروب الشمس من ذلك اليوم ثم الاخبار عن رسول الله ص متظاهرة بأن الله تبارك وتعالى أسكنه الجنة فيه، وفيه أهبطه إلى الأرض فإن كان ذلك صحيحا، فمعلوم أن آخر ساعة من نهار يوم من أيام الآخرة ومن الأيام التي اليوم الواحد منها مقداره ألف سنة من سنيننا، إنما هي ساعة بعد مضي إحدى عشرة ساعة، وذلك ساعة من اثنتي عشرة ساعة، وهي ثلاث وثمانون سنة وأربعة أشهر من سنيننا، فآدم صلوات الله عليه إذ كان الأمر كذلك، إنما خلق لمضي إحدى عشرة ساعة من نهار يوم الجمعة من الأيام التي اليوم الواحد منها ألف سنة من سنيننا، فمكث جسدا ملقى لم ينفخ فيه الروح أربعين عاما من أعوامنا ثم نفخ فيه الروح فكان مكثه في السماء بعد ذلك ومقامه في الجنة، إلى أن أصاب الخطيئة وأهبط إلى الأرض ثلاثا وأربعين سنة من سنيننا وأربعة أشهر، وذلك ساعة من ساعات يوم من الأيام الستة التي خلق الله تعالى فيها الخلق","bs":"\u003cp data-paragraph=\"119.1\">onakvi kakvi su i danas, onda njegovo mišljenje o tome nije daleko od ispravnog. Ako predaje učenih prethodnika govore da je Adem stvoren u posljednjem satu šestog dana, od dana u kojima jedan dan traje hiljadu naših godina, onda je poznato da jedan sat toga dana traje osamdeset tri naše godine. Već smo spomenuli da je Adem, nakon što je naš Gospodar, Silan i Uzvišen, umijesio njegovu glinu, ostao četrdeset godina prije nego što je u njega udahnuo duh. Nema sumnje da se time mislilo na naše godine. Zatim, od udahnuća duha u njega dok nije dovršeno njegovo stanje, nastanjen u Firdevsu i spušten na Zemlju, nije neobično da je prošlo trideset pet naših godina.\u003c/p>\u003cp data-paragraph=\"119.2\">Ako je, međutim, mislio da je nastanjen u Firdevsu nakon što su prošla dva dnevna sata petka od dana u kojima jedan dan traje hiljadu naših godina, onda nije rekao istinu. Svi učeni ljudi čije je mišljenje o tome sačuvano govorili su da je u Adema udahnut duh pri kraju dana petka, prije zalaska Sunca toga dana. Potom brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, međusobno potvrđuju da ga je Allah, Blagoslovljen i Uzvišen, toga dana nastanio u Džennetu i toga dana spustio na Zemlju. Ako je to tačno, onda je poznato da je posljednji dnevni sat jednoga od dana budućeg svijeta, dana u kojima jedan dan traje hiljadu naših godina, sat nakon što je već prošlo jedanaest sati: jedan od dvanaest sati. To su osamdeset tri godine i četiri mjeseca od naših godina. Ako je stvar tako stajala, Adem, neka su Allahovi blagoslovi na njemu, stvoren je nakon što je prošlo jedanaest dnevnih sati petka, od dana u kojima jedan dan traje hiljadu naših godina. Ostao je kao položeno tijelo, bez udahnutog duha, četrdeset naših godina. Zatim je u njega udahnut duh, pa je njegov boravak na nebu i u Džennetu, sve dok nije počinio grijeh i spušten na Zemlju, trajao četrdeset tri naše godine i četiri mjeseca. To je jedan od sati jednoga od šest dana u kojima je Uzvišeni Allah stvorio stvorenja. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: broj „trideset pet godina“ u prvom dijelu i kasniji proračun „četrdeset tri godine i četiri mjeseca“ preneseni su kako stoje u izvoru; nisu računskim putem usaglašavani.⟧\u003c/span>\u003c/p>","paragraphs":[{"id":"119.1","ar":"ما هي به اليوم، فلم يبعد قوله من الصواب في ذلك، لأن الأخبار إذا كانت واردة عن السلف من أهل العلم، بأن آدم خلق في آخر ساعة من اليوم السادس من الأيام التي مقدار اليوم الواحد منها ألف سنة من سنيننا فمعلوم أن الساعة الواحدة من ساعات ذلك اليوم ثلاثة وثمانون عاما من أعوامنا، وقد ذكرنا أن آدم بعد أن خمر ربنا عز وجل طينته بقي قبل أن ينفخ فيه الروح أربعين عاما، وذلك لا شك أنه عنى به من أعوامنا وسنيننا، ثم من بعد أن نفخ فيه الروح إلى أن تناهى أمره، وأسكن الفردوس، وأهبط إلى الأرض- غير مستنكر أن يكون كان مقداره من سنيننا قدر خمس وثلاثين سنة","bs":"onakvi kakvi su i danas, onda njegovo mišljenje o tome nije daleko od ispravnog. Ako predaje učenih prethodnika govore da je Adem stvoren u posljednjem satu šestog dana, od dana u kojima jedan dan traje hiljadu naših godina, onda je poznato da jedan sat toga dana traje osamdeset tri naše godine. Već smo spomenuli da je Adem, nakon što je naš Gospodar, Silan i Uzvišen, umijesio njegovu glinu, ostao četrdeset godina prije nego što je u njega udahnuo duh. Nema sumnje da se time mislilo na naše godine. Zatim, od udahnuća duha u njega dok nije dovršeno njegovo stanje, nastanjen u Firdevsu i spušten na Zemlju, nije neobično da je prošlo trideset pet naših godina.","ar_ranges":[],"ar_html":"ما هي به اليوم، فلم يبعد قوله من الصواب في ذلك، لأن الأخبار إذا كانت واردة عن السلف من أهل العلم، بأن آدم خلق في آخر ساعة من اليوم السادس من الأيام التي مقدار اليوم الواحد منها ألف سنة من سنيننا فمعلوم أن الساعة الواحدة من ساعات ذلك اليوم ثلاثة وثمانون عاما من أعوامنا، وقد ذكرنا أن آدم بعد أن خمر ربنا عز وجل طينته بقي قبل أن ينفخ فيه الروح أربعين عاما، وذلك لا شك أنه عنى به من أعوامنا وسنيننا، ثم من بعد أن نفخ فيه الروح إلى أن تناهى أمره، وأسكن الفردوس، وأهبط إلى الأرض- غير مستنكر أن يكون كان مقداره من سنيننا قدر خمس وثلاثين سنة","bs_ranges":[],"bs_html":"onakvi kakvi su i danas, onda njegovo mišljenje o tome nije daleko od ispravnog. Ako predaje učenih prethodnika govore da je Adem stvoren u posljednjem satu šestog dana, od dana u kojima jedan dan traje hiljadu naših godina, onda je poznato da jedan sat toga dana traje osamdeset tri naše godine. Već smo spomenuli da je Adem, nakon što je naš Gospodar, Silan i Uzvišen, umijesio njegovu glinu, ostao četrdeset godina prije nego što je u njega udahnuo duh. Nema sumnje da se time mislilo na naše godine. Zatim, od udahnuća duha u njega dok nije dovršeno njegovo stanje, nastanjen u Firdevsu i spušten na Zemlju, nije neobično da je prošlo trideset pet naših godina."},{"id":"119.2","ar":"فإن كان أراد أنه أسكن الفردوس لساعتين مضتا من نهار يوم الجمعة من الأيام التي مقدار اليوم الواحد منها ألف سنة من سنيننا، فقد قال غير الحق، وذلك أن جميع من حفظ له قول في ذلك من أهل العلم، فإنه كان يقول إن آدم نفخ فيه الروح في آخر النهار من يوم الجمعة قبل غروب الشمس من ذلك اليوم ثم الاخبار عن رسول الله ص متظاهرة بأن الله تبارك وتعالى أسكنه الجنة فيه، وفيه أهبطه إلى الأرض فإن كان ذلك صحيحا، فمعلوم أن آخر ساعة من نهار يوم من أيام الآخرة ومن الأيام التي اليوم الواحد منها مقداره ألف سنة من سنيننا، إنما هي ساعة بعد مضي إحدى عشرة ساعة، وذلك ساعة من اثنتي عشرة ساعة، وهي ثلاث وثمانون سنة وأربعة أشهر من سنيننا، فآدم صلوات الله عليه إذ كان الأمر كذلك، إنما خلق لمضي إحدى عشرة ساعة من نهار يوم الجمعة من الأيام التي اليوم الواحد منها ألف سنة من سنيننا، فمكث جسدا ملقى لم ينفخ فيه الروح أربعين عاما من أعوامنا ثم نفخ فيه الروح فكان مكثه في السماء بعد ذلك ومقامه في الجنة، إلى أن أصاب الخطيئة وأهبط إلى الأرض ثلاثا وأربعين سنة من سنيننا وأربعة أشهر، وذلك ساعة من ساعات يوم من الأيام الستة التي خلق الله تعالى فيها الخلق","bs":"Ako je, međutim, mislio da je nastanjen u Firdevsu nakon što su prošla dva dnevna sata petka od dana u kojima jedan dan traje hiljadu naših godina, onda nije rekao istinu. Svi učeni ljudi čije je mišljenje o tome sačuvano govorili su da je u Adema udahnut duh pri kraju dana petka, prije zalaska Sunca toga dana. Potom brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, međusobno potvrđuju da ga je Allah, Blagoslovljen i Uzvišen, toga dana nastanio u Džennetu i toga dana spustio na Zemlju. Ako je to tačno, onda je poznato da je posljednji dnevni sat jednoga od dana budućeg svijeta, dana u kojima jedan dan traje hiljadu naših godina, sat nakon što je već prošlo jedanaest sati: jedan od dvanaest sati. To su osamdeset tri godine i četiri mjeseca od naših godina. Ako je stvar tako stajala, Adem, neka su Allahovi blagoslovi na njemu, stvoren je nakon što je prošlo jedanaest dnevnih sati petka, od dana u kojima jedan dan traje hiljadu naših godina. Ostao je kao položeno tijelo, bez udahnutog duha, četrdeset naših godina. Zatim je u njega udahnut duh, pa je njegov boravak na nebu i u Džennetu, sve dok nije počinio grijeh i spušten na Zemlju, trajao četrdeset tri naše godine i četiri mjeseca. To je jedan od sati jednoga od šest dana u kojima je Uzvišeni Allah stvorio stvorenja. ⟦Napomena prevodioca: broj „trideset pet godina“ u prvom dijelu i kasniji proračun „četrdeset tri godine i četiri mjeseca“ preneseni su kako stoje u izvoru; nisu računskim putem usaglašavani.⟧","ar_ranges":[],"ar_html":"فإن كان أراد أنه أسكن الفردوس لساعتين مضتا من نهار يوم الجمعة من الأيام التي مقدار اليوم الواحد منها ألف سنة من سنيننا، فقد قال غير الحق، وذلك أن جميع من حفظ له قول في ذلك من أهل العلم، فإنه كان يقول إن آدم نفخ فيه الروح في آخر النهار من يوم الجمعة قبل غروب الشمس من ذلك اليوم ثم الاخبار عن رسول الله ص متظاهرة بأن الله تبارك وتعالى أسكنه الجنة فيه، وفيه أهبطه إلى الأرض فإن كان ذلك صحيحا، فمعلوم أن آخر ساعة من نهار يوم من أيام الآخرة ومن الأيام التي اليوم الواحد منها مقداره ألف سنة من سنيننا، إنما هي ساعة بعد مضي إحدى عشرة ساعة، وذلك ساعة من اثنتي عشرة ساعة، وهي ثلاث وثمانون سنة وأربعة أشهر من سنيننا، فآدم صلوات الله عليه إذ كان الأمر كذلك، إنما خلق لمضي إحدى عشرة ساعة من نهار يوم الجمعة من الأيام التي اليوم الواحد منها ألف سنة من سنيننا، فمكث جسدا ملقى لم ينفخ فيه الروح أربعين عاما من أعوامنا ثم نفخ فيه الروح فكان مكثه في السماء بعد ذلك ومقامه في الجنة، إلى أن أصاب الخطيئة وأهبط إلى الأرض ثلاثا وأربعين سنة من سنيننا وأربعة أشهر، وذلك ساعة من ساعات يوم من الأيام الستة التي خلق الله تعالى فيها الخلق","bs_ranges":[],"bs_html":"Ako je, međutim, mislio da je nastanjen u Firdevsu nakon što su prošla dva dnevna sata petka od dana u kojima jedan dan traje hiljadu naših godina, onda nije rekao istinu. Svi učeni ljudi čije je mišljenje o tome sačuvano govorili su da je u Adema udahnut duh pri kraju dana petka, prije zalaska Sunca toga dana. Potom brojne predaje od Allahovog Poslanika, sallallahu alejhi ve sellem, međusobno potvrđuju da ga je Allah, Blagoslovljen i Uzvišen, toga dana nastanio u Džennetu i toga dana spustio na Zemlju. Ako je to tačno, onda je poznato da je posljednji dnevni sat jednoga od dana budućeg svijeta, dana u kojima jedan dan traje hiljadu naših godina, sat nakon što je već prošlo jedanaest sati: jedan od dvanaest sati. To su osamdeset tri godine i četiri mjeseca od naših godina. Ako je stvar tako stajala, Adem, neka su Allahovi blagoslovi na njemu, stvoren je nakon što je prošlo jedanaest dnevnih sati petka, od dana u kojima jedan dan traje hiljadu naših godina. Ostao je kao položeno tijelo, bez udahnutog duha, četrdeset naših godina. Zatim je u njega udahnut duh, pa je njegov boravak na nebu i u Džennetu, sve dok nije počinio grijeh i spušten na Zemlju, trajao četrdeset tri naše godine i četiri mjeseca. To je jedan od sati jednoga od šest dana u kojima je Uzvišeni Allah stvorio stvorenja. \u003cspan class=\"translator-note\">⟦Napomena prevodioca: broj „trideset pet godina“ u prvom dijelu i kasniji proračun „četrdeset tri godine i četiri mjeseca“ preneseni su kako stoje u izvoru; nisu računskim putem usaglašavani.⟧\u003c/span>"}],"notes":[]},{"n":120,"ar":"وَقَدْ حَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ سَعْدٍ، قَالَ:\nحَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أخبرني أبي، عن أبي صالح، عَنِ ابْنِ عَبَّاسٍ، قَالَ: خَرَجَ آدَمُ مِنَ الْجَنَّةِ بَيْنَ الصَّلاتَيْنِ: صَلاةِ الظُّهْرِ وَصَلاةِ الْعَصْرِ، فَأُنْزِلَ إِلَى الأَرْضِ وَكَانَ مُكْثُهُ فِي الْجَنَّةِ نصف يوم يوم من ايام الآخرة، وهو خمسمائة سَنَةٍ، مِنْ يَوْمٍ كَانَ مِقْدَارُهُ اثْنَتَيْ عَشْرَةَ سَاعَةً، وَالْيَوْمُ أَلْفُ سَنَةٍ مِمَّا يَعُدُّ أَهْلُ الدُّنْيَا، وَهَذَا أَيْضًا قَوْلٌ خِلافُ مَا وَرَدَتْ به الاخبار عن رسول الله ص، وَعَنِ السَّلَفِ مِنْ عُلَمَائِنَا.","bs":"\u003cp data-paragraph=\"120.1\">Pričao mi je Haris ibn Muhammed, koji je rekao: pričao nam je Muhammed ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Adem je izašao iz Dženneta između dva namaza: podne-namaza i ikindije. Spušten je na Zemlju, a u Džennetu je boravio pola dana, jednog od dana budućeg svijeta. To je pet stotina godina, od dana koji traje dvanaest sati, a dan je hiljadu godina kakve stanovnici ovoga svijeta broje.“ I ovo mišljenje suprotno je onome što je došlo u predajama od Allahovog Poslanika, sallallahu alejhi ve sellem, i od učenih prethodnika među našim učenjacima.\u003c/p>","paragraphs":[{"id":"120.1","ar":"وَقَدْ حَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ سَعْدٍ، قَالَ:\nحَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أخبرني أبي، عن أبي صالح، عَنِ ابْنِ عَبَّاسٍ، قَالَ: خَرَجَ آدَمُ مِنَ الْجَنَّةِ بَيْنَ الصَّلاتَيْنِ: صَلاةِ الظُّهْرِ وَصَلاةِ الْعَصْرِ، فَأُنْزِلَ إِلَى الأَرْضِ وَكَانَ مُكْثُهُ فِي الْجَنَّةِ نصف يوم يوم من ايام الآخرة، وهو خمسمائة سَنَةٍ، مِنْ يَوْمٍ كَانَ مِقْدَارُهُ اثْنَتَيْ عَشْرَةَ سَاعَةً، وَالْيَوْمُ أَلْفُ سَنَةٍ مِمَّا يَعُدُّ أَهْلُ الدُّنْيَا، وَهَذَا أَيْضًا قَوْلٌ خِلافُ مَا وَرَدَتْ به الاخبار عن رسول الله ص، وَعَنِ السَّلَفِ مِنْ عُلَمَائِنَا.","bs":"Pričao mi je Haris ibn Muhammed, koji je rekao: pričao nam je Muhammed ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Adem je izašao iz Dženneta između dva namaza: podne-namaza i ikindije. Spušten je na Zemlju, a u Džennetu je boravio pola dana, jednog od dana budućeg svijeta. To je pet stotina godina, od dana koji traje dvanaest sati, a dan je hiljadu godina kakve stanovnici ovoga svijeta broje.“ I ovo mišljenje suprotno je onome što je došlo u predajama od Allahovog Poslanika, sallallahu alejhi ve sellem, i od učenih prethodnika među našim učenjacima.","ar_ranges":[[7,188]],"ar_html":"وَقَدْ \u003cspan class=\"isnad\">حَدَّثَنِي الْحَارِثُ بْنُ مُحَمَّدٍ، قَالَ: حَدَّثَنَا مُحَمَّدُ بْنُ سَعْدٍ، قَالَ:\nحَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، قَالَ: أخبرني أبي، عن أبي صالح، عَنِ ابْنِ عَبَّاسٍ، قَالَ: \u003c/span>خَرَجَ آدَمُ مِنَ الْجَنَّةِ بَيْنَ الصَّلاتَيْنِ: صَلاةِ الظُّهْرِ وَصَلاةِ الْعَصْرِ، فَأُنْزِلَ إِلَى الأَرْضِ وَكَانَ مُكْثُهُ فِي الْجَنَّةِ نصف يوم يوم من ايام الآخرة، وهو خمسمائة سَنَةٍ، مِنْ يَوْمٍ كَانَ مِقْدَارُهُ اثْنَتَيْ عَشْرَةَ سَاعَةً، وَالْيَوْمُ أَلْفُ سَنَةٍ مِمَّا يَعُدُّ أَهْلُ الدُّنْيَا، وَهَذَا أَيْضًا قَوْلٌ خِلافُ مَا وَرَدَتْ به الاخبار عن رسول الله ص، وَعَنِ السَّلَفِ مِنْ عُلَمَائِنَا.","bs_ranges":[[0,215]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Haris ibn Muhammed, koji je rekao: pričao nam je Muhammed ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, koji je rekao: obavijestio me moj otac, od Ebu Saliha, od Ibn Abbasa, koji je rekao: \u003c/span>„Adem je izašao iz Dženneta između dva namaza: podne-namaza i ikindije. Spušten je na Zemlju, a u Džennetu je boravio pola dana, jednog od dana budućeg svijeta. To je pet stotina godina, od dana koji traje dvanaest sati, a dan je hiljadu godina kakve stanovnici ovoga svijeta broje.“ I ovo mišljenje suprotno je onome što je došlo u predajama od Allahovog Poslanika, sallallahu alejhi ve sellem, i od učenih prethodnika među našim učenjacima."}],"notes":[]},{"n":121,"ar":"القول في الموضع الذي أهبط آدم وحواء إليه من الأرض حين أهبطا إليها\n\nثم إن الله عز وجل أهبط آدم قبل غروب الشمس من اليوم الذي خلقه فيه- وذلك يوم الجمعة- من السماء مع زوجته، وأنزل آدم- فيما قال علماء سلف أمة نبينا ص- بالهند.\n\nذكر من حضرنا ذكره ممن قال ذلك منهم:\n٢٢٠- حَدَّثَنَا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال:\n\nأخبرنا معمر، عن قتادة، قال: أهبط الله عز وجل آدم إلى الأرض، وكان مهبطه بأرض الهند.\n\nحَدَّثَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ: حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، قَالَ: أَخْبَرَنَا عَطَاءُ بْنُ السَّائِبِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: إِنَّ أَوَّلَ مَا أَهْبَطَ اللَّهُ تَعَالَى آدَمَ أهبطه بدهنا أَرْضِ الْهِنْدِ.\nحدثت عن عمار، قال: حَدَّثَنَا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أنس، عن أبي العالية، قال: أهبط آدم إلى الهند.\n\nحَدَّثَنِي ابْنُ سِنَانٍ، قَالَ: حَدَّثَنَا الْحَجَّاجُ، قَالَ: حَدَّثَنَا حَمَّادُ بن سلمة، عن عَلِيُّ بْنُ زَيْدٍ، عَنْ يُوسُفَ بْنِ مِهْرَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\n[قال على بن ابى طالب ع: أَطْيَبُ أَرْضٍ فِي الأَرْضِ رِيحًا أَرْضُ الْهِنْدِ، أُهْبِطَ بِهَا آدَمُ، فَعَلِقَ شَجَرُهَا مِنْ رِيحِ الْجَنَّةِ] .\nحَدَّثَنِي الْحَارِثُ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: حَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، عَنْ أَبِيهِ، عن أبي صالح، عن ابن عباس، قال: أُهْبِطَ آدَمُ بِالْهِنْدِ، وَحَوَّاءُ بِجِدَّةَ، فَجَاءَ فِي طَلَبِهَا حَتَّى اجْتَمَعَا، فَازْدَلَفَتْ إِلَيْهِ حَوَّاءُ، فَلِذَلِكَ","bs":"\u003cp data-paragraph=\"121.1\">Rasprava o mjestu na Zemlji na koje su Adem i Havva spušteni kada su spušteni na nju\u003c/p>\u003cp data-paragraph=\"121.2\">Zatim je Allah, Silan i Uzvišen, prije zalaska Sunca onoga dana kada ga je stvorio — a to je bio petak — spustio Adema s neba zajedno s njegovom suprugom. Prema riječima učenih prethodnika iz ummeta našeg Vjerovjesnika, sallallahu alejhi ve sellem, Adema je spustio u Indiju.\u003c/p>\u003cp data-paragraph=\"121.3\">Spomen onih koji su to rekli, a kojih se sada sjećamo:\u003c/p>\u003cp data-paragraph=\"121.4\">220 — Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, koji je rekao: „Allah, Silan i Uzvišen, spustio je Adema na Zemlju, a njegovo mjesto spuštanja bilo je u zemlji Indiji.“\u003c/p>\u003cp data-paragraph=\"121.5\">Pričao nam je Amr ibn Ali, koji je rekao: pričao nam je Imran ibn Ujejna, koji je rekao: obavijestio nas je Ata ibn es-Saib, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Kada je Uzvišeni Allah prvi put spustio Adema, spustio ga je u Dehnu, u zemlji Indiji.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: toponim je u izvoru zapisan بدهنا, bez oznaka koje bi sigurno odredile izgovor.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"121.6\">Preneseno mi je od Ammara, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, od Ebu Alije, koji je rekao: „Adem je spušten u Indiju.“\u003c/p>\u003cp data-paragraph=\"121.7\">Pričao mi je Ibn Sinan, koji je rekao: pričao nam je Hadždžadž, koji je rekao: pričao nam je Hammad ibn Selema, od Alija ibn Zejda, od Jusufa ibn Mihrana, od Ibn Abbasa, koji je rekao: „Ali ibn Ebu Talib, alejhis-selam, rekao je: ‘Zemlja najljepšeg mirisa na Zemlji jeste Indija. U nju je spušten Adem, pa je njeno drveće upilo džennetski miris.’“\u003c/p>\u003cp data-paragraph=\"121.8\">Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, od svoga oca, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Adem je spušten u Indiju, a Havva u Džiddu. Krenuo ju je tražiti, sve dok se nisu sastali. Havva mu se približila, pa je zato\u003c/p>","paragraphs":[{"id":"121.1","ar":"القول في الموضع الذي أهبط آدم وحواء إليه من الأرض حين أهبطا إليها","bs":"Rasprava o mjestu na Zemlji na koje su Adem i Havva spušteni kada su spušteni na nju","ar_ranges":[],"ar_html":"القول في الموضع الذي أهبط آدم وحواء إليه من الأرض حين أهبطا إليها","bs_ranges":[],"bs_html":"Rasprava o mjestu na Zemlji na koje su Adem i Havva spušteni kada su spušteni na nju"},{"id":"121.2","ar":"ثم إن الله عز وجل أهبط آدم قبل غروب الشمس من اليوم الذي خلقه فيه- وذلك يوم الجمعة- من السماء مع زوجته، وأنزل آدم- فيما قال علماء سلف أمة نبينا ص- بالهند.","bs":"Zatim je Allah, Silan i Uzvišen, prije zalaska Sunca onoga dana kada ga je stvorio — a to je bio petak — spustio Adema s neba zajedno s njegovom suprugom. Prema riječima učenih prethodnika iz ummeta našeg Vjerovjesnika, sallallahu alejhi ve sellem, Adema je spustio u Indiju.","ar_ranges":[],"ar_html":"ثم إن الله عز وجل أهبط آدم قبل غروب الشمس من اليوم الذي خلقه فيه- وذلك يوم الجمعة- من السماء مع زوجته، وأنزل آدم- فيما قال علماء سلف أمة نبينا ص- بالهند.","bs_ranges":[],"bs_html":"Zatim je Allah, Silan i Uzvišen, prije zalaska Sunca onoga dana kada ga je stvorio — a to je bio petak — spustio Adema s neba zajedno s njegovom suprugom. Prema riječima učenih prethodnika iz ummeta našeg Vjerovjesnika, sallallahu alejhi ve sellem, Adema je spustio u Indiju."},{"id":"121.3","ar":"ذكر من حضرنا ذكره ممن قال ذلك منهم:","bs":"Spomen onih koji su to rekli, a kojih se sada sjećamo:","ar_ranges":[],"ar_html":"ذكر من حضرنا ذكره ممن قال ذلك منهم:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli, a kojih se sada sjećamo:"},{"id":"121.4","ar":"٢٢٠- حَدَّثَنَا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال:\n\nأخبرنا معمر، عن قتادة، قال: أهبط الله عز وجل آدم إلى الأرض، وكان مهبطه بأرض الهند.","bs":"220 — Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, koji je rekao: „Allah, Silan i Uzvišen, spustio je Adema na Zemlju, a njegovo mjesto spuštanja bilo je u zemlji Indiji.“","ar_ranges":[[5,89]],"ar_html":"٢٢٠- \u003cspan class=\"isnad\">حَدَّثَنَا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال:\n\nأخبرنا معمر، عن قتادة، قال: \u003c/span>أهبط الله عز وجل آدم إلى الأرض، وكان مهبطه بأرض الهند.","bs_ranges":[[6,152]],"bs_html":"220 — \u003cspan class=\"isnad\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, koji je rekao: \u003c/span>„Allah, Silan i Uzvišen, spustio je Adema na Zemlju, a njegovo mjesto spuštanja bilo je u zemlji Indiji.“"},{"id":"121.5","ar":"حَدَّثَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ: حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، قَالَ: أَخْبَرَنَا عَطَاءُ بْنُ السَّائِبِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: إِنَّ أَوَّلَ مَا أَهْبَطَ اللَّهُ تَعَالَى آدَمَ أهبطه بدهنا أَرْضِ الْهِنْدِ.","bs":"Pričao nam je Amr ibn Ali, koji je rekao: pričao nam je Imran ibn Ujejna, koji je rekao: obavijestio nas je Ata ibn es-Saib, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: „Kada je Uzvišeni Allah prvi put spustio Adema, spustio ga je u Dehnu, u zemlji Indiji.“ ⟦Napomena prevodioca: toponim je u izvoru zapisan بدهنا, bez oznaka koje bi sigurno odredile izgovor.⟧","ar_ranges":[[0,176]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ: حَدَّثَنَا عِمْرَانُ بْنُ عُيَيْنَةَ، قَالَ: أَخْبَرَنَا عَطَاءُ بْنُ السَّائِبِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، قال: \u003c/span>إِنَّ أَوَّلَ مَا أَهْبَطَ اللَّهُ تَعَالَى آدَمَ أهبطه بدهنا أَرْضِ الْهِنْدِ.","bs_ranges":[[0,178]],"bs_html":"\u003cspan class=\"isnad\">Pričao nam je Amr ibn Ali, koji je rekao: pričao nam je Imran ibn Ujejna, koji je rekao: obavijestio nas je Ata ibn es-Saib, od Seida ibn Džubejra, od Ibn Abbasa, koji je rekao: \u003c/span>„Kada je Uzvišeni Allah prvi put spustio Adema, spustio ga je u Dehnu, u zemlji Indiji.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: toponim je u izvoru zapisan بدهنا, bez oznaka koje bi sigurno odredile izgovor.⟧\u003c/span>"},{"id":"121.6","ar":"حدثت عن عمار، قال: حَدَّثَنَا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أنس، عن أبي العالية، قال: أهبط آدم إلى الهند.","bs":"Preneseno mi je od Ammara, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, od Ebu Alije, koji je rekao: „Adem je spušten u Indiju.“","ar_ranges":[[0,100]],"ar_html":"\u003cspan class=\"isnad\">حدثت عن عمار، قال: حَدَّثَنَا عبد الله بن أبي جعفر، عن أبيه، عن الربيع بن أنس، عن أبي العالية، قال: \u003c/span>أهبط آدم إلى الهند.","bs_ranges":[[0,144]],"bs_html":"\u003cspan class=\"isnad\">Preneseno mi je od Ammara, koji je rekao: pričao nam je Abdullah ibn Ebu Džafer, od svoga oca, od Rebie ibn Enesa, od Ebu Alije, koji je rekao: \u003c/span>„Adem je spušten u Indiju.“"},{"id":"121.7","ar":"حَدَّثَنِي ابْنُ سِنَانٍ، قَالَ: حَدَّثَنَا الْحَجَّاجُ، قَالَ: حَدَّثَنَا حَمَّادُ بن سلمة، عن عَلِيُّ بْنُ زَيْدٍ، عَنْ يُوسُفَ بْنِ مِهْرَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\n[قال على بن ابى طالب ع: أَطْيَبُ أَرْضٍ فِي الأَرْضِ رِيحًا أَرْضُ الْهِنْدِ، أُهْبِطَ بِهَا آدَمُ، فَعَلِقَ شَجَرُهَا مِنْ رِيحِ الْجَنَّةِ] .","bs":"Pričao mi je Ibn Sinan, koji je rekao: pričao nam je Hadždžadž, koji je rekao: pričao nam je Hammad ibn Selema, od Alija ibn Zejda, od Jusufa ibn Mihrana, od Ibn Abbasa, koji je rekao: „Ali ibn Ebu Talib, alejhis-selam, rekao je: ‘Zemlja najljepšeg mirisa na Zemlji jeste Indija. U nju je spušten Adem, pa je njeno drveće upilo džennetski miris.’“","ar_ranges":[[0,199]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي ابْنُ سِنَانٍ، قَالَ: حَدَّثَنَا الْحَجَّاجُ، قَالَ: حَدَّثَنَا حَمَّادُ بن سلمة، عن عَلِيُّ بْنُ زَيْدٍ، عَنْ يُوسُفَ بْنِ مِهْرَانَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ:\n\n[قال على بن ابى طالب ع: \u003c/span>أَطْيَبُ أَرْضٍ فِي الأَرْضِ رِيحًا أَرْضُ الْهِنْدِ، أُهْبِطَ بِهَا آدَمُ، فَعَلِقَ شَجَرُهَا مِنْ رِيحِ الْجَنَّةِ] .","bs_ranges":[[0,185]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Ibn Sinan, koji je rekao: pričao nam je Hadždžadž, koji je rekao: pričao nam je Hammad ibn Selema, od Alija ibn Zejda, od Jusufa ibn Mihrana, od Ibn Abbasa, koji je rekao: \u003c/span>„Ali ibn Ebu Talib, alejhis-selam, rekao je: ‘Zemlja najljepšeg mirisa na Zemlji jeste Indija. U nju je spušten Adem, pa je njeno drveće upilo džennetski miris.’“"},{"id":"121.8","ar":"حَدَّثَنِي الْحَارِثُ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: حَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، عَنْ أَبِيهِ، عن أبي صالح، عن ابن عباس، قال: أُهْبِطَ آدَمُ بِالْهِنْدِ، وَحَوَّاءُ بِجِدَّةَ، فَجَاءَ فِي طَلَبِهَا حَتَّى اجْتَمَعَا، فَازْدَلَفَتْ إِلَيْهِ حَوَّاءُ، فَلِذَلِكَ","bs":"Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, od svoga oca, od Ebu Saliha, od Ibn Abbasa, koji je rekao: „Adem je spušten u Indiju, a Havva u Džiddu. Krenuo ju je tražiti, sve dok se nisu sastali. Havva mu se približila, pa je zato","ar_ranges":[[0,142]],"ar_html":"\u003cspan class=\"isnad\">حَدَّثَنِي الْحَارِثُ، قَالَ: حَدَّثَنَا ابْنُ سَعْدٍ، قَالَ: حَدَّثَنَا هِشَامُ بْنُ مُحَمَّدٍ، عَنْ أَبِيهِ، عن أبي صالح، عن ابن عباس، قال: \u003c/span>أُهْبِطَ آدَمُ بِالْهِنْدِ، وَحَوَّاءُ بِجِدَّةَ، فَجَاءَ فِي طَلَبِهَا حَتَّى اجْتَمَعَا، فَازْدَلَفَتْ إِلَيْهِ حَوَّاءُ، فَلِذَلِكَ","bs_ranges":[[0,167]],"bs_html":"\u003cspan class=\"isnad\">Pričao mi je Haris, koji je rekao: pričao nam je Ibn Sa‘d, koji je rekao: pričao nam je Hišam ibn Muhammed, od svoga oca, od Ebu Saliha, od Ibn Abbasa, koji je rekao: \u003c/span>„Adem je spušten u Indiju, a Havva u Džiddu. Krenuo ju je tražiti, sve dok se nisu sastali. Havva mu se približila, pa je zato"}],"notes":[]},{"n":122,"ar":"سُمِّيَتِ الْمُزْدَلِفَةَ، وَتَعَارَفَا بِعَرَفَاتٍ، فَلِذَلِكَ سُمِّيَتْ عَرَفَاتٍ، وَاجْتَمَعَا بِجَمْعٍ فَلِذَلِكَ سُمِّيَتْ جَمْعًا قَالَ: وَأُهْبِطَ آدَمُ عَلَى جَبَلٍ بِالْهِنْدِ يُقَالُ لَهُ بُوذُ.\nحدثنا أبو همام، قال: حدثني أبي، قال: حَدَّثَنَا زِيَادُ بْنُ خَيْثَمَةَ، عَنْ أَبِي يَحْيَى بَائِعِ الْقَتِّ، قَالَ: قَالَ لِي مُجَاهِدٌ: لَقَدْ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبَّاسٍ أَنَّ آدَمَ نَزَلَ حِينَ نَزَلَ بِالْهِنْدِ.\n\nحَدَّثَنَا ابن حميد، قال: حَدَّثَنَا سلمة، عن ابن إسحاق، قال: وأما أهل التوراة فإنهم قالوا: أهبط آدم بالهند على جبل يقال له واسم، عند وإذ يقال له بهيل بين الدهنج والمندل: بلدين بأرض الهند قالوا:\n\nوأهبطت حواء بجدة من أرض مكة.\nوقال آخرون: بل أهبط آدم بسرنديب، على جبل يدعى بوذ، وحواء بجدة من أرض مكة، وإبليس بميسان، والحية بأصبهان وقد قيل: أهبطت الحية بالبرية، وإبليس بساحل بحر الأيلة.\nوهذا مما لا يوصل إلى علم صحته إلا بخبر يجيء مجيء الحجة، ولا يعلم خبر في ذلك ورد كذلك، غير ما ورد من خبر هبوط آدم بأرض الهند، فإن ذلك مما لا يدفع صحته علماء الإسلام وأهل التوراة والإنجيل، والحجة قد ثبتت بأخبار بعض هؤلاء وذكر أن الجبل الذي اهبط عليه آدم ع ذروته من أقرب ذرا جبال الأرض إلى السماء، وأن آدم حين أهبط عليه كانت رجلاه عليه ورأسه في السماء يسمع دعاء الملائكة وتسبيحهم، فكان آدم يأنس بذلك، وكانت","bs":"\u003cp data-paragraph=\"122.1\">nazvana Muzdelifa. Prepoznali su se na Arefatu, pa je zato nazvan Arefatom. Sastali su se u Džem‘u, pa je zato nazvan Džem‘om.“ Rekao je: „Adem je spušten na planinu u Indiji koja se zove Buz.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: ime planine u izvoru glasi بوذ; izgovor je prenesen približno.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"122.2\">Pričao nam je Ebu Hemmam, koji je rekao: pričao mi je moj otac, koji je rekao: pričao nam je Zijad ibn Hajsema, od Ebu Jahjaa, prodavača krme, koji je rekao: Mudžahid mi je rekao: „Pričao nam je Abdullah ibn Abbas da je Adem, kada je spušten, spušten u Indiju.“\u003c/p>\u003cp data-paragraph=\"122.3\">Pričao nam je Ibn Humejd, koji je rekao: pričao nam je Selema, od Ibn Ishaka, koji je rekao: „Sljedbenici Tevrata kazali su: Adem je spušten u Indiju, na planinu koja se zove Vasim, kod doline koja se naziva Behil, između Dehendža i Mendela, dvaju mjesta u zemlji Indiji. Rekli su: Havva je spuštena u Džiddu, u mekanskom kraju.“ \u003cspan class=\"translator-note\">⟦Napomena prevodioca: imena واسم، بهيل، الدهنج، المندل prenesena su približno, jer nemaju sigurno označen izgovor. Izvor između prvih dvaju imena ima عند وإذ, što je nejasan zapis; „kod doline“ kontekstualno je čitanje koje treba provjeriti u štampanom izdanju.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"122.4\">Drugi su rekli: „Naprotiv, Adem je spušten na Serendib, na planinu koja se zove Buz, Havva u Džiddu u mekanskom kraju, Iblis u Mejsan, a zmija u Isfahan.“ Rečeno je i da je zmija spuštena u pustinju, a Iblis na obalu mora Ejle.\u003c/p>\u003cp data-paragraph=\"122.5\">Ovo pripada onome čija se tačnost ne može spoznati osim predajom koja ima dokaznu snagu. Nije poznata takva predaja o tome, osim predaje o Ademovom spuštanju u Indiju. Njenu tačnost ne odbacuju islamski učenjaci niti sljedbenici Tevrata i Indžila, a dokaz je uspostavljen izvješćima nekih od njih. Navedeno je da je vrh planine na koju je Adem, alejhis-selam, spušten jedan od zemaljskih planinskih vrhova najbližih nebu. Kada je Adem spušten na nju, njegove su noge bile na njoj, a glava na nebu; čuo je dove i slavljenje meleka i to mu je pružalo prisnost. Meleki su ga se\u003c/p>","paragraphs":[{"id":"122.1","ar":"سُمِّيَتِ الْمُزْدَلِفَةَ، وَتَعَارَفَا بِعَرَفَاتٍ، فَلِذَلِكَ سُمِّيَتْ عَرَفَاتٍ، وَاجْتَمَعَا بِجَمْعٍ فَلِذَلِكَ سُمِّيَتْ جَمْعًا قَالَ: وَأُهْبِطَ آدَمُ عَلَى جَبَلٍ بِالْهِنْدِ يُقَالُ لَهُ بُوذُ.","bs":"nazvana Muzdelifa. Prepoznali su se na Arefatu, pa je zato nazvan Arefatom. Sastali su se u  عليه كانت رجلاه عليه ورأسه في السماء يسمع دعاء الملائكة وتسبيحهم، فكان آدم يأنس بذلك، وكانت","bs_ranges":[],"bs_html":"Ovo pripada onome čija se tačnost ne može spoznati osim predajom koja ima dokaznu snagu. Nije poznata takva predaja o tome, osim predaje o Ademovom spuštanju u Indiju. Njenu tačnost ne odbacuju islamski učenjaci niti sljedbenici Tevrata i Indžila, a dokaz je uspostavljen izvješćima nekih od njih. Navedeno je da je vrh planine na koju je Adem, alejhis-selam, spušten jedan od zemaljskih planinskih vrhova najbližih nebu. Kada je Adem spušten na nju, njegove su noge bile na njoj, a glava na nebu; čuo je dove i slavljenje meleka i to mu je pružalo prisnost. Meleki su ga se"}],"notes":[]},{"n":123,"ar":"الملائكة تهابه، فنقص من طول آدم لذلك.\n\nذِكْرُ مَنْ قَالَ ذَلِكَ:\nحَدَّثَنَا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا هشام بن حسان، عن سوار ختن عطاء، عن عطاء بن أبي رباح، قال: لما أهبط الله عز وجل آدم من الجنة كان رجلاه في الأرض، ورأسه في السماء، يسمع كلام أهل السماء ودعاءهم، يأنس إليهم، فهابته الملائكة حتى شكت إلى الله تعالى في دعائها وفي صلاتها، فخفضه الى الارض، فلما فقد ما كان يسمع منهم استوحش حتى شكا ذلك إلى الله عز وجل في دعائه وفي صلاته، فوجه إلى مكة فصار موضع قدمه قرية، وخطوته مفازة، حتى انتهى إلى مكة، وأنزل الله تعالى ياقوتة من ياقوت الجنة، فكانت على موضع البيت الآن، فلم يزل يطوف به حتى أنزل الله تعالى الطوفان، فرفعت تلك الياقوتة حتى بعث الله تعالى ابراهيم الخليل ع فبناه، فذلك قوله تعالى:\n«وَإِذْ بَوَّأْنا لِإِبْراهِيمَ مَكانَ الْبَيْتِ» .\nحدثنا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا معمر، عن قتادة، قال: وضع الله تعالى البيت مع آدم، فكان رأسه في السماء ورجلاه في الأرض، فكانت الملائكة تهابه، فنقص إلى ستين ذراعا، فحزن آدم إذ فقد أصوات الملائكة وتسبيحهم، فشكا ذلك إلى الله، فقال الله: يا آدم، إني أهبطت لك بيتا تطوف به كما يطاف حول عرشي، وتصلي عنده كما يصلى عند عرشي فانطلق اليه آدم ع، فخرج ومد له في خطوه، فكان بين كل خطوة مفازة، فلم تزل تلك المفاوز بعد ذلك، فاتى آدم ع البيت، فطاف به ومن بعده من الأنبياء","bs":"\u003cp data-paragraph=\"123.1\">bojali, pa je zbog toga Ademova visina smanjena.\u003c/p>\u003cp data-paragraph=\"123.2\">Spomen onih koji su to rekli:\u003c/p>\u003cp data-paragraph=\"123.3\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Hišam ibn Hassan, od Sevvara, Ataovog zeta, od Ataa ibn Ebu Rebaha, koji je rekao: „Kada je Allah, Silan i Uzvišen, spustio Adema iz Dženneta, noge su mu bile na Zemlji, a glava na nebu. Slušao je govor stanovnika neba i njihove dove i osjećao prisnost prema njima. Meleki su ga se bojali toliko da su se Uzvišenom Allahu požalili u svojim dovama i namazima, pa ga je spustio na Zemlju. Kada više nije čuo ono što je od njih slušao, osjetio je osamljenost, pa se Allahu, Silnom i Uzvišenom, požalio u svojoj dovi i namazu. Usmjeren je prema Meki. Mjesto svakog njegovog stopala postalo je naselje, a prostor njegova koraka pustara, sve dok nije stigao u Meku. Uzvišeni Allah spustio je rubin od džennetskih rubina, pa je bio na mjestu na kojem je sada Hram. Neprestano ga je obilazio, sve dok Uzvišeni Allah nije poslao Potop. Tada je taj rubin podignut, sve dok Uzvišeni Allah nije poslao Ibrahima, prisnog prijatelja, alejhis-selam, pa ga je on izgradio. To su Njegove, Uzvišeni je On, riječi: ‘I kada smo Ibrahimu odredili mjesto Hrama.’“ \u003cspan class=\"translator-note\">⟦Prijevod kur’anskog navoda: El-Hadždž, 22:26, navedeni dio.⟧\u003c/span>\u003c/p>\u003cp data-paragraph=\"123.4\">Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Ma‘mer, od Katade, koji je rekao: „Uzvišeni Allah postavio je Hram zajedno s Ademom. Njegova glava bila je na nebu, a noge na Zemlji. Meleki su ga se bojali, pa je smanjen na šezdeset lakata. Adem se rastužio kada više nije čuo glasove meleka i njihovo slavljenje, pa se požalio Allahu. Allah je rekao: ‘Ademe, spustio sam ti Hram koji ćeš obilaziti kao što se obilazi oko Moga Arša i kod kojeg ćeš klanjati kao što se klanja kod Moga Arša.’ Adem, alejhis-selam, krenuo je prema njemu. Izašao je, a njegov korak učinjen je dugim; između svaka dva koraka bila je pustara. Te su pustare ostale i poslije toga. Adem, alejhis-selam, došao je Hramu i obilazio ga, kao i vjerovjesnici poslije njega.“\u003c/p>","paragraphs":[{"id":"123.1","ar":"الملائكة تهابه، فنقص من طول آدم لذلك.","bs":"bojali, pa je zbog toga Ademova visina smanjena.","ar_ranges":[],"ar_html":"الملائكة تهابه، فنقص من طول آدم لذلك.","bs_ranges":[],"bs_html":"bojali, pa je zbog toga Ademova visina smanjena."},{"id":"123.2","ar":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs":"Spomen onih koji su to rekli:","ar_ranges":[],"ar_html":"ذِكْرُ مَنْ قَالَ ذَلِكَ:","bs_ranges":[],"bs_html":"Spomen onih koji su to rekli:"},{"id":"123.3","ar":"حَدَّثَنَا الحسن بن يحيى، قال: أخبرنا عبد الرزاق، قال: أخبرنا هشام بن حسان، عن سوار ختن عطاء، عن عطاء بن أبي رباح، قال: لما أهبط الله عز وجل آدم من الجنة كان رجلاه في الأرض، ورأسه في السماء، يسمع كلام أهل السماء ودعاءهم، يأنس إليهم، فهابته الملائكة حتى شكت إلى الله تعالى في دعائها وفي صلاتها، فخفضه الى الارض، فلما فقد ما كان يسمع منهم استوحش حتى شكا ذلك إلى الله عز وجل في دعائه وفي صلاته، فوجه إلى مكة فصار موضع قدمه قرية، وخطوته مفازة، حتى انتهى إلى مكة، وأنزل الله تعالى ياقوتة من ياقوت الجنة، فكانت على موضع البيت الآن، فلم يزل يطوف به حتى أنزل الله تعالى الطوفان، فرفعت تلك الياقوتة حتى بعث الله تعالى ابراهيم الخليل ع فبناه، فذلك قوله تعالى:\n«وَإِذْ بَوَّأْنا لِإِبْراهِيمَ مَكانَ الْبَيْتِ» .","bs":"Pričao nam je Hasen ibn Jahja, koji je rekao: obavijestio nas je Abdurrezzak, koji je rekao: obavijestio nas je Hišam ibn Hassan, od Sevvara, Ataovog zeta, od Ataa ibn Ebu Rebaha, koji je rekao: „Kada je Allah, Silan i Uzvišen, spustio Adema iz Dženneta, noge su mu bile na Zemlji, a glava na nebu. Slušao je govor stanovnika neba i njihove dove i osjećao prisnost prema njima. Meleki su ga se bojali toliko da su se Uzvišenom Allahu požalili u svojim dovama i namazima, pa ga je spustio na Zemlju. Kada
