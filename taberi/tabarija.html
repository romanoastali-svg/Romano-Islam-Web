<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historia Tabaria</title>
<script>
  const target = new URL('https://app.romano-islam.de/taberi/historija.html#historija');
  const savedPage = new URLSearchParams(location.search).get('page') || /^#stranica-(\d+)$/.exec(location.hash)?.[1];
  if (/^\d+$/.test(savedPage || '')) target.searchParams.set('page', savedPage);
  location.replace(target.href);
</script>
</head>
<body><a href="https://app.romano-islam.de/taberi/historija.html#historija">Otvori Historia Tabaria</a></body>
</html>
