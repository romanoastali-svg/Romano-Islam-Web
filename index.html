<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#063b2d">
<meta name="description" content="ROMANO ISLAM — Kur’an, ilm, historija i vodiči.">
<title>ROMANO ISLAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<style>
:root{
  --green:#0a5b43;
  --green-dark:#042f25;
  --gold:#b48b2f;
  --gold-soft:#d9c081;
  --paper:#f7f3e7;
  --paper-2:#fbf9f1;
  --ink:#173127;
  --line:#e1d7be;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper-2);color:var(--ink);font-family:'Cormorant Garamond', Georgia, serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}

.masthead{
  height:342px;
  background:#042f25 url('header.jpg') center center/cover no-repeat;
}

.navwrap{
  background:#fbfaf6;
  border-top:1px solid #e8dfcd;
  border-bottom:1px solid #e8dfcd;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.nav{
  max-width:1536px;
  margin:0 auto;
  padding:8px 12px;
  display:flex;
  justify-content:center;
  gap:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:54px;
  padding:12px 22px;
  border:1px solid #e5dccb;
  border-right:none;
  background:transparent;
  color:#1a3128;
  font-size:18px;
  display:flex;
  align-items:center;
  gap:9px;
  white-space:nowrap;
}
.nav button:first-child{border-radius:24px 0 0 24px}
.nav button:last-child{border-right:1px solid #e5dccb;border-radius:0 24px 24px 0}
.nav button[aria-current="page"]{
  background:var(--green);
  color:#fff;
}
.nav i{font-size:15px;opacity:.95}
.brand-logo{display:flex;align-items:center;justify-content:center;flex:none;padding:3px 8px 3px 15px}.brand-logo img{width:48px;height:48px;object-fit:contain;border-radius:50%;background:white;border:1px solid #d6bd73}

.hero{
  min-height:470px;
  display:flex;
  align-items:center;
  background:
   linear-gradient(90deg, rgba(251,246,232,.96) 0%, rgba(251,246,232,.90) 22%, rgba(251,246,232,.60) 43%, rgba(251,246,232,.18) 68%, rgba(251,246,232,0) 86%),
   url('hero.jpg') center center/cover no-repeat;
}
.hero-inner{
  width:100%;
  max-width:1536px;
  margin:0 auto;
  padding:44px 48px 30px 78px;
}
.welcome{
  margin:0;
  color:#08392e;
  font-size:29px;
  line-height:1.05;
  font-weight:600;
}
.hero h1{
  margin:2px 0 2px;
  font-family:'Cinzel', Georgia, serif;
  font-size:74px;
  line-height:.98;
  color:#08392e;
  letter-spacing:1px;
  max-width:610px;
}
.tagline{
  margin:6px 0 22px;
  color:#243d34;
  font-size:24px;
}
.ornament{
  width:320px;height:1px;background:#c5a861;position:relative;margin:12px 0 18px 0;
}
.ornament:after{
  content:'✧';
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:42px;height:28px;display:flex;align-items:center;justify-content:center;
  background:#efe5c6;color:#b08b2f;font-size:20px;
}
.verse{
  max-width:420px;
  font-size:24px;
  line-height:1.14;
  font-style:italic;
  color:#213930;
}
.verse small{display:block;font-style:normal;font-size:.84em;margin-top:6px}
.cta{
  margin-top:22px;
  border:none;
  border-radius:28px;
  padding:16px 34px;
  background:var(--green);
  color:#fff;
  font-size:24px;
  box-shadow:0 3px 10px rgba(0,0,0,.12);
  display:inline-flex;align-items:center;gap:12px;
}

.tiles{
  max-width:1536px;
  margin:0 auto;
  padding:18px 24px 30px;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:14px;
}
.tile{
  min-height:142px;
  background:linear-gradient(180deg,#fbf8f0,#f7f2e8);
  border:1px solid #dcc897;
  border-radius:12px;
  padding:18px 10px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:7px;
}
.tile i{font-size:31px;color:#b08b2f}
.tile strong{font-size:21px;line-height:1.05;color:#1f2f28}
.tile span:last-child{font-size:16px;line-height:1.1;color:#3d4a44}

.content{max-width:1100px;margin:0 auto;padding:32px 24px 54px}
.section-card{background:#fff;border:1px solid #e5d6af;border-radius:14px;padding:28px;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.section-hero{padding:44px 24px;background:linear-gradient(135deg,#0c5a43,#063729);color:#fff;text-align:center}
.section-hero h1{margin:0;font-family:'Cinzel',serif;font-size:54px}
.section-hero p{margin:8px 0 0;font-size:22px;color:#eadcad}
.back{display:inline-block;margin-bottom:22px;background:none;border:none;color:#0b654a;text-decoration:underline;font-size:19px}
.hidden{display:none!important}
footer{background:#062d23;color:#eadcad;text-align:center;padding:25px 16px;font-size:17px}

@media (max-width:1200px){
  .masthead{height:260px}
  .hero-inner{padding-left:46px}
  .hero h1{font-size:62px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .nav{justify-content:flex-start}
}
@media (max-width:760px){
  .masthead{height:175px;background-size:cover;background-position:center}
  .nav{padding:8px}.brand-logo img{width:40px;height:40px}
  .nav button{padding:12px 16px;font-size:16px;min-height:48px}
  .hero{min-height:560px;background-position:center right 60%;background-image:linear-gradient(90deg, rgba(251,246,232,.97) 0%, rgba(251,246,232,.88) 50%, rgba(251,246,232,.55) 70%, rgba(251,246,232,.15) 100%), url('hero.jpg')}
  .hero-inner{padding:34px 22px 22px}
  .welcome{font-size:28px}
  .hero h1{font-size:55px;max-width:330px}
  .tagline{font-size:21px;max-width:350px}
  .verse{font-size:21px;max-width:350px}
  .cta{font-size:20px;padding:14px 24px}
  .tiles{grid-template-columns:repeat(2,1fr);padding:14px 12px 24px;gap:10px}
  .tile{min-height:126px}
  .tile strong{font-size:19px}
  .tile span:last-child{font-size:14px}
}
</style>
</head>
<body>
<header class="masthead" aria-label="ROMANO ISLAM zaglavlje"></header>
<div class="navwrap">
  <nav class="nav" id="navigation" aria-label="Glavni meni">
    <button data-page="home" aria-current="page"><i class="fa-solid fa-house"></i>Početna</button>
    <button data-page="quran"><i class="fa-solid fa-book-quran"></i>Kur’an</button>
    <button data-page="tafsir"><i class="fa-regular fa-file-lines"></i>Tefsir</button>
    <button data-page="ehlibejt"><i class="fa-solid fa-users"></i>Ehli Bejt</button>
    <button data-page="poslanici"><i class="fa-solid fa-mosque"></i>Poslanici</button>
    <button data-page="historija"><i class="fa-solid fa-hourglass-half"></i>Historija</button>
    <button data-page="vodici"><i class="fa-solid fa-list"></i>Vodiči</button>
    <button data-page="preuzimanje"><i class="fa-solid fa-download"></i>Preuzimanje</button>
    <button data-page="onama"><i class="fa-solid fa-circle-info"></i>O nama</button>
    <a class="brand-logo" href="#home" aria-label="ROMANO ISLAM logo, početna"><img src="logo.jpg" alt="ROMANO ISLAM logo"></a>
  </nav>
</div>

<main id="homePage">
  <section class="hero">
    <div class="hero-inner">
      <p class="welcome">Dobro došli na</p>
      <h1>ROMANO ISLAM</h1>
      <p class="tagline">Kur’an je naš vodič – znanje je naša snaga</p>
      <div class="ornament"></div>
      <div class="verse">„O vi koji vjerujete, bojte se Allaha i tražite sredstvo Njegovoj blizini.“<small>(El-Maide, 5:35)</small></div>
      <button class="cta" data-page="quran"><i class="fa-solid fa-book-quran"></i>Čitaj Kur’an</button>
    </div>
  </section>

  <section class="tiles" aria-label="Rubrike">
    <button class="tile" data-page="quran"><i class="fa-solid fa-book-quran"></i><strong>Kur’an</strong><span>Čitaj, uči i istražuj</span></button>
    <button class="tile" data-page="tafsir"><i class="fa-regular fa-file-lines"></i><strong>Tefsir</strong><span>Objašnjenje ajeta</span></button>
    <button class="tile" data-page="ehlibejt"><i class="fa-solid fa-users"></i><strong>Ehli Bejt</strong><span>Znanje i smjernice</span></button>
    <button class="tile" data-page="poslanici"><i class="fa-solid fa-mosque"></i><strong>Poslanici</strong><span>Životi i poruke</span></button>
    <button class="tile" data-page="historija"><i class="fa-solid fa-hourglass-half"></i><strong>Historija</strong><span>Događaji i pouke</span></button>
    <button class="tile" data-page="vodici"><i class="fa-solid fa-list"></i><strong>Vodiči</strong><span>Praktične smjernice</span></button>
    <button class="tile" data-page="preuzimanje"><i class="fa-solid fa-download"></i><strong>Preuzimanje</strong><span>Knjige i materijali</span></button>
  </section>
</main>

<main id="sectionPage" class="hidden">
  <div class="section-hero"><h1 id="sectionTitle">Kur’an</h1><p id="sectionSubtitle"></p></div>
  <div class="content">
    <button class="back" data-page="home">← Povratak na početnu</button>
    <div class="section-card" id="sectionBody"></div>
  </div>
</main>

<footer><img src="logo.jpg" alt="ROMANO ISLAM logo" style="width:90px;height:79px;object-fit:contain;background:white;border-radius:12px;display:block;margin:0 auto 12px">ROMANO ISLAM · Kur’an · Ilm · Historija · Vodiči</footer>

<script>
const sections={
  quran:{title:'Kur’an',subtitle:'Čitaj, uči i istražuj',body:'<h3>Kur’an</h3><p>Ovdje će biti sadržaj za čitanje i istraživanje Kur’ana.</p>'},
  tafsir:{title:'Tefsir',subtitle:'Objašnjenje ajeta',body:'<h3>Tefsir</h3><p>Ovdje će biti objašnjenja ajeta.</p>'},
  ehlibejt:{title:'Ehli Bejt',subtitle:'Znanje i smjernice',body:'<h3>Ehli Bejt</h3><p>Ovdje će biti sadržaji o Ehli Bejtu.</p>'},
  poslanici:{title:'Poslanici',subtitle:'Životi i poruke',body:'<h3>Poslanici</h3><p>Ovdje će biti sadržaji o poslanicima.</p>'},
  historija:{title:'Historija',subtitle:'Događaji i pouke',body:'<h3>Historija</h3><p>Ovdje će biti historijski sadržaji.</p>'},
  vodici:{title:'Vodiči',subtitle:'Praktične smjernice',body:'<h3>Vodiči</h3><p>Ovdje će biti vodiči i smjernice.</p>'},
  preuzimanje:{title:'Preuzimanje',subtitle:'Knjige i materijali',body:'<h3>Preuzimanje</h3><p>Ovdje će biti materijali za preuzimanje.</p>'},
  onama:{title:'O nama',subtitle:'O projektu ROMANO ISLAM',body:'<h3>O nama</h3><p>ROMANO ISLAM je zasebna web-stranica.</p>'}
};
function go(page){
  if(page!=='home'&&!sections[page]) return;
  const home=page==='home';
  document.getElementById('homePage').classList.toggle('hidden',!home);
  document.getElementById('sectionPage').classList.toggle('hidden',home);
  document.querySelectorAll('#navigation [data-page]').forEach(el=>{
    if(el.dataset.page===page) el.setAttribute('aria-current','page');
    else el.removeAttribute('aria-current');
  });
  if(!home){
    const s=sections[page];
    document.getElementById('sectionTitle').textContent=s.title;
    document.getElementById('sectionSubtitle').textContent=s.subtitle;
    document.getElementById('sectionBody').innerHTML=s.body;
  }
  history.replaceState(null,'','#'+page);
  window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-page]');
  if(btn) go(btn.dataset.page);
});
document.querySelector('.brand-logo').addEventListener('click',e=>{e.preventDefault();go('home')});
const start=location.hash.slice(1);
if(start && sections[start]) go(start);
</script>
</body>
</html>
