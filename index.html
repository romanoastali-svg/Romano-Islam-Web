<style>
:root{--green:#064834;--dark:#032b21;--gold:#b38a2e;--paper:#fbf8f0;--ink:#15241e}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}button,input{font:inherit}button{cursor:pointer}a{color:inherit}.masthead{height:clamp(145px,19.85vw,305px);background:#003729 url('header.jpg') center/100% 100% no-repeat}.navwrap{background:#fbfaf6;border-bottom:1px solid #e4ddca;position:sticky;top:0;z-index:10;box-shadow:0 2px 9px #00000010}.nav{max-width:1500px;margin:auto;display:flex;justify-content:center;gap:0;padding:12px 18px;overflow-x:auto;scrollbar-width:thin}.nav button{border:1px solid #e8e1d5;border-right:none;background:transparent;white-space:nowrap;padding:13px 19px;font-size:17px;min-height:51px}.nav button:first-child{border-radius:27px 0 0 27px}.nav button:last-child{border-right:1px solid #e8e1d5;border-radius:0 27px 27px 0}.nav button[aria-current=page],.nav button:hover{background:var(--green);color:white}.nav .symbol{margin-right:7px}.hero{position:relative;min-height:440px;display:flex;align-items:center;background:linear-gradient(90deg,rgba(255,246,223,.97) 0%,rgba(255,244,215,.93) 24%,rgba(255,245,219,.65) 44%,rgba(255,244,214,.05) 75%),url('hero.jpg') center right/cover no-repeat;overflow:hidden}.hero-inner{max-width:1500px;margin:auto;width:100%;padding:58px clamp(22px,5vw,84px)}.hero h1{font-size:clamp(40px,5vw,75px);color:var(--dark);margin:0 0 6px;line-height:1.07}.hero .welcome{font-size:clamp(25px,3vw,44px);color:var(--dark);margin:0}.hero .tagline{font-size:clamp(18px,1.9vw,28px);margin:5px 0 25px}.ornament{max-width:455px;height:1px;background:var(--gold);margin:27px 0;position:relative}.ornament:after{content:'✥';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#f4e8ca;padding:0 12px;color:var(--gold);font-size:25px}.verse{font-size:clamp(18px,1.8vw,25px);font-style:italic;max-width:455px;line-height:1.45}.verse small{display:block;font-style:normal;font-size:.85em}.cta{background:var(--green);border:0;border-radius:28px;padding:14px 30px;color:white;font-size:22px;margin-top:19px;box-shadow:0 2px 6px #0002}.cta:hover{background:#086b4c}.tiles{max-width:1500px;margin:-1px auto 0;padding:20px 25px 28px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.tile{min-height:138px;padding:18px 6px 12px;border:1px solid var(--gold);border-radius:12px;background:linear-gradient(130deg,#fffdf8,#f4efe5);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .2s,box-shadow .2s}.tile:hover{transform:translateY(-3px);box-shadow:0 6px 18px #0001}.tile .ico{color:#987116;font-size:37px;line-height:1}.tile strong{font-size:20px}.tile span:last-child{font-size:15px}.content{max-width:1100px;margin:0 auto 55px;padding:28px 24px 45px}.content h2{color:var(--dark);font-size:37px;margin:0 0 14px}.content p{font-size:19px;line-height:1.65}.section-card{border:1px solid #dfd2b5;border-radius:14px;background:white;padding:27px;box-shadow:0 3px 15px #00000008}.section-card h3{font-size:26px;color:var(--green)}.section-card a{color:#066449}.quicklinks{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.quicklinks a,.outline{display:inline-block;border:1px solid var(--gold);background:white;padding:12px 18px;border-radius:20px;text-decoration:none}.quicklinks a:hover,.outline:hover{background:#f4e9d1}.muted{color:#5c685d}footer{background:var(--dark);color:#f6e4b9;text-align:center;padding:27px 18px;font-size:16px}.hidden{display:none!important}.section-hero{padding:45px 25px;background:linear-gradient(120deg,#063d2c,#0c5941);color:#fff;text-align:center}.section-hero h1{margin:0;font-size:clamp(36px,5vw,58px)}.section-hero p{margin:10px 0 0;font-size:20px;color:#e5d7ab}.back{border:0;background:none;color:#086444;text-decoration:underline;padding:0;margin-bottom:25px;font-size:17px}@media(max-width:1120px){.tiles{grid-template-columns:repeat(4,1fr)}.nav{justify-content:flex-start}.nav button{padding:11px 15px;font-size:15px}}@media(max-width:680px){.masthead{height:170px;background-size:auto 170px}.nav{padding:8px}.nav button{min-height:44px}.hero{min-height:475px;background-position:center right 25%;background-image:linear-gradient(90deg,rgba(255,246,223,.96),rgba(255,247,224,.81) 63%,rgba(255,247,224,.25)),url('hero.jpg')}.hero-inner{padding:35px 22px}.hero h1{font-size:43px}.hero .welcome{font-size:29px}.hero .tagline{font-size:19px}.tiles{grid-template-columns:repeat(2,1fr);padding:15px 12px;gap:9px}.tile{min-height:123px}.tile strong{font-size:18px}.tile span:last-child{font-size:13px}.content{padding:22px 15px}.content h2{font-size:28px}.verse{font-size:18px}.cta{font-size:19px}}
</style>
</head>
<body>
<header class="masthead" role="img" aria-label="ROMANO ISLAM: Kur’an, Kaba i romski točak"></header>
<div class="navwrap"><nav class="nav" aria-label="Glavni meni" id="navigation">
<button data-page="home" aria-current="page"><span class="symbol">⌂</span>Početna</button><button data-page="quran"><span class="symbol">▣</span>Kur’an</button><button data-page="tafsir"><span class="symbol">▤</span>Tefsir</button><button data-page="ehlibejt"><span class="symbol">♟</span>Ehli Bejt</button><button data-page="poslanici"><span class="symbol">♜</span>Poslanici</button><button data-page="historija"><span class="symbol">⌛</span>Historija</button><button data-page="vodici"><span class="symbol">☷</span>Vodiči</button><button data-page="preuzimanje"><span class="symbol">⇩</span>Preuzimanje</button><button data-page="onama"><span class="symbol">ⓘ</span>O nama</button>

<main id="homePage">
<section class="hero"><div class="hero-inner"><p class="welcome">Dobro došli na</p><h1>ROMANO ISLAM</h1><p class="tagline">Kur’an je naš vodič – znanje je naša snaga</p><div class="ornament"></div><div class="verse">„O vi koji vjerujete, bojte se Allaha i tražite sredstvo Njegovoj blizini.“<small>(El-Maide, 5:35 — prijevod dijela ajeta)</small></div><button class="cta" data-page="quran">▣ &nbsp;Čitaj Kur’an</button></div></section>
<section class="tiles" aria-label="Rubrike">
<button class="tile" data-page="quran"><span class="ico">▣</span><strong>Kur’an</strong><span>Čitaj, uči i istražuj</span></button><button class="tile" data-page="tafsir"><span class="ico">▤</span><strong>Tefsir</strong><span>Objašnjenje ajeta</span></button><button class="tile" data-page="ehlibejt"><span class="ico">♟</span><strong>Ehli Bejt</strong><span>Znanje i smjernice</span></button><button class="tile" data-page="poslanici"><span class="ico">♜</span><strong>Poslanici</strong><span>Životi i poruke</span></button><button class="tile" data-page="historija"><span class="ico">⌛</span><strong>Historija</strong><span>Događaji i pouke</span></button><button class="tile" data-page="vodici"><span class="ico">☷</span><strong>Vodiči</strong><span>Praktične smjernice</span></button><button class="tile" data-page="preuzimanje"><span class="ico">⇩</span><strong>Preuzimanje</strong><span>Knjige i materijali</span></button>
</section>
</main>
<main id="sectionPage" class="hidden"><div class="section-hero"><h1 id="sectionTitle">Kur’an</h1><p id="sectionSubtitle"></p></div><div class="content"><button class="back" data-page="home">← Povratak na početnu</button><div class="section-card" id="sectionBody"></div></div></main>
<footer>ROMANO ISLAM · Kur’an · Ilm · Historija · Vodiči</footer>
<script>
const sections={
quran:{title:'Kur’an',subtitle:'Čitaj, uči i istražuj',body:`<h3>Čitanje Kur’ana</h3><p>Ovdje ćemo postaviti čitanje Kur’ana s provjerenim arapskim tekstom, prijevodima i romskim jezikom. Tekst i prijevod bit će jasno odvojeni.</p><p class="muted">Interaktivni čitač je predviđen za sljedeću fazu. Ova verzija ne izmišlja niti automatski preuzima ajete.</p><div class="quicklinks"><a href="https://tanzil.net/" target="_blank" rel="noopener">Otvori arapski Kur’an (Tanzil)</a></div>`},
};
Object.assign(sections,{
  tafsir:{title:'Tefsir',subtitle:'Istraživanje značenja ajeta',body:'<h3>Tefsir</h3><p>Ovdje će se nalaziti proučavanje ajeta. Tačan kur’anski tekst, prijevod, jezičko objašnjenje i ljudsko tumačenje bit će odvojeni.</p><p class="muted">Sadržaj u pripremi.</p>'},
  ehlibejt:{title:'Ehli Bejt',subtitle:'Znanje i smjernice',body:'<h3>Ehli Bejt</h3><p>Prostor za tekstove, izvore i istraživanja o Ehli Bejtu, s jasnim označavanjem historijskih tvrdnji i izvora.</p><p class="muted">Sadržaj u pripremi.</p>'},
  poslanici:{title:'Poslanici',subtitle:'Životi i poruke',body:'<h3>Poslanici u Kur’anu</h3><p>Ovu rubriku ćemo graditi na provjerenim kur’anskim ajetima o poslanicima.</p><p class="muted">Sadržaj u pripremi.</p>'},
  historija:{title:'Historija',subtitle:'Događaji i pouke',body:'<h3>Historija</h3><p>Historijski događaji i izvori bit će prikazani kao historijska građa, a ne kao riječi Kur’ana.</p><p class="muted">Sadržaj u pripremi.</p>'},
  vodici:{title:'Vodiči',subtitle:'Praktične smjernice',body:'<h3>Vodiči</h3><p>Ovdje će biti vodiči za čitanje, učenje i istraživanje sadržaja stranice.</p><p class="muted">Sadržaj u pripremi.</p>'},
  preuzimanje:{title:'Preuzimanje',subtitle:'Knjige i materijali',body:'<h3>Biblioteka za preuzimanje</h3><p>Ovdje će biti dostupni materijali koje smijemo legalno objaviti i dijeliti.</p><p class="muted">Sadržaj u pripremi.</p>'},
  onama:{title:'O nama',subtitle:'O projektu ROMANO ISLAM',body:'<h3>ROMANO ISLAM</h3><p>Web-stranica posvećena učenju, čitanju i istraživanju Kur’ana, te pažljivom razlikovanju kur’anskog teksta od prijevoda, tumačenja i historijskih izvora.</p>'}
});
function go(page){if(page!=='home'&&!sections[page])return;const home=page==='home';document.getElementById('homePage').classList.toggle('hidden',!home);document.getElementById('sectionPage').classList.toggle('hidden',home);document.querySelectorAll('[data-page]').forEach(el=>{if(el.closest('#navigation')){if(el.dataset.page===page)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')}});if(!home){const s=sections[page];document.getElementById('sectionTitle').textContent=s.title;document.getElementById('sectionSubtitle').textContent=s.subtitle;document.getElementById('sectionBody').innerHTML=s.body}history.replaceState(null,'','#'+page);window.scrollTo({top:0,behavior:'smooth'})}document.addEventListener('click',e=>{const el=e.target.closest('[data-page]');if(el)go(el.dataset.page)});const start=location.hash.slice(1);if(start&&start!=='home'&&sections[start])go(start);
</script>
</body></html>
